notes: "Weekly improvement review (unattended, read-only token): committed locally, no\npush,\
  \ no write API calls. Side effects requested through .run/manifest.yaml:\nfour new issues,\
  \ two labeled improvement and two plain. No issue closes, no\nimprovement PRs. Window 2026-07-20..2026-07-26,\
  \ seven run-log days since the\n2026-07-19 marker. First marker written by `make weekly-stats`\
  \ with a\n`mechanical` block, so `previous_interest_signal` is null and no drift diff is\n\
  possible this week.\n\nProposals, four. Two on the improvement path with whitelist diffs,\
  \ two plain\nbecause the fix is outside the whitelist.\n\n1. Books scrape gap (improvement).\
  \ `mechanical.sections.Books` is\n   `days_present: 0`, `max_empty_streak: 7`, flagged.\
  \ Counting `###` blocks\n   under `## Books` across the published digests, the last Books\
  \ story is\n   2026-06-24: 32 consecutive digests with none. Cause is mechanical, not\n\
  \   editorial. Every book item in the window came from one publisher\n   (snapshots/books/\
  \ 2026-07-22..07-25 hold 24, 28, 27, 25 items, all Springer\n   Computer Science; .cache/books/2026-07-26.json\
  \ holds 20, all Springer), and\n   the Springer feed is overwhelmingly LNCS conference proceedings,\
  \ which the\n   selection rules exclude. The two trade feeds are reachable but outside the\n\
  \   7-day window: probed 2026-07-26, nostarch.com/rss.xml is HTTP 200 with 10\n   items\
  \ whose newest pubDate is 2026-03-02 (a blog feed, ~5 months stale), and\n   pragprog.com/rss.xml\
  \ is HTTP 200 with 100 items whose newest is 2026-07-10,\n   16 days old. `degraded: []`\
  \ every run, so nothing reports it. Proposed\n   `[books].window_days` 7 -> 30 in routine/config.toml.\n\
  \n2. Kagi exploration slot (improvement, exploratory). The window's one\n   exploratory\
  \ proposal, from `mechanical.recurring_candidates.keywords.kagi`\n   (2026-07-20, 07-22,\
  \ 07-23), a term no query covers. Two distinct stories,\n   not one resurfacing: HN 48970894\
  \ \"Orion Browser by Kagi\" (268 pts) and HN\n   49006195 \"Back to Kagi\" (155 -> 263 pts).\
  \ Neither published. Marginal on\n   scope (Orion is Apple-platforms adjacent, the other\
  \ is closer to consumer\n   search), which is why it is exploratory with a 2026-08-23 removal\
  \ check.\n\n3. Algolia query-match pollution (plain, no label). The fix is in\n   swe_digest.fetch.hn,\
  \ outside the improvement whitelist, so it cannot carry a\n   whitelist diff. On the `algolia`\
  \ backend (all 7 window days) query results\n   are stored verbatim with no filter back\
  \ against the term, while the degraded\n   `title-match` path applies a strict word-boundary\
  \ regex. Resolving every\n   matched_ids entry against snapshots/hn/ titles and URLs, matches\
  \ whose term\n   appears in neither title nor URL run 39% to 53% per day (240/114, 267/107,\n\
  \   285/112, 276/117, 563/262, 509/260, 263/139 for 07-20..07-26). Worst terms:\n   0day\
  \ 47/49, GCP 46/47, Xcode 46/47, npm 44/50, CRDT 41/42, Raft 41/45, IPO\n   41/50, Vim 40/44.\
  \ On 2026-07-25 the `Vim` query's 10 matches include\n   \"SpaceX Starship Flight 13 livestream\"\
  \ and \"SANA-Video 2.0\".\n\n4. Reddit blocked source (plain, no label). Per output 4, and\
  \ no open issue\n   covers it (#46 closed 2026-07-19, #23 closed 2026-07-06). Degraded all\
  \ seven\n   days from the datacenter IP: HTTP 429 after the first few subreddits on both\n\
  \   www.reddit.com and old.reddit.com RSS. Live coverage 5/28+3/28 (07-20),\n   exit 1 (07-21),\
  \ ~4/28 (07-22), 4/28 then ~10/28 pooled (07-23), 5/28+3/28\n   (07-24), 14/28 then 17/28\
  \ pooled (07-25), 8/28 against a day floor of 14\n   (07-26). The fallback works and Sources\
  \ checked discloses it each day; the\n   issue exists so access is investigated from another\
  \ network.\n\nNO watchlist prune this week, and the usual evidence for one is unusable.\n\
  `dead_queries` lists only `Neovim` (0 matches over 7 days, a genuinely quiet\nproject),\
  \ while `CRDT` recorded 42 matches of which 41 are off-topic, roughly\none real hit, and\
  \ never appears as dead. The prune signal is inverted by\nfinding 3 above, so neither `dead_queries`\
  \ nor the 20-term\n`matched_never_published` list was acted on.\n\nNO interest-drift proposal.\
  \ GitHub account signal re-derived read-only and\nbounded (6 public repos, 100 most recent\
  \ of 722 stars, 31 follows). Languages\nRust 33, Python 17, TypeScript 13, Go 8, C 6, Shell\
  \ 5, Lua 5, C++ 3, Swift 2,\nJava 2, Zig 2. Topics rust 20, cli 11, ai 10, terminal 9, neovim\
  \ 7, llm 7,\nmacos 6, ai-agents 6, claude-code 5, mcp 4, tmux 4, wasm 4, dotfiles 3. Orgs\n\
  folke 3, spring-projects 2, antirez 2, ghostty-org 2, open-feature 2. Every\nrecurring topic\
  \ is already covered by routine/watchlist.toml and\nmemory/profile.md. Recorded as `interest_signal`;\
  \ drift needs three consecutive\nmarkers and this is the first, so no proposal is possible\
  \ regardless.\n\nNO feedback this window. `mechanical.feedback` tallies five issues (#10,\
  \ #14,\n#15, #16, #20) but all are owner-authored, all closed, and all created in June,\n\
  before the window; the tally is all-time, not window-scoped. The most recent\n(#20) was\
  \ reviewed and closed in the 2026-06-28 marker. feedback_reviewed is\nempty and nothing\
  \ was closed.\n\nPast-improvement verification. Two improvement PRs merged 14 or more days\
  \ ago.\n#19 (improvement #17, merged 2026-06-21, forbid duplicate story blocks): the\ngate\
  \ is live and `make check-content` passes on 46 digests, prediction met, no\nrollback. #21\
  \ (merged 2026-06-24, tightened event and book curation): it\npredates the Expected-effect\
  \ body shape and records no rollback line. Its\ndiff touched only CLAUDE.md, docs/routine.md,\
  \ and scripts/fetch_events.py, so\nit never changed the books window. It is not the cause\
  \ of the Books streak and\nno rollback is proposed; proposal 1 addresses the mechanical\
  \ cause instead.\n\nThree flagged sections were checked and rejected as measurement artifacts\n\
  rather than gaps. `Sources checked` shows `days_present: 0` and a 7-day empty\nstreak, but\
  \ it is present in all seven digests: it is a prose list with no\n`###` blocks, and the\
  \ section counter counts story blocks. `Outages` shows a\n5-day streak, but the anchor rule\
  \ has it state \"No major items found.\" with no\nstory block on a quiet day. `Infrastructure`\
  \ shows a 5-day streak while\ninfrastructure stories ran in Top stories, which is canonical\
  \ placement, and\nthe counter does not credit the topical section for them. Only `Books`\
  \ is a\nreal gap. Not proposed, because the counter lives in\nswe_digest.digest.weekly_stats,\
  \ outside the improvement whitelist.\n\n`status_outcomes` reports developing 0/37 confirmed,\
  \ rate 0.0. Read as a\nmeasurement floor, not a quality signal: a resolution is counted\
  \ only when a\nlater dated digest resolves the same primary URL or a close title to\n`confirmed`,\
  \ and this routine resolves follow-ups under a new title in\n`Watchlist follow-ups` (memory/followups.md\
  \ shows several, for example the\nAzure West US PIR and the open-weight letter signatory\
  \ list). Same-date\nin-place upgrades are invisible by design. Noted, not proposed.\n\n\
  Memory compaction. followups.md 134589 B / 97 entries -> 100119 B / 64 entries,\nagainst\
  \ bounds of 180224 B and 130 entries. At the measured 5050 B/day this\nmoves byte headroom\
  \ from about 9 days to about 16. Removed 33 entries, all\nretained in the dated digests\
  \ and git history: one duplicate (2026-07-12 \"Grok\nBuild CLI reported to upload full repo\
  \ and secrets to xAI\", the same story as\nthe fuller 2026-07-13 entry); the oldest entry\
  \ (2026-06-15 curl report-handling\npause, 41 days and 4 from the age gate, whose 2026-08-03\
  \ resume date is held in\nthe curl entity); items whose watch is slow release tracking better\
  \ held in\nentities.md (Zig build-system split, FFmpeg AAC encoder, Podman 6.0.0, Godot\n\
  policy, Android Developer Verification); patched or resolved items (Rust\n1.96.1, Guix,\
  \ Rust coreutils cp, JetBrains TeamCity, Zimbra, RoguePlanet,\nAdobe ColdFusion, LaunchDarkly\
  \ outage); kernel and OS CVEs whose only remaining\nwatch is routine backport tracking (GhostLock,\
  \ Bad Epoll, Januscape, OpenBSD\nsysv_sem); items with no remaining future signal (YouTube\
  \ Ask Studio, Google\ndeclined to fix; Tenda, vendor unreachable; Motorola MR2600, no vendor\
  \ owner);\nand vendor-claim items whose watch was an independent reproduction that never\n\
  came (GPT-5.5 Codex token clustering, two model generations stale; Meta Muse\nSpark; Mistral\
  \ Robostral; Cloudflare Meerkat; Cognition SWE-1.7; Bonsai 27B;\nZCode; Cloudflare x402;\
  \ Zuckerberg town hall; Ill Bloom; Chromium Math.tanh).\nentities.md 67415 B / 112 entries\
  \ -> 66936 B / 108 entries: dropped three\ndormant entries (Devin Desktop and Microsoft\
  \ AI, both last seen 2026-06-02;\nBoston Dynamics / Hyundai, robotics and marginal here)\
  \ and folded the standalone\nAnysphere bullet into the Cursor and GitHub Copilot entry it\
  \ duplicated.\nsource-reliability.md (16923 B / 60 entries) and access-notes.md (13977 B\
  \ /\n40 entries) stay bounded, no change. The memory gate reports zero errors and\nzero\
  \ staleness warnings.\n"
