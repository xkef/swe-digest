    Security stated No major items found.
    Azure West US outage placed canonically in Top stories with an Outages pointer
    (2026-07-17 precedent).
    Lead editorial call: framed the open-weights policy fight around the new
    OpenAI/Anthropic pro-restriction lobbying (Axios/CNBC) rather than re-leading
    the 2026-07-23 Little Tech letter.
    Yesterday's backtest (2026-07-23) was already seeded and reviewed; defaults
    held (high-point misses were non-engineering or already-covered themes), no
    watchlist_gap promotions.
    Update run (11:28 UTC): kept all existing stories, added two genuinely new
    items surfaced since the 05:03 publish. FLUX 3 (Black Forest Labs, 2026-07-23
    early access, bfl.ai verified) added as a new AI section (developing, weights
    not yet released, vendor preference benchmarks only). Added a Hacker News
    section with the Namecheap account-handoff Tell HN (49028037, 440 pts,
    registrar account-takeover concern). Considered but dropped the "I regret
    migrating to Codeberg" thread (49021856, 350 pts): a bare HN item URL cannot
    be the primary for two blocks (normalize_url strips the query, so both HN
    primaries collide), the post is a largely-rebutted opinion piece, and the
    Codeberg governance theme is already tracked in followups; kept the stronger
    Namecheap item. source_count 17 to 20. Considered and skipped: a same-day
    Microsoft 365 Teams/SharePoint
    outage (likely downstream of the already-covered Azure West US incident, low
    HN signal); "Kimi K3 found 19 0days in Redis 8.8.0" (single tweet + a PoC
    repo, unverified, Redis 8.8.0 not confirmed as a real version); the Echo Show
    HN (launch page, no benchmarks, HN dismissive). Inboxes rechecked empty.
    Reddit: live fetch still HTTP 429-limited this run (background retry did not
    complete a clean pull); first-run degraded coverage carried in Sources
