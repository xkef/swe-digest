new_issues_requested:
- '[improvement] Widen the books fetch window so non-proceedings publishers are visible'
- '[improvement] Exploratory: add a Kagi Hacker News query'
- Algolia-backed query matches are about half off-topic, corrupting dead_queries and the backtest floor
