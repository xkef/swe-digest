[project]
name = "swe-digest"
version = "2.0.0"
description = "A small, auditable daily software engineering digest"
license = "MIT"
requires-python = ">=3.14"
# Installed by the publish job too, which holds the write token, so each one is
# a decision. PyYAML reads and writes every data file. feedparser reads RSS and
# Atom in every dialect the watchlist serves.
dependencies = [
  "pyyaml>=6.0.3",
  "feedparser>=6.0.14",
]

[project.optional-dependencies]
# Only the agent job installs the SDK. It resolves to 30-odd packages, none of
# which belong in the job that holds the write token. Only digest.agent imports
# it, and a test checks that the publish path never loads it.
agent = [
  "claude-agent-sdk>=0.2.137,<0.3",
]

[project.scripts]
swe-digest = "digest.cli:main"

[project.urls]
Repository = "https://github.com/xkef/swe-digest"
Site = "https://xkef.github.io/swe-digest/"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=2.3.0",
  "ruff>=0.16.3",
  "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "digest"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF029"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

# feedparser ships no stubs.
[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
