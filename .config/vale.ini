# Prose lint for every hand-written Markdown file: the Google developer
# documentation style, plus ai-tells for the patterns that mark machine-written
# text. Both packages are pinned by release URL. `vale sync` downloads them into
# .config/vale/, where only the project vocabulary is tracked.
StylesPath = vale
# Suggestions (passive voice, contractions, acronyms) stay out of CI. Run
# `vale --minAlertLevel suggestion` to see them.
MinAlertLevel = warning
Vocab = Digest

Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, Google, ai-tells

# A proper noun after a colon is common here, as in "Sources: Hacker News".
Google.Colons = NO
ai-tells.ColonUsage = NO
# A story is the digest's unit of content, not a figure of speech.
ai-tells.FigurativeNouns = NO

# The weekly run rewrites the profile, which is mostly product names and
# acronyms. A spelling check there fails each new term the run adds.
[agent/config/profile.md]
BasedOnStyles = Google, ai-tells
