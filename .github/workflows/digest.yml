name: Digest

# Five daily runs and one weekly improvement run.
#
#   agent job (read-only token)          publish job (write token)
#   collect, ask the model, write   ──>  check every file, commit data/ to main,
#   upload the changed files             open a pull request for agent/config/
#
# The agent job cannot push. The publish job runs only code from main and
# trusts nothing in the uploaded files until agent/src/digest/publish.py
# checks them. Every step runs through a mise task.
#
# GitHub delays scheduled runs by up to two hours, so the first run starts at
# 01:30 UTC to land the morning digest before 06:00 in Zurich.
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 5 * * *"
    - cron: "30 9 * * *"
    - cron: "30 13 * * *"
    - cron: "30 17 * * *"
    - cron: "15 7 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Which run
        type: choice
        options: [daily, improve]
        default: daily

permissions: {}

# The repository's own mise.toml defines the tasks every step runs.
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      day: ${{ steps.day.outputs.day }}
      changed: ${{ steps.export.outputs.changed }}
    env:
      MODE: ${{ (github.event.schedule == '15 7 * * 0' || inputs.mode == 'improve') && 'improve' || 'daily' }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: python uv
          cache: true
      - name: Install dependencies
        run: mise run install:agent
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # CLAUDE_CODE_OAUTH_TOKEN bills the Claude subscription, not the API.
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: mise run "$MODE" --day "${{ steps.day.outputs.day }}"

      # Runs even when the run failed, because a failed run still writes its
      # run record, and that record is how a failure gets reviewed.
      - name: Export changed files
        id: export
        if: always()
        run: |
          mkdir -p .run/out
          git ls-files -z --modified --others --exclude-standard -- data agent/config |
            xargs -0 -r cp --parents -t .run/out
          if [ -n "$(ls -A .run/out)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.export.outputs.changed == 'true'
        with:
          name: run
          path: .run/out/

  publish:
    needs: agent
    if: ${{ !cancelled() && needs.agent.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: this job holds the write token and must not restore a cache
      # the agent job could have written.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python uv
          cache: false
      - name: Install dependencies
        run: mise run install:base
      # Outside the checkout, so the uploaded files cannot shadow repository code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: run
          path: ${{ runner.temp }}/out
      - name: Check and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run publish "$RUNNER_TEMP/out" --day "${{ needs.agent.outputs.day }}"
