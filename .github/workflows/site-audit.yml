name: Site audit

# Post-deploy Lighthouse audit of the live site, asserting a perfect score
# in every category, plus a weekly lychee sweep for dead links across the
# digest archive. Failures surface through the failure-alert scheduled
# scan, which covers every non-PR workflow.

on:
  workflow_run:
    workflows: [Deploy Pages]
    types: [completed]
  schedule:
    - cron: "15 11 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3 runs per URL: the first page audited in a session pays one-time
      # browser cold-start costs (observed as a 0.85 performance score from
      # ICU init and runner contention under CPU throttling), so a single
      # run cannot hold a minScore of 1.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          runs: 3
          urls: |
            https://xkef.github.io/swe-digest/
            https://xkef.github.io/swe-digest/digests/
          configPath: .github/lighthouserc.json
          uploadArtifacts: true

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 401/403/429/503 are accepted: paywalled or bot-gated sites (Reuters,
      # WSJ, Reddit) and rate limiters (Hacker News) return these to
      # datacenter IPs while serving readers fine. The excluded hosts block
      # CI at the TLS or connection level, so no status code is available to
      # accept. Known-dead links are recorded in .lycheeignore.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200..=206,401,403,429,503
            --exclude "washingtonpost\.com"
            --exclude "helpx\.adobe\.com"
            --exclude "investors\.broadcom\.com"
            --exclude "writings\.stephenwolfram\.com"
            --exclude "windowsnews\.ai"
            "site/content/digests/**/*.md"
