name: Site audit

# Post-deploy Lighthouse audit of the live site, asserting a perfect score
# in every category. Failures surface through the failure-alert scheduled
# scan, which covers every non-PR workflow.

on:
  workflow_run:
    workflows: [Deploy Pages]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3 runs per URL: the first page audited in a session pays one-time
      # browser cold-start costs (observed as a 0.85 performance score from
      # ICU init and runner contention under CPU throttling), so a single
      # run cannot hold a minScore of 1.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          runs: 3
          urls: |
            https://xkef.github.io/swe-digest/
            https://xkef.github.io/swe-digest/digests/
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
