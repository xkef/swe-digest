name: CI

# Lint, types, tests, the site build, and formatting, on every pull request
# and push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv
          cache: true
      - name: Lint and type check
        run: mise run ci:lint
      - name: Tests
        run: mise run test

      # A Renovate bump of one pin can contradict another package's peer
      # pin. Without this step the first failure is the scheduled run.
      - name: Agent requirements resolve
        working-directory: agent
        run: uv pip install --dry-run --require-hashes -r requirements/agent.txt

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv zola github:Pagefind/pagefind
          cache: true
      - name: Install dependencies
        run: mise run install:base
      - name: Check and build the site
        run: mise run build

  # The signals Worker: generated types, the type check, and its tests in
  # workerd.
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node
          cache: true
      - name: Types and tests
        run: mise run ci:worker

  # Formatting drift and prose lint in owner-edited files. Tool versions are pinned in
  # .mise/config.toml, so this job and a local `mise run ci:format` agree.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv dprint rumdl vale
          cache: true
      - name: Check formatting
        run: mise run ci:format
      - name: Lint prose
        run: mise run ci:prose
