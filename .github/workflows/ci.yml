name: CI

# Lint, types, tests, the site build, and formatting, on every pull request
# and push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: python uv
          cache: true
      - name: Sync environment
        run: mise run deps:setup
      - name: Lint and type check
        run: mise run dev:lint
      - name: Tests
        run: mise run dev:test

      # A Renovate bump of one pin can contradict another package's peer
      # pin. Without this step the first failure is the scheduled run.
      - name: Agent requirements resolve
        working-directory: agent
        run: uv pip install --dry-run --require-hashes -r requirements/agent.txt

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: python uv zola github:Pagefind/pagefind
          cache: true
      - name: Install dependencies
        run: mise run deps:base
      - name: Check and build the site
        run: mise run site:build

  # Formatting drift and prose lint in owner-edited files. Tool versions are pinned in
  # mise.toml, so this job and a local `mise run dev:fmt-check` agree.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: python uv dprint rumdl vale
          cache: true
      - name: Check formatting
        run: mise run dev:fmt-check
      - name: Lint prose
        run: mise run dev:prose
