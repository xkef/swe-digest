name: CI

# Validates the Python package (lint, format, types, tests with the gate
# coverage floor), the full site build, and Markdown/TOML/JSON formatting on
# every PR and push to main. Snapshot data commits skip CI: they are
# bot-authored JSON validated by the snapshot pipeline itself.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/snapshots/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Sync environment
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      # AGENTS.md says the layer direction is a CI failure rather than a review
      # comment. It was neither until now: the contracts existed and nothing ran
      # them outside a developer's own `make imports`.
      - name: Import contract
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest

      # requirements-agent.txt is a flat pinned file, so a dependabot bump of
      # one transitive pin can contradict another package's exact peer pin and
      # still look green. Nothing else in CI installs it; the first failure
      # would otherwise be the unattended digest run.
      - name: Agent requirements resolve
        run: python3 -m pip install --dry-run --require-hashes -r requirements/agent.txt

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Install Python deps
        run: python3 -m pip install --require-hashes -r requirements/base.txt
      - name: Build and check site
        run: make check

  # Formatting drift check for owner-edited files (config, prompts, memory,
  # README). dprint and rumdl both exclude site/content/ and snapshots/, and
  # both tool versions are pinned in the Makefile, so this job and
  # `make fmt-check` locally always agree. It reports drift; the publish gate
  # (`make check`) stays formatting-free so unattended runs are never blocked
  # on it.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Check formatting
        run: make fmt-check
