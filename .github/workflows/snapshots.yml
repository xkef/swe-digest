name: Snapshots

# Background accumulator for every fetched source, one job with a step per
# source. Each run merges its fetch into the day's snapshots/ file by item id, so
# coverage builds up across the day and survives a digest run whose live
# fetch is degraded. It only collects; the digest and weekly workflows run on
# their own schedules and fetch live.
#
# Fetch steps are continue-on-error: one source failing (or being blocked)
# never stops the others, and the final step fails the run afterwards so
# failure-alert still fires.
#
# One cron drives every source so a round is one run and one commit. Per-source
# cadence comes from the round's 3-hour slot instead of from its own cron entry;
# workflow_dispatch runs every source.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: snapshots

jobs:
  snapshot:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Every step timeout below plus the merge, since a 6-hour slot runs the
    # slow reddit fetch alongside the others in the same job.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The package requires Python 3.14 (`requires-python` in
      # agent/pyproject.toml), which the runner's stock python3 is not: this job
      # ran install-free until the package started using 3.14 syntax, and then
      # every step failed at import with a SyntaxError. mise.toml stays the one
      # place the version is written.
      #
      # `install_args: python` because this job only fetches and commits; zola,
      # pagefind, and uv are dead weight in a round that runs every three hours.
      #
      # cache disabled: this contents:write job must not restore a tool cache
      # the untrusted agent job could have poisoned on the shared main scope.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          install_args: python
          cache: false
      - name: Install Python deps
        run: python3 -m pip install --require-hashes -r agent/requirements.txt
      - name: Plan the round
        id: round
        env:
          EVERY_SOURCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # The slot is the last 3-hour boundary at or before now, not the
          # current hour, so a schedule delayed past the hour still fetches
          # what its round owes.
          hour=$(date -u +%-H)
          slot=$((hour - hour % 3))
          due() {
            if [ "$EVERY_SOURCE" = true ] || [ $((slot % $1)) -eq 0 ]; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "hn=$(due 3)"
            echo "youtube=$(due 6)"
            echo "papers=$(due 6)"
            echo "reddit=$(due 6)"
            echo "books=$(due 12)"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch hn
        id: fetch-hn
        if: steps.round.outputs.hn == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: PYTHONPATH=agent/src python3 -m swe_digest fetch hn
      - name: Fetch youtube
        id: fetch-youtube
        if: steps.round.outputs.youtube == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: PYTHONPATH=agent/src python3 -m swe_digest fetch youtube
      - name: Fetch papers
        id: fetch-papers
        if: steps.round.outputs.papers == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: PYTHONPATH=agent/src python3 -m swe_digest fetch papers
      - name: Fetch books
        id: fetch-books
        if: steps.round.outputs.books == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: PYTHONPATH=agent/src python3 -m swe_digest fetch books
      - name: Fetch reddit
        id: fetch-reddit
        if: steps.round.outputs.reddit == 'true'
        continue-on-error: true
        # Sequential and rate-limit-spaced (about 7s per request) across ~28
        # subreddits and two listings, so it needs far more headroom than the
        # parallel fetchers, twice over when the www backend fails and the
        # old.reddit pass runs too.
        timeout-minutes: 15
        run: PYTHONPATH=agent/src python3 -m swe_digest fetch reddit
      - name: Merge and commit snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          HN_OK: ${{ steps.fetch-hn.outcome == 'success' }}
          YT_OK: ${{ steps.fetch-youtube.outcome == 'success' }}
          PAPERS_OK: ${{ steps.fetch-papers.outcome == 'success' }}
          BOOKS_OK: ${{ steps.fetch-books.outcome == 'success' }}
        run: |
          day=$(date -u +%F)
          now=$(date -u +%H:%MZ)
          kinds=""
          merge() { # merge <kind> <dir>: merge today's fetch, prune to 7 days, stage
            PYTHONPATH=agent/src python3 -m swe_digest merge "$1" ".cache/$1/$day.json" "$2/$day.json"
            ls "$2"/*.json | sort | head -n -7 | xargs -r git rm -q --
            git add "$2/$day.json"
            kinds="${kinds:+$kinds, }$1"
          }
          if [ "$HN_OK" = "true" ]; then merge hn snapshots/hn; fi
          if [ "$YT_OK" = "true" ]; then merge yt snapshots/youtube; fi
          if [ "$PAPERS_OK" = "true" ]; then merge papers snapshots/papers; fi
          if [ "$BOOKS_OK" = "true" ]; then merge books snapshots/books; fi
          # Reddit rate-limits runner IPs to a few requests, so the fetcher
          # exits nonzero on partial coverage while still writing what it
          # got. Merge whenever a cache file exists: accumulating partial
          # fetches by post id is how coverage builds up across runs.
          if [ -f ".cache/reddit/$day.json" ]; then merge reddit snapshots/reddit; fi
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          staged=$(git diff --cached --name-only)
          if printf '%s\n' "$staged" | grep -qvE '^snapshots/(hn|youtube|papers|books|reddit)/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'; then
            echo "refusing: staged paths outside the snapshot directories"; exit 1
          fi
          PYTHONPATH=agent/src python3 -m swe_digest commit-snapshot "chore: ${kinds} snapshots for $day $now"
      - name: Fail on degraded fetches
        # After the merge, so a partial failure still commits what succeeded
        # but the run reports failure and failure-alert fires. Reddit is
        # deliberately absent: partial coverage is its steady state from
        # runner IPs (unauthenticated rate limiting), the partial fetches
        # still merge above, and the digest run surfaces the degradation in
        # Sources checked instead of alerting four times a day.
        if: >-
          steps.fetch-hn.outcome == 'failure' ||
          steps.fetch-youtube.outcome == 'failure' ||
          steps.fetch-papers.outcome == 'failure' ||
          steps.fetch-books.outcome == 'failure'
        run: |
          echo "one or more fetches failed; see the fetch steps above"
          exit 1
