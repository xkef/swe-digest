name: Site

# Build, deploy, and audit the published site. Merges the former pages.yml and
# site-audit.yml.
#
# The audit used to find its target with `workflow_run: [Deploy Pages]`, which
# meant renaming the deploy workflow silently stopped it running. As a
# `needs: deploy` job the coupling is structural and cannot drift.
#
# `workflow_dispatch` is load-bearing: the publish job in digest.yml pushes with
# GITHUB_TOKEN, and GitHub suppresses the `push` trigger for those, so the
# dispatch is the only thing that rebuilds the site after a digest is published.
#
# It carries the commit to build rather than letting GitHub re-resolve the
# branch. On 2026-07-28 the dispatch landed 1.6s after the push and resolved
# `main` to the commit *before* the digest: the run went green, Pages deployed,
# and the published site was a day stale with nothing failing. A dispatch names
# the tree it means, so the deploy cannot race the ref that triggered it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/snapshots/**"
      - "data/runs/**"
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to build. Defaults to the branch head.
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          # Full history so the target can be proven to be on main.
          fetch-depth: 0
          persist-credentials: false
      # The input names a commit, and this job holds pages:write, so the commit
      # has to be one main already carries. A push event satisfies this by
      # construction; a dispatch is checked rather than trusted.
      - name: Verify the build target is on main
        run: |
          git rev-parse --verify origin/main >/dev/null ||
            { echo "origin/main not fetched; cannot prove the target is on main"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "refusing to build $(git rev-parse HEAD): not on main"; exit 1; }
      # cache disabled: this pages:write / id-token:write job must not restore
      # a tool cache the untrusted agent job could have poisoned.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false
      - name: Install Python deps
        run: python3 -m pip install --require-hashes -r requirements/base.txt
      - name: Validate content
        run: make check-content
      - name: Build
        run: make build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Pages intermittently rejects a deployment server-side with a generic
      # "try again later" while a rerun of the same artifact succeeds, so one
      # delayed retry absorbs the flake.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Lighthouse against the live site, asserting a perfect score in every
  # category. Failures surface through the ops scheduled scan.
  audit:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3 runs per URL: the first page audited in a session pays one-time
      # browser cold-start costs (observed as a 0.85 performance score from
      # ICU init and runner contention under CPU throttling), so a single
      # run cannot hold a minScore of 1.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          runs: 3
          urls: |
            https://xkef.github.io/swe-digest/
            https://xkef.github.io/swe-digest/digests/
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
