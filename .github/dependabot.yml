version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # requirements/: the hash-pinned installs the unattended jobs use, agent.txt
  # for the SDK harness and base.txt for the publish gate. The lockfile above
  # does not cover either.
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
