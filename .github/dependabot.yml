version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/agent"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # agent/requirements-agent.txt: the hash-pinned SDK install the unattended
  # agent job uses. The lockfile above does not cover it.
  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
