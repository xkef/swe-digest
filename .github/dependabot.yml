version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/agent"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # The hash-pinned installs the scheduled jobs use: agent.txt for the agent
  # job, base.txt for the publish and site jobs. The lockfile above does not
  # cover either.
  - package-ecosystem: "pip"
    directory: "/agent/requirements"
    schedule:
      interval: "weekly"
