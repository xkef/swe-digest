# The agent reads this file directly. site:build generates site/zola.toml
# from it, and the signals Worker's npm scripts pass its values to wrangler.
#
# A run may change only `watchlist` and `profile`, through a pull request.
# The publish gate refuses any other change to this file.

site:
  url: https://xkef.github.io/swe-digest/
  title: SWE Digest
  description: >-
    Daily software engineering digest with links, context, and follow-up
    memory.
  author: xkef
# The GitHub repository as owner/name.
repository: xkef/swe-digest

# The Worker in signals/ that holds readers' story requests and feedback.
# Leave url empty to run without it. The Access application guards /enroll.
# Its team domain and AUD are public identifiers from the Zero Trust
# dashboard. Empty values turn enrollment off.
signals:
  url: https://swe-digest-signals.git-f57.workers.dev
  access_team_domain: https://patient-sun-0a4e.cloudflareaccess.com
  access_aud: 7240c81d2b8f66d17372b09477b647f370e4b22f9fd2031d7e3ae5fca54cbe63

# Who pays for the model: subscription, through CLAUDE_CODE_OAUTH_TOKEN, or
# api, through ANTHROPIC_API_KEY. See agent/src/digest/agent.py.
billing: subscription

# Tunables for a run. The tool grant lives in agent/src/digest/agent.py.
settings:
  model: claude-opus-5-5
  # Opus 5.5's default, set here so a model change cannot move it silently.
  effort: medium
  max_turns: 60

  # How far back each run collects.
  window_hours: 24
  # How far back a story counts as already published.
  archive_days: 14
  # Characters of a fetched page the model reads.
  fetch_max_chars: 20000
  # Characters of a video transcript the model reads. Speech runs near 1,050
  # characters a minute, so this covers a one-hour talk.
  transcript_max_chars: 70000

  # A digest is a bounded page, not a feed.
  # Security counts toward the day, so 30 leaves 25 for the other sections.
  max_stories: 30
  max_section_stories: 4
  # Sections whose cap differs from max_section_stories. Security keeps only
  # the advisories that matter most to the reader.
  section_caps:
    Top stories: 5
    Security: 5
  # A heavy incident day is what the reader came for.
  uncapped_sections: [Outages]
  # Sections that keep their section cap but do not count toward max_stories,
  # so a new talk or a community thread never displaces the day's news.
  unbudgeted_sections: [Talks, Videos, Hacker News, Reddit and social pulse]

  followup_max_age_days: 45
  max_open_followups: 60

  # The card text on every day page.
  blurb_chars: [100, 145]

  sections:
    - Top stories
    - Security
    - Outages
    - AI
    - Agentic coding
    - ML research
    - Developer tools
    - Languages and runtimes
    - Linux and kernel
    - Apple platforms
    - Infrastructure
    - Engineering posts
    - Markets and companies
    - Books
    - Talks
    - Videos
    - Hacker News
    - Reddit and social pulse

  categories:
    - AI
    - ML research
    - Agentic coding
    - Security
    - Outage
    - Dev tools
    - Languages
    - Apple
    - Linux/Kernel
    - Infrastructure
    - Engineering post
    - Event
    - Book
    - Paper
    - Video
    - Markets
    - Pulse

