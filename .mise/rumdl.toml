# rumdl owns Markdown; dprint owns everything else (TOML, JSON, YAML, CSS,
# HTML, JS).
#
# Two formatters, on purpose. dprint's Markdown plugin normalizes inline
# syntax, which rewrites prose: it turns `~3x` into `~~3x` (strikethrough) and
# `@__name__` into `@**name**`. rumdl lints instead of normalizing.
#
# `data/` is excluded whole, because the code that writes it owns its form. The
# generated Zola trees under `site/` are excluded for the same reason.
[global]
respect_gitignore = true
exclude = [
  "data",
  "site/content",
  "site/data",
  "dist",
  "site/public",
  ".run",
  ".claude-notes",
]

# Every Markdown file rumdl sees is prose a person reads in a diff, so
# `mise run dev:fmt` rewraps paragraphs at 80 columns. Code blocks and tables keep
# their lines.
[MD013]
reflow = true

# Tables are padded so their columns line up in plain text.
[MD060]
enabled = true
style = "aligned"
