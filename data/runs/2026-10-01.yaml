    titles:
    - Apple patched an exploited CoreGraphics bug, researchers published the PDF font path (CVE-2026-86950)
    - Reddit ends RSS on 2026-11-13 and shuts its public API in March 2027
    - Claude Cowork removes the local-only option for Pro and Max on 2026-10-06
    - Anthropic IPO prospectus reports a $42B 2025 loss and $518B of compute obligations
    - FTC confirms an investigation into OpenAI, Anthropic, and other AI companies over product risk
    - Matthew Green on whether sandboxing can contain rogue agents
    - OpenSSL advisory covers nine issues, one High severity DTLS heap disclosure
    - TanStack Start patches a critical reflected XSS in server functions (CVE-2026-102989)
    - Cloudflare commits to post-quantum Merkle Tree TLS certificates, first issuance targeted for Q1
      2027
    - Hetzner vSwitch packet loss broke private networking and load balancer targets for hours
    - Gitea 28.0.0 drops the 1.x prefix and adds audit logging, bot accounts, and deploy tokens
    - OpenZL ships a native LZ engine with decompression over 2x faster than Zstandard
    - Rust 1.99.0 stabilizes C-ABI variadic functions written in Rust
    - Rust compiler wall time fell 4.57% over two months, with 555 of 629 benchmarks improving
    - Mark Shannon proposes a combined generational and incremental GC after the Python 3.14 revert
    - Cloudflare rebuilt Containers around per-sandbox control from a Durable Object
    - Cloudflare K2 puts a durable partitioned log on R2 in public beta
    - A survey of GPU text rendering, and the Slug patent now in the public domain
    - Micron says memory supply stays tighter through fiscal 2027 and 2028, with over 75% of 2027 output
      already committed
