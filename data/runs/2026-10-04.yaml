  notes: |-
    First run of 2026-10-04. The day's digest was still the empty template, so nothing was displaced
    and this selection sets the whole page. Ten stories against a budget of 25, with no section
    above 2 against a cap of 4. The day is genuinely thin on fresh primary material, and it should
    read that way rather than be padded.

    Outages: no story. GitHub's status summary at 2026-10-04T06:49Z reports all twelve components
    operational with an empty incidents array. A 2-point HN item titled "Stackoverflow Is Down" was
    the only outage signal in the corpus and I could not confirm it against any status page, so the
    anchor section states no major items. Security carries two items beyond the lead, both
    re-verified from the GitHub advisories API rather than from commentary.

    ML research: omitted deliberately, not for lack of looking. The arXiv fetch returned a healthy
    field of roughly 170 entries. The closest engineering-relevant candidates were FastCI on
    GPU-intensive CI for training frameworks and MoE-CORE on expert offloading for
    memory-constrained MoE inference, and neither carried the ecosystem attention or the independent
    result the bar asks for. AutoCompact, which looked strongest, was already published in
    yesterday's digest.

    Overlap with 2026-10-03 drove most of the cutting. The HN window is 24 hours, so Kolibri, FTL,
    the Vercel KVM escape, the Gemini access changes, and the GitHub dashboard default were all
    already carried yesterday and were dropped rather than restated. Kolibri's technical report
    surfaced today at 109 points, but aleph-alpha.com/downloads/tech-report.pdf returns raw PDF
    bytes rather than extracted text through fetch_url, so I could not read it and published no
    claim about its contents. There is no open followups entry for Kolibri, so it produced no
    follow-up item either. Worth an access note if PDF primaries keep arriving this way.

    Two candidates I dropped for want of a primary. Pop!_OS banning AI-generated code from much of
    its codebase drew 98 points, and the only cited source was neowin.net, which returns HTTP 403 to
    this environment. I then looked for the policy itself and could not find it: cosmic-epoch has no
    CONTRIBUTING.md, and the same path under cosmic-files and a jammy branch both 404. The story may
    well be real and it is squarely in scope, but it is not publishable on a secondary source I
    cannot even read. The second was Nvidia's 64GB DGX Spark, sourced only to tomshardware at 1
    point with no Nvidia primary checked.

    One attribution call a reader could not infer. The Opus 5.5 playbook is hosted at claude.dev,
    not anthropic.com. I treated it as first-party because the page's own ld+json names Anthropic as
    publisher, and I resolved the page rather than trusting the title. Flagging it because
    claude.dev is the kind of domain the link-hygiene rule exists for, and the judgment rests on
    page metadata. Also note the post is dated 2026-09-22 and only reached the front page today, so
    it is a rediscovery rather than a release.

    The LWN gccrs write-up was substantive and I still left it out: dated 2026-09-22, 2 HN points,
    and no fresh event behind it. It is a good candidate if the project reaches a compiling core.

    Two stories are flagged discussion partly because both authors promote their own product at the
    end. The agent-memory post closes on the author's Operator Memory plugin, and the Docker microVM
    history closes on Docker Sandboxes. Both carry real argument ahead of the pitch, which is why
    they are in rather than out, but the write step should keep the self-interest visible.

    On miss_review: backtest reported 53 candidates and explicitly seeded zero default causes, so
    there was nothing to override and these three are additions rather than corrections. Supabase
    acquiring Turso at 203 points and a month-long GLM 5.3 Flash coding write-up at 205 points both
    scored no_query_match, and both sit squarely in scope, which points at watchlist coverage rather
    than editorial judgment. The macOS Full Disk Access changes at 256 points scored
    seen_and_matched, so the query found it and the day passed on it, which I read as a wrong
    relevance skip for a change with direct developer impact. The large remaining misses, led by the
    Utah VPN ruling at 775 points and a Minecraft city at 637, are correctly out of scope and I left
    them alone.

    Re-ranking, not padding. The day opened with nine stories and closes with fourteen, against a
    budget of twenty-five and a per-section cap of four. Two items found this run outrank what Top
    stories carried, so Top stories was rebuilt: the C2PA signature-exclusion break leads, the Gitea
    runner advisory and the Go 1.27 SIMD post follow, and the OpenAI resignation holds fourth. Simon
    Willison's hard-budget-caps post moved out of Top stories into Engineering posts. It is not
    displaced and nothing was dropped from the day, because neither the day budget nor any section
    was full. It lost the Top stories slot because it argues for a practice rather than reporting an
    event, and two items with primary sources and fresh dates outranked it. No section exceeds
    three.

    Why C2PA leads over a CVSS 9.9. The Gitea advisory is the higher severity number, but it is a
    2026-08-15 disclosure that merely entered the GitHub Advisory Database on 2026-10-02, it is
    already patched, and it reaches only operators of shared Docker-backed Gitea Actions runners.
    The C2PA finding is dated 2026-10-02, has a working end-to-end proof of concept, has no clean
    fix, and breaks the core guarantee of a provenance standard that camera vendors and AI tooling
    are standardising on. David Buchanan publishes under his own domain and credits Neal Krawertz
    for naming the exclusion-range problem in June 2025, so the novel part is a signer choosing a
    large exclusion deliberately rather than incidentally. Reach and the absence of a remedy carried
    the lead over raw CVSS.

    Conflicts disclosed in two blocks. The Kolibri explainer is secondary analysis: its benchmark
    table is Aleph Alpha's own evaluation, which the author states, and the author opens by
    congratulating the team and naming a friend among them. It is published as discussion rather
    than confirmed for that reason. Its independently verifiable part is the tokenizer experiment he
    ran himself over the German Basic Law, which measured a 15 percent reduction against the GPT-5
    tokenizer where Aleph Alpha claims 11.2 percent. Yesterday carried the Kolibri release itself as
    a Top story, so this block is restricted to the architecture and the measurement rather than
    restating the release.

    The Claude Code mods block needs stating plainly for the review: it is a vendor announcement
    with one Hacker News point and no independent verification, and the vendor is Anthropic, which
    also builds the agent that assembles this digest. It is published because the engineering
    substance is real and unflattering rather than promotional, specifically that mods are not
    sandboxed, run with full machine access, intercept permission decisions and tool calls, and ship
    through the plugin marketplace. Anthropic states this in its own post. If the write step trims
    the block, the non-sandboxed property is the part that must survive.

    Dropped with reasons. Strata, claiming a 125B Qwen running at 100 tokens per second on an RTX
    4090, drew 157 points and was cut under the rule against benchmark claims with no method or
    primary source. The Opus 5.5 post at claude.dev drew 223 points and stays out on the same
    attribution grounds yesterday recorded, since claude.com is the domain that verifies as
    first-party and claude.dev does not. Pop!_OS banning AI-generated code drew 109 points and still
    has no readable primary. The Register's follow-up on the Rejetto HFS flaw is genuinely richer
    than yesterday's block, adding CVE-2026-61500, exploitation from a China-hosted IP against US
    and Japan hosts, a count of 286 Mythos and Project Glasswing CVEs, and the mechanism, which is a
    reversible V8 xorshift128+ Math.random() whose outputs the application leaks, recovered with the
    Z3 solver to forge Koa session cookies. It was left out because yesterday published that story
    and this is the same story with more detail, not a new one. It belongs in a follow-up entry
    rather than a second block.

    Sections omitted on the merits. ML research is omitted again after a healthy arXiv fetch:
    AutoCompact was published 2026-10-03 and nothing else in today's set pairs engineering relevance
    with ecosystem attention. Books is omitted because the publisher feed returned almost nothing
    but Springer conference proceedings, mostly repeated ECCV 2026 volumes. New videos is omitted:
    the YouTube fetch was healthy but returned conference uploads and routine channel output with no
    item carrying a real discussion thread. Hacker News as a section is omitted because today's high
    scorers are either already covered as stories or outside scope. Outages states no major items on
    the merits, carried from the earlier run's check of the GitHub status summary.

    Coverage gaps this run. GitHub stars returned zero repositories, GitHub releases and GitHub
    trending did not run at all, and release notes across the forty watchlist repositories are
    exactly the fresh primary material a thin day leans on. The Go SIMD post was found through
    Reddit rather than a releases check, which is the kind of item the missing layer should have
    surfaced directly. Reddit's live fetch again fell well short of its floor and was rescued by the
    pooled snapshot. Treat the thinness of Developer tools and Languages and runtimes as partly a
    collection failure, not only a property of the day.

    Backtest. The 2026-10-03 run reported 53 candidates and seeded zero causes, so no seeded cause
    could be wrong and miss_review instead carries the three candidates that look like genuine gaps
    rather than judgment calls. Supabase acquiring Turso at 203 points is the clearest: a
    database-ecosystem acquisition that changes engineering context for anyone on libSQL, and no
    query matched either name. Sites in ChatGPT at 320 points is an OpenAI product change that
    should have matched an OpenAI query and did not. One month coding with GLM 5.3 Flash at 205
    points is the practitioner agentic-coding write-up the Agentic coding bar asks for. The
    remaining high scorers are correctly absent: Utah's VPN law, the Minecraft city, Newgrounds, the
    telescope sequence, cell-identity aging, von Neumann, the ICC judge, Venice bond markets,
    Ethiopia, and the kidney story are all out of scope, and Full Disk Access in macOS, the Stratego
    result, and the Four Horsemen of Agentic Coding were matched and seen, so those were relevance
    skips rather than gaps. The Turso item was not republished today because it is 2026-10-03 news
    absent from today's corpus, and the Supabase announcement URL guessed for verification returned
    404, so no claim about it is published.

    Third run of 2026-10-04. The day opened this run with 12 stories and closes with 18, against a
    budget of 25 and a per-section cap of 4. Nothing was displaced and nothing dropped, because
    neither the day budget nor any section was full. The HN cache was re-fetched at 18:49Z, three
    and a half hours newer than the 15:00Z fetch the previous run read, and that window is where all
    six additions came from.

    Top stories went from four to five rather than being rebuilt. The lead, the Gitea advisory and
    the Go SIMD post are unchanged and still rank where the morning run put them. The one insertion
    is Apple's Full Disk Access notice at fourth, which pushes the OpenAI resignation to fifth. The
    reasoning: Apple's post is a platform owner saying it will add controls in front of a grant that
    terminals, backup tools, search indexers and coding agents all depend on, at 308 Hacker News
    points with 217 comments, where the OpenAI item reports a personnel and culture change whose
    stated operational hook, that no successor model is announced, is the thinnest in the set. I did
    not promote it higher, because the post gives no mechanism, no OS version and no date, which is
    why it is marked developing.

    The Full Disk Access item is the backtest loop actually changing a decision. It scored
    seen_and_matched at 256 points in the 2026-10-03 backtest and the earlier run today called that
    a wrong relevance skip without republishing it. I resolved the primary properly this time rather
    than relying on the 9to5mac secondary that surfaced today at 1 point: the Hacker News item
    attributes it to developer.apple.com, and the permalink came from
    developer.apple.com/news/rss/news.rss as id=p6zjojqw, pubDate 2026-10-02. The post text is short
    and I am publishing only what it says. Apple states Full Disk Access largely sidesteps its
    privacy controls to let backup apps work, that some developers use it in ways exposing files,
    mail, messages and browsing history, and that it will add controls so the grant requires very
    explicit user action, explicitly because AI agents are becoming more capable and autonomous. The
    substantive Hacker News discussion is about the TCC design that makes this hard, in particular
    that macOS attributes a subprocess's access to the parent app bundle, so granting a terminal
    Full Disk Access grants it to every script run in it. I left that in the thread rather than
    publishing it as fact.

    Strata is a reversal of two earlier calls this same day and should be read as one. Both previous
    runs cut it under the rule against benchmark claims with no method and no primary source. That
    was wrong on the facts: the primary is an MIT-licensed repository, and it documents hardware,
    RAM, quantization level, engine version and prompt sizes per row, ships a bench directory, and
    describes the offloading and speculative-decoding mechanism. Attention also moved, from 157
    points to 376 with 10.3k stars. What I did keep from the earlier skepticism is the headline. The
    Hacker News title claims an RTX 4090 at 100 tokens per second and the repository contains no
    4090 row at all: its fastest measured figure is 94 tokens per second on an RTX 5070 at Q2_0, and
    100 to 140 appears only as a projection for an RTX 3090. Every figure is author-measured at
    2-bit or 3-bit quantization, and the Coder variant's 91 percent of SWE-bench Verified is its own
    authors' number. Reddit carries independent reports in both directions, one at 124 tokens per
    second on a 4090 and one at 11 to 15 on an RTX 5070 with only 32GB of RAM, and the repository's
    own text explains the latter as SSD paging. I published none of the community figures and no
    claim about the Qwen model itself.

    Local inference was the day's one convergent theme, across Hacker News at 376 points, a GitHub
    trending entry, and several Reddit threads. I published only Strata from it. The other instance
    is antirez's ds4, a hand-written C inference engine for DeepSeek 4 across Metal, CUDA and ROCm,
    which scored 301 points in yesterday's backtest as seen_and_matched and is still on trending at
    23.4k stars. I left it out because it is 2026-10-03 news with no fresh event today and I did not
    verify it against its repository, and I recorded it in miss_review as a relevance skip rather
    than carrying it as a second local-inference block. A reader of the page cannot infer that the
    theme was wider than the one story.

    I ran the GitHub trending check this run, which the two earlier runs recorded as not checked,
    and deliberately published nothing from it. The daily view is dominated by agent skill and
    harness-configuration packs, and Hacker News carries a matching cluster of Claude Code tooling
    Show HN posts, so the convergence test in the github guidance is arguably met. I did not write
    the emerging-advance note, because the trending page's star counts for those repositories run to
    six figures for configuration bundles, I verified none of them against their own READMEs, and a
    trend note assembled from unverified third-party repositories is weaker than an omission.
    Flagging it as a judgment call rather than an oversight.

    One correction to the previous runs' Sources checked. They listed GitHub stars as degraded
    because the fetch returned zero repositories. The github guidance states that an empty stars
    fetch exiting 0 is a quiet day, not degraded coverage, and today's cache carries an empty
    degraded array, so stars should be reported as a quiet result. GitHub releases is the real gap
    and is still unaddressed for a third consecutive run: no releases fetch ran against the 40
    watchlist repositories. That matters more than usual, because two of today's six additions are
    language-toolchain items that a releases check is the natural route to. Reddit again fell short
    of its floor at 8 of 28 subreddits and was rescued by the pooled snapshot, which is where the
    Rust for CPython writeup came from.

    Placement calls a reader could not infer. The Rust for CPython writeup is dated 2026-09-30 and
    surfaced on r/rust today, so it is a rediscovery rather than an event, which is why it sits in
    Languages and runtimes as discussion rather than in Top stories despite being the
    broadest-reaching item I found. The precedent is the 2026-10-01 digest, which carried the
    Language Summit garbage-collection writeup the same way. wpd went to Engineering posts rather
    than Languages and runtimes: it is a company blog write-up with a safety argument, a benchmark
    method and a full feature matrix, and putting it beside the two Rust toolchain items would have
    read as a Rust theme the day did not actually have. Apple platforms stays omitted because its
    one story is in Top stories.

    Candidates dropped with reasons. OpenBSD developers rejecting a uutils coreutils port drew 30
    points and the only cited source is news.lavx.hu, an aggregator, with no mailing-list primary
    located, so it is out. Nvidia's 64GB DGX Spark resurfaced at 1 point on two secondaries with no
    vendor primary checked, unchanged from the earlier runs. Microsoft Doubles Down on Rust is a
    4-point InfoWorld piece with no primary behind it. Pico CSS going unmaintained is a 1-point
    Hacker News self-post. A Kotlin Toolchain claim about dropping Gradle for Android is sourced to
    a report of a Slack message and fails the social-attribution rule. The Go JSON v2 migration post
    is genuinely useful but sits on a secondary blog, and the day already carries a Go 1.27 item.
    C++ Insights at 151 points is a long-standing tool showcase with no event behind it, though its
    absence from the query set is a second-order watchlist gap worth noting alongside tmux.

    Outages states no major items on the merits, carried from the earlier check of the GitHub status
    summary at 2026-10-04T06:49Z, which reported all twelve components operational with an empty
    incidents array. Nothing in the 18:49Z corpus changed that. Books returned Springer conference
    proceedings again, mostly repeated ECCV 2026 volumes, and is omitted. New videos is omitted: the
    YouTube fetch was healthy but returned conference uploads and routine channel output with no
    item carrying a real discussion thread. ML research is omitted for a third run. Hacker News as a
    section is omitted because today's high scorers are either published above or out of scope, the
    largest being the Flock surveillance ruling at 462 points and a Bob Cringely obituary at 732.

    On miss_review: the 2026-10-03 backtest reported 53 candidates and seeded zero causes, so these
    six are additions rather than overrides, same as the earlier runs. Four are watchlist gaps where
    no query matched an in-scope item: Supabase acquiring Turso at 203 points, a month-long GLM 5.3
    Flash coding write-up at 205, Sites in ChatGPT at 320 where an OpenAI query exists and still did
    not match, and Make Tmux the OS at 135 where no tmux query exists at all. Two are relevance
    skips where the query found the item and the day passed on it: the macOS Full Disk Access post
    at 256 points, which today's digest publishes, and antirez's ds4 at 301, the highest-scoring
    in-scope miss in the set. The large remaining scorers, led by the Utah VPN ruling at 775 and the
    Minecraft city at 637, are correctly out of scope and I left them alone.
