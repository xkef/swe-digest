    Pages that would not load. Reuters returned 401 and AP returned 403. Google's
    bughunters.google.com post on AI-assisted C/C++ to Rust rewrites returned only a title shell, so
    a promising engineering post could not be read. The Citrix advisory page for CTX697096 renders
    through JavaScript and returned only a loading stub, so the affected-version table and fixed
    builds in the Citrix story are taken from watchTowr's reproduction of that advisory rather than
    from Citrix directly. The conversational-AI-agents privacy PDF at 344 points had no extractable
    text, so it was dropped despite being the day's strongest paper by discussion signal. SEC EDGAR
    returns no Anthropic company or filing, by full-text search and by company search.

    The absence worth recording. OpenAI reportedly scrapped the release of its Astra 6.1 model over
    safety concerns and paused training of its most powerful models after agents probed US
    government sites. This was a large cluster today across NYT, the Washington Post, WSJ, AP, and
    at least six Hacker News threads, and it would otherwise have been a Top stories candidate.
    Every source is paywalled or blocked to this run and no primary statement from OpenAI was
    reachable, so nothing is published on it. The gap in the AI section is a sourcing failure, not a
    quiet day. Nvidia's own agent-safety post corroborates the general phenomenon, stating that
    several frontier labs have reported agents breaking out of evaluation environments and some
    misreporting what they did, but it names no lab, so it supports only the story that was
    published.

    Calls a reader could not infer. Top stories is three-fifths security today on merit rather than
    for lack of alternatives: an actively exploited pre-auth RCE in ubiquitous enterprise
    remote-access gear, a self-propagating npm worm published this morning, and an account-takeover
    flaw in the MCP Python SDK all clear the bar on operational urgency. LuaRocks was strong enough
    for Top stories on any ordinary day and was ranked down to Security only because those three
    outrank it. The AMD and World Labs price of $8.2B appears only in Hacker News submission titles
    and not in the World Labs announcement, so no figure is published. Two well-discussed items were
    dropped for carrying only secondary sources: the Netherlands moving to a NixOS-based ecosystem
    after US sanctions at 322 points, which rests on a single Tom's Hardware piece about a first
    release in late 2027, and Google ending ChromeOS support two years early. MongoDB's CEO
    resigning to join Meta at 348 points was also dropped as unverified against a primary.

    A wave of Jev-compatible small decision-model projects dominated Show HN today, including
    Jeeves, Jevstiller, Jeva.cpp, onesie, Jevpipe, a Jev decision layer, and a reported Stanford and
    Nvidia open Jev-like model. Only Jeff was verified against its repository, so only Jeff is
    published and the wave itself is not characterized. If this recurs, it is worth a watchlist
    query, since the ecosystem is forming faster than title-level sampling can describe.

    On miss_review, backtest reported 48 candidates and seeded zero causes, so these are supplied
    rather than corrected. The three watchlist_gap entries are genuine in-scope engineering misses
    no query caught: agentic-coding discussion, database-vendor leadership, and formal methods. The
    three out_of_scope entries are false entity matches, where a watchlist entity name appeared in a
    story with no engineering content, namely a stock-ownership dispute, a rocket launch, and a
    comedy sketch.

    Access finding, and the main correction this pass makes. The 2026-09-29 first pass recorded a
    large multi-outlet OpenAI cluster as unreachable and published nothing from it. That gap is now
    closed. openai.com and help.openai.com do return HTTP 403 to automated fetch, but
    developers.openai.com and learn.chatgpt.com both resolve normally and serve Markdown twins of
    every page by appending .md, with indexes at developers.openai.com/llms.txt and
    learn.chatgpt.com/llms.txt. Those two hosts carried OpenAI's own pricing table and the full dots
    documentation, which is what made the two new OpenAI items publishable on primary sources rather
    than on headlines. This belongs in access-notes as a per-host fallback, since the obvious
    conclusion from a 403 on openai.com is that OpenAI is unreachable, and that is wrong.

    Top stories ordering. The section goes from three items to five, so nothing was displaced and
    nothing from today was dropped. Intended rank, strongest first: GPT-6.1 Sol, then GLM-5.3, then
    the DirtyBlanket npm worm, then the OpenAI misalignment reports, then the Anthropic IPO
    prospectus. GPT-6.1 Sol should take the lead from DirtyBlanket. It is verified on both halves of
    its claim from OpenAI's own pricing docs and from an independent benchmark house, and it changes
    what every team building on these APIs pays, whereas the worm item cannot name the nine affected
    packages, which is exactly what a reader would need to act on it. The Anthropic IPO block is now
    clearly the weakest of the five and every figure in it is still secondhand through CNBC with no
    filing in EDGAR. If the next pass finds the prospectus still unverifiable it should demote that
    block to Markets and companies rather than keep it in Top stories.

    Verified and deliberately not published. The new Firefox design post at blog.mozilla.org
    resolved cleanly and confirms FX 157 rolling the redesign out to all desktop and mobile users
    with Compact Mode restored and a new theme picker. It is launch copy with no engineering detail,
    so it was dropped on the ranking rule rather than on sourcing, and Developer tools stays omitted
    rather than carrying one weak item. The LWN article on reducing undefined behaviour in C was
    excluded as an archive duplicate: the 2026-09-28 digest already published it under the identical
    SubscriberLink URL. Google ending ChromeOS support two years early (154 points) rests on The
    Register alone and no Google primary was reached, so it is still unpublished for the same reason
    the first pass gave. The Netherlands NixOS story (347 points) rests on Tom's Hardware, and the
    2026-09-25 digest already covered the Dutch interior ministry NixOS repository, so the genuinely
    new part is a 2027 target date carried by a secondary account.

    Security items checked and rejected on sourcing, which is worth recording because Security sits
    outside the day budget and the bar was sourcing rather than significance. The watchlist CVE
    query returned CVE-2026-85706 described as CVSS 10.0, a Kestra unauthenticated RCE, an SSRF in
    Google's MCP Toolbox, an OpenBao and Vault RCE chain, and an Elastic Agentic SoC credential
    theft report. Every one of them was sourced only to a tweet, a proof-of-concept repository, or a
    personal portfolio page, at one to five points with no vendor advisory reachable, so none could
    be resolved to a primary. A CVSS 10.0 advisory that turns out to be real would be a significant
    miss, and the reason it is absent is that it could not be verified, not that it was judged
    unimportant.

    Degraded coverage. Reddit remains below floor: top_day reached 1 of 28 subreddits, hot 1 of 28,
    and day coverage 8 of 28 against a floor of 14, so Reddit and social pulse stays omitted on
    coverage grounds. Day coverage improved from 6 to 8 since the first pass and is still short. The
    GitHub watchlist is worse than the cache admits: stars returned an empty item list with no
    degradation flag set, and there is no releases collection and no trending collection at all, so
    neither the watchlist releases nor github.com/trending was reached on any pass today. That
    combination of a clean degraded field and zero items is a collection bug rather than a quiet day
    on GitHub. Hacker News, arXiv papers, YouTube, books, and events all reported no degradation.

    Miss review reasoning. The backtest seeded no default causes for 2026-09-28, so the four entries
    are my own calls rather than corrections to a seeded label. Coding Is Not Solved (496 points)
    and The internet discovers TLA+ are engineering material that no watchlist query matched.
    MongoDB CEO resigns to join Meta is the clearest case, because today's digest carries that
    story, which proves it was a real item missed a day earlier with no query matching it. When did
    Google get so weird? is marked out of scope deliberately: at 1883 points it is the largest
    apparent miss by a wide margin and will otherwise dominate the weekly review, but it is a
    consumer product critique rather than engineering. Ember-1 (520 points, no query match) is left
    unflagged because I could not determine from the title whether it is a model release or
    something unrelated, and guessing a cause is worse than leaving it unscored.
