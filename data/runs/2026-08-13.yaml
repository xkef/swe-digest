    titles:
    - >-
      DeepSeek repoints the deepseek-v4-pro alias to DeepSeek-V4-Pro-0813 and publishes rates, with the
      announced price rise still pending
    - >-
      Flutter 3.47 makes the standalone Material and Cupertino 1.0 packages opt-in, with in-SDK deprecation
      scheduled for November
    - >-
      Databricks open-sources Metals v2, a Java and Scala language server built to index a 26M-line Bazel
      monorepo before build sync
    - >-
      Zed introduces Delta, a separate application built on a database that replicates the agent conversation
      and the worktree together
    - Artificial Analysis measures Grok 4.6 at 61 on its Intelligence Index and records a cache-read price
      rise
    - >-
      A study of 1,867 repositories reports agent instruction files more than triple over their lifetime
      and older instructions are less likely to be deleted
    - Anthropic records four hours of elevated errors across Claude models on 2026-08-12, primarily affecting
      Fable 5
    - Apache Fory JSON 1.6.0 publishes JMH figures putting it at 3.5x to 10.9x Jackson throughput on Java
    - SLAC, a CPU-to-GPU side-channel attack on the Apple Silicon system-level cache, is accepted to ACM
      CCS 2026
    - Antithesis reports reproducing the SQLite WAL-Reset bug in 15 minutes and says 3.51.3 closes it
    - Chrome's partial IDCT scaling explains why small JPEGs render differently than in Firefox
    - A tour of yy, the unnamed double-to-string algorithm living inside yyjson
    - A post arguing AI is hollowing out mid-level software engineering draws more than 700 comments
    - 'Show HN: Woxi, a Wolfram Language interpreter written in Rust'
