date: '2026-08-13'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Today's file was still the unfilled template, so this run wrote the whole day and displaced
    nothing.

    The governing constraint on this selection is the archive, not the sources. The strongest items
    in today's Hacker News cache by points were nearly all published yesterday. The Tailscale SQLite
    WAL-Reset post at 856 points, CVE-2026-53361 with its public exploit, Qwen3.8-2.4T-A95B, Grok
    4.6 from x.ai, MongoDB CVE-2026-18690, the GitHub Issues and Pull Requests incident, and
    llama.app all appear in 2026-08-12. The Mozilla Firefox and Thunderbird signing subkey rotation
    appears in 2026-08-11. Each was verified again this run against its primary before being set
    aside, and none is restated. That is why the day's lead is Flutter 3.47 rather than any of them.

    On the lead. Flutter 3.47 was ranked against DeepSeek V4 Pro 0813 and Metals v2. It wins on
    being the only one of the three that puts a dated obligation on a reader: the in-SDK Material
    and Cupertino libraries are scheduled for formal deprecation in the November stable release, the
    minimum rises to iOS 15 and macOS 12, and an app built with Xcode 27 that has custom AppDelegate
    code and does not adopt UIScene will fail to launch. DeepSeek is second because the alias move
    is silent and affects existing callers, and Metals v2 is third because it is available today
    with named external adopters. Zed Delta is fourth rather than higher because it is a private
    beta with no general availability.

    Security carries no items and the anchor line stands. That is a fact about the archive rather
    than about the day. Every security-grade item found today is already published: the AF_UNIX
    container escape and the MongoDB batch on 2026-08-12, the Mozilla key rotation on 2026-08-11.
    The SLAC side channel is placed in Apple platforms as a paper rather than in Security, because
    it describes a new microarchitectural attack class with no CVE, no vendor advisory, and no
    mitigation to act on. Nothing new cleared the Security bar.

    Verification calls a reader could not infer. A widely upvoted comment on the DeepSeek thread
    states that DeepSeek is raising prices starting today. The pricing page does not support that.
    It carries published rates for DeepSeek-V4-Pro-0813 and the same unquantified future-increase
    notice this archive recorded on 2026-08-07, so the story says the rise is still pending rather
    than repeating the comment. The Grok 4.6 cache-read price rise from 0.30 to 0.50 dollars per
    million tokens is Artificial Analysis's figure and is not on the x.ai page this archive cited
    yesterday. The Antithesis reproduction of the WAL-Reset bug is published as an independent
    confirmation, but the 15-minute detection time and the tooling claims are that vendor's own and
    the post closes on a sales pitch, which the block says. The celld cost figures are contested on
    the record by Cloudflare and both numbers are carried rather than one. The kernel commit
    d82ba05263c6 named in the CVE-2026-53361 exploit repository was confirmed this run against
    git.kernel.org, authored 2026-05-01 by Kuniyuki Iwashima and merged 2026-05-04, which is
    consistent with yesterday's coverage and is recorded here because that repository's distribution
    claims remain unverified.

    Reviewed and not published. The knownagents.com report of mass vulnerability scans spoofing AI
    crawlers was rejected on the same ground as 2026-08-12, a single vendor page with no method, and
    this run adds that the page is a live-updating dashboard whose Spoofing and Security section
    fell past the fetch size bound, so the specific claim could not be read at all. Cursor Design
    Mode was dropped because the page's own datePublished is 2026-06-05 and there is no dated change
    to point at. The Kubernetes KYAML post was dropped because the fetch returned only the blog
    index navigation and the article body never rendered, and it is a how-to rather than an event.
    Delphi 13 Community Edition and the uBlock Origin Facebook filtering item were dropped for lack
    of a resolvable primary: the uBlock story circulated only through secondary sites and a Reddit
    thread, and attributing a maintainer decision needs the maintainer's own source.

    Access note for the reliability store. zerolabs.rubrik.com returned HTTP 403, so the AKS node
    root to Microsoft 365 Copilot hijack writeup could not be read and is unpublished. A second
    access limit worth recording: Mozilla's security blog index resolves and shows the 2026-08-10
    post by Ben Hearsum, but the post permalink could not be derived from the index, so any future
    Mozilla security item has to be reached another way.

    Sections omitted for lack of qualifying material rather than for lack of checking: ML research,
    Security, Developer tools, Linux and kernel, Books, New videos, Reddit and social pulse, and
    Watchlist follow-ups. ML research is omitted because the arXiv pull returned roughly 140 entries
    dominated by medical imaging, hyperspectral fish freshness, and quantization variants, and the
    two papers that did clear a bar are placed in their topical sections instead. Developer tools is
    empty only because both of its qualifying items, Flutter 3.47 and Metals v2, were strong enough
    for Top stories. Books is omitted for the fourth run running because the publisher feed returned
    Springer conference proceedings plus a No Starch pre-order first listed 2026-07-15. New videos
    is omitted because the YouTube cache attached no discussion link to any of the nine uploads, and
    discussion is the external validation that section ranks on. The strongest candidate was a
    Kevlin Henney YOW! 2025 talk at 1,418 views with no thread. Reddit and social pulse is omitted
    because the fetch reached 1 of 28 subreddits and left no verified social finding standing alone.

    Watchlist follow-ups is omitted deliberately. The DeepSeek release touches the watch_for on
    f-0004, which asks whether the reported compute constraint shows in the next DeepSeek model
    release or open-weight licence. It does not answer that question, because DeepSeek-V4-Pro-0813
    is an API model with no weights published, so the observation is folded into the DeepSeek story
    rather than given a follow-up block that would report no progress.

    On the backtest. Three of the items in this selection, DeepSeek V4 Pro 0813, Zed Delta, and the
    Artificial Analysis Grok 4.6 measurement, were live on Hacker News on 2026-08-12 but landed
    after that day's publish fetch, and all three carry high point totals. That is the same
    collection timing gap three times in one day and is the clearest recurring signal in this
    backtest. The watchlist_gap calls are Woxi, the Chrome JPEG scaling post, and the Jolt Clojure
    compiler, each a real engineering item that no watchlist query matched. The ClaudeBot spoofing
    report and the AI middle class thread are marked relevance_skip because both were seen and
    rejected on their merits rather than missed.

    Degraded coverage this run. Reddit `top_day` reached 2 of 28 subreddits, so 56 top_day items
    came from the 10:28 UTC committed snapshot rather than a live fetch, and the `hot` collection
    returned zero items and contributed nothing. The existing Sources checked line on today's page
    records "1 of 28" from an earlier run and is now understated: the day's final cache records 2 of
    28. The GitHub stars fetch returned an empty items array with no snapshot fallback, and no
    releases or trending artifact exists for this date, so GitHub watchlist coverage is uncovered
    rather than thin, for the third consecutive day. Hacker News, papers, books, YouTube, and events
    all reported no degradation.

    Nothing was displaced. Top stories stood at four and the SharePoint item fills the fifth slot,
    so the day now carries five there and 17 stories outside Security, against a budget of 25.
    SharePoint takes the lead over the DeepSeek alias repoint on active exploitation and on
    actionability: it is the only item on the page with public exploit code, an unauthenticated
    network vector, and named fixed build numbers a reader can compare against tonight. celld was
    weighed for Top stories against Metals v2 and Zed Delta and placed in Infrastructure instead,
    because Top stories was already at its cap once SharePoint was added and celld is a project
    release rather than a dated obligation. Security carried "No major items found." from the
    earlier runs and now carries the Polish breach, which is an addition rather than a displacement.

    Reviewed and not published, each because the primary would not resolve. Anthropic watermarking
    of Claude text output was the strongest candidate dropped. TechCrunch states as fact that
    Anthropic watermarks Claude's editorial text to satisfy the EU AI Act Transparency Code, and
    links its own earlier report headlined as an Anthropic statement, but `anthropic.com/news`
    carries nothing on watermarking through 2026-08-07 and the Transparency Hub, last updated
    2026-07-23, does not mention it either. A watermark on model text output is a material fact for
    anyone shipping generated content, so its absence from this digest is a failed verification and
    not a judgment that it did not happen. It is the item to retry first tomorrow. The claim that
    the Gemini API removed postpay billing rests on a 5-point Hacker News self-post with no external
    link, and the Gemini API release notes carry nothing after 2026-07-30 and last touched billing
    plans on 2026-03-23, so nothing supports it. The Codex and ChatGPT desktop app for Linux drew
    166 points but could not be sourced: `openai.com/codex/` returns HTTP 403 to automated fetch,
    the ChatGPT and Codex changelog lists Daybreak tiers on 2026-08-10 and Codex CLI 0.147.0 on
    2026-08-07 with no Linux desktop entry, and a guessed documentation path returned 404. The
    congressional oversight letter to OpenAI over the Hugging Face incident, which would have been a
    Watchlist follow-up on `[[followups]]` f-0030, fetched as a PDF whose text could not be
    extracted, so its contents are unverified and it is not published. The Rapid7 analysis of
    CVE-2026-55040 is confirmed to exist from the Rapid7 blog index, which was read directly, but no
    post URL resolved across two attempted slugs, so the writeup is described and not linked, and
    the MSRC advisory page rendered empty to automated fetch and is cited alongside the NVD REST
    record that was actually read.

    Also reviewed and not published on the merits. The doubling of the RTX PRO 6000 Blackwell MSRP
    to 16,000 dollars appeared on both Reddit and Hacker News but only through Tom's Hardware and
    wccftech, with no NVIDIA page or listing to confirm it. Anthropic in talks to buy Decart for 6
    billion dollars is a Bloomberg report from people familiar with the matter and changes no
    engineering context today. The claim that Mistral obtained a US patent on tool calls in 118 days
    rests on a single unfamiliar domain with no USPTO record cited. The Reddit-sourced complaints
    about watermarking were not carried in Reddit and social pulse, because publishing the reaction
    would assert the underlying fact this run could not verify.

    Sections omitted for lack of qualifying material rather than for lack of checking. Books is
    omitted for the fourth consecutive day: the publisher feed returned CRYPTO 2026 proceedings and
    generic introductory machine learning titles. New videos is omitted because the YouTube cache
    records no discussion link on any upload and the two Grafana community calls sit at zero views.
    ML research adds nothing, because the arXiv pull returned aerial navigation, medical imaging,
    and volatility forecasting, and the nearest engineering-relevant items, a role-coordination case
    study of agentic IDE tools and a dataset of agent skills on GitHub, are weaker than the
    instruction-file study already published in Agentic coding today. Outages was checked and adds
    nothing: a Hacker News post at 02:27 UTC claimed Claude was down, and `status.anthropic.com`
    records no incident for 2026-08-13, so the page's existing entry for the 2026-08-12 incident
    stands unchanged and unextended.

    On the backtest. It returned 59 candidate misses for 2026-08-12 and seeded zero default causes,
    so there is no seeded cause to correct and `miss_review` is empty rather than blank by
    oversight. The diagnostic labels it does carry are pipeline states, not the cause vocabulary.
    Two entries are worth recording anyway without asserting a cause the tool did not assign.
    "Stealing Reasoning Traces from Proprietary LLM APIs" at 657 points reads as a large miss but is
    not one, because the same primary was published on 2026-08-11 and the 2026-08-12 run withdrew it
    on the archive duplicate check. "uBlock Origin Is Giving Up the Fight to Keep Ads Off Facebook"
    at 527 points is the entry most likely to be a genuine watchlist gap: it concerns a maintainer's
    decision on a widely deployed extension and no query matched it on either day.
