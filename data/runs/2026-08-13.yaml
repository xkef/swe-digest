    First run of 2026-08-13. No digest file existed for today, so this selection writes the whole
    day and displaces nothing. Fourteen stories, thirteen of them outside Security, against a day
    budget of 25 and a per-section cap of 4. No section is at its cap.

    Lead. DeepSeek-V4-Pro-0813 leads over the Zoom advisory. The Zoom flaw is the more severe single
    item and the one with an action attached, but its bulletin was published 2026-08-11 and only
    reached attention today, while the DeepSeek release is this date's event, is a primary artifact
    read directly, and changes two things a team can act on at once: MIT-licensed weights for a
    1.7T-parameter model with no revenue or user thresholds, and a published price schedule that
    restructures on 2026-08-16. The Zoom item is ranked second on breadth and certainty rather than
    third.

    Sources that came back degraded. Reddit top_day reached 1 of 28 subreddits, so the 93 top_day
    items are the 16:09 committed snapshot rather than a live pull, and the hot collection added
    nothing. That is the second day running for the same collection. It cost nothing today, because
    the one Reddit item used, the r/LocalLLaMA DeepSeek-V4-Pro-0813 post, only corroborates a
    Hugging Face page read directly, and no story rests on a Reddit-only finding. The GitHub stars
    fetch returned an empty item list, so GitHub watchlist coverage is uncovered rather than thin,
    again matching yesterday. The events watchlist is empty in both partitions, so no Category:
    Event story was possible.

    Pages that would not load. The congressional oversight letter to OpenAI on the Hugging Face
    incident (casar.house.gov PDF, HN 49268969) fetched at 80KB but the text extraction produced no
    readable content, no match for OpenAI, Hugging Face, or any signature line, so nothing in it
    could be verified and it is not published. That letter is the most valuable follow-up this run
    failed to land, because it is the first congressional action on an incident this archive has
    tracked since 2026-07-21. The Rubrik ZeroLabs write-up on an AKS node root vulnerability chained
    into a Microsoft Copilot hijack (HN 49273498) returned HTTP 403 Forbidden, so a security item
    with a plausible primary went unverified and unpublished. Both are worth a retry on a later run.

    Calls a reader of the page could not infer. The Zoom item deliberately omits the framing that
    carried it on Hacker News. Tom's Hardware presents CVE-2026-53415 as a "Zoomsday" flaw found by
    AI-assisted research using about 20 prompts. Zoom's own bulletin credits Zoom Offensive Security
    and says nothing about tooling, so the AI-discovery claim is secondary, uncorroborated, and left
    out rather than attributed. The severity framing was also checked against the bulletin index
    before publishing: none of the four 2026-08-11 bulletins is rated Critical, and the published
    CVSS is 8.3 High with AC:H and UI:R, which is a weaker precondition set than "anyone in a Zoom
    call" implies.

    The Namecheap cause is taken only from the status page, which says power outage at the Phoenix
    datacenter. A Hacker News submission (49287319) links a Namecheap post on X attributing the
    outage to a cooling system failure at the same datacenter. Those two causes are not the same and
    the status page is the source of record here, so the item is published as developing with the
    power-outage wording and the X claim is not carried.

    The SQLite follow-up is published on a partial read. sqlite.org/wal.html truncated at 20,000
    characters before section 11, so the table of contents confirms that The WAL-Reset Bug, Bug
    Details, and Low Probability Of Occurrence sections now exist, and the body of those sections
    was not read. The story says so rather than paraphrasing text this run did not see.

    Two items are carried despite being several days old, and the reason is the same in both cases:
    the source is a watchlist source whose bar is not discussion volume. The LWN FUSE report is
    dated 2026-08-05 and stood at 2 Hacker News points, and the JPEG explainer is dated 2026-08-03
    with a correction on 2026-08-12. The FUSE piece is the only public account of a maintainer
    prototyping a replacement protocol for a subsystem that every container and cloud storage stack
    touches. The JPEG piece was a scored miss in yesterday's backtest and is flagged as
    watchlist_gap accordingly.

    Reviewed and not published. Anthropic's watermarking story had the volume for a slot across
    three submissions but no primary: the support.claude.com article that carried it, "Can I use my
    Outputs to train an AI model?", is dated 2026-03-16 and is about training restrictions rather
    than watermarks, so what remains is TechCrunch reporting user reaction with no Anthropic
    artifact behind it. Anthropic's reported 2 trillion dollar IPO plan and the reported talks to
    acquire Decart for 6 billion dollars are both single-outlet reports behind paywalls at Fortune,
    the FT, and Bloomberg, with no filing, so Markets and companies is omitted for lack of a
    verifiable primary rather than for lack of checking. The uBlock Origin retreat from Facebook ad
    filtering was the sixth-largest thread of the day and is left out because both submissions are
    secondary blogs and no maintainer statement or repository commit could be resolved without
    search. The knownagents.com report of scans spoofing ClaudeBot is rejected for the third day
    running on the same ground, a single vendor page with no method. "AI is removing the middle
    class of software engineering?" was the day's largest discussion at 885 points and 797 comments
    and is left out of the Hacker News section because it is one blogger's position with no data
    behind it, which the ranking rules place below every item published here.

    Sections omitted for lack of qualifying material rather than for lack of checking: ML research,
    Books, New videos, Markets and companies, Hacker News, and Reddit and social pulse. ML research
