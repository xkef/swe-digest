  notes: |
    First pass of 2026-09-02. No digest file existed for this date, so nothing was displaced and the
    displace list is empty by fact rather than by judgment. Eight stories against a day budget of
    25, no section at its cap.

    Ranking. GitSpawn leads because it is the only item on the page that is both unpatched and
    pointed at the reader's own toolchain: context-gathering `git` calls at agent startup do not
    strip the repository's own config, `core.fsmonitor` names a program, and the index refresh runs
    it outside the sandbox before the workspace-trust prompt. Four of eight findings were live at
    publication, with Claude Code ultrareview confirmed on 2.1.252, Qwen Code on 0.22.3, Grok Build
    on 1.0.13 and Hermes on 0.21.0. Delivery matters and is stated narrowly by the researcher:
    clone, fetch and pull do not carry it, so the vector is a directory moved as files with `.git`
    already inside. The publisher is a security vendor and the post ends in a sales pitch, but the
    CVE assignments (CVE-2026-72718 for Goose, CVE-2026-71963 for Hermes via VulnCheck) and the
    per-vendor disclosure timeline are concrete. Krebs is second on magnitude rather than developer
    proximity.

    `Security` stands down to the anchor line, and that is a promotion artifact, not a quiet day.
    Both qualifying security items are the first and second `Top stories`. A reader of the finished
    page cannot infer that, so it is recorded here.

    Not published for staleness, each caught only by checking the primary rather than the Hacker
    News date. AMD's acquisition of Taalas resurfaced on Hacker News but the press release is dated
    2026-08-06 and the item is already published on the 2026-08-07 page. The Alabama attorney
    general's subpoena to OpenAI reads as current on its front page but the release is dated
    2026-08-24. Both would have been nine-day-old items carried as news.

    The Astra item is filed under `Watchlist follow-ups` rather than `Top stories` on purpose. The
    2026-08-09 page already carries a `Top story` stating OpenAI paused internal Astra work after
    rating it critical for autonomous cyber capability, sourced to the Guardian. Leading again on
    that claim would republish an archived finding. What is new is OpenAI's own post and the
    attack-inspired evaluation, so it runs as an update to the open OpenAI and Hugging Face
    follow-up. openai.com returned HTTP 403 to automated fetch, the same refusal recorded on
    2026-08-09, so the block is written from The Verge, which quotes the post directly and at
    length. The primary is linked but was not read by this run.

    Assessed and not published. The Play Store and Aurora Store thread reached 497 points, and the
    linked GitLab work item still confirms only a server-busy error on an anonymous account with no
    attribution to Google, which is the same reason the 2026-09-01 page rejected it. The
    transformer-beats-LLMs post reached 601 points and remains a single-benchmark claim against
    unnamed models with no method, and the top comments make the benchmaxxing objection directly.
    The Firefox and Ed Zitron threads are the day's largest by points and are commentary without a
    primary. Rui Ueyama's statement that mold is being rewritten in Rust appears only as a post on X
    and was not published on that basis alone.

    The Cloudflare post is an intern prototype and is framed that way. Nothing here is deployed, the
    compression ratio comes from a deliberately compressible two-asset corpus, and the author states
    a broader corpus is needed before treating 2.834x as fleet-wide. The block should not read as a
    shipped feature.

    Collection faults. The events cache again reports `fetched_at` at midnight with `window_hours`
    0, both collections empty and no degradation flag, which is the fourth consecutive day it has
    declared itself healthy while collecting nothing. No `Event` story was possible for that reason
    rather than for want of conference material. The stars cache returned zero items from the
    gh-events backend with no degradation flag for a second day. Reddit fell to 8 of 28 subreddits
    from 12 yesterday, against a floor of 14, so `Reddit and social pulse` is omitted on coverage
    grounds rather than because the subreddits were quiet.

    Sections omitted with nothing verified to report: `AI`, `ML research`, `Linux and kernel`,
    `Infrastructure`, `Languages and runtimes`, `Books`, `New videos`, `Markets and companies`,
    `Hacker News`. `Books` returned Springer conference proceedings plus a small number of Apress
    titles, which is a fact about the feed. `New videos` had a Dwarkesh Patel interview with a METR
    author on the Hugging Face incident at roughly 7,000 views, and the 2026-09-01 page already
    carries a Dwarkesh walkthrough of that same incident, so it was dropped as repetition rather
    than promoted on a low view count.

    Backtest. The tool returned 70 candidates for 2026-09-01 and seeded zero causes, as it has every
    day this week, so every cause submitted is a call rather than a correction to a default. Items
    marked `not_in_publish_fetch` are submitted as `scrape_gap` because they arrived after the
    publish-time fetch. The genuine watchlist gaps are the P99 autocomplete post, the NAT and
    internet centralization post, Tmp.0ut Volume 5 and the ChatGPT Work tool reference, none of
    which any query matched. The highest-scoring candidates are non-engineering front page items and
    are marked out of scope so the top of the list does not read as a coverage failure.

    This is a later pass of 2026-09-02. The page carried eight stories. This pass adds four and
    displaces nothing, taking the day to twelve against a budget of 25. No section reaches its cap,
    and `Top stories` stays at three because nothing found today outranks what it already holds.
    Atlas is the strongest new item and it is an early-access research announcement with no
    independent evaluation, which does not define a working engineer's day the way an unpatched
    code-execution path in coding agents does. Three previously empty sections open: `AI`, `ML
    research`, and `Linux and kernel`.

    The binding constraint was archive collision again. Five of the strongest candidates in this
    window verify cleanly against their primaries and are already published on the 2026-09-01 page
    under the same primary sources: AnkiDroid's Google Play donation-link removal, which is the
    largest thread in this window at 856 points and carries a 2026-09-11 worldwide removal deadline,
    the Google Cloud us-central1-b network degradation, Martin von Zweigbergk joining East River
    Source Control as CTO, the io_uring readahead measurement, and the Firefox for iOS ad blocker.
    Each was fetched and verified in this run before being checked against the archive file, so the
    drop is duplication rather than a sourcing failure. This is the sixth consecutive day on which
    the archive, not source quality, bounded the page.

    Not published for want of a resolvable primary: the OpenAI and Cursor model-access cutoff date.
    devops.com carries a 2026-11-12 shutoff date, OpenAI's stated reason, and Cursor's claim that
    OpenAI models serve about 5% of its traffic. cursor.com/blog carries no post on it and its
    newest company entry is the 2026-08-14 acquisition, and openai.com has returned 403 to this
    range since 2026-08-09. The story itself is already on the 2026-08-29 page under a Reuters URL,
    and that block records that no terms of the change could be read, so the date would have been
    the whole new value and it rests on one secondary blog quoting posts on X. Dropped rather than
    cited through an aggregator, matching the 2026-09-01 call on the same story.

    Not published because the change could not be established: help.mistral.ai states that Vibe
    users are not opted out of model training by default while Vibe Enterprise customers are, and
    that Mistral Studio and the API carry a separate toggle. The page reports dateModified
    2026-08-31 and the Hacker News framing is that the default is new. Nothing in this run
    establishes what the page said before, so only the current state is confirmed and the newsworthy
    part is not.

    Not published because the primary would not resolve: a Hacker News item asserts a critical
    Next.js remote code execution is missing from the GitHub Advisory Database and OSV, citing
    GHSA-2xp9-vwfh-vxw4. Both api.github.com and github.com returned HTTP 404 for that identifier. A
    404 is consistent with the claim and does not establish that the vulnerability exists, so
    nothing was published and the absence is recorded here instead.

    Assessed and not published on the bar. The Baseten post on the efficient frontier of LLM
    inference reached 139 points and is a taxonomy of latency and throughput techniques with no
    measurements, ending in a promotion of the author's book, while `Engineering posts` already
    carries the Cloudflare Zstandard piece that publishes its numbers. The Telstra findings report
    on the 2026-07-08 outage is a genuine incident report but reached 3 points and covers one
    national telco. Neither is among the day's most consequential items.

    `Security` and `Outages` are unchanged. No advisory in this window verified to anything
    publishable, and the only new incident of the window is the Google Cloud one already carried on
    the previous day's page, so the `Security` pointer line written by the earlier pass still holds
    and was not replaced with the no-items line.

    Calls a reader of the finished page could not infer. The LWN note is filed under `Linux and
    kernel` because LWN is the reporting that section depends on, not because the post is about the
    kernel itself. The Atlas block states that every performance comparison in it is World Labs'
    own, because the post names its baselines and its third-party human-rater method but publishes
    no figures in the page text, which is what keeps it inside the rule against unmethodical
    benchmark claims.

    Collection faults, unchanged in direction from the earlier pass. The events cache again reports
    fetched_at at midnight, window_hours 0, both collections empty and no degradation flag, the
    fifth consecutive day it declares itself healthy while collecting nothing, so no `Event` story
    was possible for that reason rather than for want of conference material. The stars cache
    returned zero items from the gh-events backend with no degradation flag for a third day. Reddit
    came back at 9 of 28 subreddits against a floor of 14 with top-of-day at 1 of 28, so `Reddit and
    social pulse` stays omitted on coverage grounds rather than because the subreddits were quiet.
    Hacker News, arXiv papers, books and YouTube were clean, and the books feed again returned
    Springer conference proceedings and a small number of Apress titles with no trade technical
    release.

    Backtest. The tool returned 70 candidates for 2026-09-01 and seeded zero causes for the sixth
    consecutive day, so every submitted cause is a call rather than a correction to a default. Items
    marked not_in_publish_fetch are submitted as scrape_gap because they arrived after the
    publish-time fetch, and one of them, the Codex LibreOffice note, is published on this page
    today. The clearest watchlist gap is Atlas itself at 122 points on 2026-09-01, which no query
    matched and which this run selected a day late, and the others are the P99 autocomplete post,
    the NAT and internet centralization post, Tmp.0ut Volume 5, the ChatGPT Work tool reference, and
    RavynOS. Candidates already carried elsewhere in the archive, or rejected on a stated bar such
    as the AuroraStore attribution gap and the transformer benchmark with no method, are submitted
    as relevance_skip. The highest-scoring candidates are non-engineering front page items and are
    marked out of scope so that the top of the list does not read as a coverage failure.

    Ranking and placement. This is a later pass of 2026-09-02, which already carried twelve stories.
    Five additions plus one Security item take the day to seventeen against a budget of twenty-five,
    and nothing is displaced because nothing found in this window outranks what the page holds.
    Gemini 3.8 Flash belongs second in `Top stories`, not first. The git config flaw keeps the lead:
    it is unpatched in four named agents, it points at the reader's own toolchain, and it is the
    item a working engineer acts on today. Gemini 3.8 is the day's largest confirmed release and
    changes options rather than requiring action. `Top stories` goes to four of five, `Engineering
    posts` to three of four, and `Markets and companies` and `Security` open.

    The day has a through-line the page does not yet state, and a reader could not infer it from the
    blocks alone. Three separate items are about AI systems finding vulnerabilities and about who is
    allowed to run them. Google gates 3.8 Flash Cyber behind a new Fairwind Program for trusted
    defenders, one day after Anthropic shipped Mythos 5.1 under trusted-access programs on the
    2026-09-01 page, and the same day curl published nine advisories of which a specialist vendor
    claims six against a public zero-result from both labs' cyber products. No claim is drawn here
    from that convergence. It is recorded because three blocks filed in three sections are one
    story.

    curl is filed in `Security` rather than `Top stories` on severity. Eight of the nine advisories
    are Low and one is Medium, and the fix shipped in 8.22.0 before publication, so there is no
    operational urgency to promote. It is not a repeat of the AISLE curl item on the 2026-06-26
    page: that covered curl 8.21.0 and different CVEs, and the new element here is the head-to-head
    against a timestamped public zero-result rather than the finding count. All nine CVE identifiers
    and dates were read from curl.se, not from the reporting vendor's post, which is promotional and
    ends in a sales pitch.

    Both Perplexity reports are published by research organisations with no track record in this
    archive, and both are carried on the strength of published method and CC BY 4.0 datasets rather
    than on the publisher. They measure different failures of the same layer, which is why both run:
    Trellner measures what the cited documents are, Haus measures whether a citation supports the
    sentence it is attached to. Every figure in both blocks is attributed to the report rather than
    asserted. Neither is a benchmark claim about a model's capability.

    The GrapheneOS item is filed as a follow-up, not as a new Security story, because it revises the
    2026-08-29 block that reported memory tagging as near certainly absent from Pixel 11 hardware.
    The source is the project's own Mastodon instance, which satisfies the attribution rule. Its
    causal claim is hedged in the original as "we think", and Google has still not stated a
    position, so the open follow-up from 2026-08-29 stays open rather than closing.

    Assessed and not selected. The agent-harness cost evaluations, both the Show HN at 43 points
    reporting 17x variance in cost per pass across nine harnesses and the New Stack report of
    70-fold token variance on an identical model, are self-published or secondary benchmark claims
    with no independent reproduction, and `Agentic coding` already holds two verified items. The
    Mistral training-default change stays unpublished for the reason the earlier pass gave, which
    this run re-checked against the same help page: the current state is confirmed and the change is
    not. The Ed Zitron thread at 818 points and the Firefox commentary at 913 points remain the
    day's largest threads with no engineering primary between them, so `Hacker News` stays omitted
    rather than filled from the top of the list.

    Backtest. The tool returned the same 70 candidates for 2026-09-01 and seeded zero causes for a
    seventh consecutive day. `miss_review` is submitted empty on purpose: with no cause seeded there
    is no default to correct, and earlier passes of this date already submitted calls for this
    candidate set, naming the P99 autocomplete post, the NAT and internet centralization post,
    Tmp.0ut Volume 5, the ChatGPT Work tool reference, RavynOS and Atlas as watchlist gaps.
    Re-submitting the same list would duplicate those records rather than correct them, and this run
    found no candidate whose earlier call it disagrees with. The zero-seed streak is now long enough
    to look like a tool fault rather than a property of the days, and the weekly review should
    decide whether the seeding path still runs.

    Collection faults, all unchanged in direction. The events cache declares itself healthy while
    having collected nothing for a sixth consecutive day, so no `Event` story was possible for that
    reason and not for want of conference material. The stars cache returned zero from gh-events
    with no degradation flag for a fourth day. Reddit improved from 9 to 11 of 28 subreddits and is
    still under the floor of 14, so `Reddit and social pulse` stays omitted on coverage grounds.
    Every page this run needed resolved on the first attempt, including lwn.net, blog.google,
    curl.se, help.mistral.ai, grapheneos.social and uber.com, so no access note needs adding or
    re-dating.
