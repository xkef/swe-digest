    On the miss review. The backtest scored 60 candidates for 2026-09-14 and seeded zero causes, so
    every entry above is an original call rather than an override. Two are genuine watchlist gaps:
    the software design document post at 294 points is a mainstream engineering write-up that no
    query matched, and the Microsoft patch-breakage report at 184 points also matched no query
    despite the query corpus being large, which matters because today's page leads with the
    out-of-band update that fixes exactly those regressions. The query set has no Windows or
    Microsoft term. The four marked relevance_skip were all correct calls already explained in the
    09-14 notes, mostly stories published on earlier dates. The six marked out_of_scope are the
    highest-scoring candidates on the list and are consumer hardware, ad-fraud reporting, a
    social-platform shutdown, an index reshuffle and immigration policy, so they should not count
    against engineering coverage in the weekly numbers.

    Overlap with the previous date decided most of this run. The day's largest Hacker News threads
    were nearly all already published on 2026-09-14: Apple's iOS 27, iPadOS 27 and macOS 27 release,
    the MacRumors Siri private-framework item, the Tokio performance write-up, Cloudflare's
    Automatic Key Exchange post, the Ubuntu 26.10 Rust coreutils completion, and Temporal's $550M
    round. The rubyhack.ai RubyGems agent-swarm report and Aaron Patterson's mechanism post are on
    2026-09-12 and 2026-09-14. Those are archive and were not republished. I verified each of them
    against the 2026-09-14 page before discarding, which is why this run adds three stories rather
    than ten on a day whose front page looked much busier than that.

    Three genuinely new items were verified against primary sources and added: Google's Gemini 3.8
    Live pair, dated 2026-09-15 on blog.google; the Internet Archive's Wayback Machine access post,
    dated 2026-09-15 by the service's director; and the Strix writeup of a live Baseten GitHub token
    found in a public Docker image's build history. The Baseten item fills Security, which this date
    previously carried as "No major items found." It is a vendor blog promoting the tool that found
    the issue, and the finding is retrospective, disclosed 2026-07-13 and rotated the next day. Both
