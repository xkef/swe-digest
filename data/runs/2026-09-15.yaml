    possible.

    Backtest. The tool scored 60 candidates for 2026-09-14 and seeded zero default causes, so there
    was no seeded cause to correct and the entries below are causes I am asserting rather than
    overriding. Two are scrape gaps the previous run documented itself: the LessWrong
    alignment-evals post at 406 points was wanted and unreachable after six rate-limited attempts
    across two days, and the Amazon versus Perplexity Ninth Circuit item was created after that
    day's publish-time fetch. One is a true watchlist gap: a 294-point post on writing software
    design documents is ordinary engineering content that no query matched. Two are deliberate skips
    rather than misses, and I am recording them as such so they do not read as coverage failures
    later: Signal's numberless registration was held because the zero-knowledge framing came from
    forum users rather than any Signal announcement, and the Microsoft patch-regression story was
    held on 2026-09-14 for lack of a Microsoft primary and then published on this date once the
    release-health page carried it, which is the system working. High scorers I did not flag at all,
    including the Google advertising investigation at 876 points, Steam Frame pricing, Nike leaving
    the S&P 100 and the Flock camera cluster, are out of scope at the base rate and need no
    exception.
