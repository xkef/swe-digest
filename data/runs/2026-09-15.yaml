    - Sakana AI reports training 1000-layer networks without backpropagation using layer-local predictive
      coding
    - 'Microsoft removes the COPILOT function from Excel and existing formulas return #NAME? on recalculation'
    - An ICML paper reports that discounting correlated LLM judges beats weighted majority vote by 9 to
      14 percent
    - A preprint proves the k-server conjecture, showing the work function algorithm is k-competitive
      on every metric space
    - Quay.io refused pushes for about fourteen hours and Red Hat gives database scaling as the cause
    - Sidero Labs launches Talos Enterprise Linux as a paid license and states the open source build differs
      only by FIPS
    - An eBPF security agent caches policy lookups per inode and cuts benchmark kernel cycles from 28
      billion to 3.03 billion
