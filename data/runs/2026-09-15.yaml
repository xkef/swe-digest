  - >-
    Java 27 reaches general availability with G1 as the default collector in all environments
    and compact object headers on by default
  - >-
    Microsoft ships an out-of-band update after its September patch destabilized Remote Desktop
    Services and broke Plan9 host shares for WSL
  - >-
    Cloudflare adds a Disallow AI Training setting and changes Block to cover mixed-use crawlers
    including Googlebot, Bingbot and Applebot
  - >-
    Sidero Labs is acquired by Yardi and states Talos Linux stays open source under MPL-2.0
  - >-
    Google ships Gemini 3.8 Live and 3.8 Live Extended Thinking to the Gemini API with tool
