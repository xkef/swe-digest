    displaces nothing.

    One re-ranking, no removals. The Sakana AI PC-ALM block moved from Top stories to ML research.
    Its headline claim is MNIST-only at width 32 and appears only in the write-up, while the
    preprint it cites analyzes depth up to 128, and nothing has reproduced it. That is a fine ML
    research item and a weak day-defining one. Top stories therefore runs at four rather than five,
    which is within the 3 to 5 range, and nothing was promoted to backfill because nothing today
    outranked what was already there. No story was dropped from the day, so the displace list is
    empty.

    Dropped on sourcing rather than on interest. Swift 6.4 was released today and is unpublishable
    from this run: swift.org returned undecoded gzip bytes instead of text, and the swiftlang/swift
    release tag for swift-6.4-RELEASE returned HTTP 404, so no primary could be read and I will not
    write a version claim from a Hacker News title. That is a new access note worth recording
    against swift.org. The Hacker News item "Hugging Face is billing OpenAI $100M for hacking it"
    resolves to a TNW article dated 2026-07-27, a resurfacing of a July incident, not news. The
    234-point piece at effort.news alleging a single firm behind the OpenAI, Anthropic and Meta
    hacking disclosures was read in full and dropped: the outlet is unfamiliar, the framing is
    heavily editorial, and the factual core rests on Anthropic, OpenAI and Meta disclosures that I
    did not read directly this run, so writing it responsibly needs those primaries rather than this
    summary of them.

    Sections left empty and why, because an omitted section reads the same as a quiet one.
    Engineering posts carries nothing. The candidates were real but the threads were not: the V8 C++
    garbage collection post at 51 points, a spin-lock optimization post from 2026-09-12 at 52,
    NVIDIA's OpenShell formal-methods note at 14, and RIPE Labs on IPv6 first-packet latency at 11.
    Ranking on external validation rather than on volume, none clears the bar the Books and New
    videos posture sets. Developer tools, Languages and runtimes and Apple platforms are omitted for
    the same reason once Swift 6.4 fell to the access failure above. The Iranian bank certificate
    revocation story, 96 points and 185 comments, was not published because the only source found is
    a single outlet and no certificate authority or sanctions primary was read.

    Collection. The GitHub stars fetcher returned exactly one starred repository while reporting no
    degradation, the fifth consecutive day this fetcher has come back effectively empty with a clean
    exit code. That is a fetcher defect, not a quiet week on GitHub, and it means watchlist releases
    and trending have now been unverified for five days running. Reddit reached 10 of 28 subreddits
    against a floor of 14 and 2 of 28 on top-of-day, so Reddit and social pulse is omitted for a
