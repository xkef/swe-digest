  notes: |-
    Today's digest file was an empty template at the start of this run, so this is the first
    selection pass for the date and nothing was displaced.

    The day's Hacker News window overlaps yesterday's page almost entirely. iOS 27 and macOS 27, the
    tenderlovemaking RubyGems mechanism post, Ubuntu 26.10 Rust coreutils, Cloudflare Automatic Key
    Exchange, the Tokio performance write-up, Temporal's Series E, Xcode 27, Anthropic's CI post and
    the Siri private-framework item are all already published on 2026-09-12 or 2026-09-14. NVIDIA's
    CUDA Rust post is also already carried. This selection is therefore drawn from what arrived
    after yesterday's last pass, which is why Top stories holds three items rather than five.
    Padding it to five would have meant promoting section-grade material.

    The Windows item closes a gap yesterday's page recorded. That run held The Register's report for
    lack of a Microsoft primary. Microsoft's Windows release health page supplies it and confirms
    three regressions from the 2026-09-08 security update KB5124008, with an out-of-band cumulative
    update KB5129195 released 2026-09-14. Remote Desktop Services instability and the Plan9 host
    folder share failure are both marked resolved by that update, and Microsoft names WSL and Claude
    Cowork as affected by the Plan9 break. The USB Audio Class 1.0 entry is still only Mitigated and
    Microsoft states the fix addresses the 8-channel and 3D audio symptoms only. The Register
    headline also claims paste breakage. Microsoft's page does not carry that, so the block should
    claim only what the release health page supports. Administrators who applied the Group Policy
    mitigation for the Plan9 issue must re-enable that policy before installing the update, which is
    the kind of detail a reader cannot infer.

    Placement call worth recording. The Quay.io incident is the day's second strongest operational
    item and would have ranked second in Top stories. It runs in Outages instead, matching the
    2026-09-13 treatment of the GitHub replication-delay incident, because Top stories is canonical
    for anything it holds and the Outages anchor would otherwise have read "No major items found"
    with an outage story sitting above it. That anchor has been empty for two days and the honest
    reading of today is that it is not.

    Dropped on verification rather than on the bar. The Effort News piece attributing the OpenAI,
    Anthropic and Meta agent-hacking incidents to a single contractor, Irregular, is the
    highest-impact candidate I read and it is not published. Anthropic's own newsroom index confirms
    the 2026-07-30 announcement "Investigating three real-world incidents in our cybersecurity
    evaluations" and the 2026-08-31 follow-up stating that three incidents were reported and that
    METR will conduct an independent review. It shows no 2026-09-09 entry matching the article's
    central timeline row, which claims Anthropic expanded to four incidents across seven runs, and
    the cross-vendor Irregular attribution rests entirely on that one outlet. The absence is the
    finding here rather than a quiet call.

    Amazon versus Perplexity in the Ninth Circuit, a 198-point thread, could not be verified.
    law.justia.com returned HTTP 403 and the court's own opinion PDF at cdn.ca9.uscourts.gov
    returned raw PDF bytes that the fetcher did not extract to text. No claim about an
    agentic-browsing precedent is published on an unread opinion.

    Sections omitted and why. Security carries no block because nothing new in the window clears the
    bar. The RubyGems material is fully covered across 2026-09-12 and 2026-09-14, and the remaining
    security-adjacent items were vendor commentary or already-published breaches. Books is omitted
    for a third day because the publisher feeds again returned Springer ECCV, ICANN and COMIA
    proceedings volumes, which is now a standing property of that watchlist rather than a quiet
    week. New videos is omitted because no watchlist upload carried a discussion object at all. The
    "Rust is now a tier-1 language at Microsoft" upload is from a commentary channel whose
    description links a course waitlist, and no Microsoft primary for the tier-1 claim was located,
    so it is not published in any section. Hacker News and Reddit and social pulse are both omitted,
    the first because the day's largest threads are either already carried or out of scope, the
    second because the reachable sample was again dominated by r/ClaudeAI and r/neovim with nothing
    clearing the bar.

    Items older than today, stated because the page does not show it. The eBPF post is dated
    2026-09-11, the ClickHouse WalShadow post 2026-09-10, and the Amazon Science judge-aggregation
    post 2026-08-26, tied to an ICML 2026 paper. The Sakana post carries only "September 2026" and
    cites arXiv 2605.31022, an identifier in the May 2026 range, so the write-up postdates the paper
    and the block should not imply a same-day preprint. The 1000-layer claim and the claim of being
    the first layer-local method to reach that depth are the authors' own, the tasks are MNIST,
    Fashion-MNIST, CIFAR-10 and Tiny ImageNet, and no third party has reproduced the numbers.

    Resurfacings dropped rather than published as news. The effective design document piece at 321
    points is a book excerpt dated 2026-06-24, and Distributed Systems Classics at 270 points is a
    2017 reading list. The Claude Code issue reporting that over 6,000 issues labelled "has repro"
    were auto-closed is checkable against the repository's own sweep workflow configuration, but it
    was opened 2026-08-18 and drew 4 points and no comments, so it is held rather than used to pad
    Agentic coding.

    Collection failures. Reddit is degraded for a fourth consecutive day at 9 of 28 subreddits
    against a floor of 14, with top-of-day and hot each reaching 1 of 28 before pooling. The GitHub
    stars fetcher returned an empty item list while reporting no degradation for a fifth consecutive
    day, so watchlist starring, releases and trending are unverified again. That is a fetcher defect
    with a clean exit code, not a quiet day, and it has now persisted long enough to be worth a fix
    rather than another note. The events watchlist returned no active and no upcoming entry again.

    Why this selection is small. The 2026-09-14 page already carries six of the strongest items in
    today's caches, under the same primary URLs: Apple's iOS 27, iPadOS 27 and macOS 27 release, the
    RubyGems GemStuffer YARD and cached-API-key findings, Cloudflare's Automatic Key Exchange post,
    the Tokio performance write-up, Anthropic's CI test-impact-analysis post and the Ubuntu 26.10
    Rust coreutils completion. All six still rank at or near the top of today's front page and
    top-of-day collections, because HN surfaced them late on 09-14 and they persisted. They are
    archive and were not reconsidered. What is left that is genuinely new on 2026-09-15 is thin, and
    three additions is an honest reading of the day rather than a run that stopped looking.

    Nothing was displaced. Top stories moves from three to four, below the cap, and the four are not
    a re-ranking of the existing three. Java 27 leads the additions because it shipped today and two
    of its nine JEPs change runtime behaviour on upgrade with no code change.

    Section-fit compromise worth recording. The k-server proof is cs.DS, not machine learning, and
    ML research is the only section the schema offers for an arXiv paper. It is filed there with
    category Paper. If a future run wants a home for theory results with systems relevance, this is
    the case that shows the gap. The status is developing purely because the preprint is one day old
    and unrefereed, not because the authors are marginal figures.

    Verified and then dropped. The RubyGems story was re-verified this run against the maintainer
    post and the rubyhack.ai report, and the RubyGems blog index independently confirms both a
    2026-07-22 entry titled "Security advisory: Possible leak of legacy API keys via improper cache
