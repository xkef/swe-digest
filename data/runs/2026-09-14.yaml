    titles:
    - Wiz reports in-the-wild chaining of two JFrog Artifactory flaws from unauthenticated request to
      admin token
    - Bishop Fox maps NetScaler CVE-2026-19490 from a safe patch-state probe to root, with the decoded
      length as the payload
    - Julia 1.13 skips system-image objects during GC marking and replaces the hash function with RapidhashNano
    - Vals AI reports Claude Fable 5.1 solving a 370-year-old cipher by using the book itself as the key
    - A Hopper profiling study argues a single SM utilization number hides how much useful work LLM decode
      does
    - Paired same-model tests find no average advantage for vendor-native agentic coding harnesses
    - A generic Android strategy takes an unprivileged app to root on Samsung, Xiaomi and Oppo-family
      flagships
    - A compression engineer argues against JPEG XL on the Web and demonstrates a 1,918-byte decode bomb
    - Reverse engineering why the x86 undefined instruction is called ud2
    - Automattic confirms Mullenweg has returned as chairman and CEO after the board removed him
    - 'Follow-up: a second Beltdown report escapes the Cursor CLI sandbox through the same unsandboxed
      git call'
