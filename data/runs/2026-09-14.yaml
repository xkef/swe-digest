date: '2026-09-14'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Hacker News coverage was clean this run, with no degraded collections and the day's committed
    snapshot pooled in. Reddit was degraded for the second consecutive day at 7 of 28 subreddits
    against a floor of 14, with top-of-day and hot each reaching 1 of 28. The GitHub stars fetcher
    again returned zero repositories while reporting no degradation, which is the same
    silent-failure shape the 2026-09-13 page recorded. With no snapshot fallback a clean exit on an
    empty result cannot be told apart from a failure, so GitHub watchlist coverage is unverified for
    a second day and is worth a fetcher fix rather than another note.

    Two access failures cost real candidates. lesswrong.com rate limited both attempts, so the day's
    420-point front-page post on Astra and Fable hacking alignment evals is unverified and not
    published. That is four failed attempts yesterday and two today against the same host, so it is
    now a pattern rather than a transient. lwn.net returned HTTP 403 on an article page, which is
    new: the 2026-09-13 page cited an LWN SubscriberLink successfully. That dropped the PostgreSQL
    19 scary-patch-contest item. Both are collection failures, not editorial judgments.

    Verification worth recording. Wiz's Artifactory post states CVE-2026-82329 was added to CISA KEV
    and says nothing about the other two. Reading the KEV feed directly for this run showed
    CVE-2026-42016 and CVE-2026-42018 added on 2026-09-11, the day after the Wiz post, with a
    2026-09-25 due date, so the block cites the catalog rather than the vendor claim for that fact.
    The same read confirmed CVE-2026-19490 was added on 2026-09-09, which is what moves the
    NetScaler item from a good write-up to confirmed active exploitation.

    Three high-scoring Hacker News threads were resurfacings of stale posts and were dropped rather
    than published as news: the Anthropic Antspace microVM reverse-engineering post is dated
    2026-03-18, the Chess.com 7.3M-record scrape is a Security Affairs piece dated 2026-08-14, and
    the Boston Scientific incident update is dated 2026-09-09 and concerns manufacturing and order
    fulfillment rather than developer infrastructure. Two items I did publish are also older than
    today and the blocks say so: OEMpocalypse is dated 2026-08-31 and is part 1 of a series with no
    CVEs and no patch status, and the Vals AI cipher post is dated 2026-08-31 despite topping the
    front page today.

    Both Beltdown reports are retrospective, and the blocks lead with that. Claude Code was fixed in
    2.1.247 on 2026-08-26 and Cursor CLI in 2026-08-04-aaa8809, so the value to a reader is the
    class description and the two robust designs the authors name, not an open exposure. This closes
    the live half of the coding-agent sandbox-escape follow-up, which previously tracked only the
    Cursor Docker-socket chain and the Cowork VM escape.

    Sections left empty and why. Outages carries nothing because GitHub's only incident in the
    window is the 2026-09-13 replication-delay event already on yesterday's page, and the status
    feed shows nothing opened on 2026-09-14. Books is omitted for the second day because the feeds
    returned near-identical Springer ECCV and ICANN proceedings volumes, which are conference
    proceedings rather than book releases, and this is now a standing property of the books
    watchlist rather than a quiet week. New videos is omitted because only one watchlist upload
    carried an HN thread at all and that thread had 4 points and no comments. The Hacker News
    section is omitted because the day's largest threads were either already carried in their
    topical sections or, in the LessWrong case, unverifiable. Reddit and social pulse is omitted
    because the reachable sample was thin and its one strong item, Beltdown, is published as a
    primary story instead.

    Candidates considered and dropped on the bar rather than on access. Signal numberless
    registration has real evidence in merged signalapp/Signal-Android commits, including one that
    adds paid registration, but the zero-knowledge-proof framing in the thread title comes from
    forum users rather than any Signal announcement, and the story has no natural topical section,
    so it is held rather than published. The Google dodgy-ads investigation at 749 points is
    ad-fraud reporting without engineering consequence. JetKVM Mini, the Tesla cyberattack post,
    Garry Tan on distillation, David Sacks on frontier regulation and the Nvidia financing pieces
    are all carryover from yesterday or commentary without a primary source.
