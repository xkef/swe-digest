    titles:
    - One extension reached the built-in AI assistants in Chrome, Edge, Comet, Opera Neon and Claude in
      Chrome
    - GitHub rewrote the Copilot agent runtime into more than 800,000 lines of Rust, with agents writing
      most of the code
    - Unicode 18.0 adds 13,007 characters and changes line breaking, segmentation and spoofing rules
    - Mistral serves Z.ai GLM 5.3 in public preview with a 1M context at $1.40 per million input tokens
    - BITCOS packs ternary LLM weights below the 1.585-bit reference by exploiting zero density
    - GPUThor reports the first Rowhammer exploits against ECC-protected NVIDIA GPUs
    - Slint 1.18 adds a flexbox layout, runtime z-order and an experimental Vello renderer
    - Performance Improvements in .NET 11 documents a year of JIT and library work against the 11.0.0
      release candidate
    - A twenty-line Mach IPC sequence panicked macOS and iOS kernels until a fix shipped in the 27 releases
    - PlanetScale ships TIN, a full-text search index for Postgres built on ctid postings
    - Post-training a 4B model to write Postgres query plans reports a 44.7 percent latency cut on 113
      join-heavy queries
