date: '2026-09-17'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    First run of 2026-09-17. No digest existed for this date before this run, so nothing was
    displaced and every block below is an addition. Twelve blocks against a budget of 25, with no
    section at its cap. The story inbox is empty.

    Ranking. Top stories runs at three rather than four or five, because the fourth-ranked
    candidates, the PlanetScale TIN release and the QoRL query-planner write-up, are both bounded in
    a way the three leaders are not: TIN is GA only inside PlanetScale and its benchmarks are
    vendor-run, and QoRL is one author's unreproduced experiment. Both are published in their
    topical sections instead. The BragJack browser disclosure leads because it is the only item of
    the day with immediate user-visible exposure on software most readers are running, and because
    five vendors paid bounties on it.

    Deliberate claim limits. The BragJack post lists CVE-2026-0628 and CVE-2026-55945 in a table
    whose column alignment does not survive text extraction, so the block names both ids without
    assigning either to a browser. The post names no fixed version for any of the five browsers, and
    its closing section is a pitch for the publisher's own endpoint product, which the block states.
    GPUThor is labelled developing rather than confirmed: the paper states acceptance at CCS 2026
    and reports measured bit-flip rates, but there is no CVE, no NVIDIA statement and no independent
    reproduction.

    Unicode caveat. The Unicode 18.0.0 version page is dated 2026 September 16 and still carries
    preliminary-draft and beta-review status notices in several sections, including over the UCD
    data files. What supports the confirmed status is the enumerated-versions table, which lists
    Unicode 18.0.0 for 2026 with a release blog post alongside every prior released version.
    blog.unicode.org returned a rate-limit error on this run, so the announcement post itself was
    not read.

    Pages that would not load. ryan.science returns only the author's name for the driver's-license
    barcode signing-key post at 106 points, on both the bare and trailing-slash paths, so the day's
    one candidate on AAMVA signing keys is not published and the claim is not made anywhere.
    harnesstax.github.io returned its title and a loading marker, so the coding-agent harness study
    at 95 points could not be read. mimo.xiaomi.com/rl returned a reconnecting marker, so the Xiaomi
    Mimo 2.6 live post-training dashboard at 380 points is unverified and omitted.
    openai.com/index/reimagining-advertising-with-ai returns HTTP 403 from this environment again,
    as it did on 2026-09-16, so Sponsored Agents is omitted for the second day rather than sourced
    from coverage. Reuters returns HTTP 401 for both the OpenAI and Hugging Face probing report and
    the Spanish data-watchdog AI-agent breach report. netflixtechblog.com returns HTTP 403, so the
    Flink autoscaler post is omitted. OpenAI's disclosure of six new concerning-behaviour incidents
    exists in today's cache only as New York Times and Axios coverage with no reachable primary, so
    it is not published.

    Archive duplicates dropped. NVIDIA's CUDA Rust announcement reached 525 points today, second
    only to a Show HN already published, but it led the 2026-09-08 digest under the same
    developer.nvidia.com primary, whose schema gives datePublished 2026-09-08. Today is renewed
    attention, not a new disclosure, and the 2026-09-16 log was right to hold it out. Also dropped
    as already published: Cloudflare's post-quantum DNSSEC on 1.1.1.1 (2026-09-10), DeepSeek V4.1
    Flash pricing and routing (2026-09-10), Anthropic's alignment assessment of the cybersecurity
    incidents (2026-09-11), and the AWS Bahrain data-loss, Salesforce disruption, Claude Cowork
    merge, Firefox Smart Window, Swift 6.4, Google Play review and bird-frame Show HN items
    (2026-09-16).

    Dropped on date. watchTowr's GNU inetutils telnetd analysis (CVE-2026-32746) is dated
    2026-03-19, Amazon Science's Verus post 2026-08-31, Cursor's Projects launch 2026-09-10, and
    Apple's EU Siri newsroom post sits under a 2026/06 path. All surfaced today at low point counts
    and none is a story for this date.

    Dropped on merit. Dream-RSI at 193 points was read and left out: the abstract reports only
    competitive or improved discovery quality with reduced cost in several settings, with no figure
    a reader can check, so ML research carries one paper rather than two. The PS5 Linux maintainer
    resignation at 311 points still rests on frvr.com alone, and the HN thread's own correction is
    that the trigger was an embargo violation over the last known hypervisor bug rather than LLM
    contributions as such, which the headline does not say, so it stays out for a second day. Hacker
    News is omitted as a section because the day's highest-discussion threads either resolve to a
    primary already published here or carry no technical correction worth a block. Reddit and social
    pulse is omitted on the degraded collection recorded above rather than on a considered call.

    Outages states no major items found. No status page in today's collection reports an open
    incident, and the Salesforce disruption of 2026-09-16 has no published root cause, with its
    record already dropped from the active-incidents endpoint, so there is nothing new to report on
    it.

    Apple gap worth naming. The archive tracked the macOS 27 betas and the 2026-09-02 block left a
    follow-up for the release date. The IPC Panic disclosure establishes that macOS 27, iOS and
    iPadOS 27, watchOS 27 and visionOS 27 release notes existed on 2026-09-14, so those releases
    have shipped, but no primary for the general release appeared in today's cache and the only
    candidate was an Ars Technica review at 113 points, which is secondary. The release itself
    therefore remains uncovered.

    Backtest. The run scored 74 candidate misses for 2026-09-16 and seeded zero causes, so there was
    no default to override. Two entries are flagged as watchlist_gap because they are engineering
    items no query reached: 49716265, an open-source attribution dispute with Google over copied
    code, and 49694035, a measurement study of local-inference efficiency per watt. The rest of the
    list is dominated by general-news and politics threads that are correctly out of scope, and by
    items the archive already carries.
