  notes: |
    First run of 2026-09-17. No digest existed for this date before this run, so nothing was
    displaced and every block below is an addition. Twelve blocks against a budget of 25, with no
    section at its cap. The story inbox is empty.

    Ranking. Top stories runs at three rather than four or five, because the fourth-ranked
    candidates, the PlanetScale TIN release and the QoRL query-planner write-up, are both bounded in
    a way the three leaders are not: TIN is GA only inside PlanetScale and its benchmarks are
    vendor-run, and QoRL is one author's unreproduced experiment. Both are published in their
    topical sections instead. The BragJack browser disclosure leads because it is the only item of
    the day with immediate user-visible exposure on software most readers are running, and because
    five vendors paid bounties on it.

    Deliberate claim limits. The BragJack post lists CVE-2026-0628 and CVE-2026-55945 in a table
    whose column alignment does not survive text extraction, so the block names both ids without
    assigning either to a browser. The post names no fixed version for any of the five browsers, and
    its closing section is a pitch for the publisher's own endpoint product, which the block states.
    GPUThor is labelled developing rather than confirmed: the paper states acceptance at CCS 2026
    and reports measured bit-flip rates, but there is no CVE, no NVIDIA statement and no independent
    reproduction.

    Unicode caveat. The Unicode 18.0.0 version page is dated 2026 September 16 and still carries
    preliminary-draft and beta-review status notices in several sections, including over the UCD
    data files. What supports the confirmed status is the enumerated-versions table, which lists
    Unicode 18.0.0 for 2026 with a release blog post alongside every prior released version.
    blog.unicode.org returned a rate-limit error on this run, so the announcement post itself was
    not read.

    Pages that would not load. ryan.science returns only the author's name for the driver's-license
    barcode signing-key post at 106 points, on both the bare and trailing-slash paths, so the day's
    one candidate on AAMVA signing keys is not published and the claim is not made anywhere.
    harnesstax.github.io returned its title and a loading marker, so the coding-agent harness study
    at 95 points could not be read. mimo.xiaomi.com/rl returned a reconnecting marker, so the Xiaomi
    Mimo 2.6 live post-training dashboard at 380 points is unverified and omitted.
    openai.com/index/reimagining-advertising-with-ai returns HTTP 403 from this environment again,
    as it did on 2026-09-16, so Sponsored Agents is omitted for the second day rather than sourced
    from coverage. Reuters returns HTTP 401 for both the OpenAI and Hugging Face probing report and
    the Spanish data-watchdog AI-agent breach report. netflixtechblog.com returns HTTP 403, so the
    Flink autoscaler post is omitted. OpenAI's disclosure of six new concerning-behaviour incidents
    exists in today's cache only as New York Times and Axios coverage with no reachable primary, so
    it is not published.

    Archive duplicates dropped. NVIDIA's CUDA Rust announcement reached 525 points today, second
    only to a Show HN already published, but it led the 2026-09-08 digest under the same
    developer.nvidia.com primary, whose schema gives datePublished 2026-09-08. Today is renewed
    attention, not a new disclosure, and the 2026-09-16 log was right to hold it out. Also dropped
    as already published: Cloudflare's post-quantum DNSSEC on 1.1.1.1 (2026-09-10), DeepSeek V4.1
    Flash pricing and routing (2026-09-10), Anthropic's alignment assessment of the cybersecurity
    incidents (2026-09-11), and the AWS Bahrain data-loss, Salesforce disruption, Claude Cowork
    merge, Firefox Smart Window, Swift 6.4, Google Play review and bird-frame Show HN items
    (2026-09-16).

    Dropped on date. watchTowr's GNU inetutils telnetd analysis (CVE-2026-32746) is dated
    2026-03-19, Amazon Science's Verus post 2026-08-31, Cursor's Projects launch 2026-09-10, and
    Apple's EU Siri newsroom post sits under a 2026/06 path. All surfaced today at low point counts
    and none is a story for this date.

    Dropped on merit. Dream-RSI at 193 points was read and left out: the abstract reports only
    competitive or improved discovery quality with reduced cost in several settings, with no figure
    a reader can check, so ML research carries one paper rather than two. The PS5 Linux maintainer
    resignation at 311 points still rests on frvr.com alone, and the HN thread's own correction is
    that the trigger was an embargo violation over the last known hypervisor bug rather than LLM
    contributions as such, which the headline does not say, so it stays out for a second day. Hacker
    News is omitted as a section because the day's highest-discussion threads either resolve to a
    primary already published here or carry no technical correction worth a block. Reddit and social
    pulse is omitted on the degraded collection recorded above rather than on a considered call.

    Outages states no major items found. No status page in today's collection reports an open
    incident, and the Salesforce disruption of 2026-09-16 has no published root cause, with its
    record already dropped from the active-incidents endpoint, so there is nothing new to report on
    it.

    Apple gap worth naming. The archive tracked the macOS 27 betas and the 2026-09-02 block left a
    follow-up for the release date. The IPC Panic disclosure establishes that macOS 27, iOS and
    iPadOS 27, watchOS 27 and visionOS 27 release notes existed on 2026-09-14, so those releases
    have shipped, but no primary for the general release appeared in today's cache and the only
    candidate was an Ars Technica review at 113 points, which is secondary. The release itself
    therefore remains uncovered.

    Backtest. The run scored 74 candidate misses for 2026-09-16 and seeded zero causes, so there was
    no default to override. Two entries are flagged as watchlist_gap because they are engineering
    items no query reached: 49716265, an open-source attribution dispute with Google over copied
    code, and 49694035, a measurement study of local-inference efficiency per watt. The rest of the
    list is dominated by general-news and politics threads that are correctly out of scope, and by
    items the archive already carries.

    Second run of 2026-09-17. The page already carried eleven blocks. I re-ranked the whole day
    rather than only my additions and displaced nothing, because nothing found on this pass outranks
    anything already published and no section was near its cap. The day goes from eleven blocks to
    sixteen against a budget of twenty five, with AI at two, Agentic coding at one, Security at two,
    Apple platforms at two and Engineering posts at two.

    Top stories stays at three and in the same order. I checked the new candidates against the three
    leaders and none of them clears the bar. The Mozilla and Mistral partnership is a
    model-selection change inside a beta, the OpenAI disclosure concerns an unreleased model in a
    training run the company says did not produce a shipped checkpoint, and the Flock work bears on
    one vendor's devices rather than on software the reader runs. Demoting rather than padding is
    the call, and each landed in its topical section.

    Gap closed from the earlier run. That run recorded that OpenAI's disclosure of six
    concerning-behaviour incidents existed in this date's cache only as New York Times and Axios
    coverage with openai.com returning HTTP 403. alignment.openai.com resolves from this
    environment, so the primary report and the index of the six reports are both readable and the
    item is now published from primary sources. openai.com itself was not retried, so Sponsored
    Agents remains unpublished for a second day.

    Claims deliberately limited. The Flock block is labelled developing rather than confirmed: the
    firmware facts are directly observable in a published dataset and the author names the exact
    partitions and files, but he states he did not test the two named CVEs against a device and did
    not try the extracted credentials, and Flock's statement says it received no report through its
    disclosure process and cannot assess the claims. The dataset was collected by a collective that
    took cameras from the field, which bounds how representative one image is. The block carries no
    key material, no MAC address, no serial and no coordinates, all of which the source publishes.
    The Mozilla block follows the post's own tense: it states Mistral Small 4 is coming to the Smart
    Window beta for users in the United States and Canada and gives no ship date, and Mozilla says
    it evaluated multilingual performance without publishing any result. The Apple block claims only
    what the README states, because nothing on the page establishes when the JSON-based project
    format itself appeared or which Xcode introduced it.

    Coverage changes since the earlier run. The YouTube backend recovered and now returns items with
    no degraded channel, so New videos is omitted on a considered call rather than on thin
    collection: no video in this date's collection carries a Hacker News or Reddit thread, and the
    guidance makes that discussion object both the filter and the ranker. The candidates without it
    were a Stanford talk on replacing TCP in AI clusters at 459 views, two Java 27 explainers
    covering a release already published on 2026-09-16, and commentary uploads that the bar excludes
    regardless of view count. Reddit re-ran and improved slightly to two of twenty eight subreddits
    on top-of-day and ten of twenty eight on day coverage, still under the floor of fourteen, and
    the recovered items are Azure and Google Cloud support questions plus r/programming links
    already covered here, so Reddit and social pulse stays omitted. The stars fetcher again returned
    an empty item list while reporting no degradation, which is the same unflagged failure as the
    earlier run, so the GitHub watchlist is still not covered by its own path. Both repositories
    published today were reached by direct fetch instead. Books returned only Springer conference
    proceedings again, which are not trade technical releases, so Books stays omitted. The events
    watchlist is empty on both active and upcoming.

    Pages that would not load, third attempt. ryan.science still returns only the author's name, so
    the driver's licence barcode signing-key post at 228 points is not published and its claim is
    made nowhere in this digest. harnesstax.github.io still returns a title and a loading marker, so
    the coding-agent harness study at 178 points remains unread. z.ai returned an empty body, so the
    GLM inference-infrastructure post at 187 points is unverified and omitted. All three are now
    repeat failures across runs and look like client-side rendering rather than transient errors.

    Dropped on date. The Cloudflare security-audit-skill repository reached the front page at 132
    points with 9,600 stars, but its commit feed shows an initial commit of 2026-06-18 and a last
    change of 2026-09-14, so today is renewed attention and not a release. The nine.ch write-up on
    responding to the Copy Fail kernel local privilege escalation is dated 2026-04-30. The CCC call
    for 40C3 is dated 2026-09-12. None is a story for this date.

    Dropped on merit or for want of a source. The Neovim thread at 247 points is a submitter reading
    a donation address on a block explorer and asking whether the project still holds the key. No
    maintainer statement and no project source appears in the thread, so there is no primary and the
    item is not published even as discussion. The Salesforce disruption is unchanged from the
    earlier run's finding, with no published root cause and no open incident on the status page, so
    Outages continues to state no major items found. A PHP maintainer deprecating a shim with
    roughly twenty million installs at 220 points was left out as the weakest thing that would go in
    Developer tools.

    Backtest. The tool scored 74 candidates for 2026-09-16 and again seeded zero causes. I am
    flagging four exceptions. Two repeat the earlier run's judgment because they are engineering
    items no query reached: the open-source attribution dispute with Google over copied code, and
    the intelligence-per-watt measurement study of local inference. I am adding the MinIO
    alternatives thread at 247 points as a third watchlist gap, because single-node object storage
    after the MinIO licensing change is a live migration question the queries do not cover. The
    Xiaomi Mimo post-training dashboard is a scrape gap rather than anything else, since the page
    returns a reconnecting marker and has now failed to render on two consecutive days. The rest of
    the candidate list is dominated by general news and politics that is correctly out of scope, and
    by items the archive already carries.

    The story inbox is empty.

    Third run of 2026-09-17. The page arrived with sixteen blocks and Top stories at three. I ranked
    what it carries against what this run found and displaced nothing, because every addition fits
    under the day budget and under its section cap. The day ends at twenty-three blocks against
    twenty-five, with Security outside both bounds.

    Re-ranking, and the one judgment a reader of the page cannot infer. I moved the VS Code
    Workspace Trust bypass into the lead slot ahead of BragJack, which the first run led with. The
    reasoning is population and remedy, not novelty. BragJack is the stronger disclosure on
    evidence: five vendors paid bounties and each case is fixed or triaged. The VS Code finding is
    single-sourced from a vendor blog and carries no CVE, which is why it is labelled developing.
    But it is unpatched, the researcher states Microsoft rated it moderate and declined an immediate
    hotfix, it works on the current release, and the trigger is the everyday act of cloning an
    unfamiliar repository and clicking a link. The evidence is checkable rather than asserted: the
    post quotes the shipped `_validateLink` function, which tests only whether a link exceeds 50,000
    characters, and the `allowCommands: true` literal on the source-editor path, against the webview
    path that derives the same argument from an explicit opt-in after CVE-2022-41034. I did not
    verify those excerpts against the VS Code repository on this run. If the weekly review disagrees
    with leading on a developing item, the fallback order is BragJack, VS Code, Rust.

    I considered demoting the GitHub Copilot Rust rewrite and the Unicode 18.0 draft out of Top
    stories, since neither carries operational impact and the Unicode item is a beta-review draft
    page. I left both in place. Top stories now runs at five, which is the cap, and I would rather
    state the doubt here than churn two blocks an earlier run already verified.

    Supply chain is the day's actual theme and no single block says so. Four separate items sit at
    the same boundary, where a tool acts on input it did not authenticate: an extension reaching a
    browser's built-in assistant, an untrusted workspace reaching the VS Code command registry, a
    fabricated error report reaching an autofix agent, and social engineering reaching a crates.io
    publisher. The CrowdSec statement is the fifth and the most consequential fact I could not
    develop.

    The TanStack compromise is uncovered and the archive has never mentioned it. CrowdSec states a
    component used in its organisation in May 2026 appears to have been backdoored to extract an API
    key with read access to its private codebase, and says the same vector accounts for the Mistral
    AI case. I have no primary for the TanStack incident itself: the statement's "more about it
    here" link does not survive text extraction, nothing in this date's HN, Reddit or query caches
    matches tanstack or the reporting party, and I had no search tool to reach it another way. The
    block therefore reports only what CrowdSec states about its own incident and attributes the
    vector to CrowdSec rather than asserting it. Two named companies losing private source to one
    backdoored dependency deserves its own block once a primary exists, and a query for it belongs
    on the watchlist.

    Claims deliberately limited. The Rust block is developing, not confirmed: the project confirms
    it issued the warning, but the campaign itself is the security response working group's stated
    belief, with no named victim, no published compromise and no malware found in a crate.
    PhantomFix is developing because the researcher is withholding the report, the trigger and the
    reproduction until a fix exists, and because Sentry has published nothing; the CVE and CERT/CC
    VU#212479 are the researcher's own citations. The CrowdSec block is confirmed for the leak and
    developing in substance on the vector, which the source itself calls "very likely". The GNOME
    block claims only what the release note states and does not assert a shipping date, since the
    note says major distributions will carry it "in the coming weeks".

    Date call worth overruling if the review disagrees. The PhantomFix page is dated 2026-09-14 and
    surfaced on r/netsec today. Earlier runs of this date dropped items dated 2026-09-10 and
    2026-09-12 as not stories for this date, and by that rule this one goes too. I published it
    because an unpatched vulnerability with no vendor fix is live rather than dated, and because the
    archive has never carried it. The block states the disclosure date.

    Outages stays at no major items found, and that is a considered call rather than an empty check.
    status.cursor.com carries an open incident opened 2026-09-17 at 15:20 UTC, "service degradation,
    Cloud Agents and Automations", moved to monitoring at 18:12 UTC, with Bugbot explicitly
    unaffected and no root cause published. A roughly three-hour degradation of one product surface
    does not clear a bar that reads "major", and the same page shows comparable degradations on
    09-14, 09-15, 09-16 and earlier today, so publishing this one would misrepresent it as unusual.
    No other status page in this date's collection reports an open incident.

    Dropped as archive duplicates. nginx CVE-2026-90439 with the 1.31.6 and 1.30.5 fixes was
    verified against nginx.org and then dropped: the 2026-09-16 digest already carries it with the
    same affected and fixed version ranges. AWS Bahrain and UAE permanent data loss reached 433
    points today across WSJ, Reuters, CNBC and circleid, and is already published on 2026-09-16.
    NVIDIA CUDA Rust, Salesforce, Java 27, Swift 6.4, Claude Cowork and the Google Play review item
    are all prior dates.

    Dropped on merit. Two GitHub advisories published today against @libp2p/peer-store and
    @libp2p/gossipsub are real, high-severity and well-documented, but the exposure is confined to
    applications that consume untrusted signed peer records, which is narrow against the rest of the
    Security section. Doyensec's Open vSwitch local privilege escalation, dated today, was left out
    for the same reason and is the strongest thing not published. The Apple documentation page for
    the Xcode project configuration file format, which would have closed the follow-up the
    xcode-project-format block left open, renders client-side and returned only its title, so the
    follow-up stays open for a second day. "Projects in Claude Code" on claude.com was posted today
    but was not fetched within this run.

    Pages that would not load, continuing from earlier runs. developer.apple.com documentation
    returns a title only. The three repeat failures the second run recorded, ryan.science,
    harnesstax.github.io and z.ai, were not retried on this run.

    Collection. Reddit is degraded for a third time on this date and is still under its floor, so
    Reddit and social pulse stays omitted as a section, but two of this run's seven additions came
    from r/netsec items that reached no other source, so the degraded Reddit path was still the only
    route to them. The GitHub stars fetcher returned an empty item list for a third time while
    reporting no degradation, which is a collection bug rather than a quiet day, and
    github.com/trending was again not checked, so the GitHub watchlist is uncovered for this date.
    The stars fetcher reporting success on an empty result is worth an improvement issue.

    Backtest. The tool scored 74 candidates for 2026-09-16 and seeded zero causes for a third time,
    so every candidate is uncaused rather than mis-caused, and miss_review supplies the exceptions
    rather than corrections. Four repeat the second run's findings: the Google open-source
    attribution dispute, the intelligence-per-watt measurement study, the MinIO single-node
    alternatives thread, and the Xiaomi Mimo dashboard, which is now a scrape gap on three
    consecutive days. I added the Wayback Machine access item at 646 points as a watchlist gap,
    since archival access terms are infrastructure a large number of engineering workflows depend on
    and no query reaches them. The remainder of the list is general news, politics and items the
    archive already carries, and is correctly out of scope.

    The story inbox is empty on all three runs of this date.
