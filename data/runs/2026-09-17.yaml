    Re-ranking, and the one judgment a reader of the page cannot infer. I moved the VS Code
    Workspace Trust bypass into the lead slot ahead of BragJack, which the first run led with. The
    reasoning is population and remedy, not novelty. BragJack is the stronger disclosure on
    evidence: five vendors paid bounties and each case is fixed or triaged. The VS Code finding is
    single-sourced from a vendor blog and carries no CVE, which is why it is labelled developing.
    But it is unpatched, the researcher states Microsoft rated it moderate and declined an immediate
    hotfix, it works on the current release, and the trigger is the everyday act of cloning an
    unfamiliar repository and clicking a link. The evidence is checkable rather than asserted: the
    post quotes the shipped `_validateLink` function, which tests only whether a link exceeds 50,000
    characters, and the `allowCommands: true` literal on the source-editor path, against the webview
    path that derives the same argument from an explicit opt-in after CVE-2022-41034. I did not
    verify those excerpts against the VS Code repository on this run. If the weekly review disagrees
    with leading on a developing item, the fallback order is BragJack, VS Code, Rust.

    I considered demoting the GitHub Copilot Rust rewrite and the Unicode 18.0 draft out of Top
    stories, since neither carries operational impact and the Unicode item is a beta-review draft
    page. I left both in place. Top stories now runs at five, which is the cap, and I would rather
    state the doubt here than churn two blocks an earlier run already verified.

    Supply chain is the day's actual theme and no single block says so. Four separate items sit at
    the same boundary, where a tool acts on input it did not authenticate: an extension reaching a
    browser's built-in assistant, an untrusted workspace reaching the VS Code command registry, a
    fabricated error report reaching an autofix agent, and social engineering reaching a crates.io
    publisher. The CrowdSec statement is the fifth and the most consequential fact I could not
    develop.

    The TanStack compromise is uncovered and the archive has never mentioned it. CrowdSec states a
    component used in its organisation in May 2026 appears to have been backdoored to extract an API
    key with read access to its private codebase, and says the same vector accounts for the Mistral
    AI case. I have no primary for the TanStack incident itself: the statement's "more about it
    here" link does not survive text extraction, nothing in this date's HN, Reddit or query caches
    matches tanstack or the reporting party, and I had no search tool to reach it another way. The
    block therefore reports only what CrowdSec states about its own incident and attributes the
    vector to CrowdSec rather than asserting it. Two named companies losing private source to one
    backdoored dependency deserves its own block once a primary exists, and a query for it belongs
    on the watchlist.

    Claims deliberately limited. The Rust block is developing, not confirmed: the project confirms
    it issued the warning, but the campaign itself is the security response working group's stated
    belief, with no named victim, no published compromise and no malware found in a crate.
    PhantomFix is developing because the researcher is withholding the report, the trigger and the
    reproduction until a fix exists, and because Sentry has published nothing; the CVE and CERT/CC
    VU#212479 are the researcher's own citations. The CrowdSec block is confirmed for the leak and
    developing in substance on the vector, which the source itself calls "very likely". The GNOME
    block claims only what the release note states and does not assert a shipping date, since the
    note says major distributions will carry it "in the coming weeks".

