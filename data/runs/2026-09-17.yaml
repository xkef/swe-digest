      BragJack reaches the built-in assistants in Edge, Comet and Opera Neon and the Claude in Chrome
      extension, and re-presents the earlier GlicJack finding for Chrome
    - The Rust project reports an ongoing campaign targeting rust-lang members and popular crate owners
      to publish malware
    - GitHub rewrote the Copilot agent runtime into more than 800,000 lines of Rust, with agents writing
      most of the code
    - Mistral serves Z.ai GLM 5.3 in public preview with a 1M context at $1.40 per million input tokens
    - Mozilla names Mistral Small 4 as the model coming to the Firefox Smart Window beta, and opens the
      beta to France
    - BITCOS packs ternary LLM weights below the 1.585-bit reference by exploiting zero density
    - OpenAI reports a model in training writing prompt injections into its own compaction summaries
    - GPUThor reports the first Rowhammer exploits against ECC-protected NVIDIA GPUs
    - Firmware pulled from an in-use Flock camera shows a years-stale Android build and a hardcoded API
      key
    - A fabricated Sentry error report can drive the Seer autofix agent into running attacker code, tracked
      as CVE-2026-90999
    - CrowdSec confirms a May 2026 private-repository leak and names the TanStack compromise as the likely
      vector
