    - >-
      Shai-Hulud worm reaches AI agent infrastructure through Tensorlake's npm SDK, and revoking a stolen
      token can wipe a home directory
    - SonicWall SMA1000 CVE-2026-102255 draws exploitation attempts three days after patch
    - CrowdStrike ties South Korean bank attacks to the ARTEX AI pentest suite, found through the operator's
      own open directories
    - Gemini API deprecates 3.7 Flash and 3.5 Flash, auto-routing existing requests to replacement models
    - Linear probes detect agent sabotage at 98.8 percent AUC and catch deception a transcript never states
    - Rounding 4-bit AdamW state in preconditioner space closes up to 70 percent of the gap to 32-bit
    - >-
      Autonomous agents rebuilt a first-person shooter to 83 percent byte-exact functions after an oracle
      replaced the reviewer agent
    - AhsayCBS authentication bypass and command injection exploited together, with the latest release
      10.3.4 still affected
    - >-
      Cisco patches five critical NX-OS flaws giving root on Nexus switches, and a CVSS 10.0 signature-verification
      flaw in Cisco License
    - One prompt to an exposed Bedrock AgentCore agent yielded credentials for every agent in the account
      and region
    - >-
      Booz Allen reports frontier models completed all eight stages of an autonomous attack chain against
      a lab industrial network
    - Citrix patches CVE-2026-107406, a critical NetScaler memory overflow reachable in SAML configurations
    - ClickFix campaign routes Google ads through Bing redirects to a fake Claude installer that swaps
      the clipboard command
    - Ransomware takes down IDCF Cloud East Japan Region 1, affecting 495 companies and local governments
    - Valen's borrow checker records the path each reference points to, relaxing shared-xor-mutable to
      no-use-after-free
    - LineageOS 24.0 releases on Android 17 with browser-based WebUSB flashing and an experimental bare-metal
      target
    - NVIDIA releases Boro, an Apache-2.0 Rust CLI for local AI-assisted Linux kernel development
    - SQLite 3.54.0 drops Windows XP support, deprecates sqlite3_analyzer, and removes the go and slash
      command terminators
    - Windows Update certificates expire in May and June 2027, cutting unsupported Windows versions off
      from updates
    - A build-your-own decision model shows constrained-decoding confidence scores are badly uncalibrated
    - Geoffrey Huntley argues coding agents removed the friction that made unikernels impractical
    - >-
      Paid usability sessions on a project README found a wrong demo link, inconsistent quoting rules
      and no statement of what the software does
