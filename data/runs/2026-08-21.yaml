    titles:
    - >-
      GitHub's CTO says the 7 hour 47 minute August 17 outage was a capacity failure, and reports Azure
      now serves 58 percent of platform load
    - Bun 1.4 ships the Rust rewrite, adds 1,517 Node.js test-suite passes, and cuts HTTP server memory
      by 13 to 48 percent
    - >-
      Linux 7.2 released with cache-aware scheduling and sched_ext sub-schedulers, and the DRM fair scheduler
      held back to opt-in after a late regression
    - >-
      DiffusionGemma fine-tunes a Gemma 4 mixture-of-experts model into a discrete diffusion model reporting
      roughly 1,500 output tokens per second on one H100
    - >-
      Codex CLI cannot set Bedrock explicit prompt-cache controls, and a reported production workload
      spent 85 percent of its model cost on cache writes
    - >-
      A fake recruiter's TypeScript coding challenge loads a second stage from jsonbin.io and pulls four
      modules from its command-and-control host
    - >-
      Mailpit reintroduced the cross-site WebSocket hijack it patched in January, because the origin gate
      reads the raw URI while the router reads the decoded path
    - >-
      Google Cloud us-west1 degraded for 3 hours 40 minutes across 27 products after optical maintenance
      congested the Dalles metro
    - Zellij 0.45.0 adds nested-session handling, the Kitty graphics protocol, and scrollback navigation
      by command
    - Rust 1.98.0 stabilizes algebraic floating-point methods and buffered integer formatting
    - >-
      Encore rebuilt its Firecracker image and boot tooling on Apple's Virtualization.framework, and reports
      one hypervisor capability it cannot reproduce
    - >-
      Torvalds traces repeatable Xe GPU job timeouts to a two-year-old flat CCS rounding bug that hands
      reserved VRAM back as usable memory
    - PgBouncer transaction mode leaks session state between clients, so one read-only transaction can
      make a whole pool reject writes
    - >-
      Lorin Hochstein reads the GitHub outage as an interaction failure and names the autoscaling policy
      that watched the service but not its Istio sidecar
    - >-
      HTML Can Do That collects native popover, invoker commands and hidden until-found, and its author
      adds warnings that several implementations fail accessibility
    - >-
      Cursor's Vicent Marti explains why distributed filesystems and object-level Git stores both failed,
      and what limits GitHub's Spokes replication today
    - Harvest moves to usage-based pricing after the Bending Spoons acquisition, and customers report
      bills rising up to 1500 percent
