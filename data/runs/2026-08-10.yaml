  notes: |-
    Quiet day, and the digest should read that way. Six stories selected against a 25 story budget.
    The reason is not thin collection on the Hacker News side, which came back healthy with no
    degraded backends. It is that most of the day's strongest security material was already
    published on earlier dates.

    Checked and deliberately not repeated: the Metabase advisories GHSA-vwf4-m7j8-wcjf,
    GHSA-r8h2-qpfx-mx59 and GHSA-8hmm-hrhg-ppqp and the downstream Framework customer breach were
    carried on 2026-08-07 and 2026-08-08. PortSwigger's webmail CSS research, the Head Mare TrueConf
    installer compromise, the CNBC report tying the rogue agent disclosures to the evaluation vendor
    Irregular, and the Claude Code auto mode default were all carried on 2026-08-09, and today's
    Hacker News front page recirculated all four. The GitHub advisories API was queried directly for
    reviewed critical advisories and the newest four are all dated 2026-08-07 (crypto-js
    CVE-2026-71851, CodeIgniter CVE-2026-63223 and CVE-2026-63221, Craft CMS GHSA-wg23-69c2-gjc8),
    each already published. Nothing reviewed and critical carries a 2026-08-08 or later date, so
    Security holds no separate item today and the only qualifying security story sits in Top
    stories.

    On the Blender MCP entry, only the repository facts are published as fact and they were read
    from the GitHub API, not from the submitted link. github.com/ahujasid/blender-mcp now resolves
    to MCPBlender/blender-mcp, 25,696 stars and 2,449 forks, created 2025-03-07. Four commits dated
    2026-08-09 between 19:42 and 20:56 UTC are authored as MCPBlender with the address
    owner@blendermcp.org, are unsigned, carry no linked GitHub account, and bump the version to
    1.9.2. One is titled as a telemetry, security and reliability fix and is the commit the Hacker
    News thread flags. An earlier commit dated 2026-08-08 is authored by GitHub user SerenityUiX
    under a different display name. PyPI still serves blender-mcp 1.8.0 and lists ahujasid as the
    sole owner, so the published package does not yet carry those commits and the exposure is to
    anyone pulling addon.py from the repository. The account compromise claim itself rests on a post
    on x.com, which this run did not read, so it is not attributed to any named person and the story
    is carried as developing rather than confirmed.

    Held for want of a primary source: the Illinois Children's Online Social Media Safety Act,
    HB5511, which reached Hacker News at 119 points. The only source available was a secondary
    outlet carrying editorial commentary, and the bill text was not read, so a story about operating
    system and app store obligations was not published on that basis alone. The Microsoft Research
    paper on GitHub Copilot at production scale was fetched and returned bytes that did not extract
    to readable text, so it was dropped rather than summarized from its title.

    Two fetch failures are worth a fix outside this run. swift.org and python.org both return gzip
    bytes that fetch_url hands back undecoded. The swift.org case was already recorded on
    2026-08-09, so this is a repeat and it is now known to affect at least two hosts rather than
    one. It blocked the July 2026 Swift release post and the Python 3.14.7 release page in the same
    run. The Metabase blog post URL returns a redirect loop, matching the note in the 2026-08-08
    digest, though the GitHub advisories for the same disclosures are reachable.

    Backtest: three causes corrected. The Dark Hours retraction chain and the DeepMind WeatherNext
    cyclone forecasting item are genuine engineering misses that no watchlist query matched, and the
    melatonin study matched only because the word cognition collides with a tracked entity name.

    Second run of the day. The 03:47 run published five stories against a quiet morning. The 10:51
    refetch changed the day: three items landed that were not available earlier, and one of them
    outranks everything the morning had.

    Ranking. Top stories reaches its cap of exactly four with Muse Glimmer added as the new lead, so
    nothing is displaced. The existing three keep their relative order below it. Muse Glimmer leads
    because it is a permissively licensed 30B model from a frontier lab that runs on one consumer
    GPU, which changes what a working engineer can deploy locally, and the Blender MCP item it
    displaces from the lead is still unattributed-commit evidence rather than a confirmed
    compromise. Torvalds and the gym item went to their topical sections rather than padding Top
    stories.

    Muse Glimmer facts are from the Meta blog dated 2026-08-10 and the Hugging Face API. The
    repository meta-models/Muse-Glimmer-30B was created 2026-08-09T17:51 UTC, carries license
    apache-2.0, and reports 29,776,626,688 BF16 parameters. Worth flagging for a later run: the repo
    ships a USAGE_POLICY.md alongside the Apache-2.0 LICENSE, so "permissive" may carry conditions
    the license text alone does not show. Nobody has read that file yet. All benchmark comparisons
    against Gemma4-31B and Qwen3.6-27B are vendor figures with no independent reproduction, and the
    digest does not restate them.

    The gym story is carried as developing on purpose. ABC is a credible outlet and the account is
    detailed, but the central technical claim, that the booking API runs no authorization check on
    cancelling other people's reservations, exists only as a quote from the agent's own message
    relayed by an anonymous user. The software vendor declined to discuss it and Anthropic did not
    respond. That is not enough to write the vulnerability as fact, so the block attributes it
    rather than asserting it. It does fill Security, which the morning run left as "No major items
    found."

    Deliberately not published: Docker Sandboxes, despite 239 Hacker News points and direct
    relevance to the agent sandbox-escape thread this digest has tracked since 2026-07-23. There is
    no dated announcement. The product page reports datePublished 2026-01-30 and dateModified
    2026-07-15, the Docker blog's most recent sandbox post is dated 2026-08-03, and the page's own
    FAQ calls the feature Experimental. It is a resurfacing, not a release, and publishing it would
    imply news that is not there. If Docker posts a dated launch, it is worth picking up.

    Access notes worth changing. lore.kernel.org answered normally this run, including the search
    interface and the Atom feed, which contradicts the 2026-07-26 note recording an Anubis
    proof-of-work gate. That note should be re-verified or closed, since it currently discourages
    fetching a primary source that works. Separately, huggingface.co HTML returns 401 to automated
    fetch but the api.huggingface.co JSON endpoints answer fine, which is how the model facts above
    were confirmed. That is worth recording as a per-host fallback.

    Still blocked. python.org and swift.org continue to hand back undecoded gzip, now for a third
    run, so Python 3.14.7 and the Swift July 2026 post remain unpublished. The obvious fallback does
    not work either: the CPython GitHub releases API returns an empty array because the project does
    not cut GitHub releases. This needs a fix in fetch_url rather than another workaround attempt.

    Thin sources elsewhere, which is why those sections are absent rather than weak. Books returned
    only Springer conference proceedings, which are not trade releases with engineering relevance.
    The events watchlist is empty for the date. The stars fetch returned two events total. ML
    research produced nothing clearing the bar.

    Backtest. The morning run corrected three causes for 2026-08-09 but the re-run reseeded
    defaults, so those are re-asserted here along with two the morning missed. Both additions are
    genuine engineering misses no query caught: "Hardware backdoors in some x86 CPUs" at 350 points,
    which is squarely security and should not have needed a lucky query, and "My server is a phone
    now" at 427 points. The melatonin study is a false entity match, matching only because the word
    cognition collides with a tracked entity name.

    Third run of the day. The 03:47 run published five stories, the 10:51 refetch reranked around
    Muse Glimmer, and the 16:38 refetch produced four additions and one resolved follow-up. The day
    moves from 8 stories to 12 against a 25 story budget. It is still a quiet day and should read as
    one.

    Resolved follow-up, and the most important thing this run did. The 10:51 run flagged that
    meta-models/Muse-Glimmer-30B ships a USAGE_POLICY.md next to the Apache-2.0 license text and
    that nobody had read it. This run read it at the raw endpoint, which answers where the HTML
    401s. It is a Llama-style acceptable use policy with real field-of-use restrictions: no
    military, warfare, nuclear, espionage, or ITAR-controlled applications, no operation of critical
    infrastructure, transportation technologies, or heavy machinery, not intended for anyone under
    18, and no action to circumvent usage restrictions or safety measures disabled by Meta.
    Apache-2.0 carries no field-of-use restriction, so the two documents do not say the same thing.
    The block keeps its existing title so the write step edits in place rather than deleting and
    re-adding, but the title's unqualified "under Apache 2.0" now understates the grant, and the
    review step should consider qualifying it. This run does not state whether the policy is legally
    enforceable alongside an Apache-2.0 grant, because that is a legal question and no source
    addresses it.

    Ranking. Top stories was already at its cap of four, so adding tl;dv required a displacement.
    Gradle 9.7.0 lost the slot and moved to Developer tools. It is a real release but the notes are
    dated 2026-08-06, the feature is not on by default and not recommended for production, and it
    was the weakest of the four. The tl;dv report is an unremediated exposure affecting 84,312 users
    across 35,003 domains including government and university domains, with live conference IDs
    among the exposed fields. Muse Glimmer stays the lead over tl;dv because it is confirmed, it is
    the day's largest thread at 663 points against 307, and its ecosystem reach is broader. tl;dv is
    second because security exploitability weighs heavily but the account is single-source and
    unconfirmed by the vendor.

    tl;dv is carried as developing on purpose, on the same standard applied to the gym story on the
    10:51 run. The researcher is named, the account is specific and internally consistent about the
    mechanism, and the numbers are precise. Against that, there is no vendor statement, no
    independent reproduction, and this run did not and will not attempt to verify the vulnerability
    by querying the database. One inconsistency is worth recording: the post is bylined 2026-08-04
    but its body says "It is now July 2026" and its timeline table ends at July 2026, so the
    researcher's last stated verification is July, not August. The digest therefore does not claim
    the exposure is open today, only that the researcher states it was unfixed as of July 2026. The
    post also describes the researcher joining two live third-party calls he was not invited to.
    That is reported as part of the account and is not endorsed.

    Docker Sandboxes, reversed from the previous run but not upgraded. The 10:51 run declined it for
    want of a dated announcement. That check was repeated and the result is the same: the Docker
    blog's nearest posts are 2026-08-03 and 2026-07-28 and neither announces a release, and the
    product page carries a New label only in navigation. Rather than drop a 465 point thread a
    second time, it is carried in Hacker News as discussion, where the section's purpose makes clear
    the signal is the thread and not a launch. If Docker posts a dated launch it should move to
    Developer tools as a release.

    Checked and rejected. "Tail-call optimization in C is relatively recent" at
    lwn.net/Articles/1034703/ reached 77 points and looks like a new LWN article. It is not. The
    fetched page is a reader comment posted 2025-08-21 on an older article about Python and tail
    calls, resurfacing a year later. Publishing it as an LWN piece would have been wrong. The FT
    story on Zuckerberg and open models at 74 points was not fetched and is not published, because
    the open-weights question is better served by the primary USAGE_POLICY.md this run actually read
    than by a paywalled secondary account of strategy. "Deletes all instances of Microsoft's GDID"
    at 64 points and "Ransomware gangs skip the CEO" at 71 points had no primary source worth
    citing.

    Sections omitted for lack of material rather than lack of looking. Books returned only Springer
    conference proceedings for a third consecutive run, so the section stays absent. New videos is
    absent because no watchlist video carried an HN discussion link, and the per-source bar ranks on
    external validation rather than channel size or view count. The stars fetch returned two
    repositories total, one of which is an agent sandboxing tool at 1,965 stars that is on-topic but
    has no release, post, or discussion behind it. ML research produced nothing clearing the bar.
    Outages stays "No major items found" after checking the HN corpus, with no incident surfacing.

    Still blocked, third and fourth run running. python.org and swift.org continue to return
    undecoded gzip through fetch_url, so Python 3.14.7 and the Swift July 2026 post remain
    unpublished across three runs. This needs a fix in fetch_url, not another workaround. Two access
    notes need owner action and cannot be changed from this step: an-0019 records lore.kernel.org
    behind an Anubis proof-of-work gate, which the 10:51 run contradicted by fetching it
    successfully including the search interface, and there is no note recording that huggingface.co
    HTML returns 401 to automated fetch while api.huggingface.co and the /raw/ endpoints answer
    normally. That /raw/ fallback is what made this run's usage policy finding possible and is worth
    recording as a per-host note.

    Backtest. The five corrections re-asserted here are the same exceptions the earlier runs found,
    because the re-run reseeds defaults each time. All four watchlist_gap items are genuine
    engineering misses no query caught, and the Dark Hours item is the clearest proof of that, since
    it became a Top stories block on 2026-08-10 after being missed entirely on 2026-08-09. The
    melatonin study is a false entity match, matching only because the word cognition collides with
    a tracked entity name.
