    On the crypto-js facts and their limits. CVE-2026-71851 is scored CVSS 3.1 9.0 and affects
    crypto-js below 4.0.0. The advisory states that a nominal request for 128 or 256 bits from
    CryptoJS.lib.WordArray.random() yields effective search spaces of roughly 2^39 and 2^47. The
    weak generator entered in 3.1.2-4 in June 2014, was present in every 3.x release except 3.2.0
    and 3.2.1, and 4.0.0 replaced it with the platform cryptographic API. Coinspect's Ill Bloom
    investigation, dated 2026-08-05, confirmed downstream wallets used the function as the entropy
    source for BIP39 recovery phrases and puts the measured lower bound of stolen assets at about 5
    million dollars as of 2026-07-13 across two drain waves. The important qualifier for a reader,
    and it should survive into the summary: an application is affected only where that function
    generated a security-sensitive value. Merely depending on crypto-js below 4.0.0 is not
    sufficient. I did not fetch illbloom.org and did not link it.

