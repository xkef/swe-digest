    - 'WeWorm: a zero-click worm that spreads through WeChat calls across iOS and Android'
    - OpenAI's Navier-Stokes writeup puts 300 billion output tokens behind the run
    - An LLM-assisted patch series speeds Linux kernel builds by 36 to 90 percent
    - Terence Tao says good open mathematical problems are being mined non-renewably
    - Inception releases Mercury 2.5, a diffusion LLM at 1,107 tokens per second
    - Kimi K3's full 2.8T weights run on one MacBook Pro with experts streamed from four SSDs
    - A study of the June 2026 agent wiki finds copying alone explains most collective behavior
    - DeepMind publishes AlphaGenome Atlas, a 1-petabyte precomputed map of 9 billion DNA variants
    - An HN thread on a coding-agent brevity skill finds 8.7k lines wrapping a 140-line prompt
    - Copperhead is an Apache-2.0 agent that edits real KiCad files behind ERC and DRC gates
    - PyPI publishes an incident report on two weeks of intermittent file-hosting failures
    - systemd 262-rc2 adds a canary to its AGENTS.md to catch unreviewed AI contributions
    - The Document Foundation sets six conditions before LibreOffice ships AI by default
    - Replacing a 16-byte Rust enum with a 64-bit tagged word made every interpreter benchmark faster
    - A 40-year-old off-by-one in XNU gives the first UNIX-domain socket a changing inode
    - Linux kernel patches would delete about 55,000 lines of deprecated 32-bit ARM platform code
