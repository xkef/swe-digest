  notes: |
    First run of 2026-09-09. The digest file was the empty template, so nothing was displaced and
    the whole day is new selection.

    The 2026-09-08 digest was read first and it constrained today heavily. It already carried the
    Navier-Stokes dispute, the Alpoge and Buckmaster paper, Mistral's 3 billion euro round, NVIDIA
    CUDA Rust, the PostgreSQL SQL/PGQ revert, FreeBSD 14.5, CERN's CentOS to Debian move, the
    Qwen3.8 quantization benchmark and the jyn.dev security post. All of those were still high on
    today's HN cache and all were excluded as already published. Roughly half of what the fetchers
    surfaced today was yesterday's digest read back.

    Section shape a reader cannot infer. Security reads empty even though the day's lead is a
    security story: WeWorm is the strongest item of the day on both the security and the
    AI-capability axis, so it took the lead slot, and nothing else in today's collection cleared the
    Security bar on its own. The 40-year XNU inode bug went to Apple platforms rather than Security
    because the author states explicitly it is not interesting from a security standpoint. Outages
    carries the PyPI report rather than the lead. Books was omitted because the publisher feeds
    returned only Springer LNCS conference proceedings, which are not technical book releases. New
    videos was omitted because the single collected video, an AI Engineer workshop on LLM inference
    at scale, carried no discussion link and 6,258 views, and this step cannot verify YouTube page
    content. Markets, Infrastructure, Engineering posts and Reddit and social pulse were omitted for
    lack of anything that outranked what is already here.

    Calls made against sources that would not load. openai.com returned HTTP 403 again, as it did
    yesterday, so the OpenAI Navier-Stokes post is not linked and the story is built on Simon
    Willison's write-up, which quotes both the OpenAI announcement and Buckmaster's statement at
    length. The figures now published (4.9 million agent messages and about 300 billion output
    tokens overall, 2.7 million messages and about 130 billion for Navier-Stokes, 88 hours to
    resolution and 17 hours of Lean verification) are the ones yesterday's run had to drop for want
    of a readable source, and OpenAI's statement that it cannot rule out that de-identified data
    derived from product usage improved the models is the genuinely new fact. Buckmaster's statement
    PDF at cims.nyu.edu fetched successfully but extracted to no readable text, so it is not cited
    directly. Meta's Muse was dropped: ai.meta.com/muse is JS-rendered and returned only page
    metadata, so a 441-point launch has no verifiable technical content behind it. ChatGPT Images
    2.5 was dropped for the same openai.com 403. The reported resignation from Anthropic was
    dropped: the only sources are an X account this step cannot tie to a named person and a WSJ
    article behind a paywall, and the social-attribution rule forbids naming someone from an
    unverified handle. The Bloomberg report that Anthropic walked away from a 6 billion dollar
    Decart purchase was dropped again on the known bloomberg.com 403. The npm publish incident found
    under the npm query resolved on 2026-09-03 and is stale, not today's news.

    Content-safety note worth recording. Two of today's items are about instructions deliberately
    planted for agents to follow: the systemd and NetworkManager AI canaries, and the AGENTS.md in
    the i-have-adhd repository that an HN commenter reports directs agents to post to a GitHub
    issue. Both were treated as data. The systemd canary text is paraphrased rather than reproduced,
    because republishing the literal instruction would propagate it to any agent reading the digest.

    Backtest. The tool reported 71 candidate misses for 2026-09-08 and seeded zero default causes,
    so the causes in miss_review are supplied rather than corrected. The actionable finding is a
    real watchlist gap around Google DeepMind: AlphaGenome Atlas at 471 points and WeatherNext 3 at
    275 points both scored no_query_match, and the watchlist carries AlphaFold and protein folding,
    which both returned empty today, but no query for DeepMind itself. Muse and the Kimi K3 laptop
    benchmark were both not_in_publish_fetch, meaning they landed after the publish-time fetch,
    which is a scrape gap and not an editorial miss. The LG smart-television investigation at 1,117
    points is marked relevance_skip rather than a miss because the 2026-09-07 digest already led
    with it and yesterday's run recorded dropping the follow-on coverage for carrying no new
    development. Today's LG items are again only new outlets on the same Gamers Nexus report, so
    they were skipped a second time.

    Ranking. This is a later run of 2026-09-09 against a digest that already carried 16 stories. I
    kept the WeWorm zero-click WeChat worm as the day's lead: it is confirmed, patched, and the most
    operationally concrete item. The Navier-Stokes priority dispute is the day's largest thread by a
    wide margin (1829 points on Buckmaster's statement, 1272 on the OpenAI post, plus TechCrunch and
    Science coverage) and I ranked it directly under the lead rather than at it, because it rests on
    allegations from one party that OpenAI only partly corroborates. It replaces the earlier
    token-count block rather than sitting beside it, since the same 300 billion output token figure
    and the same "cannot rule out de-identified data" line appear inside the dispute story. The
    earlier run had explicitly dropped the dispute as unsourced. It is now sourced.

    Sourcing gaps in that story. cims.nyu.edu returned Buckmaster's statement PDF at HTTP 200, but
    text extraction produced no usable prose (searches for "Navier", "OpenAI", "Millennium" and
    "Codex" all returned nothing, so the extractor likely emitted glyph data for a math-heavy
    document). I link it as the primary document but every quoted claim in the block comes from
    TechCrunch quoting it, and the block should say so. science.org returned HTTP 403, so the
    Science article is cited only as an HN discussion link. openai.com returned 403 to the earlier
    run and still is not linked directly.

    Not published. DeepSeek v4.1 Flash drew 167 points but the HN submission has no primary link,
    and api-docs.deepseek.com still lists only deepseek-v4-flash (V4-Flash-0731) and deepseek-v4-pro
    (V4-Pro-0813) with no 4.1 entry. Unverified, so it is out rather than filed as rumor. Meta's
    Muse took 565 points but ai.meta.com/muse returned only page metadata and no feature text, so
    there was nothing to state as fact about a major product launch. That absence is the finding,
    not a quiet Meta day.

    Outages. The section carries only the PyPI incident report because that is all there was. I
    checked githubstatus.com (all systems operational, no incidents 2026-09-05 through 2026-09-09)
    and status.npmjs.org (all operational, the npm publish failures resolved 2026-09-03). The HN
    items about npm publish failures and GitHub EU 401 errors do not correspond to any open
    incident.

    Security. Still no qualifying advisory beyond WeWorm, which sits in Top stories, so the anchor
    line stands. The Google Ads post at 146 points (an indie developer's account suspended for
    "Malicious software" over a Rust terminal multiplexer, reinstated after the HN thread) is
    platform enforcement rather than a vulnerability. I considered it for Engineering posts and
    dropped it as the weakest thing that would have been in the digest.

    Also considered and left out: iTerm2 3.7.0, the Postgres 19 property-graph revert, Apple's
    Sonera acquisition, Anthropic walking away from Decart, and the opusfived agent-constraint
    challenge. None outranked what is above, and the day sits at 23 of 25 with no section over cap.

    Coverage. Reddit came back degraded again: top-of-day reached 2 of 28 subreddits and day
    coverage 8 of 28 against a floor of 14. That is a small improvement on the earlier run's 6 of 28
    and still short. The GitHub stars fetcher reported no degradation but returned a single starred
    repository for the whole window, which is thin enough to be worth watching. Hacker News, papers,
    books, events and YouTube were clean.

    Memory. The followups store is stale relative to this run: the newest entries are dated
    2026-08-30 and the bulk 2026-07-26, so nothing in it bore on today's ranking except DeepSeek,
    whose tracked funding pause did not connect to the unverified v4.1 report. Worth a pass in a
    later step.

    Re-ranking run. The day's digest already carried 21 stories from an earlier run, and the main
    thing it did not have was Apple's 2026-09-09 event, which landed at roughly 17:30 to 18:20 UTC,
    after that run published. Both Apple blocks are built on the apple.com newsroom press releases,
    which fetched cleanly with full body text.

    Top stories re-ranked rather than extended. iPhone Duo takes the fifth slot and the systemd
    262-rc2 AGENTS.md canary comes out. The canary is a good technique and it was correctly
    published, but it is one project's release-candidate convention, and a foldable iPhone with a
    second layout target, Split View, new SDK APIs and upcoming Xcode Device Hub support is broader
    ecosystem pressure. WeWorm stays as the lead. That is a deliberate re-rank, not a run that
    stopped adding.

    Deliberately not published, where the absence is the finding. Apple also announced AirPods 5,
    Apple Watch Series 12, and the non-Pro iPhone 18 Pro hardware specifications. The A20 Pro
    figures are concrete and primary-sourced (2nm, 6-core CPU with integrated Neural Accelerators,
    7-core GPU up to 40 percent faster than A19 Pro, Dual 16-core Neural Engine, 50 percent more
    memory bandwidth), but a specification recital is the weakest thing that could sit in Apple
    platforms next to the keychain migration break and the XNU inode bug, so it was left out rather
    than used to fill the section to its cap. Four Apple blocks on one day would have been section
    padding. The day closes at 24 of 25 stories and no section is over its cap.

    One fact worth flagging to the weekly review that no story carries: the iPhone Duo press release
    attributes its quote to "John Ternus, Apple's CEO". That is Apple's own primary source naming a
    CEO other than Tim Cook. No dedicated announcement of a leadership transition resolved from this
    run, so it was not written up as a Markets and companies story on the strength of a quote
    attribution alone. It is worth a targeted check on the next run.

    DeepSeek v4.1 Flash re-checked and dropped again. The HN submission (49624603, 368 points) is a
    self-post with no primary link, and api-docs.deepseek.com still lists only deepseek-v4-flash,
    deepseek-v4-pro and deepseek-v4-flash-vision-exp, with no 4.1 entry. The earlier run's drop was
    correct and the situation has not changed.

    Also considered and not published: the Google Ads suspension of the RACE terminal multiplexer
    (49624856, 291 points). The page now carries a new development the earlier run could not have
    seen, that the account was reinstated after the HN thread with no explanation of what triggered
    the suspension. It is a real platform-governance account with a documented appeal loop, but it
    is one developer's account and it did not outrank anything already on the page, so nothing was
    displaced for it. The opusfived.dev item was the day's highest-scoring new submission at 766
    points, and its landing page carries two sentences and no technical content, so there was
    nothing verifiable to state as fact. A reported GitHub CI 401 outage in the EU sat at 3 points
    on a community discussion thread with no status-page confirmation. A Trezor postal-mail QR
    attack write-up sat at 2 points on an unfamiliar domain with no corroboration, so it was not
    used and Security correctly stays at no major items beyond WeWorm.

    Memory hygiene finding. The followups store is stale against the day. Its 13 entries have
    last_seen dates no newer than 2026-08-30, and several track July threads. Nothing in it covers
    the stories actually running this week: the Navier-Stokes provenance dispute, WeWorm, or the
    Tailwind and Shopify deal. Watchlist follow-ups could not be written from it. This step holds no
    write capability on memory, so it is recorded here for the review rather than fixed.

    Backtest note. The 2026-09-08 backtest returned 71 candidates and seeded zero default causes, so
    nothing was overridden. The miss_review entries are additions rather than corrections.
    AlphaGenome Atlas is the clearest genuine miss, since it is a DeepMind release that no query
    matched and today's digest carries it. Muse and the Kimi K3 MacBook run are timing rather than
    judgment, both marked not_in_publish_fetch by the backtest itself. The large no_query_match tail
    is dominated by general-interest front-page items that are correctly out of scope for this
    digest, so it was not enumerated.

    Sources that would not load or came back thin are listed in the degraded field. No fetch in this
    run was refused or returned an error status.
