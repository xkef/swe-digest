    titles:
    - Protocol Labs ends Shipyard's funding, and Kubo, Helia, Boxo, ipfs.io and dweb.link lose their maintainers
      on 2026-09-30
    - Microsoft Paint and Photos embed a server-issued GUID as an invisible pixel watermark in images
      generated locally on the device
    - >-
      Alabama's attorney general subpoenas OpenAI over the eval-sandbox escape that attacked Hugging Face,
      and demands the name of every employee, officer and agent who raised security concerns
    - >-
      NVIDIA puts Groq 3 LPX into full production, and cites an Artificial Analysis figure of 3,400 output
      tokens per second on Gemma 4 31B at 100,000 tokens of context
    - >-
      OpenAI's API pricing page lists GPT-5.6 Sol at 4 dollars per million input tokens and 20 dollars
      per million output, promotional at least through 2026-11-21
    - Paper maps 84 suspected cases of agent-driven demand surges on government services across 11 jurisdictions
    - >-
      Steve Yegge reports running 50 to 60 agents on 21 Claude Max accounts, and finds they built a rule
      system rather than an engineering system
    - >-
      CISA adds an Oracle HTTP Server and WebLogic Proxy Plug-in access-control flaw to the exploited
      catalog with a 2026-08-27 federal deadline
    - >-
      A Beam Living GraphQL query accepted any email address and returned that applicant's SSN digits,
      date of birth, address and credit score
    - DigitalOcean's API and Cloud Control Panel returned elevated 5xx twice on 2026-08-24, with running
      droplets unaffected
    - GitHub blames the 2026-08-24 Actions start delays on a node that failed its disk but kept reporting
      healthy
    - CPython adds RISC-V as a PEP 11 tier 3 platform
    - >-
      Sign in with Apple moves new relay addresses to private.icloud.com, and Apple reverses the plan
      to move iCloud+ Hide My Email off icloud.com
    - Intel posts an RFC for DRM Fabric, a vendor-neutral topology layer for GPU and accelerator scale-up
      interconnects
    - >-
      NVIDIA sets RVA23, ACPI, PCIe coherency and peer-to-peer PCIe as its requirements for CUDA on RISC-V,
      and points at a SiFive demo
    - >-
      A prototype replaces ELF with SQLite as the executable format and packs 723 binaries and 400 libraries
      into one 611.9 MiB database
    - Proofcraft completes the seL4 confidentiality proof on AArch64, closing the security proof stack
      for 64-bit Arm
    - A post arguing that AI reliance will stop engineers acquiring expertise draws 468 comments
    - Cursor users report new Ultra plan usage limits dated 2026-08-24, and this run found no vendor primary
      stating them
