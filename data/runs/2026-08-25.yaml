date: '2026-08-25'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    First run of 2026-08-25. The page was the empty template, so nothing was displaced and this
    selection is the whole day as it stands. Fourteen stories against a budget of 25, no section
    over its cap of four.

    Hacker News came back healthy for the first time in several days, and that is most of why today
    looks full. The 2026-08-24 page recorded a stalled HN corpus across three fetches spanning about
    fourteen hours while the fetcher reported no degradation. Today's backtest confirms the cost:
    IPFS winding down, the Paint watermark research, the SQLite executable prototype and the seL4
    confidentiality proof all broke on 2026-08-24 and none reached that page. Four of today's items,
    including the lead and the second story, are yesterday's news recovered rather than today's news
    found. Anyone reading the two pages side by side should know that.

    Top stories ranking. IPFS leads on a dated operational deadline against named infrastructure:
    Shipyard stops IPFS work on 2026-09-30, Kubo, Helia, Boxo, Rainbow, IPFS Desktop, IPFS Companion
    and IPFS Check lose dedicated maintainers, contributions to go-libp2p and js-libp2p cease, and
    ipfs.io, dweb.link, check.ipfs.network, delegated-ipfs.dev, the bootstrap nodes and
    Wikipedia-on-IPFS stop being operated, with Protocol Labs deciding their future. The Paint
    watermark is second on evidence quality and reach: the research traces the GUID from a
    moderation POST through Watermarker.dll into the pixels and then finds the same value in the
    signed C2PA soft-binding assertion of a saved PNG, and the author obtained a live server
    response to confirm it. The Alabama subpoena is third as a first-of-kind regulatory action on an
    incident this archive has tracked since 2026-07-21. Groq 3 LPX is fourth and is the weakest of
    the four: it is a vendor press release, the 3,400 tokens per second figure is attributed to
    Artificial Analysis rather than published by NVIDIA with a method, and the 4x responsiveness
    claim has no method at all.

    Not published, and the absence is the finding. AI has no section today. The day's AI items were
    the Groq launch, which is in Top stories, the GPT-5.6 Sol price reduction, which the 2026-08-22
    page already carries from the same pricing page, and a set of NVIDIA partner announcements with
    nothing an engineer acts on. Markets and companies is omitted because both of its candidates
    were unreadable: the Anthropic IPO report is behind a NYT 403 and the NVIDIA price increase
    report is behind a Reuters 401, and neither is worth publishing from a headline. Developer tools
    is omitted: Neovim 0.12.5 is a patch release whose release page carries no changelog text, and
    nothing else cleared the bar. Watchlist follow-ups is omitted because its one live update, the
    Alabama subpoena on f-0030, is strong enough to lead a section rather than trail one, and a
    story holds one place.

    Dropped with reasons. The Xiaomi XRing O3 thread was the day's second highest at 739 points and
    is not published: its only source is a post on x.com, no primary benchmark exists, and the
    numbers in the thread come from an HN commenter rather than from a publisher. The Google
    bughunters post on AI-assisted C and C++ to Rust rewrites would have been a good Engineering
    posts item and could not be read. Qualcomm's Linux upstreaming record is a twelve-day-old
    social.kernel.org post at 10 points, and its substance belongs to a mailing-list thread rather
    than to today. The Blackstone data exposure sits in Security rather than Top stories because the
    flaw was patched around 2026-07-09 and today is publication rather than exposure.

    miss_review. The backtest scored 46 candidates for 2026-08-24 and seeded no causes, so the
    entries below are supplied rather than corrected. Two are false entity matches that the query
    corpus surfaced and that no digest should have carried: a hobby PC emulator matched on Rust, and
    an opinion piece matched on AI. The Xiaomi CPU thread is marked out of scope on the same ground
    the story was dropped today. Five are genuine engineering misses and all five carry scrape_gap
    rather than watchlist_gap, because the 2026-08-24 page documents the stalled fetch that caused
    them and the queries were not at fault. Five are legitimate skips of material this archive
    published on 2026-08-22 or 2026-08-23. The remaining candidates are general news, hobby projects
    and Show HN items that no cause needs to explain.

    Second run of 2026-08-25. The page already carried 19 blocks. This selection adds 7 and
    displaces nothing, giving 26 blocks, of which 24 count against the 25 day budget once the two
    Security blocks are excluded. No section reaches its cap of 4: Engineering posts and Outages go
    to 3, AI, ML research, Agentic coding and Infrastructure to 2, and Developer tools opens at 1.

    Top stories is deliberately empty in this output, and that means unchanged, not cleared. The
    four published Top stories still rank above everything I found today, and nothing here was
    promoted into the section. One call the weekly review should see: the earlier run's own review
    recorded Groq 3 LPX as the weakest of the four, a vendor press release whose headline figure is
    attributed to Artificial Analysis with no published method, which is two of the explicit
    rank-lower criteria. I considered demoting it to AI and did not, because the section is not
    full, the day budget is not full, and displacement is for a real improvement in what the day
    says rather than for re-sectioning. If it stays weakest tomorrow it should lose the slot.

    The strongest Top stories candidate I held back is SWE Refactor Bench. On substance it outranks
    Groq 3 LPX: a published three-stage protocol, 520 runs across 8 frontier models, 5.4 percent
    passing, and a named failure mode. I put it in ML research rather than Top stories because it is
    a same-day preprint with no peer review and no independent discussion signal, and the day's top
    already carries three well-evidenced items. It is the block to watch if the benchmark picks up
    external validation.

    Emacs 31.1 opens Developer tools, which the earlier run omitted for lack of material after
    Neovim 0.12.5 turned out to have no changelog text. I confirmed the release from the dated
    tarballs on ftp.gnu.org rather than from the write-up alone, because the substantive source,
    masteringemacs.org, is secondary.

    Three RISC-V items now sit on the page across three sections: CPython tier 3, NVIDIA's CUDA host
    requirements from Hot Chips, and SiFive's BigSky. That is a real same-day thread rather than
    three coincidences, and BigSky is the one that answers the RVA23 requirement the NVIDIA item
    states. A reader moving between the Languages, Infrastructure and Infrastructure blocks cannot
    infer that connection, so it is written into the BigSky entry.

    Two verification results worth recording. CVE-2025-9141, which the inference-engine essay cites
    for the vLLM `eval()` tool-parser bug, returned CVE ID Not Found from NVD, which is consistent
    with a RESERVED status but means the identifier cannot be published as an established record.
    The entry attributes the claim to the essay and says the identifier did not resolve. Separately,
    status.claude.com renders its incident list client-side and both /uptime and /history returned
    only the subscribe furniture, so the incident came from the Statuspage /api/v2/incidents.json
    endpoint, matching the route access-notes an-0046 already records for other Statuspage hosts.
    That endpoint is worth adding to source-reliability for Anthropic.

    Thomson Reuters is the weakest thing in this selection and I nearly dropped it. It is a press
    release whose capability claims carry no method, and the standing rule bars publishing AI
    benchmark claims without one. It is included only for the checkable facts, the 40 million dollar
    figure, the open-source starting point, and the open-weight small release, and the entry says
    explicitly that the capability claim is not being carried and that the linked technical report
    covers the foundation model rather than Thomson.

    Two absences are findings rather than quiet. New videos is omitted for the fifth recorded time
    on the same defect: every cached video carries a null discussion object, so nothing can clear a
    bar that ranks on external validation. One of those uncheckable videos is titled "The biggest
    change to the Rust compiler is here!" with 1,157 views, and no HN or Reddit item this run
    corroborates any such change, so it is an unverified lead rather than a dropped story. The
    GitHub watchlist degradation is the one that changes meaning most and has now been disclosed on
    2026-08-16, 2026-08-21 and twice today: tracked stars is not release coverage, and no releases
    or trending collection ran for this date at all, so a watchlist repository could have shipped a
    major release today and this run would not know.

    Reddit was re-fetched because the earlier run reported it degraded, and it came back degraded
    again at 12 of 28 subreddits against a floor of 14. The 18-of-28 rotation put kubernetes, aws
    and AZURE first and all three rate limited immediately. No netsec, security, Python, rust or
    typescript subreddit was reached in either fetch, so the single Reddit block on the page is not
    evidence of a quiet Reddit day.

    The story inbox returned zero issues, so nothing in this selection comes from an owner request.

    On miss_review: the backtest seeded no default causes and I overrode twelve. All twelve are
    general-interest Hacker News front page items with no software engineering content, seeded as
    fetch or query problems, where the correct reading is that the digest was never going to carry
    them. Ocean temperatures, Ebola case counts, an FDA blood test, a Tesla recall, treasury bonds,
    Anna's Archive, an Ask HN about corporate blame, and five culture and hobby posts are
    out_of_scope, not coverage gaps. I left the genuine engineering misses alone: the MCP roadmap,
    the local LLM post, the NanoGPT speedrun, the JIT compiling post, Wi-Fi 8 and ATProto spaces are
    all correctly seeded as watchlist gaps, and the items the stalled 2026-08-24 Hacker News corpus
    dropped are correctly seeded as scrape gaps. Six of those scrape-gap items reached the page
    today, which is the clearest confirmation available that the cause was the fetch and not the
    ranking. I also left 49417394, the UK eVisa identity mismatch, seeded as it stands rather than
    calling it out_of_scope, because an identity system producing a false match is arguably in scope
    even though the coverage carries no technical detail.
