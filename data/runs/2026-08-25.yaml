date: '2026-08-25'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    First run of 2026-08-25. The page was the empty template, so nothing was displaced and this
    selection is the whole day as it stands. Fourteen stories against a budget of 25, no section
    over its cap of four.

    Hacker News came back healthy for the first time in several days, and that is most of why today
    looks full. The 2026-08-24 page recorded a stalled HN corpus across three fetches spanning about
    fourteen hours while the fetcher reported no degradation. Today's backtest confirms the cost:
    IPFS winding down, the Paint watermark research, the SQLite executable prototype and the seL4
    confidentiality proof all broke on 2026-08-24 and none reached that page. Four of today's items,
    including the lead and the second story, are yesterday's news recovered rather than today's news
    found. Anyone reading the two pages side by side should know that.

    Top stories ranking. IPFS leads on a dated operational deadline against named infrastructure:
    Shipyard stops IPFS work on 2026-09-30, Kubo, Helia, Boxo, Rainbow, IPFS Desktop, IPFS Companion
    and IPFS Check lose dedicated maintainers, contributions to go-libp2p and js-libp2p cease, and
    ipfs.io, dweb.link, check.ipfs.network, delegated-ipfs.dev, the bootstrap nodes and
    Wikipedia-on-IPFS stop being operated, with Protocol Labs deciding their future. The Paint
    watermark is second on evidence quality and reach: the research traces the GUID from a
    moderation POST through Watermarker.dll into the pixels and then finds the same value in the
    signed C2PA soft-binding assertion of a saved PNG, and the author obtained a live server
    response to confirm it. The Alabama subpoena is third as a first-of-kind regulatory action on an
    incident this archive has tracked since 2026-07-21. Groq 3 LPX is fourth and is the weakest of
    the four: it is a vendor press release, the 3,400 tokens per second figure is attributed to
    Artificial Analysis rather than published by NVIDIA with a method, and the 4x responsiveness
    claim has no method at all.

    Not published, and the absence is the finding. AI has no section today. The day's AI items were
    the Groq launch, which is in Top stories, the GPT-5.6 Sol price reduction, which the 2026-08-22
    page already carries from the same pricing page, and a set of NVIDIA partner announcements with
    nothing an engineer acts on. Markets and companies is omitted because both of its candidates
    were unreadable: the Anthropic IPO report is behind a NYT 403 and the NVIDIA price increase
    report is behind a Reuters 401, and neither is worth publishing from a headline. Developer tools
    is omitted: Neovim 0.12.5 is a patch release whose release page carries no changelog text, and
    nothing else cleared the bar. Watchlist follow-ups is omitted because its one live update, the
    Alabama subpoena on f-0030, is strong enough to lead a section rather than trail one, and a
    story holds one place.

    Dropped with reasons. The Xiaomi XRing O3 thread was the day's second highest at 739 points and
    is not published: its only source is a post on x.com, no primary benchmark exists, and the
    numbers in the thread come from an HN commenter rather than from a publisher. The Google
    bughunters post on AI-assisted C and C++ to Rust rewrites would have been a good Engineering
    posts item and could not be read. Qualcomm's Linux upstreaming record is a twelve-day-old
    social.kernel.org post at 10 points, and its substance belongs to a mailing-list thread rather
    than to today. The Blackstone data exposure sits in Security rather than Top stories because the
    flaw was patched around 2026-07-09 and today is publication rather than exposure.

    miss_review. The backtest scored 46 candidates for 2026-08-24 and seeded no causes, so the
    entries below are supplied rather than corrected. Two are false entity matches that the query
    corpus surfaced and that no digest should have carried: a hobby PC emulator matched on Rust, and
    an opinion piece matched on AI. The Xiaomi CPU thread is marked out of scope on the same ground
    the story was dropped today. Five are genuine engineering misses and all five carry scrape_gap
    rather than watchlist_gap, because the 2026-08-24 page documents the stalled fetch that caused
    them and the queries were not at fault. Five are legitimate skips of material this archive
    published on 2026-08-22 or 2026-08-23. The remaining candidates are general news, hobby projects
    and Show HN items that no cause needs to explain.
