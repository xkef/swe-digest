    enumerate them.

    Memory hygiene, unchanged in shape and one day staler. An unfiltered followups query still
    exceeds the tool's output limit, now at roughly 69 KB across 545 lines for 40 records, and an
    unfiltered entities query at roughly 80 KB across 846 lines, so every run of the day pays to
    page or filter both. No followups record carries a last_seen later than 2026-08-16, so the store
