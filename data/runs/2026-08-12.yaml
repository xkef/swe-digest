    titles:
    - >-
      OpenSSH 10.5 ships three security fixes and the project will release more often for now, after AI-found
      bugs were independently rediscovered
    - A public exploit lands for CVE-2026-53361, an AF_UNIX garbage collection race the author uses to
      escape containers
    - Mojo reaches 1.0 with a primarily-additive change policy, while the compiler stays closed
    - >-
      CloudSEK publishes a victim list for the March 2026 LiteLLM supply chain compromise, naming 2,500
      organizations and 434,000 CI/CD pipelines
    - NVIDIA releases NeMo Switchyard, an open source model-routing library, with partner cost figures
    - xAI launches Grok Bot in beta, gated behind SuperGrok Heavy and Cursor paid tiers
    - A case study reports tightened bounds on the Grothendieck constant reached with an AI research system
    - Checkly reports an attacker used a Metabase Cloud zero-day to read its analytics warehouse for 26
      minutes
    - Expat 2.8.3 fixes CVE-2026-72522, an out-of-bounds read in UTF-16 decoding reachable over the network
    - llama.cpp publishes llama.app as an official install site with a unified llama command
    - A Google post argues language choice now matters for review rather than for writing speed
    - >-
      pg_clickhouse v0.10.0 pushes down 16 of 22 TPC-H queries and adds guards for a NULL semantics mismatch
      that silently inverted NOT IN
    - Compression is prediction, an explainer connecting entropy coding to language modeling
