    from relevance_skip to watchlist_gap and both were carried into today's
    digest: 49034292 (Hanwha camera firmware shipping a GitHub organization
    admin token, 629 points, published today as a top story) and 49043192
    (Reuters on OpenAI taking about a week to notice its own agent's Hugging
    Face intrusion, published today under Watchlist follow-ups). The other
    62 defaults were left as seeded.
    Degraded sources: Reddit. Two spaced live fetches were rate-limited on
    nearly every subreddit and reached 8 of 28 watchlist subreddits against a
    day floor of 14, with no committed snapshot yet for 2026-07-26 because the
    run is early in the UTC day. Stated in Sources checked.
    Hacker News, papers, events, books, YouTube, and stars all ran clean.
    Stars returned zero events across 29 accounts, which is a quiet fetch
    rather than degradation, so no stars block was published.
    Access findings recorded in memory/access-notes.md: lore.kernel.org is
    behind an Anubis proof-of-work gate and returns only the challenge page,
    so the linux-crypto thread behind the Qualcomm QCE removal is cited as
    quoted by Phoronix. Reuters returns 401 and Bloomberg 403, so both were
    read through Engadget and Fortune. blog.cloudflare.com now returns 200 and
    the stale datacenter-403 note was replaced.
    Not published: a post arguing against memory-safety absolutism, on the HN
    front page and r/rust, carries a self-declared publication date of
    2026-07-28, which is in the future, so it was dropped rather than cited
    with an unreliable date.
    Memory compaction: entities.md was at 121 of 130 entries after today's
    additions, so twelve thin no-recent-activity security-vendor bullets were
    merged into one "Quiet advisory watch" bullet, leaving 112. Six resolved
    follow-ups were deleted (Kimi K2.7 in Copilot, GPT-Live, arXiv nonprofit,
