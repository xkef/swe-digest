    First run of the day. The digest file was the unedited template, so nothing was displaced and
    `displace` is empty. The story inbox returned zero issues.

    The day has one dominant theme and it is confirmed from two independent directions. JFrog
    audited 55 advisories published by a single new GitHub account (programmervuln/cveadvisory-) and
    found 54 entirely fabricated: cited functions that did not exist in the claimed version, line
    numbers past EOF of the file, a "fix" that diffs to no change in src/expr.c, and PoCs that fail
    at the SQL parser. NVD flagged several as critical and CISA's ADP agreed. Separately, the
    Financial Times reported via the-decoder that Apple has capped bug bounty submissions per
    researcher with a 30-day cooldown because of AI-generated report volume. I could not reach the
    FT, so that one is `developing` rather than `confirmed`, and the named details (Bynario, CEO
    Alfredo Pesoli, the $100k-$200k estimate, Rafe Pilling of Sophos) come from the-decoder's
    summary of the FT, not from the FT itself. The Register also covered the CVE-pipeline angle; I
    did not link it because it duplicates JFrog and theregister.com article bodies are unreadable
    from this environment.

    Access: `openai.com/index/ten-advances-in-mathematics/` returned HTTP 403 on two attempts. This
    is a new block, not covered by any existing access note, and openai.com is likely to matter
    again. The story carries 484 points and 753 comments, so I published it in `Hacker News` as
    `discussion` with the HN thread as the primary link and the unreadable OpenAI URL listed as a
    source. I did not restate any of OpenAI's claims as fact, and the value I took from the item is
    the thread's demand for the undisclosed experimental setup. A run on a network that can reach
    openai.com should revisit this as a real AI story.

