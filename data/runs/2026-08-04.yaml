  notes: |
    First run of the day. The digest file was the unedited template, so nothing was displaced and
    `displace` is empty. The story inbox returned zero issues.

    The day has one dominant theme and it is confirmed from two independent directions. JFrog
    audited 55 advisories published by a single new GitHub account (programmervuln/cveadvisory-) and
    found 54 entirely fabricated: cited functions that did not exist in the claimed version, line
    numbers past EOF of the file, a "fix" that diffs to no change in src/expr.c, and PoCs that fail
    at the SQL parser. NVD flagged several as critical and CISA's ADP agreed. Separately, the
    Financial Times reported via the-decoder that Apple has capped bug bounty submissions per
    researcher with a 30-day cooldown because of AI-generated report volume. I could not reach the
    FT, so that one is `developing` rather than `confirmed`, and the named details (Bynario, CEO
    Alfredo Pesoli, the $100k-$200k estimate, Rafe Pilling of Sophos) come from the-decoder's
    summary of the FT, not from the FT itself. The Register also covered the CVE-pipeline angle; I
    did not link it because it duplicates JFrog and theregister.com article bodies are unreadable
    from this environment.

    Access: `openai.com/index/ten-advances-in-mathematics/` returned HTTP 403 on two attempts. This
    is a new block, not covered by any existing access note, and openai.com is likely to matter
    again. The story carries 484 points and 753 comments, so I published it in `Hacker News` as
    `discussion` with the HN thread as the primary link and the unreadable OpenAI URL listed as a
    source. I did not restate any of OpenAI's claims as fact, and the value I took from the item is
    the thread's demand for the undisclosed experimental setup. A run on a network that can reach
    openai.com should revisit this as a real AI story.

    Sections omitted deliberately, where the absence is the finding rather than a quiet day:

    `Books`. The publisher feeds returned only Springer LNCS/CCIS conference proceedings volumes
    (ICPR, iCETiC, BIOSTEC, KMO) plus one German-language AI monograph. No trade technical book
    cleared the bar, so the section is omitted rather than padded with proceedings.

    `ML research`. The arXiv pull was healthy and not degraded, roughly the usual daily volume.
    Several items were adjacent to engineering practice (ACEM cost estimation for agentic software
    engineering, SWE-Touch, Real-Time Detection and Repair of LLM Agent Failures), but none carried
    external validation, a discussion thread, or a result I could check beyond the abstract. Omitted
    on the `Books`/`New videos` standard rather than published as a title list.

    `New videos`. Watchlist channels produced output but every item came back with `discussion:
    null`, so nothing had a real thread to rank on. The strongest by raw engagement was a Dwarkesh
    Patel video that is a read-aloud of a post published the previous week. Omitted.

    `Agentic coding`. The day's one strong agentic item, @cloudflare/computer, was good enough for
    Top stories, which leaves the section with nothing that stands on its own. Everything else in
    that space today was Show HN self-promotion in the single-digit points range.

    `Outages`. The Norway ID-porten DDoS is the day's outage and it is strong enough to lead
    position two, so it sits in Top stories and the Outages section has no separate entry. A reader
    will find the incident, but the anchor section will read as empty; that is a promotion, not an
    absence of incidents.

    `Reddit and social pulse`. Reddit coverage was degraded to 10 of 28 subreddits against a floor
    of 14, with the live top_day fetch reaching only 2 before pooling recovered 65 posts from the
    03:37 snapshot. The one genuinely strong Reddit find, FFmpeg 9.0, was verified against
    ffmpeg.org and promoted to Top stories, so nothing Reddit-native remains worth a section given
    the coverage I actually had.

    `Watchlist follow-ups`. 56 entries are open and none received verifiable new facts today. The
    closest was f-0030 (OpenAI and Anthropic models escaping an eval sandbox): a TechCrunch piece on
    legal liability surfaced at 6 points and a blog on an unfamiliar domain (blog.neutrontech.ai) at
    2 points. Neither adds a fact to the record, so I published no follow-up rather than restating
    the entry.

    Calls a reader could not infer. "Devtools must be open source" is by David Crawshaw, who runs
    exe.dev, which sells agent sandboxes and VMs, and the post's closing argument is that Claude
    Code is the wall because it is closed source. I published it because the reasoning about
    agent-driven personalization changing the ROI on forking is the substance and the HN thread
    engages it seriously (simonw describes treating "clone and build X" as a zero-cost prompt,
    kelnos pushes back that this burns electricity re-implementing what a config file does once).
    The commercial interest is real and the writer should keep it visible. "LLMs reward expertise"
    is dated 2026-07-24 on the author's site and only resurfaced on HN on 2026-08-03; the digest
    date is the resurfacing, not publication.

    Not published: Bonsai, Jane Street's OCaml UI library, at 319 points. There is no release or
    news event behind it, the library predates today, and the thread's technical content is thin
    (web-only, and a userland trampoline because js_of_ocaml has no tail call optimization). It
    would have been the weakest thing in `Languages and runtimes` next to the Rust project goal, so
    it lost on ranking rather than on verification. Same call on C-Kermit (138 points) and the
    9front release (85 points).

    Also not published: the FFmpeg 9.0 release notes and changelog were linked from the download
    page but I cited only the download page, which carries the release date (2026-08-04), the
    codename "Lei", the branch cut date (2026-06-26), and the full set of bumped library versions.
    That is enough for the claims made and avoids citing a page I did not read.

    Backtest. The 2026-08-03 run seeded no default causes across 60 candidates, so `miss_review`
    carries only the four I judged wrong. Qwen3.8-Max (997 points) is a major model release with
    explicit coding claims and there is no Qwen query in the watchlist at all, which is a
    straightforward gap. "Don't be a meat proxy" (1662 points at scoring time, 1712 now) is the
    largest thread of the period and is about engineering communication practice; no query touched
    it, and I am carrying it today. The TP-Link TL-841N rooting and persistent-credentials write-up
    (114 points) is exactly the security research this digest exists to catch and no query matched
    it. Against those, the OpenAI super PAC story matched on `entity:OpenAI` but is political
    funding and media, not engineering context, so it should carry `out_of_scope` rather than
    counting as a relevance miss. I left the remaining `no_query_match` items alone; most are
    general-interest front page (German citizenship, Wikimedia union, fish sauce, Hollywood) where
    the default is correct.

    Watchlist observation for the weekly review, not an action for this run: three separate
    `watchlist_gap` calls above are model releases and security research from vendors and
    researchers with no query coverage. The query list is heavy on incumbent names (OpenAI,
    Anthropic, Claude, Nvidia) and light on Chinese labs; Qwen, MiniMax, Moonshot and Z.ai all
    produced digest-worthy output in the last two days and only surfaced through the front page.

    Second run of the day, re-ranking the whole page. The finding that drove this run is a delivery
    gap, not a discovery gap. Run 1's select returned the JFrog audit as its lead Top story, its
    judgment notes describe the day as having "one dominant theme" built on it, and its second
    review step flagged the absence as blocking. The block never reached data/digests/2026-08-04.md.
    Two more items run 1 verified and discussed in its own notes are also absent: "Devtools must be
    open source", which run 1 states it published and defends at length including the author's
    commercial interest, and the Rust project goal, which run 1 cites as the item Bonsai "ranked
    below" in Languages and runtimes. All three fetched cleanly for me on this run and all three are
    selected. Nothing was displaced, because the day stood at 13 stories against a budget of 25 and
    no section was at its cap.

    Top stories is reordered rather than only extended. The JFrog audit leads: it is confirmed
    against a primary source, NVD and CISA's ADP propagated the fabricated advisories as critical,
    Red Hat scored one at 10.0 before downgrading to 7.6, and it is the day's second-largest thread
    at 710 points. The Apple bug bounty item drops to rank three because it is the same failure mode
    carried by a secondary summary of a Financial Times report that neither run could fetch. The two
    now read as primary and corroboration rather than as one unsourced claim near the top of the
    page. FFmpeg 9.0 and @cloudflare/computer keep their content unchanged at ranks two and four.

    Access. openai.com returned HTTP 403 again, this time for /index/apple-is-getting-this-wrong/, a
    post that went up at 05:32 today and reached 214 points and 206 comments. That is a second
    distinct openai.com path blocked on the same day, alongside the ten-advances post the digest
    already carries as an unread source. I did not publish it. The digest already contains one block
    about an OpenAI post whose contents I cannot state, and a second would be padding rather than
    reporting. A run on a network that can reach openai.com should look at both.

    Sections still omitted, where the absence is the finding. ML research: the arXiv pull was
    healthy and nothing carried external validation or a checkable result. New videos: every one of
    the 21 watchlist videos came back with a null discussion link, so nothing has a thread to rank
    on. Books: the publisher feed is still Springer proceedings volumes. Reddit and social pulse:
    coverage was degraded again to 11 of 28 subreddits, and scanning what did arrive found only
    support threads and self-hosting questions. Watchlist follow-ups: 56 entries are open, the
    newest last seen 2026-07-26, and none gained a verifiable fact today.

    Placement observation for the review step, not a selection call. The Hacker News section carries
    "Don't be a meat proxy" (gruhn.me) and "Prevent cognitive debt by manually retyping
    LLM-generated code" (ankursethi.com). Both have verifiable primary sources, which the
    hacker-news guidance says belong in a topical section, leaving the Hacker News section for
    HN-native signal. The OpenAI ten-advances block is correctly there, since the thread is the only
    part of it I can source.

    Considered and not published. "200 Milliseconds" at 296 points is an interactive visualization
    whose page returns metadata and one sentence to a fetcher, so I could not read what it teaches,
    and it was published 2026-07-06. Octane (119 points) is a launch page for a React-model compiler
    with no release event. "What DMARC Protects You From, and What It Does Not" (131) is a competent
    explainer with no news behind it. Bonsai, C-Kermit's neighbours 9front, and the Show HN field
    are unchanged from run 1's calls, except C-Kermit itself, which run 1 dropped on the stated
    ground that the review step held no fetch capability. Run 1's own fetch log shows the post was
    retrieved successfully during select, so the release is verifiable and is now carried.

    miss_review is empty deliberately. Today's backtest re-scored 2026-08-03 and reported the same
    60 candidates with no default causes seeded. Run 1 already corrected four of them, promoting
    Qwen3.8-Max, "Don't be a meat proxy" and the TP-Link TL-841N rooting write-up to watchlist_gap
    and demoting the OpenAI super PAC story to out_of_scope. I reviewed the remaining candidates and
    found no further seeded cause I judge wrong, so I am not rewriting entries that are already
    right. The JFrog thread is not among the scored candidates and is therefore ignored rather than
    corrected. Run 1's watchlist observation stands and I second it: three of the four corrections
    are model releases or security research with no query coverage, and the query list carries no
    Qwen, MiniMax, Moonshot or Z.ai term while all four produced digest-worthy output this week.
    MiniMax H3, selected today, surfaced through the front page rather than through any query.

    The finding that should drive the weekly review is a repeated selection error, not a discovery
    gap. Both earlier runs today selected stories that were already published in
    data/digests/2026-08-03.md, and both write steps correctly refused them. Run 1 led with the
    JFrog SQLite advisory audit. Run 2 then built its whole premise on the claim that run 1's block
    "never reached the digest" and re-selected it, along with "Devtools must be open source", the
    Rust Move and Forget project goal, MiniMax H3 day-zero support in ComfyUI, and Andy Pavlo
    joining ClickHouse. All five are in yesterday's digest, at lines 23, 86, 121, 43 and 168. Run
    2's own notes then read the write step's refusal as a delivery bug and escalated. The cause is
    mechanical: the HN cache carries a 24-hour window, so yesterday's front page is still in it, and
    neither run checked the archive before ranking. I checked data/digests/2026-08-03.md against
    every candidate before selecting. A run that skips that check will keep rediscovering the same
    five stories.

    Today's lead changes. An active npm supply chain worm that started at 09:00 UTC outranks a media
    release. The keyv maintainer's GitHub account was compromised, keyv@6.0.0 published at 09:35 UTC
    as the first version carrying a malicious preinstall hook, the cacheable family followed in a
    burst between 10:09 and 10:14, and the worm has since reached over 400 distinct packages.
    Aikido's 13:37 CEST update puts it at 434 packages across 1381 versions with over 2 billion
    monthly installs combined. I verified this against three independent research teams, Socket, Wiz
    and Aikido, which agree on the mechanism, the file hashes and the exfiltration marker string.
    Socket is the primary link because it is the only one that reconstructs the timeline from npm
    registry publish timestamps. FFrog and the Apple bounty item keep their content and drop one
    rank each.

    I split this incident across three blocks deliberately, and it should not be read as
    duplication. The Top stories block carries scope, the credential set and the worm mechanism. The
    Security block carries the two facts that change what a responder does: keyv@6.0.0 shipped a
    passing sigstore attestation because the legitimate workflow built trojanized source, and the
    implant's watcher evaluates a remote-supplied string the moment the stolen token is revoked, so
    removal must precede rotation. The Agentic coding block carries the .claude and .vscode
    autostart hooks, which reach a different victim population entirely, namely anyone who clones
    the repository and opens it, and which every npm-side mitigation misses. Each block states
    something the others do not. Wiz also reports the malware resolving its command-and-control
    domains from an Ethereum smart contract by eth_call. I left that out because it sits next to the
    DPRK NullReceiver block the digest already carries, and pairing them would imply a link between
    two campaigns that no source draws.

    Sections still omitted, where the absence is the finding. Books: the publisher feed is Springer
    proceedings volumes again, mostly repeated Pattern Recognition entries plus one German-language
    monograph. New videos: all 23 watchlist videos returned a null discussion link, so nothing has a
    thread to rank on, unchanged across all three runs today. ML research: the arXiv pull was
    healthy and nothing carried external validation or a result checkable beyond its abstract.
    Reddit and social pulse: coverage degraded again, with top_day reaching 1 of 28 subreddits and
    the day reaching 13 of 28 against a floor of 14. Outages: no incident I could confirm as
    current. Watchlist follow-ups: the open entries gained no verifiable fact today.

    A sourcing observation for the write step rather than a selection call. The published FFmpeg 9.0
    block cites ffmpeg.org/download.html, which run 2 recorded as unreachable twice, while
    github.com/FFmpeg/FFmpeg/blob/n9.0/RELEASE_NOTES fetched cleanly in that same run and is what HN
    item 49166202 links at 391 points. The reachable primary should carry the claims.

    miss_review is empty on purpose. Today's backtest re-scored 2026-08-03 and again reported 60
    candidates with zero default causes seeded, so there is no seeded cause to correct. Run 1
    already promoted Qwen3.8-Max, "Don't be a meat proxy" and the TP-Link TL-841N write-up to
    watchlist_gap and demoted the OpenAI super PAC story to out_of_scope. I reviewed the rest and
    found nothing further I judge wrong. Worth recording on the other side of the ledger: today's
    lead surfaced through the npm watchlist query rather than through the front page, so that query
    earned its place.

    Considered and not published. "Xbox goes down. You can't play games you own on disc" at 401
    points looks like an outage and is not one. The page is a link-blog post by Matt Birchler dated
    2026-07-27 quoting a Verge piece about an outage that began the previous Sunday, so it is a
    week-old commentary resurfacing, with no current incident and no primary status page behind it.
    "AI-Generated Images Discourage Me from Reading Your Blog" at 632 points is the day's
    third-largest thread and is a preference argument with no engineering content. "Apple is getting
    this wrong" at 256 points is the third distinct openai.com path to return HTTP 403 in two days
    and stays unread and unpublished, on the same test that dropped the ten-advances post. The
    Adform breach at 97 points sits on an unfamiliar domain and is adtech privacy rather than
    developer infrastructure. The NHS and Palantir data-access story at 140 points and "Apple says
    more ex-employees may have taken confidential data to OpenAI" at 97 points are governance and
    litigation, not engineering context, and the second is TechCrunch, which access note an-0012
    says to cross-reference against a primary I do not have.
