  notes: |-
    First run of 2026-08-24. The page was an empty skeleton, nothing was displaced, and seven blocks
    are selected: Top stories 3, Security 1, Linux and kernel 1, Developer tools 2. Six count
    against the budget of 25 outside Security. No section is near its cap.

    The day is genuinely quiet and the digest should read that way. The fetch ran at 02:41 UTC, so
    the Hacker News window is almost entirely 2026-08-23 material, and the front page is dominated
    by items already published on the 2026-08-22 and 2026-08-23 pages: the Level1Techs local-LLM
    write-up now at 417 points, the MCP roadmap, Rust Glancer, MartyPC, the Prime Intellect
    leaderboard, the copy-and-patch JIT, the Securelist head-unit malware, the NTFS3 local-root
    disclosure. Nothing new on Hacker News cleared a section bar, so no Hacker News block was
    written.

    Top stories was held to three by decision. The three published are the only items today that
    change what an engineer does: an active macOS campaign with published indicators, a Postgres
    release whose observability changes force tooling work before the upgrade, and a measured
    toolchain compile-time change. The next candidates were the Debian ballot and the Firefox beta,
    and both were placed in Developer tools instead, because neither is a state change today.
    Padding Top stories to five would have meant promoting items whose section placement is correct.

    Sourcing calls a reader cannot infer. The macOS stealer block rests on one source, the SafeDep
    analysis of 2026-08-21, read in full. Its Hacker News thread stands at 2 points and is not
    discussion worth citing. The attribution to WEEVILPROXY and JSCEAL is stated by SafeDep as an
    inference from architectural and delivery overlap, not a confirmed fact, and the block carries
    it that way. The Postgres block was verified against the PostgreSQL 19 release notes directly
    rather than taken from the ClickHouse write-up: every monitoring claim in that post appears in
    section E.1.3.1.4 of the notes. The release notes are dated as of 2026-07-18 and the page states
    19 Beta 3 shipped 2026-08-13 with no release date set, so the block is developing rather than
    confirmed. The earlier PostgreSQL 19 coverage on 2026-06-12 and 2026-07-01 carried parallel
    autovacuum, REPACK, SQL/PGQ and JIT disabled by default. This block is scoped to the monitoring
    and observability changes and the tooling checklist, which are not in that coverage.

    Steve French. The 2026-08-23 digest published the maintainership handover from the mainline
    MAINTAINERS log and explicitly declined the death, because the only report was Phoronix citing a
    social media post. LWN posted "Mourning Steve French" on 2026-08-23 at 13:40 UTC, reporting it
    in Jonathan Corbet's own voice and quoting Jeremy Allison. LWN is not a project-controlled
    source and the underlying post is still on LinkedIn, which is not linked here per the social
    attribution rule. Two independent outlets of record now carry it and the kernel community is
    treating it as settled, so the status is confirmed. The stable article URL was taken from the
    LWN RSS feed rather than reconstructed.

    Zimbra. The CISA feed entry for CVE-2026-73570 cites the vendor patch post in its notes field,
    and that post resolves what the 2026-08-23 follow-up asked for: 10.1.20 is dated 2026-07-20,
    describes the flaw as a command injection in the SNMP monitoring component reachable when SNMP
    notifications are enabled, and calls it the permanent fix for the vulnerability disclosed in
    Zimbra's 2026-06-26 advisory. It does not reconcile the disagreement with CISA, which still
    describes crafted SMTP requests. The block states both and does not pick one. The 2026-08-24
    remediation due date is today, which is the reason it is in Security rather than filed as a
    quiet follow-up.

    Checked and declined. The CISA catalog is at version 2026.08.21 with no addition after the
    Zimbra entry, so no new advisory qualified. GitHub, Cloudflare and the status pages show no open
    incident: GitHub's most recent is the Copilot Cloud Agent failure resolved 2026-08-21 00:37 UTC,
    and Cloudflare's most recent is a 48-minute North America to Singapore error window on
    2026-08-23 that Cloudflare itself scores at impact none. Outages reads "No major items found."
    The "What Is a Harness?" post at 27 points was fetched and read in full and dropped: it is an
    explainer with no measurement that closes by promoting the publisher's own harness. The Firefox
    two-week cadence claim at 15 points could not be verified, as recorded above, and the block
    published in its place covers the 155 beta release notes, which do not mention a cadence change.
    The Iranian power plant report and the Slovak speed camera backdoor were declined on the same
    grounds as 2026-08-23 and nothing new resolved for either.

    Sections omitted, cause separated by kind. Omitted for collection failure: Reddit and social
    pulse, at 6 of 28 subreddits; New videos, thirteenth consecutive day, with every cached video
    carrying a null discussion object; Books, thirteenth consecutive day, against a catalogue that
    is Springer conference proceedings plus tutorial titles such as "Building MCP Servers with C#"
    and "XML and JSON Recipes for SQL Server". Omitted by editorial decision: ML research, because
    the arXiv cache carries no candidate with external validation and the two papers with Hacker
    News threads top out at 2 points; AI, Agentic coding, Apple platforms, Infrastructure,
    Engineering posts, Markets and companies and Hacker News, because every candidate in each was
    either already published or below its section bar; Watchlist follow-ups, because the two updates
    this run produced are security and kernel facts and are published in those sections, and a
    filtered followups query returned nothing else this selection resolves.

    Backtest, scoring 2026-08-23. Thirty-three candidates were scored. Seven causes are corrected,
    all in the same direction: items seeded out_of_scope or watchlist_gap that the routine had in
    fact seen and declined on merit. Rust Glancer was seeded watchlist_gap but matched the Rust
    entity query and was published on 2026-08-22, so it is not a gap. Hister, the
    Codex-versus-Claude week, Munder Difflin, the Racket introduction, Autolith and the Reuters
    student report are all inside a section's topical scope and all appear in the 2026-08-23 seen
    ids or in that day's recorded drop rationales. The remaining seeded causes stand.

    Configuration changes implied by this run, none of which this step touches and all of which need
    the owner-approved improvement-issue path. New: a compiler-toolchain term such as LLVM or Clang,
    since the LLVM 23 compile-time post is a lead story today and matched no query; a browser or
    Mozilla term, since the Firefox 155 beta reached this run only through a 15-point front-page
    item. Everything listed on 2026-08-21, 2026-08-22 and 2026-08-23 is outstanding and unchanged,
    including the database and compiler terms raised yesterday, the DNS, embedded-device,
    OpenTelemetry, on-device inference, Kafka and NLTK terms, the primary-URL duplicate check, the
    per-query result cap of five, the zero-hour events window now at thirteen consecutive runs, the
    stars collector and the null YouTube discussion objects. The story inbox is empty and no issue
    was acted on.

    Memory hygiene, unchanged in shape and one day staler. An unfiltered followups query still
    exceeds the tool's output limit at roughly 71 KB across 559 lines for 41 records, so every run
    of the day pays to page or filter it. Filtered queries for Zimbra, Postgres and CIFS all
    returned zero records, so neither of today's two follow-up-shaped blocks has a tracked entry
    behind it. Two new follow-ups are warranted by this run and this step cannot create them: the
    Zimbra SMTP-versus-SNMP disagreement, which no source has reconciled, and the PostgreSQL 19
    release date, which the release notes still leave unset. The outstanding items from 2026-08-23
    are unchanged: the LWN access note recording 403 since 2026-08-18 should be closed, since LWN
    served both the headline page and the RSS feed in full this run; access note an-0020 on Reuters
    should be touched.

    One addition today, and the reason is a collection failure rather than a quiet news day. The
    Hacker News cache was refetched at 10:23 UTC but its newest item is dated 2026-08-23T15:09, with
    zero items dated 2026-08-24 and only three after 15:00 on 2026-08-23. The corpus did not move in
    the eight hours since the 02:41 run, and the fetcher reported an empty degraded list, so it
    self-reports healthy while contributing nothing new. Everything above the fold is already
    published across the 2026-08-20 to 2026-08-23 pages. Treat the HN backend as suspect until a
