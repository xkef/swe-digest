  added:
  - >-
    Anthropic ran a two hour 46 minute partial outage across the Claude API, Claude Code,
    Claude Cowork, and claude.ai, and GitHub degraded Copilot's Fable model in an overlapping
    window it blamed on an unnamed upstream provider
  - >-
    A paid YouTube ad delivered a fake TradingView installer that roots macOS and intercepts
    every HTTPS session
  - >-
    PostgreSQL 19 turns lock-wait logging on by default and adds per-process-type log levels,
    WAL full-page-image bytes, and multixact stats
  - >-
    LLVM 23 cuts stage2-O3 compile time by 6.75 percent, and precompiled headers cut MSVC
    and Clang builds of LLVM by about 45 percent
  - >-
    Zimbra's own patch post places the exploited command injection in the SNMP component,
    and the CISA remediation date is 2026-08-24
  - >-
