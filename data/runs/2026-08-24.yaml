    titles:
    - A paid YouTube ad delivered a fake TradingView installer that roots macOS and intercepts every HTTPS
      session
    - >-
      PostgreSQL 19 turns lock-wait logging on by default and adds per-process-type log levels, WAL full-page-image
      bytes, and multixact stats
    - >-
      LLVM 23 cuts stage2-O3 compile time by 6.75 percent, and precompiled headers cut MSVC and Clang
      builds of LLVM by about 45 percent
    - >-
      Zimbra's own patch post places the exploited command injection in the SNMP component, and the CISA
      remediation date is 2026-08-24
    - Cloudflare degraded D1, Durable Objects, and R2 in Hong Kong and Singapore for four and a half hours
    - Firefox 155 beta adds QUIC version 2 and two WebAssembly proposals, and moves the captive-portal
      check to a new domain
    - Steve French, longtime Linux SMB and CIFS maintainer, has died
