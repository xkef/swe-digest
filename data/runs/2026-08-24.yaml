  notes: |
    First run of 2026-08-24. The page was an empty skeleton, nothing was displaced, and seven blocks
    are selected: Top stories 3, Security 1, Linux and kernel 1, Developer tools 2. Six count
    against the budget of 25 outside Security. No section is near its cap.

    The day is genuinely quiet and the digest should read that way. The fetch ran at 02:41 UTC, so
    the Hacker News window is almost entirely 2026-08-23 material, and the front page is dominated
    by items already published on the 2026-08-22 and 2026-08-23 pages: the Level1Techs local-LLM
    write-up now at 417 points, the MCP roadmap, Rust Glancer, MartyPC, the Prime Intellect
    leaderboard, the copy-and-patch JIT, the Securelist head-unit malware, the NTFS3 local-root
    disclosure. Nothing new on Hacker News cleared a section bar, so no Hacker News block was
    written.

    Top stories was held to three by decision. The three published are the only items today that
    change what an engineer does: an active macOS campaign with published indicators, a Postgres
    release whose observability changes force tooling work before the upgrade, and a measured
    toolchain compile-time change. The next candidates were the Debian ballot and the Firefox beta,
    and both were placed in Developer tools instead, because neither is a state change today.
    Padding Top stories to five would have meant promoting items whose section placement is correct.

    Sourcing calls a reader cannot infer. The macOS stealer block rests on one source, the SafeDep
    analysis of 2026-08-21, read in full. Its Hacker News thread stands at 2 points and is not
    discussion worth citing. The attribution to WEEVILPROXY and JSCEAL is stated by SafeDep as an
    inference from architectural and delivery overlap, not a confirmed fact, and the block carries
    it that way. The Postgres block was verified against the PostgreSQL 19 release notes directly
    rather than taken from the ClickHouse write-up: every monitoring claim in that post appears in
    section E.1.3.1.4 of the notes. The release notes are dated as of 2026-07-18 and the page states
    19 Beta 3 shipped 2026-08-13 with no release date set, so the block is developing rather than
    confirmed. The earlier PostgreSQL 19 coverage on 2026-06-12 and 2026-07-01 carried parallel
    autovacuum, REPACK, SQL/PGQ and JIT disabled by default. This block is scoped to the monitoring
    and observability changes and the tooling checklist, which are not in that coverage.

    Steve French. The 2026-08-23 digest published the maintainership handover from the mainline
    MAINTAINERS log and explicitly declined the death, because the only report was Phoronix citing a
    social media post. LWN posted "Mourning Steve French" on 2026-08-23 at 13:40 UTC, reporting it
    in Jonathan Corbet's own voice and quoting Jeremy Allison. LWN is not a project-controlled
    source and the underlying post is still on LinkedIn, which is not linked here per the social
    attribution rule. Two independent outlets of record now carry it and the kernel community is
    treating it as settled, so the status is confirmed. The stable article URL was taken from the
    LWN RSS feed rather than reconstructed.

    Zimbra. The CISA feed entry for CVE-2026-73570 cites the vendor patch post in its notes field,
    and that post resolves what the 2026-08-23 follow-up asked for: 10.1.20 is dated 2026-07-20,
    describes the flaw as a command injection in the SNMP monitoring component reachable when SNMP
    notifications are enabled, and calls it the permanent fix for the vulnerability disclosed in
    Zimbra's 2026-06-26 advisory. It does not reconcile the disagreement with CISA, which still
    describes crafted SMTP requests. The block states both and does not pick one. The 2026-08-24
    remediation due date is today, which is the reason it is in Security rather than filed as a
    quiet follow-up.

    Checked and declined. The CISA catalog is at version 2026.08.21 with no addition after the
    Zimbra entry, so no new advisory qualified. GitHub, Cloudflare and the status pages show no open
    incident: GitHub's most recent is the Copilot Cloud Agent failure resolved 2026-08-21 00:37 UTC,
    and Cloudflare's most recent is a 48-minute North America to Singapore error window on
    2026-08-23 that Cloudflare itself scores at impact none. Outages reads "No major items found."
    The "What Is a Harness?" post at 27 points was fetched and read in full and dropped: it is an
    explainer with no measurement that closes by promoting the publisher's own harness. The Firefox
    two-week cadence claim at 15 points could not be verified, as recorded above, and the block
    published in its place covers the 155 beta release notes, which do not mention a cadence change.
    The Iranian power plant report and the Slovak speed camera backdoor were declined on the same
    grounds as 2026-08-23 and nothing new resolved for either.

    Sections omitted, cause separated by kind. Omitted for collection failure: Reddit and social
    pulse, at 6 of 28 subreddits; New videos, thirteenth consecutive day, with every cached video
    carrying a null discussion object; Books, thirteenth consecutive day, against a catalogue that
    is Springer conference proceedings plus tutorial titles such as "Building MCP Servers with C#"
    and "XML and JSON Recipes for SQL Server". Omitted by editorial decision: ML research, because
    the arXiv cache carries no candidate with external validation and the two papers with Hacker
    News threads top out at 2 points; AI, Agentic coding, Apple platforms, Infrastructure,
    Engineering posts, Markets and companies and Hacker News, because every candidate in each was
    either already published or below its section bar; Watchlist follow-ups, because the two updates
    this run produced are security and kernel facts and are published in those sections, and a
    filtered followups query returned nothing else this selection resolves.

    Backtest, scoring 2026-08-23. Thirty-three candidates were scored. Seven causes are corrected,
    all in the same direction: items seeded out_of_scope or watchlist_gap that the routine had in
    fact seen and declined on merit. Rust Glancer was seeded watchlist_gap but matched the Rust
    entity query and was published on 2026-08-22, so it is not a gap. Hister, the
    Codex-versus-Claude week, Munder Difflin, the Racket introduction, Autolith and the Reuters
    student report are all inside a section's topical scope and all appear in the 2026-08-23 seen
    ids or in that day's recorded drop rationales. The remaining seeded causes stand.

    Configuration changes implied by this run, none of which this step touches and all of which need
    the owner-approved improvement-issue path. New: a compiler-toolchain term such as LLVM or Clang,
    since the LLVM 23 compile-time post is a lead story today and matched no query; a browser or
    Mozilla term, since the Firefox 155 beta reached this run only through a 15-point front-page
    item. Everything listed on 2026-08-21, 2026-08-22 and 2026-08-23 is outstanding and unchanged,
    including the database and compiler terms raised yesterday, the DNS, embedded-device,
    OpenTelemetry, on-device inference, Kafka and NLTK terms, the primary-URL duplicate check, the
    per-query result cap of five, the zero-hour events window now at thirteen consecutive runs, the
    stars collector and the null YouTube discussion objects. The story inbox is empty and no issue
    was acted on.

    Memory hygiene, unchanged in shape and one day staler. An unfiltered followups query still
    exceeds the tool's output limit at roughly 71 KB across 559 lines for 41 records, so every run
    of the day pays to page or filter it. Filtered queries for Zimbra, Postgres and CIFS all
    returned zero records, so neither of today's two follow-up-shaped blocks has a tracked entry
    behind it. Two new follow-ups are warranted by this run and this step cannot create them: the
    Zimbra SMTP-versus-SNMP disagreement, which no source has reconciled, and the PostgreSQL 19
    release date, which the release notes still leave unset. The outstanding items from 2026-08-23
    are unchanged: the LWN access note recording 403 since 2026-08-18 should be closed, since LWN
    served both the headline page and the RSS feed in full this run; access note an-0020 on Reuters
    should be touched.

    One addition today, and the reason is a collection failure rather than a quiet news day. The
    Hacker News cache was refetched at 10:23 UTC but its newest item is dated 2026-08-23T15:09, with
    zero items dated 2026-08-24 and only three after 15:00 on 2026-08-23. The corpus did not move in
    the eight hours since the 02:41 run, and the fetcher reported an empty degraded list, so it
    self-reports healthy while contributing nothing new. Everything above the fold is already
    published across the 2026-08-20 to 2026-08-23 pages. Treat the HN backend as suspect until a
    later run sees same-day items.

    Two candidates looked like the day's strongest finds and both turned out to be archive. Rust
    issue 161441, the P-critical vacant-vtable miscompilation in 1.98.0, is already the primary URL
    of the 2026-08-23 entry, and the arrayref crates.io compromise is on 2026-08-20. I verified the
    Rust item anyway against the issue page and the Rust blog index: the issue is still open with
    labels I-miscompile, P-critical, and regression-from-stable-to-stable, and the blog index still
    shows 1.98.0 of 2026-08-20 as the newest release with no 1.98.1. That answers the 2026-08-23
    follow-up but only as a negative result, so it is no state change and no follow-up block was
    written. If a 1.98.1 ships it is worth a block on its own sources.

    Security produced nothing new. The CISA KEV feed is still at catalog version 2026.08.21 with no
    addition after the Zimbra entry already on the page, whose federal remediation date is today.
    GitHub, OpenAI, and Anthropic status pages are all clean with no open or recent incidents.

    Cloudflare had two incidents today and only one is published. The Chicago 5xx incident ran 05:47
    to 06:53 UTC, one colo, CDN/Cache only, 66 minutes, minor, no root cause, and it is weaker than
    the APAC one on every axis, so it was dropped rather than given its own block. The published
    block covers the D1, Durable Objects, and R2 degradation in Hong Kong and Singapore, 03:53 to
    08:28 UTC, with a fix implemented at 06:42. The recurrence claim in it is checkable from the
    same incidents feed: Hong Kong Durable Objects and R2 on 2026-08-21 14:59 to 15:19, Dubai R2 on
    2026-08-22, then Hong Kong and Singapore today. Cloudflare rates all of them minor and has
    published no root cause for any, so the block does not assert a common cause.

    Declined as routine: the 2026-08-23 kernel stable batch across seven trees (7.1.10, 6.18.46,
    6.12.105, 6.6.153, 6.1.184, 5.15.217, 5.10.266). No named regression or security driver, and the
    page already carries a Linux and kernel item. The GitHub changelog feed is stale at 2026-08-21
    and carried nothing dated today.

    No section was displaced and nothing was removed. Top stories stays at three because nothing
    found today outranks what is published, and padding it from a stalled corpus would mean
    promoting archive material. The day sits at seven stories against a budget of 25, which is an
    accurate reading of what the sources produced, not restraint.

    On miss_review: the backtest seeded no_query_match for the Codex-versus-Claude write-up and for
    Rust Glancer, but the 2026-08-23 digest notes record both as seen and deliberately declined, the
    first for having no measurement and the second as already published on 2026-08-22, so both are
    relevance_skip rather than query gaps. Munder Difflin at 290 points and Autolith at 121 points
    are agent harnesses that map directly onto the existing Agentic coding section and no query
    caught either, so both are watchlist_gap. The query set appears to cover MCP but not agent
    harnesses or Codex. Hister at 423 points is the other high-signal no-match, left unflagged
    because I could not settle whether a personal search index clears the Developer tools bar.

    Operational note for the review: the followups store now holds 41 records at roughly 71,000
    characters, which exceeded the tool output limit on a plain memory_query and had to be read from
    a spilled file. Most records date from July and several describe threads that have resolved.
    Since every run of the day pays to re-read those bytes, the store is worth pruning.

    Three additions, no displacement. Top stories goes from three to four, Outages from one to two,
    Developer tools from one to two. All three published sections stay under their caps and the day
    stands at ten stories against a budget of twenty-five, so nothing was removed. The three
    already-published Top stories are re-listed verbatim with their published titles and primary
    URLs only to express today's ranking. The single new Top story is the Anthropic outage at
    position two. Section blocks already on the page other than Top stories were deliberately not
    re-listed, because none of them changed and re-listing invites a rewrite of settled text.

    A check failure in an earlier run of this date is the most important thing here. The 10:23 UTC
    Sources checked line states that OpenAI and Anthropic carry no open or recent incident. That was
    already wrong when written. Anthropic's incident vgz5psbjmt1h opened at 05:06 UTC and resolved
    at 08:30 UTC, and GitHub's Copilot model-provider incident resolved at 07:58 UTC, both before
    that run. The incidents feed carries resolved incidents, so this was reachable. The likely cause
    is a check that reads only open incidents. Two same-day major incidents on watchlist status
    pages were missed for most of the day as a result.

    The cross-vendor link in the lead Outage story is inference and the entry should say so. GitHub
    names the Fable model and an unnamed upstream model provider. Anthropic names Claude Fable 5
    among the affected models. The windows overlap between 07:12 and 07:36 UTC. Neither status page
    names the other company, and neither has published a root cause, so the entry states each
    incident as confirmed on its own page and the connection as inference, not as an established
    fact.

    Anthropic's own resolution text gives 04:50 to 07:36 UTC as the impact window while the incident
    record runs 05:06 to 08:30 UTC. The entry uses Anthropic's stated impact window and gives the
    record times separately rather than reconciling them.

    Two further same-day GitHub incidents were checked and not published. Actions delays in starting
    runs, 13:56 to 14:34 UTC, rated minor, root cause promised and not yet posted. It is a routine
    short degradation with nothing to say beyond its own timestamps. GitHub's separate root cause
    for the two 2026-08-18 Actions Larger Runners incidents was re-posted at 05:55 and 05:56 UTC
    today, but that content is already published on the 2026-08-22 page and is not new.

    Security produced nothing today and the absence is the finding. The CISA catalog is still at
    version 2026.08.21 with the Zimbra entry as the newest addition, so the published Zimbra block
    remains the whole of the section. The GitHub advisories API returns nothing published after
    2026-08-21, and its three newest reviewed advisories, the two JSONata code-execution CVEs and
    the Hydra instantiate advisory, are already on the 2026-08-22 page.

    Dropped for want of a resolvable source: a Phoronix report dated 2026-08-22 that a crafted NTFS
    image on removable media grants root through the in-kernel NTFS3 driver, reported earlier in the
    summer and still unaddressed. Two guesses at the article URL both returned the Phoronix front
    page rather than the article, and no primary report, CVE, or maintainer thread was located, so
    there is nothing to cite. An unpatched local root in a mainline filesystem driver is worth a
    Security block once the original report can be read, and it is worth a deliberate check on the
    next run.

    The Emacs entry rests on split sourcing and the block should carry that. The info-gnu
    announcement is primary and confirms the version, the release date, the announcer, the signed
    tarballs, and the checksums. The feature list is Phoronix alone, because www.gnu.org timed out
    twice from this environment and the etc/NEWS URL printed inside the announcement returned 404 to
    this fetcher. The claims attributed to Phoronix should be attributed in the text rather than
    stated flat.

    Not published from today's Reddit corpus, each below its section bar or lacking a primary this
    run could verify: the Linux 7.3 EFI runtime-service timeout, the Intel DRM Fabric proposal,
    ReactOS job objects, the LWN block-layer error injection article, and Flatpak repository key
    rotation. Linux and kernel already carries the Steve French entry, and none of these is a
    stronger item than that.

    Hacker News contributed nothing for the third consecutive run of this date. The corpus has not
    advanced past 2026-08-23T15:18 UTC across three fetches spanning roughly fourteen hours, while
    the fetcher continues to report healthy. That combination, stalled data plus a clean
    self-report, is the part worth acting on. No Hacker News section is written, and no HN item ids
    were taken from anything other than the cache.

    ML research, New videos, Books, AI, Agentic coding, Apple platforms, Engineering posts, Markets
    and companies, Hacker News, and Reddit and social pulse are all omitted. For New videos and
    Books the reason is unchanged and mechanical: null discussion objects on every cached video for
    a fifteenth day, and a publisher catalogue of conference proceedings and tutorial titles the
    books bar excludes. For the rest, no candidate cleared its bar on verifiable material this run.

    Watchlist follow-ups is omitted. The followups store has forty-one open records and none carries
    a last_seen later than 2026-08-16, so the store has not been touched in eight days by any run.
    That is a maintenance gap this step cannot fix, since select holds no write capability, but it
    means a filtered follow-up query is not a reliable picture of what is actually open.

    On miss_review: the backtest seeded no default cause on any of its thirty-three candidates for
    2026-08-23, so these three are flagged as genuine engineering items that no configured query
    matched rather than as corrections to a wrong seed. 49393052, a Rust language server claiming a
    hundredfold RAM reduction at 406 points, is squarely in the languages and tools beat. 49393051,
    a practitioner comparison of a week on Codex against Claude at 215 points, and 49398152, an
    agent harness at 290 points, both sit in the agentic coding beat, which is a named section with
    no query reaching it. Three high-scoring items in one day inside covered beats points at query
    coverage rather than at ranking. Configuration changes need the owner-approved improvement path
    and this run touches nothing.
