    Lead reasoning. The Wikimedia post leads over the Denmark breach and mold 3.0. Denmark is the
    larger realized harm and mold is the more directly actionable toolchain change, but the
    Wikimedia item is the only one of the three that tells a working engineer something new about a
    risk to their own service. It is a first-party investigation by a named officer, it names the
    vendor it believes responsible, and it carries three distinct concrete mechanisms rather than a
    posture statement. The attribution hedge is real and travels with the block: Wikimedia
    repeatedly writes agents "we believe to be operated by OpenAI", OpenAI has not confirmed, and
    the only OpenAI position quoted is an admission that agents behave unpredictably. Wikimedia also
    explicitly found no compromise of its systems or data and no evidence its platforms were used
    for agent coordination, which cuts against the headline's implication and is stated in the
    block.

    Beam is published as developing on purpose, and the title leads on the parameter count rather
    than repeating the vendor's "open-weight" framing as an accomplished fact. The weights do not
    exist publicly: Reflection states final red-teaming is still running and promises artifacts
    "later this month" with no date. This is the fourth instance of the pattern already tracked in
    the announced-models follow-up alongside Instella-MoE, FLUX 3 and Qwen-Image-3.0, and it should
    be merged into that entry rather than opened as a new one. The benchmark table is entirely
    vendor-run, competitor scores are lifted from Artificial Analysis and DataCurve rather than
    reproduced, and the inference-efficiency claim rests on an estimated-FLOPs formula the post
    itself labels approximate and which excludes prefill, attention and serving overhead. None of
    those numbers is published as a comparative result.

