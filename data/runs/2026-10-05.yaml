    need changing. First, the legal basis is CPR law section 38, named explicitly by the ministry,
    not the "separate provisions of the same law" the block currently hedges to. Section 38 lets a
    private company with a legitimate interest retrieve data only on persons it has pre-identified
    individually by CPR number, by birth date and name, or by name and address, which is what makes
    8.8 million records the story rather than the breach itself. Second, the 8.8 million are
    registered persons including living, emigrated and deceased, against a register the ministry
    puts at about 11 million. The current block says "8.8 million people", which reads as living
    people and overstates. The cphpost-derived figure of 11.4 million persons including nearly 6.1
    million living came from the cpr.dk front page and is superseded by the ministry's own 11
    million. Third, the block does not carry facts both primaries state: the company's access has
    been stopped, the CPR administration filed with Datatilsynet, the police are investigating, the
    minister informed the Folketing's Erhvervs- og Digitaliseringsudvalg and ordered a full security
    review of CPR, and the investigation is in an initial phase with no attribution possible. The
    ministry still does not name the company, so the existing follow-up stands.

