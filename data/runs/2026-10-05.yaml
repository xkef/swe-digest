    mold 3.0.0 is the one item here that a reader will act on this week. It released today at 10:23
    UTC and is the first Rust build of the linker, with 2.42.1 the last C++ release. The migration
    detail matters more than the rewrite: Cargo replaces CMake, Rust 1.95 or later is required, the
    CMake options are gone, oneTBB is no longer a dependency, and MOLD_LIBDIR must be set when
    libraries go somewhere other than $PREFIX/lib. The stated goals are closing GNU ld linker-script
    gaps and becoming a distribution default linker.

