  notes: |
    Degraded coverage. YouTube returned no backend and zero items, so New videos is omitted rather
    than filled from HN links. Reddit reached 9 of 28 subreddits against a floor of 14, and top_day
    and hot each resolved only 1 of 28, so Reddit and social pulse is omitted and the two r/netsec
    findings used today were promoted into Security on their own primary sources. GitHub stars and
    the events watchlist returned empty collections without reporting degradation. Books returned
    only Springer LNCS conference proceedings, which do not clear the Books bar, so that section is
    omitted.

    Three pages would not load. The z.ai post behind "How GLM built its own inference
    infrastructure" (HN 49737922, 385 points, 265 comments) returned an empty body, so the day's
    highest-discussion engineering post is not carried. qwen.ai returned only the page title for
    Qwen 3.8 Omni Flash, repeating the access problem already recorded against the Qwen blog, so
    that model release is not carried. global.fujitsu rate limited on two attempts, so the day's top
    front-page item, the FUJITSU-MONAKA CPU launch at 554 points, is not carried either.

    The lead is two days old and that is deliberate. AWS confirmed on 2026-09-16, in a Health
    Dashboard update quoted by The Register, that it cannot restore resources and data held
    exclusively in me-south-1 or in the UAE zone mec1-az2. That is the exact signal the AWS Bahrain
    follow-up was opened to watch, yesterday's digest did not carry it, and permanent unrecoverable
    loss at a hyperscaler outranks anything the last 24 hours produced. It is filed under Top
    stories rather than Watchlist follow-ups for that reason, which leaves Outages carrying only the
    Telstra incident report. That is also the one backtest cause I am overriding: HN 49719249 scored
    as no_query_match, but an open follow-up already named data-loss scope as the thing to watch, so
    the correct cause is watchlist_gap.

    Top stories is four items, not five. Bonsai 2 27B and the GitLab.com rate limit change were the
    next two candidates and both went to their topical sections instead, because neither is one of
    the four items that define the day.

    Several popular threads were left out on purpose, and the absence is the finding. Astra for Law
    drew 425 points and 454 comments with no technical detail in the post and an HN discussion about
    job displacement, so it fails the launch-marketing test. Bend reached 396 points, and commenters
    reported the repository squashed to a single commit with no compiler present. The Neovim bitcoin
    donation thread carried 302 points and no technical substance. Hacker News is omitted because
    nothing HN-native cleared the bar once the verifiable stories moved to their topical sections.

    Two claims are carried below full confidence and are qualified in the story text rather than the
    status. Hacktron's wider HEIF Heist campaign against Slack, Meta, GitHub Enterprise and Shopify
    is the researchers' own account and is not independently verified, while the OpenAI and
    Discourse chain is confirmed by GHSA-vhm9-85gw-x335, CVE-2026-32882 and Debian DSA-6417-1.
    CrowdSec states the Tanstack compromise is very likely the leak vector, not confirmed. I could
    not find the Air researchers' own Plugin4Shell report and published The Register's account
    instead, which names the three researchers, the patched versions in Claude Code 2.1.179 and
    Codex 0.146.0, and on-record responses from Google, GitHub and Microsoft. No CVE appears to have
    been assigned. Separately, a Reddit post titled "Azure Storage outage across tenants/regions"
    was filed at 04:35 UTC today and the Azure status page showed no active events when checked, so
    nothing was published on that basis. The Register referenced a Swift 6.4 release on 2026-09-17
    that does not appear on the swift.org blog, so that was dropped rather than published
    unverified.

    Ranking and the shape of the day. This is a later run against a page that already carries six
    blocks. Nothing found today outranks anything published, so `displace` is empty and the day
    grows from 6 to 14 blocks against a budget of 25, with no section at its cap. The three
    published Top stories are restated in `top_stories` only to make the whole day's ranking
    explicit, unchanged in text and in order. They are already on the page and must not be
    duplicated. ZCode is added fourth rather than higher because it is one researcher's reverse
    engineering with no vendor statement, while the three above it are confirmed with vendor, CISA
    or advisory corroboration. It is added to Top stories rather than left in Agentic coding because
    it is the day's largest new developer-trust story by discussion volume across two Hacker News
    threads, and because the failure is not a bug but a design in which no user-facing setting stops
    the upload.

    Security no longer carries the no-major-items line. The previous run left it there because both
    of the day's security stories had been ranked into Top stories, which reads as a quiet security
    day when it was not. The Gyazo disclosure fills the section on its own merits.

    ZCode sourcing. The Hacker News submission at id 49752422 points at tokenstead.ai, which
    commenters in that thread identify as an AI paraphrase of the original. The primary is ferstar's
    own post at blog.ferstar.org, which I reached through the second thread at id 49750694 and then
    verified directly, and it is the URL carried here. That blog states its posts are AI-drafted and
    approved by the author, which is why the status is `developing` rather than `confirmed`. The
    forensic detail is specific and locally checkable: the packaging manifest is written to disk in
    plaintext, the encryption path is reconstructed from the client's app.asar, and the defence is a
    filesystem immutability flag. Against it, one commenter in the 49752422 thread reports no
    checkpoints directory and no capture logs on a long-running install. Z.ai has not responded. Do
    not write the mechanism as settled.

    Deliberately not carried. The Rust project's targeted-attacks post and Rust coreutils 0.12.0
    both surfaced strongly today and both are already published on 2026-09-17 under the same primary
    URLs, so they are archive duplicates rather than new stories. The GitHub Copilot Rust migration
    post is likewise already on 2026-09-17. JDK 27 general availability is on 2026-09-15 and Servo's
    sponsorship report on 2026-09-17.

    Dropped on merit. The Microsoft AI-scraping filing story drew 447 points and 364 comments and is
    the day's second-highest front-page item, but an executive quote surfaced from unredacted
    litigation filings does not change engineering context, so it fails the markets test rather than
    the interest test. The Infinite-Parameter LLM paper at arXiv 2609.18842 drew 151 points and is
    the day's most-discussed paper, but it proposes an architecture and then specifies an evaluation
    protocol without running it, so there are no results to report and it is not carried. Bend,
    Astra for Law and the Neovim donation thread were already dropped on this date for reasons that
    still hold. The Phoronix report of the Linux fix for silent user-space data loss under
    transparent hugepages and MADV_FREE is a real one-line fix marked for stable backport and traced
    to production data loss in Polars users, but it is dated 2026-09-14, drew 2 points today, and I
    could not reach the kernel merge or the report as a primary within this run, so it is held
    rather than published on a secondary alone. The Cloudflare AI bot policy defaults took effect
    2026-09-15 and the documentation page carries a July last-modified date, so there is no change
    to report today.

    Sections omitted and why. Reddit and social pulse stays omitted: coverage came back degraded
    again at 10 of 28 subreddits against a floor of 14, with top-of-day reaching 1 of 28. New videos
    stays omitted on a considered call rather than for want of items. The YouTube backend recovered
    and returned a full collection with no degraded channel, but every item has a null discussion
    link, and the guidance makes an external discussion thread both the filter and the ranker. The
    closest candidates were two LiveOverflow uploads covering the libheif chain and the Discourse
    advisory that the page already carries from their primary sources. Books is omitted: the
    publisher feeds returned Springer conference proceedings only, which are not trade technical
    releases. The GitHub stars and events fetchers each returned an empty collection while reporting
    no degradation, so both are uncovered for this date rather than quiet, and no story rests on
    either.

    Pages that would not load. None on this run. Every candidate carried here was read from its
    primary. The qwen.ai and global.fujitsu access problems recorded earlier on this date were not
    retested, and the Qwen 3.8 Omni Flash release and the FUJITSU-MONAKA launch remain uncarried for
    that reason.

    Miss review. Four candidates from the 2026-09-17 backtest are seeded `no_query_match` and should
    be `watchlist_gap` instead. Id 49719249, the AWS statement that data in the struck Middle East
    facilities cannot be restored, is the exact thing the open AWS Bahrain follow-up names as its
    watch signal, so a query should have caught it. Id 49715813, the FUJITSU-MONAKA CPU launch, was
    the top front-page item and is a major non-x86 server CPU release. Id 49737922, how GLM built
    its own inference infrastructure, is an inference-infrastructure engineering post at 335 points.
    Id 49724927, Google Play review times regularly exceeding a week, is direct operational impact
    on a large developer population. The story inbox was empty.

    Third pass of 2026-09-18. The page arrived carrying 14 blocks. This pass adds 5 and displaces
    nothing, taking the day to 19 against a budget of 25, with no section at its cap of 4. Top
    stories is affirmed at four in its published order. Nothing collected today outranks an actively
    exploited CVSS 10.0 with a CISA deadline of 2026-09-19, and neither of the two strongest
    additions is an incident, so the lead is unchanged.

    Degraded sources. Reddit is degraded for the third consecutive pass and fell further: top-of-day
    resolved 1 of 28 subreddits and day coverage reached 12 of 28 against a floor of 14, down from
    10 and then 12 earlier. Reddit and social pulse stays omitted. The stars fetcher again returned
    an empty collection while reporting no degradation, so the GitHub watchlist is uncovered for
    this date rather than quiet, and the events watchlist did the same. YouTube returned a full
    collection with no degraded channel, but every item again carries a null discussion link, and an
    external discussion thread is both the filter and the ranker for that section, so New videos
    stays omitted. Books was not re-fetched and the earlier finding stands.

    Pages that would not load, retested. All three failures recorded on the earlier passes were
    retried on this one and all three failed again. z.ai returned an empty body, so the GLM
    inference-infrastructure post at Hacker News id 49737922 is still not carried despite being the
    highest-discussion engineering item of the prior day. qwen.ai returned only the page title
    "Qwen", so Qwen 3.8 Omni Flash is still not carried, which is now the third recorded failure
    against that blog and matches the access problem already noted in the open follow-up on
    announced models. global.fujitsu rate limited again, so the FUJITSU-MONAKA launch stays
    uncarried. Three retries, three repeats of the same failure mode per host, which is a durable
    access problem rather than transient load.

    Calls a reader could not infer. The RP2350 finding is published as Security rather than Top
    stories because it needs destructive decapsulation, physical access and roughly $250,000 of
    equipment, so its value is the design lesson, that the mutable DEBUGEN override carries none of
    the redundancy the OTP flags it overrides do, not an operational risk to anyone shipping RP2350
    parts. AWS spend limits is placed in Infrastructure rather than Top stories because it is
    documentation for a limited release rather than an announcement, and because a capability
    addition does not outrank the four incidents above it. It is carried mainly for the destructive
    enforcement semantics, which the headline capability hides: deleting Bedrock provisioned
    throughput deletes custom fine-tuned model weights, top-cost-driver EC2 instances are terminated
    rather than stopped, and a paused project's data is permanently deleted after 90 days.

    The Python JIT item is dated 2026-09-01 and the council decision it reports is from June, so it
    is 17 days stale as news. It is published anyway because no other source covers a freeze on
    CPython JIT development with a stated removal threat, and the block states the dates so the age
    is visible rather than implied away. The C++26 item is likewise an explainer of an
    already-accepted proposal rather than news of it, and is carried for the concrete failure mode
    it demonstrates, an embedded halt-on-error loop that does not halt.

    Not published. Bend 2 and the Vibe-Coding Trap drew 291 points with a falsifiable claim, that
    SPARK and GNATprove prove Bend's own demo properties in a short specification against Bend's 58
    lines of laws plus 442 lines of generated proof. It is held because the earlier pass already
    dropped Bend itself on merit as a repository squashed to one commit with no compiler present, so
    a critique would publish the second-order item without the subject, and because the GNATprove
    result is the author's own run, verified only from the post. Cloudflare Quick Tunnels at 303
    points resolves to a product landing page whose only change is JSON output for coding agents,
    with no release note or technical detail, which fails the launch-marketing test. OpenJev at 426
    points resolves to a page that has renamed itself SemIf and describes itself as an independent
    research project, a browser-local demo rather than a release. Flet 1.0 at 149 points resolves to
    a marketing page with no release notes, so there is nothing to report beyond the version number.
    Ubuntu 26.10 completing its move of cp, mv and rm to Rust coreutils is carried only by Phoronix
    here, and the archive already holds Rust coreutils 0.12.0 from 2026-09-17, so it is held rather
    than published on a secondary alone. An arXiv preprint on poisoning self-modifying AI coding
    systems and a ClickHouse TimeSeries engine post both drew under 10 points and were not pursued.
    Hacker News stays omitted as a section: nothing native to it cleared the bar once the verifiable
    stories moved into topical sections, and the day's highest-scoring front-page items are an
    unredacted litigation quote, an opinion post on passkeys and a wax motor.

    Miss review. Four ids restate the judgment the earlier pass recorded against the 2026-09-17
    backtest: 49719249, the AWS statement that data in the struck Middle East facilities cannot be
    restored, 49715813 FUJITSU-MONAKA, 49737922 the GLM inference-infrastructure post, and 49724927
    Google Play review times exceeding a week. Four more are added on this pass as genuine
    engineering misses no query caught: 49735930, recovering the signing keys for US driver's
    license barcodes, which is a signing-key recovery the security queries should have matched,
    49733726 HarnessTax, which is squarely Agentic coding, 49718773, a PHP package with nearly 20
    million installs being deprecated by its author, which is dependency-ecosystem impact, and
    49732270, the Xiaomi Mimo 2.6 live post-training dashboard at 522 points. Two high-scoring
    candidates are deliberately left on their seeded causes rather than corrected: 49724881, Nvidia
    announcing native GPU programming in Rust at 886 points, and 49724488, the Salesforce global
    outage, were both matched by an existing query and then not published, so relevance_skip is the
    accurate cause and not a gap in the watchlist. The Nvidia one is the larger editorial miss of
    the two and is worth the weekly review's attention even though the cause is right.

    The story inbox was empty.
