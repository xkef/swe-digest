    First digest of 2026-07-22, created at ~04:45 UTC (an off-schedule run; the
    01:30 run left no digest). Full ~24h window; most large items broke late
    2026-07-21, so several strong HN threads were already covered in the
    2026-07-21 digest (Gemini 3.6 Flash, Qwen-Image-3.0, Poolside Laguna S 2.1,
    Block/Buzz, the AI-debt report) and were not re-added.
    HN: full structured coverage via Algolia (GitHub Actions egress, not the
    blocked datacenter range); no degradation.
    Reddit: degraded, datacenter HTTP 429 returned only ~4/28 subreddits live;
    used the committed six-hour snapshot (116 posts). Stated in Sources checked
    and re-dated in access-notes.
    Stars: quiet day, 0 events; no Notable-stars block.
    Books/events/New videos: nothing cleared the bar; sections omitted. 0 YouTube
    videos carried HN discussion.
    Backtest: 2026-07-21 miss_review was already seeded (defaults reviewed); the
    scrape_gap-heavy distribution reflects the datacenter HN-fetch limitation and
    covered stories resurfacing. No candidate promoted to watchlist_gap.
    Access blocks hit this run: ads.openai.com (403), apnews.com (unable to
    fetch); worked around with own-domain link + WebSearch and corroborating
    outlets. FT Oracle/Wisconsin item dropped because the only available FT URL
    from search was truncated/unresolvable (link hygiene).
    Update run ~11:35 UTC (deep sweep after the 04:45 create). Re-ran all
    fetchers; full GitHub releases + trending checked, nothing new past patch
    releases (grafana 13.1.1, otel-collector 0.157.0, chezmoi 2.71.1, all minor
    or already tracked). Added four items: snap-confine CVE-2026-8933 Qualys LPE
    (Security, from r/linux, no HN thread), Apple CSAM-scanning liability
    dismissal Amy v. Apple (Security), CJEU C-788/24 geo-blocking/VPN ruling
    (Security), and FreeInk open e-reader ecosystem (Dev tools, discussion,
    substance unverified). source_count 26 to 34. Did not re-add the
    OpenAI/HF eval-escape incident (day's top HN thread at 1238 pts) since it
    was 2026-07-21's lead and already reflected in today's pulse; no concrete
    new 2026-07-22 development beyond continued sanctions discussion.
    Reddit this run: live fetch degraded again (5/28 top, 3/28 hot before 429);
    snapshot content still backs the pulse.
    Update run ~17:00 UTC (third run, after the 04:45 create and 11:35 deep
    sweep). Re-ran all fetchers. HN full structured coverage via Algolia, no
    degradation. Added three verified new stories: Gemini API deprecates
    temperature/top_p/top_k on Gemini 3.6 Flash / 3.5 Flash-Lite and all future
    models (AI section, confirmed, Google docs primary); Codeberg Terms-of-Use
    ban on mostly-AI-generated projects after a membership vote (Developer
    tools, confirmed, ToU PR primary, also corroborated in r/selfhosted);
    Hatchet Postgres survival guide (Engineering posts, discussion,
    substantive practitioner writeup). Created new AI and Engineering posts
    sections. source_count 34 to 40. Considered and skipped: the Michael
    Kratsios (White House OSTP) tweet accusing Moonshot of distilling Fable for
    K3 (bare 28-pt tweet, unverified political accusation, theme already
    reflected in pulse); Armin Ronacher "Never Enough" (personal essay, not
    engineering-relevant per social rules); the Kimi K3 AA-Briefcase benchmark
    and BBC/OpenAI-HF secondary coverage (already covered). Reddit live fetch
    degraded again (4/28 subreddits, exit 1); committed snapshot now 276 posts,
    re-dated in access-notes and Sources checked. Stars/events quiet (0).
    Books/YouTube: nothing cleared the bar. Backtest skipped (2026-07-21 already
    reviewed by an earlier run). Weekly trigger not due (newest marker
