    titles:
    - Researcher signs forged C2PA images on a fully patched Pixel, and Google closes the report as Won't
      fix (infeasible)
    - >-
      OpenAI publishes the first Jalapeno benchmarks at Hot Chips 2026, and SemiAnalysis reports the 700W
      part beating Blackwell on throughput per megawatt
    - Firefox 157 will ship JPEG XL on all platforms using a Rust decoder Mozilla required before it would
      ship the format
    - >-
      PromptArmor established an attacker command loop inside the Microsoft Copilot Cowork sandbox, and
      Microsoft confirmed a mitigation on 2026-08-19
    - Alibaba dates Qwen3.8-Flash-Next to 2026-08-26 and describes it as a preview of the Qwen4 architecture
    - CVE-2026-18963 lets an unauthenticated attacker complete a Keycloak password reset without the verification
      link
    - The mold author publishes a linker paper reporting 2.4x to 16.1x over lld, accepted to ASPLOS 2027
    - EVE Online begins moving 2.4 million lines of Python 2.7 to Python 3 and deploys the first stage
      to Tranquility
    - The nitter repository is archived read-only and public nitter instances stop working
    - A post on Python's six pre-declared constants draws 142 comments
