    The Qwen countdown block is superseded and replaced. The 10:41 run correctly published the
    Hugging Face page as a countdown placeholder for an unreleased model, and correctly refused to
    publish the circulating 125B a6B figure because the ModelScope listing it came from returned
    only a JavaScript shell. The model has since shipped. The card now carries weights, a technical
    report link, and an architecture section that confirms 125B total with 6B activated, plus 51B of
    n-gram embedding and 4B of MTP, 48 layers, 512 experts with 10 routed and 1 shared activated,
    262,144 native context extensible to 1,000,000, and a hidden layout pairing Gated DeltaNet with
    Qwen Sparse Attention. The license is qwen-community-1.0, not a standard permissive license.
    Every benchmark number on the card is vendor-run and several carry harness caveats in the card's
    own footnotes.

    GLM-5.3-Flash is the second model item and is the stronger licensing story. The Hugging Face
    card is MIT, 320B total with 18B active, described as the first natively multimodal model in the
    GLM-5 series, with a hybrid sparse and linear attention architecture, Manifold-Constrained
    Hyper-Connections, and a stated 30T-token multimodal pre-training corpus. Serving paths for
    SGLang, vLLM, TokenSpeed, and KTransformers are published. The card's comparisons to GLM-5.2 and
    to Claude Opus 4.8 are vendor-run, and its HLE figure is measured with tools on the full set
    under a 300K context management strategy and judged by GPT-5.6-luna, not the task default, which
    the card discloses in a footnote. Z.ai's own blog at z.ai returned an empty body to this run and
    qwen.ai returned a two-word JavaScript shell, so both blocks rest on the Hugging Face cards
    rather than on the vendor blog posts. That is a second host class, after openai.com, where the
    primary announcement was unreadable from this environment.

