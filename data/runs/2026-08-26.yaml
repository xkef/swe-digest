    The lead changes again, on a real state change rather than on volume. DuckLabs announced on
    2026-08-26 that it will join AWS, expected effective early September. The post is signed by Mark
    Raasveldt and Hannes Muehleisen and states that DuckDB, DuckLake, Quack, and the other
    open-source components stay free and MIT licensed, that the nonprofit DuckDB Foundation
    continues to hold the IP and steward the projects, and that the team stays together in
    Amsterdam. Two forward commitments are stated and not yet delivered: a technical advisory board
    inside the Foundation, and opening the extension stack so extensions signed by other developers
    and organizations can run. The quoted parties are Andy Warfield of AWS, Peter Boncz for CWI on
    the Foundation board, Torsten Grust of Tuebingen, Jordan Tigani of MotherDuck, and George Fraser
    of Fivetran. No terms are disclosed, and this run read no AWS-side page, so the block rests
    entirely on the DuckLabs announcement. The Hacker News title reads "AWS Acquires DuckDB", which
    is not what the announcement says: the company is acquired, the project stays with the
    Foundation. That distinction is the reason the block is worth writing carefully.

    Ranking of Top stories, strongest first: DuckLabs, then Nitter and XCancel, then C2PA, then
