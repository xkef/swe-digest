    Top stories ranking. The C2PA work leads on evidence quality and present-tense consequence: it
    is first-hand research with a published proof of concept, it names CVE-2026-43499 as a one-click
    root path that still works on fully patched Pixel devices, and Google closed the report as Won't
    fix (infeasible) while paying a 7,500 dollar bounty for an attack class its bug bounty formally
    excludes. It also continues the C2PA thread this archive opened on 2026-08-25 with the Microsoft
    Paint watermark item. Jalapeno is second and is the weakest-sourced of the five, because every
    performance number was supplied by OpenAI. SemiAnalysis states it verified the InferenceX runs
    in person but did not run the full suite, has no AgentX results, and argues the Blackwell
    comparison is unfair because Jalapeno competes with Rubin, which is shipping while Jalapeno is
    at engineering samples. Those caveats are why the block is developing rather than confirmed.

