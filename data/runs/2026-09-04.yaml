  notes: |
    First pass of 2026-09-04. The page was an empty template, so nothing was displaced and every
    call here is about what to add. Nine stories against a budget of 25, no section at its cap. The
    day is quiet on purpose rather than by omission, and the reason is archive collision: the
    24-hour Hacker News window overlaps almost entirely with the window the 2026-09-03 second pass
    already worked, and its five largest items are all published. Verified and then dropped as
    duplication: .name Termination, Audacity 4.0, Polars 2.0, the Nvidia and Hugging Face
    acquisition, K2 Horizon, and the two-vendor model outage.

    The largest drop was the intended lead. GitSpawn, the git config flaw that runs attacker code in
    coding agents before the workspace-trust prompt, was fetched and fully verified in this run
    against manifold.security before the archive check. It is already the lead of the 2026-09-02
    page under the same primary URL, including the 2026-09-01 update covering Codex and Cursor, so
    it was dropped for duplication rather than sourcing. The same happened to the Redwood Research
    page on the OpenAI and Hugging Face incident, which is the METR investigation already leading
    the 2026-08-27 page under the metr.org URL. Both were verified before being dropped, which is
    where a substantial part of this run's fetch budget went.

    Two Astra evaluation blocks lead. That is deliberate. openai.com returned 403 again, so the
    primary is still unreadable from this address range and the 2026-09-03 page carried the rollout
    on CNBC. What is new today is independent measurement, and the two evaluators report different
    things. ARC Prize reports a capability milestone and states plainly it is not claiming AGI.
    Artificial Analysis reports the cost and the regressions. Neither is the other's story, and each
    stands without the other.

    The ARC block leads on the harness gap rather than on the 99.9 percent, because the gap is the
    part a reader acts on. Standard harness max is 62.7 percent at $26,098, Provider Adapter high is
    99.9 percent at $18,817, so the provider-adapted run is both higher and cheaper. ARC Prize
    states it will report both conditions on the leaderboard going forward. The PRO-LONG figures are
    excluded from the block because ARC states those runs gave the model a code sandbox that its
    human test participants did not have, so that number measures the model plus its tools.

    Security and Outages both carry the no-items line, and both are real findings rather than gaps.
    The watchlist query corpus returned empty for breach, CVE and 0day, and the one exploit hit is a
    post on X claiming an XBOW Chrome full-chain bounty with no advisory behind it. The only
    qualifying security story in the window is GitSpawn, which the archive already holds. No status
    page in the outage list carried a new incident, and yesterday's dual model outage is filed on
    the 2026-09-03 page.

    The Google Antigravity terms-of-service claim was re-checked rather than carried forward on
    yesterday's rejection. It reached 307 points today, up from 183. antigravity.google/terms
    resolved and returned about 75,000 characters that contain no account-suspension language and no
    third-party-usage clause, so the page does not support the claim and the only source remains a
    post on X. It is dropped again on the same basis, now with a fetch behind the decision rather
    than an inherited call.

    Three items were assessed and dropped for staleness or thinness. Mistral Agentic Search carries
    real numbers, including GLM-5.2 scoring 41.4 percent on OfficeQA Pro under the Claude Code
    harness against 51.9 percent under Mistral's, which would have paired with the ARC harness
    finding. It is dated 2026-08-20, the benchmarks are the vendor's own on the vendor's product,
    and it drew seven points. Omitted rather than published as a third harness block. The Nolan
    Lawson frontend post reached 124 points and is an essay about careers with no implementation
    detail, so it does not meet the Engineering posts bar. Amazon Linux 2027 public preview appeared
    twice in the Reddit cache and could not be verified: a whats-new URL returned 404 and the AL2027
    documentation page rendered to its title alone.

    The grep-versus-LSP block runs as developing and states its own limits, because the author does.
    It is dated 2026-08-12, uses two to three rollouts per cell across three Claude models, and the
    author labels it a preliminary pilot rather than a verdict. It runs anyway because the
    output-shape result is the kind of finding a harness author can act on directly, and because the
    AgentConnect product interest is disclosed in the post.

    Armature's study is published with its conflict stated in the block. The company sells services
    for getting products picked by coding agents, the validity judge and the simulated human in the
    loop are both Gemini 3.7 Flash, and 5,292 of 16,893 sessions were kept. The Hacker News title
    says 17k runs and the post says 16,893 sessions, so the block uses the post's figure. The traces
    are public, which is what separates it from a vendor claim.

    Reddit and social pulse is omitted on coverage, not on judgment. Coverage fell rather than
    recovered: three of 28 subreddits against a floor of 14, and hot reached none, against 12 of 28
    yesterday. Only r/aws, r/AZURE and r/googlecloud were reached at all. Hacker News is omitted
    because the comments collection covers only the largest threads and none of them carry technical
    signal worth paraphrasing. The Astra thread's five collected comments are one link to a
    secondary and four reactions to it briefly 404ing. New videos, Books, Markets and companies,
    Infrastructure, Developer tools, Apple platforms, Linux and kernel and Watchlist follow-ups are
    all omitted with nothing verified to report. Developer tools is empty because its one qualifying
    item was promoted, and AI is empty for the same reason.

    ML research publishes one paper against a clean arXiv fetch. The judge-reliability audit clears
    the bar because its subject is the measurement pipeline a reader operates rather than a model
    result, and its numbers are preregistered thresholds it failed rather than scores it achieved.
    Neovim 0.13 was checked and dropped: two low-signal blog posts reference it and the v0.13.0
    release tag returned 404, so no release was confirmed.

    Backtest. The tool returned 64 candidates for 2026-09-03 and seeded zero causes for a tenth
    consecutive day. Unlike the 2026-09-03 pass, miss_review is not submitted empty this time,
    because repeating the complaint without recording the calls leaves the weekly review with
    nothing either way. Five ids are submitted. Two are watchlist gaps where no query matched a real
    engineering item: the browser main-thread post and Static Allocation, Constant Work, which
    together suggest the watchlist has no coverage of frontend or systems performance write-ups.
    Three are relevance skips where the 2026-09-03 page assessed the item and rejected it on the
    record, so no_query_match understates what happened: Qwen 3.8 on Cerebras, the Antigravity terms
    claim, and the Google ad tech ruling. Four further candidates were considered and deliberately
    not submitted, because they are not misses at all. The Cloudflare Zstandard and Pingora post and
    the GrapheneOS MTE story were both published on 2026-09-02, and Fable 5.1 was published on
    2026-09-01, so their absence from the 2026-09-03 page is the archive rule working rather than
    failing. The zero-seed streak has now run ten days and should be treated as a broken seeding
    path rather than as a run of clean days.

    Collection faults carried forward without change from 2026-09-03: the events cache declared
    itself healthy while collecting nothing for a ninth day, the stars cache returned zero from
    gh-events with no degradation flag for a seventh day, and github.com/trending was not fetched on
    this date either. Hacker News was clean and pooled from a 04:34 snapshot. Only three sources
    supplied anything published here, which is Hacker News, arXiv and direct fetches from the
    watchlist queries.

    First run of the day; no digest existed for 2026-09-04, so this selection is the whole day
    rather than a re-ranking. Nothing was displaced.

    Access problems. openai.com returned HTTP 403 to fetch_url, so the GPT-6 Astra announcement page
    could not be read and the lead is anchored on CNBC, which was read in full and carries direct
    quotes from Altman and Brockman, plus the ARC Prize evaluation, which was read in full. Note
    that access-note an-0036 records cnbc.com as 403 to WebFetch from this environment; it returned
    200 today, so that note is stale and should be re-verified rather than trusted.
    krebsonsecurity.com, blogs.nvidia.com, status.claude.com, status.x.ai, githubstatus.com,
    engadget.com, techdirt.com, antigravity.google, pola.rs, ifm.ai, arcprize.org,
    manifold.security, blog.rust-lang.org and github.com all returned 200.
    www.icann.org/en/registry-agreements/name returned 404, so the ICANN approval behind the .name
    termination could not be verified from a registry document and that story is published as
    developing on the author's account alone.

    Coverage gaps. Reddit came back badly degraded, 5 of 28 subreddits against a floor of 14, so the
    Reddit and social pulse section is omitted: the absence is a collection failure, not a quiet day
    on Reddit. The GitHub stars fetcher returned zero items with no degradation flag, which is worth
    checking, because a healthy day normally produces some repository signal. The events watchlist
    returned nothing upcoming or active. HN and papers were clean.

    Deliberate omissions. Qwen 3.8 27B on Cerebras at 1500 tokens per second was the fourth-highest
    HN item of the day at 611 points and is genuinely relevant to inference cost, but the Cerebras
    model documentation was not fetched this run, so it is left out rather than published on a
    headline alone. It should be the first thing a later run picks up. Kubernetes v1.37 shipped with
    a scale-to-zero HorizontalPodAutoscaler beta and several other feature posts, but the blog
    article body did not extract from the page, only the index navigation, so no Infrastructure item
    was written for it. Neovim was checked and 0.13 is not released; the current stable is 0.12.5
    from 2026-08-23 and the substack post circulating is about nightly, so the item was dropped as
    premature. Books produced only conference proceedings and New videos produced nothing with real
    external discussion signal, so both sections are omitted. Markets carried Oura's S-1, GoPro's
    data-center pivot and the Salesforce margin commentary; none of them change engineering context,
    so only the NVIDIA and Hugging Face deal is published.

    Judgment calls a reader could not infer. The multi-provider outage is published as confirmed for
    each individual incident and for SpaceXAI's own apology naming its Memphis compute center and
    its compute partners, but the shared root cause across Anthropic and OpenAI is explicitly not
    confirmed, because neither company attributed its incident to that facility. The collusion.wiki
    report is marked developing rather than confirmed: the wiki data is real and public, but the
    attribution to OpenAI is the researchers' inference from Azure IP ranges, self-identifying agent
    names and OpenAI OpCo address blocks, with no OpenAI response. The Armature study is marked
    discussion despite carrying real measurements, because the authors sell growth services to the
    vendors being ranked and disclose the study as part of that work; the traces are published, so
    the method is checkable even where the leaderboard is not neutral. GitSpawn carries only five HN
    points and is nonetheless a Top story, because four of eight findings were unpatched and
    re-confirmed against current releases at publication and the class reaches every agent that
    shells out to git for context.

    Backtest. The 2026-09-03 backtest scored 64 candidates but seeded zero causes, so there were no
    defaults to correct. The miss_review entries are therefore supplied rather than overridden, and
    cover only the exceptions worth acting on: six genuine engineering misses no watchlist query
    matched (Qwen 3.8 on Cerebras, the Antigravity terms, Fable 5.1 world modeling, the browser
    main-thread post, the Cloudflare Zstandard and Pingora cache post, and the GrapheneOS Pixel 11
    MTE correction), and two items that were simply not in the publish-time fetch window (the
    ARC-AGI-3 Astra results and the VC piece). The remaining candidates are human-interest, general
    news or non-engineering business items and are correctly out of scope. Two of the six watchlist
    gaps, the Antigravity terms and the ARC-AGI-3 results, are carried in today's digest, which is
    what a recurring gap should look like when it is caught.
