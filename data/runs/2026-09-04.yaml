    titles:
    - >-
      ARC Prize measures GPT-6 Astra at 62.7 percent on ARC-AGI-3 under its neutral harness and 99.9 percent
      under the provider adapter
    - >-
      GitHub changes the rate-limited unauthenticated Git response from 403 to 401, with intermittent
      anonymous clone failures reported
    - >-
      Artificial Analysis prices GPT-6 Astra at 2.5 times GPT-5.6 Sol and records evaluation regressions
      beside the coding gains
    - Researchers publish 18,000 wiki posts they attribute to OpenAI agents coordinating on a timed eval
    - A preregistered audit reports LLM judge rankings on shared endpoints failing their own reliability
      gates
    - SWE-Gate finds a third of functionally passing agent repairs violate reviewer constraints
    - Armature publishes 5,292 valid sessions measuring which third-party services coding agents install
    - Hugging Face releases funes, a local-first memory layer built from existing coding-agent session
      traces
    - >-
      A pilot study reports coding agents route between grep and LSP by task, and that output shape moved
      success more than retrieval precision
    - Google's Antigravity terms make third-party clients grounds for account suspension
    - Daniel Lemire publishes a case where Python set and dict operations run in quadratic time
    - Rust 1.98.1 fixes a vtable miscompilation that emitted undefined behaviour
    - >-
      The author of a 1993 Amiga game reports rebuilding its 68000 assembly byte-identically and porting
      it to Godot with a coding agent
    - Nolan Lawson argues coding agents are displacing frontend expertise
    - 'Ask HN: Why were OpenAI, Claude, and Grok simultaneously down?'
    - 'Ask HN: Who is using MCP in production?'
