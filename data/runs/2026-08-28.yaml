    titles:
    - PaperCut reports active exploitation of a flaw affecting every PaperCut NG and MF version
    - UniBLEed documents two root RCE chains on the Unitree G1, one of five bugs over Bluetooth
    - SourceHut will prohibit LLM-assisted original content in its terms of service from 2026-09-10
    - Anthropic opens a research preview of the Model Hardware Standard for agents driving physical devices
    - Gemini Omni 1.1 Flash adds scene extension to 40 seconds, keyframe control, and 4K upscaling
    - Gemini 3.5 Transcribe reaches public preview with separate streaming and pre-recorded APIs
    - Spectral Allocation accounts for Muon's advantage over Adam and proposes SAMuon
    - OWASP opens an Agentic Skills Top 10 covering skill formats on four agent platforms
    - ShinyHunters publishes 50GB from Carhartt and Have I Been Pwned counts 12.9 million accounts
    - A fuzzer-found divide by zero in FFmpeg's VPK demuxer crashes on a 21-byte input
    - Colin Percival ships Route 53 Files, an unofficial NFS filesystem over Route 53 records
    - A Tell HN report says the PayPal Android app now fails on GrapheneOS with a root detection exception
