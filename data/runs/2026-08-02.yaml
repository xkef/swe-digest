  notes: |-
    First run of 2026-08-02. The digest file was still the empty template, so nothing was displaced
    and `displace` is empty. Thirteen stories selected against a cap of 25, with no section above 4.

    The day's shape is a formal-verification and kernel-correctness cluster, and the ranking follows
    that rather than HN volume. The lead is not the ripgrep issue itself, which the 2026-08-01
    digest already carried as a musl mallocng segfault. What is new today is dfoxfranke's separate
    analysis repository, which escalates it from an allocator bug to a claimed Linux kernel race: a
    thread's own store to a freshly faulted anonymous page is visible to an immediate reload and
    gone about ten instructions later, with pagemap showing the address backed by the kernel zero
    page. The repo rules out use-after-free and buffer overrun on four grounds and pins the
    suppression to prefaulting one specific page. I marked it `developing` deliberately. It is an
    independent source-level review of Linux 7.0.12 naming a v7.0 munmap-teardown change, not a
    maintainer-confirmed diagnosis, and an HN commenter asked the same question. Kernel mailing-list
    archives sit behind the Anubis gate from this environment (access-notes an-0019), so I could not
    check for a maintainer thread and did not imply one exists.

    The Lean postmortem and the OpenAI ten-proofs release are two halves of the same question and I
    ranked them adjacently on purpose. De Moura's post is first-party and unusually candid: the bug
    was reachable only through metaprogramming, the fix landed an hour after the report, and
    independent checking survived only because the official kernel and nanoda had two different
    bugs. OpenAI's repository is the checkable artifact, Apache-2.0, Lean 4.32.0 and mathlib, ten
    named files including ConnesRigidity.lean. I did not connect the two beyond stating each as
    fact. Asserting the certificates are affected by the kernel bug would be speculation and I have
    no evidence for it.

    Two things I could not verify and therefore did not publish. HN 49140869 links a philarchive PDF
    claiming OpenAI's Connes rigidity disproof is invalid; philarchive returned HTTP 403, so the
    rebuttal is not in the digest at all. Its absence is why the OpenAI story is `developing` rather
    than `confirmed`, and it is the single most likely thing to change tomorrow. openai.com also
    returned 403, so the OpenAI story is sourced from the GitHub repository rather than the
    announcement post.

    Go 1.27 needed correcting. The HN item is a third-party interactive tour and reads as a release;
    go.dev/doc/devel/release tops out at go1.26.5 and the draft notes state Go 1.27 is not yet
    released and is expected in August 2026. Published as `developing` and sourced to the official
    draft notes first, with the tour second.

