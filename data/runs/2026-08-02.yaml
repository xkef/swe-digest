    The main finding of this run is that the earlier run's judgment on Coldcard was wrong and I
    reversed it. Both prior runs dropped it, the second recording it as "consumer self-custody
    rather than an engineering failure a reader can act on" on the strength of a CoinDesk framing.
    That was a read of the wrong source. The vendor page at coldcard.com/docs/upgrade carries a
    first-party urgent hotfix dated 2026-07-31 with everything the Security bar asks for: affected
    versions, entropy figures, and a mitigation. Mk3 seeds generated on 4.0.1 through 4.1.9
    inclusive are stated at about 40 bits, Mk4, Mk5 and Q at as low as about 72 bits, against a
    stated target of 128. Fixed in v5.6.0, v1.5.0Q, v4.2.0 and Edge 6.6.0X/QX, all released
    2026-07-31, with a BIP-39 passphrase named as a stopgap. The Coldcard/firmware commit history
    independently shows a commit "fixes rng" immediately before those three release commits. I
    ranked it second rather than first because the Anthropic disclosure is a completed breach of
    three organizations and describes a failure class that reaches every lab running agentic
    evaluations, where this reaches one product line.

    The root-cause mechanism is a third-party reading and I kept it separate from the vendor facts.
    A Core Lightning developer traced it through public commits to `#define MICROPY_HW_ENABLE_RNG
    (0)`, added in a commit whose entire message is the word "runs" against about 1534 changed
    lines, which removed the STM32 hardware RNG path so that `random.bytes(32)` in
    `make_new_wallet()` fell through to MicroPython's Yasmarang generator. The analysis argues the
    define was set to silence a duplicate-symbol compiler error from a hand-copied
    `MP_DEFINE_CONST_FUN_OBJ_0(pyb_rng_get_obj, ...)`. Coinkite has published no postmortem naming a
    mechanism, and the vendor page links a blog announcement whose URL I did not resolve, so the
    mechanism should be attributed to the analysis and not written as vendor-confirmed. Worth
    chasing tomorrow.

    Go 1.27 moved from Top stories to Languages and runtimes rather than being dropped. Top stories
    was full at five, the Coldcard item outranks it, and Go 1.27 is a draft for a release that has
    not happened. It is still a real migration signal, so it keeps a slot, just not a top one. This
    is the only change to anything already published and no story was removed from the day.

    The Android item is deliberately `developing` because two sources disagree on what happened. The
    Open Home Foundation write-up, by the Home Assistant Android developer the Commission consulted,
    says the EC "adopted a decision" on 2026-07-16 requiring Alphabet to open eleven features, and
    gives the deadlines as Android 18 by 2027-08-01 and concurrent hotword detection by Android 19
    no later than 2028-08-01. The Commission's own DMA news index confirms an item dated 16 July
    2026, but titles it "Commission provides guidance to Google for AI interoperability on Android".
    Guidance and a specification decision are not the same instrument and I could not fetch the
    underlying document to settle which it is, so the block leads with the participant account for
    the technical detail and does not assert a binding mandate. A reader of the finished page cannot
    see that gap.

