    titles:
    - >-
      Coldcard ships an urgent hotfix after a build flag disabled the hardware random number generator,
      leaving seeds with as little as 40 bits of entropy
    - >-
      A ripgrep segfault investigation localizes a Linux kernel TLB-shootdown race between the per-VMA-lock
      anonymous fault path and concurrent munmap
    - Lean publishes a postmortem for kernel soundness bug 14576 after an AI-assisted false disproof of
      Collatz passed both the official kernel and a then-week-old version of the main external checker
    - OpenAI publishes ten claimed advances in mathematics and theoretical computer science with Lean
      4 certificates under Apache-2.0
    - >-
      Wafer measures Kimi K3 at 952 tokens per second per node on eight MI355X after fixing a missing
      ROCm top-k renorm and an AITER prefill head-count mismatch
    - ByteDance releases Seedance 2.5 without published weights
    - A token-cost-matched study finds no self-inspection method beats repeated sampling in open models
      from 1.5B to 7B
    - >-
      Unit 42 reports XCSSET v40 spreading through the Xcode projects of legitimate apps since April 2026,
      with fileless persistence and suppression of macOS security updates
    - >-
      A scan of 7.6 petabytes of public Hugging Face datasets finds 221,303 live credentials, including
      349 live GitHub personal access tokens
    - RFC 10015 makes finite-field Diffie-Hellman and RSA key exchange MUST NOT in TLS 1.2 and DTLS 1.2
    - A USENIX Security paper shows the major end-to-end encrypted messengers give no transcript consistency
      in group chats
    - >-
      Go 1.27 draft release notes describe generic methods, encoding/json/v2 backing encoding/json, and
      a post-quantum crypto/mldsa package
    - >-
      The Rust All Hands 2026 retrospective records settled reference and union validity, renewed momentum
      to stabilize Allocator, and a rustdoc JSON path for cargo-semver-checks
    - Solid Queue 1.6.0 adds fiber-based workers
    - NetBSD 11.0 ships with three open security pull-ups the project chose to disclose rather than delay
      the release for
    - >-
      An Android developer consulted by the European Commission describes what the DMA interoperability
      action requires Alphabet to open, including DSP wake word detection
