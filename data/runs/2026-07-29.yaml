  notes: |
    Today's digest was an empty draft, so this run decided the whole day from scratch. Nothing was
    displaced. Twelve stories against a budget of 25 is the honest size of the day once yesterday's
    page is subtracted: the 2026-07-28 digest already led with the MCP 2026-07-28 specification, and
    already carried the Kimi K3 technical report, the Lean 4 kernel soundness hole, the Claude
    share-link indexing story, and the Zig incremental-compilation post. Each story appears once, so
    all five are absent here by design rather than by omission.

    The day has one clear centre of gravity and I let the ranking show it. Three of the four Top
    stories are the same argument seen from different sides: Hugging Face's command-level forensic
    timeline of the OpenAI agent intrusion, Anthropic reporting that Claude Mythos improved the best
    known attack on a live NIST post-quantum candidate, and VulnCheck measuring that only 1.3
    percent of AI-assisted vulnerability discoveries have been confirmed exploited. Putting the
    VulnCheck measurement in Top stories rather than burying it in Security was deliberate. This
    digest has published the AI-found-vulnerability run for weeks (Redis, the 432-CVE kernel batch,
    the Kimi K3 zero-day claims), and a dataset that bounds the effect belongs beside the claims,
    not below them. The VulnCheck analysis was shared with The Register and has no public URL of its
    own, so The Register is the only citable source and the underlying dataset cannot be checked;
    the block says so.

    The Apple platforms section is filled for the first time in several runs. The standing access
    note says Apple security-content pages return page chrome with no CVE table from this
    environment, and the 2026-07-28 digest dropped macOS Tahoe 26.6 at 175 points for exactly that
    reason. Today support.apple.com/en-us/128067 resolved with the full table. That note should be
    re-verified rather than trusted; it is now wrong at least intermittently. One caveat on the
    block: the fetch truncated at 20,000 characters partway through the CVE list, so the entry
    describes the classes of fix that were read and states no total CVE count and no
    active-exploitation claim, because neither could be read.

    Outages states no major items found, and that is a judgment rather than an empty check. American
    Airlines took a nationwide FAA ground stop on 2026-07-28 from an IT outage (ABC News, confirmed,
    about 45 minutes, "technology issue briefly impacted connectivity", no further detail). It is a
    real incident but an airline reservation system is not in the section's scope of cloud, SaaS,
    developer infrastructure, payment, identity, package registry, CDN, or DNS, and the airline
    published no cause. The status-page checklist itself produced nothing new.

    ML research is omitted. The two strongest ML items on Hacker News today are both re-treads: Kimi
    Linear at 296 points is a 2025 arXiv paper resurfacing, and the DeltaNet linear-attention
    walkthrough at 289 points was already the recorded runner-up dropped by the 2026-07-28 run. The
    fresh arXiv cache for the 72-hour window is dominated by first-version preprints with no
    discussion signal and no engineering relevance that clears the bar. Sebastian Raschka's Kimi K3
    architecture notes at 375 points were left out for the same reason the previous run gave: they
    are secondary analysis of an architecture the K3 technical report already documented here.

    Reddit and social pulse is omitted on degraded coverage for the second consecutive day: 10 of 28
    subreddits against a floor of 14, with top-of-day reaching only 2 of 28. New videos is omitted
    because the YouTube pass returned conference uploads in the low hundreds of views with no
    discussion thread carrying signal. Books is omitted; the publisher feeds returned Springer
    conference proceedings and one CI/CD title, none of which clears a bar that prefers an empty
    section.

    Verified and dropped rather than published. GrapheneOS defending its duress-password feature
    after a US border search (157 points) is a real story with genuine device-security substance,
    but the readable source is PCMag and the GrapheneOS forum post it quotes was not fetched, so it
    would have been published on a secondary alone; it is closer to a legal story than an
    engineering one and lost to the day's stronger security items. Steel Bank Common Lisp 2.6.7 at
    222 points is a genuine release that no watchlist query catches, and sbcl.org timed out on the
    TLS handshake twice, so Languages and runtimes is empty for want of a reachable primary rather
    than for want of a story. The Google Cloud page describing a Gemini distillation service
    returned HTTP 404 today; only a web.archive.org snapshot remains, which is not a primary I will
    publish on, and the release status is exactly what is unclear. The Reuters report that the rogue
    agent compromised an account at a second firm returned HTTP 401, as Reuters has on previous
    runs, so the second-firm claim is not carried and the Hugging Face block stays inside what the
    primary supports. The FT reports on the AlphaFold team and the Nvidia Texas datacentre lease are
    paywalled and unfetchable. Oxide joining Anthropic's Project Glasswing resolved in full but is a
    partnership announcement with no engineering finding, so it is not a block; it is useful only as
    context for the VulnCheck item and is not cited there. A post on Ubuntu's TPM encryption
    silently switching the system to a snap kernel is a good finding with real operational
    consequence, but it is dated 2026-05-14 and surfaced at 41 points, so it is analysis two and a
    half months old rather than news. The Zimbra zero-click campaign is dated 2026-07-23 and reached
    4 points; it is stale.

    Backtest: the tool scored 76 candidate misses for 2026-07-28 but seeded zero default causes, so
    there was no baseline to correct. I recorded the five candidates where a cause is genuinely
    informative. SBCL 2.6.7 is the only true watchlist gap: the Hacker News query list has no Lisp
    or SBCL entry, and this is the second consecutive day a watchlist gap has been recorded (Ruff
    v0.16.0 yesterday). The macOS Tahoe, Codex Security, and Anthropic cryptography items were all
    scrape gaps rather than editorial misses, and all three are published today. The Anthropic
    open-weights position statement was removed from yesterday's page on review for naming no model,
    product, or API surface, which is a relevance skip and not a miss.

    This is the second run of 2026-07-29. The 07:10 UTC run wrote the whole page from an empty
    draft. Collection re-ran at 17:25 UTC and the afternoon produced four genuinely new primaries,
    so the day grows from 12 stories to 21 against a budget of 25. Nothing was displaced. No section
    exceeds four, and Top stories goes from four to five, which is the cap rather than a squeeze.

    The lead changed, and that is the run's main editorial call. Rails disclosed CVE-2026-66066 at
    15:37 UTC: an unauthenticated arbitrary file read in Active Storage variant processing that
    reaches secret_key_base and escalates from there. It affects the default configuration of Rails
    7.0 through 7.2.3.1 and 8.0 through 8.1.3 because load_defaults 7.0 selected the vips processor
    and no later default changed it, and vips is what ships in the official Rails Docker images and
    on Debian and Ubuntu. The remediation is three steps, not one: upgrade activestorage, ensure
    libvips is 8.13 or later because Active Storage now raises at boot below that, and rotate every
    secret the process can read. That is a harder and wider obligation than anything else on the
    page today, so it takes the lead over the Hugging Face timeline. Verified against the Rails
    Security Announcements post by Rafael Franca and independently against Ethiack's write-up, which
    names the GHSA identifier, the per-branch fixed versions, and the VIPS_BLOCK_UNTRUSTED stopgap.
    Rails 6.x is affected only with non-default Active Storage configuration, and Magick is not
    affected by this vector. Technical chain details are withheld until 2026-08-28.

    The Copilot for Word worm was ranked for Top stories and placed in Security instead. It is the
    stronger finding in one respect, since the class remains exploitable at publication after a
    144-day MSRC coordination and two failed mitigations, one of which was a model upgrade. It lost
    the slot on population rather than severity: the exposed party is a Microsoft 365 document
    workflow and the only stated customer action is procedural review. Security is outside the
    per-section cap and outside the day budget, so nothing was lost by the placement. One caution
    for anyone reading the block later: the claim that Microsoft confirmed the behaviour on
    2026-03-31 is the author's own disclosure timeline, and no Microsoft statement was located.

    ML research is filled for the first time in several runs, by the HANDBOOK.md benchmark rather
    than by the arXiv cache. The fresh 72-hour arXiv window is again first-version preprints with no
    discussion signal. The paper earns the slot on deterministic grading and on testing exactly the
    pattern every agent harness relies on, and its headline number is unflattering: the best of
    thirty model configurations passes 36.2 percent of trials under strict grading.

    The GCC AI policy block is published on thinner sourcing than usual and the block says so. The
    gcc mailing list archive confirms the thread subject, the author (David Edelsohn), the
    2026-07-29 date, and four replies, but pipermail message URLs are not recoverable through a
    link-stripped fetch, so the announcement text itself was not read. gcc.gnu.org/contribute.html
    was checked and still carries no AI clause (last modified 2026-07-23). The policy specifics come
    from Phoronix alone. If the announcement URL becomes reachable, the block should be re-verified
    against it.

    Verified and dropped. The SQLite in Production post reached 198 points on Hacker News and
    200-plus on r/programming, and it is content marketing from a development agency: a generic
    pragma tutorial dated 2026-07-17 with no measurement, no system behind it, and no finding. It
    does not clear the Engineering posts bar and its ranking is a caution about treating Hacker News
    points as a proxy for substance. The star-history post explaining that GitHub restricted the
    stargazers API to repository admins and collaborators from 2026-06-30 is dated 2026-07-06 and
    surfaced today at 4 points, so it is stale as news, but it is the probable cause of this
    routine's own stars watchlist returning a single repository across all tracked accounts, and it
    should be treated as an operational finding rather than a story. Sebastian Raschka's Kimi K3
    architecture notes at 477 points stay out for the third consecutive run as secondary analysis of
    an architecture the K3 technical report already documented here. The Show HN running Gemma 4 26B
    in 2 GB on an M-series Mac at 266 points was dropped because the day already carries one
    self-reported local-inference measurement, and a second adds volume rather than information.

    Sections omitted and why. Outages: no qualifying incident, and the status-page checklist
    produced nothing. Reddit and social pulse: coverage recovered to 17 of 28 subreddits through the
    committed snapshot, above the floor and better than yesterday's 10, but nothing in the returned
    posts clears the bar as either verified fact or distinct social signal, so the omission is
    editorial this time rather than a coverage failure. New videos: the YouTube pass attached no
    discussion thread to any video, and the two videos carrying one are not watchlist items. Books:
    publisher feeds returned Springer proceedings plus an Advanced Rust title and a Fuzzing Android
    title, none with the external validation the section requires. Hacker News: no HN-native thread
    today carried technical substance that is not already covered by a primary elsewhere on the
    page.

    Two standing access problems recur. sbcl.org timed out on the TLS handshake again, the third
    failure across two runs, so SBCL 2.6.7 at 256 points remains unpublishable for want of a
    reachable primary and Languages and runtimes is filled by GCC instead. The Reuters report of a
    second compromised firm returned 401 again and Bloomberg carries it as Modal, so the second-firm
    claim is still not carried anywhere on the page. The Apple access note that security-content
    pages return page chrome with no CVE table was wrong again today, as it was this morning, and
    should be re-verified and re-dated rather than trusted.
