    Two details in the arrayref block are worth the weekly review's attention because they are the
    transferable part. The delivery mechanism was the yank warning: the attacker yanked arrayref
    0.3.5 through 0.3.9 under the compromised owner account, so cargo's advice to move off a yanked
    version pointed at the only non-yanked release, which was the malicious one. The reporter states
    this is how they were hit. Second, the block does not name the compromised maintainer as an
    attacker. SafeDep states the droundy account appears to have been compromised and that the
    GitHub repositories now return 404. The two sources disagree on scope and the block carries the
    wider one: the RustSec issue names arrayref 0.3.10 only, while SafeDep lists internment 0.8.7
    and append-only-vec 0.1.9 as also malicious and removed, plus five further dependency crates.
    The download figures also differ, roughly 152 million for the clean 0.3.9 in the advisory
    against about 245 million all-time for the crate in the SafeDep post, and both are usage
    measures rather than counts of affected builds.

