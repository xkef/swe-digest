    - >-
      Cloudflare demonstrates a remote Spectre attack on production Workers at up to 12 bits per second
      and ships further isolation
    - The Linux 7.3 merge window marks 32-bit ARM board files deprecated and lands Btrfs direct I/O and
      fsync wins
    - An interactive walkthrough of Kubernetes probes surfaces a liveness probe regression accepted by
      SIG Node
    - SondeHub operator describes a hobby radiosonde API becoming load-bearing for aviation safety and
      a war
    - Palomar gates Lean formalizations on dual-kernel replay plus automated review with no human editorial
      step
    - Terence Tao publishes an ICM 2026 essay that conditions on research-level AI arriving and asks what
      mathematics is for
