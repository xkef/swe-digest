    Two LLM contribution policies landed in two days, from the kernel's drivers/staging area and now
    from five Rust teams. They are not the same rule. Greg Kroah-Hartman rejects LLM-generated
    patches outright with a tested-security-fix exception, on the ground that staging exists so new
    developers learn. Rust permits LLM-created code but holds it to a higher bar than human-authored
    code, requires disclosure for public LLM text, and lets reviewers close non-conforming PRs
    without discussion. The Coinkite post published the same day is the third face of it from the
    other direction: a vendor stating that AI-assisted review, run on its own security-critical
    firmware in the weeks before an exploit and retested afterwards against named frontier models,
    did not find the bug. Those three are carried in separate sections deliberately, because they
    are separate facts and not one trend.

