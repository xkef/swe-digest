  notes: |
    Run shape. Today's digest was still the empty scaffold, so this selection decides the whole day
    and nothing was displaced. The HN cache was fetched at 04:37 UTC on 2026-08-05 with a 24-hour
    window, so almost every candidate is a 2026-08-04 item and the 2026-08-05 news day has barely
    started. A later run should expect genuinely new material and should re-rank rather than assume
    this list is settled.

    Overlap with yesterday. The 2026-08-04 digest was unusually full and already carried the npm
    worm as its lead, FFmpeg 9.0, the single-MI300X DeepSeek V4 Flash write-up, Lilian Weng's
    harness survey and @cloudflare/computer. All of those are still high in today's fetch and none
    is republished. The npm block here is a follow-up rather than a re-run: Endor Labs adds that the
    first wave went out through the Cacheable project's own GitHub Actions OIDC trusted publishing
    pipeline after a commit to main added a preinstall hook, so those tarballs carry valid npm
    signatures and SLSA provenance, while the later spread under stolen publishing tokens carries
    none. Yesterday's Socket-sourced point was that provenance attests build integrity and not
    source integrity; the new fact is the publishing mechanism and the wave split, which is what
    makes provenance usable as a discriminator between waves rather than as a filter. Endor's counts
    (384 packages, 1,136 versions, stated as a floor) differ from Aikido's 434 packages across 1,381
    versions published yesterday. The counts are not reconciled and both vendors describe their
    lists as moving, so the block should not assert a single total.

    Degraded and unreachable. Reddit reached 4 of 28 subreddits against a floor of 14, with top_day
    and hot each at 1 of 28. Despite that it produced a Top story the HN fetch did not surface in
    its window, the Greg Kroah-Hartman drivers/staging policy, so the degraded pull still earned its
    place. The GitHub watchlist is the long-running gap: the stars collection returned zero items
    from gh-events with no snapshot fallback, and repository releases and github.com/trending went
    unchecked for the thirteenth consecutive run. Books returned Springer conference proceedings
    only, unchanged since 2026-06-24, so the section is omitted again; improvement issues #60 and
    #85 both concern that streak and neither is owner-approved, so no config action was taken here.

    Three items were dropped for unreadable primaries rather than for editorial reasons, and the
    absence is the finding. openai.com returned HTTP 403 for the third consecutive day, this time on
    /index/third-party-cyber-evaluations-involving-openai-models/ (HN 49175248, 44 points). That is
    a live follow-up to the OpenAI and Hugging Face eval-escape entry and it is exactly the kind of
    update that store is open for, so the follow-up stays open with nothing added. mysk.blog timed
    out twice on the WebKit IP and DNS leak affecting proxy browsers and iCloud Private Relay (HN
    49176697), which is why Apple platforms is omitted entirely rather than carried on a title.
    businesswire.com returned 403 for the Airtable release, so that block cites Euronext carrying
    the Reuters wire and the summary should say so. lore.kernel.org remains behind the Anubis gate,
    so Greg Kroah-Hartman's announcement is quoted as Phoronix reproduces it, the same handling used
    for the Qualcomm crypto-engine entry.

    Calls a reader could not infer. ML research is omitted despite a healthy arXiv pull with no
    degradation: the volume was ordinary and no paper carried external validation, a discussion
    thread, or a result checkable past its abstract. New videos is omitted because every watchlist
    video again returned a null discussion link. Outages has no qualifying incident; the Xbox thread
    is at 605 points and was rejected for the same reason as yesterday, that the page is week-old
    link-blog commentary with no current incident and no status page behind it. The Bugtraq block is
    a deliberate stretch of the Security section, which is defined around CVEs, exploitation, supply
    chain and campaigns: it is none of those, but it is disclosure-ecosystem news with a primary
    source and a named acquirer, and no other section fits. The NVIDIA Alpamayo block leads with the
    OpenMDW-1.1 licence change because the LingoQA and Lingo-Judge figures are NVIDIA's own testing
    and are not reproduced; the benchmark numbers should stay attributed or be left out. The LVFS
    item is thin by design, a 64-word post, and is carried only because the fact in it is concrete
    and dated.

    Backtest. The tool reported 65 candidates for 2026-08-04 but seeded zero default causes, so
    every entry in miss_review is my own classification rather than an override of a seeded value.
    Three reclassifications matter for the weekly review because the 2026-08-04 digest documented
    the judgment in its own "considered and not published" list, which means the run saw them and
    decided: the Xbox thread, Jane Street's Bonsai, Octane and the DMARC explainer are
    relevance_skip, not watchlist gaps. The OpenAI ten-advances item is scrape_gap, because the run
    tried to fetch it and got 403 rather than never seeing it. Three look like real coverage gaps
    with no query behind them: Andy Pavlo joining ClickHouse to establish ClickHouse Labs, MiniMax
    H3 open weights, and the 80B Qwen in 4.3 GB of RAM. The last two are the same
    open-weight-release pattern that improvement issue #84 already documents, which is now visible
    across two consecutive windows. The remaining entries are ordinary front-page material outside
    this digest's scope, marked out_of_scope so they stop reading as engineering misses.

    Ranking. This run re-ranked the whole day rather than appending. The 04:37 UTC cache had barely
    reached the 2026-08-05 news day, and the 11:47 UTC pull added the material this selection is
    built from. The lead does not change: the Shai-Hulud npm wave published through the Cacheable
    project's own OIDC trusted publishing pipeline is still the day's most consequential item, and
    the Unit 42 passkey research and the drivers/staging LLM rule keep their places. FFmpeg 9.0
    enters Top stories at rank four, not as the lead, and displaces the libexpat funding block,
    which moves down to Developer tools rather than leaving the digest. That is the only
    displacement.

    Two LLM contribution policies landed in two days, from the kernel's drivers/staging area and now
    from five Rust teams. They are not the same rule. Greg Kroah-Hartman rejects LLM-generated
    patches outright with a tested-security-fix exception, on the ground that staging exists so new
    developers learn. Rust permits LLM-created code but holds it to a higher bar than human-authored
    code, requires disclosure for public LLM text, and lets reviewers close non-conforming PRs
    without discussion. The Coinkite post published the same day is the third face of it from the
    other direction: a vendor stating that AI-assisted review, run on its own security-critical
    firmware in the weeks before an exploit and retested afterwards against named frontier models,
    did not find the bug. Those three are carried in separate sections deliberately, because they
    are separate facts and not one trend.

    Not published, where the absence is the finding. The UK AI Security Institute incident report
    INC-2026-07-28-01 was the strongest remaining Security candidate and could not be read: the
    fetcher returned raw PDF bytes rather than extracted text, and aisi.gov.uk does not surface the
    incident anywhere this run could reach. No block was written on the title. The ACM Queue piece
    "Eight Myths on Software Engineering and GenAI" returned HTTP 403 at 230 points with 191
    comments, and had no second source carrying its content. The OpenAI third-party cyber
    evaluations post returned HTTP 403 for the fourth consecutive day, which is now long enough to
    read as a standing block on openai.com from this environment rather than a transient failure,
    and it remains an open thread on the OpenAI and Hugging Face eval-escape story.

    Deliberately excluded despite volume. "Apple says more ex-employees may have taken confidential
    data to OpenAI" at 368 points and OpenAI's reply post are litigation conduct, not engineering
    context. The Electronic Arts acquisition completion and the Department of Justice settlement
    with OpenAI over hiring are ownership and legal events with no stated engineering consequence.
    "AI-Generated Images Discourage Me from Reading Your Blog" was the day's second-highest thread
    at 765 points and 443 comments and is opinion about blog presentation, so the Hacker News
    section is omitted rather than filled with it. Cloudflare Wallets is a product launch without
    technical detail beyond the announcement. The benchmark-saturation paper accepted at ICML 2026
    has real substance and 101 points, but its v1 dates to 2026-02-18 and it is not today's news, so
    ML research carries only the tabular-prediction preprint.

    Coverage gaps that are now structural, not incidental. The GitHub stars collection has returned
    zero items with no snapshot fallback for fourteen consecutive runs, and repository releases and
    github.com/trending remain unchecked, so a release-shaped story in the watchlist repository set
    has had no path into any digest for two weeks. Reddit reached 8 of 28 subreddits against a floor
    of 14 and produced nothing above the bar this run, so Reddit and social pulse is omitted. Every
    watchlist YouTube video again returned a null discussion link, so New videos is omitted under
    the discussion-signal bar. The books feed has returned Springer conference proceedings only
    since 2026-06-24.

    Watchlist follow-ups is omitted even though the Coldcard story advanced today. The open
    followups store holds nothing about the COLDCARD RNG incident, so the update has no tracked
    entry to attach to and is carried in Security instead. The store's newest entries are dated
    2026-07-26, which is worth a look in the weekly review: the digest covered the Coldcard flaw on
    2026-08-02 and 2026-08-03 with an explicit follow-up in the text and no memory record appears to
    have been opened for it.

    Backtest. The tool scored 65 candidates for 2026-08-04 and seeded no causes, so miss_review
    carries the four that look like genuine engineering misses rather than corrections to seeded
    values: Andy Pavlo joining ClickHouse to establish ClickHouse Labs at 315 points, Jane Street's
    Bonsai UI library at 362, MiniMax H3 day-0 open weights in ComfyUI at 302, and running an 80B
    Qwen in 4.3 GB on a Mac at 277. None matched a watchlist query. Jane Street's tech blog is
    already a named source in the tools guidance, which makes that one the clearest gap. The Oxide
    Form D appeared in the same list and is published today, so it was a one-day lag rather than a
    miss. The remaining high scorers are out of scope by topic and are not listed.

    Third run of the date. The HN cache was refetched at 17:13 UTC, which is roughly five and a half
    hours past the 11:47 UTC pull the second run used, so the new material is the afternoon UTC
    news. The run re-ranked the whole day rather than appending. The lead does not change.

    Two additions. The Google DeepMind leadership change enters Top stories at rank three and
    displaces the Shieldstral block, which moves down to AI rather than leaving the digest. That is
    the only displacement. Cloudflare OS is added to AI. AI therefore holds three blocks against a
    cap of four, and the day holds twenty counted stories against a cap of twenty-five, so the
    bounds were not the binding constraint on this run. Ranking was.

    Jeff Dean and Sanjay Ghemawat leaving Alphabet is deliberately folded into the Google DeepMind
    block rather than split into Markets and companies. Both facts come from a single Sundar Pichai
    message to Google DeepMind employees, published on blog.google at 16:00 UTC, and splitting one
    announcement into two blocks would double-count it. The block is sourced to that message rather
    than to the Axios and New York Times reports that carried it first on HN, because the company
    statement is primary and the wire copy adds nothing the message does not say. The Jeff Dean HN
    item pointing at a twitter.com status was not used for attribution.

    Three candidates were verified and rejected for want of a readable primary. The UK AI Security
    Institute incident report INC-2026-07-28-01 was retried this run against the Webflow CDN copy
    linked from HN 49175717, which is a different URL from the aisi.gov.uk path that failed on
    2026-08-05 earlier. The fetch returned 66,675 characters that contain zero occurrences of common
    English words, so the extraction is still unusable bytes rather than text. This is the third run
    that has failed to read this report, and it remains the strongest unpublished Security
    candidate. No block was written on the title alone. "Position: LLMs Can't Jump" at 174 points
    sits behind an openreview.net browser-verification interstitial, so the position paper could not
    be read and ML research keeps its single block. "Oracle Just Halved Its Always Free ARM Limits"
    at 71 points is a genuine operational change for anyone running on the Oracle free ARM tier, but
    oracle.com returned HTTP 403 for the Always Free page and the only account of the change is a
    blog on an unfamiliar domain, so it is not published. That absence is the finding: the claim is
    plausible and unverifiable from this environment.

    I did not re-attempt openai.com this run. The three-consecutive-day HTTP 403 recorded on
    2026-08-05 stands as the last state, and the eval-escape thread remains open and unpublished.

    Reddit is degraded for the third run of the day and further down than before, at 8 of 28
    subreddits for top of day against a floor of 14 and 1 of 28 for hot. Nothing above the bar
    arrived, so Reddit and social pulse stays omitted. The stars gh-events backend returned zero
    items again with no snapshot fallback, which is the fifteenth consecutive run with that gap, so
    a release-shaped story in the watchlist repository set has now had no path into any digest for
    over two weeks. This should be read as a standing hole in coverage, not a one-run degradation.
    Books returned Springer conference proceedings only and is omitted. Every watchlist video again
    lacks a discussion link, so New videos is omitted under the discussion-signal bar. No upcoming
    or active conferences for the date. No new security advisory cleared the bar today, so the two
    existing Security blocks stand unchanged, and no qualifying incident appeared, so Outages keeps
    its anchor line.

    On miss_review: the backtest scored 65 candidates for 2026-08-04 and seeded zero causes, so both
    entries here are additions rather than overrides. Andy Pavlo joining ClickHouse to establish
    ClickHouse Labs at 315 points and MiniMax H3 day-zero open weights in ComfyUI at 302 points are
    both in-scope engineering stories, one database-ecosystem and one open-weight model release,
    that no watchlist query matched. That is the definition of a watchlist_gap rather than an
    editorial skip. I considered and did not flag Bonsai, Octane, and the 80B Qwen on a Mac Show HN:
    those are HN-native library and demo threads where a relevance judgment is defensible, so
    calling them watchlist gaps would overstate the case. The remaining no_query_match candidates
    from that day are correctly out of scope, being mostly general news, obituary, energy and
    politics items.
