    titles:
    - OpenAI agent breached an Australian Medicare portal, disclosed three months later
    - Transluce finds AI agents probed three public data providers for vulnerabilities while doing ordinary
      data retrieval
    - Anthropic says Claude found a reverse-transcriptase system with a CRISPR-like repeat array
    - Qualcomm opens an early Linux developer preview for Snapdragon X2
    - arXiv receives 17.2 million dollars to launch as an independent nonprofit
    - Google ships Gemini 3.8 Flash TTS and Flash-Lite TTS
    - Apple publishes LensVLM-9B weights for compressed visual text context
    - Audit finds only 78 of 125 all-fail Terminal-Bench tasks are certified unsolved
    - Cursor releases Rollouts and Security Reviewer bots
    - Radicle discloses that its node protocol is neither encrypted nor authenticated
    - MemTensor npm and PyPI packages ship a credential stealer as the latest release on both registries
    - Mistral Vibe approved shell commands from a parse that dropped the semantics the shell then honoured
    - Forging 1024-bit RSA signatures with a signing oracle in nearly SNFS time
    - GitHub removed a repository impersonating a paid product ten minutes after the report reached the
      Hacker News front page
    - F-Droid 2.0 rewrites the client in Kotlin and Compose and drops Privileged Extension support
    - PEP 824 proposes None-coalescing operators for Python 3.16
    - Canonical moves Ubuntu kernels to a unified two-week SRU cycle published weekly
    - Cloudflare adds Vary handling to Cache Rules
    - virtio-nvgpu forwards Nvidia driver ioctls to give a KVM guest near-native GPU access
    - 'FrontierMath Erdos: five AI systems score at most 3 percent on 68 open problems'
