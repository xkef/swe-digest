  notes: |
    Second run of 2026-07-27. The 05:43 run created the digest with 14 stories. I ranked those 14
    against everything in the refreshed caches and added one item, to Security. Nothing found this
    run outranks a published block, so no displacement was requested.

    The two largest apparently uncovered Hacker News items in this window are archive, not gaps.
    Ruff 0.16.0 at 340 points was published in the 2026-07-26 digest, and the Anthropic Elevated
    errors for Opus 5 incident at 93 points was published there too. I re-read the Anthropic status
    API anyway: that incident resolved 2026-07-26 at 10:44 UTC after about 87 minutes, at major
    impact across claude.ai, the Console, the API, Claude Code, and Cowork, and it is the fourth
    model-error incident on that page in three days with no root cause published for any of them.
    That pattern is worth a block if a fifth appears, but re-publishing the resolved incident today
    would duplicate yesterday.

    Security had no new advisory. The GitHub advisories API re-read at this run still lists the etcd
    unbounded-handshake advisory of 2026-07-24 at 22:40 UTC as the newest reviewed entry, and all
    three advisories of that date were published on 2026-07-26. The OpenAI status API is also
    unchanged: the ChatGPT conversation-error incident is still in monitoring with the page's
    updated_at fixed at 2026-07-25 23:57:40 UTC, so the published block's figure of roughly 29 hours
    without an update now stands above 30. No new fact, so no edit was requested.

    Four popular items were omitted deliberately rather than for lack of a slot. Go Analysis
    Framework at 197 points links to pkg.go.dev package documentation with no release or proposal
    behind it, and golang/tools' newest tag is v0.48.0 with nothing tying it to this window, so it
    is popularity without an event. The relay-market write-up at 181 points is dated 2026-06-28 and
    its body did not render. Decker at 279 points is a project homepage with no release established.
    Terence Tao's ICM 2026 slides at 118 points are a PDF I did not read this run, so the item is
    omitted rather than described from its title. Google's disclosed SpaceX stake at 318 points is a
    market fact that does not change engineering context, and its source is paywalled to this
    environment.

    Reddit stayed degraded for the second run of the day, at 8 of 28 subreddits with no engagement
    data on any item, so Reddit and social pulse is omitted for lack of any basis to rank rather
    than for a quiet day. The same applies to New videos, Books, Events, Apple platforms, Linux and
    kernel, and Markets and companies: the events and stars collections both returned zero items,
    books returned publisher filler, and no Apple or kernel item resolved to a primary source this
    run. One Reddit title, about GitHub giving 14,000 repositories a validated owner, had no
    first-party post behind it because the GitHub blog feed stops at 2026-07-23.

    The story inbox is empty, so no issue action was requested.

    Ten backtest causes are overridden. The one substantive change is 49044492, the NIST-hosted UK
    AISI and CAISI preliminary assessment of Kimi K3 cyber capabilities, seeded out_of_scope. Kimi
    K3 is a tracked entity with two open follow-ups and a block in today's digest, so this is in
    scope and no query caught it, which makes it watchlist_gap. I could not read the page to judge
    whether it should also have been published. The other nine were seeded out_of_scope but are
    plainly software topics the digest does cover, so relevance_skip is the honest cause: 49045159
    is the Android ADB restriction proposal the digest carried on 2026-07-25 and tracks as an open
    follow-up, 49057175 and 49057241 are the cookie-banner campaign and the htmx Game Boy item that
    today's digest publishes, 49047453 is a shell scripting post, 48997828 is a Django post,
    49034777 is a shell-history developer tool, 49058993 is LLM token-reseller fraud research,
    48991984 is a tool responding to the Microsoft device-ID tracking write-up the digest already
    tracks, and 49053375 is a small text-to-speech model release. Left standing as out_of_scope: the
    engineering-management essay at 49048212 and the design essay at 49059367, which I read as
    adjacent rather than in scope.

    Third run of 2026-07-27. The day stood at 15 blocks from the 05:43 and 06:56 runs. I ranked
    those 15 against the refreshed caches and added three, and requested one displacement that is a
    supersede rather than a cut.

    The one displacement is the Kimi K3 follow-up. The published block said the weights were not on
    Hugging Face on the promised date, which is still true, but a submission titled Kimi-K3 Releases
    on HuggingFace 7/27 went up at 06:18 UTC and reached 517 points by this run. Leaving the old
    block would make the digest look stale against the day's most upvoted AI thread. I re-verified
    from three angles: the direct models API path for moonshotai/Kimi-K3 returns HTTP 401, the
    moonshotai author listing sorted by last modified still tops out at Kimi-K2.7-Code from
    2026-06-15, and a site-wide search for Kimi-K3 returns only third-party repositories. I cannot
    distinguish an absent repository from a private or gated one, because Hugging Face returns 401
    for both, so the block says the organisation's public index carries no K3 entry rather than that
    the repository does not exist. Worth noting for the watchlist:
    audnai/penclaw-Kimi-K3.0-abliterated-GGUF has existed since 2026-07-18 with 89 likes, so
    third-party repositories carrying the K3 name predate any official listing.

    The Anthropic outage block is the call the 06:56 run set up. That run wrote that the recurring
    Opus 5 error pattern was worth a block if a fifth incident appeared and declined to re-publish
    the resolved 07-26 one. Two more opened today, at 08:16 and 11:27 UTC, both resolved within
    about an hour. I counted the history feed rather than describing the two in isolation: thirteen
    incidents naming specific Claude models between 2026-07-21 and 2026-07-27, none with a published
    root cause. The count excludes two service-disruption incidents on 07-21 and 07-22, which are a
    different failure. The count is bounded at 07-21 because that is where the feed I read ends, not
    because the pattern starts there, so it is a floor. I read history.rss because the incidents API
    response clips at the fetch bound and the individual incident pages render as Statuspage CSS
    with the update text far past the limit.

    The Bun item is the only new engineering post I took. I did not publish it on the author's
    analysis alone. The load-bearing claim is that there is no release tag since the rewrite merged,
    and the GitHub releases API confirms bun-v1.3.14 published 2026-05-13 as the latest release. The
    pull request counts, the pipeline timings, and the Anthropic employee involvement are his
    observations and are attributed as such, and his roughly $800,000 total is an extrapolation from
    an assumed daily rate, not a reported figure. I left out his framing that Anthropic acquired
    Bun, because I did not resolve it to a primary source and the block does not need it. He
    discloses he is job-hunting, which the block says.

    Security added nothing. The GitHub advisories API re-read at this run still lists the etcd
    unbounded-handshake advisory of 2026-07-24 22:40 UTC as the newest reviewed entry, and all three
    advisories of that date were published on 2026-07-26. Security is exempt from the day budget, so
    the absence is a genuinely quiet advisory day rather than a slot problem.

    Reddit was degraded for the third consecutive run of the day, at 8 of 28 subreddits with no
    engagement figures on any item. Reddit and social pulse stays omitted because there is no basis
    to rank, not because the day was quiet there. That is now a three-run pattern on the reddit-rss
    backend and is worth the weekly review's attention.

    Items I passed on deliberately. The Chinese chipmaker share surge at 105 points is a market move
    with no engineering consequence. Chrome on ARM64 Linux at 13 points is a secondary aggregator
    report with no first-party post found. How Unix spell ran in 64 kB of RAM at 54 points is a good
    retrospective but is history rather than an event, and the day already carries four strong Top
    stories. Decker, the Go analysis framework, and the relay-market write-up were all omitted by
    the 06:56 run for reasons that still hold and I did not revisit them.

    Nothing found this run outranked a published Top story, so Top stories stays at four and I
    requested no promotion. The Anthropic block went to Outages rather than Top stories because the
    cJSON disclosure remains the stronger headline for the archive index: unfixed defects across all
    versions of a widely vendored parser with no upgrade path beats a run of short incidents that
    each resolved within the hour.

    Fourth run of 2026-07-27. The day stood at 16 blocks from the 05:43, 06:56, and 13:10 runs. The
    HN cache refetched at 17:24 UTC, four and a half hours after the previous run read it, and it
    carries the day's largest change. I added two blocks, promoted one to lead, and requested one
    displacement that is a supersede.

    Kimi K3 shipped. The 13:10 run published a block saying a 517-point thread asserted a release
    that Hugging Face's public index did not show, and that block is now false in its headline. I
    verified the reversal from three independent primary reads rather than from the thread. The
    Hugging Face models API returns moonshotai/Kimi-K3 as public, gated false, last modified
    2026-07-27 at 16:29 UTC, with 96 safetensors shards, about 1.56 TB of stored weights, and
    safetensors metadata totalling 2,779,931,837,184 parameters, which is consistent with the stated
    2.8T. The moonshotai author listing now tops out at Kimi-K3 rather than Kimi-K2.7-Code. The
    GitHub repository MoonshotAI/Kimi-K3 was created today at 08:01 UTC and pushed at 15:24 UTC, and
    its README is the only full body I could read, so every architecture and benchmark figure in the
    block comes from there. The 401 that the earlier run recorded for the same API path was
    therefore a withheld repository, not an absent one, which is worth remembering the next time
    Hugging Face returns 401 for an unreleased model: it is a pre-release signal, not evidence of
    absence.

    Two things about the Kimi block are deliberately hedged. The license is a custom Kimi K3
    License, carried on Hugging Face as license:other with license_name kimi-k3, so the block says
    open weights and names the license rather than calling it open source. The benchmark table is
    Moonshot's own, comparing against Claude Fable 5, GPT-5.6 Sol, Claude Opus 4.8, GPT-5.5, and
    GLM-5.2, and it is mixed rather than a sweep, so the block reports it as a vendor claim with no
    independent reproduction. The technical report is a PDF I did not read at this run, so nothing
    in the block rests on it.

    I made Kimi K3 the lead and re-listed all five Top stories in rank order so the archive index
    shows it as the day's headline. cJSON drops to second. That is a close call and I want the
    reasoning recorded: unfixed memory-safety defects across all versions of a parser vendored into
    ESP-IDF, with no release to upgrade to, is the item with the most direct operational consequence
    today. It loses the lead only because an openly downloadable 3T-class frontier model is a first,
    changes what is deployable on owned hardware, and closes a promise this digest has tracked since
    2026-07-16. Top stories is now at its cap of five, so nothing was promoted out of a topical
    section.

    PGSimCity is restored rather than added. The 05:43 run published it, the 13:10 run dropped it
    with no reason given, and it is recorded in today's run log as removed_unexplained. At 832
    points it is the fourth largest thread of the day and I could not find a reason it should have
    gone, so I read the page myself and put it back. What makes it publishable rather than merely
    popular is its own boot-screen disclaimer, which calls it an early, unreviewed prototype that
    almost certainly contains inaccuracies in both the model and the explanations. A reader arriving
    from the thread should have that before quoting it, and the block leads with it.

    Three items I could not publish because the page would not yield a body inside the fetch bound.
    NVIDIA's Open Secure AI Alliance post at blogs.nvidia.com returned only head and inline CSS, so
    the founding members and the actual deliverables are unread; its metadata gives a publication
    time of 2026-07-27 09:00 UTC, 1,138 words, and keywords covering agentic AI and cybersecurity,
    and CNBC's headline ties it to the OpenAI agent breach the digest tracks, but CNBC returns 403
    here and I will not write that connection on a headline. The matching press release path on
    nvidianews.nvidia.com 404s to the news archive. The Antithesis post on finding bugs in Raft
    implementations returned only head and CSS, and its own description, that formal verification is
    not enough to maintain consensus in real systems, is the whole of what I could read, which is
    not enough for a block. Both are worth a retry tomorrow. Add blogs.nvidia.com and antithesis.com
    to the list of hosts whose article bodies sit past the fetch bound.

    Items I passed on deliberately. The day's fifth largest thread at 645 points, on AI companies
    shredding rare books, points at a single X post from an account I could not resolve to a
    verified person or publication, so under the social-attribution rule there is nothing to publish
    and no primary document behind it. Its absence is a sourcing decision, not an oversight. The Ed
    Zitron commentary on Apple at 188 points, the FT lobbying report at 162, the Bloomberg piece on
    NVIDIA's $750B in deals at 53, and the NVIDIA and Safe Superintelligence compute partnership are
    all market or policy items that do not change engineering context, and the FT and Bloomberg
    bodies are paywalled here in any case. Chrome arriving on ARM64 Linux still has only an
    omgubuntu.co.uk report and no first-party post, unchanged from the previous run. Minecraft Java
    raising its recommended memory to 16GB ahead of a Vulkan transition rests on a videocardz.com
    summary with no Mojang post found.

    ML research stays at three. The papers cache added Skill Self-Play and CausalForge, and neither
    outranks the three preprints already published. On a day carrying a real model release, a fourth
    unreproduced preprint would make the section longer without making it better.

    Reddit was degraded for the fourth consecutive run of the day, at 8 of 28 subreddits against a
    floor of 14, with the reddit-rss backend again returning no score or comment count on any item.
    Reddit and social pulse stays omitted because there is no basis to rank, not because the day was
    quiet there. Four degraded runs in one day on the same backend is the pattern the weekly review
    should act on, and the missing engagement fields are the more damaging half: even full subreddit
    coverage would not be rankable without them. Books, New videos, Events, Apple platforms, Linux
    and kernel, and Markets and companies are omitted for the reasons the earlier runs recorded, all
    of which still hold.

    Security added nothing for the third run running, and Security is exempt from the day budget, so
    that is a genuinely quiet advisory day rather than a slot problem. The story inbox is empty, so
    no issue action was requested.

    On the backtest: it re-ran for 2026-07-26 and reported 51 candidates with zero default causes
    seeded, which appears to have cleared the ten overrides the 06:56 run recorded. I have
    re-asserted the same ten so the weekly review does not lose them. The one substantive call is
    unchanged and is now stronger: 49044492, the UK AISI and CAISI preliminary assessment of Kimi K3
    cyber capabilities, is watchlist_gap, because Kimi K3 was a tracked entity with open follow-ups
    on the day it was missed and has now shipped, and no query caught it. The other nine are plainly
    software topics this digest covers, so relevance_skip is the honest cause for each. I again left
    the engineering-management essay at 49048212 and the design essay at 49059367 standing as
    out_of_scope.
