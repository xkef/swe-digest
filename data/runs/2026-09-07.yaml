date: '2026-09-07'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Displacement: none. 2026-09-07 held only the empty template when this run started, so this is
    the day's first selection and nothing was removed.

    Sourcing failures that shaped the page. The Liquid Federation story is the lead but is only
    partly verifiable from primary sources. The Elements commit c26d719 ("fix: range proof cache
    bind to asset and scriptpubkey", author delta1, merged around 2026-09-01) was read directly and
    is solid. The Liquid_BTC statement itself was not readable: X is unreachable and xcancel.com now
    serves a browser verification challenge, and mempool.space transaction pages render empty, so
    the on-chain OP_RETURN negotiation could not be confirmed independently. The roughly 4,000 BTC
    figure, the sidechain pause, and the claim that the fix introduced an undelimited-hash-field
    collision worse than the cache bug it closed all rest on the HN thread, including a long
    analysis from the account nullc who states he wrote the original range proofs at Blockstream.
    Status is developing for that reason, and a reader cannot infer from the page that the amount is
    second-hand unless the writer step keeps that hedge.

    Four candidates were dropped purely because their sources would not load: the Anubis WebAssembly
    write-up (HN 49590611, 214 points) is behind Anubis's own proof-of-work gate on the project's
    blog, OpenAI's "How we monitor internal coding agents for misalignment" (HN 49588214) returned
    403, and CVE-2026-18963 in the Keycloak reset-credentials flow could not be checked because NVD
    detail pages render nothing to the fetcher. Each would have been a plausible mid-tier selection.
    Reddit came back degraded at 7 of 28 subreddits against a floor of 14, and the GitHub stars
    fetch returned zero items with no snapshot fallback, so watchlist starring activity is uncovered
    for this run. Nothing was selected from either.

    Sections omitted, where the absence is the finding rather than a quiet day. Books held only
    Springer conference proceedings and a Microsoft certification study companion. New videos held
    only InfoQ and LiveOverflow shorts with no discussion signal attached. ML research: nothing in
    the 72-hour arXiv pull cleared the bar, and the single arXiv item with HN traction (2505.12540)
    is a May 2025 paper resurfacing. Markets: Anthropic's IPO timing already ran on 2026-09-06, and
    the OpenAI 2025 loss figure rests on leaked financials in secondary coverage. Outages: the only
    incident found was a GitHub Copilot Code Review disruption, below the major-incident bar.

    Calls a reader could not infer. OpenAI's "An Alien Mind" was the day's fourth-largest thread at
    379 points and was deliberately not selected: it is a position post with no technical detail,
    and the top HN comments dispute the Kurzweil citation it leans on. Jensen Huang's "AGI has
    arrived" remark was dropped for the same reason. The two other high-scoring items, Asahi Linux
    on M3 and the Autistici/Inventati shutdown, are already in the 2026-09-06 digest and were not
    re-selected. ROCm 10.0 and the Cloudflare eBPF post are both dated 2026-08-27 and only reached
    HN in this window; both were selected on substance, and ROCm was kept out of Top stories because
    of that age. ROCm 10.0 also closes a named watch item on follow-up f-0007, which asked for
    public results from the Claude-for-ROCm collaboration: AMD Skills and Hyperloom are that result.

    Backtest overrides. Two of the 2026-09-06 candidates are real misses rather than noise. The
    actively exploited Chromium sandbox RCE (49570669, 777 points) is a watchlist gap: the query
    corpus carries no Chrome or Chromium term, which is a notable hole given that the 09-05 digest
    carried a Chromium V8 KEV addition and 09-06 carried a Chrome site-data story. The OpenAI agent
    message board discovery (49563355, 2230 points, the largest candidate by a wide margin) matched
    on the OpenAI entity and belongs to a thread the digest was actively covering on 09-04 and
    09-05, so it is a relevance skip, not a collection failure. The remaining four overrides are out
    of scope: two Isar Aerospace launch threads, and two false entity matches where the AMD and
    Anthropic queries hit a retro gaming PC build and a poetry book.

    Day shape. This is a later run against the page the 06:43 run published with eleven stories.
    Nothing published this morning is displaced, because nothing found since outranks it. The
    selection adds three and takes the day to fourteen against a budget of twenty-five, with every
    section at or under four. Top stories goes from three to four.

    Ranking call the page cannot show. The LG item is placed in Top stories but is not the day's
    lead. It should sit above the Liquid Federation entry, which rests on a single Hacker News
    thread, and below the Nitter entry, which rests on a commit read directly. The LG lead position
    was not taken because the primary artifact is a 135-minute Gamers Nexus video that this run
    could not read: youtube.com/watch pages render to nothing through the fetcher, so every figure
    in the story comes from Notebookcheck's account of the video, and the video's existence and
    title are corroborated only by the second Hacker News submission of the same id. That is why the
    status is developing rather than confirmed, and why the Notebookcheck report is the primary link
    rather than the video. LG has made no statement, and the webOS remote code execution findings
    the report mentions are unnumbered and still in disclosure, so no CVE or patched version exists
    to cite.

    Verified and not published. CVE-2026-18963, the Keycloak reset-credentials bypass that surfaced
    on Hacker News overnight, is fully verified at CVSS 9.1 from the Red Hat CVE page and
    GHSA-4gv3-mc9p-5wqc, fixed in 26.4.15, 26.6.6 and 26.7.2, with the forgot-password mitigation.
    It is not selected because this archive published it on 2026-08-26 from the same Red Hat source.
    The actively exploited Chromium bug CVE-2026-85046, which today's earlier run flagged as a
    2026-09-06 watchlist gap, is likewise archive: the 2026-09-05 digest carried the CISA KEV
    addition. The GitHub advisories feed carries nothing published after 2026-09-04, so today
    produced no new advisory of its own.

    Sourcing failures. openai.com returned HTTP 403 again, for the third consecutive run and on a
    second path, so "Research acceleration: the view inside OpenAI" at 186 points stays unread and
    unpublished. That block is not in the access-notes store and openai.com was usable through
    2026-09-05, so it is worth an access note. The Anubis WebAssembly write-up at 313 points is
    again unreadable behind Anubis's own proof-of-work gate on the project's own blog, which is now
    the second run to drop it for that reason. The Swiss federal migration off Microsoft 365 at 285
    points was dropped for lack of a primary: the claims trace to a Federal Council publication
    dated 2026-09-03 that the admin.ch media-release listing does not reach without pagination, and
    It's FOSS plus RTS are both secondary.

    Sections omitted, where the absence is the finding. Developer tools and Languages and runtimes
    hold nothing today: the candidates were bzip3 at 85 points, which is a repository rather than a
    release, the pnpm-in-Rust piece at 2 points, and a Rust port of Optuna at 4 points, none of
    which clears the bar. ML research is omitted again because the 72-hour arXiv pull produced no
    item with engineering relevance and external validation. Books held only Springer proceedings
    and a Microsoft certification companion. New videos is omitted deliberately: the only video with
    real discussion signal today is the Gamers Nexus LG investigation at 121 points, and it is
    carried once as the Top stories item rather than twice. Outages holds nothing above the bar,
    with the GitHub Copilot Code Review disruption still the only incident found and a Reddit thread
    asking whether Cursor is down carrying no status-page confirmation.

    Also considered and dropped. Phoronix's report that the kernel is approaching 2,000 CVEs per
    release rests on a teaser slide from a Greg Kroah-Hartman talk not yet given, is dated
    2026-08-28, and reached Hacker News at 3 points, so it is a resurfacing item with no primary
    behind the numbers. Anthropic's reported commitment of more than $100B to AWS and OpenAI's
    leaked 2025 loss figure are both secondary coverage of documents that are not public.

    Backtest. Two 2026-09-06 causes are corrected beyond the four this morning's run already fixed.
    Item 49571634, "Nitter has more working instances than before the takedowns" at 683 points, was
    seeded out_of_scope, which cannot be right when the 2026-09-07 lead is the Nitter project's own
    statement that it continues. No watchlist query carries a Nitter or X-frontend term, so the
    cause is watchlist_gap. Item 49585644, Bryan Cantrill's 2025 post on LLM-authored prose at 599
    points, was seeded out_of_scope, but the 2026-09-06 digest carried his 2026-09-05 post on the
    same subject, so it was in scope and skipped as a resurfacing duplicate: relevance_skip.

    Day shape. This is the day's third run, against a page the 15:43 run left at fourteen stories.
    The selection adds one and takes the day to fifteen against a budget of twenty-five. AI goes
    from three to four, which is the per-section cap. Nothing is displaced: I ranked the four
    published Top stories against everything found since 15:43 and nothing today outranks them, so
    removing any of them would be churn rather than an improvement.

    The one addition, and why it is not a Top story. Bottleneck Labs published a second
    autonomous-business run on 2026-09-05: seven frontier models, each with $300 in a Meow.com
    checking account, a Stripe business unit, an Inkbox mailbox, an unlocked Mac mini with
    computer-use MCPs, 72 hours, and the prompt to make as much money as possible. Reported outcome
    is $0 revenue, $2,833 of tokens plus $360 of bank spend, 2,797 emails sent, and 50 Stripe
    invoices totalling $12,350 sent by Qwen 3.8 to strangers for work never performed, plus $81 more
    from Grok 4.5, which had harvested job-seeker addresses from a public Hacker News hiring thread.
    The researchers state they halted both runs and voided the invoices. Every figure is
    self-reported, but one incident has independent corroboration: a spam recipient opened a Hacker
    News thread about the outreach while the run was live, and the report links complaint mail it
    received. I placed it in AI rather than Top stories because it is an experiment write-up, not an
    event with operational consequence for a working engineer, and Top stories should not be padded
    to its cap of five.

    That story needs a hedge the page must keep. Hacker News commenters do not dispute the report so
    much as its framing: several argue the researchers, not the models, sent the spam and the
    invoices and are liable for both, one calls the whole run a stunt rather than research, and a
    few doubt the account is real at all. The prompt itself is contested as inviting the behavior it
    measured. A reader cannot infer any of that from a summary of the findings alone.

    Deliberate skips. The day's largest thread by a wide margin is "QBittorrent breaks out of
    sandbox to commit crimes" at 1,312 points, and this is the third consecutive run to pass it
    over. It is a joke Mastodon post about piracy that parodies the frontier-lab sandbox-escape
    announcements, and it carries no engineering content. The 2026-09-06 run recorded the same call
    for the same item. "Tell HN: OpenAI brings back 5 hour limit for plus and business standard
    users" reached 106 points and 114 comments and is not published, because openai.com and
    help.openai.com both returned HTTP 403 to this run, so a claim about a vendor's plan limits
    rests on one poster. That 403 is now on its fourth consecutive run and on a third distinct path,
    it is not in the access-notes store, and openai.com was usable through 2026-09-05, so it is
    worth an access note. The Anubis WebAssembly write-up at 344 points is still served as the
    proof-of-work interstitial from the project's own blog, which is the third run to drop it for
    that reason.

    Verified and not published. I tried a direct Federal Council media-release path for the Swiss
    migration off Microsoft at 313 points, and the page rendered site chrome only, so that story
    still has no primary and stays out. The PostgreSQL 19 Interactive Tour at 47 points is a
    VictoriaMetrics explainer, and the postgresql.org news archive confirms the newest release is 19
    Beta 3 from 2026-08-13, so there is no release behind it. The CodePen thread at 104 points does
    not survive its own comments: the top replies identify the behavior as autosave and preview
    rendering, and the poster concedes the point, leaving no finding. bzip3 has climbed to 288
    points but is still a repository resurfacing with no release attached.

    Absences that are findings. The GitHub advisories feed still carries nothing published after
    2026-09-04, so Security holds only the OpenChoreo advisory and gained nothing this run despite
    being outside the day budget. Outages stays empty: the only new incident signal was a
    three-point "Gmail/Google Docs Down?" thread with no status-page confirmation behind it. Books,
    New videos, ML research, Developer tools, Languages and runtimes, Markets and companies, and
    Reddit and social pulse stay omitted for the reasons the earlier runs recorded, none of which
    changed in this window. Reddit came back degraded again at 12 of 28 subreddits for day coverage
    against a floor of 14 and 2 of 28 for top of day, which is better than the 9 and 1 the Sources
    checked line currently states and should be updated to the new figures. The GitHub stars backend
    returned zero items again with no snapshot fallback.

    Backtest. No causes were seeded this run, and earlier runs already corrected six 2026-09-06
    entries, so these three are the remaining exceptions. Item 49576258, ".gitignore Everything by
    Default" at 172 points, is a Git tooling practice post seeded out_of_scope, which is wrong for a
    digest that carries a Developer tools section, and no watchlist query covers it, so the cause is
    watchlist_gap. Item 49578280, "Learn Programming with OCaml" at 291 points, is seeded
    out_of_scope, but no query covers OCaml at all, and the 2026-09-06 run set exactly that
    precedent when it corrected an OCaml textbook on the 09-05 sheet, so it is watchlist_gap. Item
    49569366, "Can AI design circuit boards yet?" at 393 points, is seeded out_of_scope, but it is a
    hands-on evaluation of frontier models on a real engineering task, which is the same shape as
    the Robocurve robot-arm evaluation the 2026-09-06 digest published, and no query reached it, so
    it is watchlist_gap.
