date: '2026-09-07'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Displacement: none. 2026-09-07 held only the empty template when this run started, so this is
    the day's first selection and nothing was removed.

    Sourcing failures that shaped the page. The Liquid Federation story is the lead but is only
    partly verifiable from primary sources. The Elements commit c26d719 ("fix: range proof cache
    bind to asset and scriptpubkey", author delta1, merged around 2026-09-01) was read directly and
    is solid. The Liquid_BTC statement itself was not readable: X is unreachable and xcancel.com now
    serves a browser verification challenge, and mempool.space transaction pages render empty, so
    the on-chain OP_RETURN negotiation could not be confirmed independently. The roughly 4,000 BTC
    figure, the sidechain pause, and the claim that the fix introduced an undelimited-hash-field
    collision worse than the cache bug it closed all rest on the HN thread, including a long
    analysis from the account nullc who states he wrote the original range proofs at Blockstream.
    Status is developing for that reason, and a reader cannot infer from the page that the amount is
    second-hand unless the writer step keeps that hedge.

    Four candidates were dropped purely because their sources would not load: the Anubis WebAssembly
    write-up (HN 49590611, 214 points) is behind Anubis's own proof-of-work gate on the project's
    blog, OpenAI's "How we monitor internal coding agents for misalignment" (HN 49588214) returned
    403, and CVE-2026-18963 in the Keycloak reset-credentials flow could not be checked because NVD
    detail pages render nothing to the fetcher. Each would have been a plausible mid-tier selection.
    Reddit came back degraded at 7 of 28 subreddits against a floor of 14, and the GitHub stars
    fetch returned zero items with no snapshot fallback, so watchlist starring activity is uncovered
    for this run. Nothing was selected from either.

    Sections omitted, where the absence is the finding rather than a quiet day. Books held only
    Springer conference proceedings and a Microsoft certification study companion. New videos held
    only InfoQ and LiveOverflow shorts with no discussion signal attached. ML research: nothing in
    the 72-hour arXiv pull cleared the bar, and the single arXiv item with HN traction (2505.12540)
    is a May 2025 paper resurfacing. Markets: Anthropic's IPO timing already ran on 2026-09-06, and
    the OpenAI 2025 loss figure rests on leaked financials in secondary coverage. Outages: the only
    incident found was a GitHub Copilot Code Review disruption, below the major-incident bar.

    Calls a reader could not infer. OpenAI's "An Alien Mind" was the day's fourth-largest thread at
    379 points and was deliberately not selected: it is a position post with no technical detail,
    and the top HN comments dispute the Kurzweil citation it leans on. Jensen Huang's "AGI has
    arrived" remark was dropped for the same reason. The two other high-scoring items, Asahi Linux
    on M3 and the Autistici/Inventati shutdown, are already in the 2026-09-06 digest and were not
    re-selected. ROCm 10.0 and the Cloudflare eBPF post are both dated 2026-08-27 and only reached
    HN in this window; both were selected on substance, and ROCm was kept out of Top stories because
    of that age. ROCm 10.0 also closes a named watch item on follow-up f-0007, which asked for
    public results from the Claude-for-ROCm collaboration: AMD Skills and Hyperloom are that result.

    Backtest overrides. Two of the 2026-09-06 candidates are real misses rather than noise. The
    actively exploited Chromium sandbox RCE (49570669, 777 points) is a watchlist gap: the query
    corpus carries no Chrome or Chromium term, which is a notable hole given that the 09-05 digest
    carried a Chromium V8 KEV addition and 09-06 carried a Chrome site-data story. The OpenAI agent
    message board discovery (49563355, 2230 points, the largest candidate by a wide margin) matched
    on the OpenAI entity and belongs to a thread the digest was actively covering on 09-04 and
    09-05, so it is a relevance skip, not a collection failure. The remaining four overrides are out
    of scope: two Isar Aerospace launch threads, and two false entity matches where the AMD and
    Anthropic queries hit a retro gaming PC build and a poetry book.
