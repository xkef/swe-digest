    titles:
    - Meta ships Muse Spark 1.3 to Muse Code and the Meta Model API, holding max reasoning back for safety
      testing
    - GitHub measures that shortening agent tool output raised total task cost in its own harness
    - Cursor moves cloud-agent tool execution onto customer machines while the agent loop and transcripts
      stay in its cloud
    - Anthropic ships a browser-side checker for C2PA content credentials on files Claude produced
    - Multiverse Computing releases Quasar 438B and cites Artificial Analysis for a score of 43 on its
      intelligence index
    - >-
      Five OpenChoreo advisories, one rated critical at CVSS 9.0, entered the GitHub Advisory Database
      four to five weeks after the project published them
    - Claude Code stores MCP OAuth tokens in a plaintext file on Linux and Windows
    - Wasmi 2.0 reports a 2.2x execution speedup and publishes the interpreter design behind it
    - >-
      A developer emulating fused multiply-add finds the same subnormal rounding bug in Rust's standard
      library and in musl libc
