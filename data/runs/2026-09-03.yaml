      four to five weeks after the project published them
    - Claude Code stores MCP OAuth tokens in a plaintext file on Linux and Windows
    - Audacity 4.0 rebuilds the interface on Qt, adds the one-way .aup4 project format, and ships without
      the scripting pipe
    - >-
      Polars 2.0 release candidate makes the streaming engine the default and drops the row-order guarantee
      for joins and group_by
    - Wasmi 2.0 reports a 2.2x execution speedup and publishes the interpreter design behind it
    - >-
