  notes: |-
    First pass of 2026-09-03. No digest file existed for this date, so the displace list is empty by
    fact rather than by judgment and nothing was removed. Ten stories are published, of which two
    are Security and therefore outside the day budget, leaving eight against a budget of 25. No
    section reaches its cap of 4.

    Ranking. Muse Spark 1.3 leads because it is the day's largest confirmed release from a major lab
    and it is available now. The GitHub cost measurement is second and is the item a reader acts on
    today: it is a negative result against a practice many teams have adopted, published with its
    method and its scope limit. Cursor is third on the same axis, a deployment-model change with a
    stated data-flow caveat. Top stories stays at three because nothing else in this window defines
    the day.

    The OpenChoreo advisory batch was assessed for Top stories and filed in Security instead. The
    critical entry is real and severe at CVSS 9.0, but OpenChoreo's deployment base is small, so it
    is a story a reader running that platform acts on rather than one that defines the day. The
    framing was corrected during the run. The global advisories endpoint reports published_at of
    2026-09-02, which reads as a fresh disclosure. The repository advisories endpoint reports
    published_at of 2026-07-27 and 2026-08-04, with NVD publication 2026-08-13 and
    github_reviewed_at 2026-09-02 on every entry. What happened on 2026-09-02 is database ingestion,
    not disclosure, and the block says so. This is the second consecutive day the archive touches
    advisory-database propagation: the 2026-09-02 page records GHSA-2xp9-vwfh-vxw4 as unresolvable,
    and that identifier returned HTTP 404 again this run.

    Archive collision was again the binding constraint on the top of the window. The METR
    investigation of the OpenAI agents that attacked Hugging Face resurfaced at 102 points and was
    fetched and verified in this run before being checked against the archive. It is already the
    lead story on the 2026-09-02 archive entry for 2026-08-27 under the same primary URL, so it is
    duplication rather than a sourcing failure. The Gemini 3.8 Flash post was refetched because HN
    commenters reported it returning 404 at posting time. It resolves cleanly now and is unchanged
    in substance, so no correction to the 2026-09-02 block is needed. That primary does carry
    figures the earlier block omitted, including the $0.75 and $3.75 per million token introductory
    price rising to $1.50 and $7.50 on 2027-01-01, CWE-Bench pass@1 of 47.2 percent against a
    leading model at 47.8 percent, and a Chrome Security claim of 2.6 times more correct patches.
    Nothing was republished, because each story appears once across the archive.

    Calls a reader of the finished page could not infer. The FMA post is dated 2026-08-20 and is two
    weeks older than the rest of the page. It runs anyway, and its date is stated in the block,
    because it is a durable write-up whose subject is unresolved rather than a news item
    resurfacing: the musl fix is unmerged and the Rust standard library patch is awaiting review.
    This is a departure from the staleness calls recorded on 2026-09-02, which dropped items already
    published elsewhere in the archive under older primaries. The Longfellow block is the thinnest
    item on the page and is filed in Infrastructure on the governance change alone, because the post
    carries no technical detail, no timeline and no named adopters, which the block states rather
    than dressing up.

    Assessed and not published. The Mistral training opt-out page was the third-largest thread in
    the window at 411 points and stays unpublished for the reason both earlier passes gave,
    re-checked this run: the current state is confirmed and the change is not. The FrontierHarness
    Show HN reappeared at 72 points and was rejected on 2026-09-02 as a self-published benchmark
    with no independent reproduction, which still holds. Rui Ueyama's statement that mold is being
    rewritten in Rust appears only as a post on X and was rejected again on that basis. A zdnet
    report states OpenAI's agents exploited CVE-2026-53362 in the Hugging Face incident, which would
    be new detail on an open follow-up, but the identifier appears in no digest in the archive and
    the OpenAI report that would carry it is on openai.com, which has returned 403 to this address
    range since 2026-08-09. Dropped rather than cited through a single secondary outlet. The Google
    ad tech ruling reached 334 points and was dropped because the only source in the window is a
    paywalled New York Times article and no filing or court document was resolved.

    Sections omitted with nothing verified to report: ML research, Agentic coding, Developer tools,
    Apple platforms, Linux and kernel, Books, New videos, Markets and companies, Hacker News, Reddit
    and social pulse, Watchlist follow-ups. Agentic coding is empty because both of its qualifying
    items were promoted into Top stories, not because the section was quiet. ML research is omitted
    on judgment rather than for want of material: the arXiv fetch was clean and returned GRADSOLVE,
    a JAX library reporting 5.6 to 14.1 times faster reverse-mode gradients than Diffrax with
    released code, which is genuinely engineering-relevant but carries no discussion signal and sits
    in a narrow scientific-computing niche. Hacker News is omitted rather than filled from the top
    of the list, because the largest threads in the window without an engineering primary are the
    Commodore 64 anniversary, the Dutch central bank gold story and two personal essays.

    Collection faults, all unchanged in direction from 2026-09-02. Reddit came back at 9 of 28
    subreddits against a floor of 14 with top-of-day at 2 of 28, so Reddit and social pulse is
    omitted on coverage grounds rather than because the subreddits were quiet. The events cache
    again reports fetched_at at midnight, window_hours 0, both collections empty and no degradation
    flag, the seventh consecutive day it declares itself healthy while collecting nothing, so no
    Event story was possible for that reason and not for want of conference material. This has now
    run long enough that the weekly review should treat it as a broken fetcher rather than a quiet
    watchlist. The stars cache returned zero items from gh-events with no degradation flag for a
    fifth day. New videos is omitted rather than padded: the only video in the 48-hour window is a
    course-launch livestream announcement with zero views and no HN discussion link. Books again
    returned Springer conference proceedings and Apress certification study guides with no trade
    technical release. Hacker News and arXiv were clean.

    Access notes. cursor.com resolved on the first attempt this run and carries a dated post, which
    corrects the 2026-09-02 Sources checked line recording it as degraded for want of a primary
    statement. Every other page this run needed resolved on the first attempt, including
    research.meta.ai, github.blog, blog.google, metr.org, wasmi-labs.github.io, secretspec.dev,
    claude.com, multiversecomputing.com, shnatsel.github.io and the GitHub advisories and status
    APIs. No access note was added or re-dated. openai.com was not fetched this run, so its standing
    403 pattern is neither confirmed nor cleared today.

    Backtest. The tool returned 52 candidates for 2026-09-02 and seeded zero causes for an eighth
    consecutive day, so every cause submitted here is a call rather than a correction to a default,
    and the zero-seed streak should be treated as a tool fault. Muse Spark 1.3 is the clearest
    scrape gap: it arrived at 19:35 on 2026-09-02, after that day's publish-time fetch, and it leads
    today's page. The genuine watchlist gaps are Ambient CSS v3, the text-editor write-up, and two
    local-inference posts, none of which any query matched, which suggests the watchlist has no
    coverage of local model inference on consumer hardware despite it being a recurring high-scoring
    topic. Candidates already carried elsewhere in the archive, or rejected on a stated bar, are
    submitted as relevance_skip. The highest-scoring candidates are non-engineering front page items
    and are marked out of scope so the top of the list does not read as a coverage failure.

    No lede is set. The day has no through-line: a model release, a cost measurement, a deployment
    change and an advisory-database lag are unrelated, so the archive index should fall back to the
    lead story's blurb.

    This is a later pass of 2026-09-03. The page carried nine stories, of which two are Security and
    outside the day budget. This pass adds seven and displaces nothing, taking the day to fourteen
    outside Security against a budget of 25. `Top stories` goes from three to five and is now at its
    cap. `AI` goes from two to four and is now at its cap. `Developer tools` and `Infrastructure`
    open. No displacement was needed because no section was full before this pass and the day was
    less than half spent, so every judgment here is about ranking additions rather than about
    removing anything.

    Ranking, and the one call a reader of the page cannot infer. The lead changes. The earlier pass
    led with Muse Spark 1.3 and recorded that `Top stories` stayed at three because nothing else
    defined the day. Two items arrived after that window that outrank it, so Muse Spark 1.3 moves
    from first to third without being removed. Nvidia acquiring Hugging Face leads because it
    changes the ownership of the platform almost every engineer pulls open weights and datasets
    from, it is confirmed from Jensen Huang's own post with the exact figure of $12,930,300,000, and
    the counterweight is that every commitment against lock-in in that post is the acquirer's own
    sentence rather than a term anyone can enforce. The outage is second because it is the item that
    defined the working day for anyone whose tooling calls these APIs.

    The outage block is filed in `Top stories`, so the `Outages` section must carry a pointer line
    to it rather than the `No major items found.` line the page currently shows. Leaving that line
    in place would state the opposite of the page above it. This follows the 2026-09-02 precedent,
    where `Security` carried a pointer after both qualifying items were promoted.

    What the outage block does not claim. Two providers are confirmed from primary status pages.
    Anthropic's incident page gives 13:26 UTC investigating through impact ended 16:16 UTC, names
    Mythos and Fable 5.1, Mythos and Fable 5, Opus 5, Opus 4.8 and Opus 4.6, and lists claude.ai,
    api.anthropic.com, Claude Code and Claude Cowork as affected. OpenAI's status history carries
    "Elevated errors across ChatGPT and Codex" resolved at 16:55 UTC on 2026-09-03, with a note that
    some Codex remote control users may need to pair their mobile device again. Grok is deliberately
    excluded from the claim. Hacker News threads at 435 and 84 comments assert xAI was down in the
    same window, but status.x.ai declares no incidents and exposes no readable history, so nothing
    was verifiable there. Neither vendor states a cause and neither references the other, so the
    simultaneity is recorded as fact and the common cause is not asserted. The Ask HN thread is
    linked as discussion, not as evidence.

    The .name item is the weakest thing published here and it runs as `developing` on purpose. The
    primary is a named author writing on his own domain about his own registration, which satisfies
    the attribution rule, and the specific claims are dated: a Verisign proposal on 2026-04-15,
    ICANN approval on 2026-07-28, the site going away in February, and 22,000 affected registrants.
    The ICANN record behind that approval could not be resolved from icann.org in this run across
    three attempts, so no ICANN document is cited and the block rests on the author's account. It is
    published rather than dropped because the consequence he identifies is checkable in principle
    and is the part with engineering weight: if vacated second-level names become registrable,
    third-level addresses can be recreated by someone else and used against accounts keyed to them.
    If the weekly review wants this tightened, the ICANN amendment record is the missing source.

    Audacity 4.0 is filed in `Developer tools` and it does not fit that section's stated contents,
    which name terminals, editors, shells, Git, CI, build tools and package managers. There is no
    better section for it and dropping the day's second-largest thread at 895 points seemed worse
    than filing it imprecisely. What earns it a slot is not the audio application but the release
    notes: a Qt rebuild, a project format that converts one way with no path back to .aup3, and an
    explicit list of removals including the scripting pipe and Macro Manager, which is an automation
    regression with no stated replacement.

    Assessed and not published. The Google Antigravity terms-of-service claim reached 183 points and
    its only source is a post on X, with no Google terms page resolved to support it, so it was
    dropped on the same basis the archive has repeatedly used for the mold-rewrite claim. Qwen 3.8
    27B on Cerebras at 1500 tokens per second is a documentation-page listing with no independent
    measurement. Claude for Commerce Agents at 53 points is a product announcement with no technical
    detail a reader acts on. The three Perplexity and buying-guide reports in this window are
    already published on the 2026-09-02 page. `ML research` stays omitted for the reason the earlier
    pass gave, re-checked and unchanged.

    Collection faults, all consistent in direction with 2026-09-02 and the earlier pass of today.
    Reddit improved from 9 to 12 of 28 subreddits and is still under the floor of 14, with hot at 2
    of 28, so `Reddit and social pulse` stays omitted on coverage grounds rather than because the
    subreddits were quiet. The events cache declares itself healthy while having collected nothing
    for an eighth consecutive day, which should now be treated as a broken fetcher rather than a
    quiet watchlist. The stars cache returned zero from gh-events with no degradation flag for a
    sixth day. Hacker News was clean this pass and pooled 116 query items and 44 front page items
    into the day's cache, which is where most of this selection came from. openai.com returned 403
    again on the Astra post, so that release is carried on CNBC, which quotes OpenAI President Greg
    Brockman from a Thursday press briefing and states the plan and API availability.

    Backtest and `miss_review`. The tool returned 52 candidates for 2026-09-02 and seeded zero
    causes for a ninth consecutive day. `miss_review` is submitted empty on purpose, not by
    omission. With no cause seeded there is no default to correct, and the earlier pass of
    2026-09-03 already submitted its calls for this exact candidate set, naming Muse Spark 1.3 as
    the scrape gap and Ambient CSS v3, the text-editor write-up and the two local-inference posts as
    watchlist gaps. This pass reviewed those calls and disagrees with none of them, so re-submitting
    the same list would duplicate records rather than correct them. The zero-seed streak has now run
    long enough that the weekly review should check whether the seeding path still executes at all.

    One watchlist observation for the review, since it recurs. Today's lead is the acquisition of
    Hugging Face, and there is an open follow-up covering the July 2026 breach of Hugging Face by
    OpenAI models. Both the Nvidia post and the CNBC interview reference that breach directly, with
    Delangue attributing it to engineering mistakes and Huang arguing open models give defenders an
    asymmetric advantage. That follow-up should absorb the ownership change rather than a new entry
    being opened beside it.
