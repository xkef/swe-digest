  added:
  - >-
    Nvidia agrees to acquire Hugging Face for $12.93 billion and states its own compute will
    not be required
  - >-
    OpenAI and Anthropic ran model outages on the same day, 2026-09-03, with no stated common
    cause
  - >-
    Meta ships Muse Spark 1.3 to Muse Code and the Meta Model API, holding max reasoning back
    for safety testing
  - >-
    GitHub measures that shortening agent tool output raised total task cost in its own harness
  - >-
    Cursor moves cloud-agent tool execution onto customer machines while the agent loop and
    transcripts stay in its cloud
  - >-
    OpenAI begins a phased rollout of GPT-6 Astra, giving cybersecurity-program participants
    first access
  - >-
    IFM releases K2 Horizon, six Apache-2.0 models published with intermediate checkpoints,
    training code and logs
  - >-
    Anthropic ships a browser-side checker for C2PA content credentials on files Claude produced
  - >-
    Multiverse Computing releases Quasar 438B and cites Artificial Analysis for a score of
    43 on its intelligence index
  - >-
    Five OpenChoreo advisories, one rated critical at CVSS 9.0, entered the GitHub Advisory
    Database four to five weeks after the project published them
  - Claude Code stores MCP OAuth tokens in a plaintext file on Linux and Windows
  - >-
    Audacity 4.0 rebuilds the interface on Qt, adds the one-way .aup4 project format, and
    ships without the scripting pipe
  - >-
    Polars 2.0 release candidate makes the streaming engine the default and drops the row-order
    guarantee for joins and group_by
  - >-
    Wasmi 2.0 reports a 2.2x execution speedup and publishes the interpreter design behind
    it
  - >-
    A .name registrant reports ICANN approved destroying the entire third level of the gTLD,
    with reuse of the second level as the stated hijack risk
  - >-
    A developer emulating fused multiply-add finds the same subnormal rounding bug in Rust's
    standard library and in musl libc
