date: '2026-07-30'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Day shape. This is the day's first run against an empty template, so nothing was displaced. Nine
    stories is low for the volume on the front page, and the reason is overlap rather than a quiet
    day: the 2026-07-29 digest already carried most of what is still ranking today, specifically the
    Hugging Face command-level intrusion timeline, the Copilot for Word document-borne worm, the
    GitHub npm and Actions supply chain post, npm publish-time scanning, the Collabora RADV Win32
    port and the Valve sponsorship, Mitchell Hashimoto's Superlogical, the AlphaFold team
    disbandment, the HANDBOOK.md paper, and Cloudflare ML-DSA origin authentication. Each story
    appears once, so all of those are absent here by design and today's selection is what is
    genuinely new since that page.

    Degraded coverage. Reddit was the only degraded source: top_day reached 2 of 28 subreddits and
    day coverage reached 9 of 28 against a floor of 14. The committed snapshot pooled in 13 top_day
    items, which is where the r/netsec and r/MachineLearning material used here came from. RSS
    carries no score, so the Reddit pulse item is ranked on thread count across the subreddit rather
    than on votes. Hacker News, papers, YouTube, books, and stars were not degraded. The events
    watchlist returned nothing upcoming or active, and the GitHub stars fetch returned a single item
    that did not clear any bar.

    Pages that would not load. Reuters returned 401 for the second-firm report, openai.com returned
    403 for its own incident page, and science.org returned 403 for the "AI's top startups are
    barely publishing their research" piece that drew 297 points and 161 comments. The lead
    therefore rests on the Guardian as the resolvable carrier of OpenAI's statement rather than on
    OpenAI's own page. The Science piece is omitted entirely because no claim in it could be
    verified. The Turso item rests on The Register alone: the article quotes an announcement post by
    Glauber Costa that was not resolved to a URL, so no primary link is given and the status is
    developing rather than confirmed.

    Calls a reader could not infer. The SQLite in Production post is excluded despite 236 points and
    72 comments. It was read in full: it is a competent restatement of standard WAL, busy_timeout,
    cache_size, and mmap pragmas on an agency marketing blog, dated 2026-07-17, with no original
    measurement, so it fails the implementation-detail bar even though it passes the
    discussion-signal test. Copirate 365 and CVE-2026-24299 is excluded because the writeup is dated
    2026-05-04 and Microsoft patched the chain in December 2025 and March 2026, so it is a
    resurfacing rather than news. Logic for Programmers is excluded from Books because nothing on
    the page indicates a new release, and the HN thread appears to be driven by the same day's
    Pragmatic Engineer interview with the author. The Rust on ESP Book at 131 points is official
    Espressif documentation resurfacing, not a release, so Languages and runtimes is empty rather
    than padded with it. New videos is omitted because only one video in the fetch carried an HN
    discussion object and it is a vendor product demo, which is below the section's stated bar. ML
    research is omitted because no arXiv item in the 72-hour window carried external validation and
    the one paper with a real thread, HANDBOOK.md, was published yesterday. Agentic coding,
    Developer tools, Apple platforms, Linux and kernel, Engineering posts, Markets and companies,
    and Watchlist follow-ups are all omitted for lack of anything that outranked what is already
    listed.

    Backtest. The tool seeded zero default causes for 2026-07-29, so miss_review here supplies
    causes rather than correcting them. Six are watchlist_gap: the Gemma 4 engine, the Kimi K3
    architecture notes, the DeltaNet linear-attention walkthrough, SBCL 2.6.7, Neutrino-1 8B, and
    the Kimi K3 self-hosting cost writeup all cleared 100 points with no query match, and there is
    no watchlist query for Lisp, for SBCL, or for Kimi by name. Two are scrape_gap: the Claude
    outage and Kimi K3-256k both landed after yesterday's publish fetch and are carried today. The
    high scorers that are simply not engineering, such as the Japan earthquake, the HIV vaccine
    study, and the Kavinsky obituary, are left unscored because nothing was seeded against them to
    correct.

    Memory hygiene. The followups store now holds 41 open records at about 105 KB, and entities
    holds about 77 KB. A single memory_query against followups exceeds the tool output limit and has
    to be read back in chunks, which every run of the day pays for. Several records are
    multi-paragraph narrative rather than the compact facts the field guide asks for, and the oldest
    open entry, f-0056 on the S&P Oracle downgrade, was last seen 2026-07-15. No followup has been
    touched since 2026-07-26 despite four digests since. Worth a pass at closing resolved entries
    and compressing the rest. The issue inbox for story was empty and no issue was acted on.

    Ranking intent. This run adds two items to Top stories and does not displace anything. The two
    additions are ranked above the three blocks the day already carries, so the intended order is
    the Rails advisory first as the day's lead, then the Copilot for Word worm, then the existing
    OpenAI rogue-agent, Matthew Green, and TurboFieldfare blocks. That fills Top stories to five.
    The Rails advisory leads because it is the only item today that forces immediate unplanned work
    on a large installed base: upgrade plus rotation of every secret readable by the application
    process, including the master key and third-party tokens. The Copilot worm ranks second because
    it is unfixed at the class level rather than because of its discussion volume.

    Superlogical was the day's largest Hacker News discussion by comment count (423 comments across
    two submissions) and was still placed in Developer tools rather than Top stories. It is a
    company announcement with no shipped product, and the ranking rules put launch announcements
    below operational and security impact. Displacing a published block for it would have been
    churn, not a better day.

    Degraded sources. Reddit was degraded on the same two counts as the earlier run and slightly
    worse on day coverage: top_day reached 2 of 28 subreddits and day coverage reached 13 of 28
    against a floor of 14. The missing top_day vote signal is again why no new Reddit item was
    ranked. The GitHub stars collection ran and returned zero events, so this digest makes no claim
    about GitHub watchlist activity. The events watchlist returned no upcoming or active conferences
    for the date. Hacker News, papers, books, and YouTube were not degraded.

    Sources that would not load or could not be cited. The Financial Times original on the AlphaFold
    team was not read; Engadget was used, and it carries a direct DeepMind spokesperson statement
    plus the named quote from DeepMind's VP of research, so the claim is not resting on the
    aggregator alone. Reuters (HTTP 401), Bloomberg, and science.org were not attempted again this
    run since the earlier run recorded them as blocked, and science.org's "AI's top startups are
    barely publishing their research" remains the day's highest-engagement unpublished item at 506
    points for that reason.

    Calls a reader could not infer. New videos is omitted: the YouTube collection returned a large
    volume of KubeCon Japan and conference session uploads, and none carried an external discussion
    thread, which is the bar that section states. Books is omitted for the same reason, no release
    cleared the bar. The Hacker News section is omitted because every high-discussion thread today
    resolved to a verifiable primary source and belongs in a topical section, leaving nothing
    HN-native worth a block.

    Deliberate exclusions. "Copirate 365: Plundering in the Depths of Microsoft Copilot
    (CVE-2026-24299)" surfaced on the CVE and Copilot queries and was verified, but the post is
    dated 2026-05-04 and the issues are patched, so it is old material resurfacing rather than
    today's news. The Google Play Age Signals API global expansion was verified against the Android
    Developers blog and omitted on ranking, not on sourcing. A Reddit post asserting OpenAI has been
    forced to pause training new models was not published: no primary source supports it and the
    post links a video, not a statement.

    Backtest. Six candidates from 2026-07-29 are marked watchlist_gap because they are genuine
    engineering items that no configured query could have caught: two Kimi K3 items, a Gemma 4
    local-inference engine, a linear-attention survey, a model release, and an SBCL release. The
    common gap is that the model and language names involved (Kimi, Moonshot, Gemma, SBCL) are
    absent from the query corpus while Claude, Gemini, Llama, and Mistral are present. The off-topic
    candidates in the same list, such as the earthquake, HIV vaccine, KOReader, and Darktable items,
    are correctly not engineering misses and were left with their seeded cause.
