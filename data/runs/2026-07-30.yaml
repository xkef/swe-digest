    Teams, and Copilot. It is also fully remediated, the hot fix shipped 2025-11-22, the
    architectural fix completed in July 2026, and Microsoft states no evidence of exploitation
    outside the research and no customer action required. The Proofpoint TA488 campaign is the
    reverse: medium CVSS from NVD at 6.1, high from Microsoft at 8.1, but active exploitation since
    22 July 2026, a CVE in CISA KEV since 2026-05-15, and a persistence design that outlives the two
    remediations a defender reaches for first. Operational weight decided the order, not blast
    radius or discussion volume, which is why CosmosEscape sits in Security, a section outside the
    caps, rather than competing for the last Top stories slot.

