    titles:
    - >-
      Atlassian patches a pre-auth file read in eight Data Center products, and a public exploit chain
      turns it into Jira administrator
    - Tensorlake npm package shipped a credential worm that wipes the home directory if the stolen token
      is revoked
    - curl pulls 8.23.0 forward to 2026-10-14 for 22 vulnerabilities, including its first HIGH severity
      CVE since 2023
    - OpenAI withdraws three of its mathematics manuscripts over a sign error and revises 14 more
    - Margaret Hamilton, who led the Apollo flight software and began using the term software engineering,
      died at 90
    - OpenAI announces GPT-6 and model-composed interactive UI in ChatGPT
    - Association for Human Mathematics urges mathematicians to stop working with OpenAI
    - >-
      Paper argues Lean verification of AI autoformalisation proves nothing about the prose proof, and
      that OpenAI's Navier-Stokes case shows it
    - Docker Agent defines agents in YAML and distributes them through any OCI registry
    - Microsoft says Copilot will route tasks to an on-device model by end of month, and sandbox tool
      calls in OS containers
    - MCP trust gaps let one internal agent pass injected instructions to another at five unrelated organisations
    - ShinyHunters bypassed the published PeopleSoft WAF mitigation with URL encoding before extorting
      a divested Boeing unit
    - >-
      LLM-written Rust port of the TypeScript compiler passes all 181,711 ported Go tests and type checks
      in about half of tsc 7's time
    - incident.io traces a Postgres queue ceiling to MultiXact lock contention caused by per-item savepoints
    - Push ifs up and fors down, with the algebra that says when each rewrite is legal
    - GitHub reports one in three pull requests involves an AI agent and no detectable trend in the per-push
      secret leak rate
