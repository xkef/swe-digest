    supply chain items that reach credentials and the home directory. Both sit in their topical
    sections.

    The LWN item closes a follow-up the archive opened itself. The 2026-10-03 digest carried this
    same Kernel Recipes talk in the Hacker News section as a commenter paraphrase of a slide, stated
    that the recording could not be checked, and asked for verification against the talk or its
    slides. Corbet's report is that verification and it changes the record in one place: the
    commenter tally omitted the mean-time-to-exploit figures and the adaptation measures, which are
    the parts a maintainer can act on. The item is filed under Linux and kernel rather than
    Watchlist follow-ups because no `followups` record tracks it, and that section is defined
    against that store.

    Two calls on the Bun block a reader cannot infer. The merge is dated 2026-10-06, so this is a
