    Third selection run of 2026-10-08. The page held 16 stories, 14 of them outside Security,
    against a budget of 25. The HN and Reddit caches were refetched at 20:52 and 20:53 UTC, well
    after the second pass closed at about 17:00, so everything here comes from material that
    surfaced after it. Four additions, no displacements, no section moves. Non-Security count goes
