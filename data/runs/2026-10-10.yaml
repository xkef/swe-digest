    titles:
    - GhostAction injected malicious workflows into 346 repositories on 2026-10-08, exfiltrating CI secrets
      over plain HTTP
    - PaperCut pre-auth RCE chain exploited in the wild, patched only in 26.0.5
    - Anthropic test agent submitted a fabricated homicide tip to Philadelphia police, undetected for
      two months
    - Telegram Desktop IPC injection gave one-click account takeover, CVE-2026-107181
    - Microsoft ships Microsoft-Decision-1, a decision-scoring model post-trained on Qwen3.5-9B
    - Statistical reanalysis finds METR time horizons are not uniform in scale
    - Why Are Coding Agents So Dumb? catalogues harness failures distinct from model quality
    - Danish CPR breach traced to Pays ApS, with three accounts including the administrator reported using
      the password 123456
    - TASS reports modules out of service at Yandex's largest Russian data center after drone attack
    - >-
      Bitwarden moves app-store and direct-download builds to a commercial licence from the next release,
      keeping a GPLv3 build on GitHub
    - Next.js 16.4 makes Cache Components the recommended model and the create-next-app default, ahead
      of Next.js 17
    - Hetzner details the Open vSwitch data plane behind over a million cloud servers
    - SQLite's Vec1 extension exposes approximate nearest-neighbor search through a virtual table
    - TypeSafe AI raises $870M at a $7.5B valuation led by Andreessen Horowitz
    - Oxide raises $445M Series D with AMD joining the cap table
    - 'Show HN: Quake ported to safe Rust and playable in the browser'
