    Day state. data/digests/2026-10-10.md existed but was the unmodified scaffold: status draft,
    source_count 0, placeholder story body, every section reading \"No entries yet.\" This was
    therefore the day's first real selection and nothing was displaced. issue_inbox returned zero
    story issues, so no owner requests fed this run.

    Coverage. Hacker News, papers, books, and YouTube came back clean. Reddit was badly degraded:
    reddit-rss reached 4 of 28 subreddits against a floor of 14, and only 2 of 28 for top_day before
    the committed snapshot pooled in 17 more items. The one Reddit-sourced item I kept, the
    watchTowr PaperCut research, I verified directly against labs.watchtowr.com rather than trusting
    the thread. GitHub stars returned an empty item list and the events watchlist had no upcoming or
    active entries, so neither contributed. No access-notes entry was needed, because nothing looked
    like a datacenter-IP block.

    Fetch failures. python.org/downloads/release/python-3150/ returned undecodable gzip, so Python
    3.15 is cited to docs.python.org/3.15/whatsnew/3.15.html instead. An HN commenter independently
    reported links broken on that same release page, so the problem may be upstream rather than
    local. status.yandex.cloud served a browser-upgrade gate and never rendered, which is why the
    Yandex item stays developing.

    Calls a reader could not infer. I excluded the LWN Eurydice piece despite 60 points on the front
    page, because it is dated 2026-01-30 and is a nine-month-old article resurfacing, not a dated
    event. The LWN undefined-behaviour article I did keep is dated 2026-09-28, and I put that date
    in the item so it does not read as same-day news. I dropped the Tor Project statement on its
    Mullvad relationship, verified at blog.torproject.org, because the engineering content reduces
    to paused co-branding and revised endorsement language while the substance is a political
    donation controversy, which does not change what an engineer does. I also dropped the OpenAI
    safety-researcher dismissals and the Iranian ChatGPT influence operation: both are real and well
    covered, but I could not reach a primary source for either inside this run, and the related
    Tomek Korbak item would have required attributing a claim to a person without his own verified
    account as the source.

    Books is omitted rather than filled. The publisher feed returned 21 items and every one is a
    Springer LNCS conference proceedings volume, with no trade technical release of engineering
    relevance. Watchlist follow-ups is omitted too, and that absence is a finding: none of the five
    open follow-ups moved today. f-0036 on coding-agent sandbox escapes is thematically adjacent to
    both the mtlynch post and Microsoft's MXC release, but neither is an update to the tracked
    disclosures, so I published them as their own stories instead of padding a follow-up entry. The
    Reddit Qwen-Image-2.1-Turbo posts are not the Qwen-Image-3.0 weights that f-0038 watches for.

    Top stories came to three rather than five, which is a judgment about the day and not a
    shortfall. Deno leads on ecosystem consequence, since the runtime gets one more year of fix-only
    releases and Deno Deploy shuts down in six months. PaperCut is second on urgency: exploited in
    the wild on 26.0.3, then four patch rounds where watchTowr bypassed each one, so only 26.0.5 is
    safe. Python 3.15 is third on breadth. I considered the Telegram CVE for a top slot and demoted
    it to Security, because 7.2.9 shipped on 2026-09-17 and no exploitation is reported, which
    leaves the quiet disclosure as the story rather than an action for today.

    Backtest. I overrode three seeded causes to watchlist_gap. Whistle speech-to-text at 16.9 MB
    (886 points) and DuckDB Ducklake (226 points) are both squarely in scope and no query matched
    either, which points at gaps in the watchlist rather than at editorial choices. The Yandex data
    center item (184 points yesterday, 215 today) is the clearest of the three: it is a major cloud
    provider losing capacity and it surfaced two days running, so missing it yesterday was a
    collection gap. I left the remaining 58 candidates on their defaults, including the ETH-68 Linux
    audio interface, which matched the Linux entity genuinely but is too niche to carry, and the
    OpenAI math-paper threads, which we saw and skipped on purpose.

    Re-ranking, not padding. The day's digest already carried 10 stories when this run started. I
    added six and moved one, leaving 17 blocks against a 25 budget with Security outside it, so no
    bound was binding and nothing was removed from the page.

    Top stories changed order and composition. GhostAction takes the lead from PaperCut because it
    is an active campaign with injections dated 2026-10-08 and workflows still present on default
    branches on 2026-10-09, where the PaperCut chain was closed in 26.0.5 on 2026-09-10. PaperCut,
    Telegram Desktop, and Microsoft-Decision-1 keep their slots with text unchanged. Oxide's $445M
