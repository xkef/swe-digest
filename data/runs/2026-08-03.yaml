  added:
  - >-
    Arch Linux disables AUR package adoption and then all pushes after a wave of malicious
    takeovers of orphaned packages
  - >-
    JFrog audits 55 advisories from one GitHub account and finds 54 fabricated, after NVD
    rated six SQLite CVEs critical or high
  - >-
    Unit 42 recovers a threat actor's environment showing an unattended DeepSeek-driven agent
    chain that compromised no targets, with the three confirmed compromises coming from manual
    attacks
  - >-
    ComfyUI ships day-zero support for the open-weights MiniMax H3 video model and reports
    cutting its memory footprint 66 percent, from 123.6 GB to 42.5 GB
  - >-
    TokTier measures tokenization reaching up to 64 percent of time to first token for coding
    agents at a 94.1 percent prompt-cache hit rate
  - >-
    A Locksmith Loop paper reports 91.90 percent branch coverage on one internal COBOL program
    when validating agent-migrated code against the original with a deterministic parity oracle
  - >-
    Anthropic's Claude Code lead says a single agent run rewriting the Electron Claude desktop
    app in Swift has been going about 15 days and is still running
  - >-
    David Crawshaw argues agent-driven personalization replaces plugin systems, and names
    Claude Code's closed source as the wall
  - >-
    RFC 9851 puts TLS 1.2 in feature freeze and states that post-quantum cryptography for
    it will not be specified at any time
  - >-
    Kakehashi loads Darwin Mach-O binaries on Linux aarch64 against a freestanding libSystem,
    running 7-Zip about 5.2 times slower than native on a multi-file archive
  - >-
    Rust accepts a 2026-2027 project goal for Move and Forget traits, with the stated aim
    of deprecating Pin rather than extending it
  - >-
    Octane compiles React's hooks model ahead of time with no virtual DOM, and its own benchmark
    grid puts Vue Vapor ahead on the geometric mean
  - >-
    A SwiftUI retrospective points at Apple's own Landmarks tutorial rendering a broken sidebar
    on current Xcode and macOS, unchanged for over two years
  - >-
    Linus Torvalds calls Linux 7.2-rc6 the biggest rc6 in years by commit count and says nothing
    in it justifies delaying the release
  - >-
    Cloudflare moves cdnjs, 9 billion requests a day, off 26 alphabet-sharded Cloud Functions
    and a 1.1 TB git repo onto its own developer platform
  - >-
    Andy Pavlo joins ClickHouse as VP of Database Research to establish ClickHouse Labs
  - >-
    The Hacker News thread on the Wafer MI355X post disputes its performance-per-dollar claim
    using the post's own comparison table
  - >-
    Block traces the Coldcard seeds to ngu.random falling back to MicroPython Yasmarang, and
    Galaxy Research puts the theft at 1,367 BTC from 4,585 addresses
  - >-
    Aikido names anthropickit as a candidate for the PyPI package Anthropic's evaluation agent
    published, and Ars Technica reads the three intrusions as felonies had a human done them
