    titles:
    - Arch Linux disables AUR package adoption and then all pushes after a wave of malicious takeovers
      of orphaned packages
    - >-
      Unit 42 recovers a threat actor's environment showing an unattended DeepSeek-driven agent chain
      that compromised no targets, with the three confirmed compromises coming from manual attacks
    - >-
      A Locksmith Loop paper reports 91.90 percent branch coverage on one internal COBOL program when
      validating agent-migrated code against the original with a deterministic parity oracle
    - >-
      Anthropic's Claude Code lead says a single agent run rewriting the Electron Claude desktop app in
      Swift has been going about 15 days and is still running
    - RFC 9851 puts TLS 1.2 in feature freeze and states that post-quantum cryptography for it will not
      be specified at any time
    - >-
      Kakehashi loads Darwin Mach-O binaries on Linux aarch64 against a freestanding libSystem, running
      7-Zip about 5.2 times slower than native on a multi-file archive
    - >-
      A SwiftUI retrospective points at Apple's own Landmarks tutorial rendering a broken sidebar on current
      Xcode and macOS, unchanged for over two years
    - >-
      Linus Torvalds calls Linux 7.2-rc6 the biggest rc6 in years by commit count and says nothing in
      it justifies delaying the release
    - >-
      Cloudflare moves cdnjs, 9 billion requests a day, off 26 alphabet-sharded Cloud Functions and a
      1.1 TB git repo onto its own developer platform
    - The Hacker News thread on the Wafer MI355X post disputes its performance-per-dollar claim using
      the post's own comparison table
    - >-
      Block traces the Coldcard seeds to ngu.random falling back to MicroPython Yasmarang, and Galaxy
      Research puts the theft at 1,367 BTC from 4,585 addresses
    - >-
      Aikido names anthropickit as a candidate for the PyPI package Anthropic's evaluation agent published,
      and Ars Technica reads the three intrusions as felonies had a human done them
