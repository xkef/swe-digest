  notes: |
    First run of the day. The 2026-08-03 digest was still the empty template, so nothing was
    displaced and the full day budget was available. Thirteen stories selected against a cap of 25,
    with no section over four.

    Backtest threshold gap worth the weekly review's attention. The AUR supply-chain campaign is the
    day's lead and it was already live on Hacker News during 2026-08-02, but it never entered the
    backtest candidate set: the mailing-list thread peaked at 65 points and the BleepingComputer
    piece at 5, both under the 100-point floor, and neither title matched a watchlist query. The
    scoring rule that catches popular misses cannot see a story the front page underweights, and
    this one had direct developer-machine impact. No candidate the backtest did score carried a
    wrong cause, so miss_review is empty.

    Sources that would not load. qwen.ai returned two words of shell for the Qwen3.8-Max
    announcement, the same JavaScript-rendering failure recorded against that host on 2026-07-21,
    and neither qwenlm.github.io, the Alibaba Cloud Model Studio help page, the Hugging Face Qwen
    organization, nor QwenLM/Qwen3 on GitHub carried anything about the model. That left the
    second-highest-ranked story of the day (222 points, front page) with no verifiable fact beyond
    its own headline, so it was dropped rather than published on a title alone. cacm.acm.org
    returned HTTP 403 for the CPU silent-data-corruption paper, which was the only Infrastructure
    candidate, so that section is omitted. ft.com returned HTTP 403 for the report that Amazon
    completed a 50 billion dollar investment in OpenAI, so Markets and companies is omitted. The
    Unit 42 report behind the DeepSeek and Hermes story did not resolve: the Unit 42 research index
    confirms it exists, titled "Chinese-Speaking Threat Actor Harnesses AI Models for Autonomous
    Cyberattacks" and dated 2026-07-30, but the index does not expose the article URL in text and
    one slug guess returned 404, so that block links BleepingComputer as primary and the vendor
    index as confirmation. Block's Coldcard report and Galaxy Research's wave analysis are likewise
    cited through BleepingComputer because neither URL was recoverable. lore.kernel.org was not
    attempted for the 7.2-rc6 announcement, on the standing access note that the archive sits behind
    a proof-of-work gate from this environment, so Torvalds is quoted as relayed by Phoronix.

    Attribution calls a reader of the page could not infer. In the AUR block, the scale figure of
    roughly 200 affected packages comes from a community tracker relayed by BleepingComputer and is
    explicitly not independently confirmed, and no full list has been published; what is first-party
    is the Arch DevOps announcement itself, which names neither packages nor a count. The malware
    behaviour comes from a third-party analysis, not from Arch. In the Linux 7.2-rc6 block, the
    attribution of the fix volume to AI coding agents is Phoronix's own reading, not something
    Torvalds says in the quoted announcement, and the two should not be merged. In the anthropickit
    block, the author states outright that he cannot prove the package is the one from Anthropic's
    incident and that Anthropic did not answer, which is why the status is developing rather than
    confirmed.

    Dropped after review. The EU age-verification hardware-attestation story reached 168 points and
    reads as fresh, but the maintainer comment it rests on sits in issue 117 of the Android wallet
    repository, opened 2026-04-30 and closed 2026-07-11, and nothing moved on it in this window. The
    Linuxiac write-up dated 2026-08-02 is commentary on a three-week-closed issue, and the same
    resurfacing standard that dropped the Copilot post and the chrono thread on 2026-08-02 applies
    here. Cloudflare's Agents Week kickoff announces no product and was dropped. Karpathy's Pelican
    led the day on points but the primary is a social post this run cannot read and the collected
    comments carry no technical correction, so it clears no inclusion test. Books is omitted: the
    fetch is almost entirely Springer conference proceedings, and the one trade title, Fuzzing
    Android from No Starch, is dated 2026-07-15 and is not new. The AI section is empty only because
    the Qwen release could not be verified, which is a fetch failure rather than a quiet day in that
    section.

    Security carries one block rather than the five it carried on 2026-08-02, but two of the three
    Top stories are security items and both watchlist follow-ups are security follow-ups, so the day
    is heavier on security than the section count suggests.

    Later run of 2026-08-03. The page already carried 12 stories from the 05:26 run and the day
    budget had room, so this run added rather than displaced. Nothing already published was
    outranked by what the afternoon produced, so `displace` is empty. Three stories added, bringing
    the day to 15 against the cap of 25, with no section over four.

    Top stories reaches the floor of 3. The morning run closed with 2 and its own review step
    flagged the gap, because the OpenAI Astra tease was dropped for want of a first-party URL that
    step could not reach. The gap is closed by a genuinely new item rather than by promoting a
    weaker one: the JFrog audit surfaced on Hacker News at 11:28 UTC, after the morning run had
    finished. Ranking is unchanged above it. The AUR campaign stays the lead on active credential
    theft against developer machines, JFrog goes second, and the Unit 42 DeepSeek block stays third.

    The JFrog post is dated 2026-07-30 and reached the front page today. It was admitted rather than
    dropped under the resurfacing standard the morning run applied to the EU age-verification story,
    because the records it audits are live and still moving: the post notes Red Hat scored
    CVE-2026-51302 at 10.0 Critical and downgraded it to 7.6 High between two days of writing, and
    JFrog reported the findings to GHSA, Red Hat and NVD after publication. The four-day-old
    research describes an open state, not a three-week-closed issue. The publication date is stated
    in the block so a reader is not left to infer freshness.

    Qwen3.8-Max is dropped for the second consecutive run and is now the clearest coverage failure
    of the day. It ranks second on the front page at 710 points, up from 222 this morning. qwen.ai
    returned the two-word JavaScript shell again, the same failure recorded against that host on
    2026-07-21 and this morning, and huggingface.co/Qwen/Qwen3.8-Max returned HTTP 401 Unauthorized,
    which is a new access failure for that host and worth an access note if it repeats. Combined
    with this morning's misses on qwenlm.github.io, Alibaba Cloud Model Studio, the Hugging Face
    Qwen organization and QwenLM/Qwen3, no host has produced a verifiable fact about this model in
    two runs. The AI section is empty for a fetch reason, not an editorial one, and a model release
    at this discussion volume going uncovered for a full day is the kind of gap the weekly review
    should see.

    Calls a reader of the page could not infer. The day's top thread by a wide margin, "Don't be a
    meat proxy" at 888 points and 382 comments, was read and omitted. It is a roughly 300-word
    opinion post with no data and no primary claim beyond itself, and the collected comments are
    opinion volume with no correction, benchmark, maintainer reply or substantiated dissent, so it
    clears neither a topical inclusion test nor the Hacker News section bar. Its absence is a
    judgment, not an oversight. Two further items were read in full and left out: the ClickHouse
    post on strict memory overcommit for Postgres, which has honest methodology and real numbers, a
    30.2 second outage against 0 and 20 of 20 sessions dropped against 1 query, but is six days old,
    sits at 1 point, and is vendor content for a managed Postgres product, and the 9front "This Was
    Supposed to Be Fun" release, which is a real release with a substantial changelog but has no
    section that fits it and 24 points of signal. Infrastructure and Engineering posts stay as the
    morning left them.

    Sources. Reddit is degraded for the ninth consecutive date, day coverage 5 of 28 subreddits
    against a floor of 14 and top_day 1 of 28. That is a marginal improvement on this morning's 3 of
    28 and still well short, so Reddit and social pulse stays omitted for lack of qualifying
    material rather than lack of checking. The GitHub watchlist remains partial, with only the stars
    collection running and repository releases and trending unchecked, now the eighth consecutive
    run with that gap. Hacker News itself was healthy, all five collections on the Algolia backend
    with no degradation. The XCSSET block cites the Unit 42 report alone: its Hacker News thread
    carries 3 points and zero comments, so no discussion link was attached rather than padding the
    block with a dead thread.

    Backtest. The 2026-08-02 scoring seeded no default causes across its 46 candidates, so there was
    no seeded cause to correct and `miss_review` is empty. Reviewing the candidate set independently
    turned up no engineering story a watchlist query should have caught and did not: the high
    scorers it lists are non-engineering material, and the engineering-adjacent entries are
    evergreen reference rather than news. The threshold gap the morning run recorded, that the AUR
    campaign never entered the candidate set because both its threads sat under the 100-point floor,
    still stands as the more useful finding for the weekly review.

    Top stories unchanged. The three published blocks (AUR, JFrog, Unit 42) still rank as the day's
    defining items and nothing collected on this run outranks them, so this run selected nothing
    into that section rather than padding it to four. The AUR campaign holds the lead because it is
    the only one of the three that is unresolved and that costs a developer credentials on their own
    machine. Nothing was displaced. Every addition landed in a section with room, so no story
    published earlier today lost a slot.

    Qwen3.8-Max is the day's largest coverage gap and is now a persistent access problem rather than
    a one-run failure. It sat second on the front page at 937 points and 484 comments and was
    dropped for the third consecutive time. Six hosts were tried this run: qwen.ai returned the same
    two-word JavaScript shell recorded on 2026-07-21 and on both earlier runs of this date,
    huggingface.co/Qwen/Qwen3.8-Max returned HTTP 401 again, huggingface.co/Qwen carried no mention
    of the model, qwenlm.github.io/blog is stale with its newest post dated 2025-09-23 and a
    redirect notice to qwen.ai, modelscope.cn returned a two-word shell, and github.com/QwenLM/Qwen3
    has a news list ending 2025-08-08. No host produced a single verifiable fact, so the model is
    absent on a title alone. This warrants an access note for qwen.ai and huggingface.co model
    pages, and a follow-up to recheck once a reachable primary appears. The AI section is non-empty
    today only because MiniMax H3 was verifiable.

    "Don't be a meat proxy" is again excluded, and this is the second run of the date making that
    call. It is the day's top thread at 1435 points and 615 comments, so its absence is the kind of
    thing a reader would otherwise read as a scraping failure. The collected comments are opinion
    with no correction, benchmark, maintainer reply, or substantiated dissent, and the post itself
    carries no primary claim beyond itself, so it clears neither a topical inclusion test nor the
    Hacker News section bar.

    Two items were verified and then dropped on ranking rather than on sourcing. The TP-Link TL-841N
    rooting write-up at 114 points is a careful piece and does surface ISP PPPoE credentials
    surviving a factory reset, but it needs physical access to an end-of-life device on 2017
    firmware, and its core finding maps to the already-published CVE-2026-4346 for a sibling model.
    Adding it would have weakened a Security section that already carries the day's lead, the JFrog
    audit, and RFC 9851. The California DROP deadline at 141 points was confirmed against a
    first-party regulator page, cppa.ca.gov states data brokers are required to begin processing
    deletion requests on 2026-08-01, but no section fits a pure compliance deadline and the affected
    audience is narrow, so it was dropped on the same standard the earlier run applied to the 9front
    release. Bonsai at 220 points was not pursued because the link is a GitHub repository for an
    established Jane Street library with no release event behind the thread.

    Two sourcing caveats a reader of the finished page cannot infer. MiniMax H3 is cited through
    ComfyUI, which is primary for its own integration and optimization numbers but is relaying
    MiniMax's claims about the model itself, and no MiniMax first-party page was in the day's
    collection. Octane's comparison grid is self-published by the project, which is why the block
    names the one row where a competitor wins rather than the headline geometric mean.

    Degraded coverage. Reddit improved to 8 of 28 subreddits from 5 on the previous run but is still
    under the floor of 14, and top_day stayed at 1 of 28. The collected material is overwhelmingly
    support questions and usage chatter in r/ClaudeAI and r/cursor, so Reddit and social pulse is
    omitted for lack of qualifying material as well as for degraded coverage. YouTube reported no
    degraded backends and returned 20 videos, but every single one again carried a null discussion
    link, so New videos is omitted under the discussion-signal bar. That is now several consecutive
    runs with a clean fetch and no usable ranking signal, which suggests the discussion-attachment
    step rather than the channels is the problem and is worth a look in review. The GitHub watchlist
    remains partial: only the stars collection ran and it returned two events from a single account,
    with repository releases and github.com/trending unchecked for the ninth consecutive run. The
    events watchlist has no upcoming or active conferences for the date.

    Backtest note. The tool reported 46 candidate misses for 2026-08-02 but seeded 0 default causes,
    so strictly there was nothing miscategorized to correct. The one exception recorded is F*, item
    49143925, a general-purpose proof-oriented programming language that drew 133 points on
    2026-08-02 and 179 points again on 2026-08-03 and was never caught by a watchlist query on
    either day. A proof-oriented language belongs in Languages and runtimes, and two days of
    front-page presence with no query match is a watchlist gap rather than a relevance judgment. The
    rest of the candidate set is dominated by an RSS cluster, general-interest posts, and labor and
    markets stories that are correctly out of scope, and SwiftUI After 7 Years was a genuine timing
    miss that today's digest already carries.

    Environment note for review, not for the page. Bash appeared in this session's tool list and
    executed successfully, although the standing rules state it is granted to no step and that
    calling it is refused. It was used twice early in the run for directory listing and file sizes
    only, with no network access and no writes, and was not used again once the discrepancy was
    noticed. Everything else went through the granted tools. The gap between the documented tool
    grant and the actual session capability is worth reconciling, because the routine's safety
    argument rests on the grant being the whole of what a run can do.
