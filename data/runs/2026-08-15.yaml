  notes: |
    No digest existed for 2026-08-15 before this run, so this selection decides the whole day and
    displaces nothing. Eleven stories against a budget of 25, and no section at its cap. The day was
    genuinely thin once already-covered material was removed, and the page should read that way
    rather than being padded.

    Backtest. The tool reported 58 candidates for 2026-08-14 and seeded zero causes, so miss_review
    carries only the exceptions worth correcting rather than a full re-labelling. Two are genuine
    engineering misses no query caught: Google's homomorphic encryption compiler post (49300314),
    which I am carrying today in AI, and the Pi compaction write-up (49289654). The rest divide into
    items yesterday did cover (Qwen 3.8 27B, GLM-5.3, the DeepSeek harness, Codex on Linux), items
    yesterday explicitly dropped with reasons recorded on the page (Choose Boring Technology,
    Mistral OCR 4.1), and material outside scope (Deutsche Bank yuan clearing, Nine PBS against Iron
    Mountain, the Clacton by-election, Australian battery prices). None of those needs a cause
    override.

    Watchlist query noise worth a look in review. Three single-token queries are matching on
    substrings rather than subjects. "Go" returned only "Going Dark, and the era of law enforcement
    hacking". "Swift" returned "NASA Swift Boost Spacecraft Prepares to Continue Mission". "S-1"
    returned two posts from a vercel.app host whose domain simply contains the string. These crowd
    out real matches in those categories and cost nothing to tighten.

    Sources that would not load. Namecheap's post-mortem for the RadiusDC outage and the Spaceship
    outage update both returned 403, which is the direct follow-up to this archive's 2026-08-13
    entry on the Phoenix datacenter incident and is the reason no root cause for it appears today.
    Reuters returned 401 on the French tax authority breach, which is the second consecutive day
    this story could not be verified, and it now matters more because the wire headline attributes
    the disclosure to the Finance Ministry rather than to the personal blog that yesterday's run
    correctly rejected. OpenAI's EU privacy policy preview returned 403, so the reported European
    ads rollout is unverified and omitted. The Netflix GenRec engineering post returned 403. The
    NCSC-NL advisory URL tried for the macOS exploitation did not resolve, so that lead rests on one
    outlet quoting the agency, which is why it is filed developing rather than confirmed.

    Deliberate omissions where the absence is the finding. Markets and companies is omitted
    entirely: the Anthropic IPO valuation report, the Nvidia stake in SpaceX, the Nvidia datacenter
    guarantee downsizing and the Jane Street loss all sit behind Reuters, FT, WSJ or Bloomberg
    paywalls, and none could be verified against a filing or a first-party statement. Books is
    omitted because the publisher feed returned only Springer conference proceedings dated
    September, including the ten-volume CRYPTO 2026 set, which is not a book release a working
    engineer acts on. New videos is omitted because exactly one collected video carried a discussion
    link and that thread sat at 1 point with no comments, which is no external validation.
    Engineering posts is omitted because its only real candidate was the Netflix post that would not
    load. ML research is omitted as a section because its one qualifying paper was strong enough to
    lead into Top stories instead.

    Two judgement calls a reader could not infer. The Firefox and uBlock Origin story was the day's
    highest-scoring thread at about 1,450 points and is not in the digest. The PCWorld article is
    dated 2026-08-13, its substance is a Firefox Bluesky post from 2026-08-10 plus an unsourced
    characterisation of Edge's Manifest V3 timing, and no Mozilla or Microsoft primary was reachable
    to support the engineering claim. Including it would have meant publishing a popularity signal
    with no primary behind it. Separately, "Why does Opus 5 feel worse to work with?" (49296740) is
    now skipped on two consecutive days despite 869 points and 788 comments. It is real practitioner
    signal and the right home is the Hacker News section, but writing it responsibly needs the
    comment thread read and paraphrased, which this run did not do. If it recurs it should be either
    carried properly or recorded as a standing scope decision.

    The agentic coding entry needs one caveat carried forward: the source post is dated 2026-07-08
    on its own page and only surfaced on Hacker News today. It is included for the harness detail
    rather than as a dated release, and the entry attributes every performance figure to the author.
