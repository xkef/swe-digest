    titles:
    - Researchers attribute the May RubyGems package flood to an OpenAI agent swarm that the registry
      was never told about
    - GitLab patches an unauthenticated arbitrary file read scoring CVSS 10.0 in the repository commits
      API
    - >-
      Anthropic reports a Russia-linked espionage actor running an AI-orchestrated kill chain that re-tooled
      its own malware until it evaded detection
    - Traefik forwards arbitrary upgrade tokens, letting an h2c tunnel bypass the whole middleware chain
    - An Android keep-alive offload lets any app send traffic outside the VPN tunnel with Block all connections
      without VPN enabled
    - Google replaces destination URLs in search results with opaque google.com/goto redirects
    - pnpm 12.4 installs npm, Cargo and Python dependencies from one workspace and one lockfile pass
    - Seven async runtimes produce four different outputs for the same fire-and-forget program
    - Three years on, the Apple Neural Engine turns out to have no instruction set, only DMA writes into
      configuration registers
    - PlanetScale sustains 118.5 million queries per second on 512 Neki shards over 1.22 PiB
    - Conviva replaced mmap with io_uring and O_DIRECT in its Rust query engine and the first cut ran
      60 percent slower
    - Dioxus maintainer reports tens of thousands of agent-written Rust lines that never cleared the merge
      bar
    - Salesforce closes its acquisition of Fin, the former Intercom, three months after the agreement
    - Hacker News argues about its own AI content mix, and three filters ship in response
