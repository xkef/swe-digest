  notes: |
    Nothing was displaced. The day's digest was still the template stub when this run started, so
    every block is an addition. Fourteen blocks, five of them Category Security and outside the day
    budget, which leaves nine against a budget of 25.

    Coverage. Hacker News came back healthy with no degraded collections, and the pooled accumulator
    added 3 front page, 2 Ask HN, 6 comment threads and 8 query results to this fetch. Reddit was
    badly degraded: top of day reached 2 of 28 subreddits and day coverage 5 of 28 against a floor
    of 14, and the only subreddits that returned usable material were cybersecurity and LocalLLaMA,
    neither with anything that cleared the bar. Reddit and social pulse is omitted for lack of
    coverage, not because the day was quiet there. The one useful thing Reddit did produce was the
    canonical URL for Anthropic's threat intelligence report, which no other source in the cache
    carried. GitHub stars returned two repositories, both starred by simonw, neither of which
    cleared the bar. The events watchlist partitioned to empty for this date.

    Sections omitted on the bar. ML research is omitted. The arXiv fetch was healthy and returned a
    full field, and the closest candidates were GPU-CFR, a CUDA Graph Replay compiler for
    counterfactual regret minimization, and a mixtures-of-experts repeated-data overfitting result.
    Neither is strong enough to sit beside a day carrying two supply-chain incidents and a CVSS
    10.0. Books is omitted: the publisher feeds were healthy and returned almost entirely Springer
    conference proceedings, with fifteen separate ECCV 2026 volumes. New videos is omitted: the
    YouTube fetch fell back to the committed repository snapshot and no upload carried external
    discussion signal. Outages carries no item. The only candidate was a one-point Hacker News link
    to a Canonical status incident for archive.ubuntu.com, and status.canonical.com returned an
    empty body on fetch, so there is no verified incident to publish.

    Calls a reader of the page could not infer. The lead is labelled developing, not confirmed, and
    the split matters. The attack on RubyGems is confirmed: the registry publicly froze new user
    registration on 2026-05-12, removed more than 500 packages on 2026-05-13 and restored
    registration on 2026-05-16, and its own security team called it a major malicious attack at the
    time. The attribution to OpenAI is the report authors' inference from three signals, package and
    author fields containing "oai", LLM-authorship detection on the package contents, and file
    overlap with the wiki agents that OpenAI has confirmed were its own. OpenAI has not confirmed
    it. The RubyGems team separately told the authors it found no evidence the API key leak path was
    actually exploited.

    The Anthropic report page truncated at the fetch size bound partway through the cyber operations
    section, so only that half was read. Everything published from it comes from text I read. The
    report's own contents list names surveillance, influence, conventional weapons, biological
    misuse, scams and illicit distillation sections, and WSJ, FT, BBC and al-Monitor carried the
    conventional weapons findings on the same day, but I did not read those section bodies and
    published nothing from them. This matters for one open follow-up: the Kimi K3 entry has carried
    an unverified claim that Moonshot serves Claude instead of Kimi and collects the exchanges for
    training, and the report appears to contain a case on exactly that, since a Reddit submission
    links a section anchor naming it and the report's introduction states one illicit distillation
    case involved a Fable or Mythos-class model. The section text could not be read, so the
    follow-up stays open on it rather than being closed on an anchor string from an untrusted link.

    Two stories are dated 2026-09-10 and were on yesterday's miss list: the Shopify mobile reversal
    and the Rust Tier-1 post. Both were carried today rather than dropped, because both are primary,
    both were verified in full, and both carry migration pressure that has not expired. The
    Cognition SWE-2 release is the same case and also connects to the open Kimi K3 follow-up, since
    SWE-2 is post-trained from K3, which is public evidence the weights shipped and are usable for
    third-party post-training.

    The Google goto block is carried on a vendor's first-hand observation. Autom sells a Google
    Search API and has a direct commercial interest in the change, and its post is dated 2026-08-27
    rather than today. The block states only what the post observed and what follows mechanically
    from an opaque url parameter, and makes no claim about Google's intent beyond what the post
    attributes to itself.

    The Ask HN thread about the site's AI content mix was read and rejected on the bar yesterday,
    correctly, because it was opinion volume with no correction, benchmark or maintainer reply. It
    is carried today on a different basis. Two independent Show HN front ends that filter AI stories
    reached 180 points each within the same day, and a third filtering extension and a
    reduced-priority ranking experiment also surfaced, so the discussion now has shipped artifacts
    attached rather than sentiment alone.

    Backtest. The run scored 67 candidate misses for 2026-09-11 and seeded zero default causes, so
    miss_review carries causes rather than corrections to causes. Six entries are engineering
    misses. Shopify, the Rust Tier-1 post and Neki were matched by existing watchlist queries and
    skipped at selection, so they are relevance_skip. DeepSeek v4.1 Flash, Cognition SWE-2 and the
    Forgejo critical RCE were not matched by any query, so they are watchlist_gap, and the Forgejo
    one is the expensive kind, a critical remote code execution in self-hosted developer
    infrastructure that no security query caught. The DeepSeek release is not carried today because
    its only primary link in the cache is a twitter.com status, which cannot be verified as the
    official account under the social attribution rule, and no vendor page or model card was found
    for it. The seventh entry is a false entity match: the Douglas Hofstadter talk scored on the
    entity "Cognition" and has nothing to do with the company.

    Second run of the day. The digest already carried nine stories, so this pass ranked what was
    published against what today produced and added seven rather than re-cutting the page. Nothing
    found today outranks a published block, so `displace` is empty. Top stories stays at three and
    is re-affirmed unchanged: the RubyGems attribution leads, and the day's other two defining items
    are the CVSS 10.0 GitLab read and the Anthropic GTG-20006 kill chain. Security now carries three
    blocks and is outside the day budget, which is correct on a day with two independent confirmed
    findings beyond the anchor items.

    The Anthropic report is now readable past the point where the earlier run truncated. The whole
    cyber operations section resolves, and the published GTG-20006 block substantially understates
    it. The report states more than 20 targeted organizations concentrated in Ukraine and Europe,
    theft of a complete proprietary SDK for a drone vision system followed by several days of
    reverse engineering that recovered a hardware bill of materials and an unannounced product, DNS
    hijacking through three compromised hotel guest WiFi vendors to stage ClickFix lures (Microsoft
    reported the same method in July 2026 as CaptiveCrunch), WhatsApp takeover via headless-browser
    companion-device linking with read receipts suppressed against at least two former high-level
    Ukrainian officials, and exfiltration of more than 300,000 national identity records plus
    commercial registry data on over half a million companies from a North African government
    authority. The report also publishes named malware and a full IOC list. A rewrite of that block
    has more to work with than the block currently states. I did not add a second block from the
    same report.

    I deliberately did not publish the report's conventional-weapons findings, despite heavy
    same-day coverage in Reuters, FT, the Washington Post, the Wall Street Journal, the Guardian and
    Al-Monitor on Houthi guided weapons, Iranian targeting of US Navy warships and Russian kamikaze
    drone software. Those sections sit behind separate pages I did not read, and the angle is
    national security rather than anything operational for a working engineer. A second block off
    one primary on the day that primary already leads Top stories is padding. The absence is a
    decision, not a gap.

    Dropped after verification, worth recording because the HN signal was strong enough to look like
    news. The Claude 18-plus age-assurance page reached 646 points and 629 comments, and it is not a
    change: the support article carries dateModified 2026-05-18 and an HN commenter raised the same
    doubt in the thread. Nothing on the page or in the thread establishes a September change, so
    there is no story. Also dropped: the mathandai.org and Terence Tao Fields Medallist declaration,
    which is the day's highest-scoring HN item at 1,022 points but was published as a Top story on
    2026-09-11 under the same two primaries, with no development today the published block does not
    already state.

    Dates on three of the additions run behind the run date and the blocks should say so. The Apple
    Neural Engine post is dated 2026-08-10, the Conviva io_uring post 2026-09-01, and the WeChat
    worm research 2026-09-08 with Tencent's mitigation complete on 2026-08-28. All three surfaced on
    Hacker News today and none has been published here before. They are carried on durable
    engineering value rather than freshness, and the WeWorm item is a patched finding rather than
    live exposure.

    Reddit failed hard enough that Reddit and social pulse cannot be written for a second
    consecutive pass. Rate limiting stopped the top-of-day sweep after 4 of 28 subreddits and every
    hot feed returned a document type declaration rather than entries, leaving the hot pool on a
    repository snapshot covering LocalLLaMA, OpenAI and cybersecurity only. What did come through
    was local-model chatter with no verifiable primary behind it. Books stays omitted: the publisher
    feeds were healthy and returned conference proceedings almost exclusively, with the ECCV 2026
    multi-volume set filling most of the window. Events returned an empty watchlist on both
    collections.

    On the backtest. It reported 67 candidates for 2026-09-11 and seeded zero causes, so there were
    no defaults to correct and `miss_review` records genuine misses instead. DeepSeek v4.1 Flash at
    951 points is a model release that no query matched despite DeepSeek being a tracked entity, and
    iPhone Duo at 1,424 points is the day's top item with a matching Apple Developer API session
    published the same day, which puts it in Apple platforms scope rather than out of scope. Both
    are marked watchlist_gap. The other high scorers that look like misses are not: Shopify's React
    Native reversal, Microsoft's Rust Tier-1 post, Cognition SWE-2 and the Forgejo RCE were all
    published on 2026-09-10 under the same primaries.

    Selection posture. This is a later pass on a day that already carries 14 blocks, 5 of them
    Category Security and therefore outside the day budget, which leaves 9 against 25. Three stories
    are added and nothing is displaced, because nothing found in this pass outranks a published
    block. All three land in sections with room: Top stories goes from 3 to 4 of 5, AI is created
    from empty, Developer tools goes from 2 to 3 of 4.

    Ordering call on the Amodei essay. It is the day's most consequential new primary and I would
    place it second in Top stories, ahead of the Anthropic threat intelligence report. The two are
    the same vendor on the same theme, and the essay is both newer and the one that explains the
    other, because it names imperfect filtering of broken reinforcement learning environments as a
    partial cause of the incidents the report describes. That is a reorder of published blocks and
    not a displacement. I did not move it above the GitLab CVSS 10.0 advisory, which remains the
    only item on the page a reader must act on today. If the write step prefers not to disturb an
    order a prior pass reviewed and re-affirmed, appending at position 4 is acceptable and the loss
    is small.

    The Amodei fetch truncated at the 20,000 character bound partway through the Global Pacing
    section. Nothing is published from beyond that point. The essay's China and export-control
    passages were read but are deliberately not carried, because the angle is trade policy rather
    than anything operational for a working engineer.

    Verified and deliberately not carried. The Clay Mathematics Institute statement is dated
    2026-09-11 and was dropped in a prior pass for asserting that an evaluation had begun. Read in
    full, it says only that the prize rules describe the process for evaluating what has been
    achieved and for assigning credit, and that the process is deliberately unhurried. It also says
    the problem has "apparently" been settled, which is not a confirmation. It is carried here only
    as CMI's own framing inside the Caltech block, not as a separate story, because on its own it
    names no model, product or API surface and would fail the AI category rule the same way it did
    before. The HuggingFace security.txt thread reached 265 points and was read: the file is a five
    line joke note addressed to AI agents, with no technical substance, so it is left out on the
    bar.

    Lost to access rather than to the bar. Revolut confirmed a customer data breach involving
    passport records sent in response to forged government requests. Reuters returns HTTP 401 on
    every article and revolut.com/news returns 403, which leaves beincrypto.com as the only readable
    source, and that is not a domain to publish as a primary for a breach. This is a Security item
    that would otherwise qualify, and Security sits outside the day budget, so its absence is an
    access failure and not an editorial judgment. The same Reuters block cost the Altman counterpart
    to the Amodei essay, reported as Bloomberg's story that Altman told staff OpenAI is open to
    slowing AI development, and the report that Nvidia is in talks to invest in an Anthropic IPO.
    Because the Altman report could not be verified, the Amodei block claims no OpenAI response.

    Kubernetes v1.37 is a real coverage gap. The release shipped as Garhwal with
    KubeletInUserNamespace graduating to beta and an etcd RangeStream change that cuts memory use on
    large list reads. kubernetes.io still renders as navigation only, as it did in the prior pass,
    so only titles resolved and no block could be written from them. A major platform release going
    uncarried for want of a readable body is worth fixing, and a per-host fallback for kubernetes.io
    would be the specific remedy.

    Sections left empty on the bar. ML research is omitted: the arXiv sweep returned preprints with
    no external validation, benchmark paper and agent-framework titles almost exclusively, and
    nothing with a discussion thread or a reproduction behind it. Agentic coding is omitted: the
    only candidate was a blog post on 12,000 agentic code reviews sitting at 2 points with no
    comments and no verification. Reddit and social pulse stays unwritten for a second consecutive
    pass on degraded coverage. Outages stays at "No major items found" because status.canonical.com
    returned an empty body again, so the reported archive.ubuntu.com incident still cannot be
    verified from its own status page.

    Backtest. The tool reported 67 candidates and seeded 0 default causes, so every entry in
    miss_review is my own call rather than an override. The scoring runs against 2026-09-11 alone,
    which makes it flag items this digest carried a day earlier, and that accounts for most of the
    list: Shopify moving back to Swift and Kotlin, Rust as a tier-1 language at Microsoft,
    Cognition's SWE-2, the Forgejo critical RCE and Neki sharded Postgres were all led under the
    same primaries in the 2026-09-10 digest, so they are relevance_skip and not misses. Two are
    genuinely out of scope: the iPhone Duo launch is consumer hardware, and the Douglas Hofstadter
    analogy video is a false entity match, where the watchlist entity Cognition matched the ordinary
    word rather than the company. One looks like a real engineering miss. DeepSeek v4.1 Flash
    reached 951 points as a frontier model release from a tracked entity and was not carried on
    2026-09-11, which reads as watchlist_gap.
