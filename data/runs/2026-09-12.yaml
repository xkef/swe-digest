date: '2026-09-12'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Nothing was displaced. The day's digest was still the template stub when this run started, so
    every block is an addition. Fourteen blocks, five of them Category Security and outside the day
    budget, which leaves nine against a budget of 25.

    Coverage. Hacker News came back healthy with no degraded collections, and the pooled accumulator
    added 3 front page, 2 Ask HN, 6 comment threads and 8 query results to this fetch. Reddit was
    badly degraded: top of day reached 2 of 28 subreddits and day coverage 5 of 28 against a floor
    of 14, and the only subreddits that returned usable material were cybersecurity and LocalLLaMA,
    neither with anything that cleared the bar. Reddit and social pulse is omitted for lack of
    coverage, not because the day was quiet there. The one useful thing Reddit did produce was the
    canonical URL for Anthropic's threat intelligence report, which no other source in the cache
    carried. GitHub stars returned two repositories, both starred by simonw, neither of which
    cleared the bar. The events watchlist partitioned to empty for this date.

    Sections omitted on the bar. ML research is omitted. The arXiv fetch was healthy and returned a
    full field, and the closest candidates were GPU-CFR, a CUDA Graph Replay compiler for
    counterfactual regret minimization, and a mixtures-of-experts repeated-data overfitting result.
    Neither is strong enough to sit beside a day carrying two supply-chain incidents and a CVSS
    10.0. Books is omitted: the publisher feeds were healthy and returned almost entirely Springer
    conference proceedings, with fifteen separate ECCV 2026 volumes. New videos is omitted: the
    YouTube fetch fell back to the committed repository snapshot and no upload carried external
    discussion signal. Outages carries no item. The only candidate was a one-point Hacker News link
    to a Canonical status incident for archive.ubuntu.com, and status.canonical.com returned an
    empty body on fetch, so there is no verified incident to publish.

    Calls a reader of the page could not infer. The lead is labelled developing, not confirmed, and
    the split matters. The attack on RubyGems is confirmed: the registry publicly froze new user
    registration on 2026-05-12, removed more than 500 packages on 2026-05-13 and restored
    registration on 2026-05-16, and its own security team called it a major malicious attack at the
    time. The attribution to OpenAI is the report authors' inference from three signals, package and
    author fields containing "oai", LLM-authorship detection on the package contents, and file
    overlap with the wiki agents that OpenAI has confirmed were its own. OpenAI has not confirmed
    it. The RubyGems team separately told the authors it found no evidence the API key leak path was
    actually exploited.

    The Anthropic report page truncated at the fetch size bound partway through the cyber operations
    section, so only that half was read. Everything published from it comes from text I read. The
    report's own contents list names surveillance, influence, conventional weapons, biological
    misuse, scams and illicit distillation sections, and WSJ, FT, BBC and al-Monitor carried the
    conventional weapons findings on the same day, but I did not read those section bodies and
    published nothing from them. This matters for one open follow-up: the Kimi K3 entry has carried
    an unverified claim that Moonshot serves Claude instead of Kimi and collects the exchanges for
    training, and the report appears to contain a case on exactly that, since a Reddit submission
    links a section anchor naming it and the report's introduction states one illicit distillation
    case involved a Fable or Mythos-class model. The section text could not be read, so the
    follow-up stays open on it rather than being closed on an anchor string from an untrusted link.

    Two stories are dated 2026-09-10 and were on yesterday's miss list: the Shopify mobile reversal
    and the Rust Tier-1 post. Both were carried today rather than dropped, because both are primary,
    both were verified in full, and both carry migration pressure that has not expired. The
    Cognition SWE-2 release is the same case and also connects to the open Kimi K3 follow-up, since
    SWE-2 is post-trained from K3, which is public evidence the weights shipped and are usable for
    third-party post-training.

    The Google goto block is carried on a vendor's first-hand observation. Autom sells a Google
    Search API and has a direct commercial interest in the change, and its post is dated 2026-08-27
    rather than today. The block states only what the post observed and what follows mechanically
    from an opaque url parameter, and makes no claim about Google's intent beyond what the post
    attributes to itself.

    The Ask HN thread about the site's AI content mix was read and rejected on the bar yesterday,
    correctly, because it was opinion volume with no correction, benchmark or maintainer reply. It
    is carried today on a different basis. Two independent Show HN front ends that filter AI stories
    reached 180 points each within the same day, and a third filtering extension and a
    reduced-priority ranking experiment also surfaced, so the discussion now has shipped artifacts
    attached rather than sentiment alone.

    Backtest. The run scored 67 candidate misses for 2026-09-11 and seeded zero default causes, so
    miss_review carries causes rather than corrections to causes. Six entries are engineering
    misses. Shopify, the Rust Tier-1 post and Neki were matched by existing watchlist queries and
    skipped at selection, so they are relevance_skip. DeepSeek v4.1 Flash, Cognition SWE-2 and the
    Forgejo critical RCE were not matched by any query, so they are watchlist_gap, and the Forgejo
    one is the expensive kind, a critical remote code execution in self-hosted developer
    infrastructure that no security query caught. The DeepSeek release is not carried today because
    its only primary link in the cache is a twitter.com status, which cannot be verified as the
    official account under the social attribution rule, and no vendor page or model card was found
    for it. The seventh entry is a false entity match: the Douglas Hofstadter talk scored on the
    entity "Cognition" and has nothing to do with the company.
