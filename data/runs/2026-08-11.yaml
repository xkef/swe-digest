    Backtest overrides. The 2026-08-10 backtest seeded no default causes across 57 candidates, so
    these three are corrections to its scoring labels rather than to seeded causes. 49245491 (System
    Management Mode) is marked `watchlist_gap`: no query caught it, it is a genuine engineering
    miss, and it is the lead of today's digest, which confirms it should have been caught. 49239751
