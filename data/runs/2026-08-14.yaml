    titles:
    - Google ships Gemini 3.7 Flash three weeks after 3.6 at an introductory price that doubles on 2027-01-01
    - >-
      Christopher Domas releases a technique that flips one DRAM controller bit to reach PSP memory, SMRAM,
      C6 and microcode on AMD Family 16h
    - >-
      Cerebras and OpenAI preview Ultrafast mode for GPT-5.6 Sol at up to 750 output tokens per second,
      with no pricing published
    - >-
      Anthropic's policy page permits training classifiers on Claude outputs and prohibits training competing
      general-purpose models
    - LWN covers a proposed Linux process-builder API that assembles a process from an empty pidfd instead
      of forking
    - An open systemd issue reports journald doing about 50 IOPS to write two log lines per second
    - Bluesky launches Protocol Services with Jetstream v2, adding network replay and requiring an API
      token for archive reads
    - Semgrep describes enforcing SHA-pinned GitHub Actions across about 350 repositories and what the
      setting actually requires
    - Choose Boring Technology returns to the front page and the thread argues innovation tokens now belong
      to agents
