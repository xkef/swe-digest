  notes: |-
    Eleven blocks published against a cap of 25. The day is genuinely thinner than it looks from the
    Hacker News point totals, because the largest threads were either items this archive published
    on 2026-08-13 or items with no primary source behind them.

    Top stories holds three rather than five. Gemini 3.7 Flash leads on the dated price schedule
    rather than on the benchmark table, which is Google's own and was not reproduced. The DRAM work
    is second: it is the strongest piece of engineering on the page, but it is confined to AMD
    Family 16h, the last generation whose datasheets document the DRAM controller translation
    registers, and it presumes the attacker can already write MMIO, so it breaks the boundaries
    above ring 0 rather than granting ring 0. Ultrafast is third and marked developing because it is
    a limited preview for selected customers with no published price. Every performance figure in
    the Cerebras post is Cerebras' own benchmarking, including the Humanity's Last Exam run of 11
    hours 11 minutes against 78 hours 27 minutes for Claude Fable 5, and the dates given for those
    runs are July, not this week.

    Security states no major items found, and that is a consequence of ranking rather than of an
    empty day: the day's one qualifying security item is the DRAM work, and it ranked into Top
    stories. No new advisory, CVE, or supply chain incident cleared verification today. The Poland
    MyDr breach, Zoom ZSB-26017, and the SharePoint CVE were all published on 2026-08-13 and are not
    repeated.

    Dropped after review. Mistral OCR 4.1 reached 267 points, but the docs page is dated 2026-07-16
    and marked Public Preview, so there is no release today, only a submission. Solid 2.0 RC could
    not be published because both solidjs.com/blog/solid-2-0-rc-the-big-reveal and solidjs.com/blog
    returned empty text on two attempts, and no other primary was tried. The CME compute futures
    listing was dropped because cmegroup.com timed out and the item is markets news that changes no
    engineering context this week. The Google Red Team post on agentic security resolved and is well
    sourced, but it states plainly that concrete threat intelligence on what real actors are
    building is currently limited and then extrapolates, so it is forecast rather than finding. The
    Anthropic watermarking cluster still has no primary, exactly as recorded on 2026-08-13, and the
    three secondary submissions on it were left out again. The Anthropic $2T IPO and the Decart
    acquisition talks are unchanged from yesterday's reasoning and Markets and companies is omitted
    for the second day. openai.com returned HTTP 403 again, this time on the Ultrafast announcement,
    so that item rests on the Cerebras post alone.

    ML research is omitted. The papers cache carried a large batch, several with engineering
    relevance including work on security degradation in iterative LLM-driven infrastructure-as-code
    repair and on operator-level autoscaling for LLM serving, but none had an HN thread or any other
    external validation and none was verified against its abstract this run. That absence is a
    decision, not an empty source.

    Books and New videos are both omitted. The books feed is almost entirely Springer conference
    proceedings, and the one trade title, Fuzzing Android from No Starch, is a pre-order dated
    2026-07-15 rather than a release. Every one of the 18 videos collected had a null discussion
    link, which is the field the video bar ranks on.

    Two Linux and kernel items are carried and both are older than this date. The LWN
    process-builder article is from 2026-08-04 and the systemd issue was opened 2026-01-03. They are
    published on source quality, and the journald block deliberately carries only what the issue
    body states. The Hacker News title for that submission quotes per-line write figures for ext4
    and btrfs that do not appear in the issue, so those numbers are not published here.

    miss_review overrides three of yesterday's backtest candidates. The backtest seeded no default
    causes, so these are stated rather than corrected. Qwen3.8-2.4T at 681 points is a major
    open-weight release that no watchlist query matched, and the query corpus carries Llama and
    Mistral but nothing for Qwen. The DRAM work at 436 points also matched no query, and the
    security queries in the corpus are CVE, 0day, exploit and breach, none of which reaches firmware
    or hardware research. The uBlock Origin item is marked relevance_skip rather than a gap, because
    the 2026-08-13 digest records dropping it explicitly for want of a maintainer statement or
    repository commit.

    Ranking. This selection adds nine stories and removes none, so the day stands at eighteen, well
    under the cap. Two of the nine go to Top stories, filling it to five. The intended order is
    Citrix NetScaler first, GLM-5.3 second, then the three already published in the order they hold
    now: Gemini 3.7 Flash, Spaghettifying DRAM, Cerebras GPT-5.6 Sol Ultrafast. The lead changes
    because a pre-auth RCE write-up against a gateway appliance that fronts enterprise remote access
    outranks a model price change on operational urgency. No block was displaced, so the earlier
    three keep their slots below the two new items.

    Cerebras Ultrafast was the closest call for demotion. It is a limited preview for selected
    customers with no published price, which is weaker than GLM-5.3 or the Anthropic watermarking
    rollout on concrete reader impact. It survives only because Top stories had room for five and
    nothing had to be cut.

    Verification. Nine of nine new stories were read against their primary source this run. Two
    hedges carry into the copy. watchTowr states it believes but cannot confirm the vulnerability it
    analyzes is CVE-2026-8452, because Citrix does not correlate CVEs with credited researchers, so
    the CVE identifier is watchTowr's inference and the writer should not assert it. Every GLM-5.3
    number is vendor-reported on Z.ai's own documentation page with no independent reproduction, and
    the page also states the API has not shipped, which belongs in the summary.

    Absences that are findings, not quiet sections. Security carries one item rather than four
    despite three further candidates, all dropped for sourcing. The Zoom "Zoomsday" takeover claim
    has only a Tom's Hardware secondary and no vendor advisory. The Trezor breach affecting 14,000
    holders is behind the FT paywall. The theft of medical data on 19 million Poles is real but is
    not developer infrastructure. The Citrix advisory itself, CTX694938, would not render through
    fetch_url, so the affected build numbers in the story come from watchTowr quoting the bulletin
    rather than from Citrix directly.

    Markets and companies is omitted rather than empty of candidates. Anthropic reportedly planning
    a 2 trillion dollar IPO in October appeared across FT, Fortune and a Reuters report of talks to
    buy Decart, all paywalled or secondary, and none verifiable this run. The CME Group press
    release on compute futures listing 2026-10-05 is the one primary source that would have carried
    the section, and cmegroup.com timed out.

    Two further drops. The z.ai blog post at z.ai/blog/glm-5.3 returns an empty body, so the GLM-5.3
    story cites the developer documentation page instead, which is primary and carries the same
    claims. The 0.mk link-rot study, 188 points and a genuine measurement of 657,607 links with
    published method, was dropped on link hygiene: the primary URL sits on a URL-shortener domain
    and the gate may not distinguish an article path from a shortened link. Solid 2.0 RC returned an
    empty body and was not published.

    ML research and Books are omitted on the bar, not on collection. The papers fetch was healthy
    and nothing in it drew ecosystem attention. The books feed returned only Springer conference
    proceedings, with no trade title of engineering relevance.

    Reddit was the worst-degraded source, reaching 2 of 28 subreddits on top_day, and nothing in the
    pooled result cleared the bar, so Reddit and social pulse is omitted. The events watchlist
    returned empty upcoming and active partitions for this date, which is why no Category: Event
    story appears anywhere.

    Backtest. The tool scored 61 candidates for 2026-08-13 and seeded no default causes, so the four
    entries in miss_review are additive rather than overrides. Three are genuine engineering misses
    no query caught: Qwen3.8-2.4T at 681 points is a major open-weights release with no watchlist
    term for Qwen, Spaghettifying DRAM at 436 points had no query for memory-controller or hardware
    attack work and was only picked up a day late by this archive, and HTML over WebSockets at 227
    points had no frontend or WebSocket query. The fourth, the German criminal complaint over Meta
    AI glasses, matched on entity:Meta AI but is a privacy and legal story with no engineering
    content, so the entity match is a false positive and the right cause is out_of_scope. Grok 4.6
    at 596 points was visible through entity:Grok and skipped anyway, which is a real editorial miss
    but correctly categorized as seen and skipped, so it is not listed here.

    Re-ranking, not accumulation. The day already carried 12 stories with Top stories at its cap of
    5. I displaced one block and added five, so the page ends at 16, well under the day budget.

    The lead changed. The LiteLLM supply-chain credential exposure was absent from the whole archive
    and is the most consequential item of the day by operational impact: compromised versions 1.82.7
    and 1.82.8, a 40-minute window in March, roughly 434,000 CI/CD pipelines, and a named
    high-confidence list including Nvidia, AWS, Samsung, Cisco, Salesforce, Siemens, LSEG and FedEx.
    The detail that decided the ranking is the update at the foot of the Ars piece: an affected
    company reported it had rotated everything, and on re-testing almost every credential still
    authenticated. That makes this an open exposure rather than a closed incident, which is why it
    displaced the Cerebras Ultrafast preview from Top stories. Cerebras was demoted to AI rather
    than dropped, because the facts still hold. It was the weakest Top stories item on the merits:
    developing, a limited preview for selected customers, unpriced, and benchmarked by the vendor.

    Sourcing caveat on that lead. I could not link a primary. The CloudSEK and Hudson Rock research
    posts both returned 404 at the URLs I tried, and BerriAI/litellm carries no GitHub Security
    Advisory for the compromised builds, only unrelated advisories through 2026-06-30. The story is
    therefore carried on Ars Technica, a secondary that names both research firms, quotes Hudson
    Rock's CTO directly, and states the compromised version numbers. A reader should know the
    affected-version claim traces to the security firms and not to a maintainer advisory. If a
    vendor or maintainer advisory appears, this is worth a follow-up.

    Outages no longer reads as empty. The section said "No major items found." while
    status.anthropic.com recorded two incidents dated 2026-08-14: Claude Code on the Web and related
    services disrupted from 23:42 to 00:50 UTC, and status.claude.com unreachable on an invalid
    certificate from 07:58 to 10:53 UTC. Neither is large on its own and I would not have led with
    either. Together they are a documented incident with published times on infrastructure this
    routine is required to check, which is a better statement about the day than the placeholder.
    The HN threads on it were small (7 to 9 points), so the primary status page carries the claim.

    Markets and companies was empty and is not any more. The earlier run recorded that it found no
    verified item because the Anthropic IPO and acquisition reporting was paywalled or secondary and
    cmegroup.com timed out. The Cursor post is a first-party announcement on the company's own
    domain, dated 2026-08-14, and it closes the $60B SpaceX acquisition of Anysphere that this
    archive covered on 2026-06-16 and flagged for follow-up on the regulatory review and close. Note
    one discrepancy I did not resolve and did not paper over: the post describes the process as
    "started in April, when we announced our partnership with SpaceXAI," while the archive dates the
    acquisition announcement to 2026-06-16. I kept the digest to what the post states. I placed this
    in Markets and companies rather than Top stories because the new fact is the close of an
    already-covered deal, not a new deal. There is no matching record in the followups store, so the
    2026-06-16 follow-up appears to have been closed already and I could not link this to a live
    tracked entry.

    Deliberate omissions where the absence is the finding. ML research stays omitted. The one paper
    worth a look was SLAC, a CPU-to-GPU side-channel via system-level cache on Apple Silicon (arXiv
    2608.09075), and it sat at 3 points with 0 comments, which is no external validation at all.
    Publishing it would have been filling the section rather than reporting it. Apple platforms,
    Books, New videos, Developer tools, Agentic coding, Hacker News and Reddit and social pulse also
    stay omitted for the same reason. Two breach items were checked and dropped for sourcing: the
    France tax authority story (680k taxpayers) rests on a personal blog with no agency statement
    found, and the 19M Poles medical breach sat at 8 points and is a ministerial statement relayed
    by a wire, neither strong enough to publish as fact today.

    The Claude Code down threads (items 49286056, 49295148, 49290537) are folded into the Outages
    entry rather than run as a Hacker News story. They are 6 to 9 points each and add nothing the
    status page does not state with times.

    Backtest note. The tool reported 61 candidate misses for 2026-08-13 but seeded 0 default causes,
    so miss_review here is my own assignment rather than a correction of seeded values. I limited it
    to the six where the cause is unambiguous. The two scrape_gap entries, Gemini 3.7 Flash and the
    systemd-journald issue, were both outside 2026-08-13's publish fetch and both appear in today's
    digest, so the collection caught up rather than missed. Qwen3.8-2.4T at 681 points with no query
    match is the one real watchlist gap, and it is the second consecutive Qwen release this archive
    has struggled with, after the Qwen3.8-Max access failure recorded on 2026-08-03. Today's
    Qwen3.8-27B was reachable and is published, which suggests the earlier problem was host access
    rather than query coverage, but a Qwen-specific watchlist query is worth an owner-approved
    improvement issue.
