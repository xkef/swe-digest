    Security.txt" at 177 points is a joke comment addressed to AI agents inside the file, not a
    story. The Hugging Face security.txt, the Apple keychain regression on Tahoe at 48 points, Julia
    1.13 and "What Comes After Git" were all read and left out on the bar rather than on any doubt
