    protocol, seed and analysis plan were deposited with a DOI before any trial ran, behaviour was
    scored from container logs rather than from what the assistant said, and the logs and cost
    ledger are released. It is a preprint and is labelled developing. The npm change is small but
    every publisher is subject to it.

    Disclosure the blurbs do not carry: Quesma sells cost analytics for coding agents, so it has a
    commercial interest in agent spend being harder to reason about than a single savings number.
    The post is published on that basis and its method is stated in full, and JetBrains' SkillsBench
    run is cited as reaching the same conclusion independently, which is why it is carried as
    confirmed rather than discussion.

