date: '2026-09-11'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    First run of 2026-09-11. The day file held only the empty template, so nothing was displaced and
    every selection is an addition.

    Coverage. Hacker News was healthy on Algolia across front page, top of day, Ask HN, Show HN,
    comments and all watchlist queries, with the committed snapshot pooling 20 further items. Reddit
    came back degraded for the third day running: top of day reached 2 of 28 subreddits and day
    coverage 5 of 28 against a floor of 14, with a pooled snapshot adding 10 top-of-day items.
    Reddit and social pulse is therefore not written, but the netsec and cybersecurity items that
    did return carried three of today's strongest security stories, so the degraded label
    understates what the pass was worth. The GitHub stars collection again returned an empty item
    list with no snapshot fallback, and there is still no cached result for watchlist repository
    releases or github.com/trending, so none of those three surfaces can be stated as checked.
    arXiv, YouTube, publisher feeds and the events watchlist were healthy. RustConf 2026 is in its
    final day and produced no verifiable announcement in this window.

    Ranking. Today is an AI-security day and Top stories reflects that rather than balancing
    sections for their own sake. BlueMoon leads because it is the only item with confirmed
    in-the-wild exploitation against software nearly every reader runs, and because the patch-gap
    mechanism it exploits is a structural fact about Chromium downstreams rather than one bug.
    Beltdown is second on actionability: it is dated today, names the fixed version, and hits the
    readership's daily tool. The Anthropic alignment assessment is dated 2026-09-09 and the
    2026-09-10 run logged it as in scope but unpublished, because the only reachable account was on
    reuters.com, which returns HTTP 401 to this fetcher. The anthropic.com post resolves cleanly, so
    it is published now on the primary. Reuters was not retried.

    Deliberate omissions, where the absence is the finding. ML research is omitted: the arXiv pass
    returned a normal volume of papers and none carried engineering relevance strong enough to
    outrank an empty section, the closest being runtime-harness training and context-engineering
    reproducibility work with no reproduction or discussion behind either. New videos is omitted: no
    upload in the YouTube pass carries a Hacker News discussion record at all, and the strongest
    candidates by view count are a Computerphile explainer and a Pragmatic Engineer interview,
    neither of which clears the bar on engineering value alone. Books is omitted for the third day:
    the publisher feeds returned ECCV 2026 proceedings volumes and generic Apress titles only.
    Markets and companies is omitted because the day's only real deal, Bending Spoons and Miro, is
    already published in the 2026-09-10 digest under the same primary, and Google's Finnish nuclear
    electricity purchase is a power-procurement story that does not change engineering context.
    Hacker News is omitted because the day's HN-native signal is the OpenAI allow-training Tell HN
    thread, published yesterday, and nothing since matches it.

    Dropped as already published under the same primary sources: Shopify's return to native,
    DeepSeek V4.1 Flash, Microsoft's Rust Tier-1 guest post, JEP 544, the Forgejo 16.0.4 release
    notes, PlanetScale Neki, Cognition SWE-2, post-quantum DNSSEC on 1.1.1.1, the Baseten GitHub
    token, and the OpenAI mathematics training-data dispute. All of them are still on the front page
    today and none carries a development the published block does not already state.

    Pages that would not load or would not verify. blog.doyensec.com resolved but the OnePlus OEM
    session-takeover post has had its technical details pulled at the vendor's request pending one
    more remediation window, so there is nothing to publish beyond the fact of a nine-month unfixed
    report, and it is not carried. The nine-coding-harnesses writeup on nasutton.notion.site
    returned only the string "Notion", so Agentic coding carries nothing beyond the Agents API block
    in Top stories. Conviva's mmap-to-io_uring post is a genuinely detailed negative result, but it
    is dated 2026-09-01, surfaced on Hacker News at 5 points with no comments, and was left out on
    the age and external-validation bar rather than on quality.

    Sourcing note on BlueMoon. The block leads with Ars Technica rather than a primary, because the
    underlying research is Proofpoint's and no Proofpoint URL appeared in any collection this run
    and there is no search tool to find one. The Ars report quotes Proofpoint directly and names
    both CVEs, so the claims are attributed to Proofpoint in the block rather than asserted.

    Outages no longer stands down. The Cloudflare Workers Cron Triggers degradation from 2026-09-09
    19:17 UTC is still open at Identified with minor impact on one service, which is the same state
    the 2026-09-10 run recorded, so it is not carried again. The Let's Encrypt domain control
    validation failure is new, bounded, resolved, and has a named cause on the status page.

    Backtest. The tool scored 61 candidate misses for 2026-09-10 and seeded no default causes, so
    miss_review records only the two exceptions worth a reviewer's attention rather than
    re-labelling the whole list. Item 49650326, the OpenAI Navier-Stokes Lean 4 observation, was
    posted after the publish fetch window and is carried in today's AI section, which makes it a
    scrape_gap rather than an editorial decision. Item 49630026, the Qwen 3.8 reasoning-prefill
    release at 220 points, matched no watchlist query despite being a frontier model release, which
    is a watchlist_gap. Several high-scoring candidates that look like misses are not: iPhone Duo,
    Desert Ant Labs, the Tailwind acquisition and the Read the Docs DDoS postmortem were all
    published on 2026-09-09, and DeepSeek V4.1 Flash led Top stories on 2026-09-10.

    Second pass of 2026-09-11. The day file already carried 12 stories from the 06:43 UTC run.
    Nothing found in this pass outranks any of them, so no block was displaced and the four Top
    stories stand in the order the earlier pass left them. The selection adds four items and takes
    the day to 16, against a budget of 25.

    Coverage. The caches were refetched at 13:52 to 13:58 UTC, so this pass ranked fresh collections
    rather than re-reading the morning's. Hacker News was healthy on Algolia across all six
    collections, with the committed snapshot pooling 157 further items, which is where most of this
    pass's additions came from. Reddit came back degraded for the fourth day: top of day reached 2
    of 28 subreddits and day coverage 6 of 28 against a floor of 14. The GitHub stars collection
    returned one item this time rather than none, a 29-star Python tracing library starred by a
    tracked account, which is below any reasonable bar and is not published. There is still no
    cached result for watchlist repository releases or for github.com/trending, so neither can be
    stated as checked. arXiv, YouTube, publisher feeds and the events watchlist were healthy.
    RustConf 2026 closed today and produced no verifiable announcement in this window either.

    Ranking. The four additions are one theme: what agents actually do when nobody checks.
    Ronacher's post is four days old but surfaced today at 390 points and 282 comments and is the
    strongest practitioner write-up of the day, with published artifacts rather than assertions.
    Quesma's RTK benchmark is dated today, names every version, covers 1,740 attempts and roughly
    $1,500 of tokens, and its central finding is a measurement error in the tool's own savings
    counter rather than an opinion about the tool. The arXiv audit is the only paper in the pass
    with engineering relevance strong enough to open ML research, and it earns it on method: the
    protocol, seed and analysis plan were deposited with a DOI before any trial ran, behaviour was
    scored from container logs rather than from what the assistant said, and the logs and cost
    ledger are released. It is a preprint and is labelled developing. The npm change is small but
    every publisher is subject to it.

    Disclosure the blurbs do not carry: Quesma sells cost analytics for coding agents, so it has a
    commercial interest in agent spend being harder to reason about than a single savings number.
    The post is published on that basis and its method is stated in full, and JetBrains' SkillsBench
    run is cited as reaching the same conclusion independently, which is why it is carried as
    confirmed rather than discussion.

    Rejected candidates where the reason will not be visible on the page. Hacker News item 49656225,
    "Claude is no longer available for minors", reached 209 points and 281 comments, but the support
    article it links carries a dateModified of 2026-05-18 and a visible "May 18, 2026" dateline, and
    the page describes an 18-plus policy with Yoti verification that has been in place since then.
    Nothing in the page supports a change dated today, so it is not published as news. Item
    49656698, "Moonshot serves Claude instead of Kimi and collects exchanges for model training", is
    a rewritten headline: the linked X post is tweet 3 of David Agranovich's commentary thread on
    the Anthropic threat report already published in today's Security section, and the line is an
    aside, not a finding. That thread does carry substantive detail the published Anthropic block
    does not, including stolen API keys as a primary objective and safeguards defeated by
    re-prompting and by splitting a task across sessions, but its only source is a personal X thread
    and the underlying report is already the day's primary, so it is not carried separately.

    Also considered and left out. The Rust Foundation's Rust/C++ interop progress update resolved
    cleanly and has real content, a tool support matrix across Crubit, cxx and Zngur and a
    function-overloading experiment usable on nightly, but it is dated 2026-09-04, drew 2 points,
    and does not outrank an omitted Languages and runtimes section. The MITRE top-25 item on
    r/cybersecurity links a securityweek article whose own slug says 2025, so it is a repost. The
    AdaptHealth 4.1 million breach is real but is the weaker of two breach stories and the IDScan
    item already covers the class at 150 million. New videos is omitted for the second pass: exactly
    one upload in the YouTube collection carries a Hacker News discussion record and that thread has
    2 points and no comments. Books and Markets and companies are unchanged from the earlier pass
    and still omitted.

    Pages that would not load. openai.com/index/introducing-gpt-live-1-in-the-api/ returns HTTP 403
    to this fetcher, so the GPT-Live-1 API release could not be verified against a primary and is
    not carried. developers.openai.com resolves normally, so the block is on the marketing host
    rather than the domain.

    Backtest. The tool re-scored 2026-09-10 and seeded no default causes on any of the 61
    candidates, and the earlier pass today already filed the two corrections worth a reviewer's
    attention, 49650326 as scrape_gap and 49630026 as watchlist_gap. There is nothing left to
    override, so miss_review is empty rather than a restatement.

    Third pass of 2026-09-11. The day stood at 15 published stories. Four are added, nothing is
    displaced, and the day closes at 19 blocks, of which 4 are Security and therefore outside the
    day budget. Nothing found today outranked a published block, so no slot was contested.

    Coverage. Hacker News, arXiv, YouTube, publisher feeds and the events watchlist were healthy.
    Reddit came back degraded for the fourth day running, at 2 of 28 subreddits for top of day and 7
    of 28 for the day against a floor of 14, with a pooled snapshot adding 30 top-of-day items. The
    netsec items that did return carried today's one new security story, so the degraded label again
    understates the pass. The GitHub stars collection ran clean this time and returned two items,
    simonw starring tractordev/wanix and GrahamDumpleton/wrapture, neither of which clears the bar.
    There is still no cached result for watchlist repository releases or github.com/trending, so
    neither can be stated as checked.

    Correction the write step must make. The published Security block titled "IDScan confirms a
    breach covering more than 150 million driver's license records" states the count as fact and the
    source does not support it. Zack Whittaker's article says IDScan confirmed that driver's
    licenses were stolen from its cloud, including full names, licence numbers and identity numbers
    from other government documents such as passports, and says explicitly that IDScan has not said
    how many individuals are affected. The 150 million figure has two separate origins: Brian Krebs
    reported a dark-web search site covering over 150 million US and Canadian licence records and
    verified his own record in it, and IDScan's own website states it holds over 150 million licence
    records. The block in this selection carries the corrected title and the summary should state
    the confirmed theft, the unstated victim count, the Krebs origin of the figure, and that the
    Pentagon and the FBI are aware and investigating. This replaces the published block of the old
    title and is a correction, not a displacement.

    Ranking. The Fields Medallists declaration enters Top stories fourth. It is verified against two
    primary sources that carry identical text, Tao's own blog and mathandai.org, and it is signed by
    25 named Fields Medallists with their medal years. It sits below the two exploitation stories
    and Beltdown because it changes nothing an engineer does on Monday, and above the Agents API
    because it is the first collective position the mathematical community has taken against the
    labs whose proof claims this digest has carried since July, and because it names attribution and
    plagiarism rather than capability as the harm. It also reframes the AI-section block on John D.
    Cook's reading of the same Navier-Stokes release, which is why both now stand on the page. The
    declaration invites further endorsements through ORCID or academic email, so the signatory count
    will move.

    Deliberate omissions where the absence is the finding. "Ask HN: Can we please limit the AI news
    flood?" was the day's second-highest thread at 694 points and 339 comments, and the Hacker News
    section is still omitted. The thread's comment corpus is opinion volume about the site's content
    mix, with no correction, benchmark, maintainer reply or failure report in it, and the source
    guidance prefers substantiated dissent over volume. Two Show HN entries building AI-filtered
    Hacker News readers and one submission on reduced-priority ranking sit behind it and are the
    same signal. "Claude is only available to people over 18 years" reached 397 points and 462
    comments, and the support article's own dateModified is 2026-05-18, so the thread surfaces an
    existing policy page rather than a change, and it is not published as news. "HuggingFace:
    Security.txt" at 177 points is a joke comment addressed to AI agents inside the file, not a
    story. The Hugging Face security.txt, the Apple keychain regression on Tahoe at 48 points, Julia
    1.13 and "What Comes After Git" were all read and left out on the bar rather than on any doubt
    about the source.

    Unverifiable and not carried. "Moonshot serves Claude instead of Kimi and collects exchanges for
    model training" at 49 points bears directly on the open Kimi K3 distillation follow-up, but its
    only source is a twitter.com status URL, the account identity cannot be verified from that URL
    under the social-attribution rule, and the cache holds no comment corpus for the thread. It is
    left out and the follow-up stays open on it.

    Backtest. The 2026-09-10 scoring returned 61 candidates with no default causes seeded. Three are
    recorded as watchlist_gap because no query matched them and all three are in scope: iPhone Duo
    at 1403 points and iPhone 18 Pro at 368, which together are Apple's first foldable and its
    flagship refresh, and the Read the Docs DDoS writeup at 170, which is a developer-infrastructure
    incident. The 2026-09-10 digest carries no Apple platforms section at all, so the event went
    uncovered. It is not back-filled here, because a two-day-old hardware announcement is archive by
    now, and the gap is recorded in miss_review instead. AirPods 5 and Apple Watch Series 12 are
    left unscored as consumer hardware with no developer surface.
