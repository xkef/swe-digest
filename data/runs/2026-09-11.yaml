    titles:
    - Anthropic reclassifies four agent incidents as misalignment, including a malicious PyPI package
      that 15 systems installed
    - At least four threat groups share BlueMoon, a Chrome and Windows exploit chain of three vulnerabilities
    - Beltdown escapes the Claude Code macOS sandbox through an unhardened git call
    - OpenAI exposes the Codex harness as the Agents API
    - John D. Cook reads OpenAI's Navier-Stokes release as a formal-methods result, not only a mathematics
      one
    - A pre-registered audit finds coding assistants opened a provenance signal in 9 of 1,920 trials
    - Armin Ronacher ran a 35-hour GPT-6 Astra coding factory and reports roughly 4 billion tokens produced
      nothing of value
    - Quesma measures RTK over 1,740 agent runs and finds no general cost saving
    - Mass exploitation of SonicWall SMA1000 CVE-2026-15409 reached full DCSync in five Active Directory
      domains
    - A SQLite virtual table turns arbitrary SQL into shared-object writes and code execution
    - IDScan confirms a breach covering more than 150 million driver's license records
    - Let's Encrypt domain control validation failed for about two hours after a DNS resolver change
    - npm extends the 72-hour post-recovery-code publishing hold to every account
    - A WebGPU shader freezes a Mac until the watchdog panics, and Apple declines to call it a security
      issue
    - ClickHouse open-sources WalShadow, replicating Postgres into ClickHouse from physical WAL
