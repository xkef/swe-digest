    Calls a reader of the page cannot infer. The day has a real theme and the lead cluster reflects
    it rather than imposing it: OpenAI's own agents performing unauthorised access at scale, Apple
    citing AI agents by name as the reason to tighten Full Disk Access, Claude Code shipping an
    explicitly unsandboxed extension point, and the Kernel Recipes thread deflating
    machine-generated vulnerability counts. I ranked the OpenAI review above the Apple change
    because the harm is confirmed and already producing regulation, where Apple published intent
    with no API, mechanism, or date. The Greg Kroah-Hartman item is in Hacker News rather than New
    videos deliberately: the video guidance requires attributing to the channel's own watch URL, and
    since the page yields nothing readable, the verifiable artefact is the thread, so the 79-report
    breakdown is labelled as paraphrased from commenters rather than stated as the speaker's
    numbers. The Gemini free-tier item is published as rumor on a Reddit permalink with no primary
    found, which is the honest status and also the useful one; per the access notes, Reddit
    permalinks 403 to re-fetch and were not retried. Red Hat's guardrail benchmark is placed in AI
    rather than ML research because it is a vendor engineering post, not a paper, and it is included
    mainly because it publishes method, prompts, hardware, and latency against a vendor claim. ML
    research carries only two of the day's large arXiv dump: the collection has no discussion signal
    attached, so external validation came from the HN thread for ProVer and from direct engineering
    relevance for AutoCompact, and the rest was left out rather than ranked on recency. Two strong
    agentic-coding practitioner posts were available and I took the one with numbers, dropping The
    Four Horsemen of Agentic Coding (109 points) unverified rather than padding the section. For the
    Azure write-up I published the canonical www.binarysecurity.no URL after confirming it resolves,
    not the binsec.no short host that Hacker News links.

    Third run of 2026-10-03. The digest already carried 17 blocks from the 07:10 and 15:08 runs, so
    this run re-ranked the whole day rather than starting a page. Top stories is unchanged and
    re-affirmed in order. The five entries listed there are the published blocks, not new
    selections. Four blocks are added and one is displaced.

    What changed, and why. Two of today's four additions exist only because collection re-ran at
    18:50 and picked up items the 14:26 fetch could not see. Google published the primary notice
    behind the Gemini free-tier story the 15:08 run had to publish as rumor with no primary found,
    so that block moves from Reddit and social pulse to AI and from rumor to confirmed, and the
    rumor block is displaced as the same subject rather than beaten on rank. Note the narrowing: the
    support page confirms that model availability changes for personal accounts and that the change
    lands 2026-10-09 for accounts without a subscription, but the per-plan model matrix is an HTML
    table whose cells did not render to fetch, so the specific Reddit claim that free Flash and Pro
    access ends is still not verified and the new block does not assert it. That is a smaller claim
    than the rumor block made, which is the correct direction.

    The HFS advisory is the run's most careful call, because the secondary source and the primary
    disagree on the timeline. The Register frames CVE-2026-61500 as a new flaw Horizon3 uncovered on
    2026-09-30, but GHSA-xxrm-3f86-v97j and NVD both record publication on 2026-07-13, and the fix
    reference is the v3.2.1 release tag, which is well behind the current 3.3.4 of 2026-09-30. I
    built the entry on the GHSA for versions, mechanism, severity, and fix, and used The Register
    only for what it quotes from VulnCheck's Patrick Garrity: exploitation beginning Thursday night
    from one China-hosted IP against hosts in the US and Japan, four hits on the Friday from two US
    IPs in one subnet that appear to be a proxy, 286 CVEs attributed to Mythos and Project Glasswing
    on his tracker, and this being the second of those known to be exploited. The
    write-up-then-exploitation sequence, not anything AI-specific, is what put a months-old patched
    bug under attack. I did not reach Horizon3's own post: the guessed article URL 404s and the
    disclosure is cited from the dated entry on the Attack Research index, which is the only
    Horizon3 page I could read.

    This also resolves an attribution the 15:08 run deliberately left open. That run dropped the
    vendor name from the Mythos tool in the Kernel Recipes thread because the HN comments did not
    support naming a company. The Register and the Horizon3 index now independently establish Mythos
    as Anthropic's bug-hunting model under Project Glasswing, which is enough to name it in the new
    Security entry. I did not retrofit that name onto the Hacker News block, because tying the 79
    machine-generated kernel reports to Anthropic's Mythos would be an inference across two
    unrelated sources, and the kernel figures are still only a commenter paraphrase.

    What I chose not to publish, where the absence is the finding. Agentic coding stays omitted. The
    section had four plausible candidates and none survived: a context-compaction proxy and two
    Claude Code utilities at one to two points each, and an Opus 5.5 guidance post on claude.dev,
    which I dropped on link hygiene rather than merit, since Anthropic's published domains in this
    digest are anthropic.com and claude.com and claude.dev is a different registrable domain that I
    could not tie to them. A 140-silent-changes diff across 66 official MCP server release pairs is
    a genuine supply-chain angle at four points on a self-published repository, which is below the
    bar. New videos stays omitted on different grounds than earlier today: YouTube came back healthy
    with a populated watchlist feed, and exactly one upload carries a discussion object, at four
    points and zero comments, on semiconductor photomasks. So the section is empty because no upload
    was discussed, not because the backend failed. ML research stays at one block. The papers cache
    refetched but it is still the arXiv firehose with no discussion signal attached, and two prior
    runs worked it, so adding from it now would be ranking on recency. Books is still Springer
    conference proceedings only. Outages still states no major items found: an HN post claiming
    Stack Overflow was down drew two points, stackstatus.net returns 403 here, and I hold no
    status-page fetcher, so that remains an absence of signal rather than an all-clear.

    The KVM report is the run's largest unverified security claim and the reason it is developing
    rather than rumor. Guillermo Rauch states Vercel confirmed a KVM 0day through its Sandbox bounty
    program, and Paulos Yibelo describes it as a full guest-to-host-root VM escape. Both are the
    researchers' and the CEO's own accounts, and the X page identifies rauchg as Vercel's CEO, so
    attribution is sound even though the sources are social. What is missing is everything
    operational: no CVE, no affected versions, no patch, no mitigation, and a write-up stated as
    coming. I ranked it into Security rather than Top stories for exactly that reason, since a
    reader can take no action on it today. It is also the live watch signal on follow-up f-0036,
    which asks about VM-based agent sandboxes, and it should be checked for the promised write-up.

    Ranking calls a reader cannot infer. Neither Security addition was promoted to Top stories, and
    that was a close call on the HFS advisory. Active exploitation outranks CVSS in the guidance,
    but HFS is a 3.9k-star hobbyist and small-business file server whose fix has shipped for months,
    so it is niche exposure next to FortiMail across four enterprise mail branches with a federal
    deadline on 2026-10-04. Security sits outside both the per-section cap and the day budget, so
    both additions cost the rest of the page nothing. FTL is included at 94 points as the day's most
    substantive new systems project and ranked last of the four: the Linux-ABI claim is evidenced by
    the site serving itself from FTL, but the isolation and performance claims are the project's own
    with no benchmarks, and v0.1.0 predates its own filesystem milestone. Linux on M4 Macs held the
    fifth Top stories slot against it on that basis. With the Gemini block moving sections, Reddit
    and social pulse is now empty and should be omitted, which is the honest result of a day where
    Reddit reached 9 of 28 subreddits.

    Backtest. 58 candidates for 2026-10-02 and zero causes seeded, and the two prior runs already
    corrected causes there, so I added only the two the 15:08 run explicitly considered and declined
    for want of verification. Both are watchlist_gap and both are confirmed gaps rather than
    judgment calls: config/watchlist.toml carries iOS, macOS, Apple Silicon, SwiftUI, and Xcode but
    no iPhone query, which is why the iPhone automatic-reboot bypass at 261 points scored
    no_query_match despite being squarely Security and Apple platforms, and it carries no ChromeOS
    or Chromebook query, which is why the Chromebook update-support reduction at 348 points was
    missed. The Register's own coverage of the ChromeOS support cut, visible in its top-stories rail
    today, is the corroboration the earlier run lacked. I left Zig 0.17.0 alone, since
    not_in_publish_fetch is the correct cause for an item that reached HN after the publish fetch
    closed and it leads Languages in today's page. I did not enumerate the out-of-scope tail, which
    remains most of the list.
