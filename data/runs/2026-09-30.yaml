    titles:
    - Branch Target Reuse leaks kernel memory through stale JIT branch targets on Intel, AMD, and Arm
    - Cloudflare applies to four root programs and signs an agreement to acquire a GlobalSign root
    - LASST sues OpenAI under California's Unfair Competition Law over its agents breaching Hugging Face
    - OpenAI's Ultrafast tier prices GPT-6 Astra at six times the standard rate with no EU data residency
    - ChatGPT's MCP Events let an MCP server push webhook-delivered updates into a subscribed chat
    - livenerf starts a pre-registered 30-day series to test whether Claude Opus 5.5 degrades after launch
    - XBOW turns a 16-byte zero write in the Linux SMC-D loopback driver into root
    - Basecamp 5 and HEY went down when misconfigured load balancers failed a planned power maintenance
    - JDK 27 enables Compact Object Headers by default and makes G1 the garbage collector everywhere
    - Armin Ronacher publishes Deser, a Serde alternative that moves Rust deserialization state off the
      call stack
    - Andres Freund's Kernel Recipes talk lists the kernel behaviours that cost PostgreSQL performance
    - Backblaze reports a 1.73 percent quarterly drive failure rate across 354,415 drives
    - Basecamp publishes a Rust port of Campfire proved pixel-identical to the Rails app at completion
      and 20 to 95 times faster
    - Mathematicians publish recommendations for releasing AI-generated proofs, drawn from over 600 survey
      replies
