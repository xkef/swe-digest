    Top stories was left at four by decision, not by omission. The four already published are all
    live conditions: interchangeable encrypted reasoning blocks, a P-critical Rust 1.98
    miscompilation, a merged Xe VRAM fix and reproducible token flips between vLLM attention
    backends. The strongest new candidate was the Truffle Security AWS key exposure, and it was
    placed in Security instead for two reasons. Its research dates from 2026-08-19 and its
    BleepingComputer writeup from 2026-08-21, so it is not today's news, and its primary post would
    not resolve. Security is uncapped, so nothing was lost by that placement.

    The sourcing gap on that block is worth recording. The Truffle Security blog index at
    trufflesecurity.com/blog lists the post as "768 Leaked Corporate AWS Keys Held Full Admin
    Rights", dated 2026-08-19, and two slug guesses at the post URL both returned 404. What was
    actually read in full is the BleepingComputer article, which is why it is the primary link, and
    it is also the only source carrying the Amazon spokesperson statement about quarantine policies.
    Every figure in the block comes from that article: more than 9,300 keys still valid out of a
    10,616-key re-verifiable subset at 88 percent authenticating as of August 10, 526 root keys and
    242 AdministratorAccess IAM users summing to the 768, 431,875 secrets and 64,024 unique keys
    across 50,654 accounts, Hugging Face at 8,482 exposures as the largest single source, and 262 of
    2,754 readable accounts with a budget alert.

