    titles:
    - Encrypted reasoning traces are interchangeable across sessions, users, and models at Anthropic,
      OpenAI, and Google
    - Zimbra command injection added to the CISA exploited catalog with a 2026-08-24 due date
    - Rust 1.98 miscompiles a boxed async trait object into a null vtable slot
    - Kernel fix stops the Intel Xe driver from handing compression storage out as usable VRAM
    - Changing only the vLLM attention backend flips tokens and breaks tool calls on identical weights
    - A week of using Codex more than Claude
    - Prime Intellect publishes 153 autonomous agent runs across 18 models on the nanoGPT speedrun
    - Microsoft publishes a CVSS 10.0 Entra ID deserialization flaw as already mitigated
    - TrueConf Server flaws added to the CISA exploited catalog, one with a 2026-08-23 due date
    - More than 9,300 exposed AWS keys still authenticate, 768 of them with full control of a company
      account
    - Java's String.indexOf is quadratic, and a 4096-character adversarial needle costs 1.1 seconds on
      a 1 MB string
    - hdiutil is deprecated in the macOS 27 beta in favour of diskutil image
    - Linux 7.3 replaces Steve French as CIFS maintainer
    - An LSFMM+BPF session proposes proving scheduler and XDP invariants with Verus
    - ATProto Spaces alpha adds non-public data to the protocol
    - A copy-and-patch JIT in Rust compiles in about 5 microseconds
    - Reports of reduced Claude Code effort levels draw a large thread without a primary source
