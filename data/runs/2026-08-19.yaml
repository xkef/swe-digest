      GitHub publishes the root cause for its 7 hour 47 minute outage: an Istio sidecar scaling gap, HAProxy
      flow exhaustion, and a VS Code retry storm
    - Modular open sources the Mojo compiler and toolchain under Apache 2.0 with LLVM exceptions
    - Cerebras announces the CS-4 with three WSE-3 Turbo wafers per system and first shipments this quarter
    - Linear reports coding-agent teams roughly tripled weekly pull requests over two years
    - Anthropic extends the 50 percent Claude Code weekly limit increase through 2026-08-31
    - Vercel Labs publishes fx, a Zig coding agent that embeds through WebAssembly and ACP
    - Agent2Agent joins the Agentic AI Foundation alongside MCP under Linux Foundation governance
    - Microsoft patches CoSnitch, a one-click Copilot exfiltration chain that Copilot itself disclosed
    - Anthropic reports 2 hours 12 minutes of degraded performance across Claude models
    - OpenLogi publishes a local-first Rust configurator that drives Logitech devices over HID++
    - turbovec publishes a Rust TurboQuant vector index with reproducible benchmarks against FAISS
    - A failed Framework BIOS update leaves no recovery path short of external SPI flashing
    - Bun 1.4 remains unreleased three months after the last stable tag, with 4.9 thousand open pull requests
