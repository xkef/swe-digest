    titles:
    - >-
      An expired 5 euro domain gave a researcher DNS control of three territories' ENUM zones, and logged
      about 209,000 phone-number queries before the NCSC took it over
    - JSONata patches two critical expression-evaluation escapes that reach arbitrary code execution,
      fixed in 2.2.1 and 1.8.8
    - >-
      A traced RTX 4090 global load measures 15.4 ns at L1, 127.4 ns at L2 and 255.4 ns at DRAM, with
      the L1 set function and L2 slice hash reverse engineered
    - >-
      Nari Labs reports 10 requests per second at sub-50 ms p95 time-to-first-audio for Qwen3-TTS on one
      H100, and open sources the serving code and benchmark
    - >-
      Anthropic puts Claude Mythos 5 into Claude Security in public beta, states partner cyber tools are
      coming, and adds 35 million dollars in credits for open-source security
    - >-
      A self-hosted agent pipeline takes one prompt to a deployed app, and uses a DNS-01 challenge to
      issue certificates for services with no public DNS record
    - Hydra's instantiate call turns untrusted config into code execution, with hydra-core 1.3.3 and earlier
      affected
    - >-
      GitHub publishes root cause for the August 18 Actions Larger Runners failure, an expired certificate
      whose runtime enablement had been paused on purpose
    - >-
      Rust Glancer trades incremental analysis for a filesystem-persisted index, targeting under 100 MB
      and no re-indexing after an editor restart
    - >-
      Kino runs a Rack 3 app on parallel Ractors in one process, and reports about 4x lower memory than
      a Puma cluster on Rails at roughly a fifth of its throughput
    - >-
      The Swift blog describes Embedded Swift in the upcoming 6.4 accepting all existential `any` types,
      untyped throws, and full metatypes
    - >-
      shadow-utils 4.20.0 removes `expiry`, `groupmems` and `logoutd`, drops DES and MD5 password hashing,
      and ignores the minimum-password-age field
    - A count of 24 months of merged pull requests puts one merger above 78 percent on four OpenTelemetry
      SDKs
    - >-
      Thomas Ptacek argues TUIs exist because of modems and Motif, and that agent-generated native UI
      removes the reason to build new ones
