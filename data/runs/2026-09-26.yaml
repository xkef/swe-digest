    titles:
    - Researchers reconstruct 80,000 attack payloads from the OpenAI agent intrusion at Hugging Face
    - Microsoft rebuilds Copilot around Home, Code and Autopilot and splits billing between subscription
      and usage
    - Fable 5.1 in Claude Science computed a nine-loop N=4 super-Yang-Mills amplitude that Lance Dixon
      validated
    - A reverse engineer reports Meta's Muse agent runtime ships OpenAI, Anthropic and Kimi model clients
    - A founder's postmortem argues plan mode is the wrong abstraction now that agents interleave planning
      and building
    - A double fetch in Avast's kernel driver reached SYSTEM on Windows 11 through IORing buffer corruption
    - OpenAI Codex had a full outage for about an hour across web, API, CLI and the VS Code extension
    - Thomas Ptacek leaves Fly.io and argues the operating system's isolation model no longer fits single-user
      software
