  notes: |
    Six stories for 2026-07-28, and the short day is the finding rather than a collection failure.
    The 24-hour Hacker News window overlaps the 2026-07-27 digest almost completely, and that digest
    already carried the three biggest items in it: the Kimi K3 weight release (1,322 points today),
    the Bun Rust-rewrite status post (459 points), and the cluster of three Claude Opus 5 error
    incidents. Each story appears once, so all three were excluded here. What remains above the bar
    after that subtraction is six items, not twenty.

    Today's digest was an untouched template when this run started, so nothing was displaced.

    Top stories is three, not five. The two candidates I considered and demoted were the NVIDIA Open
    Secure AI Alliance and MAI-Cyber-1-Flash, both real but neither day-defining for a working
    engineer. The Eicher fleet takeover went to Security rather than Top stories because its impact
    is domain-specific.

    Outages is stated empty deliberately. The only outages in today's collection were three Claude
    Opus 5 incidents already published on 2026-07-27 (verified against
    status.claude.com/history.atom: 08:16 to 09:03, 11:27 to 11:47, and 13:39 to 14:34 UTC, the last
    also affecting Haiku 4.5, all resolved with no root cause published), plus T-Mobile and Xbox
    consumer incidents that sit outside the status-page checklist. Nothing new.

    Calls a reader could not infer from the page. The Kimi K3 licence is a custom "Kimi K3" licence,
    not the modified MIT that K2 used, and the Hugging Face repository ships 96 safetensors shards
    at roughly 1.56 TB of storage. Vendor benchmark numbers in the model card are self-reported and
    were not restated as fact: K3 leads on SWE-Marathon (42.0) and MCPMark-Verified (94.5) while
    trailing Claude Fable 5 on DeepSWE, FrontierSWE, and HLE-Full. The Anthropic post names three
    measures Amodei supports, of which the fetch resolved two (no powerful chips or chipmaking
    equipment to China, and a crackdown on industrial-scale distillation) before the size bound cut
    the page.

    Sources that would not load or would not yield a body. support.apple.com/en-us/100100 returned
    page chrome only, so the reported counts of 75 iPhone and 155 Mac security fixes in iOS 26.6
    could not be checked against Apple's own release table, and the item was dropped rather than
    published on the 9to5mac secondary alone.
    microsoft.ai/news/introducing-mai-cyber-1-flash-inside-mdash returned metadata only (published
    2026-07-27T16:30Z), so that story is carried on the title and publication fact and the write
    step will need to re-read the body for substance. The Antithesis post "Finding bugs in Raft
    implementations" resolved only to its title and subtitle ("Why formal verification is not enough
    to maintain consensus in real systems"), which is not enough to write a block with a concrete
    finding, so it was dropped. The same applies to The Register report that a Microsoft Defender
    for Endpoint update left some Linux hosts unprotected, which would have been a strong
    operational security item had the primary resolved.

    Dropped for lack of a verified primary rather than for lack of interest: the Google
    DMCA-scraping ruling (287 points, secondary commentary only, no docket), the markets cluster
    (CXMT's 466 to 472 percent Shanghai debut after a 9.8B dollar IPO, NVIDIA's reported 250B dollar
    OpenAI financing guarantee, the AMD and Anthropic deal already tracked in followups, Lattice
    completing the AMI acquisition), and the report that MCP's release candidate removes machinery
    many servers were built around, which had one Hacker News point and a secondary source only.

    Reddit is degraded and should be labelled as such in Sources checked. The scheduled fetch got 8
    of 28 subreddits against a floor of 14, and a re-run from this step hit HTTP 429 on every
    top_day and hot request, so coverage did not improve. The GitHub stars watchlist returned zero
    events for every tracked account, which the fetcher does not flag as degraded but which is
    effectively no coverage for that source today. Neither gap changed the selection: nothing in the
    67 Reddit items collected cleared the bar.

    Backtest. The tool scored 54 candidates for 2026-07-27 and seeded no causes, so miss_review
    carries only the one clear exception. Ruff v0.16.0 (item 49056112, 336 points, raising default
    rules from 59 to 413) is a genuine engineering miss with no watchlist query behind it, and the
    release is real (astral-sh/ruff tag 0.16.0, published 2026-07-23). No query in the hacker_news
    list covers Ruff or Python linting by name. It was not published today because it is five days
    old and the migration news has passed, but the watchlist gap is worth recording. The high-point
    candidates I did not flag are correctly out of scope (rare books, solar panels, El Nino, Mario
    64 as a library, a 2023 htmx repost) or were seen and matched and correctly skipped on
    relevance.

    Second selection pass for 2026-07-28. The collection did not move between runs:
    .cache/hn/2026-07-28.json still carries fetched_at 11:47:34Z with an empty degraded list, so
    this run worked the same 24-hour window as the first one. It re-fetched nothing on that basis.
    The value it adds is verification of items the first run dropped for unresolved primaries, and
    four sections the first run left empty.

    Four additions, no displacement. The day stood at four stories against a budget of 25 and no
    section was near its cap, so nothing had to lose a slot, and nothing found today outranked what
    was already published. Top stories stays at three in the same order. The lead is unchanged
    because the Claude share-link indexing item is the only story today with a live and unbounded
    operational exposure, while the Kimi K3 report and the Anthropic position post are both
    documents about a state of affairs already published. I restated the three Top stories verbatim
    so the ranking is explicit for the whole day. Nothing about them changed. The Eicher fleet
    takeover in Security is unchanged and is not restated.

    SlopCodeBench was the one candidate I considered for Top stories and demoted to Agentic coding.
    It is the first long-horizon measurement of Opus 5 I could verify against a primary, and it drew
    315 points, but the evidence base is one practitioner running 3 of the benchmark's problems for
    17 checkpoints in a single six-hour session, and the author hedges the result himself. The
    headline numbers are Opus 5 at 4 of 17 strict passes against 1 of 17 each for Opus 4.8 and
    Sonnet 5, next to the source paper's 17 percent for Opus 4.6 and 11 percent for GPT-5.4. Opus 5
    wrote 29,065 source lines against roughly 9,000 for the other two, 51 percent of it tests. The
    write step should carry the subset size and the single-run caveat in the block, not only in a
    follow-up line. The author cites the benchmark as arXiv 2603.24755. I did not resolve that
    identifier, so it should be named in prose without a link unless the write step verifies it.

    ML research carries one paper, not two. LOCKS and APPA (arXiv 2607.24625, an information-flow
    framework for agent tool chains reporting exfiltration attack success falling from 31 to 50
    percent down to 0 to 7 percent) were the two strongest of 128 papers in the cache. Both are
    day-old single-version preprints with no discussion signal and no independent reproduction, and
    publishing both would have filled the section rather than reported a finding. LOCKS wins because
    its claim ships as a plugin for unmodified vLLM, so a reader can test it. APPA is the recorded
    runner-up. Every LOCKS number is the paper's own. I spot-checked the cached abstract against
    arxiv.org/abs/2607.24555 and it matches character for character, which is why the remaining
    cache abstracts are treated as accurate without re-fetching each one.

    Pages that would not yield a body. support.apple.com/en-us/128067, the macOS Tahoe 26.6 security
    content, returned head, meta, and inline CSS with no CVE table, the same failure the first run
    hit on /100100. Apple's security-content pages are not readable from this environment at all,
    which is worth an access note rather than a per-run rediscovery, and it means the Apple
    platforms section cannot be written from Apple's own listing on any day.
    blogs.nvidia.com/blog/open-secure-ai-alliance/ again returned chrome only, though its metadata
    now resolves the canonical headline as "Industry Leaders Unite in Open Secure AI Alliance for AI
    Safety and Security", published 2026-07-27T09:00:07Z, modified 16:08:42Z, 1,138 words. Founding
    members and deliverables stay unread, so the item is still unpublishable beyond the fact of
    publication. The Cloud Security Alliance artifact on the Hugging Face incident returned chrome
    only; its description states it is an initial post-mortem carrying CISO guidance and calls the
    incident the first documented autonomous AI attack. That is a real new artifact against the open
    Hugging Face follow-up and should be re-checked when the joint OpenAI and Hugging Face
    postmortem lands, but a description is not a block.

    Dropped after verification rather than for lack of interest. The fermisense.com post behind "A
    $500 RL fine-tune of a 9B open model beat frontier models" (218 points) resolved to title,
    description, and stylesheet only. What did resolve shows a vendor post with a closing
    call-to-action panel, and the headline comparison is the vendor's own with no reproducible setup
    readable, so it fails the benchmark-claim rule twice over. The PyPI and GitHub time-based
    supply-chain defenses circulating on r/cybersecurity trace to a real primary, blog.pypi.org's
    2026-07-22 post rejecting new files on releases older than 14 days, backed by warehouse PR 19727
    merged 2026-07-08 and a query showing only 56 of the top 15,000 projects had shipped a 3.14
    wheel more than 14 days after a release. This digest already published it on 2026-07-23, and
    each story appears once, so it is excluded. The GitHub half of that pairing has no primary I
    resolved.

    New videos is omitted deliberately, and the absence is the finding. The day's strongest
    candidate by a wide margin was LiveOverflow's "Did an AI Really Hack Hugging Face?", published
    2026-07-27T22:43Z with 16,911 views and a 5.0 average over 1,593 ratings, and it sits directly
    on the digest's longest-running open follow-up. Its Hacker News discussion object carries 3
    points and 0 comments, which is the ranking signal the video bar actually uses, and transcript
    scraping is not permitted, so from the title and metadata alone I could not separate a technical
    walkthrough from commentary. The bar excludes commentary regardless of channel size, so it was
    omitted rather than published on view count. If the video guidance wants items like this
    reachable, the gap is that a video with no Hacker News thread has no admissible evidence of what
    it contains.

    Outages stays at no major items found. The only incidents in the window are the three Claude
    Opus 5 model-error incidents already published on 2026-07-27, plus T-Mobile and Xbox consumer
    incidents that sit outside the status-page checklist in the security and outages guidance.
    Nothing new opened.

    Also seen and left out: Chrome reaching ARM64 Linux with Widevine (85 points, omgubuntu
    secondary only, no Chrome release primary resolved), the EU's 1.02 billion dollar DMA fine
    against Google (WSJ, no engineering change), Paged Out #9 (251 points, a zine issue with no
    section that fits), the Tokio scheduling post (59 points, 5 comments, below the bar), and the
    python-build-standalone documentation (151 points, documentation resurfacing rather than an
    event).

    Backtest. The tool scored 54 candidates for 2026-07-27. One seeded cause is wrong and it is the
    same one the first run of today identified in prose but left out of the miss_review field, which
    is why it is recorded here: Ruff v0.16.0 (item 49056112, 336 points, default rule set raised
    from 59 to 413, release tag 0.16.0 dated 2026-07-23) is a genuine engineering miss seeded as
    no_query_match, and no query in the hacker_news watchlist covers Ruff or Python linting by name.
    It is not published because the migration news has passed. Every other high-point candidate is
    correctly out of scope or was correctly skipped on relevance.

    Third selection pass for 2026-07-28. Unlike the second run, collection did move: the scheduled
    fetchers re-ran between 17:13 and 17:22 UTC against the 11:47 cache the first two runs worked
    from, and the Hacker News pool added 44 front page, 35 top day, 28 Show HN and 86 query items.
    That is where both of today's additions came from. Neither was reachable earlier.

    Two additions, no displacement, one re-ranking. The day goes from 7 stories to 10 against a
    budget of 25. Top stories goes from 3 to 4, which is exactly the section cap, so nothing had to
    lose a slot and the displace list is empty.

    The re-ranking is the substantive call and it should be visible in the log. I moved the MCP
    2026-07-28 specification release into the lead and demoted the Claude share-link indexing item
    to second. The earlier runs led with the Claude item on the reasoning that it was the only story
    today with a live and unbounded operational exposure, and that reasoning still holds on its own
    terms. It is outranked anyway. The MCP release is the largest revision of the protocol since
    launch, it landed today with four Tier 1 SDKs shipping the same day, and it is breaking: the
    initialize handshake and the protocol-level session are gone, Mcp-Method and Mcp-Name headers
    become mandatory on Streamable HTTP, server-initiated elicitation and sampling are replaced by
    Multi Round-Trip Requests, Tasks leaves the core for an extension and loses tasks/list, and
    Roots, Sampling, Logging and the HTTP plus SSE transport enter a twelve-month deprecation
    window. Every team operating a remote MCP server now has dated migration work. The Claude
    exposure is serious but is scoped to one vendor's share links and is already being remediated.
    Ranking by operational and ecosystem impact rather than by urgency alone puts MCP first. I
    restated all four Top stories so the whole-day ranking is explicit. Nothing about the three
    existing blocks changed.

    One trap worth recording, because a later run will hit it. There are two MCP blog posts with
    near-identical framing. blog.modelcontextprotocol.io/posts/2026-07-28-release-candidate/ is the
    release candidate announcement and its JSON-LD carries datePublished 2026-05-21, modified
    2026-07-24. That is the URL the Hacker News submission points at, and taking it at face value
    would have dated today's story to May. The actual event is the separate post at
    /posts/2026-07-28/, published 2026-07-28T09:00Z and modified 16:56Z, which opens "Today, we're
    officially pushing the release button". I found it only by fetching the blog index. The write
    step should link the /2026-07-28/ post as primary and may cite the release candidate post for
    the before-and-after HTTP examples, which the final post does not repeat in full.

    Calls a reader of the page could not infer. The MCP post's adoption figure, close to half a
    billion Tier 1 SDK downloads a month with TypeScript and Python each past one billion total, is
    the maintainers' own number and is not independently checked. The post carries eleven partner
    testimonial quotes from AWS, Cloudflare, Microsoft, Google Cloud, Figma, Netlify, Supabase,
    Honeycomb and others. Those are vendor statements of intent and should not be restated as
    shipped support beyond the four Tier 1 SDKs plus the Rust beta, which the maintainers assert
    directly. On the Lean item, the fix merged into the Lean tree at 13:39 UTC but is not in a
    tagged release as of publication, so a reader should not assume a stable toolchain carries it.

    Also verified for the Lean item, since a kernel soundness claim deserves the full chain: issue
    14576 opened 03:28 UTC, PR 14577 opened by Leonardo de Moura at 05:08 UTC and merged 13:39 UTC,
    regression test added to leanprover/lean-kernel-arena by Joachim Breitner at 09:47 UTC. The PR
    body gives the cause in the maintainer's own words. The reporter found it while reviewing a
    claimed sub-300-line Collatz proof by xrchz, and the original-source attribution was corrected
    in the issue after xrchz asked. That provenance detail is worth keeping accurate and is easy to
    garble.

    Pages that would not yield a body, all of them costing a story. The Register's "Hugging Face
    rebuilt a third of its infrastructure after OpenAI agents ran amok" (published
    2026-07-28T13:11Z, Connor Jones) resolved to title, description and page chrome only. It is the
    strongest new artifact against the digest's longest-running open follow-up, the OpenAI
    eval-escape and Hugging Face intrusion, and the "a third of its infrastructure" figure sits in
    the headline itself. I dropped it rather than publish a headline number I could not read in
    context. The Cloud Security Alliance post-mortem behind it was already chrome-only for the
    second run and I did not retry it. When either resolves, that follow-up should be updated.
    NVIDIA's newsroom release on the SSI partnership resolved to metadata only, giving the fact of a
    long-term partnership announced 2026-07-27 and nothing about terms, so Markets and companies
    stays omitted rather than carrying a press release I could only read the headline of.
    blog.ovhcloud.com's CVE-2026-53359 KVM patch-campaign write-up returned Astro hydration payload
    with no article text, leaving only the description that OVHcloud patched tens of thousands of
    machines in a week. That would have been a good Infrastructure item.

    Apple platforms stays omitted for the third run today. support.apple.com/en-us/128067 was
    already tried by the second run and returned no CVE table. I did not retry it on the same day.
    This is now a standing environment limitation rather than a per-run discovery: Apple's
    security-content pages cannot be read from here at all, which means the Apple platforms section
    can never be written from Apple's own listing. That belongs in access-notes, and it is the
    reason the macOS Tahoe 26.6 item at 175 points is absent despite clearing every other bar.

    Considered and left out. "You Could Have Come Up With Kimi Delta Attention" (Doubleword, 105
    points) is the recorded runner-up for Engineering posts. It resolved fully and is a genuine
    derivation of the DeltaNet family rather than a product pitch, but it is secondary analysis of
    an architecture the day already covers through the K3 technical report in Top stories, and
    publishing it alongside the Zig post would have filled the section rather than reported a
    finding. The Zig post wins because it is a core maintainer describing his own implementation
    with measured rebuild times. Sebastian Raschka's K3 architecture notes (42 points) are the same
    category of duplicate. Also left out: the Judge Rejects Google DMCA ruling at 332 points, still
    commentary with no docket resolved and now dropped by three consecutive runs; Paged Out #9 at
    249 points, still no section that fits; the fermisense 500-dollar RL fine-tune post at 290
    points, already rejected on the benchmark-claim rule by the second run and unchanged; Neutrino-1
    8B and the DMARC enforcement measurement, both vendor-hosted claims on domains with no track
    record; and "Google's Beyond Zero" at 107 points, whose host spawn-queue.acm.org is not a domain
    I could match to ACM Queue, so it fails link hygiene regardless of content.

    Outages stays at no major items found for the third run. Nothing new opened in the window. The
    Claude Opus 5 incidents remain published on 2026-07-27, and the T-Mobile and Xbox items are
    consumer incidents outside the status-page checklist.

    Sources. Reddit is still degraded and should be labelled as such in Sources checked. The 17:14
    re-fetch improved coverage from 8 of 28 subreddits to 13 of 28, which is still under the floor
    of 14. Nothing in the Reddit pool cleared the bar, so the gap did not change the selection. The
    GitHub stars watchlist returned an empty item list again for every tracked account across two
    consecutive fetches today. The fetcher reports degraded as empty, which understates it: zero
    events is not coverage, and if this persists a third day it is a fetcher problem rather than a
    quiet day.

    Backtest. The tool scored 54 candidates for 2026-07-27 and seeded no default causes. One seeded
    cause is wrong and this is the third time today it has been identified, the first two in prose
    only, so it is now in the miss_review field where it belongs. Ruff v0.16.0 (item 49056112, 336
    points, default rule set raised from 59 to 413, release tag 0.16.0 dated 2026-07-23) is seeded
    no_query_match and is a genuine engineering miss. No query in the hacker_news watchlist covers
    Ruff or Python linting by name. It is not published because the migration news has passed. The
    watchlist gap is the finding. Every other high-point candidate is correctly out of scope (rare
    books, solar panels, El Nino, Mario 64 as a library, the 2023 htmx repost) or was seen and
    correctly skipped on relevance.
