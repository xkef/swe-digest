    Resolved after three days: the DAWO NixOS story. The 2026-09-23, 09-24 and 09-25 runs each
    dropped the day's largest or second-largest thread because dawo.community is an undated
    community landing page. A comment on the thread pointed at a code repository, which I fetched
    and verified independently rather than taking on the comment's word: code.overheid.nl is the
    Dutch government's own Forgejo platform and MinBZK is the interior ministry account, and the
    repository carries dated commits, a module map and SBOM-per-host CI. Infrastructure therefore
    carries the story on a government-domain primary. Two things I deliberately did not write. The
    README states DAWO Core has moved to Codeberg and that the government copy is a backup, so the
    canonical location is no longer first-party, and the block says so. A commenter asserted the
    repository violates a Codeberg policy on AI-generated code; that is an untrusted reading of a
    third-party policy against a repository whose CONTRIBUTING file carries its own AI policy, and
    this run makes no such claim.

    Security ran to three items rather than four. Dropped on the bar: the SAFA writeup of
    CVE-2025-13032, a double-fetch in Avast's kernel driver exploited to SYSTEM on Windows 11
    through IORing `RegBuffers` corruption, the day's strongest unpublished security thread at 101
    points and 27 comments. It was published 2026-09-18, a consumer antivirus driver is niche
    exposure against the guidance rule that widely deployed developer infrastructure outranks it,
    and the post itself states that current Windows kernel user-mode accessors prevent the technique
    it describes. The PHP advisory is the weaker headline and the stronger story, because the
    affected surface is every PHP application that puts a bearer token on an `http://` stream.

