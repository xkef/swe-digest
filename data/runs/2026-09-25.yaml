    Re-ranking, not just adding. The day's lead moves from the Cloudflare Containers cross-tenant
    exposure to the appeals-court ruling on the Pentagon designation of Anthropic. The Cloudflare
    bug is fixed, Cloudflare attributed every telemetry match to the researchers and its own
