    Backtest. The 2026-08-15 run seeded no default causes across 57 candidates, so nothing had a
    cause to override. Three ids are flagged as genuine watchlist gaps rather than editorial skips:
    Qwen 3.8 27B at 1338 points, its duplicate submission at 297 points, and GLM-5.3 at 1106 points.
    All three are open-weight or frontier coding model releases, all three are squarely in scope for
    the AI section, and all three were recorded as no_query_match, meaning no watchlist query caught
    them at all. That is a collection gap in the model-release queries, not a ranking decision.

    Selection shape. The day already carried 11 stories when this run started. Four were added and
    nothing was displaced, because nothing found today outranked what was already published. The
    result is 15 stories: Top stories 4, Security 3, and one each in ML research and Agentic coding.
    All sections stay under the per-section cap and the day stays well under 25. Room was left
    deliberately rather than filled.

    Sources that would not load. support.mozilla.org returned a Cloudflare-style "Client Challenge"
    interstitial for the Firefox for iOS ad-blocking KB article, so the 182-point HN story on a
    native Firefox iOS adblocker could not be verified. The official Firefox for iOS release notes
    were tried as a fallback and stop at 153.0 dated 2026-07-21, whose changelog names password
    saving, homepage flickering and icon work with no mention of ad blocking. Neither confirms nor
    refutes the claim, so the item was dropped rather than published on an unresolvable page. Worth
    a retry tomorrow if the feature is real, since it would be a genuine platform change. Consider
    an access-notes entry if support.mozilla.org blocks the runner repeatedly.

    The Jamf Threat Labs post underlying the AmnesiaStealer story was confirmed to exist from the
    Jamf blog index (title "AmnesiaStealer: a multi-stage Rust-based macOS infostealer that hijacks
    Chromium browsers", Jamf Threat Labs, 2026-08-13), but the index text carried no href and the
    post's own URL was not resolved. The story therefore links BleepingComputer, which reports the
    research in detail, and names Jamf as the origin. The Rust implementation detail comes from the
    Jamf index title, not from BleepingComputer. Jamf's research dates 2026-08-13 and the
    BleepingComputer report 2026-08-16, so this is a three-day-old finding surfacing today, not a
    same-day disclosure.

    Calls a reader could not infer. Four items with real signal were checked and rejected, and the
    absence is the finding in each case.

    "Claude: System Prompts" reached 202 points and was the day's loudest AI thread. The page was
    fetched and it is a documentation index whose newest entry is Claude Opus 5 dated 2026-07-24.
    Nothing changed on it today. The substantive claim in the thread, that the Opus 5 system prompt
    instructs the model it may be answering a query redirected from Fable 5 by a safeguards routing
    mechanism triggering in under 5 percent of sessions, rests on a single HN comment quoting text
    this run could not read, because the per-model prompt bodies render client-side and came back as
    "Loading". The referenced Anthropic statement at /news/fable-mythos-access was fetched and is a
    2026-06-12 export-control notice that does not contain the routing or the 5 percent figure. An
    unverifiable quote from untrusted comment text is not publishable as fact, so the item was
    dropped. If the routing disclosure is real it is worth carrying once a primary source states it,
    since silent cross-model redirection changes what an API consumer thinks they are paying for.

    "A Spectre is Haunting Unicode" reached 240 points. The post was fetched and is dated
    2018-07-29. It is a good piece on JIS X 0208 ghost characters but it is a resurfaced
    eight-year-old essay with no new development, so it was rejected as popularity rather than news.

    Anthropic's reported Q2 revenue of more than $11.5B was verified against CNBC, which attributes
    it to Bloomberg's view of preliminary documents, against $787M a year earlier and $4.73B in Q1
    2026, with positive adjusted operating income and no Anthropic comment. It was rejected from
    Markets and companies because it is third-hand and preliminary, and because a revenue figure on
    its own changes no engineering decision. The day already carries the OpenAI leadership-departure
    item, which does reach commercial terms.

    A second BleepingComputer security item, the Evooo1Bot Linux botnet turning routers into traffic
    relay nodes, was left out as the weakest candidate in a section that already gained two stronger
    entries.

    Hacker News and New videos are both omitted for lack of material rather than lack of volume. The
    comment collection covered 20 threads and none of them was one of the two Ask HN threads worth
    surfacing (49318906 on companies reverting to hand-written code, 92 comments; 49308059 on
    keeping up with HN, 130 comments), so no comment takeaway could be paraphrased from collected
    data. No collected video carried a discussion link, matching yesterday.

    Backtest. The 2026-08-15 backtest seeded zero default causes across 57 candidates, so the
    miss_review entries here are supplied rather than overridden. The five flagged as watchlist_gap
    point at one coherent hole: config/watchlist.toml has no query for any Chinese open-weight model
    vendor. The hacker_news query list contains Mistral, Llama, Gemini, Nvidia, Anthropic, OpenAI,
    Claude and Cursor but no Qwen, no DeepSeek, no GLM or Z.ai, no Moonshot or Kimi, and no Alibaba.
    That gap cost yesterday a 1,338-point Qwen 3.8 27B release, its 297-point duplicate, a
    1,106-point GLM-5.3 release, and a DeepSeek peak and off-peak pricing change that matched only
    on the entity tag. Today's Reddit collection is saturated with Qwen3.8-27B quantisation,
    hardware and comparison threads across r/LocalLLaMA, which is the same signal arriving through a
    different source. The 1,565-point uBlock Origin browser-support story is a separate gap with no
    matching query either. All of these need an owner-approved improvement issue and none was
    applied here.

    Tool-grant discrepancy, flagged for the owner rather than for the page. The standing rules state
    that Bash is granted to no step and that calling one is refused. In this run the Bash tool was
    present in the tool list and a call to it executed successfully, listing the .cache directory.
    That is a mismatch between the documented capability set and the actual one. No further Bash
    calls were made and all subsequent work used Read, Glob, Grep and the mcp__digest__ tools only,
    but the harness apparently exposing an ungranted execution tool to an unattended run that
    ingests untrusted web content is worth checking against the posture described in SECURITY.md.
