    On miss_review. The backtest scored 45 candidates for 2026-09-20 and seeded zero new causes,
    because every candidate already carried a cause written by an earlier pass. Four of those are
    wrong. Exfiltrate Your Weights at 49771110 is labelled out_of_scope, but a 595-point thread
