date: '2026-09-21'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Day state. The digest file for 2026-09-21 existed but held only the unfilled scaffold, so this
    run decides the whole day from nothing and displaces no published block.

    Section calls a reader cannot infer. Linux and kernel is omitted for a link-resolution reason,
    not a quiet-day reason, and this is the significant absence of the run. Phoronix carried at
    least four items that would have cleared the bar this week: the Binder C driver being retired
    for the Rust implementation in the Linux 7.4 cycle after the Rust driver was upstreamed in 6.18,
    Ubuntu 26.10 completing the Rust coreutils transition with cp, mv and rm, Linux 7.3-rc4 shipping
    with fixes driven largely by LLM-spotted defects, and kbuild patches reported to cut incremental
    build times by around 70 percent. I could read all of these from the Phoronix front page, which
    resolves, but per-article URLs did not resolve from guessed slugs and I hold no search tool to
    recover them. Only the Dragonfly 2.0 article URL resolved directly, so it is the sole Phoronix
    citation published. Rather than publish headlines behind links I could not open, I dropped the
    section. This is a recurring shape worth a fix: an access-note or a Phoronix RSS route giving
    real article URLs would have added three or four verified stories today.

    Outages is empty on genuine grounds. No status page or incident report surfaced in any source
    this run, and the standing AWS me-south-1 follow-up (f-0031) produced no new update, so the
    anchor should read as a quiet day rather than a gap.

    Hacker News section omitted deliberately. Every thread carrying technical substance today
    resolved to a primary source already covered in its topical section, so an HN section would have
    duplicated rather than added. Books omitted: the publisher feed returned only Springer
    conference proceedings, which are not technical book releases. New videos omitted: the channel
    fetch was healthy but no upload carried external validation such as a real discussion thread, so
    the bar was not met.

    Candidates verified and then dropped. Qwen Image 2.1 could not be read from qwen.ai, which is
    JS-rendered and returns only a shell, matching the note already in memory f-0038; I verified it
    from the Hugging Face model card instead, which also settled the open licence question in that
    follow-up: this release is Qwen Research License, not Apache-2.0. Exfiltrate Your Weights (637
    points) and Pirate Face (512 points) are both JS-only pages that returned nothing readable, so
    neither was published despite high rank. Samsung doubling HBM4 output (424 points) rests on
    unnamed sources and an expectation, so it stays out of Markets as rumor-grade. The Reddit and
    social pulse section is omitted on coverage grounds: with 4 of 28 subreddits reached, the sample
    that arrived was Python and Go help threads with no finding worth publishing.

    Two follow-ups advanced but are published in topical sections rather than a Watchlist follow-ups
    section, since duplicating them would spend the day budget twice. The Codex Heapjack and
    Overpatch escapes are the direct continuation of f-0036, and they answer its open question:
    OpenAI, which marked the July Pillar Security report informational and configuration-dependent,
    fixed both of these within eight days. Qwen-Image-2.1 answers the Qwen half of f-0038.

    Backtest. The 2026-09-20 run scored 45 candidates but seeded zero causes, so there were no
    defaults to correct and miss_review is not being used in its ordinary sense. I flagged the two
    candidates that look like genuine engineering misses no query caught rather than leaving the
    field empty: 49772532, a frontier model preview that no AI query matched, and 49768833, a Btrfs,
    ZFS and bcachefs benchmark comparison that no Linux or filesystem query matched. Treat both as
    proposed rather than as overrides of a seeded value. The remaining high-point misses are
    off-topic for this digest, and the seen_and_matched entries are correctly not misses.

    Day state. The 07:03 run published six stories. This run adds five and displaces nothing.
    Nothing found this afternoon outranks the four published Top stories, so Top stories is left
    exactly as it stands and the Codex sandbox escape keeps the lead. Section counts after this run
    are Top stories 4, Security 2, Agentic coding 2, Languages and runtimes 1, Linux and kernel 1,
    Infrastructure 1, for 11 against a 25 budget. Every section is under its cap, so no displacement
    was needed and none is proposed.

    Correcting the earlier run's own note. The 07:03 judgment states that Phoronix carried three or
    four Linux items lost to link resolution, naming the Binder C driver retirement, the Ubuntu
    26.10 Rust coreutils transition, Linux 7.3-rc4 and the kbuild work. That framing overstates the
    loss. The Binder C removal is already published on 2026-09-19 with the same Phoronix URL, the
    kbuild build-time series is published on 2026-09-09, and the Ubuntu Rust coreutils transition is
    published on 2026-09-14. The 2026-09-20 digest had already recorded the same conclusion. The
    real recoverable item was the URL route, not three or four stories, and after recovering it only
    one genuinely unpublished Linux item cleared the bar.

    Access findings worth an access note. Phoronix article pages return HTTP 500 to this
    environment, including Orphaned-VMs-Linux-Patches and Linux-7.3-rc4, while rss.php returns the
    full feed with canonical article URLs and Phoronix's own ledes. The earlier run's identical
    66821-byte results for three different article slugs look like the same non-article response
    rather than three successful reads. The feed is the reliable route and it is how the URL in the
    Orphaned VMs block was obtained. Separately, BleepingComputer article slugs cannot be guessed
    but /feed/ gives exact URLs, and that is how Brevo and Rapuncel were recovered after the
    2026-09-19 and 07:03 runs both failed on constructed slugs. Both routes are worth recording so
    later runs stop losing verifiable stories to slug guessing.

    Security is no longer empty, and it was never a quiet day. Two supply-chain and malware stories
    that no previous run could resolve are published here. Both are several days old, which is why
    they sit in Security rather than Top stories: the Brevo incident ran on 2026-09-14 with the
    post-mortem on 2026-09-17, and the Rapuncel campaign was reported on 2026-09-18. Security is
    outside the day budget, so carrying them costs the rest of the digest nothing, and the Brevo
    remediation step is still actionable for any WordPress operator who has not checked.

    One security item I believe exists and could not source. BleepingComputer's featured block lists
    "Cisco warns of max severity ISE zero-day exploited in attacks" on every page fetched, but it is
    absent from /feed/, which reaches back to 2026-09-18, and absent from the dated index listing.
    The slug the earlier run constructed returns 404. Active exploitation of a max-severity flaw in
    network access control would rank high, so this is a real gap rather than a judgment, and it is
    not published on a constructed URL.

    Candidates verified and then dropped. The Hacker News item "Anthropic is cutting Claude Code's
    current weekly limits by 17%" reads as current but the article is dated 2026-08-29 and the
    change took effect 2026-09-14, so it is stale rather than unimportant and is not published. The
    claim that AI-generated code made up 17.25% of September Linux kernel patches rests on a single
    social media post with no stated method, which fails both the social attribution rule and the
    benchmark-without-method rule. Samsung doubling HBM4 output remains rumor-grade, matching the
    earlier run. Linux 7.3-rc4 and the Linux 7.4 open-path optimization were both recovered as real
    URLs but dropped: with the article bodies unreadable and only a feed lede to work from, they
    would have been the weakest items in their section.

    ML research stays omitted, and the absence is a judgment. The arXiv window was dominated by
    narrow benchmark and agent-evaluation papers. The one candidate that connects to the live
    coding-agent containment thread, "Provisional Reachability: Containing Agents by Making Every
    Crossing Revocable" (2609.21957), is single-author, leans on a self-cited companion paper, and
    reports figures that cannot be checked from the abstract, so it did not clear the bar. Reddit
    and social pulse stays omitted on the same coverage grounds as the earlier run, with the
    subreddit sample unchanged.

    Watchlist coverage gap worth acting on. Today's Hacker News cache is saturated with "Jev"
    submissions, roughly twenty Show HN entries plus Ask HN threads, and the backtest's
    second-highest miss for 2026-09-20 is a Jev-adjacent post at 1261 points. No watchlist query
    matches any of it, so the collector sees the day's dominant Hacker News phenomenon only through
    generic front-page pooling. That is the gap behind the 49765348 entry in miss_review.

    Backtest. Scoring 2026-09-20 again seeded zero causes, so there are no defaults to override and
    miss_review is not being used in its ordinary sense. The 07:03 run already proposed 49772532 and
    49768833; those are not repeated here. The two ids recorded are further genuine engineering
    misses no query caught: 49765348, the non-autoregressive decision model post noted above, and
    49772677, UTF-8000, an encoding topic for which the watchlist carries no Unicode or
    text-encoding query.
