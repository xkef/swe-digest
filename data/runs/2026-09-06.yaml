  notes: |
    Day shape. The 2026-09-06 digest file was still the empty template when this run started, so
    this selection decides the whole day and displaces nothing. It is a genuinely quiet day and the
    page should read that way: eight stories against a budget of 25.

    The day's loudest HN threads are all already in the archive. The 2157-point collusion.wiki
    thread is the OpenAI agent-swarm story that led 2026-09-05. The four follow-on threads today
    (OpenAI admits to German wiki incident, OpenAI Response to the Wiki Incident, OpenAI
    acknowledges wiki incident, OpenAI agents used a dead web site in May) resolve to either the
    same Verge piece or the same X post already carried on 2026-09-05, so there is no new primary
    and no Watchlist follow-ups section. The 765-point "Actively exploited sandbox RCE in all
    Chromium versions" thread is CVE-2026-85046, carried on 2026-09-05 including the correction that
    the HN title overstates the NVD scope.

    Security states "No major items found." and that absence is the finding rather than a collection
    gap. Nothing new cleared the bar. The GitLab GraphQL flaws surfacing today (CVE-2026-19478,
    CVE-2026-19650) were verified fresh against the NVD 2.0 JSON API, which confirms CVSS 9.1
    primary and 9.4 secondary, unauthenticated modify or delete of public projects, fixed in
    18.11.11, 19.0.8, 19.1.6 and 19.2.4, with SSVC exploitation "none". They were already carried on
    2026-08-19, and the only new artifact is a 1-point Medium write-up that adds nothing, so it is
    not republished. Outages likewise found nothing beyond a 2-point GitHub Copilot Code Review
    status blip.

    Rejected on verification. "Git hosting that never leaves Europe" (pushin.eu, 331 points) is not
    published in any form. The HN thread reports no company details, no named operator, no legal
    pages and no pricing, with commenters reading it as possibly machine-generated. It fails link
    hygiene, so no link to it appears anywhere including as discussion. Statichost.eu (458 points)
    is a real Swedish host, but its thread is ordinary product feedback (git-only deploys, an OVH
    comparison, confusion over build minutes for static sites), so it did not earn an HN-native
    slot.

    The Chrome item is marked developing, not confirmed, on purpose. Jeff Johnson reproduced it on
    two Macs on Chrome 152.0.7977.83 with the default search engine switched to DuckDuckGo and
    Chrome sign-in disallowed, which is a solid observation, but there is no Google confirmation, no
    bug ID, and macOS only. The author explicitly declines the intent reading and cites Hanlon's
    razor, and the digest should not upgrade his own hedge.

    Sections omitted for lack of qualifying material rather than for lack of checking. Books: the
    feed was healthy and every item in the window was a Springer conference proceedings or a
    certification study companion, with no trade technical release. New videos: three videos, none
    carrying a discussion link, so nothing met the external-validation bar. The highest-view item,
    Theo's GPT-6 Astra reaction at 363,791 views, is sponsored first-access commentary with no
    thread behind it. Hacker News: every strong thread pointed at a primary carried in a topical
    section or already in the archive. Reddit: degraded as recorded, and with no score or
    comment-count field in the cache there is no way to rank on discussion signal, which is the
    second consecutive day with that exact shape.

    Recurring collection gap worth acting on. European hosting and DNS sovereignty produced
    high-point HN items on two consecutive days that no watchlist query matched: yesterday
    Statichost.eu at 436, "Git hosting that never leaves Europe" at 269 and deSEC at 122, and today
    the same two at 458 and 331. deSEC is the sharpest case, because 2026-09-05 carried Mullvad
    shutting down its public encrypted DNS and funding Quad9, and a free secure DNS provider
    trending the same day is directly adjacent material the queries did not surface. That is flagged
    as watchlist_gap in miss_review. The two hosting product pages are marked relevance_skip because
    on inspection neither is publishable, so the gap is in the query set rather than in the
    editorial call.

    Memory looks stale. The newest followups entry is dated 2026-08-30 while the digest has
    published daily through 2026-09-05, and several open entries track items the archive has since
    moved past. Nothing in the store produced a verifiable update today. Worth a look in the weekly
    review, since this step cannot write to the store.

    Minor calls a reader could not infer. Python 3.15.0rc2 is dated 2026-09-01 and drew 2 HN points,
    so it is five days stale and carried on merit rather than on signal: it is the final release
    candidate, the ABI is frozen, and it fixes the October date the 2026-08-16 AWS Lambda item left
    open. The Asahi post's URL slug reads m2-episode-1 while the post is the M3 announcement, so the
    link looks wrong and is not. The Anthropic IPO item rests on unnamed people familiar with the
    matter via Reuters, with Anthropic and all four banks declining comment, hence developing.

    Day shape. This is a later run of 2026-09-06 against a page the 06:29 run already published with
    seven stories. Nothing published this morning was displaced, because nothing found since
    outranks it. The selection adds five and takes the day to twelve against a budget of
    twenty-five, with every section at or under four. The page gains a new lead.

    Why the lead changed. Robocurve's GPT-6 Astra robot-arm report displaces Asahi Linux at the top
    rather than off the page. Asahi's M3 support is confirmed and concrete, but it ships with no GPU
    driver, no sleep, no HDMI and an EXPERT=1 gate, so its reach today is narrow. The Robocurve
    report is the first physical-manipulation measurement of the model the ecosystem spent this week
    sizing up, it publishes all 120 trials with transcripts, and it continues the
    independent-evaluation thread this digest already ran on 2026-09-04 with ARC Prize and
    Artificial Analysis. Its most useful result is the negative one: Astra goes from 1 in 20 to 19
    in 20 on the easy pick-and-place task but stalls at 2 in 20 on the fine insertion, exactly where
    Fable stalls. Robocurve is a Y Combinator-backed public benefit corporation that sells
    evaluation to labs, and its own limitations section discloses the non-interleaved runs, the
    different rig for the bowl task and the unblinded grading, so the story is carried with those
    caveats stated rather than as a clean win.

    Verified before publishing. The Oxide policy claim was checked against RFD 576 itself, which is
    public and states the Pangram-clean requirement for public writing directly, so the Cantrill
    item rests on a primary artifact and not only on his blog post. Robocurve.org resolved to a real
    organization with an MIT-licensed harness, which matters because the report lives on the
    openai.robocurve.org subdomain and reads at a glance like an OpenAI property. It is not one.

    Absences that are findings. Security and Outages both stay at "No major items found." and both
    are genuine. The only security artifact in the corpus was the same 1-point GitLab GraphQL
    write-up the morning run already rejected as covered on 2026-08-19, and the only outage artifact
    was a 2-point GitHub Copilot Code Review status blip. The `breach` and `exploit` queries
    returned zero raw results again. Hacker News and Reddit and social pulse stay omitted: every
    strong thread resolved to a primary carried in a topical section, and the reddit cache still
    carries no score or comment-count field, so there is no way to rank on discussion signal for a
    third consecutive day.

    Rejected on the day's biggest threads. "LLMs as a Cognitive Virus" (arXiv 2609.03344, 306
    points) is not published. It is a physics.soc-ph epidemiological model of adoption dynamics by
    nine authors, and its engineering relevance is thin enough that publishing it would be
    publishing a popular thread. The Isar Aerospace orbital launch drew three separate threads
    totalling over 1000 points and is out of scope. The European hosting cluster flagged yesterday
    recurred a third day (Statichost.eu at 486, pushin.eu at 327) and both remain unpublishable for
    the reasons the 2026-09-05 log records, so the gap stays in the query set rather than in the
    editorial call.

    Backtest. Every 2026-09-05 candidate already carried a cause from the morning run, so the three
    entries here are corrections rather than new seeds. The Cognitive Virus paper was seeded
    scrape_gap but the arXiv query did match it, so it was surfaced and skipped, not missed. The
    OCaml textbook was seeded scrape_gap but no query covers OCaml at all, which is a watchlist gap.
    The ID-verification breach at 447 points was seeded relevance_skip, and a security story that
    large going unsurfaced while the `breach` query returns zero raw results day after day is a
    watchlist gap, not an editorial choice.

    Collection and memory. Reddit is degraded at 6 of 28 subreddits against a floor of 14 and top of
    day at 2 of 28. Those numbers differ from what the page's Sources checked line currently states,
    which was written from the morning fetch, so that line needs updating. The GitHub stars backend
    returned an empty item list again with no snapshot fallback. Memory remains visibly stale: the
    newest followups entry is dated 2026-08-30 against daily publication through 2026-09-05, and
    nothing in the store produced a verifiable update today. This step cannot write to it.

    Minor calls a reader could not infer. The Willison system-prompt post is dated 2026-09-02 and
    drew 68 points, so it is four days stale and carried on substance. The substance is that
    Anthropic's published core prompt is incomplete, not the lyrics section itself. His link between
    that section and the reported music-publisher suits is his inference and is labelled as such.
    The Asahi post's URL slug reads m2-episode-1 while the post announces M3, so the link looks
    wrong and is not.

    Selection for 2026-09-06. The page already carried 12 stories when this run started. I added
    three and displaced nothing, taking the day to 15, with Top stories at 5, Security at 1, and ML
    research at 2. Nothing found today outranked anything already published, so no block was
    removed.

    Ranking call the page cannot show. I put the Autistici/Inventati shutdown at the lead, ahead of
    the Robocurve GPT-6 Astra robot-arm report that led before this run. The other four Top stories
    keep their relative order behind it. Reasoning: the A/I item is a confirmed, dated outcome with
    a primary source and a direct antecedent this archive already published on 2026-08-29, while the
    Robocurve entry is a third-party evaluation whose own limitations section concedes the Astra
    trials were not interleaved, used a different rig for the bowl comparison, and were graded by an
    operator who knew the model. I did not touch the Robocurve entry otherwise.

    A/I verification. The announcement is on keepitfree.ai, which is not the collective's historic
    domain, so I corroborated it against inventati.org, which the collective controls and which now
    carries "A/I SHUTS DOWN" and "TAKE ACTION AGAINST THE US SANCTIONS" on its front page. The
    2026-08-29 entry left an open thread: reports that the .org domain had gone dark rested on a
    Mastodon post that run could not resolve. Today's announcement states from the collective itself
    that autistici.org was made unreachable without previous notice, which closes that thread. The
    collective's phrase "designated a global terrorist organization" is its own characterization;
    the Treasury release designates it under Executive Order 13224 for materially assisting an act
    of terrorism, and I kept the digest on the Treasury wording.

    Security. The Chromium item that dominates today's front page, CVE-2026-85046 at 777 points, is
    archive: this digest led with it on 2026-09-05, including the distinction between execution
    inside the sandbox and a full escape that the HN title elides. I re-verified it anyway against
    the CISA KEV feed (added 2026-09-04, due 2026-09-18) and found no change worth a follow-up
    entry. The researcher write-up at serotav.github.io is now public and describes the bug as a
    maglev inlined-sort optimization that checks the receiver map against the set of maps seen
    before the loop rather than checking whether the map changed, letting Array.prototype.fill
    migrate PACKED_ELEMENTS back to PACKED_SMI_ELEMENTS. That is a real addition to the 09-05 entry,
    but it did not seem worth reopening a published story for, so it is recorded here instead. The
    GitLab GraphQL CVEs surfacing today on a Medium write-up, CVE-2026-19478 and CVE-2026-19650, are
    also archive, covered 2026-08-19.

    So the one Security item I published is a paper rather than an advisory. That is the honest
    state of the day: no fresh advisory, no KEV addition, no incident. I judged the strip
    trusting-trust paper strong enough to carry the section on its own given the author list and the
    concreteness of the artifact, but note that it was submitted 2026-07-27 and resurfaced on HN at
    27 points with zero comments, so it has essentially no discussion signal. A reader should not
    infer today was a heavy security day.

    Outages stays "No major items found." I checked the HN cache for incident and status signals and
    found nothing for 2026-09-06.

    Sections omitted, where the absence is the finding rather than a quiet day. Agentic coding is
    empty mainly because openai.com returned HTTP 403 to every fetch attempt. Two OpenAI posts from
    today, "We monitor internal coding agents for misalignment" and "Research acceleration: the view
    inside OpenAI", are exactly what that section covers and I could not read either, so I did not
    publish them. This 403 is not in the access-notes store and openai.com was evidently usable on
    2026-09-03 through 09-05, when this archive cited it, so it looks new and is worth an access
    note. Books is omitted because the feed returned only conference proceedings volumes. New videos
    is omitted because the YouTube pull returned shorts, teasers for talks landing later in
    September, and an Apple Developer clip, none with real discussion signal. Reddit and social
    pulse is omitted because coverage reached 6 of 28 subreddits and the reachable posts were
    routine question threads.

    Deliberate exclusions. The day's second-largest thread, "QBittorrent breaks out of sandbox to
    commit crimes" at 740 points, is a joke Mastodon post about downloading media, with no
    engineering content, and the account is unverified. ".gitignore Everything by Default" at 172
    points and 168 comments is a short opinion post whose whole technique is a five-line allowlist
    example; the discussion is large but the substance is thin, so it lost to the high-bar posture.
    NetBSD 9.5 shipped today and ends support for the netbsd-9 branch, which is real news for anyone
    on it, but no section in the canonical list fits a BSD release and the item drew 38 points, so I
    left it out rather than force it into Linux and kernel. The Isar Aerospace orbital launch, at
    620 and 443 points across two threads, is out of scope. "Gemini 4 Leak" and the OpenAI
    wiki-incident follow-ups are single tweets in the 4-to-5 point range with no primary source, and
    the wiki incident itself was covered 2026-09-05 from better sources.

    Backtest. The tool scored 46 candidates for 2026-09-05 and seeded no default causes, so there
    was nothing to override in the usual sense. I flagged one genuine engineering miss: item
    49561320, "Hackers had a live feed of every ID verification company scanned for over a year", at
    534 points and marked no_query_match. A year-long compromise of an identity-verification
    provider's scan feed is squarely a Security-section breach story and no query reached it, which
    is a watchlist gap rather than a relevance judgment. I did not flag the two largest candidates.
    GPT-6 Astra at 2177 points was covered on 2026-09-03 at rollout and again on 2026-09-04 with the
    ARC Prize and Artificial Analysis measurements, and the OpenAI agent message board at 2066
    points led the 2026-09-05 digest, so neither is a miss.

    Memory. This step cannot write, so recording here what the next writable step should carry: the
    openai.com 403 as an access note, the A/I shutdown closing the 2026-08-29 follow-up on the .org
    domain, and the serotav write-up as the technical detail behind the 2026-09-05 Chromium entry.
