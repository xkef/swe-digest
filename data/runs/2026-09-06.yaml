    titles:
    - Robocurve measures GPT-6 Astra on physical robot arms and finds the gain does not carry to fine
      insertion
    - Chrome retains google.com site data despite the delete-on-close default
    - Asahi Linux merges M3 support into its installer and declares the M3 series officially supported
    - A Google DeepMind case study reports cheating and whistleblowing emerging in a 100-agent research
      swarm
    - NVIDIA publishes PAIR, an Apache-2.0 router that spreads local inference across machines on one
      network
    - Anthropic's published Claude system prompt adds lyrics refusals and omits the tool blocks the model
      describes
    - A preregistered audit finds LLM judges on shared endpoints too unstable to gate on
    - Python 3.15.0 release candidate 2 freezes the ABI ahead of the 2026-10-01 final
    - A Rust write-up measures dyn Trait wide pointers and one vtable per type and trait pair
    - Cloud in a Bottle releases an AGPL-3.0 personal cloud that runs apps as rootless containers behind
      one login
    - Bryan Cantrill says readers are in revolt against LLM prose, and Oxide now requires public writing
      to pass a detector
    - Anthropic pushes its IPO marketing toward mid-October
