    titles:
    - Cisco ISE authentication bypass rated 10.0 is under active exploitation
    - Plugin4Shell gives zero-click code execution in major coding agents
    - libheif heap overflow chained through OpenAI SSO to internal repository access
    - ZCode packages full Git history and uploads it to Aliyun OSS under a key only Z.ai holds
