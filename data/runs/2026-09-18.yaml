    loss at a hyperscaler outranks anything the last 24 hours produced. It is filed under Top
    stories rather than Watchlist follow-ups for that reason, which leaves Outages carrying only the
    Telstra incident report. That is also the one backtest cause I am overriding: HN 49719249 scored
    as no_query_match, but an open follow-up already named data-loss scope as the thing to watch, so
    the correct cause is watchlist_gap.

