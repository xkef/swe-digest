    - Component-level harness study finds bash-only agents cost less and rule-based elision beats recoverable
      context
    - Gyazo breach exposes 23.62 million user records and 490 million image metadata records mostly predating
      2019
    - NATS traces the 2026-09-08 UK airspace disruption to a preempted aircraft code request that resumed
      incorrectly
    - Telstra outage traced to a GPS week rollover and an NTP timing loop
    - Zed opens the Delta public beta and disables pull requests on Delta's own repository
    - Hister indexes visited pages and local files into a self-hosted full-text search server with an
      MCP client
    - jemalloc 5.4.0 removes seven tcache tuning options and silently ignores their malloc_conf settings
    - Uber caps retry storms by making services claim ownership of errors
    - FEX-Emu measures what emulating x86 total store ordering costs on five ARM cores
