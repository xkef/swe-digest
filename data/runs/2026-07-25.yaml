  notes: |
    First and only digest for 2026-07-25 as of 05:40 UTC (creates the day).
    Early-UTC window, so most items are late 2026-07-24 carryover the previous
    day's single 04:47 UTC run could not have seen. Story, feedback, and
    improvement inboxes all empty; no .run/manifest.yaml side effects requested.
    HN: full structured Algolia coverage across all six collections, not
    degraded, 68/79 watchlist queries with hits.
    Reddit: live fetch 429ed on nearly every subreddit in both listings; the
    committed snapshot pooled 76 posts and carried the day to 14 of 28
    subreddits, exactly the day floor. Stated in Sources checked.
    YouTube: 12 of 89 channel feeds returned 404 or 500 (CppCon, ThePrimeagen,
    No Boilerplate, CMU DB Group, Arpit Bhayani, USENIX, CNCF, Strange Loop,
    TechTechPotato, High Yield, Asianometry, Branch Education). Only 9 videos
    total and only one carried any HN discussion (2 points), so New videos was
    omitted rather than padded. The recurring 404 set looks like stale channel
    ids in the watchlist and is weekly-review material.
    Books: 20 items, all Springer conference proceedings or introductory
    titles; omitted under the high bar.
    ML research: 129 arXiv items; published one (per-token timing side channel)
    on engineering relevance to inference serving rather than discussion signal.
    Backtest 2026-07-24: 65 candidates, seeded defaults reviewed and kept (46
    relevance_skip, 19 out_of_scope). No promotion to watchlist_gap: every
    high-point no_query_match candidate was out of scope (98.css, space,
    hobby/history posts) and the in-scope ones were seen and skipped on purpose.
    Postgres LISTEN/NOTIFY (49040296) surfaced at 19:05 UTC, after the previous
    run, and is carried into today rather than reclassified.
    Memory: entities.md is at 118 of the 130-entry bound. Merged the two
    low-activity Alibaba Qwen world/embodied bullets into one to make room for
    Redis and Debian. Compaction is weekly-review material before the bound
    bites.
    Attribution care: the Redis discovery claim reaches this digest only
    through heise and the Redis release notes, not through the X post the HN
    submission points at. Counts, timings, and autonomy labelled self-reported.
    ---
    Second run (deep sweep), 10:57 to 12:0x UTC. Updated the day in place: 13
    stories added, none removed, no corrections needed to existing blocks.
    Top stories re-ranked by impact, which is what the deep sweep is for. The
    lead moved from the resolved 20-minute AWS us-west-2 routing event to the
    Redis seven-release RESTORE set, on the grounds that fixes across every
    supported branch with possible RCE outrank a recovered regional
    connectivity blip. AWS dropped to fourth. Added the UK AISI / CAISI joint
    Kimi K3 cyber assessment at second: a government measurement bounding the
    capability behind the Redis findings, and the first numbers in a debate
    that has run on vendor claims. Six top stories, inside the cap.
    Deep sweep GitHub pass: every repo in the [github] table checked for both
    releases and tags. Nothing new past the 2026-07-23 cutoff beyond Zed
    1.12.0 and Deno 2.9.4 already published; newer tags were all prereleases
    (Zed 1.13.0-pre, Kotlin 2.4.20-Beta2, Neovim nightly), correctly skipped.
    Corrected entities.md: the kernel bullet said 7.2-rc2, actual is 7.2-rc4
    tagged 2026-07-19.
    Trending: overall plus rust, python, go, typescript views. One verifiable
    cluster, agent-collaboration and agent-skill repos, led by block/buzz
    (Block, Apache-2.0, +3,270 stars in a day) which was verified against its
    own README and repo metadata before publishing. Deliberately did not
    publish the several sponsor-slot and AI-gateway repos in the same list.
    Reddit: second fetch of the day again 429ed on most subreddits but pooling
    reached 17 of 28 and the run reported not degraded, up from 14 at 04:42.
    Recorded in access-notes: a later second fetch is worth running.
    New videos: published two after omitting the section at 05:40. 43 videos
    this fetch against 9 earlier, and only one carried HN discussion (2 pts),
    so selection was on conference-talk substance: the Dex Horthy harness talk
    (16.5k views, 733 ratings) and the Andon Labs Vending-Bench talk (559
    views), the latter because it updates a tracked follow-up. Deliberately
    excluded the reaction and commentary uploads from large channels.
    Not published for lack of verification: the Fil-C SSW 2026 talk went to
    Languages as an Event story rather than New videos, because WebFetch cannot
    read a YouTube watch page and the snapshot has no metadata for a
    non-watchlist channel, so the required Channel line could not be filled.
    Dropped a Carbon NDC Toronto talk item as padding (Languages already had
    three) and the DoorDash proxy-cache post because the blog 403s.
    Attribution care, second pass: the Android ADB item is a feature request
    plus one maintainer comment, labelled developing with "not a Google
    announcement" stated in the summary. The Hetzner item states in the digest
    body that this run could not resolve a Hetzner page for the service. The
    AMD Instella card's own date (November 2025) conflicts with the Hugging
    Face repo creation date (2026-07-23); published the repo date and said why.
    The Copilot GPT-family outage does not assert the OpenAI incident is the
    same fault, because OpenAI's status entry lists no components.
    Memory: entities.md 119 of 130 entries, followups.md 94 of 130 and 128 KB
    of 176 KB after three additions. No new entities bullet added despite
    three new tracked items, to hold the entry count; the AMD, Android, and
    Hetzner facts live in followups only. Compaction stays weekly-review
    material.
    ---
    Third run (update), 16:35 to 17:0x UTC. Updated the day in place: six
    stories added, none removed, one existing block extended. Top stories
    unchanged at six; nothing that surfaced after the deep sweep clears the
    Redis lead, and the day's new material is follow-up detail and one
    developer-infrastructure incident.
    Outages: extended the 2026-07-25 GitHub/OpenAI block rather than opening a
    third GitHub outage story. OpenAI's 09:17 incident resolved 11:08 UTC and a
    second elevated-error-rates incident ran 11:35 to 11:57 UTC; GitHub added a
    critical Actions incident 12:31 to 13:13 UTC (run failures, jobs queued
    before 12:40 UTC needed retrying). Still does not assert the OpenAI and
    Copilot faults are the same, because OpenAI lists no components.
    Watchlist follow-ups: three added. The Azure West US preliminary PIR
    (ZJV6-SGG) publishes the root cause for a story the 2026-07-24 digest ran
    without one. The open-weights letter signatory list on microsoft.com now
    names OpenAI and has grown 25 to 35 companies, which contradicts the
    absent-from-signatories line every outlet carried on 2026-07-24; verified
    from the letter's own host, not from the Reddit screenshots that surfaced
    it. The Bitchat takedown follow-up answers the open question from the
    2026-07-24 entry: repositories still reachable, GitHub silent, no entry in
    github/gov-takedowns.
    Security: added the Click to Pray IDOR (~719,517 records, six months of
    non-response, fixed only after press coverage). Section had one story.
    Developer tools: added the FreeBSD ports history rewrite after a 150MB
    Copilot CLI binary broke GitHub mirroring. Dated 2026-07-20 to 07-24 and
    surfaced on HN today at low points, published because the history rewrite
    imposes a concrete action on every downstream consumer.
    Reddit and social pulse: added the antirez post, a tracked [social] person
    publishing on their own domain, verified by direct fetch.
    Not published: a HN claim that Bitchat is now on Radicle could not be
    verified, because the Radicle Explorer is a JS single-page app and the seed
    node API 404s for that repository id; stated in Sources checked. Nvidia
    Nemotron 3 Ultra and the PyTorch Monarch ROCm post are both from earlier in
    the month and were skipped as stale rather than new. The ARC Prize
    leaderboard thread was skipped because the numbers are rendered client-side
    and could not be read.
    Fetchers: HN not degraded (Algolia, 71/79 queries). Reddit 429ed on most
    subreddits again but pooling reached 20 of 28, up from 17, so a third
    spaced fetch is worth running; recorded in access-notes. Stars 0 events
    across 29 accounts, YouTube 41 videos with nothing clearing the bar, books
    20 Springer proceedings, events none, papers no new engineering-relevant
    item. No new CISA KEV additions since 2026-07-22 (catalog 2026.07.24,
    count 1653). No new releases in the [github] table past the deep sweep
    beyond a Neovim nightly prerelease.
    Memory: corrected the AWS Bahrain follow-up. The Health Dashboard event
    JSON shows me-south-1 impaired since 2026-03-02 with drone-strike
    attribution in the 2026-03-03 update and a 2026-04-30 unavailable notice,
    so the "started ~2026-07-21" framing carried since 2026-07-24 is wrong and
    is marked superseded in place. followups.md 96 entries and ~129 KB of the
    176 KB bound, entities.md 119 of 130 with no new bullet added. Compaction
    remains weekly-review material and the weekly marker (newest 2026-07-19) is
    six days old, so the weekly routine does not trigger today.
    Inboxes: story, approved-story, feedback, and improvement all empty. No
    .run/manifest.yaml side effects requested.
    ---
    Fourth run (update), 18:25 to 19:0x UTC. Updated the day in place: four
    stories added, none removed, one existing block extended, Top stories
    re-ranked from six to seven.
    Correction of a multi-day miss. AMD launched the Instinct MI455X and the
    Helios rack-scale system at Advancing AI 2026 on 2026-07-23, and announced
    the Anthropic partnership (up to 2 GW of MI450 Series, first GW from H1
    2027, AMD equity investment of up to $5B, Claude used to accelerate ROCm)
    on 2026-07-22. Neither the 2026-07-23 nor the 2026-07-24 digest carried it,
    and the first three runs today missed it too. It reached this run through
    a Chips and Cheese architectural analysis at 81 points on HN, not through
    any watchlist path: AMD is not in [github], the event is not in [[events]],
    and no [hacker_news] query covers it. Published at Top stories rank 4 on
    ecosystem scope, above the recovered AWS us-west-2 connectivity event.
    Watchlist gap, and weekly-review material: the [[events]] table carries no
    vendor AI hardware events (Advancing AI, GTC, Hot Chips), and there is no
    query or source entry that would have surfaced an AMD or NVIDIA
    accelerator launch.
    Agentic coding: added Anthropic's 2026-07-24 context-engineering post
    (over 80% of Claude Code's system prompt removed for the Claude 5
    generation). Surfaced from r/ClaudeAI, published against the claude.com
    primary, which is a blog host this digest had not used before and is now
    in source-reliability. Evaluation claim carries no numbers and is labelled
    as Anthropic's own.
    Outages: added the Cloudflare 2026-07-24 cluster, six incidents in a day,
    read from the status API rather than the status HTML. Published on the R2
    APAC major incident plus the email-delivery incident that delayed
    Cloudflare's own password-reset and MFA mail. A 10-minute Anthropic Sonnet
    error-rate incident at 18:04 UTC was left in Sources checked as below the
    bar.
    Engineering posts: added the Fedora 45 build-and-release walkthrough
    (dist-git to Koji to Bodhi to Pungi), published for the reproducibility
    detail rather than the HN score.
    Resolved from the third run: the Bitchat-on-Radicle claim. The Explorer SPA
    is unreadable and seed.radicle.xyz 404s, but the node named in the Explorer
    path answers: rosa.radicle.network/api/v1/repos/{rid} returned the repo
    name, description, one delegate with the self-declared alias
    permissionlesstech, and 65 seeding nodes. Folded into the Bitchat follow-up
    with the caveat that the GitHub repository carries no pointer to that id,
    so it is not confirmed from a project-controlled source. Route recorded in
    access-notes.
    Not published: a claimed Hugging Face release of The Stack v3 (r/LocalLLaMA)
    could not be resolved to a dataset page (401 on the API id, absent from
    dataset search), so it was dropped on link hygiene. The ARC Prize
    leaderboard remains client-side rendered and unreadable.
    Fetchers: HN not degraded (Algolia, 71/79 queries). Reddit not degraded,
    live fetch reached the uncovered subreddits and the fourth pool held 19 of
    28 against a floor of 14; the day's fetches together reached 20 of 28, so
    the pool figure moves down as well as up between runs and is not a
    day-cumulative number. Stars 0 events across 29 accounts (quiet, not
    degraded), YouTube 37 videos with nothing clearing the bar, books 20
    Springer proceedings, events none, papers 121 items with nothing new
    clearing the ML research bar.
    Memory: followups.md 97 entries and ~131 KB of the 176 KB bound after one
    addition. entities.md held at 119 of 130 by moving the AMD bullet from
    Security to AI and widening it rather than adding one. Compaction stays
    weekly-review material; the weekly marker (2026-07-19) is six days old, so
    the weekly routine does not trigger today.
    Inboxes: story, approved-story, feedback, and improvement all empty. No
    .run/manifest.yaml side effects requested.
