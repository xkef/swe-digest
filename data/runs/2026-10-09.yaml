    titles:
    - Deno joins Cloudflare, ending runtime development after one more year and shutting Deno Deploy down
      in six months
    - Python 3.15.0 ships with UTF-8 as the default encoding, a lazy import keyword, and frame pointers
      enabled by default
    - Let's Encrypt moves all subscribers to 64-day certificates by default on 2027-02-10 and cuts authorization
      reuse to 10 days
    - >-
      One unauthenticated POST stalls a react-server-dom app with a reachable server action, patched five
      months ago in 19.0.6, 19.1.7 and 19.2.6
    - >-
      Anthropic launches OSS Scanner, sending model-generated vulnerability reports to enrolled open-source
      projects without human review
    - Anthropic's 2026 Usage Policy takes effect 2026-11-12 with new controls for agents that drive physical
      hardware
    - StepFun's Step 5 Preview reaches OpenRouter as a 600B-parameter sparse MoE with 27B active and a
      1M-token context
    - Re-analysis of METR's time horizons finds a 3-minute to 30-minute jump is far easier than 30 minutes
      to 5 hours
    - Case study paper collects 2026 incidents where agent security evaluations reached real systems outside
      their authorized scope
    - >-
      Preprint gives provable subexponential secret recovery for families tied to all seven NIST third-round
      lattice candidates, and states deployed parameter sets are unaffected
    - Microsoft publishes MXC, a sandboxed execution system for untrusted code, under MIT with Rust, .NET
      and Node SDKs
    - AWS releases Strands Box in developer preview, funnelling agent tool calls through a user-space
      policy layer
    - >-
      MapRoulette discloses four vulnerabilities that exposed OpenStreetMap write tokens, including an
      empty API key that granted administrator access
    - fast-jwt accepted expired tokens from its verifier cache when the JWT carried no iat claim
    - Hazelcast patches a critical flaw letting a low-privileged client read arbitrary memory from any
      cluster member
    - >-
      Firebase postmortem: a two-line config cleanup crashed Apple-platform apps once on launch while
      both status dashboards stayed green
    - Firebase Hosting has been returning bandwidth quota errors and failing deployments since 2026-10-07
    - Mitchell Hashimoto publishes OSC 7501, a terminal escape sequence for programs to report their own
      status
    - Bevy 0.20 adopts the WESL shader language and turns Solari's ReSTIR off by default
    - C2y draft removes 45 of roughly 100 instances of undefined behaviour in the C standard
    - Google replaces Pytype with Meta's Pyrefly as its Python type checker, reporting over 80 percent
      less type-checking compute
    - XMFS prototype proposes exposing cross-node shared memory as a POSIX filesystem tier
    - Kernel patch removes the Assisted-by tag from the documentation after the Maintainers Summit agreed
      to deprecate it
    - Jane Street indexes message bus subscribers per topic partition, with staging runs showing 30 percent
      less CPU
    - OpenAI told investors it reached about $50B annualized revenue, against the $68B figure reported
      in September
    - Hacker News asks why DeepSeek 4.1 Flash drew little reaction, and answers with hardware cost
    - An htmx essay on whether to learn to code draws a long thread on reading versus writing code
