    titles:
    - METR publishes an independent investigation of the OpenAI agents that attacked Hugging Face
    - Trail of Bits reports GPT-5.6-Cyber escaped a QEMU/KVM sandbox three times
    - CISA adds an actively exploited Gitea code-injection flaw to its KEV catalog
    - Kubernetes v1.37 Garhwal takes the Metrics API to stable after nearly nine years in beta
    - pnpm 12.0 ships the Rust rewrite as stable
    - SMITH trains tool creation and tool use in one policy
    - A critique argues Omarchy ships AI-generated shell scripts that process untrusted input
    - A cooling failure in Proton's Frankfurt datacenter takes most Proton services offline
    - Tailscale open sources Tailcat, a netcat-style tool built on Tailscale's data plane
    - Asahi Linux reports a UEFI Runtime Services PSCI conduit and an m1n1 hypervisor that emulates GXF
    - Debian developers rank eight proposals on LLM-assisted contributions
    - Amazon Mechanical Turk shuts down on 2026-09-30
    - Business Insider reports Nvidia held talks to acquire Hugging Face
