  notes: |
    Coverage. Hacker News, papers, books, YouTube, stars and events all came back clean. Reddit was
    the one degraded source: 7 of 28 subreddits against a floor of 14, with live top_day and hot
    each reaching only 1 of 28 and the committed snapshot supplying the rest. Only the rust, golang,
    Kotlin and OpenAI subreddits are represented, so the Reddit and social pulse section was omitted
    rather than written from a quarter of the watchlist. The one item that did come out of Reddit is
    the Go generic methods post, which reached the digest through its go.dev primary source instead.

    Sections omitted and why. ML research was dropped deliberately. The arXiv pull is large but
    every candidate is an unreviewed preprint with no discussion signal, and the closest
    engineering-relevant items (SWE-Prime, MCR-Bench) carry benchmark claims I could not check
    against a reproducible setup. Books was dropped because the entire publisher feed this run is
    Springer conference proceedings and clinical or medical imaging volumes, with nothing that meets
    the technical-book bar. New videos was dropped because not one video in the YouTube pull carried
    an attached HN discussion object, and the guidance makes discussion the ranking signal. The bulk
    of the feed is an AI Engineer conference upload dump, which is roster material rather than
    curated selection. Hacker News was dropped because every high-point thread today resolves to a
    primary source already covered in a topical section, and what remained was off-topic or
    low-signal Ask HN. Developer tools, Infrastructure, Agentic coding and Linux and kernel were all
    left empty for lack of anything that outranked what is already published. Watchlist follow-ups
    had no updates: the only open followup is f-0024 on coding-agent sandbox escapes, and nothing
    today advanced it.

    Access notes that need correcting. Two entries in access-notes are now wrong for this
    environment. an-0020 says reuters.com article bodies return 401 and are unreachable; today
    www.reuters.com returned the full article body including OpenAI's quoted statement and the
    November 12 shutoff date, so the Reuters route is currently readable and the note should be
    re-dated or closed. Separately, openai.com returned HTTP 403 on /index/openai-and-cursor/, so
    OpenAI's own blog post announcing the Cursor cutoff could not be read directly. The lead story
    therefore rests on Reuters quoting that post rather than on the post itself, which is why it is
    linked as primary. That 403 is not recorded in access-notes and should be added.

    Calls a reader could not infer. The Debian result is the winning option of a ranked vote, not a
    unanimous position: the LWN thread notes both anti-AI options finished below "None of the above"
    while roughly 30 percent of voters still preferred them. The GrapheneOS item is marked
    developing rather than confirmed on purpose. The partial port and the absence of memory tagging
    come from the project's own verified Bluesky account and are treated as fact, but the attributed
    motive, that Google cut the feature to save money, is the project's inference and Google has not
    responded. The Tencent Hy4 blurb deliberately omits the headline benchmark numbers: the 2.99 out
    of 4.00 score against GLM-5.3 and Kimi K3 comes from an evaluation Tencent ran internally with
    its own experts, which is a disclosed method but not a reproducible one, so the story rests on
    the architecture, context length and published pricing instead. The Proton report is dated
    2026-08-28 for an incident on 2026-08-27, so it is three days old, but it is a primary
    postmortem with a full timeline and root cause and it anchors Outages, which no other candidate
    did.

    Security was built from the GitHub advisories API rather than from any configured watchlist
    query. The three published stories are the qualifying advisories from the 2026-08-28 batch. The
    Manchester Airports breach claim of 8.7M records was left out: the only source in the pull is
    forgeeks.net at 2 points, with no vendor or regulator statement behind it.

    A real coverage gap. Go 1.27 was released on 2026-08-19 and appears in no digest in
    data/digests. That is a major language release with generic methods, encoding/json/v2,
    crypto/mldsa and experimental SIMD, and it was missed entirely at the time. Today's entry covers
    the follow-up Generic Methods post from 2026-08-26, which is the current item, and cites the
    release post alongside it. Publishing the eleven-day-old release as today's news would have been
    wrong, but the gap itself is worth the weekly review's attention.

    Backtest. The tool scored 56 candidates for 2026-08-29 but seeded zero causes, so there were no
    defaults to override and the miss_review entries are assertions rather than corrections. The
    five flagged as watchlist_gap are genuine engineering misses no query caught: htmx 4.0 at 788
    points, GLM-5.3 going open-weight at 696, the Sovereign Tech Agency Flatpak investment at 249,
    the HTTPX2 Python HTTP client at 120 with its migration writeup at 186, and EVE Online's Python
    3 migration at 280. The GLM-5.3 miss is the most consequential, since an open-weight release of
    that class is the same category as today's Hy4 lead. I found no false entity matches worth
    flagging: the Anthropic, Rust, GitHub and Stripe matches in the candidate list are all real. The
    large remainder of the list is genuinely out of scope, mostly US politics, climate, food recalls
    and general-interest science, and does not indicate a gap.

    This pass added 4 blocks and displaced nothing, taking the page from 6 to 10. `Top stories` goes
    from 3 to its cap of 5 and `Security` from 3 to 5, and `Security` sits outside both the
    per-section cap and the day budget. Nothing was removed because `Top stories` had two free
    slots, so the two new leads did not have to beat a published block.

    The lead changed. AB 1856 leads over Tencent Hy4, and the reason is evidence rather than
    subject. The bill text was read in full from the legislature's own site, and the Hy4 block rests
    on a vendor announcement whose headline score the published block already declines to carry. The
    kernel.org post takes second on the same basis, a primary record read in full carrying measured
    numbers.

    The AB 1856 finding a reader could not otherwise get. Every secondary headline on this story,
    including the Tom's Hardware one carrying the Hacker News thread at 477 points, says software
    under the GPL, MIT, BSD and Apache licenses is exempt. The bill names no license. Section
    1798.500(g)(2) excludes anyone distributing under license terms that permit a recipient to copy,
    redistribute, and modify, which is a functional test that a reader has to apply to their own
    license rather than look up in a list. Status is `developing` and not `confirmed` on purpose:
    the version read is "Amended IN Senate August 21, 2026", the page shows no enrolled or chaptered
    version, and this run did not read the vote record. The passage claim rests on the Tom's
    Hardware headline alone, because that article's body truncated before the text on the fetch size
    bound. The Digital Age Assurance Act it amends begins 2027-01-01, with a 2027-07-01 deadline for
    devices set up earlier.

    A collection gap this pass closed, and it is worth the weekly review's attention. The published
    `Security` section was built from the GitHub advisories API, and it missed both Qubes Security
    Bulletins. QSB-118 was on the Hacker News front page at 116 points and 47 comments when the
    earlier pass ran, and QSB-117 had been published the day before. Neither is in the advisories
    API because project-issued bulletins are not GitHub advisories. The security bar names vendor
    advisories and project release notes as primary sources, so the collector is narrower than the
    bar it serves, and an advisory-API-only security pass will keep missing signed vendor bulletins.
    QSB-117 is published despite Qubes saying it cannot assess the impact, because that statement is
    itself the finding, and because Intel withdrawing the Meteor Lake microcode leaves a class of
    machines with no fix.

    The weakest published item is the Sony Music and Warner Chappell suit. The earlier pass promoted
    it out of `Markets and companies` only to meet the floor of three in `Top stories`. That floor
    is now met twice over without it, and it is a filed complaint carried by two secondary reports.
    It keeps the fifth slot because two slots were genuinely free and demoting it would be churn
    rather than an improvement. A later pass with a stronger candidate should displace it rather
    than any other lead.

    Considered and left out. The Hacker News item titled "Claude Session URL appended to commit
    messages and PR descriptions by default" reached 84 points and 95 comments, and it is not news.
    The GitHub issue behind it was opened 2026-06-09, is a feature request, and is closed. An old
    closed issue resurfacing is not a change to the product, and the framing in the submitted title
    implies one. "Tether: iMessage, SMS, etc. on Linux" at 495 points was again not fetched, the
    second consecutive run to record that, and its Hacker News id is from 2026-08-24, so it is an
    older submission resurfacing. Zod v4.5 schema compilation is carried only by a link to a social
    post with no primary read. The Rust function overloading call for experimentation is a real
    primary on blog.rust-lang.org but is dated 2026-08-19 and drew 2 points, so it was not fetched.
    EVE Online's Python 3 migration, CPython adding RISC-V at tier 3, htmx 4.0 and GLM-5.3 are all
    archive, confirmed against `data/digests` this run rather than asserted.

    Backtest. The tool scored 56 candidates for 2026-08-29 and seeded zero causes, so there is no
    seeded default to override and `miss_review` is empty on purpose. The earlier pass today
    submitted five entries against the same zero-seeded run and all five were false positives
    resolving to published archive. Repeating that shape would add noise, not signal. The standing
    problem is unchanged and worth the review: the backtest scores against its own candidate list
    rather than against the published archive, so archive coverage reads as a miss.

    Degraded sources moved within the day and got worse. The published `Sources checked` line
    records Reddit at 7 of 28 subreddits from the earlier pass. The 14:32 UTC cache reports
    top-of-day reaching 2 of 28 and day coverage 9 of 28 against a floor of 14, a fifth consecutive
    degraded day. Reddit contributed nothing to this pass. The GitHub watchlist again returned a
    stars collection only, 2 items and neither a story, with no releases and no trending collection
    present, and the collector reports no degradation, so that gap is visible only as absent
    collections. Events returned empty for both upcoming and active. Books returned Springer
    conference proceedings and medical imaging volumes, so that section correctly stays down. Hacker
    News was not degraded on this pass.

    This is the fourth pass on 2026-08-30. The page arrived carrying 10 blocks, with Top stories at
    its cap of 5 and Security at 5. This pass adds 3 and displaces nothing, taking it to 13.

    Top stories is unchanged, and that is a decision rather than an omission. The third pass
    recorded that the Sony Music Publishing and Warner Chappell suit is the weakest published lead
    and that a later pass with a stronger candidate should displace it rather than any other lead.
    The Omarchy root escalation was the candidate tested against it, and it was placed in Security
    instead. The security bar states that widely deployed developer infrastructure outranks niche
    exposure, and Omarchy is niche exposure: a real default-configuration root escalation, but
    bounded to one distribution's users. Security sits outside both the per-section cap and the day
    budget, so placing it there costs nothing and displacing a published lead for it would have been
    churn. The suit keeps its slot by default, not because it got stronger.

    The Omarchy block does not duplicate the 2026-08-27 page. That page carries a critique of
    Omarchy's AI-generated shell glue under blog.happyfellow.dev with no version boundary stated.
    This is a separate vulnerability under a different primary, privately disclosed, with an
    affected range below 4.0.1, a proof of concept, a fix version, and a commit timeline from
    introduction on 2025-06-01 to removal on 2026-08-24. Both were checked against the archive
    before selection.

    Outages correctly stays at no major items found, and the reason is worth recording. Hacker News
    surfaced two Cloudflare status incidents today, f8ms50xkfn4t and 9g65dxfbcjln. The first was
    fetched and is dated 2026-08-17, started 19:34 UTC and resolved 20:44 UTC, minor impact across
    Los Angeles and Phoenix. It is a two-week-old resolved incident resurfacing as a submission, not
    a current outage. A status-page URL arriving through a discussion feed carries no date until it
    is fetched, so this shape will recur.

    The archive check caught a duplicate this pass. The strongest-looking new security candidate was
    the embracethered.com post getting code execution against Claude Code Opus 5 Auto Mode, which
    reads as major and was published only 2026-08-26. The 2026-08-29 page already carries it under
    the same primary URL with the same 60 to 80 percent attack success rate and the same Trajectory
    Labs 0.00 percent benchmark context. The Register write-up that appeared in today's pull is
    secondary coverage of that same research. This is the third consecutive day the select step has
    found archive collisions only by searching data/digests directly, which continues to point at
    the select step needing the archive check the gate performs.

    Tether is published with a caveat a reader cannot infer. The post is dated 2026-08-23 and its
    Hacker News id, 49415386, dates to 2026-08-24, so it is an older submission still on the front
    page at 514 points rather than a story breaking today. The 2026-08-29 and the earlier 2026-08-30
    passes both recorded that no step had fetched it and left it out on that basis. It was fetched
    in full this run and it clears the bar on implementation detail, so leaving it unresolved a
    third time was the worse option. Age is the demerit, and it is the weakest of the three
    additions.

    Considered and left out. Haiku R1/beta6 is genuinely released, but the news page carries only
    the release date, the two-year gap since beta5 and a pointer to separate release notes, so there
    was nothing to write a block from without a second fetch, and the digest has no section that
    fits a hobby OS release cleanly. The European Commission ProtectEU encryption-backdoor item
    reached 192 points but the only source in the pull is reclaimthenet.org, and no Commission
    primary was located, so it is not publishable as fact. Two contradictory Claude Code limit
    claims appeared, one bsky post saying weekly limits are permanently rising 25 percent and one
    twitter post saying limits drop 25 percent from September 14, both at 26 points, both social
    sources, neither with a primary, so both were dropped rather than reconciled.
    uecker.codeberg.page returned HTTP 502 on the GCC nested-function post, so that candidate could
    not be read. Bug Blindness was not restored: the third pass dropped it this morning for
    restating its own title, and nothing new was found to rebuild it from. Debian's generative-AI
    vote, EVE Online on Python 3, CPython on RISC-V, htmx 4.0 and GLM-5.3 are all archive, confirmed
    against data/digests rather than asserted.

    Backtest. The tool scored 56 candidates for 2026-08-29 and seeded zero causes again, so there is
    no seeded default to override and miss_review is empty on purpose. The third pass already
    recorded that submitting entries against a zero-seeded run produces assertions rather than
    overrides, and that all five of its entries resolved to published archive. The standing defect
    is unchanged: the backtest scores against its own candidate list rather than against the
    published archive, so archive coverage reads as a miss.

    Degraded sources. Reddit is degraded for a sixth consecutive day and got worse: top-of-day
    reached 2 of 28 subreddits and day coverage 11 of 28 against a floor of 14, and the content that
    did arrive is help-desk questions, so Reddit and social pulse stays down and contributed
    nothing. The GitHub watchlist returned a stars collection holding a single item and again
    carries no releases collection and no trending collection, so watchlist repo releases and
    github.com/trending were not checked. The collector reports no degradation itself, so that gap
    is visible only as absent collections, and it is now the third day running. Events returned
    empty for both upcoming and active. Books returned Springer conference proceedings, medical
    imaging volumes and an AI ethics handbook, so Books stays down. YouTube again carried no
    discussion object on any video and is mostly a conference upload dump, so New videos stays down.
    Hacker News was not degraded.

    Sections that stay omitted. ML research, Books, New videos, Reddit and social pulse, Agentic
    coding, Apple platforms, Infrastructure, Engineering posts, Markets and companies and Hacker
    News have no qualifying candidate this pass. Watchlist follow-ups stays omitted: the open
    follow-up on coding-agent sandbox escapes, f-0036, was the one this pass expected to advance,
    and the item that would have advanced it is the Auto Mode research already published on
    2026-08-29, so nothing new attaches to it today.
