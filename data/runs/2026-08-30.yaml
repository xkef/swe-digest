    rather than written from a quarter of the watchlist. The one item that did come out of Reddit is
    the Go generic methods post, which reached the digest through its go.dev primary source instead.

    Sections omitted and why. ML research was dropped deliberately. The arXiv pull is large but
    every candidate is an unreviewed preprint with no discussion signal, and the closest
    engineering-relevant items (SWE-Prime, MCR-Bench) carry benchmark claims I could not check
    against a reproducible setup. Books was dropped because the entire publisher feed this run is
    Springer conference proceedings and clinical or medical imaging volumes, with nothing that meets
    the technical-book bar. New videos was dropped because not one video in the YouTube pull carried
    an attached HN discussion object, and the guidance makes discussion the ranking signal. The bulk
    of the feed is an AI Engineer conference upload dump, which is roster material rather than
    curated selection. Hacker News was dropped because every high-point thread today resolves to a
    primary source already covered in a topical section, and what remained was off-topic or
    low-signal Ask HN. Developer tools, Infrastructure, Agentic coding and Linux and kernel were all
    left empty for lack of anything that outranked what is already published. Watchlist follow-ups
    had no updates: the only open followup is f-0024 on coding-agent sandbox escapes, and nothing
    today advanced it.

    Access notes that need correcting. Two entries in access-notes are now wrong for this
    environment. an-0020 says reuters.com article bodies return 401 and are unreachable; today
    www.reuters.com returned the full article body including OpenAI's quoted statement and the
    November 12 shutoff date, so the Reuters route is currently readable and the note should be
    re-dated or closed. Separately, openai.com returned HTTP 403 on /index/openai-and-cursor/, so
    OpenAI's own blog post announcing the Cursor cutoff could not be read directly. The lead story
    therefore rests on Reuters quoting that post rather than on the post itself, which is why it is
    linked as primary. That 403 is not recorded in access-notes and should be added.

    Calls a reader could not infer. The Debian result is the winning option of a ranked vote, not a
    unanimous position: the LWN thread notes both anti-AI options finished below "None of the above"
    while roughly 30 percent of voters still preferred them. The GrapheneOS item is marked
    developing rather than confirmed on purpose. The partial port and the absence of memory tagging
    come from the project's own verified Bluesky account and are treated as fact, but the attributed
    motive, that Google cut the feature to save money, is the project's inference and Google has not
    responded. The Tencent Hy4 blurb deliberately omits the headline benchmark numbers: the 2.99 out
    of 4.00 score against GLM-5.3 and Kimi K3 comes from an evaluation Tencent ran internally with
    its own experts, which is a disclosed method but not a reproducible one, so the story rests on
    the architecture, context length and published pricing instead. The Proton report is dated
    2026-08-28 for an incident on 2026-08-27, so it is three days old, but it is a primary
    postmortem with a full timeline and root cause and it anchors Outages, which no other candidate
    did.

    Security was built from the GitHub advisories API rather than from any configured watchlist
