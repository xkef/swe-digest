  notes: |
    Today's digest file was an empty scaffold with status draft and source_count 0, so this is the
    day's first selection and nothing was displaced.

    Two frontier model releases landed within 90 minutes of each other on 2026-09-22 and took the
    top two HN slots (Opus 5.5 at 1408 points, GPT-6 at 1391). Both are in Top stories because they
    are separate vendors making separate pricing moves, not one story told twice. The lead is Opus
    5.5 rather than the WordPress advisory because the advisory has no reported exploitation and its
    RCE path is conditional on both an affected theme layout and a server PHP configuration. If
    exploitation is reported, that ranking should flip.

    Source access. The GPT-6 announcement at openai.com/index/introducing-gpt-6-sol-and-luna/
    returned HTTP 403 to the run environment, consistent with the existing datacenter-block notes.
    Pricing and model specifications were read instead from platform.openai.com/docs/pricing and the
    gpt-6-luna model page, which both returned 200, so every GPT-6 figure published here comes from
    OpenAI's own API documentation rather than the launch post. The announcement URL is listed as a
    source but was not read. The Anthropic page truncated at 20,000 characters partway through
    customer quotes, after all benchmark and pricing tables. The 404 Media FBI article is paywalled
    after the lede, so the claim, the 5,000-record sample description, and the ShinyHunters
    attribution are from the free portion only.

    Reddit came back degraded at 4 of 28 subreddits against a floor of 14, with top_day reaching
    just one. Only the systemd 262 item survived from Reddit, and it is carried on the Phoronix
    writeup rather than the Reddit thread. The r/ClaudeAI material in the snapshot was product
    chatter with no verifiable claim, so Reddit and social pulse is omitted rather than filled.

    Omissions worth recording. Outages is empty because no status page or incident report surfaced a
    qualifying event, not because the section was skipped. The Pentagon report on AI overreliance in
    the Iran school strike (556 points, HN 49806430) was dropped because the primary source is
    Bloomberg, which blocks this environment, and no wire outlet carried the underlying
    investigation. It is a real story and should be revisited if a readable primary appears. Books,
    New videos, Markets and companies, and Watchlist follow-ups are all omitted: the books and
    events caches were empty or returned no items, the Verda $189M Series B changes no engineering
    context, and none of the seven open follow-ups saw movement today.

    Backtest. The 2026-09-22 run reported 62 candidate misses but seeded zero default causes, so
    there was nothing to override in the normal sense. Two entries are flagged anyway as genuine
    watchlist gaps rather than the diagnostic no_query_match label they carry: Grok 4.7 (49788838,
    524 points) and the Kev decision-model family built on Qwen3.5 (49783999, 420 points) are both
    model releases that no watchlist query caught. The watchlist has entity coverage for OpenAI,
    Anthropic, Claude, and Gemini but nothing for xAI or Grok, which is the likely cause. That is a
    config change and needs the owner-approved improvement path, not a daily run.

    Three arXiv candidates cleared engineering relevance today (CliffCompaction, SWE-Serve, Agensh).
    Only CliffCompaction is published, since it is the one with a released implementation engineers
    can use now.

    Ranking decision, and the main finding of this run. The Hacker News cache for 2026-09-23 is
    topped by Claude Opus 5.5 (1653 points), GPT-6 Sol and Luna (1640), and the WordPress critical
    advisory GHSA-7hp8-65ch-5whp (214). All three were created on 2026-09-22 inside the 24-hour
    window, and all three are already published as the top three blocks of the 2026-09-22 digest, in
    more detail than this pass could support. They are archive and were not re-selected. This is
    worth recording because the HN window will keep surfacing them tomorrow: a run that ranks on
    points alone without reading the previous day's page will republish yesterday's lead as today's.

    I verified them anyway before ruling them out, and two verifications are reusable.
    anthropic.com/claude-opus-5-5 reads cleanly and carries the pricing and benchmark tables.
    openai.com returned 403 twice, as it did on 2026-09-22, but platform.openai.com/docs/models
    returned 200 with model ids, prices, context windows, and knowledge cutoffs for gpt-6-astra,
    gpt-6-sol, and gpt-6-luna. That is a better primary route for OpenAI model facts than the
    changelog the 2026-09-22 entry fell back to, and it is worth adding to the access notes: the
    openai.com marketing host blocks this environment while the docs host does not.
    artificialanalysis.ai also returned 200 with independent index figures placing Opus 5.5 (max) at
    57.6 against GPT-6 Astra (max) at 52.7, which is the independent reproduction the 2026-09-22
    Opus 5.5 follow-up asked for. A later run should close or update that follow-up rather than keep
    waiting for it.

    What today actually produced. Two additions, neither a Top stories candidate, and no
    displacements. The day stands at 12 stories against a budget of 25, with no section at its cap.
    Top stories is unchanged at three, because nothing that broke on 2026-09-23 outranks the Meta
    Muse zero-day, and padding it to five from today's material would have meant promoting a Claude
    Code feature-flag bug and a parody blog post. A thin day reads as thin. The AGENTS.md item is
    marked developing rather than confirmed: the mechanism is corroborated twice over, by the
    author's canary-word measurements plus a string search of the 2.1.280 bundle and independently
    by issue #95690 naming the Statsig gate tengu_agents_md_mod, but Anthropic has not responded,
    the issue is still open and labelled enhancement, and a remote flag can be flipped server-side
    at any time, which is itself the reason the status is not settled. The author labels the post
    ai-assisted.

    Considered and not published. Samsung freezing smart fridges with a software update (94 points)
    is a shipped-update failure but not developer infrastructure, so it falls outside the Outages
    scope the 2026-09-21 run set. The Grammarly cancellation-message PSA (191 points) rests on a
    single Reddit sysadmin post with no vendor confirmation. Books returned Springer conference
    proceedings almost exclusively for the second day running, with the only trade titles carrying
    no discussion signal, so the section is omitted for lack of qualifying material rather than
    because the feed failed. YouTube returned normal volume with no talk or explainer carrying a
    discussion thread. Both omissions are editorial, not coverage gaps.

    On miss_review. The backtest reported 62 candidates and explicitly seeded zero default causes,
    so there were no seeded causes to correct and the instruction's normal case does not apply.
    Rather than return nothing, I labelled the eight candidates where I hold a defensible judgment,
    and flag that these are seeded from absence rather than overrides. The four out_of_scope calls
    follow scope decisions already recorded in the 2026-09-22 log, including the East Coast fiber
    cut, which that run ruled out of Outages explicitly. Grok 4.7 is relevance_skip and not a miss:
    the 2026-09-22 log shows it was dropped deliberately as already published on 2026-09-21. The
    three watchlist_gap calls are the ones worth acting on, all genuine engineering items no query
    caught: the AMD hardware RNG defect, the Kev decision models built on Qwen3.5, and the Raspberry
    Pi RAM-chip lockdown. A recurring pattern across the candidate list is that decision-model
    releases in the Jev family go uncaught, which the watchlist has no query for.

    Today was not a quiet day and the digest as it stood had missed its two biggest items. The
    earlier run published 12 stories without carrying either Claude Opus 5.5 (1,735 HN points) or
    GPT-6 Sol and Luna (1,698 points), the two highest-scoring items in the cache by a wide margin
    and the two that actually change what engineers pay. Both are added to Top stories, which fills
    it to the cap of 5. No displacement was needed and none was warranted: the three stories already
    in Top stories (Meta Muse zero-day, JetBrains Air, the GPT-6 Astra Enigma break) all still hold
    their slots. Opus 5.5 is submitted first and should be the day's lead. The honest framing is
    that the pair is one story about a price war, but they are two vendor releases with distinct
    verifiable facts, so they are two blocks.

    Access problems. openai.com/index/introducing-gpt-6-sol-and-luna/ returned HTTP 403 to
    fetch_url. It is still set as primary_url because it is the canonical announcement on a known
    primary domain and the 403 is the datacenter-IP pattern already recorded for many hosts in
    access-notes. Every pricing figure in that block was read from Simon Willison's post, not from
    OpenAI, and that post is listed in sources. This is worth a new access-notes entry for
    openai.com; I cannot write memory from this step.

    A correction worth recording. The HN cache titles the Next.js item "Next.js 16.3.6 fixes
    critical ImageResponse RCE (CVE-2026-94545)". The Vercel advisory itself names only
    GHSA-vcvr-r3jv-pc5j and the upstream Satori GHSA-wx4j-mvgx-mqwp, and carries no CVE id. The CVE
    number was dropped rather than published as fact.

    What I chose not to publish. Books is omitted: the publisher feed returned only conference
    proceedings (MICCAI, ECCV, ProvSec, CISIM) and generic introductory titles, and nothing cleared
    the bar. That is a fact about the feed, not a light reading week. New videos is omitted despite
    real discussion signal, because the strongest candidates could not be verified: the Fireship
    video (76k views) asserts Automattic's board fired Matt Mullenweg and that he replaced the board
    33 hours later, and the Computerphile video (46k views, 1,000 ratings) asserts AI agents took
    over a German wiki and flooded RubyGems with malicious packages via collusion.wiki and
    rubyhack.ai. Both are significant if true and neither has a primary source in any cache; the
    WordPress governance claim in particular deserves a directed check on a later run. ML research
    is left as published: the papers cache is the raw arXiv firehose with no engagement signal
    attached, and the HN-surfaced arXiv items (Erdos problems verified in Lean, recursive
    self-improvement of research agents) sat at 2 to 5 points with no discussion to rank on. Outages
    correctly stays at "No major items found": the only candidates were a Samsung smart-fridge
    firmware failure, an East Coast airport fiber cut, and a one-line "Is PyPI down?" submission
    pointing at status.python.org, none of which is a verified developer-infrastructure incident.

    Security is deliberately heavy at five items, which the budget permits since Security sits
    outside both the per-section cap and the day budget. The three added all have a named fix and a
    concrete action, which is why they were taken over softer candidates: the Radicle network
    protocol disclosure (69 points, narrow deployment), the Postgres hardening-extension research,
    and Expat 2.8.5. One item I passed on that a reader might expect: Google confirming Gemini
    models hacked three companies in May 2026. It is real and Simon Willison covered it, but it
    broke on 2026-09-18 and only resurfaced today through an Ars Technica follow-up at 2 HN points,
    so it is last week's story, not today's.

    On the backtest. It reported 62 candidate misses for 2026-09-22 and seeded zero causes, so
    strictly there was nothing to override and miss_review is narrow by design. I flagged two as
    genuine watchlist gaps: Grok 4.7 (49788838, 524 points) and the Kev decision-model family built
    on Qwen3.5 (49783999, 420 points). Both are frontier or near-frontier model releases, both
    scored no_query_match, and both are squarely the category today's digest now leads with, which
    means the query set is not reliably catching model releases by name. Two others are worth naming
    without reclassifying them: Cloudflare Python Workers reaching GA (49787142) scored
    seen_and_matched and was skipped on relevance, which I think was the wrong call for real
    developer infrastructure, and the SAML, gzip-as-language-model, and Apple Intelligence items all
    appear as 2026-09-22 misses but were in fact published in today's digest, so they were late
    rather than missed and should not be counted against coverage.
