date: '2026-09-23'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Today's digest file was an empty scaffold with status draft and source_count 0, so this is the
    day's first selection and nothing was displaced.

    Two frontier model releases landed within 90 minutes of each other on 2026-09-22 and took the
    top two HN slots (Opus 5.5 at 1408 points, GPT-6 at 1391). Both are in Top stories because they
    are separate vendors making separate pricing moves, not one story told twice. The lead is Opus
    5.5 rather than the WordPress advisory because the advisory has no reported exploitation and its
    RCE path is conditional on both an affected theme layout and a server PHP configuration. If
    exploitation is reported, that ranking should flip.

    Source access. The GPT-6 announcement at openai.com/index/introducing-gpt-6-sol-and-luna/
    returned HTTP 403 to the run environment, consistent with the existing datacenter-block notes.
    Pricing and model specifications were read instead from platform.openai.com/docs/pricing and the
    gpt-6-luna model page, which both returned 200, so every GPT-6 figure published here comes from
    OpenAI's own API documentation rather than the launch post. The announcement URL is listed as a
    source but was not read. The Anthropic page truncated at 20,000 characters partway through
    customer quotes, after all benchmark and pricing tables. The 404 Media FBI article is paywalled
    after the lede, so the claim, the 5,000-record sample description, and the ShinyHunters
    attribution are from the free portion only.

    Reddit came back degraded at 4 of 28 subreddits against a floor of 14, with top_day reaching
    just one. Only the systemd 262 item survived from Reddit, and it is carried on the Phoronix
    writeup rather than the Reddit thread. The r/ClaudeAI material in the snapshot was product
    chatter with no verifiable claim, so Reddit and social pulse is omitted rather than filled.

    Omissions worth recording. Outages is empty because no status page or incident report surfaced a
    qualifying event, not because the section was skipped. The Pentagon report on AI overreliance in
    the Iran school strike (556 points, HN 49806430) was dropped because the primary source is
    Bloomberg, which blocks this environment, and no wire outlet carried the underlying
    investigation. It is a real story and should be revisited if a readable primary appears. Books,
    New videos, Markets and companies, and Watchlist follow-ups are all omitted: the books and
    events caches were empty or returned no items, the Verda $189M Series B changes no engineering
    context, and none of the seven open follow-ups saw movement today.

    Backtest. The 2026-09-22 run reported 62 candidate misses but seeded zero default causes, so
    there was nothing to override in the normal sense. Two entries are flagged anyway as genuine
    watchlist gaps rather than the diagnostic no_query_match label they carry: Grok 4.7 (49788838,
    524 points) and the Kev decision-model family built on Qwen3.5 (49783999, 420 points) are both
    model releases that no watchlist query caught. The watchlist has entity coverage for OpenAI,
    Anthropic, Claude, and Gemini but nothing for xAI or Grok, which is the likely cause. That is a
    config change and needs the owner-approved improvement path, not a daily run.

    Three arXiv candidates cleared engineering relevance today (CliffCompaction, SWE-Serve, Agensh).
    Only CliffCompaction is published, since it is the one with a released implementation engineers
    can use now.
