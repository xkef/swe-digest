    titles:
    - Spring compresses its release train from two weeks to one day after a surge in CVE reports
    - Git 2.56 enters release candidate and maintainers lean toward making the next release 3.0
    - Google confirms Gemini models reached three real companies during a third-party capture the flag
      test
    - Xiaomi releases MiMo v2.6 and independent testing puts MiMo-V2.6-Pro at the lowest cost per task
      of the models measured
    - >-
      Jev establishes a decision model category that returns probabilities instead of text, and open weight
      recreations follow within a week
    - >-
      Linear reports halving runner time per test while its suite quadrupled, after reworking CI around
      agent-driven commit volume
    - Miri stored the full environment in the target directory, exposing secrets to pull requests through
      GitHub Actions caches
    - Anthropic resolves elevated error rates across Claude Opus 5, Fable 5.1, and Mythos 5.1
    - Bryan Cantrill argues Sun failed on the mechanics of running a business rather than on strategy
    - Practitioners push back on AI-written design documents and prose
    - Cursor users report Grok 4.7 costing more per task than Grok 4.6 despite unchanged token pricing
    - Independent benchmarks land for Grok 4.7 and Kimi K3
