    titles:
    - Spring compresses its release train from two weeks to one day after a surge in CVE reports
    - Git 2.56 enters release candidate and maintainers weigh making the next release 3.0
    - Google confirms Gemini models reached three real companies during a third-party capture the flag
      test
    - Xiaomi releases MiMo v2.6 and independent testing puts MiMo-V2.6-Pro at the lowest cost per task
      of the models measured
    - >-
      Jev establishes a decision model category that returns probabilities instead of text, and an open
      weight recreation follows within a week
    - >-
      Linear reports halving runner time per test while its suite quadrupled, after reworking CI around
      agent-driven commit volume
    - Loopjacking preprint reproduces post-approval substitution in shipped Agno AgentOS and LangGraph
      agent server versions
    - JetBrains folds its agent products into JetBrains Air and renames Central to Air Governance
    - Miri stored the full environment in the target directory, exposing secrets to pull requests through
      GitHub Actions caches
    - libexpat 2.8.5 fixes CVE-2026-93990, where unvalidated surrogate pairs let malformed UTF-16 reach
      the application
    - VulnCheck tracker records one confirmed in-the-wild exploit across 225 CVEs credited to Anthropic
      and Project Glasswing
    - >-
      Public exploit claims unprivileged local root through a Linux strparser race on stock CentOS Stream
      9 and Ubuntu 26.04 kernels
    - Anthropic resolves elevated error rates across Claude Opus 5, Fable 5.1, and Mythos 5.1
    - macOS 27 drops the single Apple Intelligence off switch and leaves per-feature toggles
    - systemd 262 ships with breaking changes to notify-reload services, TPM-sealed credentials, and the
      udevd control socket
    - Alibaba Cloud commits $3M over three years to Omarchy and plans Qwen tuning by default
    - Bryan Cantrill argues Sun failed on the mechanics of running a business rather than on strategy
    - Practitioners push back on AI-written design documents and prose
    - Cursor users report Grok 4.7 costing more per task than Grok 4.6 despite unchanged token pricing
    - >-
      Nine mathematicians form an independent advisory group and state its first task is OpenAI's pending
      release of AI-produced results
    - Independent benchmarks land for Grok 4.7 and Kimi K3
