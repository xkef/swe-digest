  notes: |
    First run of the day. The 2026-09-08 file was still the empty template, so nothing was displaced
    and the whole 25-story budget was open. Nine stories were selected against it, which is the day
    the sources produced rather than a cap being hit.

    Deliberate exclusions for duplication. The two loudest threads in today's Hacker News cache were
    already published. The LG smart TV investigation led the 2026-09-07 digest, and the vLLM
    speculative decoding post on AMD GPUs ran in that day's AI section, so neither was rewritten.
    The Asahi Linux M3 support story ran 2026-09-06, and the GNU strip trusting-trust attack on
    NixOS ran 2026-09-06 as well, with earlier context on 2026-08-29. Nature published its own
    account of the Fermat's Last Theorem formalization on 2026-09-07 and it surfaced overnight, but
    the underlying Anthropic announcement was covered on 2026-09-05. The Nature piece adds outside
    assessment from Kontorovich, Buzzard, and Litt and nothing else, which did not justify
    republishing the story on its own.

    Sections omitted for lack of qualifying material, not for lack of looking. AI produced no model
    release, policy change, or product change with a primary source this window, so the Mistral
    round went to Markets and companies where a funding event belongs and the AI section was left
    out. ML research had nothing: the papers cache came from the committed repo snapshot and holds
    generic cs.LG submissions with no engineering relevance. Books held only Springer conference
    proceedings for ECML PKDD and ICDF2C, which is a catalogue feed rather than a technical book
    release. New videos had one Fireship upload with a sponsor read and no discussion thread, which
    does not clear the bar. Agentic coding is empty only because its one strong item, the danluu
    eval, was strong enough for Top stories.

    Security and Outages both read as quiet on purpose. No vendor advisory, CVE, or supply chain
    incident cleared the bar this window. The two security-adjacent items in the cache were not
    publishable: a GitHub repository titled as a CrowdStrike Falcon privilege escalation zero-day
    with no vendor advisory or CVE behind it, and a Show HN of reconstructed Stuxnet source whose
    provenance is unverifiable. Cloudflare did log a real incident, Browser Isolation session
    initialization failures from 14:25 to 19:14 UTC on 2026-09-07, but it was marked minor impact
    against two services and does not meet the bar for a major outage.

    Calls a reader could not infer. The VDDK story is marked developing rather than confirmed
    because Broadcom has published nothing. What is verifiable is the downstream evidence: Microsoft
    added a warning to the Azure Migrate appliance documentation, Red Hat published a support
    article on 2026-08-27 stating customers cannot download the VDDK images, and Platform9 and
    ShapeBlue both wrote it up. The virtualizationhowto account is the source that assembles those,
    so it is cited as primary even though it is a secondary publication. The Swiss federal openDesk
    pilot, 3,000 workstations at CHF 9 million with a target of end 2027, was researched and then
    dropped: It's FOSS credits RTS without a link, and the Federal Council English media-release
    listing does not carry the 2026-09-03 publication, so no primary source resolved from this run.

    On the backtest. It reported 54 candidates and seeded zero causes, so nothing was overridden and
    every entry in miss_review is an addition rather than a correction. Six are genuine engineering
    misses no query caught: the Anubis WebAssembly write-up, the Swiss federal Microsoft migration,
    bzip3, WeatherNext 3, the Ladybird August newsletter, and the CodePen 2.0 keystroke reporting.
    Three high-volume entries are marked out of scope so the weekly review does not chase them. Two
    candidates were left unclassified on purpose. The Nitter item at 266 points was in fact
    published on 2026-09-07 under a different Hacker News id, so it is a false miss with no matching
    cause in the enum. The top candidate at 1,283 points, titled about qBittorrent breaking out of a
    sandbox, was not verified against any source this run and is not classified on a guess.

    Top stories is unchanged and this run displaces nothing. I ranked the four published top items
    against everything today's collection produced and nothing outranked them, so the section stays
    at four rather than being padded to the cap of five. The day goes from 9 stories to 12, well
    under the budget, and no section exceeds two.

    Four of the day's largest signals are archive, not misses, and the absence of each from today's
    page is deliberate. The LG smart TV investigation drew the single biggest HN number in the cache
    (1117 points on the notebookcheck thread, plus four further threads including the 135-minute
    Gamers Nexus video, an AppleInsider piece and a rooting post) but ran as yesterday's lead on
    2026-09-07. I re-read the notebookcheck writeup and LG still has not commented, so there is no
    new development to carry. The Fermat's Last Theorem formalization ran 2026-09-05 from
    Anthropic's own publication with Kevin Buzzard's independent compile and comparator run. Today's
    Nature news piece adds only outside reaction from Kontorovich, Buzzard and Litt, which is weaker
    than what the 09-05 block already carried, so I did not republish or open a follow-up. The
    GitHub unauthenticated-clone 401 change ran 2026-09-04. The community discussion has since
    gained a GitHub staff answer, but it states the same 403-to-401 rationale already published, so
    nothing was added. The trusting-trust NixOS paper ran 2026-09-06.

    Dropped on review: the CipherCue post putting Cloudflare at 89.6 percent of European companies
    with a detected CDN. It was the day's fourth-largest HN thread, the method note is unusually
    explicit, and it cites Cloudflare's own postmortems rather than secondary coverage. I left it
    out because the cohort is the vendor's own tracked entity set, the post states it is not a
    representative sample and skews to small and mid-sized companies where Cloudflare's free tier is
    strongest, and the vendor sells sovereignty intelligence to European competitors of the
    incumbent it measures. The concentration point is real but the number is not one a reader could
    rely on, and the commercial interest runs toward the conclusion.

    RustConf 2026 opened today and runs to 2026-09-11. Nothing from day one surfaced in any source,
    so there is no event story. The NVIDIA CUDA Rust post is unrelated to the conference despite the
    timing.

    Security and Outages are genuinely quiet rather than under-collected. No advisory qualified
    today beyond the 512-bit CA key factoring already published, and no status-page incident
    surfaced. The Outages "No major items found" line is accurate.

    miss_review: the backtest scored 54 candidates for 2026-09-07 and seeded no default causes, so
    both entries are my own calls rather than corrections. The Anubis WebAssembly post (49590611,
    343 points) came back no_query_match and is a genuine engineering miss no query caught, which
    makes it a watchlist_gap; Anubis is the proof-of-work gate that blocks this routine's own access
    to the linux-crypto lore archive, recorded in access-notes. Asahi Linux on M3 (49586698, 510
    points) was matched by the existing Asahi Linux entity and simply not selected, so it is a
    relevance_skip and not a gap.

    Lead change. The day's digest already carried 12 stories with CERN as the lead. Both items I
    added to Top stories outrank it, and Top stories now sits at exactly the cap of 5, so nothing
    was displaced. The OpenAI Navier-Stokes item should carry the day's headline, with the
    Alpoge/Buckmaster result immediately after it. The two are one event and read wrong in the other
    order: the second is the verified result, the first is the contested claim that arrived on top
    of it.

    Verification route for the lead, and what I could not read. openai.com returned HTTP 403 to
    every form of the URL I tried, so I never read OpenAI's own post and did not cite it as the
    primary. This is a new access-note host worth recording. Buckmaster's statement PDF at
    cims.nyu.edu/~tristanb/statement.pdf fetched successfully but came back as raw PDF bytes with no
    text extraction, so the document at the center of the dispute is also unread here. I therefore
    built the story on Scientific American, which I read in full: it is dated 2026-09-08, carries a
    named reporter, states OpenAI's claim, states Buckmaster's allegation, and carries OpenAI
    mathematician Sebastien Bubeck's on-record denial from a Tuesday press briefing, including that
    the Navier-Stokes solution did follow a similar method to the two mathematicians' while the
    Euler result did not, and that the proof was developed over the weekend. That is enough to
    publish as developing and not enough to publish as fact in either direction. Status stays
    developing and the article itself is flagged by its editor as breaking and subject to update.

    What I deliberately did not publish. HN carried a submission titled to the effect that OpenAI
    took mathematicians' private research from their Codex chats. Nothing I could verify supports
    that specific mechanism, Bubeck denies using their prompts or proofs, and the claim is
    defamatory if wrong, so it is out. The HN comment quoting 4.9 million agent messages and about
    300 billion output tokens is also out, because its only source is the OpenAI post I could not
    load.

    The second Top story is the solid one. Buckmaster's own Mastodon account announced three results
    and links only to his own cims.nyu.edu domain and his own GitHub repository, so attribution is
    clean. Terence Tao posted an independent assessment the same day naming the Cordoba and
    Martinez-Zoroa approach, confirming 3D incompressible Euler with a smooth forcing term,
    confirming the Lean formalization, and confirming that the authors released far earlier than
    planned because of external events. The repository github.com/tristanbuckmaster/fluid_lean
    resolves with affinecore, boussinesq-blowup and euler-blowup directories. Note the scope
    carefully: this result is blowup with forcing for Euler and two related systems, which is not
    the unforced Navier-Stokes Millennium problem itself.

    Calls a reader cannot infer. FreeBSD 14.5 and the CipherCue analysis of European CDN
    concentration both wanted the last Infrastructure slot and only one fits under the cap of 4. I
    took FreeBSD. CipherCue had far more HN attention, 369 points against 66, and an unusually
    honest method note, but its headline figure of 89.6 percent Cloudflare across 44,143 companies
    is its own tracked dataset, is explicitly not a representative sample, skews to small and
    mid-sized companies where Cloudflare's free tier is strongest, and lands close to the W3Techs
    figure of 84.1 percent it cites. It is also published by a vendor selling a
    European-alternatives directory. FreeBSD 14.5 is a thin release by its own announcement, which
    says the focus is maintenance and there are few new features, but the end-of-life dates are
    concrete and actionable for anyone running 14.x. Popularity lost to actionability.

    Sections left empty on purpose. Reddit and social pulse is omitted again: coverage reached 12 of
    28 subreddits against a floor of 14, and both top_day and hot reached only 1 of 28. ML research
    is omitted because the day's genuine paper is the Alpoge and Buckmaster work, which sits in Top
    stories, and nothing else in the arXiv pull cleared the bar. New videos is omitted: the
    strongest video of the day is the Gamers Nexus LG investigation, and that is already carried as
    the LG story through The Verge, which is the readable route since youtube.com/watch cannot be
    verified by fetch from here. Agentic coding is empty because the only candidate was a small
    prompt-skill repository. Markets and companies stays empty beyond the Mistral raise already in
    Top stories, because two candidates I would have wanted, a reported OpenAI 2025 loss figure
    ahead of an IPO and a new class action against Anthropic over its treatment of power users, both
    needed a fetch I did not have a resolvable URL for. Both are worth a query next run.

    Missed on purpose but flagged. Today was Microsoft Patch Tuesday and The Verge's index line
    describes it as another record month. I could not verify a patch count: msrc.microsoft.com is a
    known 403 from this environment and I declined to guess article URLs after one 404. Security
    therefore does not carry Patch Tuesday, which is a gap rather than a quiet month.

    Backtest. The tool seeded zero default causes for 2026-09-07, so miss_review carries my own
    reading rather than corrections. I mapped not_in_publish_fetch on genuine engineering items to
    scrape_gap, no_query_match on genuine engineering items to watchlist_gap, and the one
    seen-and-matched real story, Asahi Linux on M3, to relevance_skip. Two of the flagged misses
    recur today: the trusting-trust paper is published in this run, and bzip3 was picked up by the
    earlier run, which suggests the gap is in the fetch and query coverage rather than in ranking.
