date: '2026-10-07'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    First run of 2026-10-07. No digest existed for the day, so nothing was re-ranked and `displace`
    is empty. The `story` inbox was empty, so no owner requests fed this selection.

    Source coverage. HN, papers, youtube, books, stars and events all came back clean. HN pooled
    today's committed snapshot into every collection, adding 4 front_page, 4 top_day, 2 ask_hn, 4
    show_hn, 6 comments and 7 query items. Reddit is the one degraded source and it fell well short:
    top_day reached 1 of 28 subreddits and day coverage reached 6 of 28 against a floor of 14.
    Pooling recovered 20 top_day items, which is why a usable Linux and r/programming signal exists
    at all. Stars (gh-events) and events (watchlist) returned zero items but were not degraded, so
    there is no GitHub-stars or conference signal today and that is a real quiet, not a gap.

    Omitted sections and why. `Reddit and social pulse` is omitted deliberately. With 6 of 28
    subreddits reached, the surviving items are a Phoronix-link cluster from r/linux (Ubuntu 27.04
    ntpd-rs, Meta CRAM, Zswap patches) whose primaries I did not fetch, and publishing a thin pulse
    section off one-quarter coverage would misrepresent the day. `Linux and kernel` is omitted for
    the same reason, with the one Linux-adjacent item that cleared verification (the twelve X.Org
    and XWayland CVEs) placed in Security where it belongs. `Books` is omitted: the books fetcher
    returned a clean set, but every item is a Springer LNCS conference proceedings volume (ESORICS
    2026, ECCV 2026, Static Analysis, Runtime Verification and similar), and proceedings volumes are
    not technical-book releases under the Books bar. `New videos` is omitted: the youtube cache is
    healthy and full of Java conference talks and AI-engineering panels, but none of them carried an
    external discussion thread, and the New videos bar ranks on exactly that rather than on upload
    volume. `Developer tools` is omitted because the two candidates with real HN signal, AnyPS5 (218
    points) and State of Devs 2026 (131 points), were not verified against primary sources and the
    section would have been padding.

    Fetches that failed. openai.com returned HTTP 403, so the "Sharing AI progress in mathematics"
    announcement could not be read. I verified the OpenAI math story against github.com/openai/math
    instead, which is the better primary anyway because it carries the actual counts, the licence,
    the production method and OpenAI's own verification caveats. security.googleblog.com rate
    limited this run on two attempts, so Google's own post on the counterfeit certificates could not
    be read and that story is sourced to Dan Goodin's Ars Technica report, which quotes Google's
    statement directly. reuters.com returned HTTP 401. That cost one Security candidate: South
    Korea's president stating that AI agents appear to have been used in the country's bank hacks
    (HN 49985861, 68 points). It is plausibly a significant item about agentic offensive capability,
    and it is excluded only because I could not resolve the primary and will not publish an
    unverified link. Worth a retry on a later run.

    Calls a reader could not infer. The Mistral Large 4 URL in the HN front_page cache entry carries
    a trailing backslash and does not resolve. The clean URL came from item 49978116 and was
    verified. The 3SUM and APSP preprint is filed under `ML research` because that is the only
    paper-bearing section in the schema. It is a cs.DS and cs.CC result with no machine learning
    content, and the fit is wrong. Worth raising as a config improvement if theory papers recur. Two
    items were held at `developing` rather than `confirmed` on purpose: the OpenAI manuscripts,
    because OpenAI itself states results sit at different verification stages and that unformalized
    ones may have issues, and the 3SUM and APSP paper, because it is a 76 page unreviewed preprint
    refuting hypotheses that a large literature depends on. The JetBrains figures are unconsolidated
    Czech-entity statutory accounts reaching the page through an aggregator of the Czech business
    register, and I put that caveat in the story body rather than leaving a reader to assume they
    are group consolidated results.

    Backtest. 63 candidate misses against 2026-10-06 and zero default causes seeded, so there were
    no seeded causes to correct and the three ids in `miss_review` are flagged as genuine misses
    rather than overrides. 49969183, Reflection's Beam 501B open-weight model at 545 points, is the
    clearest: a large open-weight model announcement is squarely in scope and no query caught it. I
    verified it today and carried it in AI. 49963171, at 586 points, is Cloudflare's Web Search API,
    a developer-infrastructure launch that is plainly in scope. I could not resolve its primary URL
    (blog.cloudflare.com/web-search-api/ and developers.cloudflare.com/ai-search/web-search/ both
    404), so it stays off the page rather than being published on a guessed link, but the watchlist
    gap is real and the HN thread's substance is a licensing constraint engineers should know about,
    namely terms forbidding storage or resyndication of search output. 49977072, JetBrains, I
    verified and published today. The remaining high-point misses are correctly out of scope: three
    Nobel Prize threads, a Montana license-plate item, the Paramount and Warner Bros. Discovery
    merger, and a set of opinion pieces including "Open Source as We Know It Is Dead" and
    "Friendship ended with Deno".

    One pattern worth tracking rather than publishing as a claim. Three separate items today involve
    AI-found security bugs reaching maintainers: the OpenSSH release notes say the team is shipping
    more frequently because AI-discovered bugs get independently rediscovered, the twelve X.Org CVEs
    came from ZDI with AI assistance, and Phoronix's sidebar shows IBM and Red Hat reporting more
    than 400 new vulnerabilities in Java code. That is three data points, not a trend, and it is not
    written into the digest as one.

    Second selection run on this date. A digest for 2026-10-07 already existed with 14 stories, so
    this run ranked what the page carries against what collection produced and added five items plus
    one Sources checked correction. Nothing was displaced. Nothing found today outranked a published
    block, and the day budget had room, so re-ranking was not needed. Non-Security story count goes
    from 13 to 17 against the cap of 25. Developer tools opens at 1 of 4, AI goes to 3 of 4, Outages
    fills from the anchor placeholder to 1, Security goes to 2 and is outside both caps.

    Archive checks killed most of the day's loudest candidates, and this is the main finding of the
    run. Mistral Large 4 at 1903 points, Polars 2.0 at 430, EmbeddingGemma 2 at 369 and Gleam 1.19.0
    at 302 all ran on 2026-10-06. mold 3.0.0 at 235 and the Danish CPR register breach at 475 ran on
    2026-10-05. The malicious @subql/common 5.8.3 compromise ran on 2026-10-06. I verified each of
    those against its primary source before finding it in the archive, so the work is not lost but
    none of it is publishable. A reader of today's page cannot tell that the biggest Hacker News
    items of the window were deliberately excluded as already published rather than missed, which is
    the main thing this log should carry.

    Backtest against 2026-10-06 returned 63 candidate misses and seeded zero default causes, so
    there were no seeded causes to correct and miss_review is empty. I checked the plausible
    exceptions rather than leaving them unexamined. mold 3.0.0 at 235 points carries the
    seen_and_matched evidence label and is not a miss, because 2026-10-05 published it as its own
    story. The Danish breach at 475 points and Reflection's Beam at 538 points were both published
    on 2026-10-05. The JetBrains filings at 371 and 576 points were published earlier today. Of the
    remaining high-point candidates, the three Nobel Prize items, the Earth's dominant species
    thread, the SF flattest route tool, the house lamps post, the diesel price item, the German spy
    chief arrest, the SEC quorum item and the Paramount merger are out of scope for an engineering
    digest at the base rate, and I did not flag them because no cause was seeded to correct.

    Degraded coverage. Reddit is the only degraded source this run, and it fell further than the
    earlier run recorded: hot reached 1 of 28 subreddits and day coverage reached 7 of 28 against a
    floor of 14. One quarter coverage does not support a Reddit and social pulse section and the
    omission stands. Hacker News, papers, books, YouTube, stars and events all returned degraded
    empty. Hacker News pooling added 40 front_page, 33 top_day, 13 ask_hn, 21 show_hn, 58 comments
    and 91 query items from the 13:24 UTC snapshot, which is a healthy fetch.

    Pages that would not load. openai.com returned HTTP 403 again, consistent with the earlier run,
    so the mathematics announcement still rests on github.com/openai/math. reuters.com returned HTTP
    401, which is the recorded behaviour for that host. security.googleblog.com now resolves but its
    index is JavaScript rendered and returned only navigation chrome with no post list, so Google's
    own statement on the counterfeit certificates remains unread and that story's Ars Technica
    sourcing stands. The access note for developer.chrome.com records a 403 and should be
    re-verified, because it returned a full article body on this run and the JPEG XL story rests on
    it. The xorg-announce October thread index resolves and shows the X.Org security advisory
    alongside the xorg-server 21.1.25 and xwayland 24.1.14 announcements, which corroborates the
    patched versions in the published X.Org story, but no permalink to the advisory message itself
    was resolvable, so the CVE enumeration still rests on the Phoronix report alone.

    Not published, where the absence is the finding. South Korea's president stating that AI agents
    appear to have been used in the country's bank hacks, at 95 points, has no readable source from
    this environment and is left off for a second run. The two arm64 compiler optimization bugs
    hitting curl, at 51 points, were left off deliberately: the curl maintainer's own Mastodon post
    names GCC 15 and 16 and Rust as the culprits, but the linked curl issue 23237 is labeled
    not-a-curl-bug and its body shows only valgrind uninitialised-value reports against OpenSSL and
    quiche, with no GCC or Rust bug identifier, so the compiler-bug diagnosis could not be verified
    from a toolchain bug report. IBM and Red Hat reporting more than 400 new vulnerabilities in
    popular Java libraries has a Phoronix headline and date but no CVE list, no affected libraries
    and no patched versions, which does not meet the Security bar of stating affected version,
    patched version, exploitation status and mitigation. The Linux and kernel section stays omitted:
    Meta's Compressed RAM was published on 2026-10-06, and the remaining Phoronix cluster covering
    Zswap patches, Ubuntu 27.04 defaulting to ntpd-rs, Google's Kage driver isolation using
    in-kernel LFI sandboxes, Huawei's XMFS and Qualcomm's QPaCE all trace to kernel list threads,
    and lore.kernel.org sits behind a proof-of-work gate from this environment. State of Devs 2026
    at 226 points and AnyPS5 at 331 points were again not verified against primaries and remain off.
    The subquadratic 3SUM and subcubic APSP preprint is already on the page under ML research.

    One judgment call a reader could not infer. The DNS root KSK rollover was promoted to Top
    stories on a four-day deadline and a total-resolution failure mode rather than on discussion
    volume, where it scored 5 and 7 points across two threads. That is the clearest case this month
    of ranking on operational impact against popularity, and it is the kind of item the per-source
    bars would pass over. Its load-bearing fact, the 2026-10-11 switch date, comes from Cloudflare's
    post and not from IANA. I fetched iana.org/dnssec/ceremonies to check: it confirms KSK-2024 was
    generated on 2024-04-26 and imported on 2024-07-17 and that KSK-2017 is scheduled for deletion
    on 2027-04-29, but the quarterly ceremony list has no entry near 2026-10-11, because the signing
    switch is an operational change rather than a ceremony. The story states the sourcing split.
    IANA's trust anchors and rollovers page was not fetched and is the one source that would make
    the date primary.
