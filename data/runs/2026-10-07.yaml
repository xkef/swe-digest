    Not published, where the absence is the finding. South Korea's president stating that AI agents
    appear to have been used in the country's bank hacks, at 95 points, has no readable source from
    this environment and is left off for a second run. The two arm64 compiler optimization bugs
    hitting curl, at 51 points, were left off deliberately: the curl maintainer's own Mastodon post
    names GCC 15 and 16 and Rust as the culprits, but the linked curl issue 23237 is labeled
    not-a-curl-bug and its body shows only valgrind uninitialised-value reports against OpenSSL and
    quiche, with no GCC or Rust bug identifier, so the compiler-bug diagnosis could not be verified
    from a toolchain bug report. IBM and Red Hat reporting more than 400 new vulnerabilities in
    popular Java libraries has a Phoronix headline and date but no CVE list, no affected libraries
    and no patched versions, which does not meet the Security bar of stating affected version,
    patched version, exploitation status and mitigation. The Linux and kernel section stays omitted:
    Meta's Compressed RAM was published on 2026-10-06, and the remaining Phoronix cluster covering
    Zswap patches, Ubuntu 27.04 defaulting to ntpd-rs, Google's Kage driver isolation using
    in-kernel LFI sandboxes, Huawei's XMFS and Qualcomm's QPaCE all trace to kernel list threads,
    and lore.kernel.org sits behind a proof-of-work gate from this environment. State of Devs 2026
    at 226 points and AnyPS5 at 331 points were again not verified against primaries and remain off.
    The subquadratic 3SUM and subcubic APSP preprint is already on the page under ML research.

    One judgment call a reader could not infer. The DNS root KSK rollover was promoted to Top
    stories on a four-day deadline and a total-resolution failure mode rather than on discussion
    volume, where it scored 5 and 7 points across two threads. That is the clearest case this month
    of ranking on operational impact against popularity, and it is the kind of item the per-source
    bars would pass over. Its load-bearing fact, the 2026-10-11 switch date, comes from Cloudflare's
    post and not from IANA. I fetched iana.org/dnssec/ceremonies to check: it confirms KSK-2024 was
    generated on 2024-04-26 and imported on 2024-07-17 and that KSK-2017 is scheduled for deletion
    on 2027-04-29, but the quarterly ceremony list has no entry near 2026-10-11, because the signing
    switch is an operational change rather than a ceremony. The story states the sourcing split.
    IANA's trust anchors and rollovers page was not fetched and is the one source that would make
    the date primary.

    Ranking. This run reopened Top stories because the HN cache was fetched at 20:49 UTC, well after
    the previous pass closed at its 17:21 UTC read of githubstatus.com, and two frontier-vendor
    items posted at 18:00 and 18:01 UTC were therefore invisible to every earlier run of this date.
    Top stories goes from four to the cap of five, and the only story demoted is the OpenAI
    mathematics manuscripts, which moves to AI rather than off the page. It lost its Top slot
    because it is developing and nothing a reader does about it changes before formalization and
    review land, where the four items above it each carry a deadline, a patch action, or a price
    change already in effect. Nothing was removed from the day, so `displace` is empty. It was the
    loudest item of the window at 1192 points and 1349 comments, and demoting it is a deliberate
    refusal to rank on volume.

    NetScaler placement. CVE-2026-88771 is a ten-day-old disclosure, so it is not an event of this
    date, and I put it second anyway because active exploitation is the strongest signal in the
    ranking rules and this one has a CISA due date of 2026-09-30 that has already passed. Security
    sits outside the per-section cap and the day budget, so Security was not where the decision cost
    anything. Top stories was, and the item earns it on the point a reader is most likely to get
    wrong: upgrading does not remove an exfiltrated ns.conf, a dropped web shell, or a staged
    implant. Sourcing is deliberately layered. The CVE, the affected products, the unauthenticated
    arbitrary-command impact, the KEV dates, and the BOD 26-04 triage requirement come from CISA's
    catalog, which rendered fully. The Citrix bulletin and article CTX697096 are cited from CISA's
    reference list rather than read, because support.citrix.com returns only a loading placeholder
    from this environment. The exploitation detail, the 1,069 attempts, the 30 source IPs, the
    operator separation, and the log-channel command-and-control technique come from huntback.io, a
    vendor deception-network blog and first-party for its own honeypot telemetry. That post is
    unusually careful about its own limits, stating that the figures are attempts on decoy sensors
    rather than confirmed compromise of production appliances and that operator separation is not
    attribution to a named group, and the story carries both caveats. The fixed build numbers rest
    on the huntback post alone, since the Citrix page would not load, and that is the weakest link
    in the entry.

    A correction a reader of the page could not infer. "GPT-6 and Intelligent UI for everyone" was
    the obvious big launch of the evening at 316 points, and it is left off.
    developers.openai.com/changelog shows the GPT-6 API family already shipped in September: Astra
    on 09-03, Sol and Luna on 09-22, GPT-6.1 Sol on 09-29. The only OpenAI changelog entry for
    2026-10-07 is an update to the chat-latest snapshot pointing at the newest ChatGPT model, which
    is not a story. So today's post is a consumer ChatGPT rollout and a UI feature, not a model
    release, and openai.com returned 403 on both the announcement and the companion model guide, so
    I could not read what it actually claims. Publishing it would have meant implying a release that
    the vendor's own changelog contradicts. The absence is the finding here, and anyone reading only
    the headlines would draw the opposite conclusion.

    Claude Haiku 5.5 verified completely against anthropic.com, which is why it carries specific
    prices rather than the vendor's own "75 percent less" framing. The 90 percent and 50 percent
    figures are the stated per-tier cuts, and the 75 percent average is Anthropic's blend that also
    accounts for the new tokenizer using slightly more tokens per task. The Sonnet 5.5 cache-read
    halving is the part most likely to matter to readers who never touch Haiku, since it needs no
    migration, so it is in the entry rather than left implicit. All benchmark figures on that page
    are vendor-run and the entry says so.

    Not published. The two kubernetes.io October posts, on node swap and on the cgroup v2 shift, are
    official project primaries and would have filled an otherwise empty Infrastructure section, but
    every article URL returns the blog index navigation with no article body from this environment,
    so neither could be verified and both are off. Linux and kernel stays omitted for the third pass
    on this date. The GitHub releases and trending coverage gap recorded by the earlier pass is
    still open, because no fetcher for either source exists among this step's tools, so any release
    across the 40 watchlist repos remains unrepresented.

    Backtest. 63 candidate misses against 2026-10-06 and zero default causes seeded this run, so
    `miss_review` records only the two exceptions worth correcting, both scored no_query_match yet
    both genuine engineering stories the watchlist should have matched. 49977072, the JetBrains
    statutory filings, is confirmed as a real gap by its publication on this page. 49963171,
    Cloudflare's Web Search API, is a real gap even though it remains unpublishable, because both
    candidate primaries returned 404 on the earlier pass. I did not flag 49969183, Reflection's
    Beam, despite its 538 points: it was already published on 2026-10-05, so it is not a miss. The
    remaining high scorers are Nobel prizes, a plague case, lamps, and trucking bankruptcies,
    correctly unscored and out of scope.

    Memory. Five open follow-ups were read and none had a dated development today. This step holds
    no memory write capability, so two items worth recording are flagged here instead: the GitHub
    incident pair on this date now has a published resolution and a stated reoccurrence relationship
    with a root cause analysis still pending, and CVE-2026-88771 warrants a follow-up for the Citrix
    bulletin that could not be read from this environment and for whether the fixed build numbers
    hold.
