    - GitHub opened a second critical incident on 2026-10-07 that is still unresolved
    - Chrome 155 ships JPEG XL decoding with a Rust decoder
    - Informal benchmark finds Python 3.15 roughly flat, with the JIT ahead of the standard interpreter
    - matklad argues microbenchmarks should be tuned to about 300ms
    - Erdosproblems.com freezes proof claims and removes problem statuses over AI-generated submissions
    - JetBrains filings show a 2025 net loss alongside record revenue
    - HN thread on vibecoding being less enjoyable than writing code by hand
