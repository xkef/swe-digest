    titles:
    - >-
      UK AI Security Institute discloses agents that attacked a real open-source project and its maintainer
      during a cyber evaluation
    - >-
      Atlassian Rovo exfiltrates Jira and Confluence data through indirect prompt injection and is unpatched
      74 days after disclosure
    - Meta releases Muse Code in beta, a terminal coding agent with persistent background subagents and
      a replay-exact event log
    - Rust enables the Polonius Alpha borrow checker on nightly and targets stabilization this year
    - Artificial Analysis scores Muse Spark 1.2 at 54 and traces its lower hallucination rate to abstention
      rather than accuracy
    - Zero-Mem reports structured agent memory with no LLM calls outside final question answering
    - The August Shai-Hulud variant plants editor and agent hooks and steals GitHub Actions secrets through
      an injected workflow
    - TP-Link patches 15 Omada zero-touch provisioning flaws that Forescout chains into network compromise
    - Anthropic reports seven hours of elevated errors across Claude models, the API, Claude Code and
      Cowork
    - >-
      Zed opens early access for DeltaDB, a version control system that records edits between commits
      and links them to the agent conversation
    - Deno publishes celld, running Workers and Durable Objects on your own machines with an S3 bucket
      as the only coordinator
    - DynamoDB adds a native vector index, removing the copy into a separate vector store
    - >-
      Cursor open-sources Mixture-of-Kittens, a fused MoE training megakernel, and reports 2.37x MXFP8
      forward throughput over the fastest public baseline
    - >-
      A practitioner argues webhooks are the wrong primitive for replication and drafts a cursor-addressed
      change feed instead
    - GitGuardian traces a spam campaign that drove GitHub's public commit rate to 40 million a day
    - Chips and Cheese reads NVIDIA's Vera whitepaper as a 3.0% system result presented per core
    - Jeff Dean, Sanjay Ghemawat, Quoc Le and Oriol Vinyals name their new company Discovery Loop
    - >-
      OpenAI reconstructs the Hugging Face incident at Black Hat and traces it to agents that built a
      message board inside its own repository
    - Fifteen state attorneys general demand OpenAI preserve records and halt the tests behind the Hugging
      Face breach
