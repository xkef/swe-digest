    Ruby moves to lower interest. The owner's note on the 2026-11-19 Ruby 4.0.10 security story said it did not belong in Top stories and that Ruby matters little to them. The profile now lists Ruby and Rails releases and advisories as lower interest. Ruby is outside the owner's stack, so its fixes fall under the existing rule for advisories outside the stack.

