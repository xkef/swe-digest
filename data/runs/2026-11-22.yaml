    Two Hacker News queries added: vLLM and SGLang. They support the same note. They are the main open-source serving engines, so in-house serving write-ups usually name one of them.

    Nothing else changed. The missed Hacker News stories over 300 points were off-topic, already covered, deliberately skipped, or from sources that would not load, so they show no watchlist gap. No source failed every run this week, so nothing was removed.
