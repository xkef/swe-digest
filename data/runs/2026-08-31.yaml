  notes: |
    Quiet day, and the page should read that way. Five stories selected against a budget of 25.

    This is the first run of 2026-08-31, so there is no digest to displace from and `displace` is
    empty.

    The dominant fact of this run is archive collision, not a thin front page. Hacker News was clean
    and the front page was strong, but most of the strongest items are already published. Creepy
    Crawlies, QSB-118 and the Omarchy docker-group root escalation are all on the 2026-08-30 page.
    Kubernetes v1.37 is on 2026-08-27, UniBLEed on 2026-08-28, OpenAI ending the Cursor partnership
    on 2026-08-29, and the METR and Redwood Hugging Face investigation on 2026-08-27, which makes
    the 244-point Zvi post secondary commentary on published work. The Debian general resolution
    itself is the 2026-08-29 lead. Every one of these was checked against `data/digests` rather than
    assumed.

    `Security` and `Outages` both stand down to the anchor line, and in both cases the absence is
    the finding rather than a quiet day. On security, the one new candidate was CVE-2026-82329,
    submitted as a critical JFrog Artifactory authentication bypass. Both cve.org and nvd.nist.gov
    returned JavaScript shells with no record text, the Hacker News submission carried it at 4
    points with no vendor advisory linked, and no JFrog advisory was locatable. An unverified
    critical CVE against widely deployed artifact infrastructure is exactly the shape that should
    not be published on a submission title alone, so it is left out and flagged here for a later
    pass. On outages, both candidates that surfaced are stale rather than current. The Cloudflare
    Workers Builds incident that reached Hacker News today is yj2zk6n6rz1c, started 2026-08-27 21:19
    UTC and resolved 22:58 UTC with minor impact. The GitHub Actions and Pull Requests incidents
    behind the Reddit thread and the Cursor Origin framing resolved on 2026-08-26 and 2026-08-27.
    The githubstatus.com history page renders client-side and returned no incidents, so the RSS feed
    was used instead, and it shows nothing after 2026-08-27.

    Calls a reader of the finished page could not infer. The Asahi block is `developing` on purpose:
    this is a v1 series posted for review that depends on five other in-flight series, and the
    author states it should probably go through the thunderbolt tree once reviewed. The limitations
    in that block are the maintainer's own words, not inference. The Debian block deliberately
    paraphrases rather than quotes. The retirement message carries profanity and a political
    characterisation of the technology, and neither is a fact the digest can assert, so the block
    states what he cited as his reason and leaves the rhetoric in the source. His status as a
    seconder of Proposals A and C is taken from the ballot page, not from the message, and it is
    what makes the departure more than one anonymous complaint. The Hacker News thread title on that
    item, "Debian developer resigns after corporate LLM use without disclosure wins vote",
    misdescribes the outcome, since the winning option was Haber's Responsible Use of Generative AI,
    so the thread is linked as discussion only and its framing is not adopted.

    Considered and left out. "P99 0 ms autocomplete for 240M domain names" reached 75 points and is
    a genuinely good implementation write-up, with a trie head over the Tranco million, a
    memory-mapped delta-compressed block index over 240M CZDS names in 2.5 GB, and honest load-test
    numbers. It is dated 2026-06-22, so it is a ten-week-old post resurfacing, and the 2026-08-30
    page already took a demerit for publishing a seven-day-old item as current. The Zig ArrayList
    pointer-stability devlog entry is blocked again for the reason the 2026-08-30 notes recorded:
    the gate normalizes the fragment away and treats all of ziglang.org/devlog/2026/ as one source
    already used on 2026-06-26 and 2026-07-05, and no per-entry primary exists. `Languages and
    runtimes` is omitted as a result, for the second consecutive day, and this is a structural
    defect in the archive check rather than an editorial call. The EU AI Act enforcement item
    reached 37 points and 77 comments but rests entirely on tokenstead.ai, an aggregator with no
    Commission primary located, so it is not publishable as fact. Two contradictory Claude Code
    weekly-limit claims appeared again, one on a Twitter account and one from the backtest, with no
    primary, and both are dropped for the second day running.

    `miss_review` departs from the last three runs, and the reason should be recorded. The backtest
    scored 46 candidates for 2026-08-30 and seeded zero causes, as it has all week. Previous runs
    read that as leaving nothing to override and submitted nothing, which is defensible but has
    meant a real recurring gap never got written down. Haiku R1/beta6 is the proof: it scored 230
    points on 2026-08-30 as `no_query_match`, the 2026-08-30 page explicitly considered and dropped
    it for want of a second fetch, and one fetch of the release notes today produced this run's
    lead. That is a watchlist gap, not a relevance skip. EVE Online's Python 3 migration at 371
    points and the Casey Muratori BSC 2026 talk at 292 points are the same shape, the latter being a
    conference talk the video watchlist should have surfaced. These three are submitted as additions
    against a zero-seeded run rather than as overrides of a seeded cause, which is a weaker claim
    than the field normally carries, and the standing defect is unchanged: the backtest scores
    against its own candidate list rather than against the published archive, so genuine archive
    coverage keeps reading as a miss.

    `Watchlist follow-ups` is omitted even though follow-up f-0015 on the Debian general resolution
    was advanced today. The advance is the retirement, and publishing it twice would be padding, so
    it sits in `Top stories` and f-0015 should be updated with it. Its `watch_for` already names the
    vote result and downstream consequences, and this is the first of the latter.

    Sections with no qualifying candidate: `AI`, `Agentic coding`, `Security`, `Outages`, `Languages
    and runtimes`, `Apple platforms`, `Linux and kernel`, `Infrastructure`, `Engineering posts`,
    `Books`, `New videos`, `Markets and companies`, `Hacker News`, `Reddit and social pulse`,
    `Watchlist follow-ups`. Asahi is Apple-adjacent and kernel-adjacent but sits in `Top stories`,
    so neither section is written twice.

    Reddit improved slightly on yesterday, reaching 8 of 28 subreddits against 2, but is still below
    the floor of 14 and still degraded for a seventh day. It did surface Kubernetes v1.37 and the
    GitHub Actions outage thread, both already archive, so it again contributed nothing publishable.
    The GitHub stars collection returned an empty item list without reporting itself degraded, which
    is the same silent-gap shape the last three days recorded.

    Second pass of 2026-08-31. The page already carried five stories from the first pass. This pass
    adds three and promotes one existing story's rank, displacing nothing. Day total is eight
    stories against a budget of 25, and no section is at its cap.

    Ranking change. I rank the LWN summary of the rest of the Linux 7.3 merge window above Haiku
    R1/beta6, so it takes the lead and Haiku moves to second. This is a reorder, not a displacement,
    and no block is removed. The reason is reach: 7.3 removes the Btrfs version 1 free-space cache
    outright after deprecation since 6.11, restricts AF_ALG by default through a new sysctl, and
    completes the sched_ext sub-scheduler, all of which land on machines engineers already run.
    Haiku's numbers are good and its causes are named, but it is a hobby operating system. Both
    kernel stories now sit in Top stories, so `Linux and kernel` is omitted for a third day. That is
    placement, not absence of material, and the section would otherwise duplicate the lead.

    The strongest new candidate on today's front page was not publishable. "Breaking Claude Code
    Opus 5 Auto Mode" reached 287 points and is a working code-execution chain against the default
    mode of a widely used coding agent, which would have been today's lead on the merits. It is
    already the Security lead of the 2026-08-30 page under the title "A researcher gets code
    execution against Claude Code Auto Mode by asking it to summarize a website", with the same
    primary, the Register write-up and two Hacker News threads, and a follow-up on the Trajectory
    Labs evaluation. I fetched the primary before finding the collision. This is the third
    consecutive day the archive check, not source quality, has been the binding constraint on this
    page.

    `Security` therefore stands down to the anchor line for the second time today, and the absence
    is real rather than a gap in collection. The candidates checked were the Codex Memories
    data-exfiltration issue at 2 points with no vendor statement, the Berlin ransomware extortion at
    38 points which is municipal rather than engineering, and an ATF breach item at 2 points. None
    clears the bar. The unresolved CVE-2026-82329 JFrog Artifactory item from the first pass was not
    re-checked this pass and remains unverified.

    `Outages` gains a real item and no longer stands down. The ChatGPT Work incident is live and
    unmitigated as of 17:01 UTC, which is why it is `developing` and carries no end time or cause.
    It sits beside the Willison analysis of the same product by coincidence of timing, not by
    design, and the two blocks make no claim about each other.

    Considered and dropped, with reasons. PEP 805 Safe Parallel Python was written up and dropped.
    The 2026-08-29 page recorded a drop on the grounds that it is a Draft created 2025-09-08 with no
    confirmed state change, and the only movement since is Mark Shannon's 2026-08-27 revision to use
    copying instead of unique references plus forum replies through 2026-08-30, including Guido van
    Rossum writing "Personally I wish we'd stuck with the GIL". The Hacker News item carried 2
    points today against 7 on 2026-08-29, so the external validation got weaker, not stronger.
    Re-litigating a prior call on thinner signal is churn. I verified the PEP metadata against
    peps.python.org and it is accurate. If the thread reaches a resolution or the PEP changes
    status, that is the hook, and `Languages and runtimes` is now omitted for a third consecutive
    day as a result.

    Apache Iggy graduating to an Apache Top-Level Project was verified against the project blog and
    is real. The vote closed 2026-08-19 and the post is dated 2026-08-24, which makes it 12 and 7
    days old. Publishing it as today's news repeats the demerit the 2026-08-30 page took, so it is
    out and `Infrastructure` stays empty.

    The "Anthropic sued over Claude Max usage limits" cluster is a false alarm and worth recording.
    Four separate Hacker News submissions carried it today, but the CNET article behind one of them
    is dated 2026-06-15 and describes Khan v. Anthropic, filed in the Northern District of
    California in June over the Max 5x and Max 20x rate limits. This is a June story resurfacing,
    not news, and it is not the source of the recurring Claude Code weekly-limit claims. Those
    claims appeared again today from two Twitter submissions with no primary behind either and are
    dropped for the third day running.

    Also considered and left out: the 12TB Steam archive leak at 322 points, which is game history
    rather than engineering; OpenShot 4.0 at 417 points, a consumer video editor outside every
    section; the C++26 standard library hardening experiments post at 40 points, a useful write-up
    that is the weakest thing that would go in its section; and Daniel Stenberg's CVE dispute post
    at 160 points, which is dated 2026-06-24.

    Backtest. The 2026-08-30 run log already carries a cause for all 46 candidates, written by this
    day's first pass, so this pass submits only exceptions. Two are wrong. Item 49425252, "RISC-V is
    now officially supported by CPython" at 257 points, is marked out_of_scope, but official RISC-V
    support in CPython is squarely `Languages and runtimes` and no query caught it, so it is
    watchlist_gap. Item 49485267, "Boot a Virtual iPhone via Apple's Virtualization.framework" at
    394 points, is marked out_of_scope, but Virtualization.framework and Darwin internals are named
    contents of `Apple platforms`, so it is watchlist_gap. A third case cannot be recorded correctly
    with the causes available: item 49490702, the GrapheneOS Pixel 11 memory-tagging story, is
    marked out_of_scope but was published on the 2026-08-29 page. There is no cause meaning "already
    covered", so an accurate archive hit is forced to read as a scope judgment. That is the same
    defect the last three days recorded from the other direction, and a fifth cause would fix it.

    Collection. Hacker News, papers, books, YouTube, stars and events reported clean or empty.
    Reddit is degraded for an eighth day at 9 of 28 subreddits and contributed nothing publishable.
    The GitHub stars collection returned an empty item list while reporting itself clean for the
    fifth day, which is a silent gap rather than a degraded one. The events collection returned
    empty upcoming and active lists without declaring itself degraded, so no conference or talk
    material was available this pass. Every page cited here was fetched and read this run except the
    three retained first-pass blocks, which are unchanged.

    Third pass of 2026-08-31. The page carried nine stories from the first two passes. This pass
    adds four and replaces one, taking the day to twelve against a budget of twenty-five. No section
    reaches its cap.

    Top stories is unchanged at four and the ranking was re-checked rather than assumed. The LWN
    summary of the rest of the Linux 7.3 merge window remains the lead. The largest new item on the
    front page today is the kernel.org scraper report at 1,268 points, and it is published on the
    2026-08-30 page, which I verified against the archive rather than taking from the prior pass's
    notes. The Claude Code auto-mode code-execution chain, now at 315 points, is likewise already
    published, but on 2026-08-29 and not 2026-08-30 as the second pass's notes state. That is a
    small factual error in the notes already on this page. Nothing found today outranks the current
    lead, so Top stories was left alone and no fifth slot was filled for the sake of filling it.

    The Outages replacement is a status change, not a new story. The OpenAI incident block was
    published while the incident was open and read as unmitigated since 15:04. The status page now
    shows Resolved with all impacted services recovered, after a Monitoring update roughly half an
    hour earlier. The page renders a twelve-hour clock with no explicit zone, so I did not assert a
    resolution time in UTC. The first pass read the same page's start marker as 15:04 UTC, and the
    elapsed time between the two markers is about five hours and twenty-four minutes regardless of
    which zone the page is rendering, which is why the block leads on duration rather than on a
    closing timestamp. No root cause is published.

    Security stands down to the anchor line for the third time today, and this time the absence is a
    deliberate call rather than an empty field. A Hacker News submission at 20:20 reports a Dropbox
    security notice describing unauthorized access to one account between 2026-08-04 and 2026-08-21,
    with files believed viewed or downloaded, and attributes the path to Lenovo's email verification
    allowing an attacker to register a Lenovo ID against the victim's address and then use it to log
    into the linked Dropbox account. If accurate that is a real identity-provider trust failure in
    widely used consumer infrastructure. It is not publishable. The only source is one user's
    account of a private email, the submitter states he could find no public disclosure from either
    vendor, no advisory is locatable, and there is no affected scope, no patched version and no
    exploitation status. Naming two companies in a breach story on that basis is exactly what the
    source standards forbid, and the thread at 6 points with 1 comment does not carry the Hacker
    News section either. It is worth a follow-up on whether either vendor discloses.

    Bug blindness is published off the backtest rather than off today's collection. It does not
    appear anywhere in today's Hacker News cache. It was scored as a 2026-08-30 candidate at 339
    points, seeded out_of_scope, and it is a Dan Luu essay now at 396 points and 274 comments that
    belongs in Engineering posts. The submitted link had the wrong slug for the site, so the post
    was located from the danluu.com index and read at its real URL. The site dates it only to a
    month, August 2026, and the block does not claim a day. One claim in it is attributed rather
    than asserted: Luu states that Discourse carried code that slowed real page loads to improve web
    performance metrics, and that rests on his own earlier post, not on a Discourse source.

    Collection. Hacker News was clean and pooled a full day. Papers came back clean and large, and
    the normal outcome held, which is that no arXiv entry cleared the ML research bar without
    discussion signal, so the Kuleshov Group guide is the ML research addition instead. Reddit is
    degraded for a ninth day and contributed nothing publishable, being almost entirely
    subscription-limit and workflow chatter from two subreddits. The stars and events collections
    both returned empty item lists while declaring themselves clean, which is a silent gap rather
    than a declared one and is now at six days for stars. The books feed declared itself clean and
    was not re-read this pass, since no book candidate was being ranked. Every page cited by this
    pass was fetched and read this run.

    Considered and dropped. The 984-point "I just chose words carefully" is the day's strongest
    non-engineering front-page item, a typography note about a 1990s ASCII game guide justified by
    word choice, and it has no section here. The swift.org post on Embedded Swift improvements in
    6.4 would have opened Apple platforms and Languages and runtimes, both empty for days, but the
    fetch returned undecoded gzip bytes rather than text and a swift.org release claim is not
    publishable on a two-point submission title. Broadcom on locking down open source Python and
    Java libraries is a Register piece at 3 points with no located vendor primary. The GitHub
    Copilot billing changelog is a real primary but dated 2026-08-28 and at 3 points. ravynOS and
    ReactOS 0.4.16 are project pages with thin external validation. The C++26 standard library
    hardening post remains the weakest thing that would go in its section, and an empty section is
    not a reason to lower the bar, so Languages and runtimes is omitted for a fourth day.

    Backtest. The 2026-08-30 run log already carries a cause for all 46 candidates, so I read it
    before submitting rather than asserting overrides blind. The five entries the earlier passes
    flagged, including Haiku R1/beta6, the EVE Online Python 3 migration and the Casey Muratori
    conference talk, already carry watchlist_gap, so re-submitting them would be noise. One genuine
    exception remains and is submitted: item 49494520, Bug blindness, is seeded out_of_scope and is
    squarely Engineering posts with no query catching it. The defect the last four days recorded is
    unchanged. Item 49490702, the GrapheneOS memory-tagging story, is seeded out_of_scope but was
    published on the 2026-08-29 page, and because no cause means already covered, an accurate
    archive hit is still forced to read as a scope judgment.
