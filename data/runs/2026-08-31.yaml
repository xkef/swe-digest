date: '2026-08-31'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    First run of 2026-08-31. No digest existed for the date, so nothing could be displaced and
    `displace` is empty. The story inbox is empty.

    Eight stories selected against a budget of 25, which is the honest read of a quiet day rather
    than a collection failure. Hacker News was the only clean source and its top of day was
    dominated by items already published or out of scope.

    The lead is a security item and `Security` therefore carries nothing else. The 2026-08-28 GitHub
    advisories batch that would normally fill it is already published on the 2026-08-30 page in
    full, and the advisories API returns nothing published after 2026-08-28. The JFrog Artifactory
    advisory is the one qualifying item from that window not yet carried, and it is more severe than
    any of them, so it leads rather than sitting in a section that costs nothing against the caps. A
    reader should know that the GitHub advisory for CVE-2026-82329 is type `unreviewed` and lists no
    affected package ranges at all, so the version table in the entry comes from JFrog's own
    advisory page and not from the advisories API. The same JFrog page shows large batches of
    Artifactory CVEs published on 2026-07-27, 2026-08-12 and 2026-08-25, which is context for the
    reader but not today's news.

    `Outages` is empty on evidence rather than for lack of looking. Two candidates surfaced and both
    fail. The Cloudflare Workers Builds incident submitted to Hacker News at 03:16 on 2026-08-31
    resolved on 2026-08-27 at 22:58 UTC, so it is a four-day-old resolved incident resurfacing as a
    submission, which is the same shape the 2026-08-30 page recorded. A VentureBeat headline asserts
    a GitHub outage, and an Ask HN titled "Is GitHub Down?" was posted 2026-08-30 19:53, but
    GitHub's own incidents API shows no incident created after 2026-08-27 and a page timestamp of
    2026-08-31 06:28 UTC, so the outage premise is not corroborated by the vendor. The VentureBeat
    page returned a rate-limit error and could not be read, so the Cursor Origin launch it reports
    is not published at all: primary unread and the framing contradicts the status page.

    Three sources would not load and cost real candidates.
    `bughunters.google.com/blog/scaling-memory-safety`, on AI-assisted rewrites of C and C++
    dependencies to Rust, returned its title only with no body, so a Google primary with obvious
    engineering relevance could not be written up. `cve.org` and `nvd.nist.gov` both returned empty
    shells for CVE-2026-82329; the advisory was recovered through the GitHub advisories API and the
    vendor page instead. This is worth a source-reliability note: for CVE lookups the advisories API
    and the vendor advisory work where cve.org and NVD do not.

    `miss_review` is empty on purpose and this time it was tested rather than assumed. The backtest
    scored 46 candidates for 2026-08-30 and again seeded zero causes, so there is no seeded cause to
    override. Rather than repeat that observation, I picked the single strongest apparent
    `watchlist_gap` from the candidate list, "Boot a Virtual iPhone via Apple's
    Virtualization.framework" at 394 points and marked `no_query_match`, and checked it against the
    archive before submitting. It is published on the 2026-08-29 page as "vphone-cli boots a virtual
    iPhone on Apple Silicon through Virtualization.framework", citing the same Hacker News id
    49485267. So the one entry I was prepared to assert resolved to archive, which is direct
    confirmation of the standing defect the 2026-08-30 page described: the backtest scores against
    its own candidate list rather than against the published archive, so covered stories read as
    misses. Spot checks put GrapheneOS Pixel 11 MTE, Samsung processing-in-memory, CPython on RISC-V
    and the METR postmortem in the same category.

    Calls a reader of the finished page could not infer. The METR and Redwood investigation of the
    OpenAI agents that attacked Hugging Face was the strongest-looking candidate of the run, carried
    at 243 points through a Zvi secondary and seeded by the backtest at 210, and it is not published
    because the 2026-08-27 page already carries it under the identical primary URL with the same
    1,200 and 700 agent counts. The Codex Memories entry is deliberately narrowed: the publishable
    finding is the provider-crossover code path and the maintainer `bug` label, while the reporter's
    belief that OpenAI used the transferred content for account moderation is inference by a single
    unverified reporter and is marked as such in the entry rather than carried as fact. The day's
    highest-scoring thread by a wide margin, "I just chose words carefully" at 611 points, is left
    out entirely: it is a well-made curiosity about a 1990s Super Metroid guide whose author
    hand-picked words so monospace text justified without double spaces, and it carries no
    engineering consequence, so including it would be ranking on popularity.

    Also considered and left out. The European Commission encryption-backdoor item reached 401
    points but is carried only by reclaimthenet.org with no Commission primary locatable without a
    search tool, which is the same wall the 2026-08-30 page hit. An EU AI Act enforcement item at 37
    points sits on tokenstead.ai, an unknown domain, with no Commission primary. The Zig ArrayList
    pointer-stability devlog entry at 103 points is still blocked by the archive check normalizing
    `ziglang.org/devlog/2026/#2026-08-27` to the whole 2026 devlog page, which was used as a primary
    on 2026-06-26, and no per-entry URL exists, so `Languages and runtimes` stays omitted for a
    second day for a structural reason rather than an editorial one. The Rust function-overloading
    call for experimentation is a genuine blog.rust-lang.org primary but is dated 2026-08-19 and
    drew 3 points. The Claude Code website-summarization research is archive from 2026-08-29 and The
    Register piece is secondary to it.

    `New videos` is omitted and the reason is mechanical. The YouTube pull is not flagged degraded
    and carries 27 items, but every one has `discussion` set to null, and the guidance names that
    object as both the filter and the ranker for the section. The one item that would otherwise
    merit a look is a Seattle Rust User Group talk on a draft RFC adding `poll_progress` to fix
    AsyncIterator deadlocks, posted to the official Rust channel with the RFC linked; without
    discussion signal it sits below the bar, and the rest of the pull is conference shorts and
    opinion uploads.

    Sections omitted for want of a qualifying candidate: `ML research`, `Developer tools`,
    `Languages and runtimes`, `Apple platforms`, `Linux and kernel`, `Infrastructure`, `Books`, `New
    videos`, `Markets and companies`, `Hacker News`, `Reddit and social pulse`. `Reddit and social
    pulse` stands down rather than being written from 8 of 28 subreddits of help-desk questions. The
    arXiv pull is large and remains unreviewed preprints with no discussion signal.

    Memory worth updating on a later step: follow-up f-0015 on the Debian LLM general resolution
    should advance to record the resolution outcome plus the first public retirement attached to it,
    since the vote it was opened to track has now closed.
