date: '2026-08-31'
judgment:
  inbox: []
  miss_review: {}
  notes: |
    Quiet day, and the page should read that way. Five stories selected against a budget of 25.

    This is the first run of 2026-08-31, so there is no digest to displace from and `displace` is
    empty.

    The dominant fact of this run is archive collision, not a thin front page. Hacker News was clean
    and the front page was strong, but most of the strongest items are already published. Creepy
    Crawlies, QSB-118 and the Omarchy docker-group root escalation are all on the 2026-08-30 page.
    Kubernetes v1.37 is on 2026-08-27, UniBLEed on 2026-08-28, OpenAI ending the Cursor partnership
    on 2026-08-29, and the METR and Redwood Hugging Face investigation on 2026-08-27, which makes
    the 244-point Zvi post secondary commentary on published work. The Debian general resolution
    itself is the 2026-08-29 lead. Every one of these was checked against `data/digests` rather than
    assumed.

    `Security` and `Outages` both stand down to the anchor line, and in both cases the absence is
    the finding rather than a quiet day. On security, the one new candidate was CVE-2026-82329,
    submitted as a critical JFrog Artifactory authentication bypass. Both cve.org and nvd.nist.gov
    returned JavaScript shells with no record text, the Hacker News submission carried it at 4
    points with no vendor advisory linked, and no JFrog advisory was locatable. An unverified
    critical CVE against widely deployed artifact infrastructure is exactly the shape that should
    not be published on a submission title alone, so it is left out and flagged here for a later
    pass. On outages, both candidates that surfaced are stale rather than current. The Cloudflare
    Workers Builds incident that reached Hacker News today is yj2zk6n6rz1c, started 2026-08-27 21:19
    UTC and resolved 22:58 UTC with minor impact. The GitHub Actions and Pull Requests incidents
    behind the Reddit thread and the Cursor Origin framing resolved on 2026-08-26 and 2026-08-27.
    The githubstatus.com history page renders client-side and returned no incidents, so the RSS feed
    was used instead, and it shows nothing after 2026-08-27.

    Calls a reader of the finished page could not infer. The Asahi block is `developing` on purpose:
    this is a v1 series posted for review that depends on five other in-flight series, and the
    author states it should probably go through the thunderbolt tree once reviewed. The limitations
    in that block are the maintainer's own words, not inference. The Debian block deliberately
    paraphrases rather than quotes. The retirement message carries profanity and a political
    characterisation of the technology, and neither is a fact the digest can assert, so the block
    states what he cited as his reason and leaves the rhetoric in the source. His status as a
    seconder of Proposals A and C is taken from the ballot page, not from the message, and it is
    what makes the departure more than one anonymous complaint. The Hacker News thread title on that
    item, "Debian developer resigns after corporate LLM use without disclosure wins vote",
    misdescribes the outcome, since the winning option was Haber's Responsible Use of Generative AI,
    so the thread is linked as discussion only and its framing is not adopted.

    Considered and left out. "P99 0 ms autocomplete for 240M domain names" reached 75 points and is
    a genuinely good implementation write-up, with a trie head over the Tranco million, a
    memory-mapped delta-compressed block index over 240M CZDS names in 2.5 GB, and honest load-test
    numbers. It is dated 2026-06-22, so it is a ten-week-old post resurfacing, and the 2026-08-30
    page already took a demerit for publishing a seven-day-old item as current. The Zig ArrayList
    pointer-stability devlog entry is blocked again for the reason the 2026-08-30 notes recorded:
    the gate normalizes the fragment away and treats all of ziglang.org/devlog/2026/ as one source
    already used on 2026-06-26 and 2026-07-05, and no per-entry primary exists. `Languages and
    runtimes` is omitted as a result, for the second consecutive day, and this is a structural
    defect in the archive check rather than an editorial call. The EU AI Act enforcement item
    reached 37 points and 77 comments but rests entirely on tokenstead.ai, an aggregator with no
    Commission primary located, so it is not publishable as fact. Two contradictory Claude Code
    weekly-limit claims appeared again, one on a Twitter account and one from the backtest, with no
    primary, and both are dropped for the second day running.

    `miss_review` departs from the last three runs, and the reason should be recorded. The backtest
    scored 46 candidates for 2026-08-30 and seeded zero causes, as it has all week. Previous runs
    read that as leaving nothing to override and submitted nothing, which is defensible but has
    meant a real recurring gap never got written down. Haiku R1/beta6 is the proof: it scored 230
    points on 2026-08-30 as `no_query_match`, the 2026-08-30 page explicitly considered and dropped
    it for want of a second fetch, and one fetch of the release notes today produced this run's
    lead. That is a watchlist gap, not a relevance skip. EVE Online's Python 3 migration at 371
    points and the Casey Muratori BSC 2026 talk at 292 points are the same shape, the latter being a
    conference talk the video watchlist should have surfaced. These three are submitted as additions
    against a zero-seeded run rather than as overrides of a seeded cause, which is a weaker claim
    than the field normally carries, and the standing defect is unchanged: the backtest scores
    against its own candidate list rather than against the published archive, so genuine archive
    coverage keeps reading as a miss.

    `Watchlist follow-ups` is omitted even though follow-up f-0015 on the Debian general resolution
    was advanced today. The advance is the retirement, and publishing it twice would be padding, so
    it sits in `Top stories` and f-0015 should be updated with it. Its `watch_for` already names the
    vote result and downstream consequences, and this is the first of the latter.

    Sections with no qualifying candidate: `AI`, `Agentic coding`, `Security`, `Outages`, `Languages
    and runtimes`, `Apple platforms`, `Linux and kernel`, `Infrastructure`, `Engineering posts`,
    `Books`, `New videos`, `Markets and companies`, `Hacker News`, `Reddit and social pulse`,
    `Watchlist follow-ups`. Asahi is Apple-adjacent and kernel-adjacent but sits in `Top stories`,
    so neither section is written twice.

    Reddit improved slightly on yesterday, reaching 8 of 28 subreddits against 2, but is still below
    the floor of 14 and still degraded for a seventh day. It did surface Kubernetes v1.37 and the
    GitHub Actions outage thread, both already archive, so it again contributed nothing publishable.
    The GitHub stars collection returned an empty item list without reporting itself degraded, which
    is the same silent-gap shape the last three days recorded.
