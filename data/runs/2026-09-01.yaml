  notes: |
    First run of 2026-09-01. No digest existed for the day, so nothing was displaced and `displace`
    is empty.

    Ranking. Ten stories selected against a 25 budget, three of them Top stories. The day produced a
    small number of items that verify cleanly against primary sources and a long tail that does not,
    so the page should read short rather than padded. Chrome MV2 leads over the Claude Code
    prompt-injection chain because it changes what every Chromium user and extension developer can
    install, confirmed from Google's own support-timeline doc rather than from the blog post HN
    surfaced.

    Security reads `No major items found.` while the day's second Top story is a working
    remote-code-execution chain against Claude Code Auto Mode. That is the section structure, not a
    quiet security day. No separate advisory verified today: the Ask HN "Dropbox Data Breach" thread
    (49514427, 24 points) carries no primary source and was dropped, and the TruffleSecurity
    leaked-AWS-keys post had no corroboration.

    Not published for lack of a resolvable primary. Reuters returns HTTP 401 to automated fetch, so
    the OpenAI-ends-Cursor-model-access story (49516583, 49511084) was dropped rather than cited
    through an aggregator. This matches the existing access note about Reuters. swift.org returned
    undecoded gzip bytes, so the Embedded Swift 6.4 post could not be read and `Apple platforms` is
    omitted. bughunters.google.com returned only a page title, so Google's AI-assisted C/C++ to Rust
    rewrite post could not be verified. windowsreport.com returned HTTP 403, so the Microsoft outage
    is written only from the Microsoft 365 Status statement quoted by CNET, which covers Exchange
    Online and Outlook. The wider Teams, Store, and Azure impact is secondary reporting only and is
    flagged as such in the block rather than asserted.

    Sections omitted deliberately. `ML research`: the arXiv fetch was healthy and large, and nothing
    cleared the bar. The closest were "Measure Before You Manage: Evaluating Agent Working Memory in
    Coding Agents" and "Quantization-Triggered Backdoors in Language Models", neither with ecosystem
    attention or independent reproduction. `Books`: the fetch returned only Springer conference
    proceedings volumes, no new technical book. `New videos`: the strongest candidate was Dwarkesh
    Patel's "The OpenAI/Hugging Face attack, clearly explained" at 25,809 views, which bears on
    tracked follow-up f-0030, but the video content was not verified and characterising it unread
    would be a guess. `Hacker News`: no HN-native item stood on its own. Daniel Stenberg's "A CVE
    Dispute" took 186 points but is dated 2026-06-24 and is a resurfacing, not news. `Reddit and
    social pulse`: omitted on coverage grounds. Reddit reached 9 of 28 subreddits against a floor of
    14, and what came back was dominated by r/ClaudeAI usage-limit complaints. That discontent is
    real and converges with reported suits over Claude Max limits and a reported weekly-limit
    reduction, but neither could be verified from a primary source, and a pulse item drawn from a
    third of the intended subreddits would overstate what was actually sampled. `Watchlist
    follow-ups`: nothing verified moved on the 27 open follow-ups today.

    Deduplicated against the archive. Checked `data/digests/2026-08-30.md` and `2026-08-31.md`
    before selecting. Dropped as already carried: the Linux 7.3 merge window, Asahi USB4/Thunderbolt
    patches for Apple M1/M2/M3, Simon Willison on ChatGPT Work, Cal Paterson's
    agent-memory-as-a-file-format post, and the uv wheel-cache deduplication merge, all from
    2026-08-31. The Debian LLM general resolution outcome was carried 2026-08-31 through the
    developer-retirement angle. Omarchy's docker-group root escalation and the Qubes OS copy-to-VM
    code execution were carried 2026-08-30, which is why both appear in `miss_review` as
    relevance_skip rather than as misses.

    Backtest. The tool reported 49 candidates and seeded zero causes, so `miss_review` carries the
    calls rather than corrections to defaults. The one genuine security miss is 49498787, the METR
    and Redwood postmortem of the Hugging Face hack at 257 points: it bears directly on open
    follow-up f-0030 and no watchlist query matched it, which is a watchlist gap worth closing. Also
    marked watchlist_gap: 49499394 (European Commission encryption-backdoor push under ProtectEU,
    438 points), 49505219 (P99 autocomplete over 240M domains, 172 points), and 49504905 (NAT and
    internet centralization, 131 points), all engineering-relevant and all unmatched. 49503956 is
    relevance_skip because 2026-08-31 already carried Sander Dieleman on diffusion language models.
    The highest-scoring candidates overall, including the 1268-point "Creepy Crawlies" and the
    984-point "I just chose words carefully", are out of scope for a software engineering digest and
    are marked so, since otherwise the top of the backtest list reads as a large coverage failure.

    Note for the weekly review: the first tool call of this run used Bash to list cache file sizes
    before I re-read the granted tool list. Bash is not in the granted set for this step. No further
    calls used it, and nothing was written.

    First run of the day, so no digest existed to rank against and nothing was displaced. Selected
    18 items against a 25 budget, no section over its cap. Every published item was verified against
    a primary source with fetch_url except where stated below.

    Degraded coverage. The events cache is a stub: fetched_at is midnight, window_hours is 0, both
    collections are empty, and degraded is empty, so it reports healthy while having collected
    nothing. Treat the empty events set as unverified rather than as a quiet day. The stars cache
    returned zero items from the gh-events backend with no degradation flag, which is plausible
    under the read-only token but was not confirmed. The books cache returned only Springer
    conference proceedings, nothing with engineering relevance, so Books is omitted rather than
    padded, and that is a real fact about the feed rather than a fetch failure. The papers cache
    held roughly the same character: no paper carried both engineering relevance and any external
    validation, so ML research is omitted. HN itself carried a thread noting arXiv volume and
    quality, which is consistent.

    Sources that would not load. reuters.com returned HTTP 401, matching access-note an-0020, so the
    OpenAI and Cursor story is published as developing with the access limitation stated in the
    entry itself rather than only here. windowsreport.com returned 403, so a reported Microsoft 365
    outage covering Outlook, Teams, Store and Azure could not be verified and is not published. No
    Microsoft primary was reached for it, and the absence is the reason Outages carries only the
    GitHub incident. swift.org returned a gzip-encoded body the fetcher did not decode, so an
    Embedded Swift 6.4 post was dropped and Apple platforms is omitted. planned-obsolescence.org
    returned 404 on the path an HN comment cited.

    Note that developer.chrome.com returned 200 to this run, contradicting access-note an-0046,
    which lists it as a datacenter 403. Worth re-dating that entry.

    Calls a reader could not infer. The METR and Redwood report is linked at metr.org/research
    rather than at its own permalink: fetch_url returns page text without hrefs, so the direct URL
    for the 2026-08-26 report could not be resolved, and the research index is the nearest thing I
    could confirm resolves and lists it. The same applies to the METR security disclosure, linked at
    metr.org/blog.

    Not published, deliberately. A Dropbox data breach thread ran on HN with 32 points but the
    submission links only to itself, no primary or vendor statement was found, and a breach claim is
    not publishable on that basis. Daniel Stenberg's "A CVE Dispute" drew 186 points but is a post
    from 2026-06-24 resurfacing, and publishing it undated would read as new. Several agentic-coding
    write-ups with real point totals, including "Agent memory as a file format" at 174 and "Run
    macOS Software on Linux" at 256, were left out only because I did not verify them within the run
    rather than because they failed a bar. Reddit's cache was dominated by ClaudeAI usage-limit
    complaints and selfhosted questions with no verifiable primary behind them, so Reddit and social
    pulse is omitted and the one HN-native item stands in its place.

    Backtest. The tool reported 49 candidates and seeded no default causes, so miss_review carries
    my own judgments rather than corrections. Three are genuine engineering misses no query caught.
    49498787 is the METR and Redwood postmortem, which follow-up f-0030 has explicitly listed under
    watch_for since 2026-07-21 and which no query matched, the clearest watchlist failure in the
    set. 49499854 is a local root escalation in Omarchy and 49496918 is arbitrary code execution in
    QubesOS, both squarely inside the security bar and both unmatched. 49496782 is a 2018 geography
    post that the matcher recorded as seen_and_matched, which is a false entity match rather than a
    real hit. The remaining high-point candidates are correctly out of scope.

    Forward. The HF incident follow-up is not filed under Watchlist follow-ups because it is carried
    as a Top story this run and duplicating it would double-count against the budget. Its open
    threads now are whether OpenAI responds on the third agent group, which the METR and Redwood
    scope explicitly excluded, and whether other labs disclose comparable eval-environment escapes.
    The AnkiDroid removal deadline of 2026-09-11 is a dated check worth carrying.

    Third pass of 2026-09-01. The page carried 13 stories from the first two passes. This pass adds
    five and displaces nothing, taking the day to 18 against a budget of 25. `Top stories` goes to
    five of five, `Outages` to two, `Developer tools` to two, and `Apple platforms` and `Linux and
    kernel` open at one each. No section exceeds its cap and `displace` is empty.

    Ranking, and the one change to settled order. `top_stories` is submitted as the full ranked list
    of five, not as the single addition, because the insertion changes the lead and the ordering has
    to be explicit. Claude Fable 5.1 takes the lead ahead of Chrome Manifest V2. The four previously
    published Top stories are carried unchanged in their existing relative order, with their
    existing titles and primary URLs, and only Fable 5.1 is new. That is deliberate: one justified
    insertion at the top rather than a reshuffle of ranks two previous passes already settled. The
    nine published non-Top blocks are unchanged and retained, and their absence from `stories` is
    not a request to remove them.

    Why the lead moved. Fable 5.1 is a frontier model release confirmed from Anthropic's own
    announcement page, published 17:53 UTC, well after the second pass closed. It clears the Chrome
    MV2 milestone on operational impact for two reasons that are cost and policy rather than
    benchmark position: a stated 25 percent reduction for typical token-billed workloads and up to
    approximately 45 percent for highly agentic work, delivered entirely through cache-read pricing,
    and a stated safeguard change permitting vulnerability discovery while still refusing exploit
    development. Both are things a working engineer acts on. The benchmark table is reported as
    Anthropic's own, and the block carries Anthropic's own stated limitation that Fable 5.1 was
    evaluated with production safeguards enabled and scored zero on tasks where those safeguards
    intervened. That caveat is the reason the numbers are attributed rather than asserted.

    The Google Cloud incident is the first outage this day that carries a stated cause from the
    operator. Google's incident text names routine network fabric path maintenance in two clusters
    in us-central1-b, and states maintenance in the region has been halted for proactive audits. It
    is filed `developing` because the incident was still Active at fetch time with Cloud Run and App
    Engine listed as impacted and no post-incident report published. The incident permalink resolves
    and is cited rather than the rolling status page, and both are recorded. Worth carrying forward:
    this is the second Google Cloud incident in under two weeks whose stated cause is planned
    maintenance removing network capacity, after the 2026-08-20 us-west1 report attributing that
    outage to scheduled fiber optic maintenance plus automated rerouting that failed to redistribute
    traffic. Two incidents is a pattern worth naming and not yet a trend worth asserting, so the
    block states both and draws no further conclusion.

    Rejected on a source that does not support its own headline. The HN submission at 49523754,
    "Play Store blocks AuroraStore, hurting GrapheneOS users", took 291 points and links to GitLab
    issue AuroraOSS/AuroraStore#1566. I fetched that issue. It is a single user bug report that
    Aurora Store returns "Server busy, please try again later" when installing via an anonymous
    account on a Fairphone 5 running CalyxOS, and the reporter explicitly states he does not know
    whether the issue is specific to anonymous accounts. Nothing in the primary attributes the
    failure to Google, to a Play Store block, or to GrapheneOS. The submitted title asserts a cause
    the linked source does not establish. It is not published in any form, including as
    `developing`, because the gap here is not uncertainty about a real event but a claim invented in
    the title. This would have converged neatly with the AnkiDroid Play removal already leading this
    page, which is exactly why it deserved the check rather than the pairing.

    Not published, judged rather than blocked. The transformer-on-ARC post at 49519939 took 385
    points and is a benchmark claim by an individual author against unnamed LLMs. The second pass
    declined it, nothing about it changed, and the standing rule against publishing AI benchmark
    claims without method or primary source applies. Atlas from World Labs at 49525160 is new but
    arrived at 37 points with zero comments and no external validation, so it fails the
    ecosystem-attention bar rather than a sourcing one, and `AI` stays empty of anything but the Top
    story. The Ubisoft SteamOS block at 49523033 rests on GamingOnLinux secondary reporting with no
    Ubisoft primary located. The two EFF policy posts and the Dwarf Fortress creator interview are
    commentary without an engineering decision behind them.

    Sections still omitted with nothing verified to report: `ML research`, `Engineering posts`,
    `Books`, `Markets and companies`, `Reddit and social pulse`, `Watchlist follow-ups`. Reasons
    from the earlier passes are unchanged. The io_uring measurement post could have gone to
    `Engineering posts` and is filed under `Linux and kernel` instead, because its findings are
    about kernel behaviour, block-layer request merging, sqpoll thread cost, and the O_DIRECT
    page-cache path, and `Linux and kernel` names io_uring explicitly. A reader could not infer that
    call from the page, so it is recorded here.

    Degraded and unverified collection. Reddit improved from 9 of 28 subreddits to 12 of 28 but is
    still under the floor of 14, with top-of-day at 2 of 28, so `Reddit and social pulse` stays
    omitted on coverage grounds for the third consecutive pass rather than because the subreddits
    were quiet. The events cache is identical to the stub the second pass flagged: fetched_at at
    midnight, window_hours 0, both collections empty, and an empty degraded list, so it reports
    healthy while having collected nothing. That is now three passes in one day with the same defect
    and it should be read as a collector fault, not as an absence of conference material. The stars
    cache again returned zero items from the gh-events backend with no degradation flag. HN itself
    was clean and fresh at 18:53 UTC.

    Backtest. The tool again reported 49 candidates for 2026-08-31 and seeded zero default causes,
    as it has all week, so every submitted cause is a judgment rather than a correction to a
    default. This is the third pass scoring the same day, and passes one and two already recorded
    ten causes for it. To avoid re-recording the same calls as churn, `miss_review` carries only two
    candidates neither earlier pass addressed, both engineering-relevant and both unmatched by any
    watchlist query: 49507822, the OpenShot 4.0 release at 484 points, and 49499891, the
    Coordination Headwind organizational-engineering essay at 142 points. The recurring finding
    across all three passes is that the backtest seeds nothing, which makes the seeded-cause
    exception mechanism inert and pushes the whole judgment onto the select step every day. That is
    worth the weekly review's attention as a tool defect rather than a selection one.

    Tooling note for the weekly review, repeating a fault the first pass also recorded. The first
    tool call of this run used Bash to list the cache directory and check whether a digest already
    existed for the day, before I had re-read the granted tool list. Bash is not in the granted set
    for this step. No further call used it, nothing was written, and the same listing is obtainable
    through Glob. The first pass of this day logged the identical mistake, so it is a repeat rather
    than a one-off, and the step prompt's tool list is worth reading before the first call rather
    than after it.
