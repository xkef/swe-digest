- title: >-
    Re-analysis of METR's time horizons finds a 3-minute to 30-minute jump is far easier than
    30 minutes to 5 hours
  section: ML research
  category: Paper
  status: confirmed
  blurb: >-
    A re-analysis of METR's task data finds AI difficulty nearly flat from 2 to 30 minutes
    of measured human task time.
  summary: >-
    The paper recomputes 228 tasks across 26 models using splines and item-response theory.
    The resulting conversion from human task time to AI difficulty is nearly flat between
    2 and 30 minutes, then steepens.
  why: >-
    Equal multipliers on the widely cited time-horizon plot do not represent equal capability
    gains, so a doubling rate read off that curve cannot be extrapolated past the half-hour
    mark.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2610.12466
- title: >-
    Preprint gives provable subexponential secret recovery for families tied to all seven
    NIST third-round lattice candidates, and states deployed parameter sets are unaffected
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    A preprint claims provable subexponential secret recovery for lattice families behind
    all seven NIST third-round candidates.
  summary: >-
    The abstract claims provable subexponential secret recovery for problem families tied
    to all seven lattice candidates from NIST's third round. The stated complexity is subexponential
    in growing parameter families rather than at deployed sizes. The abstract closes by stating
    that the results do not establish a reduction in the concrete security of the currently
    specified parameter sets.
  why: >-
    A migration plan built on Kyber, Dilithium or Falcon has nothing to change on this paper,
    because the abstract states the currently specified parameter sets are not affected.
  followup: >-
    Track peer review and cryptographer analysis of whether the result reaches deployed parameter
    sets.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2610.11254
  - label: discussion
    url: https://news.ycombinator.com/item?id=50017496
- title: >-
    Microsoft publishes MXC, a sandboxed execution system for untrusted code, under MIT with
    Rust, .NET and Node SDKs
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Microsoft open-sources MXC, a sandboxed execution system for running untrusted model output,
    plugins and tools.
  summary: >-
    Microsoft published MXC under MIT with SDKs for Rust, .NET and Node, and the README describes
    it as a sandboxed code execution system for running untrusted code, meaning model output,
    plugins and tools, on Windows, Linux and macOS. Seatbelt is the only backend offered on
    macOS, and the README's backend table marks MicroVM, Hyperlight and Windows Sandbox experimental
    on the Windows row while listing lxc, microvm and hyperlight without that marker on Linux.
    The documentation states that audit mode, which helps author a working policy, turns off
    all sandbox security for the workload it inspects.
  why: >-
    On macOS the only backend is Seatbelt and on Windows every VM-backed option carries an
    experimental marker, so a cross-platform deployment lands on the platform default rather
    than a VM everywhere.
  followup: >-
    Tracked against f-0036, the coding-agent sandbox escape class. Check whether the MicroVM
    and Hyperlight backends leave experimental status.
  sources:
  - label: primary
    url: https://github.com/microsoft/mxc
  - label: discussion
    url: https://news.ycombinator.com/item?id=50016489
- title: >-
    AWS releases Strands Box in developer preview, funnelling agent tool calls through a user-space
    policy layer
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    AWS Strands Box routes agent tool calls through a user-space policy layer that inspects
    MCP calls, shell and Python.
  summary: >-
    Strands Box is in developer preview and places a user-space policy layer between an agent
    and its tools, with a kernel sandbox making that layer the only route out. Policy sees
    MCP calls, shell commands and Python rather than syscalls, which supports rules such as
    allowing git push only when npm test passed within the last 15 minutes. The post names
    the cost as a larger trusted computing base and recommends pairing it with a per-session
    MicroVM.
  why: >-
    Policy that reads MCP calls, shell commands and Python instead of syscalls can express
    a rule in the terms a developer already uses, such as permitting git push only when npm
    test passed within the last 15 minutes.
  followup: >-
    Tracked against f-0036, the coding-agent sandbox escape class. Check whether policy enforcement
    holds once Strands Box leaves developer preview.
  sources:
  - label: primary
    url: https://strandsagents.com/blog/strands-box-the-big-picture/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50006827
- title: >-
    Atlassian's pre-auth arbitrary file read reaches plaintext Crowd credentials across every
    prior Data Center version
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A pre-auth arbitrary file read in Atlassian Data Center products reaches plaintext Crowd
    credentials, per watchTowr.
  summary: >-
    Only the advisories index was reachable to automated fetch this run, and under October
    2026 it carries one line, `Arbitrary File Access Vulnerability impacts Multiple Products
    (CVE-2026-21589)`, with no precondition, no product list, no affected or fixed versions
    and no severity. The watchTowr writeup is the source for the pre-authentication precondition,
    for naming Jira and Confluence, and for the scope covering every prior version across
    the Data Center line. The writeup also states that where Jira is integrated with Crowd
    the file read reaches `WEB-INF/classes/crowd.properties`, which stores the application
    password in plaintext, and it puts exposed Confluence instances alone near 700,000. No
    fixed-version list appears in the reachable record.
  why: >-
    watchTowr puts the precondition at pre-authentication and the scope at every prior version
    across the Data Center line, and places the plaintext Crowd application password within
    reach of the file read, so rotating that password follows the version bump.
  followup: >-
    Retry the individual Atlassian advisory page for the affected and fixed version list,
    which is currently attributed to watchTowr.
  sources:
  - label: advisory index
    url: https://www.atlassian.com/trust/security/advisories
  - label: writeup
    url: https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50005577
- title: >-
    MapRoulette discloses four vulnerabilities that exposed OpenStreetMap write tokens, including
    an empty API key that granted administrator access
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    MapRoulette discloses four flaws that exposed OpenStreetMap write tokens, one via an empty
    API key granting admin access.
  summary: >-
    The disclosure covers four vulnerabilities, one of which treated an empty API key as administrator
    access, and every self-hosted instance above v2.0.3 is affected by at least one of them.
    The fix, v4.11.0, removes API key authentication outright. The maintainers report no evidence
    of malicious exploitation in the logs, and state that the logs cover only 29 days against
    vulnerabilities introduced between March 2017 and November 2019.
  why: >-
    Upgrading to v4.11.0 breaks standalone Rapid, the JOSM plugin and any script or Python
    client that authenticated with an API key, so operators need a credential migration and
    not only a version bump.
  sources:
  - label: primary
    url: https://community.openstreetmap.org/t/maproulette-security-incident-october-2026/148566
  - label: discussion
    url: https://news.ycombinator.com/item?id=50014981
- title: >-
    fast-jwt accepted expired tokens from its verifier cache when the JWT carried no iat claim
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    fast-jwt up to 6.3.3 keeps serving expired tokens from its cache for the full TTL when
    the JWT carries no iat claim.
  summary: >-
    On fast-jwt versions up to 6.3.3 with caching enabled, a token carrying `exp` but no `iat`
    stays accepted from the verifier cache for the full `cacheTTL`, which defaults to 10 minutes.
    The flaw is tracked as CVE-2026-107719 and fixed in 6.3.4.
  why: >-
    With caching enabled, a token holding exp but no iat stays accepted for the full cacheTTL,
    10 minutes by default, after it expires, so expiry stops bounding a stolen bearer token
    on versions up to 6.3.3.
  sources:
  - label: advisory
    url: https://github.com/advisories/GHSA-x937-hj6v-793p
- title: >-
    A two-month-old Hazelcast arbitrary-memory-read fix reaches the GitHub Advisory Database
    rated 9.3
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A two-month-old Hazelcast memory-disclosure fix reaches the GitHub Advisory Database as
    CVE-2026-107726, rated 9.3.
  summary: >-
    The advisory, tracked as CVE-2026-107726 with a CVSS v4 score of 9.3, describes arbitrary
    memory reads from any cluster member by a low-privileged client, along with member crashes
    and memory corruption toward remote code execution in some Enterprise configurations.
    Affected ranges are 5.6.0, 5.5.0 up to but not including 5.5.10, and versions below 5.4.5,
    with Enterprise fixed in 5.7.0, 5.6.1, 5.5.10 and 5.4.5 and Community Edition fixed only
    in 5.7.0. It was published in hazelcast/hazelcast on 2026-08-04 and entered the GitHub
    Advisory Database on 2026-10-08.
  why: >-
    The fix has been available for two months, so the open question for an operator is which
    members still run an affected build, and the advisory otherwise offers its Workarounds
    entry plus five measures from the Hazelcast Security Hardening guide.
  sources:
  - label: advisory
    url: https://github.com/advisories/GHSA-6v25-8wq6-xq4j
- title: >-
    Firebase postmortem: a two-line config cleanup crashed Apple-platform apps once on launch
    while both status dashboards stayed green
  section: Outages
  category: Outage
  status: confirmed
  blurb: >-
    A two-line Firebase config change made Apple-platform apps crash once on launch on 2026-09-28
    while dashboards stayed green.
  summary: >-
    The postmortem, published 2026-10-02, covers an incident on 2026-09-28 with a timeline
    from 17:38 to 19:52 PDT, during which the backend served an invalid configuration for
    2 hours 11 minutes. Active users on iOS and other Apple platforms saw a one-time crash,
    after which the SDK fell back to the previous config, and the postmortem states no devices
    were observed entering a permanent crash loop. The Firebase and Google Ads dashboards
    read server-side health metrics and registered nothing, so responders used a GitHub issue
    to reach developers.
  why: >-
    A client-side SDK fault stays invisible to a status page built on server-side metrics,
    so a green dashboard is not evidence that a crash on launch originates in the application.
  sources:
  - label: postmortem
    url: https://firebase.blog/posts/2026/10/firebase-analytics-outage
  - label: discussion
    url: https://news.ycombinator.com/item?id=50016452
- title: >-
    Firebase Hosting has been returning bandwidth quota errors and failing deployments since
    2026-10-07
  section: Outages
  category: Outage
  status: confirmed
  blurb: >-
    Firebase Hosting has returned bandwidth quota errors and failed deployments since 2026-10-07
