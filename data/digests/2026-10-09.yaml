- title: >-
    Deno joins Cloudflare, ending runtime development after one more year and shutting Deno
    Deploy down in six months
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Deno joins Cloudflare: one more year of runtime releases, Deno Deploy shuts down in six
    months, JSR keeps running.
  summary: >-
    Ryan Dahl's post states the Deno team joins Cloudflare, and the runtime gets one more
    year of monthly releases carrying bug fixes and security updates before the team stops
    developing it. Deno Deploy operates six more months and then shuts down, with migration
    support offered to paying customers. JSR keeps running and its infrastructure moves to
    Cloudflare.
  why: >-
    The two dates a Deno user plans against are the six-month Deploy shutdown and the one-year
    release tail, after which continued runtime development depends on someone outside the
    team picking it up.
  followup: >-
    Track the Deno Deploy shutdown date, the end of the one-year release tail, and whether
    runtime development continues outside the team.
  sources:
  - label: primary
    url: https://deno.com/blog/cloudflare
  - label: acquirer
    url: https://blog.cloudflare.com/deno-joins-cloudflare/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50019911
- title: >-
    Python 3.15.0 ships with UTF-8 as the default encoding, a lazy import keyword, and frame
    pointers enabled by default
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Python 3.15.0 makes UTF-8 the default encoding, adds a lazy import keyword, and enables
    frame pointers by default.
  summary: >-
    The release notes list PEP 686, which makes UTF-8 the default encoding, a lazy import
    keyword, and PEP 831, which enables frame pointers by default and exposes the build flags
    through sysconfig. The notes state that a single native component built without frame
    pointers breaks stack unwinding for the whole process.
  why: >-
    Code that relied on the locale encoding changes behaviour, and build backends compiling
    C, C++ or Rust outside Python's flags have to set the frame-pointer equivalents themselves.
  sources:
  - label: primary
    url: https://docs.python.org/3.15/whatsnew/3.15.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50021127
- title: >-
    Let's Encrypt moves all subscribers to 64-day certificates by default on 2027-02-10 and
    cuts authorization reuse to 10 days
  section: Top stories
  category: Infrastructure
  status: confirmed
  blurb: >-
    ACME renewal logic hard-coded to days before expiry breaks as Let's Encrypt shortens certificate
    lifetime to 64 days.
  summary: >-
    Let's Encrypt will issue 64-day certificates to all subscribers by default from 2027-02-10,
    unless a subscriber selects an even shorter lifetime of 45 or 6 days as previously announced.
    Authorization reuse drops from 30 days to 10 days. The staging environment switches to
    the shorter lifetime on 2026-10-14.
  why: >-
    Any renewal hard-coded to a fixed number of days from expiry breaks, so the actionable
    step is to grep cron jobs, wrapper scripts and runbooks for 83, 80 and 60 and move to
    ARI or two-thirds of lifetime before staging switches on 2026-10-14.
  followup: Track the staging switch on 2026-10-14 and the production date of 2027-02-10.
  sources:
  - label: primary
    url: https://letsencrypt.org/2026/10/07/64-day-certs.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50002249
- title: >-
    One unauthenticated POST stalls a react-server-dom app with a reachable server action,
    patched five months ago in 19.0.6, 19.1.7 and 19.2.6
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    One unauthenticated POST stalls a react-server-dom app for seconds per request, fixed
    quietly in May in three releases.
  summary: >-
    The advisory, CVE-2026-23870, states only that specially crafted HTTP requests to server
    function endpoints can cause out-of-memory exceptions or excessive CPU usage, and it names
    react-server-dom-webpack, react-server-dom-turbopack and react-server-dom-parcel at >=
    19.0.0 < 19.0.6, >= 19.1.0 < 19.1.7 and >= 19.2.0 < 19.2.6. The mechanism comes from the
    researcher writeup rather than the advisory: a crafted request makes the server rebuild
    form data in a loop that blocks the event loop, and the only input needed is a server
    action ID that the app prints in its own page HTML. The writeup measures about 4 seconds
    of freeze per request on a plain production build and about 10 seconds per request on
    a production-shaped setup, with three consecutive requests causing the fronting load balancer
    to drop the server from rotation and serve 503s to unrelated users.
  why: >-
    The writeup states the rebuild runs before any login, CSRF or origin check, so an app
    on an affected version with at least one server action anywhere it can be reached gains
    nothing from its own auth configuration.
  followup: >-
    Track whether React publishes a separate notice for the three fixed react-server-dom releases,
    given the fix shipped as a quiet backport.
  sources:
  - label: advisory
    url: https://github.com/advisories/GHSA-rv78-f8rc-xrxh
  - label: writeup
    url: https://simonkoeck.com/writeups/react-rsc-formdata-event-loop-dos
  - label: discussion
    url: https://news.ycombinator.com/item?id=50020073
- title: >-
    Anthropic launches OSS Scanner, sending model-generated vulnerability reports to enrolled
    open-source projects without human review
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Anthropic's OSS Scanner sends model-written vulnerability reports with proof of concept
    and fix to maintainers, unreviewed.
  summary: >-
    The announcement pairs OSS Scanner, which files model-generated vulnerability reports
    to open-source projects that enroll, with a Critical Infrastructure Defense Program listing
    11 founding partners. Each scanner report carries a proof of concept, an explanation and
    a suggested fix where one is available, and no human checks it before delivery. Anthropic
    states an expectation of above 90 percent true positives and warns that some reports will
    contain inaccuracies such as a wrong severity rating.
  why: >-
    Maintainers absorb the triage cost of unreviewed reports that the vendor itself expects
    to be wrong some of the time, one day after this archive published LWN's account of kernel
    maintainers already triaging a flood of model-written bug reports.
  followup: >-
    Check whether Anthropic publishes a true-positive rate measured on enrolled projects,
    rather than the stated above 90 percent expectation.
  sources:
  - label: primary
    url: https://www.anthropic.com/news/anthropic-cyber-mission
  - label: discussion
    url: https://news.ycombinator.com/item?id=50010605
- title: >-
    Anthropic's 2026 Usage Policy takes effect 2026-11-12 with new controls for agents that
    drive physical hardware
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Anthropic's 2026 Usage Policy, effective 2026-11-12, requires a human able to stop any
    Claude-driven physical equipment.
  summary: >-
    The updated policy takes effect 2026-11-12 and adds requirements for deployments where
    a model drives equipment that takes autonomous physical actions. A qualified operator
    must be able to observe and stop the equipment, and the equipment must hold a safe state
    if the model disconnects.
  why: >-
    Anyone connecting Claude to equipment that takes autonomous physical actions must keep
    a qualified operator able to observe and stop it, and the equipment must hold a safe state
    if the model disconnects, which is a concrete deployment requirement rather than the model-abuse
    clause the coverage led with.
  sources:
  - label: primary
    url: https://www.anthropic.com/news/2026-usage-policy-update
  - label: discussion
    url: https://news.ycombinator.com/item?id=50008565
