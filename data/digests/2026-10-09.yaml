- title: >-
    Jane Street indexes message bus subscribers per topic partition, with staging runs showing
    30 percent less CPU
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Jane Street shipped a per topic partition subscriber index to its message bus, with 30
    percent less CPU seen in staging.
  summary: >-
    The post describes replacing a linear subscriber filter in a critical message bus with
    an index keyed per topic partition, which is the part that shipped to production. The
    results section calls the 30 percent CPU reduction a preliminary staging measurement seen
    in some real-world scenarios, not a production result. A separate workstream on adaptive
    subtree-store splitting, motivated by an initial recovery that normally takes under 2.5
    seconds taking over 13 minutes, is deployed only to staging.
  why: >-
    The linear filter was cache friendly and fast until client count grew, which is the failure
    mode where an algorithmically poor choice holds up until concurrency changes.
