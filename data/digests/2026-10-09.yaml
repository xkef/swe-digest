- title: >-
    Mitchell Hashimoto publishes OSC 7501, a terminal escape sequence for programs to report
    their own status
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    Mitchell Hashimoto proposes OSC 7501, a terminal escape sequence letting a program report
    its own status over the pty.
  summary: >-
    OSC 7501 lets a running program report its status to the terminal instead of leaving the
    terminal to infer it. The post cites agent inboxes that regex-match window titles today,
    including a Herdr manifest carrying 16 rules for Claude Code that changed ten times in
    three months. The post lists implementations in libghostty and Rex, plus proof-of-concept
    implementations in Terraform, Claude Code, Codex and Homebrew carried as plugins or forks.
  why: >-
    The sequence rides the pty a program already has, so status reporting works over SSH and
    inside containers where a window title does not survive.
  followup: >-
    Check whether the proof-of-concept implementations in Terraform, Claude Code, Codex and
    Homebrew land upstream rather than staying in plugins and forks.
  sources:
  - label: primary
    url: https://mitchellh.com/writing/program-status-osc7501
  - label: discussion
    url: https://news.ycombinator.com/item?id=49984159
- title: >-
    Bevy 0.20 adopts the WESL shader language and turns Solari's ReSTIR off by default
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    Bevy 0.20 replaces its extended WGSL shader dialect with WESL and turns Solari's ReSTIR
    lighting off by default.
  summary: >-
    Bevy 0.20 moves shaders from the engine's extended WGSL dialect to WESL, with shader files
    renamed to `.wesl`. The Solari pathtraced renderer ships with ReSTIR disabled by default.
  why: >-
