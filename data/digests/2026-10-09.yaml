    self-hosting hardware cost.
  summary: >-
    The post asks why a cheap open-weight DeepSeek release drew little reaction compared with
    earlier ones. The thread answers with deployment arithmetic rather than model quality.
  why: >-
    Reaction to an open-weight release tracks the hardware needed to serve it rather than
    its licence or its listed price, so a cheap model can still be unreachable for self-hosting.
