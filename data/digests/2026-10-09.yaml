- title: >-
    An htmx essay on whether to learn to code draws a long thread on reading versus writing
    code
  section: Hacker News
  category: Engineering post
  status: discussion
  blurb: >-
    An htmx essay on whether to learn to code draws a long Hacker News thread on reading code
    versus writing it with models.
  summary: >-
    The essay argues for learning to code alongside model use. The thread turns on whether
    a prompt stands to a model as source stands to a compiler.
  why: >-
    If a prompt change can only be evaluated empirically, prompts cannot be reviewed the way
    source changes are, and review practice has to rest on measured output instead.
  comments: >-
    The strongest objection in the thread is that the compiler analogy fails, because source-to-binary
    changes can be reasoned about with formal precision while the effect of adding or removing
    a word in a prompt can only be found by running the model.
  sources:
  - label: primary
    url: https://htmx.org/essays/yes-and/
  - label: discussion
