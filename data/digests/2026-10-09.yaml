- title: >-
    C2y draft removes 45 of roughly 100 instances of undefined behaviour in the C standard
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    The C2y working draft removes 45 of roughly 100 instances of undefined behaviour from
    the C standard, per LWN's report.
  summary: >-
    LWN reports that the C2y working draft removes 45 of roughly 100 instances of undefined
    behaviour. C23 already added a no-time-travel rule that stops compilers hoisting work
    above an operation that may be undefined. Pointer equality comparison stays defined by
    the standard and is still miscompiled by both Clang and GCC.
  why: >-
    Code that compares pointers for equality cannot rely on the standard defining that behaviour,
    because both Clang and GCC miscompile it today, which is the gap a C2y edition closing
    45 undefined-behaviour cases still leaves for a C codebase to work around.
  sources:
  - label: primary
    url: https://lwn.net/Articles/1095811/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50015074
- title: >-
    Google replaces Pytype with Meta's Pyrefly as its Python type checker, reporting over
    80 percent less type-checking compute
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Google retires Pytype for Meta's Pyrefly and reports over 80 percent less compute spent
    type-checking its Python code.
  summary: >-
    Google adopted Pyrefly, written at Meta, as the Python type checker for its internal codebase
    in place of Pytype. The post reports over 80 percent less compute spent on type checking.
    Pytype's last supported release targets Python 3.12.
  why: >-
    Pytype's last supported release is Python 3.12 and Pyrefly enforces sound union checking
    where Pytype was permissive, so any project following Google off Pytype should expect
    new errors at call sites that pass union-typed values into specific-typed parameters.
  sources:
  - label: primary
    url: https://opensource.googleblog.com/2026/10/adopting-pyrefly-as-the-python-type-checker-at-google.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50004742
- title: >-
    XMFS prototype proposes exposing cross-node shared memory as a POSIX filesystem tier
  section: Linux and kernel
  category: Event
  status: discussion
  blurb: >-
    An LPC microconference talk proposes XMFS, exposing memory shared over CXL 3.0 or Huawei
    United Bus as a filesystem tier.
  summary: >-
    The Linux Plumbers page describes a 20-minute microconference talk proposing XMFS, which
    would expose memory shared across nodes over memory-semantic interconnects such as CXL
    3.0 and Huawei United Bus through a POSIX filesystem interface. It lists four open problems
    and is a proposal for discussion rather than a merged filesystem.
  why: >-
    The four open problems name where the kernel has no answer for memory shared without hardware
    cache coherence, in particular whether software coherence policy belongs in individual
    filesystems, in the memory-management subsystem, or in new generic infrastructure.
  sources:
  - label: talk
    url: https://lpc.events/event/20/contributions/2516/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50002009
- title: >-
    Kernel patch removes the Assisted-by tag from the documentation after the Maintainers
    Summit agreed to deprecate it
  section: Linux and kernel
  category: Linux/Kernel
  status: developing
  blurb: >-
    A kernel patch deletes the Assisted-by tag from four files, including checkpatch.pl, after
    the Maintainers Summit.
  summary: >-
    The patch touches four files, citing agreement at the Maintainers Summit to deprecate
    the tag: coding-assistants.rst loses the whole Attribution section defining the `Assisted-by:
    LLM [TOOL1] [TOOL2]` format, submitting-patches.rst and its it_IT translation lose their
    references, and checkpatch.pl drops Assisted-by from `$signature_tags` along with its
    value check. The removed text in submitting-patches.rst stated that failing to add the
    tag may impede the acceptance of your work. The patch is not merged and the thread carries
    five replies.
  why: >-
    The checkpatch.pl removal is what ends machine recognition of the tag, so if this lands
    the kernel stops asking for a machine-readable record of which commits involved a coding
    assistant, in the same month its maintainers published figures on triaging model-written
    bug reports.
  followup: >-
    Track whether the removal is merged and what the five replies on the thread argue.
