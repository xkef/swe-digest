- title: Anthropic suspends Fable 5 and Mythos 5 after US export directive
  section: Top stories
  category: AI
  blurb: >-
    Anthropic disabled Fable 5 and Mythos 5 for all users after US export directive citing
    a narrow jailbreak vulnerability.
  summary: >-
    Anthropic received a US government export control directive at 17:21 ET on 2026-06-12
    to suspend all access to Fable 5 and Mythos 5 by any foreign national, inside or outside
    the United States, including foreign-national Anthropic employees. Anthropic disabled
    both models for all customers to comply; access to all other Anthropic models is unaffected.
    Anthropic states the letter gave no specific national security detail and that its understanding
    is the government is concerned with a method of jailbreaking Fable 5, which it describes
    as narrow and non-universal and consisting of asking the model to read a codebase and
    fix software flaws, a capability it says is available in other models including OpenAI
    GPT-5.5.
  why: >-
    Any integration on `claude-fable-5` or Mythos 5 fails immediately and must fail over to
    Opus 4.8 or another model; the directive sets a precedent that a single reported jailbreak
    can force a frontier model offline.
  followup: >-
    Track whether the directive is lifted, narrowed, or extended to other models or providers;
    watch for an official government statement and any legal challenge.
  comments: >-
    HN commenters debated refunds, export-control precedent, and whether a narrow jailbreak
    justifies recalling a model deployed to hundreds of millions; several argued the cited
    code-analysis capability exists in other frontier models.
  sources:
