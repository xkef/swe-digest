- title: Arch Linux AUR supply-chain attack hits more than 1,500 packages
  section: Security
  category: Security
  blurb: >-
    Attackers hijacked over 1,500 AUR packages and injected malicious npm dependencies delivering
    an infostealer with an optional eBPF rootkit.
  summary: >-
    Attackers hijacked orphaned packages in the Arch User Repository (AUR) by claiming them
    through the standard adoption process, then modified each package's `PKGBUILD` build script
    to silently fetch and install malicious npm packages (reported as `atomic-lockfile` and
    `js-digest`) during installation, delivering a Linux infostealer with credential-harvesting,
    anti-debugging, and data-exfiltration functionality plus an optional eBPF rootkit. The
    affected count grew from more than 400 packages on 2026-06-11 to more than 1,500 by 2026-06-12.
    Arch published an official incident notice on 2026-06-12 stating it was actively tracking
    down malicious commits, with AUR account creation, package updates, and package adoption
    disrupted during cleanup; by the end of 2026-06-12 maintainers believed they had removed
    all known malicious commits and consider the incident under control. The official Arch
    binary repositories are unaffected.
  why: >-
    The AUR adopt-orphaned-package model let one actor push credential-stealing build scripts
    into a large share of community packages, and any AUR helper that runs `PKGBUILD` scripts
    without review during this window could have executed the payload on developer machines.
  followup: >-
    Watch for confirmed credential theft in the wild, AUR adoption-policy changes, and the
    final affected-package count.
  sources:
  - label: Arch Linux news
    url: https://archlinux.org/news/active-aur-malicious-packages-incident/
  - label: Phoronix
    url: https://www.phoronix.com/news/Arch-Linux-AUR-More-Than-1500
  - label: PrivacyGuides
    url: https://www.privacyguides.org/news/2026/06/12/around-1-500-aur-packages-compromised-with-rootkit-like-malware/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48516379
- title: AMD denies $10,000 bounty for auto-updater RCE; CVE-2026-40677
  section: Security
  category: Security
  blurb: >-
    A researcher reported an RCE in AMD's auto-updater exploitable via MITM due to CRC32 validation;
    AMD initially denied the bounty.
  summary: >-
    A researcher (MrBruh) reported a remote code execution flaw in AMD's auto-update software,
    exploitable via a man-in-the-middle attack because the downloaded executable was validated
    only with a CRC32 check rather than a cryptographic signature. AMD initially closed the
    report as out of scope and paid no bounty; the issue was later assigned CVE-2026-40677
    (CVSS 7.7) and took 124 days to patch, with the embargo ending 2026-06-09. After the write-up
    reached HN, AMD's bulletin acknowledged the vulnerability and credited the researcher.
  why: >-
    Software auto-updaters that skip signature verification are a direct supply-chain delivery
    path, and the disclosure-handling dispute affects whether researchers keep reporting to
    AMD.
