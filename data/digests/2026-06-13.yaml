- title: WASI 0.3 ratified with first-class async
  section: Languages and runtimes
  category: Languages
  blurb: >-
    WASI 0.3.0 ratified with async moved into the WebAssembly Component Model canonical ABI,
    replacing WASI 0.2 pollable patterns.
  summary: >-
    The WASI Subgroup ratified WASI 0.3.0 on 2026-06-11. The release moves async into the
    WebAssembly Component Model canonical ABI, making `stream<T>` and `future<T>` first-class
    constructs and replacing the WASI 0.2 pollable and resource-based stream patterns. The
    model shifts from readiness-based to completion-based async, with the host managing one
    shared event loop for all components instead of each component carrying its own. `wasi:http`
    is reorganized into `service` and `middleware` worlds, enabling component-to-component
    service chaining without network calls. Wasmtime 45 supports the release candidate; Wasmtime
    46 will ship WASI 0.3.0 with async enabled by default. The `jco` JavaScript toolchain
    supports it, and guest toolchain support for Rust, Go, JavaScript, Python, and C is in
    progress.
  why: >-
    First-class async in the canonical ABI removes the per-component event-loop workarounds
    that made WASI 0.2 async awkward, and direct component composition lets WebAssembly microservices
    chain without network hops.
  followup: >-
    Track Wasmtime 46 stable, jco default-enabled release, and Rust, Go, and Python guest
    toolchain support reaching stable.
  sources:
  - label: Bytecode Alliance announcement
    url: https://bytecodealliance.org/articles/WASI-0.3
  - label: WASI v0.3.0 release
    url: https://github.com/WebAssembly/WASI/releases/tag/v0.3.0
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48504063
