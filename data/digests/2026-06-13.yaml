- title: Oracle PeopleSoft CVE-2026-35273 zero-day actively exploited; CISA KEV
  section: Top stories
  category: Security
  blurb: >-
    CVE-2026-35273, an unauthenticated RCE in Oracle PeopleSoft, was exploited for two weeks
    before patching and added to CISA KEV.
  summary: >-
    CVE-2026-35273 (CVSS 9.8) is an unauthenticated remote vulnerability in the Updates Environment
    Management component of Oracle PeopleSoft Enterprise PeopleTools, classified as server-side
    request forgery and leading to remote code execution. It was exploited as a zero-day between
    2026-05-27 and 2026-06-09, two weeks before Oracle's 2026-06-10 out-of-band advisory;
    Google attributes exploitation to ShinyHunters. PeopleTools 8.61 and 8.62 are affected.
    CISA added it to the Known Exploited Vulnerabilities catalog on 2026-06-12 and ordered
    federal agencies to patch.
  why: >-
    Internet-exposed PeopleSoft handles HR and financial data, and unauthenticated RCE under
    active extortion-group use makes unpatched instances an immediate breach risk.
  followup: >-
    Watch for confirmed data-theft victims, ransomware follow-on, and the federal remediation
    deadline.
  sources:
