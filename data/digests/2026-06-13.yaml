- title: Spring Boot 4.1.0 released
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Spring Boot 4.1.0 reaches GA with first-class gRPC support, expanded OpenTelemetry configuration,
    and SSRF mitigation via InetAddressFilter.
  summary: >-
    Spring Boot 4.1.0 reached general availability on 2026-06-10. New features include first-class
    gRPC server and client support with standalone Netty and HTTP/2 servlet options, auto-configuration
    of Jackson read and write features through `spring.jackson.read.` and `spring.jackson.write.`
    properties, expanded OpenTelemetry configuration (SDK disable toggle, batch log processor,
    sampler, span and log limits, OTLP exemplars), and SSRF mitigation via an `InetAddressFilter`
    for both reactive and blocking HTTP clients. The release deprecates Derby database support,
    removes the deprecated layertools jar mode, and changes Maven so `-DskipTests` no longer
    skips AOT processing (use `maven.test.skip`). It bundles Spring Framework 7.0.8, Spring
    Security 7.1.0, Netty 4.2.15, Tomcat 11.0.22, and Hibernate 7.4.1.
  why: >-
    Teams on the Spring Boot 4.x line get native gRPC and built-in SSRF filtering, while the
    Derby deprecation and layertools and Maven AOT changes are concrete migration steps for
    upgraders.
  followup: Track 4.1.x patch cadence and any 4.0.x to 4.1 migration friction reports.
