- title: AI agent finds 21 zero-days in FFmpeg for about $1,000
  section: Top stories
  category: Security
  blurb: >-
    DepthFirst's autonomous agent discovered 21 FFmpeg vulnerabilities for about $1,000, including
    an RCE in the AV1 RTP depacketizer.
  summary: >-
    DepthFirst reports its autonomous security agent found 21 previously unknown vulnerabilities
    in FFmpeg at a cost of about $1,000, spanning the TS demuxer, VP9 decoder, swscale, RTP
    depacketizers, DASH demuxer, RTSP server, RTMP client, and the option parser. Nine carry
    CVE identifiers (CVE-2026-39210 through CVE-2026-39218); the remainder are fixed upstream
    and awaiting numbers. The most severe, DFVULN-127, is a heap buffer overflow in the AV1
    RTP depacketizer where a single 183-byte packet over a network-reachable RTSP stream can
    redirect execution to an unauthenticated RCE primitive. Several bugs had been latent for
    15 to 20 years.
  why: >-
    FFmpeg is embedded across media pipelines and browsers, so network-reachable RTP and RTSP
    overflows are broadly exposed, and the result shows agent-driven bug finding is now cheap
    enough to scale.
  followup: >-
    Track CVE assignment for the remaining 12 findings and downstream re-vendoring of patched
    FFmpeg.
  comments: >-
    HN discussion separated genuine memory-safety findings from agent-volume noise and debated
    maintainer burden from AI-generated reports against FFmpeg.
  sources:
  - label: DepthFirst research
    url: https://depthfirst.com/research/21-zero-days-in-ffmpeg
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48510046
