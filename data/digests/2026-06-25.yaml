- title: LastPass confirms customer data exposed in Klue supply-chain breach
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    LastPass confirmed Salesforce customer data was accessed after OAuth tokens were stolen
    in a Klue breach, affecting support-case data.
  summary: >-
    LastPass confirmed on 2026-06-23 that Salesforce customer data, including names, phone
    numbers, email and physical addresses, and the contents of support cases, was accessed
    after OAuth tokens were stolen in a breach of Klue, a third-party market-intelligence
    platform. LastPass says its products, infrastructure, and password vaults were not affected.
    The Klue compromise, claimed by the Icarus extortion group through compromised legacy
    integration credentials, also hit Recorded Future, Tanium, Jamf, Sprout Social, Gong,
    and Insurity. The Hacker News thread reached 309 points.
  why: >-
    Stolen Salesforce-integration OAuth tokens are a recurring supply-chain vector, and exposed
    support-case data is usable for targeted phishing against LastPass users even though vaults
    were untouched.
