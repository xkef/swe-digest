- title: 'Show HN: Nub, a purely additive Bun-like toolkit for Node.js'
  section: Hacker News
  category: Pulse
  status: discussion
  blurb: >-
    Nub wraps the standard node command with TypeScript transpilation and custom module resolution
    without Nub-specific APIs or config.
  summary: >-
    A Show HN for Nub, a Node.js toolkit by Colin McDonnell (author of Zod), reached 222 points.
    Rather than replacing the runtime like Bun, Nub wraps the standard `node` command with
    a preload hook to add oxc-powered TypeScript transpilation, custom module resolution,
    and polyfills such as `Worker` and `Temporal`, plus script and package runner helpers,
    while introducing no Nub-specific APIs, config, or environment variables. The author cites
    a `--require` hook with about 0.5ms overhead against 4.6ms for `--import`, using Node's
    synchronous `module.registerHooks()` API.
  why: >-
    It is a lighter path to Bun-style ergonomics that stays on the standard Node runtime,
    reducing migration risk for teams that want TypeScript-first tooling without switching
    engines.
