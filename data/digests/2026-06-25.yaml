- title: Qualcomm to acquire Modular
  section: Top stories
  category: Markets
  status: confirmed
  blurb: >-
    Qualcomm announced an agreement to acquire Modular, the company behind the Mojo language
    and MAX AI serving framework.
  summary: >-
    Qualcomm announced 2026-06-24 an agreement to acquire Modular, the company behind the
    Mojo language and the MAX GenAI serving framework, with the deal expected to close in
    the second half of 2026 pending regulatory approval. Terms were not disclosed. Modular
    frames the goal as an open, vendor-neutral software stack that runs AI efficiently across
    CPU and GPU architectures from edge to cloud; the announcement gives no specifics on what
    changes for the existing open-source projects.
  why: >-
    Modular's Mojo and MAX are a bet on portable, hardware-agnostic AI inference, and a Qualcomm
    owner pulls that stack toward Qualcomm silicon, raising questions about the future neutrality
    of the Mojo toolchain and MAX runtime that teams have started adopting.
  followup: >-
    Watch the deal close in H2 2026, the licensing and governance of Mojo and MAX after close,
    and whether the cross-vendor GPU/CPU support continues.
  sources:
