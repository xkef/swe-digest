- title: Google adds computer use to Gemini 3.5 Flash
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Google integrated computer use into Gemini 3.5 Flash, letting developers build agents
    that see and act on screens.
  summary: >-
    Google made computer use a built-in tool in Gemini 3.5 Flash on 2026-06-24, letting developers
    build agents that see and act across browser, mobile, and desktop environments rather
    than calling a separate computer-use model. It is available through the Gemini API with
    a reference implementation, through the Gemini Enterprise Agent Platform, and via a Browserbase-hosted
    demo, and adds two enterprise safeguards: explicit user confirmation for sensitive actions
    and automatic task stoppage when prompt injection is detected. Google shows an OSWorld
    benchmark chart but did not state numeric results in the post text.
  why: >-
    Folding computer use into the cheaper Flash tier lowers the cost of GUI-driving agents
    for testing and knowledge-work automation, and the built-in prompt-injection stop is a
    direct response to the main security failure mode of these agents.
  followup: >-
    Watch for the published OSWorld numbers with method, real-world reliability reports, and
    how the injection-detection safeguard performs against adversarial pages.
  sources:
  - label: Google blog
    url: https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-computer-use-gemini-3-5-flash/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48662999
- title: Node.js v26.4.0 adds a virtual file system and TLS certificate compression
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Node.js v26.4.0 added a virtual file system subsystem, package maps in module resolution,
    and TLS certificate compression.
  summary: >-
    Node.js published v26.4.0 on the Current line on 2026-06-24. New semver-minor features
    include a minimal `node:vfs` subsystem with `node:fs/promises` dispatch to mounted instances,
    package maps in the module loader, a `certificateCompression` option for TLS, caller-supplied
    buffers in `readFile()`, and `TCP_KEEPINTVL`/`TCP_KEEPCNT` support in `setKeepAlive()`.
    No security fixes were called out in the notable-changes list.
  why: >-
    The virtual file system and package maps extend module-resolution and embedding options
    for tools and bundlers, and TLS certificate compression cuts handshake bytes for high-volume
    clients.
  followup: >-
    Track `node:vfs` and `blockList` (now release-candidate) toward stability and any backport
    of these features to the active LTS line.
  sources:
  - label: GitHub release
    url: https://github.com/nodejs/node/releases/tag/v26.4.0
- title: PostHog rewrites its SQL parser in Rust with a coding agent
  section: Top stories
  category: Engineering post
  status: discussion
  blurb: >-
    PostHog replaced its ANTLR SQL parser with a hand-written recursive-descent parser in
    Rust, achieving 454x faster parsing.
  summary: >-
    PostHog replaced its ANTLR-generated SQL parser with a hand-written recursive-descent
    parser with a Pratt expression core, written in Rust, reporting 454x faster parsing on
    production queries (70x on the author's laptop). The author says Claude Opus 4.7 generated
    the 16,000+ lines across parallel sessions while they "barely looked at the code," and
    that correctness came from property-based testing with Hypothesis, coverage-guided test
    generation, and differential testing against the original ANTLR parser rather than manual
    review.
  why: >-
    It is a concrete data point that a heavy test harness, not line-by-line review, can be
    the control that makes large agent-generated rewrites shippable.
  followup: >-
    Watch for the parser's production rollout results and any correctness regressions the
    harness missed.
  comments: >-
    HN discussion focused on whether agent-written code is trustworthy without human reading,
    with the author arguing the differential and property-based test harness, not the model,
    is what guarantees the rewrite matches the old parser.
  sources:
  - label: PostHog blog
    url: https://posthog.com/blog/sql-parser
  - label: discussion
    url: https://news.ycombinator.com/item?id=48663544
