- title: Paper reports low-bit quantization inflates reasoning-model output length
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    A preprint argues low-bit quantization of reasoning models inflates output length, offsetting
    memory and bandwidth savings quantization delivers.
  summary: >-
    A preprint posted 2026-06-25 argues that quantizing reasoning models to low bit widths
    inflates the number of reasoning tokens they emit, so the extra generation length partly
    offsets the memory and bandwidth savings quantization is meant to deliver. The authors
    present this token inflation as a hidden cost not captured by accuracy-at-fixed-budget
    comparisons. Results are the authors' own and not independently reproduced.
  why: >-
    If it holds, teams choosing quantization for reasoning-model serving need to budget for
    longer outputs, not just smaller weights, when estimating latency and cost.
  followup: >-
    Watch for independent reproduction across model families and quantization schemes.
  sources:
  - label: arXiv 2606.25519
    url: https://arxiv.org/abs/2606.25519
