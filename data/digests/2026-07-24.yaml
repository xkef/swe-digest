- title: Stripe in talks to acquire OpenRouter for about $10 billion
  section: Markets and companies
  category: Markets
  status: developing
  blurb: >-
    Stripe is in talks to acquire OpenRouter, an AI model marketplace serving five million
    developers with unified routing across hundreds of models.
  summary: >-
    The Wall Street Journal reported on 2026-07-24 that Stripe is in talks to acquire OpenRouter
    in a deal that could value the AI model marketplace at roughly $10 billion, up from a
    $1.3 billion valuation in a May 2026 funding round. OpenRouter gives more than five million
    developers access to hundreds of models from OpenAI, Anthropic, and open-weight providers
    through a single API, with provider comparison and routing. Stripe already handles OpenRouter's
    payments, invoicing, tax, and fraud tooling, so an acquisition would extend it from processing
    AI revenue into the infrastructure developers use to access and pay for models. The report
    states an agreement could be announced soon but that the talks could still fall apart
    or draw another buyer.
  why: >-
    OpenRouter is a common single-API abstraction over many model providers, so ownership
    by a payments company would couple model routing and billing and affect the developers
    and products that depend on it.
  followup: >-
    Watch for a confirmed agreement or its collapse, any pricing, routing, or data-handling
    change, and whether another buyer emerges.
  sources:
  - label: WSJ
    url: https://www.wsj.com/tech/ai/stripe-in-talks-to-buy-buzzy-ai-model-marketplace-openrouter-decc6a74
  - label: The Next Web
    url: https://thenextweb.com/news/stripe-openrouter-10-billion-ai-model-marketplace-acquisition
