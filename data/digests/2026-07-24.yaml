- title: Armin Ronacher argues Codeberg's AI-code ban is unenforceable
  section: Reddit and social pulse
  category: Pulse
  status: discussion
  blurb: >-
    Armin Ronacher criticized Codeberg's AI-code ban as unenforceable and too discretionary,
    arguing for stricter rules or abuse-focused moderation.
  summary: >-
    Armin Ronacher published a post on his own site criticizing Codeberg's Terms-of-Use amendment
    that bars projects "mostly" written by generative AI. He argues the "mostly" threshold
    is not clearly enforceable and delegates too much discretion to moderators, and that Codeberg
    should either adopt a stricter, well-defined prohibition or focus on preventing abuse
    rather than categorically limiting AI-generated code. This is one tracked practitioner's
    opinion, not a Codeberg policy change.
  why: >-
    It adds a recognized-maintainer voice to the open-source-forge governance debate over
    how, and whether, code hosts should police AI-authored projects.
  sources:
  - label: lucumr.pocoo.org
    url: https://lucumr.pocoo.org/2026/7/24/codeberg-divides/
  - label: HN 49036765
    url: https://news.ycombinator.com/item?id=49036765
