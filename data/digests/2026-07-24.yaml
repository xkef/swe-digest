- title: Hanwha security camera firmware shipped a GitHub admin token in the login page
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Hanwha firmware leaked a GitHub admin token in the login UI by exporting CI environment
    variables into the frontend bundle via Vite.
  summary: >-
    A researcher decrypted the firmware of Hanwha Vision security cameras, ran a secret scanner
    over the root filesystem, and found a GitHub token embedded in roughly 30 files, including
    the camera login UI. The token held admin access to hundreds of repositories in Hanwha's
    GitHub organization. The root cause was a Vite build step that exported the entire CI
    environment (`process.env`), including a `GITHUB_NPM_TOKEN`, into the shipped frontend
    bundle. Hanwha responded within 12 hours of disclosure and confirmed the token was revoked.
    The writeup also reports finding Department of Defense-assigned IP addresses in the CI
    environment variables, which it attributes to sister companies rather than direct involvement.
    No CVE was assigned.
  why: >-
    A CI environment variable leaked into a frontend build can hand an attacker organization-wide
    source-code access, a failure mode that applies to any Vite or bundler pipeline that forwards
    `process.env`.
  comments: >-
    HN commenters note that build tools exporting `process.env` into client bundles is a recurring
    leak pattern, and that firmware extraction plus automated secret scanning makes such leaks
    trivial to find at scale.
  sources:
  - label: researcher writeup
    url: https://hhh.hn/hanwha-github-token/
  - label: HN 49034292
    url: https://news.ycombinator.com/item?id=49034292
- title: India orders GitHub to take down the Bitchat repositories
  section: Security
  category: Security
  status: developing
  blurb: >-
    India ordered GitHub to remove Bitchat decentralized messenger repositories, arguing the
    app frustrates lawful interception efforts.
  summary: >-
    India's Indian Cyber Crime Coordination Centre (I4C), under the Ministry of Home Affairs,
    directed GitHub to disable access to three repositories hosting Jack Dorsey's Bitchat,
    including the Android app and source code, within three hours of the notice. Bitchat is
    a decentralized peer-to-peer messenger that uses Bluetooth mesh networking instead of
    mobile networks, Wi-Fi, or central servers, which the government argues frustrates lawful
    interception during ongoing protests in New Delhi. The order cites Section 79(3)(b) of
    the Information Technology Act, 2000, and Rule 3(1)(d) of the 2021 Intermediary Guidelines.
    It was not confirmed whether GitHub complied within the deadline, and the app remained
    available in major app stores.
  why: >-
    A state order for GitHub to remove source-code repositories over an app's architecture
    tests how a code-hosting platform responds to government takedown demands, with direct
    consequences for developers who rely on it for distribution.
  followup: >-
    Watch for whether GitHub complied, any legal challenge, and whether mirrors or forks keep
    the code available.
  sources:
  - label: CoinDesk
    url: https://www.coindesk.com/tech/2026/07/24/india-orders-takedown-of-jack-dorsey-s-bitcoin-linked-messaging-app-bitchat
  - label: The Hindu
    url: https://www.thehindu.com/news/national/government-orders-github-to-remove-bluetooth-based-chat-app-bitchat-over-security-concerns-jack-dorsey/article71262049.ece
