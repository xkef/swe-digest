- title: JEP 540 proposes a standard JSON API for the JDK
  section: Languages and runtimes
  category: Languages
  status: developing
  blurb: >-
    JEP 540 defines an incubating JSON API for the JDK to remove third-party dependencies
    like Jackson or Gson for basic parsing.
  summary: >-
    JEP 540 defines a small standard incubator API for parsing and generating JSON in the
    JDK without an external library. It supersedes JEP 198 (Light-Weight JSON API, 2014) and
    is delivered as an incubating module rather than a final or preview feature, so its package
    and shape can change before standardization. The target JDK release is not confirmed here.
  why: >-
    A built-in JSON API would remove a near-universal third-party dependency (Jackson, Gson)
    for basic parsing and generation across the JVM ecosystem.
  followup: >-
    Confirm the target JDK release and whether the incubator API graduates or changes shape.
  sources:
  - label: JEP 540
    url: https://openjdk.org/jeps/540
  - label: HN 49023809
    url: https://news.ycombinator.com/item?id=49023809
- title: Deno 2.9.4 patch release
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Deno 2.9.4 upgrades V8 to 150.2.0, adds Node-compatibility features, and tightens FFI
    permission requirements for native window handles.
  summary: >-
    Deno released 2.9.4 on 2026-07-23, a patch on the 2.9 line. It upgrades V8 to 150.2.0,
    adds a raw ChaCha20 cipher and a byteLength parameter to Buffer index methods in the Node
    compatibility layer, and fixes several core module-loading and desktop-bundling issues,
