- title: Buz forks Bun back onto modern Zig
  section: Languages and runtimes
  category: Languages
  status: discussion
  blurb: >-
    Buz is a work-in-progress fork of Bun from before the Zig-to-Rust rewrite, targeting 1.4.0
    feature parity with sub-one-second incremental builds.
  summary: >-
    A developer posting as jazzzooo published Buz on 2026-07-24, a work-in-progress fork of
    Bun taken from the codebase before Bun's rewrite from Zig to Rust. Buz targets feature
    parity with Bun 1.4.0, builds against a lightly patched Zig master, moves the whole build
    graph including vendored JavaScriptCore into `build.zig`, removes over 11,000 lines of
    dead code, and claims sub-one-second incremental builds. It is the second such fork after
    Cruller, which the author says they had not examined.
  why: >-
    Two independent forks continuing Bun on Zig show sustained interest in the pre-Rust runtime
    and in Zig's incremental-build story, though neither is production-proven.
