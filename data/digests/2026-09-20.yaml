- title: AWS says data held only in its Bahrain region cannot be restored
  section: Top stories
  category: Outage
  blurb: >-
    AWS states that data held only in Bahrain me-south-1 or the mec1-az2 zone of UAE me-central-1
    cannot be restored.
  summary: >-
    DatacenterDynamics, in a report dated 2026-09-16, says AWS provided undated status updates
    stating that resources and data held exclusively in me-south-1, or exclusively in the
    mec1-az2 availability zone of me-central-1, cannot be restored. The report attributes
    the loss to physical damage: the Bahrain and UAE facilities were struck by Iranian drones
    during the US-Israel-Iran conflict, with a second attack on Bahrain claimed by the IRGC
    in July. The Bahrain statement is the one saying the damage exceeded what its regional
    and multi-AZ services are designed to withstand, while for the UAE, AWS says it continues
    to work on recovering regional resources and the mec1-az1 and mec1-az3 zones. AWS says
    it is replacing the affected infrastructure, will update on restoration in the coming
    months, and will share its plans for Bahrain in early 2027. An Amazon spokesperson told
    DatacenterDynamics that reading the updates as a decision not to reopen the sites contradicts
    them, then declined to say whether the sites reopen with new hardware or as new facilities.
    The report predates this page and the Hacker News thread resurfaced on 2026-09-19.
  why: >-
    Any recovery plan that treats an AWS region as the durability boundary has to be re-derived
    from cross-region copies, because AWS now states in-region data is gone rather than delayed.
  followup: >-
    Track the restoration update AWS says is coming and the Bahrain plans promised for early
    2027.
  thread: f-0031
  sources:
  - label: DatacenterDynamics report
    url: https://www.datacenterdynamics.com/en/news/aws-unable-to-restore-access-to-data-centers-hit-by-iran-strikes/
  - label: HN submission
    url: https://news.ycombinator.com/item?id=49766505
- title: Hash audit reports key-free multicollisions in 13 non-cryptographic hashes
  section: Top stories
  category: Security
  blurb: >-
    An audit reports key-independent multicollisions for 13 non-cryptographic hashes, including
    CityHash64 and MurmurHash3.
  summary: >-
    Thomas Ahle published an audit on his own site reporting arbitrarily many inputs that
    collide under every seed, constructed without knowing the key, for gxhash, MUM, mir, mx3,
    fasthash, pengyhash, MuseAir v0.3, a5hash-128, nmhash32x, Abseil Hash, CityHash64, FarmHash64
    and MurmurHash3. The post states he disclosed upstream before publishing, links maintainer
    replies for xxHash, komihash, MuseAir and foldhash, and reports a maintainer consensus
    that only true multicollision attacks are worth fixing. Two limits are stated in the post
    itself and a reader would not infer either. The analysis itself was carried out with a
    model, which the author says found the bad inputs, and he states he was able to find mistakes
    in some results and verify others in Lean, warns the write-up contains errors, and says
    he trusts only the concrete examples found and measured plus the Lean-checked bounds.
    The bounds are on equality of the full 64-bit output, and the post is explicit that a
    full-output bound does not automatically carry to a bucket index, so the practical hash-table
    claim is narrower than the headline. Version scope is given per entry rather than left
    open: the appendix states each entry gives the exact code version alongside the message
    bytes and the derivation, and the versions named across the post include MUM v3, mx3 v3,
    pengyhash v0.3, nmhash32x v2, MuseAir v0.3, MurmurHash3 x64_128, XXH3-64 0.8.3, wyhash
    final v4.3, rapidhash v1 and v3, and foldhash-fast and foldhash-quality 0.2.0. a5hash-128
    names an output width rather than a version, because the post plots a5hash-64 beside it.
  why: >-
    The named hashes sit under hash tables that take attacker-controlled keys, and a collision
    family built without knowledge of the seed leaves seed randomization as a defence that
    does not hold.
  followup: >-
    Track whether any of the 13 named hashes ships a fix or a documented adversarial-input
    caveat.
  sources:
  - label: Ahle post
    url: https://thomasahle.com/blog/adversarial-examples-for-hashes/
  - label: HN submission
    url: https://news.ycombinator.com/item?id=49775383
- title: OpenAI ad collector loads from advertiser pages with a ChatGPT cookie attached
  section: Top stories
  category: AI
  blurb: >-
    A researcher reports one OpenAI cookie, __obi, rides advertiser-page requests and binds
    them to a ChatGPT account.
  summary: >-
    The write-up names a single identifier, `__obi`, set by `bzr.openai.com`, scoped to `.openai.com`
    with a `Max-Age` of one year and `SameSite=None`, and reports it bound to the ChatGPT
    account subject through a 60-second RS256 JWT. It states `__obi` is the only OpenAI identifier
    configured with `SameSite=None` and that every other OpenAI cookie was blocked on the
    same requests, and that OpenAI's own cookie policy classifies it as an Analytics cookie,
    so a visitor who grants analytics consent and refuses marketing consent still receives
    it. The browser attaches that one cookie to the `script src` request fetching the conversion
    pixel SDK before any OpenAI code runs, so the SDK's own no-credentials fetch path does
    not stop it, and the advertiser cannot read the value because it belongs to a domain their
    scripts cannot access. The author marks his own limits, namely that the observation is
    on Chrome for Android, that roughly one ChatGPT session in five produced a sync token,
    and that the server-side join to an account is inferred from the design rather than watched,
    and he states OpenAI Support acknowledged an inquiry sent 2026-09-14 and answered neither
    question.
  why: >-
    One analytics-classified cookie resolves advertiser-page browsing to a ChatGPT identity,
    and the site operator who installed the pixel can neither read the value nor see that
    it was sent.
  followup: >-
    Track whether OpenAI answers the two questions or documents what the ad collector identifier
    is joined to.
  sources:
  - label: researcher write-up
    url: https://www.buchodi.com/chatgpt-now-knows-what-you-do-on-other-websites-via-ad-collector/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49776729
- title: >-
    RSA-896 factored with CADO-NFS ported to GPUs, and no new threat to deployed keys
  section: Top stories
  category: Security
  blurb: >-
    Stephen A. Weis reports factoring RSA-896 with CADO-NFS ported to GPUs, and states deployed
    keys face no new threat.
  summary: >-
    Stephen A. Weis published the two 135-digit factors of RSA-896 on his own site in a post
    dated 2026-09-19, and his page and the account @sweis, which links that site, now carry
    the method rather than leaving it to the thread: an existing implementation of the general
    number field sieve, CADO-NFS, ported to GPUs and scheduled onto idle capacity that was
    already paid for. He states there is no new algorithmic factoring improvement and no new
    threat to deployed keys, so what the run demonstrates is the cost of assembling the compute
    rather than a change in the difficulty of the problem. The factors were not multiplied
    out for this page, no third party has published a confirmation, and neither source claims
    a factoring record, so none is claimed here.
  why: >-
    The result moves on engineering and compute scheduling rather than on mathematics, and
    the author states key-size guidance is unchanged by it.
  comments: >-
    A commenter corrected the account's description of the number field sieve from exponential
    to subexponential, and the account named sweis replied that he misspoke and corrected
    it, while keeping the point that the runtime did not improve.
  sources:
  - label: Weis post
    url: https://saweis.net/posts/rsa-896.html
  - label: author's own account
    url: https://x.com/sweis/status/2101484464807596264
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49771966
- title: PyPy 8.0.0 adds Python 3.12 in beta and lays the groundwork for abi3 wheels
  section: Top stories
  category: Languages
  blurb: >-
    PyPy 8.0.0 ships Python 3.12 at beta quality and aligns its PyObject layout so cp312-abi3
    wheels can later install.
  summary: >-
    The release dated 2026-09-19 adds Python 3.12 support at beta quality alongside 2.7 and
    3.11, raises the Linux tarball floor to glibc 2.28 through manylinux_2_28, which is why
    the major version moved, drops the internal HPy backend behind a build option, and marks
    3.11 as the last release of that line barring security fixes. For packaging, PyPy now
    hides its `ob_pypy_link` extension field behind a prefix so `PyObject` matches CPython's
    layout under `Py_LIMITED_API=0x030C0000`, and it no longer mangles limited-API exports,
    so `PyTuple_New` is exported under its own name instead of `PyPyTupleNew`. The goal is
    installing `cp312-abi3` wheels built for CPython, and it is not usable yet, because the
    import machinery must still accept `abi3.so` objects and pip and uv must still treat those
    wheels as candidates.
  why: >-
    Reusing CPython abi3 wheels would remove the main packaging reason extension-heavy projects
    skip PyPy, once the import and installer changes land.
  followup: >-
    Track whether PyPy import machinery, pip and uv accept `cp312-abi3` wheels on PyPy.
  sources:
  - label: PyPy release post
    url: https://pypy.org/posts/2026/09/pypy-v800-release.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49770701
- title: Brood War Bench reports no model played above beginner level across 171 matches
  section: AI
  category: AI
  blurb: >-
    Brood War Bench reports no model configuration played above beginner level across 171
    StarCraft matches.
  summary: >-
    Ben Swerdlow self-published a round-robin benchmark of 171 matches and states that no
    configuration played beyond beginner level, and that a human beginner running a photon
    rush would win every game. On the leaderboard Codex Astra at xhigh effort went 18-0, while
    the three Grok configurations and Claude Haiku each won at most two games. The per-game
    notes record a multi-agent failure: Codex spawned separate subagents for economy, army
    production and army control, the subagents did not communicate, and the army subagent
    sent each finished unit to attack alone rather than massing. The author also reports that
    models treating a real-time game as turn-based lost while thinking, and says that may
    explain why some lower-effort settings performed better than higher-effort ones. Method
    is disclosed, including the round-robin matrix run in parallel on Freestyle VMs with engine
    data and both harness logs saved per match, and costs are stated as token-based estimates
    for Codex and Sonnet.
  why: >-
    A vendor-independent harness reporting that every configuration failed is a usable data
    point on long-horizon real-time control, and the subagent coordination failure is worth
    reading before building a similar harness.
  sources:
  - label: benchmark report
    url: https://bw.swerdlow.dev/report
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49766966
