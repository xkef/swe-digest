stories:
- title: >-
    Encrypted reasoning traces are interchangeable across sessions, users, and models at Anthropic,
    OpenAI, and Google
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Encrypted reasoning blocks from Anthropic, OpenAI and Google are not bound to requests,
    replaying across sessions within ecosystems.
  summary: >-
    The paper reports that the encrypted reasoning blocks returned by Anthropic, OpenAI, and
    Google are not bound to the request that produced them. The paper scopes the interchangeability
    to within one provider's ecosystem, where the same block can be replayed across sessions,
    across users, and across models, and it does not claim replay across providers. The authors
    scraped 315,320 reasoning blocks from public repositories and recovered 367 PII artifacts
    and 182 credentials from them. The source is a version 1 preprint submitted 2026-08-10
    and it is not peer reviewed. The paper states the authors followed responsible disclosure
    and proposes cryptographic and system-level mitigations. No provider statement was located
    this run.
  why: >-
    Any session log containing encrypted reasoning blocks is a credential and PII disclosure
    risk, and any public agent rollout carrying them is an injection vector.
  followup: Track provider responses and whether reasoning blocks gain per-session binding.
  sources:
  - label: arXiv 2608.09867
    url: https://arxiv.org/abs/2608.09867
  - label: author interview
    url: https://www.youtube.com/watch?v=gasgivVCl2U
- title: >-
    Zimbra command injection added to the CISA exploited catalog with a 2026-08-24 due date
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    CVE-2026-73570 command injection in Zimbra is exploited in the wild with a remediation
    due date of 2026-08-24.
  summary: >-
    CISA added CVE-2026-73570, a Zimbra command injection flaw, to the known exploited vulnerabilities
    catalog on 2026-08-21 with a remediation due date of 2026-08-24. CISA describes the flaw
    as reachable by an unauthenticated attacker through crafted SMTP requests. Zimbra's own
    security advisories page lists the same CVE as a command injection in the SNMP monitoring
    component, exploitable when SNMP notifications are enabled, with fix release 10.1.20,
    so the two primary sources disagree on the exposure precondition.
  why: >-
    Unauthenticated command execution as the Zimbra user is listed as exploited in the wild,
    and the fix is an upgrade to ZCS 10.1.20, so affected builds are those before 10.1.20.
  followup: >-
    Resolve whether the entry point is SMTP or the SNMP monitoring component against a Zimbra
    security advisory.
  sources:
  - label: Zimbra security advisories
    url: https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories
  - label: CISA KEV catalog
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- title: Rust 1.98 miscompiles a boxed async trait object into a null vtable slot
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Rust 1.98.0 emits zero-filled vtable entries for boxed async trait objects, causing safe
    code to dispatch through null.
  summary: >-
    A miscompilation marked P-critical is tracked against Rust 1.98.0 in rust-lang issue 161441.
    Code built with that toolchain can emit a zero-filled vtable entry for a boxed async trait
    object, so a call through that entry dispatches to a null pointer.
  why: >-
    Safe Rust built with 1.98.0 can dispatch through a zero-filled vtable entry and segfault
    at runtime, so teams on that toolchain hit crashes their type system was supposed to rule
    out.
  followup: Track the point release that carries the fix and which 1.98 builds are affected.
  sources:
  - label: rust-lang issue 161441
    url: https://github.com/rust-lang/rust/issues/161441
  - label: r/rust discussion
    url: https://www.reddit.com/r/rust/comments/1vvrtfe/rust_198_got_a_pcritical_miscompilation/
- title: >-
    Kernel fix stops the Intel Xe driver from handing compression storage out as usable VRAM
  section: Top stories
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Intel Xe published compression-reserved memory to the VRAM allocator, silently corrupting
    whoever landed there.
  summary: >-
    Linus Torvalds authored and committed the fix on 2026-08-20. It stops the Intel Xe driver
    from publishing the memory range reserved for compression hardware to the VRAM allocator,
    where that range could be allocated to normal callers. The commit message reports the
    symptom on a Battlemage G21 with 16 GiB, where a Mesa virtual machine's level-3 page table
    landed on the affected page on every cold boot, losing the compositor's batch-buffer heap
    entry and leaving a black screen with gdm restarting in a loop. It also records the debug
    session behind a one-line `round_up` to `round_down` change: 24 debug patches and 18 kernel
    boots, with a note that an AI did much of the grunt work while repeatedly declaring the
    bug unsolvable.
  why: >-
    Memory owned by the compression hardware was published to the VRAM allocator and silently
    overwritten whatever landed there, with no page-table entry or GPU submission needed to
    corrupt it, and the commit carries `Cc: stable@kernel.org`, so a backport to stable series
    is expected.
  sources:
  - label: mainline commit 818bebeb63dd
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=818bebeb63dd6bf5f4e07e145f6cdbace520a34c
- title: >-
    Changing only the vLLM attention backend flips tokens and breaks tool calls on identical
    weights
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Changing only the vLLM attention backend produces token flips breaking tool calls, proving
    inference configuration affects correctness.
  summary: >-
    The author holds hardware, weights, drivers, and prompt fixed and changes only the vLLM
    attention backend, reporting bit-identical logits within a backend and reproducible top-1
    token flips between backends that turn into wrong Cisco commands. An NVIDIA NVFP4 checkpoint
    reached roughly 50 percent token flips at 88k context and failed to close tool calls.
    The parts were published from 2026-08-16 through 2026-08-20 by a forum user and are not
    peer reviewed, with the methodology disclosed in enough detail to check.
  why: >-
    Agent correctness depends on inference stack configuration and not only on the model,
    so a backend or quantization choice can produce reproducible wrong tool calls in production.
  sources:
  - label: Level1Techs write-up
    url: https://forum.level1techs.com/t/why-your-local-llm-feels-dumber-than-it-is/253917
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49402232
