- title: Linux 7.3 replaces Steve French as CIFS maintainer
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Paulo Alcantara and Namjae Jeon take over CIFS and SMB3 maintenance from Steve French
    starting in Linux 7.3.
  summary: >-
    The mainline MAINTAINERS log carries a commit by Paulo Alcantara titled "MAINTAINERS:
    Replace Steve French as CIFS maintainer", merged through the `cifs-maintainer-switch-7.3-rc1`
    tag. Paulo Alcantara and Namjae Jeon take over CIFS and SMB3. Phoronix separately reports
    that French stepped down for health reasons and, in an update, that he has died, attributing
    that to a social media post by a Samba developer. No project-controlled or family-controlled
    source confirms the death, so this entry states only the handover.
  why: >-
    The handover is in mainline rather than proposed, so patches for the in-kernel SMB client
    and for KSMBD go to two new co-maintainers from 7.3 onward.
  sources:
  - label: mainline MAINTAINERS log
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/log/MAINTAINERS
  - label: Phoronix report
    url: https://www.phoronix.com/news/SMB3-CIFS-Maintainer-Change
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49402501
- title: An LSFMM+BPF session proposes proving scheduler and XDP invariants with Verus
  section: Linux and kernel
  category: Linux/Kernel
  status: discussion
  blurb: >-
    LSFMM+BPF proposes using Verus to prove scheduler and XDP invariants, since the verifier
    only guarantees no crash.
  summary: >-
    An LSFMM+BPF session covered by LWN proposes using Verus to prove invariants about BPF
    scheduler and XDP programs, because the BPF verifier only guarantees the kernel does not
    crash. Kumar Kartikeya Dwivedi reports that one or two sched_ext schedulers are kicked
    out by the watchdog every month at Meta, and that harder cases regress performance without
    failing outright.
  why: >-
    A BPF program that passes the verifier can still make a machine unusable, so the properties
    that matter operationally are outside what the verifier checks today.
  sources:
  - label: LWN report
    url: https://lwn.net/Articles/1087069/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49405724
- title: ATProto Spaces alpha adds non-public data to the protocol
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    ATProto Spaces adds access-controlled non-public data to the protocol, enabling settings,
    drafts and gated communities.
  summary: >-
    The atproto blog published an alpha of Spaces, which adds non-public data to the protocol.
    Spaces give access control rather than confidentiality, and the data stays readable to
    anyone admitted to a space.
  why: >-
    Settings, drafts, and gated communities become buildable on atproto, under a model that
    controls admission and not disclosure.
  sources:
  - label: atproto blog
    url: https://atproto.com/blog/atproto-spaces-alpha
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49379732
- title: A copy-and-patch JIT in Rust compiles in about 5 microseconds
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    A copy-and-patch JIT in Rust compiles code in 5 microseconds, enabling JIT of every SQL
    query instead of a subset.
  summary: >-
    The post describes a copy-and-patch JIT written in Rust that compiles code in about 5
    microseconds. The author applies it in pgrust to JIT compile every SQL query rather than
    a subset, and names LLVM and generated C as the alternatives whose compile times rule
    that out.
  why: >-
    Compile time rather than generated-code quality is what has kept database JIT compilation
    to a subset of queries, so a 5 microsecond compile changes which queries are eligible
    at all.
  sources:
  - label: malisper write-up
    url: https://malisper.me/jit-compiling-code-in-5-us/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49406387
