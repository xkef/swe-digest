- title: >-
    TrueConf Server flaws added to the CISA exploited catalog, one with a 2026-08-23 due date
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    TrueConf Server flaws allow unauthenticated code execution and environment breakout, exploited
    in the wild.
  summary: >-
    CISA added two TrueConf Server flaws to the known exploited vulnerabilities catalog on
    the same day. CVE-2026-72529 is a missing authentication for a critical function, CWE-306,
    reachable without authentication over port 4307/TCP, with a remediation due date of 2026-08-23.
    CVE-2026-72530 is a code injection allowing a breakout from the isolated environment over
    the same port, with a due date of 2026-09-03. The Kaspersky ICS CERT advisory KLCERT-26-057,
    published 2026-08-11, lists all versions before 5.3, 5.3.x before 5.3.9, 5.4.x before
    5.4.9, and 5.5.x before 5.5.5 as affected, fixed in 5.3.9, 5.4.9, and 5.5.5, and attributes
    exploitation to the Head Mare group delivering PhantomCore malware.
  why: >-
    Exploitation is unauthenticated and reported as active, the fix is an upgrade within each
    supported branch, and blocking port 4307/TCP at the network edge is the control available
    to anyone who cannot upgrade today.
  followup: >-
    Track whether TrueConf publishes a per-CVE advisory, since the catalog entry points only
    at a general advisories page.
  sources:
  - label: Kaspersky ICS CERT KLCERT-26-057
    url: https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-missing-authentication-for-critical-function/
  - label: CISA KEV catalog
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- title: >-
    More than 9,300 exposed AWS keys still authenticate, 768 of them with full control of
    a company account
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Truffle Security found 9,300 exposed AWS keys still authenticating with 768 holding full
    account control.
  summary: >-
    Truffle Security scanned public sources and reported 431,875 exposed secrets and 64,024
    unique AWS keys across 50,654 accounts. Of a re-verifiable subset of 10,616 keys, 88 percent
    still authenticated as of 2026-08-10, more than 9,300 keys. 526 of those were root keys
    and 242 were IAM users holding AdministratorAccess, summing to the 768 with full account
    control. The keys are old rather than newly leaked, with a median age of 1,831 days and
    only 398 of 2,903 dated keys ever given a successor. The Truffle Security research post
    did not resolve to a URL this run, so every figure here comes from the BleepingComputer
    article, published 2026-08-21 and updated 2026-08-22, which also carries an Amazon statement
    about quarantine policies. The only date that article gives for the research itself is
    the 2026-08-10 re-verification cutoff.
  why: >-
    This is a rotation failure rather than a vulnerability waiting on a vendor patch, so an
    owner can close the exposure today by rotating and revoking rather than by upgrading.
  sources:
  - label: BleepingComputer report
    url: https://www.bleepingcomputer.com/news/security/hundreds-of-leaked-aws-keys-give-full-control-over-corporate-accounts/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49406030
- title: Unpatched NTFS3 flaw turns a crafted NTFS image into local root on Linux
  section: Security
  category: Security
  status: developing
  blurb: >-
    Unpatched NTFS3 reads setuid bits from disk, making a crafted USB stick give local users
    euid 0 on mount.
  summary: >-
    Phoronix reported on 2026-08-22 that Vova Tokarev disclosed the flaw publicly on the NTFS3
    mailing list after reporting it privately two months earlier with no fix, and that it
    was still unaddressed in the mainline NTFS3 driver at the time of writing. An NTFS image
    carrying `$LXUID=0`, `$LXGID=0`, and `$LXMOD=0104755` in the MFT produces a setuid-root
    binary as soon as the volume is mounted, with no `setxattr()` call involved. Tokarev places
    the root cause at `fs/ntfs3/xattr.c:1022`, where `inode->i_mode` is assigned from untrusted
    on-disk data, proposes masking off `S_ISUID` and `S_ISGID`, states he holds a full proof
    of concept, and states udisks mounts NTFS with suid by default on desktops, so a crafted
    USB stick gives any local user euid 0. No CVE id is stated, and the flaw does not appear
    to affect the newer in-tree NTFS driver. The affected kernel versions are not yet known,
    because the source scopes the flaw to the mainline `ntfs3` driver without naming a version
    range.
  why: >-
    There is no patch, the precondition is only a local user on a desktop that automounts
    removable media, and the controls available today are mounting removable media `nosuid`
    or not loading the `ntfs3` driver.
  followup: >-
    Track a maintainer response, a CVE assignment, and the patch that lands the `S_ISUID`
    and `S_ISGID` mask.
  sources:
  - label: Phoronix report
    url: https://www.phoronix.com/news/NTFS3-Vulnerability-For-Root
- title: Malware reached Android car head units through the DoFun firmware updater
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    DoFun firmware updater delivers malware through vendor-controlled MQTT, opening a proxy
    botnet polling every 90 minutes.
  summary: >-
    Kaspersky researcher Dmitry Kalinin published the report on 2026-08-21, from a threat
    found while monitoring Android malware in June 2026. TWCore, a legitimate system app on
    DoFun head units that collects analytics and updates software, takes MQTT messages from
    a broker on a `cardoor[.]cn` subdomain naming APKs to download and install, and an `installNotExists`
    flag lets it install apps that were never present on the device. The chain runs three
    stages: a `JarService` dropper with no user interface, a loader that reports to a command
    and control server and fetches the next payload, and a clicker and reverse proxy loader
    that polls `/cpc/api/task` every 90 minutes and reports display resolution, device model,
    connected Wi-Fi SSID, and MAC address. Kaspersky states the purpose is ad fraud and a
    proxy botnet, attributes the activity with high confidence to the MoYu Group linked to
    the BADBOX botnet, and states it notified the vendor, which reported fixing the distribution
    scheme. The affected head unit firmware versions are not yet known, because the report
    names no version range.
  why: >-
    The delivery path is the vendor's own update channel rather than a user install, so a
    device that only ever ran factory software was still reachable.
  sources:
  - label: Securelist report
    url: https://securelist.com/android-head-unit-malware/121106/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49408550
- title: >-
    Java's String.indexOf is quadratic, and a 4096-character adversarial needle costs 1.1
    seconds on a 1 MB string
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Java's String.indexOf is quadratic, making 4096-character needles cost 1.1 seconds on
    1 MB strings and creating a denial-of-service path.
  summary: >-
    Java's `String.indexOf` runs in O(n times m) rather than linear time. Lemire measures
    one call with a 4096-character adversarial needle over a 1 MB string at 1.1 seconds, on
    OpenJDK 25 on an Apple M4 Max. A Two-Way implementation holds about 0.3 ns per character
    on the same adversarial input but loses to `indexOf` on random text.
  why: >-
    Any service that runs `indexOf` with an attacker-supplied needle has a cheap denial-of-service
    path, and the remedy is a length bound on the needle rather than a different algorithm,
    because the linear alternative is slower in the normal case.
  sources:
  - label: Daniel Lemire write-up
    url: https://lemire.me/blog/2026/08/22/javas-string-indexof-can-be-slow-quadratic/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49405920
- title: hdiutil is deprecated in the macOS 27 beta in favour of diskutil image
  section: Apple platforms
  category: Apple
  status: confirmed
  blurb: >-
    macOS 27 beta deprecates hdiutil for diskutil image, which lacks options like -puppetstrings
    and -scrub.
  summary: >-
    The macOS 27 beta deprecates `hdiutil` and points to `diskutil image` as the replacement.
    The replacement drops options including `-puppetstrings` and `-scrub`, and it does not
