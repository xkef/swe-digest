- title: >-
    DigitalOcean's API and Cloud Control Panel returned elevated 5xx across two windows starting
    2026-08-24, with running droplets unaffected
  section: Outages
  category: Outage
  blurb: >-
    DigitalOcean's API and control panel returned 5xx errors across two windows on 2026-08-24
    to 2026-08-25.
  summary: >-
    DigitalOcean reports elevated 5xx error rates on the public API and the Cloud Control
    Panel across two windows starting 2026-08-24, the second running from 22:27 UTC on 2026-08-24
    to mitigation at 00:54 UTC on 2026-08-25. The status page states that running droplets
    and existing resources kept serving traffic. The incident was still open in monitoring
    at fetch time, with an update posted 16:30 UTC on 2026-08-25 stating that engineering
    has seen no recurrence for 12 or more hours and will monitor for a short period before
    marking it resolved.
  why: >-
    Control-plane failure blocked resource creates and any automation calling the public API
    across two windows on 2026-08-24 and 2026-08-25, while the data plane kept serving traffic.
  followup: >-
    The postmortem on root cause and mitigation that DigitalOcean states it will publish on
    the status page.
  sources:
  - label: status page
    url: https://status.digitalocean.com/incidents/4qwm6pzlx1z3
  - label: discussion
    url: https://news.ycombinator.com/item?id=49423974
- title: >-
    GitHub blames the 2026-08-24 Actions start delays on a node that failed its disk but kept
    reporting healthy
  section: Outages
  category: Outage
  blurb: >-
    GitHub attributed Actions delays to a disk-failed node whose health checks still passed,
    skipping normal eviction.
  summary: >-
    GitHub attributes the 2026-08-24 Actions job start delays to a node whose disk failed
    while its health checks continued to pass, so the usual eviction path did not remove it.
    GitHub states the remediation is application-level removal of stalled consumers.
  why: >-
    A node that loses one subsystem while still passing health checks is invisible to the
    usual eviction path, and GitHub's stated fix is application-level removal of stalled consumers
    rather than faster node replacement.
  sources:
  - label: incident
    url: https://www.githubstatus.com/incidents/lyppgxbq1nyk
  - label: status API
    url: https://www.githubstatus.com/api/v2/incidents.json
- title: >-
    GNU Emacs 31.1 ships, removing the unexec dumper and enabling xterm-mouse-mode by default
  section: Developer tools
  category: Dev tools
  blurb: >-
    GNU Emacs 31.1 removes the unexec dumper, stops bundling ctags and enables xterm-mouse-mode
    by default.
  summary: >-
    The 31.1 release tarballs are dated 2026-08-24 on ftp.gnu.org. The NEWS entries quoted
    in the write-up remove the unexec dumper deprecated since Emacs 27, stop building and
    installing the bundled `ctags`, and mark fourteen `font-lock-*-face` variables obsolete.
    The write-up also records `xterm-mouse-mode` on by default in compatible terminals, child
    frames on TTY frames, tree-sitter offering to install the grammar for a mode it knows
    about, and the new garbage collector postponed to Emacs 32.
  why: >-
    Package maintainers have concrete migration work in the removed dumper, the dropped `ctags`
    build and the fourteen obsolete face variables.
  sources:
  - label: release tarballs
    url: https://ftp.gnu.org/gnu/emacs/
  - label: write-up
    url: https://www.masteringemacs.org/article/whats-new-in-emacs-311
  - label: discussion
    url: https://news.ycombinator.com/item?id=49419252
- title: CPython adds RISC-V as a PEP 11 tier 3 platform
  section: Languages and runtimes
  category: Languages
  blurb: >-
    CPython now has RISC-V as a PEP 11 tier 3 platform with experts and real-hardware buildbots,
    though not yet in CI.
  summary: >-
    The Python blog states that RISC-V is now a tier 3 platform under PEP 11, with named platform
    experts and buildbots on real hardware. The post states that RISC-V is not yet part of
    CPython's continuous integration.
  why: >-
    Tier 3 puts RISC-V build breakage in scope for CPython maintainers with buildbots on real
    hardware, though the post states RISC-V is not yet in CPython's CI, so regressions still
    surface after merge.
  sources:
  - label: primary
    url: https://blog.python.org/2026/08/riscv-now-officially-supported/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49425252
- title: >-
    Rust merges the never type stabilization, changing never type fallback to `!` on all editions
    and making Infallible an alias
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Rust stabilized the never type and changed fallback from () to ! on all editions, a breaking
    change for dependent code.
  summary: >-
    The merged pull request stabilizes the never type, `!`, changes never type fallback from
    `()` to `!` on all editions, and makes `Infallible` an alias for `!`. The pull request
    states that the fallback change is a breaking change, and the reviewer marked it `rollup=iffy
    causes breakage`. This is a merge into the development branch, so no stable release carries
    it yet.
  why: >-
    Code that relies on fallback resolving to `()` changes meaning, so crates depending on
    the old behaviour need checking before the change reaches a stable release.
  followup: >-
    Which stable Rust release carries the stabilization, and what the fallback change breaks
    in practice across published crates.
  sources:
  - label: pull request
    url: https://github.com/rust-lang/rust/pull/155499
  - label: tracking issue
    url: https://github.com/rust-lang/rust/issues/35121
- title: >-
    Sign in with Apple moves new relay addresses to private.icloud.com, and Apple reverses
    the plan to move iCloud+ Hide My Email off icloud.com
  section: Apple platforms
  category: Apple
  blurb: >-
    Sign in with Apple moves new relay addresses to private.icloud.com, reversing the plan
    to move Hide My Email.
  summary: >-
    Apple Developer News states that new Sign in with Apple relay addresses will use the `private.icloud.com`
