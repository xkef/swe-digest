- title: >-
    Intel posts an RFC for DRM Fabric, a vendor-neutral topology layer for GPU and accelerator
    scale-up interconnects
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Intel posted an RFC for DRM Fabric, a Generic Netlink uAPI for GPU scale-up interconnect
    topology with no production implementation.
  summary: >-
    Intel sent an RFC series proposing DRM Fabric, a vendor-neutral kernel layer that exposes
    scale-up interconnect topology for GPUs and accelerators through a Generic Netlink uAPI.
    The RFC ships no production provider implementation and records direct adjacency only.
  why: >-
    Scale-up interconnect topology has been per-vendor, and this proposes one Generic Netlink
    uAPI over it, though the RFC ships no production provider implementation and records direct
    adjacency only.
  followup: >-
    Maintainer response on the mailing list, and whether a vendor commits a production provider.
  sources:
  - label: Phoronix report
    url: https://www.phoronix.com/news/DRM-Fabric-Proposal
  - label: discussion
    url: https://news.ycombinator.com/item?id=49419899
- title: >-
    NVIDIA sets RVA23, ACPI, PCIe coherency and peer-to-peer PCIe as its requirements for
    CUDA on RISC-V, and points at a SiFive demo
  section: Infrastructure
  category: Event
  blurb: >-
    NVIDIA requires RVA23, ACPI, PCIe coherency and peer-to-peer PCIe for CUDA on RISC-V,
    ruling out existing boards.
  summary: >-
    At Hot Chips 2026 NVIDIA set out its host requirements for running CUDA on a RISC-V CPU:
    the RVA23 profile, ACPI, PCIe cache coherency and peer-to-peer PCIe. NVIDIA pointed at
    a SiFive-based demonstration as the current reference.
  why: >-
    The requirement list rules out effectively all existing RISC-V hardware, so CUDA on RISC-V
    arrives on server platforms rather than on the boards developers already own.
  sources:
  - label: primary
    url: https://chipsandcheese.com/p/hot-chips-2026-cuda-targets-risc
  - label: discussion
    url: https://news.ycombinator.com/item?id=49422548
- title: >-
    SiFive's BigSky SF-2U870 puts 32 P870-D cores and RVA23 support in a 2U server that runs
    Ubuntu 26.04 out of the box
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    SiFive's BigSky puts 32 P870-D cores and RVA23 support in a 2U server that boots stock
    Ubuntu 26.04 natively.
  summary: >-
    Chips and Cheese reports the configuration as 32 P870-D cores at 2.2 GHz, 256 GB of DDR5-5600,
