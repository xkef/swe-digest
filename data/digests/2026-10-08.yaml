- title: >-
    Paper argues Lean verification of AI autoformalisation proves nothing about the prose
    proof, and that OpenAI's Navier-Stokes case shows it
  section: ML research
  category: Paper
  blurb: >-
    A paper argues a passing Lean check says nothing about the prose proof it was translated
    from, citing OpenAI's release.
  summary: >-
    The authors argue that a successful Lean check validates only the formal statement that
    was produced, not the natural-language argument it was translated from. They place that
    translation problem above the halting problem in the Solvability Complexity Index hierarchy.
    They use OpenAI's Navier-Stokes material as the worked case.
  why: >-
    Any pipeline that treats a passing Lean check as evidence that a model-written argument
    is correct depends on a faithful natural-language to formal translation that the paper
    argues is not decidable.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.08144
  - label: discussion
    url: https://news.ycombinator.com/item?id=49994145
