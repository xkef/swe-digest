  summary: >-
    The post states that one in three pull requests now involves an AI agent, against fewer
    than one in ten a year ago, and reports no statistically detectable trend in per-push
    prevalence of leaked credentials across nine complete quarters. Between Q2 2024 and Q2
    2026 screened pushes grew 2.84 times while pushes carrying credentials grew 2.59 times,
    and push protection overrides fell from 6.63 percent to 3.93 percent. The post gives a
    mean of about 40 days to revoke a leaked credential by hand.
  why: >-
    The post answers the carelessness claim with volume figures rather than opinion: screened
    pushes grew 2.84 times while pushes carrying credentials grew 2.59 times and the override
    rate fell, so exposure scales with output and the mean 40 day manual revocation time is
    the part that does not scale.
