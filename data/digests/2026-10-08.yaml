- title: >-
    incident.io traces a Postgres queue ceiling to MultiXact lock contention caused by per-item
    savepoints
  section: Engineering posts
  category: Engineering post
  blurb: >-
    incident.io found per-item savepoints put a MultiXact in every locked row, capping its
    Postgres queue throughput.
  summary: >-
    incident.io ran each item of a FOR UPDATE SKIP LOCKED batch in its own savepoint, which
    placed a MultiXact in every locked row. Each skipped row then cost a MultiXact lookup
    behind one lightweight lock, so adding workers made claim acquisition slower. Splitting
    the claim from the work gave a 3.5x throughput gain.
  why: >-
    A queue built on SKIP LOCKED can hit a ceiling that looks like database load but comes
    from how the claim transaction is structured.
  sources:
  - label: primary
    url: https://incident.io/blog/how-savepoints-quietly-throttled-our-postgres-queue
  - label: reddit
    url: https://www.reddit.com/r/programming/comments/1x02iea/how_savepoints_quietly_throttled_our_postgres/
- title: Push ifs up and fors down, with the algebra that says when each rewrite is legal
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A post gives the preconditions that make pushing conditions up and loops down a legal
    rewrite rather than a style rule.
  summary: >-
    The post states the preconditions behind the idiom. A condition only leaves a loop when
    it is loop invariant. A selection moves below a join only when it touches one side. Filtering
    before mapping holds as filter p . map f == map f . filter (p . f) and pays only when
    p . f reduces to a cheap test on the input.
  why: >-
    The idiom usually circulates as a bare style rule, and the stated preconditions are what
    separate a safe rewrite from a behaviour change.
  sources:
  - label: primary
    url: https://debasishg.github.io/blog/push-ifs-up-fors-down/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49997073
