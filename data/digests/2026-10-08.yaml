- title: >-
    Bun merges a built-in TypeScript type checker that matches tsc 7 errors across 1,102 of
    1,103 project configs
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Bun merged a built-in TypeScript type checker that matched tsc 7 errors across 1,102 of
    1,103 project configs.
  summary: >-
    The pull request, merged 2026-10-06 from a branch named `claude/bun-check` with 293 commits
    and about 150,000 lines of new code, states that `bun check` reports the same error codes,
    messages, lines and columns as tsc and that a disagreement with tsc 7 is a Bun bug. Verification
    is stated as 1,103 `tsconfig.json` files across 72 repositories checked with both, 1,102
    producing identical sets of file, line, column and error code, 286,267 errors in tsc against
    286,266 in `bun check`, and 9 of 277,975 errors worded differently, with 2.4 s CPU time
    and 0.69 GB peak memory on the 2,881 files of `packages/next` in the Next.js repository
    against 6.9 s and 1.78 GB for tsc 7.0.2 and 14.8 s and 2.33 GB for tsc 6.0.2. It only
    type checks, with no emit, no `.d.ts`, no sourcemaps and no language server, the TypeScript
    `lib.*.d.ts` files are built in and pinned to 7.0.2 regardless of the version a project
    installs, and the figures are the authors' own rather than an independent reproduction.
  why: >-
    The stated bar is that any divergence from tsc 7 counts as a Bun bug, which positions
    this as a drop-in check rather than a faster approximation, and the already-published
    ts-rust README measured this same built-in check ahead of that Rust port without naming
    or sourcing it.
  followup: >-
    Independent reproduction of the parity and timing figures, and whether the pinned 7.0.2
    `lib.*.d.ts` files diverge for projects on another TypeScript version.
  sources:
  - label: primary
    url: https://github.com/oven-sh/bun/pull/44361
  - label: discussion
    url: https://news.ycombinator.com/item?id=50007214
