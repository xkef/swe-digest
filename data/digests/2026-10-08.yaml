- title: >-
    Tensorlake npm package shipped a credential worm that wipes the home directory if the
    stolen token is revoked
  section: Top stories
  category: Security
  blurb: >-
    Tensorlake npm 0.5.144 installs a service that runs `rm -rf` on the home directory when
    the stolen GitHub token dies.
  summary: >-
    StepSecurity names tensorlake 0.5.144 as the malicious release, 0.5.143 as the pin, and
    tensorlakeai/tensorlake main commits e90c47b to 6386121 as the compromised range. The
    release was built from the project's own main branch and carries a valid npm provenance
    attestation, and StepSecurity found 0.5.144 still downloadable from npm when it checked.
    The package steals a GitHub token and installs a background service that deletes the user
    home directory once the token stops working, so the published remediation order is to
    remove `~/.config/gh-token-monitor` first and rotate credentials afterwards.
  why: >-
    Revoking the stolen GitHub token first triggers the background service that runs `rm -rf`
    on the user home directory, so the standard first step of incident response is what causes
    the damage, and a valid provenance attestation on a build from the project's own main
    branch defeats a provenance-trust policy.
  followup: >-
    Whether 0.5.144 is removed from the registry, and what the project publishes on scope.
  sources:
  - label: primary
    url: https://www.stepsecurity.io/blog/tensorlake-npm-compromised-hostage-token-worm
  - label: issue
    url: https://github.com/tensorlakeai/tensorlake/issues/1014
  - label: discussion
    url: https://news.ycombinator.com/item?id=50001272
- title: >-
    curl pulls 8.23.0 forward to 2026-10-14 for 22 vulnerabilities, including its first HIGH
    severity CVE since 2023
  section: Top stories
  category: Security
  blurb: >-
    curl moved release 8.23.0 to 2026-10-14 to fix 22 vulnerabilities, one rated HIGH, with
    no detail until that day.
  summary: >-
    Daniel Stenberg writes that curl has 22 pending vulnerabilities and shortened the release
    cycle so 8.23.0 lands on 2026-10-14. One report, CVE-2026-92392, is rated HIGH severity,
    and the post states that curl has published only two HIGH severity CVEs since 2021, the
    most recent being CVE-2023-38545, with CVE-2026-92392 another. Details of CVE-2026-92392
    are withheld until all information is revealed on the European morning of 2026-10-14,
    and affected version ranges are not known before then.
  why: >-
    curl and libcurl are embedded across server and client infrastructure, and the project
    withheld the HIGH report's detail until the release, so the only available action is to
    plan the upgrade for 2026-10-14.
  followup: >-
    The full CVE list and the affected version ranges, including those for CVE-2026-92392,
    once 8.23.0 ships on 2026-10-14.
