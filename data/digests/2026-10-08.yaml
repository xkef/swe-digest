- title: >-
    MCP trust gaps let one internal agent pass injected instructions to another at five unrelated
    organisations
  section: Security
  category: Security
  blurb: >-
    Researchers passed injected instructions between internal agents at five organisations
    through MCP trust assumptions.
  summary: >-
    Ars Technica reported on 2026-10-05 that researchers chained agents at five unrelated
    organisations by relying on internal agents trusting each other over MCP. In the googleapis/mcp-toolbox
    case the HTTP client set no CheckRedirect policy and did not validate target addresses,
    which turned an injected prompt into a server-side request forgery. Affected versions
    are not stated for mcp-toolbox or any other named agent in the reporting read here.
  why: >-
    Special-purpose agents often carry no guardrails and trust every other internal agent,
    so one injected prompt reaches whatever the most privileged agent in the chain can call.
  followup: >-
    Fixes in googleapis/mcp-toolbox and the other named agents, plus any MCP specification
    change addressing inter-agent trust.
  sources:
