- title: Bad Epoll CVE-2026-46242 gives root from the Linux epoll subsystem
  section: Security
  category: Security
  blurb: >-
    Bad Epoll is a race-condition use-after-free in the Linux kernel epoll subsystem that
    enables local privilege escalation exploitable from Chrome.
  summary: >-
    A published proof of concept documents CVE-2026-46242, a race-condition use-after-free
    in the Linux kernel epoll subsystem that yields local privilege escalation to root. The
    write-up dates the flaw to a v6.4 change (commit `58c9b016e128`, April 2023) and the fix
    to commit `a6dc643c6931` merged for v6.6 and later in April 2026, after a report on 2026-02-17.
    The author states the exploit reaches about 99 percent reliability through timing and
    retry loops and can be triggered from within Chrome's renderer sandbox, opening a kernel
    code-execution path.
  why: >-
    Any kernel from v6.4 without the backport is exposed on desktops, servers, and Android,
    and the browser-sandbox trigger makes it a plausible second stage after a renderer compromise.
  followup: >-
    Watch for distribution kernels confirming the backport and for a weaponized exploit beyond
    the published proof of concept.
  sources:
  - label: PoC and write-up
    url: https://github.com/J-jaeyoung/bad-epoll
  - label: fix commit
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=a6dc643c6931
- title: Langflow flow-access IDOR CVE-2026-55255 added to CISA KEV
  section: Security
  category: Security
  blurb: >-
    Langflow CVE-2026-55255 is an IDOR allowing authenticated users to execute flows belonging
    to other users, added to CISA's known exploited list.
  summary: >-
    CISA added CVE-2026-55255 to the Known Exploited Vulnerabilities catalog on 2026-07-07
    on evidence of active exploitation, with a federal remediation deadline of 2026-07-10.
    The flaw is an insecure direct object reference in the `/api/v1/responses` endpoint of
    Langflow, the open-source visual agent and RAG builder: an authenticated low-privilege
    user can execute a flow belonging to another user by supplying the victim's flow ID. The
    project advisory (published 2026-06-19) lists the fix in 1.9.1 and versions below 1.9.1
    as vulnerable, while NVD records the fixed version as 1.9.2. CVSS is 9.9 with a changed
    scope.
  why: >-
    Langflow is a recurring high-severity target and is often exposed as a shared internal
    or hosted agent-building service, so a cross-tenant flow-execution bug under active exploitation
    is a direct route to running attacker-chosen flows against other users' data.
  followup: >-
    Watch for confirmation of the exact fixed version, exploitation details, and internet-exposure
    scans of unpatched instances.
  sources:
  - label: GitHub advisory GHSA-qrpv-q767-xqq2
    url: https://github.com/langflow-ai/langflow/security/advisories/GHSA-qrpv-q767-xqq2
  - label: NVD
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-55255
- title: Reverse engineering documents a Microsoft global device ID
  section: Security
  category: Security
  blurb: >-
    A reverse-engineering write-up documents Microsoft's device ID stored in the registry
    and linked to Microsoft Account registrations.
  summary: >-
    A reverse-engineering write-up and PCMag coverage reaching the Hacker News front page
    on 2026-07-07 (294 points) describe a global device identifier tied to a Windows installation
    once it is linked to a Microsoft Account. The write-up documents it as a server-assigned
    64-bit device Passport Unique ID minted by the Microsoft Account service (`wlidsvc.dll`)
    during provisioning against `login.live.com`, stored in cleartext in the user registry
    under `IdentityCRL\ExtendedProperties`, and registered with a Microsoft device-directory
    service by the Connected Devices Platform. It persists across OS updates, and a fresh
    reinstall gets a new identifier that reappears on re-registration with the account. Reporting
    frames it as correlatable with activity and IP history and cites a criminal case where
    the data was provided to law enforcement. The exact linkage of browsing to the identifier
    is inferred, not fully documented.
  why: >-
    A persistent, account-linked device identifier stored in the clear and registered with
    Microsoft services is a concrete fingerprinting and correlation surface for anyone building
    or auditing privacy-sensitive Windows deployments.
  followup: >-
    Watch for independent reproduction of the correlation mechanism, any Microsoft statement,
    and whether the identifier can be disabled without unlinking the account.
  thread: f-0101
  sources:
  - label: reverse-engineering write-up
    url: https://github.com/SmtimesIWndr/gdid-reversal
  - label: PCMag
    url: https://www.pcmag.com/news/a-hackers-arrest-reveals-microsoft-can-track-users-via-a-windows-device-id
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48815196
- title: pon compiles Python 3.14 to native code with no interpreter
  section: Languages and runtimes
  category: Languages
  blurb: >-
    pon is a JIT and ahead-of-time compiler for Python 3.14 that removes the interpreter and
    emits machine code, verified against CPython.
  summary: >-
    pon, discussed on Hacker News 2026-07-07 (132 points), is a JIT and ahead-of-time compiler
    for Python 3.14 that removes the interpreter: it parses with the ruff parser, lowers to
    one shared intermediate representation, and emits machine code through Cranelift, with
    a Green Tea garbage collector instead of reference counting. The project reports byte-exact
    differential testing against CPython 3.14.0, with 209 corpus modules matching under JIT
    and 172 also passing ahead-of-time compilation. It is under active development, with CPython
    test-suite integration, standard-library build-out, and a 5x-geomean performance target
    still outstanding.
  why: >-
    An interpreter-free native path for Python that verifies output against CPython is an
    aggressive take on the runtime-performance problem, though its coverage is still early.
  sources:
  - label: GitHub repository
    url: https://github.com/can1357/pon
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48809496
