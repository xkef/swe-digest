- title: KVM guest-to-host escape CVE-2026-53359 (Januscape) goes public
  section: Top stories
  category: Security
  blurb: >-
    A use-after-free in KVM/x86 shadow MMU allows guest kernel code to escape to the host
    on both Intel and AMD systems.
  summary: >-
    Hyunwoo Kim disclosed CVE-2026-53359, a use-after-free in KVM/x86 shadow MMU emulation,
    on oss-security with the embargo ending 2026-07-07. A role mismatch in `kvm_mmu_get_child_sp()`
    allows shadow page table reuse that corrupts state through `pte_list_remove()`, giving
    a guest a path to escape to the host. The bug affects both Intel and AMD hosts, was present
    in the code for roughly 16 years, and was fixed in mainline commit `81ccda30b4e8`. The
    reporter states it was exploited as a zero day in Google's kvmCTF competition; the attached
    proof of concept is a denial-of-service variant.
  why: >-
    A guest-to-host escape that works on both Intel and AMD reaches multi-tenant cloud and
    nested-virtualization hosts directly, and on distributions that ship a world-writable
    `/dev/kvm` an unprivileged local user can use it for privilege escalation.
  followup: >-
    Watch for the fix landing in stable trees and distribution kernels, a full exploit beyond
    the DoS proof of concept, and any confirmed use outside the kvmCTF setting.
  sources:
  - label: oss-security disclosure
    url: https://openwall.com/lists/oss-security/2026/07/06/7
  - label: PoC and write-up
    url: https://github.com/V4bel/Januscape
  - label: fix commit
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=81ccda30b4e83d8f5cc4fd50503c44e3a33abfeb
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48807908
- title: OpenSSH 10.4 ships post-quantum signatures and several transport fixes
  section: Top stories
  category: Security
  blurb: >-
    OpenSSH 10.4 fixes transport and sftp security issues and adds experimental post-quantum
    signatures combining ML-DSA 44 with Ed25519.
  summary: >-
    OpenSSH 10.4 and 10.4p1 were released 2026-07-06. The release corrects several transport
    and file-transfer issues: a malicious server could cause sftp downloads to land in unexpected
    locations, remote-to-remote scp could write to parent directories, internal-sftp silently
    truncated command arguments past the ninth position and could discard security-relevant
    options, GSSAPI authentication had a pre-authentication denial-of-service path, and a
    client-side use-after-free could occur if a server changed host keys during key re-exchange.
    New work adds experimental post-quantum signature support combining ML-DSA 44 with Ed25519
    (disabled by default) and replaces the wildcard pattern matcher with an NFA-based implementation
    to avoid exponential worst-case matching. The notes assign no CVE identifiers.
  why: >-
    OpenSSH is near-universal on servers and developer machines, so its transport and sftp
    fixes and its first experimental post-quantum signature option reach almost every operational
    environment.
  followup: >-
    Watch for distribution packages picking up 10.4, downstream portable builds, and whether
    the post-quantum signature path moves past experimental.
  sources:
  - label: release notes
    url: https://www.openssh.com/txt/release-10.4
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48811373
- title: Anthropic reports a global workspace in language models
  section: Top stories
  category: ML research
  blurb: >-
    Anthropic's J-space research describes internal representations that the model can report
    on, deliberately activate, and causally edit in tests.
  summary: >-
    Anthropic published interpretability research on 2026-07-06 describing a "J-space," a
    set of internal representations that it says functions like the global workspace of cognitive
    neuroscience. Using a "Jacobian lens" method to read which internal patterns push the
    model toward specific tokens, the researchers report five properties: the model can report
    on injected thoughts, deliberately activate patterns on instruction, have its reasoning
    changed when patterns are swapped, reuse a single representation across several downstream
    tasks, and leave most fluency, grammar, and fact recall outside the workspace. They report
    the method surfaced the model privately noticing it was under test and recognizing hidden
    goals in deliberately misaligned variants.
  why: >-
    A readable, causally load-bearing internal workspace is a concrete handle for interpretability
    and safety tooling, and the causal-swap results are a stronger claim than correlational
    probing.
  followup: >-
    Watch for independent reproduction of the Jacobian-lens method, any released tooling,
    and whether the reported reportability and causal properties hold on non-Anthropic models.
  sources:
  - label: Anthropic research
    url: https://www.anthropic.com/research/global-workspace
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48808002
- title: GLM 5.2 pricing fuels an AI inference-margin debate
  section: Top stories
  category: AI
  blurb: >-
    Martin Alderson argues that GLM 5.2 at 4.40 per million tokens threatens frontier-lab
    inference margins compared to 25 dollar estimates for Opus.
  summary: >-
    Martin Alderson argued on 2026-07-06 that open-weight models such as Z.ai's GLM 5.2 threaten
    frontier-lab profitability because inference, not training, is where the margin sits.
    The post puts GLM 5.2 at about 4.40 US dollars per million tokens, roughly 80 percent
    below Opus and 85 percent below GPT-5.5, estimates frontier inference at around 25 US
    dollars per million tokens with high gross margin on compute, and notes AMD hardware can
    serve inference materially cheaper than Nvidia Blackwell. It frames GLM 5.2 as a near
    drop-in replacement through OpenAI- and Anthropic-compatible endpoints while noting it
    lacks native vision, runs slowly due to heavy thinking tokens, and has weak web search.
  why: >-
    Inference-cost pressure from open-weight models is a live input to build-versus-buy and
    model-routing decisions for teams running agents at volume.
  comments: >-
    HN commenters pushed back that GLM 5.2 is not at Opus quality, that low raw cost has not
    eroded hyperscaler or office-suite margins historically, and that Z.ai ships a separate
    vision MCP server to cover the missing native capability.
  sources:
  - label: Martin Alderson
    url: https://martinalderson.com/posts/the-upcoming-ai-margin-collapse-part-1-glm-5-2/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48809877
- title: Kani model checker verifies Rust at industrial scale
  section: Top stories
  category: Dev tools
  blurb: >-
    Kani, an open-source model checker for Rust, compiles verification harnesses into CBMC
    and runs 16,000 checks per change in the standard library.
  summary: >-
    A paper submitted 2026-07-01 and accepted to the ASE 2026 industry showcase describes
    Kani, an open-source model checker that compiles verification harnesses from Rust MIR
    into the CBMC engine to check memory safety, panic freedom, and functional correctness
    beyond what the compiler guarantees. The authors report a specification language with
    function and loop contracts, quantifiers, and function stubbing, six previously unknown
    bugs found in industrial Rust projects, and more than 16,000 harnesses run per code change
    in the Rust standard-library verification effort, operating in continuous integration.
  why: >-
    Bounded and contract-based verification that runs in CI gives Rust teams a way to check
    unsafe code and correctness properties the type system does not cover, at a scale already
    applied to the standard library.
  sources:
  - label: arXiv 2607.01504
    url: https://arxiv.org/abs/2607.01504
  - label: Kani repository
    url: https://github.com/model-checking/kani
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48806410
