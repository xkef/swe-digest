- title: Statistical reanalysis finds METR time horizons are not uniform in scale
  section: ML research
  category: Paper
  status: confirmed
  blurb: >-
    A reanalysis of METR time-horizon data fits a spline that is nearly flat from 2 to 30
    minutes, so doubling is not uniform.
  summary: >-
    The preprint refits the METR time-horizon measurements and reports that the relationship
    is not uniform in scale. The fitted spline is close to flat between 2 and 30 minutes.
  why: >-
    Anyone citing METR time-horizon doubling needs the diagnostic plots, because a 3 to 30
    minute jump is far easier than 30 minutes to 5 hours at the same multiplier.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.12466v1
- title: >-
    Why Are Coding Agents So Dumb? catalogues harness failures distinct from model quality
  section: Agentic coding
  category: Agentic coding
  status: discussion
  blurb: >-
    Michael Lynch argues coding-agent failures sit in the harness, not the model, and names
    serialised subtasks and fake sandboxes.
  summary: >-
    The post separates the model from the harness and lists concrete gaps. Named examples
    are parallel subtasks that run serially, no delegation across models, agents that cannot
    describe their own features, and permission prompts standing in for real sandboxes.
  why: >-
    The harness and model distinction tells a practitioner which failures a better model will
    not fix.
  sources:
  - label: primary
    url: https://mtlynch.io/why-are-coding-agents-so-dumb/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50020947
- title: >-
    Microsoft Execution Containers reaches general availability as an OS-enforced policy boundary
    for agents
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Microsoft Execution Containers reached general availability, putting agent file and network
    access behind an OS-enforced policy.
  summary: >-
    This is the general availability announcement for the MXC repository published on 2026-10-09,
    and it adds the policy model and the adopter list to what the README carried. Microsoft
    states that developers declare the files and network destinations a workload needs while
    the policy stays outside the workload's control, so generated code cannot grant itself
    more access. Three modes let operators observe before enforcing, with Learning mode blocking
    and recording ungranted access to a JSON activity report and Permissive mode allowing
    and recording it. Microsoft names GitHub Copilot, OpenAI Codex, Replit, LM Studio, OpenClaw,
    and Unsloth AI as already supporting it, with Claude Code and others listed as coming.
  why: >-
    A declared boundary held outside the workload's control is the platform-level answer to
    the coding-agent sandbox escapes tracked here since 2026-07, which turned on exactly the
    process execution and host-mount gaps such a policy is meant to close.
  followup: >-
    Intune policy for MXC process containers is stated as coming rather than shipped, so organisational
    enforcement is not yet available. Track that, the listed Claude Code support, and f-0036.
  sources:
  - label: primary
    url: https://blogs.windows.com/windowsdeveloper/2026/10/07/microsoft-execution-containers-policy-driven-containment-for-ai-agents/
  - label: repository
    url: https://github.com/microsoft/mxc
  - label: discussion
    url: https://news.ycombinator.com/item?id=50016489
- title: >-
    REA ships reverse-engineering tooling that lets a coding agent inspect binaries, Electron
    apps, and running browsers
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    REA gives a coding agent decompiled code, module maps, and live process activity from
    binaries and Electron apps.
  summary: >-
    REA is an MIT-licensed toolkit installed with `npx rea-agents@latest setup` that gives
    a coding agent decompiled code, instructions, strings, and call relationships from native
    executables and libraries, module and IPC maps from application folders or ASAR archives,
    and selected activity from a running browser or process over a local debugging connection.
    The site documents its worked examples with the artifact versions used, naming REA 4.1.0
    against Windows Calculator 11.2508.4.0 on x64, and cross-checks the recovered percentage
    branch against Microsoft's public source.
  why: >-
    Binary analysis becomes a prompt against an installed application rather than a manual
    disassembly session, which also means an agent pointed at third-party software can extract
    its logic, so licence and terms questions land on whoever runs it.
  sources:
  - label: primary
    url: https://rea.tools/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50028275
- title: Telegram Desktop IPC injection gave one-click account takeover, CVE-2026-107181
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    An unescaped semicolon in Telegram Desktop's single-instance socket turned a clicked link
    into arbitrary file read.
  summary: >-
    The writeup describes an unescaped semicolon in the single-instance IPC socket combined
    with a missing authorization check on the internal `interpret:` scheme. The chain turned
    a clicked link into arbitrary file read and account takeover, is reported as affecting
    versions through 7.2.8, and was confirmed by the researcher on Windows. The fix shipped
    in 7.2.9 on 2026-09-17 with no advisory, and the changelog named only a rendering fix.
  why: >-
    Telegram Desktop installs below 7.2.9 are exposed, and the quiet changelog means operators
    tracking the release notes had no signal to prioritise the update.
  sources:
  - label: primary
    url: https://beaksec.github.io/posts/telegram-desktop-one-click-account-takeover/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50029123
