- title: The Open Group UNIX certification register lists no Apple product
  section: Apple platforms
  category: Apple
  status: developing
  blurb: >-
    The Open Group's UNIX certification register lists no Apple or macOS entry under any UNIX
    standard it filters on.
  summary: >-
    The Open Group's register of UNIX certified products, read on this run, lists two IBM
    z/OS entries, four IBM AIX entries, HPE HP-UX 11i V3, and SCO UnixWare 7.1.3 and OpenServer.
    No Apple or macOS entry appears under the UNIX V7, UNIX 03, UNIX 98, or UNIX 95 standards
    the page filters on. Neither Apple nor The Open Group has published a statement, so the
    date and the reason cannot be established from the page.
  why: >-
    The register is the authoritative list for the trademark, so procurement language that
    specifies a UNIX certified operating system can no longer be satisfied by macOS on the
    strength of this register.
  followup: >-
    Marked developing because the register shows only its current state, so the removal framing
    in the Hacker News thread is not something this run could confirm. Track any statement
    from Apple or The Open Group.
  sources:
  - label: primary
    url: https://www.opengroup.org/openbrand/register/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50031653
- title: Hetzner details the Open vSwitch data plane behind over a million cloud servers
  section: Infrastructure
  category: Engineering post
  status: confirmed
  blurb: >-
    Hetzner published the design of the Open vSwitch data plane that carries over a million
    of its cloud servers.
  summary: >-
    Hetzner describes a data plane built on Open vSwitch with a custom Python orchestrator
    called Flusskrebs in place of OVN, per-server DHCP and metadata services in dedicated
    network namespaces, and an internal service called ctcount that enforces a limit of up
    to 80,000 active concurrent connections per server. Hetzner writes that this stack mostly
    still does the job today and that its SDN team has already built a successor. The post
    is part one of a series.
  why: >-
    The post publishes real OpenFlow rules and the per-server connection limit, which gives
    operators a reference design and an explanation for connection-count limits on Hetzner
    Cloud.
  sources:
  - label: primary
    url: https://www.hetzner.com/blog/the-hetzner-cloud-network-stack-history-and-technical-overview/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50019451
- title: >-
    SQLite's Vec1 extension exposes approximate nearest-neighbor search through a virtual
    table
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Vec1, SQLite's first-party ANN extension, is at version 0.7 and ships as a single dependency-free
    C file.
  summary: >-
    Vec1 exposes approximate nearest-neighbor search through a SQLite virtual table and ships
    as a single dependency-free C file. The documentation states that the current release
    is version 0.7 and that the index uses IVFADC with OPQ. The project's own roadmap states
    that testing is insufficient, and that dot-product distance and multi-threaded queries
    are not yet implemented.
  why: >-
    Vec1 puts ANN search behind a virtual table in a single dependency-free C file, but its
    own roadmap states testing is insufficient and it still lacks dot-product distance and
    multi-threaded queries, so it is not yet a replacement for a separate vector store.
  sources:
  - label: primary
    url: https://sqlite.org/vec1/doc/trunk/doc/vec1.md
  - label: discussion
    url: https://news.ycombinator.com/item?id=50030011
