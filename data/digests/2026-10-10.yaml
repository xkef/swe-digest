- title: >-
    Next.js 16.4 makes Cache Components the recommended model and the create-next-app default,
    ahead of Next.js 17
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    Next.js 16.4 makes Cache Components the create-next-app default, one release before Next.js
    17 forces the migration.
  summary: >-
    The Next.js 16.4 release notes, published 2026-10-06, name Cache Components the recommended
    caching model and make it the default for projects created with create-next-app. Vercel
    states Cache Components becomes the default in Next.js 17. The release adds `ensureStatic`,
    which fails the build when a dynamic component reaches a route meant to stay static.
  why: >-
    Cache Components becomes the default in Next.js 17, so existing App Router codebases have
    one release left before the migration is forced, and the release ships `ensureStatic`
    to fail the build when a dynamic component reaches a route meant to stay static.
  sources:
