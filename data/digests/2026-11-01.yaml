- title: >-
    Paper finds on-policy distillation gains depend on where the teacher keeps reasoning paths
    open
  section: ML research
  category: Paper
  blurb: >-
    On-policy distillation gains come from matching where the teacher keeps reasoning paths
    open, measured by a new entropy shape correlation.
  summary: >-
    The authors define entropy shape, the sequence of next-token entropies, and an Entropy
    Shape Correlation between student and teacher. Interventions on teacher entropy that preserve
    token preferences show that where to branch causally drives OPD gains, and pre-OPD ESC
    picks the best teacher better than existing predictors. Code is released.
  why: >-
    Teams post-training with on-policy distillation get a cheap pre-training check for choosing
    a teacher instead of assuming the strongest model helps most.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.39020v1
- title: >-
    Study of 25 open-weight models finds chain-of-thought reliance rises with scale and not
    with post-training
  section: ML research
  category: Paper
  blurb: >-
    Across 25 open-weight models, answers follow edited chain-of-thought steps more as models
    grow, and post-training does not change that.
  summary: >-
    On a synthetic box-swap task with known intermediate states, replacing one step in a model's
    own chain shows answer reliance rising from 16 to 18 percent at Qwen3 0.6B to 97 to 100
    percent at 14B, correlating with step accuracy at r = 0.99. Base and post-trained Qwen3
    differ by at most 0.03 from 4B up, and no model up to 14B solves four or more swaps without
    written steps.
  why: >-
    It supports chain-of-thought monitoring as a safety signal for step-by-step tasks on larger
    models, with evidence limited to models up to 14B.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.38433v1
- title: >-
    Daniel Lemire shows signed 32-bit division by constants can skip the compiler's correction
    step on 64-bit CPUs
  section: Languages and runtimes
  category: Languages
  blurb: >-
    A 33-bit multiplier trick removes two instructions from signed 32-bit division by constants,
    and fastmod 0.2.0 drops a mispredicted branch.
  summary: >-
    GCC and LLVM need an add-back correction for 38 percent of divisors from 3 to 1000 because
    the ideal multiplier needs 33 bits, while a signed 64-bit multiply avoids it and cuts
    latency from 10 to 8 cycles on Emerald Rapids. Lemire also released fastmod 0.2.0, whose
    branchless signed division is about four times faster than 0.1.0 with random signs on
    Intel.
  why: >-
    Hot loops dividing signed 32-bit values by constants or runtime divisors can gain latency
    with a short template, though it is slower on Apple M4 when no correction is needed.
  sources:
  - label: primary
    url: https://lemire.me/blog/2026/10/31/beating-the-compiler-at-signed-32-bit-division/
  - label: discussion
    url: https://www.reddit.com/r/programming/comments/1xka27q/beating_the_compiler_at_signed_32bit_division/
- title: >-
    Linux 7.4 merges OverlayFS fixes for bugs found by Chris Mason's AI review, several reachable
    by unprivileged users
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    OverlayFS fixes for an info leak, use-after-free and NULL dereference bugs found by AI
    code review are headed to stable kernels.
  summary: >-
    The OverlayFS pull for Linux 7.4, merged before rc1, fixes bugs found by Chris Mason's
    AI review, including an info leak, use-after-free and NULL dereference bugs reachable
    by unprivileged users, an RCU walk stall with remote layers, and data loss with nfs_export.
    It also fixes copy up blocked by an empty security.capability xattr, a v6.16 override_creds
    regression, and two casefold bugs. The fixes are marked for backport to stable kernels.
  why: >-
    Hosts that run containers on OverlayFS should pick up the next stable kernels, since some
    of these bugs are reachable without privileges.
  followup: Stable kernel releases carrying the OverlayFS backports.
  thread: f-0068
  sources:
  - label: primary
    url: https://www.phoronix.com/news/OverlayFS-Many-Fixes
- title: >-
    macOS curl, git and bundled Python use a separate trust store that Apple's eMudhra block
    did not cover
  section: Apple platforms
  category: Apple
  blurb: >-
    Apple blocked the compromised eMudhra certificates in the macOS trust store, but tools
    reading /etc/ssl/cert.pem still need a manual fix.
  summary: >-
    Howard Oakley reports that Apple updated the main macOS trust store between 2026-10-19
    and 2026-10-23 to block the eight compromised eMudhra certificates, with no visible record
    in System Settings. Command tools that read /etc/ssl/cert.pem, including curl, git and
    bundled Python, are not covered, and apps with their own trust stores such as Chrome,
    Firefox and some Electron apps need their own updates.
  why: >-
    Developers on macOS should block the eMudhra certificates in /etc/ssl/cert.pem and check
    language runtimes and Electron apps that bundle CA lists.
  thread: f-0077
  sources:
  - label: primary
    url: https://eclecticlight.co/2026/11/01/last-week-on-my-mac-an-insecure-world-built-on-trust-stores/
- title: >-
    Radim Marek measures DROP TABLE on large PostgreSQL tables: 16.1 s on ext4 versus 80 ms
    on XFS for 1 TB cold
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Dropping a huge Postgres table writes about 80 KB of WAL, but unlinking its files stalls
    replay on replicas, worst on fragmented ext4.
  summary: >-
    Prompted by GitLab's plan to drop a 4 TB table with ten replicas, Radim Marek measured
    on PostgreSQL 18.6 that DROP TABLE writes about 80 KB of WAL while the standby startup
    process unlinks the files and holds replay. A cold 1 TB drop took 16.1 s on ext4 against
    80 ms on XFS, with cost tracking extent count at about 17 ms per segment plus about 34
    ms per cached GB. Batched deletes of 25.2 million rows wrote 8179 MB of WAL, mostly full
    page images.
  why: >-
    Before dropping a large table, check the filesystem and page cache on every replica, set
    a short lock_timeout, and enable log_recovery_conflict_waits.
  sources:
  - label: primary
    url: https://postgr.es/p/9AI
