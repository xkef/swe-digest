- title: >-
    Chainalysis discloses a breach in which an attacker used offensive agentic techniques
    to reach internal tools
  section: Security
  category: Security
  blurb: >-
    Chainalysis says an attacker using offensive agentic techniques reached internal tools
    and exposed customer names, emails, IDs and roles.
  summary: >-
    Chainalysis disclosed on 2026-10-30 that an external actor used offensive agentic techniques
    earlier in October to access its systems and internal tools, exposing user IDs, names,
    email addresses and role labels. The company says it found no evidence of access to investigation
    content, credentials or session tokens, and says the incident is unrelated to the Binance
    theft. It has not named the vulnerabilities exploited.
  why: >-
    It is another named intrusion attributed to AI-driven offensive tooling, which raises
    the pace defenders should assume for discovery and exploitation of internal services.
  sources:
  - label: primary
    url: https://www.bleepingcomputer.com/news/security/chainalysis-discloses-data-breach-from-offensive-agentic-techniques/
- title: >-
    Public PoC released for Android SMS of Death CVE-2026-58882, a zero-click crash of the
    phone process
  section: Security
  category: Security
  blurb: >-
    An eight-byte WAP Push SMS crashes com.android.phone and can loop reboots, and Android
    12 and 13 devices did not get the October fix.
  summary: >-
    Researcher Mark Blah published a proof of concept for CVE-2026-58882, an unchecked header
    length in WapPushOverSms.decodeWapPdu that throws NegativeArraySizeException and crashes
    com.android.phone, dropping calls including emergency calls. Twenty messages put test
    phones into reboot loops, one Android 12 device needed a factory reset. Google fixed it
    in October 2026 updates for Android 14 to 17, though the flaw is not listed in the October
    bulletin.
  why: >-
    Fleets with Android 12 or 13 devices have no fix for a remotely triggered crash and should
    plan device replacement or carrier filtering.
  sources:
  - label: primary
    url: https://www.bleepingcomputer.com/news/security/new-android-sms-of-death-exploit-can-remotely-crash-unpatched-phones/
- title: >-
    Alpine Linux rebuilds its GitLab server and resets passwords after attempted CVE-2026-97229
    exploitation
  section: Security
  category: Security
  blurb: >-
    Attackers targeted Alpine's GitLab with CVE-2026-97229 on 2026-10-20, and missing logs
    led the project to rebuild it and reset passwords.
  summary: >-
    Attackers submitted malicious CI configurations against Alpine's GitLab on 2026-10-20
    and 2026-10-21, causing eight worker crashes, four partially successful. Alpine's custom
    container image lacked the Ruby patch GitLab bundles in official packages, so upgrades
    to 19.3.5 and 19.3.6 did not close the flaw. Alpine found no tampering in commits, packages
    or releases up to 2026-10-27, signing keys were not on the server, and it rebuilt the
    instance because missing logs prevent ruling out code execution.
  why: >-
    Teams running GitLab from custom images must confirm the patched Ruby (3.3.13 in Alpine's
    image) is present, since the GitLab version number alone does not prove the fix.
  thread: f-0082
  sources:
  - label: primary
    url: https://www.bleepingcomputer.com/news/security/alpine-linux-rebuilds-gitlab-after-attempted-rce-attack/
- title: OpenAI will make ChatGPT and Codex draw from one shared usage allowance
  section: AI
  category: AI
  blurb: >-
    Codex users will share a single quota with ChatGPT chats, while OpenAI already doubled
    Work and Codex allowances on Pro plans from 2026-10-29.
  summary: >-
    In an email to subscribers reported by BleepingComputer, OpenAI says use of ChatGPT and
    Codex will draw from the same allowance, with Unlimited Instant excluded and heavier models
    consuming more. Combined usage and reset times appear under Settings, Usage. OpenAI separately
    doubled Work and Codex allowances for Pro 100, Pro 200 and Pro 500 effective 2026-10-29.
  why: >-
    Teams that budget Codex agent work against a plan quota now compete with chat usage for
    the same allowance.
  sources:
