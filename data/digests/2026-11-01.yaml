- title: >-
    Nolan Lawson benchmarks 12 JavaScript frameworks by the cost for Claude Code to build
    the same app
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Opus 5.5 built one Pokemon app five times per framework: Hono plus htmx cost least at
    $2.67 median, Angular most at $4.97 with 2 failures.
  summary: >-
    Nolan Lawson had Opus 5.5 in Claude Code build the same spec-tested app in 12 frameworks,
    five runs each, and measured cost, time, tokens, lines of code and Lighthouse scores.
    Median cost ran from $2.67 for Hono plus htmx to $4.97 for Angular, SvelteKit runs read
    the v3 migration guide every time, and framework MCP servers and skills were used inconsistently,
    with the Nuxt MCP never used. The benchmark is on GitHub.
  why: >-
    It gives a reproducible method for judging framework choice by agent token cost and code
    size instead of claims that a stack is better for agents.
  sources:
  - label: primary
    url: https://nolanlawson.com/2026/10/28/the-ai-cost-of-javascript-frameworks/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50323088
- title: >-
    Engineer details an OpenCode setup where GPT-6.1 Sol orchestrates and a self-hosted GLM-5.3-Flash
    writes code
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    A practitioner routes about 70 to 75 percent of coding agent tokens to a self-hosted model
    on H200s while a frontier model plans and reviews.
  summary: >-
    Aayush Garg runs GLM-5.3-Flash on a 4-GPU H200 server with 512K context and configures
    OpenCode so a GPT-6.1 Sol orchestrator delegates to GLM explorer and implementer subagents
    and verifies diffs itself. He reports that Codex and Claude Code subagents cannot target
    a different endpoint, so the split is not possible there. He adds ordered permission rules
    because OpenCode does not sandbox the agent.
  why: >-
    It shows a concrete per-agent model routing and permission config for cutting frontier
    model spend, plus the harness limits that block it in Codex and Claude Code.
  sources:
  - label: primary
    url: https://aayushgarg.dev/posts/2026-11-01-gpt-local-model-opencode/
  - label: discussion
    url: https://www.reddit.com/r/LocalLLaMA/comments/1xkz4lf/glm53flash_on_our_h200s_does_most_of_my_coding/
- title: >-
    Paper finds on-policy distillation gains depend on where the teacher keeps reasoning paths
    open
  section: ML research
  category: Paper
  blurb: >-
    On-policy distillation gains come from matching where the teacher keeps reasoning paths
    open, measured by a new entropy shape correlation.
  summary: >-
    The authors define entropy shape, the sequence of next-token entropies, and an Entropy
    Shape Correlation between student and teacher. Interventions on teacher entropy that preserve
    token preferences show that where to branch causally drives OPD gains, and pre-OPD ESC
    picks the best teacher better than existing predictors. Code is released.
  why: >-
    Teams post-training with on-policy distillation get a cheap pre-training check for choosing
    a teacher instead of assuming the strongest model helps most.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.39020v1
- title: >-
    Study of 25 open-weight models finds chain-of-thought reliance rises with scale and not
    with post-training
  section: ML research
  category: Paper
  blurb: >-
    Across 25 open-weight models, answers follow edited chain-of-thought steps more as models
    grow, and post-training does not change that.
  summary: >-
    On a synthetic box-swap task with known intermediate states, replacing one step in a model's
    own chain shows answer reliance rising from 16 to 18 percent at Qwen3 0.6B to 97 to 100
    percent at 14B, correlating with step accuracy at r = 0.99. Base and post-trained Qwen3
    differ by at most 0.03 from 4B up, and no model up to 14B solves four or more swaps without
    written steps.
  why: >-
    It supports chain-of-thought monitoring as a safety signal for step-by-step tasks on larger
    models, with evidence limited to models up to 14B.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.38433v1
- title: MTA-OPSD lets each token choose its own teacher in on-policy self-distillation
  section: ML research
  category: Paper
  blurb: >-
    MTA-OPSD lets each token pick its own teacher from a pool during on-policy self-distillation,
    gaining up to 5.9 points on Qwen3 math.
  summary: >-
    The authors show through a teacher-intervention study that the preferred self-teacher
    varies token by token within one response, identified by majority voting and KL-based
    selection. MTA-OPSD builds a pool of candidate teachers with different reference exposure
    and selects one per token during training. On Qwen3 models for math reasoning it beats
    prior OPSD methods with an average gain of up to 5.9 over the base model, and code is
    released.
  why: >-
    It adds a token-level knob to self-distillation recipes that post-training teams can test
    against fixed-teacher OPSD.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.40574v1
- title: >-
    numoracle replaces fixed atol and rtol with derived per-element bounds for testing low-precision
    GPU kernels
  section: ML research
  category: Paper
  blurb: >-
    A test oracle for Triton kernels from Liger-Kernel, Unsloth and vLLM caught 116 of 124
    mutants with no false alarms on correct runs.
  summary: >-
    The paper derives per-element acceptance regions from precision-annotated reference programs,
    tracking shared rounding, block-scaled quantizers and math library error. On 13 Triton
    operators across two GPU generations it raised no false alarms on 33,960 correct runs
    per GPU, while tuned tolerances flagged up to 30 percent of correct runs under input shift.
    It killed 116 of 124 mutants on an RTX PRO 6000 versus 59 to 83 for fixed baselines.
  why: >-
    Kernel authors testing FP8 and block-scaled code get an alternative to hand-tuned tolerances
    that either flake or miss real accuracy bugs.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.38983v1
- title: >-
    KDE developer Eike Hein introduces Kwi, a GPU-accelerated terminal built on libghostty-vt
  section: Developer tools
  category: Dev tools
  blurb: >-
    KDE developer Eike Hein starts Kwi, a Qt Quick terminal on libghostty-vt that he measures
    at 3x to 35x faster than Konsole.
  summary: >-
    Kwi renders through the Qt Scene Graph with Vulkan or OpenGL and uses libghostty-vt for
    terminal parsing and state, plus KDE's KPty. It supports Kitty image, keyboard and clipboard
    protocols, mode 2027 grapheme widths and Wayland fractional scaling, and ships a public
    QML module and a KPart replacement for apps such as Dolphin, Kate and Yakuake. There is
    no tagged release yet, with nightly Flatpak builds from KDE Invent CI.
  why: >-
    It is another major downstream adopter of libghostty-vt ahead of that library's planned
    stable 1.0 API in the next four to six months.
  sources:
  - label: primary
    url: https://blogs.kde.org/2026/11/01/introducing-kwi/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50324114
  - label: discussion
    url: https://www.phoronix.com/news/KDE-Kwi-Terminal-Emulator
- title: >-
    chezmoi 2.74.0 removes the deprecated remove command and marks several integrations stable
  section: Developer tools
  category: Dev tools
  blurb: >-
    chezmoi 2.74.0 deletes the deprecated remove command and promotes ssh, docker, gopass
    and 1Password Connect support to stable.
  summary: >-
    chezmoi v2.74.0, released 2026-11-01, removes the deprecated remove command and adds a
    skip conflicts choice to apply. It marks builtin KeePassXC YubiKey, builtin gopass, 1Password
    Connect, and the ssh and docker commands as no longer experimental, and checks permissions
    of age identity files with builtin age.
  why: >-
    Scripts that still call chezmoi remove will break on upgrade, and age identity files with
    loose permissions may now be flagged.
  sources:
  - label: primary
    url: https://github.com/twpayne/chezmoi/releases/tag/v2.74.0
- title: >-
    Daniel Lemire shows signed 32-bit division by constants can skip the compiler's correction
    step on 64-bit CPUs
  section: Languages and runtimes
  category: Languages
  blurb: >-
    A 33-bit multiplier trick removes two instructions from signed 32-bit division by constants,
    and fastmod 0.2.0 drops a mispredicted branch.
  summary: >-
    GCC and LLVM need an add-back correction for 38 percent of divisors from 3 to 1000 because
    the ideal multiplier needs 33 bits, while a signed 64-bit multiply avoids it and cuts
    latency from 10 to 8 cycles on Emerald Rapids. Lemire also released fastmod 0.2.0, whose
    branchless signed division is about four times faster than 0.1.0 with random signs on
    Intel.
  why: >-
    Hot loops dividing signed 32-bit values by constants or runtime divisors can gain latency
    with a short template, though it is slower on Apple M4 when no correction is needed.
  sources:
  - label: primary
    url: https://lemire.me/blog/2026/10/31/beating-the-compiler-at-signed-32-bit-division/
  - label: discussion
    url: https://www.reddit.com/r/programming/comments/1xka27q/beating_the_compiler_at_signed_32bit_division/
- title: >-
    Linux 7.4 merges OverlayFS fixes for bugs found by Chris Mason's AI review, several reachable
    by unprivileged users
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    OverlayFS fixes for an info leak, use-after-free and NULL dereference bugs found by AI
    code review are headed to stable kernels.
  summary: >-
    The OverlayFS pull for Linux 7.4, merged before rc1, fixes bugs found by Chris Mason's
    AI review, including an info leak, use-after-free and NULL dereference bugs reachable
    by unprivileged users, an RCU walk stall with remote layers, and data loss with nfs_export.
    It also fixes copy up blocked by an empty security.capability xattr, a v6.16 override_creds
    regression, and two casefold bugs. The fixes are marked for backport to stable kernels.
  why: >-
    Hosts that run containers on OverlayFS should pick up the next stable kernels, since some
    of these bugs are reachable without privileges.
  followup: Stable kernel releases carrying the OverlayFS backports.
  thread: f-0068
  sources:
  - label: primary
    url: https://www.phoronix.com/news/OverlayFS-Many-Fixes
- title: >-
    Linux 7.2.15 is the final 7.2 stable release, ending the series earlier than usual
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Greg Kroah-Hartman ends the 7.2 stable series early with 7.2.15 and tells users to move
    to 7.3.y to cut the number of live branches.
  summary: >-
    Greg Kroah-Hartman released 7.2.15 on 2026-11-01 and declared the 7.2.y tree end-of-life.
    He said he ended it sooner than normal because of the release cycle and the queue of pending
    stable patches, which would otherwise mean keeping eight branches alive at once.
  why: >-
    Systems tracking 7.2.y get no further fixes, including for open kernel CVEs, and need
    to move to 7.3.y or an LTS branch.
  sources:
  - label: primary
    url: https://lwn.net/Articles/1104629/
- title: >-
    macOS curl, git and bundled Python use a separate trust store that Apple's eMudhra block
    did not cover
  section: Apple platforms
  category: Apple
  blurb: >-
    Apple blocked the compromised eMudhra certificates in the macOS trust store, but tools
    reading /etc/ssl/cert.pem still need a manual fix.
  summary: >-
    Howard Oakley reports that Apple updated the main macOS trust store between 2026-10-19
    and 2026-10-23 to block the eight compromised eMudhra certificates, with no visible record
    in System Settings. Command tools that read /etc/ssl/cert.pem, including curl, git and
    bundled Python, are not covered, and apps with their own trust stores such as Chrome,
    Firefox and some Electron apps need their own updates.
  why: >-
    Developers on macOS should block the eMudhra certificates in /etc/ssl/cert.pem and check
    language runtimes and Electron apps that bundle CA lists.
  thread: f-0077
  sources:
  - label: primary
    url: https://eclecticlight.co/2026/11/01/last-week-on-my-mac-an-insecure-world-built-on-trust-stores/
- title: >-
    Radim Marek measures DROP TABLE on large PostgreSQL tables: 16.1 s on ext4 versus 80 ms
    on XFS for 1 TB cold
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Dropping a huge Postgres table writes about 80 KB of WAL, but unlinking its files stalls
    replay on replicas, worst on fragmented ext4.
  summary: >-
    Prompted by GitLab's plan to drop a 4 TB table with ten replicas, Radim Marek measured
    on PostgreSQL 18.6 that DROP TABLE writes about 80 KB of WAL while the standby startup
    process unlinks the files and holds replay. A cold 1 TB drop took 16.1 s on ext4 against
    80 ms on XFS, with cost tracking extent count at about 17 ms per segment plus about 34
    ms per cached GB. Batched deletes of 25.2 million rows wrote 8179 MB of WAL, mostly full
    page images.
  why: >-
    Before dropping a large table, check the filesystem and page cache on every replica, set
    a short lock_timeout, and enable log_recovery_conflict_waits.
  sources:
  - label: primary
    url: https://postgr.es/p/9AI
- title: >-
    Awide's Polar Proxy offloads reads inside open PostgreSQL transactions to replicas
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Awide's Polar Proxy offloads read committed SELECTs inside open PostgreSQL transactions
    to replicas using XID import and LSN waits.
  summary: >-
    The proxy keeps the transaction on the primary and sends eligible top-level SELECTs without
    locking clauses to a replica connection, which waits for a target LSN and, after the first
    write, imports the transaction's XIDs to see its own writes. A patched libpq adds a splittable
    marker and XID list to ReadyForQuery, repeatable read and serializable transactions are
    never split, and the borrowed replica is pinned until commit or rollback. The post contrasts
    this with Pgpool-II, PgBouncer, Vitess and Aurora's in-engine read consistency.
  why: >-
    It shows the exact conditions under which mid-transaction replica reads stay correct on
    read committed, a gap stock PostgreSQL proxies leave on the primary.
  sources:
  - label: primary
    url: https://postgr.es/p/9AK
