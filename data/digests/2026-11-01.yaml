- title: >-
    Chainalysis discloses a breach in which an attacker used offensive agentic techniques
    to reach internal tools
  section: Security
  category: Security
  blurb: >-
    Chainalysis says an attacker using offensive agentic techniques reached internal tools
    and exposed customer names, emails, IDs and roles.
  summary: >-
    Chainalysis disclosed on 2026-10-30 that an external actor used offensive agentic techniques
    earlier in October to access its systems and internal tools, exposing user IDs, names,
    email addresses and role labels. The company says it found no evidence of access to investigation
    content, credentials or session tokens, and says the incident is unrelated to the Binance
    theft. It has not named the vulnerabilities exploited.
  why: >-
    It is another named intrusion attributed to AI-driven offensive tooling, which raises
    the pace defenders should assume for discovery and exploitation of internal services.
  sources:
  - label: primary
    url: https://www.bleepingcomputer.com/news/security/chainalysis-discloses-data-breach-from-offensive-agentic-techniques/
- title: >-
    Public PoC released for Android SMS of Death CVE-2026-58882, a zero-click crash of the
    phone process
  section: Security
  category: Security
  blurb: >-
    An eight-byte WAP Push SMS crashes com.android.phone and can loop reboots, and Android
    12 and 13 devices did not get the October fix.
  summary: >-
    Researcher Mark Blah published a proof of concept for CVE-2026-58882, an unchecked header
    length in WapPushOverSms.decodeWapPdu that throws NegativeArraySizeException and crashes
    com.android.phone, dropping calls including emergency calls. Twenty messages put test
    phones into reboot loops, one Android 12 device needed a factory reset. Google fixed it
    in October 2026 updates for Android 14 to 17, though the flaw is not listed in the October
    bulletin.
  why: >-
    Fleets with Android 12 or 13 devices have no fix for a remotely triggered crash and should
    plan device replacement or carrier filtering.
  sources:
  - label: primary
    url: https://www.bleepingcomputer.com/news/security/new-android-sms-of-death-exploit-can-remotely-crash-unpatched-phones/
- title: >-
    Anthropic adds a Claude Code rule on Opus 5.5 that steers it away from recreating specific
    existing games
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Claude Code on Opus 5.5 now refuses to build recreations of specific existing games, and
    developers report refusals on their own projects.
  summary: >-
    A Claude Code rule pushed around 2026-10-27 reads that Claude should build original games,
    genre games and games from the user's own designs, but not a recreation of a specific
    existing game, and users report it cannot be disabled. Anthropic's Addy Osmani confirmed
    that two sentences were added to Claude Code's prompt on Opus 5.5 and said Anthropic will
    keep iterating on the balance.
  why: >-
    Agent behavior can change through server-side prompt edits without a client release, so
    teams doing game work or reverse engineering with Claude Code should expect new refusals
    and a moving policy.
  comments: >-
    Tom's Hardware reports developers seeing refusals on their own projects and on generic
    reverse-engineering and troubleshooting tasks.
  sources:
  - label: primary
    url: https://www.gamedeveloper.com/programming/anthropic-appears-to-have-ordered-ai-tool-claude-to-stop-remaking-video-games
  - label: discussion
