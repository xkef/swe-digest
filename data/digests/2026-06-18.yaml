    A long-running open-source Apple-platform app moving to structured concurrency and Liquid
    Glass is a reference point for how mature SwiftUI and AppKit apps adopt the newer platform
    APIs.
  sources:
  - label: inessential.com
    url: https://inessential.com/2026/06/15/netnewswire-status.html
- title: Prometheus 3.5.4 LTS patches a plaintext secret-exposure flaw
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Prometheus 3.5.4 LTS patches plaintext secret exposure in STACKIT service discovery's
    /-/config endpoint and updates golang and OpenTelemetry.
  summary: >-
    Prometheus released v3.5.4 on 2026-06-17, a backported security patch on the 3.5 LTS line.
    It fixes GHSA-39j6-789q-qxvh, where secrets were exposed in plaintext through the /-/config
    endpoint in STACKIT service discovery, and bumps golang.org/x/net to v0.55.0 and OpenTelemetry
    to v1.43.0 to address Go advisories GO-2026-5026, GO-2026-4918, and GO-2026-4985, plus
