stories:
- title: >-
    Leaked OpenAI 2025 financials, verified by the Financial Times, show a 38.5B USD net loss
  section: Top stories
  category: Markets
  blurb: >-
    OpenAI's 2025 financials, verified by the Financial Times, show 13.07B USD revenue against
    34B USD costs, yielding a 38.53B USD net loss.
  summary: >-
    Leaked audited 2025 financial documents, first surfaced by Ed Zitron and independently
    verified by the Financial Times, report OpenAI revenue of 13.07B USD against total costs
    of 34B USD, with a net loss of 38.53B USD. Revenue more than tripled from roughly 3.7B
    USD in 2024. The headline net loss includes a 41.55B USD non-cash charge tied to the nonprofit-to-for-profit
    conversion; the underlying operating loss was about 20.9B USD, and some analysts put the
    cash operating loss nearer 8B USD. Research and development was the largest line at 19.18B
    USD, and OpenAI paid Microsoft 17.2B USD for compute and research. OpenAI has not confirmed
    or disputed the figures during its pre-IPO quiet period.
  why: >-
    Compute spend and loss trajectory shape the pricing and durability of the AI developer
    platforms many teams now depend on, though the documents are leaked and unconfirmed by
    OpenAI.
  followup: >-
    Track OpenAI confirmation, the public S-1, and whether the one-time conversion charge
    recurs.
  comments: >-
    HN commenters noted revenue growth (about 3.5x) outpaced cost growth (about 3x) and that
    cost of revenue of 7.5B USD against 13.07B USD revenue implies a positive inference gross
    margin; several flagged that profitability projections hinge on GPU depreciation assumptions.
  sources:
  - label: Ars Technica
    url: https://arstechnica.com/ai/2026/06/leaked-financial-docs-show-openai-is-losing-billions-of-dollars-a-year/
  - label: originating report
    url: https://www.wheresyoured.at/exclusive-openai-financials/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48577208
- title: Z.ai publishes GLM-5.2 open weights under MIT on Hugging Face
  section: Top stories
  category: AI
  blurb: >-
    Z.ai published GLM-5.2, a 753B-parameter open-weight model under MIT, runnable locally
    and removing China-hosted-API data handling concerns.
  summary: >-
    Z.ai (Zhipu) published the GLM-5.2 open-weight checkpoint on Hugging Face under the MIT
    license, fulfilling the open-weight release promised at the 2026-06-13 announcement. The
    repository lists a 753B-parameter mixture-of-experts model in BF16 and F32 tensors with
    a 1M-token context window and an "IndexShare" attention design that reuses one indexer
    across every four sparse attention layers. Community quantized variants for llama.cpp,
    Ollama, and LM Studio appeared within hours. Vendor and secondary coding-benchmark numbers
    remain unreproduced and should be treated as developing.
  why: >-
    An MIT-licensed model that topped the open-weights intelligence index is now runnable
    locally, removing the China-hosted-API data-handling concern and raising migration pressure
    on paid coding and agent APIs.
  followup: Track independent coding-benchmark reproduction and adoption in agent harnesses.
  sources:
  - label: Hugging Face zai-org/GLM-5.2
    url: https://huggingface.co/zai-org/GLM-5.2
  - label: discussion
    url: https://news.ycombinator.com/item?id=48567759
- title: >-
    Tesco moves to migrate about 40,000 workloads off VMware amid its Broadcom dispute
  section: Top stories
  category: Markets
  blurb: >-
    Tesco is migrating 40,000 workloads off VMware by end of 2027 following Broadcom's licensing
    changes and disputed perpetual-license refusal.
  summary: >-
    Reporting on 2026-06-17, drawn from Tesco's UK High Court filings against Broadcom and
    reseller Computacenter, says the retailer is migrating about 40,000 server workloads off
    VMware and aims to be fully off by the end of 2027, which it describes as its earliest
    feasible date. Tesco bought VMware perpetual licenses plus Tanzu subscription and support
    in January 2021 with a four-year extension option; it alleges Broadcom declared the perpetual
    software end-of-life, moved to subscription-only bundles, and refused the extension. Tesco
    runs tills, logistics, and supply-chain systems on the estate and seeks more than 100M
    GBP in damages. The replacement platform is not publicly named; the filings note it is
    incompatible with Tesco's existing Veeam and Zerto backup and disaster-recovery tooling.
  why: >-
    A migration of this scale at a major retailer is a concrete data point on the operational
    cost and risk that Broadcom's VMware licensing changes are pushing onto large enterprises.
  followup: >-
    Track the chosen replacement platform, the migration timeline, and the litigation outcome.
  sources:
  - label: Ars Technica
    url: https://arstechnica.com/information-technology/2026/06/tesco-moving-40000-server-workloads-off-vmware-amid-broadcoms-abusive-conduct/
  - label: The Register
    url: https://www.theregister.com/virtualization/2026/06/17/tesco-is-sprinting-to-quit-vmware-and-broadcom-despite-rapid-migration-risks/
