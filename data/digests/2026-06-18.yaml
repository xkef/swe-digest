- title: Otty, a commercial native macOS terminal, ships with agent-first framing
  section: Developer tools
  category: Dev tools
  blurb: >-
    Otty, a closed-source paid macOS terminal, offers GPU acceleration and first-class support
    for coding agents running in the terminal.
  summary: >-
    A Show HN surfaced Otty, a native, GPU-accelerated macOS terminal for Apple Silicon and
    Intel, with Windows, Linux, and iOS waitlists. Marketed features include GPU-accelerated
    scrolling, ligatures, 24-bit color, inline images, clickable file and URL links, session
    recovery, tabs and splits, and first-class support for coding agents running in the terminal.
    The site lists pricing and a license agreement; the project is commercial and does not
    state that it is open source, unlike Ghostty, WezTerm, and Alacritty. Implementation stack
    and version are not disclosed.
  why: >-
    Terminal projects positioning around coding-agent workflows are a recurring theme, but
    a closed-source paid terminal is a different tradeoff from the open-source tools developers
    usually adopt.
  sources:
  - label: Otty
    url: https://otty.sh/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48565045
- title: >-
    Emacs 31.0.90 pretest highlights tree-sitter defaults and an editable xref workflow
  section: Developer tools
  category: Dev tools
  blurb: >-
    Emacs 31.0.90 enables tree-sitter by default, adds auto-grammar installation for supported
    modes, and provides editable grep-style xref workflow.
  summary: >-
    The first Emacs 31 pretest, 31.0.90, was announced on the emacs-devel list in June 2026.
    A practitioner write-up that reached the HN front page on 2026-06-18 details the changes
    being daily-driven: `treesit-enabled-modes` set to `t` switches the major modes that have
    a tree-sitter variant over to it; `treesit-auto-install-grammar` offers to fetch and build
    a missing grammar instead of erroring; grammar sources for languages such as TypeScript,
    TSX, Rust, TOML, YAML, and Dockerfile now live inside the modes; and a new command `xref-export-to-grep`,
    bound to `E` in xref buffers, gives an editable grep-and-dired-style workflow. This is
    a pretest, not a final release.
  why: >-
    The tree-sitter defaults reduce per-language configuration for Emacs users and continue
    the editor's move toward built-in incremental parsing.
  sources:
  - label: emacs-devel announcement
    url: https://lists.gnu.org/archive/html/emacs-devel/2026-06/msg00118.html
  - label: Rahul Juliato write-up
    url: https://www.rahuljuliato.com/posts/emacs-31-around-the-corner
  - label: discussion
    url: https://news.ycombinator.com/item?id=48584135
- title: Kerkour argues stdx stays off crates.io for supply-chain reasons
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Kerkour argues stdx avoids crates.io via Git-only distribution to reduce supply-chain
    risk and prevent namespace squatting of the stdlib project.
  summary: >-
    Sylvain Kerkour published a post explaining why stdx, an extended Rust standard-library
    project focused on simplicity, performance, and supply-chain security, is deliberately
    not published to crates.io. The argument is that importing directly from source via Git
    avoids centralized-registry namespace squatting and reduces supply-chain risk, continuing
    Kerkour's earlier thesis on Rust dependency exposure. The post is opinion, not a registry
    policy change.
  why: >-
    Registry trust and dependency provenance are an active concern for Rust teams after repeated
    package-ecosystem incidents, and source-only distribution is one response practitioners
    are debating.
  sources:
  - label: kerkour.com
    url: https://kerkour.com/stdx-cratesio
  - label: rust-stdx/stdx
    url: https://github.com/rust-stdx/stdx
- title: NetNewsWire maintainer reports a year of modernization, not a sunset
  section: Apple platforms
  category: Apple
  blurb: >-
    Simmons reported NetNewsWire modernization with 2,188 commits, Swift concurrency migration,
    Liquid Glass UI, and performance work.
  summary: >-
    Brent Simmons posted a status update on the open-source macOS and iOS RSS reader NetNewsWire
    on 2026-06-15. He describes a year out of retirement spent on modernization rather than
    features: about 2,188 commits, migration to Swift structured concurrency and async-await,
