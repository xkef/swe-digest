- title: >-
    Browser Use details sub-second browser starts on nested Firecracker microVMs in EC2
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Browser Use used Firecracker snapshots and page-size tuning to cut microVM browser starts
    from 9.8s to 3.1s and creation costs by 67 percent.
  summary: >-
    Browser Use published an engineering write-up on 2026-06-15 on running Firecracker microVMs
    nested inside regular EC2 instances rather than on bare-metal, trading nested-virtualization
    overhead for faster provisioning and lower cost. Browsers resume from a VM snapshot paused
    just before Chromium launches, cutting initial restore from 9.8s to 3.1s. The team raised
    the guest page size from 4KB to 2MB and added a custom userfaultfd handler that preloads
    pages Chromium touches early, reducing page faults by about 91x. vCPUs are unpinned during
    launch then pinned to stable cores with real-time priority. A custom control plane handles
    fleet monitoring and placement without CloudWatch, and edge routers forward WebSocket
    connections to the placed VM. Reported metrics are VM cold start under 400ms, end-to-end
    browser creation at 825ms p50 and 1.35s p99, and cost cut from 0.06 to 0.02 USD per browser-hour.
  why: >-
    The snapshot-resume, page-size, and userfaultfd techniques are concrete, transferable
    methods for cutting microVM cold-start latency in agent and browser-automation infrastructure.
  sources:
  - label: browser-use.com
    url: https://browser-use.com/posts/firecracker-browser-infra
  - label: discussion
    url: https://news.ycombinator.com/item?id=48556561
- title: DOJ moves to shield xAI gas turbines as national and energy security
  section: Markets and companies
  category: Markets
  blurb: >-
    DOJ moved to shield xAI's unpermitted gas turbines citing national, economic, and energy
    security concerns over potential Clean Air Act shutdown.
  summary: >-
    TechCrunch reported on 2026-06-16 that the US Department of Justice moved to intervene
    in a Clean Air Act lawsuit over xAI's unpermitted gas turbines powering its Colossus data
    centers near Memphis, arguing that a shutdown would harm national, economic, and energy
    security. A Department of Defense official said Grok is one of four proprietary models
    supporting classified operations. The engineering-adjacent angle is data-center power
    procurement and permitting for AI training capacity.
  why: >-
    Power and permitting are becoming a binding constraint on AI compute buildout, and government
    intervention on behalf of one operator's energy supply is a marker of how that constraint
    is being handled.
