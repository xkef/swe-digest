- title: Midjourney Medical draws heavy skepticism over false positives and image quality
  section: Hacker News
  category: Pulse
  blurb: >-
    Midjourney Medical proposed AI ultrasound screening, but radiologists questioned false-positive
    rates and image quality vs standard ultrasound.
  summary: >-
    Midjourney, the AI image-generation company, announced a full-body ultrasound imaging
    concept: submerging a person in water inside a ring of thousands of transducers to produce
    an AI-reconstructed 3D body scan in about 60 seconds without radiation, aimed at very
    cheap mass screening. The thread reached the HN front page on 2026-06-18 with 425 points.
  why: >-
    It is a marker of AI-imaging companies moving into regulated medical sensing, where the
    hard problems are statistics, physics, and data handling rather than model quality, and
    the practitioner pushback is the signal.
  comments: >-
    Radiologists and statisticians invoked Bayes' theorem to argue that broad screening of
    asymptomatic populations yields mostly false positives that drive unnecessary procedures
    and anxiety even at high test accuracy; a practicing radiologist said the sample images
    lack diagnostic anatomic detail and look worse than conventional ultrasound; others questioned
    ultrasound penetration through bone and gas-filled organs and flagged motion artifacts
    and petabyte-scale data handling. Ultrasound computed tomography already exists in breast
    imaging without displacing standard methods.
  sources:
  - label: Midjourney Medical
    url: https://www.midjourney.com/medical
  - label: discussion
    url: https://news.ycombinator.com/item?id=48579650
