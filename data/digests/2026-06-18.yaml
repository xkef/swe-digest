    carries no CVE id or stated CVSS score at release.
  why: >-
    Operators running STACKIT service discovery on a 3.5 LTS Prometheus could leak credentials
    through an exposed config endpoint, so the LTS upgrade is a direct fix.
  followup: >-
    Track a CVE assignment and severity for the STACKIT service-discovery secret exposure.
  sources:
