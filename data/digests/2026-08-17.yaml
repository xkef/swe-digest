date: '2026-08-17'
stories:
- title: >-
    GitHub degraded worldwide with about 20 percent error rates across web, API, Actions,
    and authentication
  section: Top stories
  category: Outage
  status: developing
  blurb: >-
    GitHub reported about 20 percent error rates affecting git operations, pull requests,
    Actions, and SSO with no vendor fallback available.
  summary: >-
    GitHub opened the incident at 13:40 UTC on 2026-08-17, and it was still open at 16:16
    UTC, the last update this run read. GitHub reports about 20 percent error rates for web
    experiences and API traffic, and about 50 percent for archive downloads and raw repository
    content downloads. SAML and OIDC authentication, SCIM, and Team Sync are named as impacted,
    and the affected components listed are Git Operations, Webhooks, API Requests, Issues,
    Pull Requests, Actions, Pages, and Copilot. GitHub states it is performing mitigations
    and has published no root cause, which is why this is marked developing. A concurrent
    Ask HN thread asked for alternatives to GitHub.
  why: >-
    Git operations, pull requests, Actions runs, and single sign-on fail together, so a team
    loses code review, CI, and access to private repositories at the same time and has no
    in-vendor fallback.
  followup: >-
    Recheck the status page for the resolution time, the final impact window, and any published
    root cause.
  sources:
  - label: GitHub Status incident
    url: https://www.githubstatus.com/incidents/zkxwbgr0cnmx
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49330684
  - label: 'Ask HN: Alternatives to GitHub'
    url: https://news.ycombinator.com/item?id=49331033
- title: >-
    rsync 3.5.0 fixes 33 security issues including a critical daemon access-control bypass
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    rsync 3.5.0 fixes 33 security issues including a daemon access-control bypass and wire-reachable
    memory corruption in code inside CI pipelines.
  summary: >-
    rsync 3.5.0 was released on 2026-08-13 and fixes 33 security issues, with CVE IDs assigned
    by VulnCheck and per-issue introduced-in ranges narrower than a blanket everything before
    3.5.0. CVE-2026-53791 lets a client that connects directly to a daemon running with `proxy
    protocol = true` send its own PROXY header, spoof a source address, and bypass host-based
    access control, and five further daemon flaws are peer-triggerable memory corruption reachable
    from the wire, four of them writes, found in a fuzzing pass reported by Greg Kroah-Hartman.
    Further high-severity issues cover an rrsync restricted-directory escape, argument injection
    through `RSYNC_CONNECT_PROG` and daemon exec hooks, and `hosts deny` failing open when
    a hostname does not resolve. rsync NEWS rates CVE-2026-70454, rsync-ssl establishing TLS
    with no certificate verification and no hostname binding, as medium rather than high.
  why: >-
    rsync ships on nearly every Unix system and sits inside backup, mirror, and CI pipelines,
    so a daemon access-control bypass alongside wire-reachable memory corruption reaches infrastructure
    that is rarely tracked against a release cadence.
  followup: >-
    Track distribution backports, whether the residual path-based ACL and xattr behaviour
    on the BSDs, macOS, Solaris, and proc-less containers draws its own advisory, and whether
    any daemon memory-corruption CVE sees exploitation.
  sources:
  - label: rsync NEWS
    url: https://download.samba.org/pub/rsync/NEWS
  - label: release v3.5.0
    url: https://github.com/RsyncProject/rsync/releases/tag/v3.5.0
- title: Linux 7.2 released with cache-aware scheduler balancing and Btrfs large folios
  section: Top stories
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Linux 7.2 released with cache-aware scheduler, large folios in Btrfs, swap and sandboxing
    changes that distributions will carry into production.
  summary: >-
    Linux 7.2 is released, and LWN published its summary of the release on 2026-08-16. The
    summary covers cache-aware load balancing in the CPU scheduler and large folio support
    in Btrfs, along with changes to swap handling and sandboxing. LWN also names common attributes
    for `bpf()`, Landlock improvements, and dm-inlinecrypt.
  why: >-
    The release changes CPU scheduling, filesystem, swap, and sandboxing behaviour that distributions
    will carry into production kernels.
