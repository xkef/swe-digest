- title: Embedded engineer argues RISC-V wins on availability rather than ISA design
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    An embedded engineer argues RISC-V wins on availability, with one toolchain and instruction
    set spanning ten cent parts to MMU-capable SoCs.
  summary: >-
    An embedded engineer argues that the practical advantage of RISC-V is part availability
    across a wide range, not instruction set design. The post reports covering a ten cent
    RV32EC part, a dual core MCU, and an MMU-capable open SoC on one instruction set for under
    100 US dollars. The author frames the ARM Cortex-M to Cortex-A gap as a licensing boundary
    rather than an architectural one.
  why: >-
    One toolchain and one instruction set spanning from a ten cent part to an MMU-capable
    SoC changes what an embedded team has to relearn per project.
  sources:
  - label: rvembedded.com
    url: https://rvembedded.com/blog_post/12/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49321717
