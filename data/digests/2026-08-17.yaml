  section: Markets and companies
  category: Markets
  status: rumor
  blurb: >-
    Bloomberg reports Anthropic preliminary Q2 revenue above 11.5 billion against 787 million
    a year earlier and positive adjusted income.
  summary: >-
    Bloomberg reports preliminary second-quarter revenue above 11.5 billion US dollars against
    787 million a year earlier and 4.73 billion in the first quarter of 2026, plus positive
    adjusted operating income, from documents it viewed. The figures are preliminary, and
    CNBC reports that an Anthropic spokesperson did not immediately respond to its request
    for comment. CNBC reports that early investor meetings led by CFO Krishna Rao have not
    covered specific financials or a valuation, and that an IPO could come as soon as this
