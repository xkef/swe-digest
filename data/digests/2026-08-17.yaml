- title: >-
    Cloudflare announced Web Analytics on by default for free domains from 2025-10-15
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare announced Web Analytics on by default for free domains from 2025-10-15, requiring
    operators to check if the beacon is being served.
  summary: >-
    Cloudflare's post of 2025-09-17 announced that Web Analytics would be enabled by default
    for free-plan domains starting 2025-10-15, delivered as a JavaScript beacon and not applied
    to traffic originating from the EU or UK. The post was last modified 2026-07-15 and is
    written as a plan, so it does not confirm the rollout took effect. The Tell HN thread
    reported the beacon appearing on a site after a nameserver move to Cloudflare, which is
    consistent with the announced default but is not confirmation from Cloudflare that the
    rollout completed.
  why: >-
    An operator on the free plan needs to check whether the beacon is being served to visitors,
    because the announced behaviour ships it unless the setting is found and turned off.
  followup: >-
