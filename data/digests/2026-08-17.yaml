- title: >-
    Apple accepts binding commitments to align App Tracking Transparency prompts for third-party
    apps
  section: Apple platforms
  category: Apple
  status: confirmed
  blurb: >-
    Apple accepts binding commitments to ensure App Tracking Transparency prompts for third-party
    apps are neutral in content, wording, and layout.
  summary: >-
    The Bundeskartellamt states that Apple has accepted binding commitments over the App Tracking
    Transparency framework, announced on 2026-08-17. The consent prompt shown for third-party
    apps must be neutral in content, wording, and layout. Developers also get more freedom
    to combine the request Apple requires with the consent request required under data protection
    law.
  why: >-
    App developers get a consent prompt that must be neutral in content, wording, and layout,
    and more freedom to combine the Apple-required request with the one required under data
    protection law.
  followup: >-
    Track the implementation deadline and the SDK or App Store review changes that carry the
    commitments.
  sources:
