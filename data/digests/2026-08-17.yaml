- title: Qwen 3.8 27B ships under Apache 2 with over-thinking and throughput caveats
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Qwen 3.8 27B ships Apache 2 with tool calling and vision working locally from a 17GB quantized
    build, but throughput falls short of hosted APIs.
  summary: >-
    Qwen 3.8 27B is released with open weights under the Apache 2 license. Simon Willison
    reports tool calling and vision working locally from a 17GB Q4_K_M quantized LM Studio
    build, and reports that the xhigh reasoning default over-thinks, with 21 minutes and 22,276
    reasoning tokens spent on one SVG and a request for a circle answered with an animated
    geometric study. He measures 15 to 30 tokens per second and writes that performance is
    the only thing holding the model back from being a daily driver, and that it will be hard
    to win him away from hosted API models. The same post reports a throughput gain of roughly
    72 percent from running with Multi-Token Prediction under `llama serve --spec-type draft-mtp`,
    benchmarked against the LM Studio default GGUF.
  why: >-
    An Apache 2 model with working tool calling and vision runs on hardware engineers already
    own, and the throughput reported without Multi-Token Prediction is what keeps it short
    of replacing a hosted API for agent work.
  sources:
  - label: Simon Willison
    url: https://simonwillison.net/2026/Aug/16/qwen-38-27b/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49324985
- title: >-
    Vero reports the strongest coding agent fully solves 27 of 43 repository-level verification
    tasks
  section: ML research
  category: Paper
  status: confirmed
  blurb: >-
    Vero is a repository-level verification benchmark where the strongest coding agent fully
    solves 27 of 43 tasks and closes nothing on the hardest.
  summary: >-
    Vero is a benchmark of repository-level verification tasks, where an agent must produce
    code and machine-checked proofs across modules rather than for a single function. The
    paper reports that the strongest coding agent fully solves 27 of the 43 tasks, and that
    on the hardest repositories the strongest configuration closes no specifications at all.
  why: >-
    Function-level verified-code benchmarks do not show whether an agent can keep implementation
    and proof choices coherent across modules, and at repository scale the strongest configuration
    closes no specifications at all on the hardest repositories.
  sources:
  - label: arXiv 2608.13522, submitted 2026-08-13
    url: https://arxiv.org/abs/2608.13522
- title: >-
    CISA-ADP score and press coverage disagree on severity for the exploited macOS Screen
    Sharing bypass
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    CISA-ADP scores the exploited macOS Screen Sharing bypass 9.8 critical with fully remote
    no-interaction vector, while press coverage reports 7.1.
  summary: >-
    The 2026-08-15 digest led with NCSC-NL's report of active exploitation of CVE-2026-65400,
    the macOS Screen Sharing authentication bypass, and this entry carries only what is new
    against it. The CISA-ADP entry in NVD scores the flaw 9.8 critical with a fully remote
    no-interaction vector, the Ars Technica report of 2026-08-14 gives 7.1, and NVD has published
    no base score of its own. CISA-ADP replaced its own vector on 2026-08-14, removing a vector
    that required local privileges and scored partial integrity impact and no availability
    impact, and adding the fully remote 9.8 vector, so the scorer revised itself upward on
    the same date the press figure was published. The NVD record was modified 2026-08-17,
    and its SSVC entry still reads exploitation none as of that date. NVD lists affected macOS
    14.0 up to 14.8.9, 15.0 up to 15.7.9, and 26.0 up to 26.6.1, fixed in Sonoma 14.8.9, Sequoia
    15.7.9, and Tahoe 26.6.1.
  why: >-
    The same patched and actively exploited remote bypass reads as high or as critical depending
    on whether a triage process takes the CISA-ADP score or the severity given in press coverage.
  followup: >-
    Track whether NVD publishes its own base score and corrects the exploitation status.
  sources:
  - label: NVD
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-65400
  - label: Ars Technica
    url: https://arstechnica.com/security/2026/08/vulnerability-giving-attackers-full-control-of-macs-is-under-active-exploitation/
  - label: Apple advisory 148170
    url: https://support.apple.com/en-us/148170
  - label: Apple advisory 148171
    url: https://support.apple.com/en-us/148171
  - label: Apple advisory 148172
    url: https://support.apple.com/en-us/148172
- title: >-
    A Copilot Autofix commit introduced the GitHub Actions injection that an autonomous agent
    used to reach Snowflake's Jira
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Wiz reports Copilot Autofix removed an input-handling pattern to prevent injection, and
    nothing in review caught the replacement was exploitable.
  summary: >-
    Wiz Research reports that an autonomous agent it operates found a shell-injection flaw
    in a GitHub Actions workflow in a Snowflake repository, and that the flaw was introduced
    by a GitHub Copilot Autofix commit which replaced an input-handling pattern that existed
    to prevent injection. Wiz reports the injection was reachable by any user who could open
    an issue, and that the disclosed chain reached read access to Snowflake's internal Jira.
    Wiz reports Snowflake patched the workflow on 2026-06-23 and rotated credentials on 2026-06-24.
    This is vendor research from a company selling the agent product, so only the disclosed
    chain and Snowflake's own confirming statement are carried here.
  why: >-
    An AI autofix removed an input-handling pattern that existed specifically to stop shell
    injection, and nothing in the review path caught that the replacement was exploitable
    by any user who could open an issue.
  followup: >-
    Track whether GitHub documents a change to Copilot Autofix behaviour on shell-interpolation
    patterns.
  sources:
  - label: Wiz Research
    url: https://www.wiz.io/blog/red-agent-snowflake-copilot-cicd-bug
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49331423
