- title: >-
    Argo CD 3.6.3 fixes seven advisories, including an unauthenticated request that crashes
    the API server
  section: Top stories
  category: Security
  blurb: >-
    Seven advisories, four rated high, include an unauthenticated request that crashes the
    API server and repo upserts that skip permission checks.
  summary: >-
    Argo CD 3.6.3, released 2026-11-24, fixes seven advisories. The four rated high are a
    repository create with upsert that overwrites existing repositories without the update
    permission, a single unauthenticated request that crashes the API server, stored XSS through
    a Helm chart home link, and an ApplicationSet delete API that ignores the allowed namespaces.
    The moderate ones include a Bitbucket Cloud webhook that sends stored repository credentials
    to a host taken from the payload, Helm release names evaluated as templates that leak
    repo-server environment variables, and a world-readable generated Dex config holding SSO
    secrets.
  why: >-
    Argo CD clusters should upgrade soon, and Applications with templated or invalid Helm
    release names will fail manifest generation after the upgrade.
  background: >-
    Argo CD is a GitOps controller for Kubernetes. It keeps cluster state in sync with manifests
    in Git, and its API server and web UI hold repository credentials and SSO configuration.
    That makes the API server a sensitive component even when only operators can reach it.
    The repo-server renders Helm charts and other manifests, so anything that evaluates user
    input as a template there can expose its environment.
  comments: >-
    The release marks one change as potentially breaking. Helm release names, including those
    set in .argocd-source.yaml, now pass to Helm literally. They must be valid release names
    of at most 53 characters.
  event: argo-cd-3-6-3-security-release
  sources:
  - label: primary
    url: https://github.com/argoproj/argo-cd/releases/tag/v3.6.3
- title: >-
    1Password says an attacker used an employee's GitHub account to push backend code that
    copied customer account data
  section: Top stories
  category: Security
  blurb: >-
    An attacker took over a 1Password employee's GitHub account, reached CI/CD, and shipped
    backend code that copied customer names and emails.
  summary: >-
    1Password began investigating on 2026-11-19 after an attacker gained access to an employee's
    corporate GitHub account, read source code, reached the CI/CD system and pushed malicious
    code to backend services that downloaded account records for a subset of users. The records
    include names, email addresses, account identifiers, public keys, SRP parameters and tokens
    from invitation, provisioning and recovery emails, while vault contents and keys were
    not accessed. 1Password revoked the stolen token, rotated internal credentials and lengthened
    the codes in invitation and recovery emails from six digits to ten alphanumeric characters.
  why: >-
    Expect targeted phishing about 1Password invitations or recovery, and treat one developer's
    GitHub account as a direct path to production deploys in your own threat model.
  background: >-
    1Password encrypts vault data on the client with keys derived from the account password
    and a separate Secret Key, so a server breach does not expose vault items. Sign-in uses
    the Secure Remote Password protocol, in which the server stores a verifier and parameters
    instead of the password, so leaked SRP parameters alone do not unlock an account. The
    exposed metadata still helps attackers craft convincing phishing that names real accounts
    and sign-in addresses.
  comments: >-
    The Hacker News thread drew 432 points and 192 comments within hours of the post.
  event: 1password-github-account-backend-breach-2026-11
  sources:
  - label: primary
    url: https://1password.com/blog/update-on-nov-2026-security-incident
  - label: discussion
    url: https://news.ycombinator.com/item?id=50644817
- title: >-
    Anthropic moves its Messages API from Python to Rust, cutting CPU per request about 70%
  section: Top stories
  category: Engineering post
  blurb: >-
    Anthropic shadowed live traffic and had Claude agents fix diffs grouped by fingerprint
    to move the Messages API from Python to Rust.
  summary: >-
    Anthropic migrated the Messages API, which serves customers and its own apps such as Claude
    Code, from Python to Rust, and reports about 70% less CPU per request and about 20% lower
    median time to first token without taking the service offline. The Rust version passed
    about 98% of roughly 700 integration tests in April while only about a quarter of production
    inputs matched, and an audit of ported tests found over 100 weakened assertions. Anthropic
    replayed one model output to both versions, compared each step at checkpoints, recorded
    only the position and size of each difference, and had a coordinating Claude agent dispatch
    worker agents to reproduce and fix each new fingerprint, with engineers reviewing every
    fix before deployment.
  why: >-
    For a large rewrite of a live service, production shadowing with privacy-preserving diff
    fingerprints can serve as the verifier where a test suite cannot.
  background: >-
    Shadowing sends the same production request through old and new code and compares results,
    a standard way to validate rewrites, but common tools assume requests are safe to run
    twice and outputs are deterministic. LLM replies are nondeterministic and requests are
    billed, so Anthropic ran the model once and fed the same output to both versions. An earlier
    partial rewrite of only the output parser in Rust saved 8% to 10% of CPU but made each
    token cross the Python and Rust boundary three times.
  event: anthropic-messages-api-rust-migration
  sources:
  - label: primary
    url: https://www.anthropic.com/research/migrating-api-to-rust
  - label: discussion
    url: https://newsletter.pragmaticengineer.com/p/how-anthropic-builds-software-in
- title: >-
    Fake recruiters AccuraSoftHire and HuntRole run malware through npm look-alikes and a
    VS Code extension
  section: Security
  category: Security
  blurb: >-
    Fake recruiters' take-home tests load malware via look-alike Tailwind npm packages and
    a VS Code extension, and the operator is still active.
  summary: >-
    StepSecurity found that look-alike Tailwind plugins used in AccuraSoftHire's take-home
    test stayed on npm for up to 211 days. The loader runs at CSS build time, not during npm
    install, and reads its server address from an Ethereum wallet whose 609 transactions name
    eight servers. A 2026-11-24 update ties a second front, HuntRole, to the same operator
    through shared funding and servers. HuntRole's assessment used the VS Code Marketplace
    extension huntrole.assessment-tool, and its wallet posted a new server address on 2026-11-24.
  why: >-
    Developer laptops need checks for these npm packages, for .vscode/tasks.json files that
    run on folder open, and for the huntrole.assessment-tool extension, and any credential
    on an affected machine should count as stolen.
  background: >-
    Fake job interviews are a known North Korea-linked tactic. Binance says its 2026-10-29
    theft began when an engineer ran an interview assignment on his work computer. Loaders
    that read their next server from blockchain transactions let attackers change infrastructure
    without republishing a package, so blocklists built from one sample go stale.
  event: accurasofthire-huntrole-fake-interview-campaign
  sources:
  - label: primary
    url: https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines
- title: >-
    GitHub outage degrades Git operations, Actions, pull requests, Packages and Pages for
