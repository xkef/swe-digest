- title: >-
    OpenAI preprint claims the matrix multiplication exponent is exactly 9/4, drawing 629
    points on Hacker News
  section: Hacker News
  category: Pulse
  blurb: >-
    An OpenAI preprint claims the matrix multiplication exponent is exactly 9/4 over every
    field, which would refute the long-held hope that it is 2.
  summary: >-
    OpenAI posted a preprint in its openai/math repository, dated 2026-11-24, titled The matrix
    multiplication exponent is nine fourths. The Hacker News thread reached 629 points and
    333 comments, and Lobsters also carried it. Commenters say the paper is one of four new
    OpenAI preprints, built on a shared framework, that claim results on strongly polynomial
    linear programming, simplex pivot rules and the sunflower conjecture.
  why: >-
    If the result holds, the asymptotic exponent of matrix multiplication is settled, ending
    the search for algorithms that approach O(n^2).
  background: >-
    The exponent omega is the smallest number such that two n by n matrices can be multiplied
    with about n^omega arithmetic operations. Strassen's 1969 algorithm first beat the cubic
    bound. Later work pushed the upper bound down toward 2.37, and many researchers expected
    omega to equal 2.
  comments: >-
    Commenters argue over whether this wave of AI-produced proofs reflects real capability
    or brute-force search across many agents. Several correct a misreading: the paper is a
    lower bound result showing optimality, not a new practical algorithm. Others note the
    bound counts arithmetic operations, not wall-clock time.
  event: openai-matrix-multiplication-exponent-9-4
  sources:
  - label: primary
    url: https://github.com/openai/math/blob/main/preprints/The-matrix-multiplication-exponent-is-nine-fourths-November-24-2026/paper.pdf
  - label: discussion
    url: https://news.ycombinator.com/item?id=50637220
- title: >-
    Google posts Cogentic papers on unconditional L[1/3] factoring and discrete logs as Hacker
    News weighs crypto rumors
  section: Hacker News
  category: Pulse
  blurb: >-
    Google Research uploaded AI-produced papers on factoring and discrete logs, and two Hacker
    News threads debated what labs may hold back.
  summary: >-
    Google Research added papers produced by its Cogentic system to the google-research repository
    on 2026-11-25, including unconditional integer factorization in time L_N[1/3, O(1)], discrete
    logarithms in finite fields of fixed characteristic in sub-quasi-polynomial time, and
    unconditional deterministic subexponential factoring. The Hacker News thread drew 355
    points and 268 comments, and a related thread about rumors that labs have factoring in
    P drew 307 points and 214 comments. Scott Aaronson wrote on 2026-11-25 that he is virtually
    certain from multiple sources that AI labs hold results that will break deployed cryptosystems,
    but has not seen details.
  why: >-
    None of the posted results breaks RSA in practice, but the discussion is a prompt to inventory
    where RSA still anchors identity in your PKI.
  background: >-
    L-notation measures subexponential running time, with L_N[1/3] being the class of the
    number field sieve, the fastest known classical factoring method, whose L[1/3] running
    time had rested on unproven heuristics. Rigorous bounds were previously weaker, around
    L[1/2], so an unconditional L[1/3] result is a theory milestone rather than a faster attack.
    Polynomial-time factoring would break RSA directly, which is what the rumors are about.
  comments: >-
    Commenters note that TLS handshakes largely moved to ECDHE but identity layers still default
    to RSA, citing kubeadm generating RSA-2048 cluster certificates with a 10-year CA unless
    configured otherwise, and similar defaults in cert-manager and Istio. Others argue post-quantum
    schemes are newer and not obviously safer against algorithmic advances, and that polynomial
    time does not mean practical, citing AKS primality testing.
  event: google-cogentic-factoring-papers
