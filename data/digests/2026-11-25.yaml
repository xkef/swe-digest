  blurb: >-
    High database load degraded Git operations, Actions, Issues, pull requests, Packages,
    Pages, webhooks and the API on GitHub for about an hour.
  summary: >-
    GitHub opened the incident at 15:55 UTC on 2026-11-25 for Actions and Webhooks, and it
    spread to Git operations, API requests, Issues, Pull Requests, Packages and Pages. GitHub
    attributed the failures to high database load, said it updated its database load distribution,
    and marked the incident resolved at 16:52 UTC. It promised a detailed root cause analysis.
  why: >-
