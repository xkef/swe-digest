- title: >-
    APM 0.39.0 enforces blocking org policy on installs, requires exact refs and parks untrusted
    transitive MCP servers
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Microsoft's Agent Package Manager now verifies checkouts against commits, gates transitive
    MCP servers by policy, and installs up to 2.4x faster.
  summary: >-
    APM 0.39.0 verifies checkouts against their commit objects, allow-lists cached git config,
    requires dependency refs to match an origin branch or tag exactly, and resolves helper
    tools such as git only from PATH directories outside the project. Blocking org policy
    now refuses installs that violate manifest.scripts deny, unmanaged_files deny or dependencies.max_depth,
    and transitive MCP servers need an mcp.allow entry unless mcp.trust_transitive is true.
    Fresh installs of 50 packages run 2.4x faster than 0.38.1 on Linux and macOS, and interrupted
    installs restore the files they changed.
  why: >-
    Teams pinning agent skills and MCP servers through APM should check org policies and re-approve
    trusted transitive MCP servers before the first 0.39 install removes them.
  event: apm-0-39-0-release
  sources:
  - label: primary
    url: https://github.com/microsoft/apm/releases/tag/v0.39.0
- title: >-
    Paper: maximum likelihood on archived RL rollouts, replayed in order, recovers online
    RL performance
  section: ML research
  category: Paper
  blurb: >-
    Maximum likelihood on archived RL rollouts, replayed in order without filtering by correctness,
    tracks the learning curve of online RL.
  summary: >-
    Replaying the original RL algorithm on archived rollouts collapses. Maximum likelihood
    on the same rollouts, in the order they were generated and without separating correct
    from incorrect responses, recovers online RL performance from the same base model. One
    maximum likelihood update per rollout batch closely tracks the whole online learning curve,
    and training on the last few steps' rollouts often recovers the final model's performance.
  why: >-
    The result suggests that RL post-training compute mostly goes into finding a better sampling
    distribution, and that archived rollouts may be enough to reproduce or transfer a run
    cheaply.
  background: >-
    In RL post-training of language models, such as RLVR with GRPO, the model generates rollouts,
    a verifier scores them, and the policy is updated, after which the rollouts are usually
    thrown away. Off-policy replay of stale samples is known to destabilize policy-gradient
    methods. Supervised maximum likelihood on a model's own samples resembles rejection-sampling
    fine-tuning, except here nothing is filtered.
  event: rl-rollout-replay-maximum-likelihood-paper
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.33102v1
- title: >-
    Rust Foundation scans every new crate with a decision model, and a 0.9 score flags only
    real malware so far
  section: Languages and runtimes
  category: Languages
  blurb: >-
    A decision model scored 135,548 crates.io files for malice, and at a 0.9 cutoff it flagged
    four crates, all of them true malware.
  summary: >-
    The Rust Foundation is scoring every crate published in November and December from 0 to
    1 for malicious intent and sending high scorers to human review, with no automated takedowns.
    Of 135,548 crate files from 2026-11-11 to 2026-11-21, a 0.35 threshold flagged 332 with
    4 true positives. A 0.7 threshold flagged 15 with 4 true positives, and 0.9 flagged exactly
    those 4. The model over-scores crates with large embedded non-source data, and that habit
    surfaced crates shipping opaque bytecode or downloading binaries.
  why: >-
    Rust users get a new malware screen on crates.io, though the Foundation says false negatives
    cannot be measured yet and will be reviewed in January.
  background: >-
    Decision models answer from a fixed set of choices or return a score rather than free
    text, which makes them cheaper and faster than chat LLMs for bulk classification. Registries
    such as crates.io, npm and PyPI have mostly relied on third-party reports to find malicious
    packages, which can leave rarely used ones up for months.
  followup: >-
    A false negative review in January 2027, and the outcome of crates.io RFC 4016 on registry
    withholding, now in final comment period.
  event: rust-foundation-crate-malware-decision-model
  sources:
  - label: primary
    url: https://rustfoundation.org/media/needles-haystacks-and-numbers-between-0-and-1/
- title: >-
    Rust's next trait solver will land in Rust 1.102.0 after performance work removed quadratic
    slowdowns
  section: Languages and runtimes
  category: Languages
  blurb: >-
    A rustc developer explains how the replacement trait solver works and how caching and
    fast paths fixed cases that compiled 200 times slower.
  summary: >-
    Jana Dönszelmann writes that the next trait solver, the project started in October 2022
    to replace rustc's old solver and fix long-standing soundness bugs, will land in Rust
    1.102.0, with performance as the last major blocker. One example: in unic-ucd, the new
    solver unified lifetime variables during borrow checking and rolled them back by copying,
    which made a long constant table quadratic and the crate 200 times slower to compile than
    with the old solver. The post, a writeup of a EuroRust 2026 talk, covers how the solver
    caches results and skips the cache for trivial goals such as i32: Sized.
  why: >-
    Crates with heavy trait or type-level code may see compile times shift in either direction
    when 1.102.0 ships, so measure builds on nightly before then.
  background: >-
    A trait solver answers whether a type satisfies a trait bound by searching impl blocks,
    where clauses and compiler built-ins, recursively creating subgoals much like a Prolog
    engine. Because impls with associated types act as functions, the trait system is Turing
    complete and a single query can do unbounded work. The Chalk project, started in 2015,
    explored a logic-programming formulation and was retired in favor of the in-compiler next-generation
    solver.
  followup: >-
    The Rust 1.102.0 release and reports of compile time regressions or new errors from the
    new solver.
  event: rustc-next-trait-solver-stabilization
  sources:
  - label: primary
    url: https://donsz.nl/blog/optimizing-rustcs-next-trait-solver
  thread: f-0249
- title: >-
    Case folding in case-insensitive APFS lets names like noAcceß.config overwrite protected
    files past naive checks
  section: Apple platforms
  category: Apple
  blurb: >-
    Installers that compare file names byte by byte miss that APFS treats ß and ss, or ligatures
    and their letters, as the same name.
  summary: >-
    Howard Oakley explains that case-insensitive APFS normalises Unicode names and applies
    case fold mapping before hashing them, so strasse and straße, or the fl ligature and fl,
    name the same file. Recently reported vulnerabilities in third-party installers come from
    checking paths against a protected list with simple string matching, so a package file
    named noAcceß.config passes the check and then replaces noAccess.config on disk.
  why: >-
    Any Mac tool that guards paths by string comparison must normalise and case fold the same
    way APFS does, or use file system calls to compare names.
  background: >-
    Unicode can encode the same visible character in more than one way, so file systems normalise
    names to one form. Case-insensitive file systems also fold case, and Unicode case folding
    maps some characters to several letters, such as ß to ss. Most Mac APFS volumes are case-insensitive,
    while iOS runs case-sensitive.
  event: apfs-case-folding-installer-vulnerabilities
  sources:
  - label: primary
    url: https://eclecticlight.co/2026/11/24/how-normalisation-and-case-folding-in-apfs-led-to-vulnerabilities/
- title: >-
    CloudNativePG 1.31.0-rc1 revokes CONNECT from PUBLIC, defaults to PostgreSQL 19 and bootstraps
    in init containers
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The CloudNativePG 1.31 release candidate locks down new databases, drops the smart shutdown
    wait, and swaps bootstrap Jobs for init containers.
  summary: >-
    CloudNativePG 1.31.0-rc1 revokes CONNECT from PUBLIC on databases it creates, disables
    automountServiceAccountToken on instance Pods, changes the default smartShutdownTimeout
    from 180 to 0 seconds, and bootstraps new instances in an init container instead of a
    separate Job. It adds PostgreSQL 19 support with 19.0-system-trixie as the default image
    for new clusters, OTLP log export without a DaemonSet, in-place Pod resource resizing
    on Kubernetes 1.33 or later, failure-domain-aware synchronous replicas, and declarative
    database and schema privileges. Failover now builds on the primary Lease, including detection
    and fencing of replicas that diverged from the primary's timeline.
  why: >-
    Managed roles that are not database owners will need an explicit CONNECT grant on new
    databases, and tooling that watches bootstrap Jobs must change before upgrading.
  background: >-
    CloudNativePG is a Kubernetes operator that runs PostgreSQL clusters as Pods with streaming
    replication and handles failover itself rather than through an external tool like Patroni.
    Version 1.30.0 introduced a primary Lease, a Kubernetes coordination object that the primary
    must keep renewing, and 1.31 moves isolation checks and switchover coordination onto it.
    Smart shutdown waits for every client to disconnect, which with long-lived pooler connections
    can stall node drains.
  thread: f-0241
  event: cloudnative-pg-1-31-0-rc1
  sources:
  - label: primary
    url: https://github.com/cloudnative-pg/cloudnative-pg/releases/tag/v1.31.0-rc1
- title: >-
    Antithesis's Amnesia FUSE filesystem injects power loss and fsync EIO, and finds a bbolt
    bug that breaks etcd
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A Rust FUSE layer emulates the page cache so tests can drop unsynced writes, fail fsync
    like fsyncgate, and reorder or tear I/O.
  summary: >-
    Antithesis replaced a patched LazyFS with Amnesia, a Rust FUSE filesystem that tracks
    inodes and keeps volatile and durable state in memory, so it can forget unsynced data
    at an emulated power failure. It also returns EIO on fsync while marking pages clean,
    splits and reorders reads and writes, and fires faults before, during or after each syscall.
    It found a bbolt case where an EIO on the meta page fsync, then a restart that read the
    cached meta page, let later commits reuse live pages so bbolt panics on every open.
  why: >-
    Storage code that retries a failed fsync or trusts page cache contents after a crash can
    corrupt data, and this shows a concrete way to test for it.
  background: >-
    Writes land in the kernel page cache and reach disk later through writeback, and fsync
    forces them out. In the 2018 fsyncgate case, PostgreSQL learned that Linux marks pages
    clean after a failed fsync, so a retried fsync can succeed while the data never reaches
    disk. A process kill keeps the page cache, so only an emulated power loss tests what fsync
    actually persisted.
  event: antithesis-amnesia-disk-fault-injection
  sources:
  - label: primary
    url: https://antithesis.com/blog/2026/nightmare-mode/
- title: >-
    Rocq proofs of the CHERIoT switcher find two isolation bugs, including stack frame leaks
    via the high watermark
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Aarhus's Griotte project verified CHERIoT's compartment switcher in Iris and Rocq, and
    the stuck proofs exposed two bugs now fixed upstream.
  summary: >-
    The Griotte project proved compartment isolation and no-capture for the CHERIoT switcher
    with separation logic and a logical relation for unknown code, in Iris on Rocq. Extending
    the model found that a malicious caller could push the stack high watermark below the
    stack base, fault the return path and read the callee's stack frame, fixed in PR 799,
    and that a malicious scheduler could revive an exited thread with stale capabilities,
    fixed in PR 769. The proofs now run against the full cheriot-sail ISA, with the loader
    still trusted.
  why: >-
    It shows formal proofs catching real exploitable bugs in the optimisations and exception
    paths that tests and reviewers tend to skip.
  background: >-
    CHERI hardware replaces raw pointers with capabilities that carry bounds and permissions,
    and CHERIoT applies it to microcontrollers. Compartments call each other through a trusted
    switcher that must clear state so one compartment cannot keep another's capabilities.
    The stack high watermark is a hardware register that lets the switcher clear only the
    part of the stack that was used.
  event: cheriot-griotte-switcher-verification
  sources:
  - label: primary
    url: https://cheriot.org/verification/2026/11/24/griotte-verification-effort.html
- title: >-
    Sentry traces 8x Control RPC autoscaling to an N-squared GitLab webhook lookup across
    2,000 shared installations
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Three GitLab integration bugs at Sentry turned one webhook into millions of cross-silo
    RPC calls and kept an autoscaler at 256 pods.
  summary: >-
    Sentry's Control RPC deployment sat at its 256-pod ceiling for hours while external traffic
    had only doubled. A four-year-old bug grouped every group-less gitlab.com installation
    under one shared Integration record with over 2,000 installations, a September webhook
    backfill fix enabled assignment webhooks on all of them, and the assignment sync path
    looked up installations per installation, each lookup an RPC from a Region silo to Control.
    The fix cut the weekly average from about 150 pods to about 42, and Sentry also found
    that a P95 busyness scaling target never fell as pods were added.
  why: >-
    Break internal RPC volume down by method, because flat totals hid a 10x rise in one call,
    and check that each autoscaler metric actually drops when pods are added.
  background: >-
    Sentry splits its service into Region silos that hold customer data and a single Control
    silo for globally unique data such as users and integrations, so region code reaches Control
    data only through RPC. KEDA scales Kubernetes workloads on external metrics and takes
    the most demanding of several targets, so one unsatisfiable metric pins the deployment
    at its maximum.
  event: sentry-gitlab-webhook-quadratic-rpc
  sources:
  - label: primary
    url: https://blog.sentry.io/quadratic-webhook-autoscaler-ceiling/
