- title: Git's --end-of-options and argument injection in package managers
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A writeup explains git's argument injection defense via `--end-of-options`, finding only
    Go's toolchain consistently applies it across managers.
  summary: >-
    A 2026-07-21 writeup explains git's `--end-of-options` flag (added in git 2.24.0 in 2019)
    and the argument-injection class it defends against (CWE-88). Because git overloaded `--`
    to separate revisions from pathspecs, a revision or ref argument that begins with a dash
    can be parsed as an option even when a wrapper calls `exec` directly with no shell involved,
    so an input like `--upload-pack=<cmd>` becomes a code-execution primitive. The author
    surveys 19 package managers that fork the git binary for dependency fetches and reports
    only Go's toolchain consistently passes `--end-of-options`, with most others adding `--`
    or input validation reactively after CVEs rather than proactively.
  why: >-
    Package managers that fork git on untrusted refs are a broad supply-chain surface, and
    the post names a concrete proactive mitigation that most tools still do not apply.
  sources:
  - label: nesbitt.io writeup
    url: https://nesbitt.io/2026/07/21/end-of-options.html
  - label: HN 48991882
    url: https://news.ycombinator.com/item?id=48991882
- title: 'Report: five US tech giants carry $1.65T in off-balance-sheet AI debt'
  section: Markets and companies
  category: Markets
  blurb: >-
    Nikkei Asia reports Alphabet, Amazon, Meta, Microsoft, and Oracle carry $1.65 trillion
    in off-balance-sheet AI-infrastructure debt through SPVs.
  summary: >-
    An analysis reported by Nikkei Asia estimates that Alphabet, Amazon, Meta, Microsoft,
    and Oracle together carry about $1.65 trillion in AI-infrastructure debt held off their
    balance sheets, more than the roughly $1.35 trillion of debt they report directly. The
    structures are special-purpose vehicles that borrow the money and own the datacenter assets
    while the tech company signs long-term lease or capacity contracts, so the SPV's debt
    does not appear on the tenant's books. Cited examples include Meta's roughly $420 billion
    of off-balance-sheet obligations and the Hyperion datacenter in Louisiana, where Meta
    and Blue Owl Capital co-funded an entity that took on $27 billion of debt with Meta as
    sole tenant. The structures are legal, and coverage draws an Enron comparison for the
    accounting technique.
  why: >-
    The financing behind the datacenter buildout sets compute capacity and pricing that every
    AI-dependent engineering team relies on, and hidden leverage raises the risk of a sharper
    capacity or cost correction. It extends the AI-infrastructure-financing thread alongside
    the Oracle credit downgrade.
  followup: >-
    Watch for regulatory or auditor scrutiny of the SPV structures and any effect on datacenter
    buildout pace.
  thread: f-0110
