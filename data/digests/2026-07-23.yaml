- title: Cruller forks Bun's final Zig runtime after the Rust rewrite
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Cruller forked Bun's last Zig runtime and updated it to Zig 0.16.0, keeping production
    features while stripping dev tooling for a smaller binary.
  summary: >-
    A developer (solenopsys) published Cruller, a JavaScript runtime forked from Bun's last
    Zig-based release (1.3.14) and updated to build on Zig 0.16.0, after Bun's team moved
    its runtime to Rust. Cruller keeps the production surface (JavaScriptCore, HTTP serving,
