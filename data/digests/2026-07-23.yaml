- title: Coding-agent CLI sandboxes escaped through the Docker socket
  section: Top stories
  category: Agentic coding
  blurb: >-
    Pillar Security disclosed sandbox escapes in Cursor, Codex, and Gemini CLI via the Docker
    socket, allowing writes to files outside the workspace.
  summary: >-
    Pillar Security published on 2026-07-20 a sandbox-escape technique against coding-agent
    CLIs (Cursor, Codex, Gemini CLI, Antigravity). Deny-default sandbox profiles block file
    writes outside the workspace but still allow process execution and reading the Docker
    Desktop socket. An agent (or injected instruction) can `curl` an Alpine rootfs into the
    workspace, `docker import` it to bypass registry restrictions, run a `--privileged` container,
    mount the host filesystem over VirtioFS, and write to files like `.zshrc`, reaching SSH
    keys and credentials outside the sandbox. Cursor shipped a fix restricting Docker-socket
    and Launch Services access (GHSA-v4xv-rqh3-w9mc). Codex marked it informational and configuration-dependent,
    and Gemini CLI declined to fix, citing documentation.
  why: >-
    It shows agent sandboxes cannot contain what a privileged local daemon does on the agent's
    behalf, so a Docker install undercuts the sandbox that coding agents rely on for autonomous
    execution.
  followup: >-
    Watch for Codex and Gemini CLI mitigations and whether other agents that read the Docker
    socket are affected.
  thread: f-0024
  sources:
