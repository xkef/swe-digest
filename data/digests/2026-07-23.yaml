- title: White House accuses Moonshot of distilling Anthropic's Fable to build Kimi K3
  section: Top stories
  category: AI
  blurb: >-
    White House accused Moonshot of distilling Fable to build Kimi K3, escalating US-China
    AI tensions into policy and possible-sanctions tracks.
  summary: >-
    White House Office of Science and Technology Policy director Michael Kratsios publicly
    accused Chinese lab Moonshot AI on 2026-07-22 of covertly distilling Anthropic's Fable
    model to build Kimi K3. He stated his office has information that Moonshot ran the copying
    through a purpose-built internal system and rotated access routes to stay hidden, and
    separately alleged access to export-restricted Nvidia chips. Distillation, feeding a stronger
    model's outputs to train a weaker one, is common when done openly at small scale, but
    the accusation is of covert industrial-scale copying. Anthropic said in February it traced
    3.4 million Claude exchanges to the startup. No penalties have been announced and Moonshot
    has not responded.
  why: >-
    The accusation escalates the US-China frontier-model dispute into a policy and possible-sanctions
    track that could affect access to Chinese open weights the ecosystem now depends on.
  followup: >-
    Watch for any Treasury action, a Moonshot response, and whether the full Kimi K3 weight
    release (promised by 2026-07-27) proceeds. See the Kimi K3 follow-up below.
