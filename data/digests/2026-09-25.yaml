- title: Cloudflare fixes a cross-tenant data exposure in Containers
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Cloudflare fixed a Containers flaw that handed new tenants unzeroed 64 KiB disk blocks
    holding other customers' data.
  summary: >-
    Cloudflare reports that a Workers Paid account could read residual disk blocks left behind
    by other customers' Containers, including directory structures, database pages, and structurally
    complete SQLite databases, because the dm-thin pool ran with `skip_block_zeroing` and
    handed reused 64 KiB blocks to a new tenant unzeroed. Cloudflare reviewed retained disk-I/O
    telemetry against detection signatures built from the proof of concept and attributed
    every match to the researchers and its own engineers, finding no other exploitation. Beyond
    the configuration change it retired all running container disks and cleared each host's
    cached dm-thin image snapshots fleet-wide, because zeroing new allocations does not sanitize
    mappings already present, and Cloudflare Sandboxes, which is built on Containers, was
    in scope. Cloudflare bounds the technique: it could not be aimed at a particular customer,
    workload, host or data, it could not reach an actively attached disk, and residual data
    was not guaranteed to be present in a reused block.
  why: >-
    Block reuse without zeroing breaks the isolation that every multi-tenant container platform
    sells, and the exposed material was complete enough to read as databases rather than as
    fragments.
  followup: >-
    Track whether Cloudflare publishes the exposure window and any customer notification scope.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/containers-cross-tenant-vulnerability/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49831647
- title: Two compromised GitHub Actions were re-enabled with their malicious tags intact
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Two GitHub Actions disabled in May for compromise ran again from 2026-09-16 until both
    were disabled again on 2026-09-25.
  summary: >-
    Socket reports that two GitHub Actions repositories disabled in May over a compromise
    had access restored, which reactivated a months-old payload with no new attacker action.
    The dependency graph lists about 15,000 dependents for `issues-helper` alone. Socket's
    update dated 2026-09-25 states that `actions-cool/issues-helper` and `actions-cool/maintain-one-comment`
    have been disabled on GitHub again, so workflows referencing them now fail at job setup
    instead of running the payload.
  why: >-
    A platform decision rather than an attack re-armed a supply-chain compromise for a window
    running 2026-09-16 to 2026-09-25, so a workflow that referenced either action by tag and
    ran a job inside that window executed the payload with the job token and needs every secret
    it could reach rotated, while a workflow with no job run in the window did not execute
    it.
  followup: >-
    Track whether the malicious tags are removed, and whether a fuller dependent count is
    published.
  sources:
  - label: primary
    url: https://socket.dev/blog/mini-shai-hulud-actions
  - label: discussion
    url: https://news.ycombinator.com/item?id=49837177
- title: >-
    File-notification APIs leak user and application behaviour on four operating systems
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    File-notification APIs let a local app watch another's activity on Linux, Android, Windows,
    and macOS, with only Linux partly fixed.
  summary: >-
    The researchers report that read permission on a directory is enough to recover keystroke
    timing from `/dev/input` or `/dev/pts`, to watch another application's private WhatsApp
    media folder on Android, and to identify which sites another Windows user visits. Linux
    carries a partial mitigation as CVE-2025-68788 in 5.10.248, 5.15.198, 6.1.160, 6.6.120,
    6.12.65, and 6.18.3. The Windows registry mitigation ships disabled by default, and Android
    and macOS have none.
  why: >-
    The side channel needs only read permission on a directory, so sandboxing and per-app
    storage separation do not bound it on three of the four systems.
  followup: >-
    Track an Android or macOS mitigation, whether Microsoft enables the registry setting by
    default, and whether the Linux fix moves from partial to complete.
  sources:
  - label: primary
    url: https://inoti.fyi/
  - label: LWN
    url: https://lwn.net/Articles/1096431/
  - label: report
    url: https://www.theregister.com/security/2026/09/24/decades-old-file-security-flaws-found-in-android-linux-macos-and-windows/5298672
  - label: discussion
    url: https://news.ycombinator.com/item?id=49835649
