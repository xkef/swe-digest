- title: Automated C-to-Rust tools cut unsafe blocks without removing the memory bugs
  section: ML research
  category: Paper
  status: confirmed
  blurb: >-
    A study of 464 machine-translated Rust programs found 177 inherited the C memory bugs
    and 77 new Rust bugs appeared.
  summary: >-
    The paper runs C2Rust-analyze, CROWN, C2SaferRust, and FLOURINE over 116 buggy C programs
    from the NIST Juliet suite, producing 464 Rust programs. Of those, 342 failed to compile,
    177 inherited the original memory security bugs, and 77 new Rust bugs appeared.
  why: >-
    An unsafe-block count is the usual proxy for translation quality, and these numbers show
    it is not evidence that a translation improved memory security.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2609.25682
  - label: discussion
    url: https://news.ycombinator.com/item?id=49826801
- title: GitHub Copilot app adds per-project local sandboxing that fails closed
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    The GitHub Copilot app gained per-project local sandboxing that errors out rather than
    running an unenforceable policy.
  summary: >-
    GitHub added local sandboxing to the Copilot app, bounding filesystem, network, and git
    and GitHub CLI credential access per project. When the operating system cannot enforce
    the requested policy the app errors out rather than running unsandboxed. The feature is
    off by default, in public preview, and does not cover cloud or remote-host sessions.
  why: >-
    Failing closed on an unenforceable policy is the behaviour agent sandboxes have generally
    lacked, though the default-off preview scope limits who gets it today.
  followup: >-
