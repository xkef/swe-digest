- title: >-
    PHP stream wrapper sent Authorization and Cookie headers to the host a redirect pointed
    at
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    PHP patched a stream wrapper that forwarded Authorization and Cookie headers to whatever
    host a redirect pointed at.
  summary: >-
    Any application that calls `file_get_contents()` or `fopen()` on an `http://` stream with
    a credential header and leaves `follow_location` at its default sent that header to whatever
    host, port or downgraded scheme the redirect pointed at. CVE-2026-91766 is rated moderate
    at CVSS 5.9, affects PHP below 8.2.34, 8.3.35, 8.4.26 and 8.5.11, and is patched in those
    four releases, published 2026-09-24. The advisory states the fix records scheme, host
    and port for the current request, strips `authorization`, `cookie` and `proxy-authorization`
    on a cross-origin hop, and keeps them withheld on every later hop.
  why: >-
    Secrets carried in a header of your own, such as `X-Api-Key`, are not stripped, so those
    callers still have to set `follow_location` to 0 and follow the redirect themselves.
  sources:
  - label: advisory
    url: https://github.com/php/php-src/security/advisories/GHSA-fpwc-w8rq-cr92
  - label: writeup
    url: https://daubois.dev/blog/cve-2026-91766-php-http-redirect-credential-leak/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49832673
- title: SourceHut build logs allowed account takeover through an ansi2html XSS
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    An ansi2html XSS let anyone who could write to a SourceHut build log run script in every
    browser that viewed the job.
  summary: >-
    The report describes an XSS in ansi2html rendering of builds.sr.ht job logs, tracked as
    CVE-2026-92973 and fixed in ansi2html 1.9.4 and builds.sr.ht 0.105.1. Getting text into
    a build log was enough to trigger it, including by mailing a patch to a public list with
    CI enabled and without holding an account. The build log page carries the CSRF token in
    the DOM and builds.sr.ht holds deploy keys for sr.ht itself, and the author reasons from
    those two facts that a payload could reach both, while stating he did not build or run
    one. He states the flaw sat in builds.sr.ht for about four and a half years.
  why: >-
    Build log output is attacker-controlled text on any CI system that accepts outside patches,
    and rendering it as markup let a public mailing list post execute script in the browser
    of everyone who read the job.
  sources:
  - label: primary
    url: https://blog.arusekk.pl/posts/srht-account-takeover/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49835996
- title: macOS serial device nodes sit outside TCC, and Apple declined the report
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A researcher reports macOS serial device nodes are world-readable with no TCC prompt,
    and Apple declined the report.
  summary: >-
    Kevin Kessler published on 2026-09-24 that macOS creates the CDC-ACM device node `/dev/cu.usbmodem*`
    readable and writable by any process, with no TCC prompt and no entitlement. Chained with
    an HID keyboard interface on the same USB composite device, he reports a 24-second exfiltration
    of SSH keys, AWS, GCP, Azure and Kubernetes credentials, keychain metadata and environment
    secrets from an unlocked Mac with no consent sheet shown, tested on macOS 26.4.1 on Apple
    Silicon with roughly 20 dollars of parts. He separately reports that a composite device
    plugged into a previously approved hub enumerates on a locked Mac with Lockdown Mode on,
    because macOS does not re-prompt downstream of an approved hub, which makes a one-time
    hub approval a persistent enumeration exemption.
  why: >-
    Apple declined the report on 2026-05-20 as no identified security issue and left the 2026-05-21
    rebuttal unanswered for four months, so this researcher-reported credential-theft path
    over USB has no vendor fix pending and no CVE assigned.
  followup: >-
    Track the pending MITRE CNA-LR request for a CVE, and whether Apple reopens case OE11057041574014
    or extends TCC to serial device nodes.
  sources:
  - label: primary
    url: https://glyph.sh/posts/macos-cdc-acm-tcc-bypass/
  - label: discussion
    url: https://www.reddit.com/r/netsec/comments/1wplpp1/cdcacm_serial_interface_bypasses_tcc_on_macos/
- title: >-
    git-bug 0.11.0 ships a rewritten web UI, a code browser and a formal on-disk specification
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    git-bug 0.11.0 ships a rewritten web UI, a formal on-disk specification, and preservation
    of unknown operations.
  summary: >-
    The release arrives sixteen months and close to 300 commits after 0.10.1 and moves the
    distributed issue tracker from a viewer to something usable, with a rewritten web UI and
    a code browser, GoReleaser builds carrying a cosign-signed checksum file, an SBOM and
    a build provenance attestation, and macOS on Apple silicon back. Unknown operation types
    are now preserved and written back untouched instead of being silently destroyed by an
    older binary, and the on-disk format has a formal specification in its own repository
    covering the DAG entity format, identities and the bug entity, so a second implementation
    can be written against it. Breaking changes: the search index moved from bleve v1 to v2
    and rebuilds automatically on upgrade but cannot be downgraded without removing `.git/git-bug`,
    `go install` no longer produces a binary with a web UI, `git bug commands` is removed,
    `git bug webui --host` is now `--bind`, and the `linux/386` and `linux/s390x` artefacts
    are gone.
  why: >-
    Preserving unknown operations removes the compatibility hazard from every future addition
    to the data model, and a specified on-disk format is what a second implementation needs.
  sources:
  - label: release
    url: https://github.com/git-bug/git-bug/releases/tag/v0.11.0
  - label: specification
    url: https://github.com/git-bug/spec
  - label: discussion
    url: https://news.ycombinator.com/item?id=49843174
- title: Fearless SIMD reaches 1.0 with portable SIMD and no ad-hoc unsafe code
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Fearless SIMD 1.0 confines Rust SIMD unsafe code to one kernel macro and a small safe
    transmute module, with a three-year support commitment.
  summary: >-
    Linebender released Fearless SIMD 1.0. The crate confines memory safety review to a `kernel!`
    macro built on target feature v1.1 and a small safe transmute module, rather than the
    thousands of unsafe blocks other SIMD abstractions carry. It ships a `#[simd]` multiversioning
    macro as `fearless_simd_macros` 0.1 and commits to three years of security updates, with
    30 direct and over a thousand indirect dependents already.
  why: >-
    Portable SIMD in Rust has generally meant auditing unsafe intrinsic blocks per target,
    and this release moves that review surface into two reviewable places.
  sources:
  - label: primary
    url: https://linebender.org/blog/fearless-simd-1-0/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49800085
- title: Go 1.27 adds a portable SIMD package with emulation fallback
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Go 1.27 adds an experimental portable simd package that emulates missing operations where
    no hardware SIMD exists.
  summary: >-
    The Go blog post of 2026-09-24 by David Chase and Junyang Shao describes an experimental
    platform-independent `simd` package in Go 1.27, loosely based on Highway for C++, alongside
    the architecture-dependent `archsimd` package that Go 1.26 introduced for amd64 and that
    1.27 extends to arm64 NEON and wasm. The portable package removes fixed vector sizes from
    the type system, supports only the intersection of platform operations, and emulates the
    gaps, so code compiles and runs where there is no hardware SIMD at all. Both sit behind
    `GOEXPERIMENT=simd`, `GODEBUG=simd` accepts 0 for forced emulation and 128, 256 or 512
    to pin vector width for testing with plus variants that panic only when an unsupported
    instruction is reached, and `ToArch` and `FromArch` let code drop to architecture-specific
    intrinsics for operations the portable set lacks.
  why: >-
    A vector API that still compiles and runs on targets without SIMD removes the per-architecture
    build split Go numeric code has needed, though reduction across a vector is absent in
    1.27 and `ReduceSum` arrives in the next release.
  sources:
  - label: primary
    url: https://go.dev/blog/simd-experiment
  - label: discussion
    url: https://news.ycombinator.com/item?id=49843269
- title: KosmicKrisp passes the Vulkan 1.4 conformance test suite on Apple silicon
  section: Apple platforms
  category: Apple
  status: confirmed
  blurb: >-
    KosmicKrisp passed the Vulkan 1.4 conformance suite on Apple silicon, giving macOS a Khronos-conformant
    driver.
  summary: >-
    LunarG states that KosmicKrisp, an MIT-licensed Mesa driver that emits Metal Shading Language
    through NIR and encodes to Metal 4, passed the Khronos conformance test suite for Vulkan
    1.4 on Apple silicon, and that performance has tripled since 1.3 conformance. It requires
    M1 or later and macOS 26 or later, so MoltenVK stays the path for Intel Macs and older
    releases, and mixed fleets still have to pick the ICD at runtime. iOS is not enabled in
    this release, with LunarG stating the conformance test suite was not fully passing and
    that it is not resourced to support iOS alongside macOS, and LunarG states the conformant
    driver will be available in the Vulkan SDK releasing 2026-09-29.
  why: >-
    A conformant Vulkan 1.4 implementation on macOS lets an engine keep one Vulkan path across
    Windows, Linux and Apple silicon instead of a separate Metal path, and gives validation
    layers, capture and replay, and diagnostics a conformant ICD to target on the Mac.
  sources:
  - label: primary
    url: https://www.lunarg.com/kosmickrisp-achieves-vulkan-1-4-conformance-on-apple-silicon/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49848157
