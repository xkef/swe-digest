- title: Rhombus v1.0
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Rhombus reached v1.0, a functional language on Racket with conventional syntax and pattern
    matching, relating to Racket as Elixir does to Erlang.
  summary: >-
    Rhombus reached v1.0 on 2026-06-22. It is a general-purpose functional language built
    on the Racket platform (run via `#lang rhombus`), relating to Racket roughly as Elixir
