- title: British Columbia, time zones, and Postgres
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Crunchy Data shows why Postgres timestamptz with IANA zones prevents date-math bugs, using
    BC's daylight-saving suspension as a worked example.
  summary: >-
    A Crunchy Data post uses British Columbia's plan to stop observing daylight saving time
    as a worked example of how Postgres handles time zones, showing why `timestamptz` plus
    named IANA zones (not fixed UTC offsets) is the correct storage choice and how `tzdata`
    updates propagate to stored values.
  why: >-
    Time-zone-rule changes are a recurring source of date-math bugs; the post gives a concrete
    pattern for keeping Postgres correct across rule changes.
  sources:
  - label: Crunchy Data
    url: https://www.crunchydata.com/blog/british-columbia-and-time-zone-changes
  - label: discussion
    url: https://news.ycombinator.com/item?id=48634787
- title: In praise of memcached
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A post advocates memcached over Redis for pure caching: failures return defaults and no
    persistence keeps the cache ephemeral.
  summary: >-
    A post dated 2026-06-02 argues for memcached over Redis as a pure cache on operational
    grounds: client libraries treat a connection failure as a cache miss and return a default,
    scaling uses client-side consistent hashing rather than built-in clustering (a failed
    node drops from the hash ring and is retried periodically), and the absence of disk persistence
    keeps the cache strictly ephemeral. The author frames Redis-as-cache as an antipattern
    because teams come to depend on its persistence and cannot later remove it.
  why: >-
    It restates a clear boundary between an ephemeral cache and a datastore, a recurring source
    of coupling bugs when a cache is quietly treated as a database.
  sources:
  - label: jchri.st
    url: https://jchri.st/blog/in-praise-of-memcached/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48638886
