- title: '"Will It Mythos?" benchmark of AI vulnerability finding'
  section: Hacker News
  category: Pulse
  blurb: >-
    A benchmark found Mythos unique on four bugs but argues cheaper models like Qwen and DeepSeek
    suggest the edge is economic, not capability.
  summary: >-
    An independent benchmark post (Joe, swelljoe.com, dated 2026-05-30 with updates through
    2026-06-22) tests whether Claude Mythos is uniquely strong at finding security vulnerabilities
    or whether its restriction is mainly economic. The author reports Mythos found four bugs
    no other model caught, but argues public models could plausibly find them with better
    prompts or tooling, and that several cheaper models (Qwen 3.6, DeepSeek, MiMo) were competitive
    with Opus 4.8 and GPT-5.5 at roughly an order of magnitude lower cost. The author flags
    sparse data and single runs per case as limitations.
  why: >-
    It adds an independent data point to the AI-found-vulnerability debate around Mythos and
    OpenAI's Daybreak, where capability claims have outrun reproducible method.
  comments: >-
    The thread (about 249 points) ties into the contested Mythos export-control claims tracked
    in follow-ups; commenters debated whether vulnerability-finding capability is a genuine
    model differentiator or a function of prompting, tooling, and budget.
  sources:
  - label: swelljoe.com
    url: https://swelljoe.com/post/will-it-mythos/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48640196
