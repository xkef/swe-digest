    url: https://www.theregister.com/security/2026/06/23/openai-yoo-hoo-look-over-here-we-do-that-security-stuff-too/5259842
- title: OpenAI Codex CLI excessive-logging bug fixed in rust-v0.142.0
  section: Top stories
  category: Agentic coding
  blurb: >-
    OpenAI fixed a Codex CLI bug that wrote 37 TB of logs in three weeks; the fix in rust-v0.142.0
    resolves an SSD endurance risk for daily users.
  summary: >-
    OpenAI merged two fixes for the Codex CLI defect that wrote TRACE/INFO records continuously
    to `~/.codex/logs_2.sqlite`, where one reporter measured roughly 37 TB written over about
    21 days. PR #29432 ("Stop logging every Responses WebSocket event") and PR #29457 ("Filter
    noisy targets from persistent logs") landed on 2026-06-22; the bulk of the volume came
    from the `codex_api::endpoint::responses_websocket` target. The fixes shipped in `rust-v0.142.0`
    on 2026-06-22 and the reporter closed the issue as completed the same day.
  why: >-
    The write rate extrapolated toward a consumer SSD's endurance budget within a year, so
    the patch removes a real hardware-wear risk for daily Codex CLI users.
  followup: >-
    Confirm the log-volume reduction holds in `rust-v0.142.0`, and whether Codex Desktop on
    Windows gets the same fix.
  comments: >-
    HN commenters criticized Codex log quality and reported a separate symptom of the spinner
    pegging GPU usage; before the release landed, users circulated a SQLite trigger to block
    inserts and suggested redirecting the log to a tmpfs/ramdisk.
  sources:
  - label: 'codex issue #28224'
    url: https://github.com/openai/codex/issues/28224
  - label: 'PR #29432'
    url: https://github.com/openai/codex/pull/29432
  - label: release rust-v0.142.0
    url: https://github.com/openai/codex/releases/tag/rust-v0.142.0
  - label: discussion
    url: https://news.ycombinator.com/item?id=48626930
