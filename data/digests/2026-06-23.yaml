- title: 'Oak: a content-addressed version control system built for agents'
  section: Developer tools
  category: Dev tools
  blurb: >-
    Oak, a VCS alternative for agents, uses content-defined chunking and lazy hydration to
    start editing large repos in seconds.
  summary: >-
    Oak is an Apache-2.0 version control system, in public beta at 0.99.0, positioned as a
    Git alternative for AI agents. It uses BLAKE3 content-defined chunking instead of Git's
    SHA-1, lazy on-demand hydration to start editing large repos in seconds, a branch-per-session
    model with manifest-level descriptions instead of per-commit messages, and native JSON
    output. The README states the project was written almost entirely with AI under human
    oversight.
  why: >-
    It is one of several 2026 attempts (alongside Epic's Lore and "Git alternative for agents"
    Show HN projects) to rework VCS primitives around agent workflows rather than human commits.
  followup: >-
    Watch for a 1.0 tag, Windows prebuilt binaries, and any interop with Git history.
  sources:
