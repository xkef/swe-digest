- title: Claude Code adds mods, TypeScript functions that intercept its events
  section: Top stories
  category: Agentic coding
  blurb: >-
    Claude Code adds mods, unsandboxed TypeScript functions that intercept its events and
    can rewrite or block calls.
  summary: >-
    Mods are TypeScript functions that hook Claude Code events. They can rewrite prompts,
    block or retry tool calls, answer permission requests, and redact tool output. They run
    unsandboxed with the same machine access as Claude Code.
  why: >-
    Installing a mod is equivalent to running untrusted code with full local access, except
    that on Team and Enterprise plans and on any machine with managed settings a built-in
    `sec-default` mod loads first and stops user-installed mods from overriding permission
    deny rules.
  followup: >-
    Whether mods widen the coding-agent sandbox-escape surface tracked since the 2026-07-20
    Docker-socket and Cowork VM disclosures.
  sources:
  - label: primary
    url: https://claude.com/blog/claude-code-mods
  - label: docs
    url: https://code.claude.com/docs/en/plugins/mods/overview
  - label: discussion
    url: https://news.ycombinator.com/item?id=49925102
- title: SvelteKit 3 moves configuration into vite.config.ts and renames the $lib alias
  section: Top stories
  category: Dev tools
  blurb: >-
    SvelteKit 3 moves configuration into vite.config.ts, renames the $lib alias to #lib, and
    changes env handling.
  summary: >-
    SvelteKit 3 relocates configuration into `vite.config.ts` and replaces the `$lib` alias
    with the `#lib` subpath import. Environment variables, service workers, and error handling
    also change. Remote functions remain unshipped, behind an experimental Async Svelte flag.
  why: >-
    Existing apps need a migration pass across config location, imports, environment variables,
    service workers, and error handling.
  sources:
  - label: primary
    url: https://svelte.dev/blog/sveltekit-3-is-here
  - label: discussion
    url: https://news.ycombinator.com/item?id=49926536
- title: >-
    A Harvard physicist reports 36 manuscripts in three months from a Claude-built calculation
    harness
  section: AI
  category: AI
  blurb: >-
    A Harvard physicist reports 36 manuscripts in three months from an open-source calculation
    harness built with Claude.
  summary: >-
    Matthew Schwartz reports selecting problems that suit what current models do well, building
    an open-source toolkit called BootLoops, then recruiting domain experts to steer each
    result toward something the field values, and he states the first findings were technically
    correct but scientifically unremarkable until an expert redirected them. Reported scope
    is 36 manuscripts across 18 fields with 19 coauthors over three months, from roughly 400
    candidate problems. This is a guest post hosted by the model vendor, the findings are
    author-reported rather than peer reviewed, and several are stated as still undergoing
    verification.
  why: >-
    The described method inverts the usual framing by fitting problem selection to current
    model strengths instead of asking the model to work like a scientist.
  followup: Whether any of the 36 manuscripts clears peer review.
  sources:
  - label: primary
    url: https://www.anthropic.com/research/claude-shaped-science
  - label: discussion
    url: https://news.ycombinator.com/item?id=49933386
  - label: discussion
    url: https://news.ycombinator.com/item?id=49932606
- title: >-
    llama.cpp serves decision models on a /v1/systemone endpoint that returns option probabilities
    in one forward pass
  section: AI
  category: AI
  blurb: >-
    llama.cpp now serves decision models on a /v1/systemone endpoint returning option probabilities
    in one forward pass.
  summary: >-
    The caller sends a state plus typed questions and receives a probability per option, following
    the existing System One format, so switching an existing client is a base URL change.
    Five GGUF models are listed, four under Apache 2.0 and the 27B OpenJev under CC BY-NC
    4.0, with stated median times of 3 ms to 43 ms per question on one NVIDIA RTX PRO 6000.
    The post states Cloudflare's Clef, covered in the 2026-10-01 digest, is next.
  why: >-
    Routing a request, moderating content, or checking that an agent step worked stops needing
    a chat model and an output parser.
  sources:
  - label: primary
    url: https://huggingface.co/blog/ggml-org/decision-models-in-llamacpp
  - label: discussion
    url: https://www.reddit.com/r/LocalLLaMA/comments/1wvv6im/new_in_llamacpp_decision_models/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49934323
- title: Red Hat benchmarks decision-model guardrails and ranks Jev fourth of nine
  section: AI
  category: AI
  blurb: >-
    Red Hat benchmarked nine guardrails and a 200M-parameter classifier beat Jev on prompt
    injection at 54 ms against 348 ms.
  summary: >-
    On the prompt-injection benchmark a 200M-parameter pre-trained classifier, `deberta-v3-base-prompt-injection-v2`,
    scored 89.01% at 54.1 ms median latency, against Jev-1.13.0 at 86.35% and 348.1 ms and
    Qwen3.6-35B used as LLM-as-a-judge at 89.31% and 312.5 ms, with the 2019 BART-large-mnli
    zero-shot baseline last at 61.49%. The method is disclosed in full: nine guardrails across
    four paradigms, the EvalHub NeMo Guardrails prompt-injection and toxicity-profanity-safety
    benchmarks, class-balanced datasets, named hardware, and the risk-policy prompts. Two
    caveats a reader needs: Red Hat ships those classifiers as the default guardrail catalog
    in OpenShift AI 3.6 and used them as its own gold standard, and the authors state their
    risk definitions were adapted from LLM-as-a-judge prompts and may not be optimal for zero-shot
    models.
  why: >-
    A small task-specific classifier holding its own against a decision model and an LLM judge
    argues against paying generative latency on every guardrail check.
  sources:
  - label: primary
    url: https://developers.redhat.com/articles/2026/10/02/benchmarking-ai-decision-models-against-traditional-guardrails
  - label: discussion
    url: https://news.ycombinator.com/item?id=49933476
- title: NVIDIA DGX Spark 64GB arrives 2026-10-23 at $4,999
  section: AI
  category: AI
  blurb: >-
    NVIDIA's 64GB DGX Spark ships 2026-10-23 at $4,999, keeping GB10 and supporting models
    up to 100B parameters.
  summary: >-
    The cheaper configuration keeps the GB10 Grace Blackwell superchip, DGX OS, and the same
    software stack as the 128GB model, and supports models up to 100 billion parameters on
    device. Two units connected directly over their built-in ConnectX-7 ports with a QSFP
    cable pool memory to 128GB and extend model support to 200 billion parameters. It ships
    from Acer, ASUS, Dell, Gigabyte, HP, and MSI, and the up-to-1.7x clustered speedup is
    NVIDIA's own figure from its own Qwen 3.8 27B test.
  why: >-
    A 100-billion-parameter on-device ceiling at $4,999 brings local inference at that size
    inside a single workstation budget.
  sources:
  - label: primary
    url: https://blogs.nvidia.com/blog/local-ai-dgx-spark-64gb-sync/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49933234
- title: Context Language Models let the model edit its own context as a file
  section: ML research
  category: Paper
  blurb: >-
    Context Language Models let a model edit its own context as a file, reporting 11.4% higher
    BrowseComp-Plus accuracy.
  summary: >-
    The paper treats the context window as a file the model updates itself rather than a buffer
    managed by an external harness. On BrowseComp-Plus the authors report 11.4% higher accuracy
    at 21.5% fewer FLOPs than external context management. The figures are the authors' own
    and are not independently reproduced.
  why: >-
    Context management is the layer agent harnesses currently own, so moving it inside the
    model changes what a harness is responsible for.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2609.37725
  - label: discussion
    url: https://news.ycombinator.com/item?id=49922437
- title: >-
    ProVer verifies which agent decisions earned the reward before adjusting GRPO advantages
  section: ML research
  category: Paper
  blurb: >-
    ProVer finds the agent step that split a success from a failure, then verifies it by resampling
    continuations.
  summary: >-
    GRPO assigns one trajectory-level advantage uniformly across every policy token, which
    hides which intermediate decision produced the outcome. ProVer has an agentic judge contrast
    successful and failed rollouts to nominate the segment responsible for the divergence,
    then declines to trust that judgment and instead estimates the segment's advantage from
    the difference in terminal success rates between current-policy continuations sampled
    before and after it. Reported relative improvements over GRPO across ALFWorld, WebShop,
    and SearchQA are 9.91% for Qwen3.5-2B and 7.12% for Qwen3.5-4B, submitted 2026-09-28 and
    the authors' own figures.
  why: >-
    Using the judge only to choose where to verify avoids evaluating every intermediate state,
    which is the cost that has kept step-level credit assignment out of agent training runs.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2609.36178
  - label: discussion
    url: https://news.ycombinator.com/item?id=49934012
- title: arXiv caps submitters at two submissions per calendar month
  section: ML research
  category: Infrastructure
  blurb: >-
    arXiv now caps each submitter at two submissions per calendar month after monthly volume
    doubled to 40,363.
  summary: >-
    Effective 2026-10-01, arXiv limits each submitter to two submissions per calendar month
    on top of the standing three-active-submission limit. Rejected submissions count against
    the cap and pre-announcement deletions do not. The post states monthly volume doubled
    in two years to 40,363.
  why: >-
    Anyone posting preprints now plans release timing around a hard monthly cap rather than
    a soft queue.
  sources:
  - label: primary
    url: https://blog.arxiv.org/2026/10/01/updated-rate-limit-policy/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49926512
- title: >-
    Earendil ships Pi Durable, an experimental harness that checkpoints every agent step
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Earendil shipped Pi Durable, an experimental harness that checkpoints every agent step
    to survive process death.
  summary: >-
    Every model request, tool call, and compaction is a task that stores a checkpoint, so
    a new process reopens the same storage and resumes from the last one. Tools declare whether
    a rerun after a crash is safe, an interrupted call that is not safe is reported to the
    model instead of repeated, and a `requestId` makes a submission exactly-once. Storage
    ships as memory, SQLite, and JSONL with no Node APIs in the SQLite and JSONL paths, so
    the same harness runs on Bun or inside a Cloudflare Durable Object with a small adapter,
    and the source without tests is about 15,000 lines.
  why: >-
    It splits the durable-harness problem away from the terminal coding agent, which Earendil
    states is unchanged.
  sources:
  - label: primary
    url: https://earendil.com/posts/pi-durable/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49925969
- title: >-
    Wagtail reports spending only half its September tokens on the single open model it targeted
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Wagtail reports half of its 2B September tokens went to models other than the GLM 5.3
    Flash target it set.
  summary: >-
    Of 2B tokens for the month, 1B went to models other than the GLM 5.3 Flash target, and
    total energy came to about 35 kWh against a 10 kWh goal. A vibe-coded Wagtail MCP prototype
    consumed 450M tokens, $150, and 5 kWh almost overnight on what the author calls the wrong
    model choice, against $68 for the whole GLM 5.3 Flash share. The switch away was forced
    by capacity degradation at the inference provider rather than model quality, moving work
    to DeepSeek V4.1 Flash and Qwen 3.8 Flash.
  why: >-
    A core team publishing per-model token, dollar, and energy figures gives a cost reference
    point for agentic coding that capability benchmarks do not provide.
  sources:
  - label: primary
    url: https://wagtail.org/blog/one-month-on-glm-53-flash/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49934620
- title: >-
    Zammad session-hijack RCE was used to breach the DIVD, and a local root escalation affects
    every version
  section: Security
  category: Security
  blurb: >-
    A Zammad session-hijack RCE was used to breach the DIVD, and a separate local root escalation
    affects every version.
  summary: >-
    CVE-2026-102489 is a session hijack leading to remote code execution as the `zammad` user
    in versions 6.3.0 to 6.5.4, present but stated not exploitable in 7.0.0 to 7.1.3, and
    CVE-2026-102490 lets the local `zammad` user escalate to root in v1.5.0 through v7.1.0-alpha.
    The advisory timeline records the flaw abused to breach DIVD itself on 2026-09-21, reproduced
    by 2026-09-23, reported to Zammad on 2026-09-24, with scanning and owner notification
    starting 2026-09-26. DIVD advises upgrading to version 7 or taking the instance offline,
    lists patch status as available, and states Zammad is working on a fix.
  why: >-
    This is active exploitation rather than a disclosure, and the parent case DIVD-2026-00014
    is described on the same site as DIVD being hacked through AI agents.
  followup: >-
    Whether Zammad ships a fix for CVE-2026-102490 and assigns fixed versions for both CVEs.
  sources:
  - label: advisory
    url: https://csirt.divd.nl/cases/DIVD-2026-00015/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49931836
- title: Debian ships DSA-6528-1, a kernel update referencing more than a thousand CVEs
  section: Security
  category: Linux/Kernel
  blurb: >-
    Debian's 2026-09-29 kernel advisory DSA-6528-1 references more than a thousand CVE identifiers
    for the linux package.
  summary: >-
    The advisory, dated 2026-09-29, covers the `linux` package and references more than a
    thousand CVE identifiers, listed in dense near-sequential blocks. The cited advisory truncates
    inside that CVE list, before the package table, so the exact count, the affected Debian
    suite, and the fixed package version are not established from the sources used here. Inference
    rather than advisory text: Linux kernel CVE identifiers are assigned in bulk against stable-branch
    fixes, so the identifier count is not a count of distinct exploitable flaws.
  why: >-
    Debian kernel operators have one large batch update to apply, and the affected suite and
    fixed version have to be read from the Debian security tracker before planning it.
  sources:
  - label: advisory
    url: https://lwn.net/Articles/1097401/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49928121
- title: >-
    Hetzner will cap a vSwitch at 256 MAC addresses from 2026-10-12 after the MAC-learning
    incident
  section: Outages
  category: Outage
  blurb: >-
    Hetzner will limit each vSwitch to 256 MAC addresses from 2026-10-12, after resolving
    a MAC-learning network incident.
  summary: >-
    Hetzner states that from 2026-10-12 a vSwitch may not exceed 256 MAC addresses and each
    MAC may not exceed 32 IP addresses, with the change starting 2026-10-11 22:00 UTC. The
    planned change is referenced from the parent network incident behind the 2026-10-01 vSwitch
    packet loss, which resolved at 2026-10-02 07:56 UTC with Hetzner stating the cause was
    a problem with the MAC learning of the vSwitch. The 2026-10-01 digest covered that packet
    loss and the resolution of the dependent load balancer incident while the parent incident
    was still open.
  why: >-
    Anyone running more than 256 MAC addresses behind one Hetzner vSwitch, or more than 32
    IP addresses behind one MAC, has to reduce that count before 2026-10-11 22:00 UTC.
  followup: Whether the vSwitch MAC and IP limits take effect on 2026-10-12 as stated.
  sources:
  - label: planned change
    url: https://status.hetzner.com/incident/52a3c458-f6dd-41a4-b617-dd6d059c512f
  - label: status page
    url: https://status.hetzner.com/incident/288baeb9-5cb2-4e68-9074-b878dcd0d793
  - label: discussion
    url: https://news.ycombinator.com/item?id=49920413
- title: Android developer verification enforcement began on 2026-09-30 in four countries
  section: Developer tools
  category: Dev tools
  blurb: >-
    Android developer verification enforcement began on 2026-09-30 in Brazil, Indonesia, Singapore,
    and Thailand.
  summary: >-
    Installing apps from participating stores on certified devices running Android 7 and later
    in those four countries now depends on a verified developer identity, and Google states
    the capability expands globally for all apps on certified devices in 2027. Developers
    distributing exclusively outside Google Play register through a separate Android Developer
    Console, while Google states Play automatically registers 99 percent of apps. A limited
    distribution account covers sharing with up to 20 devices without a government-issued
    ID or registration fee, and a stated advanced flow is meant to let power users install
    apps from unverified developers.
  why: >-
    Anyone shipping Android builds outside Google Play now needs a verified identity on file
    before users in those four countries can install them.
  followup: >-
    The 2027 global expansion, and whether the advanced flow for unverified developers ships
    in a usable form.
  sources:
  - label: primary
    url: https://developer.android.com/developer-verification
  - label: discussion
    url: https://news.ycombinator.com/item?id=49917761
- title: >-
    Python ships five releases, ends 3.10 support, and fixes seven CVEs in every release
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Python shipped five releases that end 3.10 security support and fix seven CVEs in all
    five, with an eighth in 3.10 through 3.13.
  summary: >-
    Python 3.10.22 is the final 3.10 release and the series receives no further security updates
    after five years. Seven CVEs are fixed in all five releases and an eighth in 3.10 through
    3.13, the actionable ones being two tarfile extraction-filter escapes that could place
    or alter files outside the destination, a zipfile decompression bound for bzip2 and LZMA
    members that prevents unbounded allocation from small inputs, and urllib credentials now
    scoped by URL scheme so HTTPS credentials are not reused on a matching HTTP URL. Python
    3.10.22, 3.11.17, and 3.12.15 are source-only with no installers, 3.13.16 is the last
    full maintenance release of 3.13, and it and 3.14.8 move bundled OpenSSL to 3.5.9.
  why: >-
    Anyone still on 3.10 has to plan a series upgrade now, and the tarfile and urllib fixes
    change behaviour that extraction and HTTP client code may depend on.
  sources:
  - label: primary
    url: https://blog.python.org/2026/10/python-31022-31117/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49931580
- title: Effect 4.0 ships a zero-dependency core and a published support window
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Effect 4.0 ships a core package with no runtime dependencies and at least three years
    of fixes per major version.
  summary: >-
    The Effect 4.0 core package carries no runtime dependencies. The project also published
    a support policy giving every major version at least three years of fixes.
  why: >-
    Dropping runtime dependencies cuts third-party supply-chain exposure, and a stated support
    window changes the upgrade calculus for teams running Effect in production.
  sources:
  - label: release notes
    url: https://effect.website/blog/releases/effect/40
  - label: discussion
    url: https://news.ycombinator.com/item?id=49925812
- title: >-
    Apple says it will add controls restricting macOS Full Disk Access, citing AI agent risk
  section: Apple platforms
  category: Apple
  blurb: >-
    Apple states it will add controls so granting macOS Full Disk Access requires very explicit
    user action, naming AI agents.
  summary: >-
    Apple states that Full Disk Access largely sidesteps its privacy controls so backup applications
    can work, and that some developers use it in ways that expose files, mail, messages, and
    browsing history without users understanding. Apple states it will introduce additional
    controls so the grant requires very explicit user action, and names AI agents becoming
    more capable and autonomous as why addressing this is critical. The post gives no macOS
    version, no date, and no API.
  why: >-
    Any application that depends on Full Disk Access faces a tighter grant flow, though nothing
    can be migrated against until Apple names a version and an API.
  followup: The macOS version, date, and API for the stated Full Disk Access controls.
  sources:
  - label: primary
    url: https://developer.apple.com/news/?id=p6zjojqw
  - label: report
    url: https://techcrunch.com/2026/10/02/apple-says-its-tightening-macos-full-disk-access-controls-due-to-new-risks-from-ai-agents/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49937631
- title: Apple ships Pass Designer in beta for building and previewing Wallet passes
  section: Apple platforms
  category: Apple
  blurb: >-
    Apple shipped Pass Designer in beta, which builds Wallet passes and previews them with
    the iOS and watchOS renderer.
  summary: >-
    The beta previews passes with the same rendering iOS and watchOS use, validates a pass
    as you work, and flags missing required key values and unexpected definitions. It edits
    semantic tags for boarding passes and event tickets in the UI, and can generate a backward-compatible
    pass structure from semantic data for cases where semantic tags are unsupported. Pass
    Designer beta requires macOS 27 or later.
  why: >-
    Building a Wallet pass stops requiring hand-written JSON and a device install cycle to
    see the rendered result.
  sources:
  - label: primary
    url: https://developer.apple.com/pass-designer/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49937276
- title: Supabase is acquiring Turso
  section: Markets and companies
  category: Markets
  blurb: >-
    Supabase is acquiring Turso, which rebuilt SQLite in Rust, and states both products and
    teams continue separately.
  summary: >-
    Turso rebuilt SQLite in Rust and built a platform where a single server manages millions
    of databases, loading them on demand and suspending them when idle. Supabase states nothing
    changes for existing users, that it continues on Postgres while Turso continues on SQLite,
    that Turso keeps operating, and that Glauber Costa will lead its agentic infrastructure
    effort with Pekka Enberg joining. Supabase states it already launches over one million
    databases per week, and no price is stated.
  why: >-
    Supabase gains an engine built for one database per tenant, a provisioning shape Postgres
    does not serve at that count.
