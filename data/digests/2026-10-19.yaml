- title: >-
    PostgreSQL 19 GA moves to 2026-11-19, with RC2 on 2026-11-12, after a cycle of late feature
    reverts
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    PostgreSQL 19 RC1 shipped on 2026-10-15, and the project now targets RC2 on November 12
    and general availability on November 19.
  summary: >-
    EDB's Tom Kincaid writes that the community plans RC2 for 2026-11-12 and GA for 2026-11-19
    so fixes from the November maintenance release can be included. Reverted features include
    SQL property graph queries, partition merge and split, and online checksum toggling, while
    REPACK CONCURRENTLY, pg_plan_advice, and logical replication of sequences remain, and
    JIT is off by default. Peter Eisentraut attributes the reverts partly to LLM-assisted
    review surfacing long tails of edge-case defects and to senior developers spending April
    to August on security fixes.
  why: >-
    Production upgrades should stay on 18 until mid-November, and testing should cover the
    final ACCESS EXCLUSIVE lock in REPACK CONCURRENTLY and the JIT default change.
  followup: RC2 on 2026-11-12 and GA on 2026-11-19.
  thread: f-0040
