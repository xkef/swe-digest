date: '2026-10-19'
updated: 2026-10-19T21:45Z
lede: >-
  The Linux 7.3 release and two agent-assisted security and performance results lead the day,
  and the vLLM post shows reviewers falling behind agent-written code.
stories:
- title: Linux 7.3 released with a record 18,765 commits, opening the 7.4 merge window
  section: Top stories
  category: Linux/Kernel
  blurb: >-
    Torvalds shipped Linux 7.3 on schedule, adding fchroot(), completed sched_ext subschedulers,
    and BPF global per-CPU data.
  summary: >-
    Linus Torvalds released Linux 7.3 on 2026-10-18 without an rc8 slip. LWN reports 18,765
    non-merge commits from 3,021 developers, 807 of them first-time contributors. Changes
    include binfmt_misc extensions, group-scheduling work for large systems, the failfs filesystem,
    the fchroot() system call, global per-CPU data for BPF programs, completed sched_ext subschedulers,
    VM working-set tracking, and ntfs3 alternate data streams.
  why: >-
    Distribution and fleet kernel planning can now target 7.3, and features aimed at 7.4 must
    land in the merge window that opens 2026-10-19.
  followup: >-
    The 7.4 merge window opens 2026-10-19, and 7.4-rc1 is expected about two weeks later.
    Torvalds says his merge schedule will be irregular while he is on vacation.
  thread: f-0068
  sources:
