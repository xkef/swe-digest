- title: >-
    DHS orders federal civilian agencies to remove DeepSeek and third-party products built
    on it
  section: AI
  category: AI
  blurb: >-
    A DHS exclusion order bars DeepSeek models and tools built on them from civilian federal
    IT and purchasing, with a 60-day exception window.
  summary: >-
    Exclusion and Removal Order 2026-01, dated 2026-07-24 and filed for Federal Register public
    inspection on 2026-10-19 as document 2026-21447, excludes DeepSeek and its affiliates
    from procurement and requires removal of their products and of third-party products developed
    using DeepSeek implementations. National security systems are excepted. Agencies can request
    exceptions in writing within 60 days, reviewed by CISA.
  why: >-
    Vendors selling AI products to US civilian agencies now need to know whether DeepSeek
    weights sit anywhere in their stack.
  followup: Federal Register publication on 2026-10-20 under docket DHS-2026-0628.
  thread: f-0074
