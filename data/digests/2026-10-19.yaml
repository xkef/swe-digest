- title: >-
    Inception releases Mercury 3, a diffusion LLM claiming 1,068 tokens per second and a 1M-token
    context
  section: AI
  category: AI
  blurb: >-
    Inception's largest text-diffusion model costs $0.20 and $0.70 per million tokens and
    is available through OpenRouter, Baseten and Vercel.
  summary: >-
    Inception says Mercury 3 is more than 40x larger than Mercury 1, generates 1,068 tokens
    per second on NVIDIA GPUs, and has a 1M-token context, up from 260K. It is OpenAI API
    compatible and 50% off at launch. Inception claims parity with GPT-6 Luna and Claude Haiku
