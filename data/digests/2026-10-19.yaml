    url: https://lwn.net/Articles/1101143/
  - label: primary
    url: https://github.com/torvalds/linux/releases/tag/v7.3
  - label: discussion
    url: https://www.reddit.com/r/linux/comments/1x9hxh3/the_73_kernel_has_been_released/
- title: >-
    Plex2Shell RCE chain in Plex Media Server is widely exploited after a public PoC on 2026-10-16
  section: Top stories
  category: Security
  blurb: >-
    Four chained Plex Media Server CVEs give unauthenticated code execution, and attackers
    are using them to install cryptominers and proxyware.
  summary: >-
    Plex confirmed on 2026-10-19 that CVE-2026-96652, CVE-2026-96654, CVE-2026-96655 and CVE-2026-96656
    chain into unauthenticated remote code execution as the Plex Media Server process, fixed
    in 1.43.3.10861. Plex says exploitation has been active and widespread since the proof
    of concept went public on 2026-10-16, with compromised servers running cryptominers and
    proxy software. A honeypot operator logged in-the-wild exploitation from three IPs starting
    2026-10-17 and published hashes and pcaps.
  why: >-
    Any Plex server older than 1.43.3.10861 reachable on port 32400 should be updated now
    and checked for unknown .so or .dll files in the Codecs folder.
  followup: CISA KEV listing and NAS vendor package updates.
  comments: >-
    The honeypot write-up adds attacker IPs, payload hashes, and a proxy binary named myawesomeproxy
    that Plex now lists as an indicator.
  thread: f-0073
