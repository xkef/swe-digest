- title: >-
    Broadcom WPS parser bug gives unauthenticated RCE over WiFi on unpatched ISP routers,
    with no CVE
  section: Security
  category: Security
  blurb: >-
    A WPS EAP reassembly overflow in Broadcom's 802.11 SDK lets attackers in WiFi range leak
    memory and get root on cable routers.
  summary: >-
    Researcher Quentin Kaiser disclosed a WPS EAP reassembly overflow present in Broadcom's
    SDK since at least 2010. It can be triggered over WiFi without the network key and gives
    memory disclosure and code execution on eCos platforms (BCM3380, BCM3383, BCM33834) and
    Linux platforms (BCM3390, BCM65xx, BCM68xx). Broadcom shipped an incomplete patch in 2018
    and declined to assign a CVE. Kaiser demonstrated exploitation on gateways from Proximus,
    VOO, and Orange Belgium, and reports none were patched as of 2026-10-15.
  why: >-
    Many cable gateways in homes and branch offices give a root shell to anyone in radio range,
    and vendor CVE feeds will not flag it, so disabling WPS and fingerprinting devices is
    the available mitigation.
  followup: >-
    Watch for ISP firmware updates, a CVE from another CNA, and the device list built from
    the published fingerprinting script and YARA rule.
  thread: f-0067
  sources:
  - label: primary
    url: https://quentinkaiser.be/security/2026/10/16/one-parser-two-bugs/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50122058
- title: >-
    NorForge finds 20+ exposed Cairn panels running autonomous AI agent intrusions against
    web shops
  section: Security
  category: Security
  blurb: >-
    Open Cairn dashboards show criminals feeding AI agents target lists, with one Chinese-language
    cluster running over 1,100 attack projects.
  summary: >-
    NorForge identified more than 20 publicly exposed Cairn panels it assesses as malicious.
    Cluster AIA0001 ran over 1,100 projects across 14 panels against e-commerce sites in the
    US, Japan and Australia, seeking unauthenticated RCE, with workers named claudecode_deepseek-v4.1-flash
    and an estimated average cost near $5 per task. The Verge, citing Reuters, reports John
    Deere, SharkNinja and Cummins among the victims.
  why: >-
    Agent-driven exploitation makes mass targeting of mid-size sites cheap, so unauthenticated
    upload, deserialization and SQL injection bugs are found and used faster.
  sources:
  - label: primary
    url: https://norforge.com/blog/inside_cairn
  - label: discussion
    url: https://www.theverge.com/ai-artificial-intelligence/1013643/ai-agents-hack-john-deere-shark-ninja-cummins
  - label: discussion
