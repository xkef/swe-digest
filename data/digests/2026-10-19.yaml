- title: >-
    Mistral releases Timestral, a family of CPU-friendly time-series forecasting models from
    5M to 209M parameters
  section: AI
  category: AI
  blurb: >-
    Mistral released four time-series forecasting models from 5M to 209M parameters that run
    on CPU and take past and known-future covariates.
  summary: >-
    Timestral produces probabilistic multivariate forecasts over 21 quantiles with a 32,768-step
    context and a modified MIT licence. Mistral says the 209M model ranks first among zero-shot
    models on GIFT-Eval, TIME and fev-bench, and that an 8-thread CPU forecast takes 10 ms
    with the 5M model and 140 ms with the 209M model. A GitHub repository is out and a technical
    report will follow.
  why: >-
    Teams forecasting observability or capacity metrics get an open, CPU-only zero-shot option
    to test against classical models.
  followup: >-
    Publication of the technical report and leaderboard confirmation of the submitted results.
  sources:
  - label: primary
    url: https://mistral.ai/news/timestral/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50150434
- title: >-
    MiniMax launches M3.1 Flash for agent and coding work at $0.15 and $0.60 per million tokens
  section: AI
  category: AI
  blurb: >-
    MiniMax launched M3.1 Flash for agentic and coding work at $0.15 input and $0.60 output
    per million tokens, with open weights promised later.
  summary: >-
    MiniMax released M3.1 Flash through its API, M Plan and MiniMax Code on 2026-10-19, priced
    at $0.15 input, $0.60 output and $0.015 cached input per million tokens. The company reports
    73.7% on DeepSWE v1.1 and 61.7 on OSWorld V2, output above 200 tokens per second, and
    70% lower agentic task cost than its predecessor. Model weights will be released later.
  why: >-
    It is another low-cost model aimed at long agent sessions, and the open weights would
    make it self-hostable.
  followup: Weights release, reported by r/LocalLLaMA for 2026-10-23, and the license terms.
  comments: >-
    r/LocalLLaMA threads report the model as 428B total parameters with 23B active and a weights
    date of 2026-10-23, which the MiniMax post does not state.
