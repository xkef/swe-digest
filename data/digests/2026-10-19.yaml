- title: >-
    GitHub Actions, Pages and webhooks degraded on 2026-10-19, recovering after mitigation
  section: Outages
  category: Outage
  blurb: >-
    GitHub Actions workflow processing, Pages builds and webhook delivery slowed from 15:49
    UTC, with delays continuing after a fix went in.
  summary: >-
    GitHub began investigating degraded performance for Actions and Pages at 15:49 UTC on
    2026-10-19, and webhooks were added at 15:50 UTC. At 16:30 UTC GitHub reported recovery
    after mitigation but said Actions status updates, Pages deployments, and check and workflow
    webhook events could still be delayed.
  why: >-
    CI pipelines, deploy gates and bots that depend on Actions check events or webhooks may
    have stalled or missed status updates and might need re-runs.
  followup: Incident resolution and any GitHub availability report covering the cause.
  thread: f-0070
