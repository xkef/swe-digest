- title: >-
    vLLM ships agent-built CuTe DSL decode path for Kimi K3 and proposes a fast-track review
    model
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    NVIDIA and vLLM used coding agents to write fused GB300 decode kernels for Kimi K3 and
    now bound their review cost with tests and isolation.
  summary: >-
    A vLLM post by NVIDIA's Benjamin Chislett describes an agent-assisted CuTe DSL decode
    path for Kimi K3 on GB300. It cuts per-layer decode from 23 kernels and 130 microseconds
    to 13 kernels and 69 microseconds, with 1.31x to 1.92x higher decode throughput depending
    on batch size and tensor parallelism. The authors say agent-written kernels outpace line-by-line
    review. They propose a fast-track RFC that keeps changes inside model code, bounds hardware
    scope, requires correctness and long-context evals, and lets contributors run standard
    evals on their own GPUs. Their audit found a compiler reordering of activation reads ahead
    of a synchronization wait that simple functional checks missed.
  why: >-
    The post is a concrete case of replacing line-by-line human review of agent-generated
    code with isolation, scoped support, and reproducible evidence, and it lists a failure
    mode that review must still catch.
  sources:
  - label: primary
    url: https://vllm.ai/blog/2026-10-16-kimi-k3-megakernel
  - label: discussion
    url: https://news.ycombinator.com/item?id=50140784
- title: >-
    Cloudflare cut its AI code reviewer's cost per review 68% with prompt cache fixes and
    fewer LLM calls
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Cloudflare cut its AI code reviewer from $2.43 to $0.77 per review by fixing prompt cache
    prefixes and dropping wasted LLM calls.
  summary: >-
    Cloudflare's internal AI code reviewer rose from $1.19 per review in April to about $2.46
    by late August, mostly after moving all reviewers to Anthropic models. Splitting the system
    prompt so a shared prefix gets its own cache breakpoint, removing unusable tools, parallel
    file reads, skipping reviewers on re-reviews and stopping cancelled GitLab jobs brought
    the average to $0.77 and the median review time from 4m 09s to 1m 32s. The reviewer now
    runs on OpenCode v2 after a shadow comparison agreed with v1 on 98% of approval decisions.
  why: >-
    It gives concrete, measured levers for teams whose agent costs are driven by cache writes
    and reads rather than output tokens.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/obsessive-inference-optimization/
- title: >-
    Meta makes data pipeline agents more reliable with a thin deterministic orchestrator and
    14 subagents
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Meta routes 20+ data pipeline workflows to 14 specialist subagents via a deterministic
    1,300-line orchestrator that does no domain work.
  summary: >-
    Meta replaced a single all-knowing agent for data column onboarding, which hallucinated
    as context grew, with a router that follows a fixed seven-step protocol and delegates
    only one step to an LLM subagent with isolated domain knowledge. New use cases are added
    as workflow templates that resequence existing subagents. Column configuration prep dropped
    from about a day to under an hour, and about two-thirds of changes land without significant
    human edits.
  why: >-
    It is a first-party account of separating deterministic routing from LLM reasoning, with
    outcome numbers, for multi-repo agent workflows.
  sources:
  - label: primary
    url: https://engineering.fb.com/2026/10/19/ml-applications/thin-orchestrator-ai-agent-architecture/
- title: >-
    Hybrid Reasoning Agents switch between latent reasoning and text tool calls in one generation
  section: ML research
  category: Paper
  blurb: >-
    A Stanford-led paper trains agents to reason in latent space and act through text, reporting
    35 to 55 percent fewer tokens on 11 benchmarks.
  summary: >-
    HybridAgents uses a lightweight HybridLink module to move between latent and text modes
    and keeps a continuous working memory across turns. Training uses HybridSFT followed by
    HybridRL, which learns when to think latently and when to act through text. Across 3 model
    scales and 11 benchmarks, the authors report a 10.4 percent performance gain, 35.5 to
    54.7 percent fewer tokens, 1.8x to 2.6x faster inference, and inspectable latent thoughts.
    Code and data are released.
  why: >-
    Latent reasoning that keeps tool access could cut agent inference cost, though inspecting
    latent thoughts is a new problem for agent observability.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.18861
  - label: discussion
    url: https://news.ycombinator.com/item?id=50145337
- title: >-
    Meta engineer reworks Torvalds' AI-assisted RFC for page cache reads without folio references
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    A Meta engineer reworked Linus Torvalds' Claude Code RFC so filemap_read() copies from
    the page cache without taking folio references.
  summary: >-
    Kiryl Shutsemau posted a patch series based on Torvalds' RFC so filemap_read() and shmem
    copy from the page cache without a folio reference, freeing such folios only after an
    RCU grace period. The goal is to stop refcount bouncing when many CPUs do small reads
    of one file. Phoronix reports large gains in 64-thread tests on EXT4, tmpfs, XFS and a
    raw block device, and the series is still an RFC with open design questions.
  why: >-
    Workloads with many threads reading the same hot file could see large throughput gains
    if this lands in mainline.
  followup: >-
    Review on the kernel mailing list and whether a non-RFC version targets a merge window.
  sources:
  - label: primary
    url: https://www.phoronix.com/news/Reading-Page-Cache-WO-Folio-Ref
- title: >-
    Let's Encrypt adds two remote validation perspectives, with staging on 2026-10-27 and
    production on 2026-11-10
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    ACME domain validation will run from one primary and six remote vantage points, up from
    four, to meet a CA/B Forum rule taking effect 2026-12-15.
  summary: >-
    Let's Encrypt will make seven validation requests per challenge, one from the primary
    datacenter and six from remote perspectives, and a quorum must see the correct response.
    The change follows Baseline Requirements 3.2.2.9, which requires at least five remote
    perspectives from 2026-12-15. Staging starts 2026-10-27 and production is planned for
    2026-11-10.
  why: >-
    Hosts that geoblock or firewall HTTP-01 and DNS validation traffic may see new renewal
    failures, so test against staging after 2026-10-27.
  followup: Staging rollout on 2026-10-27 and production rollout on 2026-11-10.
  sources:
  - label: primary
    url: https://community.letsencrypt.org/t/lets-encrypt-is-adding-two-additional-remote-perspectives-for-domain-validation/252166
  - label: discussion
    url: https://news.ycombinator.com/item?id=50150809
- title: >-
    DBOS made Postgres DELETE scale for workflow retention by dropping cascading foreign keys
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Dropping cascading foreign keys and vacuuming around batch deletes made Postgres retention
    in a workflow engine an order of magnitude faster.
  summary: >-
    Cascading deletes from workflow_status to step_outputs touched scattered pages and churned
    the cache, so DBOS now deletes each table separately in creation order, with an anti-join
    that skips data from workflows that still exist. A created_at index lookup took 20 minutes
    when millions of dead tuples sat at the front of the index before autovacuum caught up.
    A manual VACUUM before and after each retention pass fixed it. DBOS rejected dropping
    partitions because long-running workflows would block them.
  why: >-
    Teams running queue or workflow tables on Postgres can apply the same fixes: avoid ON
    DELETE CASCADE on hot paths, delete in physical order, and vacuum around oldest-first
    batch deletes.
  sources:
  - label: primary
    url: https://www.dbos.dev/blog/scaling-deletions-in-postgres
  - label: discussion
    url: https://news.ycombinator.com/item?id=50108297
