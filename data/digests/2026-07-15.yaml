- title: >-
    Star Fleet reports Lean-verified Erdős-problem solutions from parallel Codex agents
  section: AI
  category: AI
  blurb: >-
    Colin Snyder published Star Fleet, running parallel Codex agents to emit machine-checked
    Lean 4 proofs for open Erdős problems.
  summary: >-
    A site published by Colin Snyder presents proposed solutions to a set of open Erdős problems
    produced by "Star Fleet," a harness that runs up to 20 parallel Codex (GPT-5.6) instances
    emitting Lean 4 proofs. Each entry ships complete Lean 4 source pinned to a Mathlib version,
    automated checkers that reject `sorry` placeholders, and a transitive axiom audit, with
    downloadable packages for independent verification. The results are framed as proposed
    solutions and are not peer reviewed, and one entry states an independent referee reran
    the verification.
  why: >-
    Machine-checked Lean output is a stronger claim than a prose proof, so it is a concrete
    test of whether parallel LLM agents can produce verifiable mathematics, and it extends
    the GPT-5.6 Sol proof thread from earlier this month.
  sources:
  - label: Star Fleet Math
    url: https://www.starfleetmath.com/
  - label: HN 48914646
    url: https://news.ycombinator.com/item?id=48914646
- title: Juggler models coding-agent sessions as branching CRDT documents
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Juggler is an open-source coding agent replacing linear chat with branching Yjs CRDT documents
    navigated through Miller-column UI.
  summary: >-
    Juggler is a Show HN open-source coding agent from Jules Storer, creator of the JUCE audio
    framework. It replaces the linear chat log with a session-as-document model where conversations
    branch into recursive sub-threads stored as a Yjs CRDT, navigated through Finder-style
    Miller columns, with the raw model context inspectable. The backend is Go with Wails for
    the desktop window rather than Electron, it serves multiple clients over a local web server,
    and it supports bring-your-own-key access to Claude, OpenAI, Gemini, DeepSeek, and Ollama.
    The app is AGPLv3 and extensions are Apache-2.0.
  why: >-
    It is a concrete attempt to give agent sessions a durable, branchable structure using
    CRDTs instead of a flat transcript, aimed at long multi-thread agent work.
  comments: >-
    Commenters single out the branching-tree session model as the main draw and report it
    handling 300k to 400k token sessions without interface slowdown. Requested additions include
    Agent Client Protocol support, sandboxing, and git worktree integration.
  sources:
  - label: Juggler (GitHub)
    url: https://github.com/juggler-ai/juggler
  - label: HN 48883305
    url: https://news.ycombinator.com/item?id=48883305
- title: Guest essay argues domain-specific languages make LLM output more reliable
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    An essay on martinfowler.com argues domain-specific languages improve LLM reliability
    by constraining output and enabling self-correction.
  summary: >-
    Unmesh Joshi published an article on martinfowler.com on 2026-07-14 arguing that domain-specific
    languages improve the reliability of LLM code generation. The claim is that a DSL constrains
    the solution space so that a few in-context examples yield consistent output, and that
    a DSL's deterministic validators, its parsers and compilers, let an autonomous agent self-correct
    at the domain level rather than from a raw stack trace. The piece includes code examples
    and patterns from the author's Tickloom framework but reports no benchmarks.
  why: >-
    It offers a concrete design pattern, narrowing the target language, for making agentic
    code generation verifiable rather than relying on model capability alone.
  sources:
  - label: martinfowler.com
    url: https://martinfowler.com/articles/llm-and-dsls.html
  - label: HN 48918575
    url: https://news.ycombinator.com/item?id=48918575
- title: >-
    Microsoft ships a record July Patch Tuesday with two actively exploited zero-days
  section: Security
  category: Security
  blurb: >-
    Microsoft's July 2026 Patch Tuesday addressed a record 569 CVEs, including two actively
    exploited zero-days in ADFS and SharePoint Server.
  summary: >-
    Microsoft's July 2026 Patch Tuesday on 2026-07-14 addressed 569 CVEs, the largest monthly
    release in its history and well past the prior record of 198, with 56 rated critical,
    510 important, and 3 moderate. Two flaws were exploited in the wild as zero-days before
    a fix shipped: CVE-2026-56155, a privilege-elevation flaw in Active Directory Federation
    Services, and CVE-2026-56164, a privilege-elevation flaw in SharePoint Server. Both were
    added to the CISA Known Exploited Vulnerabilities catalog the same day. A third flaw,
    CVE-2026-50661 in Windows BitLocker, was publicly disclosed before a patch but requires
    physical device access.
  why: >-
    The two exploited zero-days hit identity and collaboration infrastructure that many organizations
    expose to the network, and the record CVE volume raises the patch-testing and deployment
    load for every Windows fleet this month.
  sources:
  - label: Tenable analysis
    url: https://www.tenable.com/blog/microsofts-july-2026-patch-tuesday-addresses-569-cves-cve-2026-56155-cve-2026-56164
  - label: HN 48913190
    url: https://news.ycombinator.com/item?id=48913190
- title: >-
    CISA adds an actively exploited SharePoint auth-bypass and two SonicWall SMA1000 flaws
    to KEV
  section: Security
  category: Security
  blurb: >-
    CISA added CVE-2026-56164, an authentication-bypass in SharePoint Server, to KEV with
    a three-day federal remediation deadline.
  summary: >-
    CISA updated the Known Exploited Vulnerabilities catalog to version 2026.07.14 (count
    1642), adding four entries dated 2026-07-14. CVE-2026-56164 is a missing-authentication-for-critical-function
    flaw in Microsoft SharePoint Server that lets an unauthenticated attacker elevate privileges
    over the network, with a federal remediation due date of 2026-07-17. CVE-2026-15409 and
    CVE-2026-15410 are a server-side request forgery reachable pre-authentication and an authenticated
    administrator command-injection flaw in SonicWall SMA1000 appliances, both due 2026-07-17.
    CVE-2026-56155 is an access-control granularity flaw in Microsoft Active Directory Federation
    Services allowing local privilege elevation, due 2026-07-28.
  why: >-
    The three-day remediation window on the SharePoint and SonicWall entries signals active
    exploitation of internet-facing enterprise identity and access infrastructure, and SonicWall
    SMA1000 has a repeated history as an exploited edge target.
  sources:
  - label: CISA KEV catalog
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- title: Tailscale SSH argument injection let a crafted username dump the passwd file
  section: Security
  category: Security
  blurb: >-
    Tailscale SSH argument-injection via leading-dash usernames allowed getent to output the
    passwd file to authorized tailnet principals.
  summary: >-
    Tailscale published bulletin TS-2026-009 on 2026-07-13 for an argument-injection flaw
    in Tailscale SSH. The feature allowed usernames with leading hyphens, which were passed
    to `getent(1)` and interpreted as command-line flags. A principal already permitted in
    the tailnet ACL who connected with the username `-i` could make `getent` print the entire
    passwd file starting with root. It is fixed in version 1.98.9, which rejects usernames
    with leading dashes. No CVE was assigned and Tailscale reports no evidence of exploitation.
    The same day Tailscale disclosed TS-2026-008, a CPU-exhaustion flaw in Serve and Funnel
    triggered by malformed HTTP requests.
  why: >-
    Tailscale SSH is a drop-in alternative to OpenSSH inside a tailnet, so an operator who
    enabled it exposed local account data to anyone already authorized to connect.
  comments: >-
    HN commenter tptacek noted the bug is a venerable class going back to AIX 3. Another argued
    the proper fix is to separate arguments with `--` rather than only rejecting leading-dash
    usernames.
  sources:
  - label: Tailscale TS-2026-009
    url: https://tailscale.com/security-bulletins
  - label: HN 48915004
    url: https://news.ycombinator.com/item?id=48915004
