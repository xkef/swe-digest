date: '2026-07-15'
lede: >-
  Security flaws disclosed in Cursor, Claude.ai, Microsoft, and Tailscale, including unpatched
  code execution and memory exfiltration.
stories:
- title: >-
    Cursor executes a repository's git.exe without confirmation on Windows, unpatched after
    seven months
  section: Top stories
  category: Security
  blurb: >-
    Mindgard disclosed an unpatched Cursor flaw on Windows where a malicious git.exe in a
    repository root runs automatically with no prompt.
  summary: >-
    Mindgard published a full-disclosure write-up on 2026-07-14 for an unpatched arbitrary-code-execution
    flaw in the Cursor editor on Windows. When Cursor opens a project it searches for a Git
    binary across several locations including the workspace root, so a malicious `git.exe`
    placed in a repository root runs automatically with the user's privileges, without any
    prompt, and repeats on a cadence during normal editing. The root cause is the Windows
    executable-search behavior that resolves the current directory before system paths. The
    researcher reported it to Cursor on 2025-12-15 and through HackerOne on 2026-01-15, HackerOne
    confirmed delivery on 2026-01-20, and the flaw was still present through version 3.2.16
    as verified on 2026-04-30 with no substantive vendor response. No CVE has been assigned.
  why: >-
    A widely used AI editor runs an attacker-controlled binary on project open with no confirmation,
    and the only stated mitigations are OS-level allow-listing or opening untrusted repositories
    in a disposable VM.
  followup: >-
    Watch for a Cursor patch that restricts Git-binary resolution to trusted paths, a CVE
    assignment, and any exploitation reports.
  comments: >-
    HN commenters split on scope. Some read it as the long-known Windows current-directory
    search-order quirk that affects any IDE calling an unqualified binary name, comparable
    to a poisoned dotfile, while others note that agents with permission to clone repositories
    could pull a malicious repo autonomously and trigger mass exploitation.
  sources:
  - label: Mindgard write-up
    url: https://mindgard.ai/blog/cursor-0day-when-full-disclosure-becomes-the-only-protection-left
  - label: HN 48910676
    url: https://news.ycombinator.com/item?id=48910676
- title: Claude memory exfiltrated through web_fetch link-following prompt injection
  section: Top stories
  category: Security
  blurb: >-
    Ayush Paul showed Claude.ai memory exfiltration through web_fetch via a fake CAPTCHA with
    alphabetical links spelling out user data.
  summary: >-
    Security researcher Ayush Paul published a write-up on 2026-07-09 showing that Claude.ai's
    memory feature could be turned into a data-exfiltration channel through the `web_fetch`
    tool. A page disguised as a Cloudflare CAPTCHA instructed Claude to "verify" the user
    by navigating letter by letter through a series of attacker-controlled alphabetical links,
    so the sequence of URLs Claude fetched spelled out private data to the attacker's server.
    Claude leaked details it held in memory, including the user's full name, employer, and
    hometown, and in one case inferred the hometown from a hackathon name rather than a stored
    fact. Paul reported it to Anthropic through HackerOne. Anthropic said it had already identified
    the issue internally, awarded no bounty, and mitigated it by stopping `web_fetch` from
    following links on external pages, restricting navigation to web-search results and user-provided
    URLs.
  why: >-
    It shows that stored per-user memory combined with an autonomous fetch tool is an exfiltration
    surface, and the fix narrows a link-following capability that agent browsing workflows
    depend on.
  followup: >-
    Watch for a public Anthropic advisory or changelog note documenting the web_fetch restriction
    and whether other providers' memory-plus-fetch combinations are affected.
  comments: >-
    HN commenters criticized the absence of a bounty for a novel guardrail bypass and argued
    the safer design would read memory in a subagent without access to all stored memories.
    Others noted that running agents with broad tool and system access reproduces long-solved
    security mistakes.
  sources:
  - label: write-up
    url: https://www.ayush.digital/blog/the-memory-heist
  - label: HN 48916975
    url: https://news.ycombinator.com/item?id=48916975
- title: Dependabot adds a default cooldown before opening version-update pull requests
  section: Top stories
  category: Dev tools
  blurb: >-
    GitHub added a default package cooldown to Dependabot version updates, delaying version-update
    pull requests but not security patches.
  summary: >-
    GitHub announced on 2026-07-14 that Dependabot version updates now apply a default package
    cooldown, a waiting period after a release before Dependabot opens the update pull request.
    The default applies only to version updates. Security updates still open immediately,
    so patches for known vulnerabilities are not delayed. The cooldown is configurable in
    the Dependabot configuration.
  why: >-
    It changes the default supply-chain posture for every repository that relies on Dependabot
    version updates, favoring a delay that lets a compromised release be caught before it
    is auto-proposed.
  comments: >-
    HN commenters describe the change as trading a short exposure to a freshly published malicious
    release for a slightly longer window on unpatched non-security bugs, and note it depends
    on third-party scanners catching a bad package during the cooldown rather than on users
    hitting it in production.
  sources:
  - label: GitHub Changelog
    url: https://github.blog/changelog/2026-07-14-dependabot-version-updates-introduce-default-package-cooldown
  - label: HN 48913050
    url: https://news.ycombinator.com/item?id=48913050
- title: >-
    Bonsai 27B compresses a Qwen model to run on a phone with reported quality tradeoffs
  section: Top stories
  category: AI
  blurb: >-
    PrismML published Bonsai 27B, shrinking Qwen 3.6 from 54 GB to 3.8 GB through extreme
    quantization to ternary for on-device inference.
  summary: >-
    PrismML published Bonsai 27B, an extreme-quantization build of Qwen 3.6 27B that reduces
    most weights to ternary values with group-wise FP16 scales, reaching about 1.71 effective
    bits per weight and shrinking the model from roughly 54 GB in FP16 to about 3.8 GB. The
    stated goal is on-device inference on high-memory phones such as recent iPhone Pro models,
    with reported speeds near 1 token per second on consumer hardware. PrismML reports roughly
    90% capability retention versus the full model, stronger on math and code than a smaller
    Gemma build and weaker on knowledge, tool calling, and vision. Weights are posted publicly.
  why: >-
    Sub-2-bit quantization that fits a 27B-class model in under 4 GB pushes on-device inference
    further, but the reported loop behavior and perplexity gap show the accuracy cost is not
    yet settled.
  followup: >-
    Watch for independent perplexity and task benchmarks, the exact packing format, and reproduction
    of the on-device speed claim.
  comments: >-
    HN commenters report the model gets stuck in reasoning loops and cite an independent perplexity
    measurement well above the unquantized baseline, and question whether the packing format
    used is the most efficient ternary representation. The retention and speed figures are
    vendor claims and are not independently reproduced.
  sources:
  - label: PrismML write-up
    url: https://prismml.com/news/bonsai-27b
  - label: HN 48910545
    url: https://news.ycombinator.com/item?id=48910545
