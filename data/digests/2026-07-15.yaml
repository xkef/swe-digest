- title: Homebrew 6.0.11 adds a brew vulns command and OSV advisory export
  section: Developer tools
  category: Dev tools
  blurb: >-
    Homebrew 6.0.11 adds a `brew vulns` command and OSV advisory export, moving dependency
    scanning closer to the package install path.
  summary: >-
    Homebrew published 6.0.11 on 2026-07-14, a patch on the 6.0 line. It adds a `brew vulns`
    command and tooling to export OSV-format advisories for a Homebrew advisory database,
    extends cask metadata migration to JSON for all users, and fixes a `brew outdated --greedy`
    crash on installed casks without a URL. Performance changes start bottle downloads before
    dependency fetches and prewarm Bootsnap caches after `brew update`. No security fixes
    to Homebrew itself are listed.
  why: >-
    Building vulnerability lookup and advisory export into the default macOS and Linux package
    manager moves dependency scanning closer to the install path.
  sources:
  - label: GitHub release
    url: https://github.com/Homebrew/brew/releases/tag/6.0.11
- title: >-
    High-speed camera measurements find X11 and native Wayland input latency roughly equal
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Marco Nett measured X11 and native Wayland input latency both at 4 milliseconds, showing
    driver and compositor matter more than protocol.
  summary: >-
    A 2026-07 write-up by Marco Nett measured mouse-to-photon latency on Linux using a high-speed
    camera against a 500 Hz display across X11, native Wayland on KDE Plasma, Wayland with
    variable refresh rate, and XWayland. X11 and native Wayland both landed near 4 milliseconds,
    VRR was slightly lower, and XWayland added roughly 3 to 4 milliseconds. The author isolated
    graphics drivers, kernel settings, and compositor behavior across the runs.
  why: >-
    It puts numbers on a long-running X11-versus-Wayland latency argument and shows the compositor
    and driver, not the protocol label, drive the differences.
  comments: >-
    Commenters stress that latency is a property of a specific compositor rather than the
    Wayland protocol, that a few milliseconds is minor at 500 Hz but closer to a frame at
    60 Hz, and that the XWayland penalty likely reflects NVIDIA driver behavior rather than
    the protocol.
  sources:
  - label: write-up
    url: https://marco-nett.de/blog/measuring-input-latency-on-linux-x11-vs-wayland-vrr-dxvk
  - label: HN 48909424
    url: https://news.ycombinator.com/item?id=48909424
- title: S&P cuts Oracle to one notch above junk over AI datacenter debt
  section: Markets and companies
  category: Markets
  blurb: >-
    S&P cut Oracle to BBB- on AI datacenter debt, projecting fiscal 2027 capex of 90 to 95
    billion dollars with OpenAI accounting for half.
  summary: >-
    S&P Global lowered Oracle's long-term issuer credit rating one notch from BBB to BBB-
    on 2026-07-09, one step above junk, citing the debt and capital demands of its AI-infrastructure
    buildout, and the action reached the Hacker News front page on 2026-07-15. S&P raised
    its projected Oracle fiscal 2027 capital expenditure to about 90 to 95 billion dollars
    and its free-operating-cash-flow deficit to roughly negative 42 billion dollars, and flagged
    concentration risk from OpenAI accounting for about half of Oracle's remaining performance
    obligations. It surfaced alongside HN front-page threads on a SpaceX bond trading below
    its issue price and a Bank for International Settlements bulletin on financing the AI
    boom.
  why: >-
    Oracle Cloud Infrastructure is a primary compute supplier for large AI workloads, so the
    financing strain behind the buildout is a signal about the cost and sustainability of
    the AI datacenter capacity that engineering teams depend on.
  sources:
  - label: heise
    url: https://www.heise.de/en/news/S-P-downgrades-Oracle-to-BBB-only-one-notch-above-junk-level-11363472.html
