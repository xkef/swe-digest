- title: >-
    OpenAI says GPT-6.2 safeguards cut protected reasoning extraction from 54% to 0.2% in
    adaptive red-teaming
  section: Top stories
  category: AI
  blurb: >-
    OpenAI cut reasoning-extraction attacks on GPT-6.2 Astra to 0.2% and found exact traces
    teach a student more cyber skill than summaries.
  summary: >-
    OpenAI describes its defenses against adversarial distillation: adversarial training,
    input and output classifiers that also scan tool-call arguments, and API rules that tie
    protected reasoning to the conversation that produced it and drop it when an earlier message
    is rewritten. In adaptive black-box red-teaming, the success rate for extracting reasoning
    from an earlier request fell from 54.0% on GPT-6 Astra to 0.2% on GPT-6.2 Astra, and from
    22.9% to 0.9% for the current request. An internal study found a student fine-tuned on
    exact reasoning traces from coding and defensive security tasks generally beat one trained
    on reasoning summaries on ExploitBench and SEC-bench Pro.
  why: >-
    Clients that replay or edit conversation history should expect the API to discard reasoning
    after any rewritten message, and older model families can no longer read GPT-6.2 reasoning.
  background: >-
    Distillation trains a student model on a teacher model's outputs, and a chain-of-thought
    trace carries intermediate steps the final answer omits, which makes it richer training
    data. Providers therefore hide raw reasoning and return summaries or encrypted reasoning
    blobs that the client passes back so the model can continue its thinking across turns.
    OpenAI said in September that attackers moved such encrypted reasoning between conversations
    to get it decrypted, and it attributed part of that campaign to people tied to Moonshot
    AI.
  event: openai-adversarial-distillation-defenses
  sources:
  - label: primary
    url: https://openai.com/index/combatting-adversarial-distillation
  - label: discussion
