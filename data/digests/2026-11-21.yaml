stories:
- title: >-
    OpenAI says GPT-6.2 safeguards cut protected reasoning extraction from 54% to 0.2% in
    adaptive red-teaming
  section: Top stories
  category: AI
  blurb: >-
    OpenAI cut reasoning-extraction attacks on GPT-6.2 Astra to 0.2% and found exact traces
    teach a student more cyber skill than summaries.
  summary: >-
    OpenAI describes its defenses against adversarial distillation: adversarial training,
    input and output classifiers that also scan tool-call arguments, and API rules that tie
    protected reasoning to the conversation that produced it and drop it when an earlier message
    is rewritten. In adaptive black-box red-teaming, the success rate for extracting reasoning
    from an earlier request fell from 54.0% on GPT-6 Astra to 0.2% on GPT-6.2 Astra, and from
    22.9% to 0.9% for the current request. An internal study found a student fine-tuned on
    exact reasoning traces from coding and defensive security tasks generally beat one trained
    on reasoning summaries on ExploitBench and SEC-bench Pro.
  why: >-
    Clients that replay or edit conversation history should expect the API to discard reasoning
    after any rewritten message, and older model families can no longer read GPT-6.2 reasoning.
  background: >-
    Distillation trains a student model on a teacher model's outputs, and a chain-of-thought
    trace carries intermediate steps the final answer omits, which makes it richer training
    data. Providers therefore hide raw reasoning and return summaries or encrypted reasoning
    blobs that the client passes back so the model can continue its thinking across turns.
    OpenAI said in September that attackers moved such encrypted reasoning between conversations
    to get it decrypted, and it attributed part of that campaign to people tied to Moonshot
    AI.
  event: openai-adversarial-distillation-defenses
  sources:
  - label: primary
    url: https://openai.com/index/combatting-adversarial-distillation
  - label: discussion
    url: https://news.ycombinator.com/item?id=50581242
- title: >-
    WG21 recompletes C++26 in Búzios, keeping contracts and adding an always-enforced label
    for a second ISO ballot
  section: Top stories
  category: Languages
  blurb: >-
    The ISO C++ committee voted 111 to 9 to reship C++26 with contracts after five national
    bodies blocked the first approval ballot.
  summary: >-
    At its November 2026 meeting in Búzios, the committee answered national body comments,
    mostly on contracts, by adopting P4451R2, which lets pre, post and contract_assert be
    marked always enforced, and voted 111 in favor, 9 opposed and 8 abstaining to reship C++26
    with contracts. It also adopted C++26 fixes for reflection with modules, sender/receiver
    memory allocation and standard structural types, and added labeled break and continue,
    0o octal literals, std::ranges::any_view and views::slice to draft C++29. The updated
    document is expected to go to a second DIS ballot.
  why: >-
    C++26 keeps its name and contracts, and code that must never skip a check can now say
    so in source whatever contract semantics the build uses.
  background: >-
    C++26 contracts let a function declare preconditions (pre), postconditions (post) and
    in-body assertions (contract_assert), with the build choosing whether a violated check
    is ignored, observed or enforced. That per-build choice drew the main objection, since
    a library author could not guarantee a check runs. A DIS, or Draft International Standard,
    ballot is the ISO vote among national bodies. Sutter writes that past C++ DIS ballots
    had always passed unanimously, and this one failed after five national bodies voted Disapprove
    over contracts.
  followup: The second C++26 DIS ballot and the next WG21 meeting in Istanbul in March.
  thread: f-0215
  event: wg21-buzios-cpp26-recompletion
  sources:
  - label: primary
    url: https://herbsutter.com/2026/11/21/c26-is-done-again-trip-report-november-2026-iso-c-standards-meeting-buzios-brazil/
- title: >-
    Dragos canary prompts expose three breached AI inference providers and marketplace resellers
    harvesting prompts
  section: Security
  category: Security
  blurb: >-
    HD Moore's team seeded two million prompts with fake AWS keys and URLs, then watched attackers
    and resellers use them within hours.
  summary: >-
    From July to November 2026, Dragos sent about two million prompts carrying unique canary
    credentials and URLs to AI services and found attackers inside three hosting providers
    copying requests, including Zero Data Retention ones, then testing the AWS keys, searching
    S3, Secrets Manager and Parameter Store, enabling Bedrock and adding IAM users. One attacker
    added the ARTEX framework on 2026-11-01, with user agents artex-agent and artex-judge-r121.
    Marketplace resellers read prompts through ordinary request logging, and a Chinese lab's
    scraper fetched URLs from prompts sent to it directly or through US resellers, including
    ZDR requests.
  why: >-
    Treat any secret an agent sends to a routed or resold model endpoint as exposed, and plant
    a canary credential in agent context to detect leaks.
  background: >-
    AI routers expose one API endpoint and forward each request to a pool of model hosts,
    sometimes through further routers, so every hop sees the full prompt and response. Zero
    Data Retention is a per-account, per-key or per-request flag asking that prompts not be
    stored, and it only binds the hop that honors it. Canary tokens are unique secrets that
    exist in one place, so any use of one proves that place leaked.
  event: dragos-ai-inference-canary-research
  sources:
  - label: primary
    url: https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens
- title: >-
    Microsoft says attackers exploited an Entra Connect Health API flaw to read tenant admin
    emails and metadata
  section: Security
  category: Security
  blurb: >-
    A bug added on 2026-07-23 let outsiders read admin contact emails, tenant IDs and sync
    status from Connect Health until a fix on 2026-11-19.
  summary: >-
    Microsoft told affected admins that a vulnerability in the Entra Connect Health API, introduced
    on 2026-07-23 and found on 2026-11-09, was exploited for unauthorized read-only access
    to tenant metadata, including technical contact and administrator email addresses, tenant
    IDs, domains, license tiers, directory sync status and an expired agent registration certificate.
    It deployed a server-side fix on 2026-11-19 and finished its investigation on 2026-11-20.
    Microsoft says no passwords, tokens, valid keys or Azure subscription data were exposed
    and found no configuration changes, but has not said how many tenants were hit.
  why: >-
    Tenants that use Connect Health should expect targeted phishing of the exposed admin addresses
    and confirm their privileged accounts use phishing-resistant MFA.
  background: >-
    Entra Connect Health is a cloud service that monitors on-premises identity components,
    such as Entra Connect sync servers and AD FS, from the Entra admin center. Agents on those
    servers report to a Microsoft API, which here returned more tenant data than it should
    have to unauthorized callers. Microsoft published a PowerShell script that shows which
    metadata types could have been exposed, though it displays current values, not what was
    read.
  event: microsoft-entra-connect-health-metadata-exposure
  sources:
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/
- title: >-
    Upload2Shell: a Ghostscript Type 1 font use-after-free escapes -dSAFER and runs commands
    through file uploads
  section: Security
  category: Security
  blurb: >-
    A crafted Type 1 font escapes Ghostscript's -dSAFER sandbox, giving command execution
    through uploads, thumbnails and print queues.
  summary: >-
    pwn.ai says CVE-2026-125396, a use-after-free in Ghostscript's Type 1 font loader, lets
    a crafted document leave the -dSAFER sandbox and run commands as the rendering process.
    It confirmed execution in Debian 13 CUPS through an anonymous IPP job, Roundcube on message
    view, MediaWiki PdfHandler, DokuWiki, Mayan EDMS and public WordPress upload forms, and
    traced Pillow paths in Gradio, ComfyUI and Paperless-ngx. Ghostscript 10.08.0 fixed it
    on 2026-09-08, Debian and Ubuntu ship fixed packages, and the CVE was published on 2026-11-09
    as case studies begin.
  why: >-
    Any service that thumbnails, converts or prints user files can reach Ghostscript through
    ImageMagick or Pillow even for files named .png, so check the installed Ghostscript version
    on those hosts and images.
  background: >-
    Ghostscript interprets PostScript and PDF, and its -dSAFER mode is meant to block file
    and process access from document code. ImageMagick delegates PDF, EPS and PS decoding
    to Ghostscript, and Pillow calls it for EPS files, so an image upload pipeline can feed
    an attacker's PostScript to the interpreter based on file content rather than extension.
    Ghostscript sandbox escapes have recurred for years for this reason.
  comments: The Hacker News thread drew 55 points and 14 comments.
  event: ghostscript-upload2shell-cve-2026-125396
  sources:
  - label: primary
    url: https://pwn.ai/upload2shell
  - label: discussion
    url: https://news.ycombinator.com/item?id=50592097
- title: >-
    LookAtMyQuant packs Inkling-2-Mini into 5.4 GB at 1.63 bits per weight and runs it on
    Apple Silicon
  section: AI
  category: AI
  blurb: >-
    A quantization compiler packs Inkling-2-Mini into 5.4 GB at 1.63 bits per weight and beats
    a larger Unsloth quant on GSM8K and HumanEval.
  summary: >-
    LookAtMyQuant measures how much each compressed piece of a model hurts output KL, then
    assigns trellis codes per piece to fit a size budget, followed by proximal fine-tuning.
    Its 5.38 GB Inkling-2-Mini solves 134 of 200 GSM8K and 60 of 164 HumanEval problems against
    132 and 49 for Unsloth's 9.14 GB UD-Q2_K_XL, while the BF16 original scores 147 and 66.
    On an M5 Max the 5.4 GB file decodes at 75.3 tokens per second serially and 124.4 with
    a 4-bit drafter, in about 6 GB of RAM.
  why: >-
    Sensitivity-measured, per-row bit allocation shows that sub-2-bit local MoE models can
    stay usable on a laptop, with code to reproduce the recipe on your own model.
  background: >-
    Common GGUF quants such as Q4_K_M apply a fixed scheme per tensor type. Sensitivity-based
    allocation instead spends bits where compression hurts the output most, measured here
    by KL divergence from the original model's token distribution. Trellis codes are vector
    quantizers that encode a sequence of weights as a path through a small state machine,
    which gets closer to the ideal rate than scalar rounding.
  comments: The Hacker News thread drew 277 points and 56 comments.
  event: lookatmyquant-inkling-2-mini-quantization
  sources:
  - label: primary
    url: https://github.com/ShinMegamiBoson/lookatmyquant
  - label: discussion
    url: https://news.ycombinator.com/item?id=50591853
- title: >-
    APM 0.37.0 writes lockfile version 4, moves Copilot MCP servers to a shared .mcp.json
    and pins approvals to content
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    APM 0.37 writes lockfile version 4 that older clients refuse, moves Copilot MCP servers
    to a shared .mcp.json and pins approvals to content.
  summary: >-
    APM 0.37.0 writes lockfile_version 4, which APM 0.36.1 and older refuse, so every machine
    and CI runner must upgrade together. Copilot project MCP servers move to a root .mcp.json
    shared with Claude Code, apm approve pins each package's hooks, MCP servers and native
    plugins to their content, and apm audit --ci now fails MCP servers the lockfile admits
    but apm.yml does not approve. In CI, apm install with a committed lockfile now verifies
    it like --frozen, and apm install -g --target claude installs Claude plugins natively.
  why: >-
    Teams using APM need a coordinated upgrade, must replace --trust-transitive-mcp with apm
    approve, and should review the shared .mcp.json because Claude Code ignores tools allow-lists.
  background: >-
    Agent Package Manager declares the skills, prompts, hooks and MCP servers a repository
    gives its coding agents, then locks and deploys them for each harness. Version 0.36.0
    added host-qualified dependency policies. Pinning approvals to content means a package
    that changes what it runs has to be approved again.
  event: apm-0-37-0-release
  sources:
  - label: primary
    url: https://github.com/microsoft/apm/releases/tag/v0.37.0
- title: >-
    folke releases zaly, an alpha terminal coding agent with persistent sessions, permission
    presets and TypeScript plugins
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    The lazy.nvim and snacks.nvim author's agent resumes sessions per workspace, masks large
    tool results and loads skills and plugins.
  summary: >-
    zaly is MIT licensed, installs as @zaly/cli with npm or Bun and needs Node.js 22.18 or
    newer. It offers strict, readonly, permissive and yolo permission presets refined by per-tool
    allow, ask and deny rules, mid-session model switching across providers, background tasks
    for long-running tools, compaction, automatic masking of large tool results, and user
    or project scoped commands, skills, resource packs, themes and TypeScript plugins. The
    latest release is 0.3.3 on 2026-11-18, and the README warns that APIs, configuration and
    session formats may change before 1.0.
  why: >-
    LazyVim users get a hackable terminal agent from the same author, with per-tool permission
    rules and plugins scoped to user or project.
