- title: >-
    Essay saying AI turned developers into architects without telling them draws 483 points
    on Hacker News
  section: Hacker News
  category: Pulse
  blurb: >-
    A 15-second welcome screen caused by AI-written logging code starts a debate over who
    designs systems when agents write the code.
  summary: >-
    Mani Doraisamy describes an AI-written logging path in a Google Forms add-on that chained
    identity lookups and delayed the welcome screen by 15 seconds. He argues that agents do
    what the requirements say without pushing back, so developers now have to define the architecture
    and data model and hold the agent to it. The Hacker News thread reached 483 points and
    269 comments.
  why: >-
    It names a failure mode in agent-written code: performance and data model choices get
    made silently when the prompt only states requirements.
  comments: >-
    Many commenters say pushing back on requirements and designing the data model was always
    the engineer's job. Others report juniors who want line-level tickets, and say writing
    a ticket that detailed takes as long as doing the work, more so with agents. Several warn
    that AI lets weak architects ship their designs without pushback.
  event: developers-promoted-to-architects-essay
