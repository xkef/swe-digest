- title: >-
    Lean and Mathlib communities certify Levent Alpöge's 17-million-line Lean proof of the
    Riemann Hypothesis
  section: Hacker News
  category: Pulse
  blurb: >-
    Several independent kernels accepted the exported proof, and two tools confirmed it proves
    exactly Mathlib's statement of the hypothesis.
  summary: >-
    On 2026-11-21 the Lean and Mathlib communities, with backing from the Lean FRO and the
    Mathlib Initiative, said they have full confidence in the Lean library Alpöge released
    on 2026-11-20. Dozens of people reproduced the build. Two comparison tools matched the
    proved theorem against Mathlib's RiemannHypothesis definition, and the raw export passed
    Lean's kernel plus the formally verified con-leche and con-ron checkers. Andrew Sutherland's
    MIT verification page reports 175,187 modules compiled, only the three standard axioms
    used, and the independent Rust kernel nanoda accepting the 61 GB export, and notes that
    the result also covers GRH for Dirichlet L-functions.
  why: >-
    A machine-checked proof at this scale shows that independent, small, verified kernels
    can make AI-generated formal artifacts trustworthy without line-by-line human review.
  background: >-
    Lean is a proof assistant built on dependent type theory. A small trusted kernel checks
    every proof term, so trust rests on the kernel and on the definitions, not on the code
    that produced the proof. Mathlib is the community library of formalized mathematics, and
    its definitions are reviewed by experts. Exporting a proof and re-checking it with kernels
    written separately, some in other languages, guards against a bug in any one checker.
  comments: >-
    The thread drew 578 points and 442 comments, and related threads followed: Fernando Borretti's
    essay Re: Riemann at 208 points and 216 comments, and the MIT verification files at 50
    points. Commenters said a kernel bug is now unlikely because the export passed several
    kernels, two of which carry their own consistency proofs. One recalled that a fake Collatz
    refutation once got past a single checker. Others noted that soundness ultimately rests
    on Lean's type theory and the ZFC axioms with inaccessible cardinals.
  event: lean-community-certifies-riemann-hypothesis-proof
