- title: >-
    Alpöge and Buckmaster post AI-assisted, Lean-formalized blowup proofs for 3D Euler and
    Navier-Stokes
  section: Hacker News
  category: Pulse
  blurb: >-
    Terence Tao flags AI-assisted proofs of finite-time singularities for 3D Euler and Navier-Stokes,
    both with Lean formalizations, on one day.
  summary: >-
    Terence Tao writes that Levent Alpöge, Tristan Buckmaster and Matei Coiculescu, with heavy
    AI help, wrote a human-readable proof of finite-time blowup for the unforced 3D incompressible
    Euler equations, and that Alpöge and Buckmaster produced a Navier-Stokes blowup proof
    that still needs a professional write-up. The Navier-Stokes repository holds a 79-page
    paper and a Lean 4 package of about 2,270 files and 600,000 lines, while the numerical
    certificate and its interval-arithmetic check are not yet released. Tao's post drew 473
    points and 195 comments on Hacker News and the repository 299 points and 93 comments,
    alongside Scott Aaronson's post on the RH claims at 309 points and 272 comments.
  why: >-
    Large Lean artifacts are becoming the unit of AI-assisted research, and checking them
    raises the same trust questions as reviewing agent-written code.
  background: >-
    Navier-Stokes regularity is a Clay Millennium problem asking whether smooth 3D fluid flows
    can develop singularities in finite time. Tao says the proof follows an expected route:
    numerically build an approximate discretely self-similar solution, then use rigorous perturbation
    theory to turn it into an exact one. Lean is a proof assistant whose kernel checks every
    step, so the question shifts to whether the formal statements say what the paper claims.
  comments: >-
    Commenters debate whether AI can build new mathematical abstractions or only brute-force
    with existing ones such as the Langlands program. One user reports a Fable-family model
    confidently misexplaining their codebase, as a caution against reading fluency as understanding.
  event: alpoge-buckmaster-euler-navier-stokes-blowup
