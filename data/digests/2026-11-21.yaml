- title: >-
    Luau 0.748 blocks type function globals from leaking into inference and fixes inlined
    functions clobbering captures
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Luau 0.748 keeps type function globals out of inference, fixes inlined functions clobbering
    captures and lets NCG move constant loads.
  summary: >-
    Luau 0.748 fixes a class of bugs where globals assigned inside sandboxed type functions
    could be inferred in ordinary code, and reverts LuauDecomposeIntersectionOfFreeType, which
    fixes two issues and reopens two others. The runtime fixes inlined functions that could
    clobber captured values, and native code generation can now move loads of immutable data
    such as constants between blocks when safe. Embedded builtin definitions for the type
    solver now use builder methods instead of declaration strings.
  why: >-
    Embedders running Luau with type functions or native codegen get a correctness fix for
    inlining and a stricter type function sandbox.
  event: luau-0-748-release
  sources:
  - label: primary
    url: https://github.com/luau-lang/luau/releases/tag/0.748
- title: >-
    iroh 1.5.0 adds stream affinity to pin data to direct paths and freezes features until
    January for security work
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The Rust peer-to-peer networking stack lets a stream stick to one direct path or block,
    and fixes relay handshake and log leaks.
  summary: >-
    iroh 1.5.0, released 2026-11-19 with noq 1.5.0, adds StreamAffinity Any, Sticky and Block
    on send streams and wait_any, wait_none and wait_closed helpers for watching paths. It
    fixes a relay handshake that clients could hold open past the timeout and proxy passwords
    in debug logs (GHSA-9v2v-w4v3-3qqq), updates iroh-dns-server, and accepts relay URLs with
    a path prefix. The team will ship only patch releases until January while it hardens iroh
    against AI bug finding.
  why: >-
    Apps on iroh can keep costly or sensitive streams off relays, and relay operators should
    upgrade for the handshake timeout fix.
  background: >-
    iroh connects devices directly over QUIC, falling back to relay servers when a direct
    path cannot be established, and a connection can hold a relay path and several direct
    paths at once. Until this release the connection alone picked which path carried each
    stream's data.
  event: iroh-1-5-0-release
  sources:
  - label: primary
    url: https://www.iroh.computer/blog/iroh-1-5-0
- title: >-
    Sashiko 0.9.5 adds a performance review stage that catches 14 of 20 known kernel regressions,
    up from 3
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Google's agentic kernel patch reviewer gains an optional stage that traces side effects
    of patches and flags likely throughput regressions.
  summary: >-
    Sashiko 0.9.5 adds an optional performance specialist stage to its linux_patch_review
    flow, run in daemon mode or with sashiko review --stages performance, which traces callers
    and embedding structs one to two hops out and forbids dismissing hot-path costs. On a
    40-commit benchmark of 20 upstream regressions and 20 clean commits, using gemini-4-argon
    at high effort, detection rose from 3 of 20 to 14 of 20, the clean rate went from 11 of
    20 to 12 of 20, and median input tokens rose 11%.
  why: >-
    Kernel and systems teams get a measured, opt-in way to have AI review flag performance
    regressions that usually hide in ordinary fixes and struct layout changes.
  background: >-
    Sashiko is Google's open-source agentic reviewer for Linux kernel patches, which reviews
    mailing list submissions and which Torvalds says many subsystems now require. Kernel performance
    regressions often arrive as side effects of correctness fixes, such as a lock added on
    a hot path or a struct field that changes cache line layout, which line-level review tends
    to miss.
  event: sashiko-0-9-5-performance-review-stage
  sources:
  - label: discussion
    url: https://www.phoronix.com/news/Sashiko-AI-Performance-Review
- title: >-
    gopgext builds PostgreSQL extensions from plain Go through TinyGo, with contrib ports
    passing upstream tests
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    gopgext compiles plain Go with TinyGo into PostgreSQL extensions, and its ports of pgcrypto
    and hstore pass upstream regression tests.
  summary: >-
    gopgext turns Go functions marked with a //gopgext:function comment into SQL functions,
    generating the C glue, install script and control file and building with PGXS. Beyond
    functions it supports triggers, aggregates, GiST, GIN, SP-GiST and BRIN operator classes,
    index access methods, foreign data wrappers and hooks, and ports of pgcrypto, hstore,
    pg_stat_statements and cube pass upstream regression tests. The author marks it experimental
    and warns against production use, since a bug runs inside the server.
  why: >-
    It offers a Go path for PostgreSQL extension work that has so far meant C or Rust with
    pgrx, though it is not yet safe for production servers.
  background: >-
    PostgreSQL extensions are shared libraries loaded into each backend process, so they share
    memory and error handling with the server. PostgreSQL reports errors with longjmp, which
    must not unwind through another language's stack frames. gopgext says it keeps those errors
    out of Go frames and copies results into PostgreSQL memory.
  comments: The Hacker News thread drew 98 points and 11 comments.
  event: gopgext-postgres-extensions-go
  sources:
  - label: primary
    url: https://jespino.github.io/gopgext/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50591260
- title: >-
    Antithesis uses Claude, TLA+ and trace validation to prove models of etcd-raft and HashiCorp
    Raft safe
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Agent-written TLA+ models of two production Raft libraries were checked against real test
    traces, then proved in Lean, finding new bugs.
  summary: >-
    Antithesis had Claude Fable 5.2 infer TLA+ models of etcd-raft and HashiCorp Raft, checked
    them against structured traces from fault-injected Antithesis runs, and proved Election
    Safety, Log Matching, Leader Completeness and State Machine Safety in Lean via Veil and
    then in TLAPS. The loop found known and new bugs, including hashicorp/raft#746 and etcd-io/raft#558,
    and needed 7 patches across the two libraries. Each library cost under $1,200 in model
    tokens and about 2,000 Antithesis compute-hours, and lease reads, async heartbeats and
    HashiCorp membership changes were left unmodeled.
  why: >-
    Trace validation gives a practical way to check that a formal spec matches the code you
    run, and agents now make writing and proving those specs affordable.
  background: >-
    Raft is proven correct on paper, but libraries add pre-votes, snapshots, leadership transfer
    and membership changes that the original proof does not cover. Trace validation, described
    in MongoDB's eXtreme Modeling in Practice paper, logs events from the real system and
    checks that each trace is a legal behavior of the spec, so a divergence points to a modeling
    error or a code bug. The proofs still cover the model, not the Go code itself.
  event: antithesis-raft-formal-verification
  sources:
  - label: primary
    url: https://antithesis.com/blog/2026/verifying-formal-models/
- title: >-
    Enroute replaces Multi-Raft with Raft replication plus Vertical Paxos failover to host
    300,000 repositories per cluster
  section: Engineering posts
  category: Engineering post
  blurb: >-
    The Git hosting startup dropped per-group Raft consensus for a simpler design, aiming
    at agent and app-builder workloads with millions of repos.
  summary: >-
    Enroute, which hosts Git for agent-heavy workloads, says its 0.4.0 release replaces its
    Multi-Raft system with a design that keeps Raft-style replication but uses Vertical Paxos
    for failover. It says this keeps complexity low while scaling one cluster to up to 300,000
    repositories. An earlier post described a single repository passing 7,600 pushes per second.
  why: >-
    Forge builders weighing per-repository consensus groups get a worked alternative that
    moves reconfiguration out of each replica group.
  background: >-
    Multi-Raft runs many independent Raft groups, one per shard, so each group elects its
    own leader and carries its own heartbeats and logs, which adds overhead as shard counts
    grow. Vertical Paxos, described by Lamport, Malkhi and Zhou, lets an external configuration
    master choose the replica set and leader for each shard, so replicas only replicate and
    the master handles failover. This is the same split that primary-backup systems use with
    a separate coordination service.
  event: enroute-beyond-multi-raft
  sources:
  - label: primary
    url: https://enroute.sh/blog/scaling-horizontally-how-we-moved-beyond-multi-raft
- title: >-
    Studio Display hub latency caps an RTL8156B USB Ethernet adapter near 2 Gbps because it
    sends 4-packet bursts
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A debugging write-up traces 600 Mbps downloads to USB 3 burst size plus hub go-ahead latency,
    which an 8-packet RTL8157 avoids.
  summary: >-
    Oscar Molnar found that a 2.5G RTL8156B adapter plugged into a Studio Display XDR downloaded
    at 600 Mbps while uploading at 2.4 Gbps, and its counters showed frames to the Mac flattening
    near 168,000 per second with drops above that. He attributes it to four 1 KB USB packets
    per burst, where about 7.6 µs of go-ahead latency through the display hub plus 8.2 µs
    of transfer drains slower than 2.5 Gbps arrives. Realtek's driver raised downloads to
    1.1 Gbps, Ethernet flow control to about 2 Gbps, and an RTL8157 adapter with 8-packet
    bursts dropped no frames.
  why: >-
    When a USB NIC behind a dock or hub only underperforms on download, check its bMaxBurst
    and its drop counters before blaming the link.
  comments: >-
    The post drew 226 points and 98 comments on Hacker News. One commenter reports the same
    loss on MacBooks across several Thunderbolt docks, gone over a plain USB cable. Another
    says Ghostty's io_uring use counted as I/O pressure and made Baldur's Gate 3 throttle
    shader compilation until Ghostty was set to epoll.
  event: studio-display-usb-ethernet-burst-throttle
  sources:
  - label: primary
    url: https://blog.tymscar.com/posts/studiodisplayethernet/
  - label: discussion
