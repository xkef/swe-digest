- title: >-
    Ravi Vakil posts Alessandro Masullo's human GRH proof draft, and AI-assisted readers report
    problems within hours
  section: Hacker News
  category: Pulse
  blurb: >-
    Ravi Vakil posted Alessandro Masullo's GRH proof draft, and within hours mathematicians
    using AI models reported problems in it.
  summary: >-
    On 2026-11-20 Ravi Vakil posted a draft proof of the Generalized Riemann Hypothesis by
    Alessandro Maria Masullo, which Brian Conrad had checked for months and which Vakil says
    used no AI. About eight hours later Vakil added that several people reported problems
    found with the help of different AI models, and that all issues must be resolved before
    the proof is accepted. The Hacker News thread reached 1,951 points and 895 comments, alongside
    threads on Terence Tao's post (422 points), Scott Aaronson's post (274 points, 246 comments)
    and Fernando Borretti's response (193 points, 190 comments).
  why: >-
    It is a live test of AI models as proof checkers, a day after a separate Claude-assisted
    claim on the same problem.
  comments: >-
    The top thread is less about the mathematics than about access, with users worried that
    intellectual work now depends on frontier AI accounts that providers can suspend, and
    others answering that open-weight models keep that risk in check.
  event: masullo-grh-proof-draft
