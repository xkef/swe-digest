- title: >-
    Reflection's Beam technical report details a 501B MoE post-trained with four weeks of
    asynchronous RL on 10.5K GPUs
  section: ML research
  category: Paper
  blurb: >-
    Reflection's Beam report describes a 501.3B MoE with 23.4B active parameters, a 1M context
    and RL over 100M rollouts on 10.5K GB300 GPUs.
  summary: >-
    Beam is a sparse MoE with 501.3B total and 23.4B active parameters, pretrained on 23.8T
    tokens, with a 1M-token context from a two-stage midtraining phase. Post-training ran
    fully asynchronous RL across 10.5K GB300 GPUs for four weeks and over 100M rollouts, and
    the team reports capabilities still rising with RL compute. It ships with FP8 and NVFP4
    quantization and a 1.93B-parameter speculative decoding drafter, and refuses or pivots
    on 88.9% of harmful requests while complying with 81.5% of harmless ones.
  why: >-
    It is a rare first-party account of large-scale asynchronous RL post-training and serving
    co-design for a coding and agent model.
  background: >-
    In a mixture-of-experts model a router sends each token to a few expert subnetworks, so
    active parameters per token are a small share of the total, which cuts inference compute.
    Asynchronous RL decouples rollout generation from training updates so slow agent episodes
    do not stall the GPUs, at the cost of training on slightly stale policies. Speculative
    decoding uses a small drafter to propose tokens that the large model verifies in one pass.
  event: reflection-beam-technical-report
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.26358v1
- title: >-
    Paper: fixed steering vectors recover most of RL post-training's gains in diffusion transformers
  section: ML research
  category: Paper
  blurb: >-
    Fixed steering vectors with 65x fewer parameters than a LoRA recover 90 to 96% of the
    reward gains RL gives image diffusion models.
  summary: >-
    The authors fit a fixed set of vectors added to block outputs of a frozen base model to
    match the velocity predictions of public RL-tuned checkpoints, using no reward. On SD3.5-M
    the vectors hold 0.29M parameters against 18.8M for the RL-tuned LoRA, recover 90.0 to
    96.3% of the reward gains of six RL-tuned image models, and recover 89.8% and 111.9% on
    two video models. Trained from zero with online RL, the vectors alone beat weight-based
    RL on OCR and PickScore.
  why: >-
    It suggests most RL post-training gains in these models are a constant shift toward what
    the base model can already compute, which bears on cheaper post-training and on interpretability.
  background: >-
    Activation steering adds a fixed vector to a layer's hidden states at inference to push
    the model toward a behavior without changing its weights. RL post-training of diffusion
    models optimizes rewards such as text-rendering accuracy or human-preference scores, usually
    through LoRA adapters.
  event: rl-diffusion-activation-steering-paper
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.26627v1
- title: >-
    mise 2026.11.12 adds mise audit and mise upgrade --vulnerable, checking configured tools
    against OSV.dev
  section: Developer tools
  category: Dev tools
  blurb: >-
    mise can now list known advisories for every tool version a project pins, fail CI on them,
    and upgrade only the affected tools in range.
  summary: >-
    mise audit checks each configured tool version against OSV.dev and exits 1 when it finds
    advisories, with --json output and a list of tools it could not check. mise upgrade --vulnerable
    upgrades only affected tools within the configured range unless --bump is given. The release
    also adds a per-tool bump = false option, mise prune --system, and an unsupported_platforms
    list in mise.lock so lock --check passes for platforms a tool has no build for.
  why: >-
    A mise-managed repo can gate CI on vulnerable tool pins without a separate scanner, as
    long as its tools come from covered backends.
  background: >-
    OSV.dev is Google's open vulnerability database that aggregates advisories from GitHub,
    RustSec, PyPI, npm and others under one schema keyed by package and version. mise covers
    registry backends such as npm, cargo and pipx, GitHub and GitLab release tools matched
    by repository and tag, and core tools such as node, python and go. Tools from private
    registries are reported as not checked rather than clean.
  event: mise-2026-11-12-release
  sources:
  - label: primary
    url: https://github.com/jdx/mise/releases/tag/v2026.11.12
- title: A jj workflow keeps TODOs as empty private commits instead of a TODO.md file
  section: Developer tools
  category: Dev tools
  blurb: >-
    Ben C keeps planned work as a tree of empty jj changes, rebases one onto real work when
    starting it and keeps them local.
  summary: >-
    The post creates empty jj changes with descriptions for planned work, stacks dependent
    TODOs as empty commits on top of each other, and rebases one onto other work when starting
    it. Because the TODO changes are empty, rebasing the TODO base forward never conflicts.
    Setting git.private-commits to description('private:*') stops jj from pushing them.
  why: >-
    jj users can track planned work in the commit graph without an in-tree file, and private-commits
    keeps those changes off the remote.
