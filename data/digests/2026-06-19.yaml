- title: >-
    Researcher catalogs about 10,000 GitHub repositories distributing Trojan archives
  section: Top stories
  category: Security
  blurb: >-
    Roughly 10,000 look-alike GitHub repositories copy real commit history and profiles, then
    serve trojanized archives that evade URL scanning.
  summary: >-
    A 2026-06-18 write-up describes roughly 10,000 fresh non-fork GitHub repositories that
    copy a legitimate repo's commit history and contributor profiles, then push periodic "Update
    README.md" commits pointing at a trojanized zip. The archive URLs scan clean on VirusTotal
    while the zip itself flags as a Trojan. The author found them by filtering GHArchive events
    for commit-frequency and README-only patterns and published a detection script. Some repositories
    persisted for over a year; GitHub does not auto-remove them.
  why: >-
    Developers searching GitHub for tools can land on look-alike repositories whose payloads
    evade URL-based scanning, extending the supply-chain risk seen in recent npm and AUR campaigns.
  followup: >-
    Track GitHub takedowns and any broader attribution. Tracked in `memory/followups.md`.
  comments: >-
    HN commenters note the true count likely exceeds 10,000 because of API limits and discuss
    the reputational-laundering technique of cloning real contributor profiles.
  sources:
  - label: orchidfiles.com write-up
    url: https://orchidfiles.com/github-repositories-distributing-malware/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48583928
