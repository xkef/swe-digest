- title: American Express details a cell-based architecture for payment resilience
  section: Engineering posts
  category: Engineering post
  blurb: >-
    American Express runs payments on independent cells, each with its own microservices and
    databases, routing by deterministic data locality.
  summary: >-
    Benjamin Cane describes how American Express runs core payments on independent cells,
    each holding its own microservices, databases, and infrastructure. Static reference data
    is replicated to every cell to avoid synchronous lookups; a Global Transaction Router
    is the only cross-cell path and routes by deterministic data locality. On a mid-transaction
    cell failure, the system reroutes and restarts in a healthy cell with idempotency keys
    rather than resuming across boundaries, and critical-path components avoid blocking on
    logging or config.
  why: >-
    It is a concrete, production account of bounding failure domains and preserving predictable
    latency in a high-volume payments system.
  sources:
  - label: americanexpress.io
    url: https://americanexpress.io/cell-based-architecture-for-resilient-payment-systems/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48547969
