- title: AMD removes TSME memory encryption from consumer Ryzen CPUs in firmware
  section: Security
  category: Security
  blurb: >-
    AGESA 1.2.7.0 firmware disabled Transparent Secure Memory Encryption on consumer Ryzen
    parts while leaving BIOS toggle visible but inert.
  summary: >-
    AGESA 1.2.7.0 firmware disabled Transparent Secure Memory Encryption (TSME) on consumer
    Ryzen parts while leaving the BIOS toggle visible but inert. The flag DfIsTsmeEnabled
    is set FALSE for consumer parts and TRUE for PRO and EPYC. TSME encrypts all RAM under
    firmware control, blocking cold-boot, DRAM-snooping, and module-removal attacks. AMD's
    first explicit statement says TSME is a feature for PRO CPUs under AMD PRO Technologies,
    despite AMD engineers having recommended it on consumer parts in 2020 and 2025.
  why: >-
    A silently removed hardware memory-encryption protection leaves consumer Ryzen users exposed
    to physical-access attacks they may believe are mitigated.
  followup: >-
    Watch for an AMD revert, documentation, or an AGESA update restoring TSME. Tracked in
    `memory/followups.md`.
  sources:
  - label: Tom's Hardware
    url: https://www.tomshardware.com/pc-components/cpus/amd-silently-removes-memory-encryption-from-consumer-ryzen-cpus-leaving-users-unaware-that-they-may-be-vulnerable-security-feature-vanishes-after-newer-agesa-firmware-amd-engineers-go-radio-silent-when-pressed-about-the-change
