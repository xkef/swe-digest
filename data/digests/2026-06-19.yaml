- title: TypeScript 7.0 reaches release candidate with the native Go compiler
  section: Top stories
  category: Languages
  blurb: >-
    TypeScript 7.0 RC rewrites the bootstrapped compiler to Go, achieving roughly 10x speedup,
    with config defaults breaking existing projects.
  summary: >-
    Microsoft published the TypeScript 7.0 release candidate on 2026-06-18. 7.0 is the compiler
    rewritten from the bootstrapped TypeScript codebase to Go, and the team reports it is
    often about 10 times faster than 6.0. Install is `npm install -D typescript@rc`; a stable
    release is planned within a month, with stable programmatic APIs arriving in 7.1 several
    months later. Breaking changes include `rootDir` defaulting to `./` instead of inference,
    `types` defaulting to `[]` instead of auto-loading `@types` packages, and removal of `target`
    `es5` plus the `node`/`node10` module resolution modes.
  why: >-
    The native compiler cuts type-checking and build times across the JavaScript ecosystem,
    and the changed config defaults create migration work for existing projects.
  followup: >-
    Watch for the 7.0 stable release within a month and the 7.1 stable programmatic API.
  sources:
  - label: TypeScript blog
    url: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0-rc/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48586001
- title: MCP Enterprise-Managed Authorization extension reaches stable
  section: Top stories
  category: Agentic coding
  blurb: >-
    MCP Enterprise-Managed Authorization stabilizes, letting organizations control which MCP
    servers employees access through their IdP.
  summary: >-
    The Model Context Protocol project marked its Enterprise-Managed Authorization (EMA) extension
    stable. EMA lets an organization centrally control which MCP servers employees may connect
    to through the corporate identity provider, replacing per-user, per-server OAuth prompts
    with a single sign-in governed by IdP policy. The post reports Anthropic implemented EMA
    in its shared MCP layer across Claude, Claude Code, and Cowork; VS Code added IDE support;
    and Asana, Atlassian, Canva, Figma, Granola, Linear, and Supabase support it, with Slack
    adding it.
  why: >-
    Centralized IdP control over MCP server access removes a per-user authorization bottleneck
    and gives security teams a governance point for agent tool access in the enterprise.
  followup: >-
    Track which additional MCP servers and clients implement EMA and whether the extension
    stays stable through the next spec revision.
  sources:
  - label: Model Context Protocol blog
    url: https://blog.modelcontextprotocol.io/posts/enterprise-managed-auth/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48592163
