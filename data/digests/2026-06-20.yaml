- title: GPT-5.5 versus GLM-5.2 hallucination post drives benchmark-methodology debate
  section: Hacker News
  category: AI
  blurb: >-
    A blog post claims GPT-5.5 hallucinates more than GLM-5.2 using the AA-Omniscience benchmark,
    but HN commenters dispute the methodology.
  summary: >-
    A blog post (377 points) cites the Artificial Analysis AA-Omniscience benchmark to claim
    GPT-5.5 answers incorrectly far more often than the MIT-licensed GLM-5.2 when it lacks
    knowledge, arguing larger models are worse at saying "I do not know." The benchmark scores
    correct answers +100, incorrect answers -100, and abstentions 0.
  why: >-
    Hallucination-rate comparisons hinge on benchmark design, and the conditional metric undercuts
    a simple "bigger is worse" conclusion when teams pick coding and assistant models.
  comments: >-
    HN commenters dispute the framing. The hallucination rate is conditional on the model
    not knowing the answer, so it does not compare across models with different base accuracy;
    scoring that rewards only correct answers incentivizes guessing over abstaining; and raw
    parameter count is confounded by training method, inference-time compute, and quantization.
  sources:
  - label: blog post
    url: https://arrowtsx.dev/bigger-models/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48600167
