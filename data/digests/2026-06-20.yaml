- title: 'Dan Abramov: there are no instances in ATProto'
  section: Top stories
  category: Engineering post
  blurb: >-
    Dan Abramov argues AT Protocol separates hosting from app aggregation, letting users swap
    providers independently like RSS readers.
  summary: >-
    In a post dated 2026-06-19, Dan Abramov argues the AT Protocol separates hosting from
    app aggregation, more like RSS and feed readers than Mastodon-style federated instances.
    Users can swap hosting providers independently while multiple apps project over shared
    data, so decentralization does not require many copies of one app and avoids instance-level
    network-effect lock-in.
  why: >-
    The framing clarifies a recurring architecture question for developers evaluating decentralized
    social protocols and where account portability actually lives.
  sources:
  - label: overreacted.io
    url: https://overreacted.io/there-are-no-instances-in-atproto/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48599515
