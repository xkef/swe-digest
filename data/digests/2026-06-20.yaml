- title: Google Workspace begins steering Firefox users toward Chrome
  section: Top stories
  category: Dev tools
  blurb: >-
    Google Workspace shows Firefox users a device-security prompt urging them to download
    Chrome, but Firefox access remains functional.
  summary: >-
    A practitioner write-up dated 2026-06-18 reports Google Workspace now shows Firefox users
    a device-security remediation prompt urging them to download Chrome and sign in with their
