- title: >-
    Splunk Enterprise CVE-2026-20253 active exploitation, federal deadline 2026-06-21
  section: Top stories
  category: Security
  blurb: >-
    Splunk Enterprise vulnerability allows unauthenticated file writes on the network with
    a federal remediation deadline of 2026-06-21.
  summary: >-
    CVE-2026-20253 (CVSS 9.8) is a missing-authentication flaw on a Splunk Enterprise PostgreSQL
    sidecar service endpoint that lets an unauthenticated, network-reachable attacker create
    or truncate arbitrary files, chainable to DoS or RCE. Splunk and Resecurity confirmed
    active in-the-wild exploitation. CISA added it to the KEV catalog on 2026-06-18 with a
    federal remediation deadline of 2026-06-21. Affected: 10.0.0-10.0.6 and 10.2.0-10.2.3;
    patched in 10.0.7, 10.2.4, and 10.4.0.
  why: >-
    Splunk Enterprise is core SOC and SIEM infrastructure, so an unauthenticated file-write
    reachable over the network gives attackers a direct path into the monitoring layer.
  comments: >-
    watchTowr published technical analysis and a neutered proof-of-concept on 2026-06-12,
    and public Nuclei detection templates followed. Splunk confirmed on 2026-06-15 that disabling
    the PostgreSQL sidecar service mitigates the flaw with some loss of functionality.
  sources:
  - label: Splunk SVD-2026-0603
    url: https://advisory.splunk.com/advisories/SVD-2026-0603
  - label: Horizon3.ai
    url: https://horizon3.ai/attack-research/vulnerabilities/cve-2026-20253/
  - label: Help Net Security
    url: https://www.helpnetsecurity.com/2026/06/19/splunk-vulnerability-cve-2026-20253-exploited/
  - label: CISA KEV
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- title: >-
    GitHub availability strained by AI coding traffic as Microsoft pursues multi-cloud scaling
  section: Top stories
  category: Infrastructure
  blurb: >-
    GitHub logged nine incidents in May as AI coding agents drive traffic toward 275 million
    commits per week, straining availability.
  summary: >-
    The Register reports GitHub logged nine service-degrading incidents in May 2026 and is
    running below the 99.9 percent enterprise availability threshold as AI coding agents drive
    a traffic surge, with the platform processing about 275 million commits per week. GitHub
    SVP of software engineering Jakub Oleksy is quoted on structural changes; by May 2026
    about 40 percent of monolith traffic had moved to Azure, with a target near 50 percent
    by July. Multiple outlets report Microsoft added AWS capacity to absorb overflow. GitHub
    and Microsoft have not published a single primary statement consolidating these figures.
  why: >-
    GitHub is critical developer infrastructure, and a sustained availability shortfall driven
    by agent traffic affects CI, releases, and enterprise SLAs across the ecosystem.
  followup: >-
    Watch for an official GitHub availability report or Microsoft statement confirming the
    AWS capacity arrangement and the Azure migration milestones.
  sources:
