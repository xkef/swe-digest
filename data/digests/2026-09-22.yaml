    Xiaomi published downloadable MiMo V2.6 weights on Hugging Face, topping out at a 524B
    parameter Pro-RL model.
  summary: >-
    The XiaomiMiMo Hugging Face organization carries a MiMo-V2.6 collection last updated 2026-09-21
