- title: Claude API, Claude Code, and Cowork hit 80 minutes of elevated errors
  section: Outages
  category: Outage
  blurb: >-
    Anthropic logged 80 minutes of elevated errors across the Claude API, Claude Code, and
    Cowork on 2026-09-22.
  summary: >-
    Impact ran from 2026-09-22 00:50 UTC to 02:10 UTC and the incident was marked resolved
    at 02:35 UTC. Affected surfaces were claude.ai, the Claude API at api.anthropic.com, Claude
    Code, and Claude Cowork, with elevated errors on requests to Claude Mythos 5.1, Claude
