date: '2026-09-22'
stories:
- title: >-
    WordPress patches critical unauthenticated path traversal that can reach RCE, backported
    to 4.7
  section: Top stories
  category: Security
  blurb: >-
    WordPress 7.1.2 fixes CVE-2026-87902, an unauthenticated path traversal that can reach
    code execution, backported to 4.7.37.
  summary: >-
    The advisory covers CVE-2026-87902, CVSS v4 base score 9.2, published 2026-09-22, where
    an unauthenticated attacker can make `get_page_template()` resolution include a chosen
    readable local `.php` file outside the active theme directories. Reaching code execution
    requires two preconditions: the active child or parent theme contains a top-level directory
    whose name starts with `page-`, which covers Twenty Twelve, Twenty Fourteen, Neve, Hestia,
    and Sydney, and a chosen readable local `.php` target exists, for which the advisory names
    the PEAR `pearcmd.php` path with `register_argc_argv` set to On. The advisory states the
    official php Docker image is affected and the default cPanel configuration is affected
    on PHP before 8.5, and the fix ships in 7.1.2 with backports across 25 branches to 4.7.37.
  why: >-
    Attack vector is network with no privileges and no user interaction, and the backport
    reach to 4.7.37 means the upgrade applies to nearly every install still receiving WordPress
    security releases.
  sources:
  - label: primary
    url: https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-7hp8-65ch-5whp
  - label: discussion
    url: https://news.ycombinator.com/item?id=49803959
- title: Anthropic ships Claude Opus 5.5 at 40 percent lower cost than Opus 5
  section: Top stories
  category: AI
  blurb: >-
    Anthropic released Claude Opus 5.5 with cache reads at $0.20 per million tokens, 60 percent
    below Opus 5.
  summary: >-
    Anthropic released Claude Opus 5.5 on 2026-09-22 as the first model in the Claude 5.5
    family. Input and output tokens are priced at $4 and $20 per million, 20 percent below
    Opus 5, and cache reads at $0.20 per million, 60 percent below Opus 5. Anthropic states
    a 40 percent cost reduction on typical workloads at default settings, output generation
    more than 30 percent faster, and deployment under safeguards similar to Claude Fable 5.1
    because capability in biology and cybersecurity is comparable.
  why: >-
    Cache reads dominate token spend in agentic coding, so the $0.20 per million cache-read
    price moves the cost of long-running agent sessions more than the headline rate does.
  followup: >-
    Whether independent harnesses reproduce the vendor-run figures of Terminal-Bench 4.0 at
    66.4 percent, FrontierCode v1.1 main at 54.4 percent, and CursorBench 4.0 at 57.8 percent,
    which Anthropic's own post frames as a less reliable guide at these capability levels.
    Also when Sonnet 5.5 and Haiku 5.5 ship.
  sources:
  - label: primary
    url: https://www.anthropic.com/claude-opus-5-5
  - label: benchmarks
    url: https://artificialanalysis.ai/models/claude-opus-5-5
  - label: discussion
