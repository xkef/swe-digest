- title: >-
    systemd 262 ships with breaking changes to notify-reload services, TPM-sealed credentials,
    and the udevd control socket
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    systemd 262 ships breaking changes to notify-reload services, TPM-sealed credentials,
    and the udevd control socket.
  summary: >-
    The v262 release notes on the systemd repository list breaking changes in three places:
    services using notify-reload, TPM-sealed credentials, and the udevd control socket. Phoronix
    covered the release on 2026-09-22. It is an upstream release, so the operational effect
    arrives when distributions pick it up rather than on the day it was tagged.
  why: >-
    All three breaks sit under something that runs at boot or during a service reload, which
    is where an incompatibility shows up as a host that does not come back.
  followup: >-
    Which distribution releases carry systemd 262, and whether the notify-reload change requires
    unit file edits.
  sources:
  - label: primary
    url: https://github.com/systemd/systemd/releases/tag/v262
  - label: coverage
    url: https://www.phoronix.com/news/systemd-262-Released
- title: >-
    Linear halves CI runner time per test while its suite nearly quadruples under agent-written
    code
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Linear cut PR wait time from over 6 minutes to just over 5 while its test suite nearly
    quadrupled since January.
  summary: >-
    Mufeez Amjad published the work on 2026-09-21 with numbers for each change: PR wait time
    fell from over 6 minutes to just over 5 and runner time per test roughly halved, while
    test suites almost quadrupled since January at roughly 2,000 tests added per week. Moving
    off GitHub Actions to third-party runners made jobs 34 percent faster on average and tsc
    52 percent faster, tsgo cut the weekly median tsc check by 73 percent, rewriting type-aware
    lint rules to pure AST analysis cut full-repository lint time 55 percent and enabled the
    later Oxlint move, capping fetch depth took the slowest change-detection gate from 94
    to 20 seconds, and consolidating seven small checks into two saved roughly 87,000 runner-minutes
    per month, 11.8 percent of total CI usage. The largest single win was an opt-in Vitest
    project with `isolate: false`, worth about 17 percent of monthly spend with the slowest
    shard falling from a range of 300 to 379 seconds down to about 195, and also the highest
    correctness risk, so they updated their agent skills to make generated tests respect the
    opt-in constraints.
  why: >-
    Sharding only pays once per-shard setup cost is low, and where agents write most of the
    tests the constraint has to live in the agent instructions rather than in review.
  sources:
  - label: primary
    url: https://linear.app/now/ci-bottleneck-reworked
  - label: discussion
    url: https://news.ycombinator.com/item?id=49792067
- title: >-
    Survey finds 78 percent of developers stop reading an article they believe is AI-assisted
    or AI-written
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A survey Colin Breck cites finds 78 percent of readers stop reading once they believe
    an article is AI-written.
  summary: >-
    Colin Breck, writing 2026-09-20, cites Cynthia Dunlop's survey on AI-scented blog posts:
    78 percent of readers stop reading when they believe an article is AI-assisted or AI-authored,
    71 percent avoid the author in future, and 98 percent prefer the author's own writing
    with its flaws over an AI rewrite. His stated mechanism for why AI-generated documents
    read badly to everyone but their prompter is that the prompter holds the context that
    produced the output and can skim it, while the recipient has none and must read exhaustively.
    He reports the inverse split from writing an academic paper, where AI was valuable for
    verifying claims against source code, configuration, and production logs, for citations,
    for TikZ diagrams, and for catching a notation error four expert reviewers missed, while
    asking it to write a paragraph from that same context was never useful.
  why: >-
    The figures put a measured readership cost on publishing AI-written engineering prose,
    and Oxide now mandates that all public writing be reported human-authored by Pangram.
  sources:
  - label: primary
    url: https://blog.colinbreck.com/i-dont-want-to-read-what-you-didnt-write/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49794330
- title: What Sun got wrong
  section: Hacker News
  category: Engineering post
  blurb: >-
    Bryan Cantrill argues Sun's failure was operational, not strategic: it had grown bored
    with running a business.
  summary: >-
    Bryan Cantrill published a short answer on 2026-09-20 to the question Sun nostalgia usually
    avoids, distilled to one claim, that Sun had become bored with the mechanics of running
    a business. The anchoring episode is a 2005 startup running OpenSolaris that wanted to
    buy a large amount of Sun hardware and could not get Sun to answer the phone, while Dell's
    local account executive closed the deal in under two weeks. The post reached roughly 600
    points and is carried as discussion, because its value on the day was the argument and
    the thread around it rather than implementation detail.
  why: >-
    The framing is strategic success undone by operational failure, which is the transferable
    part for anyone whose open source strategy is working while the surrounding business execution
    is not.
  sources:
  - label: primary
    url: https://bcantrill.dtrace.org/2026/09/20/what-sun-got-wrong/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49787436
