- title: >-
    A Python interpreter in 1024 bytes of C89 that reparses the source on every loop iteration
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    A 1024-byte C89 program runs a Python subset by reparsing the source text on every iteration
    of a loop.
  summary: >-
    The write-up walks through a Python subset interpreter written in 1024 bytes of C89. It
    uses a recursive descent parser that executes as it parses, with no intermediate representation
    and no bytecode, so a loop body is reparsed on every iteration.
  why: >-
    It shows how far a parser that executes as it parses can go with almost no interpreter
    state.
  sources:
  - label: Austin Henley
    url: https://austinhenley.com/blog/python1024.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49591876
