stories:
- title: >-
    Gamers Nexus reports LG smart TVs sweep the local network and capture microphone audio
    in standby
  section: Top stories
  category: Security
  status: developing
  blurb: >-
    Gamers Nexus reports LG smart TVs scan the local network and capture microphone audio
    while the screen is off.
  summary: >-
    Notebookcheck reports on a Gamers Nexus investigation that describes LG smart TVs enumerating
    other devices on the local network and logging microphone audio with the screen off, on
    retail LG OLED sets including the G5 running webOS, with the full affected model range
    not yet known. Notebookcheck states the set kept saving voice input locally after the
    team disconnected it from Ethernet and uploaded the stored files once network access was
    restored, and that the collected data feeds LG Ad Solutions, which states access to 363
    million secondary addressable devices in the US against LG's claimed 216 million smart
    TV sales globally. This run could not read the 135-minute video itself, so every figure
    in the account comes from Notebookcheck rather than from the recording, and LG has made
    no statement.
  why: >-
    The reported behavior is a shipped consumer device acting as a network scanner on the
    LAN it is plugged into and holding audio through a network outage to upload afterwards,
    on a platform whose ad arm counts 363 million addressable US devices.
  followup: >-
    An LG statement, the webOS remote code execution findings once disclosure closes, and
    independent confirmation of the network sweep and the standby audio capture.
  sources:
  - label: Gamers Nexus video
    url: https://www.youtube.com/watch?v=6IFVTcM28KA
  - label: Notebookcheck report
    url: https://www.notebookcheck.net/LG-smart-TVs-caught-logging-audio-with-screen-off-and-snooping-on-local-devices.1391214.0.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49594878
  - label: second HN submission
    url: https://news.ycombinator.com/item?id=49592375
- title: Nitter says the project will continue following legal advice
  section: Top stories
  category: Dev tools
  status: developing
  blurb: >-
    A Nitter README commit states that following legal advice the project will continue, with
    more details announced later.
  summary: >-
    Commit 1428b4c to the Nitter repository updates the README under the heading that Nitter
    lives. Its diff adds a single line stating that following legal advice the project will
    continue and that more details will be announced soon, plus funding links. It does not
    state that service is restored, and it does not describe the project's status before the
    commit.
  why: >-
    Nitter is the practical read path to content posted only on X, including for feed tooling
    and archiving, and it was expected to stay dark after the August takedown demand from
    X Corp.
  followup: >-
    The promised details, whether public instances actually serve requests again, and whether
    X Corp escalates beyond the cease and desist.
  sources:
  - label: Nitter commit
    url: https://github.com/zedeus/nitter/commit/1428b4c2b4246f92a7e5b2673438e5fb39fcc4a3
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49588988
- title: >-
    GrapheneOS has built a secure paste feature that lets users take clipboard access away
    from apps
  section: Top stories
  category: Security
  status: developing
  blurb: >-
    GrapheneOS says it has developed a secure paste feature replacing clipboard APIs, with
    a merge planned soon.
  summary: >-
    GrapheneOS posted from its own account on 2026-09-06 that it has developed a secure paste
    feature replacing traditional clipboard APIs. An app without clipboard access receives
    pasted content only through a user-mediated action rather than by reading the clipboard
    API directly. The project states it plans to get the feature merged soon and names no
    release.
  why: >-
    Replacing the clipboard API with a user-mediated paste changes an app permission that
    Android has always granted implicitly, and it is the kind of change other hardened Android
    builds tend to follow.
  followup: >-
    The merge landing, the GrapheneOS release that ships secure paste, the app compatibility
    fallout, and whether AOSP or other hardened builds adopt the same model.
  sources:
  - label: GrapheneOS post
    url: https://grapheneos.social/@GrapheneOS/117225731764489295
  - label: earlier GrapheneOS post
    url: https://grapheneos.social/@GrapheneOS/117225539756835649
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49590512
- title: >-
    HN thread reports about 4,000 BTC moved out of the Liquid Federation wallet after a public
    range proof fix
  section: Top stories
  category: Security
  status: rumor
  blurb: >-
    An unverified Hacker News thread claims about 4,000 BTC left the Liquid Federation wallet
    after a public range proof cache fix.
  summary: >-
    The Elements commit c26d719, titled as a fix binding the range proof cache to asset and
    scriptpubkey, was authored by delta1. That commit is the only part of this story confirmed
    against a primary source, and the Elements releases that carry the range proof cache bug
    are not yet known. The reported theft from the Liquid Federation wallet, the sidechain
    pause, and the on-chain OP_RETURN negotiation could not be checked against any primary
    source from this run.
  why: >-
    If the thread is right, a security fix that shipped as an ordinary public commit introduced
    a worse bug than the one it closed, which is the failure mode any project that patches
    in the open has to plan for.
  followup: >-
    A Blockstream or Liquid Federation statement, the amount and the sidechain status confirmed
    on chain, and whether a second fix lands for the collision the thread describes.
  comments: >-
    HN commenters, including the account nullc, who states he wrote the original range proofs
    at Blockstream, argue the fix introduced an undelimited hash field collision worse than
    the cache bug it closed. The roughly 4,000 BTC figure and the sidechain pause rest on
    that thread alone. The submission points at a Liquid_BTC post on X that was not readable,
    because X is unreachable and xcancel.com serves a browser verification challenge, and
    mempool.space transaction pages render empty.
  sources:
  - label: Elements commit c26d719
    url: https://github.com/ElementsProject/elements/commit/c26d719
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49591672
- title: >-
    ROCm 10.0 ships AMD Skills for Claude, Cursor, and Codex and an agentic optimizer called
    Hyperloom
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    ROCm 10.0 ships AMD Skills for Claude, Cursor, and Codex plus Hyperloom, an agentic optimizer,
    in the box.
  summary: >-
    AMD published ROCm 10.0 on 2026-08-27, the first major version after the 7.x series. The
    release ships AMD Skills targeting Claude, Cursor, and Codex, and an agentic optimizer
    named Hyperloom. It reached Hacker News only in this window.
  why: >-
    This is the first ROCm release to ship agent tooling in the box, with AMD Skills built
    on the Agent Skills format and Hyperloom listed for MI300X, MI325X, and MI355X.
  followup: >-
