- title: >-
    OpenChoreo patches a cluster gateway proxy that authenticated no caller and allowed Secret
    reads across every connected data plane
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    OpenChoreo patched a cluster gateway proxy that authenticated no caller and allowed Secret
    reads across data planes.
  summary: >-
    The OpenChoreo advisory describes an internal cluster-gateway listener that performs no
    caller authentication and grants tunneled Kubernetes access to every connected data plane,
    including Secret reads. The client library's read-only restriction is not enforced server
    side. Fixed in 1.0.3, 1.1.3, and 1.2.0.
  why: >-
    Anyone running OpenChoreo needs 1.0.3, 1.1.3, or 1.2.0, because the internal listener
    grants tunneled Kubernetes access with no caller check.
  followup: >-
    Whether the listener gains authentication rather than only network-level restriction,
    and any reported exploitation.
  sources:
  - label: GHSA-rh53-xvx2-j327
    url: https://github.com/advisories/GHSA-rh53-xvx2-j327
  - label: CVE-2026-73842
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-73842
