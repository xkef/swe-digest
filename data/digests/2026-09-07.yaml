  section: Infrastructure
  category: Engineering post
  status: confirmed
  blurb: >-
    Cloudflare details eight years of moving its edge onto eBPF and XDP, off a vendor kernel
    bypass stack it had to patch.
  summary: >-
    The post, dated 2026-08-27, is the first part of an account of Cloudflare replatforming
