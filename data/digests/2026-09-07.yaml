- title: 'Ask HN: Fable hacked my piano, can I release the results?'
  section: Hacker News
  category: Pulse
  status: discussion
  blurb: >-
    An Ask HN thread debates whether a model-written decoder for PianoDisc's obfuscated MIDI
    format can be published.
  summary: >-
    The poster states Fable decoded the MIDI channel PianoDisc embeds in MP3 files, then wrote
    both an encoder and a decoder for the decoy notes the format uses as obfuscation. The
    question put to the thread is whether that code can be released.
  why: >-
    Whether a weak obfuscation scheme qualifies as an effective technical measure decides
    if reverse-engineering results like this can be published at all.
  comments: >-
    HN commenters split over whether the decoy-note scheme counts as an effective technical
    measure under DMCA section 1201, which is what decides the answer.
  sources:
  - label: HN 49577129
    url: https://news.ycombinator.com/item?id=49577129
