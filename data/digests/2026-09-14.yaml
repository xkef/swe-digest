- title: >-
    Ubuntu 26.10 moves cp, mv and rm to uutils, completing the Rust coreutils migration
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Ubuntu 26.10 moves cp, mv and rm to the Rust uutils implementations, completing the coreutils
    migration begun in 25.10.
  summary: >-
    cp, mv and rm were the three commands held back on their GNU versions in Ubuntu 26.04
    LTS, after a Canonical-commissioned security audit of uutils found time-of-check to time-of-use
    issues, and those are fixed upstream. 26.10 ships a full Rust core utility set covering
    ls, cat, chmod, du and the rest, following 25.10, which shipped Rust utilities and made
    Rust sudo the default. uutils targets drop-in GNU compatibility and treats any deviation
    as a bug, so the intended user-visible difference is none and the stated payoff is memory
    safety.
  why: >-
    Beta arrives later this month and the stable release is 2026-10-15, which is when the
    replacement reaches machines.
  followup: >-
    Whether Canonical publishes its own release note for the change, because this block rests
    on specialist reporting rather than a Canonical primary.
  sources:
