- title: >-
    A Hopper profiling study argues a single SM utilization number hides how much useful work
    LLM decode does
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    A Hopper profiling study replaces the single SM utilization number with eight counter-validated
    views of decode work.
  summary: >-
    During decode each request contributes one new token, so dense projection GEMMs become
    small-row matrix multiplications. The bfloat16 GMMA path on Hopper executes these in fixed
    64-row fragments, so small-batch decode fills only a fraction of each fragment with real
    token rows while the utilization counter still reads high. The authors profile vLLM with
    FlashAttention-3 and cuBLASLt on an H100 NVL and replace the single number with eight
    views, each pinned to an Nsight Compute counter or an explicit formula, in results that
    are the authors' own and are not independently reproduced.
  why: >-
    A serving team reading high SM utilization during decode can be reading fragment occupancy
    rather than throughput, which points capacity planning at the wrong bottleneck.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2609.12923
- title: >-
    Paired same-model tests find no average advantage for vendor-native agentic coding harnesses
  section: Agentic coding
  category: Paper
  status: developing
  blurb: >-
    A preprint finds no average advantage for vendor-native coding harnesses across 80 paired
    same-model private tasks.
  summary: >-
    The private, contamination-controlled suite holds 256 repository and post-cutoff contest
    tasks, and each paired same-model contrast ran the same 80 of them under a vendor harness
    and under a neutral one, reporting -1.25 points for Opus 4.8 between claude-agent-sdk
    and deepagents and +1.25 for GPT-5.5 between the openai-codex SDK and deepagents, both
    with confidence intervals spanning zero. The Opus average hides opposite strata, with
    the native harness trailing by 9.0 points on repository tasks and leading by 23.7 on contest
    tasks, and the author states that partition was chosen after seeing the data and needs
    a designed replication. The tasks stay private and the results are unreproduced by third
    parties.
  why: >-
    One finding is directly operational: 22 of 81 runs cancelled at the wall-clock ceiling
    had already produced a passing patch, so completion and correctness are not the same measurement.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2609.11987
- title: >-
    Anthropic reports CI jobs rising 25x in six months and rebuilds test selection around
    a shared journal
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Anthropic rebuilds CI test selection around a shared journal after agent-driven job volume
    rose 25x in six months.
  summary: >-
    A listener recorded every CI test result and a selector read that history to choose tests
    per pull request, and because per-test history was kept in process the listener needed
    a single writer and could not shard. The rebuild moves history into an in-memory data
    store, so any listener worker appends results to a journal and holds nothing, a separate
    consumer rolls the journal into per-test history every few seconds, and the selector reads
    that. Anthropic states the redesign took one engineer three weeks and moved queued unprocessed
    job-result events from a backlog growing week over week to flat, and every figure in the
    post is self-reported and unaudited, including 8x more code shipped per engineer per quarter
    with Claude authoring 80 percent of it. The failure mode the post names is listener lag,
    which left the selector choosing tests from stale data, and the author states that did
    not skip CI but did run already-flaky and widely-failing tests.
  why: >-
    The stopgaps decayed on a stated schedule, with doubled cores holding for 70 days, per-package
    listener sharding for 29 days and daily restarts buying less than a day, which is the
    part another team can plan against.
  sources:
  - label: Anthropic engineering post
    url: https://claude.com/blog/agentic-coding-is-straining-ci-heres-how-we-scaled-test-impact-analysis-at-anthropic
- title: >-
    A generic Android strategy takes an unprivileged app to root on Samsung, Xiaomi and Oppo-family
    flagships
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Calif.io takes an unprivileged Android app to root on Samsung, Xiaomi and Oppo-family
    flagships with no CVEs named.
  summary: >-
    The strategy targets only OEM-written code, because an OEM component ships across that
    vendor's lineup regardless of the chipset underneath. Each chain pairs a page use-after-free
    in an OEM kernel driver with an OEM sandbox escape where SELinux policy gates the driver.
    A page-level primitive sidesteps slab hardening such as `CONFIG_SLAB_BUCKETS` and `CONFIG_RANDOM_KMALLOC_CACHES`,
    usually needs no KASLR leak, and is data-only so CFI does not constrain it.
  why: >-
    The demonstrations run as apps with no declared permissions on stock, bootloader-locked
    devices, so the exposure does not depend on sideloading or an unlocked bootloader.
  followup: >-
    The post is dated 2026-08-31, is part one of a series, and names no CVEs and no patch
    status, so assigned identifiers and vendor fixes are the open items.
  sources:
  - label: research post
    url: https://calif.io/research/oempocalypse
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49691152
- title: >-
    A RubyGems maintainer finds the GemStuffer gems executed code on RubyDoc.info through
    YARD and hunted cached API keys
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A RubyGems maintainer finds the flood gems run code on RubyDoc.info through YARD and scrape
    for cached API keys.
  summary: >-
    Aaron Patterson read the gem source and reports on his own site, in a post dated 2026-09-11,
    that the gems ship a `.yardopts` file containing a `--load` directive for a script in
    the gem, so YARD loads and runs that script, and because RubyDoc.info downloads and processes
    YARD documentation for every gem published to RubyGems.org, publishing a gem is enough
    to execute code on RubyDoc.info. That execution happens in a Docker container, and Patterson
    states the container still has network access, which is how the scraping ran. The gem
    code issues a GET to RubyGems.org and matches the response body against a pattern for
    RubyGems API keys before posting with that value as the Authorization header, which is
    the cached-credential issue RubyGems.org disclosed in July. The inference that OpenAI's
    bots are behind the flood belongs to the rubyhack.ai authors, is not confirmed by OpenAI,
    and is separable from these two findings.
  why: >-
    This is the mechanism under the package flood this digest led with on 2026-09-12, read
    out of the gem source rather than inferred from publishing volume.
  sources:
  - label: maintainer post
    url: https://tenderlovemaking.com/2026/09/11/what-a-time-to-be-alive/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49695876
- title: >-
    A compression engineer argues against JPEG XL on the Web and demonstrates a 1,918-byte
    decode bomb
  section: Developer tools
  category: Dev tools
  status: discussion
  blurb: >-
    A compression engineer argues against JPEG XL on the Web and reports a 1,918-byte image
    needing 17.43 seconds to decode.
  summary: >-
    The author previously endorsed JPEG XL for Interop 2024 and now argues its lossy efficiency
    and decode speed have both been overtaken. The concrete operational finding is separate
    from the opinion: he reports a 1,918-byte JPEG XL image that takes 17.43 seconds of user
    time to decode on an M5 Pro with the Rust decoder, and that decoder is the one now reaching
    Chrome and Firefox. He also reports recompressed JPEGs taking about 33 percent longer
    to decode, which bounds the often-cited 20 percent size saving. The comparison figures
    are his own measurements on size-matched encodes, and no browser vendor response is recorded.
  why: >-
    A decode cost that large from under two kilobytes is a denial-of-service shape for any
    service that decodes user-supplied images.
  sources:
  - label: post
    url: https://giannirosato.com/blog/post/case-against-jxl/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49690554
- title: >-
    A Tokio performance write-up from RustConf names the failure modes, including a blocking-pool
    ceiling near 50,000 tasks per second
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    A RustConf write-up reports Tokio's global blocking pool degrading near 50,000 blocking
    tasks per second on a 32-core host.
  summary: >-
    Tokio's blocking pool is a single global resource, and the author reports negative performance
    effects at roughly 50,000 blocking tasks per second on a 32-core host, with `spawn_blocking`
    becoming visible in flamegraphs, noting that Tokio 1.52.0 briefly shipped a sharded blocking
    queue, 1.52.1 reverted it after a regression that could hang `spawn_blocking`, and PR
    #8337 re-landed it as an unstable feature disabled by default. Two failure shapes are
    specific enough to check for, a metrics registry behind a mutex or read-write lock that
    stalls every worker at once, because each worker eventually schedules a task that blocks
    on the same lock and stealing becomes impossible, and a co-tenant process with many threads
    that delays worker wakeups by 10 to 20 ms, which the author observed during incremental
    Java to Rust migrations at Amazon. The named diagnostic is Tokio's schedule latency histogram,
    the gap between a task becoming ready and the runtime polling it, and every measurement
    is the author's own in a post dated 2026-09-13.
  why: >-
    The version history around PR #8337 and the schedule latency histogram are both checkable
    by a reader directly, and the author builds dial9, the Tokio tracing tool named throughout
    the post.
  sources:
  - label: post
    url: https://dial9-rs.github.io/blog/principles-for-fast-tokio-applications/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49698607
