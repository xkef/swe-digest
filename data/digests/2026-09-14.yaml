- title: >-
    Cloudflare probes origins for key agreement support and cuts origin HelloRetryRequests
    from 52 percent to 3.7 percent
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare probes origins for supported key agreement groups, cutting origin HelloRetryRequests
    from 52 percent to 3.7 percent.
  summary: >-
    TLS 1.3 requires the client to commit to a key agreement algorithm in the first packet,
    and Cloudflare had guessed X25519 for every origin. Automatic Key Exchange replaces the
    guess with active scanning, a few single-group handshakes per TLS 1.3 origin across X25519,
    P-256, P-384, P-521 and X25519MLKEM768, weighted per subdomain by traffic volume and run
    outside the production path. Cloudflare reports HelloRetryRequests falling from roughly
    52 percent to 3.7 percent, more than 150 ms off handshake latency at p90, and origin post-quantum
    support at 12.8 percent against 0.5 percent in 2023, all measured on its own network in
    a post dated 2026-09-08 that reached Hacker News on 2026-09-14.
  why: >-
    An X25519MLKEM768 keyshare is 1,216 bytes against 32 for X25519, which pushes the ClientHello
    past one packet and is why the post-quantum group could not simply be the default, and
    Cloudflare states hundreds of thousands of domains now have post-quantum origin connections
    nobody configured.
  followup: >-
    Whether the origins that break on a post-quantum keyshare get fixed, because Cloudflare's
    earlier scan put that at about 0.34 percent and the scanner has to route around them.
  sources:
  - label: Cloudflare blog
    url: https://blog.cloudflare.com/automatic-key-exchange-for-origins/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49700255
- title: Reverse engineering why the x86 undefined instruction is called ud2
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Raymond Chen reconstructs why x86 named the supported undefined instruction ud2 rather
    than ud0 or ud1.
  summary: >-
    Raymond Chen reconstructs the name from Hyrum's Law: programs came to depend on `0F FF`
    and `0F B9` raising invalid opcode exceptions, so Intel retroactively named those `ud0`
    and `ud1` and defined `ud2` as the supported one. The operational detail is the decoding
    difference. `ud0` and `ud1` still decode a register-or-memory operand that the processor
    never uses, so an instruction whose decoding crosses into a not-present page raises an
    access violation rather than an invalid opcode exception, and some older processors faulted
    inconsistently at a page boundary. The post is labelled a reconstruction rather than documented
    history.
  why: >-
    Code that emits a deliberate trap instruction gets a different exception from `ud0` and
    `ud1` depending on where the operand bytes land, which is why `ud2` is the one to emit.
  sources:
  - label: post
    url: https://devblogs.microsoft.com/oldnewthing/20260910-00/?p=112689
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49683262
