- title: >-
    Apple ships iOS 27, iPadOS 27 and macOS 27, with Siri AI as an English beta and no iPhone
    rollout in the EU
  section: Top stories
  category: Apple
  status: confirmed
  blurb: >-
    Apple releases iOS 27, iPadOS 27 and macOS 27, with Siri AI as an English beta and no
    iPhone rollout in the EU.
  summary: >-
    Apple states Siri AI starts as a beta in English, with French, Japanese, Korean, Portuguese
    and Spanish stated for October, that Mac and Apple Vision Pro users in the EU can reach
    it, and that it will not be available initially in the EU on iOS, iPadOS and watchOS,
    nor in China while Apple works through regulatory requirements. Apple states server-side
    features including Siri AI, intelligent photo editing, Image Playground and AFM 3 Cloud
    models in Shortcuts are subject to daily usage limits that vary by feature and system
    demand, and that expanded access will be available for a fee in the future. Supported
    hardware for Apple Intelligence and Siri AI starts at iPhone 15 Pro, M1 Macs and iPads,
    Apple Watch Series 9 and Apple Vision Pro, and the platform numbers are Apple's own, with
    apps launching up to 30 percent faster on iPhone and iPad, photos loading up to 70 percent
    faster after capture, AirDrop up to 80 percent faster and external USB file transfer on
    iPad up to 5x faster.
  why: >-
    The availability section is the operational part, because an EU iPhone fleet gets no Siri
    AI at all and every server-side feature carries a daily limit Apple does not quantify.
  followup: >-
    Whether the EU rollout on iOS, iPadOS and watchOS and the China release arrive, and what
    the stated fee for expanded server-side access turns out to be.
  sources:
  - label: Apple Newsroom
    url: https://www.apple.com/newsroom/2026/09/major-updates-for-apples-software-platforms-are-now-available/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49701004
- title: >-
    Bishop Fox maps NetScaler CVE-2026-19490 from a safe patch-state probe to root, with the
    decoded length as the payload
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Bishop Fox weaponizes NetScaler CVE-2026-19490 to root, and a crash-length POST drops
    all traffic for about 45 seconds.
  summary: >-
    The writeup, dated 2026-09-10, moves from a probe that reveals patch state without harm
    to root on the appliance, using the decoded length of the request as the payload. One
    outcome needs no particular configuration: a crash-length POST restarts the packet engine
    and drops all traffic through the appliance for roughly 45 seconds. Fixed builds are 13.1-63.21
    and 14.1-73.32 or later, and 12.1 and 13.0 get no fix. The post is weaponization of a
    Citrix advisory published 2026-08-19 and makes no exploitation claim of its own.
  why: >-
    NetScaler ADC and Gateway sit internet-facing by design, and both nodes of an HA pair
    need patching because an unpatched secondary is exposed the moment it takes over.
  followup: Whether Citrix publishes a fix for the 12.1 and 13.0 branches.
  sources:
  - label: Bishop Fox writeup
    url: https://bishopfox.com/blog/mind-the-config-detecting-and-weaponizing-netscaler-cve-2026-19490
  - label: HN submission
    url: https://news.ycombinator.com/item?id=49691732
- title: >-
    Julia 1.13 skips system-image objects during GC marking and replaces the hash function
    with RapidhashNano
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Julia 1.13 marks system-image objects permanently, cutting a bare-session full collection
    from 35 ms to 2 ms.
  summary: >-
    Objects in the system image and package images are loaded permanently marked, so a full
    collection scales with the heap the program created rather than with the amount of code
    loaded. The release reports a full collection in a bare session dropping from 35 ms to
    2 ms, and from 187 ms to 68 ms with GLMakie loaded. The hash function is replaced with
    RapidhashNano.
  why: >-
    Two changes need action from package authors rather than users: the default hash seed
    changed, so a custom `hash` method must accept the seed as an argument and never default
    it, and `Pkg.test` no longer passes `--check-bounds=yes`, so test processes inherit the
    bounds-checking mode from the parent session.
  sources:
  - label: release highlights
    url: https://julialang.org/blog/2026/09/julia-1.13-highlights/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49642645
- title: >-
    Private frameworks in iOS 27 and macOS 27 let a third-party model stand in for Siri's
    planner
  section: Top stories
  category: Apple
  status: developing
  blurb: >-
    MacRumors reports iOS 27 private frameworks let a third-party model replace Siri's server-side
    planner, unusable today.
  summary: >-
    MacRumors reports two distinct mechanisms found in iOS 27 and macOS Golden Gate 27 private
    frameworks by a developer posting as pdfu. Model Delegation makes a third-party model
    appear as a Siri extension that hands a task back to Siri when it needs a system feature,
    while an inference provider in Model Manager Services replaces Apple's own server-side
    Siri model and receives Apple's Siri planner prompt and tool definitions, so the substitute
    can request system actions, receive the resulting personal data and answer through Siri's
    interface and voice. Neither is usable now, because the "Ask..." menu in the macOS 27
    release candidate is limited to the existing ChatGPT extension and Apple has not opened
    the model delegation entitlement to third parties.
  why: >-
    MacRumors notes the EU Digital Markets Act requires Apple to give third parties effective
    access to features available to its own services, and that the European Commission has
    said this extends to Siri.
  followup: >-
    Whether Apple opens the model delegation entitlement to third parties, and whether the
    inference-provider path appears in a shipping release rather than only in framework code.
  sources:
  - label: MacRumors report
    url: https://www.macrumors.com/2026/09/14/siri-can-be-swapped-out-for-chatgpt-claude/
  - label: HN discussion
