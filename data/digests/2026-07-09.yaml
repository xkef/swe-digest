- title: Bun's runtime rewritten from Zig to Rust with agentic tooling
  section: Top stories
  category: Agentic coding
  status: confirmed
  blurb: >-
    Bun rewrote its runtime from Zig to Rust using parallel Claude Code with adversarial review,
    reporting 2-5% throughput gains.
  summary: >-
    Bun published an account on 2026-07-08 of rewriting its runtime, about 535,000 lines including
    the transpiler, package manager, test runner, and Node.js API implementations, from Zig
    to Rust. The stated motivation is memory-safety bugs (use-after-free, double-free, leaks)
    from mixing garbage-collected JavaScript values with manually managed memory, which Rust's
    compiler rejects at build time. Bun reports the work ran May 3 to 14, 2026 with many parallel
    Claude Code instances (about 6,500 commits, up to 64 instances at peak) using adversarial
    code-review loops, and claims 2 to 5 percent higher throughput, roughly 20 percent smaller
    binaries on Linux and Windows, and fixed leaks. The Rust port merged to main, ships in
    the Bun 1.4.0 canary, and Bun states Claude Code v2.1.181 and later already use it. Bun
    1.3.14 was the final Zig release.
  why: >-
    A production JavaScript runtime replacing its implementation language largely through
    parallel agent runs is a concrete data point on the scope of AI-assisted rewrites, and
    it changes the toolchain under Claude Code.
  followup: >-
    Watch Bun 1.4.0 stable, regression reports from the Rust port, and independent confirmation
    of the performance and stability claims.
  comments: >-
    HN commenters attribute the rewrite to Anthropic's Fable 5 model and frame the post partly
    as a capability demonstration. One notes it reflects poorly on Zig that a largely mechanical
    rewrite fixed leaks, shrank binaries, and improved performance.
  sources:
  - label: Bun blog
    url: https://bun.com/blog/bun-in-rust
  - label: Simon Willison
    url: https://simonwillison.net/2026/Jul/8/rewriting-bun-in-rust/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48837877
- title: Cognition releases SWE-1.7 coding model at $1.97 per task
  section: Top stories
  category: Agentic coding
  status: confirmed
  blurb: >-
    Cognition released SWE-1.7, a coding model trained on open weights, reporting 42.3 percent
    on FrontierCode and $1.97 per task on Devin.
  summary: >-
    Cognition launched SWE-1.7 on 2026-07-08, its most capable coding model, reinforcement-learning
    trained on the open-weight Kimi K2.7 base. Cognition reports 42.3 percent on its FrontierCode
    1.1 benchmark, which scores whether a maintainer would merge a produced pull request,
    against 43.0 percent for GPT-5.5 and 46.5 percent for Claude Opus 4.8. It states a cost
    of $1.97 per task on the FrontierCode Main set and runs the model at 1,000 tokens per
