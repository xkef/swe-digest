stories:
- title: xAI releases Grok 4.5 with aggressive coding-model pricing
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    xAI released Grok 4.5 on 2026-07-08 with aggressive pricing at $2 per million tokens,
    beating Opus 4.8 on some coding benchmarks.
  summary: >-
    xAI released Grok 4.5 to the public on 2026-07-08, eleven days after a private beta at
    SpaceX and Tesla. The model is built on V9, xAI's ninth-generation architecture reported
    at 1.5 trillion parameters, and xAI says it folded real Cursor developer session data
    (debugging traces, multi-file diffs, user corrections) into training. Reported pricing
    is $2 per million input tokens and $6 per million output tokens. On the four benchmarks
    xAI published it beats Opus 4.8 on DeepSWE 1.0 and Terminal-Bench 2.1 and loses on DeepSWE
    1.1 (by 6 points) and SWE-Bench Pro (by 4.5 points), and xAI states it uses about 4.2
    times fewer tokens than Opus 4.8 on SWE-Bench Pro. It is available now in Grok Build,
    in Cursor on all plans, and through the SpaceXAI console. Cursor, whose team co-trained
    the model, says Grok 4.5 and its own Composer 2.5 are different weight classes and both
    remain available.
  why: >-
    A frontier-class coding model priced well below current OpenAI and Anthropic tiers and
    available inside Cursor immediately changes the cost calculus for agentic coding workloads.
  followup: >-
    Watch independent benchmark reproduction, the token-efficiency claim, and whether the
    reported Cursor tool-calling gaps get fixed.
  comments: >-
    HN commenters read the model as unusually economical, noting the $2/$6 price against $5/$30
    for GPT-5.5 and $5/$25 for Opus 4.8, and flag the benchmark figures as vendor-reported.
  sources:
  - label: xAI announcement
    url: https://x.ai/news/grok-4-5
  - label: Cursor blog
    url: https://cursor.com/blog/grok-4-5
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48835111
- title: OpenAI releases GPT-5.6 Sol, Terra, and Luna to the public
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    OpenAI released GPT-5.6 to general availability on 2026-07-09 with three tiers: Sol for
    reasoning, Terra at half GPT-5.5 cost, Luna fastest.
  summary: >-
    OpenAI made the GPT-5.6 family generally available on 2026-07-09 across ChatGPT, the API,
    and Codex, after the government-coordinated testing period that the US Department of Commerce
    Center for AI Standards and Innovation completed before the staggered-release restriction
    was lifted. The family has three tiers: Sol, the flagship for complex reasoning and agentic
    coding, Terra, described as competitive with GPT-5.5 at half the cost, and Luna, the cheapest.
    GPT-5.6 adds a new maximum reasoning effort and an ultra mode that spawns subagents to
    parallelize complex work. Reported pricing per million tokens is Sol $5 in and $30 out,
    Terra $2.50 and $15, and Luna $1 and $6. OpenAI states Sol runs on Cerebras at up to 750
    tokens per second in July.
  why: >-
    OpenAI's flagship family reaching general availability on its most-used surfaces, with
    Terra undercutting GPT-5.5 and Sol targeting agentic coding, lands directly against this
    week's Grok 4.5 and SWE-1.7 releases and resets the frontier-model comparison for developers.
  followup: >-
    Watch independent benchmark reproduction, the final per-tier pricing, and the subagent
    ultra-mode behavior in Codex.
  comments: >-
    HN commenters were skeptical of the launch benchmarks, noting the "Agents' Last Exam"
    chart truncates its y-axis at 30 percent to overstate the gains and compares against Fable
    5 in adaptive rather than max reasoning mode. Several read the release as an incremental
    version bump.
  sources:
  - label: OpenAI announcement
    url: https://openai.com/index/gpt-5-6/
  - label: OpenAI preview
    url: https://openai.com/index/previewing-gpt-5-6-sol/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48849066
- title: OpenAI ships GPT-Live full-duplex voice for ChatGPT
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    OpenAI launched GPT-Live, a full-duplex voice model for ChatGPT that listens and speaks
    simultaneously while delegating to frontier models.
  summary: >-
    OpenAI launched GPT-Live on 2026-07-08, a full-duplex voice model that listens and speaks
    at the same time rather than processing separate turns. OpenAI says the model makes interaction
    decisions many times per second (speak, keep listening, pause, interrupt, or invoke a
    tool) and delegates questions that need web search or deeper reasoning to a frontier model
    behind the scenes, using GPT-5.5 at launch. Two variants rolled out to ChatGPT users:
    GPT-Live-1 as the default voice model for Go, Plus, and Pro, and GPT-Live-1 mini for free
    accounts. API access is stated to follow.
  why: >-
    Full-duplex voice with backend model delegation is a concrete architecture shift for voice
    agents, and the stated API availability would bring the pattern to developers.
  followup: >-
    Track the API release, latency and pricing when it ships, and independent evaluation of
    the delegation behavior.
  comments: >-
    HN commenters report the full-duplex handling fixes the prior voice mode's habit of cutting
    off when the user makes a sound, and note the demo included live speech translation.
  sources:
