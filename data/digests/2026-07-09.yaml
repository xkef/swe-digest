- title: Microsoft patches RoguePlanet Defender privilege-escalation zero-day
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Microsoft patched CVE-2026-50656 (RoguePlanet), a race condition in Defender's scanning
    engine that allows local privilege escalation to SYSTEM.
  summary: >-
    Microsoft shipped a fix for RoguePlanet, CVE-2026-50656, a privilege-escalation flaw in
    the Microsoft Malware Protection Engine that powers Windows Defender. It is a race condition
    that lets a local attacker spawn a command shell running as SYSTEM on fully updated Windows
    10 and Windows 11, and the public proof of concept works whether real-time protection
    is on or off. It is rated CVSS 7.8. A researcher using the handle Chaotic Eclipse published
    the exploit around the June 2026 Patch Tuesday amid a dispute with Microsoft over its
    bug-bounty and disclosure practices. The fix ships in Malware Protection Engine 1.1.26060.3008,
    which Defender applies through its automatic engine-update channel. The vulnerability
    is not listed in the CISA Known Exploited Vulnerabilities catalog as of this run.
  why: >-
    Defender runs at high privilege on nearly all Windows endpoints, so a race in its scanning
    engine that yields SYSTEM is broadly reachable, and the engine auto-update path is the
    main mitigation.
  followup: >-
    Watch for confirmation the engine update reached managed fleets, any KEV listing, and
    further exploit variants.
  sources:
  - label: MSRC advisory
    url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50656
  - label: Help Net Security
    url: https://www.helpnetsecurity.com/2026/06/17/rogueplanet-zero-day-cve-2026-50656/
- title: OpenBSD sysv_sem use-after-free allows local root
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    CVE-2026-57589 extends this month's privilege-escalation disclosures to OpenBSD, a use-after-free
    in sysv_sem.c with no patched release.
  summary: >-
    CVE-2026-57589 is a use-after-free in `sys/kern/sysv_sem.c` in OpenBSD through 7.9 that
    allows local privilege escalation to root through a context-switch use-after-free after
    `tsleep` in `sys_semget()`. It is rated CVSS 7.4. NVD published it on 2026-06-24 and references
    fix commit 1957873d2063, with no patched release named. The item reached the Hacker News
    front page on 2026-07-08. No active exploitation is reported. The CISA Known Exploited
    Vulnerabilities catalog is unchanged since 2026-07-07 (version 2026.07.07, count 1635),
    with no new additions today.
  why: >-
    It extends the run of local privilege-escalation disclosures across kernels this month
    from Linux to OpenBSD, and OpenBSD has no named errata release for it yet.
  followup: >-
    Watch for a named OpenBSD errata or release carrying the fix and any backport to 7.9 and
    earlier.
  sources:
  - label: NVD
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-57589
