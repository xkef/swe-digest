- title: OCaml 5.5.0 released
  section: Languages and runtimes
  category: Languages
  blurb: >-
    OCaml 5.5.0 added module-dependent functions, relocatable compiler, and 60 new stdlib
    functions; the release includes multiple breaking changes.
  summary: >-
    OCaml 5.5.0 shipped on 2026-06-19. Language additions include module-dependent functions
    (modular explicits, a lightweight functor form letting a function take a module argument),
    polymorphic function parameters, and extended local definitions (`let module`, `let exception`,
    `let open` usable in most structure items). Runtime and compiler work includes a relocatable
    compiler, dropping the Winpthreads dependency on Windows in favor of WinAPI directly,
    garbage-collector idle-phase and generational-stack-scanning improvements, and roughly
    60 new standard-library functions. The release carries multiple breaking changes to type-system
    handling.
  why: >-
    Module-dependent functions reduce the need for full functors for common module-passing
    patterns, and the relocatable compiler and Windows changes ease toolchain packaging.
  followup: Watch for opam ecosystem updates against the 5.5 breaking changes.
  sources:
  - label: OCaml 5.5.0 release notes
    url: https://ocaml.org/releases/5.5.0
  - label: release announcement
    url: https://discuss.ocaml.org/t/ocaml-5-5-0-released/18265
  - label: r/programming
    url: https://www.reddit.com/r/programming/
