- title: NSA chief reportedly says Mythos breached classified systems in hours
  section: Top stories
  category: AI
  blurb: >-
    Rudd told Warner Mythos broke classified systems in hours; the Economist cautioned the
    claim may reflect red-team testing, not an actual breach.
  summary: >-
    The Economist reported that NSA and Cyber Command director General Joshua Rudd told Senator
    Mark Warner that Anthropic's Mythos model "broke into almost all of our classified systems,
    not in weeks, but in hours." Warner raised the example to argue for faster pre-release
    testing of frontier models, not as criticism. The Economist editor later cautioned the
    quote should not be read literally; the more likely reading is an internal red-team assessment
    against replicas of classified environments under Project Glasswing, not an actual breach.
    Some industry figures, including BitGo's CEO, publicly disputed the breach framing.
  why: >-
    The claim is the loudest public data point in the export-control debate that has kept
    Fable 5 and Mythos 5 offline, and it shapes how regulators weigh frontier-model cyber
    capability.
  followup: >-
    Watch for the full Economist account, any official NSA or Anthropic clarification, and
    whether it affects the Fable 5/Mythos 5 access timeline.
  sources:
  - label: HN
    url: https://news.ycombinator.com/item?id=48617278
  - label: BitGo CEO dispute (Yahoo)
    url: https://tech.yahoo.com/ai/claude/articles/crypto-executive-disputes-claims-anthropic-181408462.html
- title: Deno Desktop turns web projects into native desktop apps
  section: Top stories
  category: Dev tools
  blurb: >-
    Deno documented deno desktop, packaging web projects into desktop binaries for macOS,
    Windows, and Linux with auto-update; canary only.
  summary: >-
    Deno documented `deno desktop`, which packages a Deno project (from a single TypeScript
    file to a Next.js, Astro, Fresh, Remix, Nuxt, or SvelteKit app) into a self-contained,
    redistributable desktop binary bundling the code, the Deno runtime, and a rendering engine
    per platform. It targets macOS, Windows, and Linux, with selectable backends (native WebView,
    bundled Chromium/CEF, or raw), in-process backend-to-UI bindings instead of IPC, cross-compilation
    from one machine, binary-diff auto-update with rollback, native OS integrations, and npm
    access via Node compatibility. It ships in Deno 2.9.0 and is not yet in a stable release;
    testing requires the canary build.
  why: >-
    A first-party desktop packaging path inside the Deno runtime adds another Electron alternative
    with built-in sandboxing and auto-update, relevant to teams choosing a cross-platform
    desktop stack.
  followup: >-
    Watch for Deno 2.9.0 stable shipping `deno desktop` out of canary and the permission-model
    details for produced binaries.
  comments: >-
    HN commenters weighed it against Electron, Tauri, and Electrobun; one noted web tech is
    not itself a native UI toolkit and cross-platform WebView apps tend to miss host-OS UX
    patterns. Another asked how it interacts with Deno's permission model and observed that
    compile-time permissions are baked into the produced binary.
  sources:
  - label: Deno Desktop docs
    url: https://docs.deno.com/runtime/desktop/
  - label: HN
    url: https://news.ycombinator.com/item?id=48626137
