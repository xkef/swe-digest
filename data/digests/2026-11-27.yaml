- title: >-
    Glean's Chinmay Goyal: a decision model replaced LLM calls for routing, ranking and citation
    checks, cutting routing latency 8x
  section: Talks
  category: Video
  blurb: >-
    Glean moved routing, ranking, citation checks and injection screening from LLMs to a decision
    model, cutting routing latency about 8x.
  summary: >-
    Glean moved bounded steps of Glean Assistant to the Jev decision model. Expert routing
    ran about 8x faster with higher precision, the follow-up ranker met its 1.5 to 2 second
    budget in 99.2% of cases against about 90% with a general LLM and produced no invalid
    outputs, and query classification reached about 90% of a fine-tuned Llama with no training.
    Replacing per-customer prompt injection classifiers on T4 GPUs raised first-phase recall
    from 31.5% to 90.2% at lower cost, and citation-support judging gave consistent results
    across repeated runs.
  why: >-
    Any agent step whose outputs can be listed in advance is a candidate for a decision model
    that returns class probabilities, which allows tuned thresholds and removes the need to
    rerun noisy LLM judges.
