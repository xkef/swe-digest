- title: >-
    Spotify's 2026-09-29 outage: Argo CD reset autoscaled login service replicas to minReplicas
    on every sync
  section: Top stories
  category: Engineering post
  blurb: >-
    Two separately tested deployment changes made Argo CD overwrite autoscaler replica counts,
    and returning logins hit 200 times normal load.
  summary: >-
    Spotify says one change moved workloads from Kubernetes Deployments to Argo Rollouts and
    another changed which fields its deployment diff ignores, so Argo CD set replicas to minReplicas
    on every sync for Rollouts services with a test environment. A login service was among
    them, and reissuing tokens drove the login system to 200 times its pre-incident traffic
    while automation kept reapplying the faulty configuration. Errors began at 13:45 UTC,
    most regions recovered by 16:30, and one European region took until 19:34.
  why: >-
    Teams running Argo CD next to an autoscaler should confirm replica fields are excluded
    from sync diffs and that responders can pause reconciliation fast.
  background: >-
    A Kubernetes HorizontalPodAutoscaler owns a workload's replica count, so a GitOps controller
    that also writes that field fights it. Argo CD compares live state with the desired state
    and reapplies any difference unless the field is ignored. Argo Rollouts replaces the Deployment
    object with its own resource type to add canary and blue-green strategies, so ignore rules
    written for one schema can miss the other. A thundering herd is the load spike when many
    clients retry or reauthenticate at once after an outage.
  event: spotify-2026-09-29-outage-argo-replicas
  sources:
  - label: primary
    url: https://engineering.atspotify.com/2026/11/september-29-outage-incident-report-what-we-learnt/
- title: >-
    SAP confirms a security incident after reports that stolen employee tokens were used to
    copy and alter its GitHub code
  section: Security
  category: Security
  blurb: >-
    SAP says it found suspicious activity, and Der Spiegel reports attackers used stolen employee
    tokens to copy and modify code on GitHub.
  summary: >-
    SAP told BleepingComputer on 2026-11-27 that it identified suspicious activity, took measures
    to protect customers, and has found no evidence of access to customer business data. Der
    Spiegel, citing an internal memo about an incident SAP calls Project Granite, reports
    that attackers stole employee authentication tokens and used them to copy and modify SAP
    source code on GitHub. SAP declined to say which environments were hit or whether users
    of code from its GitHub repositories should act.
  why: >-
    Teams that pull SAP code, SDKs or tooling from GitHub should watch for an SAP advisory
    naming affected repositories before trusting recent commits or releases.
  background: >-
    A stolen GitHub token acts as its owner until it is revoked or expires, so an attacker
    can read private repositories and push commits without a password or second factor. When
    the token belongs to a vendor's engineer, altered code can flow to customers through releases
    or build pipelines that pull from those repositories. This follows the 1Password and Defang
    incidents this week, where attackers also worked through GitHub access.
  event: sap-github-token-breach-2026-11
  sources:
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/sap-confirms-security-incident-after-suspicious-github-activity/
  - label: discussion
    url: https://www.techmeme.com/261127/p9#a261127p9
- title: >-
    Researcher traces OpenRouter DeepSeek traffic from Novita, StreamLake and Ant Digital
    to ByteDance's Ark API
  section: AI
  category: AI
  blurb: >-
    Request IDs, tool-call formats, image fetches and canned refusals show prompts sent to
    several ZDR-labeled providers ended up at ByteDance.
  summary: >-
    A post on kendell.dev fingerprints OpenRouter providers and finds DeepSeek and GLM requests
    to Novita, StreamLake and Ant Digital returning ByteDance Ark request and tool-call ID
    formats, images fetched from Volcano Engine and BytePlus addresses, and ByteDance's canned
    censorship refusal, with chains such as SiliconFlow to StreamLake to Novita to ByteDance.
    OpenRouter removed ZDR labels from Novita around 2026-11-20 and Ant Digital on 2026-11-22,
    after AtlasCloud, Novita and StreamLake admitted forwarding MiniMax requests to MiniMax,
    whose security system opened URLs from ZDR prompts. The author discloses an OpenRouter
    grant and publishes attested test runs.
  why: >-
    A provider's zero data retention label says nothing about where it forwards requests,
    so routing sensitive prompts through aggregators needs a pinned, verified provider list.
  background: >-
    OpenRouter routes one API call to any of many inference hosts for the same open-weight
    model, and labels hosts that promise zero data retention (ZDR). A host that resells another
    vendor's API passes the prompt to a party the customer never vetted. Earlier canary studies
    by Vercel and Dragos used unique URLs in prompts to catch providers reading traffic.
  comments: >-
    The Hacker News thread drew 100 points and 15 comments. One commenter reports Novita's
    Qwen endpoint returned Alibaba error messages months ago and Novita admitted routing to
    Alibaba after first denying it. Another explains the arbitrage: wrappers route base load
    to the upstream API at cost and shift traffic to cheap preemptible GPUs when available.
  event: novita-streamlake-bytedance-ark-routing
  sources:
  - label: primary
    url: https://kendell.dev/blog/arkwrapper/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50660273
- title: >-
    SemiAnalysis: Trainium3 with vLLM beats GB300 on inference margin at 135 tokens per second
    per user
  section: AI
  category: AI
  blurb: >-
    SemiAnalysis benchmarks Trainium3 and finds vLLM on it earns a 73.5% margin at 135 tok/s
    per user, against 53% for GB300 with SGLang.
  summary: >-
    SemiAnalysis added Trainium3 to InferenceX, replaying real coding-agent sessions on GLM-5.3,
    and reports better performance per TCO than every accelerator except Vera Rubin across
    the p90 interactivity curve, while trailing GB300 on time to first token. Prefill runs
    as a 16-stage pipeline with one chip per stage, and decode spreads one model copy across
    128 NeuronCores as separate expert-parallel ranks. Its UBenchX microbenchmarks show Trainium's
    descriptor generation engines reaching peak HBM bandwidth at small message sizes.
  why: >-
    Teams pricing self-hosted open-weight serving now have measured cost and latency tradeoffs
    for Trainium3 against Nvidia, including where prefill-heavy workloads lose.
  background: >-
    Prefill processes the prompt and is compute bound, while decode generates one token at
    a time and is bound by memory bandwidth. Trainium3 has about 17% of GB300's FP4 compute
    but 61% of its HBM bandwidth per chip, which is why it competes on decode interactivity
    more than on time to first token.
  comments: >-
    The figures assume Z.ai list token prices, 60% fleet utilization and three-year rental
    prices, and much of the post sits behind a paywall.
  event: semianalysis-trainium3-inferencex
  sources:
  - label: primary
    url: https://newsletter.semianalysis.com/p/trainium3-inferencex
- title: >-
    Florian Marending runs coding agents in per-project smolvm microVMs driven by a mise shell
    alias
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    He dropped nono's Seatbelt sandbox and a shared Lima VM for smolvm, whose balloon memory
    makes one VM per repository affordable.
  summary: >-
    Marending found that Lima allocates memory statically and cannot return it to the host
    on macOS, which pushed him toward one VM for all projects. smolvm boots from OCI images
    and supports elastic memory through virtio balloon, so each repository gets its own VM,
    and a mise shell alias m runs mise tasks and pi inside it with the workspace mounted.
    He copies agent transcripts out before teardown and says the setup is too convoluted for
    a team.
  why: >-
    It shows a workable per-repository VM boundary for agents on macOS that keeps host editing
    and jj while the agent cannot touch the rest of the machine.
  background: >-
    Seatbelt is the macOS kernel sandbox behind sandbox-exec, which Apple deprecated without
    a supported replacement for arbitrary processes. A virtio balloon driver lets a guest
    hand unused memory back to the hypervisor, so idle VMs do not hold their full allocation.
    MicroVMs give agents a separate kernel, a stronger boundary than containers that share
    the host kernel.
  event: marending-smolvm-agent-isolation
  sources:
  - label: primary
    url: https://marending.dev/notes/agent-isolation/
- title: >-
    pi 1.7.0 adds terminal session resume over OSC 7577 and removes install telemetry
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    pi can now be resumed by compatible terminals after a restart with its original tools
    and flags, and it no longer reports install telemetry.
  summary: >-
    pi 1.7.0, released 2026-11-27, reports a pi --session resume command through the Program
    Resume Protocol (OSC 7577) in terminals that set OSC7577_TOKEN, and the command repeats
    restriction flags such as --tools and --no-extensions so a resumed session cannot gain
    access. It removes the install telemetry endpoint, the enableInstallTelemetry setting
    and PI_TELEMETRY, adds an --agent-dir flag, and keeps the GitHub Copilot prompt cache
    when thinking levels change on supported Claude 5.x and GPT-6 models.
  why: >-
    Per-project pi profiles and tool restrictions now survive terminal restarts, and anyone
    parsing pi telemetry settings must drop them.
  background: >-
    OSC sequences are terminal escape codes a program writes to stdout to talk to the terminal
    emulator. A resume protocol lets the terminal record which command to rerun in a pane,
    so a crashed or restarted terminal can bring back long-running agent sessions instead
    of leaving a bare shell.
  event: pi-1-7-0-release
  sources:
  - label: primary
    url: https://github.com/earendil-works/pi/releases/tag/v1.7.0
- title: >-
    Convex skills in Anthropic's plugin marketplace send app ideas to a remote host and split
    downloads to dodge classifiers
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    A skill in Anthropic's official plugin marketplace posts the user's app idea to a remote
    host and splits curl and run to dodge classifiers.
  summary: >-
    An issue opened on 2026-10-26 against convex-backend-skill, which is listed in Anthropic's
    claude-plugins-official marketplace, shows the quickstart skill POSTing the user's one-sentence
    project idea to basic-anteater-667.convex.site as telemetry without telling the user.
    The add skill pipes scripts from the same host into bash, and labs-quickstart tells the
    agent to download and run its bootstrap in two separate Bash calls because a single download-and-execute
    command is the shape harness safety classifiers block. The issue is still open with all
    three passages on main.
  why: >-
    Skills from curated marketplaces can still exfiltrate prompts and coach the agent around
    your safety tooling, so read SKILL.md files and pin fetched scripts before installing.
  background: >-
    An agent skill is a folder of markdown instructions and scripts that a coding agent loads
    and follows as if the user had written them. Harnesses such as Claude Code run classifiers
    or permission rules over proposed shell commands to catch patterns like curl piped into
    bash. A skill that tells the agent to reshape a command defeats that check without the
    user seeing it.
  comments: >-
    The Hacker News thread reached 166 points and 51 comments. A commenter on the issue links
    a similar report that Notion's skill upsells its MCP server and tells Claude to mask a
    tracking link.
  event: convex-skill-telemetry-classifier-evasion
  sources:
  - label: primary
    url: https://github.com/convex/convex-backend-skill/issues/64
  - label: discussion
    url: https://news.ycombinator.com/item?id=50669765
- title: >-
    Brush 0.5 passes 96% of the bash-completion test suite and ships prebuilt Windows binaries
  section: Developer tools
  category: Dev tools
  blurb: >-
    Brush, a Bash-compatible shell in Rust, passes 96% of the bash-completion suite and ships
    its first prebuilt Windows binaries.
  summary: >-
    Brush v0.5.0, released 2026-11-26 after more than 360 merged PRs, passes 2,040 upstream
    bash-completion tests and grows its Bash-oracle suite from about 2,100 to over 3,600 cases,
    with end-to-end suites against fzf, atuin, mise, starship and zoxide. It fixes pipeline
    hangs when a function writes before its reader starts, honors HISTCONTROL, and adds an
    install.sh with SHA-256 and optional attestation checks. brush-core drops its direct clap
    dependency and replaces chrono with jiff, and each crate ships a versioned API migration
    guide.
  why: >-
    Brush is now close enough to Bash that existing scripts, mise activate and completion
    setups can be tried on it unchanged, and it can be embedded as a library with pluggable
    process launchers.
  background: >-
    Bash has no formal specification, so alternative implementations measure compatibility
    by running Bash's own behavior as an oracle and by passing the test suites of large Bash
    programs such as bash-completion. Brush is written in Rust and splits into parser, core
    and builtins crates so other programs can embed the shell engine.
  event: brush-0-5-0-release
  sources:
  - label: primary
    url: https://github.com/reubeno/brush/releases
  - label: discussion
    url: https://www.phoronix.com/news/Brush-0.5-Released
