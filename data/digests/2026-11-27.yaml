- title: >-
    MaskRay's direct -O0 code generator for LLVM cuts clang -O0 -g build instructions 14%
    on x86-64 and 21% on AArch64
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Fangrui Song's experimental LLVM pass turns IR straight into machine code bytes at -O0,
    falling back to the normal pipeline per function.
  summary: >-
    Fangrui Song describes a DirectCodeGen pass, enabled by -direct-codegen, that compiles
    a function from LLVM IR to encoded bytes without building a MachineFunction and sends
    any function it cannot handle to the regular pipeline in the same object file. On the
    compile-time tracker, clang -O0 -g builds take 14.3% fewer instructions on x86-64 and
    21.0% fewer on AArch64, while x86-64 text grows about 10% and AArch64 size is roughly
    unchanged. Claude Code wrote most of the code and drafted the post, and MC fixes found
    along the way landed separately.
  why: >-
    Debug build latency is dominated by the back end at -O0, and this shows how much a pipeline-skipping
    code generator can recover inside LLVM itself.
  background: >-
    At -O0 LLVM selects instructions with FastISel (or GlobalISel on AArch64), then runs dozens
    of machine IR passes such as fast register allocation, prologue insertion and debug value
    analysis before the assembly printer emits code. Skipping those passes means each one
    that can change output, such as stack protectors, CFI or pointer authentication, must
    be reimplemented or trigger fallback. The post gates on an exhaustive switch over function
    attributes so a new upstream attribute breaks the build instead of silently miscompiling,
    and checks that clang -S output assembles to the same bytes as clang -c.
  event: llvm-direct-o0-codegen
  sources:
  - label: primary
    url: https://maskray.me/blog/llvm-direct-o0-code-generator
- title: >-
    systemd 263-rc1 adds optional Rust programs and makes /run read-only under ProtectSystem=strict
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    The release candidate isolates AF_VSOCK sockets per network namespace, adds a PTY broker
    and merges networkd with networkctl.
  summary: >-
    systemd v263-rc1, tagged 2026-11-27, adds a -Drust= meson option for building programs
    in Rust, needing rustc 1.85 or later. It sets net.vsock.child_ns_mode=local on kernels
    7.0 and later, so services and containers in private network namespaces can no longer
    reach host vsock services, and it fixes ProtectSystem=strict leaving /run writable since
    v248. It also adds systemd-ptybrokerd, which keeps pseudo TTYs open independently of the
    client, and an IOuringFilter= unit setting.
  why: >-
    Services that wrote to /run under ProtectSystem=strict or containers that talk to host
    vsock need ReadWritePaths=, RuntimeDirectory= or a sysctl override before upgrading.
  background: >-
    AF_VSOCK is a socket family for communication between a VM and its hypervisor, and between
    VMs, without a network stack. ProtectSystem=strict mounts the whole file system read-only
    for a service except paths it explicitly lists. systemd announced Rust support earlier
    for new leaf programs, not for rewriting its core C library.
  event: systemd-263-rc1
  sources:
  - label: primary
    url: https://github.com/systemd/systemd/releases/tag/v263-rc1
  - label: discussion
    url: https://www.phoronix.com/news/systemd-263-rc1
- title: >-
    Cloudflare Workers gain an oidc_tokens binding that issues short-lived OIDC tokens for
    a Worker's own identity
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    A Worker can now mint signed JWTs for one audience and trade them for cloud credentials
    instead of storing long-lived secrets.
  summary: >-
    workers-utils 0.58.0, released with the 2026-11-27 Wrangler batch, adds the oidc_tokens
    binding, where env.BINDING.getToken() returns a newly signed JWT, ES256 by default with
    RS256 as an option. After a deploy, Wrangler prints the issuer and a subject containing
    the Worker's immutable ID for the verifier's trust policy. The binding does not work in
    local development yet, and accounts must be enabled before deploying it.
  why: >-
    Workers that call AWS, Google Cloud or internal APIs can drop stored API keys in favor
    of federated short-lived credentials.
  background: >-
    Workload identity federation lets a cloud provider trust an external OpenID Connect issuer
    and exchange its signed token for temporary credentials when the issuer, subject and audience
    match a policy. GitHub Actions popularized the pattern for CI, removing long-lived cloud
    keys from repository secrets.
  event: cloudflare-workers-oidc-tokens-binding
  sources:
  - label: primary
    url: https://github.com/cloudflare/workers-sdk/releases/tag/%40cloudflare%2Fworkers-utils%400.58.0
- title: >-
    Christophe Pettus: a missing PostgreSQL segment file silently truncates a table, and checksums
    and amcheck pass
  section: Engineering posts
  category: Engineering post
  blurb: >-
    PostgreSQL finds a table's end by walking 1GB segment files, so a lost middle file hides
    later rows with no error from scans or pg_dump.
  summary: >-
    Pettus removed the middle 1GB file of a three-segment table in a restored base backup
    on PostgreSQL 18.6 and 19rc1: sequential scans and pg_dump returned only the first file's
    917,504 rows without error, and pg_checksums and pg_amcheck passed. Later inserts reused
    the lost block numbers so index lookups returned wrong rows, and WAL replay recreated
    the segment as zeroed pages, while only pg_verifybackup against the backup manifest flagged
    the missing file. He also shows that packaged pg_checksums, pgBackRest and WAL-G assume
    1GB segments and misreport or corrupt clusters built with other sizes.
  why: >-
    After any file-level copy or restore, run pg_verifybackup against the manifest before
    starting the server, because a successful start proves nothing about missing segments.
  background: >-
    PostgreSQL stores each table or index as files of segment_size, 1GB by default, named
    after the relation's filenode with .1, .2 suffixes. The server keeps no authoritative
    length, so it measures files in order until one is short or absent. segment_size is fixed
    at compile time with --with-segsize and cannot be changed in postgresql.conf.
  event: pettus-postgres-segment-size
  sources:
  - label: primary
    url: https://postgr.es/p/9D_
- title: >-
    Cloudflare's Michelle Chen: decision and extraction models in front of GLM 5.3 cut a CI
    triage agent's tokens 94%
  section: Talks
  category: Video
  blurb: >-
    In a demo, Clef pruned 40 tools to 10 and an extraction model trimmed logs, so GLM 5.3
    made one call instead of five, in 9.2 s versus 17.2 s.
  summary: >-
    Chen says Cloudflare trained its first decision model over 48 hours after Jev launched
    on 2026-09-15 and shipped four models in three weeks. In a CI triage demo, the decision
    model selected tools and the extraction model pulled the PR number and the failing log
    lines, leaving one LLM call. She reports 72% lower cost, about 94% fewer LLM tokens and
    runtime falling from 17.2 to 9.2 seconds.
  why: >-
    Routing tool selection and log extraction to single-pass models is a measurable way to
    cut agent token spend without changing the final answer.
  event: cloudflare-neolab-michelle-chen-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=cYcYfM9Mvwo
- title: >-
    Grafana's Will explains Assistant Watchers: calibrated queries run deterministically and
    one LLM call decides to alert
  section: Videos
  category: Video
  blurb: >-
    Watchers calibrate once with an agent, then run fixed queries on a schedule and hand one
    report to a light LLM call, at a median $5 a month.
  summary: >-
    A calibration agent studies dashboards, knowledge graph memories and test queries to build
    a watcher, at under $1 on average. On each tick, from 5 minutes to 3 hours, code runs
    the same queries plus log pattern searches and an LLM reads the report to alert via Slack,
    Teams, webhooks or Grafana alerting, or to start an Investigation. Grafana says almost
    all internal watchers cost under $10 a month with a median of $5, and a weekly recalibration
    agent reviews run history to cut noise.
  why: >-
    It is a concrete design for LLM alerting that keeps query cost and nondeterminism bounded
    by moving the agent work to setup time.
  event: grafana-assistant-watchers-video
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=RwFZoxe5lP4
- title: >-
    Google's terms will require AI agents to use its Workspace MCP servers, and the public
    Gmail server cannot send
  section: Hacker News
  category: Pulse
  blurb: >-
    From 2027-02-01 Google's terms require AI agents to reach Workspace through its MCP servers,
    whose public Gmail tools cannot send mail.
  summary: >-
    Tech Stackups reports that Google made eight Workspace MCP servers generally available
    on 2026-11-24 and added a Workspace AI Tools Addendum requiring any tool that is or is
    driven by an AI agent to use them from 2027-02-01, with agents calling REST held to Standard-tier
    quotas. The public Gmail server can search, read and create drafts, but send, reply, forward
    and draft editing are partner-only, and the addendum lets Google cap retention of embeddings
    and memory indexes built from Workspace data at 30 days. The thread drew 227 points and
    202 comments on Hacker News.
  why: >-
    Anyone running an agent or MCP server against Gmail or Drive needs an OAuth client marked
    agentic and a plan for the missing write operations before 2027-02-01.
  followup: 2027-02-01, when the addendum takes effect.
  comments: >-
    Commenters note MCP already has an elicitation primitive, including a URL mode the server
    controls, that could gate sending behind human confirmation, so several read the partner-only
    restriction as a business decision. Others say agents will fall back to SMTP or browser
    automation, and one developer describes being sent to a paid CASA security assessment
    after OAuth verification for a draft-only Gmail agent.
  event: google-workspace-agent-mcp-mandate
  sources:
  - label: primary
    url: https://techstackups.com/articles/google-workspace-ai-agents-mcp/
