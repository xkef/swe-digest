- title: >-
    llama-cpp-rdna-boosts patch set lifts a Radeon R9700 from 35 to 55 tokens per second on
    Qwen3.8-27B
  section: Hacker News
  category: Pulse
  blurb: >-
    A writeup on llama-cpp-rdna-boosts, a patch set on llama.cpp for AMD RDNA cards, lifts
    token generation from 35 to 55 tokens per second.
  summary: >-
    A devnull.land post recommends llama-cpp-rdna-boosts, a small set of AMD-specific patches
    reapplied to pinned llama.cpp commits, which raised prefill from about 700 to 1300 tokens
    per second and generation from 35 to 55 on an eGPU-attached R9700 running a Q6_K_L Qwen3.8-27B
    with MTP. The author contrasts it with engines such as Strata that gain speed by changing
    expert selection toward experts already in VRAM. The thread drew 277 points and 65 comments
    on Hacker News.
  why: >-
    Hardware-specific patch sets can roughly double local inference speed on AMD cards, but
    engines that alter model computation need quality checks before agent use.
  comments: >-
    Commenters report similar agent-written kernel forks for older gfx906 MI50 and MI100 cards
    and RDNA3 7900 XTX cards, with gains of two to three times. Several warn that speed-focused
    forks rely on fast-math changes or expert substitution that degrade output at long context,
    and point to a Level1Techs benchmark of vLLM attention backends showing quality loss.
  event: llama-cpp-rdna-boosts-amd-fork
  sources:
  - label: primary
    url: https://devnull.land/amd-specific-llama-cpp
  - label: discussion
    url: https://news.ycombinator.com/item?id=50657265
- title: >-
    Essay on AI making self-hosting fun again draws 686 points and 341 comments as readers
    weigh vibe-coded home servers
  section: Hacker News
  category: Pulse
  blurb: >-
    Jan-Lukas Else says coding agents let him run NixOS, a bootc image and Renovate-driven
    deploys at home, and Hacker News splits on the cost.
  summary: >-
    Jan-Lukas Else writes that keeping his Docker Compose and system configuration in Git
    let coding agents set up NixOS on his home server, a Debian bootc image for his VPSes
    in half a day, and Renovate plus Forgejo Actions deploys triggered by a push, mostly using
    open-weight models. The Hacker News thread reached 686 points and 341 comments within
    12 hours.
  why: >-
    The thread shows practitioners handing whole infrastructure repositories to agents, and
    the security and maintenance load that follows.
  comments: >-
    One commenter says his home server was breached twice in the past year amid the volume
    of CVEs and constant bot traffic. Another had an agent build a bare-metal Kubernetes cluster
    on three Raspberry Pi 4s, with Traefik ingress, NFS volumes and Jenkins CI, without running
    a command by hand, and advises giving the agent a written inventory of the infrastructure.
    Others report shutting down tools they built only because they could.
  event: ai-self-hosting-hn-debate
  sources:
  - label: primary
    url: https://janlukas.blog/posts/ai-self-hosting
  - label: discussion
