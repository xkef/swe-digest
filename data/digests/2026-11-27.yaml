- title: >-
    Alex Kretzschmar's 20TB drive went from $249.99 to $549.99 in two years, and Hacker News
    argues cartel or supply
  section: Hacker News
  category: Pulse
  blurb: >-
    A homelabber's receipts show recertified enterprise drives up 58% to 218% per TB, and
    404 comments debate hyperscaler demand versus collusion.
  summary: >-
    Kretzschmar's eight years of receipts show the WD EasyStore 20TB at $549.99 this Black
    Friday against $249.99 in November 2024, and recertified ServerPartDeals drives up 58%
    to 218% per TB. He plans to consolidate ten disks into five 20TB drives despite redoing
    ZFS pools. The thread drew 469 points and 404 comments.
  why: >-
    Storage costs for self-hosted and small-server setups have roughly doubled, which changes
    disk refresh and pool layout plans.
  comments: >-
    Commenters split between supply and demand and oligopoly behavior, citing inflation-adjusted
    figures of DRAM up 4.46x, SSD 2.49x and HDD 1.85x per GB since 2023, a Forbes estimate
    that HDD capacity rose 27% in a year, and advice to hedge next year's cloud bill against
    memory prices.
  event: hard-drive-prices-black-friday-2026
  sources:
