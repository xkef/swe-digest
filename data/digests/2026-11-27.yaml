    jjui 0.10.14 deletes bookmarks on abandon like jj does and lets Lua actions resize the
    preview
  section: Developer tools
  category: Dev tools
  blurb: >-
    The jj terminal UI now deletes bookmarks on abandon like jj itself, and Lua actions can
    set the preview pane's size up to full screen.
  summary: >-
    jjui v0.10.14, released 2026-11-26, stops passing --retain-bookmarks on abandon, so bookmarks
    on abandoned revisions are deleted as with jj abandon, and revisions.abandon.retain_bookmarks
    = true restores the old behavior. ui.preview gains set_size(percent) and size() for Lua
