  section: Hacker News
  category: Pulse
  blurb: >-
    Jan-Lukas Else says coding agents let him run NixOS, a bootc image and Renovate-driven
    deploys at home, and Hacker News splits on the cost.
  summary: >-
    Jan-Lukas Else writes that keeping his Docker Compose and system configuration in Git
    let coding agents set up NixOS on his home server, a Debian bootc image for his VPSes
    in half a day, and Renovate plus Forgejo Actions deploys triggered by a push, mostly using
    open-weight models. The Hacker News thread reached 686 points and 341 comments within
    12 hours.
  why: >-
    The thread shows practitioners handing whole infrastructure repositories to agents, and
    the security and maintenance load that follows.
  comments: >-
    One commenter says his home server was breached twice in the past year amid the volume
    of CVEs and constant bot traffic. Another had an agent build a bare-metal Kubernetes cluster
    on three Raspberry Pi 4s, with Traefik ingress, NFS volumes and Jenkins CI, without running
    a command by hand, and advises giving the agent a written inventory of the infrastructure.
    Others report shutting down tools they built only because they could.
