- title: >-
    Spotify's 2026-09-29 outage: Argo CD reset autoscaled login service replicas to minReplicas
    on every sync
  section: Top stories
  category: Engineering post
  blurb: >-
    Two separately tested deployment changes made Argo CD overwrite autoscaler replica counts,
    and returning logins hit 200 times normal load.
  summary: >-
    Spotify says one change moved workloads from Kubernetes Deployments to Argo Rollouts and
    another changed which fields its deployment diff ignores, so Argo CD set replicas to minReplicas
    on every sync for Rollouts services with a test environment. A login service was among
    them, and reissuing tokens drove the login system to 200 times its pre-incident traffic
    while automation kept reapplying the faulty configuration. Errors began at 13:45 UTC,
    most regions recovered by 16:30, and one European region took until 19:34.
  why: >-
    Teams running Argo CD next to an autoscaler should confirm replica fields are excluded
    from sync diffs and that responders can pause reconciliation fast.
  background: >-
    A Kubernetes HorizontalPodAutoscaler owns a workload's replica count, so a GitOps controller
    that also writes that field fights it. Argo CD compares live state with the desired state
    and reapplies any difference unless the field is ignored. Argo Rollouts replaces the Deployment
    object with its own resource type to add canary and blue-green strategies, so ignore rules
    written for one schema can miss the other. A thundering herd is the load spike when many
    clients retry or reauthenticate at once after an outage.
  event: spotify-2026-09-29-outage-argo-replicas
  sources:
  - label: primary
    url: https://engineering.atspotify.com/2026/11/september-29-outage-incident-report-what-we-learnt/
- title: >-
    Researcher traces OpenRouter DeepSeek traffic from Novita, StreamLake and Ant Digital
    to ByteDance's Ark API
  section: AI
  category: AI
  blurb: >-
    Request IDs, tool-call formats, image fetches and canned refusals show prompts sent to
    several ZDR-labeled providers ended up at ByteDance.
  summary: >-
    A post on kendell.dev fingerprints OpenRouter providers and finds DeepSeek and GLM requests
    to Novita, StreamLake and Ant Digital returning ByteDance Ark request and tool-call ID
    formats, images fetched from Volcano Engine and BytePlus addresses, and ByteDance's canned
    censorship refusal, with chains such as SiliconFlow to StreamLake to Novita to ByteDance.
    OpenRouter removed ZDR labels from Novita around 2026-11-20 and Ant Digital on 2026-11-22,
    after AtlasCloud, Novita and StreamLake admitted forwarding MiniMax requests to MiniMax,
    whose security system opened URLs from ZDR prompts. The author discloses an OpenRouter
    grant and publishes attested test runs.
  why: >-
    A provider's zero data retention label says nothing about where it forwards requests,
    so routing sensitive prompts through aggregators needs a pinned, verified provider list.
  background: >-
    OpenRouter routes one API call to any of many inference hosts for the same open-weight
    model, and labels hosts that promise zero data retention (ZDR). A host that resells another
    vendor's API passes the prompt to a party the customer never vetted. Earlier canary studies
    by Vercel and Dragos used unique URLs in prompts to catch providers reading traffic.
  comments: >-
    The Hacker News thread drew 100 points and 15 comments. One commenter reports Novita's
    Qwen endpoint returned Alibaba error messages months ago and Novita admitted routing to
    Alibaba after first denying it. Another explains the arbitrage: wrappers route base load
    to the upstream API at cost and shift traffic to cheap preemptible GPUs when available.
  event: novita-streamlake-bytedance-ark-routing
  sources:
  - label: primary
    url: https://kendell.dev/blog/arkwrapper/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50660273
- title: >-
    Florian Marending runs coding agents in per-project smolvm microVMs driven by a mise shell
    alias
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    He dropped nono's Seatbelt sandbox and a shared Lima VM for smolvm, whose balloon memory
    makes one VM per repository affordable.
  summary: >-
    Marending found that Lima allocates memory statically and cannot return it to the host
    on macOS, which pushed him toward one VM for all projects. smolvm boots from OCI images
    and supports elastic memory through virtio balloon, so each repository gets its own VM,
    and a mise shell alias m runs mise tasks and pi inside it with the workspace mounted.
    He copies agent transcripts out before teardown and says the setup is too convoluted for
    a team.
  why: >-
    It shows a workable per-repository VM boundary for agents on macOS that keeps host editing
    and jj while the agent cannot touch the rest of the machine.
  background: >-
    Seatbelt is the macOS kernel sandbox behind sandbox-exec, which Apple deprecated without
    a supported replacement for arbitrary processes. A virtio balloon driver lets a guest
    hand unused memory back to the hypervisor, so idle VMs do not hold their full allocation.
    MicroVMs give agents a separate kernel, a stronger boundary than containers that share
    the host kernel.
  event: marending-smolvm-agent-isolation
  sources:
  - label: primary
    url: https://marending.dev/notes/agent-isolation/
- title: >-
    Brush 0.5 passes 96% of the bash-completion test suite and ships prebuilt Windows binaries
  section: Developer tools
  category: Dev tools
  blurb: >-
    Brush, a Bash-compatible shell in Rust, passes 96% of the bash-completion suite and ships
    its first prebuilt Windows binaries.
  summary: >-
    Brush v0.5.0, released 2026-11-26 after more than 360 merged PRs, passes 2,040 upstream
    bash-completion tests and grows its Bash-oracle suite from about 2,100 to over 3,600 cases,
    with end-to-end suites against fzf, atuin, mise, starship and zoxide. It fixes pipeline
    hangs when a function writes before its reader starts, honors HISTCONTROL, and adds an
    install.sh with SHA-256 and optional attestation checks. brush-core drops its direct clap
    dependency and replaces chrono with jiff, and each crate ships a versioned API migration
    guide.
  why: >-
    Brush is now close enough to Bash that existing scripts, mise activate and completion
    setups can be tried on it unchanged, and it can be embedded as a library with pluggable
    process launchers.
  background: >-
    Bash has no formal specification, so alternative implementations measure compatibility
    by running Bash's own behavior as an oracle and by passing the test suites of large Bash
    programs such as bash-completion. Brush is written in Rust and splits into parser, core
    and builtins crates so other programs can embed the shell engine.
  event: brush-0-5-0-release
  sources:
  - label: primary
    url: https://github.com/reubeno/brush/releases
  - label: discussion
    url: https://www.phoronix.com/news/Brush-0.5-Released
