- title: >-
    Cisco and OpenAI open-source Shirudo, an agent-driven Tetragon rewrite that ships live
    eBPF and bytecode shields
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Cisco and OpenAI open-source Shirudo, a Tetragon rewrite that lets agents write eBPF or
    bytecode shields for unpatched flaws at runtime.
  summary: >-
    Shirudo delivers small mitigations to a running kernel or workload. A mitigation can block
    a vulnerable path, replace vulnerable code or add detection, and it needs no restart.
    An operator CLI builds shields as eBPF or application bytecode, signs them as .bee packages
    and distributes them through an OCI registry, and targets check the signatures against
    their TPM. In a Codex-driven demo, an agent generated a Java bytecode shield that blocked
    a Java4Shell exploit against a running Elasticsearch 9.5.5.
  why: >-
    It shows a concrete design for agent-written runtime mitigations that cover the gap between
    disclosure and patch rollout, built on eBPF and signed OCI artifacts that platform teams
    already run.
  background: >-
    eBPF lets verified programs attach to kernel hook points and change or observe behavior
    without rebooting. Isovalent's Tetragon used it for runtime security policy written by
    humans. Shirudo replaces that policy language with code that agents write, and adds bytecode
    injection for flaws that eBPF cannot reach, such as a JVM intrinsic bug.
  event: shirudo-open-source-launch
  sources:
  - label: primary
    url: https://isovalent.com/blog/post/cisco-openai-shirudo/
- title: >-
    PGAIBench: frontier models caused harm in 13 of 408 live Postgres changes, and a clone
    gate plus auditor blocked 12
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Ten models ran 949 production-style Postgres 18.7 tickets, and Claude Fable 5.2 broke
    a no-restart rule in all five repeats of one task.
  summary: >-
    PostgresAI ran 10 models on 19 scenarios with 5 repeats on live two-node Postgres 18.7
    clusters under load, and 13 of 408 changes executed on the primary caused measured harm,
    including Grok 4.7 dropping indexes unused on the primary but hot on an async standby.
    It proposes AAA, where an Analyst drafts a change, a deterministic Actor rehearses it
    on a live clone and is the sole write path, and an Auditor model reviews the clone evidence.
    In an in-sample replay the clone gate stopped 6 harms at no LLM cost and a Fable 5.2 Auditor
    stopped 6 more, while 377 of 378 safe or unclassified changes stayed approved.
  why: >-
    Agents that change production databases need per-node telemetry and clone rehearsal under
    load, since primary-only checks and green 60-second summaries missed real harm.
  background: >-
    Many Postgres DDL statements take an AccessExclusiveLock, and a pending one queues every
    later reader and writer on the table behind it. Safe patterns split work, such as adding
    a constraint NOT VALID and validating it in a separate transaction. Index usage counters
    in pg_stat_user_indexes are per node, so an index idle on the primary can still serve
    replica reads.
  event: pgaibench-aaa-postgres-ai-changes
  sources:
  - label: primary
    url: https://postgr.es/p/9Dh
- title: >-
    Dex Horthy: software factories are ordinary engineering, and top models score about 16%
    on Slop Code Bench
  section: Talks
  category: Video
  blurb: >-
    Dex Horthy argues software factories are ordinary engineering with agents building, citing
    Slop Code Bench scores near 16% for top models.
  summary: >-
    Horthy, now at Factory after Human Layer joined it, says a factory needs forward pressure,
    such as routing feature requests and incidents to agents, and back pressure from agent
    review, CI, linters and formal checks. Slop Code Bench measures how well models evolve
    a codebase across checkpoints, and the best models score about 15% to 16%. He reports
    newer Claude and GLM models falling back to Python 2 style percent formatting instead
    of f-strings. He recommends planning in proportion to the cost of later change, giving
    agents feature flags and ways to test their own work, and adopting anti-slop lint rule
    sets.
  why: >-
    Unattended agents still degrade codebases over time, so teams should invest in automated
    back pressure such as lint rules and verification before they remove human review.
  event: dex-horthy-12-factor-factories-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=-NFMsM2y0Vk
- title: >-
    xnulinux boots macOS 27 to the desktop by loading XNU as a kernel module inside arm64
    Linux
  section: Hacker News
  category: Pulse
  blurb: >-
    A source-built macOS kernel runs as xnu.ko beside Linux with no hypervisor, booting Safari
    and Finder, and Hacker News debates the approach.
  summary: >-
    xnulinux builds XNU from Apple's published sources and loads it as xnu.ko into a stock
    arm64 Linux kernel, with an fki.ko interface module lending memory, timers, files, network
    and GPU, so macOS processes run natively beside Linux processes. It boots a macOS 27.2.1
    disk made by Apple's installer to the desktop in 31 to 48 seconds inside an arm64 Linux
    VM on Apple Silicon, and survived a 30-minute app stress run, though AMFI is patched,
    SIP relaxed and memory access is slower than a native VM. The thread drew 272 points and
    121 comments on Hacker News.
  why: >-
    It shows a co-kernel design where a second OS kernel shares CPUs with Linux through a
    narrow module interface instead of a hypervisor.
  comments: >-
    Commenters point out it still needs PAC-capable Apple hardware with 4K pages and the user's
    own macOS install, suggest Darling as a syscall-level alternative, and compare it with
    CoLinux and with running XNU under KVM.
  event: xnulinux-xnu-kernel-module
  sources:
  - label: primary
    url: https://github.com/AFK-surf/xnulinux
  - label: discussion
    url: https://news.ycombinator.com/item?id=50607261
- title: >-
    Ladybird enters alpha with macOS and Linux builds of its from-scratch browser engine
  section: Hacker News
  category: Pulse
  blurb: >-
    Ladybird ships alpha builds for macOS and Linux with its own from-scratch engine, WebDriver
    support and automatic rolling updates.
  summary: >-
    Andreas Kling announced the Ladybird alpha on 2026-11-23 as a rolling channel with automatic
    updates, in-browser broken-site reports and opt-in crash reports. It supports WebDriver
    and the Firefox DevTools protocol, and the team makes no security promises yet. The Hacker
    News thread drew over 1,000 points and 261 comments.
  why: >-
    Web developers can now test sites against an independent engine without building it from
    source, and wire it into WebDriver test suites.
  comments: >-
    Testers report most sites rendering correctly with slightly jerky scrolling. One commenter
    says Ladybird must pose as Chrome to pass some bot detection. Others note that it now
    uses SQLite, Skia and ANGLE instead of in-house libraries and argue whether that weakens
    its independence from Chrome.
  event: ladybird-browser-alpha
  sources:
  - label: primary
    url: https://ladybird.org/posts/alpha/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50614249
