- title: >-
    gitoxide 0.62 adds gix fsmonitor, gix watch and gix notify, plus a --repo-trust flag for
    config trust levels
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The Rust Git implementation's CLI gains a Git-compatible filesystem monitor daemon and
    file watchers, and plumbing crates move to std errors.
  summary: >-
    gitoxide 0.62.0, released 2026-11-22 alongside gix 0.91.0 and new gix-notify and gix-fsmonitor
    0.1.0 crates, adds gix fsmonitor with foreground and detached daemons, token queries and
    Git hook-v2 autostart, plus gix watch for repository invalidations and gix notify for
    raw filesystem events. A --repo-trust option sets full or reduced trust, or forces either,
    to compare how repository configuration behaves, and plumbing crates now use a std::error::Error
    compatible error type. The CLI tooling now requires Rust 1.91 while gix and its plumbing
    stay on Rust 1.88.
  why: >-
    Projects building on gix can now drive a Git-compatible fsmonitor and change notifications
    from the library, and CLI builds need Rust 1.91.
  background: >-
    Git's core.fsmonitor setting lets git status ask a daemon which paths changed since a
    token instead of stat-ing every file, which matters on large worktrees. Repository trust
    decides whether configuration from a repository the user does not own is honored, the
    mechanism behind Git's safe.directory protection.
  event: gitoxide-0-62-0-release
  sources:
  - label: primary
    url: https://github.com/GitoxideLabs/gitoxide/releases/tag/v0.62.0
- title: >-
    hyper 1.13.0 adds an HTTP/2 executor getter and fixes HTTP/1 and HTTP/2 framing and shutdown
    bugs
  section: Languages and runtimes
  category: Languages
  blurb: >-
    hyper 1.13.0 adds an HTTP/2 executor getter and fixes framing bugs, including Content-Length
    kept alongside Transfer-Encoding.
  summary: >-
    hyper 1.13.0 adds an executor getter for HTTP/2 servers and clients. In HTTP/1 it now
    drops Content-Length when a response also carries Transfer-Encoding, errors when the final
    body chunk is shorter than Content-Length, rejects bare LF in trailers and drains in-flight
    requests before dispatcher shutdown. In HTTP/2 it strips every header named in a Connection
    header and fixes requests that hung during a concurrent connection shutdown.
  why: >-
    Services built on hyper, directly or through axum, tonic or reqwest, get stricter message
    framing and fewer hung requests at shutdown after a semver-compatible upgrade.
  event: hyper-1-13-0-release
  sources:
  - label: primary
    url: https://github.com/hyperium/hyper/releases/tag/v1.13.0
- title: >-
    SeaweedFS 4.55 adds JWT signing key rotation, filer HTTP Basic Auth and a fips140=only
    mode
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The release lets S3 requests authenticate by verified client certificate, enforces BlockPublicPolicy,
    and hardens Helm JWT keys and secrets.
  summary: >-
    SeaweedFS 4.55, released 2026-11-23, accepts a previous JWT signing key during rotation,
    adds optional HTTP Basic Auth on filer HTTP ports and scoped read-only tokens for metadata
    subscriptions, and authenticates unsigned S3 requests by a verified client certificate.
