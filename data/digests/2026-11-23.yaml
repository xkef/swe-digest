- title: >-
    Nvidia's board reinstates Jensen Huang as president, CEO and board director, citing US
    government input
  section: Top stories
  category: Markets
  blurb: >-
    Nvidia's board unanimously brought Jensen Huang back as president, CEO and director after
    US government input, while its probe continues.
  summary: >-
    Nvidia announced on 2026-11-23 that its board voted unanimously to reinstate Jensen Huang
    as president, CEO and board member, effective immediately, after meetings with him and
    input from senior levels of the US government that left it confident his return poses
    no national security risk. Harvey Jones stays board chair and Colette Kress returns to
    CFO duties. The independent committee investigating reports that Huang was the target
    of a foreign intelligence effort will continue, and Nvidia is hiring a Chief Compliance
    Officer.
  why: >-
    Leadership of the dominant AI accelerator vendor is settled again, though the open investigation
    and new export control oversight keep its China and compliance posture uncertain.
  background: >-
    Huang co-founded Nvidia and led it until his resignation, which this digest covered on
    2026-11-12, when CFO Colette Kress became interim CEO. The press release ties the episode
    to reporting that Huang was the target of a foreign intelligence effort, and says the
    board also formed a National Security and Export Control Committee of independent directors.
    Nvidia's CUDA platform and data center GPUs underpin most AI training and inference, so
    its leadership and export posture shape GPU supply for the whole industry.
  comments: The Hacker News thread on the announcement drew 1,624 points and 1,375 comments.
  thread: f-0231
  event: nvidia-reinstates-jensen-huang-ceo
