- title: >-
    CISA lists Cisco Expressway CVE-2026-76466, a hard-coded credential root RCE, as exploited
    in the wild
  section: Security
  category: Security
  blurb: >-
    Attackers gain root on clustered Cisco Expressway gateways through hard-coded credentials,
    and CISA gave federal agencies three days to patch.
  summary: >-
    CISA added CVE-2026-76466 to its Known Exploited Vulnerabilities catalog on 2026-11-20
    with a due date of 2026-11-23, describing hard-coded credentials that let an unauthenticated
    remote attacker with persistent cookies run commands as root on a clustered Expressway
    device through its database service. Cisco patched the flaw in late October and says its
    PSIRT is not aware of exploitation. F6 reports attackers using an AI assistant compromised
    two internet-facing Expressway nodes, pivoted to two internal cluster nodes, and used
    Python scripts to probe SMB, SQL Server, WinRM and GitLab repositories for credentials.
  why: >-
    Teams running Expressway-C or Expressway-E clusters should apply Cisco's October fix now
    and check internal nodes and reachable GitLab instances for credential theft.
  background: >-
    Cisco Expressway is a collaboration gateway, shipped as a VM or appliance, that connects
    internal voice and video systems to outside networks and remote users. A KEV listing means
    CISA has evidence of exploitation, and under BOD 26-04 this entry also requires federal
    agencies to perform forensic triage, not just patch.
  event: cisco-expressway-cve-2026-76466-exploitation
  sources:
  - label: primary
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/cisa-flags-critical-cisco-expressway-rce-flaw-as-actively-exploited/
- title: >-
    cookie 0.18.3 fixes RUSTSEC-2026-0594, AES-GCM nonce reuse in private cookies after fork()
  section: Security
  category: Security
  blurb: >-
    Private cookies in the cookie crate can reuse AES-GCM nonces after fork(), letting attackers
    forge them. Version 0.18.3 fixes it.
  summary: >-
    The cookie crate drew private cookie nonces from rand::thread_rng(), whose buffered bytes
    survive fork(), so the first private cookies sealed after a fork in parent and children
    can share nonces, which lets an attacker recover plaintext XORs and the GHASH key to forge
    cookies. Only processes that fork without exec and add private cookies on the forking
    thread are affected, which excludes axum on a normal multi-threaded runtime and Rocket.
    Version 0.18.3 takes nonces from the OS random generator, and affected deployments should
    rotate their Key.
  why: >-
    axum-extra PrivateCookieJar users who fork workers onto current-thread runtimes should
    upgrade cookie and rotate keys, and everyone else should still bump the lockfile.
  background: >-
    AES-GCM is safe only while each nonce is used once per key. A repeated nonce exposes the
    XOR of two plaintexts and lets an attacker derive the authentication key used to forge
    tags. User-space random generators that buffer output are a known hazard across fork(),
    since both processes continue from the same buffered state.
  event: rust-cookie-private-nonce-reuse-fork
  sources:
  - label: primary
    url: https://rustsec.org/advisories/RUSTSEC-2026-0594.html
- title: >-
    Hetzner Object Storage in fsn1 is degraded again, with bucket requests failing on and
    off since 2026-11-14
  section: Outages
  category: Outage
  blurb: >-
    Hetzner Object Storage in Falkenstein has had failing or timed-out bucket requests on
    and off since 2026-11-14, and is degraded again today.
  summary: >-
    Hetzner's status page lists an Object Storage incident in fsn1 that began 2026-11-14 00:40
    UTC, where requests to some buckets may fail or time out. It was marked fixed and then
    reopened on 2026-11-15 and 2026-11-19, and on 2026-11-23 Hetzner reported a significant
    increase in requests on the clusters and returned the incident to in progress while it
    migrates data.
  why: >-
    Teams using fsn1 Object Storage for backups, such as CloudNativePG WAL archives, should
    check for failed uploads over the past nine days and consider another location.
