- title: >-
    GitHub will block pull_request_target workflows by default in public repositories from
    2026-12-02
  section: Top stories
  category: Dev tools
  blurb: >-
    Public repos lose the privileged fork PR trigger by default next week, and PSF engineers
    publish an allowlist policy to roll out org-wide.
  summary: >-
    PSF security engineers Mike Fiedler and Seth Larson write that GitHub will block the pull_request_target
    trigger by default in public repositories on 2026-12-02, and that the default policy runs
    in evaluate mode until then, with affected runs shown in Policy insights. They recommend
    an organization Actions event policy that allows only pull_request, push, release, repository_dispatch,
    schedule, workflow_dispatch and workflow_run, rolled out in Evaluate mode first, and note
    that GitHub's default steps aside as soon as an organization defines its own policy. Organization-level
    policies need a paid plan, so Free organizations must apply the policy per repository
    through the gh API.
  why: >-
    Fork PR labelers, welcome bots, slash-command bots on issue_comment and merge queues can
    stop running, so audit Policy insights and migrate them before 2026-12-02.
  background: >-
    A pull_request workflow runs fork code with a read-only token and no secrets, while pull_request_target
    runs from the base branch with a read/write token and the repository's secrets. When such
    a workflow checks out the PR head and runs it, any GitHub user can execute code with those
    credentials, a pattern called a pwn request. The post ties Ultralytics, the Trivy compromise
    behind the LiteLLM and Telnyx releases, TanStack, Nx and tj-actions to these triggers,
    and notes that PyPI, npm and crates.io Trusted Publishing already reject tokens from some
    of them.
  followup: GitHub enforcement of the default block on 2026-12-02.
  event: github-pull-request-target-default-block
  sources:
