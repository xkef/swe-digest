- title: >-
    Google's DeepCrossAttention routes residual connections per token and cuts transformer
    depth 29% at equal perplexity
  section: ML research
  category: ML research
  blurb: >-
    Google's DeepCrossAttention replaces fixed residual sums with learned per-token routing
    over earlier layers, matching quality in fewer steps.
  summary: >-
    Google Research describes DeepCrossAttention, from its ICML 2025 paper. Each layer mixes
    the outputs of earlier layers with learned, input-dependent weights and applies cross-attention
    across depth instead of summing residuals equally. On LM1B and C4 it matched standard
    transformers in up to five times fewer training steps, and it reached under 14 perplexity
    on LM1B with 30 layers where a baseline needed 42. It adds under 0.2% parameters and can
    be retrofitted onto a pretrained model.
  why: >-
    Dynamic residual routing is spreading into open models such as Inkling 2, so engineers
    who serve or fine-tune them should expect higher memory bandwidth use per layer.
  background: >-
    Residual connections add each layer's input to its output so that gradients flow through
    deep networks. Summing every layer with equal weight dilutes features from early layers.
    Related designs include Moonshot AI's attention residuals and hyper-connections, which
    widen the residual stream into several channels.
  event: google-deepcrossattention-residuals
  sources:
  - label: primary
    url: https://research.google/blog/supercharging-transformer-residual-connections/
- title: >-
    Neovim master lets nvim_buf_set_lines, nvim_buf_set_text and nvim_put accept a multiline
    string
  section: Developer tools
  category: Dev tools
  blurb: >-
    Neovim master lets nvim_buf_set_lines, nvim_buf_set_text and nvim_put take a multiline
    string, about twice as fast as calling vim.split.
  summary: >-
    A commit by Justin M. Keyes lets the three API functions take a String that C splits at
    newlines without copying, about 2x faster than vim.split() and about 20% faster than a
