- title: >-
    Fly.io says agents run 55% of its deployments and its software factory rewrites its own
    prompts after scoring
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Fly.io says agents now perform at least 55% of its deployments and describes a factory
    whose Scorer agent opens PRs against its own prompts.
  summary: >-
    Fly.io says at least 55% of its deployments are now done by agents, and it added auth.md
    agent signup with 24-hour self-renewing tokens and agent credit top-ups over HTTP 402
    with human approval in Stripe Link. Its internal software factory runs Claude Code on
    separate Sprites for research, change, verification and review, ending in a draft PR.
