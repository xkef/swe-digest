- title: >-
    Vercel AI Gateway runs canary audits to catch inference providers reading prompts despite
    zero data retention
  section: AI
  category: AI
  blurb: >-
    Vercel AI Gateway now plants unique URLs in prompts to catch inference providers that
    read or crawl prompt content despite ZDR terms.
  summary: >-
    Vercel's AI Gateway now sends prompts containing freshly minted URLs, each privately mapped
    to a provider, model and run, through the normal inference path with Zero Data Retention
    requested. Any request to a canary URL is recorded for investigation, and non-ZDR provider
    pairs serve as positive controls.
  why: >-
    Teams routing source code or customer data through hosted inference get ongoing evidence
    of provider behavior instead of relying only on contracts and point-in-time audits.
  background: >-
    Zero Data Retention is a contractual promise that a provider does not store or inspect
    prompts after serving them. Canary tokens are a long-standing detection technique: a unique
    value that only an unauthorized reader would ever act on. Dragos used the same method
    to expose breached inference providers, which this digest covered on 2026-11-21.
  event: vercel-ai-gateway-canary-zdr-audits
  sources:
  - label: primary
    url: https://vercel.com/changelog/ai-gateway-now-runs-canary-zdr-audits
- title: >-
    APM 0.38.0 adds --policy to install and update, project-scope native plugins and AGENTS.md
    for Claude
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Agent Package Manager can enforce an org policy at install time, render agents to Codex
    TOML, and pins whole hook bundles in approval hashes.
  summary: >-
    APM 0.38.0, released 2026-11-22, adds a --policy flag to apm install and apm update, a
    root apm.yml marketplaces map with a marketplace.allow policy, authentication for private
    hosted HTTPS catalogs, and opt-in strict host credentials for GitHub-class hosts. It converges
