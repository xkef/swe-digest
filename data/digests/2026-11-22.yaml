- title: >-
    Ahmad Osman: local inference needs per-model, per-chip engines, and batching decides the
    hardware
  section: Talks
  category: Video
  blurb: >-
    Ahmad Osman argues local inference needs per-model, per-chip engines, and shows an RTX
    Pro 6000 batching 50 requests near 1,300 tok/s.
  summary: >-
    At CODE Summit 2026, Osmantic founder Ahmad Osman says prefill is compute bound and decode
    is memory bandwidth bound, so hardware should be chosen by workload, and shows a Qwen
    3.6 27B race in which an RTX Pro 6000 reached almost 1,300 tokens per second at 50 parallel
    requests while an M5 Max MacBook Pro, a DGX Spark and Strix Halo ran requests sequentially,
    which he calls a software gap. He argues for inference engines tuned per model, per chip
    and per workflow rather than one general engine, warns that uniform 4-bit quantization
    damages models compared with per-layer dynamic schemes, and cautions that cheap hosted
    providers may silently route to other models.
  why: >-
    Engineers sizing self-hosted inference for agents should benchmark concurrent throughput
    on their own workload, since agent fan-out favors GPUs with mature batching software over
    single-stream speed.
  background: >-
    Prefill processes the whole prompt in parallel and is limited by compute, while decode
    emits one token at a time per sequence and is limited by how fast weights stream from
    memory. Batching many sequences shares each weight read across requests, which is why
    server engines such as vLLM gain throughput with concurrency while single-user engines
    do not.
  event: ahmad-osman-local-ai-production-talk
  sources:
