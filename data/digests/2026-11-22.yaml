- title: >-
    Ravi Vakil posts Alessandro Masullo's human-written GRH draft, and readers using AI models
    report problems within hours
  section: Hacker News
  category: Pulse
  blurb: >-
    Ravi Vakil posts Alessandro Masullo's human-written draft proof of GRH, and within hours
    readers using AI models report problems in it.
  summary: >-
    On 2026-11-20 Ravi Vakil published Alessandro Maria Masullo's draft proof of the Generalized
    Riemann Hypothesis, written without AI and reviewed for months by Brian Conrad, earlier
    than planned and asking for quick checking and formalization. About eight hours later
    he added that several people had reported problems found with the help of AI models and
    that he makes no claim about the proof strategy. The thread drew 2,408 points and 1,171
    comments on Hacker News, the most of any item this run.
  why: >-
    The episode shows AI-assisted checking now finds candidate flaws in a long human proof
    within hours, the same week a Lean-certified AI proof of the Riemann Hypothesis appeared.
  comments: >-
    Commenters say Masullo, working for 12 years, likely rushed the draft out after Anthropic's
    Alpöge announcement, and debate how researchers can claim priority, from posting a hash
    with timestamps to partnering with formal-methods startups. One commenter says a few hours
    with an LLM let him check the logic of a refutation by Nielsen and posted the work on
    GitHub. Others contrast the 17-million-line Lean certificate, useful mainly as an oracle,
    with a readable 900-page human argument.
  event: masullo-grh-proof-draft
