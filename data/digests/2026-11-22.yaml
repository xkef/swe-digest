- title: >-
    Tangled spindles add a Namespace CI engine using per-run OIDC tokens, and knot 1.20.1
    fixes Go module fetches
  section: Developer tools
  category: Dev tools
  blurb: >-
    Tangled spindles can now run CI on a user's Namespace workspace through OIDC, and knot
    1.20.1 fixes Go module fetches from knots.
  summary: >-
    Tangled's spindle CI gains a namespace engine that runs workflows on the user's own Namespace
    workspace with configurable machines, multiarch builds and cache volumes, using a short-lived
    OIDC token per run instead of stored credentials. Knot 1.20.1 fixes GOPROXY=direct and
    Go module proxy fetches, requests crawling automatically, adds knot doctor and a handover
    repair command, and removes the old Go knot from the tree. The post also lists community
    knots backed by static files, a Cloudflare Worker and S3, and spindles that drive Crow
    CI and OCluster.
  why: >-
    Teams evaluating AT Protocol forges can now attach their own CI capacity without handing
    the forge long-lived secrets, and knot operators should upgrade for Go module fixes.
  background: >-
    Tangled is a code forge built on the AT Protocol, where a knot is a Git server that exposes
    a defined XRPC interface and a spindle is a CI runner that reads workflows and reports
    results. Because both are defined by protocol surfaces, third parties can build their
    own implementations that the central Tangled app indexes.
  event: tangled-namespace-spindle-engine
  sources:
  - label: primary
    url: https://tangled.org/blog/namespace-engine
- title: >-
    Raph Levien's advice for the next 100 Rust GUIs: Parley and AccessKit are solved, compositor
    layers are not
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Raph Levien says Parley and AccessKit now solve Rust GUI text layout and accessibility,
    while system compositor integration is still missing.
  summary: >-
    In a 2026-11-21 follow-up to his 2022 post, Levien writes that Parley is now used by most
    new Rust UI toolkits for text layout and AccessKit for accessibility, but that toolkits
    still rarely use system compositor layers, which matter for hardware-accelerated video.
    He argues immediate mode toolkits such as egui scale poorly for productivity apps because
    they must build stable widget identities and cache text layouts, notes that Shopify and
    Discord mobile use native UI over shared logic, and recommends separating design from
    an incremental execution engine, adapting a curated subset of web standards through modular
    engines such as Blitz.
  why: >-
    Teams planning AI-assisted Rust rewrites get a concrete map of which GUI infrastructure
    is mature and which architectural choices, such as immediate mode or ignoring compositor
    layers, cost them later.
  background: >-
    Retained mode toolkits keep a persistent widget tree and update it incrementally, while
    immediate mode toolkits rebuild the UI description every frame from application state.
    The system compositor, such as Core Animation on Apple platforms or SurfaceFlinger on
    Android, blends separately rendered layers so unchanged content and video need not be
    redrawn. Levien leads Linebender, which builds the Xilem, Masonry, Vello and Parley crates.
  comments: The post drew 152 points and 50 comments on Hacker News.
  event: raph-levien-next-100-rust-guis
  sources:
  - label: primary
    url: https://linebender.org/blog/next-100-guis/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50593737
- title: >-
    Ahmad Osman: local inference needs per-model, per-chip engines, and batching decides the
    hardware
  section: Talks
  category: Video
  blurb: >-
    Ahmad Osman argues local inference needs per-model, per-chip engines, and shows an RTX
    Pro 6000 batching 50 requests near 1,300 tok/s.
  summary: >-
    At CODE Summit 2026, Osmantic founder Ahmad Osman says prefill is compute bound and decode
    is memory bandwidth bound, so hardware should be chosen by workload, and shows a Qwen
    3.6 27B race in which an RTX Pro 6000 reached almost 1,300 tokens per second at 50 parallel
    requests while an M5 Max MacBook Pro, a DGX Spark and Strix Halo ran requests sequentially,
    which he calls a software gap. He argues for inference engines tuned per model, per chip
    and per workflow rather than one general engine, warns that uniform 4-bit quantization
    damages models compared with per-layer dynamic schemes, and cautions that cheap hosted
    providers may silently route to other models.
  why: >-
    Engineers sizing self-hosted inference for agents should benchmark concurrent throughput
    on their own workload, since agent fan-out favors GPUs with mature batching software over
    single-stream speed.
  background: >-
    Prefill processes the whole prompt in parallel and is limited by compute, while decode
    emits one token at a time per sequence and is limited by how fast weights stream from
    memory. Batching many sequences shares each weight read across requests, which is why
    server engines such as vLLM gain throughput with concurrency while single-user engines
    do not.
  event: ahmad-osman-local-ai-production-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=GKSQYbELDzw
- title: >-
    Armin Ronacher: Pi's p90 task time grew from 2.5 to 14 minutes with no harness changes,
    but upkeep stays flat
  section: Talks
  category: Video
  blurb: >-
    Armin Ronacher's Pi session data shows fewer corrections and 14-minute p90 runs, yet only
    10 to 15 of 141 started projects stay alive.
  summary: >-
    Ronacher says Pi's core tools have not changed in a year, yet his corrections per session
    fell with each model and the 90th percentile run length rose from about 2.5 minutes with
    Opus 4.6 to over 14 minutes. His daily prompts stayed flat at roughly 120 to 190 while
    agent active time grew to many times his working day, and of 141 repositories he started
    only 10 to 15 get regular commits. He asks agents for a typeset HTML summary at about
    70% of a task, before verification, and argues for durable agents that suspend with their
    sandboxes during flex-priced inference and for code mode workflows that call cheap decision
    models at each branch.
  why: >-
    It gives measured evidence that model upgrades alone change how a stable harness behaves,
    and concrete checkpoints for keeping human understanding in long agent runs.
  event: ronacher-workshop-before-factory-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=JNexz3Tbiu8
- title: >-
    Theo: open-weight models drew 0.5% of T3 Code turns, and installs that tried one fell
    from 16% to 6%
  section: Videos
  category: Video
  blurb: >-
    Theo argues the gap between open-weight and closed models is widening, citing his own
    T3 Code usage data and score drops on altered tasks.
  summary: >-
    In a 2026-11-22 video, Theo says open-weight models account for 0.5% of turns and 0.7%
    of tokens in T3 Code, and the share of installs that used one at least once fell from
    16% to 6%. He blames compute access, tighter anti-distillation measures and AI-assisted
    model work at closed labs for the widening gap. He also says Opus 5.5 and Fable 5.2 use
    the file read and edit tools for under 1% of their file operations and write throwaway
    Python or JavaScript scripts instead.
  why: >-
    Usage data from a real harness, set against benchmark scores, argues for testing open-weight
    models on your own agent tasks before you adopt them.
  background: >-
    Open-weight models publish their parameters, so anyone can self-host and fine-tune them.
    Closed labs serve their models only through APIs. Distillation trains one model on another
    model's outputs. Labs have tried to block it by hiding or degrading reasoning traces,
    as the digest reported for OpenAI's GPT-6.2 safeguards on 2026-11-21. Theo also leans
    on MaxxBench, which the digest covered on 2026-11-08. MaxxBench changes DeepSWE tasks
    slightly and measures how much each model's score drops.
  event: theo-open-weight-models-gap-video
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=B2rFx4Fy1us
- title: >-
    GPT-6.1 Sol reads, patches and writes x86-64 executables from hex dumps with no disassembler
    or compiler
  section: Hacker News
  category: Pulse
  blurb: >-
    Given only xxd hex dumps and no tools, GPT-6.1 Sol explained five binaries, patched three
    in place and wrote three working ELF files.
  summary: >-
    George Xenos and Sotiris Giannopoulos fed GPT-6.1 Sol hex dumps through Codex CLI with
    every tool stripped, and it identified four programs including a stripped, -O3 musl build
    of FreeBSD's ministat, where it found a real bug in the 99.5% confidence table. In one
    reply each, it added features to three binaries by editing 1.4% to 5.9% of their bytes
    and wrote three ELF64 programs from specs that matched GCC builds on every test, and it
    correctly analyzed a VShell stager, which DeepSeek V4.1 Flash also identified with about
    17 times the reasoning tokens. Hex costs about 2.4 tokens per byte, so a 67 KB binary
    used about 163,000 tokens.
  why: >-
    Reverse engineers and malware triage teams can test frontier models on small binaries
    without lifting them first, within a context limit of roughly tens of kilobytes per pass.
  comments: The post drew 234 points and 149 comments on Hacker News.
  event: llm-machine-code-programming
  sources:
  - label: primary
    url: https://sgiannopoulos.github.io/blog/machine-code-programming/
  - label: discussion
