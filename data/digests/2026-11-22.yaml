    url: https://www.youtube.com/watch?v=GKSQYbELDzw
- title: >-
    GPT-6.1 Sol reads, patches and writes x86-64 executables from hex dumps with no disassembler
    or compiler
  section: Hacker News
  category: Pulse
  blurb: >-
    Given only xxd hex dumps and no tools, GPT-6.1 Sol explained five binaries, patched three
    in place and wrote three working ELF files.
  summary: >-
    George Xenos and Sotiris Giannopoulos fed GPT-6.1 Sol hex dumps through Codex CLI with
    every tool stripped, and it identified four programs including a stripped, -O3 musl build
    of FreeBSD's ministat, where it found a real bug in the 99.5% confidence table. In one
    reply each, it added features to three binaries by editing 1.4% to 5.9% of their bytes
    and wrote three ELF64 programs from specs that matched GCC builds on every test, and it
    correctly analyzed a VShell stager, which DeepSeek V4.1 Flash also identified with about
    17 times the reasoning tokens. Hex costs about 2.4 tokens per byte, so a 67 KB binary
    used about 163,000 tokens.
  why: >-
    Reverse engineers and malware triage teams can test frontier models on small binaries
    without lifting them first, within a context limit of roughly tens of kilobytes per pass.
  comments: The post drew 234 points and 149 comments on Hacker News.
  event: llm-machine-code-programming
  sources:
