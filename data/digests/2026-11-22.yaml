- title: >-
    OpenAI publishes its models' log-perplexity and proposes shared industry limits based
    on it
  section: AI
  category: AI
  blurb: >-
    OpenAI's chief scientist publishes internal log-perplexity figures for its models and
    proposes shared industry limits tied to them.
  summary: >-
    Jakub Pachocki writes that GPT-3.5 sat near 0.99 log-perplexity on OpenAI's internal code
    evaluation set and GPT-4 near 0.91, that losses below 0.8 brought new capabilities in
    security and mathematics, and that a model near 0.76 began producing major math results.
    He proposes that labs agree on limits, measured by perplexity and other metrics, that
    they will not cross until monitoring reaches concrete milestones, and warns of a possible
    avalanche of AI-driven pretraining advances as soon as 2027. He lists limits of the metric,
    including cross-lab dataset differences and that chain-of-thought gains do not show up
    in perplexity.
  why: >-
    It gives engineers a rare first-party number for tracking base model progress and signals
    how OpenAI may argue for pacing rules that shape future model releases.
  background: >-
    Perplexity is the exponential of the average cross-entropy loss a model assigns to the
    next token in held-out text, so lower values mean better prediction. Because labs train
    on different data and evaluate on different held-out sets, raw perplexity numbers have
    rarely been comparable across companies, which is one reason public discussion has relied
    on task benchmarks instead.
  comments: The Hacker News thread drew 298 points and 197 comments.
  event: openai-perplexity-pacing-proposal
  sources:
  - label: primary
    url: https://openai.com/index/perplexity-and-intelligence
  - label: discussion
