- title: >-
    Rackspace Spot breach let an intruder with leaked credentials read Kubernetes Secrets
    in customer clusters
  section: Security
  category: Security
  blurb: >-
    Leaked credentials let an intruder create pods, read Kubernetes Secrets and list nodes
    in some Rackspace Spot customer clusters on 2026-11-17.
  summary: >-
    Rackspace told customers that an unauthorized party used leaked credentials to access
    parts of Rackspace Spot on 2026-11-17 from about 00:20 to 22:00 UTC, acting as legitimate
    users to create pods, read Kubernetes Secrets, list nodes and volumes, and obtain Spot
    API and refresh tokens. Rackspace learned of it from a customer report on 2026-11-18,
    revoked tokens and sessions, removed the pods and rotated keys, and the admin console
    stayed down until full restoration on 2026-11-21. Indicators include 23.224.79.106, the
    range 23.224.0.0/15, and pod and object prefixes i1, glm- and probe.
  why: >-
    Spot users should reissue API and refresh tokens, fetch new kubeconfigs, rotate every
    credential stored in cluster Secrets, and check downstream registry, Git, database and
    cloud logs from 2026-11-17.
  background: >-
    Rackspace Spot is a managed Kubernetes service, co-developed with Platform9, that sells
    spare server capacity through auctions. Kubernetes Secrets are stored base64-encoded rather
    than encrypted from the client's view, so any identity with RBAC permission to get or
    list Secrets reads their plaintext values. A platform credential that lets an attacker
    act as a cluster user therefore exposes every database password and API key the workloads
    hold.
  event: rackspace-spot-breach-2026-11
  sources:
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/rackspace-spot-breach-let-hackers-access-customer-kubernetes-secrets/
- title: >-
    url 2.5.9 fixes RUSTSEC-2026-0592, a stack overflow in Url::origin() on nested blob: URLs
  section: Security
  category: Security
  blurb: >-
    A URL with thousands of nested blob: prefixes makes the url crate recurse until the stack
    overflows, aborting any process that reads its origin.
  summary: >-
    In url 2.5.8 and earlier, Url::origin() parsed a blob: URL's path as another URL and called
    itself on it with no depth limit, so a 50,020-byte URL with 10,000 blob: prefixes overflowed
    a spawned thread's default 2 MiB stack. The overflow aborts the process and catch_unwind()
    cannot catch it. url 2.5.9, issued 2026-11-22 as GHSA-hrj5-67jp-wqp9, follows the URL
    Standard by taking the inner origin only for http, https and file schemes and returning
    an opaque origin otherwise.
  why: >-
    Rust services that call Url::origin() or url::quirks::origin() on untrusted input should
    move to url 2.5.9, and code that relied on blob:ws:// or blob:blob: origins will now see
    opaque origins.
  background: >-
    The url crate is the Servo project's implementation of the WHATWG URL Standard and sits
    under most Rust HTTP clients and servers. An origin is the scheme, host and port tuple
    browsers use for same-origin checks, and a blob: URL inherits the origin of the URL it
    wraps. In Rust a stack overflow is not a panic, so it cannot be caught and ends the whole
    process.
  event: rust-url-origin-blob-stack-overflow
  sources:
  - label: primary
    url: https://rustsec.org/advisories/RUSTSEC-2026-0592.html
- title: >-
    GL.iNet confirms attackers used a GoodCloud flaw to plant malware on its routers and KVM
    devices
  section: Security
  category: Security
  blurb: >-
    Attackers abused GL.iNet's GoodCloud remote management to install backdoors and reverse
    shells on routers and KVM-over-IP devices.
  summary: >-
    In an advisory dated 2026-11-20, GL.iNet said an unauthorized party exploited a flaw in
    its cloud remote management service to install malware on customer routers and KVM devices,
    and that it has fixed the cloud flaw but that existing infections remain. BleepingComputer
    examined a ni.sh installer that targets GL.iNet models, persists through startup scripts,
    replaces netstat to hide its connections and installs SSH keys, while RemoteToHome Consulting
    found suspicious activity on 152 of 183 routers it manages. GL.iNet recommends KVM firmware
    1.10.3 or later for RM10, RM1, RM1V2, RM1PE and RM4PE, 1.8.7 or later for RMQ1, and new
    router firmware scheduled for 2026-11-22.
  why: >-
    Anyone with a GL.iNet KVM attached to a server or workstation should treat the attached
    machine as possibly compromised, reflash without restoring settings and rotate credentials.
  background: >-
    KVM-over-IP devices sit between a network and a computer's keyboard, video and mouse ports,
    so control of the device gives an attacker console access to the attached machine, often
    including firmware setup. GoodCloud is GL.iNet's hosted service for managing its devices
    remotely, which means a flaw in the cloud side can push commands to every enrolled device
    without the attacker reaching each one directly.
  followup: >-
    GL.iNet's stable router and KVM security firmware due 2026-11-22 and its count of affected
    customers.
  event: glinet-goodcloud-device-compromise
  sources:
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/
