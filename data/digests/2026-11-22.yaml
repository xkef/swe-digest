- title: >-
    Raph Levien's advice for the next 100 Rust GUIs: Parley and AccessKit are solved, compositor
    layers are not
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Raph Levien says Parley and AccessKit now solve Rust GUI text layout and accessibility,
    while system compositor integration is still missing.
  summary: >-
    In a 2026-11-21 follow-up to his 2022 post, Levien writes that Parley is now used by most
    new Rust UI toolkits for text layout and AccessKit for accessibility, but that toolkits
    still rarely use system compositor layers, which matter for hardware-accelerated video.
    He argues immediate mode toolkits such as egui scale poorly for productivity apps because
    they must build stable widget identities and cache text layouts, notes that Shopify and
    Discord mobile use native UI over shared logic, and recommends separating design from
    an incremental execution engine, adapting a curated subset of web standards through modular
    engines such as Blitz.
  why: >-
    Teams planning AI-assisted Rust rewrites get a concrete map of which GUI infrastructure
    is mature and which architectural choices, such as immediate mode or ignoring compositor
    layers, cost them later.
  background: >-
    Retained mode toolkits keep a persistent widget tree and update it incrementally, while
    immediate mode toolkits rebuild the UI description every frame from application state.
    The system compositor, such as Core Animation on Apple platforms or SurfaceFlinger on
    Android, blends separately rendered layers so unchanged content and video need not be
    redrawn. Levien leads Linebender, which builds the Xilem, Masonry, Vello and Parley crates.
  comments: The post drew 152 points and 50 comments on Hacker News.
  event: raph-levien-next-100-rust-guis
  sources:
