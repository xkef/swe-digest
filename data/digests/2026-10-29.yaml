- title: >-
    Palo Alto Networks confirms PHP2Shell exploitation of internet-exposed PAN-OS management
    interfaces
  section: Top stories
  category: Security
  blurb: >-
    Attackers exploit the PHP2Shell flaws against PAN-OS management web UIs, and several hotfixes
    are due only on 2026-10-29 or 2026-10-30.
  summary: >-
    Palo Alto Networks updated its advisory on 2026-10-28 to say CVE-2026-109618 and CVE-2026-109619
    are being exploited against management interfaces exposed to the internet. The flaws affect
    the HTTPS web UI and XML API, and the dataplane only when a management profile is attached.
    Fixed hotfixes exist for many 10.2 to 12.2 trains, while others carry ETAs of 2026-10-29
    or 2026-10-30, with interim mitigations such as threat prevention on inbound management
    traffic.
  why: >-
    Any PAN-OS box with a management interface reachable from the internet needs a hotfix
    or access restriction now, since the PHP2Shell plus Fragnesia chain already yields root.
  followup: Remaining PAN-OS hotfixes due 2026-10-29 and 2026-10-30.
  thread: f-0083
  sources:
  - label: primary
    url: https://thehackernews.com/2026/10/attackers-exploit-php2shell-flaws-in.html
- title: >-
    GitHub Copilot Fusion is generally available, routing and chaining models per prompt
  section: Top stories
  category: Agentic coding
  blurb: >-
    Copilot Fusion picks and chains models per prompt at three effort levels, bills each model
    used, and lets admins limit its model pool.
  summary: >-
    GitHub made Copilot Fusion generally available on 2026-10-28 in VS Code, the Copilot app,
    Copilot CLI and JetBrains IDEs. It routes each prompt to one model or orchestrates several
    through cascade and critique workflows at Standard, High or Max effort, and bills every
    model used at its standard rate with a temporary 30 percent discount. GitHub says Fusion
    Max scored 60 on the Artificial Analysis Coding Agent Index at about half the API cost
    per task of Claude Code with Opus 5.5 Max.
  why: >-
    Model choice moves from the developer to a router governed by enterprise model policies,
    which changes how teams budget and audit Copilot spend.
  sources:
  - label: primary
    url: https://github.blog/changelog/2026-10-28-route-and-orchestrate-models-with-github-copilot-fusion
- title: >-
    Cisco patches exploited ASA and FTD SSL VPN zero-day CVE-2026-76418 that reloads firewalls
  section: Top stories
  category: Security
  blurb: >-
    Unauthenticated attackers are crashing Cisco ASA and FTD firewalls through the SSL VPN
    when secondary authentication is configured.
  summary: >-
    CVE-2026-76418, rated CVSS 8.6, is a logic error in the Remote Access SSL VPN service
    of ASA and FTD software that lets an unauthenticated attacker force a reload with a crafted
    request. Cisco says it learned of active exploitation in October 2026 and shipped fixes
    such as ASA 9.22.3.200 and FTD 7.6.7. Devices are exposed only when the SSL VPN login
    is reachable and secondary authentication is set in a tunnel group, including DefaultWEBVPNGroup.
  why: >-
    Teams running Cisco remote access VPN should check tunnel groups for secondary authentication
    and patch, since no successful login is needed to reach the bug.
  sources:
  - label: primary
    url: https://thehackernews.com/2026/10/cisco-patches-actively-exploited-asa.html
  - label: discussion
    url: https://www.securityweek.com/attackers-exploit-second-cisco-firewall-vpn-zero-day-since-august/
  thread: f-0141
- title: >-
    CISA adds VMware ESX logging flaw CVE-2026-41709 to KEV after Warp Panda zero-day use
  section: Security
  category: Security
  blurb: >-
    CISA added VMware ESX CVE-2026-41709 to KEV after CrowdStrike tied it to Warp Panda, which
    used it to hide admin actions from logs.
  summary: >-
    CVE-2026-41709 lets an actor with admin access perform some operations without being logged,
    and Broadcom fixed it in July 2026 builds of ESXi 9.1, 9.0.2, 8.0U3j and VCF 5.2.4. CrowdStrike
    reports the China-nexus group Warp Panda, also tracked as Armory Castle, exploited it
    as a zero-day in early 2026 against the US legal sector. Federal agencies must patch by
    2026-11-11.
  why: >-
    A low-CVSS logging bug was used to blind audit trails on hypervisors, so ESXi hosts still
    on pre-July builds should be patched and their logs treated with suspicion.
  sources:
  - label: primary
    url: https://www.cisa.gov/news-events/alerts/2026/10/28/cisa-adds-two-known-exploited-vulnerabilities-catalog
  - label: discussion
    url: https://thehackernews.com/2026/10/china-linked-hackers-exploited-vmware.html
- title: >-
    Tetragon before v1.7 exposes an unauthenticated gRPC API to hostNetwork pods (CVE-2026-65960)
  section: Security
  category: Security
  blurb: >-
    Tetragon versions before v1.7 expose an unauthenticated gRPC API that any hostNetwork
    pod on the node can reach, tracked as CVE-2026-65960.
  summary: >-
    The Cilium project disclosed on 2026-10-28 that Tetragon releases before v1.7 serve an
    unauthenticated gRPC admin API reachable from any pod using hostNetwork on the same node.
    The post describes using a Tetragon policy to harden access to that API.
  why: >-
    Clusters running Tetragon below v1.7 should upgrade or restrict hostNetwork pods, since
    the security agent itself is an exposed control surface.
  sources:
  - label: primary
    url: https://cilium.io/blog/2026/10/28/tetragon-grpc
- title: >-
    Attacker targets Alpine Linux GitLab via CVE-2026-97229, exposing that GitLab upgrades
    do not patch system Ruby
  section: Security
  category: Security
  blurb: >-
    Alpine rebuilt its GitLab server after an attacker targeted CVE-2026-97229, and found
    that a GitLab upgrade alone left its Ruby vulnerable.
  summary: >-
    A new account sent crafted CI configurations to gitlab.alpinelinux.org on 2026-10-20 and
    2026-10-21, crashing workers eight times. Alpine found no proof of code execution but
    rebuilt the server, reset all passwords and rotated GitLab secret keys, and says its signing
    keys were never on the server. GitLab's fix patches the Ruby bundled in its packages and
    images, so self-compiled installs and images with their own Ruby also need Ruby 3.3.13,
    3.4.12, 4.0.9 or later.
  why: >-
    Anyone running GitLab on a separately installed Ruby must update Ruby as well as GitLab,
    since Ruby 3.2 gets no fix.
  thread: f-0082
  sources:
  - label: primary
    url: https://thehackernews.com/2026/10/attacker-tried-to-exploit-alpine-linuxs.html
- title: >-
    Attacker hid shell commands in GitHub issues and PRs to hit CI workflows in 61 public
    repositories
  section: Security
  category: Security
  blurb: >-
    Radware found 83 hidden payloads in issues, PRs and comments that tried to steal CI secrets
    through workflows that run on untrusted text.
  summary: >-
    Radware researchers told The Register they found 83 items carrying a verified payload
    across 61 public repositories, including Trivy, MLflow, Cilium, google/langextract and
    Homebrew/homebrew-cask, with 77 posted in a 43-minute window on 2026-09-01 from 74 accounts.
    The commands sat in HTML comments and ran when workflows inserted issue or PR text into
    shell code, collecting environment variables and sending them to an attacker server. Logs
    show at least two runs where the command executed, and it is not confirmed whether the
    attacker gained write access.
  why: >-
    Workflows triggered by issues, PRs or comments that interpolate that text into run steps
    should be treated as exposed, and secrets in those jobs rotated.
  followup: >-
    A full Radware report and any confirmed downstream code changes or credential misuse.
  sources:
  - label: primary
    url: https://www.theregister.com/security/2026/10/29/attackers-turn-github-issues-into-supply-chain-campaign-against-61-public-repos-in-less-than-an-hour/5306153
  thread: f-0140
- title: >-
    Talos ties KeyDrift malware on Cisco SD-WAN controllers via CVE-2026-20127 to Volt Typhoon's
    Silent Train network
  section: Security
  category: Security
  blurb: >-
    Attackers exploited CVSS 10 Cisco SD-WAN flaw CVE-2026-20127 to plant malware that steals
    data-plane keys from controllers.
  summary: >-
    Cisco Talos says actor UAT-11473 used the SD-WAN peering authentication bypass to install
    KeyDrift, whose PolyFlame backdoor and LittleFilch key collector run inside control-plane
    processes. Talos assesses its infrastructure overlaps with Silent Train, a covert relay
    network that Lumen says Volt Typhoon used in at least four zero-day campaigns. Lumen says
    Volt Typhoon exploited the flaw by late 2025 and continued after Cisco's February 2026
    disclosure.
  why: >-
    SD-WAN controllers patched late should be checked for compromise and their keying material
    treated as possibly exposed.
  sources:
  - label: primary
    url: https://www.securityweek.com/cisco-sd-wan-zero-day-exploitation-tied-to-volt-typhoons-silent-train-network/
  - label: discussion
    url: https://thehackernews.com/2026/10/volt-typhoon-used-covert-silent-train.html
- title: GitHub Copilot cloud agent sessions fail and slow down on 2026-10-29
  section: Outages
  category: Outage
  blurb: >-
    GitHub's agent sessions service is failing 1 to 2 percent of requests, slowing cloud agent
    sessions across web, mobile, VS Code and CLI.
  summary: >-
    GitHub began investigating at 10:19 UTC on 2026-10-29 and reported increased failures
    and latency on its agent sessions service, including creating and listing sessions. As
    of 11:37 UTC failure rates were 1 to 2 percent and mitigations were being applied. Cloud
    agent sessions on web, mobile, VS Code, the CLI and the GitHub Copilot app are affected.
  why: >-
    Teams that start or poll Copilot cloud agent sessions from automation should expect intermittent
    failures and retry until GitHub confirms recovery.
  followup: Incident resolution and the root cause analysis on githubstatus.com.
  sources:
  - label: primary
    url: https://www.githubstatus.com/incidents/rn76zdy367m2
  thread: f-0139
- title: >-
    Mistral releases open weights for Mistral Large 4, a 1T-parameter multimodal model with
    52B active
  section: AI
  category: AI
  blurb: >-
    Mistral published weights for its 1-trillion-parameter Large 4 model, with three reasoning
    modes and vendor-reported coding gains.
  summary: >-
    On 2026-10-29 Mistral released the weights of an improved Mistral Large 4 (Le Chonk) on
    Hugging Face as Mistral-Large-4-1T-A52B, with vLLM, SGLang and llama.cpp tags and a custom
    license. Mistral reports 41 percent on Terminal-Bench 4.0 and 48 percent on the Artificial
    Analysis Coding Agent Index, and adds low, medium and high reasoning modes. It also says
    it is tightening cyber guardrails after seeing potential uplift for real attacks in preview
    traffic.
  why: >-
    Teams self-hosting frontier-scale open models gain a European 1T MoE option for coding
    agents, though license terms and hardware cost need checking.
