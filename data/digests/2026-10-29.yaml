- title: >-
    Copilot Projects in the GitHub Copilot app run background agents toward a goal across
    repositories
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Copilot Projects take a goal plus repos, mocks or Slack threads, run as many background
    agents as needed, and return pull requests to review.
  summary: >-
    GitHub put Projects into public preview in the Copilot app on 2026-10-28, giving multi-repository
    work one home with context, agents and results, plus project automations for repeatable
    tasks. The same release adds computer use in public preview on macOS and Windows, which
    asks for approval before controlling an app and can be disabled by managed settings.
  why: >-
    GitHub now ships a first-party fleet model where the human gate sits at pull request review
    rather than per session.
  sources:
  - label: primary
    url: https://github.blog/changelog/2026-10-28-github-copilot-app-universe-releases
- title: >-
    Gist measures Claude Code agent_summary calls at about 16 percent of spend and ships a
    preload to disable them
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    A measurement gist says Claude Code sends each background agent's full transcript to its
    model every 30 seconds just to update a status line.
  summary: >-
    Flamerix AI reports that since Claude Code 2.1.232 each background agent's transcript
    is sent to its own model about every 30 seconds for a 3 to 5 word status summary, and
    that OpenTelemetry showed query_source agent_summary at 16.4 percent of spend and 19.7
    percent of requests. The authors say no setting disables it and these requests are absent
    from on-disk session logs, and they publish an unofficial Bun preload that suppresses
    the timer.
  why: >-
    Teams running many background agents should check query_source in Claude Code telemetry,
    since transcript-based cost tools do not see this traffic.
  sources:
  - label: primary
    url: https://gist.github.com/flamerix-ai/c3905705cc4205e5de3011fa2e74efce
  - label: discussion
    url: https://news.ycombinator.com/item?id=50284255
- title: >-
    Google details six CI gates, an AI reviewer and eval evidence for its 170-skill Agent
    Skills repo
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Google gates changes to 170 agent skills with linters, semver checks, eval reports, an
    AI reviewer and a human approver before they ship.
  summary: >-
    Every skill change must pass structural and lint checks, a required semantic version bump,
    a validated eval suite with a fresh report tied to the latest commit, link checks and
    an AI review agent, then human approval. The AI reviewer pushes rigid CLI sequences into
    scripts, caps SKILL.md at 500 lines and blocks chained references, which evals showed
    agents often fail to follow. Cheap deterministic checks run first so failing changes never
    trigger the costly LLM gates.
  why: >-
    It is a concrete template for treating agent instructions as versioned, evaluated code
    with atomic eval expectations.
  sources:
  - label: primary
    url: https://cloud.google.com/blog/topics/developers-practitioners/behind-the-scenes-two-months-later-how-we-ship-google-agent-skills-like-products/
- title: >-
    Meta runs LLM-generated just-in-time catching tests on risky diffs, with 60 percent true
    positives
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Meta generates failing tests for risky diffs overnight, filters them with LLM judges and
    rules, and caught 74 privacy SEV bugs in H1 2026.
  summary: >-
    Meta's Catching JiTTests system targets risky diffs with a risk score, generates tests
    through intent-aware and mutation-style workflows, and ranks failing tests with an LLM-as-Judge
    ensemble plus a rule-based assessor called RubFake. Engineers are contacted only for high-ranked
    catches. Meta reports 589 engineers engaged, a 60 percent true positive rate, and 74 serious
    privacy bugs caught before landing in the first half of 2026.
  why: >-
    It is a production example of an executable-test review gate for agent-era diffs, with
    human-on-the-loop oversight and measured outcomes.
  sources:
  - label: primary
    url: https://engineering.fb.com/2026/10/29/security/catching-bugs-before-they-land-jittestings-human-on-the-loop-approach-at-full-scale/
- title: Vercel CI enters beta, running tagged Turborepo tasks on every push
  section: Developer tools
  category: Dev tools
  blurb: >-
    Vercel CI runs Turborepo tasks tagged ci on every push, only for affected packages, with
    remote caching and one dependency install per run.
  summary: >-
    Vercel CI entered beta on 2026-10-28 and is configured by adding a ci tag to tasks in
    turbo.json. It runs only affected tasks, uses Vercel Remote Cache, and caches dependencies
    across updates. Vercel says push-to-green time in its internal repositories dropped 2
    to 6 times.
  why: >-
    Monorepo teams on Turborepo get a CI option tuned for high agent PR volume without maintaining
    their own affected-task logic.
  sources:
  - label: primary
    url: https://vercel.com/changelog/vercel-ci-is-now-in-beta
- title: >-
    GitHub previews an npm package firewall that blocks malicious installs at download time
  section: Developer tools
  category: Dev tools
  blurb: >-
    A new GitHub Enterprise Cloud preview gates npm installs on malware advisories, package
    age, attestation downgrades and new install scripts.
  summary: >-
    GitHub's package firewall sits between endpoints or internal registries and upstream npm
    and inspects metadata requests and downloads. Admins can block known malware, versions
    with vulnerabilities above a chosen severity, versions missing an SLSA attestation that
    earlier versions had, newly added install scripts, and versions younger than a 1 to 365
    day cooldown. It is in public preview for GitHub Enterprise Cloud, and blocked packages
    can be released through an exception request.
  why: >-
    Coding agents and CI runners can be pointed at a policy gate instead of the public registry,
    which limits exposure to freshly hijacked packages.
  sources:
  - label: primary
    url: https://thehackernews.com/2026/10/github-launches-npm-firewall-to-block.html
- title: >-
    GitHub Actions workflow lockfiles are generally available with a Require lockfile policy
  section: Developer tools
  category: Dev tools
  blurb: >-
    A gh extension writes actions.lock so workflows keep readable tags while running pinned
    commits, and admins can now require the lockfile.
  summary: >-
    The gh actions-lock extension generates .github/workflows/actions.lock covering actions
    and their transitive dependencies, and onboarded workflows run only the recorded commits.
    Dependabot regenerates the lockfile entry in the same pull request when it bumps an action,
    and a check mode verifies the lockfile is current without changing files. The feature
    is GA on Enterprise Cloud, Team and Free plans.
  why: >-
    Pinning moving action tags to commits no longer requires rewriting workflows to SHAs,
    and org admins can enforce it.
  sources:
  - label: primary
    url: https://github.blog/changelog/2026-10-28-github-actions-workflow-lockfiles-are-generally-available
- title: >-
    Dependabot adds CodeQL reachability verdicts for JavaScript and TypeScript alerts in public
    preview
  section: Developer tools
  category: Dev tools
  blurb: >-
    Dependabot now marks JS and TS alerts reachable or unreachable by tracing call paths from
    your code to the vulnerable dependency functions.
  summary: >-
    GitHub previewed reachability analysis for Dependabot on 2026-10-28, using curated vulnerable-function
    data and a CodeQL call graph to label each alert reachable, potentially reachable, unreachable
    or unavailable. It runs as a managed Actions workflow on GitHub-hosted runners for Enterprise
    Cloud repositories with npm, Yarn or pnpm lockfiles, is free during preview, and never
    closes alerts.
  why: >-
    Teams buried in npm advisories get a call-path signal to rank fixes, also exposed through
    the alerts REST API.
  sources:
  - label: primary
    url: https://github.blog/changelog/2026-10-28-prioritize-dependabot-alerts-with-reachability-analysis
- title: >-
    Grafana 13.3 adds cross-dashboard variables, Notebooks and a UI refresh in public preview
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Grafana 13.3 lets teams define one variable for all dashboards in a folder or org, and
    collect investigation panels in Notebooks.
  summary: >-
    Grafana 13.3 previews global and folder-scoped variables behind the grafana.dashboardGlobalVariables
    toggle, Notebooks for combining panels, Explore queries and notes behind dashboard.notebooks,
    and a visual refresh behind grafana.visualDesignRefresh. Grafana Assistant can now propose
    a dashboard plan before building it and undo its edits per turn. Grafana says the refresh
    has no breaking changes for plugins.
  why: >-
    Operators can stop duplicating environment and cluster selectors across dashboards and
    keep incident evidence in one shareable document.
  sources:
  - label: primary
    url: https://grafana.com/blog/grafana-13-3-release-all-the-latest-features/
- title: Oxide shows how to run Claude Code and Amp self-hosted agents in ephemeral VMs
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Oxide runs each Claude Code or Amp agent session in a throwaway VM, using an orchestrator
    hook to spawn and a reaper to clean up.
  summary: >-
    For Claude Code self-hosted environments, an orchestrator VM runs claude self-hosted-runner
    orchestrator with a spawn-runner hook that creates a VM per session, and a separate reaper
    deletes VMs that power off when the agent exits. Amp self-hosted orbs use a dispatch script
    handling spawn, pause and delete, which keeps disks for paused orbs. Oxide notes cold-start
    latency and cleanup as open problems and is exploring a microVM primitive.
  why: >-
    Teams sandboxing coding agents on their own hardware get a concrete VM-per-session pattern
    and the gaps in vendor runner tooling.
  sources:
  - label: primary
    url: https://oxide.computer/blog/self-hosted-ai-agents
- title: >-
    PlanetScale details Neki's planned Postgres switchover with query buffering and fast rollback
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Neki makes the old primary read-only instead of stopping it, buffers writes in routers,
    and can roll back with a config reload.
  summary: >-
    Neki's Admin control plane runs preflight checks, buffers primary-bound queries in routers,
    sets the primary's default to read-only, disconnects other replicas to fix a final WAL
    position, and waits for the target to replay through it. Unlike Patroni, it does not stop
    Postgres, so a timed-out switchover can restore writes with a reload. With synchronous
    replication set to ANY 1 and synchronous_commit on, every acknowledged commit is on the
    target before promotion.
  why: >-
    Anyone operating Postgres HA can compare this stop-free switchover design against Patroni's
    shutdown approach for upgrades and pod moves.
  sources:
  - label: primary
    url: https://planetscale.com/blog/designing-a-planned-switchover-for-minimum-disruption
