- title: >-
    PEP 805 proposes thread-scoped object sharing, and Guido van Rossum says he wishes Python
    had stuck with the GIL
  section: Languages and runtimes
  category: Languages
  status: developing
  blurb: >-
    Mark Shannon's PEP 805 would give objects a shareable state, and Guido van Rossum says
    he wishes Python had kept the GIL.
  summary: >-
    The thread on Mark Shannon's PEP 805, Safe Parallel Python, is active through 2026-09-01,
    and the proposal gives objects a `__shareable__` state of LOCAL, PROTECTED, IMMUTABLE,
    or SYNCHRONIZED, raises on illegal cross-thread access, groups threads so that the Main
    ThreadGroup serializes execution and parallelism requires explicit membership, and was
    updated on 2026-08-27 to use copying instead of relying on unique references, which Shannon
    states should make it implementable by MicroPython and GraalPython. Objections in the
    thread are concrete: Anders Ha notes Kotlin/Native abandoned a comparable object-graph
    freezing model and went free-threaded, David Ellis notes lazy imports and submodules make
    module freezing a poor fit while mocking relies on mutating modules, and Inada Naoki argues
    extension modules still need guarantees that a locked list or dict has not changed across
    a Python call. Guido van Rossum wrote on 2026-08-27 that users may violate the do-not-mutate-shared-objects
    rule by accident, and separately that personally he wishes they had stuck with the GIL
    because everything was simpler.
  why: >-
    The PEP would change how every Python thread reaches an object, it is framed as building
    on PEP 703 rather than competing with it, and nothing is decided.
  followup: >-
    Track whether PEP 805 reaches a Steering Council decision and how it lands against PEP
    703 free-threading.
  sources:
  - label: primary
    url: https://discuss.python.org/t/pep-805-safe-parallel-python/108670?page=4
  - label: discussion
    url: https://news.ycombinator.com/item?id=49508906
- title: Firefox for iOS ships a built-in ad blocker because iOS has no extension path
  section: Apple platforms
  category: Apple
  status: confirmed
  blurb: >-
    Mozilla built ad blocking into Firefox for iOS with WebKit content blockers, because iOS
    has no extension path.
  summary: >-
    Mozilla published the post on 2026-09-01 and states that on iOS extensions are not available
    in the same way as on desktop and Android, so bringing ad blocking to Firefox on iOS meant
    building it into the browser, implemented with Apple's WebKit Content Blocker technology
    and the EasyList filter list, with no separate extension to install, toggled at Settings
    then Browsing then Ad Blocker, and off by default. Mozilla states the blocker does not
    block ads served directly by the site being visited, ads shown in search results, or Firefox's
    own sponsored shortcuts and sponsored new-tab content. Mozilla states it will keep supporting
    the extension ecosystem on desktop and Android.
  why: >-
    A content-blocking capability that ships as an installable extension on one platform has
    to ship as browser code on iOS, which fixes who updates the filter behaviour and on what
    release schedule.
