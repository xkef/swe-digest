- title: Google Antigravity adds a /boost multi-agent reasoning mode
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Google Antigravity's /boost mode splits a task across subagents in isolated worktrees,
    then validates against test suites.
  summary: >-
    The documentation describes a three-phase pipeline. An orchestrator forms a strategy and
    splits the task, dispatches implementation and investigation subtasks to subagents running
    in ephemeral isolated worktrees, then validates the combined result against full test
    suites and feeds failed assertions back for another round. Boost is documented as sitting
    between the default single-agent loop and the multi-day Teamwork mode, with a stated horizon
    of seconds to hours, and it is limited to paid plans on Antigravity 2.0 and the CLI. Subagents
    inherit the workspace file access and command permission policies rather than bypassing
    them.
  why: >-
    Subagents inheriting the parent's file access and command permissions is the detail that
    decides whether a fan-out mode widens the blast radius of an agent run.
  sources:
  - label: primary
    url: https://antigravity.google/docs/boost/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49517537
- title: METR discloses two security incidents affecting its own infrastructure
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    METR disclosed on 2026-08-31 two incidents from March and May 2026, including a stolen
    API key that consumed about $600,000 in credits.
  summary: >-
    METR published the disclosure on 2026-08-31 and dates the two incidents to March 2026
    and early May 2026. In the first, a researcher's personal EC2 instance was publicly exposed
    for several days by a fail-open authentication bug in a vibe-coded app, and it held an
    API key for METR's general-access account. An attacker prompted the agent to reveal the
    key, added an SSH key for persistence, and over three weeks consumed credits worth approximately
    $600,000 that the model developer had granted METR for free. The second was a sustained
    external campaign in early May 2026 that used agents to automate vulnerability discovery,
    credential stuffing, OAuth token grant attempts, and staff phishing, concurrent with an
    inadvertently exposed read-only SQL query mechanism on METR's public transcript viewer
    whose bug could be exploited to reach unpublished evaluation data. METR states that an
    independent researcher disclosed the transcript viewer bug and was paid a bounty, and
    that some sensitive model output data was inadvertently accessible in principle, though
    METR believes it was not accessed. METR states the post covers external actors attempting
    unauthorized access to its systems rather than AI agents hacking during its evaluations,
    and that an initial scan found no evidence of any agents hacking third parties during
    its evaluations.
  why: >-
    METR holds pre-deployment evaluation access to frontier models, so a compromise of its
    own infrastructure is a supply chain question for the labs that grant that access.
  followup: Track whether any lab restates its evaluator access terms after this disclosure.
  sources:
  - label: METR blog
    url: https://metr.org/blog/2026-08-31-security-update/
