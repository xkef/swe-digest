  blurb: >-
    ReactOS 0.4.16 ships after 18 months with a graphical installer, a new ATA boot driver,
    and 381 issues closed.
  summary: >-
    The release, dated 2026-08-29, adds a graphical installer and merges the bootcd and livecd
