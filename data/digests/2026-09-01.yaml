- title: >-
    Measuring io_uring without readahead: one in-flight request gives the block layer nothing
    to merge
  section: Linux and kernel
  category: Engineering post
  status: confirmed
  blurb: >-
    A measurement of Turso's io_uring backend finds near-zero block-layer merging without
    application readahead.
  summary: >-
    Fernando Simoes measured Turso's two I/O backends on TPC-H Q6 over a 1.2 GiB database
    in a post dated 2026-08-31, where the io_uring backend opens the database with O_DIRECT
    and no buffered option, removing kernel readahead. With prefetch off the post counts 195,207
    submitted SQEs producing roughly 196,000 device requests at an average read request size
    of 4.37 KiB with only 140 of 195,516 bios merged, while a 32-page readahead window gives
    218,212 SQEs, roughly 16,300 device requests at 56.53 KiB average size, and 202,539 of
    218,493 bios merged, the stated mechanism being that the block layer can only join adjacent
    requests queued at the same time so a single in-flight SQE has nothing to merge against.
    The post separately measures sqpoll, where system time of 8.46s exceeds wall time of 8.22s
    with the kernel io_sq_thread taking 65 percent of cycles against 8.62s wall and 1.27s
    system without SQ polling, and records the syscall pread backend finishing Q6 in 3.02s
    against 8.55s for io_uring with 5.889 M cache misses at 7.691 percent against 10.666 M
    at 13.255 percent, with the author labelling the O_DIRECT page-cache explanation for that
    gap as a hypothesis he did not trace.
  why: >-
    Opening with O_DIRECT moves request merging into the application, and unmerged 4 KiB requests
    are what leave an io_uring path slower than plain pread on the same box.
  sources:
  - label: primary
    url: https://frn.sh/io-uring/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49521623
- title: Tailscale releases tailcat, its data plane without its control plane
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Brad Fitzpatrick released tailcat, a Go tool using Tailscale's WireGuard and DERP data
    plane with no control plane.
  summary: >-
    Brad Fitzpatrick published tailcat on 2026-08-31, an open source Go package and CLI that
    uses Tailscale's WireGuard, NAT traversal, and DERP data plane with no control plane,
    no accounts, no user-visible IP addresses, no admin controls, and no root requirement.
    A server generates a keypair, picks a DERP server, and emits an address string of the
    form `tc` plus base64 of CBOR over the public key and DERP bootstrap information, shared
    out of band or through a DNS TXT record, and the client sends a MEOW message over DERP
    to join the netmap then opens TCP over an embedded userspace stack atop WireGuard. Default
    mode pipes to stdout like netcat, a client mode runs a local SOCKS server and a child
    process, and NAT traversal attempts a direct connection with DERP relaying as fallback,
    rate-limited on Tailscale-hosted DERP and under the operator's own limits when self-hosted.
  why: >-
    It gives ephemeral and untrusted machines a NAT-traversing transport with no account and
    no admin plane, and Fitzpatrick states he wrote it in 2023 and cites sandboxed coding
    agents as the use case that brought it back.
  sources:
  - label: primary
    url: https://tailscale.com/blog/tailcat
  - label: discussion
    url: https://news.ycombinator.com/item?id=49517420
- title: EC2 R9g and R9gd instances on AWS Graviton5 reach general availability
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    AWS made the Graviton5-based R9g and R9gd instances generally available, claiming up to
    25 percent more compute per vCPU.
  summary: >-
    AWS made the memory-optimized R9g and R9gd instances generally available on 2026-08-31,
    stating up to 25 percent higher compute performance per vCPU over Graviton4-based R8g,
    DDR5 at 8800 MT/s up from 5600 MT/s, a 5x larger L3 cache, up to 2x higher network and
    EBS bandwidth at the largest sizes reaching 100 Gbps network and 72 Gbps EBS on the 48xlarge,
    and up to 3x higher packet-processing performance. Both families offer 11 sizes from medium
    to metal-48xl, topping out at 192 vCPUs and 1536 GiB, support Instance Bandwidth Configuration
    to shift 25 percent of allocation between EBS and VPC networking, and carry the Nitro
    Isolation Engine introduced with C9g and M9g, which AWS describes as using formal verification
    of isolation. R9gd adds local NVMe SSD, AWS states most applications migrating from R8g
    need no code changes, and availability is US East (N. Virginia, Ohio), US West (Oregon),
    and Europe (Frankfurt).
  why: >-
    The memory bandwidth and cache figures are what move workloads sized by memory rather
    than by vCPU count, and AWS states the move from R8g needs no code changes.
