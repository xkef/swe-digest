- title: >-
    Arm's lawyers force the searchable Jon's Arm Reference site for AArch64 offline on 2026-12-04
  section: Hacker News
  category: Pulse
  blurb: >-
    A widely used searchable reference for AArch64 instructions and system registers will
    shut down after Arm cited trademark and IP claims.
  summary: >-
    The site indexes Armv8-A and Armv9-A Base, SIMD, SVE and SME instructions and AArch64
    and AArch32 registers, and now says Arm's lawyers told its author to take it down or face
    legal action. On Hacker News the author says Arm cites use of its trademarks and IP in
    hosting the documentation, and that he is weighing mirrors or releasing source that builds
    the site locally. The thread drew 825 points and 164 comments.
  why: >-
    Engineers who rely on it for AArch64 work should plan for Arm's official documentation
    or a locally generated copy after 2026-12-04.
  comments: >-
    The thread argues over trademark law, with some saying unlicensed use can weaken a mark
    under naked licensing doctrine and others that describing genuine Arm products is nominative
    fair use. Several suspect the real issue is copyright in the documentation text.
  event: arm-reference-site-takedown
  sources:
  - label: primary
    url: https://arm.jonpalmisc.com/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50617499
