- title: >-
    Stalwart 1.2.0 speaks MAPI over HTTP, EWS and ActiveSync so Outlook connects to it as
    if to Exchange
  section: Hacker News
  category: Pulse
  blurb: >-
    The open-source Rust mail server now lets classic Outlook, Apple Mail and phones use it
    as an Exchange server, drawing 496 points on HN.
  summary: >-
    Stalwart 1.2.0 implements MAPI over HTTP, Exchange Web Services, ActiveSync 14.1 and 16.1
    and Autodiscover in its AGPL Community edition, behind a Cargo feature and disabled by
    default, adding about 200,000 lines of code. The new Outlook for Windows still cannot
    connect, and the project advises against it because it relays IMAP credentials through
    Microsoft's cloud. The Hacker News thread reached 496 points and 262 comments.
  why: >-
    Organizations leaving on-premises Exchange can move the server first and keep classic
    Outlook and native mobile clients working during migration.
  comments: >-
    Commenters debated how long classic Outlook will remain usable given Microsoft's 2029
    support date, with enterprise integrators saying customers still forbid the new Outlook.
    A long subthread covered German GoBD rules requiring tamper-proof email archiving for
    up to 10 years, with users pointing to Stalwart's compliance add-on and S3 Object Lock
    as possible routes.
  event: stalwart-1-2-0-exchange-protocols
