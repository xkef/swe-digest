- title: >-
    Let's Get Rusty: Blaze patches changed functions in memory and rebuilds ripgrep about
    10x faster than Cargo
  section: Videos
  category: Video
  blurb: >-
    Blaze keeps a Rust program in memory and patches changed functions with jumps, rebuilding
    ripgrep about 10x faster than Cargo.
  summary: >-
    On ripgrep, Blaze's first build took about 21 seconds, five times slower than Cargo, but
    a function edit rebuilt 10 times faster, a library edit 4 times faster, and a no-op build
    in 0.03 seconds, at the cost of much higher memory use. Blaze keeps the whole program
    in memory, recompiles only changed functions and their callers, and appends new code with
    a jump instead of relinking, while running proc macros and build scripts in WebAssembly
    sandboxes. Its v2 plan aims to make it a Rust build system and compiler for coding agents.
  why: >-
    Rust developers with slow edit loops can try Blaze on a large crate, provided their machines
    have memory to spare for its resident build state.
  event: blaze-rust-incremental-builds
