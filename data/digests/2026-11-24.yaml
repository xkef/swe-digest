- title: >-
    cgo's pointer check panics on legal code and can turn a 48 ns C call into 76 µs depending
    on syntax
  section: Engineering posts
  category: Engineering post
  blurb: >-
    cgo rewrites calls by syntax, so passing unsafe.Pointer through a variable or extra parentheses
    makes the runtime check the whole object.
  summary: >-
    Shraddha Agrawal shows that cgo passes field-level information to runtime.cgoCheckPointer
    only when it recognizes how the argument is written. Otherwise runtime.cgoCheckUnknownPointer
    scans the entire heap object and panics on any unpinned Go pointer, even in fields C never
    touches, although the docs allow passing a pointer to a field. The deficiency has been
    reported since 2016, and Ian Lance Taylor wrote that fixing it would need full type checking
    of cgo input.
  why: >-
    Go code calling C should take addresses inside the call expression or pin nested pointers
    with runtime.Pinner, and measure call overhead after refactors.
  background: >-
    Go's garbage collector cannot see pointers once they are handed to C, so the cgo rules
    forbid passing C memory that contains unpinned Go pointers. cgo enforces this at runtime
    by inserting checks into the code it generates, and GODEBUG=cgocheck=0 turns them off.
    runtime.Pinner, added in Go 1.21, lets a program pin nested objects so the check accepts
    them.
  event: cgo-pointer-check-syntax-dependence
  sources:
  - label: primary
    url: https://theconsensus.dev/p/2026/11/15/cgos-pointer-check.html
- title: >-
    Cloudflare extends its Rust Flamingo test framework to probe DNS propagation and gate
    releases on it
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Cloudflare probes DNS from every data center, checking a timestamped TXT record stays
    fresh within 90 seconds, and gates releases on it.
  summary: >-
    Cloudflare added a DNS module to Flamingo, its Rust end-to-end test framework that runs
    hundreds of millions of tests a day against its edge through a setup, action, assert DSL.
    A probe keeps updating a TXT record with a timestamp and queries three authoritative nameserver
    IPs and 1.1.1.1 from every data center, asserting freshness within 90 seconds for authoritative
    answers and 600 seconds for the resolver. The work followed a rollout where a scheduling
    bug left record changes unpublished for hours while the service looked healthy, and these
    measurements now decide whether a release proceeds or rolls back.
  why: >-
    It shows a concrete way to turn a slow, partial failure mode such as propagation lag into
    a synthetic SLI that can block a deploy, instead of relying on health checks that stay
    green.
  background: >-
    Synthetic probing sends scripted requests to production from the user's vantage point
    and records whether they succeed, which catches failures that unit tests and process health
    checks miss. An SLI is the measured series, such as the share of probes that see a fresh
    record, and an SLO is the target percentage for it. Flamingo's design dispatches each
    action type, such as an HTTP request or a DNS query, to its own handler through typed
    Rust enums, so new protocols reuse scheduling and reporting.
  event: cloudflare-flamingo-dns-probing
  sources:
  - label: primary
    url: https://blog.cloudflare.com/probing-dns-at-cloudflare/
- title: >-
    Spring AI 2.1 pauses tool calls marked requiresConfirmation, and Session Extensions 0.11.0
    resumes them after restarts
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A Spring AI agent can park a money-moving tool call in its JDBC session log and resume
    it from another JVM once a person approves it.
  summary: >-
    Spring AI 2.1 lets a @Tool carry requiresConfirmation = true, a property or a ToolCallConfirmationPolicy
    bean, and the tool loop returns an ordinary response naming the calls awaiting a decision
    while harmless tools still run. The new community project Spring AI Session Extensions
    0.11.0 adds a turn status to the Session API's append-only log, so a parked turn and its
    question survive a restart and any instance can resume it with allow or deny decisions.
    The post warns that 0.11.0 has no lease for turns whose process died and that models sending
    tool calls without ids can mismatch decisions.
  why: >-
    Java teams building agents that take irreversible actions get a framework pattern for
    durable human approval without taking over the whole tool loop.
  background: >-
    Human-in-the-loop approval for agent tool calls is easy inside one process but hard when
    the answer arrives hours later on another instance, because the pending conversation state
    must be persisted and must not be editable by the client. In Spring AI 2.0 the only option
    was user-controlled tool execution, where the application runs every round of the tool
    loop itself.
  event: spring-ai-tool-call-confirmation-session-extensions
  sources:
  - label: primary
    url: https://spring.io/blog/2026/11/24/spring-ai-tool-call-confirmation-park-resume
- title: >-
    Lean models and differential tests find 17 unreported bugs in Clojure 1.12.7's Java core
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Lean models and differential tests against java.util found 17 unreported bugs in Clojure
    1.12.7, including a reduce that never returns.
  summary: >-
    Naoya Yamashita modeled small integer and bit functions from Clojure's core as BitVec
    definitions in Lean 4 and used bv_decide to find counterexamples, and compared persistent
    collections with java.util over 3 million random operations. A 0xffe0 mask in gvec.clj
    makes reduce on a dropped vector-of loop forever at 65505 or more elements, and HashCollisionNode.without
    stores the dissoc key's hash instead of its own, hiding another key. The HAMT and vector
    trees showed no mismatches, and the bugs sat where two mechanisms meet, such as equality
    and hashing.
  why: >-
    Bit-precise Lean models of arithmetic helpers plus differential testing against a reference
    collection is a cheap recipe that finds real bugs in mature runtime code.
  background: >-
    A hash array mapped trie splits a key's hash into 5-bit pieces to walk a 32-way tree,
    with collision nodes at the bottom for keys whose full hashes match. Lean's bv_decide
    tactic turns bitvector goals into SAT problems, so it proves or refutes properties over
    every 32- or 64-bit input, including wraparound.
  event: clojure-core-lean-differential-bugs
  sources:
  - label: primary
    url: https://s.conao3.com/blog/2026/e4f733
- title: >-
    Carl Kadie's nine rules for Rust const fn move file decoding, lookup tables and DSLs to
    compile time
  section: Talks
  category: Video
  blurb: >-
    A Seattle Rust talk uses const fn to decode images, audio and LED layouts at build time
    so a $19, 520 KB RAM board stores only results.
  summary: >-
    Kadie uses include_bytes with const fn to validate a TGA image and convert it to RGB565,
    and to size PCM audio clips through a two-pass pattern that feeds const generics, keeping
    only the output in flash. Lookup tables computed at compile time replace per-pixel gamma
    and power-budget math, a const builder encodes a robot arm as a fixed-capacity DSL, and
    static references to dyn traits mix clip types without a heap. He warns that parsing a
    746 KB motion capture file in const fn added about 8 seconds per clean build, so a generator
    or build.rs fits there better.
  why: >-
    Rust teams can push validation and data conversion into the compiler, and the talk marks
    where that stops paying off.
  event: kadie-rust-const-fn-nine-rules-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=KznFsjlPCbo
- title: >-
    Steve Yegge: his 50-agent game factory ships up to 100 features a day and needs rebuilding
    every two months
  section: Talks
  category: Video
  blurb: >-
    Steve Yegge says his 50-agent game factory shipped up to 100 features a day, swamped players,
    and needs rebuilding every two months.
  summary: >-
    Yegge runs about 20 named agents on 22 Claude Max accounts against his long-running MUD,
    spending about $5,000 a month on inference and an estimated 5 billion tokens a day, and
    says the factory cleared about 60 years of backlog in four months until players asked
    him to slow down. He names work routing, token cost, append-only context that agents never
    prune, and agents that over-fence themselves after criticism as the main problems, and
    says giving agents records of their predecessors cuts the tokens they spend validating
    the environment.
  why: >-
    Teams running agent fleets should budget for pruning accumulated agent notes and for human
    review capacity, which Yegge says becomes the bottleneck.
