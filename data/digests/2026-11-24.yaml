- title: >-
    mise 2026.11.14 adds an experimental Landlock sandbox that fails cached tasks reading
    files outside their sources
  section: Developer tools
  category: Dev tools
  blurb: >-
    Cached mise tasks can now run under Landlock on Linux, so a read outside declared sources
    fails the task instead of caching a wrong result.
  summary: >-
    With cache.sandbox = true, mise restricts a cached task to files matched by sources, its
    config files, outputs of cached dependencies, system paths and mise-installed tools, limits
    writes to output directories and a private TMPDIR, trims the environment and blocks network
    access. Sandboxed cache entries are keyed separately, macOS and Windows run the task unsandboxed
    with a warning, and invalid #MISE header values in file tasks are now errors instead of
    being silently dropped. The release also cuts environment variable lookups per command
    from about 2,800 to about 500.
  why: >-
    Teams relying on mise task caching can now detect undeclared inputs on Linux CI instead
    of restoring cache entries built from inputs mise never checked.
  background: >-
    Landlock is a Linux security module that lets an unprivileged process restrict its own
    filesystem and network access, with no root or container needed. Build caches are only
    correct when every input that affects an output is part of the cache key, and undeclared
    inputs are a classic source of stale or wrong cached builds, the problem hermetic build
    tools like Bazel address with sandboxing.
  event: mise-2026-11-14-release
  sources:
  - label: primary
    url: https://github.com/jdx/mise/releases/tag/v2026.11.14
- title: TornadoVM 8.2 adds a ROCm HIP backend for AMD GPUs and runs on Eclipse OpenJ9
  section: Languages and runtimes
  category: Languages
  blurb: >-
    TornadoVM 8.2 compiles Java kernels straight to AMD GPUs through HIP, and adds cuBLASLt
    epilogues and an OpenJ9 path.
  summary: >-
    TornadoVM 8.2.0, released 2026-11-24, adds a HIP backend that talks directly to the AMD
    ROCm runtime on Linux and Windows, where AMD GPUs previously went through OpenCL. It also
    adds cuDNN channels-last convolutions with fused epilogues, FP32 and TF32 cuBLASLt products,
    Metal foreign device views, warp shuffle and tensor-core fragment APIs, and support for
    Eclipse OpenJ9 and IBM Semeru. SDK archives ship for JDK 21, 25, 26 and 27.
  why: >-
    Java teams can target AMD GPUs natively from TornadoVM instead of through OpenCL, and
    run it on OpenJ9-based JDKs.
  background: >-
    TornadoVM is a plugin to OpenJDK that JIT-compiles annotated Java methods into GPU kernels
    for OpenCL, CUDA PTX, SPIR-V, Metal and now HIP. HIP is AMD's CUDA-like C++ runtime and
    kernel language in the ROCm stack.
