- title: >-
    Apple pulls the paid open-source FSNotes app from EU App Stores while its DSA trader check
    stays pending
  section: Hacker News
  category: Pulse
  blurb: >-
    An indie developer says Apple pulled his paid open-source notes app from EU stores while
    his DSA trader verification sat unanswered for weeks.
  summary: >-
    FSNotes developer Oleksandr Hlushchenko says Apple removed the nine-year-old macOS and
    iOS app from every European App Store after his October payout failed, and that two support
    cases opened 2026-11-05 and 2026-11-17 got no reply. He says he completed the EU Digital
    Services Act compliance information in App Store Connect and submitted Ukrainian business
    registry documents. The thread drew 537 points and 119 comments on Hacker News.
  why: >-
    Developers who sell apps in the EU need verified DSA trader status in App Store Connect,
    and a lapse or a slow review can take an existing app off sale.
  background: >-
    The EU Digital Services Act requires online marketplaces to verify and publish contact
    details for traders who sell to EU consumers. Apple asks developers to declare whether
    they are traders in App Store Connect and removes apps of undeclared or unverified traders
    from EU storefronts.
  comments: >-
    Commenters note the app is still listed in the US and UK, and a cached Dutch store page
    says the developer had not identified as a trader. The author confirmed in the thread
    that his DSA status is pending. A developer who filed last week says declaring non-trader
    status for a free app cleared at once, while any paid app or tip jar makes an individual
    a trader who must publish a postal address and phone number and wait on document review.
    Another says DSA approval for a new app took a month after an October rule change.
  event: fsnotes-eu-app-store-dsa-removal
  sources:
  - label: primary
    url: https://github.com/glushchenko/fsnotes/discussions/2056
  - label: discussion
