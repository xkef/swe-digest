- title: >-
    Anthropic's Claude Ship beta lets Claude Approvals approve pull requests under a policy
    file in the repository
  section: Top stories
  category: Agentic coding
  blurb: >-
    Claude can now approve routine GitHub pull requests itself when a team's checked-in policy
    allows it, and ask for human sign-off otherwise.
  summary: >-
    Claude Ship launched in beta on 2026-11-23 for Claude Team and Enterprise plans on GitHub,
    combining the generally available Code Review with two new beta agents. Claude Approvals
    starts when a repository has an approval policy file on its default branch, can weigh
    Code Review findings and natural-language classifiers, and either approves routine changes
    or requires human sign-off. Anthropic recommends running it in observe-only mode before
    making its approval a required check through branch protection.
  why: >-
    Teams can move the human review gate from every pull request to a policy-defined subset,
    enforced through the branch protection they already use.
  background: >-
    Most teams require a human approval through branch protection, often routed by a CODEOWNERS
    file that maps paths to reviewers, and Anthropic describes Claude Approvals as a smarter
    CODEOWNERS file. As coding agents raise pull request volume, review has become the bottleneck,
    and this digest has tracked companies such as Robinhood and Sourcegraph routing some changes
    past human review. Anthropic says that on the Claude Code team, where Claude's review
    is one layer of the process, merged pull requests more than doubled from June to September
    while the reverted share fell by more than 40%.
  event: claude-ship-claude-approvals
  sources:
  - label: primary
    url: https://claude.com/resources/articles/introducing-claude-ship
  - label: discussion
    url: https://news.ycombinator.com/item?id=50618513
- title: >-
    Attacker runs commands on six hex.pm servers through CVE-2026-129514, an Erlang term decoding
    flaw
  section: Top stories
  category: Security
  blurb: >-
    An attacker ran commands on six hex.pm web servers through a struct deserialization chain,
    so Elixir users must reset passwords and 2FA.
  summary: >-
    On 2026-11-23 between 18:16 and 18:29 UTC, an attacker sent 69 requests whose Erlang term
    bodies held fake structs that chained Plug, Ecto and DBConnection code into OS command
    execution on six hex.pm web servers. Hex found no package or database changes but cannot
    rule out database reads of emails, password hashes, API key hashes, 2FA secrets and sessions,
    so it rotated all server credentials and session keys and asks users to change passwords
    and reset 2FA. The registry signing key is not yet rotated, so Hex says to fetch only
    from repo.hex.pm until new clients with a rotatable signing system ship, and the same
    bug class in Ash is fixed in ash 3.38.0 as CVE-2026-124283.
  why: >-
    Elixir, Erlang and Gleam teams should reset Hex credentials, avoid mirrors until the new
    Hex client ships, and audit any endpoint that decodes Erlang terms from unauthenticated
    input.
  background: >-
    Hex is the package registry for the BEAM ecosystem, used by mix, rebar3 and Gleam. Erlang's
    binary_to_term decodes the External Term Format, and its safe mode blocks new atoms and
    functions but not maps. An Elixir struct is just a map with a __struct__ key, and protocols
    such as Inspect and Enumerable dispatch on that key, so attacker-built data can choose
    which library code runs, much like gadget chains in Java deserialization.
  followup: >-
    New Hex client releases with registry signing key rotation, expected in the coming days.
  event: hexpm-cve-2026-129514-breach
  major: breach of a platform that developers build on
  sources:
  - label: primary
    url: https://hex.pm/blog/security-incident-on-hexpm
  thread: f-0247
- title: >-
    parquet crate RUSTSEC-2026-0595: encrypted Parquet files written with bloom filters store
    the filters in plaintext
  section: Security
  category: Security
  blurb: >-
    Arrow Rust wrote bloom filter headers and bitsets unencrypted into encrypted Parquet files,
    and patched releases now reject that setup.
  summary: >-
    RUSTSEC-2026-0595, also CVE-2026-125651, says the parquet crate from 55.0.0 wrote the
    header and bitsets of column bloom filters in plaintext when writing encrypted files.
    Versions 60.2.0, 59.3.3, 58.4.2 and 57.3.3 raise a runtime error when bloom filters and
    encryption are both enabled. Files already written this way stay exposed, and the advisory
    recommends rewriting them with bloom filters disabled.
  why: >-
    Teams writing encrypted Parquet from Rust should upgrade and rewrite affected files, since
    a plaintext filter lets anyone test which values a column holds.
  background: >-
    Parquet modular encryption encrypts column data and metadata with per-column keys so files
    can sit in shared object storage. A bloom filter is a compact probabilistic set summary
    that lets readers skip row groups that cannot contain a value. Left in plaintext, it lets
    an attacker without keys check guesses, such as whether an email address appears in a
    column.
  event: rust-parquet-encrypted-bloom-filter-plaintext
  sources:
  - label: primary
    url: https://rustsec.org/advisories/RUSTSEC-2026-0595.html
- title: >-
    Zstandard 1.6.0 fixes CVE-2026-124851 and over a dozen memory safety bugs, and disables
    legacy formats by default
  section: Security
  category: Security
  blurb: >-
    Zstandard 1.6.0 ships early after a wave of bug reports, fixing memory corruption bugs
    and disabling legacy format support by default.
  summary: >-
    Meta released Zstandard 1.6.0 on 2026-11-23, earlier than planned, to answer a flood of
    bug reports, one of which was published as CVE-2026-124851. The changelog fixes uninitialized
    memory exposure in streaming decompression of malformed data, out-of-bounds reads and
    writes in the DDict hash table, use-after-free bugs in prefix and multithreaded compression
    paths, and memory corruption in ZSTD_compressSequences(). Legacy format support is now
    off by default in all build systems, and the CLI no longer writes output through symbolic
    links.
  why: >-
    Any service or binary that bundles libzstd, directly or through bindings such as zstd-sys,
    needs a rebuild against 1.6.0, and code that still reads pre-1.0 frames must re-enable
    legacy support explicitly.
  background: >-
    Zstandard is a general-purpose compression library and format used in the Linux kernel,
    package managers, databases, filesystems and HTTP content encoding. Many projects vendor
    a copy of the C library rather than link the system one, so fixes reach them only when
    each project updates its bundled copy. The legacy decoders handle frame formats from before
    the format was frozen, code that is rarely exercised and so receives less scrutiny.
  event: zstd-1-6-0-release
  sources:
  - label: primary
    url: https://github.com/facebook/zstd/releases/tag/v1.6.0
  - label: discussion
    url: https://www.phoronix.com/news/Zstandard-Zstd-1.6
- title: >-
    iTerm2 3.7.9 fixes Kitty graphics response injection that runs commands when a crafted
    file is printed
  section: Security
  category: Security
  blurb: >-
    Catting a file with a hidden Kitty graphics escape sequence in iTerm2 3.6.1 to 3.7.8 can
    type attacker commands into the shell.
  summary: >-
    An APC Kitty image transmit command naming a nonexistent file path with embedded newlines
    makes iTerm2 send an error reply to the PTY that keeps those newlines, so the shell runs
    the text between them as a command. The APC handler had no trust check and the reply is
    sent at default verbosity, so it works on default installs with bash, zsh and fish. iTerm2
    3.7.9 replaces control characters with spaces in Kitty image, Kitty drag-and-drop and
    title reports.
  why: >-
    Upgrade iTerm2 to 3.7.9 before printing untrusted files such as READMEs or logs, since
    a cat of a cloned repository was enough to execute code.
  background: >-
    Terminals answer some escape sequences by writing a reply into the same input stream the
    shell reads, which is how queries like cursor position work. When a reply echoes attacker-controlled
    text, control characters in it act as keystrokes, a recurring class of terminal bugs.
    The Kitty graphics protocol uses APC sequences to move images, including by file path.
  event: iterm2-kitty-apc-response-injection
  sources:
  - label: primary
    url: https://ii4gsp.github.io/iterm2-rce/
- title: >-
    DeepMind's Gemini 4 agent teams cut a fusion quantum circuit's cost 11.8x, with every
    result proved in Lean
  section: AI
  category: AI
  blurb: >-
    Teams of Gemini 4 agents found cheaper quantum circuits for fusion, chemistry and search,
    and proved each one correct in an open Lean library.
  summary: >-
    Independent Gemini 4 agent teams proposed algorithm improvements, verified them in Lean
    before adding them to a shared notebook, and traded ideas at a virtual conference every
    four hours. They cut the cost of an inertial confinement fusion circuit 11.8x and its
    memory from 5,650 to 4,338 error-corrected qubits, cut Cytochrome P450 simulation cost
    2.5x with 481 to 333 qubits, and found a 2.57x Grover speedup and a 290x faster arcsin
    routine. Google DeepMind open-sources the Lean library, problem specifications and verified
    solutions.
  why: >-
    It shows formal proof working as the acceptance gate for agent search in domains where
    results cannot be checked by running them.
  event: deepmind-quantum-algorithms-agents-lean
  sources:
  - label: primary
    url: https://deepmind.google/blog/finding-faster-quantum-algorithms-with-agents-and-formal-verification/
- title: >-
    Z.ai releases GLM-5.4, its first looped transformer model, to GLM Coding Plan users without
    open weights
  section: AI
  category: AI
  blurb: >-
    Z.ai's GLM-5.4 reruns a block of weight-shared layers per token for depth without more
    parameters, and ships only through its Coding Plan.
  summary: >-
    Z.ai made GLM-5.4 available to all GLM Coding Plan users on 2026-11-23, citing new vision
    capabilities, stronger coding and 50% more weekly quota than GLM-5.3. Z.ai describes it
    as its first loop transformer, in which a group of weight-shared layers runs for several
    iterations to refine hidden states. Simon Willison reports the model has no open weights
    yet and is reachable only with a Coding Plan key through Z.ai's OpenAI-compatible API.
  why: >-
    Teams evaluating GLM for coding agents must use the Coding Plan endpoint for now, and
    looped architectures change the compute per token of open models they may later self-host.
  background: >-
    A standard transformer runs each layer once per token. A looped transformer reuses a block
    of layers several times, so the model gets more effective depth and more compute per token
    without adding parameters. The idea goes back to Google's 2018 Universal Transformer paper.
    Thinking Machines shipped Inkling 2 Mini, an open-weights looped model, on 2026-11-20.
  comments: >-
    The Hacker News thread drew 1078 points and 350 comments. Commenters say the article describes
    running 28 of the layers twice, a fixed loop count rather than iterating to a fixed point,
    and debate whether latent looping makes reasoning harder to monitor than visible chain
    of thought.
  event: glm-5-4-release
  sources:
