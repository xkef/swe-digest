  blurb: >-
    Collector v0.165.0 drops deprecated confighttp fields and bounds zstd decoder windows
    that let small crafted payloads force big allocations.
  summary: >-
    The release removes IdleConnTimeout, MaxIdleConns, MaxIdleConnsPerHost and DisableKeepAlives
