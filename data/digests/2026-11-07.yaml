- title: >-
    Amutable Operating System overview describes an image-based Linux with no shell, no SSH
    and signed-only images
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Poettering and colleagues detail a Linux design shipping no shell, SSH or interpreters,
    booting only signed Verity images.
  summary: >-
    LWN reports on 2026-11-07 that Lennart Poettering, Michael Vogt and Joaquim Rocha published
    a detailed technical overview of the Amutable Operating System (AOS) and its infrastructure.
    The overview lists seven security properties, including that AOS installs no UNIX shell,
    no SSH remote access and no language interpreters such as Python or Perl by default, and
    that only images whose Verity data is signed by a key in the Verity keyring may be activated.
  why: >-
    Operators evaluating immutable Linux images for nodes now have a stated design target
    where debugging by shell is deliberately unavailable.
  background: >-
    Image-based Linux distributions ship the operating system as a signed, read-only filesystem
    image rather than a set of individually updated packages, so the running system can be
    verified against a measured hash tree. dm-verity provides that hash tree and refuses blocks
    that do not match the signed root hash. Removing shells and interpreters removes the usual
    post-exploitation tooling an attacker finds on a compromised host, at the cost of ordinary
    administrative access.
  followup: >-
    Publication of the full AOS specification and the first distribution shipping it.
  sources:
  - label: primary
    url: https://lwn.net/Articles/1105934/
