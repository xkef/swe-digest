    GitHub Copilot app keeps Agent Merge armed while required checks are pending and adds
    opt-in approval instructions
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    The GitHub Copilot app can now set Agent Merge from a pull request and keep it armed while
    required checks or rules are still pending.
  summary: >-
    In the weekly release of 2026-11-06, Agent Merge can be set directly from a pull request
    in the Copilot app and stays enabled while required checks or rules are pending. Users
