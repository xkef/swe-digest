- title: >-
    ClickHouse 26.10 adds a function composition operator, row-count quotas and disk spilling
    for IN subqueries
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The monthly release brings a pipe operator for lambdas, a quota to cap rows inserted per
    user, and spilling of large IN sets to disk.
  summary: >-
    ClickHouse 26.10, published 2026-11-06, contains 104 new features, 225 performance optimizations
    and 739 bug fixes. A function composition operator lets higher-order function lambdas
    be written as pipelines joined with the pipe character, with placeholders for extra arguments.
    Quotas gain a written_rows counter so a user can be capped by rows inserted per interval.
    IN subquery sets can now spill to disk via max_bytes_before_external_set, which in the
    release's own example completed a query at 203 MiB peak memory that otherwise failed under
    a 512 MiB limit. A sql_compatible_division_for_integers setting makes integer division
    truncate as PostgreSQL does, and is off by default.
  why: >-
    The spill setting lets large IN subqueries finish under tight memory limits instead of
    aborting, and row quotas give a per-user ingestion brake.
  background: >-
    ClickHouse evaluates IN with a subquery by materializing the subquery results into an
    in-memory set and probing outer rows against it, so set size has historically been bounded
    by max_memory_usage. External spilling mirrors what the engine already does for GROUP
    BY and sorting. Quotas in ClickHouse are time-interval limits attached to users or roles
    and visible in system.quotas_usage.
  sources:
  - label: primary
    url: https://clickhouse.com/blog/clickhouse-release-26-10
- title: >-
    Hightouch pairs a calibrated cheap judge model with Claude Opus 5.5 to grade identity
    resolution near Opus accuracy
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Hightouch found a cheap judge that escalates uncertain cases to Opus 5.5 nearly matched
    Opus accuracy at a fraction of the per-identity cost.
  summary: >-
    On 1,000 synthetic identities from pseudopeople, Claude Opus 5.5 scored 99.0% at $3.86
    per 1,000, while Jev alone scored 95.7% at $0.05. Sending Jev's 30 to 90 percent confidence
    cases to Opus scored 98.8% at $0.88, and on a harder set it scored 95.3% versus 95.1%
    for Opus at $2.94 versus $5.39. GPT-6 Luna was more accurate alone but overconfident,
    so its hybrid reached only 91.6% on the harder set.
  why: >-
    Confidence calibration, not raw accuracy, decides whether a cheap first-pass model works
    in an escalating LLM judge pipeline.
  sources:
  - label: primary
    url: https://hightouch.com/blog/llm-judges-identity-resolution
