- title: >-
    On-policy distillation from a model's own GRPO checkpoint needs 50x fewer FLOPs, but loses
    to GRPO with external teachers
  section: ML research
  category: Paper
  blurb: >-
    On-policy distillation from a model's own GRPO checkpoint matched its math accuracy with
    50x fewer FLOPs, but external teachers lost to GRPO.
  summary: >-
    The paper compares reverse-KL on-policy distillation with GRPO across task difficulty,
    model sizes and domains. With an external post-trained teacher, OPD generally loses to
    GRPO in accuracy per training FLOP and often inflates response length. Multi-teacher OPD
    that merges per-domain GRPO experts costs 5.2 to 8.0 percent of specialist training FLOPs
    and reaches joint GRPO performance on a 2-domain mix with 42 percent fewer total FLOPs.
  why: >-
    Teams post-training open-weight models get measured guidance that OPD pays off for consolidating
    domain RL experts, not as a cheaper replacement for RL with a stronger external teacher.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.08453v1
- title: >-
    WebAssembly Release 3.0 core specification adds GC, exception handling, tail calls, memory64
    and multiple memories
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The WebAssembly core spec Release 3.0, dated 2026-11-04, folds garbage collection, exceptions,
    tail calls and 64-bit memories into the standard.
  summary: >-
    The WebAssembly Community Group published Release 3.0 of the core specification dated
    2026-11-04, edited by Andreas Rossberg. Its change history lists extended constant expressions,
    tail calls, exception handling with exnref and try_table, multiple memories, a 64-bit
    address type for tables and memories, typed function references, and managed garbage-collected
    reference types. The spec states that all versions are intended to stay backward compatible
    with earlier valid modules.
  why: >-
    Toolchains and runtimes targeting Wasm can now cite one standard for GC languages such
    as Kotlin and Java, native exceptions and memories above 4 GiB.
  sources:
  - label: primary
    url: https://webassembly.github.io/spec/core/
  - label: primary
    url: https://webassembly.github.io/spec/core/appendix/changes.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50394278
- title: >-
    Asahi Linux makes M3 support generally available and relicenses its code from MIT to GPLv2
    or later
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Asahi Linux makes M3 support generally available, ships partial Thunderbolt support, and
    is moving all its code from MIT to GPLv2 or later.
  summary: >-
    The Linux 7.3 progress report drops the EXPERT flag for M3 machines, enables DCP and sleep
    on them, and ships Thunderbolt with USB3, XDomain and networking but no PCIe or DisplayPort
    tunnelling. The macaudio and AVD drivers and initial M4 Pro, M4 Max and M5 Devicetrees
