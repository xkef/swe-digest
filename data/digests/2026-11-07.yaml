- title: >-
    On-policy distillation from a model's own GRPO checkpoint needs 50x fewer FLOPs, but loses
    to GRPO with external teachers
  section: ML research
  category: Paper
  blurb: >-
    On-policy distillation from a model's own GRPO checkpoint matched its math accuracy with
    50x fewer FLOPs, but external teachers lost to GRPO.
  summary: >-
    The paper compares reverse-KL on-policy distillation with GRPO across task difficulty,
    model sizes and domains. With an external post-trained teacher, OPD generally loses to
    GRPO in accuracy per training FLOP and often inflates response length. Multi-teacher OPD
    that merges per-domain GRPO experts costs 5.2 to 8.0 percent of specialist training FLOPs
    and reaches joint GRPO performance on a 2-domain mix with 42 percent fewer total FLOPs.
  why: >-
    Teams post-training open-weight models get measured guidance that OPD pays off for consolidating
    domain RL experts, not as a cheaper replacement for RL with a stronger external teacher.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.08453v1
- title: >-
    Paper traces on-policy distillation failures to a feedback loop and shows offline pretraining
    is a prerequisite
  section: ML research
  category: ML research
  blurb: >-
    A mechanistic study splits on-policy distillation into update conversion and broadcast,
    explaining weak student response and degeneration.
  summary: >-
    In arXiv:2611.08016, submitted 2026-11-05, Hong and seven co-authors analyze the learning
    dynamics of on-policy distillation, which trains a student on its own generated trajectories
    under dense teacher supervision. They separate the feedback loop into conversion of the
    distillation signal into parameter updates and broadcast of those updates across prefixes,
    which reshapes the rollout distribution. The framework accounts for limited student responsiveness
    despite large teacher-student disagreement, and for degeneration when updates that improve
    local teacher agreement also raise the probability of unsuccessful continuations. They
    report that offline distillation can prepare a student for on-policy distillation without
    improving immediate held-out accuracy, and that on-policy distillation alone may degrade
    generation but yields substantial accuracy gains after sufficient offline preparation.
  why: >-
    It gives a concrete ordering for post-training pipelines: run offline distillation first,
    then on-policy, rather than going on-policy from the start.
  background: >-
    Offline distillation trains a student on a fixed dataset of teacher outputs, so the training
    distribution never moves. On-policy distillation samples from the student instead and
    scores those samples against the teacher's next-token distributions, which keeps the training
    data on the student's own distribution but makes the data generator change with every
    update. That coupling is the same instability reinforcement learning fine-tuning faces,
    and it is why practitioners mix the two rather than choosing one.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.08016v1
- title: >-
    DiffDock study finds focused post-training supervision does not beat broad continuation
    on docking success
  section: ML research
  category: Paper
  blurb: >-
    A fixed-budget DiffDock comparison reports no consistent gain from concentrating training
    signal on structurally consequential pose corrections.
  summary: >-
    In arXiv:2611.08249, submitted 2026-11-05 and accepted at the NeurIPS 2026 AI4DD workshop,
    Brown and four co-authors compare broad continuation training of DiffDock against torsional
    supervision focused on Cartesian consequence or conditional target consistency, and against
    a broad and focused mixture, all under a fixed budget. Evaluation separates fixed score
    fidelity, generated-pose quality, best-of-10 sampling capacity and confidence-selected
    Top-1 performance. At under 5 Angstrom, broad continuation had the highest mean Top-1
    success among trained policies and the focused or mixed variants showed no consistent
    advantage. The starting model had better fixed score fidelity while the broad-continuation
    model had higher mean Top-1 success at the same aggregate best-of-10 recovery.
  why: >-
    For teams fine-tuning diffusion docking models, the result argues against reweighting
    training toward geometrically important corrections without new evidence.
  background: >-
    Molecular docking predicts how a small molecule binds a protein pocket. Diffusion docking
    models such as DiffDock corrupt a known pose with noise and learn a score field that reverses
    the corruption, so training coverage across the whole corruption range matters. Reported
    docking accuracy usually counts poses within 2 or 5 Angstrom RMSD of the crystal structure,
    and a confidence model selects which sampled pose to return, which is why score fidelity
    and returned-pose success can move in opposite directions.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.08249v1
- title: >-
    WebAssembly Release 3.0 core specification adds GC, exception handling, tail calls, memory64
    and multiple memories
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The WebAssembly core spec Release 3.0, dated 2026-11-04, folds garbage collection, exceptions,
    tail calls and 64-bit memories into the standard.
  summary: >-
    The WebAssembly Community Group published Release 3.0 of the core specification dated
    2026-11-04, edited by Andreas Rossberg. Its change history lists extended constant expressions,
    tail calls, exception handling with exnref and try_table, multiple memories, a 64-bit
    address type for tables and memories, typed function references, and managed garbage-collected
    reference types. The spec states that all versions are intended to stay backward compatible
    with earlier valid modules.
  why: >-
    Toolchains and runtimes targeting Wasm can now cite one standard for GC languages such
    as Kotlin and Java, native exceptions and memories above 4 GiB.
