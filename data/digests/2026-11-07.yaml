- title: >-
    SonicWall fixes exploited SSL-VPN SAML MFA bypass CVE-2026-19868, which CISA adds to KEV
  section: Security
  category: Security
  blurb: >-
    SonicOS SSL-VPN flaw CVE-2026-19868 lets attackers bypass SAML-enforced MFA, is exploited
    in the wild, and is fixed in 7.3.4 and 8.2.3.
  summary: >-
    SonicWall fixed seven SonicOS flaws, including CVE-2026-19868 (CVSS 7.1), which lets attackers
    with valid credentials for an alternate authentication method bypass SAML controls, potentially
    including SAML-enforced MFA, on SSL-VPN set up for SAML. CISA added it to KEV on 2026-11-06
    with a federal deadline of 2026-11-20. Gen7 7.3.3-7015 and earlier and Gen8 8.2.2-8015
    and earlier are affected, fixed in 7.3.4-7013 and 8.2.3-8015, with no workaround.
  why: >-
    Teams relying on SAML MFA in front of SonicWall SSL-VPN should treat it as bypassable
    until firewalls run the fixed builds.
  followup: >-
    CISA federal remediation deadline on 2026-11-20 and any attribution of the attacks.
  sources:
  - label: primary
    url: https://www.cisa.gov/news-events/alerts/2026/11/06/cisa-adds-one-known-exploited-vulnerability-catalog
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-new-ssl-vpn-mfa-bypass-flaw-exploited-in-attacks/
  thread: f-0184
- title: >-
    pwn.ai escapes a Firecracker 1.16.1 microVM to run code as root on the host through a
    host kernel memory primitive
  section: Security
  category: Security
  blurb: >-
    pwn.ai turned a host kernel memory primitive into root code execution in a Firecracker
    1.16.1 VMM run as root without the jailer.
  summary: >-
    PwnEscape Part 2 shows a guest using host physical memory access, obtained through a Linux
    networking flaw from Part 1, to find its own page via EPT, recover the Firecracker process
    page tables, and rewrite the saved registers of a vCPU thread blocked in KVM_RUN. A serial
    port write made Firecracker call write on stderr with guest-chosen arguments, then resume
    normally. The test ran Firecracker 1.16.1 directly as root on host kernel 7.0.0-1011-aws
    with no jailer, and the authors say jailer deployments need separate assessment.
  why: >-
    Agent sandboxes on Firecracker depend on host kernel patching and the jailer's privilege
    drop, not the VMM boundary alone.
  comments: >-
    The Hacker News thread debates how much the missing jailer, namespaces and seccomp limit
    real impact.
  sources:
  - label: primary
    url: https://pwn.ai/blog/firecracker-escape
  - label: discussion
    url: https://news.ycombinator.com/item?id=50397219
- title: >-
    Chainalysis says its agentic breach exposed names, password hashes and live tokens for
    all customers
  section: Security
  category: Security
  blurb: >-
    Chainalysis says its agentic attack exposed names, password hashes and live tokens for
    all users and took KYT and its API offline.
  summary: >-
    Chainalysis says its investigation of an agent-driven attack found exposure of names,
    usernames, password hashes and live tokens for all users, after earlier finding an on-path
    attack that exposed a subset of passwords. It took Reactor, Data Solutions, the KYT interface
    and API, address screening and the login page offline, and will require every user to
    reset passwords and rotate API keys. KYT access returns first for customers who register
    trusted IP addresses for an allowlist.
  why: >-
    Chainalysis API integrations will break until keys are rotated, and reused passwords elsewhere
    should be changed now.
  followup: >-
    Restoration of KYT, Reactor and Data Solutions and disclosure of the initial access vector.
  sources:
  - label: discussion
    url: https://thehackernews.com/2026/11/chainalysis-breach-exposes-all-users.html
  thread: f-0185
- title: >-
    Claude Code saved approved commands with secrets in settings.local.json, and Apiiro finds
    1,122 public copies on GitHub
  section: Security
  category: Security
  blurb: >-
    Choosing 'don't ask again' in Claude Code can write a command's password or token into
    a project file that developers then commit to GitHub.
  summary: >-
    Apiiro found 104,185 public copies of .claude/settings.local.json, and 1,122 of them hold
    at least one secret, 1,379 distinct secrets in all, including 379 database passwords and
    23 AWS keys. Claude Code adds the file only to the user's global git excludes, not the
    project .gitignore, and in 539 of 1,105 traced repositories a commit co-authored by Claude
    changed the file. Gitleaks and TruffleHog missed 215 of the files with secrets, mostly
    passwords typed inline in commands.
  why: >-
    Teams using Claude Code should search repositories and git history for .claude settings
    files, rotate any secrets found, and approve command patterns that reference secrets through
    variables rather than inline values.
  comments: >-
    The Hacker News reports four related GitHub issues, the earliest filed 2025-08-11, were
    closed by a stale bot without an Anthropic reply.
  sources:
  - label: discussion
    url: https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html
  thread: f-0187
- title: >-
    Rails, Jetty and Spring Boot read client-sent Forwarded headers that most reverse proxies
    pass through unchanged
  section: Security
  category: Security
  blurb: >-
    Spring Boot before 4.2, Jetty and Rails 8.1 prefer the Forwarded header, which Envoy,
    Nginx and Traefik pass through, allowing IP spoofing.
  summary: >-
    Lauri Koskela found that Jetty 12.1.7, Spring Boot 4.0.5 with Jetty, Reactor Netty or
    the FRAMEWORK strategy, and Rails 8.1.3 parse RFC 7239 Forwarded and prioritise it over
    X-Forwarded-* headers, while Envoy, ingress-nginx, Traefik, Apache, Caddy and Kong pass
    Forwarded through untouched. This lets clients spoof client IP, host name and scheme behind
    a trusted proxy. Rails fixed its spoofing check in 8.1.4.1, Spring Boot 4.2 now parses
    only X-Forwarded-* by default, and Jetty kept its default while adding configuration options.
  why: >-
    Spring and Jetty services behind a proxy that does not strip Forwarded can have IP allowlists,
    rate limits and password reset host names bypassed, so proxies should drop untrusted forwarding
    headers.
  sources:
  - label: primary
    url: https://www.lkoskela.fi/blog/2026-11-05-forwarded-without-question/
  - label: discussion
    url: https://www.reddit.com/r/netsec/comments/1xp9n79/forwarded_without_question_how_web_frameworks/
- title: >-
    Anthropic finds offline dreaming corrects Claude's memory notes and builds wikis that
    improve multi-document answers
  section: AI
  category: AI
  blurb: >-
    Anthropic says offline dreaming over transcripts corrected wrong memory notes and raised
    wiki-only QA scores from 13% to 48% in 128 sessions.
  summary: >-
    Anthropic describes agent memory as notes written in session plus dreaming, an offline
    pass that checks notes against transcripts, builds linked wikis and promotes a small index
    into future context. On a 420M-token internal corpus, wiki-only scores rose from 13% to
    48% as dreaming scaled from 2 to 128 sessions, and search plus wiki reached 61% versus
    53% for search alone. Telling strong models to record only failures cut their gain from
    memory, while explicit steering helped older models.
  why: >-
    Agent builders get evidence to keep injected memory small, let strong models judge what
    to save, and verify notes against logs.
  sources:
  - label: primary
    url: https://www.anthropic.com/research/components-of-agent-memory
- title: >-
    Anthropic finds scientists use Claude mostly for data analysis and writing across 207,000
    research sessions
  section: AI
  category: AI
  blurb: >-
    Anthropic's study of 207,000 research sessions finds scientists use Claude mainly for
    data analysis and writing, rarely for ideation.
  summary: >-
    Anthropic classified 207,049 consumer Claude and Claude Code research sessions from 2026-08-02
    to 2026-09-30 against the SciNet taxonomy of 7,262 tasks. Data analysis is 33.7 percent
    of Claude sessions and 48.1 percent of Claude Code sessions, computer science takes 32.7
    percent of Claude Code research sessions with 4.3 percent of researchers, and ideation
    is twice as large a share on Claude Science as on Claude.
  why: >-
    The data shows where AI help in research currently lands, which matters for teams building
    scientific and drug discovery tooling on top of agents.
  sources:
  - label: primary
    url: https://www.anthropic.com/research/how-researchers-use-claude
  - label: discussion
    url: https://news.ycombinator.com/item?id=50389990
- title: >-
    Google makes Gemini Omni 1.2 Flash generally available with 15-second video clips and
    30 percent lower pricing
  section: AI
  category: AI
  blurb: >-
    Google's video model now makes 15-second clips, edits them over multiple turns, and costs
    $0.07 per second at 720p on the Gemini API.
  summary: >-
    Gemini Omni 1.2 Flash is generally available on the Gemini API and Google Cloud, with
    native clips of 3 to 15 seconds, up from 10 seconds in Omni 1.1. It adds multi-turn conversational
