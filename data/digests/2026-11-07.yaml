- title: >-
    Apple container 1.7.1 adds config.toml DNS defaults and a shared image store for Kubernetes
    clusters
  section: Apple platforms
  category: Apple
  blurb: >-
    Apple's container 1.7.1 adds DNS defaults in config.toml, a shared image store for clusters,
    and keeps container data out of Time Machine.
  summary: >-
    container 1.7.1 lets users set default DNS nameservers, search domains and options in
    config.toml, reports cpuUtilization in machine-readable stats, and moves the default Kata
    kernel to 4.3.1. The Kubernetes plugin gains a breaking --shared-image-store option on
