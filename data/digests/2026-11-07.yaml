- title: >-
    libghostty-vt 1.0 ships a stable C ABI for terminal emulation, with Neovim set to replace
    libvterm with it
  section: Top stories
  category: Dev tools
  blurb: >-
    libghostty-vt reaches 1.0 with a stable C ABI enforced in CI, and Neovim plans to swap
    libvterm for it once distributions can package it.
  summary: >-
    Mitchell Hashimoto released libghostty-vt 1.0 on 2026-11-06, the terminal emulation core
    of Ghostty as an MIT-licensed C library with semantic versioning, libabigail ABI checks
    in CI and versioned ELF symbols. Releases ship signed source tarballs plus an offline
    dependency tarball, shared and static libraries with a SONAME, pkg-config and CMake files.
    Neovim has an approved pull request replacing libvterm with libghostty-vt that waits on
    this tagged release, and the JetBrains IDE terminal already runs on it.
  why: >-
    Terminal and TUI builders can now dynamically link a packaged, ABI-stable emulator instead
    of writing or vendoring their own.
  followup: The Neovim merge of the libghostty-vt pull request and distribution packages.
  sources:
