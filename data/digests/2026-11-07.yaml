- title: >-
    GitHub opens Copilot code review settings to REST and GraphQL and reports which MCP servers
    shaped each comment
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Copilot code review settings are now manageable over REST and GraphQL, and responses show
    which skills and MCP servers shaped each comment.
  summary: >-
    Enterprise, organization and repository admins can now read and set code review enablement,
    default effort, runner configuration and MCP tool use through the APIs, and review responses
    carry attribution fields and reported sources. Balanced effort reviews now use three reviewer
    models with a fourth combining findings, and the automatic review rule honors the bypass
    list. Enterprise and organization endpoints do not accept GitHub Apps or fine-grained
    tokens.
  why: >-
    Teams can manage the AI review gate as code across repositories and audit what context
    fed each review comment.
  sources:
