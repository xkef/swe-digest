- title: >-
    Cloudflare says Privacy Pass needs post-quantum replacement and points to VOLE-in-the-Head
    blind signatures
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Cloudflare's cryptographers say Privacy Pass tokens stay unlinkable after Q-day but become
    forgeable, and survey successor designs.
  summary: >-
    In a post published 2026-11-06, Christopher Patton, Tianyu Zhang and Bas Westerbaan write
    that Privacy Pass still relies on RSA and elliptic curves, so a quantum attacker could
    forge tokens at will, while its unlinkability is unconditional and survives. They describe
    a successor design called MOLE, Moderation Of unLinkable Endorsements, in which an anchor
    issues an endorsement that a client redeems with a moderator without revealing which anchor
    in the trusted anchor set issued it. They name size as the main obstacle, citing ML-DSA-44
    signatures at 2,420 bytes against 64 bytes for ECDSA-P256, and point to the VOLE-in-the-Head
    zero-knowledge proof system from Baum et al., Crypto 2023, and the FAEST signature candidate
    as a route to decoupling parameter choice from protocol design.
  why: >-
    Teams that depend on Privacy Pass tokens for rate limiting or private relays should expect
    a protocol change with far larger tokens.
  background: >-
    Privacy Pass issues a client blind signatures over messages the issuer never sees, so
    the client can later redeem a token that cannot be linked back to issuance. Apple's iCloud
    Private Relay and Cloudflare's Privacy Gateway use it to let proxied traffic prove legitimacy
    without identifying the user. Unlinkability that holds against any attacker, quantum or
    not, is an information-theoretic property, unlike unforgeability, which rests on hardness
    assumptions that quantum computers break.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/vole-mole/
- title: >-
    Cohere finds a strong lead agent with cheap planning workers cuts coding team cost by
    up to 70 percent
  section: Talks
  category: Video
  blurb: >-
    Cohere found a strong lead model with cheap worker agents placed at the bottleneck stage
    neared frontier coding results at up to 70% lower cost.
  summary: >-
    On ProgramBench, Nouha Dziri reports that agent teams beat a solo agent by up to about
    10 points but cost 4 to 7 times as much, and that adding workers paid off only at the
    stage that bottlenecks the task, planning there and implementation on Commit0. A strong
    lead with cheap workers kept most of the reward while cheap leads capped results, and
    84 percent of messages went from workers to the lead, with peer messaging adding no reward.
    A blocking lead outperformed an asynchronous lead under a minimal prompt because the async
    lead moved on before worker results arrived.
  why: >-
    Engineers building multi-agent coding harnesses should spend on the lead model and on
    parallel discovery at the bottleneck stage rather than spreading workers across every
    stage.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=maitMe9HCvw
- title: >-
    Anthropic's Lance Martin shows Claude Code skills that audit prompts, fix prompt caching
    and hill climb evals
  section: Talks
  category: Video
  blurb: >-
    An Anthropic engineer says prompt cache fixes cut eval harness costs up to 72 percent,
    and an eval hill climber cut one setup's cost 90 percent.
  summary: >-
    Lance Martin presents bundled Claude Code skills that strip outdated prompt patterns such
    as think step by step and contradictory rules, check prompt cache hit rates, build evals
    and hill climb on them with a train and test split to catch overfitting. He reports that
    cache fixes on internal benchmark harnesses cut cost by up to 72 percent with no meaningful
    quality change. A cost-focused hill climb on a support ticket eval moved from Opus 4.8
    high effort to stronger models at low effort for about 90 percent lower cost and better
    scores. He also advises binary or pairwise LLM judge rubrics checked across several models
    and replicate runs.
  why: >-
    Teams on the Claude API can run these audits on existing code and test a stronger model
    at low effort before buying more tokens.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=ys6YQ2yfBpM
- title: >-
    Warp's Ben Holmes scores agent transcripts with LLM judges and lets a nightly agent propose
    skill fixes
  section: Talks
  category: Video
  blurb: >-
    Warp grades every merged agent session on rubrics like redundant tests, verbosity and
    efficiency, then has an agent turn failures into skill PRs.
  summary: >-
    Ben Holmes describes collecting each agent session with its transcript, tool calls and
    resulting diff in one place, then grading it with markdown LLM-as-judge rubrics that set
    pass and fail thresholds. A daily cron agent reads the failing reports, finds common causes
    and opens pull requests against skills and agent config. Examples include a test skill
    that wasted tool calls hunting for free ports and a triage skill missing config to spawn
    subagents. Warp released a one-off version as a skill called Skill Doctor.
  why: >-
    It gives a concrete loop for finding silent tool-call waste in unattended agents and measuring
    whether a skill change helped.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=pz74r-4dGfQ
- title: >-
    LiveOverflow walks through the libheif overlay heap overflow used in the OpenAI Discourse
    hack, fixed without a CVE
  section: Videos
  category: Video
  blurb: >-
    A crafted HEIF overlay at a negative offset with alpha makes libheif write past the canvas
    buffer, and the fix shipped without a CVE.
  summary: >-
    The video traces a libheif bug in heif_pixel_image overlay code that HackerOne researchers
    used against a Discourse forum to reach OpenAI internal source code. Negative overlay
    offsets produce a wrong width, and the alpha blending path computes the output pointer
    without subtracting the x start offset, so writes spill into following rows and past the
    heap buffer. The fixing commit had a benign message and no CVE.
  why: >-
    Services that decode user-uploaded HEIC images with libheif should confirm they run a
    build that includes the overlay fix, since scanners keyed on CVEs will miss it.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=IsQ-OuoxlUk
