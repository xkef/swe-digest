- title: LWN details AI scrapers overwhelming infrastructure through residential proxies
  section: Engineering posts
  category: Engineering post
  blurb: >-
    LWN details how AI scrapers route through residential proxies to bypass IP blocking, raising
    operational costs for public infrastructure.
  summary: >-
    Jonathan Corbet wrote on 2026-07-10 that AI training-data scrapers increasingly route
    requests through residential-proxy networks, software installed on ordinary users' devices
    that fetches pages on command, spreading load across millions of IPs and defeating IP-based
    blocking. He reports git forges and mailing-list archives among the hardest hit, and that
    LWN saw its heaviest scraper attack on 2026-07-02, correlated with the takedown of a residential-proxy
    network. Cited mitigations include proof-of-work challenges such as Anubis, rate limiting,
    and caching.
  why: >-
    Residential-proxy scraping turns automated crawling into a distributed load problem that
    per-IP defenses cannot address, raising the operational cost of running public git and
    archive infrastructure.
  sources:
  - label: LWN (Jonathan Corbet)
    url: https://lwn.net/SubscriberLink/1080822/990a8a5e2d379085/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48864252
- title: ClickHouse runs a PgBouncer fleet for 4x connection-pooling throughput
  section: Engineering posts
  category: Engineering post
  blurb: >-
    ClickHouse scales single-threaded PgBouncer across cores using SO_REUSEPORT to load-balance
    connections, achieving roughly 4x total throughput.
  summary: >-
    Kaushik Iska wrote on 2026-07-01 that ClickHouse Managed Postgres works around PgBouncer
    being single-threaded, which caps one process at a single CPU core. They run one PgBouncer
    process per core bound to the same port with SO_REUSEPORT so the kernel load-balances
    connections while clients see one endpoint, and forward query-cancel requests that arrive
    at the wrong process to the correct one (peering). On a 16-vCPU c7i.4xlarge instance a
    single process peaked near 87,000 transactions per second while a fleet of 16 sustained
    about 336,000, roughly 4x, and held that rate at 256 clients where the single process
    degraded to 77,000.
  why: >-
    It is a concrete pattern for scaling a single-threaded connection pooler across cores
    behind one endpoint, with the cross-process cancel handling that approach requires.
  sources:
  - label: ClickHouse blog
    url: https://clickhouse.com/blog/pgbouncer-clickhouse-managed-postgres
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48872874
- title: >-
    A cosmetic C rewrite makes a quicksort 6x faster by triggering branchless codegen
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A cosmetic quicksort rewrite triggered branchless codegen, cutting sort time from 4.39
    to 0.70 seconds, roughly 6.3x faster than before.
  summary: >-
    Christof Kaser shows a branchless-quicksort partition loop where rewriting an `if`/`else`
    that stores to and advances two pointers into a more compact idiom leads Clang to emit
    a conditional-select (`csel`) instead of a branch, cutting the time to sort 50 million
    doubles from 4.39 seconds to 0.70 seconds (about 6.3x) and running faster than C++ `std::sort`
    at 1.33 seconds. GCC still generated branch-based code for the same source. The author
    frames the outcome as depending on whether the source happens to hit a compiler's optimization
    heuristics.
  why: >-
    It shows how sensitive generated code can be to source phrasing a programmer treats as
    equivalent, so performance-critical loops can hinge on codegen heuristics that differ
    across compilers.
  sources:
  - label: Christof Kaser writeup
    url: https://tiki.li/blog/lucky_code.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48870799
