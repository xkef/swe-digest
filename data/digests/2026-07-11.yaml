- title: 'Show HN: running GLM 5.2 on a slow laptop by streaming experts from disk'
  section: Hacker News
  category: Pulse
  blurb: >-
    Colibri runs a 744-billion-parameter mixture-of-experts model on a laptop by streaming
    routed experts from disk through an LRU cache.
  summary: >-
    A Show HN (838 points) presents Colibri, a roughly 1,300-line single-file C inference
    engine that runs the 744B-parameter GLM 5.2 Mixture-of-Experts model on a 12-core laptop
    with 25 GB RAM by keeping only the dense layers (about 17B parameters, int4, roughly 9.9
    GB) resident and streaming the routed experts from disk through an LRU cache and the OS
    page cache. No BLAS, Python, or GPU is required.
  why: >-
    It is a concrete demonstration of how far MoE routing plus paging can push large-model
    inference onto commodity hardware, at the cost of throughput.
  comments: >-
    The author reports about 0.05 to 0.1 tokens per second. Commenters debated SSD wear and
    whether the throughput is usable for overnight batch tasks, and compared the approach
    to disk-backed inference experiments.
  sources:
  - label: Colibri (GitHub)
    url: https://github.com/JustVugg/colibri
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48842459
