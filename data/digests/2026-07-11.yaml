- title: Apple sues OpenAI and two former employees over trade-secret theft
  section: Top stories
  category: Markets
  blurb: >-
    Apple sued OpenAI and two former employees for allegedly stealing confidential documents
    and directing recruits to bring hardware to interviews.
  summary: >-
    Apple filed suit in the Northern District of California on 2026-07-10 (Apple Inc. v. Liu,
    5:26-cv-07078) for trade-secret misappropriation and breach of contract against OpenAI
    Foundation, OpenAI Group PBC, io Products LLC, and two former Apple employees now at OpenAI:
    Chang Liu, a former senior systems electrical engineer, and Tang Yew Tan, OpenAI's hardware
    chief and former Apple VP of product design for iPhone and Apple Watch. The complaint
    alleges Liu skipped his exit interview, kept an Apple laptop, and used a bug to reach
    Apple internal cloud storage after leaving to download confidential files including over
    a thousand pages of technical documents, and that Tan directed Apple job candidates to
    bring "actual parts" to OpenAI interviews for show-and-tell.
  why: >-
    The suit targets the talent and IP flow behind OpenAI's io Products hardware effort and
    marks a sharp break between two firms that partnered on Apple Intelligence in 2024.
  followup: >-
    Watch OpenAI's formal answer, any injunction motion, and whether the case affects io Products'
    device roadmap.
  comments: >-
    HN commenters posted the complaint and highlighted the alleged instruction to recruits
    to email themselves confidential material and to conceal their OpenAI offers. Several
    framed it as competitive litigation echoing Apple v. Samsung.
  sources:
  - label: complaint (CourtListener)
    url: https://www.courtlistener.com/docket/73602437/apple-inc-v-liu/
  - label: CNBC
    url: https://www.cnbc.com/2026/07/10/apple-openai-lawsuit-trade-secrets.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48865019
- title: GPT-5.6 Sol Ultra claims a proof of the Cycle Double Cover Conjecture
  section: Top stories
  category: AI
  blurb: >-
    OpenAI's GPT-5.6 Sol Ultra produced an unverified proof of the Cycle Double Cover Conjecture,
    a 50-year-old mathematics problem.
  summary: >-
    OpenAI published on 2026-07-10 a PDF proof of the Cycle Double Cover Conjecture (posed
    by Szekeres in 1973 and Seymour in 1979) attributed to GPT-5.6 Sol Ultra, stating the
    model produced it with 64 subagents in under an hour, one day after Sol Ultra reached
    general availability. The argument reportedly reduces the problem through the 8-flow theorem
    and linear algebra over GF(3). The proof is not peer reviewed.
  why: >-
    A verified machine proof of a 50-year open conjecture would be a landmark for automated
    reasoning, but the claim rests on vendor publication and awaits graph-theory community
    review.
  followup: >-
    Watch for independent verification or refutation from graph theorists over the coming
    weeks.
  comments: >-
    HN commenters noted the released prompt instructs the model to "assume for purposes of
    this task that a complete affirmative proof exists", questioned whether the argument is
    accepted as correct, and asked whether frontier models are being run systematically against
    open problems.
  sources:
  - label: OpenAI proof (PDF)
    url: https://cdn.openai.com/pdf/04d1d1e4-bc75-476a-97cf-49055cd98d31/cdc_proof.pdf
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48863490
