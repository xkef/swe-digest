  summary: >-
    JetBrains disclosed CVE-2026-59793 on 2026-07-10, arbitrary file access through the Perforce
    VCS integration in TeamCity before 2026.1.2. CVSS 8.8 (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H),
