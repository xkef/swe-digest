- title: Agent-skills repositories trend together on GitHub
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Three repositories packaging reusable skills for AI coding agents trended on GitHub, consolidating
    a shared distribution format for workflows.
  summary: >-
    Several repositories collecting reusable "skills" for AI coding agents trended together
    on GitHub on 2026-07-11. They are obra/superpowers, described as an agentic skills framework
    and software-development methodology (over 250,000 stars), mattpocock/skills, "skills
    for real engineers" drawn from the author's `.claude` directory (over 160,000 stars),
    and addyosmani/agent-skills, "production-grade engineering skills for AI coding agents"
    (over 75,000 stars). Each packages Markdown skill files that a coding agent loads on demand
    to follow a defined workflow, the same `.claude/skills` directory pattern used by Claude
    Code. All three were pushed on 2026-07-10.
  why: >-
    Reusable skill files are consolidating into a shared distribution format for encoding
    engineering workflows into coding agents, rather than each team re-deriving prompts in
    isolation.
  sources:
  - label: superpowers
    url: https://github.com/obra/superpowers
  - label: mattpocock/skills
    url: https://github.com/mattpocock/skills
  - label: agent-skills
