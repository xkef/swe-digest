- title: Scarf moves its production stack off Haskell after seven years
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Scarf moved production off Haskell to Python after seven years, citing slow builds and
    friction with LLM-assisted parallel development.
  summary: >-
    Avi Press wrote on 2026-07-10 that Scarf, which provides package-download analytics for
    open source, is moving its production systems off Haskell to Python after seven years.
    He cites Haskell build and compile times as the main friction, worsened by parallel AI-assisted
    development where a model can produce an implementation faster than the build completes,
    plus toolchain complexity around Nix and CI caching. Rewritten components include authentication,
    database access, shared models, deployment images, and tests.
  why: >-
    It is a concrete production migration argued around how LLM-assisted workflows change
    the cost of slow compile cycles, not a language-quality complaint alone.
  sources:
  - label: Avi Press writeup
    url: https://avi.press/posts/2026-07-10-after-7-years-in-production-scarf-has-reluctantly-moved-away-from-haskell.html
