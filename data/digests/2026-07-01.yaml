- title: Asahi Linux 7.1 adds Apple M3 support and fixes macOS 27 boot
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Asahi Linux 7.1 added M3 support and fixed a macOS 27 boot regression caused by a new
    firmware requirement for an APFS bootable flag.
  summary: >-
    The Asahi Linux 7.1 progress report, published 2026-06-30, describes bring-up on Apple
    M3 machines: working PCIe, WiFi, Bluetooth, NVMe, keyboard and trackpad drivers, speaker
    and headphone audio, and CPU frequency switching with big.LITTLE scheduling. It also fixes
    a regression where macOS 27 updates dropped Asahi from the boot picker, traced to a new
    Apple firmware requirement for an APFS bootable flag, and an SMC battery-interface change
    that caused emergency shutdowns. The m1n1 1.6.0 bootloader release requires Rust for its
    stage 2 build and adds GPU initialization and M3/M4/A18 Pro support, and custom AVD firmware
    enables V4L2 hardware AVC decode up to 10-bit 4K.
  why: >-
    M3 support and the macOS 27 boot fix are the practical blockers for running Linux on current
    Apple Silicon laptops, moving the newer hardware toward daily-driver viability.
  sources:
  - label: Asahi progress report
    url: https://asahilinux.org/2026/06/progress-report-7-1/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48744518
