    in long-context LLM inference.
  summary: >-
    A preprint proposes RaBitQCache, a rotated binary quantization scheme for the key-value
    cache in long-context LLM inference, aiming to cut the memory that KV cache consumes as
    context length grows. Results are the authors' own and not independently reproduced.
  why: >-
    KV-cache memory is a primary bottleneck for serving long-context models, so aggressive
    lossless-leaning quantization affects inference cost and maximum context.
