- title: Looking ahead to PostgreSQL 19
  section: Infrastructure
  category: Infrastructure
  status: developing
  blurb: >-
    Snowflake outlined PostgreSQL 19 Beta 1 features: REPACK CONCURRENTLY for lock-free reorganization,
    SQL/PGQ graphs, and parallel vacuum.
  summary: >-
    A Snowflake engineering post walks through PostgreSQL 19 features now in the Beta 1 cycle,
    reaching the Hacker News front page (203 points). Highlighted items include REPACK CONCURRENTLY
    for lock-free table reorganization, SQL/PGQ property-graph queries, dynamic partition
    merge and split, logical-replication sequence synchronization, parallel autovacuum with
    per-table configuration and a new scoring view, INSERT...ON CONFLICT DO SELECT...RETURNING,
    GROUP BY ALL, and window-function IGNORE NULLS. PostgreSQL 19 GA is expected in the autumn
    2026 window.
  why: >-
    REPACK CONCURRENTLY, parallel autovacuum, and the temporal and upsert SQL additions target
    long-standing operational pain in large Postgres deployments.
  followup: >-
    Watch for Beta 2 and the RC schedule ahead of GA, and PostgreSQL 14 end of life on 2026-11-12.
  sources:
  - label: PostgreSQL 19 Beta 1
    url: https://www.postgresql.org/about/news/postgresql-19-beta-1-released-3313/
  - label: Snowflake engineering
    url: https://www.snowflake.com/en/blog/engineering/postgresql-19-features-beta/
