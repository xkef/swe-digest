- title: US lifts export controls on Claude Fable 5 and Mythos 5
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    The US Department of Commerce lifted export controls on Claude Fable 5 and Mythos 5, restoring
    global access after nearly three weeks offline.
  summary: >-
    Anthropic said on 2026-06-30 that the US Department of Commerce lifted the export controls
    that had blocked foreign-national access to Claude Fable 5 and Mythos 5, and that it will
    begin restoring access on 2026-07-01. The directive that forced both models offline for
    all customers landed on 2026-06-12, three days after the models went live. Commerce Secretary
    Howard Lutnick said the government worked with Anthropic over two weeks to analyze and
    approve Fable 5; neither side detailed what changed.
  why: >-
    The models return to global availability after nearly three weeks offline, ending the
    access uncertainty developers and partners have tracked since mid-June.
