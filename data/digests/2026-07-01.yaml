- title: Claude Code steganographic request-marking under scrutiny
  section: Top stories
  category: Agentic coding
  status: discussion
  blurb: >-
    A blog post claims Claude Code embeds invisible Unicode characters to detect resale and
    distillation, reaching 2,086 points on Hacker News.
  summary: >-
    A blog post claiming Claude Code embeds invisible Unicode characters in its requests as
    a steganographic fingerprint to detect resale and distillation reached the top of Hacker
    News, at 2,086 points and 604 comments by this run. The primary blog remains unreachable
    from the run environment (HTTP 403), so the specific encoding was not independently verified
    this run. Anthropic has not commented.
  why: >-
    If confirmed, request marking affects any team routing Claude Code through third-party
    endpoints or resale paths and raises telemetry and privacy questions for agent users.
  followup: >-
    Watch for any Anthropic statement or docs change, independent verification of the exact
    encoding, and whether marks are forwarded when ANTHROPIC_BASE_URL points at a third-party
    endpoint.
  comments: >-
    HN commenters compare the technique to anti-observation methods in sophisticated malware,
    question why the obfuscation is so simple (one asked why a hash or bloom filter was not
    used), and argue it mostly fingerprints normal developers doing unusual but legitimate
    work. One called it a "cool fingerprinting avenue."
  sources:
  - label: analysis
    url: https://thereallo.dev/blog/claude-code-prompt-steganography
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48734373
