- title: Godot bans AI-authored code contributions
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    Godot amended guidelines to require human authorship for contributions, limiting AI assistance
    to completion and regex tasks.
  summary: >-
    The Godot Foundation amended its contribution guidelines on 2026-06-30 to require that
    submitted code be human authored. AI assistance is limited to menial tasks such as code
    completion, regex, and find and replace, and any AI use in authoring code must be disclosed
    in the pull request discussion. Autonomous AI agents and fully AI-generated ("vibe coded")
    submissions are barred and already trigger an automatic ban from the GitHub repository,
    and AI-generated text in maintainer communication is not allowed. The Foundation cited
    rising AI-generated contribution volume against flat reviewer capacity, the loss of the
    mentorship value reviewers expect, and that AI cannot take responsibility for the code
    it produces. A separate change requires contributors with three or fewer merged pull requests
    to obtain maintainer approval before new features or significant refactors.
  why: >-
    A major open-source engine formalizing a human-authorship requirement sets a governance
    precedent for how large projects absorb the AI-contribution and maintainer-burden pressure
    also seen at curl, FFmpeg, and package registries.
  sources:
  - label: Godot policy
    url: https://godotengine.org/article/contribution-policy-2026/
  - label: PC Gamer
    url: https://www.pcgamer.com/gaming-industry/open-source-game-engine-godot-will-no-longer-accept-ai-authored-code-contributions-we-cant-trust-heavy-users-of-ai-to-understand-their-code-enough-to-fix-it/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48743472
- title: Box3D open-source 3D physics engine released
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    Erin Catto released Box3D v0.1.0, a 3D physics engine for games written in C17 with MIT
    license and no dependencies beyond the runtime.
  summary: >-
    Erin Catto, the author of Box2D, released Box3D v0.1.0 on 2026-06-30 under the MIT license.
    Box3D is a 3D physics engine for games written in C17 with a C API and no dependencies
    beyond the C runtime. It carries over the Box2D solver architecture with a sub-stepping
    solver, continuous collision detection, SIMD-accelerated contact solving, graph coloring
    for parallel island groups, and optional multithreading. It adds triangle-mesh and height-field
    collision, baked compound collision, double-precision coordinates for large worlds, and
    record and replay. Catto says the 2D and 3D data structures are largely indifferent to
    spatial dimension, so the two engines share much of their design.
  why: >-
    Box2D is a widely used 2D physics library, so a same-author 3D engine gives game and simulation
    developers an MIT-licensed, dependency-free option in a space dominated by heavier engines.
  sources:
  - label: announcement
    url: https://box2d.org/posts/2026/06/announcing-box3d/
  - label: GitHub release
    url: https://github.com/erincatto/box3d
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48745445
