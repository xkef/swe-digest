- title: Google Copybara resurfaces for monorepo-to-open-source syncing
  section: Hacker News
  category: Pulse
  status: discussion
  blurb: >-
    Google's Copybara automates syncing code from internal monorepos to public repositories
    with path remapping and commit metadata rewriting.
  summary: >-
    Google's Copybara, a tool for moving code between repositories with transformations, reached
    the Hacker News front page at 278 points and 54 comments. It syncs code from an internal
    monorepo out to public repositories, remapping paths, excluding files, and rewriting commit
    metadata in a single pass.
  why: >-
    Teams publishing open source from a monorepo face the same path-remapping and history-rewriting
    problem Copybara automates.
  comments: >-
    HN commenters describe Google's real-world use as one-way export from its Piper monorepo
    to GitHub, note that history preservation is implemented as cherry-picks with rewritten
    commits that embed the original hashes in commit trailers, and compare it to git subtree,
    Josh (used by Rust), and Meta's fbshipit.
  sources:
  - label: repository
    url: https://github.com/google/copybara
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48740698
