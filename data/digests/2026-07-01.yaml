- title: TabFM zero-shot foundation model for tabular data
  section: ML research
  category: ML research
  status: developing
  blurb: >-
    Google published TabFM, a zero-shot model for tabular classification and regression that
    predicts on unseen tables with no training.
  summary: >-
    Google published TabFM on 2026-06-30, a foundation model for tabular classification and
    regression that predicts on unseen tables in a single forward pass without task-specific
    training, tuning, or feature engineering. The architecture alternates row and column attention,
    compresses rows into dense vectors, and applies a transformer in-context-learning layer;
    it was trained on hundreds of millions of synthetic datasets from structural causal models.
    Google reports evaluation on TabArena (38 classification and 13 regression datasets) with
    base and ensemble configurations, and says weights and code are on Hugging Face and GitHub
    with BigQuery integration planned.
  why: >-
    Zero-shot tabular prediction targets the most common enterprise data shape, where gradient-boosted
    trees and manual feature work still dominate.
  followup: >-
    Watch for independent TabArena reproduction and comparisons against tuned gradient-boosting
    baselines.
  sources:
  - label: Google Research
    url: https://research.google/blog/introducing-tabfm-a-zero-shot-foundation-model-for-tabular-data/
