- title: Go 1.27.3 and 1.26.10 distrust a set of CA intermediates under CVE-2026-111943
  section: Top stories
  category: Security
  blurb: >-
    Go 1.27.3 and 1.26.10 make crypto/x509 reject chains through a small set of distrusted
    intermediates, a fix tracked as CVE-2026-111943.
  summary: >-
    The Go team blocked trust in a small set of intermediate certificates over security concerns
    about their operation. crypto/x509 Verify now filters out chains that contain them. The
    fix shipped as an URGENT track security release in go1.27.3 and go1.26.10, tagged on 2026-10-20,
    and the team recommends upgrading immediately.
  why: >-
    Go binaries verify TLS with crypto/x509 regardless of the system trust store, so services
    that talk to hosts behind these intermediates will fail verification after a rebuild.
  followup: >-
    An official statement naming the CA and the reason for the distrust, and matching actions
    by browser and OS root programs.
  comments: >-
    A commenter on the issue matched the hashes to eight eMudhra intermediates under emSign
    Root TLS CA G3 and emSign Root CS CA G3. Another reported that CCADB shows them revoked
    for cACompromise on 2026-10-18 and 2026-10-19. Neither claim comes from the Go team.
  sources:
  - label: primary
    url: https://github.com/golang/go/issues/82345
  - label: primary
    url: https://github.com/golang/go/releases/tag/go1.27.3
  - label: primary
    url: https://github.com/golang/go/releases/tag/go1.26.10
  - label: discussion
