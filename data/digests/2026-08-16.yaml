date: '2026-08-16'
stories:
- title: >-
    AmnesiaStealer clones a macOS Chromium profile into a headless browser the operator drives
    live
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Jamf reports malware cloning Chromium profiles into hidden browsers the attacker drives,
    stealing sessions appearing from the victim's host.
  summary: >-
    Jamf Threat Labs reports that the malware duplicates the victim's Chromium profile into
    a hidden headless browser on the infected host and drives it over the Chrome DevTools
    Protocol, so the attacker operates authenticated sessions while the browser, host, and
    network identifiers stay those of the victim. Jamf states profile duplication works across
    seven Chromium browsers including Chrome, Edge, Brave, Arc, Opera, Vivaldi, and Chromium,
    because they share the same DevTools Protocol, launch flags, and cookie encryption, and
    that on macOS 26, when the malware cannot recover the existing Chrome Safe Storage key,
    a fallback replaces it with an attacker-supplied value, leaving previously stored cookies
    and passwords permanently unreadable to the victim while the attacker can still decrypt
    them. Delivery is a ClickFix lure on a fake GitHub download page that asks the user to
    paste a terminal command, and the payload captures the macOS login password to reach keychain
    data. No software vulnerability or affected version range is involved, because delivery
    depends on the user pasting the command, and macOS 26 is named only as the condition for
    the Safe Storage fallback.
  why: >-
    Session-theft detection that keys on a new device, a new IP, or impossible travel does
    not fire on a session driven from the victim's own host.
  followup: >-
    Jamf dates the research 2026-08-13 and BleepingComputer reports it 2026-08-16, so watch
    for the vendor post itself and for confirmation of the macOS 26 Safe Storage fallback.
  sources:
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/new-amnesiastealer-macos-malware-hijacks-browser-sessions-via-remote-control/
  - label: Reddit discussion
    url: https://www.reddit.com/r/cybersecurity/comments/1vpztyz/new_amnesiastealer_macos_malware_hijacks_browser/
