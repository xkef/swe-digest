- title: >-
    A token-cost-matched study finds no self-inspection method beats repeated sampling in
    open models from 1.5B to 7B
  section: ML research
  category: Paper
  blurb: >-
    No self-critique method matched repeated sampling at equal token cost across 1.5B to 7B
    parameter open models on math benchmarks.
  summary: >-
    The preprint compares seven methods against repeated sampling at matched token cost, counting
    every critique, reflection, debate and checking token, across open models of 1.5B, 3B
    and 7B parameters on two mathematics benchmarks at 150 questions each. That design gives
    36 comparisons, each paired by question, and the paper reports that no method beats repeated
    sampling at equal cost, that ten of the 36 are reliably worse, all of them methods where
    the model inspects its own output, and that all 18 self-inspection comparisons are negative.
    The two kinds of self-inspection separate as models grow: the Best-of-N choosing gap falls
    from 8.0 and 11.3 points at 1.5B to 2.0 and 1.3 at 7B, which the paper describes as no
    longer distinguishable from zero, while Self-Refine and a forced Reflexion stay 3.6 to
    10.1 points below baseline at 7B.
  why: >-
    Self-critique and reflection loops are a common agent design pattern, and this measurement
    bounds them only for open models up to 7B, where the penalty for having the model choose
    among its own samples closes with scale but the penalty for having it rewrite its own
    output does not.
  followup: >-
    Single-author v1 preprint with no peer review. Track whether the result holds at larger
    model scale.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2607.28576v1
- title: >-
    Unit 42 reports XCSSET v40 spreading through the Xcode projects of legitimate apps since
    April 2026, with fileless persistence and suppression of macOS security updates
  section: Security
  category: Security
  blurb: >-
    XCSSET v40 spreading since April 2026 disables macOS security updates and adds fileless
    persistence through Chrome and Telegram trojans.
  summary: >-
    Unit 42 reports XCSSET v40 spreading through the Xcode projects of legitimate apps since
    April 2026, with infection triggered when a developer builds an infected project locally
    and the variant then worming into every Xcode project on the host. It disables the macOS
    SoftwareUpdate configuration channel covering XProtect, MRT, TCC, and Rapid Security Response,
    holds an exclusive file lock on the XProtect signature database, terminates CloudTelemetryService,
    and calls `tccutil reset AppleEvents` to re-prompt for automation while masquerading as
    System Settings or Xcode. A new Chrome module abuses the Chrome DevTools Protocol for
    a fileless reverse shell and MetaMask transaction rewriting, a further new module replaces
    Telegram.app with an ad hoc signed trojanized copy, and Unit 42 reported the Chrome behavior
    to Google, which protects against it on Windows and is extending the protection to macOS.
    The analysis enumerates no affected macOS or Xcode version numbers, so the version scope
    of an exposed build host is not stated.
  why: >-
    An infected build host stops receiving the signature updates that would detect the infection,
    so a developer machine that compiles one untrusted Xcode project loses both the detection
    and the update path at the same time.
  sources:
  - label: Unit 42 analysis
    url: https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49142886
- title: >-
    A scan of 7.6 petabytes of public Hugging Face datasets finds 221,303 live credentials,
    including 349 live GitHub personal access tokens
  section: Security
  category: Security
  blurb: >-
    A scan of 7.6 petabytes of public Hugging Face datasets found 221,303 live credentials
    including 349 GitHub personal access tokens.
  summary: >-
    Truffle Security scanned 7.6 petabytes of public Hugging Face datasets and reports 221,303
    live credentials, with 44 percent of them appearing in more than one dataset, 19,380 appearing
    in ten or more, and one Infura key pasted into a chatbot reaching 1,131 datasets and 10,162
    file locations. It reports 349 live GitHub personal access tokens, of which 223 carry
    full repository write, 130 can rewrite CI workflows, 112 carry admin:org, and 110 can
    publish packages, sub-counts that overlap. The rest of the supply-chain subset is 318
    Docker Hub push tokens and 787 live Hugging Face tokens of which 237 carry write and 70
    org-admin, against zero live tokens for npm and PyPI. Findings were shared with Hugging
    Face before publication, dataset names and key material are withheld, and the stated fix
    is rotation plus scanning a corpus before publishing or training on it. No affected versions
    apply, because the finding is a set of published dataset corpora rather than a versioned
    product.
  why: >-
    A credential published in a training corpus cannot be recalled, so revoking at the original
    source leaves every copied instance working and rotation is the only remedy.
  followup: >-
    The post carries a byline date that predates the incident and the conference booth its
    own text references, so no publication date is asserted here. Track whether the vendor
    corrects it.
  sources:
  - label: scan write-up
    url: https://trufflesecurity.com/blog/scanning-7-6-petabytes-of-ai-training-data-for-secrets
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49136955
- title: >-
    RFC 10015 makes finite-field Diffie-Hellman and RSA key exchange MUST NOT in TLS 1.2 and
    DTLS 1.2
  section: Security
  category: Security
  blurb: >-
    RFC 10015 published in July 2026 makes finite-field Diffie-Hellman and RSA key exchange
    disallowed in TLS 1.2 and DTLS 1.2.
  summary: >-
    RFC 10015, published in July 2026, sets finite-field Diffie-Hellman and RSA key exchange
    to MUST NOT in TLS 1.2 and DTLS 1.2. The document updates seventeen RFCs: 4162, 4279,
    4346, 4785, 5246, 5288, 5289, 5469, 5487, 5932, 6209, 6347, 6367, 6655, 7905, 8422 and
    9325. One of those, RFC 9325, is part of BCP 195 alongside RFC 8996, so the change reaches
    BCP 195 through that document rather than updating BCP 195 directly.
  why: >-
    TLS 1.2 cipher-suite allowlists that still carry DHE or RSA key exchange are now non-conformant
    and need review.
  sources:
  - label: RFC 10015
    url: https://www.rfc-editor.org/rfc/rfc10015.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49139711
- title: >-
    A USENIX Security paper shows the major end-to-end encrypted messengers give no transcript
    consistency in group chats
  section: Security
  category: Security
  blurb: >-
    A USENIX Security paper finds no major end-to-end encrypted messenger provides transcript
    consistency against malicious group members.
  summary: >-
    The USENIX Security paper analyzes group messaging in the major end-to-end encrypted messengers
    and reports that none of them provide transcript consistency. A malicious group member
    can omit, reorder, or alter content per recipient with no warning surfaced in any user
    interface. The abstract names Signal, WhatsApp, iMessage and Threema as messengers that
    have added poll features on top of group messaging, and does not enumerate the full set
    analyzed. No affected versions are given, because the finding is a design property of
    the group protocols and their fallback paths rather than a versioned defect in a client
    build.
  why: >-
    A malicious group member can omit, reorder, or alter content per recipient with no warning
    in any user interface, so a group transcript and the polls built on top of it cannot be
    treated as an agreed record.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2607.27510
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49139831
