- title: >-
    NetBSD 11.0 ships with three open security pull-ups the project chose to disclose rather
    than delay the release for
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    NetBSD 11.0 shipped with three open security issues the project disclosed rather than
    delay release, targeting fixes for 11.1.
  summary: >-
    NetBSD 11.0 was released on 2026-08-01 with three security pull-ups still open, and the
    project named them in the announcement instead of holding the release: a missing local
    privilege check on hdaudio(4) ioctl commands (PR 60492), a remotely triggerable null pointer
    dereference in ipfilter (PR 60484), and a use-after-free in pf fragment reassembly (PR
    60485). The announcement states that IPF and PF are not included in any released kernel
    by default, and that the fixes are targeted for 11.1 within two months. It also states
    the volume of security issues found or suspected has risen with AI tooling to the point
    that shipping with no open issues is no longer achievable.
  why: >-
    The hdaudio issue reaches default installs and the announcement gives a manual workaround
    of removing /dev/hdaudio*, while the ipfilter and pf issues need those subsystems built
    in, so upgrade exposure is one item for most installations.
  sources:
  - label: release announcement
    url: https://blog.netbsd.org/tnf/entry/netbsd_11_0_released
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49136736
- title: >-
    An Android developer consulted by the European Commission describes what the DMA interoperability
    action requires Alphabet to open, including DSP wake word detection
  section: Engineering posts
  category: Engineering post
  blurb: >-
    The European Commission ordered Alphabet to open 11 Android features to third parties
    by 2027, including DSP wake word detection.
  summary: >-
    The Open Home Foundation write-up, by the Home Assistant Android developer the European
    Commission consulted, states that the Commission acted on 2026-07-16 to require Alphabet
    to open eleven Android features to third parties, with deadlines given as Android 18 by
    2027-08-01 and concurrent hotword detection by Android 19 no later than 2028-08-01. The
    post documents the two-stage Android wake word architecture, in which a DSP stage runs
    always-on detection that third-party assistants cannot reach, and enumerates the platform
    capabilities that have been closed to them. The Commission's own DMA news index carries
    an item dated 2026-07-16 but titles it as guidance to Google for AI interoperability on
    Android, and the underlying document did not resolve from this environment, so this block
    does not assert which instrument was issued.
  why: >-
    The write-up documents the two-stage Android wake word architecture and the exact platform
    capabilities third-party assistants have been unable to reach, which is the concrete reason
    an always-on wake word costs roughly 15 percent battery in a third-party app against about
    1 percent for the built-in path.
  followup: >-
    Resolve from the Commission's own document whether the 2026-07-16 action is a binding
    specification decision or guidance.
  sources:
  - label: Open Home Foundation write-up
    url: https://www.openhomefoundation.org/blog/a-big-win-for-android-interoperability/
  - label: European Commission DMA site
    url: https://digital-markets-act.ec.europa.eu/index_en
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49124051
