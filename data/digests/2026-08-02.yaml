- title: >-
    A ripgrep segfault investigation localizes a Linux kernel TLB-shootdown race between the
    per-VMA-lock anonymous fault path and concurrent munmap
  section: Top stories
  category: Linux/Kernel
  blurb: >-
    A Linux kernel race in the v7.0 anonymous page fault path and munmap can silently lose
    stores from multithreaded processes.
  summary: >-
    dfoxfranke published a separate analysis repository for ripgrep issue 3494 that reattributes
    the crash from the allocator to the kernel. The write-up reports that a thread's own store
    to a freshly faulted anonymous page is visible to an immediate reload and gone about ten
    instructions later, with pagemap showing the address backed by the kernel zero page. The
    analysis is a source-level review of Linux 7.0.12 that names a v7.0 munmap-teardown change,
    and it rules out use-after-free and buffer overrun on four grounds after pinning suppression
    of the fault to prefaulting one specific page.
  why: >-
    If the analysis holds, any multithreaded process on the affected kernels can have a store
    to a freshly faulted anonymous page silently lost, so the failure surfaces as unexplained
    heap corruption in unrelated software rather than as a kernel error.
  followup: >-
    Track whether a kernel maintainer confirms or refutes the race and whether a fix lands.
  comments: HN commenters ask whether kernel maintainers have confirmed the diagnosis.
  sources:
  - label: analysis repository
    url: https://github.com/dfoxfranke/ripgrep-3494-analysis
  - label: ripgrep issue 3494
    url: https://github.com/BurntSushi/ripgrep/issues/3494
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49133889
- title: >-
    Lean publishes a postmortem for kernel soundness bug 14576 after an AI-assisted false
    disproof of Collatz passed both the official kernel and a then-week-old version of the
    main external checker
  section: Top stories
  category: Engineering post
  blurb: >-
    A Lean kernel soundness bug required two distinct bugs in Lean and the external checker
    nanoda for an AI-assisted false disproof to pass.
  summary: >-
    Leonardo de Moura published a first-party postmortem for Lean kernel soundness bug 14576.
    The post states the bug was reachable only through metaprogramming, that lean4lean is
    affected by it, and that the fix landed about an hour after the report. The Collatz repository
    also passed a week-old version of the external checker nanoda, and the postmortem states
    that the nanoda bug was reported by Jeremy Chen and fixed a week before the Lean bug was
    reported, so the false disproof required two distinct bugs in two implementations. The
    post also records that an OpenAI cybersecurity model run by Daniel Selsam found further
    kernel mistakes, all of them caught by nanoda.
  why: >-
    The postmortem concludes that checking with an independent kernel still works, so anyone
    treating a Lean certificate as verification needs current versions of both the kernel
    and the external checker rather than whichever build was to hand.
  sources:
  - label: postmortem
    url: https://leodemoura.github.io/blog/2026-8-1-postmortem-for-kernel-soundness-bug-14576/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49137060
- title: >-
    OpenAI publishes ten claimed advances in mathematics and theoretical computer science
    with Lean 4 certificates under Apache-2.0
  section: Top stories
  category: ML research
  blurb: >-
    OpenAI released ten formalizations in Lean 4 of mathematics and computer science results
    without peer review under Apache-2.0.
  summary: >-
    OpenAI published a repository of ten claimed results in mathematics and theoretical computer
    science, each accompanied by a Lean 4 formalization under Apache-2.0, targeting Lean 4.32.0
    with mathlib and containing ten named proof files including ConnesRigidity.lean. The results
    have not been through peer review. The repository routes independent checking through
    Comparator, and the postmortem above records as part of the response to kernel bug 14576
    that comparator.live now runs the external checker nanoda by default and that nanoda is
    tracked daily.
  why: >-
    The formalizations are machine-checkable artifacts rather than a benchmark score, which
    is a materially different evidence standard for an AI capability claim, though the postmortem
    above bounds a Lean certificate to current versions of both the kernel and the external
    checker.
  followup: >-
    A claimed rebuttal of the Connes rigidity result circulated on Hacker News but the hosting
    site returned HTTP 403 from this environment, so it is unverified and excluded. Recheck
    it.
  sources:
  - label: repository
    url: https://github.com/openai/ten-proofs
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49132058
- title: >-
    Wafer measures Kimi K3 at 952 tokens per second per node on eight MI355X after fixing
    a missing ROCm top-k renorm and an AITER prefill head-count mismatch
  section: AI
  category: AI
  blurb: >-
    Framework defects in Kimi K3's ROCm build left the speculative decoder and MLA prefill
    broken, fixed with small source-level changes.
  summary: >-
    Kimi K3 at 2.8T parameters needs over 1.5 TB of VRAM before a KV cache, which rules out
    a single B200 node and leaves the MI355X at 288 GB per GPU as the reason the comparison
    exists. Both blockers the post reports were framework defects rather than missing kernels:
    the sglang ROCm build leaves `top_k_renorm_prob` undefined so the speculative-decode verifier
    takes the scheduler down with a `NameError`, fixed with a sort, a masked fill, and a divide
    in PyTorch, and the fast AITER MLA prefill kernel would not load because K3 at TP8 gives
    12 attention heads per rank against a path built for 4, 8, or multiples of 16, fixed by
    zero-padding to 16 and extracting 12. The post reports the prefill fix moving a 172k-token
    cold prefill from the Triton fallback at 4,000 to 7,000 tokens per second to about 13,000,
    or roughly 51 seconds on MI355X against 23 on a B300. This is a vendor post from an inference
    provider, the throughput figures are unreproduced, and its performance-per-dollar claim
    of 48 against 33 tokens per second per dollar rests on its own stated rates of 2.50, 6.00,
    and 4.25 US dollars per GPU-hour.
  why: >-
    Both blockers to serving a 2.8T-parameter model on ROCm were framework defects with small
    source-level fixes, so the gap was tooling rather than hardware capability.
  followup: >-
    Track whether an independent run reproduces the 952 tokens per second per node figure
    on eight MI355X.
  sources:
  - label: write-up
    url: https://www.wafer.ai/blog/kimi-k3-mi355x
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49141073
