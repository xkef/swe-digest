- title: >-
    Neovim master adds HTTP status and headers to vim.net.request() response callbacks
  section: Developer tools
  category: Dev tools
  blurb: >-
    Neovim master now passes HTTP status and headers to vim.net.request() callbacks and reports
    4xx and 5xx responses as errors.
  summary: >-
    A commit on Neovim master adds status and headers fields to the vim.net.request() response,
    plus a vim.net.http_status table of codes, by having curl write the status and header
    JSON after the body. Responses with status 400 or above now set an error, and curl no
    longer runs with --fail. A follow-up fix on 2026-11-20 corrects response parsing when
    a body contains the split marker.
  why: >-
    Plugins that call vim.net.request() can now branch on status codes and read headers, and
    should expect HTTP errors to arrive through err.
