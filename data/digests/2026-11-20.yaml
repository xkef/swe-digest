  background: >-
    The 2026-07-28 MCP revision drops the initialize handshake and sessions, so every request
    carries the protocol version and client capabilities. That lets servers scale like ordinary
    stateless HTTP services. Spring AI is the Spring project's model and tool integration
    layer.
