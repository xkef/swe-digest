- title: >-
    Anthropic mathematician Levent Alpöge claims a Claude-assisted proof of the Riemann Hypothesis
  section: Hacker News
  category: Pulse
  blurb: >-
    A mathematician at Anthropic says he and Claude proved the Riemann Hypothesis and formalized
    it, and Hacker News weighs how to trust it.
  summary: >-
    Levent Alpöge, who works at Anthropic, wrote that working with Claude he discovered a
    proof of the Riemann Hypothesis, that the method extends to the Generalized Riemann Hypothesis,
    and that he and Claude formalized the arguments without assumptions. He wrote that Claude
    far outpaced him near the finish. The Hacker News thread reached about 1,487 points and
    1,019 comments within three hours.
  why: >-
    A formalized proof claim on a Millennium Prize problem is the strongest public test yet
    of frontier models doing research-grade mathematics.
  background: >-
    The Riemann Hypothesis states that every nontrivial zero of the Riemann zeta function
    has real part 1/2, and it is one of the Clay Millennium Prize problems. Many results in
    number theory are proved conditionally on it. A formalized proof is one checked by a proof
    assistant such as Lean, though reviewers must still confirm that the formal statement
    matches the intended theorem.
  comments: >-
    Commenters note that Alpöge worked with Tristan Buckmaster on the Euler and Navier-Stokes
    results that preceded OpenAI's Navier-Stokes paper, and rehash the authorship dispute
    from that episode. Others argue that credentials and a compiling Lean project are not
    enough until the formal statement is checked against the real conjecture.
  event: alpoge-riemann-hypothesis-proof-claim
