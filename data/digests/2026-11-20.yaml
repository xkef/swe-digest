- title: >-
    KDE's libghostty-based Kwi terminal ships v0.1 and becomes an official KDE application
  section: Developer tools
  category: Dev tools
  blurb: >-
    KDE's new Kwi terminal, built on the Ghostty library, ships v0.1 on Flathub and passes
    review to become an official KDE application.
  summary: >-
    Eike Hein released Kwi v0.1, a KDE terminal emulator built on the Ghostty library, in
    source form and as a Flatpak on Flathub. The release adds global menu support, tab improvements
    and theming work, and Kwi has passed the review to become an official KDE application.
