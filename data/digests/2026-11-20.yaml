- title: >-
    OpenSSL CVE-2026-121481, a buffer overflow in EVP_EncodeBlock, gets a public fix while
    its advisory is pending
  section: Top stories
  category: Security
  blurb: >-
    OpenSSL's base64 encoder writes past its buffer when the encoded size overflows an int,
    and maintainers are debating the fix in public.
  summary: >-
    Pull request 33652, opened on 2026-11-10 by Nicky Mouha, fixes CVE-2026-121481 in EVP_EncodeBlock
    for inputs whose encoded size does not fit in an int. The reporter says the OpenSSL security
    team asked for a public fix while the advisory is still pending. The PR is labeled for
    master and the 4.0 and 4.1 branches. The reporter shows openssl s_client can trigger it
    with a large -proxy_pass read from an environment variable. Maintainer Bob Beck called
    the reproducer synthetic, and after a debate over returning -1 or 0 the patch moved to
    OPENSSL_assert.
  why: >-
    Code on OpenSSL 4.0 or 4.1 that base64-encodes input of attacker-controlled size through
    EVP_EncodeBlock should cap the length until a fixed release ships.
  background: >-
    EVP_EncodeBlock takes an input pointer, an output pointer and an input length but no output
    length, so each caller must size the output buffer itself from the rule that every 3 input
    bytes become 4 output bytes, plus a NUL. The function computes and returns that length
    as a signed int, so very large inputs can overflow the arithmetic and the function then
    writes past the buffer the caller allocated. The reporter compares the pattern to CVE-2021-23840,
    an earlier OpenSSL integer overflow.
  followup: The OpenSSL security advisory and fixed 4.0 and 4.1 releases.
  comments: >-
    The Hacker News thread drew 208 points and 156 comments. Commenters blame an API that
    never receives the output buffer size. One says the flaw sits in code written for OpenSSL
    4.x, and others point to rustls and BoringSSL as alternatives.
  event: openssl-evp-encodeblock-cve-2026-121481
  sources:
  - label: primary
    url: https://github.com/openssl/openssl/pull/33652
  - label: discussion
    url: https://news.ycombinator.com/item?id=50569226
- title: >-
    NariQ quantizes Qwen3.8-27B to 2.5 and 3 bits per weight while matching BF16 on DeepSWE
    and Terminal Bench
  section: AI
  category: AI
  blurb: >-
    Calibrating trellis-coded quantization on the model's own agent session tokens keeps the
    long-horizon accuracy other low-bit quants lose.
  summary: >-
    The paper says existing quantizations of Qwen3.8-27B at or below 3 bits per weight match
    BF16 on short tasks such as AIME but solve at most 72% as many DeepSWE tasks. NariQ calibrates
    a trellis-coded post-training quantizer on tokens the BF16 model generated in agent sessions,
    and at 3.0 and 2.5 bits it stays level with BF16 on DeepSWE, Terminal Bench, AIME and
    RealWorldQA. The 2.0-bit checkpoint trails, and the GGUF files and an inference fork are
    released.
  why: >-
    Teams self-hosting coding agents can test whether a 27B model fits smaller GPUs without
    the agentic accuracy loss that perplexity-calibrated quants hide.
  background: >-
    Post-training quantization shrinks a trained model's weights to fewer bits without retraining,
    using a small calibration set to pick scales that minimize error. Most methods calibrate
    on short web text and report perplexity, which says little about a model that must keep
    calling tools correctly across 100K-token contexts. Trellis-coded quantization encodes
    groups of weights as paths through a state machine, which reaches lower error per bit
    than rounding each weight on its own.
  event: nariq-sub-3-bit-agentic-quantization
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.26157v1
- title: >-
    Hugging Face trains per-harness LoRA adapters that lift Qwen3.8-27B in pi from 39% to
    55% on Terminal-Bench 2.1
  section: AI
  category: AI
  blurb: >-
    Hugging Face trains one LoRA per agent harness on Qwen3.8-27B with async GRPO, lifting
    pi on Terminal-Bench 2.1 from 39% to 55%.
  summary: >-
    Hugging Face trained a LoRA adapter for Qwen3.8-27B inside each of pi, OpenCode and Hermes
    Agent with TRL's AsyncGRPOTrainer, using the harness as shipped and a proxy that records
    tokens between harness and vLLM. In pi, Terminal-Bench 2.1 pass@1 rose from 39% to 55%
    while average tokens per task fell from 2.9K to 1.5K, and the three adapters were also
    merged into one super adapter. The task set filters 1,127 Hub candidates with openenv
    validate and keeps 171 tasks the base model solves only sometimes.
  why: >-
    Teams self-hosting an open-weight coding model can RL-tune a cheap adapter for their own
    harness and task mix instead of switching models.
  background: >-
    GRPO scores each rollout against other rollouts of the same task, so tasks that always
    pass or always fail give no learning signal, which is why the pipeline filters by base
    model pass rate. A LoRA adapter trains small low-rank matrices on top of frozen weights,
    so it can be swapped per harness. Asynchronous GRPO keeps training while slow rollouts
    finish instead of waiting for the whole batch.
  event: hf-harness-adapters-qwen3-8-27b
  sources:
  - label: primary
    url: https://huggingface.co/blog/harness-adapters-at-scale
- title: >-
    Cognition runs each Devin macOS session in a fresh EC2 Mac VM with NBD snapshots and a
    user-space network gateway
  section: Agentic coding
  category: Engineering post
  blurb: >-
    Devin builds and tests iOS apps in its own macOS VMs, two per EC2 Mac host, freeing them
    when idle and resuming from snapshots in seconds.
  summary: >-
    Cognition starts a macOS VM per Devin session in under a minute on EC2 Mac Dedicated Hosts
    in six AWS Regions, two guests per host as the macOS license allows. The disks of idle
    sessions go to S3 through an NBD frontend on its snapshot service, and about 90% of sessions
    release their VM when idle. A per-VM user-space Ethernet gateway replaces Apple's NAT,
    which fought Cognition's own pf rules. Prepared images grant accessibility and screen
    recording permissions before first boot. Devin drives apps through the accessibility tree
    using Dioxus's accessibility-cli, and nearly 1,000 organizations used it within six weeks
    of the 2026-09-15 launch.
  why: >-
    It is a worked design for sandboxing agents that need Xcode and the iOS Simulator, covering
    macOS licensing limits, snapshot persistence and egress policy enforcement.
  background: >-
    Apple's Virtualization framework lets a Mac run macOS guests, but Apple's license allows
    at most two extra macOS copies per machine, so a cloud Mac fleet cannot pack many agents
    onto each host. EC2 Mac instances are physical Mac minis or Mac Studios on Dedicated Hosts
    with a 24-hour minimum allocation, so session lifetime has to be separated from host lifetime.
    An accessibility tree is the structure of roles, names and states that apps expose for
    assistive tools, which lets an agent click a named control without reading pixels.
  event: cognition-devin-macos-ec2-mac
  sources:
  - label: primary
    url: https://aws.amazon.com/blogs/architecture/ai-coding-agents-on-amazon-ec2-mac-how-cognition-scales-devin-for-macos/
- title: >-
    pi 1.6.0 makes GPT-6.2 Sol the default OpenAI model and makes extension render output
    readonly
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    pi 1.6.0 adds GPT-6.2 Astra and Sol, makes Sol the default OpenAI model, and makes extension
    render() output readonly and cached.
  summary: >-
    pi 1.6.0 adds GPT-6.2 Astra and GPT-6.2 Sol on the openai, azure and openai-codex providers
    and makes Sol their default, though both reject thinking level off. Extension components
    now get a readonly string array from render(), and Container returns a cached array, so
