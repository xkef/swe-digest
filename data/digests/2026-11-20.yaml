- title: >-
    Architect Labs says AI agents designed Frostbite, an interaction-net CPU reaching 4.59x
    the perf per watt of an in-order core
  section: Hacker News
  category: Pulse
  blurb: >-
    Architect Labs says agent swarms designed a CPU for interaction nets from ISA to GDS,
    reaching 4.59x the perf per watt of an in-order core.
  summary: >-
    Architect Labs says its agents iterated on the compiler, ISA, microarchitecture, RTL,
    verification and GDS of Frostbite, a tiled CPU that runs Vine programs compiled to interaction
    nets, with tiles stealing work from neighbors instead of using a central scheduler. On
    a 7 nm process, one quad reached a geometric mean of 4.59x the perf per watt of a dual-issue
    in-order core across 25 workloads, and 3.83x on the 15 held out from tuning. The thread
    drew 296 points and 201 comments on Hacker News.
  why: >-
    It is a detailed claim that formal specs plus agent swarms can explore hardware design
    end to end, though results are pre-silicon and against a small in-order baseline.
  background: >-
    Interaction nets represent a program as a graph where computation rewrites pairs of connected
    nodes, and because each node has one principal port, rewrites never overlap and can run
    in parallel in any order. Every value is used exactly once, so the hardware needs no shared
    mutable memory or cache coherence for it.
  event: frostbite-ai-designed-cpu
  sources:
  - label: primary
    url: https://architectlabs.com/blog/frostbite
  - label: discussion
