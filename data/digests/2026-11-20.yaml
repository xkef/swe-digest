- title: >-
    Zed restores OpenAI prompt caching after GPT-6.2 moved top-level instructions outside
    the cacheable prefix
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    From GPT-6.2 on, OpenAI places top-level instructions after input, so Zed now sends its
    system prompt as a leading developer message.
  summary: >-
    Zed's change 67245 says that starting with GPT-6.2, OpenAI's Responses API appends top-level
    instructions after input, outside the cacheable prefix. Zed now sends its reusable system
    prompt as a leading developer message, as Codex does, including when replaying a native
    compaction window. In a local build with GPT-6.2 Sol, 98.4% of input tokens were cached
    on the final request, and the fix shipped in Zed 1.29.3 and 1.30.2-pre.
  why: >-
    Any harness that passes its system prompt through the instructions field to GPT-6.2 or
    later loses prefix caching and pays full input price until it moves the prompt into the
    input.
  background: >-
    Prompt caching at OpenAI matches the longest identical prefix of a request against recent
    requests and bills cached tokens at a discount. Anything that varies early in the request,
    or a stable block placed after varying content, breaks the match. Agent harnesses rely
    on a stable system prompt and tool list at the start to keep long sessions cheap.
  event: gpt-6-2-instructions-cache-prefix-change
  sources:
  - label: primary
    url: https://github.com/zed-industries/zed/releases/tag/collab-staging
  - label: primary
    url: https://github.com/zed-industries/zed/releases/tag/v1.29.3
- title: >-
    Paper: RLVR with a fixed rollout cap teaches reasoning models to stop gaining from extra
    test-time tokens
  section: ML research
  category: Paper
  blurb: >-
    Models trained with a rollout cap beat their base near that budget but fall below it when
    given more tokens, across three small open models.
  summary: >-
    The authors find that RLVR-trained Qwen3.5-4B, Gemma4-E2B and Nemotron-3-Nano-4B use few
    tokens beyond the training budget and lose to their base models at larger budgets, and
    the effect carries from math training to science and coding. Stronger KL regularization
    keeps more scaling but cuts in-budget accuracy, and forcing an answer on truncated rollouts
    removes the effect along with most of the gain. SFT on artificially truncated traces reproduces
    it, which ties it to length-censored post-training rather than to RL.
  why: >-
    Teams setting rollout caps for RL post-training should evaluate at larger inference budgets,
    because the cap can trade away test-time scaling.
  background: >-
    RL with verifiable rewards trains a model on tasks whose answers a program can check,
    such as math or code, and each sampled rollout is cut off at a token limit to bound training
    cost. Test-time scaling is the usual pattern where letting a reasoning model think longer
    at inference raises accuracy. KL regularization penalizes the trained policy for drifting
    from a reference model.
  event: budget-internalization-rlvr-rollout-cap
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.26172v1
- title: >-
    Paper: post-training changes how models read out what they represent, not what probes
    can decode
  section: ML research
  category: Paper
  blurb: >-
    Probes on six open-weight models separate classes their answers miss, and the shift in
    readout arises during supervised fine-tuning.
  summary: >-
    In six open-weight base models and their post-trained versions, linear probes separated
    human from AI-written German texts while the models' answers often ordered them inversely,
    and post-training lowered answer sensitivity by 0.34 d' on average. In two models with
    stage checkpoints the change occurred during SFT. On negated statements post-training
    instead repaired the readout, and adding 2,000 labeled examples to fine-tuning data set
    the direction of the judgment.
  why: >-
    Evaluations that read only model answers can miss information a model holds, and small
    fine-tuning sets can redirect how it is read out.
  event: post-training-readout-paper
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.26584v1
- title: >-
    OpenAI's MedChemBench finds GPT models rebuild molecules well but struggle to select compounds
    and predict properties
  section: ML research
  category: AI
  blurb: >-
    OpenAI's 99-problem medicinal chemistry benchmark finds GPT models rebuild molecules well
    but earn about half credit on picking compounds.
  summary: >-
    MedChemBench has 99 problems drawn from 117 papers and patents covering 761 molecular
    structures, and it grades structure reconstruction, scientific explanation, compound ranking
    and numerical property prediction. GPT-6.2 Astra earned 84.5% of available credit at xhigh
    effort, and GPT-6 Astra earned 95.4% on structures but about half on selection and prediction.
    OpenAI says the benchmark cannot rule out exposure to the published sources and used single
    attempts without tools.
  why: >-
    Drug discovery teams evaluating LLMs get a component-level benchmark that separates reading
    chemical structures from making medicinal chemistry decisions.
  background: >-
    Medicinal chemists run design, make, test cycles in which improving potency against a
    target can worsen absorption or metabolic stability. Earlier chemistry benchmarks mostly
    tested isolated property prediction or reaction knowledge. MedChemBench instead hands
    the model a research program's state at a point in time and grades its next decisions
    against withheld results.
  event: openai-medchembench
  sources:
  - label: primary
    url: https://openai.com/index/introducing-medchembench
- title: >-
    Paper: an open 27B model rewrites its own weights without gradients and gains 6.6 points
    on unseen problems
  section: ML research
  category: Paper
  blurb: >-
    An open 27B model edits its own weights from its graded answers, with no gradients, and
    gains 6.6 points on unseen problems, a paper claims.
  summary: >-
    The authors give an open 27B model its weights, its graded answers and the ability to
    run itself, and report that it diagnoses failures and edits its weights using only forward
    passes. They report accuracy rising over eight consecutive sessions, repair of a damaged
    copy to over 80% of original accuracy on unseen image tasks, and that smaller models in
    the same family make no edit or break themselves.
  why: >-
    If it replicates, weight edits proposed by the model itself become a third adaptation
    path next to fine-tuning and test-time compute.
  comments: The paper drew 275 points and 93 comments on Hacker News.
  event: llm-self-rewriting-weights-paper
  sources:
