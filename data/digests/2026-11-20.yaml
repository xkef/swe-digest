  - label: primary
    url: https://duckdb.org/2026/11/20/announcing-duckdb-201.html
- title: >-
    GKE ambient networking reaches GA, replacing sidecar proxies with a per-node Envoy for
    mTLS and L4 policy
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Google moves service mesh mTLS, authorization and telemetry on GKE into managed per-node
    proxies, claiming up to 10x less L4 overhead.
  summary: >-
    Ambient networking for GKE is generally available. An NRI plugin redirects traffic from
    ambient pods to a shared per-node Envoy that enforces mTLS, authorization policies and
    load balancing, configured by Traffic Director with certificates from Certificate Authority
    Service. Google claims up to 10x lower resource use for L4 mesh features and no pod restarts
    for proxy CVE patches.
  why: >-
    GKE teams can get mesh mTLS and service metrics without injecting sidecars or restarting
    workloads to patch proxies.
  background: >-
    A sidecar mesh such as classic Istio injects an Envoy container into every pod, which
    costs memory and forces restarts on proxy upgrades. Ambient designs move L4 duties to
    a per-node proxy and add L7 proxies only where needed. Istio introduced the ambient model,
    and GKE now offers a managed version.
  event: gke-ambient-networking-ga
