- title: JEP 547 Lazy Constants is targeted to JDK 28 as a fourth preview
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Lazy Constants, the JDK API for values initialized once on demand and then treated as
    constants, enters a fourth preview in JDK 28.
  summary: OpenJDK has targeted JEP 547, Lazy Constants (Fourth Preview), to JDK 28.
  why: >-
    Java teams that defer expensive static initialization still need --enable-preview for
    this API and should expect further changes before it is final.
  background: >-
    Lazy constants hold a value that is computed at most once, on first use, after which the
    JIT can treat it like a final field and constant-fold it. They target the gap between
    eager static final fields, which slow startup, and hand-written lazy holders or double-checked
    locking, which the JVM cannot optimize as constants. The API began life under the name
    Stable Values.
  event: jep-547-lazy-constants-jdk-28
  sources:
  - label: primary
    url: https://inside.java/2026/11/20/jep547-target-jdk28/
- title: >-
    DuckDB 2.0.1 LTS tightens SECRET scopes, restores UPDATE FROM semantics and avoids a kernel
    MADV_FREE bug
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    DuckDB 2.0.1 tightens SECRET scope matching, restores per-match UPDATE FROM semantics
    and avoids a kernel MADV_FREE data loss bug.
  summary: >-
    DuckDB 2.0.1 makes host and bucket SECRET scopes match only exact names or a following
    slash, and restores 1.x behavior where UPDATE FROM and MERGE apply every matching source
    row. Its bundled jemalloc no longer frees memory with MADV_FREE, avoiding silent zeroing
    on kernels affected by CVE-2026-97945, and it blocks CREATE SECRET when enable_external_access
    is false. Extension repositories can now be registered by host through a .well-known file,
    and DuckDB 1.4 LTS reached end of life on 2026-11-17.
  why: >-
    Users upgrading must check prefix-style SECRET scopes and nondeterministic UPDATE FROM
    or MERGE joins, and can set muzzy_decay_ms:0 if they cannot upgrade yet.
  event: duckdb-2-0-1-lts-release
  sources:
  - label: primary
    url: https://duckdb.org/2026/11/20/announcing-duckdb-201.html
- title: >-
    Argo CD self-heal can skip Sync hook migrations when a deny sync window closes, a CNCF
    ambassador shows
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Two of five regional Argo CD apps skipped a Sync hook migration when a deny window closed,
    because self-heal ran a partial sync instead.
  summary: >-
    Afzal Ansari reproduced the failure in five of six lab runs: when a level-1 refresh reaches
    the controller first after a window closes, it compares the recorded revision against
    itself, decides the app already synced, and self-heal runs a partial sync that skips all
    hooks and writes no history. He recommends making the migration a managed Job with sync-wave
    -1 and a per-release name, or turning off selfHeal on apps that run migrations so the
    timer-driven refresh runs a full sync.
  why: >-
    Teams that run schema migrations as Argo CD hooks behind sync windows can ship new code
    against an old schema while the UI shows Synced and Healthy.
  background: >-
    Argo CD sync windows block or allow automated syncs on a schedule, and resource hooks
    are Jobs annotated to run at phases such as PreSync or Sync. Self-heal re-applies only
    the resources that drifted from Git, and these partial syncs do not run hooks. Sync waves
    order ordinary managed resources, so a Job placed in an earlier wave must be healthy before
    later waves apply.
  event: argo-cd-sync-window-self-heal-hook-skip
  sources:
  - label: primary
    url: https://www.cncf.io/blog/2026/11/20/when-a-sync-window-closes-how-argo-cd-self-heal-skipped-the-migration-hook/
- title: >-
    Rust Glancer's author builds Ajika, a Salsa-style incremental engine that keeps query
    memos on disk
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Rust Glancer's author builds Ajika, a Salsa-style incremental query engine that keeps
    memos on disk and loads them only when queried.
  summary: >-
    The post walks through how Salsa memoizes queries with revisions, dependency tracking
    and early cutoff when a recomputed dependency returns the same value. Because Salsa keeps
    memos in memory, Rust Glancer, a low-memory Rust language server, built Ajika on stable
    Rust to store query data on the filesystem, load it only while a query runs, and reload
    it after a restart.
  why: >-
    Builders of language servers and build tools get a worked comparison of in-memory and
    on-disk incremental computation, with Salsa, rustc, turbo-tasks and DICE as reference
    points.
  background: >-
    rust-analyzer is built on Salsa, which records which inputs and queries each query read
    so that an edit only recomputes the affected parts. The red-green approach marks a memo
    valid again when its dependencies recompute to equal values, so expensive downstream queries
    can be skipped.
  event: ajika-persistent-incremental-rust
  sources:
  - label: primary
    url: https://rust-glancer.github.io/blog/persistent-incrementality-in-rust/
- title: >-
    OpenAI's Ahmed Ibrahim: Codex code mode exposes MCP tools as async functions in a V8-sandboxed
    JavaScript REPL
  section: Talks
  category: Video
  blurb: >-
    Instead of one tool call per model turn, Codex agents write scripts that chain tools,
    keep state across turns and read only what they need.
  summary: >-
    Ibrahim, who works on the Codex harness, says code mode gives the agent two tools, exec
    to run a JavaScript script and wait to check its progress. All built-in and MCP tools
    are deferred into a tools object, so the agent filters the list by description and calls
    tools as async functions, chaining results through variables in one call. Scripts run
    in a V8 sandbox with no file, network or console access, get a cell ID, and survive between
    turns so a started server keeps running.
  why: >-
    Harness builders can cut inference round trips and context use by letting agents script
    tool calls instead of reading every intermediate result.
  event: openai-codex-code-mode-repl-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=2H5QbeHalKo
- title: >-
    Gemini 4 Neon tops the Models Engineering Index at 68.1, and Hacker News users compare
    it with Fable 5.2 in daily use
  section: Hacker News
  category: Pulse
  blurb: >-
    A composite of ten coding benchmarks puts Neon ahead of Fable 5.2 at about a quarter of
    its relative cost, drawing 213 Hacker News comments.
  summary: >-
    The index scores Gemini 4 Neon at 68.1, Fable 5.2 at 66.3 and GPT-6.2 Astra at 62.0, with
    Neon's relative cost at 1.6x against Fable's 5.9x. Its authors warn that models are tested
    on different benchmark subsets, there are no error bars, and results are reproduced as
    published. The thread drew 340 points and 213 comments.
  why: >-
    It is an early practitioner read on whether Neon can replace Claude models in coding agents,
    with caveats on the index method.
  comments: >-
    Several users say Neon codes about as well as Opus 5.5 and writes clearer prose, and one
    reports it trimmed an agents.md file. Others report that the Antigravity harness auto
    mode still stops for many approvals, and debate whether Google's subscriptions match Claude's
    usage limits outside Antigravity.
