- title: Git 2.55.0 released
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    Git 2.55.0 implemented a Linux fsmonitor daemon for faster status checks and disabled
    remote terminal control sequences by default.
  summary: >-
    Git 2.55.0 was tagged 2026-06-29. The fsmonitor daemon is now implemented for Linux, configuration-defined
    hook scripts can run in parallel, and two new builtins were added: `git format-rev` for
    pretty-formatting one revision per line and `git url-parse` exposing the internal URL
    parser. `git checkout -m` now creates a stash so local changes that conflict can be re-resolved,
    `git rev-list` and the `git log` family gained `--max-count-oldest`, and `git push` learned
    to target a named remote group to push to multiple remotes at once. Terminal control sequences
    arriving over the sideband from a remote are now mostly disabled by default, with ANSI
    color escapes the exception.
  why: >-
    A Linux fsmonitor daemon speeds status and diff on large working trees on the most common
    server and CI platform, and disabling sideband terminal control sequences by default closes
    a class of terminal-injection surface in remote operations.
  sources:
  - label: tag
    url: https://github.com/git/git/releases/tag/v2.55.0
  - label: release notes
    url: https://raw.githubusercontent.com/git/git/v2.55.0/Documentation/RelNotes/2.55.0.adoc
- title: ZLUDA 6 runs unmodified CUDA on AMD GPUs
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    ZLUDA Version 6 added pre-alpha PhysX support and texture functionality to run unmodified
    CUDA applications on AMD GPUs through ROCm.
  summary: >-
    ZLUDA, the compatibility layer that runs unmodified CUDA applications on AMD GPUs through
    ROCm, published Version 6 on 2026-06-29 (equivalent to preview build 6-preview.79). The
    release adds pre-alpha 32-bit PhysX support so older games using PhysX effects run on
    AMD hardware, basic texture support that makes Blender functional, and incremental machine-learning
    improvements through new GPU instructions, compiler bug fixes, and cuBLAS and cuDNN work
    for PyTorch workloads. The Windows loader now auto-loads performance libraries and prints
    explicit installation instructions when they are missing. The author lists limitations:
    PhysX fluid simulation remains glitchy and requires source compilation, texture support
    is minimal, and Windows users must still source ROCm dependencies from the outdated official
    SDK or buggy nightly builds.
  why: >-
    A maintained path to run CUDA binaries on non-NVIDIA GPUs lowers vendor lock-in for compute
    and games, part of the broader pressure to break the CUDA moat alongside non-NVIDIA training
    efforts.
  comments: >-
    HN commenters noted the project previously took AMD funding before a change of direction,
    asked how it compares to Vulkan backends for LLM inference, and observed that several
    Version 6 features had earlier been declared out of scope.
  sources:
  - label: ZLUDA release notes
    url: https://vosen.github.io/ZLUDA/blog/zluda-update-q1q2-2026/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48730713
