- title: Anthropic releases Claude Sonnet 5
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Anthropic released Claude Sonnet 5 same-day with introductory pricing through August,
    improving coding and agentic capabilities over Sonnet 4.6.
  summary: >-
    Anthropic released Claude Sonnet 5 on 2026-06-30, generally available the same day across
    Free, Pro, Max, Team, Enterprise, Claude Code, and the Claude Platform API under the model
    id `claude-sonnet-5`. Anthropic describes it as its most agentic Sonnet model, with gains
    over Sonnet 4.6 in reasoning, tool use, coding, and computer use; the announcement shows
    cost-performance curves on BrowseComp (agentic search) approaching Opus 4.8 at lower price
    points and improved cost efficiency on OSWorld-Verified (computer use). Introductory API
    pricing is 2 USD per million input tokens and 10 USD per million output tokens through
    2026-08-31, then 3 USD and 15 USD. The announcement does not state a context window, and
    the benchmark figures are the vendor's own.
  why: >-
    Sonnet is the default tier for many coding-agent and API workloads, so a same-day GA upgrade
    with lower introductory pricing directly changes the cost-performance baseline engineers
    build against.
  followup: >-
    Watch for independent agentic-coding and computer-use benchmarks of Sonnet 5 against Opus
    4.8 and GPT-5.5.
  comments: >-
    HN commenters noted that at the highest effort setting Sonnet 5 approaches Opus 4.8 cost
    while scoring slightly lower, asked when a refreshed Haiku will follow the year-old 4.5,
    and repeated frustration that Fable 5 remains unavailable while Anthropic ships new products.
