- title: Proposed .self top-level domain targets self-hosting
  section: Top stories
  category: Infrastructure
  status: discussion
  blurb: >-
    HCCF proposed .self top-level domain offering one free domain per verified person for
    self-hosting with simplified DNS and shared infrastructure.
  summary: >-
    The Human-Centered Computing Foundation published a proposal dated 2026-06-21 for a `.self`
    top-level domain aimed at self-hosting: one free domain per verified person, no squatting,
    parking, or reselling, with shared mail servers, TLS certificates, and simplified DNS
    configuration for homelab operators. It is an ICANN new-gTLD application that qualified
    for the Applicant Support Program, not a delegated TLD.
  why: >-
    It reframes the recurring friction of self-hosting (domains, certificates, mail deliverability)
    as a registry-level problem, though the proposal is early and unproven.
