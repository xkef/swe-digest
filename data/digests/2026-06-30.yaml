- title: Fil-C documents memory-safe context switching
  section: Languages and runtimes
  category: Languages
  status: developing
  blurb: >-
    Fil-C documented memory-safe setjmp/longjmp and ucontext implementations with jump validation
    and garbage-collection integration.
  summary: >-
    Fil-C, the memory-safe C and C++ compiler, published documentation for memory-safe implementations
    of the `setjmp`/`longjmp` and `ucontext` (`getcontext`, `setcontext`, `makecontext`, `swapcontext`)
    context-switching APIs. The `setjmp` path stores an opaque jump buffer unreachable from
    user code, requires direct `setjmp` calls so the compiler cannot optimize away the safety
    guarantees, validates that each `longjmp` targets a live descendant stack frame, and preserves
    garbage-collection roots; misuse that would otherwise produce a torn machine state triggers
    a runtime panic rather than memory corruption. The `ucontext` path uses opaque fiber-context
    objects with internally allocated stacks, enforces thread affinity so a context cannot
    migrate between threads, and integrates with the collector through fiber tracking. The
    documentation states `ucontext` support is new since release 0.680, requires building
    from source, and is not yet thoroughly tested, while `setjmp`/`longjmp` is described as
    more solid.
  why: >-
    Context-switching APIs are a recurring memory-safety escape hatch in C, and constraining
    them to fail closed extends Fil-C's guarantees to coroutine and fiber code that previously
    relied on raw register and stack manipulation.
  sources:
  - label: Fil-C documentation
    url: https://fil-c.org/context_switches
  - label: discussion
    url: https://news.ycombinator.com/item?id=48727177
- title: Reverse-engineered account of the Apple Neural Engine
  section: Apple platforms
  category: Apple
  status: developing
  blurb: >-
    Spencer Bryngelson reverse-engineered the Apple Neural Engine, documenting the fixed-function
    matrix accelerator across A11-A18 and M1-M5.
  summary: >-
    Spencer H. Bryngelson published a guide dated 2026-06-21 documenting the Apple Neural
    Engine (ANE), the fixed-function matrix accelerator shipped in Apple systems-on-chip since
    the A11 and M1 generations and normally reachable only through Core ML. Based on direct
    measurement on M1 and M5 silicon plus static analysis of the private runtime, compiler,
    kernel driver, and firmware, it documents the datapath and roofline, the dispatch route
    beneath Core ML, the on-disk program format, the weight-compression scheme, and the command
    protocol, covering A11 through A18 and M1 through M5 with per-chip target tables. The
    author labels each claim as measured, decompile-derived, or predicted, and notes the direct
    user-space route is undocumented, unsupported, and version-fragile.
  why: >-
    It is the most detailed public map of an otherwise closed accelerator, useful for on-device
    ML measurement and research on Apple Silicon, though it is a single-author reverse-engineered
    account rather than vendor documentation.
  sources:
  - label: arXiv 2606.22283
    url: https://arxiv.org/abs/2606.22283
  - label: discussion
    url: https://news.ycombinator.com/item?id=48702825
- title: Tracing a CUDA kernel from nvcc to GPU hardware
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Fergus Finn traced a CUDA kernel from nvcc to GPU across every layer, reverse-engineering
    closed-source libraries to expose hardware behavior.
  summary: >-
    Fergus Finn traced a vector-addition CUDA kernel on an RTX 4090 across every layer: nvcc
    producing PTX and SASS, the host-side launch stub, driver communication through ioctls
    and memory-mapped doorbells, command submission via pushbuffers and QMD structures, warp
    scheduling with compiler-inserted control codes, memory coalescing and L2 caching, and
    the result copy back to the CPU. He reverse-engineers closed-source libcuda using LD_PRELOAD
    interposition and custom kernels that read device memory.
  why: >-
    It is a concrete, artifact-backed map from the CUDA API down to GPU hardware behavior,
    useful for anyone profiling or optimizing GPU code.
  sources:
  - label: author write-up
    url: https://fergusfinn.com/blog/what-happens-when-you-run-a-gpu-kernel/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48718863
- title: WATaBoy reports JIT-to-WebAssembly beating a native interpreter
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Seth Humphries described WATaBoy, a Game Boy emulator JIT-compiling to WebAssembly bytecode,
