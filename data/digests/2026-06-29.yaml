- title: Paper argues AI-agent risk should be measured at the repository level
  section: ML research
  category: Paper
  blurb: >-
    A preprint argues that evaluating coding agents one at a time misses ecosystem harm when
    many agents commit to shared repositories concurrently.
  summary: >-
    A preprint posted 2026-06-26, "Govern the Repository, Not the Agent," argues that evaluating
    autonomous coding agents one at a time on isolated benchmark tasks misses ecosystem-level
    harm: agents that each pass their own tests still leave repositories accumulating problems
    no single contribution accounts for. The authors study "integration friction," the cost
    of merging a contribution into a codebase that other contributors are concurrently changing,
    as a repository-level metric.
  why: >-
    It reframes agent evaluation from per-task pass rates toward the integration and maintenance
    cost that shows up when many agents commit to a shared repository.
  followup: Watch for released measurement code or datasets and independent reproduction.
  sources:
  - label: arXiv 2606.28235
    url: https://arxiv.org/abs/2606.28235v1
- title: >-
    ToolPrivacyBench audits whether tool-using agents leak private data to the wrong tools
  section: ML research
  category: Paper
  blurb: >-
    2,150-case benchmark found tool-using agents completed tasks while inappropriately disclosing
    private data through intermediate tool calls.
  summary: >-
    A preprint posted 2026-06-26 introduces ToolPrivacyBench, a 2,150-case benchmark (1,150
    synthetic privacy-sensitive business workflows plus 1,000 cases adapted from existing
    multi-tool and function-calling benchmarks) that audits an agent's full execution trajectory
    rather than its final answer. After an agent runs against mock backends, an evaluator
    compares recorded tool arguments and backend audit logs against a per-case policy to check
    whether private data reached only authorized tools. Across nine agents the authors report
    that successful task completion does not imply appropriate disclosure: agents finish tasks
    while passing unnecessary private information through intermediate tool calls.
  why: >-
    It formalizes a need-to-know disclosure boundary for tool-using agents, the same data-leak
    surface raised by the Codex file-exclusion gap in Top stories.
  followup: Watch for the dataset or evaluator release and independent reproduction.
  sources:
  - label: arXiv 2606.28061
    url: https://arxiv.org/abs/2606.28061v1
- title: '"Tokenmaxxing" framed as returning on compounding-correctness economics'
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    An opinion post argues that early agent tokenmaxxing is replaced by compounding correctness,
    where more tokens tend to yield better outcomes.
  summary: >-
    A 2026-06-27 post argues that early "tokenmaxxing," pushing heavy token spend to drive
    AI-tool adoption, is being replaced by an economic case the author calls "compounding
    correctness," where spending more tokens on a task tends to yield better outcomes rather
    than accumulating errors. The claim is an opinion piece with no measured setup or benchmark.
  why: >-
    It captures the practitioner argument behind rising per-task token budgets in agent harnesses,
    relevant to coding-agent cost models.
  sources:
