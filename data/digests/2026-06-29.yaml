- title: GLM 5.2 benchmark thread, methodology skepticism
  section: Hacker News
  category: Pulse
  blurb: >-
    Hacker News commenters scrutinized the GLM 5.2 benchmark, arguing it pits a bare prompt
    against Semgrep's scaffolded multi-agent pipeline.
  summary: >-
    Cross-reference to the GLM 5.2 cyber-benchmark story in Top stories. The HN thread's signal
    is methodological: commenters argue the comparison pits a single bare prompt against Semgrep's
    scaffolded pipeline, that the headline omits the exact Claude model, and that IDOR is
    among the easiest bug classes to detect.
  why: >-
    The discussion is a caution against reading single-task vendor benchmarks as capability
    rankings.
