date: '2026-06-29'
stories:
- title: GLM 5.2 tops Semgrep's IDOR cyber benchmark, beating bare Claude Code
  section: Top stories
  category: AI
  blurb: >-
    Open-weight GLM 5.2 scored 39 percent F1 on IDOR detection versus Claude Code's 32 percent,
    at 0.17 USD per vulnerability found.
  summary: >-
    Semgrep published an IDOR (insecure direct object reference) detection benchmark on 2026-06-22
    in which the open-weight GLM 5.2 from Zhipu, run with no scaffolding, scored 39 percent
    F1 against Claude Code at 32 percent, at roughly 0.17 USD per vulnerability found. Semgrep's
    own multi-agent pipeline still led the table, 61 percent F1 with GPT-5.5 and 53 percent
    with Opus 4.8, both using specialized endpoint-discovery scaffolding. The post repeatedly
    flags the limits: one task, one dataset, one run, on a non-deterministic detection problem.
  why: >-
    An open-weight model matching a frontier coding model on a security task at roughly one-sixth
    the cost continues the migration pressure GLM 5.2 and Kimi K2.7-Code put on proprietary
    agents.
  followup: >-
    Watch for a reproduced or expanded benchmark across more vulnerability classes and harnesses.
  comments: >-
    HN commenters were skeptical, noting the headline hides which Claude model is compared
    and that a single "find IDOR" prompt is pitted against a full multi-agent system; several
    called IDOR the easiest vulnerability class and read the post as marketing. Others said
    the same subagent scaffolding Semgrep sells is now reproducible inside Claude Code, Codex,
    or OpenCode.
  sources:
  - label: Semgrep blog
    url: https://semgrep.dev/blog/2026/we-have-mythos-at-home-glm-52-beats-claude-in-our-cyber-benchmarks/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48709670
- title: OpenAI Codex still lacks a way to exclude sensitive files from the model
  section: Top stories
  category: Agentic coding
  blurb: >-
    Codex lacks a .codexignore mechanism to exclude secrets and credentials from being read
    and sent to the model, open since 2025-08-28.
  summary: >-
    A feature request open since 2025-08-28 asks OpenAI Codex for a deterministic ignore mechanism,
    a proposed `.codexignore` at repository and global scope, so files such as `.env`, `*.pem`,
    and SSH or cloud credentials are never read or sent to the model while the rest of the
    tree stays searchable. The issue reached the front page (192 points) because the gap persists
    in the Rust rewrite (codex-rs); a related earlier request (#205) was closed in favor of
    that rewrite without the feature landing.
  why: >-
    Without a path-based exclusion boundary, a coding agent can read secrets into its context
    and transmit them to the provider, a data-exfiltration risk for any team running Codex
    over a repository that holds credentials.
  followup: >-
    Watch for a `.codexignore` or equivalent exclusion mechanism landing in codex-rs.
  sources:
  - label: GitHub issue openai/codex#2847
    url: https://github.com/openai/codex/issues/2847
  - label: discussion
    url: https://news.ycombinator.com/item?id=48706714
- title: Developer uses Claude Code to get a second opinion on an MRI report
  section: Top stories
  category: Agentic coding
  blurb: >-
    A developer used Claude Code to cross-reference an MRI report against clinical guidelines
    to question a treatment recommendation.
  summary: >-
    A developer described pointing Claude Code at their own shoulder MRI report and clinical
    history, using the agent to cross-reference findings against published clinical practice
    guidelines and question a recommended treatment. The post is a personal workflow account,
    not a study, and works from the text report rather than the raw image data.
  why: >-
    It shows practitioners using coding agents as general document-reasoning tools outside
    software, and the failure modes that follow when output is unverified.
  comments: >-
    A self-identified radiologist cautioned that a full 3D MRI dataset is needed to weigh
    in and noted current frontier models are unreliable on medical imaging itself; others
    warned of a coming pattern of patients second-guessing clinicians with AI, the successor
    to symptom-Googling. Usernames are not verified identities.
  sources:
  - label: author write-up
    url: https://antoine.fi/mri-analysis-using-claude-code-opus
  - label: discussion
    url: https://news.ycombinator.com/item?id=48708941
- title: >-
    Librepods reaches the front page with AirPods reverse-engineered for non-Apple devices
  section: Top stories
  category: Dev tools
  blurb: >-
    Librepods, a GPL-3.0 project, reverse-engineered AirPods control features to expose battery,
    noise control, and gestures on Android and Linux.
  summary: >-
    Librepods (librepods-org/librepods, GPL-3.0, about 28,000 stars) reimplements AirPods
    control features on non-Apple platforms, exposing battery status, noise-control modes,
    ear detection, and gestures on Android and Linux through the proprietary Bluetooth protocol.
    The project re-surfaced on the front page after prior discussion.
  why: >-
    It is a worked example of reverse-engineering a closed accessory protocol to restore interoperability,
    the recurring right-to-repair and protocol-liberation theme.
  comments: >-
    Commenters asked which features are lost when AirPods pair with non-Apple hardware and
    debated whether the audio quality justifies the Apple-ecosystem lock-in the project works
    around.
  sources:
