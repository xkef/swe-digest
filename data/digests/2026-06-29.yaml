- title: Reverse-engineering Apple's Sparse Image Format (ASIF)
  section: Apple platforms
  category: Apple
  blurb: >-
    Erik Schamper reverse-engineered ASIF, Apple's sparse virtual-disk format for macOS virtual
    machines, and released an open-source reader.
  summary: >-
    Erik Schamper published a 2026-06-18 teardown of ASIF, the sparse virtual-disk format
    Apple introduced in macOS 26 Tahoe for virtual machines. The format opens with a `shdw`
    magic signature and metadata (sector count, 1 MiB chunk size, directory offsets), organizes
    data through directory tables and chunk groups with embedded bitmaps using two-bit per-block
    allocation flags, and reaches just under 4 PiB maximum virtual size via 55-bit chunk addressing
    in 64-bit entries. The author recovered the layout from hex dumps and the `diskimagescontroller`
    binary in IDA Pro and released a reader in the open-source `dissect.hypervisor` project.
  why: >-
    A documented on-disk layout and open-source reader let forensic and VM tooling inspect
    ASIF images without Apple's frameworks, relevant to anyone running or analyzing macOS
    virtual machines.
  sources:
  - label: author write-up
    url: https://schamper.dev/dissecting-apples-sparse-image-format-asif/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48708644
- title: >-
    China's LineShine debuts at TOP500 number 1, first China system to lead since 2017
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    LineShine, running custom domestic processors and interconnect, became the first Chinese
    system to lead TOP500 since Sunway TaihuLight in 2017.
  summary: >-
    The 67th TOP500 list, released 2026-06-23 at ISC 2026 in Hamburg, places a previously
    unlisted Chinese system, LineShine, at number 1 with 2.198 Eflop/s on High Performance
    Linpack across 13,789,440 cores, more than 20 percent ahead of the displaced El Capitan.
    LineShine is installed at the National Supercomputing Centre in Shenzhen and runs a custom
    domestic stack: the LingKun platform with 304-core LX2 processors at 1.55 GHz, a proprietary
    LingQi interconnect, and Kylin OS. It is the first China-based system to top the list
    since Sunway TaihuLight in 2017 and the fifth exascale system overall.
  why: >-
    A domestically built exascale system leading TOP500 on non-US processors and interconnect
    signals that export controls have not stalled China's high-end HPC, with implications
    for compute sovereignty and the semiconductor supply chain.
  followup: >-
    Watch for an HPL run audit or independent verification of the LX2/LingQi architecture
    details and any sustained-workload (HPCG, MLPerf) results.
  sources:
  - label: TOP500 June 2026 list
    url: https://top500.org/lists/top500/2026/06/
  - label: HPCwire
    url: https://www.hpcwire.com/2026/06/25/inside-lineshine-the-new-chinese-supercomputer-sitting-atop-the-top500/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48710775
- title: >-
    Cloudflare traces an intermittent image-truncation bug to a discarded Poll::Pending in
    hyper
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Cloudflare traced a six-week image-truncation bug to a discarded Poll::Pending in hyper's
    HTTP/1 state machine, a four-line fix in dispatch.rs.
  summary: >-
    Cloudflare published a 2026-06-22 write-up of a six-week hunt for a bug in its Rust-based
    Images service, where larger transformed images intermittently returned a 200 status with
    the body cut short (a 2 MB response arriving as a few hundred kilobytes). The root cause
    was in hyper's HTTP/1 connection state machine in `dispatch.rs`: a `let _ =` before `poll_flush`
    discarded the result, including the `Poll::Pending` that signals an incomplete flush,
    so the write loop never learned that megabytes were still buffered. The fix was four lines.
  why: >-
    It is a concrete example of how silently dropping a `Poll::Pending` in async Rust produces
    a data-truncation race that surfaces only under load and large payloads, a failure mode
    for any service building on hyper or hand-written poll loops.
  sources:
  - label: Cloudflare blog
    url: https://blog.cloudflare.com/hyper-bug/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48670314
- title: >-
    HackerRank open-sourced its resume-scoring agent; analysis finds the scores non-deterministic
  section: Engineering posts
  category: Engineering post
  blurb: >-
    One resume scored 66 to 99 out of 120 through HackerRank's open-source resume-scoring
    agent, revealing unreliable evaluative judgment.
  summary: >-
    HackerRank published an open-source LLM resume-scoring agent (interviewstreet/hiring-agent,
    MIT, about 3,250 stars). An analysis ran one resume 100 times through the default gemma3:4b
    model at temperature 0.1 and recorded scores from 66 to 99 out of 120; at an 85-point
    cutoff the same candidate would be rejected about 65 percent of the time. The author traces
    the variance to the subjective project- and experience-scoring prompts, which carry no
    rubric, examples, or anchors, while the checklist-based technical-skills score stays stable
    across runs.
  why: >-
    It is a concrete measurement of how LLM-as-judge scoring conflates reliable parsing with
    unreliable evaluative judgment, a failure mode for any team wiring a language model into
    automated screening or grading.
  sources:
  - label: analysis
    url: https://danunparsed.com/p/hackerrank-open-source-ats
  - label: repository
    url: https://github.com/interviewstreet/hiring-agent
  - label: discussion
    url: https://news.ycombinator.com/item?id=48713832
- title: >-
    Samsung, SK Hynix, and Micron hit with US antitrust class action over DRAM prices
  section: Markets and companies
  category: Markets
  blurb: >-
    A class action alleges Samsung, SK Hynix, and Micron coordinated DRAM pricing since 2022,
    with prices rising approximately 700 percent.
  summary: >-
    A class-action antitrust complaint filed 2026-06-25 in the US District Court for the Northern
    District of California (before Judge Noel Wise) names Samsung, SK Hynix, and Micron, which
    together produce most of the world's DRAM. The 17 plaintiffs (individuals and small businesses)
    allege the three coordinated supply and pricing from 2022 onward, using the industry's
    shift to High Bandwidth Memory for AI data centers as a pretext to curtail DDR3 and DDR4
    output, with prices rising roughly 700 percent over four years. The allegations are unproven;
    the three companies pleaded guilty to DOJ DRAM price-fixing charges in the 2000s.
  why: >-
    It is the first US legal challenge to the memory-price surge that this week drove Apple
    consumer hardware price increases and Micron multi-year floor-price contracts, and a finding
    either way bears on memory costs across the hardware supply chain.
  followup: >-
    Watch for the manufacturers' responses, any motion to dismiss, and whether regulators
    open a parallel probe.
  sources:
  - label: Tom's Hardware
    url: https://www.tomshardware.com/tech-industry/samsung-sk-hynix-and-micron-sued-over-alleged-dram-price-fixing-amid-record-memory-costs
  - label: MLex
    url: https://www.mlex.com/mlex/articles/2493973/samsung-sk-hynix-micron-accused-in-us-of-fixing-dram-prices
  - label: discussion
