- title: >-
    Replacing a 16-byte Rust enum with a 64-bit tagged word made every interpreter benchmark
    faster
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Replacing a 16-byte Rust enum with a 64-bit tagged word cut peak RSS by up to 37 percent
    and sped every benchmark.
  summary: >-
    Rust's alignment rules pushed a tagged enum whose largest variant needs 64 bits out to
    a full 128 bits. Replacing it with low-bit tagging in a single 64-bit word cut peak RSS
    by up to 37 percent and improved every benchmark, including the float-heavy ones the author
    expected to regress.
  why: >-
    Enum layout in Rust can silently double a value representation, and the cost shows up
    as memory traffic rather than as anything visible in the source.
  sources:
  - label: primary
    url: https://pointersgonewild.com/2026-08-25-replacing-a-rust-enum-with-a-64-bit-word/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49575914
