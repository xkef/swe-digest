- title: >-
    The Document Foundation sets six conditions before LibreOffice ships AI by default
  section: Developer tools
  category: Dev tools
  blurb: >-
    The Document Foundation sets six conditions, including no content leaving the machine,
    before LibreOffice ships AI by default.
  summary: >-
    Manual do Usuário reports a Document Foundation position post titled "Yes, no AI is now
    a feature", signed by Italo Vignoli, and transcribes six conditions governing generative
    AI shipped in LibreOffice by default: user-controlled execution, no content leaving the
    machine without authorization, no telemetry, no single-vendor dependency, no compromise
    of the file format, and the feature remaining entirely optional. The same account states
