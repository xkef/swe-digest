- title: >-
    A looped-transformer explainer weighs the reported recurrent depth in GPT-6 Astra
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Sebastian Raschka explains looped transformers on Nanbeige4.2-3B, which runs 22 shared
    blocks twice for depth 44.
  summary: >-
    Raschka explains looped transformers using the open-weight Nanbeige4.2-3B, which applies
    one stack of 22 blocks twice for 44 block applications with weights shared across passes.
    He sets out the tradeoff: effective depth doubles and transformer-block parameter memory
    roughly halves against 44 distinct blocks, while the forward pass and backpropagation
    still run through all 44 applications, so compute is not saved. He frames the claim that
    Astra uses recurrent depth as reporting by The Information rather than as a confirmed
    architecture, and treats the hidden chain-of-thought inference drawn from it as the part
    that does not follow.
  why: >-
    Weight sharing trades parameter memory for compute, so a looped model is cheaper to hold
    and no cheaper to run.
  sources:
  - label: primary
    url: https://magazine.sebastianraschka.com/p/gpt-6-astra-looped-transformers-and
  - label: discussion
    url: https://news.ycombinator.com/item?id=49627370
