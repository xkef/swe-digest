- title: >-
    A 40-year-old off-by-one in XNU gives the first UNIX-domain socket a changing inode
  section: Apple platforms
  category: Apple
  blurb: >-
    A 40-year-old off-by-one in XNU gives the first UNIX-domain socket stat'd on a booted
    system a changing inode.
  summary: >-
    XNU's uipc_sense uses unp_ino++ where it needs ++unp_ino, so the first socket stat'd on
    a booted system gets inode 0. The same code reads 0 as uninitialized and reassigns a new
    inode on the next call. The author traces the line back through XNU 123.5 and 4.3BSD-Tahoe
    to a 1985 change, and states it is not interesting from a security standpoint.
  why: >-
    Code that keys on socket inode numbers can see the identifier for one socket change between
    two stat calls.
  sources:
  - label: primary
    url: https://yuvalino.com/how-can-you-not-be-romantic-about-unix-domain-sockets
  - label: discussion
    url: https://news.ycombinator.com/item?id=49617860
