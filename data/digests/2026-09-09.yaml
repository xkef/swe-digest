- title: An LLM-assisted patch series speeds Linux kernel builds by 36 to 90 percent
  section: Top stories
  category: Linux/Kernel
  blurb: >-
    An LLM-assisted patch series parallelizes single-threaded Kbuild stages for 36 to 90 percent
    faster kernel builds.
  summary: >-
    Lorenzo Stoakes reports an all-modules build about 36 percent faster, incremental builds
    up to 70 percent faster and noop builds up to about 90 percent faster. The patches parallelize
    stages that ran single-threaded in Kbuild, kallsyms, modpost, objtool, mksysmap and the
    Rust build system.
  why: >-
    Build latency is the inner loop of kernel work, and the reported gains come from parallelizing
    existing serial stages rather than from new hardware.
  followup: Track which patches are accepted upstream and in which release.
  sources:
  - label: primary
    url: https://www.phoronix.com/news/AI-To-Faster-Linux-Kernel-Comp
  - label: discussion
    url: https://news.ycombinator.com/item?id=49619470
