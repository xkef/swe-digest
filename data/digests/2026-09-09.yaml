- title: >-
    OpenAI reports a Navier-Stokes resolution, and Buckmaster disputes how it got there
  section: Top stories
  category: AI
  blurb: >-
    OpenAI reports an unreleased model resolved Navier-Stokes existence and smoothness, and
    Tristan Buckmaster disputes the credit.
  summary: >-
    OpenAI states an unreleased internal model produced a resolution to the Navier-Stokes
    existence and smoothness problem, one of the seven Millennium Prize Problems, with the
    agents reaching it on 2026-09-05 about 88 hours after launch and Lean formalization and
    verification taking a further 17 hours through GPT-6 Astra, using 2.7 million agent messages
    and approximately 130 billion output tokens on that problem within 4.9 million messages
    and about 300 billion output tokens across all attempted problems. Tristan Buckmaster
    published a statement alleging OpenAI took up the approach he developed with his collaborator
    Levent Alpoge, an Anthropic employee whom OpenAI stated it would not invite as a co-author
    because of its competitive relationship with his employer, after learning of it from him.
    OpenAI states that neither its researchers nor its agents saw any of that work before
    public release and that no specific user data was accessed to solve the problem, states
    separately that it cannot rule out that de-identified data derived from Buckmaster and
    Alpoge's product usage helped improve its models, and records that its proofs differ significantly
    from theirs with the precise results proved differing in the Euler case.
  why: >-
    A vendor's agents are credited with a Millennium Prize resolution that has not been peer
    reviewed, and the contested question is whether original work run through that vendor's
    coding agent stays the user's own.
  followup: >-
    Track peer review of the resolution, OpenAI's further response to the statement, and any
    correction to either account.
  sources:
  - label: OpenAI account, relayed
    url: https://simonwillison.net/2026/Sep/8/on-navier-stokes/
  - label: Buckmaster statement
    url: https://cims.nyu.edu/~tristanb/statement.pdf
  - label: TechCrunch
    url: https://techcrunch.com/2026/09/08/openai-fought-dirty-on-career-making-math-problem-says-nyu-mathematician/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49605915
  - label: HN thread
    url: https://news.ycombinator.com/item?id=49624163
- title: >-
    WeWorm: a zero-click worm that spreads through WeChat calls across iOS and Android
  section: Top stories
  category: Security
  blurb: >-
    Calif.io details WeWorm, a zero-click WeChat VoIP worm that takes over accounts of a caller's
    contacts on iOS and Android.
  summary: >-
    Calif.io describes a memory-corruption bug in the VoIP stack of WeChat that yields full
    account takeover through an incoming call, with no user interaction, on both iOS and Android,
    and states the exploit requires the attacker to be on the victim's friend list. Calif.io
    notes the barrier is low because each compromised account reaches the contacts of the
    next victim, and that declining the call stops that attempt while the attacker can retry.
    Calif.io reported the bug to Tencent on 2026-07-24, Tencent published WeChat Android 8.0.77
    and iOS 8.0.76 on 2026-08-21, and Calif.io states server-side mitigation was confirmed
    for all users on 2026-08-28.
  why: >-
    The friend-list precondition bounds each hop rather than the spread, and the team reports
    two days from bug to first remote code execution exploit working with AI, plus one further
    week to build the worm.
  followup: Track any confirmation of exploitation in the wild.
  sources:
  - label: primary
    url: https://calif.io/research/weworm
  - label: discussion
    url: https://news.ycombinator.com/item?id=49609900
