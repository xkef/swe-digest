- title: >-
    Rails publishes forensic tooling and the CVE-2026-66066 attack chain from a 37signals
    production sweep
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Rails published forensic tooling for CVE-2026-66066, showing how HDF5 external file lists
    let attackers read arbitrary files through libvips.
  summary: >-
    The Rails organization published an MIT-licensed documentation and skill repository for
    CVE-2026-66066, the Active Storage and libvips arbitrary file read the reporters named
    KindaRails2Shell, and the repository states the method came out of a real investigation
    at 37signals sweeping a large production Active Storage store, and that it identified
    the test files uploaded by the reporting researchers. It traces the chain as follows:
    a direct upload lets the client set the `content_type` column without the bytes being
    examined, libvips then sniffs magic bytes, a file whose first ten bytes claim MATLAB 5.0
    routes to the libvips MATLAB loader, libmatio dispatches on a different byte range and
    finds MAT 7.3, which is HDF5, and HDF5's External File List lets a dataset's bytes live
    in another file named by path and offset, so rendering the variant reads an attacker-chosen
    file and returns its contents as pixel values. Two skills produce an exposure window and
    then a forensic analysis, the detector reads two header fields from the first 128 bytes
    of an object so a candidate is classified from a ranged read, and no payload generator
    and no crafted files are shipped. The repository README directs operators to take the
    patched version numbers from the advisory, which lists the affected versions as activestorage
    below 7.2.3.2, activestorage from 8.0 and below 8.0.5.1, and activestorage from 8.1 and
    below 8.1.3.1. The same advisory states that libvips must be upgraded to 8.13 or later,
    because Active Storage raises an exception at boot on libvips below 8.13, which cannot
    disable unfuzzed operations at all.
  why: >-
    The 2026-07-29 advisory told operators to patch and rotate secrets but gave them nothing
    to answer whether they were exploited, and Active Storage on the vips variant processor
    has been the `load_defaults 7.0` default with no later default changing it.
  followup: >-
    The repository covers Active Storage where variant records were tracked and not other
    paths that hand user files to libvips, and the 2026-07-29 advisory said technical details
    would be disclosed no later than 2026-08-28, so track what that disclosure adds.
  sources:
  - label: rails/rails-forensics-CVE-2026-66066
    url: https://github.com/rails/rails-forensics-CVE-2026-66066
  - label: Rails security announcement
    url: https://discuss.rubyonrails.org/t/cve-2026-66066-possible-arbitrary-file-read-and-remote-code-execution-in-active-storage-variant-processing/91432
- title: >-
    Amazon attributes the debug, chalk, and axios npm compromises to one North Korean cluster
    and names slopsquatting on AI-hallucinated package names as a live technique
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Amazon attributes npm compromises to a North Korean operator using social engineering,
    maintenance windows, and AI-hallucinated package names.
  summary: >-
    Amazon ties the typo-crypto trojan of March 2025, the September 2025 debug and chalk compromises,
    and the March 2026 axios compromise to the actor tracked as Sapphire Sleet, BlueNoroff,
    and Stardust Chollima. It reports the debug and chalk packages reached an estimated 10
    percent of cloud environments within two hours, and axios at over 100 million weekly downloads.
    The attribution is stated at medium confidence and rests on shared tactics, command-and-control
    infrastructure, and operational similarities, so the linkage is the qualified part. Initial
    access in every case was social engineering of a maintainer rather than a registry flaw.
    The cited report enumerates no affected version numbers for debug, chalk, or axios, so
    no affected versions are asserted here and an operator cannot check a pinned dependency
    against this block alone. No Amazon first-party page for the report resolved in this run,
    so this block cites BleepingComputer alone.
  why: >-
    The named techniques are checkable by any team consuming npm: functionality split across
    several benign-looking packages, months of legitimate maintenance before the malicious
    commit, behaviour decoupled from package contents into external scripts and remotely fetched
    keys, payloads that delay execution until they detect a real developer or production environment,
    and registration of package names hallucinated by AI coding assistants so that a developer
    or an autonomous agent installs them.
  followup: >-
    Track whether an Amazon first-party publication of this report becomes reachable, since
    the attribution and the confidence level currently rest on secondary coverage.
  sources:
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/amazon-links-debug-chalk-npm-supply-chain-attacks-to-north-korean-hackers/
- title: >-
    npm bypass-2FA granular access tokens lose account, organization, and package management,
    with direct publish going in January 2027
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    npm granular access tokens now require 2FA for account changes, token management, and
    package permission modifications starting immediately.
  summary: >-
    Creating or deleting tokens, changing package access, maintainers, or trusted publishing
    configuration, and managing organization and team membership and package grants now require
    an interactive 2FA challenge. GitHub states the reason directly: a leaked 2FA-bypass token
    could previously take over an account and mint further tokens or add a maintainer. The
    change is scoped to npm granular access tokens and does not touch GitHub personal access
    tokens, GitHub App tokens, or `GITHUB_TOKEN` in Actions. GitHub targets January 2027 for
    removing direct publish from these tokens, leaving them able to read private packages
    and stage a publish that a maintainer approves with 2FA, and it names trusted publishing
    over OIDC and staged publishing as the migration targets. This continues the deprecation
    announced on 2026-07-08.
  why: >-
    Any npm publish automation still holding a bypass-2FA token has a dated migration path
    to trusted publishing rather than an open-ended one.
  followup: >-
    Track whether direct publish is removed from these tokens in January 2027 as stated.
  sources:
  - label: GitHub changelog
    url: https://github.blog/changelog/2026-07-31-restricting-npm-bypass-2fa-granular-access-tokens/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49134148
- title: >-
    CISA alerts the water sector to activity against internet-exposed PLCs after more than
    30 Minnesota community water systems were disrupted
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    CISA alerts water utilities to coordinated PLC attacks disrupting thirty Minnesota community
    systems, with over four thousand devices exposed.
  summary: >-
    The CISA alerts index lists an alert dated 2026-07-30 titled CISA Urges Water and Wastewater
    Systems Sector to Protect OT Against Activity Targeting PLCs. No per-alert permalink resolved
    in this run, so the alert title and its date were read from the index. The reported activity
    is attackers changing PLC passwords to lock operators out and altering IP addresses to
    disconnect devices, and Minnesota IT Services activated the state incident response plan
    for what it described as a coordinated attack on operational technology at more than 30
    community water systems, with some utilities switching to manual operation. CISA's instruction
    is to remove publicly exposed PLCs and other operational technology from the internet,
    and otherwise to reach them through a VPN or gateway, change default passwords, and restrict
    access to an IP allow-list. Censys quantifies the exposure at more than 4,100 internet-reachable
    Rockwell Automation and Allen-Bradley hosts, about 4,100 Siemens hosts, and over 2,000
    Schneider Electric hosts, and reports that nearly half the exposed Rockwell devices are
    reachable over consumer and carrier networks, which matches the alert's warning about
    undocumented cellular modems installed by operators, vendors, or integrators. No affected
    versions apply, because the alert describes password changes and IP reassignment against
    exposed controllers rather than exploitation of a versioned software defect. Reachable
    is not the same as targeted or compromised.
  why: >-
    The prescribed controls are inventory and network placement rather than a patch, so the
    work falls on whoever owns the remote-access path to the controller.
  followup: >-
    Track whether CISA publishes a per-alert page with indicators, and whether the Minnesota
    incident is attributed.
  sources:
  - label: CISA advisories index
    url: https://www.cisa.gov/news-events/cybersecurity-advisories
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/cisa-warns-of-cyberattacks-disrupting-us-water-utilities/
