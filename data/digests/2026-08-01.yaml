- title: >-
    ClickHouse measures strict memory overcommit turning a Postgres instance-wide OOM restart
    into one failed query at no measurable throughput cost
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    ClickHouse shows strict memory overcommit converts a Postgres instance-wide OOM restart
    into a single failed query with no throughput impact.
  summary: >-
    The post, dated 2026-07-28 by Kaushik Iska, runs both kernel policies on one m7i.2xlarge
    with Postgres 16, a quarter of memory as huge pages behind a 6864MB `shared_buffers`,
    and a 3GB pgbench dataset. Under the default policy committed memory passed the reported
    11.6GiB CommitLimit and reached 23.6GiB, the OOM killer took a backend holding 2.4GB,
    and because a SIGKILLed backend leaves the shared segment in an unknown state the postmaster
    terminated every backend and ran crash recovery, dropping all 20 bystander sessions and
    refusing new connections for 30.2 seconds. Under `vm.overcommit_memory = 2` the tenth
    session got an out of memory error with 3.8GB still free, its transaction rolled back,
    and no session was dropped. Select-only throughput differed by 2.2 percent against a 4
    to 5 percent run-to-run spread and read-write by 0.6 percent, with the arms interleaved
    and the read-write pass taken after warm-up. The commit limit formula is 80 percent of
    the memory left after the huge page reservation plus 2GB. This is a vendor post arguing
    for its own managed default.
  why: >-
    The setting is one line of sysctl that any Postgres operator can apply and check, and
    it converts a whole-instance restart into a single failed query.
  sources:
  - label: ClickHouse
    url: https://clickhouse.com/blog/strict-memory-overcommit-for-postgres
  - label: discussion
    url: https://news.ycombinator.com/item?id=49131353
- title: >-
    Cloudflare adds a provisioning API for isolated Media over QUIC relays with separate publisher
    and subscriber tokens
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare added a provisioning API for isolated MoQ relays with per-relay tokens that
    carry expiry and revocation, replacing shared endpoints.
  summary: >-
    The post, dated 2026-07-31, states that provisioning a relay creates an isolated scope
    across the existing network rather than starting a virtual machine, container, or process,
    so a relay is closer to a virtual host than a new server. Tokens grant publish, subscribe,
    or both on a single relay, can carry an expiry, and can be revoked individually, which
    is what the previous unauthenticated global endpoint could not do and why Cloudflare says
    it suited protocol testing rather than production. Relays now support draft-14 and draft-16
    of the IETF MoQ Transport protocol, and draft-16 adds PUBLISH, which lets a publisher
    push a track to the relay before any viewer subscribes, and SUBSCRIBE_NAMESPACE, which
    covers tracks added later in a stream. Cloudflare is documenting the control plane as
    the MoQ CDN Provisioning Internet-Draft, which calls the resource a scope. It is free
    during beta and Cloudflare says the API will change.
  why: >-
    Per-relay tokens with expiry and individual revocation are the minimum a live media deployment
    needs before it can carry real traffic, which the previous shared endpoint did not offer.
  followup: >-
    A common provisioning model across relay providers is proposed rather than settled, so
    track whether the MoQ CDN Provisioning draft is adopted.
  sources:
  - label: Cloudflare
    url: https://blog.cloudflare.com/moq-relays/
  - label: discussion
