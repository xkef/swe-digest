    is a separate matter from the malicious AUR adoption wave that led Arch to disable adoption
    on 2026-07-31, and the letter draws no connection between the two.
  why: >-
    The initramfs generator on every Arch system and the distribution's package-signing keyring
    both need new hands.
  followup: >-
