- title: >-
    Simon Willison ships two clients and a server against the stateless MCP specification
    and publishes the request-level diff
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Simon Willison shipped MCP implementations showing stateless MCP removes server-side session
    state, simplifying load balancer deployments.
  summary: >-
    Willison describes implementing against the 2026-07-28 Model Context Protocol specification
    and gives the concrete before and after. Legacy MCP required two HTTP requests, one to
    `initialize` and obtain an `Mcp-Session-Id` and a second to call the tool, where the new
    form is a single POST carrying `MCP-Protocol-Version`, `Mcp-Method`, and `Mcp-Name` headers
    with client information moved into `_meta`. He released three implementations in a week:
    `mcp-explorer`, a stateless Python CLI for listing, inspecting, and calling tools on a
    server, runnable through `uvx`, then `datasette-mcp`, a Datasette plugin exposing a `/-/mcp`
    endpoint with `list_databases`, `get_database_schema`, and a read-only `execute_sql`,
    and an alpha `llm-mcp-client` plugin for his LLM tool.
  why: >-
    Removing server-side session state is the part that changes deployment, because a stateless
    MCP server needs no session-affinity routing, which is what made the previous protocol
    awkward to run behind a load balancer.
  sources:
  - label: Simon Willison
    url: https://simonwillison.net/2026/Jul/31/stateless-mcp/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49131438
- title: >-
    Cursor removes per-request dollar cost from the usage page, the CSV export, and the dashboard
    API for self-serve and Teams plans, including historical records
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Cursor removed per-request and per-model dollar cost from self-serve and Teams usage reporting,
    retaining cost data only in the Admin API.
  summary: >-
    A Cursor representative answering on the company's own forum states that a change shipped
    2026-07-31 made the Usage page tokens-only for self-serve plans including Teams, that
