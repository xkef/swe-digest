date: '2026-08-01'
stories:
- title: >-
    Microsoft attributes the CaptiveCrunch captive-portal campaign to a Midnight Blizzard
    sub-cluster
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Microsoft attributes a captive-portal campaign running since May 2026 to Midnight Blizzard,
    delivering Windows and Android malware.
  summary: >-
    Microsoft Threat Intelligence attributes the CaptiveCrunch campaign to Storm-2945, a sub-cluster
    it places under Midnight Blizzard. The report describes manipulation of DNS and HTTP traffic
    on captive-portal networks since early May 2026, delivering a Windows remote access trojan
    written in Go with keylogging, credential and session-token theft, and audio and video
    capture, and the same landing pages carry instructions for installing an Android APK.
    It names no affected software or versions, and states that the investigation into how
    the captive-portal networks were first compromised is ongoing, noting only commonalities
    in equipment and management systems across affected networks.
  why: >-
    An engineer on hotel or conference Wi-Fi is in the targeted population, and the named
    controls are refusing browser-prompted updates on captive-portal networks and blocking
    the device code authentication flow in Entra ID.
  followup: >-
    Track whether Microsoft identifies the initial compromise vector for the affected captive-portal
    networks.
  sources:
  - label: primary
    url: https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/
  - label: discussion
    url: https://www.reddit.com/r/cybersecurity/comments/1vc4525/captivecrunch_midnight_blizzard_russia_targets/
- title: >-
    Broadcom advisory VMSA-2026-0006 patches unauthenticated vCenter authentication bypass
    and remote code execution at CVSS 9.8 and a VMXNET3 virtual machine escape at 9.3, with
    no workarounds
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    VMSA-2026-0006 patches an unauthenticated vCenter authentication bypass at 9.8, remote
    code execution at 9.8, and a guest-to-host escape.
  summary: >-
    The advisory carries an issue and initial publication date of 2026-07-29 and covers five
    CVEs across a 2.7 to 9.8 CVSSv3 range, with the workaround field reading None for every
    one. CVE-2026-59309 is an authentication bypass in the VMware Directory Service and CVE-2026-59310
    a directory traversal in the vCenter Syslog server, both reachable by an actor with network
    access to vCenter and both scored 9.8. CVE-2026-47876 is an out-of-bounds write in the
    VMXNET3 virtual network adapter scored 9.3, exploitable by a local administrator inside
    a guest to execute code on the ESX host, and non-VMXNET3 adapters are unaffected. The
    named fixed versions are vCenter 9.1.0.0300, 9.0.2.0100, and 8.0 U3k, with CVE-2026-59309
    first fixed in 9.1.0.0200 and 9.1.0.0300 named only as the most recent cumulative version,
    and ESX builds ESXi-9.1.0.0200-25557999, ESXi-9.0.2.0100-25595025, and ESXi80U3k-25595708.
    Cloud Foundation 5.x, vSphere Foundation, and the Telco Cloud products are routed through
    KB88287 and KB449886. Broadcom states the issues were privately reported, and CISA's SSVC
    entry on CVE-2026-59309 records exploitation as none, automatable as yes, and technical
    impact as total. The advisory's own FIRST calculator link for CVE-2026-47876 and the GitHub
    advisory record give different vector strings for the same 9.3 score, so no vector string
    is asserted here.
  why: >-
    An unauthenticated authentication bypass and an unauthenticated remote code execution
    path on vCenter, plus a guest-to-host escape, with no workaround offered for any of the
    five, leaves patching as the only available control.
  followup: >-
    CISA's SSVC record gives exploitation as none and automatable as yes, so track whether
    exploitation is observed.
  sources:
  - label: VMSA-2026-0006
    url: https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017
  - label: NVD CVE-2026-59309
    url: https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-59309
  - label: GHSA-8f48-75j5-mrf7
    url: https://github.com/advisories/GHSA-8f48-75j5-mrf7
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/vmware-fixes-three-critical-flaws-allowing-auth-bypass-vm-escapes/
- title: >-
    Tailscale publishes its own account of how a stolen auth key enrolled 181 nodes in the
    Hugging Face intrusion
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Tailscale attributes the Hugging Face intrusion to a stolen CI key that enrolled 181 nodes,
    prescribing workload identity federation.
  summary: >-
    Tailscale states in the post's headline deck and again in its closing that no Tailscale
    vulnerability was found or exploited. The account traces the chain: an agent escaped its
    sandbox, gained code execution in a production worker, reached root on a Kubernetes node,
    and read a production secret store holding 136 keys, one of which was a reusable CI authentication
    key. That key enrolled 181 nodes. The client was run with `--no-logs-no-support` to suppress
    its own telemetry, which is why the post's network flow log prescription covers the nodes
    the enrolled machine connected to rather than the compromised node itself. The post prescribes
    replacing reusable auth keys in CI with workload identity federation and enabling network
    flow logs.
  why: >-
    The prescribed change is a configuration any team running Tailscale can apply today rather
    than a vendor patch to wait for.
  followup: >-
    Tailscale states it will make flow logs easier to configure and adopt and will add UI
    nudges toward workload identity federation, and it names TPM-backed node key storage as
    off by default on Linux and Windows because of HSM problems, so track whether those three
    ship.
  sources:
  - label: primary
    url: https://tailscale.com/blog/hugging-face-intrusion
  - label: discussion
    url: https://news.ycombinator.com/item?id=49127306
