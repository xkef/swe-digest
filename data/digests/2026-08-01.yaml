- title: >-
    LWN reports gccrs spent the first half of 2026 on kernel crates and fixed a Drop bug that
    left locks held
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    LWN reports gccrs spent 2026's first half on kernel crates, fixing Drop and name-resolution
    bugs while testing Rust for Linux compilation.
  summary: >-
    The article, contributed by Arshal Aromal and dated 2026-07-28, reports that gccrs reorganized
    its roadmap in March 2026 into three capability milestones rather than GCC version targets:
    an embedded compiler for `no_std` programs depending only on `core`, a Rust for Linux
    compiler supporting `alloc` and the kernel's crates, and a general purpose compiler, with
    the first close but incomplete. Testing against kernel crates exposed three classes of
    defect: an initial Drop implementation that lacked the control-flow analysis generating
    dynamic drop flags, so `Drop::drop()` calls were omitted or incorrect and in kernel code
    a `MutexGuard` could go out of scope without releasing its lock, name resolution that
    resolved path segments in the namespace of the target item rather than resolving modules
    and imports in the type namespace first, which required rewriting internal data structures,
    and crate metadata that omitted nested module exports, which the project's flatter test
    cases had not caught. Two gccrs developers were elevated to GCC maintainer status, letting
    them stage updates in their own tree, and Patry and Arthur Cohen plan a talk titled "Compiling
    the Linux kernel with gccrs" at RustConf in Montreal and EuroRust in Barcelona later this
    year.
  why: >-
    A GCC-based Rust frontend is what would let the kernel's Rust code build for architectures
    LLVM does not target and integrate with GCC's plugin ecosystem, and the article is equally
    specific that gccrs parses kernel code today but handles only standalone `no_core` programs.
  sources:
  - label: LWN
    url: https://lwn.net/SubscriberLink/1083202/f1ba926cd57ac5c5/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49121022
