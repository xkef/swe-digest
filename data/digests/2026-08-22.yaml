- title: >-
    JSONata patches three critical expression-evaluation escapes that reach arbitrary code
    execution, cleared by 2.2.1 and 1.8.8
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Three CVSS 9.3 code execution escapes patched in JSONata 2.2.1 and 1.8.8 respectively
    in May and July of 2026.
  summary: >-
    Three separate advisories, each rated CVSS v4 9.3, describe an escape from JSONata's expression
    evaluation that reaches arbitrary code execution in the host process, and the advisory
    texts carry working proof-of-concept expressions. The affected ranges are `>= 2.0.0, <
    2.2.1` and `< 1.8.8` for the two linked above, and `<= 1.8.7` plus `>= 2.0.0, < 2.2.0`
    for the third, GHSA-8gq3-vp5j-2grp and CVE-2026-77413, which this run found through the
    advisories API. The patches are older than the advisories: 2.2.1 was released on 2026-05-19
    and 1.8.8 on 2026-07-16, and the advisories were published in the jsonata-js/jsonata repository
    on 2026-07-13. What happened on 2026-08-21, within a few minutes of each other from 20:57
    UTC, is that all three entries reached the GitHub Advisory Database.
  why: >-
    A service that evaluates a user-supplied JSONata expression on a version below 2.2.1 or
    1.8.8 hands the sender code execution in the host process, and 2.2.0 is not enough, because
    it clears CVE-2026-77413 and leaves the other two.
  sources:
  - label: GitHub advisory GHSA-66mm-25pp-rfff
    url: https://github.com/advisories/GHSA-66mm-25pp-rfff
  - label: GitHub advisory GHSA-2943-5xfg-gq5f
    url: https://github.com/advisories/GHSA-2943-5xfg-gq5f
  - label: GitHub advisory GHSA-8gq3-vp5j-2grp
    url: https://github.com/advisories/GHSA-8gq3-vp5j-2grp
  - label: JSONata 2.2.1 release
    url: https://github.com/jsonata-js/jsonata/releases/tag/v2.2.1
- title: >-
    A traced RTX 4090 global load measures 15.4 ns at L1, 127.4 ns at L2 and 255.4 ns at DRAM,
    with the L1 set function and L2 slice hash reverse engineered
  section: Top stories
  category: Engineering post
  status: confirmed
  blurb: >-
    A post traces RTX 4090 memory latencies and reverse engineers undocumented mappings with
    probes and settings for reproduction.
  summary: >-
    The post traces a single global load through the memory path of an RTX 4090 and puts a
    measured latency on each level, 15.4 ns when it hits L1, 127.4 ns at L2 and 255.4 ns when
    it reaches DRAM. It also reverse engineers two mappings Nvidia does not document, the
    function that selects an L1 set and the hash that assigns an address to an L2 slice. The
    probes and the clock settings used to take the measurements are published alongside the
    numbers.
  why: >-
    The post publishes its probes and clock settings, so the latencies and the slice mapping
    can be reproduced on another card rather than taken from vendor documentation that does
    not cover them.
  sources:
  - label: doubleword.ai post
    url: https://blog.doubleword.ai/what-happens-when-a-gpu-reads-memory
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49390308
- title: >-
    Nari Labs reports 10 requests per second at sub-50 ms p95 time-to-first-audio for Qwen3-TTS
    on one H100, and open sources the serving code and benchmark
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Nari Labs scheduled TTS stages on one surface to preempt batches by playback deadline
    at ten requests per second with sub-50 ms p95.
  summary: >-
    The reported result is 10 requests per second on a single H100 with p95 time-to-first-audio
    under 50 ms. The design point is that the Talker, the Code Predictor and the Codec are
    scheduled on one surface rather than as separate stages, which lets a request approaching
    its playback deadline preempt an in-flight batch. Nari Labs publishes the serving code
    and the benchmark harness, and compares against vLLM-Omni, SGLang-Omni, VoxServe and M*.
    The figures are the vendor's own and no independent reproduction was located this run.
  why: >-
    Putting the Talker, Code Predictor and Codec on one scheduling surface is what lets a
    request approaching its playback deadline preempt a batch, and the benchmark is published
    so the comparison against vLLM-Omni, SGLang-Omni, VoxServe and M* can be rerun.
  sources:
  - label: Nari Labs blog post
    url: https://nari-labs.com/blog/qwen3-tts-speed-cost-frontier/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49389952
