- title: >-
    WarpStream's Kafka producer proxy holds each response to WarpStream's own write latency,
    so a mistuned producer fails during the proxy phase instead of after the cutover
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    WarpStream's migration proxy delays responses to match destination latency, gating cutover
    on time lag.
  summary: >-
    During migration the proxy delays each produce response to match WarpStream's own write
    latency, so a producer with timeouts too tight for the destination fails while the source
    cluster is still authoritative. The cutover gate uses time lag rather than offset lag,
    because time lag translates directly into how long producers sit retrying with writes
    held in client buffers. A topic that does not drain inside the timeout rolls back to the
    proxy state on its own, and the post is written by the vendor selling the destination
    cluster.
  why: >-
    Gating the cutover on time lag rather than offset lag measures the quantity that decides
    whether producers stall, which is how long the backlog takes to drain rather than how
    many records it holds.
  sources:
  - label: WarpStream blog post
    url: https://www.warpstream.com/blog/orbit-kafka-auto-migration
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49389769
