date: '2026-08-22'
stories:
- title: >-
    An expired 5 euro domain gave a researcher DNS control of three territories' ENUM zones,
    and logged about 209,000 phone-number queries before the NCSC took it over
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Registering an expired nameserver domain gave control of zones and logged roughly 209,000
    phone-number lookups through them.
  summary: >-
    Three territories' zones under `e164.arpa` were delegated to a nameserver whose own domain
    had lapsed, so registering that expired domain for 5 euros put the author, lina, in authoritative
    control of every name beneath them. The post reports 100,170, 99,902 and 9,133 queries
    across the zones, roughly 209,000 in total, and a footnote states that a friend ran a
    second nameserver without logging, so the published figures are roughly half of what arrived.
    The national cyber security centre subsequently took the domain over. The logs are ENUM
    DNS lookups, and the step from those lookups to conclusions about who was placing calls
    is the author's inference rather than something the query data establishes.
  why: >-
    A zone can be delegated to a nameserver whose own domain has lapsed, which turns the 5
    euro registration of that expired nameserver domain into control of every name beneath
    the zone.
  comments: >-
    HN commenter tosti quotes the passage drawing that conclusion and calls it a jump from
    the logged data. Commenter toast0 states ENUM is less dead than the post assumes, because
    number-porting services still issue ENUM queries against private nameservers reached over
    VPN.
  sources:
  - label: lina.sh write-up
    url: https://lina.sh/blog/hijacking-e164-arpa
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49387570
- title: >-
    OpenAI cuts GPT-5.6 Sol API pricing to 4 dollars per million input tokens and 20 dollars
    per million output, a 20 percent input and 33 percent output reduction
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    GPT-5.6 Sol input fell to four dollars per million tokens and output to twenty dollars,
    both promotional through November 2026.
  summary: >-
    The model page states 4 dollars per million input tokens and 20 dollars per million output
    tokens, a 20 percent reduction on input and 33 percent on output, and gives the pricing
    as promotional at least through 2026-11-21. Cached input stays at 0.40 dollars per million
    and cache writes bill at 1.25x the uncached input rate. A prompt above 272K input tokens
    prices the whole request at 2x input and 1.5x output.
  why: >-
    The realised saving follows cache behaviour and prompt shape rather than the headline
    rate, because cache writes bill above uncached input and one prompt over 272K tokens reprices
    the entire request.
  followup: Track whether the promotional rate holds past 2026-11-21.
  sources:
