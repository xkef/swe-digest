  - label: discussion
    url: https://news.ycombinator.com/item?id=49258764
- title: >-
    The Illinois age-verification law discussed as putting Linux on the hook is Public Act
    104-0664, effective 2028-01-01
  section: Hacker News
  category: Infrastructure
  blurb: >-
    Illinois passed Public Act 104-0664, an age-verification mandate for device makers effective
    2028-01-01, triggering speculation about scope.
  summary: >-
    A 297-point thread argued that an Illinois age-verification law obliges operating system
    providers, including Linux distributions. The ILGA record for HB 5511 shows that House
    Floor Amendment No. 1 replaced everything after the enacting clause and applied the act
    to a covered manufacturer that has an account setup feature with respect to the use of
    an Internet-enabled device, that Senate Committee Amendment No. 1 replaced everything
    after the enacting clause again and renamed the act to the Children's Online Safety Act,
    and that Senate Floor Amendment No. 2 replaced it once more. The enacted act is Public
    Act 104-0664, effective 2028-01-01.
  why: >-
    The obligation that reaches engineers is an age-bracket signal API between device makers
    and application operators, on a 2028 timetable.
  followup: >-
    The enacted full text of Public Act 104-0664 and its definition of covered manufacturer.
  comments: >-
    The "operating system provider" wording HN commenters quote belongs to the introduced
    draft rather than to the act that was signed. This run could not resolve the public act
    full text at the legacy ILGA path, and the bill status page carries synopses rather than
    definitions, so whether a Linux distribution is a covered manufacturer is not established
    here.
  sources:
  - label: primary
    url: https://www.ilga.gov/Legislation/BillStatus?DocNum=5511&GAID=18&DocTypeID=HB&LegID=&SessionID=114
  - label: discussion
    url: https://news.ycombinator.com/item?id=49249150
