- title: >-
    Docker's Sandboxes page describes per-agent microVM isolation and labels the product Experimental
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Docker's Sandboxes product page describes per-agent microVM isolation with workspace mounting,
    labeled Experimental with community support.
  summary: >-
    Docker's product page states each agent runs in a dedicated microVM with only the project
    workspace mounted, that the host is untouched, and that permissive execution is the default
    rather than an opt-in. It names Claude Code, Gemini CLI, Copilot CLI, Codex, OpenCode,
    and Kiro as supported out of the box, publishes install paths for a `sbx` binary on macOS,
    Windows, and Ubuntu, and states Docker Desktop is not required. The page labels Sandboxes
    Experimental, supported through community channels, with functional and API limits and
    features that can change without notice, and holds network policy, filesystem rules, and
    org-wide MCP governance back to the paid Docker AI Governance product. The page carries
    no dated release announcement and this run found no matching launch post on Docker's blog,
    so what is recorded here is the page's own statement of scope and status rather than a
    ship date.
  why: >-
    Isolation for running an agent with permission prompts off is offered as vendor infrastructure
    rather than a per-team script, while the controls a team would need to constrain it are
    held behind a paid tier.
  followup: >-
    Whether Sandboxes leaves Experimental, and whether network and filesystem policy stay
    behind the paid tier.
  sources:
  - label: primary
    url: https://www.docker.com/products/docker-sandboxes/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49239751
- title: >-
    Dan Luu's evals find the token-efficiency case for dynamic languages in coding agents
    does not survive non-trivial tasks
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Dan Luu's evals on larger tasks show dynamic languages lose their token-efficiency advantage
    over static languages for coding agent work.
  summary: >-
    The widely cited claim is that dynamically typed languages cost fewer tokens because they
    omit type declarations, with a stated 2.6x gap between C and Clojure and J at 70 tokens
    average, which Luu notes comes from Rosetta Code tasks solvable in tens of tokens. He
    runs two larger evals instead, a zstd decoder implemented from the RFC without tests and
    a modified Pandoc ProgramBench scored against holdout tests, and the dynamic cluster lands
    ahead at medium effort while the ultra effort result is mixed with several static languages
    among the best and obscure dense languages doing poorly. He documents a defect in one
    cited benchmark where a test executed a `../../minigit` path that did not exist, which
    is what caused the Rust and Haskell failures the benchmark's author read as evidence that
    difficult languages burden the model. A Go agent later symlinked that path to its own
    executable, so scoring on that broken test after the symlink measured the Go binary, and
    Luu notes the Rust scoring ran before it.
  why: >-
    Language choice for agent work is being argued from token counts measured on problems
    too small to separate the languages, and Luu reports the only durable signal as a weak
    to moderate positive correlation between language popularity and both correctness and
    cost.
  sources:
  - label: primary
    url: https://danluu.com/pl-tokens/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49245936
- title: >-
    Mozilla rotates the subkey signing Firefox and Thunderbird Linux tarballs, RPMs, and checksums
    after an unencrypted copy reached a private repository
  section: Security
  category: Security
  blurb: >-
    Mozilla rotated the GPG subkey for Firefox and Thunderbird Linux artifacts after an unencrypted
    copy reached a private repository.
  summary: >-
    Mozilla rotated the GPG subkey used to sign certain Firefox and Thunderbird artifacts,
    namely Linux tarballs, RPM packages, and checksums files, after an unencrypted copy of
    it reached a private repository. Mozilla states its audit records show no evidence that
    the key was accessed by an unauthorized party, that repository access was limited to people
    who already held the key, and that for most users no action is required. Releases signed
    with the previous key stop verifying once the revocation is imported.
  why: >-
    Firefox RPM users on Fedora 42 and older, RHEL, Rocky, AlmaLinux, and openSUSE must remove
    the old key by hand before importing the new one, or updates fail with a key mismatch,
    while Fedora 43 and later need no manual step.
  sources:
  - label: primary
    url: https://blog.mozilla.org/security/2026/08/10/updated-gpg-key-for-signing-firefox-and-thunderbird-releases/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49253250
