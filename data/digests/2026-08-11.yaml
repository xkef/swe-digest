    url: https://support.claude.com/en/articles/16266773-how-claude-marks-ai-generated-content
  - label: discussion
    url: https://news.ycombinator.com/item?id=49250109
- title: >-
    NVIDIA releases Nemotron 3.5 Lightning, a 30B Mamba-2, MoE, and attention hybrid with
    3B active parameters
  section: AI
  category: AI
  blurb: >-
    NVIDIA released Nemotron 3.5 Lightning, a 30B Mamba-MoE-attention hybrid with 3B active
    parameters and 1M-token context on single H100.
  summary: >-
    NVIDIA released Nemotron 3.5 Lightning, which the model card summarizes as a Mamba-2,
    mixture of experts, and attention hybrid, at 30B parameters with 3B active. The model
    card gives a release date of 2026-08-11 and states the NVFP4 build deploys on a single
