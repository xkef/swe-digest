date: '2026-08-11'
stories:
- title: >-
    Encrypted reasoning blocks from three providers replay into jailbroken weaker sibling
    models and give up the hidden chain of thought
  section: Top stories
  category: Security
  blurb: >-
    Encrypted reasoning blocks from Anthropic, OpenAI, and Google replay into weaker siblings,
    and jailbreaking recovers the hidden chain of thought.
  summary: >-
    The project reports that the encrypted reasoning blocks Anthropic, OpenAI, and Google
    return to API clients can be replayed into a weaker sibling model from the same provider,
    and that jailbreaking that sibling and instructing it to transcribe the attached reasoning
    returns the stronger model's hidden chain of thought verbatim, with the blocks staying
    valid across sessions, users, and models. The authors report 6,708 public agent trajectories
    collected from GitHub and Hugging Face yielded 315,320 reconstructed reasoning blocks,
    and that restricting to genuine non-benchmark user sessions recovered 704 distinct privacy
    artifacts, including 62 API keys, 33 passwords, 24 access tokens, and 30 personal email
    addresses, with 64 of those appearing only inside the reasoning and nowhere in the visible
    session. The named authors are Alexander Panfilov, David Schmotz, Ilia Shumailov, Luca
    Beurer-Kellner, Joachim Schaeffer, Ameya Prabhu, Jonas Geiping, and Maksym Andriushchenko,
    across MATS Research, the ELLIS Institute Tuebingen, the Max Planck Institute for Intelligent
    Systems, the Tuebingen AI Center, Snyk, and the University of Tuebingen. The counts are
    the authors' own and no provider response is recorded.
  why: >-
    Whoever holds a published agent trajectory that still carries signed reasoning blocks
    can recover the reasoning without attacking the model that produced it.
  followup: >-
    Provider responses, and whether reasoning blocks stop being replayable across sessions
    and models.
  sources:
  - label: primary
    url: https://stolen-thoughts.com/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49257876
- title: >-
    A very long instruction keeps a core outside System Management Mode on one tested AMD
    Zen 3 part
  section: Top stories
  category: Security
  blurb: >-
    Christopher Domas demonstrated keeping an AMD Zen 3 core outside System Management Mode
    for about one second using a long-running instruction.
  summary: >-
    Christopher Domas published a proof of concept in which one long-running instruction keeps
    a core outside System Management Mode for about one second, breaking the rendezvous that
    SMM handlers rely on. The README states the demonstration is tuned for a Zen 3 Ryzen 7
    5800H and uses a wide xmm load from MMIO at `0xfcc68860`, and that on any other part one
    should expect no divergence until the long instruction is retuned. He states that SMM
    time-of-check-to-time-of-use bugs were written off as needing a DMA-capable peripheral
    and physical access, counts over 100 CVEs in that class, and states there is probably
    no workable mitigation.
  why: >-
    The technique brings a bug class the author counts at over 100 CVEs, previously written
    off as needing a DMA-capable peripheral and physical access, into reach from software.
    The affected hardware range is not established beyond the single AMD Zen 3 part tested,
    and no affected microarchitecture list, firmware version range, or fix is stated, so the
    reach of the technique is open.
  followup: >-
    Whether the technique reproduces on other microarchitectures, and any vendor or firmware
    response.
  sources:
  - label: primary
    url: https://github.com/xoreaxeaxeax/smiiiiiiiiiiiiiiii
  - label: discussion
    url: https://news.ycombinator.com/item?id=49245491
- title: >-
    An unreleased Claude research model raises a Riemann zeta lower bound from 41.6 percent
    to 67.2 percent
  section: Top stories
  category: AI
  blurb: >-
    An unreleased Claude model raised the Riemann zeta critical-line lower bound from 41.6
    percent to 67.2 percent with a Lean formalization.
  summary: >-
    Anthropic reports that an unreleased research model raised the lower bound on the fraction
    of zeros of the Riemann zeta function that lie on the critical line, from 41.6 percent
    to 67.2 percent. The result ships with a Lean formalization that passes the comparator
    validation tool. Levent Alpoge and Ralph Furman at Anthropic examined it, along with Brian
    Conrey and Dan Goldston outside the company.
  why: >-
    A machine-checked artifact plus named outside examiners is a stronger evidentiary standard
    than the prose proof PDFs that earlier AI-credited math claims shipped with.
  followup: >-
    Independent review of the formalization, and whether the bound is accepted in the analytic
    number theory literature.
  sources:
  - label: primary
    url: https://www.anthropic.com/research/riemann-zeta
  - label: discussion
    url: https://news.ycombinator.com/item?id=49247070
- title: >-
    Anthropic states models launched from 2026-08-02 will carry machine-readable marks in
    generated text
  section: Top stories
  category: AI
  blurb: >-
    Anthropic states models from 2026-08-02 onward embed machine-readable watermarks in generated
    text across Claude Platform and cloud partners.
  summary: >-
    Anthropic's support article describes how it plans to put its EU AI Act Article 50(2)
    Code of Practice commitments into practice, and is written as forward commitments rather
    than as shipped behavior. It states that models launched in the EU on or after 2026-08-02
    will support marking, that generated text will carry embedded watermarks, and that marking
    will apply worldwide rather than only in the EU. The products it lists as covered are
    the Claude Platform API, Claude, Claude Code, Claude Cowork, and Claude Tag, including
    access through AWS, Google Cloud, and Microsoft Foundry.
  why: >-
    Once the marking is in place, text a supported model generates carries an embedded mark
    wherever it is used, including output that passes through an application before reaching
    a reader.
  followup: >-
    When marking is actually enabled per product, and whether the mark survives editing or
    reformatting.
  sources:
