- title: >-
    Cactus releases Needle 2, a 45M-parameter tool-calling model in a 14MB binary under Apache
    2.0
  section: AI
  category: AI
  blurb: >-
    Cactus released Needle 2, a 45M-parameter tool-calling model in a 14MB binary with 28MB
    RAM and 256-token context under Apache 2.0.
  summary: >-
    Cactus states Needle 2 is 45M parameters compressed to CQ2-bit, shipping as a single 14MB
    binary with a 28MB session RAM ceiling from a 256-token sliding attention window, which
    puts it on ESP32-S3 and Cortex-M class parts, with weights on Hugging Face under Apache
    2.0. Reported speeds are 500 tokens per second decode on a Raspberry Pi 5 and 300 to 700
    on sub-200-dollar phones. The evaluation names five public benchmarks (Google Mobile Actions,
    DroidCall, Seal-Tools in-domain and out-of-domain, BFCL v4 single-turn), scores them as
    ordered strict exact match, and states Needle numbers are measured end-to-end through
    the shipped engine at deployment precision while baselines run at f16 under vLLM.
  why: >-
    Tool calling at this footprint puts the routing decision on microcontroller-class hardware,
    though the numbers are vendor-run and not independently reproduced.
  followup: >-
    Whether an independent party reproduces the benchmark scores or the on-device throughput.
  sources:
  - label: primary
    url: https://cactuscompute.com/needle
  - label: discussion
    url: https://news.ycombinator.com/item?id=49246804
- title: >-
    A foundation-model oracle finds 13 behavioral-change bugs in the Rope Python refactoring
    library
  section: ML research
  category: Paper
  blurb: >-
    Researchers used a foundation model as a test oracle and found 13 behavioral-change bugs
    in the Rope Python refactoring library.
  summary: >-
    The authors use a foundation model as a test oracle to decide whether a refactoring preserves
    program behavior, and report 13 behavioral-change bugs found in the Rope Python refactoring
    library. They report 12 of their 13 issue reports accepted by Rope's developers.
  why: >-
    Rope backs refactoring in several Python editor integrations, so refactorings assumed
    to preserve behavior did not.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2608.09919
- title: >-
    A MITM proxy capture reports GitHub Copilot querying a local SQLite session store and
    sending .env contents as completion context
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    A MITM proxy analysis found GitHub Copilot querying a local SQLite session store and including
    .env file contents in completion requests.
  summary: >-
    The author put GitHub Copilot behind a MITM proxy and reports a `session_store_sql` tool
    backed by a local `session-store.db` that holds prompts and model responses from past
    sessions. The post also reports a completion request that carried a value from a `.env`
    file while the author was typing in an unrelated file, with Copilot completions already
    disabled for `.env`. The evidence is one author's captures on one machine, published 2026-08-04,
    and GitHub has not confirmed it.
  why: >-
    If the capture holds, disabling completions for a file extension does not keep that file's
    contents out of requests triggered elsewhere.
  followup: A GitHub statement, or an independent reproduction of the capture.
  sources:
  - label: primary
    url: https://www.lighthousenewsletter.com/p/i-put-github-copilot-behind-a-mitm
  - label: discussion
