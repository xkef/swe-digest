- title: >-
    A process-scoped Metal capability shim raises llama.cpp inference inside a macOS VM to
    near bare-metal speed
  section: Apple platforms
  category: Apple
  blurb: >-
    A process-scoped Metal capability shim raised llama.cpp inference speed inside a macOS
    VM from 432 to 4,787 tokens per second.
  summary: >-
    Apple's Virtualization.framework reports a conservative Metal capability profile to a
    macOS guest, so llama.cpp selects slower kernels than the host GPU can run. The post describes
    a process-scoped shim that changes two reported answers, the Apple family enum and the
    threadgroup memory limit, moving TinyLlama prompt processing from 432 to 4,787 tokens
    per second on one M1 Ultra host and reaching 98.25 percent of the bare-metal result. It
    publishes the build scripts, raw logs, and checksums, and states that the method relies
    on private, version-sensitive guest Metal behavior, that MLX-LM showed no gain, and that
    validation covers one host and guest pair only.
  why: >-
    The GPU penalty for running model inference inside a macOS VM comes from a reported capability
    profile rather than from the virtualized hardware.
  followup: >-
    Whether the shim survives macOS updates and whether it reproduces on other host and guest
    pairs.
  sources:
  - label: primary
    url: https://github.com/trycua/cua/blob/main/blog/gpu-passthrough-macos-vms.md
  - label: discussion
    url: https://news.ycombinator.com/item?id=49259339
- title: >-
    antirez publishes h3.c, a native Metal implementation of MiniMax-H3 video inference for
    Apple Silicon
  section: Apple platforms
  category: Apple
  blurb: >-
    Antirez published h3.c, a native Metal implementation of MiniMax-H3 video inference with
    measured speed and quality trade-offs on M5 Max.
  summary: >-
    The MIT-licensed repository implements prompt-to-video and audio, first and last frame
    conditioning, and ordered Ref2VA image, video, and audio references end to end in Metal.
    The README documents speed and quality as independent knobs with measured costs: a four-pass
    denoise took about 3.5 seconds on M5 Max against 26.4 seconds for a 29-pass reference,
    at 0.556 full-video SSIM on the fox test and 0.547 on an independent surfer test, and
    token reduction cut one profile from 16.69 to 12.60 seconds. It also records what failed,
    including tail-heavy schedules that produced woven texture and clipped colors, and the
    combination of 40 layers with reuse 3 plus token reduction that produced color ringing
    and ghosted limbs.
  why: >-
    Video inference runs on Apple Silicon through Metal directly, with the quality cost of
    each speedup measured against a reference rather than asserted.
  sources:
  - label: primary
    url: https://github.com/antirez/h3.c
  - label: discussion
    url: https://news.ycombinator.com/item?id=49252179
- title: VectorWare compiles Rust portable SIMD to GPU warp instructions
  section: Engineering posts
  category: Engineering post
  blurb: >-
    VectorWare demonstrated compiling Rust portable SIMD to GPU warp instructions, mapping
    lanes onto NVIDIA warp lanes with one-to-one costs.
  summary: >-
    The post describes compiling Rust's `core::simd` to GPU warp instructions, mapping SIMD
    lanes onto warp lanes, reductions onto warp shuffles, and mask queries onto vote and ballot
    instructions. It states the mapping is one to one only when the vector width matches the
    hardware warp width, which is 32 lanes on NVIDIA.
  why: >-
    Portable SIMD code can target a GPU without a separate kernel language, at a cost that
    depends on matching the warp width.
  sources:
  - label: primary
    url: https://www.vectorware.com/blog/simd-on-gpu/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49247477
- title: >-
    Manus separates from Meta and will delete data that some users generated since the acquisition
  section: Markets and companies
  category: Markets
  blurb: >-
    Manus announced separation from Meta and will delete user data generated since acquisition
    between 2026-08-23 and 2026-08-24 SGT.
  summary: >-
    Manus states that Meta acquired it on 2025-12-29 and that it is returning to independent
    operation. It states that data generated by certain users on or after that date will be
    deleted from 08:00 on 2026-08-23 through 2026-08-24 SGT to meet regulatory requirements
    in specific jurisdictions, that the backup window closes at 07:59 SGT on 2026-08-23, and
    that restoration opens at 08:00 SGT on 2026-08-25, with affected accounts inaccessible
    in between. Manus states this is not the result of a security incident.
  why: >-
    Teams with Manus in a workflow have a dated action and a two-day outage to plan around.
  followup: Whether the deletion and restoration windows hold as stated.
  sources:
  - label: primary
