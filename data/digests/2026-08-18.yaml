- title: GIMP details a new project file format and PSD descriptor support for 3.3.2
  section: Developer tools
  category: Dev tools
  blurb: >-
    GIMP 3.3.2 introduces a new zipped XML format to replace XCF, allowing partial saves for
    auto-save feasibility, keeping XCF loading supported.
  summary: >-
    The 2026-08-16 development update covers work landing in GIMP 3.3.2, the first development
    release toward 3.4. There is no 3.3.2 release yet, and a stable 3.2.6 is planned first.
    The largest item is a new zipped XML project format to succeed XCF, which has been the
    primary format since 1997 and does not handle very large projects or the planned multi-page
    and animation features, and the new format allows partial rather than whole-file saves,
    which makes auto-save feasible. XCF loading stays supported in all future versions, but
    new features will only be saved in the new format once it is finalized. PSD import gained
    Descriptor parsing, so text layers are now editable and several adjustment layers and
    layer styles map to GEGL equivalents, and other changes include non-destructive filters
    on layer masks, an editable Gradient filter in the filter stack, and native platform file
    chooser dialogs replacing the GTK one.
  why: >-
    Projects using new GIMP features will only save in the new format, so interchange with
    older GIMP versions and other tools depends on how that format lands.
  followup: >-
    Track the 3.3.2 release and whether the new project format is finalized in the 3.4 cycle.
  sources:
  - label: GIMP development update, 2026-08-16
    url: https://www.gimp.org/news/2026/08/16/dev-update-august-2026/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49326156
- title: >-
    Bluesky renders its iOS logo through a secure-text-entry field that iOS blanks on screenshot
  section: Apple platforms
  category: Apple
  blurb: >-
    Bluesky's iOS app renders its Follow button in a secure field iOS blanks on screenshot,
    revealing a hidden logo never visible normally.
  summary: >-
    The Bluesky iOS app renders the Follow button into the layer of a `UITextField` with `isSecureTextEntry`
    set to true. iOS blanks that layer when a screenshot is taken, revealing a Bluesky logo
    underneath that is never visible in normal use. The author locates the code in `GrowthHack.tsx`,
    added in January 2026, and reports it relies on the `expo-privacy-sensitive` package by
    the same author. Non-iOS platforms render the content unmasked. Telegram secret chats
    and Signal use the same technique, which is the ground for the author's expectation that
    Apple will not change the behavior. The post is dated 2026-08-16, and the author states
    he is not an iOS developer and that his explanation of the app-switch case is inference.
  why: >-
    An API built to keep sensitive fields out of screenshots is being used as a branding hook,
    so screenshot redaction on iOS is not a reliable signal that a field holds a secret.
  sources:
  - label: timmarinin.net, 2026-08-16
    url: https://timmarinin.net/2026/bluesky-screenshots/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49338459
- title: >-
    AMD VRAM overcommit work is queued for Linux 7.3, with the eviction deadlock fix still
    outstanding
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    AMD VRAM overcommit is queued for Linux 7.3, though the eviction deadlock fix remains
    outstanding, addressing TTM eviction ping-pong.
  summary: >-
    The author's earlier VRAM management patches are merged upstream and queued for Linux
    7.3. The remaining failure is that TTM does not use the `drm_exec` wound-wait helper,
    so an `-EDEADLCK` raised while evicting during command submission is returned as `-ENOMEM`
    and fails the submission instead of retrying the transaction. The author rebased and resent
    the 2024 patchset for that with fixes, and states it still needs more work before it can
    be merged, so this part is not in 7.3. The post separately measures that display scanout
    buffers must be physically contiguous in VRAM, which drove up to 4 GiB of eviction to
    place roughly 32 MiB of scanout data, and describes hard and soft throttle heuristics
    added to stop eviction ping-pong between a game and the compositor.
  why: >-
    Exceeding physical VRAM should cost performance and not stability, and the post shows
    why it currently costs both.
  followup: Track whether the `drm_exec` conversion for TTM lands after 7.3.
  sources:
  - label: pixelcluster.dev write-up
    url: https://pixelcluster.dev/VRAM-Overcommit/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49342719
