- title: Anthropic reports degraded performance for Claude Opus 5 and Sonnet 5
  section: Outages
  category: Outage
  blurb: >-
    Anthropic reported degraded performance for Opus 5 and Sonnet 5 from 13:56 to 15:29 UTC
    on 2026-08-17, overlapping the GitHub outage.
  summary: >-
    Anthropic opened the incident at 13:56 UTC on 2026-08-17 for elevated errors on requests
    to Claude Opus 5. It reported at 14:25 UTC that Opus 5 was operational while Sonnet 5
    remained degraded, implemented a fix at 14:39 UTC, and resolved the incident at 15:29
