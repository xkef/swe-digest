date: '2026-08-18'
stories:
- title: >-
    Cursor launches Origin code hosting, and the GitHub outage degrades it on the same day
  section: Top stories
  category: Dev tools
  blurb: >-
    Cursor launched Origin code hosting on 2026-08-17, but faced degraded performance the
    same day from upstream GitHub outage.
  summary: >-
    Cursor began rolling out Origin on 2026-08-17 in early beta to all paid plans, except
    enterprise organizations whose admins opt out. It ships repositories, pull requests, code
    browsing, and GitHub sync, with two-way comment sync on synced pull requests and integrations
    for Vercel, Depot, and Buildkite. Cursor states that for synced repositories GitHub remains
    the source of truth and pushes continue to go there, so Origin is a second surface rather
    than a migration for those repositories. On the same day, Cursor's status page reported
    Automations, Review Agents, Cloud Agents, and Origin degraded from 14:34 to 20:40 UTC,
    and named the GitHub degradation as the upstream cause. GitHub marked that incident resolved
    at 21:15 UTC, seven and a half hours after opening it at 13:40 UTC, and states a detailed
    root cause analysis will be published later.
  why: >-
    A code-hosting alternative that keeps GitHub as the source of truth for synced repositories
    inherits GitHub's availability, which the launch day demonstrated.
  followup: >-
    Track whether Origin gains a path that does not depend on GitHub sync, the general availability
    date, and the root cause analysis GitHub says it will publish.
  sources:
  - label: Cursor changelog
    url: https://cursor.com/changelog/origin-code-hosting
  - label: Cursor status incident
    url: https://status.cursor.com/incidents/l9h9vrd726jv
  - label: GitHub Status incident
    url: https://www.githubstatus.com/incidents/zkxwbgr0cnmx
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49334209
  - label: second HN thread
    url: https://news.ycombinator.com/item?id=49336919
- title: OpenRouter lists GPT-5.6 Sol at half price on the OpenAI provider route
  section: Top stories
  category: AI
  blurb: >-
    OpenRouter lists GPT-5.6 Sol at 50 percent off via OpenAI provider route at 2.50 dollars
    per million input tokens against list price.
  summary: >-
    The OpenRouter model page shows the OpenAI provider row marked 50 percent off, with input
    falling from 5.00 to 2.50 dollars per million tokens, output from 30.00 to 15.00 dollars
    per million, and cache reads from 0.50 to 0.25 dollars per million. The provider table
    carries five rows. The plain Azure row is at the undiscounted 5.00, 30.00, and 0.50 dollars
    per million, and the Azure EU, Azure US, and Amazon Bedrock US rows are above that at
    5.50, 33.00, and 0.55 dollars per million. The model carries a 1,050,000 token context
    and was released on 2026-07-09, and OpenRouter lists Codex, Hermes Agent, pi, Claude Code,
    and OpenClaw as its largest consumers by token volume. This is marked developing because
    the discount was verified only from the marketplace listing, no OpenAI announcement of
    a price change was located, and marketplace promotions can be time-boxed.
  why: >-
    Agent tooling billed per token through the OpenAI route pays half the listed rate, while
    every other listed route for the same model is at or above list price.
  followup: Check for an OpenAI price announcement and whether the discount expires.
  sources:
  - label: OpenRouter model page
    url: https://openrouter.ai/openai/gpt-5.6-sol
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49337602
- title: Paper describes GPU offload built into rustc using LLVM's Offload infrastructure
  section: Top stories
  category: Paper
  blurb: >-
    A paper describes GPU offload built into rustc using LLVM's infrastructure, removing the
    unsafe boundary current Rust GPU work requires.
  summary: >-
    The paper was submitted to arXiv on 2026-08-13 as cs.PL by Manuel S. Drehwald, Marcelo
    Dominguez, Kevin Sala, Alan Aspuru-Guzik, and Johannes Doerfert. It presents a multi-vendor
    GPU compilation framework built natively into the Rust compiler and LLVM backends rather
    than a vendor-locked DSL or an escape to unsafe raw pointers, and it uses Rust's ownership
    and strict aliasing guarantees to optimize data transfers through LLVM's Offload infrastructure.
    The authors introduce a two-pass compilation pipeline to handle cross-vendor ABI lowering
    mismatches between host and device targets, and evaluate on RAJAPerf with kernel performance
    reported as competitive with hand-optimized CUDA and HIP C++ baselines. The measurements
    are the authors' own and have not been independently reproduced, and this is a paper rather
    than a shipped rustc feature.
  why: >-
    GPU offload reaching Rust through the compiler itself would remove the unsafe pointer
    boundary that current Rust GPU work depends on.
  followup: Track whether any of this lands as an upstream rustc or LLVM proposal.
  sources:
  - label: arXiv 2608.13759, submitted 2026-08-13
    url: https://arxiv.org/abs/2608.13759
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49334991
- title: >-
    llama.cpp begins tagging semantic-version releases alongside its b-number nightlies
  section: AI
  category: AI
  blurb: >-
    llama.cpp tagged v0.1.0 and v0.1.2 to begin semantic versioning alongside b-number nightlies,
    though versioning is not yet settled.
  summary: >-
    llama.cpp tagged v0.1.0 on 2026-08-17 and published v0.1.2 at 10:23:10 UTC on 2026-08-18.
    The v0.1.0 release page renders navigation chrome and an empty release body, so the release
    fields were read from the releases API instead. v0.1.2 is marked prerelease, the b-number
    nightly b10488 is still the latest non-prerelease build, and ggml discussion 1579, opened
    by ggerganov on 2026-08-07, states that semantic versioning for llama.cpp is not yet implemented,
    which is the ground for the developing status. The bump rules and cadence proposed in
    that thread are maintainer discussion rather than settled policy.
  why: >-
    Distributions and package managers currently pin a 125,000-star inference runtime to nightly
    commit-number builds, and a Debian maintainer in the thread states that a version scheme
    guaranteeing the vendored ggml copy matches a released ggml is what would let llama.cpp
    ship as a library with a SOVER in public search paths.
  followup: >-
    Track whether semantic versioning becomes the non-prerelease channel and whether the b-number
    nightlies are retired.
