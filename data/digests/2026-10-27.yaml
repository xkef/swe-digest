- title: JetBrains IDEs 2026.3 replace the JediTerm terminal emulator with libghostty
  section: Developer tools
  category: Dev tools
  blurb: >-
    JetBrains IDEs 2026.3 replace the JediTerm terminal emulator with libghostty, adding Kitty
    keyboard protocol and theme change notifications.
  summary: >-
    Starting with 2026.3, the built-in terminal in JetBrains IDEs uses libghostty for parsing
    and terminal state, while the IDE keeps rendering. It adds the Kitty keyboard protocol,
    so Shift+Enter works in agents like Claude Code and Codex, answers dark and light theme
    queries with mode 2031 notifications, and handles almost 50 control sequences JediTerm
    ignored or misread. Users can revert with the terminal.use.ghostty.emulator registry key.
  why: >-
    TUI tools and coding agents in the IDE terminal now get key combinations and theme signals
    that match standalone terminals.
  sources:
  - label: primary
    url: https://blog.jetbrains.com/platform/2026/10/jetbrains-terminal-now-uses-ghostty/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50260714
- title: >-
    CPython's experimental JIT faces removal from main after its authors withdraw PEP 836
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The authors of PEP 836 withdrew it, so CPython's experimental JIT from 3.13 is expected
    to leave the main branch early in the 3.16 cycle.
  summary: >-
    On 2026-10-19 Savannah Ostrowski announced the withdrawal of PEP 836, the proposal for
    a supported CPython JIT, citing a lack of personal bandwidth after the steering council
    asked for more detail on support, performance, security and compatibility. The council
    had set a six-month deadline in June, after which the JIT code would be removed from main.
    LWN reports removal is likely soon, and the reference implementation will be linked from
    the withdrawn PEP.
  why: >-
    Anyone testing or packaging CPython builds with the experimental JIT should plan for it
    to disappear from 3.16 development builds.
  followup: Removal of the JIT code from CPython main during the 3.16 development cycle.
  sources:
  - label: primary
    url: https://lwn.net/SubscriberLink/1102102/0c00e4d550f25f8c/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50257419
