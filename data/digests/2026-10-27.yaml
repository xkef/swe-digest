- title: >-
    Debian developer stops NEW uploads after the queue starts adding unannounced LLM reviews
  section: AI
  category: AI
  blurb: >-
    Debian's NEW queue now attaches an LLM-generated review to uploads, and one developer
    has stopped using NEW until an opt-out exists.
  summary: >-
    On 2026-10-26 Johannes Schauer Marin Rodrigues wrote on debian-devel that uploads to the
    NEW queue now get an LLM-based review labeled as produced by a Debian Inference workflow
    and not checked by the team. He argues that this counts as a large-scale automated action
    that the project's recent generative AI resolution says needs prior discussion. He will
    not upload to NEW until developers can opt out, and he would prefer that the review be
    opt-in.
  why: >-
    It shows a major distribution putting LLM review into a core packaging gate, and the governance
    fight over consent and reproducibility that follows.
  sources:
  - label: primary
    url: https://lists.debian.org/debian-devel/2026/10/msg00263.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50256738
- title: >-
    OpenAI publishes a model-generated claim that the Exponential Time Hypothesis is false
  section: ML research
  category: Paper
  blurb: >-
    OpenAI published a model-generated argument and Lean formalization claiming the Exponential
    Time Hypothesis is false, pending outside review.
  summary: >-
    OpenAI posted a preprint dated 2026-10-25 in its openai/math repository arguing that ETH
    is false, one of three results announced on 2026-10-26 alongside work on the Kakeya conjecture
    and quantum chromodynamics. RuntimeWire reports the release includes a Lean formalization
    and asks computer scientists to examine it.
  why: >-
    If the result holds, many hardness assumptions behind algorithm lower bounds and fine-grained
    complexity results would need revisiting.
  followup: Independent review of the proof and the Lean formalization.
  sources:
