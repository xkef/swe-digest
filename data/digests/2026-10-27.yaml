- title: >-
    Wiz sees PHP2Shell exploit attempts fail in its telemetry as vulnerable exposure falls
    about 67 percent
  section: Security
  category: Security
  blurb: >-
    Wiz honeypots caught public PHP2Shell kits exhausting PHP memory but failing to leak addresses,
    while exposed vulnerable hosts dropped sharply.
  summary: >-
    Wiz reports that the number of exposed PHP2Shell-vulnerable machines fell about 67 percent
    in the week after disclosure on 2026-10-21, and that fewer than 53 percent of initially
    affected organizations remain vulnerable. Public exploit kits reached memory exhaustion
    but failed the memory leak stage, because the kits were tuned to a specific php:8.4.26-apache
    image and need consecutive requests to land on the same worker. Wiz notes that CISA has
    added PHP2Shell to its KEV list and publishes IOCs.
  why: >-
    Exploitation currently depends on the deployment, with single-worker mod_php setups most
    at risk, so patching remains the fix and the published IOCs can be used for log hunting.
  comments: >-
    The HN thread discusses how much the result depends on configuration, given that another
    researcher's single-worker honeypot was successfully exploited.
  thread: f-0083
  sources:
  - label: primary
    url: https://www.wiz.io/blog/php2shell-exploitation-so-far
  - label: discussion
    url: https://news.ycombinator.com/item?id=50259343
- title: >-
    Go security team details its first URGENT release distrusting the weak eMudhra intermediates
  section: Security
  category: Security
  blurb: >-
    Go's security team explains how Go 1.27.3 and 1.26.10 shipped in under 7.5 hours to distrust
    the weak eMudhra intermediates.
  summary: >-
    Go was alerted on 2026-10-19 at 11:45 PDT and published Go 1.27.3 and 1.26.10 at 19:13
    PDT, blocking certificates that chain to the eight eMudhra intermediates whose private
    keys could be recovered in microseconds. Go acted at the runtime level because its Linux
    verifier has no platform revocation mechanism, and it plans revocation parity on Linux,
    including possible upki support. Binaries must be rebuilt with the new releases, and govulncheck
    in binary mode can detect affected builds.
  why: >-
    Go binaries talking TLS on Linux stay exposed to forged certificates until they are rebuilt
    with Go 1.27.3 or 1.26.10.
  thread: f-0077
  sources:
  - label: primary
    url: https://go.dev/blog/emudhra-incident
  - label: primary
    url: https://tailscale.com/security-bulletins
  - label: discussion
    url: https://www.reddit.com/r/golang/comments/1xgvjsu/our_response_to_the_emudhra_key_disclosure/
- title: >-
    OpenAI releases GPT-6.1 Terra, a midrange model for visual reasoning and computer use
  section: AI
  category: AI
  blurb: >-
    OpenAI's new midrange model targets visual reasoning and computer use at $1 per million
    input tokens and $5 per million output tokens.
  summary: >-
    OpenAI introduced GPT-6.1 Terra on 2026-10-26 as a fast, efficient model for visual reasoning,
    computer use and writing. Simon Willison reports the price is about half that of GPT-5.6
    Terra and GPT-6.1 Sol and around 10 times GPT-6 Luna. An OpenAI engineer said on Hacker
    News it is similar to Astra and Sol on vision and computer use but faster, and a bit worse
    on most other tasks.
  why: >-
    Teams running computer-use or vision agents at volume get a cheaper tier between Luna
    and Sol to test.
  comments: >-
    OpenAI's Ted Sanders described Terra in the thread as a midrange API option rather than
    a major release for subscribers.
