- title: >-
    Microsoft documents the Type Server Protocol for querying Python type analysis over JSON-RPC
  section: Developer tools
  category: Dev tools
  blurb: >-
    Microsoft documents a JSON-RPC protocol that lets tools query a Python type server for
    computed, declared and expected types per snapshot.
  summary: >-
    The Type Server Protocol, now at version 0.4.1, uses LSP data shapes and typeServer methods
    for snapshots, search paths, import resolution and type queries. Results are bound to
    monotonically increasing snapshots, stale requests fail with a retryable ServerCancelled
    error, and optional read-only extra IPC connections allow concurrent queries.
  why: >-
    Editor and tool authors can consume Python type information from a type server without
    reimplementing a type checker, though 0.x minor versions may still break.
  sources:
  - label: primary
    url: https://github.com/microsoft/pylance-release/blob/main/docs/tsp/type-server-protocol.md
  - label: discussion
    url: https://news.ycombinator.com/item?id=50248371
- title: >-
    Anthropic files S-1 disclosing up to $120.5B in SpaceX GPU compute commitments through
    2029
  section: Markets and companies
  category: Markets
  blurb: >-
    Anthropic's IPO filing commits up to $120.5B for SpaceX GPU compute through 2029, cancelable
    on 90 days notice after early 2027.
  summary: >-
    Anthropic filed its Form S-1 with the SEC on 2026-10-26. According to TeslaNorth's reading
    of the filing, agreements with SpaceX.AI LLC for NVIDIA GPU compute total up to $120.5
    billion, about $3.1 billion a month once capacity is fully delivered in December 2026,
    with non-cancelable periods ending in January and March 2027. The filing also lists Microsoft,
    Nscale and Lambda as GPU providers.
  why: >-
    The filing puts hard numbers on the compute dependencies behind Claude capacity and pricing,
    which teams building on the API can now weigh.
  followup: An amended S-1 with a price range and the listing date.
  thread: f-0130
