- title: >-
    Microsoft documents the Type Server Protocol for querying Python type analysis over JSON-RPC
  section: Developer tools
  category: Dev tools
  blurb: >-
    Microsoft documents a JSON-RPC protocol that lets tools query a Python type server for
    computed, declared and expected types per snapshot.
  summary: >-
    The Type Server Protocol, now at version 0.4.1, uses LSP data shapes and typeServer methods
    for snapshots, search paths, import resolution and type queries. Results are bound to
    monotonically increasing snapshots, stale requests fail with a retryable ServerCancelled
    error, and optional read-only extra IPC connections allow concurrent queries.
  why: >-
    Editor and tool authors can consume Python type information from a type server without
    reimplementing a type checker, though 0.x minor versions may still break.
  sources:
  - label: primary
    url: https://github.com/microsoft/pylance-release/blob/main/docs/tsp/type-server-protocol.md
  - label: discussion
    url: https://news.ycombinator.com/item?id=50248371
- title: >-
    Ghostty 1.4.0 ships with ten security advisories, full Kitty graphics support and scrollback
    compression
  section: Developer tools
  category: Dev tools
  blurb: >-
    Ghostty 1.4 fixes ten advisories, including OSC 8 link command execution on macOS, and
    adds full Kitty graphics and scrollback compression.
  summary: >-
    Ghostty 1.4.0, released 2026-10-27, fixes ten GitHub security advisories, including malicious
    Kitty graphics commands that could read or delete files, tmux control mode crashes, and
    macOS cmd-click OSC 8 links that could lead to command execution. It compresses idle scrollback
    to cut its resident memory 70 to 90 percent, raises the default scrollback limit to 50
    MB, adds a ghostty +ssh wrapper, and moves the GTK renderer to EGL with DMABUF export.
    GTK builds now require GTK 4.18 and libadwaita 1.7, which rules out Ubuntu 24.04 LTS,
    and copy-on-select defaults to none on macOS.
  why: >-
    Upgrade to pick up the fixes for output-triggered crashes and file access, and check copy-on-select
    and keybind configs for the breaking changes.
  sources:
