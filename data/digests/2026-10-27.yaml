- title: >-
    Cloudflare discloses cross-request KV cache exposure in GLM-5.3 on Workers AI caused by
    an SGLang bug
  section: Top stories
  category: Security
  blurb: >-
    An SGLang bug on Workers AI let 155 GLM-5.3 responses include text from other customers'
    requests between 2026-08-27 and 2026-09-09.
  summary: >-
    Cloudflare says prompts longer than 681,280 tokens overflowed the prefill KV pool, and
    SGLang in disaggregated prefill and decode mode replaced them with a one-token placeholder,
    so decode attended over stale pages from earlier requests. A researcher from Knostic reported
    it on 2026-09-08 and Cloudflare restored the model on 2026-09-09 with a larger pool and
    a patched engine. The fix is upstream in SGLang v0.5.21 and Cloudflare found no evidence
    of deliberate exploitation.
  why: >-
    Anyone self-hosting SGLang with disaggregated serving should upgrade and check KV pool
    size against the advertised context length, since inference engines do not zero cache
    pages between tenants.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/kv-cache-exposure-remediation/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50252159
- title: >-
    Warp says attackers used a vendor flaw to reach agent trace and telemetry data for up
    to 1% of users
  section: Top stories
  category: Security
  blurb: >-
    Warp's CEO says attackers exploited a vendor in its infrastructure and reached agent trace
    and telemetry data for up to about 1% of users.
  summary: >-
    Zach Lloyd wrote on 2026-10-26 that Warp detected the exploitation on Friday within hours
    and remediated it. He said the attack appears to have come from an agent swarm that likely
    started with a hole in a vendor dependency, and that Warp has notified identified users
    and engaged CrowdStrike and law enforcement.
  why: >-
    Warp users should watch for a notification and treat agent traces sent to the terminal
    vendor as potentially exposed data, including any secrets those traces may contain.
  followup: A fuller incident report naming the vendor and the data accessed.
  sources:
  - label: primary
    url: https://twitter.com/zachlloydtweets/status/2114800787716972873
  - label: discussion
    url: https://news.ycombinator.com/item?id=50250168
  thread: f-0132
- title: >-
    RustSec publishes Pingora HTTP/2 and header advisories and a batch of zstd-safe soundness
    bugs
  section: Security
  category: Security
  blurb: >-
    RustSec added HIGH advisories for Pingora HTTP/2 memory exhaustion and Connection header
    ACL bypass, plus over a dozen zstd-safe soundness bugs.
  summary: >-
    On 2026-10-26 RustSec listed RUSTSEC-2026-0389 (HIGH) for Pingora HTTP/2 memory exhaustion
    from unbounded default header-list and stream limits, RUSTSEC-2026-0390 (HIGH) for forwarding
    client-nominated Connection headers to HTTP/1 upstreams, and RUSTSEC-2026-0388 (MEDIUM)
    for authority and Host mismatch cache poisoning. The same day it added use-after-free,
    double free and out-of-bounds advisories across zstd, zstd-safe and zstd-sys.
  why: >-
    Services built on Pingora or the zstd crates should run cargo audit and update before
    attackers probe HTTP/2 limits or header handling.
  sources:
  - label: primary
    url: https://rustsec.org/advisories/
- title: Grafana ships 13.3.0 and patch releases back to 12.4.14 fixing multiple CVEs
  section: Security
  category: Security
  blurb: >-
    Grafana's 2026-10-27 releases patch up to ten CVEs in 13.3.0, and every supported branch
    down to 12.4 gets at least three of those fixes.
  summary: >-
    Grafana released 13.3.0, 13.2.5, 13.1.9, 13.0.12 and 12.4.14 on 2026-10-27. All five fix
    CVE-2026-100105, CVE-2026-88858 and CVE-2026-88967, and 13.3.0 lists ten security fixes
    in total. 13.3.0 also renames the marketplace config.ini section to plugins_marketplace,
    a breaking change.
  why: >-
    Self-hosted Grafana operators should move to the patch release for their branch, and anyone
    upgrading to 13.3 should check for the config.ini section rename first.
  sources:
  - label: primary
    url: https://github.com/grafana/grafana/releases/tag/v13.3.0
  - label: primary
