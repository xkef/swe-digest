- title: >-
    Meta describes PrivacyLib, which enforces privacy rules inside data system clients, including
    agent tool calls
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Meta describes PrivacyLib, a library inside clients of hundreds of data systems that runs
    billions of privacy checks per second.
  summary: >-
    PrivacyLib runs inside client libraries and at RPC boundaries for hundreds of Meta data
    and processing systems, mapping each access to read, write, RPC and similar operations
    so enforcing and observing modules such as Policy Zones can plug in without new integration
    work. Requirements are compiled at build time and answered mostly from in-process caches,
    and enforcement ships with each owning service rather than through a fleet-wide config
    push. An Agent Observability module links internal AI agent tool calls to their session
    context so disallowed operations can be blocked.
  why: >-
    It shows a concrete pattern for putting data access controls, including for agents, at
    the client boundary without per-system reimplementation.
  sources:
  - label: primary
    url: https://engineering.fb.com/2026/10/27/security/privacylib/
- title: >-
    Anthropic files S-1 disclosing up to $120.5B in SpaceX GPU compute commitments through
    2029
  section: Markets and companies
  category: Markets
  blurb: >-
    Anthropic's IPO filing commits up to $120.5B for SpaceX GPU compute through 2029, cancelable
    on 90 days notice after early 2027.
  summary: >-
    Anthropic filed its Form S-1 with the SEC on 2026-10-26. According to TeslaNorth's reading
    of the filing, agreements with SpaceX.AI LLC for NVIDIA GPU compute total up to $120.5
    billion, about $3.1 billion a month once capacity is fully delivered in December 2026,
    with non-cancelable periods ending in January and March 2027. The filing also lists Microsoft,
    Nscale and Lambda as GPU providers.
  why: >-
    The filing puts hard numbers on the compute dependencies behind Claude capacity and pricing,
    which teams building on the API can now weigh.
  followup: An amended S-1 with a price range and the listing date.
