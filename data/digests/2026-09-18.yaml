- title: Cisco ISE authentication bypass rated 10.0 is under active exploitation
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Cisco patched CVE-2026-76460, a CVSS 10.0 ISE and ISE-PIC authentication bypass under
    active exploitation.
  summary: >-
    The Cisco advisory covers CVE-2026-76460, an authentication bypass in Identity Services
    Engine and the ISE Passive Identity Connector rated 10.0 that yields unauthenticated remote
    root, with fixes in ISE and ISE-PIC 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch
    7 and 3.5 Patch 4, and ISE 3.0 past end of software maintenance and requiring migration
    instead. Cisco states that no workaround exists and names infrastructure access control
    lists as a temporary mitigation that restricts management and control-plane traffic reaching
    affected systems. The CISA known exploited vulnerabilities catalog carries it with a remediation
    deadline of 2026-09-19, and The Register covers it as another actively exploited Cisco
    zero-day.
  why: >-
    Unauthenticated remote root on a network access control platform is being exploited now,
    and the access control list mitigation only buys time for a deployment that cannot reach
    a fixed patch level before 2026-09-19.
  followup: >-
    Track attacker attribution, dwell time, and an affected-deployment count, none of which
    Cisco has disclosed.
  sources:
  - label: primary
    url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5
  - label: CISA KEV catalog
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  - label: coverage
    url: https://www.theregister.com/security/2026/09/17/cisco-drops-another-exploited-zero-day-this-time-a-perfect-10/5297180
- title: Plugin4Shell gives zero-click code execution in major coding agents
  section: Top stories
  category: Agentic coding
  status: confirmed
  blurb: >-
    Researchers report Plugin4Shell, a zero-click code execution flaw in major coding agents,
    with Gemini CLI and Copilot unpatched.
  summary: >-
    The Register describes a flaw the research firm Air calls Plugin4Shell as a plugin SHA-pinning
    bypass, in which the agent checks out the exact commit the marketplace pinned but never
    verifies the content that landed there, so an attacker controlling the plugin repository
    makes the checkout resolve to malicious code while the pin still reads as honored, reaching
    code execution with no user action. Claude Code 2.1.179 and Codex 0.146.0 are named as
    the fixed versions while Gemini CLI and Microsoft Copilot shipped no patch, and plugin
    auto-update widens the reach, because control of a marketplace then becomes silent code
    execution on every machine that installs from it. Air's own report was not reachable on
    this run, so the account here is The Register's, which carries GitHub's statement that
    the attacks do not affect GitHub because it blocks branch and tag names resembling commit
    SHAs, Air's rebuttal that the mitigation is insufficient because marketplaces can be hosted
    on Bitbucket and Copilot supports those, a second-hand relay that Google told Air it will
    not patch Gemini CLI, and no answer from Microsoft, with no CVE apparently assigned.
  why: >-
    Claude Code and Codex shipped fixes while Copilot and the deprecated Gemini CLI did not,
    which leaves Copilot's Fortune 500 install base without a vendor fix and leaves Gemini
    CLI users with migration to Google's Antigravity environment as the stated path.
  followup: >-
    Track Air's own disclosure, a CVE assignment, and whether Microsoft patches Copilot.
  sources:
  - label: primary
    url: https://www.theregister.com/security/2026/09/17/ai-coding-agents-0-click-rce-flaw-could-hand-attackers-keys-to-the-kingdom/5297335
- title: libheif heap overflow chained through OpenAI SSO to internal repository access
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Hacktron details a libheif heap overflow chained through OpenAI SSO, with Discourse and
    Debian patched since 2026-07-28.
  summary: >-
    Hacktron describes a heap overflow in libheif, reached through a user-supplied HEIF or
    AVIF image that the target service decodes, and chains it through OpenAI single sign-on
    to reach an internal repository, with the writeup rather than the fix being what is new
    today. The post names the affected 1.19.x, 1.20.x, 1.22.x and 1.23.x release families,
    the vulnerable 1.19.7 in the Discourse Docker image and the 1.19.8 shipped by Debian 13,
    and upstream v1.23.4 as the current patched release after v1.23.2 was superseded, while
    the Discourse advisory GHSA-vhm9-85gw-x335, published 2026-07-28 and carrying CVE-2026-32882,
    lists patched versions 2026.7.0, 2026.6.1, 2026.5.2 and 2026.1.6. The chain is corroborated
    outside the researchers' own account by that advisory, by CVE-2026-32882 and by Debian
    DSA-6417-1, while the wider campaign the researchers call HEIF Heist, tracing libheif
    across Slack, Meta, GitHub Enterprise, Ruby on Rails and Node.js frameworks including
    Next.js, Astro and Gatsby, rests on their account alone.
  why: >-
    Any service that decodes user-supplied HEIF or AVIF through libheif needs the current
    security release, and Debian shipped vulnerable versions for months with no CVE to flag
    them.
  followup: >-
    Track independent confirmation of the HEIF Heist claims against the named services and
    frameworks.
  sources:
  - label: primary
    url: https://www.hacktron.ai/blog/hacking-openai
  - label: Discourse advisory
    url: https://github.com/discourse/discourse/security/advisories/GHSA-vhm9-85gw-x335
  - label: discussion
    url: https://news.ycombinator.com/item?id=49749656
- title: Researcher reports ZCode packages full Git history for upload to Aliyun OSS
  section: Top stories
  category: Agentic coding
  status: developing
  blurb: >-
    A researcher reports ZCode packages full Git history for upload to Aliyun OSS, with no
    user setting that stops it.
  summary: >-
    A researcher writing at blog.ferstar.org reports that the ZCode client, from Zhipu, runs
    a snapshot sidecar instantiated at startup, which packages the repository's full Git history
    and, in the post's phrasing, encrypts it under a key only Z.ai holds for upload to Aliyun
    OSS through a zcode.z.ai endpoint, with neither the Optimize Experience toggle nor the
    Repo Snapshot Indexing toggle gating it and a filesystem immutability flag on the checkpoints
    directory named as the only working defence. The post does not show a completed upload:
    the state file it quotes records a 313MB archive sitting in the local pending directory
    with a failure count of 564, and the upload and encryption path is reconstructed from
    the client's decompiled app.asar plus observed socket endpoints. This is one researcher's
    reverse engineering with no vendor statement, the blog states its posts are AI-drafted
    and author-approved, and one commenter on the second thread reports no checkpoints directory
    and no capture logs on a long-running install.
  why: >-
    The payload described is the whole repository lineage rather than the working tree, which
    carries API keys deleted in later commits, unpushed branch names and internal host names
    in .git/config.
  followup: >-
    Track a Z.ai response and any independent reproduction of the sidecar behaviour on a clean
    install.
  comments: >-
    HN commenters on the second thread identify the tokenstead.ai page submitted there as
    an AI paraphrase of the original post, and redirect readers to the thread on the author's
    own blog, which is the primary and the first discussion link here.
  sources:
  - label: primary
    url: https://blog.ferstar.org/en/posts/zcode-silent-workspace-snapshot-upload/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49750694
  - label: second thread
    url: https://news.ycombinator.com/item?id=49752422
