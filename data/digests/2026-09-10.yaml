- title: Procedural Graphs propose self-evolving execution structures for LLM agents
  section: ML research
  category: Paper
  blurb: >-
    A preprint proposes procedure-relation-procedure graphs that agents edit themselves to
    keep long tool-calling runs on target.
  summary: >-
    The paper organizes procedural knowledge into procedure-relation-procedure triplets and
    localizes the agent's active node to bias the next action. An LLM refiner contrasts failed
    and successful trajectories and commits graph edits that hold up on held-out validation.
    The preprint was submitted 2026-09-08 and is not independently reproduced.
  why: >-
    It targets the failure mode where long trajectories lose the objective and repeat unproductive
    tool calls.
  followup: >-
    Independent reproduction, and whether the learned graph edits transfer across task families.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2609.09153
  - label: discussion
    url: https://news.ycombinator.com/item?id=49629868
- title: Cognition releases SWE-2, post-trained from Kimi K3
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Cognition's SWE-2 is post-trained from Kimi K3 and averages 53 steps against SWE-1.7's
    127 on FrontierCode 1.1 Main.
  summary: >-
    Cognition states SWE-2 is post-trained from Kimi K3, a 2.8 trillion parameter model, and
    that its reinforcement learning adds 5 to 6 points on many benchmarks over that base.
    The stated method trains all reasoning-effort levels in one run with a reward of success
    minus a linear cost penalty, tuned per effort level to the local slope of the base model's
    Pareto curve, and the reported behavior change is fewer steps, with a first real edit
    after a median of 18 steps against 48 for SWE-1.7. Every benchmark figure is Cognition's
    own, and the same table puts SWE-2 at 27.3 percent on Terminal-Bench 4 against 55.8 for
    Fable 5.1 and 57.9 for GPT-6 Astra, so the cost-frontier claim does not hold on every
    benchmark it reports.
  why: >-
    A commercial US coding product built on Chinese open weights is a concrete outcome of
    open-weight releases, and SWE-2 is available today in Devin Desktop and CLI.
  sources:
  - label: primary
    url: https://cognition.com/blog/swe-2
  - label: discussion
    url: https://news.ycombinator.com/item?id=49645443
- title: >-
    Forgejo 16.0.4 fixes a critical remote code execution through template repositories
  section: Security
  category: Security
  blurb: >-
    Forgejo 16.0.4 fixes a critical flaw where generating a repository from a malicious template
    runs code on the host.
  summary: >-
    The release notes state that generating a repository from a template clones the template,
    removes the `.git` folder, expands variables in the files listed in `.forgejo/template`,
    then initializes a new git repository, and that variable expansion could be misused to
    create a new `.git` folder that git adopts during initialization, letting a malicious
    template read arbitrary data from the Forgejo host and execute arbitrary processes on
    it. The fix removes any `.git` folder after expansion and before initialization, and the
    release notes name neither an affected version range nor a CVE for this issue. The same
    release fixes an allow-maintainer-edit control that ignored API-specific restrictions,
    so a repo-scoped access token could modify branches outside its permission, and draft
    release attachments that were readable by read-only and unauthenticated callers, the class
    Gitea fixed as CVE-2026-27660.
  why: >-
    The precondition is only that someone generates a repository from an attacker-controlled
    template, which is an ordinary action a self-hosted forge invites any user to take.
  followup: Whether a CVE is assigned to the template execution issue.
  sources:
  - label: release notes
    url: https://codeberg.org/forgejo/forgejo/raw/branch/forgejo/release-notes-published/16.0.4.md
  - label: discussion
    url: https://news.ycombinator.com/item?id=49645907
- title: >-
    A 2023 Docker build argument left a live GitHub admin token in a public Baseten image
  section: Security
  category: Security
  blurb: >-
    A GitHub token in a public Baseten image's build history stayed live for three years with
    admin on key repositories.
  summary: >-
    Strix reports that a scan of baseten.co subdomains found a Harbor registry with one public
    project allowing anonymous listing and pull of `baseten/baseten-app`, whose image config
    carried a GitHub personal access token in a `history[].created_by` entry from a build
    step dated 2023-03-03 that expanded `ARG GITHUB_TOKEN` directly into a `RUN` command.
    The token was still live when tested in July 2026, resolved to `basetenbot` in the `basetenlabs`
    organization with repo scope, and carried admin and push on the product repository, on
    the flux-cd GitOps repository that drives their clusters and on the Homebrew tap that
    distributes their CLI, plus read and write on private repositories, and Strix states it
    stopped at read-only checks. Baseten made the project private and rotated the token on
    2026-07-14, one day after the 2026-07-13 report, and closed the remaining findings on
    2026-07-17.
  why: >-
    Scrubbing a credential from an image's filesystem layers leaves it in the build history,
    which downloads along with the image.
  sources:
  - label: primary
    url: https://www.strix.ai/blog/baseten-harbor-github-pat-takeover
  - label: discussion
    url: https://news.ycombinator.com/item?id=49646752
- title: >-
    Deadbugz MCP server behaves for three tool calls, then poisons its own tool descriptions
  section: Security
  category: Security
  blurb: >-
    A malicious MCP server answers three tool calls normally, then rewrites its tool descriptions
    to exfiltrate SSH and AWS keys.
  summary: >-
    Pillar Security disclosed the campaign on 2026-08-12, reporting that the server keeps
    a per-client call counter and, after three calls, returns tool descriptions that instruct
    the agent to collect SSH keys, AWS credentials, shell history, and Kubernetes configuration,
    and to hide the activity. The three-call trigger and the malicious descriptions are present
    in the public source, which Pillar confirmed by driving the server with harmless text
    requests and matching the gated metadata against that code. Pillar calls the gate a research-evasion
    technique, because a brief inspection or a limited automated test can stay under the threshold
    and see only benign metadata while normal use crosses it. Delivery was 23 pull requests
    opened in 74 minutes on 2026-08-10, of which 17 add the remote endpoint to an MCP configuration
    file, 4 reference a hidden local script, and 2 are directory or listing submissions, and
    at review time 19 were closed and 4 remained open with none merged through GitHub's merge
    mechanism.
  why: >-
    A short trial of an MCP server establishes nothing about what it returns once ordinary
    use passes the trigger count, so evaluation has to run past the point where a quick test
    stops.
  followup: >-
    Whether the four still-open pull requests get merged, and whether other MCP servers use
    the same delayed-payload pattern.
  sources:
  - label: primary
    url: https://www.pillar.security/blog/deadbugz-currently-active-mcp-supply-chain-campaign
  - label: analysis
    url: https://omnafy.com/blog/deadbugz-malicious-mcp-server/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49629181
- title: Open WebUI 0.11.1 fixes an SSRF and two authenticated denial-of-service flaws
  section: Security
  category: Security
  blurb: >-
    Open WebUI 0.11.1 fixes an authenticated SSRF to cloud metadata and two denial-of-service
    flaws any default-role user can trigger.
  summary: >-
    CVE-2026-88001, affecting 0.9.5 through 0.11.0, lets any authenticated user reach excluded
    hosts and cloud metadata endpoints through unvalidated redirect targets, on deployments
    that set AIOHTTP_CLIENT_ALLOW_REDIRECTS to true, which is not the default. CVE-2026-88000,
    affecting 0.10.0 up to 0.11.1, lets any default-role user pin a worker core with a cyclic
    chat history at flat memory, blocking every other request including unauthenticated health
    checks, and the process has to be killed rather than reclaimed. CVE-2026-88002, affecting
    0.5.0 up to 0.11.1, instead grows a list without bound until a memory-capped deployment
    takes an OOM kill, and the malformed chat survives a restart and hangs the new process
    on the next request that walks it until the stored chat is deleted.
  why: >-
    The 0.5.0 floor on CVE-2026-88002 reaches back across most deployed versions, and operators
    who route fetches through a forward proxy have to restrict destinations at the proxy as
    well, because the upgrade to 0.11.1 alone does not cover that path.
  sources:
  - label: GHSA-5x7x-4c3c-qf5w
    url: https://github.com/advisories/GHSA-5x7x-4c3c-qf5w
  - label: GHSA-3cgp-3cqx-j8w2
    url: https://github.com/advisories/GHSA-3cgp-3cqx-j8w2
  - label: GHSA-jqhh-cjmq-vmv6
    url: https://github.com/advisories/GHSA-jqhh-cjmq-vmv6
