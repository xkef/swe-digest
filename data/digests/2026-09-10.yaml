- title: >-
    Microsoft makes Rust a Tier-1 language and ships rustc_codegen_utc for the MSVC backend
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Microsoft declares Rust a Tier-1 language alongside C++, C#, and TypeScript, and builds
    Rust internally with `rustc_codegen_utc`.
  summary: >-
    A Microsoft guest post on the Rust Foundation site states Rust is now a Tier-1 language
    at Microsoft, alongside C++, C#, and TypeScript. It describes `rustc_codegen_utc`, a rustc
    backend that generates code through the MSVC code generation stack rather than through
    a separate Windows-specific path, production-ready since early 2026 and self-hosted since
    Rust 1.90. The rollout is internal, with more than 100 Microsoft project repositories
    building with it today and more adopting it each week, and the post makes no claim of
    availability outside Microsoft.
  why: >-
    Hybrid Rust and C++ projects on Windows get one code generation platform, which brings
    Rust into MSVC hotpatch, ABI, cross-language inlining, and crash-dump workflows without
    a parallel Windows-specific implementation.
  followup: >-
    Whether `rustc_codegen_utc` is released outside Microsoft, and how its output compares
    with the LLVM backend on Windows targets.
  sources:
  - label: primary
    url: https://rustfoundation.org/media/guest-post-rust-is-tier-1-language-at-microsoft/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49643546
- title: JEP 544 proposes storing compiled native code in the Java AOT cache
  section: Languages and runtimes
  category: Languages
  blurb: >-
    JEP 544 would store C1 and C2 native code in the Java AOT cache, taking framework startup
    cuts from 50 to 70 percent up to 65 to 80.
  summary: >-
    JEP 544, owned by John Rose and updated 2026-09-10, is at Candidate status and extends
    the existing AOT cache rather than adding a workflow, following JEP 483 in JDK 24 for
    class loading and linking and JEP 515 in JDK 25 for method profiling. A training run compiles
    hot methods with C1 and C2 and stores the native code, which a production run loads instead
    of recompiling, and on five framework benchmarks run on a two-core Linux and x64 system
    the cache without AOT code cuts startup by 50 to 70 percent against 65 to 80 percent with
    it, while a javac benchmark shows about 30 percent against about 75 percent. Cached code
    is used only when the production run has the same CPU architecture and feature set and
    the same garbage collector, otherwise HotSpot warns and falls back to the interpreter
    and JIT while still using the cached classes and profiles, and only AArch64 and x64 are
    supported initially.
  why: >-
    This is where Project Leyden's cache stops holding preparation work and starts holding
    compiled code, and the reuse constraints decide whether a deployment can rely on it.
  followup: >-
    Whether JEP 544 is targeted to a release, and whether more architectures follow AArch64
    and x64.
  sources:
  - label: primary
    url: https://openjdk.org/jeps/544
  - label: discussion
    url: https://news.ycombinator.com/item?id=49647404
- title: >-
    1.1.1.1 validates post-quantum DNSSEC and refuses to fall back to conventional signatures
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Cloudflare's 1.1.1.1 now validates ML-DSA-44 DNSSEC signatures and refuses to downgrade
    to ECDSA once a parent DS signals one.
  summary: >-
    Cloudflare states that 1.1.1.1 validates post-quantum DNSSEC signatures using ML-DSA-44,
    and that once a parent DS record signals a post-quantum path the resolver requires it
    rather than accepting conventional signatures. An ML-DSA-44 signature is 2,420 bytes against
    64 bytes for ECDSA P-256. The no-fallback behaviour is Cloudflare's local resolver policy.
  why: >-
    Operators moving a zone to ML-DSA-44 should expect DNSKEY responses to spill past common
    UDP limits onto TCP, and resolvers without the same no-downgrade rule leave the migration
    strippable.
  followup: >-
    Whether other resolvers adopt the same no-downgrade policy, and how zones handle the TCP
    fallback the larger responses force.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/post-quantum-dnssec-1111/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49643281
