- title: RSA-260 factored with a GPU lattice siever built by Devin
  section: Top stories
  category: Security
  blurb: >-
    Cognition factored RSA-260 with a GPU lattice siever written by Devin, using about 4,900
    GPU-days, roughly $400k at market prices.
  summary: >-
    Cognition reports factoring RSA-260 with a GPU lattice siever written by its Devin agent,
    at about 4,900 GPU-days that ran at no marginal cost on spare or fragmented compute and
    that the post values at roughly $400k at current market prices. It is the first new RSA
    Factoring Challenge record since RSA-250 in February 2020, and the post publishes both
    130-digit prime factors in full, so the record can be checked by multiplying them. Cognition
    estimates RSA-1024 at about $30M using commodity GPUs rather than custom hardware, and
    states RSA-2048 does not appear to be meaningfully affected by this work.
  why: >-
    The measured cost of factoring now sits on rentable commodity GPUs, which bears on anything
    still relying on RSA key sizes below 2048 bits.
  followup: >-
    Track independent verification of the factorization and of the RSA-1024 cost estimate.
  sources:
  - label: primary
    url: https://cognition.com/blog/factoring-rsa-260
  - label: discussion
    url: https://news.ycombinator.com/item?id=49633534
- title: Shopify moves its mobile apps from React Native back to Swift and Kotlin
  section: Top stories
  category: Engineering post
  blurb: >-
    Shopify is rebuilding its four mobile apps natively and ends or hands off React Native
    Skia, FlashList and Restyle.
  summary: >-
    Mustafa Ali states Shopify is rebuilding the Shopify, Shop, Point of Sale and Inbox apps
    natively, because coding agents lowered the cost of building the same feature twice. React
    Native Skia is sponsored through the end of 2026, William Candillon will fork the repository
    in the coming months and publish it under a new name, and the original repository is archived
    when that transition completes, FlashList keeps critical compatibility fixes at about
    2 million downloads per week while Shopify negotiates long-term stewardship, and Restyle
    is archived and stops being maintained after 2026. The post states the Shop app went from
    proof of concept to shipped native app in 12 weeks with AI assistance, and separately
    describes a checkpoint system called Helix, illustrated with the Shopify app, in which
    each slice must pass tests, match the running app in visual review, survive two adversarial
    code reviewers and get human approval before the next slice starts.
  why: >-
    Shopify was the largest public production reference for React Native, and the reversal
    changes who maintains three libraries other teams depend on.
  followup: >-
    Who takes long-term stewardship of FlashList, and the name Skia is republished under.
  sources:
  - label: primary
    url: https://shopify.engineering/back-to-native
  - label: discussion
    url: https://news.ycombinator.com/item?id=49643982
- title: DeepSeek V4.1 Flash undercuts V4 Pro and takes over its API route on 2026-09-14
  section: Top stories
  category: AI
  blurb: >-
    DeepSeek prices V4.1 Flash below a third of V4 Pro off-peak and routes V4 Pro requests
    to Flash from 2026-09-14.
  summary: >-
    DeepSeek's API pricing page lists DeepSeek-V4.1-Flash under the model id `deepseek-flash`,
    with a 1M context window, 384K maximum output, and vision support that `deepseek-v4-pro`
    does not have. Off-peak pricing is $0.15 per 1M input tokens on a cache miss and $0.60
    per 1M output, against $0.66 and $1.98 for `deepseek-v4-pro`, and the concurrency limit
    is 2500 against 500. DeepSeek states that V4.1 Flash has comprehensively surpassed V4
    Pro in performance, cost, speed, and total time, and that from 12:00 Beijing time on 2026-09-14
    `deepseek-v4-pro` requests route to V4.1 Flash at the Flash price until a V4.1 Pro release.
  why: >-
    Teams pinned to `deepseek-v4-pro` get moved onto a different model at a different price
    on 2026-09-14 without changing the model id they send.
  followup: The V4 Pro retirement on 2026-09-14, and whether a V4.1 Pro release follows.
