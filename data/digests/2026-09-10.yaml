- title: >-
    Rerunning the IFScale instruction-following benchmark against current frontier models
  section: New videos
  category: Video
  blurb: >-
    Rerunning the IFScale benchmark moves the instruction-following ceiling from about 250
    to near 2,000 in twelve months.
  summary: >-
    Laurie Voss replicated the year-old IFScale result on the models from the original paper,
    then pointed the same test at current frontier models, which scored 100 percent immediately.
    He raised the benchmark from 500 words to 10,000, and the boundary now sits near 2,000
    instructions and closer to 5,000 for the best model. Failure modes differ per model, from
    silent forgetting to safety-classifier refusal to politely declining after writing five
    thousand words. Channel: AI Engineer (2026-09-09, 3,667 views, 5.0 over 20 ratings)
  why: >-
    Fitting rules into a small budget is no longer the binding constraint, and verifying that
    the model obeyed replaces compressing the rules.
  sources:
  - label: watch
    url: https://www.youtube.com/watch?v=XzJD1bvXKjs
- title: LinkedIn puts 1,300 internal tools and 600 playbooks behind three MCP tools
  section: New videos
  category: Video
  blurb: >-
    LinkedIn hides 1,300 internal tools and 600 playbooks behind search, get schema, and execute,
    because MCP degrades past forty.
  summary: >-
    Ajay Prakash states that MCP degrades past roughly thirty or forty tools, so LinkedIn
    replaced the whole surface with search, get schema, and execute, letting agents find what
    they need instead of carrying it in context. Playbooks are published as tools, kept self-contained,
    and split into small referenced pieces so context arrives progressively. Agents are asked
    to open a pull request improving any stale playbook they hit. Channel: AI Engineer (2026-09-09,
    4,757 views, 5.0 over 29 ratings)
  why: >-
    It is a working pattern for exposing a large internal tool surface to agents without filling
    the context window.
  sources:
