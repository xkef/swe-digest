- title: Microsoft and TracerAI rescind the DMCA takedown against Luanti
  section: Markets and companies
  category: Markets
  blurb: >-
    Microsoft and TracerAI withdrew the DMCA notice against Luanti, and the app is back on
    Google Play without a counter-notice wait.
  summary: >-
    The notice alleging that Luanti infringed Minecraft's copyright is withdrawn and the app
    is back on Google Play without waiting out the counter-notice period, which the project
    reads as the case being dropped. The maintainers note that Microsoft Research itself uses
    Luanti as a testbed in Project VEGA and in a world-models paper. They also note that contesting
    the notice consumed maintainer time.
  why: >-
    A takedown against an open-source project can be reversed, and the maintainer time spent
    contesting it is not recovered.
  sources:
  - label: primary
    url: https://blog.luanti.org/2026/09/08/dmca-rescinded/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49627306
- title: A Tell HN thread reports OpenAI's allow-training setting turning itself back on
  section: Hacker News
  category: AI
  blurb: >-
    A Tell HN thread at 390 points reports OpenAI's allow-training toggle switching back on,
    and no one can confirm why.
  summary: >-
    An HN user reports that OpenAI keeps re-enabling the setting that allows training on their
    conversations, and advises checking it rather than assuming it stayed off. No primary
    source or vendor statement exists for the claim.
  why: >-
    The thread cannot separate a UI bug from a default reset, which is the state of the user-facing
    evidence about what a vendor does with conversations.
  comments: >-
    One commenter reports the toggle writes a local storage entry whose value does not appear
    to affect new tab loads, and suggests reverse engineering the page to tell a UI bug from
    a reset. One reports not seeing the setting flip on their own account. Another argues
    that settings resetting across updates is common enough that intent cannot be inferred
    from the behavior alone, and another notes that documenting the resets would undercut
    any legal weight the checkbox carries.
  sources:
  - label: discussion
    url: https://news.ycombinator.com/item?id=49643556
