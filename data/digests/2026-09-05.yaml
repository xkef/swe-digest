- title: >-
    An internal Anthropic research model produced the first computer-checked proof of Fermat's
    Last Theorem in Lean
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Anthropic published a Lean proof of Fermat's Last Theorem written by an internal research
    model, and Kevin Buzzard checked it.
  summary: >-
    Anthropic published on 2026-09-04 a Lean formalization of Fermat's Last Theorem produced
    over 11 days by a general-purpose internal research model it describes as roughly comparable
    to Claude Fable 5.1, run as dozens of agents through a Claude Code-based multi-agent harness
    on the Prove2Me platform and consuming about six billion output tokens. The formalization
    runs to roughly 13 million lines with 30,300 theorems proved and 29,500 used. Lean checks
    the proof against its three standard axioms, and a comparator confirms the formal statement
    matches Mathlib's statement of the theorem. Kevin Buzzard writes on his own blog that
    the theorem is the final entry in Freek Wiedijk's list of 100 formalization challenges,
    closing a benchmark open for 20 years. Buzzard also notes that the repository's proof
    covers exponents above a threshold, with the smaller exponents supplied by the earlier
    flt-regular formalization rather than by this work.
  why: >-
    Buzzard compiled the repository and ran the comparator himself, on a machine and documents
    Anthropic provided, which makes this one of the few AI-produced results a reader can check,
    and he states it adds no new mathematics.
  sources:
  - label: primary
    url: https://www.anthropic.com/research/formalizing-fermats-last-theorem
  - label: repository
    url: https://github.com/anthropics/fermats-last-theorem
  - label: Buzzard's account
    url: https://xenaproject.wordpress.com/2026/09/04/flt-anthropic-has-beaten-me-to-it/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49568506
  - label: Buzzard thread
    url: https://news.ycombinator.com/item?id=49570133
- title: CISA adds an exploited Chromium V8 type confusion bug to the KEV catalog
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    CISA lists an exploited Chromium V8 type confusion bug as KEV, fixed in Chrome 152.0.7977.82,
    federal due date 2026-09-18.
  summary: >-
    CVE-2026-85046 is a type confusion bug in V8 that CISA records as actively exploited,
    with a federal remediation due date of 2026-09-18. The NVD record scopes the defect to
    Google Chrome before 152.0.7977.82 and lists Chrome as the only affected product. The
    fixed version comes from that record because the Chrome Releases post body returned empty
    to automated fetch.
  why: >-
    Any fleet running Chrome needs the version bump, and the difference between execution
    inside the sandbox and a full escape changes how urgent the second-stage risk is.
  followup: >-
    Watch for a chained sandbox escape and for any record widening the affected product list
    beyond Chrome.
  comments: >-
    The Hacker News title reads "Actively exploited sandbox RCE in all Chromium versions".
    The NVD description scopes execution to inside the sandbox and the affected product to
    Chrome before 152.0.7977.82, and the only CISA text reachable is the catalog name "Google
    Chromium V8 Type Confusion Vulnerability".
  sources:
