- title: Reconstructing a Jane Street ASIC from GDS geometry and solving it with z3
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    A month-long write-up reconstructs a Jane Street ASIC from GDS geometry into Verilog and
    solves the puzzle with z3.
  summary: >-
    The author recovers a netlist from roughly 17,000 polygons by testing layer adjacency
    and polygon overlap, then lifts it to Verilog. The 120-cycle circuit is inverted by expressing
    the desired final state as z3 constraints rather than searching a 120-bit input space.
  why: >-
    Both halves of the method transfer outside the puzzle, to netlist recovery from layout
    and to constraint-solving instead of brute-forcing a wide input.
  sources:
  - label: primary
    url: https://jestoph.com/2026/09/04/jane-street-challenge.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49562657
- title: >-
    An SRE argues AI incident response will cut median recovery time and raise it for the
    hardest incidents
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    An SRE argues automating routine incidents lowers average MTTR and raises resolution time
    for the hardest ones.
  summary: >-
    The post applies Lisanne Bainbridge's 1983 Ironies of Automation to on-call: routine incidents
    are how responders safely build the intuition a rare severe incident demands, so automating
    them removes the practice and leaves the responsibility. The author names the expected
    consequence, average MTTR falling while resolution time for complex incidents rises, and
    calls the gap comprehension debt. The aviation comparison cites fewer than one in-flight
    shutdown per 100,000 engine flight hours against FAA recurrent proficiency checks every
    six months.
  why: >-
    The claim is a prediction with no measurement behind it, from an author at Rootly, an
    incident management vendor that sells the simulation training the post recommends.
  sources:
  - label: primary
    url: https://www.sylvainkalache.com/blog/ai-handles-incidents-engineers-lose-touch-with-their-systems
  - label: discussion
    url: https://news.ycombinator.com/item?id=49574167
