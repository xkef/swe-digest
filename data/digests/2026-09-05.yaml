- title: >-
    A team benchmarks migrating a 1,036-file React codebase to the Rust React Compiler
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    A team migrated a 1,036-file React Router codebase to the Rust React Compiler and cut
    the compile step to 0.81 seconds.
  summary: >-
    The write-up is dated 2026-09-04 and describes switching a 1,036-file React Router codebase
    over to the oxc team's Rust React Compiler, whose official support the post dates to 2026-08-04,
    so the new material is one team's migration and benchmark rather than a shipping event.
    The author measures the compiler step at 14.3 seconds before and 0.81 seconds after, and
    the whole build at 22.1 seconds before and 9.3 seconds after. The headline speedup of
    17.6 times describes the compiler step alone, and the oxc-based compiler also handles
    try/catch conditionals and computed object property keys that made the Babel-based v1.0
    compiler bail out.
  why: >-
    The durable gain is broader compilation coverage rather than the headline multiple, since
    the build-level improvement is closer to 2.4 times.
  sources:
  - label: primary
    url: https://blog.master.dev/react-now-rusted-all-the-way-out/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49567873
- title: >-
    An ISSTA 2026 study finds most rustc soundness bugs persisted since feature introduction
  section: Languages and runtimes
  category: Paper
  status: confirmed
  blurb: >-
    An ISSTA 2026 study of 30 rustc soundness bugs finds most persisted from the day the underlying
    feature was introduced.
  summary: >-
    The study, titled "Rust's Type Checker Implementation Is Unsound", examines 30 soundness
    bugs collected from the rustc GitHub issue tracker between 2022-01-01 and 2025-09-01.
    It reports that most of the bugs persist from the initial introduction of the relevant
    features and require significant time to be discovered, and that the bugs compromising
    memory safety cluster on implied bounds and trait objects. The authors report that AddressSanitizer
    and Miri catch the memory-safety subset, while a-mir-formality and Chalk are not yet mature
    enough to serve as oracles for the rest.
  why: >-
    No existing tool acts as an oracle for the non-memory-safety soundness bugs, so those
    are found by report rather than by testing.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2608.28713
  - label: publisher record
    url: https://doi.org/10.1145/3832220
  - label: discussion
    url: https://news.ycombinator.com/item?id=49571006
- title: Apple Silicon audio moves to shared GPIO for Linux 7.4
  section: Linux and kernel
  category: Linux/Kernel
  status: developing
  blurb: >-
    Apple Silicon speaker codecs move to the kernel's shared GPIO support in Linux 7.4, replacing
    an Asahi workaround.
  summary: >-
    Every speaker codec on Apple Silicon Macs has its software shutdown pin wired to the same
    GPIO line, so the first codec to change state decided it for the rest and later codecs
    were already off when their register state was cached, which made suspend and resume unworkable.
    Downstream Asahi used the regulator API as a proxy that deasserts only once every consumer
    agrees, and the kernel's shared GPIO infrastructure removes the need for that. The series
    also flips the TAS2764 and TAS2770 drivers to initialise the line low so the first transition
    establishes the intended default.
  why: >-
    The work is queued in the Apple SoC driver branch for Linux 7.4, so mainline suspend and
    resume on these machines is fixed only from that release.
  followup: Confirm the series lands in the Linux 7.4 merge window.
  sources:
  - label: Phoronix
    url: https://www.phoronix.com/news/Linux-Apple-Audio-Shared-GPIO
