- title: >-
    EEBench grades frontier models on circuit design with SPICE simulation and puts Claude
    Opus 5 first at 61.6 percent
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    EEBench grades models on circuit design with SPICE simulation against measured limits,
    and puts Claude Opus 5 first at 61.6 percent.
  summary: >-
    Designs are submitted as declarative atopile code rather than drawn in a CAD GUI, then
    built into a circuit graph and a bill of materials and graded by SPICE runs against measured
    limits, using real manufacturer parts pushed to worst-case tolerance corners. Cost against
    a reference bill of materials scores only once the circuit works. Results dated September
    1 across the 13 tasks in EEBench V1 give Claude Opus 5 61.6 percent, Grok 4.6 57.1, Claude
    Fable 5.1 56.4, Claude Fable 5 54.3, Claude Opus 4.8 Max 51.4, GPT-5.5 42.3, and GPT-5.6
    Sol 39.4, with no GPT-6 Astra result yet. EEBench is built and funded by the atopile team,
    which sells larger evaluation suites and simulation-backed training environments to frontier
    labs while stating it does not sell benchmark scores.
  why: >-
    Deterministic simulation grading fails designs that build cleanly and still miss the job,
    such as the published submission whose nominal 22 uF part delivered 11.4 uF of effective
    capacitance at 4.7 V bias.
  followup: >-
    Watch for EEBench or xAI to reconcile the Grok 4.6 model card's 60.0 percent at xhigh
    reasoning effort against EEBench's own 57.1.
  sources:
  - label: primary
    url: https://eebench.org/blog/can-ai-design-circuit-boards-yet/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49569366
- title: >-
    PatchBench reports crash-reproduction validation inflates agent patching solve rates by
    1.83 times
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    A preprint reports proof-of-concept-only validation inflates agent vulnerability patching
    solve rates by 1.83 times.
  summary: >-
    Across 11 agents including the top three AIxCC entrants, the authors report that the original
    proof-of-concept-only validation inflates solve rates by 1.83 times on average, because
    agents patch on the crash stack trace to suppress the reported crash rather than localizing
    the root cause. About 25 percent of agent patches show substantial similarity to historical
    developer patches, which means the benchmark partly measures memorization. Preprint posted
    2026-09-03 and not peer reviewed.
  why: >-
    A claim about autonomous patching that rests on crash reproduction measures crash suppression
    rather than a fix.
  followup: Watch for peer review and for independent reproduction.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2609.04075v1
- title: >-
    A preprint trojanizes agent plugins through hook updates and compromises all seven harnesses
    tested
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    A preprint reports attacker-controlled lifecycle hook updates compromised all seven AI
    agent harnesses tested.
  summary: >-
    Lifecycle hooks bind shell commands to runtime events such as session start, tool calls
    and file edits, run with host privileges, and can fire at times the model never observes.
    Under a threat model where the attacker controls only plugin metadata and hook configuration,
    a benign versioned plugin is trojanized by an update alone. Across 25 harness and backend
    combinations in 1,000 runs the authors report compromising all seven harnesses, with per-harness
    success up to 92.5 percent, Microsoft Defender at 0 percent recall, and three static defenses
    together missing 47.5 percent of malicious artifacts. Preprint posted 2026-09-03 and not
    peer reviewed.
  why: >-
    Installing an agent plugin means trusting an update channel that no review step covers.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2609.03884v1
- title: LLM judges fall short of the noise ceiling on chain-of-thought step importance
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    A preprint measures LLM judges well short of the noise ceiling when scoring which chain-of-thought
    steps actually mattered.
  summary: >-
    The preprint asks whether the functional role of a reasoning step is recoverable from
    the text of that step. It reports LLM judges well below the noise ceiling, with fine-tuned
    critics still distant from ceiling on correct responses.
  why: >-
    Process reward models and step-level critics assume step text encodes step importance,
    and this measurement puts that assumption as only partially true.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2609.04194v1
- title: Spotify publishes a Claude Code plugin that blocks large file reads
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Spotify ships a Claude Code plugin whose hook blocks large file reads and routes them
    to a cheaper worker model instead.
  summary: >-
    The enforcement sits in a PreToolUse hook that blocks any Read above a configurable line
    threshold and delegates the file to a cheaper worker model. The 90 percent figure is the
    mean saving on the bulk-read path across four scenarios, not a whole-workload reduction,
    and it is Spotify's own benchmark of Spotify's own product on one Java monorepo. The post
    states the limits: delegated summaries carry no reliable line numbers for editing, and
    the worker model missed a thread-safety bug the frontier model caught.
  why: >-
    A blocking hook enforces a context budget that advisory CLAUDE.md rules do not, at a stated
    cost in edit precision.
  sources:
  - label: primary
    url: https://engineering.atspotify.com/2026/9/portal-by-spotify-cut-my-claude-code-token-usage-by-90
  - label: discussion
    url: https://news.ycombinator.com/item?id=49571465
