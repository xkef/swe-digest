- title: GitHub opens Project HydraFusion as a research preview in Copilot CLI
  section: Top stories
  category: Agentic coding
  status: confirmed
  blurb: >-
    GitHub previews Project HydraFusion in Copilot CLI, a runtime orchestrator that routes
    each request across multiple models.
  summary: >-
    HydraFusion chooses per request between a single model, a cascade with a quality gate,
    and a cross-family critique pass. GitHub's own offline evaluation reports 4.9 percentage
    points better verified task quality on TerminalBench 2.1 at 67 percent lower estimated
    cost than Claude Opus 5. Those figures are GitHub's measurements against a competitor's
    model with no independent reproduction.
  why: >-
    Runtime model selection moves the cost and quality tradeoff out of configuration and into
    the request path, and the published numbers cannot yet be checked outside GitHub.
  followup: >-
    Track any independent reproduction of the TerminalBench 2.1 quality and cost figures.
  sources:
  - label: primary
    url: https://github.blog/ai-and-ml/github-copilot/project-hydrafusion-frontier-quality-via-multi-model-orchestration/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49566788
