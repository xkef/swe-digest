- title: >-
    Google DeepMind agents cut RSA-1024 signature forgery cost 3.5-fold and find cheaper batch
    factoring
  section: AI
  category: AI
  blurb: >-
    Agents working with UC San Diego and Inria cryptographers re-ran a signature forgery on
    a 1024-bit key in 391 core-years, not 1,380.
  summary: >-
    SecurityWeek reports that DeepMind agents, supervised by cryptographers from UC San Diego
    and Inria, found that PKCS#1 v1.5 padding adds no protection once an attacker controls
    roughly half the signed block, and re-ran an earlier forgery on a 1024-bit key in 391
    CPU core-years against 1,380. Two agents designed, ran and debugged the computation in
    under four days with about 20 human messages. A second, unimplemented algorithm makes
    factoring each additional 1024-bit key about 30 times cheaper after one upfront computation.
  why: >-
    Anything still signing with RSA-1024 through PKCS#11 devices such as HSMs has less margin
    than assumed, while 2048-bit and larger keys are unaffected.
  background: >-
    PKCS#1 v1.5 is an older RSA padding scheme still common in hardware security module signing
    interfaces. The forgery needs about 4 billion chosen signing queries, does not recover
    the private key, and fails against devices that hash messages internally. Factoring one
    1024-bit key is estimated at 500,000 to 1 million core-years.
  sources:
  - label: discussion
    url: https://www.securityweek.com/google-deepminds-ai-agents-make-1024-bit-rsa-keys-cheaper-to-attack/
- title: >-
    Meta releases Muse Ember, a $0.10 and $0.50 per million token model for agent subtasks
    with a 1M context
  section: AI
  category: AI
  blurb: >-
    Meta's smallest Muse model targets tool calls and coding subtasks, and Meta claims more
    intelligence per dollar than Claude Haiku 5.5.
  summary: >-
    Muse Ember is available as muse-ember-1.0 on the Meta Model API and Muse Code at $0.10
    input and $0.50 output per million tokens, with a 1M-token context, up to 512K output
    tokens and Responses API support. Meta says it scores 36 on the Artificial Analysis Intelligence
    Index at about $0.14 per task, against $2.39 for Muse Spark 1.3. Claude Haiku 5.5 still
    leads on FrontierCode 2.0, 34.9% to 27.2%.
  why: >-
    It gives teams a cheap subagent option for the high-volume steps in agent harnesses, though
    its code mergeability score trails Haiku.
  background: >-
    Meta says Muse Ember is the first model trained using its larger Muse Wonder Full model,
    which places it as a distilled worker beneath Muse Wonder and Muse Spark. Meta positions
    it for the planner and worker split, where a strong model plans and a cheap model handles
    repeated tool calls.
  comments: The Hacker News thread drew 103 points and 47 comments.
