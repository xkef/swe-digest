- title: >-
    Unpatched Eclipse Mosquitto 2.1 WebSocket bug gives pre-auth RCE, with upstream fixes
    expected before 2026-11-18
  section: Security
  category: Security
  blurb: >-
    An empty WebSocket frame makes Mosquitto 2.1 overrun a heap buffer before login, and a
    researcher turned it into remote code execution.
  summary: >-
    A researcher shows that a Mosquitto bug disclosed publicly in August 2026 and judged harmless
    in its GitHub issue lets an empty WebSocket frame return more bytes than requested, underflowing
    the packet length counter and writing past the payload buffer before authentication. The
    write-up builds a reliable exploit against the Home Assistant Mosquitto add-on. Affected
    are upstream 2.1.0 onward built with the built-in WebSocket listener exposed on the network,
    Eclipse expects fixed releases before 2026-11-18, and the Home Assistant add-on is fixed
    in 7.1.2.
  why: >-
    Anyone exposing Mosquitto's built-in MQTT-over-WebSocket listener should firewall or disable
    it until Eclipse ships a fix.
  background: >-
    MQTT is a publish and subscribe protocol for IoT and machine-to-machine messaging, and
    Mosquitto is one of its most widely used open source brokers. Brokers can speak MQTT over
    raw TCP or wrapped in WebSocket frames for browser clients, so the broker must strip frame
    headers and reassemble MQTT packets across reads. The researcher found the flaw through
    a gap in Mosquitto's OSS-Fuzz harness, and says two frontier models pointed at the file
    flagged the length bug but missed its memory safety impact.
  followup: >-
    Eclipse fixed Mosquitto releases expected before 2026-11-18, and the author's second post
    on the container escape.
  sources:
  - label: primary
    url: https://born0monday.me/posts/ha-green-mosquitto-rce/
  - label: discussion
    url: https://www.reddit.com/r/netsec/comments/1xr33yo/pwning_home_assistant_green_preauth_rce_in/
  thread: f-0189
- title: >-
    Researchers chain leaked OpenIDM admin credentials and an MFA skip to unlock one automaker's
    cars by number plate
  section: Security
  category: Security
  blurb: >-
    Researchers chained leaked OpenIDM admin credentials, a WAF path bypass and an MFA skip
    to unlock any of one automaker's cars by plate.
  summary: >-
    Shubham Shah and Sam Curry found hardcoded API keys and staging OpenIDM admin credentials
    in the automaker's public JavaScript bundles, and the credentials also worked in production.
    A path traversal through /static%2f..%2fopenidm/, found by GPT 5.6 after six hours on
    the OpenIDM source, bypassed the WAF and let them reset any user's password, and a password
    grant flow skipped MFA to mint app tokens that sent unlock commands. The chain covered
    the automaker's Australian vehicles, and a related chain covered the United States and
    Canada.
  why: >-
    Admin and identity endpoints left on the internet behind WAF rules, with credentials in
    shipped JavaScript, remain a full account takeover path.
  background: >-
    ForgeRock OpenIDM is an identity management server that stores user accounts and exposes
    REST endpoints for administrators to change them. The OAuth Resource Owner Password Credentials
    grant lets a client trade a username and password directly for tokens, and OAuth 2.1 drops
    it because it bypasses interactive steps such as MFA. Connected car apps typically turn
    an account token into remote commands through a telematics API, so whoever controls identity
    controls the car.
  comments: The Hacker News thread drew 289 points and 98 comments.
  sources:
  - label: primary
    url: https://shubs.io/unlocking-any-car-from-x-brand-in-most-of-the-world/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50419215
- title: >-
    rmcp, the official Rust MCP SDK, fixes an OAuth client SSRF and unauthenticated memory
    exhaustion in Streamable HTTP
  section: Security
  category: Security
  blurb: >-
    Three RustSec advisories hit rmcp: an OAuth discovery SSRF fixed in 3.7.0 and two unbounded-memory
    bugs in its Streamable HTTP transports.
  summary: >-
    RUSTSEC-2026-0457 (GHSA-5p52-q7pq-9fq2) says the rmcp OAuth client from 2.0.0 until 3.7.0
    checked only host strings, so a malicious MCP server could steer discovery to a hostname
    resolving to an internal address, and token and registration endpoints were not checked
    at all. RUSTSEC-2026-0461, rated CVSS 7.5, says StreamableHttpService from 3.0.0 until
    3.6.0 cached tool lookups by name with no size limit, even for rejected requests, so unauthenticated
    clients could exhaust server memory. RUSTSEC-2026-0462 covers unbounded response body
    buffering in Streamable HTTP clients.
  why: >-
    Rust MCP clients and servers built on rmcp should move to 3.7.0, and code that passes
    a custom OAuth HTTP client must enforce its own outbound address policy.
  background: >-
    The Model Context Protocol (MCP) lets AI agents call tools exposed by servers, and Streamable
    HTTP is its HTTP transport. Server-side request forgery (SSRF) here means a hostile server
    tricks the client into sending requests to internal services it can reach, such as unauthenticated
    admin endpoints. The fix resolves hostnames and applies the address policy to every resolved
    address and redirect, rather than inspecting the URL text.
  sources:
  - label: primary
    url: https://rustsec.org/advisories/RUSTSEC-2026-0457.html
  - label: primary
    url: https://rustsec.org/advisories/RUSTSEC-2026-0461.html
  - label: primary
    url: https://rustsec.org/advisories/RUSTSEC-2026-0462.html
- title: >-
    Attacker used Qubole's trusted AWS account to assume customer IAM roles and steal secrets
    and S3 data
  section: Security
  category: Security
  blurb: >-
    Wiz says roles that still trusted Qubole's AWS account, even unused ones, let an attacker
    read secrets and copy whole S3 buckets.
  summary: >-
    Wiz says an attacker with credentials for the AWS account Qubole's platform uses, 805246085872,
    assumed roles in multiple customers' accounts between 2026-10-14 and 2026-10-26. The attacker
    read Lambda environment variables, Secrets Manager and SSM Parameter Store values, tested
    the found credentials with TruffleHog, and copied S3 data. How the credentials were obtained
    is not disclosed, and Qubole and Idera had posted no statement.
  why: >-
    Any account that ever connected Qubole should search CloudTrail from 2026-10-01 for AssumeRole
    calls from that account outside AWS, rotate reachable secrets, and add source IP conditions
    to vendor role trust policies.
  background: >-
    SaaS vendors that work inside a customer's AWS account usually get an IAM role whose trust
    policy lets the vendor's account assume it. The External ID guards against the confused
    deputy problem, but it is not a secret and appears in plain text in CloudTrail. If the
    vendor's own account is compromised, every customer role that still trusts it is exposed.
  sources:
  - label: discussion
    url: https://thehackernews.com/2026/11/hackers-exploit-quboles-trusted-aws.html
  thread: f-0191
- title: >-
    Stolen CI credentials let attackers publish wallet-stealing bee-js 13.3.0 to npm and a
    signed Swarm Desktop 0.56.2
  section: Security
  category: Security
  blurb: >-
    Ethersphere's release automation shipped a postinstall loader with valid npm provenance
    and a notarized macOS build before both were pulled.
  summary: >-
    On 2026-11-09 attackers used Ethersphere's bee-worker automation account to publish bee-js
    13.3.0, latest on npm for about 75 minutes, and Swarm Desktop 0.56.2, live on GitHub for
    about 8.5 hours. Both fetch a payload that steals the Swarm node key and its plain-text
    password and installs a Go remote shell on Linux and macOS or ScreenConnect on Windows.
    Clean Swarm Desktop 0.56.3 is out, and signing jobs now need DevOps approval and run only
    from main.
  why: >-
    Search lockfiles, caches and CI logs for @ethersphere/bee-js@13.3.0, and treat any machine
    or runner that installed it with scripts enabled as compromised.
  background: >-
    npm provenance links a package to the repository and workflow that built it, but it does
    not show that anyone reviewed the code. Here the project's real workflow built the malicious
    release, so provenance was valid. npm runs postinstall scripts automatically, so a project
    did not need to import the library for the loader to run.
  sources:
  - label: discussion
    url: https://thehackernews.com/2026/11/hackers-compromise-etherspheres-bee-js.html
  thread: f-0190
- title: >-
    Google adds TPU 8tx for confidential inference and dual-chip TPU 8i Max, and makes Cloud
    Pathways GA on GKE
  section: AI
  category: AI
  blurb: >-
    Google's eighth TPU generation adds 8tx for confidential inference and 8i Max with double
    the HBM bandwidth, plus open-source TPU Sync.
  summary: >-
    Google added two eighth-generation TPU systems on 2026-11-09: TPU 8tx, built on TPU 8t
    silicon with custom AMD CPU hosts for confidential inference and small-scale training,
    and TPU 8i Max, which packs two TPU 8i chips for double the compute, SRAM and HBM bandwidth.
    Google also open-sourced TPU Sync for KV cache tiering and RL weight sync, and made Cloud
    Pathways and GKE dynamic slicing generally available on GKE. Google says dynamic slicing
    cuts job startup times by up to 5x.
  why: >-
    Teams running inference or RL on Google Cloud get confidential computing on TPUs and GA
    tools for multi-slice jobs, and PyTorch and vLLM code can target TPUs through the TorchTPU
    stack.
  background: >-
    TPUs are Google's custom accelerators for machine learning. Confidential computing keeps
    data and model weights encrypted and isolated in memory while they are processed, not
    only at rest and in transit. Pathways is the single-controller runtime Google DeepMind
    uses to drive many TPU slices as one program.
  sources:
  - label: primary
    url: https://cloud.google.com/blog/topics/ai-infrastructure/tpu-8tx-and-tpu-8i-max/
  - label: primary
    url: https://cloud.google.com/blog/topics/ai-infrastructure/cloud-pathways-a-distributed-ml-runtime-is-ga/
  - label: primary
