- title: >-
    Google DeepMind agents cut RSA-1024 signature forgery cost 3.5-fold and find cheaper batch
    factoring
  section: AI
  category: AI
  blurb: >-
    Agents working with UC San Diego and Inria cryptographers re-ran a signature forgery on
    a 1024-bit key in 391 core-years, not 1,380.
  summary: >-
    SecurityWeek reports that DeepMind agents, supervised by cryptographers from UC San Diego
    and Inria, found that PKCS#1 v1.5 padding adds no protection once an attacker controls
    roughly half the signed block, and re-ran an earlier forgery on a 1024-bit key in 391
    CPU core-years against 1,380. Two agents designed, ran and debugged the computation in
    under four days with about 20 human messages. A second, unimplemented algorithm makes
    factoring each additional 1024-bit key about 30 times cheaper after one upfront computation.
  why: >-
    Anything still signing with RSA-1024 through PKCS#11 devices such as HSMs has less margin
    than assumed, while 2048-bit and larger keys are unaffected.
  background: >-
    PKCS#1 v1.5 is an older RSA padding scheme still common in hardware security module signing
    interfaces. The forgery needs about 4 billion chosen signing queries, does not recover
    the private key, and fails against devices that hash messages internally. Factoring one
    1024-bit key is estimated at 500,000 to 1 million core-years.
  sources:
  - label: discussion
    url: https://www.securityweek.com/google-deepminds-ai-agents-make-1024-bit-rsa-keys-cheaper-to-attack/
- title: >-
    Hyperlight adds hyperlight-unikraft to run unmodified Linux binaries in snapshot-restored
    micro-VMs for agent code
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Microsoft's embeddable Rust VMM now runs Python, Node.js, Java and other stock Linux binaries
    in micro-VMs that restore from snapshots in ms.
  summary: >-
    hyperlight-unikraft runs a Unikraft unikernel inside a Hyperlight micro-VM, so unmodified
    binaries for Python, Node.js, .NET, Java, PHP, Go, Rust, C, Bash and PowerShell run on
    x86_64 and arm64 with no SDK or recompile. It snapshots a warmed runtime: a script importing
    numpy, pandas and scikit-learn took 45 ms from snapshot against 1,119 ms natively, while
    a Python hello world was slower at 22 ms against 17 ms. Integrations include urunc for
    containerd and Kubernetes, an MCP server with a stateful run_python tool, smolagents,
    an OpenAI Agents SDK sandbox provider, ClickHouse Python UDFs and verl reward execution.
  why: >-
    Teams sandboxing agent-generated code get a hypervisor boundary with startup costs near
    or below native for heavy runtimes, deny-by-default mounts and network, and a containerd
    path into Kubernetes.
  background: >-
    Hyperlight is a CNCF Sandbox project. Unlike QEMU or Firecracker, which run as separate
    processes, it is a library virtual machine monitor that an application links in, using
    KVM or MSHV on Linux, WHP on Windows and Hypervisor.framework on macOS. A unikernel is
    a single-application operating system with one address space and only the kernel components
    that application needs. The digest covered a Firecracker microVM escape on 2026-11-07,
    a reminder that the hypervisor boundary narrows risk but does not remove it.
  sources:
  - label: primary
    url: https://www.cncf.io/blog/2026/11/09/run-linux-applications-in-hypervisor-isolated-micro-vms-with-hyperlight/
- title: >-
    Linux 7.4-rc2 ships with many AI-driven fixes, and Torvalds says BPF fixes now outpace
    new reports
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Torvalds ships a large 7.4-rc2 full of AI-found bug fixes and says the BPF tree now fixes
    reports faster than new ones arrive.
  summary: >-
    Linus Torvalds tagged Linux 7.4-rc2 on 2026-11-09, a big release candidate following the
    largest rc1 ever, padded by deferred coccinelle cleanups. He wrote that much of it was
    driven by AI fixes, that Alexei Starovoitov says BPF fixes are now arriving faster than
    new reports, and that most other areas have not reached that point. Phoronix lists a FAT32
    sync-mount speedup, AMDGPU HDMI 2.2 FRL fixes, a BHI mitigation selection fix and fixes
    for long-standing memory management bugs.
  why: >-
    Kernel maintainers see the first sign that the AI-generated bug report backlog may be
    shrinking, starting with BPF.
  followup: Linux 7.4 stable release expected around the end of December 2026.
  comments: >-
    The Register frames the post as a sign the AI patch flood may have peaked, citing record
    monthly fix counts at Microsoft and Oracle.
