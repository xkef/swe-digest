- title: >-
    AWS Nitro Sandboxes run each EKS pod, ECS task or agent workload in its own Nitro VM at
    no extra charge
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    A one-line change gives each pod or task a hardware-isolated VM on shared EC2 instances,
    with attestation before secrets are released.
  summary: >-
    AWS Nitro Sandboxes are lightweight VMs managed by the Nitro Hypervisor that run on customers'
    own EC2 instances. Enabling them in EKS or ECS gives each pod or task its own VM while
    Pod Identity, VPC CNI, EBS, EFS, S3 and CloudWatch keep working. On EC2 they support Amazon
    Linux and Firecracker directly, and they are available in all commercial regions on most
    Nitro instances.
  why: >-
    Teams running LLM-generated code or multi-tenant workloads on Kubernetes can get VM isolation
    per pod without a separate sandbox provider or dedicated hosts.
  background: >-
    Containers share the host kernel, so a kernel bug can let one workload reach another.
    Projects such as Kata Containers and Firecracker put each workload in a microVM to add
    a hardware boundary. AWS now offers that model natively inside EKS and ECS, with attestation
    so secrets go only to verified sandboxes.
  sources:
  - label: primary
    url: https://aws.amazon.com/about-aws/whats-new/2026/11/nitro-sandboxes-eks-ecs-ec2/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50428199
- title: >-
    ClickHouse Managed Postgres reaches GA on AWS, and ClickHouse acquires Xata for copy-on-write
    branching
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The NVMe-backed Postgres service replicates to ClickHouse via WAL, and Xata's storage
    will add instant branches and scale-to-zero for agents.
  summary: >-
    ClickHouse Managed Postgres is GA on AWS and in private preview on GCP, built on local
    NVMe storage with up to two standbys, PgBouncer, read replicas and point-in-time recovery.
    WalShadow replicates physical WAL to ClickHouse, and pg_clickhouse lets apps query ClickHouse
