- title: >-
    Uber relaxes SubmitQueue conflict checks and validates main after landing to absorb AI-driven
    PR growth
  section: Talks
  category: Video
  blurb: >-
    Uber's merge queue went from 30-minute to 3 to 4 hour waits as AI PRs grew, then relaxed
    conflict checks and verified main after landing.
  summary: >-
    Uber engineers say queue requests rose from about 90 to 130 an hour between January and
    March 2026, mostly from AI-generated changes, and P95 land time grew from 30 minutes to
    3 to 4 hours. They added peak-hour admission gating with a deferred queue for expensive
    changes, then scored target overlap between changes with a Jaccard measure and dropped
    weak conflict edges to run more in parallel. That lets some combinations land untested,
    so a post-land system called StowPipe validates new commits and advances a verified main
    pointer, and peak throughput reached about 300 lands an hour at a 30-minute P95.
  why: >-
    Monorepo teams facing agent-driven PR volume may need to trade an always-green trunk for
    post-merge validation and a verified-main pointer.
  background: >-
    A merge queue tests each change against the changes ahead of it so the trunk stays green
    when many PRs merge concurrently. Uber's SubmitQueue already speculated on likely outcomes
    and built unrelated targets in parallel. The new step accepts a sometimes broken main
    and relies on post-land checks plus on-call reverts.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=hX140a5klW0
- title: >-
    Modal's async agent RL recipe trains stably with rollouts spread over mixed GPUs and clouds
  section: Talks
  category: Video
  blurb: >-
    Modal's RL recipe corrects trainer and sampler mismatch so agent rollouts can run on mixed
    GPU types across clouds, 15 percent cheaper.
  summary: >-
    Jason Mancuso describes a recipe of GRPO plus masked importance sampling, score centering
    to remove accumulated drift, and top-p sampling with mask replay, ablated on Qwen 3.6
    35B MoE with code environments. Because per-step weight deltas are 100 to 1,000 times
    sparse, compressed updates let inference workers run outside the training cluster across
    providers and GPU types, including FP8 pools, with stable reward. He says rollouts cost
    15 percent less, and that the code builds on Miles and SGLang with a source release planned.
  why: >-
    Teams with a production agent harness and evals can treat them as an RL environment and
    run rollouts on cheaper, scattered GPUs.
  background: >-
    GRPO, introduced with DeepSeek R1, scores a group of sampled answers against each other
    instead of training a separate value model. Asynchronous RL keeps samplers and trainer
    busy at once, but rollouts then come from slightly stale weights, and kernel or precision
    differences make the sampler's token probabilities differ from the trainer's. Importance
    sampling reweights tokens to correct for that mismatch.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=3nDMYV-QHLs
- title: >-
    Linear runs triage and review agents that check PRs against past product decisions and
    reverts
  section: Talks
  category: Video
  blurb: >-
    Linear runs a triage agent that enriches issues and a review agent that checks PRs against
    past product decisions, reverts and incidents.
  summary: >-
    Tom Moor says Linear's triage agent labels, deduplicates and routes incoming requests,
    then attaches customer value, logs, related issues and prior decisions, and small bugs
    are fixed automatically. A review agent reads the original issue, product history, reverts,
    incidents, overlapping work and the agent session, and caught a reintroduced UI element
    that had been rejected before and an incident-prone open DB transaction that Codex missed.
    A daily automation mines merged PRs for lessons and writes them back into agents.md and
    docs.
  why: >-
    Review agents that see issue intent and product history catch coherence regressions that
    code-only AI review misses.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=Xw9utONfhIY
- title: >-
    Daytona finds agent frameworks converging on separate VM sandboxes as CrewAI and AG2 drop
    local execution
  section: Talks
  category: Video
  blurb: >-
    Daytona argues allow lists and embedded runtimes leave tool calls unisolated, and notes
    CrewAI and AG2 dropped local code execution.
  summary: >-
    Mislav Ivanda compares three isolation models for agent code: command allow lists with
    approval prompts, embedded runtimes such as V8 or QuickJS, and a separate VM. He argues
    that allowing a command like python -c grants arbitrary capability, and that embedded
    runtimes isolate generated glue code while its tool calls still run on the host. He cites
    CrewAI removing its local code interpreter in April 2026 and AG2 retiring local executors,
    and says the execution boundary is harder to swap later than the framework.
  why: >-
    Pick the agent execution boundary before the framework, because tools written for host
    execution are costly to move into a sandbox later.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=WWIFiQi9U4w
