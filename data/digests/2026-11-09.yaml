- title: >-
    Linux 7.4-rc2 ships with many AI-driven fixes, and Torvalds says BPF fixes now outpace
    new reports
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Torvalds ships a large 7.4-rc2 full of AI-found bug fixes and says the BPF tree now fixes
    reports faster than new ones arrive.
  summary: >-
    Linus Torvalds tagged Linux 7.4-rc2 on 2026-11-09, a big release candidate following the
    largest rc1 ever, padded by deferred coccinelle cleanups. He wrote that much of it was
    driven by AI fixes, that Alexei Starovoitov says BPF fixes are now arriving faster than
    new reports, and that most other areas have not reached that point. Phoronix lists a FAT32
    sync-mount speedup, AMDGPU HDMI 2.2 FRL fixes, a BHI mitigation selection fix and fixes
    for long-standing memory management bugs.
  why: >-
    Kernel maintainers see the first sign that the AI-generated bug report backlog may be
    shrinking, starting with BPF.
  followup: Linux 7.4 stable release expected around the end of December 2026.
  comments: >-
    The Register frames the post as a sign the AI patch flood may have peaked, citing record
    monthly fix counts at Microsoft and Oracle.
