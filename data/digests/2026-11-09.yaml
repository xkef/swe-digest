- title: >-
    Sourcegraph will end Cody on 2027-01-31 and steers users to Deep Search and its MCP server
  section: Developer tools
  category: Dev tools
  blurb: >-
    Sourcegraph is retiring its RAG-era coding assistant to focus on code search, a deterministic
    code graph, and tools for other agents.
  summary: >-
    Sourcegraph CEO Dan Adler says Cody, including its IDE integrations and APIs, reaches
    end of life on 2027-01-31. Sourcegraph will focus on Code Search, its code graph, Deep
    Search, Agentic Batch Changes, and MCP, CLI and API access for agents such as Claude Code
    and Cursor. It says these are not one-for-one replacements for every Cody feature.
  why: >-
    Teams with workflows built on Cody's APIs or IDE plugins have under three months to migrate.
  background: >-
    Cody launched in early 2023 as a chat and completion assistant that used retrieval over
    Sourcegraph's code index. Sourcegraph's agent effort became Amp, which is now an independent
    company. Adler says Sourcegraph chose two years ago not to turn Cody into an agent.
  sources:
