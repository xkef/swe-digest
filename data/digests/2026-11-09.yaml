- title: >-
    Anthropic releases Claude Fable 5.2 and Mythos 5.2 at $8 and $40 per million tokens, with
    a 2.5x fast mode
  section: Top stories
  category: AI
  blurb: >-
    Anthropic's upgraded top models score above Opus 5.5 on most of its benchmarks, run up
    to 30% faster, and cost less than the 5.1 versions.
  summary: >-
    Fable 5.2 and Mythos 5.2 are one underlying model. Fable carries cyber and biology safeguards
    and is open to all users, while Mythos goes to organizations in Anthropic's Cyber and
    Life Sciences Verification Programs. Pricing is $8 input and $40 output per million tokens,
    and an optional fast mode costs $16 and $80 for up to 2.5x faster generation. On Anthropic's
    FrontierCode 2.0 run, Fable 5.2 scores 49.1% at Xhigh effort against 45.5% for Opus 5.5,
    and at High effort it matches Opus 5.5 for about half the cost per task.
  why: >-
    Anthropic still recommends Opus 5.5 as the default for most coding, with Fable 5.2 reserved
    for long ambiguous tasks or used as an Advisor or Orchestrator over smaller models.
  background: >-
    Anthropic splits one frontier model into two products. Fable has safeguards that block
    most cybersecurity and biology tasks, and Mythos removes them for vetted users. Anthropic
    reports that Mythos 5.2 found 10.2% more vulnerabilities than Opus 5.5 on its internal
    CVE Rediscovery set of 1,829 CVEs. All benchmark numbers in the post are vendor-run, and
    the system card describes the method.
  comments: >-
    The Hacker News thread reached 372 points and 157 comments within about an hour of posting.
  sources:
