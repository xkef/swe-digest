- title: >-
    Hyperlight adds hyperlight-unikraft to run unmodified Linux binaries in snapshot-restored
    micro-VMs for agent code
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Microsoft's embeddable Rust VMM now runs Python, Node.js, Java and other stock Linux binaries
    in micro-VMs that restore from snapshots in ms.
  summary: >-
    hyperlight-unikraft runs a Unikraft unikernel inside a Hyperlight micro-VM, so unmodified
    binaries for Python, Node.js, .NET, Java, PHP, Go, Rust, C, Bash and PowerShell run on
    x86_64 and arm64 with no SDK or recompile. It snapshots a warmed runtime: a script importing
    numpy, pandas and scikit-learn took 45 ms from snapshot against 1,119 ms natively, while
    a Python hello world was slower at 22 ms against 17 ms. Integrations include urunc for
    containerd and Kubernetes, an MCP server with a stateful run_python tool, smolagents,
    an OpenAI Agents SDK sandbox provider, ClickHouse Python UDFs and verl reward execution.
  why: >-
    Teams sandboxing agent-generated code get a hypervisor boundary with startup costs near
    or below native for heavy runtimes, deny-by-default mounts and network, and a containerd
    path into Kubernetes.
  background: >-
    Hyperlight is a CNCF Sandbox project. Unlike QEMU or Firecracker, which run as separate
    processes, it is a library virtual machine monitor that an application links in, using
    KVM or MSHV on Linux, WHP on Windows and Hypervisor.framework on macOS. A unikernel is
    a single-application operating system with one address space and only the kernel components
    that application needs. The digest covered a Firecracker microVM escape on 2026-11-07,
    a reminder that the hypervisor boundary narrows risk but does not remove it.
  sources:
  - label: primary
    url: https://www.cncf.io/blog/2026/11/09/run-linux-applications-in-hypervisor-isolated-micro-vms-with-hyperlight/
- title: >-
    Claude Code 2.1.321 makes Fable 5.2 the default Fable model and fixes MCP OAuth secrets
    leaking on redirects
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    The release also closes a sandbox gap where a read-only Bash command ran unsandboxed without
    a prompt, and adds remote-control settings.
  summary: >-
    Claude Code 2.1.321 adds claude-fable-5-2 with a 1M context and moves saved Fable 5.1
    picks to it, at once on Pro and Max and after an admin allows it on Team and Enterprise.
    It fixes MCP OAuth requests that sent refresh tokens to another host when a server redirected
    them, a read-only Bash command that ran outside the sandbox without a prompt, and deny
    rules that missed files written by cp or mv into a directory. It also adds --settings
    to claude remote-control and lets mods Claude writes turn on without asking in auto and
    bypass modes.
  why: >-
    Teams that rely on the sandbox, deny rules or MCP OAuth servers should upgrade, and should
    check the new default that lets Claude-written mods activate in auto mode.
