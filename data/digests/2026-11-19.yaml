- title: >-
    HubSpot's Aviator Java agent harness runs Breeze and Sidekick Code, which merges over
    2,500 PRs a week
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    HubSpot built a model-agnostic Java harness with deferred tool search, SKILL.md tool loading
    and WASM sandboxes for thousands of agents.
  summary: >-
    HubSpot's Aviator stores conversations in a provider-neutral transcript that it rewrites
    per vendor, so agents can switch models mid-conversation, checkpoint to JSON and hand
    transcripts between agents. It exposes existing internal RPCs as tools, defers most of
    3,000-plus tools behind tool search, extends SKILL.md with load-tools and suggested-tools
    metadata, and gives agents embedded Python and Bash sandboxes in WASM with fixed egress
    points. HubSpot says Sidekick Code, its cloud coding agent on Aviator, merges more than
    2,500 pull requests a week.
  why: >-
    It is a concrete design for a shared in-house harness where provider fallback, tool scaling
    and sandboxing are solved once for every team.
  sources:
