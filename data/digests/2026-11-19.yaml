- title: >-
    Depthfirst shows low-privilege SQL accounts reaching code execution in PostgreSQL, MySQL
    and ClickHouse
  section: Security
  category: Security
  blurb: >-
    A researcher turned memory bugs reachable with only temporary-table rights into shells
    on PostgreSQL, MySQL and ClickHouse servers.
  summary: >-
    Zheng Yu of Depthfirst published proof-of-concept exploits on 2026-11-18 that use ordinary
    grants, such as PostgreSQL's default TEMPORARY privilege, to reach memory corruption in
    engine code. PostgreSQL CVE-2026-116331, a type confusion fixed in 18.7, 17.12, 16.16,
    15.20 and 14.25, lets a login role run code as the database OS user, MySQL CVE-2026-101786
    affects 26.7.0 to 26.7.1, and a ClickHouse binary row format overflow reproduced on 26.7.5.10
    has no CVE or confirmed fix. A separate Oracle chain through Oracle Text and the ORDS
    GraphQL interface needs no login, and no exploitation has been reported.
  why: >-
    SQL permissions limit which tables a role can read, not which engine code it can reach,
    so roles that do not need temporary objects should lose TEMPORARY and temp-table rights
    alongside patching.
  background: >-
    PostgreSQL grants the TEMPORARY privilege on each database to PUBLIC by default, so any
    role that can log in can create temporary tables, types and functions in its own pg_temp
    schema. Database engines parse, plan and execute SQL in large C and C++ codebases, so
    a bug in that code is reachable by anyone who can send queries. The PostgreSQL fix shipped
    in the 2026-11-12 minor releases that the digest tracked for an extension ABI change.
  followup: A ClickHouse CVE and fixed release for the binary row format overflow.
  sources:
  - label: discussion
    url: https://thehackernews.com/2026/11/researcher-demonstrates-database-rce.html
  thread: f-0242
- title: >-
    Anthropic says Claude Fable 5.2 agents solved two open black hole physics problems over
    six weeks of background runs
  section: AI
  category: AI
  blurb: >-
    A researcher ran one agent per open problem for six weeks. Two results, one verified in
    Lean, came out with a physicist checking each.
  summary: >-
    An Anthropic researcher had Claude list 22 open problems and ran a separate agent on each,
    with shared progress posts, for about six weeks. The agents completed a three-loop calculation
    set up in 2003 showing the weak-coupling Hawking-Page transition in N=4 super Yang-Mills
    is abrupt, and found and proved the exact limit of the simplest modular bootstrap bound
    in 3D gravity. The bootstrap proof was formally verified in Lean, and a physicist checked
    every main result.
  why: >-
    It is a first-party account of long-running, loosely coordinated research agents producing
    verifiable results, with the setup described.
  sources:
  - label: primary
    url: https://www.anthropic.com/research/claude-black-hole-physics
  - label: discussion
    url: https://news.ycombinator.com/item?id=50563148
- title: >-
    Spotify shows when offline evals can replace A/B tests, and how measurement noise hides
    real offline-online links
  section: AI
  category: AI
  blurb: >-
    In Spotify's example, a naive estimate says the offline eval explains 24% of online variation
    when the true figure is 60%.
  summary: >-
    Spotify formalizes shipping an LLM feature change on offline evals alone as bounding the
    risk of harming an online metric, using a gate that ships, kills, or sends a change to
    an A/B test based on thresholds tied to offline-online correlation. It shows measurement
    error attenuates the observed correlation, pooled experiment classes can fake a strong
    link, and LLM judges whose bias depends on the treatment arm can flip signs. It recommends
    a random audit pool of A/B tests to detect drift, and Spotify still pairs evals with online
    experiments.
  why: >-
    Teams gating prompt or model swaps on LLM-judge evals need noise correction, homogeneous
    history and ongoing audits before skipping A/B tests.
  background: >-
    A surrogate metric stands in for an outcome that is slow or costly to measure, here offline
    eval scores standing in for online A/B results. Errors-in-variables bias means noise in
    both measurements pulls an estimated correlation toward zero, which meta-analysis methods
    can correct when error variances are known.
  event: spotify-offline-evals-shipping-gate
  sources:
  - label: primary
    url: https://engineering.atspotify.com/2026/11/when-can-you-ship-on-offline-evals-alone/
- title: >-
    Claude Code 2.1.328 starts sessions on cloud providers in auto mode and lets failing MCP
    tool hooks block actions
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Claude Code 2.1.328 extends auto mode to Opus 4.6 and Sonnet 4.6 on cloud providers and
    lets a failing MCP tool hook block the action.
  summary: >-
    Claude Code 2.1.328 adds auto mode for Opus 4.6 and Sonnet 4.6 on Amazon Bedrock, Google
    Cloud's Agent Platform, Microsoft Foundry and the Claude apps gateway, and interactive
    sessions with no permission mode set now start in it, with disableAutoMode to turn it
