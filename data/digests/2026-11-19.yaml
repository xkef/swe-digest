    cluster.
  background: >-
    Dataplane V2 replaces iptables rules and kube-proxy with eBPF programs from Cilium that
    look up services and policies in kernel maps. Until now, moving a GKE cluster onto it
    meant creating a new cluster and migrating workloads.
