- title: >-
    JEP 515 method profiles cut javac warmup 14% on Java 25 but leave code 5% slower after
    200 rounds on Java 28
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Measurements show cached method profiles speed early rounds, slow the first round on Java
    28 through eager compilation, and lose lambda inlining.
  summary: >-
    Sven Woltmann measured a program that compiles 50 files per round with javac: with AOT
    cache profiles, rounds 2 to 5 took 13.9% less time on Java 25, but from about round 30
    the program ran slower than with no cache, 5% slower after 200 rounds on Java 28. He traces
    the long-run loss to profiles losing their lambda entries when the cache is written, so
    C2 stops inlining those lambdas. On Java 28, eager compilation of trained methods made
    the first round 17.5% slower by queuing thousands of tasks ahead of methods the program
    needed.
  why: >-
    Teams adopting AOT caches for startup should benchmark steady-state throughput too, and
    can compare with -XX:-AOTReplayTraining or -XX:-AOTCompileEagerly.
  background: >-
    HotSpot runs code in an interpreter, then compiles hot methods with C1 and later the optimizing
    C2 compiler, which uses runtime profiles of branches and receiver types to decide inlining
    and speculation. Project Leyden's AOT cache, created from a training run, stores loaded
    and linked classes since Java 25, and JEP 515 adds those method profiles so C2 can start
    optimizing earlier.
  event: jep-515-aot-method-profiling-measurements
  sources:
  - label: primary
    url: https://foojay.io/today/ahead-of-time-method-profiling/
- title: >-
    LLVM declares its relicensing to Apache 2.0 with LLVM exception complete, covering over
    99.5% of its code
  section: Languages and runtimes
  category: Languages
  blurb: >-
    After work begun in 2017, more than 1,300 contributors and about 100 organizations agreed
    to move pre-2019 LLVM code to Apache 2.0.
  summary: >-
    Kristof Beyls announced on 2026-11-19 that over 99.5% of all code ever contributed to
    LLVM is now under Apache-2.0 WITH LLVM-exception, has been removed, or is too small for
    copyright. New contributions have used that license since 2019-01-19, while older code
    was under UIUC/NCSA and MIT. Updated LICENSE files and documentation will point to the
    single license for LLVM 25 in 2027.
  why: >-
    Projects that vendor or redistribute LLVM, Clang or its runtimes will deal with one license
    instead of tracking legacy NCSA and MIT terms.
  event: llvm-relicensing-complete
  sources:
