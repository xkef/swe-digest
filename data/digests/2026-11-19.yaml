- title: >-
    PostgreSQL 19 ships REPACK CONCURRENTLY, plan advice, read-your-writes on standbys and
    JIT off by default
  section: Top stories
  category: Infrastructure
  blurb: >-
    PostgreSQL 19 adds REPACK CONCURRENTLY, pg_plan_advice, WAIT FOR LSN on standbys, and
    turns JIT off by default.
  summary: >-
    The PostgreSQL Global Development Group released PostgreSQL 19 on 2026-11-19. REPACK replaces
    VACUUM FULL and CLUSTER and with CONCURRENTLY reclaims bloat without blocking reads or
    writes, pg_plan_advice and pg_stash_advice pin query plans by query identifier, and WAIT
    FOR LSN lets a standby session wait until it has replayed a given WAL position. Creating
    the first logical replication slot now raises the effective WAL level without a restart,
    sequences replicate logically, JIT is off by default, lz4 becomes the default TOAST compression
    when built in, md5 authentication logs a warning, and RADIUS support is removed.
  why: >-
    Upgrades need checks for RADIUS and md5 authentication and for analytic queries that relied
    on JIT, while REPACK CONCURRENTLY and WAIT FOR LSN remove blocking VACUUM FULL runs and
    hand-rolled replica lag checks.
  background: >-
    PostgreSQL uses MVCC, so updates and deletes leave dead row versions that plain VACUUM
    marks reusable without shrinking the table. VACUUM FULL and CLUSTER rewrite the table
    to reclaim space but hold an exclusive lock, which is why online rewrites lived in external
    extensions such as pg_repack. Streaming replicas replay the primary's write-ahead log
    asynchronously, and an LSN is a byte position in that log, so a read sent to a standby
    can miss a write just committed on the primary. PostgreSQL 18 introduced the asynchronous
    I/O subsystem that 19 now tunes with automatic worker scaling.
  followup: CloudNativePG operand images for PostgreSQL 19 and the first 19.x minor release.
  sources:
  - label: primary
    url: https://www.postgresql.org/about/news/postgresql-19-released-3449/
  thread: f-0241
- title: >-
    Mandiant: ARMORY CASTLE exploited vCenter CVE-2026-123890 as a zero-day before Broadcom's
    2026-11-19 patch
  section: Top stories
  category: Security
  blurb: >-
    A PRC-nexus group used an unauthenticated vCenter directory service bug in September to
    mint SSO admins, two months before the fix.
  summary: >-
    Broadcom fixed CVE-2026-123890, a CVSS 9.8 authentication bypass in the VMware Directory
    Service of vCenter 8.0, 9.0 and 9.1, on 2026-11-19 with no workaround. Mandiant and GTIG
    report that ARMORY CASTLE exploited it in early September 2026 with a Go tool called BONESAW,
    which leaks the SRP session key over the vmdir DCE/RPC interface on port 2012, exfiltrates
    the directory database, steals the STS SAML signing key and creates an SSO administrator.
    The actor then enabled SSH through the appliance API, took the vCenter master key and
    PostgreSQL credentials, and moved to ESXi hosts.
  why: >-
    Patch vCenter now, restrict port 2012 to trusted hosts, and treat the SAML signing key
    on any exposed vCenter as possibly stolen.
  background: >-
    vCenter is the management appliance for VMware ESXi hosts, and vmdir is the LDAP-style
    directory that backs its single sign-on. Whoever holds the SSO Security Token Service
    signing key can forge SAML assertions for any user, a technique called Golden SAML, so
    patching alone does not evict an attacker who already took the key. Broadcom fixed CVE-2026-59309,
    another 9.8 bypass in the same component, on 2026-07-29, and Mandiant says BONESAW ran
    against a server already patched for that flaw.
  followup: A CISA KEV listing and reports of exploitation beyond ARMORY CASTLE.
  sources:
  - label: primary
    url: https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/
  - label: discussion
    url: https://thehackernews.com/2026/11/critical-vmware-vcenter-flaw-cvss-98.html
  thread: f-0244
- title: >-
    Apache Roller CVE-2026-129448, an unauthenticated XML-RPC deserialization RCE, is exploited
    in the wild
  section: Security
  category: Security
  blurb: >-
    The ASF says attackers are exploiting an unauthenticated XML-RPC deserialization flaw
    in Apache Roller 4.0.0 through 6.1.4.
  summary: >-
    The Apache Software Foundation says CVE-2026-129448, rated CVSS 9.8, lets an unauthenticated
    attacker run code on Roller 4.0.0 through 6.1.4 because the XML-RPC endpoint deserializes
    vendor extension types before it authenticates the caller, and that the issue is being
    actively exploited. It is the same flaw as CVE-2026-82384, which was patched in 2026-09
    but listed only 6.1.5 as affected. Roller 6.1.6 fixes it, and the workaround is to set
    enabledForExtensions to false in WEB-INF/web.xml or remove the /roller-services/xmlrpc
    mapping, since disabling XML-RPC in the admin UI does not help.
  why: >-
    Anyone running Roller on an older release than 6.1.5 skipped the September fix because
    of the narrow affected range and must upgrade or remove the XML-RPC mapping.
  sources:
  - label: discussion
    url: https://thehackernews.com/2026/11/critical-apache-roller-rce-flaw-under.html
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/apache-warns-of-roller-rce-vulnerability-exploited-in-attacks/
- title: >-
    PHP 8.5.13, 8.4.28, 8.3.37 and 8.2.36 fix session, timezone and CGI flaws that can lead
    to code execution
  section: Security
  category: Security
  blurb: >-
    PHP's four supported branches fix critical bugs in sessions, timezone caching and PHP-CGI
    that need non-default or uncommon setups to exploit.
  summary: >-
    PHP released 8.5.13, 8.4.28, 8.3.37 and 8.2.36 on 2026-11-19. The 8.5.13 changelog lists
    remote code execution fixes for a session serializer mismatch (CVE-2026-115560), partially
    overwritten session files (CVE-2026-126714), and use-after-frees in magic method backtraces
    (CVE-2026-129474) and the timezone cache (CVE-2026-129496), plus a PHP-CGI PATH_INFO out-of-bounds
    write (CVE-2026-129538), PHP-FPM request smuggling (CVE-2026-129289) and a PHAR signature
    downgrade bypass (CVE-2026-128090). LWN reports the project says every critical-severity
    flaw requires a non-default configuration or an uncommon setup.
  why: >-
    PHP and PHP-FPM deployments should move to the fixed releases or distribution packages,
    and the session handler and serializer settings decide whether the worst bugs are reachable.
  background: >-
    PHP sessions store per-user state on the server as serialized data and restore it on each
    request, and PHP's unserialize path has a long history of turning attacker-controlled
    bytes into object injection or memory corruption. PHP-CGI and PHP-FPM are the two ways
    PHP commonly runs behind a web server, and CGI's PATH_INFO handling has produced remote
    code execution flaws before. PHP ships security fixes on a four-week cycle across its
    supported branches.
  thread: f-0240
  sources:
