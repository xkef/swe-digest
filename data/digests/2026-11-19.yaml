  blurb: >-
    Anthropic sold 980 million Class A shares at $83 each and is set to start trading on Nasdaq
    as ANT on 2026-11-19.
  summary: >-
    Anthropic, PBC priced 980,000,000 Class A shares at $83.00, of which 956,351,354 are sold
    by the company and 23,648,646 by existing holders, after the SEC declared its registration
    effective on 2026-11-18. Trading on the Nasdaq Global Select Market under ANT is expected
    on 2026-11-19 and the offering is expected to close on 2026-11-20. Underwriters have a
    30-day option on 147,000,000 more shares.
  why: >-
