- title: >-
    Let's Get Rusty: partitioning a 99M-row count by hash cut runtime 25% while doing 70%
    more CPU work
  section: Videos
  category: Video
  blurb: >-
    Splitting user IDs into 4,096 hash partitions kept per-partition tables in cache, cutting
    DRAM fetches from 76 million to 26 million.
  summary: >-
    The video counts 17 million unique user IDs across 99 million rows with a single hash
    map, then with rows first scattered into 4,096 partitions by 12 hash bits and counted
    one partition at a time. Warm runtime dropped from 3.6 to 2.7 seconds. perf stat showed
    memory-bound stalls falling from about half of CPU capacity to 23%, retired work rising
    from 16% to 32%, and main memory fetches falling from 76 million to 26 million.
  why: >-
    For large group-by workloads, a radix partition pass can beat a single big hash table
    because cache misses, not instruction count, set the speed.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=E2khZ_H-v4c
- title: >-
    Energy-Based Reasoners reach 99.9% on Sudoku-Extreme with 1.8M parameters and 345x less
    inference compute
  section: Hacker News
  category: Pulse
  blurb: >-
    A 1.8M-parameter looped reasoner that descends a learned energy function hits 99.9% on
    Sudoku-Extreme with 345x less inference compute.
  summary: >-
    Researchers from Duke, UIUC and Harvard train a looped model whose updates are gradient
    descent on a learned energy over latent reasoning states, using the energy to rank candidates
    and a small gradient norm to stop early. With 1.8M parameters it reports 99.4% single-sample
    and 99.9% five-sample accuracy on Sudoku-Extreme, and adaptive stopping cuts FLOPs 10.9x
    against a fixed-depth version. The Hacker News post drew 309 points and 55 comments.
  why: >-
    It shows a built-in verifier and stopping signal for test-time compute, though only on
    algorithmic puzzles so far.
  background: >-
    Looped or recurrent reasoners such as TRM reuse one block many times to gain depth, but
    have no measure of progress to decide when to stop. An energy-based model assigns a scalar
    score to each state, so lower energy marks a better answer and its gradient gives a direction
    to improve.
  sources:
  - label: primary
    url: https://energy-based-reasoners.github.io/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50543989
- title: >-
    Experiment fits 16 million web servers in one 10 GB VM by replacing the kernel TCP stack
    with smoltcp over DPDK
  section: Hacker News
  category: Pulse
  blurb: >-
    The kernel ran out of RAM near 2.5 million listeners at about 3.4 KB per socket, while
    smoltcp needed about 620 bytes per idle server.
  summary: >-
    The post runs guest web servers inside one process with a custom scheduler and LFI sandboxing,
    listens across a subnet with AnyIP, and finds each Linux socket costs about 3,384 bytes
    in kernel structures. Moving TCP/IP to the userland smoltcp stack over TUN, TAP, DPDK
    or AF_XDP reached 16 million servers, with DPDK fastest and AF_XDP close behind while
    leaving the NIC visible to the kernel. The Hacker News thread drew 254 points and 30 comments.
  why: >-
    It quantifies the per-socket memory floor of the Linux network stack and the tradeoff
    between DPDK's exclusive NIC access and AF_XDP.
