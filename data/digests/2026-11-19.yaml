- title: >-
    Valkey 9.2 adds B+ tree sorted sets, Zstd compression for RDB and replication, and forkless
    replica sync
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The Redis fork's latest feature release cuts sorted set memory, compresses snapshots with
    Zstd and syncs replicas without forking the server.
  summary: >-
    Valkey 9.2, released 2026-11-19, stores sorted sets in B+ trees to cut memory overhead
    and adds Zstd compression for RDB persistence and replication as an alternative to LZ4.
    It adds forkless snapshotting and full replica synchronization, server-side hot key detection,
    and a DELEX command that deletes a string key conditionally on its value. Phoronix notes
    the release came days after the Redict fork was deprecated in favor of Valkey.
  why: >-
    Operators of large Valkey instances can avoid fork copy-on-write memory spikes during
    snapshots and replica syncs and shrink sorted set memory.
  background: >-
    Redis-style servers have traditionally written RDB snapshots and fed new replicas by calling
    fork, letting the child process write a point-in-time copy while the parent keeps serving.
    Copy-on-write pages make that cheap at first, but heavy writes during a long snapshot
    can nearly double memory use. Valkey forked from Redis in 2024 after the Redis license
    change.
  event: valkey-9-2-release
  sources:
  - label: primary
    url: https://www.phoronix.com/news/Valkey-9.2
- title: >-
    Google details Sashiko, its agentic Linux patch reviewer, with 1,200 reviews a day and
    a lower post-merge fix rate
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Google reports that Sashiko, its open agentic reviewer for kernel patches, runs 1,200
    reviews a day and is credited in 528 kernel CVEs.
  summary: >-
    Sashiko splits review into up to seven parallel single-focus specialist sessions that
    each list concerns and ruled-out concerns, then a triage verifier and one verification
    agent per contested case that must prove either a bug or a dismissal from code across
    all call sites. Since 2026-03 it has completed 241,000 reviews across 75 or more opted-in
    kernel lists, is credited in over 2,000 mainline commits, and the 60-day follow-up fix
    rate fell from a 3.4% baseline to 2.2% in Linux 7.2. Commits with a clean review needed
    a fix 0.9% of the time against 7.6% for commits merged despite a critical warning, and
    on a benchmark of nearly 1,000 real escaped kernel bugs it catches 75.8% with Gemini 4
    Carbon.
  why: >-
    It is a measured design for AI pre-review: separate bug finding from verification, demand
    proof for dismissals, and tune against a benchmark of historical escaped bugs.
  background: >-
    Kernel patches are reviewed on public mailing lists, and Syzkaller fuzzing and build bots
    catch only crashes and build failures, so human maintainers are the bottleneck. Google
    donated Sashiko to the Linux Foundation, and it posts review emails only to lists whose
    maintainers opt in. The authors note its core engine does not depend on C or kernel rules
    and suggest the same approach for GCC, LLVM and Git.
  sources:
  - label: primary
    url: https://cloud.google.com/blog/products/application-development/lessons-from-building-sashiko-an-agentic-code-review-system/
  - label: discussion
    url: https://www.phoronix.com/news/Sashiko-0.9.4-Released
- title: >-
    ClickHouse Cloud open-sources Node Problem Mitigator to drain and replace unhealthy Kubernetes
    nodes on three clouds
  section: Engineering posts
  category: Engineering post
  blurb: >-
    ClickHouse turns kernel log errors into permanent node conditions, then taints, drains
    and replaces bad nodes with cooldowns and a kill switch.
  summary: >-
    ClickHouse Cloud found nodes that stayed Ready while pods failed writes, such as an EC2
    node with a failed NVMe member of a RAID array, because the upstream Node Problem Detector
    rule for EXT4 errors only emitted an event that expires after an hour. It now runs one
    NPD rule catalog on AWS, GCP and Azure with permanent conditions and plugin checks, such
    as NVMe timeouts on two devices within a minute, and a new open-source controller, node-problem-mitigator,
    that evaluates, drains or terminates nodes per condition behind a kill switch, exclusions
    and a global cooldown. A Node Debug Collector captures a diagnostic bundle before the
    node is removed.
  why: >-
    Kubernetes Ready status misses disk, kernel and runtime faults, and this gives a tested
    rollout pattern and an open-source controller for acting on Node Problem Detector conditions.
  background: >-
    The kubelet reports only its own view of a node through conditions such as Ready, MemoryPressure
    and DiskPressure. Node Problem Detector is a DaemonSet that tails kernel and system logs
    or runs probe scripts and publishes the results as node conditions or short-lived events.
    Nothing in core Kubernetes acts on those custom conditions, so a separate controller has
    to drain or replace the node.
  sources:
  - label: primary
    url: https://clickhouse.com/blog/node-reliability-across-three-clouds
- title: >-
    Zerodha replaces SSDB with Blobasaur, a Rust blob server that shards SQLite behind the
    Redis protocol
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Zerodha's open-source Blobasaur stores JSON blobs in sharded SQLite files with zstd and
    Redis Cluster routing, at about 2 ms p99.
  summary: >-
    Zerodha built Blobasaur in Rust to store user layout blobs from kilobytes to megabytes,
    after rejecting ScyllaDB, PostgreSQL, RocksDB, SeaweedFS and S3 for its overwrite-heavy
    workload. Each node splits keys across SQLite WAL files with one group-committing writer
    per shard, and 16 shards raised 64 KiB write throughput 3.3x over one shard. A three-node
    cluster of 4 vCPU machines holds p99 near 2 ms during trading hours, and the post covers
    fixes for file growth, async write visibility and TTL cleanup contention.
  why: >-
    It shows how far sharded SQLite with group commit and compression can go as a small-server
    key-value store, and which SQLite defaults bite at scale.
  background: >-
    SQLite in WAL mode lets many readers run alongside one writer per database file, so write
    concurrency comes from splitting data across files. Group commit batches many client writes
    into one transaction to amortize fsync and WAL overhead. Redis Cluster clients route keys
    by CRC16 hash slot and follow MOVED redirects, which lets a new server reuse existing
    client libraries.
  comments: The Hacker News thread reached 197 points and 58 comments.
  sources:
  - label: primary
    url: https://zerodha.tech/blog/high-performance-distributed-blob-storage/
  - label: discussion
