- title: >-
    Energy-Based Reasoners reach 99.9% on Sudoku-Extreme with 1.8M parameters and 345x less
    inference compute
  section: Hacker News
  category: Pulse
  blurb: >-
    A 1.8M-parameter looped reasoner that descends a learned energy function hits 99.9% on
    Sudoku-Extreme with 345x less inference compute.
  summary: >-
    Researchers from Duke, UIUC and Harvard train a looped model whose updates are gradient
    descent on a learned energy over latent reasoning states, using the energy to rank candidates
    and a small gradient norm to stop early. With 1.8M parameters it reports 99.4% single-sample
    and 99.9% five-sample accuracy on Sudoku-Extreme, and adaptive stopping cuts FLOPs 10.9x
    against a fixed-depth version. The Hacker News post drew 309 points and 55 comments.
  why: >-
    It shows a built-in verifier and stopping signal for test-time compute, though only on
    algorithmic puzzles so far.
  background: >-
    Looped or recurrent reasoners such as TRM reuse one block many times to gain depth, but
    have no measure of progress to decide when to stop. An energy-based model assigns a scalar
    score to each state, so lower energy marks a better answer and its gradient gives a direction
    to improve.
  sources:
  - label: primary
    url: https://energy-based-reasoners.github.io/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50543989
