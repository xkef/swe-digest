- title: >-
    Claude Code 2.1.329 shows where a folder's hooks are declared and stops erroring Code
    Mode hooks from refusing tool calls
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    The trust dialog now names where hooks come from, and in Code Mode a failing PreToolUse
    hook no longer blocks a call unless onFailure is block.
  summary: >-
    Claude Code 2.1.329 adds a trust dialog warning naming where a folder's hooks are declared
    and warns when hooks in managed settings fail to load in Claude Desktop and other non-interactive
    hosts. In Code Mode, a PreToolUse hook that errors no longer refuses a script's tool call,
    matching behavior outside Code Mode, so hooks that must block need "onFailure": "block".
    The release also makes /code-review with no target review the whole branch against the
    default branch, and removes the 2.1.326 automatic retry on max_tokens errors behind gateways.
  why: >-
    Teams that rely on PreToolUse hooks as guardrails in Code Mode must set onFailure to block,
    or a crashing hook now lets the call through.
  event: claude-code-2-1-329-release
  sources:
  - label: primary
    url: https://github.com/anthropics/claude-code/releases/tag/v2.1.329
- title: >-
    Paper: replaying RL experts' training logs consolidates them into one model at a seventh
    of their training compute
  section: ML research
  category: Paper
  blurb: >-
    A new paper merges RL-trained domain experts into one model by replaying their training
    logs, at about a seventh of the training compute.
  summary: >-
    Multi-expert replay policy distillation (MRPD) replays each expert's logged rollouts,
    sampling probabilities and rewards through the student in the order the experts saw them,
    recomputing the policy gradient and distilling the final experts at logged prefixes, with
    no new sampling, environment or reward model calls. On reasoning, search and SQL agent
    tasks it beats online RL baselines and multi-teacher on-policy distillation from the same
    experts at a fraction of the cost. The authors find log order matters more than amount
    or reward, treating expert logs as a curriculum.
  why: >-
    Teams that post-train separate RL experts and then merge them can keep their rollout logs
    and skip a costly second round of environment sampling.
  background: >-
    A common frontier recipe trains one RL expert per domain, then merges them with multi-teacher
    on-policy distillation, where the student generates its own trajectories and each expert
    scores every token. That second stage repeats sampling in every environment. Keeping the
    replay close to the experts' own trajectory keeps updates inside the PPO-style clip range
    even though the data is off-policy.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.24059v1
- title: >-
    ProteinGeoBench finds frontier agents strong at structure lookup but weak at geometry
    from atom coordinates
  section: ML research
  category: Paper
  blurb: >-
    Across 4,249 runs on 131 protein structure tasks, Claude Opus 5 scored 0.907 on lookups
    and 0.716 on calculations from coordinates.
  summary: >-
    ProteinGeoBench gives agents protein structure files and asks them to look up facts, check
    sequences, compute geometry or reason about structures, with four frontier models run
    repeatedly and 26 models on a subset. Three of four frontier models do best at lookup
    and worst at calculation, and the top three sit within 0.031, too close to rank. Blocking
    structural databases or network access lowered scores, and swapping in each provider's
    own CLI agent moved scores by up to 0.09.
  why: >-
    Scores for structural biology agents should be reported by task type with run counts,
    harness and network access, since each shifts results.
  event: proteingeobench-structural-biology-agents
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.26829
- title: >-
    GitHub CLI 2.105.0 adds gh event listen to wait for pull request events over Event Streams
  section: Developer tools
  category: Dev tools
  blurb: >-
    gh 2.105.0 adds gh event listen, which blocks until a pull request gets a review, check
    result or state change instead of polling.
  summary: >-
    gh event listen takes a pull request URL and event types, creates an Event Streams subscription
    and prints each event as JSON, exiting after the first by default, with --count, --follow,
    --timeout, --jq and --template options. It covers submitted reviews, state and head changes,
    merge conflicts and completed check suites, and gh pr create, gh pr view, gh run watch
    and gh api now suggest it to agents instead of polling. The commands are in preview and
    need Event Streams waitlist access.
  why: >-
    Agent loops and CI scripts that poll pull request state can block on one command and stop
    spending API rate limit on loops.
  sources:
  - label: primary
    url: https://github.blog/changelog/2026-11-18-wait-for-pull-request-events-with-github-cli
- title: >-
    PHP 8.6.0 adds partial function application, an Io\Poll API, a Duration class and stricter
    session defaults
  section: Languages and runtimes
  category: Languages
  blurb: >-
    PHP 8.6 ships epoll and kqueue polling for event loops, post-quantum Sodium KEMs, and
    turns on strict session mode and HttpOnly cookies.
  summary: >-
    PHP 8.6.0, released 2026-11-19, adds partial function application with ? placeholders,
    a nanosecond \Time\Duration class, an Io\Poll API over epoll, kqueue, event ports and
    WSAPoll, clamp(), a SortDirection enum and readonly property defaults. Sodium gains X-Wing
    and ML-KEM-768, and TLS streams gain session resumption, PSKs and 0-RTT. Sessions now
    default to strict mode, HttpOnly and SameSite Lax, and the release deprecates return inside
    finally and the mbstring regex functions.
  why: >-
    PHP services upgrading to 8.6 should test session behavior and deprecation warnings, and
    async PHP libraries get a native polling base.
  comments: The Hacker News thread reached 225 points and 104 comments.
