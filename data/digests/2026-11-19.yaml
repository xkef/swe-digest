- title: >-
    Debian APT will drop detached-signature, weak-hash and unsigned repository support in
    unstable after 2026-11-24
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    APT's maintainer cuts legacy repository formats from its download code, citing a recent
    MITM flaw and AI-driven vulnerability research.
  summary: >-
    Julian Andres Klode announced that APT in Debian unstable will remove support for repositories
    with only detached Release.gpg signatures, repositories with only MD5 or SHA1 hashes,
    and repositories without hashes or a Release file, with a cut-off of 2026-11-24 for next
    week's changes. Insecure repositories using allow-insecure or allow-downgrade-to-insecure
    and download fallbacks are also being considered for removal. He cites the recent vulnerability
    in APT's download code and AI security research, and warns that security updates from
    2027 onward may remove features without notice.
  why: >-
    Third-party apt repositories that still publish only detached signatures or weak hashes
    will stop working on Debian unstable and may break later on stable.
  background: >-
    APT trusts a repository through a signed Release file that lists hashes of the package
    indices, which in turn list hashes of each package. The file can be signed inline as InRelease
    or with a separate Release.gpg signature, and InRelease avoids a race between fetching
    the file and its signature. Older repository tooling still emits the detached form and
    weak hashes.
  followup: APT uploads to Debian unstable after 2026-11-24.
  sources:
  - label: discussion
    url: https://www.phoronix.com/news/Debian-APT-Removing-Features
