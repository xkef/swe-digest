- title: >-
    Lovable CTO: Git-like agent trajectories, stateless workers and forkable VM checkpoints
    for 10-hour agent runs
  section: Talks
  category: Video
  blurb: >-
    Lovable stores each agent's history as an append-only forkable log and restores checkpointed
    VMs in about 230 ms for runs with no time limit.
  summary: >-
    At CODE Summit 2026, Lovable CTO Fabian Hedin said a 2023 multi-agent framework made the
    product worse, so the team went back to a single LLM loop before returning to agents that
    now use over a billion tokens per minute with no cap on run length. Each agent has an
    inbox and an append-only trajectory where every event points to a parent, so runs fork
    like Git branches, prompts are rendered per model from that log, and stateless workers
    persist after each step so the service deploys about 700 times a day without interrupting
    a 10-hour run. Sandboxes restore disk, memory and processes from checkpoints in about
    230 ms, fork with copy-on-write RAM, and stream memory to boot early, and a Rust rewrite
    of the JavaScript dev server cut preview start from 40 to 3 seconds with 6.5 times less
    memory.
  why: >-
    Separating agent history from worker processes and checkpointing whole sandboxes are concrete
    designs for long-running agents that survive frequent deploys.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=pZWPq_ZAmM4
- title: >-
    Thariq Shihipar keeps a linted, human-readable spec layer in his agent-built game so he
    can follow and tune it
  section: Talks
  category: Video
  blurb: >-
    He splits his codebase into agent-written engine code and a readable folder that works
    as a custom scripting language he edits directly.
  summary: >-
    At CODE Summit 2026, former Anthropic engineer Thariq Shihipar says vibe coding a fighting
    game left him unsure what his characters did. He now keeps one folder of code with lint
    rules and Claude instructions that make it read like English, using units such as meters,
    while the engine below stays agent-owned. He tunes moves there by hand with IDE tab completion
    and asks Claude only for new primitives, and argues he was wrong that Bash, React or diffusion
    models would dominate how agents work.
  why: >-
    Splitting agent-written code into an opaque engine and a constrained, human-owned spec
    layer is a concrete way to keep design control on agent-heavy projects.
