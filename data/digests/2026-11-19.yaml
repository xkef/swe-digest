- title: >-
    Firezone pushes its macOS WireGuard client past 5 Gbit/s after finding XNU UDP sockets
    never signal backpressure
  section: Apple platforms
  category: Apple
  blurb: >-
    On macOS, UDP writes succeed while the interface queue silently drops packets, so Firezone
    moved to connected sockets that return ENOBUFS.
  summary: >-
    Firezone's macOS client topped out near 1 Gbit/s down, with uploads often at a few hundred
    Mbit/s. Reading the XNU source, the team found unconnected UDP sockets never fill their
    send buffer, so non-blocking writes never return EWOULDBLOCK while the interface transmit
    queue drops datagrams, and SO_SNDBUF only caps datagram size. Connected UDP sockets instead
    fail with ENOBUFS when the queue is full and wake on write-readiness, which Firezone now
    uses to pause its transmit thread, and with batching the client exceeds 5 Gbit/s.
  why: >-
    Any async runtime that relies on EWOULDBLOCK for UDP on macOS or iOS can lose packets
    under load, so VPN and QUIC code there needs explicit ENOBUFS handling.
  background: >-
    Loss-based TCP congestion controllers such as CUBIC shrink their window when acknowledgments
    show missing data. A VPN's TUN device looks like a network link to the inner TCP connection,
    so packets dropped inside the VPN software are read as congestion and throttle the sender
    even when the real link has spare capacity. XNU is the kernel under macOS and iOS, and
    its networking stack descends from BSD.
  event: firezone-macos-wireguard-5gbps
  sources:
  - label: primary
    url: https://www.firezone.dev/blog/apple-client-performance
  - label: discussion
    url: https://news.ycombinator.com/item?id=50554076
