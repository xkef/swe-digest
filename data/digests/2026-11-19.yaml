- title: >-
    Datadog rewrites queries from a knowledge graph so old OTel, current OTel and Datadog
    names resolve together
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Datadog's Semantic Core encodes conditional equivalences, such as tag filters and unit
    scaling, and expands queries across conventions.
  summary: >-
    Datadog models metrics and attributes as graph nodes, with deprecation and equivalence
    edges that carry conditions such as a state:user tag filter or a 0 to 1 versus 0 to 100
    unit scale. The graph compiles into a cached configuration that a Semantics SDK uses to
    rewrite queries in memory, for example expanding service.name into an OR with service,
    and to normalize results back to the caller's vocabulary. An external validator runs the
    same scenarios through OTel-only and Datadog-only setups to check the equivalences against
    real data.
  why: >-
    Teams running mixed OpenTelemetry convention versions get a pattern for query-time translation
    instead of rewriting stored telemetry.
  background: >-
    OpenTelemetry semantic conventions name attributes and metrics, and they change as areas
    stabilize, for example http.method becoming http.request.method. Services rarely upgrade
    instrumentation together, so one backend sees several names for the same concept at once.
  sources:
  - label: primary
    url: https://www.datadoghq.com/blog/engineering/semantic-translation-otel/
