date: '2026-11-19'
updated: 2026-11-19T09:01Z
lede: >-
  Ruby ships fixes for seven memory corruption bugs in its regex engine and case conversion,
  including a pre-auth RCE in default Rails apps.
stories:
- title: >-
    Ruby 4.0.10, 3.4.13 and 3.3.14 fix seven Regexp and case conversion flaws, one a pre-auth
    RCE in default Rails
  section: Top stories
  category: Security
  blurb: >-
    Seven memory-safety bugs in Ruby's regex engine and case conversion allow RCE, and one
    is reachable pre-auth in default Rails apps.
  summary: >-
    The Ruby team released 4.0.10, 3.4.13 and 3.3.14 on 2026-11-18 to fix seven vulnerabilities
    in the regular expression engine and string case conversion, and says it knows of proofs
    of concept that reach remote code execution for several. Veria Labs' write-up of GHSA-34m4-m9fh-gqp5,
    which it calls Ruby2Shell, shows a one-byte heap overflow when upcasing ß in single-byte
    encodings such as Windows-1252. The bug is reachable without authentication in default
    Rails and classic Sinatra apps, and bundled Ruby in GitLab 19.6.0, GitHub Enterprise Server
    3.22.5, Mastodon, Discourse, OpenProject and Chatwoot is affected.
  why: >-
    Every Rails or Sinatra service and every self-hosted GitLab, GHES or Mastodon instance
    needs the new Ruby or a vendor release now, because Ruby 3.2 and older get no fix.
  background: >-
    CRuby's regex engine and its encoding-aware string functions are written in C and derive
    from the Onigmo library, so memory-safety bugs there surface in Ruby code that looks safe.
    In ISO-8859 and Windows-125x encodings there is no capital ß, so upcasing it emits two
    bytes, SS, while the conversion loop checked room for only one. Rails accepts multipart
    form fields that declare their own encoding, which is how attacker text in a legacy encoding
    reaches upcase or casecmp?. Several of the seven flaws were reported by Stephan Lipp of
    Ada Logics together with Anthropic.
  followup: >-
    Veria Labs plans to publish its proof of concept around 2026-11-25. CVE IDs are still
    pending.
  comments: >-
    The Hacker News thread reached 237 points and 82 comments. Thomas Ptacek walks through
    the ß expansion and notes Rails apps rarely need to accept Windows-1252 at all, while
    a commenter points out that French Excel exports CSV in Windows-1252 by default, so ingesting
    apps do run regexes over it. Another commenter says GitHub is taking about four weeks
    to assign CVEs it used to issue in days.
  sources:
  - label: primary
    url: https://www.ruby-lang.org/en/news/2026/11/18/multiple-vulnerabilities-in-regexp-and-string/
  - label: primary
