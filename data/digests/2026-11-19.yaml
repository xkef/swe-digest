    url: https://www.phoronix.com/news/LLVM-Re-Licensing-Complete
- title: >-
    Spring Boot 4.2.0 and Spring Framework 7.1.0 ship, moving forwarded header settings under
    server and deprecating Pulsar
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The new Spring Boot minor unifies forwarded header properties, deprecates Apache Pulsar
    support and moves to Framework 7.1 and Micrometer 1.18.
  summary: >-
    Spring Boot 4.2.0, released 2026-11-19, unifies forwarded header properties under the
    server configuration property, restores ForwardedHeaderFilter for servlet apps that do
    not use WebMvc, and deprecates Apache Pulsar support. A related fix notes reactive web
    servers stopped using forwarded headers on a cloud platform after that change. It upgrades
    to Spring Framework 7.1.0, Spring Security 7.2.0, Spring Kafka 4.2.0, Micrometer 1.18.0
    and OpenTelemetry 1.68.0, and Framework 7.1.0 lowers the default maximum SpEL expression
    nesting depth to 200.
  why: >-
    Spring Boot apps behind a reverse proxy should recheck their forwarded header configuration
    on upgrade, and Pulsar users should plan a move.
  background: >-
    Forwarded and X-Forwarded-* headers tell an application the original client address, scheme
    and host when a proxy terminates the connection. Trusting them from the wrong source lets
    a client spoof those values, which this digest covered on 2026-11-07 for Rails, Jetty
    and Spring Boot. Spring Boot can resolve these headers in the embedded server or through
    Spring's ForwardedHeaderFilter.
  event: spring-boot-4-2-0-release
  sources:
  - label: primary
    url: https://github.com/spring-projects/spring-boot/releases/tag/v4.2.0
  - label: primary
