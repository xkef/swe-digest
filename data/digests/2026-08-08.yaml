- title: Device tree support for Apple M3 Pro, Max and Ultra heads to Linux 7.3
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Device tree support for Apple M3 Pro, Max and Ultra heads to Linux 7.3, bringing them
    to the same level as the base M3 SoC in mainline.
  summary: >-
    The Apple device tree pull intended for the Linux 7.3 merge window adds device trees for
    all Apple devices carrying M3 Pro, M3 Max and M3 Ultra, bringing them to roughly the level
    Linux 7.2 reached for the base M3 SoC. The same pull adds HWMON support for M1 and M2
    series sensors. Phoronix states the support is not yet useful for end users, with features
    including GPU acceleration still unsupported, and names no timing for usable day-to-day
    support.
  why: >-
    Mainline gains a boot path for the larger M3 machines while the gap to daily use stays
    wide enough that Asahi remains the practical route.
  sources:
  - label: report
    url: https://www.phoronix.com/news/M3-Pro-Max-Ultra-Linux-7.3
  - label: discussion
    url: https://news.ycombinator.com/item?id=49219626
- title: >-
    Assembly Hall of Shame measures a single x86 instruction stalling for 198 billion cycles
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Assembly Hall of Shame documented x86 instruction stalling for 198 billion cycles, about
    62 seconds, using fxrstor64 with PCIe saturation.
  summary: >-
    The asm-hall-of-shame repository from Christopher Domas searches for the floor of single-instruction
    performance, with x86 entries running from nop at 1 cycle to fxrstor64 at 198,002,498,236
    cycles, about 62 seconds. The top entry uses fxrstor64 to load 512 bytes of FPU, MMX and
    XMM state from a high-latency MMIO region in the PCIe fabric on a Ryzen 7 5800H while
    a fleet of hammer cores saturates the PCIe root complex with tight 4-byte reads against
    a different high-latency register, so the timed load queues behind that traffic, and the
    entries below it name microcode assists on denormal operands, split locks that assert
    the external bus lock, rdrand depleting the entropy pool, and wbinvd writing the full
    cache hierarchy back to DRAM. Stated rules require a single non-interruptible instruction,
    factory stock hardware, no timing of trap handlers, and normalization to base clock, with
    scores self-reported by the author and the ARM and RISC-V leaderboards empty.
  why: >-
    Instruction tables bound the fast path, and a measured worst case of about 62 seconds
    for one instruction bounds the tail that scheduling and watchdog assumptions have to survive.
  sources:
  - label: primary
    url: https://github.com/xoreaxeaxeax/asm-hall-of-shame
  - label: discussion
    url: https://news.ycombinator.com/item?id=49214098
- title: Hacker News debates a reported Oracle ban on AI-generated OpenJDK contributions
  section: Hacker News
  category: Languages
  status: discussion
  blurb: >-
    Hacker News debated a reported Oracle ban on AI-generated OpenJDK contributions, though
    no primary source for the policy was found to verify it.
  summary: >-
    A Hacker News thread argues over a reported Oracle policy banning AI-generated contributions
    to OpenJDK. Commenters disagree over where an assisted-coding line falls, from editor
    completion to full generation, and over whether the stated reason is intellectual property
    risk. The submitted link is a news aggregator entry, and no OpenJDK primary for the policy
    resolved during this run.
  why: >-
    Contribution policy on assisted coding decides what a maintainer can accept, and this
    one is discussion rather than a verified policy until a primary appears.
  followup: Look for the policy text on an OpenJDK or Oracle primary source.
  sources:
  - label: discussion
    url: https://news.ycombinator.com/item?id=49213754
