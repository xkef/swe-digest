- title: Databricks publishes measured cost controls for agentic coding at scale
  section: Top stories
  category: Agentic coding
  status: confirmed
  blurb: >-
    Databricks published techniques achieving 50 percent fewer tokens and 30 percent lower
    costs for agentic coding with negative model evaluations.
  summary: >-
    Databricks reports roughly 50 percent fewer generated tokens from harness and cache tuning,
    and over 30 percent lower average task cost from request routing. The post records negative
    evaluation results, including Stripe declining Opus 4.7 and Databricks measuring a cost
    regression from Opus 5.0 against 4.8.
  why: >-
    Published negative model evaluations and named token-reduction techniques give teams a
    baseline to compare their own coding-agent spend against.
  sources:
