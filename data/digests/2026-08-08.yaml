date: '2026-08-08'
stories:
- title: >-
    WordPress 7.0.3 patches a pre-auth XSS that escalates to PHP execution through a logged-in
    administrator
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    WordPress 7.0.3 fixed a pre-auth XSS escalating to PHP execution when an administrator
    visits an attacker page, with public exploit code.
  summary: >-
    WordPress 7.0.3 fixes CVE-2026-64638. What is reachable without an account on a default
    install is JavaScript execution in the WordPress origin. pwn.ai's chain reaches PHP execution
    only in its steps 1 to 5, which require a logged-in administrator to visit an attacker-hosted
    page, where the injected callback clicks the Application Password approval button inside
    that authenticated session. pwn.ai words the result as working against a logged-in administrator
    towards full remote code execution, and states the chain was discovered entirely autonomously
    by its multi-agent workflow using open source models over about four days. pwn.ai gives
    the affected range as every WordPress version under active maintenance before 7.0.3. The
    release fixes eleven further issues and is being backported to every branch back through
    4.7. A full proof of concept has been public since 2026-08-07.
  why: >-
    Unauthenticated script execution in the site origin plus public exploit code, with a documented
    escalation to PHP execution the moment an administrator opens an attacker page, moves
    patching from routine to immediate for every self-hosted site.
  followup: >-
    Track backport coverage across the older branches and observed exploitation in the wild.
  sources:
  - label: primary
    url: https://wordpress.org/news/2026/08/wordpress-7-0-3-release/
  - label: analysis
    url: https://pwn.ai/blog/xss2shell
  - label: discussion
    url: https://news.ycombinator.com/item?id=49215218
- title: Framework tells all customers their data was taken through a Metabase zero-day
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Framework told all customers their personal data was stolen through a zero-day in hosted
    Metabase holding customer databases in Metabase cloud.
  summary: >-
    Framework notified all customers that names, email addresses, phone numbers, and physical
    addresses were stolen. Framework attributes the breach to a flaw in the hosted Metabase
    business intelligence platform, which held the customer databases on Metabase cloud servers,
    and Framework never ran the vulnerable software itself. TechCrunch reports that Metabase
    disclosed in its own blog post that it was hacked through an unknown security flaw, a
    zero-day. Framework's notice names no CVE or advisory, so the link to GHSA-vwf4-m7j8-wcjf
    specifically is not confirmed. Metabase published GHSA-vwf4-m7j8-wcjf on 2026-08-06, an
    unauthenticated SQL injection rated CVSS 10.0 with exploitation confirmed in the wild,
    patched in releases spanning x.58.24 to x.63.5.
  why: >-
    A flaw in a third-party analytics vendor exposed a customer database at a company with
    no way to patch it, which is the vendor-dependency case that asset inventories usually
    miss.
  followup: >-
    Watch for Framework or Metabase confirming that the breach is GHSA-vwf4-m7j8-wcjf, and
    for the count of other affected tenants.
  sources:
  - label: primary
    url: https://community.frame.work/t/framework-data-breach-discussion/83939
  - label: report
    url: https://techcrunch.com/2026/08/07/computer-maker-framework-notifies-all-customers-of-a-data-breach/
  - label: advisory
    url: https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf
  - label: discussion
    url: https://news.ycombinator.com/item?id=49206130
- title: >-
    crypto-js below 4.0.0 generated secrets from a weak PRNG, and confirmed drains from it
    are at least about 5 million dollars
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    crypto-js below 4.0.0 generated secrets from a weak PRNG CVSS 9.0, affecting BIP39 recovery
    phrases with confirmed drains at least 5 million.
  summary: >-
    CVE-2026-71851 is scored CVSS 3.1 9.0 and affects crypto-js below 4.0.0. The advisory
    states that a nominal request for 128 or 256 bits from `CryptoJS.lib.WordArray.random()`
    yields effective search spaces of roughly 2^39 and 2^47. The weak generator entered in
    3.1.2-4 in June 2014 and was present in every 3.x release except 3.2.0 and 3.2.1, and
    4.0.0 replaced it with the platform cryptographic API. Version 3.3.0 reverted the 3.1.2-4
    change as a breaking change, so a project tracking the 3.x line could resolve to a newer
    version that still carried the weak generator. Coinspect's Ill Bloom investigation, dated
    2026-08-05, confirmed that downstream wallets used the function as the entropy source
    for BIP39 recovery phrases, and puts the measured lower bound of stolen assets at about
    5 million dollars as of 2026-07-13 across two drain waves. That figure is a lower bound,
    not a total. An application is affected only where that function generated a security-sensitive
    value, so depending on crypto-js below 4.0.0 is not on its own sufficient.
  why: >-
    A secret generated through the affected function stays enumerable after the library is
    upgraded, so the required work is a dependency audit across direct and transitive paths
    plus rotation of every long-term secret that path produced, not a version bump.
  followup: >-
    Track further drain waves attributed to this generator and any wallet vendor publishing
    a rotation notice.
  sources:
  - label: primary
    url: https://github.com/advisories/GHSA-rg76-677x-56q9
  - label: investigation
    url: https://www.coinspect.com/blog/ill-bloom-investigation/
- title: >-
    DeepSeek V4 Flash 0731 verified at 89.0 percent on ARC-AGI-1 at max effort for 0.02 dollars
    per task
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    ARC Prize published third-party verified DeepSeek V4 Flash 0731 scoring 89.0 percent on
    ARC-AGI-1 at max effort at 0.02 dollars per task.
  summary: >-
    ARC Prize published verified semi-private scores for DeepSeek V4 Flash 0731. At max effort
    it scores 89.0 percent on ARC-AGI-1 at 0.02 dollars per task and 61.4 percent on ARC-AGI-2
    at 0.04 dollars per task. The high and low reasoning variants score 87.0 and 84.0 percent
