    only for the max-effort run.
  why: >-
    A third-party verified score paired with a per-task cost for the max-effort run gives
    a measured price point for reasoning-heavy agent work instead of a vendor claim.
  followup: >-
    Record any DeepSeek or investor statement on the suspended funding round tracked in f-0004.
  sources:
