- title: >-
    xAI Grok Build CLI uploads the entire repository and unredacted .env secrets by default
  section: Top stories
  category: Security
  blurb: >-
    xAI's Grok Build CLI uploads entire repositories and .env secrets to cloud storage by
    default with no effective opt-out.
  summary: >-
    A researcher published a mitmproxy wire capture of xAI's Grok Build CLI (grok 0.2.93)
    reporting that it uploads the full working repository, every tracked file plus complete
    git history, to a Google Cloud Storage bucket named `grok-code-session-traces` through
    a `POST /v1/storage` channel, independent of what the agent reads. On a 12 GB test repository
    the storage channel moved 5.10 GiB across about 73 chunks while the model-turn channel
    carried 192 KB, and planted files the agent never opened were recovered verbatim from
    the uploaded git bundle. Contents of a `.env` file, including canary `API_KEY` and `DB_PASSWORD`
    values, appeared unredacted in both the `POST /v1/responses` bodies and a session-state
    archive. Disabling the "Improve the model" toggle did not stop the upload, and `/v1/settings`
    still returned `trace_upload_enabled: true`. The author states the capture does not prove
    xAI trains on the data. A separate user account raised on Hacker News later on 2026-07-13
    claims the CLI uploaded the entire home directory, not only the working repository, which
    would widen the reported scope. That claim comes from a single social-media account and
    is not independently verified.
  why: >-
    A widely promoted coding CLI sending secrets and entire private repositories off the machine
    by default, with an ineffective opt-out, makes credential rotation and network isolation
    necessary for anyone who ran it.
  followup: >-
    Watch for an xAI statement or a CLI update that scopes uploads and honors the opt-out,
    and independent reproduction of the wire capture.
  comments: >-
    HN commenters read the whole-repository upload as codebase harvesting and debate whether
    it is a serving optimization that lets the model inspect files during reasoning without
    client round-trips rather than deliberate collection.
  thread: f-0092
  sources:
  - label: wire-level analysis (gist)
    url: https://gist.github.com/cereblab/dc9a40bc26120f4540e4e09b75ffb547
  - label: GIGAZINE
    url: https://gigazine.net/gsc_news/en/20260713-grok-build-sending-data/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48877371
  - label: second-report HN discussion
    url: https://news.ycombinator.com/item?id=48892468
- title: >-
    Claude Code sends about 33k tokens of overhead before the prompt, OpenCode about 7k
  section: Top stories
  category: Agentic coding
  blurb: >-
    Claude Code sends 33,000 tokens of overhead before the user prompt against 7,000 for OpenCode,
    a 4.7x difference.
  summary: >-
    A logging-proxy measurement published 2026-07-12 reports that Claude Code 2.1.207 sends
    roughly 33,000 tokens of system prompt, tool schemas, and injected reminder blocks before
    the user prompt on claude-sonnet-4-5, against about 7,000 for OpenCode 1.17.18, a 4.7x
    floor difference. The gap is mostly tool schemas (27 tools, about 24,000 tokens, versus
    10 tools, about 4,800 tokens) plus a larger system prompt (about 6,500 versus about 2,000
    tokens). The author reports the ratio narrows to about 3.3x on Claude Fable 5 and that
    Claude Code rewrites its cached prefix mid-session, writing up to 54x more cache tokens
    than OpenCode's byte-identical prefix.
  why: >-
    The per-request token floor and cache-write behavior set coding-agent latency and cost
    before any work begins, so harness overhead is a direct operational cost, not a detail.
  comments: >-
    HN commenters note the test pinned an older Sonnet 4.5 and reads as AI-assisted writing,
    argue Anthropic is incentivized to spend tokens for agent quality while other harnesses
    trade cost against performance, and report other agents firing 30+ tool calls on trivial
    prompts such as "commit".
  sources:
  - label: systima.ai measurement
    url: https://systima.ai/blog/claude-code-vs-opencode-token-overhead
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48883275
- title: Chromium 148 makes Math.tanh a browser fingerprint of the host OS
  section: Top stories
  category: Security
  blurb: >-
    Chromium 148's Math.tanh now calls the host OS math library, producing OS-specific results
    that bypass spoofed user-agent strings.
  summary: >-
    Since Chromium 148 (V8 14.8.57, commit c1486295ae5), `Math.tanh` calls the host operating
    system math library (`std::tanh`) instead of the bundled fdlibm implementation, so the
    last-bit result now varies by OS. `Math.tanh(0.8)` returns distinct values on Linux (glibc
    `libm`), macOS (`libsystem_m`), and Windows (UCRT `ucrtbase.dll`), giving JavaScript an
    OS signal independent of the user-agent string. IEEE 754 does not require correctly rounded
    transcendental functions, so each library uses different polynomial coefficients and produces
    results differing by about one unit in the last place.
  why: >-
    A single arithmetic call now leaks the underlying OS behind a spoofed user-agent across
    all Chromium-based browsers, adding a signal that is hard to mask without reimplementing
    the math functions.
  comments: >-
    HN commenters read it as an argument for correctly rounded transcendental functions and
    note that IP address plus user-agent already fingerprints most users.
  sources:
  - label: Scrapfly write-up
    url: https://scrapfly.dev/posts/browser-math-os-fingerprint/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48884853
- title: >-
    Ploy reports a production agent moved to GPT-5.6 ran 2.2x faster at 27% lower cost
  section: Top stories
  category: Agentic coding
  blurb: >-
    Ploy's production website-building agent moved from Claude Opus to GPT-5.6 Sol achieved
    2.2x faster builds at 27% lower cost.
  summary: >-
    Ploy reports migrating its production website-building agent from Claude Opus 4.8 to GPT-5.6
    Sol and evaluating both against a fixture suite of hundreds of cases. Median wall-clock
    per build dropped from 8m00s to 3m42s (2.2x), cost from 3.06 to 2.22 USD (27%), and output
    tokens from 33.0K to 17.1K, with a small visual-quality gain. The switch required reworking
    the eval harness (tool-call budgets were Opus-specific), a "required but nullable" tool-schema
    transform because GPT-5.6 fills every parameter, a workspace-scoped prompt-cache rebuild
    reaching a 83.7% hit rate, and disabling server-side reasoning replay.
  why: >-
    The report quantifies that a frontier-model swap is mostly harness and caching engineering
    rather than a drop-in change, and that provider caching models differ enough to erase
    the gains if not rebuilt.
  sources:
  - label: Ploy engineering post
    url: https://ploy.ai/blog/migrating-a-production-ai-agent-to-gpt-5-6
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48882716
