- title: >-
    An OCaml maintainer reports exploit probes ten minutes after opening a public security
    fix
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Anil Madhavapeddy reports exploit probes against his cohttp fix within ten minutes of
    the patch becoming public.
  summary: >-
    The post is Anil Madhavapeddy's first-hand account of his own cohttp 6.3.0 security fix,
    and it reports exploit probes arriving about ten minutes after the fix was opened publicly.
    It cites a mean time to exploit of minus seven days, a figure taken from a Vulncheck chart
    that this run could read only as the post's prose. The post is dated 2026-08-22 and reached
    Hacker News on 2026-08-28, and it names 6.3.0 only as the release carrying the fix, so
    the affected cohttp version range and a CVE identifier are not established by the source.
  why: >-
    If a rough description of a bug class is enough for an agent to produce a working exploit,
    the embargo model that open source security response rests on no longer buys maintainers
    time.
  sources:
  - label: primary
    url: https://anil.recoil.org/notes/rumour-is-the-exploit
  - label: discussion
    url: https://news.ycombinator.com/item?id=49480466
- title: >-
    GitHub will retain Copilot chat data for the life of the account instead of 28 days
  section: Top stories
  category: Dev tools
  status: confirmed
  blurb: >-
    GitHub will retain Copilot chat data for the life of the account instead of 28 days, no
    earlier than 2026-09-28.
  summary: >-
    A GitHub changelog entry dated 2026-08-28 states that no earlier than 2026-09-28 GitHub
    will relaunch Copilot as a single unified experience, under which chat data is retained
    for the life of the account instead of 28 days. The entry tells administrators to review
    the policy before 2026-09-28, and states that opting out removes Copilot from github.com
    and GitHub Mobile for those users. The same entry states that from 2026-10-01, existing
    Copilot Business and Enterprise customers paying by credit card or PayPal are charged
    upfront for every assigned seat.
  why: >-
    A team that treated the 28-day window as the reason prompts could carry internal detail
    now has to choose between indefinite retention and losing Copilot in the browser, and
    the relaunch has a floor date rather than a firm one, so the review deadline arrives before
    the change does.
  followup: >-
    Track whether GitHub states a deletion path for retained chat data once the policy takes
    effect.
  sources:
