- title: >-
    Terminal-Bench 4.0 removes saturated tasks and recalibrates agent resources, so 3.0 scores
    no longer compare
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Terminal-Bench 4.0 removes 8 tasks, 2 of them saturated, and sets a flat 8-hour agent
    timeout, so 3.0 scores no longer compare.
  summary: >-
    The release post states all tasks now use a flat 8-hour agent timeout, that 8 tasks were
    removed for saturation, refusals, public solutions, and unresolved quality or platform
    issues at two each, and that 19 tasks were fixed. It defines saturated as solved 5 of
    5 times by every class within every family of the latest model generation, and states
    the project is now a continuous benchmark on semantic versioning rather than releasing
    sequels, running on the Harbor framework. It reports Sonnet 5 using 21.6 billion tokens
    on its leaderboard run against 6.5 billion for Opus 5, with large variance in agent execution
    time, and discloses that leaderboard experiments are supported by grants from OpenAI,
    Anthropic, Z.ai, SpaceX AI, and the Laude Institute.
  why: >-
    Removing tasks and changing agent resources are breaking changes that require re-running
    trials, so a 3.0 number and a 4.0 number are not the same measurement, and anyone quoting
    an agent leaderboard has to state which version produced it.
  sources:
  - label: primary
    url: https://www.tbench.ai/news/terminal-bench-4-0
  - label: discussion
    url: https://news.ycombinator.com/item?id=49486421
  - label: reddit
    url: https://www.reddit.com/r/LocalLLaMA/comments/1w1fpxi/terminal_bench_40_just_dropped_glm53_is_at_the/
- title: >-
    A researcher gets code execution against Claude Code Auto Mode by asking it to summarize
    a website
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A researcher reports a prompt-injection chain that runs code in Claude Code Auto Mode,
    succeeding 60 to 80 percent of attempts.
  summary: >-
    The post, dated 2026-08-26, describes a chain in which a page fetched for summarization
    carries instructions that reach code execution in Claude Code running Opus 5 in Auto Mode,
    reported at 60 to 80 percent success across three variants tested five times each. It
    states Anthropic closed the report as working as designed, a position that reaches this
    page only as the author's paraphrase of the reply to his report. The Register identifies
    the author as Johann Rehberger, who publishes under the handle wunderwuzzi, and states
    Anthropic did not respond to it. Neither source names a Claude Code version or version
    range, so the affected versions are not established, and the target is identified only
    as Claude Code running Opus 5 in Auto Mode as of the post's date of 2026-08-26.
  why: >-
    Auto Mode has been the default starting mode in Claude Code since 2026-08-14 and it is
    a classifier rather than a sandbox, so the only boundary left is the one the operator
    supplies, meaning OS isolation, restricted network egress, and keeping credentials and
    SSH keys out of the agent runtime.
  followup: >-
    The post reports a third-party evaluation commissioned by Anthropic, run by Trajectory
    Labs over 72 indirect prompt injection scenarios ten times each, showing 0.00 percent
    attack success for Opus 5 in Auto Mode, and states the author's chain was not in that
    set. Neither that evaluation nor the vendor post the author cites was read here. Track
    whether Anthropic revises the Auto Mode default.
  sources:
  - label: primary
    url: https://embracethered.com/blog/posts/2026/breaking-claude-code-opus-5-and-automode/
  - label: The Register
    url: https://www.theregister.com/research/2026/08/28/researcher-shows-how-claude-code-can-be-tricked-simply-by-asking-it-to-summarize-a-website/5293372
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49479661
  - label: HN thread on the Register write-up
    url: https://news.ycombinator.com/item?id=49489082
- title: >-
    GrapheneOS says it cannot finish a Pixel 11 port because ARM memory tagging is missing
  section: Security
  category: Security
  status: developing
  blurb: >-
    GrapheneOS says it cannot ship a Pixel 11 port, reporting ARM memory tagging absent in
    software, firmware, and near certainly hardware.
  summary: >-
    A post from the GrapheneOS account on Bluesky, verified by the grapheneos.org domain handle,
    states the project cannot finish a Pixel 11 port because ARM memory tagging support is
    absent, in software and firmware and, on the project's own hedge, near certainly in hardware.
    grapheneos.org/releases lists supported devices only through the Pixel 10 series and Pixel
    10a, at build 2026081300, which corroborates that no Pixel 11 build exists, and that page
    says nothing about memory tagging. The project attributes the removal to a cost decision
    by Google, which is its inference rather than an established fact, and Google has published
    nothing on the subject that this run could read.
  why: >-
    ARM memory tagging turns use-after-free and buffer-overflow bugs into faults rather than
    exploitable conditions, and the Pixel line has been its main consumer-device vehicle,
    so its absence removes the hardware backing under the hardened allocator GrapheneOS builds
    on.
  followup: >-
    Track whether Google states a position on memory tagging in the Pixel 11, and whether
    a Pixel 11 build appears on grapheneos.org/releases.
  sources:
  - label: primary
    url: https://bsky.app/profile/grapheneos.org/post/3mua32q4ds22e
  - label: releases
    url: https://grapheneos.org/releases
  - label: discussion
