- title: >-
    A GCC trampoline hack calls nested functions without an executable stack on releases before
    GCC 17
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    A GCC post reads the code address and static chain out of an emitted trampoline, so nested
    function pointers avoid an executable stack.
  summary: >-
    The post, dated 2026-08-29, describes calling a nested function through its address on
    GCC releases before 17 without marking the stack executable. It reads the code address
    and the static chain out of the two immediate constants in the trampoline GCC emits, calls
    the target through `__builtin_call_with_static_chain`, and clears the executable-stack
    flag on the resulting binary with patchelf. The trampoline is still emitted and the indirect
    call still cannot be devirtualized, so the technique buys the stack permission and not
    the code generation.
  why: >-
    Hardened toolchains and kernels reject an executable stack, and this puts the fix on compilers
    already deployed instead of gating it on an upgrade to a GCC release that no longer requires
    the trampoline.
  sources:
  - label: primary
    url: https://uecker.codeberg.page/2026-08-29.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49490138
- title: >-
    vphone-cli boots a virtual iPhone on Apple Silicon through Virtualization.framework
  section: Apple platforms
  category: Apple
  status: confirmed
  blurb: >-
    vphone-cli boots a virtual iPhone on Apple Silicon through Virtualization.framework, requiring
    SIP or AMFI relaxation.
  summary: >-
    The MIT-licensed repository, at 8,900 stars and 1,300 forks, states it boots a virtual
    iPhone using Apple's Virtualization.framework and PCC research VM infrastructure, and
    lists prerequisites of Apple Silicon, macOS 15 or later, Xcode with the iOS SDK, and SIP
    or AMFI relaxation to allow private PV=3 entitlements with unsigned binaries, by two documented
    routes. It ships five firmware patch variants, from less at 4 boot-chain patches, which
    keeps iOS mitigations enabled, to exp at 141 patches including anti-VM-detection research
    patches. It exposes a host control socket for screenshots, touch, swipes, hardware keys,
    and clipboard, each action returning an inline screenshot, points to a separate MCP server
    wrapping it, lists a tested host and guest matrix, and publishes no tagged release.
  why: >-
    An iOS guest that exposes a scriptable control socket makes device-level automated testing
    possible without hardware, and the entry price is turning off the host's own code-signing
    enforcement.
  sources:
  - label: primary
    url: https://github.com/Lakr233/vphone-cli
  - label: discussion
    url: https://news.ycombinator.com/item?id=49485267
- title: >-
    US Treasury sanctions the Italian hosting collective Autistici/Inventati under the counterterrorism
    order
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    The US Treasury designated Italian hosting collective Autistici/Inventati under Executive
    Order 13224, blocking its US property.
  summary: >-
    The Treasury release dated 2026-08-26 states OFAC designated Autistici Inventati under
    Executive Order 13224 as amended, alongside Palestine Action and Masar Badil. It describes
    the entity as Italy-based and as providing website hosting on foreign servers, encrypted
    email accounts, chat and video conferencing, and the digital architecture behind its Noblogs
    platform, and designates it for having materially assisted or provided technological support
    to an act of terrorism. The release states that all property and interests in property
    of the designated person in the United States or held by US persons are blocked and must
    be reported, and that entities owned 50 percent or more by blocked persons are also blocked.
  why: >-
    A hosting, email, and blogging provider is now a blocked person, so US persons are generally
    prohibited from transacting with it, which turns a hosting decision into a sanctions decision
    for anyone who pays for, peers with, or depends on it.
  followup: >-
    Reports that the collective's .org domain went dark rest on a Mastodon post this run did
    not resolve and are not stated here. Track whether a further Treasury press release amends
    or removes this designation.
  sources:
  - label: primary
    url: https://home.treasury.gov/news/press-releases/sb0616
  - label: discussion
    url: https://news.ycombinator.com/item?id=49477854
- title: Amazon Aurora DSQL adds foreign key constraints
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Amazon Aurora DSQL now enforces foreign key constraints, removing a referential integrity
    workaround from application code.
  summary: >-
    AWS announced foreign key constraint support in Amazon Aurora DSQL on 2026-08-27. Aurora
    DSQL is a serverless SQL database with PostgreSQL compatibility and active-active multi-Region
    availability, and the announcement states that constraints can be added to new and existing
    tables with the NO ACTION, RESTRICT, CASCADE, SET NULL and SET DEFAULT referential actions.
    The feature is available in all AWS Regions where Aurora DSQL is available.
  why: >-
    Schemas ported to Aurora DSQL with foreign keys stripped out can go back to their original
    form, and orphaned-row bugs that application code had to prevent now fail at write time
    where they can be seen.
  sources:
  - label: primary
    url: https://aws.amazon.com/about-aws/whats-new/2026/08/aurora-dsql-foreign-key-constraints/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49478743
- title: >-
    A vulnerability researcher replaces LLM agent memory with a Datalog engine and publishes
    the benchmark losses
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Jordy Zomer replaced LLM agent memory with a Datalog engine, cutting context to 2,700
    tokens per question while losing on F1.
  summary: >-
    Jordy Zomer's post, dated 2026-08-28, describes Lemmalog, a Datalog engine that stores
    extracted facts and derived conclusions, so retracting an observation invalidates what
    depended on it. Extraction uses Claude Sonnet 4.6, and every step after it uses the benchmarks'
    own standardized readers. On LongMemEval he reports F1 0.463 plus or minus 0.010, across
    102 questions and three runs, against published figures of 0.550 for PropMem, 0.480 for
    SimpleMem, 0.244 for OpenClaw, and 0.222 for full context. He reports about 2,700 tokens
    per question there, against about 104,000 for full context. He tops the published field
    on the Knowledge Update category at 0.579 against PropMem's 0.528, and loses multi-session
    at 0.211 against 0.582, which he attributes to facts never being extracted. On LoCoMo
    he reports F1 0.533 plus or minus 0.001, across 1,986 questions and three runs, against
    0.605 for PropMem, 0.557 for OpenClaw, and 0.542 for full context.
  why: >-
    The claim worth taking is the context reduction and the provenance, not the headline score,
    because the system loses to the published leaders on both benchmarks and the author says
    so.
  sources:
  - label: primary
    url: https://pwning.systems/posts/llm-memory-program-analysis/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49485416
- title: >-
    Samsung's LPDDR5X processing-in-memory reaches 614 GB/s internally at the cost of caching
    and out-of-order execution
  section: Engineering posts
  category: Event
  status: confirmed
  blurb: >-
    Chips and Cheese reports Samsung's LPDDR5X PIM hits 614 GB/s internally, but PIM regions
    must be uncacheable and non-speculative.
  summary: >-
    The report covers Samsung's processing-in-memory work presented at Hot Chips 2026, and
    puts the internal bandwidth of its LPDDR5X PIM parts at 614 GB/s. It states that PIM regions
    have to be mapped uncacheable and non-speculative, that regular memory accesses cannot
    run against the same chip while it is in PIM mode, and that there is no clean way to preempt
    a PIM thread once it is running.
  why: >-
    In-memory compute is pitched as the way to run local inference off commodity memory, and
    this report prices the bandwidth gain in ISA and coherency-model changes rather than in
    hardware alone.
  sources:
  - label: primary
    url: https://chipsandcheese.com/p/hot-chips-2026-samsungs-processing
  - label: discussion
    url: https://news.ycombinator.com/item?id=49487341
