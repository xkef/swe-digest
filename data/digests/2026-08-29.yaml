- title: >-
    Proton traces its 2026-08-27 outage to unannounced filter maintenance on both cooling
    compressors
  section: Top stories
  category: Outage
  status: confirmed
  blurb: >-
    Proton says a datacenter operator replaced air filters on both cooling compressors overnight,
    unannounced, causing total cooling loss.
  summary: >-
    Proton published an incident report attributing its 2026-08-27 outage to a total cooling
    failure in its Frankfurt datacenter. The report's root cause section states that the datacenter
    operator replaced air filters on both redundant air compressors powering the cooling system,
    in the middle of the night and without prior notice, and then did not communicate the
    cooling failure when it happened, which Proton says dramatically cut down the time it
    had to respond. Proton states that rising server power density cut the interval between
    cooling loss and critical temperature from the three or four hours older facilities allowed
    to 20 minutes.
  why: >-
    A redundant compressor pair provides no redundancy against one maintenance action that
    touches both legs, so the control this failure calls for is a change-notification agreement
    with the facility operator rather than more hardware.
  followup: >-
    Track whether the database resilience work completes by the end of 2026 and whether the
    additional datacenter capacity comes online within the few weeks Proton states.
  sources:
  - label: primary
    url: https://proton.me/blog/august-27-outage-incident-report
  - label: discussion
    url: https://news.ycombinator.com/item?id=49484956
- title: >-
    Reuters and Bloomberg report OpenAI is ending its Cursor agreement after the SpaceX acquisition
