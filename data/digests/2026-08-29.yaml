- title: An LWN report on a FOSSY talk puts the Guix bootstrap seed at 256 bytes
  section: Developer tools
  category: Event
  status: confirmed
  blurb: >-
    An LWN report on a FOSSY talk puts the Guix bootstrap seed at 256 bytes and cites a working
    trusting-trust attack on NixOS.
  summary: >-
    Jake Edge's report, dated 2026-08-17 and surfaced on Hacker News 2026-08-28, covers Timothy
    Sample's talk at the Free and Open Source Software Yearly conference. It states the Guix
    seed is now about 256 bytes, a program called hex0, where the original stopping point
    was a 250MB statically linked blob, and that a statically linked Guile is still used,
    which Sample calls cheating. It cites a paper, "Trusting-Trust Attack against an Entire
    Linux Distribution through Binary Manipulation", in which researchers backdoored the strip
    program on NixOS and thereby nearly every binary built on the system, invisibly to source-code
    analysis.
  why: >-
    The threat bootstrappable builds addresses is now demonstrated rather than hypothetical,
    and the cost of addressing it is measured in build chains that take days.
  followup: >-
    Track whether mrustc, which the report states can now build Rust 1.90, is integrated into
    Guix, where the Rust bootstrap currently starts at 1.54 or 1.56.
  sources:
  - label: primary
    url: https://lwn.net/Articles/1088279/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49473868
