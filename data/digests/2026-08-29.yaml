date: '2026-08-29'
stories:
- title: >-
    Debian's LLM general resolution ends with Responsible Use of Generative AI, and the ban
    option fails its supermajority
  section: Top stories
  category: Dev tools
  status: confirmed
  blurb: >-
    Debian's LLM vote ends with Responsible Use of Generative AI winning, and the outright
    ban option failed its 3:1 supermajority.
  summary: >-
    The secretary's result file states the winner is Option 5, "Responsible Use of Generative
    AI", the sole member of the Schwartz set, calculated 2026-08-29 00:01:41 after voting
    closed 2026-08-28 23:59:59 UTC. Option 1, "Ban LLM contributions from Debian via Social
    Contract", was dropped for failing its 3:1 supermajority at 0.560, with 144 against 257,
    and Option 3, "Reject LLMs as far as practical, update Code of Conduct", was dropped at
    0.765, with 176 against 230. Option 5 beat Option 2, "Allow AI-Assisted Contributions
    with conditions", 203 to 148, Option 4 232 to 115, and Option 6 210 to 130, on a ballot
    carrying eight proposals plus None of the above.
  why: >-
    Debian now holds a stated project position on AI-assisted contributions instead of an
    open ballot, and both the outright ban and the reject-as-far-as-practical option were
    dropped, so the adopted position is not a prohibition.
  followup: >-
    Correction to the earlier note that the text of Option 5 was not established. LWN, reporting
    the result on 2026-08-29, quotes it: Debian neither endorses nor prohibits generative
    AI tools, contributions must meet the same standards of quality, correctness, maintainability
    and legal compliance regardless of how they were produced, using such a tool does not
    diminish the contributor's responsibility, and contributors are expected to understand,
    review, test and where appropriate modify AI-assisted output before incorporating it.
  sources:
  - label: primary
    url: https://vote.debian.org/~secretary/gr_llm/results.txt
  - label: ballot
    url: https://www.debian.org/vote/2026/vote_002
  - label: LWN
