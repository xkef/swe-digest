stories:
- title: >-
    Java 27 reaches general availability with G1 as the default collector in all environments
    and compact object headers on by default
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Mark Reinhold announced JDK 27 as generally available on 2026-09-15, shipping nine JEPs
    including post-quantum TLS key exchange.
  summary: >-
    Mark Reinhold announced JDK 27, the reference implementation of Java 27, as Generally
    Available on 2026-09-15, stating that build 35 shipped as the second release candidate
    on 2026-08-20, that no P1 bugs have been reported since, and that build 35 is therefore
    the GA build. GPL-licensed OpenJDK builds are at jdk.java.net/27. The release carries
    nine JEPs: 523 makes G1 the default garbage collector in all environments, 534 turns on
    compact object headers by default, 527 adds post-quantum hybrid key exchange for TLS 1.3,
    536 adds JFR in-process data redaction, and the remaining five are previews or incubators,
    namely 531 lazy constants, 532 primitive types in patterns, 533 structured concurrency,
    537 the Vector API and 538 PEM encodings of cryptographic objects.
  why: >-
    Two of the nine JEPs change runtime behaviour with no code change on the upgrading side,
    so collector choice and heap footprint move on upgrade rather than on opt-in.
  followup: >-
    Track reports of heap footprint and pause-time changes from deployments that were not
    previously running G1.
  sources:
  - label: primary
    url: https://mail.openjdk.org/archives/list/announce@openjdk.org/thread/ORGGLMN75HFEWP7YL3ZLGHLYHVIBJDYT/
  - label: release page
    url: https://openjdk.org/projects/jdk/27/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49712041
- title: >-
    Microsoft ships an out-of-band update after its September patch destabilized Remote Desktop
    Services and broke Plan9 host shares for WSL
  section: Top stories
  category: Infrastructure
  status: confirmed
  blurb: >-
    Microsoft released out-of-band update KB5129195 on 2026-09-14 to fix Remote Desktop Services
    instability and broken WSL host shares.
  summary: >-
    Microsoft's Windows release health page lists three regressions from the 2026-09-08 security
    update KB5124008, and out-of-band cumulative update KB5129195, released 2026-09-14, marks
    Remote Desktop Services instability and the Plan9 host folder share failure as resolved.
    Microsoft names WSL and Claude Cowork as affected by the Plan9 break, and states that
    administrators who applied the Group Policy mitigation for that issue must re-enable the
    policy before installing the update. The USB Audio Class 1.0 entry is still marked Mitigated,
    and Microsoft states the fix addresses the 8-channel and 3D audio symptoms only.
  why: >-
    The Remote Desktop Services fix spans Windows Server 2012 through 2025 and the USB audio
    regression is only partly resolved, so KB5129195 is scheduled work rather than an optional
    catch-up.
  followup: >-
    Track whether Microsoft moves the USB Audio Class 1.0 entry from Mitigated to Resolved.
  sources:
  - label: primary
    url: https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-24h2
  - label: discussion
    url: https://news.ycombinator.com/item?id=49699297
- title: >-
    Cloudflare adds a Disallow AI Training setting and changes Block to cover mixed-use crawlers
    including Googlebot, Bingbot and Applebot
  section: Top stories
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare's Block setting now also stops Googlebot, Bingbot and Applebot, and a new Disallow
    AI Training setting keeps search allowed.
  summary: >-
    In a post dated 2026-09-15, Cloudflare states that from that date the Block and Block
    on pages with ads settings apply to mixed-use crawlers, which it names as Applebot, Bingbot
    and Googlebot, so either setting now affects search indexing as well as training. The
    new Disallow AI Training setting publishes the no-training preference in robots.txt through
    Bot Preference Sync, keeps accountable mixed-use crawlers allowed for search, and blocks
    every other training crawler, including the training-only crawlers Cloudflare names from
    Amazon, Anthropic, Meta and OpenAI. Block AI Bots is deprecated in favour of the Search,
    Training and Agent controls, Managed Robots.txt is deprecated in favour of Bot Preference
    Sync, and Cloudflare states existing preferences migrate automatically to preserve their
    practical effect.
  why: >-
    The setting that used to stop AI training without touching search no longer behaves that
    way, so a fresh bot configuration can drop a site out of search indexes.
  followup: >-
    Track whether Apple, Google and Microsoft meet the time-bound commitments Cloudflare counts
    toward its Accountable requirements.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/accountable-mixed-use-ai-crawlers/
  - label: HN submission
    url: https://news.ycombinator.com/item?id=49712801
- title: >-
    Sidero Labs is acquired by Yardi and states Talos Linux stays open source under MPL-2.0
  section: Top stories
  category: Markets
  status: confirmed
  blurb: >-
    Sidero Labs says it has been acquired by Yardi and that Talos Linux remains open source
    under the MPL-2.0 license.
  summary: >-
    Sidero Labs announced on its own blog, in a post dated 2026-09-14, that the company joins
    Yardi. The post states that Talos Linux remains open source under MPL-2.0, and describes
    Talos as a platform that tens of thousands of clusters now run on. The same post announces
    Talos Hypervisor, which extends Talos beyond Kubernetes into virtualization.
  why: >-
    Talos Linux sits under the clusters of every team that adopted it, so the license terms
    and the maintenance roadmap after an acquisition are an infrastructure dependency rather
    than a corporate footnote.
  followup: >-
    Track whether the MPL-2.0 commitment holds across the next Talos Linux release cycle.
  sources:
  - label: primary
    url: https://www.siderolabs.com/blog/sidero-labs-joins-yardi
  - label: discussion
    url: https://news.ycombinator.com/item?id=49699204
- title: >-
    Google ships Gemini 3.8 Live and 3.8 Live Extended Thinking to the Gemini API with tool
    calls running in the background during conversation
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Google shipped Gemini 3.8 Live and 3.8 Live Extended Thinking to the Gemini API, running
    tool calls in the background.
  summary: >-
    In a post dated 2026-09-15, Google announced Gemini 3.8 Live and Gemini 3.8 Live Extended
    Thinking as available in the Gemini API. Google states that Gemini 3.8 Live executes tools
    and API calls in the background while continuing the conversation, and that it automatically
    detects and transitions between 97 supported languages mid-conversation, while Extended
    Thinking is described separately with asynchronous function calls and live progress narration.
    The tau-Voice-banking figure of 35.1 percent, tau-Voice at 68.6 percent, Big Bench Audio
    at 97.7 percent and ServiceNow's EVA-Bench are Google's own runs of third-party benchmarks,
    while the first place on Artificial Analysis' Speech to Speech Quality Index at 82.6 and
    the second place in the Speech Agent Arena are placements produced by outside evaluators.
  why: >-
    Background tool execution and mid-conversation language switching change how a voice agent
    is structured, which is a larger developer change than the benchmark table.
  followup: >-
    Track third-party evaluation of the Live API under real load, in particular background
    tool execution and mid-conversation language switching.
  sources:
  - label: primary
    url: https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-gemini-3-8-live-extended-thinking/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49715947
- title: >-
    Microsoft removes the COPILOT function from Excel and existing formulas return #NAME?
    on recalculation
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Microsoft removed Excel's preview COPILOT function, and formulas left in workbooks return
    #NAME? once a recalculation runs.
  summary: >-
    Microsoft's support page states that the COPILOT function has been removed from Excel.
    The page describes it as a preview feature that was previously available only in the Frontier
    program and the Microsoft 365 Insider program. Cells holding the function keep their cached
    values until something triggers a recalculation, at which point they return #NAME?.
  why: >-
    Preview formulas outlive the preview program in shared workbooks, so the breakage lands
    on whoever recalculates the file next rather than on the Insider who wrote it.
  sources:
  - label: primary
    url: https://support.microsoft.com/en-us/excel/functions/copilot-function
  - label: HN submission
    url: https://news.ycombinator.com/item?id=49706481
- title: >-
    Sakana AI reports training 1000-layer networks without backpropagation using layer-local
    predictive coding
  section: ML research
  category: ML research
  status: developing
  blurb: >-
    Sakana AI reports training 1000-layer networks with layer-local predictive coding and
    no backpropagation pass.
  summary: >-
    Sakana AI describes PC-ALM, a layer-local predictive coding method it reports trains networks
    of 1000 layers without a backpropagation pass, which the authors claim is the first layer-local
    method to reach that depth. The 1000-layer result is reported on MNIST only, at width
    32, in residual MLPs, while CIFAR-10 and Tiny ImageNet appear as ResNet-18 comparisons
    against standard predictive coding at ordinary depth. Both the 1000-layer result and the
    first-layer-local claim appear only in the write-up, which carries a September 2026 date:
    the preprint it cites, arXiv 2605.31022 by Seely and Gould submitted 2026-05-29, states
    it analyzes PC-ALM in nonlinear predictive coding networks up to depth 128. No third party
    has reproduced the numbers.
  why: >-
    Every layer in PC-ALM communicates only with its neighbours, so the result bears on distributed
    and neuromorphic training hardware where backpropagation's global forward-then-backward
    ordering is the expensive constraint.
  followup: >-
    Track an independent reproduction of the 1000-layer result outside the authors' benchmark
    set.
  sources:
  - label: primary
    url: https://pub.sakana.ai/pc-alm/
  - label: paper
    url: https://arxiv.org/abs/2605.31022
  - label: code
    url: https://github.com/SakanaAI/pc-alm
  - label: discussion
    url: https://news.ycombinator.com/item?id=49701182
- title: >-
    An ICML paper reports that discounting correlated LLM judges beats weighted majority vote
    by 9 to 14 percent
  section: ML research
  category: Paper
  status: confirmed
  blurb: >-
    Amazon researchers report a judge-aggregation method that beats weighted majority vote
    by 9 to 14 percent on existing logs.
  summary: >-
    An Amazon Science post dated 2026-08-26 describes a peer-reviewed paper presented at ICML
    2026 on aggregating the votes of multiple LLM judges. The method discounts judges whose
    errors are correlated, and the authors report a 9 to 14 percent improvement over weighted
    majority vote. The correlation estimate is derived from evaluation logs rather than from
    new labelled data.
  why: >-
    Teams that add judges to a panel to reduce noise may be adding correlated votes instead,
    and the method measures that from evaluation logs those teams already collect.
  sources:
  - label: primary
    url: https://www.amazon.science/blog/when-llm-judges-agree-should-we-believe-them
  - label: discussion
    url: https://news.ycombinator.com/item?id=49699590
- title: >-
    A preprint claims a proof of the k-server conjecture, arguing the work function algorithm
    is k-competitive on every metric space
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    Three authors post an arXiv preprint claiming a proof that the work function algorithm
    is k-competitive on every metric space.
  summary: >-
    Christian Coester, Elias Koutsoupias and Marek Zbysinski submitted the preprint to arXiv
    cs.DS on 2026-09-14, stating a proof of the k-server conjecture, which holds that a deterministic
    online algorithm can reach competitive ratio k on every metric space, by showing the work
    function algorithm satisfies that bound. The proof represents the work function as a matrix
    encoding all feasible paths to a configuration, so each work function value is the determinant
    of k columns and a request arrival updates the representation by a change of basis and
    a row replacement, with the amortized analysis resting on a potential function over a
    larger matrix. The preprint is not peer reviewed and no third party has verified it.
  why: >-
    The k-server problem generalizes paging and cache eviction, so the ratio it settles is
    the worst-case bound on the online decision an eviction policy makes.
  followup: Track a referee report or an independent verification of the proof.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2609.15979
  - label: discussion
    url: https://news.ycombinator.com/item?id=49709129
- title: >-
    Quay.io refused pushes for about fourteen hours and Red Hat gives database scaling as
    the cause
  section: Outages
  category: Outage
  status: confirmed
  blurb: >-
    Red Hat's Quay.io refused pushes from 2026-09-14 13:34 UTC and served pulls only from
    15:35 UTC until read/write returned.
  summary: >-
    Red Hat's status page opens the incident at 2026-09-14 13:34 UTC as degraded performance
    on the Quay.io push and pull API, and the 14:02 and 14:04 UTC updates state Red Hat identified
    the cause of the image pull failures. Read-only mode, described as only pulls being served,
    began at 15:35 UTC, and the 2026-09-15 04:05 UTC Monitoring update states the fix has
    been deployed and Quay.io is serving read/write requests. Red Hat marked the incident
    Resolved at 2026-09-15 09:15 UTC, states the registry has been operational since 05:00
    UTC that day, states the recovery required updating three affected database tables, and
    gives the cause in its own words as an underlying issue related to database scaling that
    was resolved successfully without any data loss. The same resolution note states Clair
    vulnerability scanning remains on maintenance until further notice.
  why: >-
    A registry that answers pulls but refuses pushes keeps deployments running while release
    pipelines stall, so this class of incident surfaces in build jobs well before anything
    user-facing breaks.
  followup: Track whether Red Hat takes Clair vulnerability scanning off maintenance.
  sources:
  - label: primary
    url: https://status.redhat.com/incidents/0g8rsg3tbjpz
  - label: discussion
    url: https://news.ycombinator.com/item?id=49705394
- title: >-
    Sidero Labs launches Talos Enterprise Linux as a paid license and states the open source
    build differs only by FIPS
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Sidero Labs launched Talos Enterprise Linux, a commercial license adding SBOMs, VEX data,
    FIPS builds and CVE response SLAs.
  summary: >-
    A post by Steve Francis dated 2026-09-15 introduces Talos Enterprise Linux, a commercial
    license that adds schematic-specific SBOMs, curated VEX data, signed build attestations,
    FIPS-compliant builds, defined CVE response SLAs and IP indemnity. The post states that
    Talos Linux itself remains MPL-2.0 with no change, and that FIPS is the only difference
    in the enterprise build. Omni Enterprise is folded into the same license.
  why: >-
    The paid tier is scoped to supply-chain artifacts and response commitments rather than
    to kernel or userspace differences, so an existing cluster runs the same build either
    way.
  sources:
  - label: primary
    url: https://www.siderolabs.com/blog/introducing-talos-enterprise-linux
  - label: acquisition post
    url: https://www.siderolabs.com/blog/sidero-labs-joins-yardi
- title: >-
    An eBPF security agent caches policy lookups per inode and cuts benchmark kernel cycles
    from 28 billion to 3.03 billion
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Per-inode caching of policy lookups cut the agent's benchmark kernel cycles by about 90
    percent, from 28 to 3.03 billion.
  summary: >-
    A post dated 2026-09-11 describes caching policy lookups per inode inside an eBPF security
    agent. The benchmark opened the same file 200,000 times, and the author reports kernel
    cycles falling from 28 billion to 3.03 billion. Hardlinks take a fallback path outside
    the cache, which the author describes as choosing accuracy over cache coverage.
  why: >-
    The cache lives inside the agent, so an operator collects the reported reduction from
    an upgrade alone without rewriting a single policy.
  sources:
  - label: primary
    url: https://nathannaveen.dev/posts/dropping-ebpf-cpu-cost-by-90/
  - label: code
    url: https://github.com/bomfather/agent
  - label: discussion
    url: https://news.ycombinator.com/item?id=49697477
- title: >-
    The Internet Archive says automated traffic is why the Wayback Machine returns 429 errors
    and that real users are being caught by the protections
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    The Internet Archive says high-volume automated traffic drives the Wayback Machine 429
    errors and that real users are blocked too.
  summary: >-
    In a post dated 2026-09-15, Mark Graham, the director of the Wayback Machine, states the
    service has been hit by waves of high-volume automated traffic, that rate-limit protections
    are in place, and that the 429 message was rewritten. Graham states those protections
    sometimes block real people, and gives info@archive.org as the route to report a wrong
    block. The post names no rate limits, no thresholds and no timeline.
  why: >-
    Anything built against the Wayback Machine now has an acknowledged cause for the 429 errors
    and no published numbers to plan retries or budgets against.
  followup: >-
    Track whether the Internet Archive publishes rate-limit thresholds or an API path for
    legitimate automated access.
  sources:
  - label: primary
    url: https://blog.archive.org/2026/09/15/an-update-on-wayback-machine-access/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49716176
