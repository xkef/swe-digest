- title: OpenAI opens a Decisions API in public beta
  section: AI
  category: AI
  blurb: >-
    OpenAI opened a Decisions API in public beta that returns probabilities and typed choices
    instead of generated text.
  summary: >-
    The endpoint returns typed answers rather than generated text, in three question forms:
    predicate returns a probability from 0 to 1, choice selects from supplied values, and
    score returns a probability-weighted average over ordered levels. OpenAI states it is
    about 10 times faster than the Responses API and that gpt-6-luna is the only model currently
    available. It is a public beta with general availability stated as weeks away, so it is
    not yet a stable dependency.
  why: >-
    This changes the cost of classification, routing and prioritization steps that today burn
    a full generation call, and the numeric probability on a predicate is the part structured
    outputs does not give.
  sources:
  - label: primary
    url: https://developers.openai.com/api/docs/guides/decisions
  - label: discussion
    url: https://news.ycombinator.com/item?id=49984025
- title: AWS releases Strands Decider 2B, an open-source decision model
  section: AI
  category: AI
  blurb: >-
    AWS released Strands Decider 2B on 2026-10-01 with weights and training data, reporting
    median decision latency near 115ms on an RTX 3090.
  summary: >-
    Strands Decider 2B is a 2 billion parameter decision model announced on 2026-10-01 and
    released with weights on Hugging Face plus the training data and scripts, which is a fuller
    release than most model drops, and it reaches this digest through a Hacker News thread
    that surfaced today rather than as a release of the day. The architecture takes a Qwen3.5-2B
    torso, removes the language modelling head and replaces it with a roughly one million
    parameter pointer head that scores option positions against an answer position, with the
    torso fine-tuned through a rank-16 LoRA adapter. AWS reports a median decision latency
    around 115ms on an RTX 3090 and about 153ms for small tasks on an M3 MacBook, plus placement
    3rd of 33 in the 2B class on JevBench accuracy and Brier calibration.
  why: >-
    Alongside the OpenAI Decisions API the same week, this marks decision models as a distinct
    class aimed at the routing, tool-gating and guardrail decisions where a full LLM call
    is too slow and too expensive to sit in the path.
  sources:
  - label: primary
    url: https://strandsagents.com/blog/introducing-strands-decider/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49987076
- title: >-
    Preprint claims truly subquadratic 3SUM and truly subcubic APSP, refuting both hypotheses
  section: ML research
  category: Paper
  blurb: >-
    A preprint claims deterministic 3SUM in O(n^1.9992) and APSP in O(n^2.9995), refuting
    the hardness hypotheses built on both.
  summary: >-
    Josh Alman and Virginia Vassilevska Williams posted a 76 page preprint on 2026-10-05 giving
    deterministic 3SUM in O(n^1.9992) and directed APSP with polynomially bounded integer
    weights in O(n^2.9995), the first polynomial improvements over the textbook algorithms.
    If correct the paper refutes the 3SUM and APSP hypotheses, their real-valued versions,
    the Exact Triangle hypothesis, the Zero-Weight k-Clique hypotheses and three rectangular
    hinted Online Matrix-Vector conjectures. Everything follows from one new algorithm for
    thin matrix products, built by modifying a variant of Coppersmith's rectangular matrix
    multiplication.
  why: >-
    Those hypotheses are the assumed hardness underneath a large body of fine-grained complexity
    lower bounds, so a correct result invalidates the conditional part of many published hardness
    claims, while the speedups are far too small to change any implementation.
  followup: Watch for peer review or a counterexample to the thin matrix product algorithm.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.06783
  - label: discussion
    url: https://news.ycombinator.com/item?id=49977437
- title: Armin Ronacher on what Codemode is and where it runs
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Armin Ronacher separates the trusted harness from the sandboxed shell and places Codemode
    scripting on the harness side.
  summary: >-
    The useful distinction in the post is between the harness, which is trusted and holds
    the model APIs, and the execution environment, which runs bash under sandboxing. Codemode
    lets the model script tool calls on the harness side, in Pi's case inside QuickJS on a
    WASM runtime with no network, no filesystem, no timers and limited RAM. That buys three
    things bash cannot: structured access to larger tool output without pushing it through
    context, concurrency and basic workflows expressed directly, and state stashed into the
    transcript for later calls to read back.
  why: >-
    Ronacher names the failure modes, including Codemode inside an MCP server that already
    does Codemode, which forces double JSON escaping and prevents the inner code from calling
    outer tools, and his concrete asks of MCP servers are structured content via outputSchema,
    consistent result shapes across batch sizes, large binary data support, and composable
    tool search across servers.
  sources:
  - label: primary
    url: https://lucumr.pocoo.org/2026/10/6/codemode/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49978333
- title: >-
    Twelve CVEs disclosed in X.Org Server and XWayland, patched in 21.1.25 and xwayland 24.1.14
  section: Security
  category: Security
  blurb: >-
    X.Org Server 21.1.25 and xwayland 24.1.14 fix twelve CVEs in XKB, XInput, GLX, XFixes,
    RandR, Present and Glamor.
  summary: >-
    The X.Org security advisory and the xorg-server 21.1.25 and xwayland 24.1.14 releases
    were announced on the xorg-announce list. Phoronix reports the twelve issues as CVE-2026-88812,
    CVE-2026-93515 through CVE-2026-93524, and CVE-2026-93536, reported by the TrendAI Zero
    Day Initiative with AI assistance, and lists them as use-after-free, heap buffer overflow,
    out-of-bounds read and write, and numeric truncation bugs concentrated in XKB, XInput,
    GLX, XFixes, RandR, Present and Glamor. The CVE enumeration and the affected-version statement
    rest on that report rather than on a resolved advisory permalink, and no active exploitation
    has been reported.
  why: >-
    Versions before 21.1.25 and 24.1.14 are affected, so distribution updates are the action,
    and XWayland being in scope means Wayland sessions running X11 clients are affected rather
    than only traditional X.Org server installs.
  sources:
