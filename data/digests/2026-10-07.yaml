- title: >-
    LibreOffice patches six document-open CVEs in 26.2.5 and 26.8.0, including remote code
    execution through a Java driver
  section: Security
  category: Security
  blurb: >-
    LibreOffice 26.2.5 and 26.8.0 fix six document-open CVEs, including remote code execution
    through a Java driver URL.
  summary: >-
    The Document Foundation announced six CVEs on 2026-10-05, all fixed in LibreOffice 26.2.5
    and 26.8.0, with versions below those affected, and five of the six reach the user through
    the same mechanism, the external data link that Calc saves inside a document and restores
    when the document loads. CVE-2026-63277 is the most severe at CVSS 8.5 and CWE-829: a
    document can name a Java database driver to be loaded from a remote location, so opening
    it can run Java code fetched from that location, and the fix requires every Java class
    path entry to be a file URL. The others are CVE-2026-63266, arbitrary file write to any
    location the user can write through an embedded Firebird database, CVE-2026-63267, local
    file read and outbound GET through the csv provider fetched during load, CVE-2026-63268,
    local text file read through the sql provider naming a folder as a database, CVE-2026-63269,
    local file and remote URL reads on Linux through a GStreamer HLS playlist in linked media,
    and CVE-2026-63270, environment variable and INI value exfiltration through URLs, which
    extends an incomplete fix for CVE-2024-12426.
  why: >-
    All six trigger on opening a document, which makes a spreadsheet attachment the delivery
    path and distribution package updates the action, with no active exploitation reported
    and the EPSS score for CVE-2026-63277 at 0.145 percent.
  sources:
