    url: https://news.ycombinator.com/item?id=49989324
- title: GitHub ran a critical incident across Git Operations, Pull Requests and Actions
  section: Outages
  category: Outage
  blurb: >-
    GitHub ran a critical incident on 2026-10-07 from 15:14 to 16:25 UTC, with Git Operations,
    Actions and Pull Requests down.
  summary: >-
    GitHub opened the incident at 2026-10-07 15:14 UTC with Git Operations, Actions and Pull
    Requests all in major outage and Webhooks and Issues degraded, and classified the impact
    as critical. GitHub states it observed widespread impact across GitHub services between
    15:06 UTC and 15:16 UTC, components recovered unevenly between 15:27 and 15:50 UTC, full
    recovery was reported at 15:58 UTC and the incident resolved at 16:25 UTC, about 70 minutes
    from open to resolved. GitHub states the root cause has been identified and mitigations
    are being applied, and that a detailed root cause analysis will be shared when available,
    so no cause is published yet.
  why: >-
    Pushes, clones, pull request operations and Actions runs failed inside the 15:06 to 15:16
    UTC window, so CI results and merge activity from that period are worth rechecking rather
    than trusting.
  followup: >-
    GitHub later stated that the 17:17 UTC incident on this date is a reoccurrence of this
    one, and the root cause analysis is still pending, with both distinct from the Webhooks
    and Pull Requests degradation of 2026-10-06 that this archive already carries.
  sources:
