- title: Chrome 155 ships JPEG XL decoding with a Rust decoder
  section: Developer tools
  category: Dev tools
  blurb: >-
    Chrome 155 ships JPEG XL decoding for images and animations using jxl-rs, a pure Rust
    decoder chosen over libjxl.
  summary: >-
    Chrome is shipping JPEG XL decoding support for .jxl images and animations starting with
    Chrome 155, announced on 2026-10-06, and this is decoding only rather than encoding. The
    Chrome team states JPEG XL offers 30 to 50 percent better compression than JPEG plus lossless
    compression, built-in HDR and lossless JPEG transcoding, and recommends trying both AVIF
    and JPEG XL rather than replacing one with the other, with JPEG XL most useful for high-fidelity
    or lossless photographic images and for fine-grained progressive decoding. Chrome integrated
    jxl-rs, a pure Rust implementation, rather than the C++ reference libjxl, on the reasoning
    that image decoders process untrusted binary input inside the renderer process and have
    historically produced out-of-bounds reads, heap overflows and use-after-free bugs.
  why: >-
    Reaching competitive speed safely required stabilizing the Rust target_feature_11 feature
    so SIMD could be used without unsafe code, then building a jxl_simd abstraction layer
    modeled on the C++ Highway library that confines unsafe operations to a small reviewed
    set, and the team states fuzzing and AI code review found no memory safety bugs across
    the implementation's history.
  followup: >-
    This archive already carries Mozilla shipping JPEG XL in Firefox 157 behind a Rust decoder
    it required before shipping, so watch whether a third engine commits and whether the Interop
    2026 JPEG XL Investigation produces cross-browser test coverage.
  sources:
  - label: primary
    url: https://developer.chrome.com/blog/jpeg-xl-in-chrome
  - label: discussion
    url: https://news.ycombinator.com/item?id=49991227
- title: >-
    Informal benchmark finds Python 3.15 roughly flat, with the JIT ahead of the standard
    interpreter
  section: Languages and runtimes
  category: Languages
  blurb: >-
    An informal benchmark puts CPython 3.15 near flat against 3.14, with the JIT beating the
    standard interpreter for the first time.
  summary: >-
    Miguel Grinberg ran recursion-heavy and loop-heavy microbenchmarks across CPython 3.10
    to 3.15, plus JIT and free-threading builds, PyPy, Node and Rust. The standard 3.15 interpreter
    is only marginally faster than 3.14 and slightly slower on one multi-threaded test, so
    there is no performance reason to rush an upgrade. The new result is the JIT, which for
    the first time beats the standard interpreter of the same version by 1.20x to 1.28x, having
    previously trailed it, while free-threading 3.15 runs about 4.5 times faster than the
    standard interpreter on the multi-threaded recursion test and still trails it on single-threaded
    work.
  why: >-
    The author labels the benchmark informal, describes the two programs and the averaging
    method, notes he tested 3.15.0rc3 rather than the final release, separates his upgrade
    opinion from the measurements, and recommends against the still-experimental JIT in production.
  sources:
  - label: primary
    url: https://blog.miguelgrinberg.com/post/how-fast-is-python-3-15
  - label: discussion
    url: https://news.ycombinator.com/item?id=49984652
- title: matklad argues microbenchmarks should be tuned to about 300ms
  section: Engineering posts
  category: Engineering post
  blurb: >-
    matklad argues microbenchmarks should be sized to about 300ms, long enough to drown fixed
    costs and short enough to rerun ten times.
  summary: >-
    The rule is to adjust input size until a microbenchmark takes roughly 300ms. The reasoning
    is specific: milliseconds in the 1 to 999 range are integers that scan visually without
    unit switching, anything under about 10ms risks being dominated by fixed costs such as
    interpreter startup, hundreds of milliseconds is long enough to make one-off overheads
    irrelevant without more fragile correction techniques, and anything over a second makes
    running the benchmark ten times to eyeball variance too slow.
  why: >-
    The underlying claim is that benchmarking exists to give the author enough intuition to
    make a correct decision rather than to produce a precise performance measurement, which
    is directly applicable to anyone writing a benchmark harness.
  sources:
  - label: primary
    url: https://matklad.github.io/2026/10/05/benchmark-milliseconds.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49967427
- title: >-
    Erdosproblems.com freezes proof claims and removes problem statuses over AI-generated
    submissions
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Erdosproblems.com froze new proof claims and removed problem statuses after AI-generated
    submissions overwhelmed moderation.
  summary: >-
    Thomas Bloom announced on 2026-10-06 that the site he launched on 2023-05-28, now holding
    1221 problems, over 9000 comments and almost 2000 registered users at 10,000 to 25,000
    unique visitors a day, is making four changes: new problem comments and proof claims are
    frozen with general threads and blog posts still open and updates accepted by email, problem
    statuses such as open and solved are no longer displayed, the solved count and percentage
    are removed, and credit and ownership language for future results is dropped for human
    and AI results alike. Bloom's stated reason is that the main public interaction with the
    site became advertising AI-generated proofs with no explanation, recorded as priority
    claims, and that moderating this was not sustainable because it would mean rejecting almost
    every submitted comment. He states the comment feature produced a vibrant period of shared
    ideas, corrections and new collaborations after August 2025 that has not been sustained,
    that such repositories should exist but that he does not want to run one, and that the
    hiatus may be reversed.
  why: >-
    This is an operator of a collaborative technical site withdrawing a feature under submission
    load rather than an opinion about AI, the post names no model, product or service behind
    the submissions, and the remaining emphasis is on curated proof expositions.
  sources:
  - label: primary
    url: https://www.erdosproblems.com/forum/thread/blog:9
  - label: discussion
    url: https://news.ycombinator.com/item?id=49977689
- title: JetBrains filings show a 2025 net loss alongside record revenue
  section: Markets and companies
  category: Markets
  blurb: >-
    JetBrains statutory filings show record 2025 revenue of CZK 16.0 billion with a CZK 315
    million net loss and 10.7 percent gross margin.
  summary: >-
    JetBrains s.r.o. reported 2025 revenue of CZK 16,008 million, up 6.3 percent and a record,
    with a net loss of CZK 315 million and a return on equity of -11.1 percent. The trend
    under the headline is the margin: gross margin fell from 53.7 percent in 2021 to 10.7
    percent in 2025, EBITDA margin from 48.9 percent to 5.73 percent, and staff expenses rose
    34.2 percent in 2025 while revenue grew 6.3 percent. Net cash stood at CZK 7,584 million.
    Two caveats belong on the numbers: these are the unconsolidated statutory statements of
    the Czech entity under Czech GAAP filed with the Czech business register rather than group
    consolidated accounts, and the figures reach this digest through an aggregator that normalises
    those filings rather than from JetBrains directly.
  why: >-
    The net cash position alongside the falling margins reads as margin compression rather
    than distress, and it bears on the sustainability of tooling many teams depend on, because
    JetBrains maintains IntelliJ, the main commercial JVM toolchain, and sponsors Kotlin.
  followup: >-
    Read the group consolidated accounts if JetBrains publishes them, to confirm whether the
    margin compression holds at group level.
  sources:
  - label: aggregator of Czech register filings
    url: https://www.helgilibrary.com/companies/jetbrains
  - label: discussion
    url: https://news.ycombinator.com/item?id=49977072
