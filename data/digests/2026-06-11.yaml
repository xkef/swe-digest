- title: 'The Self-Correction Illusion: LLMs correct others but not themselves'
  section: ML research
  category: ML research
  status: developing
  blurb: >-
    LLMs correct external claims more reliably than their own; correction rates jump 23 to
    93 percentage points when claims appear external.
  summary: >-
    Chen, Su, and Chiang (submitted 2026-06-04) tested seven LLM families on 30 paired tasks
    across three domains, keeping erroneous claims byte-identical and varying only the wrapping
    role: the model's own thought, a user message, a tool response, or a system memory block.
    Relabeling a claim from the model's own thought to any external role lifted the explicit-correction
    rate by 23 to 93 percentage points. 10 of 13 model-domain cells reached maximum correction
    rates when the claim appeared as a tool or system memory entry.
  why: >-
    Multi-agent architectures where independent agents review each other's outputs are substantially
    more reliable than single-agent self-correction loops; agent system designers should treat
    self-correction as unreliable by default.
  sources:
  - label: arXiv:2606.05976
    url: https://arxiv.org/abs/2606.05976
- title: 'NF-CoT: Latent reasoning with normalizing flows'
  section: ML research
  category: ML research
  status: developing
  blurb: >-
    NF-CoT proposes reasoning in continuous states via normalizing flows rather than discrete
    tokens, potentially cutting inference costs.
  summary: >-
    NF-CoT proposes performing intermediate reasoning steps in compact continuous states using
    normalizing flows before committing to text, rather than forcing computation through a
    discrete token stream. The approach preserves left-to-right generation, probabilistic
    sampling, KV-cache compatibility, and tractable likelihood estimation while reducing the
    verbalization overhead of standard chain-of-thought.
  why: >-
    If the continuous reasoning overhead proves lower than discrete CoT at equivalent accuracy,
    inference costs for reasoning-heavy tasks could decrease without requiring separate latent-space
    model architectures.
  sources:
  - label: arXiv:2606.06447
    url: https://arxiv.org/abs/2606.06447
  - label: project page
    url: https://nf-cot.vercel.app/
- title: >-
    Claude Code Dynamic Workflows: parallel subagent orchestration in research preview
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Claude Code Dynamic Workflows enable task decomposition across parallel subagents with
    coordinated output verification.
  summary: >-
    Anthropic shipped Dynamic Workflows for Claude Code on 2026-05-28 as a research preview
    alongside Claude Opus 4.8, with general availability announced 2026-06-02. The feature
    lets Claude write JavaScript workflow scripts at runtime, break a task into subtasks,
    fan them across parallel subagents, verify results, and return a single coordinated output.
    Use cases include codebase-wide bug hunts, security audits, and large-scale migrations.
    Jarred Sumner reported porting roughly one million lines of Zig to Rust in six days using
    the feature. Availability is currently limited to Max, Team, and Enterprise plans and
    the Claude API; Claude Code CLI, Desktop, and VS Code extension are all supported.
  why: >-
    Teams with codebase-wide or multi-file tasks that exceeded single-agent context can now
    run them as verifiable parallel work inside Claude Code without building custom orchestration.
  sources:
  - label: Anthropic announcement
    url: https://claude.com/blog/introducing-dynamic-workflows-in-claude-code
  - label: Claude Code docs
    url: https://code.claude.com/docs/en/workflows
  - label: Claude Opus 4.8 release
    url: https://www.anthropic.com/news/claude-opus-4-8
- title: >-
    Windsurf rebranded as Devin Desktop; Cascade agent reaches end of life 2026-07-01
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Cognition rebranded Windsurf to Devin Desktop with ACP support; Cascade local agent ends
    July 1, replaced by Devin Local in Rust.
  summary: >-
    Cognition pushed an over-the-air update on 2026-06-02 renaming Windsurf to Devin Desktop.
    The default surface shifts from an editor canvas to the Agent Command Center, repositioning
    the product as an agent management hub with an embedded IDE. The local agent Cascade is
    end-of-life on 2026-07-01 and is replaced by Devin Local, rewritten in Rust. Devin Desktop
    ships with native support for the Agent Client Protocol (ACP), an open-source (Apache
    2.0) JSON-RPC 2.0 spec over stdin/stdout originally created by Zed Industries in August
    2025. ACP defines how code editors connect to coding agents; Codex, Claude Agent, Gemini
    CLI, OpenCode, and Junie all run as first-class agents inside Devin Desktop via ACP. As
    of June 2026, ACP has native implementations in Zed and JetBrains IDEs and more than 25
    AI agent integrations.
  why: >-
    Any CI pipeline or workflow rule that invokes Cascade must be repointed to Devin Local
    before 2026-07-01; ACP is emerging as the standard interface between editors and coding
    agents, with broad industry adoption across Zed, JetBrains, GitHub, Google, and Cognition.
  sources:
  - label: Devin blog
    url: https://devin.ai/blog/windsurf-is-now-devin-desktop/
  - label: Agent Client Protocol spec
    url: https://github.com/agentclientprotocol/agent-client-protocol
- title: 'Microsoft June 2026 Patch Tuesday: record 206 CVEs'
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Microsoft released 206 CVEs including wormable TCP/IP kernel flaw CVE-2026-45657 and unauthenticated
    HTTP.sys RCE CVE-2026-47291.
  summary: >-
    The June 2026 Patch Tuesday update addresses 206 CVEs across Windows, Exchange Server,
    Office, and other products, the largest monthly release on record. One zero-day (CVE-2026-41091,
    Defender EoP, CVSS 7.8) was under active exploitation before the formal release; Microsoft
    patched it out-of-band on 2026-05-19 and CISA added it to KEV on 2026-05-20. Five additional
    zero-days were publicly disclosed but not observed exploited at release: CVE-2026-45657
    (Windows kernel TCP/IP use-after-free, CVSS 9.8, wormable), CVE-2026-47291 (HTTP.sys unauthenticated
    RCE, CVSS 9.8), CVE-2026-45586 (CTFMON SYSTEM privilege escalation, GreenPlasma), CVE-2026-45585
    (BitLocker USB bypass in Windows Recovery Environment, YellowKey), and CVE-2026-45583
    (Exchange Server RCE). KB5094126 covers Windows 11 24H2 and 25H2; KB5094125 covers Windows
    Server 2025; KB5094128 covers Windows Server 2022.
  why: >-
    CVE-2026-45657 and CVE-2026-47291 are both unauthenticated CVSS 9.8 RCEs; the kernel flaw
    is wormable. Apply this month's update on all Windows endpoints and servers immediately.
  sources:
  - label: MSRC June 2026 release notes
    url: https://msrc.microsoft.com/update-guide/releaseNote/2026-Jun
  - label: KB5094126
    url: https://support.microsoft.com/en-us/topic/june-9-2026-kb5094126-os-builds-26200-8655-and-26100-8655-1a9bcba6-5f53-4075-8156-fe11ac631737
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/microsoft/microsoft-june-2026-patch-tuesday-fixes-6-zero-days-200-flaws/
