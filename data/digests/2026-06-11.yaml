    url: https://github.com/philipl/pifs
- title: GitHub Copilot billing shock dominates developer discussion
  section: HN and Reddit pulse
  category: Pulse
  status: discussion
  blurb: >-
    GitHub's June 1 switch to token-based billing generated backlash with developers reporting
    Pro+ bills jumping from $39 to $750 monthly.
  summary: >-
    The June 1 switch to token-based AI Credits billing generated sustained backlash across
    GitHub's community forums, Reddit, and Hacker News throughout the first two weeks of June.
    Developers reported Pro+ monthly bills jumping from $39 to $750 or more. Common themes:
    agentic sessions are unexpectedly expensive, the removed fallback-to-cheaper-model safety
    net is missed, and included credit allotments appear calibrated for interactive chat rather
    than the agentic workflows GitHub's own marketing promotes. Most-cited alternatives: direct
    Anthropic and OpenAI API access, OpenRouter, and RooCode.
