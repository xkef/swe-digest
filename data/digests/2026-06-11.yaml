- title: 'πFS: data-free filesystem based on pi'
  section: HN and Reddit pulse
  category: Pulse
  status: discussion
  blurb: >-
    HN discussed πFS, a filesystem using pi digits, with commenters noting coordinate representation
    requires as much storage as the data itself.
  summary: >-
    An HN thread about πFS, a filesystem implementation based on the conjecture that pi is
    a normal number containing all possible finite digit sequences. The premise is that every
    file exists as a coordinate in pi, so storage becomes a lookup rather than a write. Commenters
    noted that the coordinate representation requires roughly the same storage as the data
    itself, and that LLMs represent a more practical form of lossy compression.
  why: >-
    None operationally; the thread is useful for its illustration of normal number theory
    and information-theoretic storage limits.
  sources:
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48480978
