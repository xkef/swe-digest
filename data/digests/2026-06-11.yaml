- title: >-
    Microsoft June 2026 Patch Tuesday: record 206 CVEs, wormable kernel flaw, one zero-day
    exploited
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Microsoft released 206 CVEs including wormable TCP/IP kernel flaw CVE-2026-45657 and unauthenticated
    HTTP.sys RCE CVE-2026-47291.
  summary: >-
    Microsoft released 206 CVEs on 2026-06-09, the largest Patch Tuesday on record. Six zero-days
    were included: one exploited in the wild (CVE-2026-41091, Microsoft Defender elevation
    of privilege, CVSS 7.8, CISA KEV 2026-05-20, patched out-of-band May 19) and five publicly
    disclosed. The most severe unfixed-in-the-wild flaw is CVE-2026-45657, a use-after-free
    in the Windows kernel TCP/IP stack (CVSS 9.8) allowing unauthenticated remote code execution
    at SYSTEM level; Microsoft classified it as wormable. CVE-2026-47291 is a second unauthenticated
    RCE in HTTP.sys (CVSS 9.8). Publicly disclosed zero-days include CVE-2026-45586 (CTFMON
    privilege escalation to SYSTEM, named GreenPlasma) and CVE-2026-45585 (BitLocker bypass
    via USB in Windows Recovery Environment, named YellowKey). Critical Exchange Server RCE
    CVE-2026-45583 is also included.
  why: >-
    CVE-2026-45657 is wormable across all Windows 11 and Windows Server 2022/2025 versions;
    patch immediately via KB5094126 or KB5094125/KB5094128 for affected server versions. Defender
    auto-updates cover CVE-2026-41091 for most endpoints.
  sources:
  - label: MSRC June 2026 release notes
    url: https://msrc.microsoft.com/update-guide/releaseNote/2026-Jun
  - label: KB5094126
    url: https://support.microsoft.com/en-us/topic/june-9-2026-kb5094126-os-builds-26200-8655-and-26100-8655-1a9bcba6-5f53-4075-8156-fe11ac631737
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/microsoft/microsoft-june-2026-patch-tuesday-fixes-6-zero-days-200-flaws/
- title: Check Point VPN CVE-2026-50751 exploited by Qilin ransomware affiliate
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    CVE-2026-50751 is an authentication bypass in Check Point IKEv1 VPN that attackers have
    exploited since May 7, linked to Qilin ransomware.
  summary: >-
    CVE-2026-50751 is an authentication bypass (CVSS 9.3) in Check Point Remote Access VPN
    and Mobile Access when configured for the deprecated IKEv1 key exchange protocol. An attacker
    can establish a VPN session without a valid user password by exploiting a logic flaw in
    certificate validation. Active exploitation has been observed since 2026-05-07, with a
    Qilin ransomware affiliate linked to at least one confirmed intrusion. A second related
    flaw, CVE-2026-50752, affects IKEv1 site-to-site VPN certificate validation. CISA added
    CVE-2026-50751 to KEV on 2026-06-08.
  why: >-
    Any Check Point VPN deployment using IKEv1 is vulnerable to unauthenticated network access
    until patched or reconfigured to IKEv2 with mandatory machine certificates.
  followup: >-
    CISA gives federal agencies three days to patch; verify patch status in all affected deployments.
  sources:
  - label: Check Point advisory sk185033
    url: https://support.checkpoint.com/results/sk/sk185033
  - label: Rapid7 ETR
    url: https://www.rapid7.com/blog/post/etr-critical-check-point-vpn-zero-day-exploited-in-the-wild-cve-2026-50751/
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/check-point-links-vpn-zero-day-attacks-to-qilin-ransomware-gang/
  - label: CISA KEV
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- title: LiteLLM CVE-2026-42271 exploited in the wild, chains to unauthenticated RCE
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    CVE-2026-42271 is command injection in LiteLLM MCP endpoints that chains with Starlette's
    host-header bypass for unauthenticated RCE.
  summary: >-
    CVE-2026-42271 is a command injection flaw (CVSS 8.7) in LiteLLM MCP server preview endpoints,
    affecting versions 1.74.2 through 1.83.6. The endpoints `POST /mcp-rest/test/connection`
    and `POST /mcp-rest/test/tools/list` accept a full server config including `command`,
    `args`, and `env` fields and spawn them as subprocesses without validation. Horizon3.ai
    chained this with CVE-2026-48710, a host header bypass in Starlette (BadHost), to achieve
    unauthenticated RCE with a combined CVSS of 10.0. CISA added the flaw to KEV on 2026-06-08.
  why: >-
    Exploiting a LiteLLM proxy exposes all model provider API keys, integrated AI infrastructure,
    and downstream connected systems. Patch to LiteLLM 1.83.7 and Starlette 1.0.1; block the
    two affected endpoints at the reverse proxy if immediate patching is not possible.
  sources:
  - label: Help Net Security
    url: https://www.helpnetsecurity.com/2026/06/09/litellm-vulnerability-under-active-attack-cisa-warns-cve-2026-42271/
  - label: Horizon3.ai
    url: https://horizon3.ai/attack-research/vulnerabilities/cve-2026-42271-chained-with-cve-2026-48710/
  - label: CISA KEV
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
