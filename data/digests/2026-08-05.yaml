- title: >-
    Greg Kroah-Hartman will reject LLM-generated patches in drivers/staging except for tested
    security fixes
  section: Top stories
  category: Linux/Kernel
  blurb: >-
    Greg Kroah-Hartman announced drivers/staging will reject LLM patches except tested security
    fixes, moving evidence burden to the sender.
  summary: >-
    Greg Kroah-Hartman announced that drivers/staging will reject LLM-generated patches, with
    tested security fixes as the stated exception. The reason he gives is purpose rather than
    code quality: staging exists so new developers learn on low-hanging fruit. He also states
    that with current and next-generation tools at least one third of the results they generate
    are flat out wrong or harmful, which is the stated reason the security-fix exception requires
    testing on actual hardware with the testing described. The announcement is carried here
    as Phoronix reproduces it, because lore.kernel.org remains behind the Anubis proof-of-work
    gate and did not resolve from this run.
  why: >-
    The exception is written as an evidence burden rather than a ban, which moves the cost
    of an LLM-assisted patch onto the sender in hardware time instead of onto the maintainer
    in review time.
  followup: >-
    Confirm the wording against the kernel mailing list archive once lore.kernel.org resolves,
    and watch whether other subsystems adopt the same rule.
  sources:
  - label: report
    url: https://www.phoronix.com/news/Linux-Staging-Reject-LLMs
  - label: Reddit thread
    url: https://www.reddit.com/r/linux/comments/1vfnhcs/linuxs_staging_area_to_now_reject_llmgenerated/
- title: >-
    Cloudflare open-sources Cloudflare OS and ties agent authorization to what the agent has
    read
  section: AI
  category: AI
  blurb: >-
    Cloudflare released Cloudflare OS, a runtime where agent authorization is evaluated against
    data provenance rather than the tool call.
  summary: >-
    Cloudflare open-sourced Cloudflare OS, a runtime in which agents and apps start with access
    to nothing and receive each resource as a typed capability binding. The credential is
    held by a per-service Gatekeeper Worker that enforces policy and records what was read,
    and server code runs in a Dynamic Worker with global outbound networking disabled. Authorization
    is evaluated against data provenance rather than stopping at the tool call.
  why: >-
    Sharing an agent-built dashboard cannot become a way to share a table the recipient could
    not read directly, because the check follows the data rather than the call.
  sources:
  - label: announcement
    url: https://blog.cloudflare.com/cloudflare-os/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49182996
- title: >-
    Mistral releases Shieldstral, a 3B Apache-2.0 multimodal safety classifier that takes
    its policy at inference time
  section: AI
  category: AI
  blurb: >-
    Mistral released Shieldstral 1.0, a 3B classifier that takes its policy at inference time
    rather than encoded in the model weights.
  summary: >-
    Mistral released Shieldstral 1.0, a 3B multimodal safety classifier under Apache-2.0,
    with weights on Hugging Face. The moderation policy is supplied at inference time rather
    than baked into the weights. Mistral states the model runs on a single 16GB GPU. Mistral
    also claims the model matches or outperforms open guard models up to seven times its size
    and sets a new state of the art on multimodal moderation. Those are Mistral's own figures,
    which no third party has reproduced, so they are carried as vendor claims and not as results.
  why: >-
    Re-targeting a guardrail to a new deployment context becomes a prompt change rather than
    a retraining job, and a classifier that fits one 16GB GPU can sit inline per request instead
    of behind a moderation API.
  sources:
