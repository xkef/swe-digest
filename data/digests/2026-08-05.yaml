- title: >-
    rust-lang/rust adopts an LLM policy that permits review and analysis but restricts creation
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Five Rust teams adopted a policy permitting LLM analysis but restricting creation, holding
    LLM code to a higher bar than human code.
  summary: >-
    Jynn Nelson writes that five teams adopted a policy governing LLM use in the rust-lang/rust
    monorepo, and states it is not an official Rust project stance and does not apply elsewhere
    in the project. The policy summarizes itself as fine to use LLMs to answer, analyze, distill,
    refine, check, suggest and review, but not to create. Disclosure is required for machine
    translation, trivial changes, discovering bugs, and reviewing others' work with an LLM,
    and unmarked LLM output is not allowed in public docs, PR descriptions or GitHub comments.
    LLM-generated code changes must be pre-arranged, non-critical, well-tested and disclosed,
    are required to have tests regardless of difficulty, and must not touch soundness-critical
    areas unless the author is already a domain expert. Reviewers may close non-conforming
    PRs without discussion and are never required to review LLM PRs. The post cites 1,281
    open PRs as the review-bandwidth pressure behind it and states that harassing someone
    for LLM use is itself a violation.
  why: >-
    Rust holds LLM-authored changes to a higher bar than human-authored ones, which inverts
    the usual framing, and it is a different rule from the drivers/staging rejection carried
    in Top stories rather than the same trend.
  sources:
  - label: primary
    url: https://blog.rust-lang.org/inside-rust/2026/08/05/rust-langrust-is-adopting-an-llm-policy/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49179039
- title: >-
    Mysk finds three WebKit features that bypass proxy configuration and leak the device IP
    and DNS
  section: Apple platforms
  category: Apple
  blurb: >-
    Talal Haj Bakry and Tommy Mysk report three WebKit features bypassing proxy configuration
    and iCloud Private Relay, leaking IP and DNS.
  summary: >-
    Talal Haj Bakry and Tommy Mysk report three WebKit features that ignore the proxy set
    through WKWebsiteDataStore.proxyConfigurations and connect directly from the device. DNS
    prefetching resolves hostnames through the device's normal DNS path, available on iOS
    since 26.0. WebAuthn Related Origin Requests make the operating system's credential service
    fetch the relying party's `.well-known/webauthn` document itself, available since iOS
    18.0, and the post states the fetch fires with conditional mediation and no user interaction.
    WebTransport opens a QUIC connection with WebKit's own network parameters, shipped in
    iOS 26.4. The authors state all three also defeat iCloud Private Relay because they run
    outside WebKit's standard page-loading path, that VPNs are unaffected because they tunnel
    at the system level, and that Onion Browser's Silver level avoids the WebTransport leak
    by running WebKit in Lockdown Mode. The authors sell Psylo, the browser whose 1.3.1 release
    carries their mitigations, so the write-up is both research and product marketing.
  why: >-
    App Store policy requires every iOS browser to use WebKit, so every iOS Tor browser inherits
    the same three paths regardless of how it configures its proxy.
  sources:
  - label: research
    url: https://mysk.blog/2026/08/04/webkit-proxy-icloud-private-relay-ip-leak/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49176697
- title: GitHub case-folds code search at over 45 GiB/s by deleting the early exit
  section: Engineering posts
  category: Engineering post
  blurb: >-
    GitHub achieved case folding code search at over 45 GiB/s by removing the early exit on
    non-ASCII bytes, which branched slower.
  summary: >-
    GitHub describes case folding source code for search at over 45 GiB/s. Removing the early
    exit on the first non-ASCII byte was faster than keeping it, because the branch cost more
    than sweeping the whole buffer. The post also separates case folding from lowercasing,
    and names characters where the two differ.
  why: >-
    The obvious optimization is the bug: breaking out of the loop at the first non-ASCII byte
    costs more in branches than sweeping the whole buffer, and the post separates case folding
    from lowercasing, which quietly produces wrong matches on characters like the sharp s
    and final sigma.
  sources:
  - label: primary
    url: https://github.blog/engineering/architecture-optimization/dont-stop-early-case-folding-source-code-at-memory-speed/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49127983
- title: >-
    Cloudflare routes its engineering standards through agents and reports 16,000 blocked
    merges in four months
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Timo Reimann describes Cloudflare's Codex of engineering standards, where AI reviewers
    withheld 16,000 approvals across four months.
  summary: >-
    Timo Reimann describes the Cloudflare Codex, a governed body of engineering standards
    written as RFCs using the RFC 2119 SHOULD and MUST keywords, with front-matter metadata,
    per-domain owners and a merge-request proposal path. Cloudflare reports the AI code reviewer
    has flagged close to 230,000 violations since the Codex started this year, that almost
    16,000 caused approval to be withheld, and that a separate spec reviewer has evaluated
    close to 600 technical designs. To keep 60-plus RFCs out of the context window, a purpose-built
    agent extracts the SHOULD and MUST statements into JSON with a stable slug per statement.
    Cloudflare also reports two escape hatches for review latency, Codex-aligned linter packages
    starting with TypeScript on oxlint, and a local CLI that runs the same agents against
    a computed diff without the CI round trip.
  why: >-
    The approved-versus-enforced split is the transferable design, because an approved RFC
    produces only non-blocking findings and a separate promotion step is what turns an unmet
    MUST into a withheld approval, so a new standard never blocks merges the day it lands.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/engineering-standards-enforcement/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49170628
