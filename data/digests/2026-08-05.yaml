- title: >-
    A controlled study finds input dimensionality, not format or tokenization, is why an LLM
    loses to classical models on tables
  section: ML research
  category: Paper
  blurb: >-
    Garnelo and Czarnecki report the LLM's accuracy decreases with dimensionality on tables,
    while classical models improve or stay flat.
  summary: >-
    Marta Garnelo and Wojciech M. Czarnecki, submitted 2026-08-03, study a frontier LLM in
    a single generation pass over a prompt holding the full training and test data, with no
    tools, no agentic scaffolding and no fine-tuning. They test five hypotheses for the known
    failure on tabular prediction and report that controlled experiments falsify four of them:
    noisy or non-linearly-separable data, the linearised CSV format obscuring column structure,
    numeric tokenization, and the number of test points per query. Sweeping random linear
    projections of 31 benchmark datasets, they report the LLM is the only method among nine
    whose accuracy decreases as dimensionality grows, while every classical baseline stays
    flat or improves. Compared against 252 configured classical models, they report the LLM
    predicts like a local distance-based method in two dimensions with up to 91.6% grid agreement,
    and that in higher dimensions no classical model reproduces its predictions even with
    tuned dimension-dependent noise. The authors explicitly do not claim to have identified
    the internal mechanism. This is a preprint with no independent reproduction.
  why: >-
    Prompt formatting and numeric encoding are not the lever, so the choice between an LLM
    and a classical model on a wide table turns on column count.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2608.02412
  - label: discussion
    url: https://news.ycombinator.com/item?id=49166442
- title: Warp ships its agent as a standalone CLI built on a terminal multiplexer
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Warp released its coding agent as a standalone CLI built on a terminal multiplexer, letting
    it drive a pty rather than shell commands.
  summary: >-
    Warp released its coding agent as a standalone command-line tool, separate from the Warp
    terminal application. The agent runs on a terminal multiplexer, so it drives a pty rather
    than issuing one-shot shell commands.
  why: >-
    Putting a pty layer between the agent and the shell is what lets it change directories
    mid-session, drive full-screen programs like sqlite and gdb, and run over ssh with no
    remote binary installed.
  sources:
