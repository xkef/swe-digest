date: '2026-08-05'
stories:
- title: >-
    Shai-Hulud's first npm wave shipped through the project's own OIDC trusted publishing
    pipeline
  section: Top stories
  category: Security
  blurb: >-
    Endor states the seed wave carried valid npm signatures and SLSA provenance while token-stolen
    copies in other packages did not.
  summary: >-
    Endor Labs states that the first wave was published through the Cacheable project's own
    GitHub Actions OIDC trusted publishing pipeline, after a commit to main added a preinstall
    hook. Endor puts the first wave's seed packages at roughly 515 million weekly downloads
    from the npm last-week API on 2026-08-04, and states that keyv, flat-cache and file-entry-cache
    alone exceed 450 million. Endor also states those figures sum package-level traffic and
    overlap in dependency trees, so they show the wave's reach rather than a count of distinct
    installs. Those tarballs carry valid npm signatures and SLSA provenance. Endor states
    the campaign then spread to other maintainers' packages typically via stolen npm publishing
    tokens and without provenance. Endor counts 384 packages across 1,136 versions and describes
    that as a floor. Aikido's count published on 2026-08-04 was 434 packages across 1,381
    versions. The two counts are not reconciled and both vendors describe their lists as moving,
    so no single total is asserted here.
  why: >-
    Provenance works here as a wave discriminator and not as a filter, so a defender who quarantines
    unprovenanced tarballs catches the token-stolen spread and installs the seed compromise.
  followup: >-
    Track whether the vendor package and version counts converge, and whether npm changes
    trusted publishing to cover source integrity.
  sources:
  - label: analysis
    url: https://www.endorlabs.com/learn/npm-malware-compromises-keyv-and-cacheable-with-500m-weekly-downloads-and-spreads-to-hundreds-of-packages
  - label: discussion
    url: https://news.ycombinator.com/item?id=49171421
- title: >-
    Unit 42 discloses three attacks on Google synced passkeys that start from malware already
    on the device
  section: Top stories
  category: Security
  blurb: >-
    Unit 42 names three attacks on synced passkeys that require device malware, where relying
    party UV validation blocks the strongest attack.
  summary: >-
    Unit 42 names three attacks: Pass-ta-key, which authenticates with no user interaction,
    Silver Pass-ta-key, which registers an attacker-controlled user-verification key so the
    cloud authenticator treats later requests as device-unlocked, and Golden Pass-ta-key,
    which extracts every synced passkey private key in a form that can be shared or sold.
    Unit 42 states that Silver Pass-ta-key gives reusable access from the attacker's own environment
    without the victim's device being online. All three require malware already present on
    the victim's device in the initial stage, and Unit 42 states no privilege escalation is
    needed. The research covers Google Password Manager in Chrome on Windows on devices with
    a TPM. Separately from the three attacks, Unit 42 describes a relying-party implementation
    failure: a party that requests user verification but never validates the User Verified
    bit in the returned assertion lets Pass-ta-key succeed where it would normally be rejected,
    and the post states the attack typically fails against parties that do validate the bit.
    Unit 42 names eBay as a relying party that accepted the attack despite setting `userVerification`
    to required, and states eBay fixed it after the report. The research does not specify
    affected Chrome or Google Password Manager versions.
  why: >-
    The UV check is the one part of this a service can fix without Google, and the eBay case
    shows that requesting user verification is not the same as enforcing it on the response.
  followup: >-
    Watch for a Google response and for WebAuthn library changes that validate the UV bit
    by default.
  sources:
  - label: research
    url: https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49176644
