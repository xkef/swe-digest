  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Debian developers rank eight ballot options on LLM-assisted contributions, from an outright
    ban to permission with conditions.
  summary: >-
    LWN reports Debian's General Resolution on LLM-assisted contributions reached a vote with
    eight ranked options, open until 2026-08-28. The options range from a Social Contract
