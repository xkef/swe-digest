- title: The Information reports Nvidia agreed to buy Hugging Face for $12.9 billion
  section: Markets and companies
  category: Markets
  blurb: >-
    The Information reports Nvidia agreed to buy Hugging Face for $12.9 billion, unconfirmed
    by either company.
  summary: >-
    CNBC reported on 2026-08-27 that The Information, citing one person with knowledge of
    the deal, says Nvidia agreed to buy Hugging Face for $12.9 billion, and that talks began
    after another suitor approached. CNBC states that it could not independently verify the
    report and that neither company responded to a request for comment. Business Insider reported
    the talks earlier at a valuation above $13 billion.
  why: >-
    Hugging Face distributes models and datasets for AMD and Intel hardware alongside Nvidia,
    so the open-model ecosystem's neutral distribution point would sit inside one vendor.
  followup: >-
    Confirmation from Nvidia or Hugging Face, and any regulatory filing behind the reported
    figure.
  sources:
  - label: CNBC
    url: https://www.cnbc.com/2026/08/27/nvidia-hugging-face-acquisition.html
  - label: Business Insider
    url: https://www.businessinsider.com/nvidia-in-talks-to-buy-hugging-face-13-billion-dollars-2026-8
