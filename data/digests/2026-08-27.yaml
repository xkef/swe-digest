- title: >-
    Cloudflare cuts 1.1.1.1 DNS cache memory by 56 percent with five Rust layout changes
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Cloudflare cut 1.1.1.1 DNS cache memory per entry by over half with five Rust layout changes,
    freeing about 100 TB.
  summary: >-
    Cloudflare describes five layout changes to the DNS cache behind 1.1.1.1, which it states
    holds over 250 billion entries, so one wasted byte per entry costs over 250 GB across
    the fleet. The changes replace `Vec` and `String` with `Box<[T]>` and `Box<str>` to drop
    the unused capacity field, saving 8 bytes per field and 64 bytes per entry, merge the
    answer, authority, and additional lists into one list with u16 section offsets for 28
    bytes, drop the record owner name when it equals the queried name and restore it from
    the cache key at read time, and box the large enum variants so A and AAAA records stop
    paying the 144-byte NAPTR-sized footprint. Cloudflare reports per-entry memory down over
    50 percent, about 100 TB freed, insert throughput up 43 percent, and lookup latency down
    19 percent, and states the benchmark approximates production rather than reproducing it,
    with resident memory measured across production instances during rollout.
  why: >-
    These are ordinary Rust layout decisions any service holding many small records can apply,
    and here they cut memory while throughput rose rather than fell.
  sources:
  - label: Cloudflare blog
    url: https://blog.cloudflare.com/dns-cache-memory-optimization-1111/
  - label: HN 49468083
    url: https://news.ycombinator.com/item?id=49468083
- title: Software Freedom Conservancy details an ongoing Bambu Lab AGPLv3 violation
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Software Freedom Conservancy details an ongoing Bambu Lab AGPLv3 violation over a proprietary
    shim in Bambu Studio.
  summary: >-
    Jake Edge reports on an SFC talk at FOSSY 2026 by Bradley Kuhn, Karen Sandler, and Denver
    Gingerich covering Bambu Studio, a fork of the AGPLv3 PrusaSlicer. The described mechanism
    is a thin dynamically loaded shim that calls out to proprietary code on Bambu Lab servers,
    gated by a shared User-Agent string the company claims as a DMCA anti-circumvention measure,
    and a reverse engineer's repository was taken down on that basis. Gingerich adds an alleged
    GPLv2 violation over Buildroot-based firmware shipped with no source and no offer of source.
  why: >-
    SFC's fundraiser passed its $250,000 goal and it is hiring a full-time litigation attorney,
    so this is enforcement capacity rather than a position paper.
  followup: >-
    Whether SFC files against Bambu Lab, and whether the DMCA anti-circumvention claim over
    a User-Agent string is tested.
  sources:
  - label: LWN
    url: https://lwn.net/SubscriberLink/1089390/46116614cc74b814/
  - label: HN 49452980
    url: https://news.ycombinator.com/item?id=49452980
