- title: Running local models on a laptop is now viable for daily coding
  section: Top stories
  category: AI
  blurb: >-
    Local inference on 64GB M2 Macs reaches 75 percent frontier-model accuracy, with GPT-OSS
    marking when hosted models became unnecessary.
  summary: >-
    Vicki Boykis published a practitioner write-up on 2026-06-15 reporting that local model
    inference on a 64GB M2 Mac has become good enough to replace API calls for many tasks.
    She runs Gemma 4 (gemma-4-26b-a4b, gemma-4-12b-qat), GPT-OSS-20B, Qwen 3 MoE, and Qwen
    2.5 Coder through llama.cpp, Ollama, LM Studio, and llamafiles, and reports agentic coding
    loops running locally at roughly 75 percent of frontier-model accuracy and speed. She
    names GPT-OSS as the release after which she stopped reaching for hosted models. Remaining
    limits are slow inference, small context windows tied to RAM, and prompt-template mismatches.
  why: >-
    Capable open-weight models plus mature local tooling shift a class of coding and refactoring
    work off metered APIs and onto developer hardware.
  comments: >-
    HN commenters debated which quantizations stay usable on 32GB versus 64GB and reported
    similar results with MLX on Apple Silicon; several noted that throughput, not quality,
    is now the main gap.
  sources:
  - label: Vicki Boykis
    url: https://vickiboykis.com/2026/06/15/running-local-models-is-good-now/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48555993
- title: Anthropic pauses the June 15 Agent SDK credit split on the day it was due
  section: Top stories
  category: Agentic coding
  blurb: >-
    Anthropic paused a billing change that would have moved Agent SDK to a separate metered
    pool, saying it would align the plan with usage.
  summary: >-
    Anthropic paused the billing change it had announced for 2026-06-15, which would have
    moved Claude Agent SDK, claude -p, GitHub Actions, and third-party subscription-authenticated
    tools off the subscription rate-limit bucket onto a separate 200 USD per month pool metered
    at standard API list prices. The company said "nothing changes for now" and that it is
    working to align the plan with actual usage. The Agent SDK, claude -p, and third-party
    apps continue to draw from regular subscription limits.
