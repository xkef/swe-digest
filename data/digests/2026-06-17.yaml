- title: Linux 7.2 merge window lands pipe and filesystem performance work
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Linux 7.2 merge window landed pipe-throughput improvements from Meta and a filesystem
    optimization boosting IOPS by about 5 percent.
  summary: >-
    The Linux 7.2 merge window is taking performance changes after the 7.1 stable release
    on 2026-06-14. A patch from Breno Leitao of Meta speeds up anon_pipe_write, the function
    that backs shell pipelines and standard streams, by pre-allocating outside the pipe lock
    to cut mutex contention found while profiling caching code. A separate VFS change for
    the IOmap framework skips a redundant memset in iomap_iter() once iteration completes,
    which Phoronix reports improves IOPS by about 5 percent on ext4 and xfs with NVMe storage
    under io_uring.
  why: >-
    Pipe throughput and filesystem IOPS gains land in a mainline cycle that many distributions
    will ship, benefiting shell-heavy and io_uring workloads without configuration changes.
  followup: Track the Linux 7.2 merge-window close and the final feature set.
  sources:
  - label: Phoronix anon-pipe
    url: https://www.phoronix.com/news/Linux-72-Faster-Anon-Pipe-Write
  - label: Phoronix IOmap EXT4/XFS
    url: https://www.phoronix.com/news/Linux-7.2-IOmap-EXT4-XFS
- title: RFC 10008 standardizes the HTTP QUERY method
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The IETF published RFC 10008 defining QUERY, a new HTTP method that safely accepts complex
    parameters in the request body.
  summary: >-
    The IETF published RFC 10008 defining QUERY, a new HTTP method, as a Proposed Standard
    on the Internet Standards Track. QUERY requests that the target process content carried
    in the request body in a safe and idempotent manner and return the result, filling the
    gap between GET, which cannot carry a body, and POST, which is neither safe nor idempotent.
    It lets clients send complex query parameters in the body instead of the URI, avoiding
    URI length limits and keeping sensitive parameters out of request-path logs. Authors are
    Julian Reschke (greenbytes), James M Snell (Cloudflare), and Mike Bishop (Akamai).
  why: >-
    A standardized safe, idempotent, body-carrying method gives APIs a sanctioned alternative
    to overloading POST or stuffing large filters into URIs, and server and framework support
    will follow the RFC.
  followup: Track HTTP server, proxy, and framework implementations adding QUERY support.
  sources:
  - label: RFC 10008
    url: https://www.rfc-editor.org/info/rfc10008/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48568502
- title: Replacing ast.walk to make Python AST traversal 220x faster
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Reflex released fast-walk, a drop-in ast.walk replacement that achieves a 220x speedup
    by eliminating generator overhead.
  summary: >-
    The Reflex team traced slow Python AST traversal to the generator-based design of the
    standard library's ast.walk, which suspends and resumes execution on every node even when
    the caller consumes the full list. Walking difflib (about 7,000 nodes) took roughly 2ms,
    about 285 nanoseconds per node. Their replacement, released as the open-source fast-walk
    library, reports a 220x speedup by avoiding the generator overhead in the hot path.
  why: >-
    Codegen and static-analysis tools that walk large ASTs repeatedly can cut latency substantially
    with a drop-in traversal change.
  sources:
  - label: reflex.dev
    url: https://reflex.dev/blog/why-ast-walk-when-you-can-ast-sprint/
  - label: fast-walk repository
    url: https://github.com/reflex-dev/fast-walk
- title: Snapshotting a migrated database instead of running migrations per test
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A blog post describes copying a golden database snapshot into each test rather than re-running
    migrations, yielding a 7x speedup.
  summary: >-
    The post describes speeding up a test suite by capturing a pristine, fully migrated database
    file once, then copying that golden database into each test rather than re-applying SQL
    migrations serially at the start of every test. The author reports a 7x speedup in a Go
    test suite, since most tests need only the latest schema and gain nothing from replaying
    migrations.
  why: >-
    Repeated migration runs are a common, often unnoticed tax on test-suite wall-clock time,
    and snapshotting is a portable fix.
  sources:
  - label: gaultier.github.io
    url: https://gaultier.github.io/blog/I_sped_up_the_test_suite_by_x2.html
