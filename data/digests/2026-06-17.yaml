- title: >-
    Epic Games releases Lore, an open-source content-addressed version control system
  section: Developer tools
  category: Dev tools
  blurb: >-
    Epic Games released Lore, an MIT-licensed version control system for mixed source and
    binary projects with on-demand hydration.
  summary: >-
    Epic Games published Lore on 2026-06-17, an MIT-licensed version control system aimed
    at projects that mix source code with large binary assets. Lore uses content-addressed
    storage with Merkle trees, an immutable revision chain with cryptographic integrity, chunked
    storage to deduplicate large files, and on-demand data hydration so workspaces stay lightweight
    against a service-backed, cached repository. The project ships SDKs for C/C++, C#, Rust,
    Go, Python, and JavaScript and is available at github.com/EpicGames/lore.
  why: >-
    Game and media teams have long used Perforce or Git LFS for large-asset workflows that
    Git handles poorly; an MIT-licensed, scalability-focused alternative from a major engine
    vendor is a concrete option for those repositories.
  followup: >-
    Track production-readiness statements, real-world adoption beyond Unreal workflows, and
    a tagged stable release.
