- title: >-
    A Hacker News thread covers an htmx 4.0 Game Boy cartridge while the repository's newest
    tag is v4.0.0-beta6
  section: Hacker News
  category: Pulse
  blurb: >-
    An HN thread covers htmx 4.0 on a Game Boy cartridge, but the repository's tag is v4.0.0-beta6,
    so this is a stunt before release.
  summary: >-
    A Hacker News thread submitted 2026-07-26 12:00 UTC and still active today, at 488 points,
    covers htmx 4.0 being distributed on a Game Boy cartridge. The GitHub releases API read
    at this run lists v4.0.0-beta6, published 2026-07-23 and flagged prerelease, as the newest
    release. The cartridge's store URL on swag.htmx.org returned HTTP 403 both to this run
    and to at least one commenter, so it is not published as a source and the product listing
    is not established here.
