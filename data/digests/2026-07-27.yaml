- title: >-
    Researcher reports GitHub code search still returns trojan-bearing repositories a month
    after 10,000 were deleted
  section: Security
  category: Security
  blurb: >-
    GitHub code search still returns trojan repositories a month after deleting 10,000, with
    no pattern detection beyond takedowns.
  summary: >-
    A post dated 2026-07-26 on orchidfiles.com follows up the author's June write-up that
    the 2026-06-18 digest covered, and states that after that article published a script and
    a list of about 10,000 repositories whose README linked to a zip archive containing a
    Trojan, GitHub deleted all of them within a few hours and took no further action, while
    repositories the author found hours later and appended to the same article are still not
    blocked a month on. The post gives three reproducible GitHub code-search queries against
    README download headings and against links to version-numbered zip archives on raw.githubusercontent.com,
    and reports that the result counts GitHub returns for the same query move between 111
    and 4,400. The counts and the claim of inaction are the author's own observations, and
    GitHub has not responded.
  why: >-
    The delivery channel is GitHub's own code search, so the exposed party is any developer
    who searches for a tool and follows a README download link, and the reported remediation
    was takedown of a supplied list rather than detection of the pattern that produced it.
  followup: >-
    Watch for a GitHub response and for whether the reported search queries stop returning
    unblocked repositories.
  sources:
  - label: follow-up post
    url: https://orchidfiles.com/github-security-team/
  - label: June write-up
    url: https://orchidfiles.com/github-repositories-distributing-malware/
  - label: HN 49061769
    url: https://news.ycombinator.com/item?id=49061769
- title: >-
    Three Opus 5 error incidents in one day make fourteen Claude model-error incidents in
    seven days, none with a published root cause
  section: Outages
  category: Outage
  blurb: >-
    Anthropic logged fourteen model-error incidents from 2026-07-21 through 2026-07-27, three
    on 2026-07-27, with no published causes.
  summary: >-
    Anthropic's status page opened three separate model-error incidents on 2026-07-27. The
    first, titled Elevated errors on Claude Opus 5, was under investigation at 08:16 UTC and
    resolved at 09:05 UTC, with errors reported back to baseline as of 09:03 UTC. The second,
    same title, was under investigation at 11:27 UTC and resolved at 12:30 UTC, with errors
    back to baseline as of 11:47 UTC. The third, titled Elevated errors on Claude Opus 5 and
    Haiku 4.5, was under investigation at 13:39 UTC, noted at 14:04 UTC that Haiku 4.5 was
    also returning errors, and resolved at 14:36 UTC with errors back to baseline as of 14:34
    UTC. None carries a cause. Reading the status history feed, fourteen model-error incidents
    were opened between 2026-07-21 and 2026-07-27: two on 07-21, three on 07-22 plus one resolving
    07-23, one on 07-24, three on 07-25, one on 07-26, and three on 07-27. Two further service-disruption
    incidents on 07-21 and 07-22 are a different failure and are counted separately. No incident
    in that range publishes a root cause. The count is bounded at 07-21 because that is where
    the feed read at this run ends, so it is a floor rather than the full span of the pattern.
  why: >-
    Teams putting Claude models on a request path are absorbing a repeated failure mode at
    roughly two incidents a day with no published explanation, so retry, timeout, and model-fallback
    behaviour is load-bearing and there is no vendor statement to size it against.
  followup: >-
    Watch for a root-cause note or an incident summary covering the 2026-07-21 to 2026-07-27
    run, and for whether the rate continues.
