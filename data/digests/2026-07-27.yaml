- title: cJSON disclosure lists 33 defects with no fixed version to upgrade to
  section: Top stories
  category: Security
  blurb: >-
    A researcher disclosed 33 defects in cJSON with no fixed release, affecting embedded deployments
    that parse untrusted JSON.
  summary: >-
    A post dated 2026-07-25 by Joshua Rogers lists 33 defects in the cJSON parser. The author
    states that every issue affects all versions up to and including v1.7.19 and remains in
    current code, so there is no fixed release to upgrade to. The first thirteen findings
    are memory-safety issues and a denial of service, and the rest are logic bugs in JSON
    Patch handling. The author states development has been stagnant for about four years,
    that several issues were reported before with proofs of concept, and that some unmerged
    patches in the repository introduce fresh bugs. The author discloses using AI assistance
    for the search and the write-up.
  why: >-
    cJSON is vendored into ESP-IDF and a large amount of embedded and server-side C, and with
    no upgrade path the only stated remediation is to stop parsing untrusted JSON with it.
  followup: >-
    Watch for CVE assignments, a maintainer response, and whether any fixed release ships.
  sources:
  - label: write-up
    url: https://joshua.hu/cjson-json-parser-cve-vulnerabilities
  - label: HN 49061790
    url: https://news.ycombinator.com/item?id=49061790
- title: >-
    Vercel Labs publishes scriptc, compiling TypeScript to native binaries with no JavaScript
    engine linked in
  section: Top stories
  category: Languages
  blurb: >-
    Vercel Labs published scriptc, a TypeScript compiler producing native binaries without
    a JavaScript engine or npm dependencies.
  summary: >-
    Vercel Labs published scriptc, a compiler that turns TypeScript into native binaries without
    linking a JavaScript engine by default. The repository was created 2026-07-22 under Apache-2.0,
    with macOS arm64 as the primary platform. The README describes three explicit tiers: statically
    compiled by default, an opt-in embedded quickjs-ng engine for npm dependencies and any-typed
    code, and rejection with a diagnostic code. Correctness is enforced by a differential
    corpus of more than 800 programs required to match Node byte for byte on stdout, stderr,
    and exit code, plus an AddressSanitizer lane. Project-reported figures are about 2.4ms
    startup against about 47ms for Node, 170 to 200KB static binaries, and 1 to 4MB RSS. These
    are the project's own measurements and are not independently reproduced.
  why: >-
    A compiler that reports which statements can and cannot go native, and fails loudly rather
    than silently miscompiling, changes what TypeScript can be used for at the CLI and daemon
    layer.
  followup: >-
    Watch for independent benchmarks, for Linux and x86_64 support, and for how large the
    rejected-statement surface is on real codebases.
  sources:
  - label: repository
    url: https://github.com/vercel-labs/scriptc
  - label: project site
    url: https://scriptc.dev
  - label: HN 49063175
    url: https://news.ycombinator.com/item?id=49063175
- title: >-
    ast-grep rewrites tree-sitter's C core in Rust and measures 29.7 percent higher parse
    throughput
  section: Top stories
  category: Dev tools
  blurb: >-
    ast-grep ported tree-sitter to Rust, reporting 29.7 percent higher parse throughput against
    8.9 percent higher peak RSS memory use.
  summary: >-
    A post on the ast-grep blog reports a Rust rewrite of tree-sitter's C core. Measured against
    the unmodified C build normalised to 100, the post reports raw parsing throughput at 129.74,
    with the peak RSS upper bound rising from 21.41 MiB to 25.70 MiB while the lower bound
    stayed near flat at 8.48 MiB against 8.42 MiB, tree traversal throughput at 110.16 with
    RSS up 8.9 percent, and the full ast-grep outline workload at 0.960s user CPU against
    1.233s with RSS up 29.8 percent. The post states ast-grep produced an identical outline.
    The post is part 1 of 4 and states that AI wrote the code. The work lives in a personal
    fork, HerringtonDarkholme/tree-sitter, and is not upstream tree-sitter.
  why: >-
    tree-sitter sits under editors, linters, and code-search tooling, so a memory-for-speed
    tradeoff in its core is a number every downstream consumer should see before adopting
    the fork.
  followup: >-
    Watch for the remaining three parts, for independent benchmarks, and for any upstream
    tree-sitter response.
  sources:
  - label: ast-grep blog
    url: https://astgrep.com/blog/tree-sitter-rust-rewrite
  - label: fork repository
    url: https://github.com/HerringtonDarkholme/tree-sitter
