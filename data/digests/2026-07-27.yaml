- title: >-
    A cookie-banner campaign site draws a 1,102-point Hacker News thread with no readable
    page behind it
  section: Hacker News
  category: Pulse
  blurb: >-
    An HN thread at 1,102 points on killthecookiebanner.eu points at an unreadable page, so
    no EU proposal could be verified.
  summary: >-
    A Hacker News thread submitted 2026-07-26 11:53 UTC and still active today, at 1,102 points,
    points at killthecookiebanner.eu, a campaign site whose name calls for ending per-site
    cookie banners. The page returned stylesheet output with no readable body text to this
    run, so its own text, any EU proposal it references, and any legislative stage are not
    established here. Commenters in the thread describe the campaign as backing an EU move
    toward automated privacy signals exchanged between device and site in place of per-site
    banners, and that characterisation is the thread's rather than a resolved primary document.
  why: >-
    Browser-level consent signalling would move consent handling out of per-site banner code,
    which is why the thread matters to web developers even though the campaign itself is advocacy.
  followup: >-
    Watch for whether an EU Commission proposal exists behind the campaign and, if one does,
    for its text and legislative stage.
  comments: >-
    The thread's recurring technical point is that uBlock Origin's EasyList cookie-notices
    filter combined with blocking third-party cookies already removes most banners today.
    Several commenters argue the browser was always the right layer and blame ad-industry
    incentives rather than the absence of a rule.
  sources:
  - label: campaign site
    url: https://killthecookiebanner.eu/
  - label: HN 49057175
