- title: >-
    NFS2ROOT: a 12-year-old nfsd heap overflow, CVE-2026-99362, lets unauthenticated clients
    root Linux NFS servers
  section: Top stories
  category: Security
  blurb: >-
    Any host serving NFSv4.1 or 4.2 on a reachable port 2049 can be rooted with one TCP connection,
    fixed in 6.12.117, 6.18.61 and 7.3.2.
  summary: >-
    OpenSec says a client can shrink its NFSv4.1 session reply cache to zero bytes and make
    nfsd copy a full SEQUENCE reply into it, writing 61 bytes past a kernel heap object, a
    bug present since Linux 3.16 in 2014. Its Antara agent chained the overflow into a KASLR
    leak, an arbitrary free and a root shell with no human help, and the exploit stays private.
    Fixes by ANSSI's Jérémy Jean shipped in 6.12.117, 6.18.61, 7.3.2 and 7.4-rc1, with CVE-2026-99362
    published on 2026-11-20.
  why: >-
    Any file server, NAS or Kubernetes storage node running in-kernel nfsd needs a patched
    kernel and a reboot, or a firewall on tcp/2049 or NFSv4.1 and 4.2 disabled until then.
  background: >-
    NFSv4.1 added sessions, in which each slot caches its last reply so a retried request
    is answered exactly once. The client negotiates how big that cache is when it creates
    the session, before any authentication. The in-kernel NFS server, nfsd, parses that input
    in kernel context, so a memory bug there is a remote kernel bug rather than a daemon crash.
  event: nfsd-nfs2root-cve-2026-99362
  sources:
  - label: primary
    url: https://opensec.in/blog/nfs2root-cve-2026-99362
  - label: discussion
    url: https://news.ycombinator.com/item?id=50647161
- title: >-
    Defang says an attacker copied its production credentials and database, and held its GitHub
    App key for 11 days
  section: Top stories
  category: Security
  blurb: >-
    A tagged release from an over-permissioned dev GitHub App ran in Defang's CI, exposing
    customer deploy state, Stripe data and repo access.
  summary: >-
    On 2026-11-12 an attacker acting as Defang's development GitHub App pushed a commit and
    tagged it as a release, which production CI trusted, and copied production credentials
    and the main database. The credentials, including the Defang GitHub App key, the key encrypting
    stored GitHub tokens and a Stripe key, stayed valid until Defang detected the activity
    and replaced them on 2026-11-23. Exposed data includes Compose files and deployment state
    from 2026-10-12 to 2026-11-19, which can hold database passwords, and Defang cannot yet
    rule out later use of the GitHub credentials.
  why: >-
    Defang users who installed its GitHub App should audit repositories and the defang-cd-CIRole
    deploy role for activity since 2026-11-11, restrict defang- environments to the deploy
    branch, and rotate secrets from deployment state.
  background: >-
    Defang deploys Docker Compose projects into a customer's own AWS, Google Cloud or Azure
    account. Its GitHub App can push, edit workflows and change deployment environments, and
    a GitHub Actions OIDC role in the customer cloud trusts workflows from the repository.
    A stolen app key can therefore turn into cloud admin access through a workflow run.
  event: defang-ci-credential-breach-2026-11
  major: breach of a platform that developers build on
  sources:
  - label: primary
    url: https://defang.io/blog/post/security-incident-november-2026/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50648035
- title: >-
    Spring publishes 90 advisories on 2026-11-19, and Spring Framework 7.0.11 alone fixes
    13 CVEs
  section: Security
  category: Security
  blurb: >-
    Spring's November batch patches Framework data binding, multipart smuggling, STOMP and
    SpEL flaws, plus Spring Security and Spring AI issues.
  summary: >-
    Spring Framework 7.0.11, released 2026-11-19, fixes 13 CVEs, including CVE-2026-59374
    in data binding on indexed types, CVE-2026-59389 multipart part smuggling, STOMP message
    smuggling and disclosure, an open redirect in UrlHandlerFilter and CVE-2026-59430, unintended
    constructor and method invocation through SpEL type conversion. The Spring advisories
    page lists the same day's batch across Spring Security, Spring AI, Spring Data, Spring
    Web Services and Spring Integration, with several rated HIGH. JVM Weekly counts 90 advisories,
    four of them critical, including CVE-2026-59414, a Spring Boot authorization bypass from
    mismatched path normalization.
  why: >-
    A Spring Boot service needs its Framework, Security and Boot versions moved to the 2026-11-19
    fix releases, because several flaws sit in request binding and path handling.
  background: >-
    Spring publishes its security fixes in a monthly batch, so one day can bring fixes for
    many projects at once. Path normalization bypasses happen when the security filter and
    the request router turn the same URL into different paths. A rule then checks one path
    while the handler serves another. JVM Weekly notes that Quarkus and Micronaut fixed the
    same class of bug in the same days.
  event: spring-november-2026-security-advisories
  sources:
