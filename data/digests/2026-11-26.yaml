- title: >-
    Timur Doumler: the C++29 draft checks base and overrider contracts on virtual calls, one
    of six planned extensions
  section: Talks
  category: Video
  blurb: >-
    The C++29 draft checks both the base and overriding function's pre and post conditions
    on virtual calls, one of six planned contract extensions.
  summary: >-
    At CppCon 2026 Doumler said pre and post on virtual functions, removed from C++26, were
    voted into the C++29 draft, checking the statically called function's precondition, the
    final overrider's precondition, then both postconditions in reverse order, rather than
    Eiffel's OR and AND rules. The other five extensions in roadmap paper P3850 are user-defined
    violation messages, explicitly triggered violations including a hook for C assert, postcondition
    captures of old values and parameters, labels that group assertions and constrain their
    evaluation semantics, and implicit assertions for undefined behavior. All six are implemented
    on GCC and Clang branches available in Compiler Explorer.
  why: >-
    C++ teams adopting C++26 contract_assert, pre and post can see which gaps, such as per-library
    control and virtual function support, are on track for C++29.
  background: >-
    C++26 contract assertions are language keywords that replace the assert macro, with build-time
    evaluation semantics ignore, observe, enforce and quick-enforce and a replaceable violation
    handler. WG21 kept them in C++26 at its Búzios meeting after a failed ISO ballot.
  event: doumler-cpp-contracts-cpp29-roadmap-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=nqEwi-DU2oo
- title: >-
    Lemire: an = default constructor makes a span loop over four times slower than {} under
    GCC 15 and 16
  section: Hacker News
  category: Pulse
  blurb: >-
    Declaring an empty constructor as = default instead of {} makes a span loop over four
    times slower under GCC 15 and 16, but not under Clang 21.
  summary: >-
    Daniel Lemire shows that span() = default keeps a struct trivial, so value-initialization
    zeroes it, while span() {} is user-provided and does not. In his loop GCC 15.2 and 16.2
    route fields through a temporary and copy them, taking 7.75 and 8.04 ns per span against
    1.73 ns with {}, while GCC 14.3 and Clang 21 run both at about 1.74 ns. The post drew
    116 points and 176 comments on Hacker News.
  why: >-
    Hot C++ value types built with GCC 15 or later may need their codegen checked when constructors
    are defaulted.
  comments: >-
    Most of the thread compares C++ constructors with the static factory functions of Rust,
    Go and Zig. Commenters note that C++ constructors allow in-place construction, while Rust
    has no guaranteed copy elision yet and has an open issue to add in-place initialization.
  event: lemire-cpp-default-vs-braces-constructor
  sources:
  - label: primary
    url: https://lemire.me/blog/2026/11/02/default-and-braces-are-not-the-same-constructor/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50643199
- title: >-
    pw-loudness-eq ports Windows Loudness Equalization and its output limiter to PipeWire
    from reverse-engineered DLLs
  section: Hacker News
  category: Pulse
  blurb: >-
    A PipeWire module reimplements Windows' loudness gain control and output limiter from
    its DLLs, with settings scriptable via pw-metadata.
  summary: >-
    pw-loudness-eq reimplements the algorithm in WMALFXGFXDSP.dll as a per-stream PipeWire
    filter graph that measures loudness over 25 bands and applies up to 20 dB of broadband
    gain, plus the look-ahead limiter from AudioEng.dll on every playback device. It needs
    PipeWire 1.4 or later, skips JACK clients and Flatpak apps that use PipeWire directly,
    and stores settings in a PipeWire metadata object. The repository drew 336 points and
    186 comments on Hacker News.
  why: >-
    Linux desktop users get a close match to the Windows feature, and the README documents
    exactly what Windows does to shared-mode audio.
  comments: >-
    Commenters confirm that Windows shared-mode audio passes through the CAudioLimiter even
    with one stream, which altered peaks in one reader's loopback metering. Much of the thread
    argues the feature is gain normalization rather than equalization and points to EasyEffects
    presets, though one user says none of those match Windows.
  event: pw-loudness-eq-pipewire-port
