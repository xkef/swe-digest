- title: >-
    Snap's MCP Gateway fronts 1,100 tools and checks both the person and the agent on every
    restricted call
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Snap's agents carry an attestation token naming the original requester, and tool grants
    for agents go through pull requests to the tool owners.
  summary: >-
    Snap's central MCP Gateway, built with Docker as a design partner, fronts more than 60
    MCP servers and over 1,100 tools and handled about 1.6 million calls from people and its
    Casper agent in the week ending 2026-10-11. An Agent Attestation Token carries both the
    original requester and the calling agent, and the gateway authorizes restricted tools
    against both. Agents start with read-only defaults, extra tools come through pull requests
    that the tool owners approve, and third-party OAuth tokens live in a separate security-owned
    service, not in the gateway or MCP servers.
  why: >-
    It shows a working pattern for agent tool access in which an agent never inherits all
    of a user's rights and never holds service credentials.
  background: >-
    Service-to-service authentication usually tells the receiving service only which service
    called it. The human who started a chain of calls is lost after the first hop. Agents
    add one more hop, so a gateway has to carry the person's identity forward in a trusted
    token. MCP, the Model Context Protocol, is the interface through which agents discover
    and call tools.
  event: snap-mcp-gateway-agent-identity
  sources:
  - label: primary
    url: https://eng.snap.com/mcp-gateway
  - label: discussion
    url: https://news.ycombinator.com/item?id=50620120
