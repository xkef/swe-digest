- title: >-
    Hanno Böck's post on slow Ubuntu kernel fixes draws 399 points as Hacker News weighs backports
    against LTS kernels
  section: Hacker News
  category: Pulse
  blurb: >-
    Ubuntu had no fix for NoisyTCP or an AMD KVM host escape days after disclosure, and practitioners
    argue over Ubuntu's kernel backport model.
  summary: >-
    Hanno Böck wrote on oss-security on 2026-11-25 that Ubuntu still had no fix for NoisyTCP,
    CVE-2026-99288, nine days after disclosure, nor for the AMD KVM host escape CVE-2026-99312
    published on 2026-11-18. He contrasts Ubuntu's backporting onto its own 7.0.0 kernel with
    Debian stable's 6.12.118 longterm kernel. The Hacker News thread reached 399 points and
    245 comments.
  why: >-
    Teams running Ubuntu hosts exposed to the network should check kernel fix status per CVE
    rather than assume same-day distribution patches.
  comments: >-
    Commenters quote the stable kernel maintainer's advice to take every stable or LTS release
    instead of cherry-picking. One notes Debian backported the NoisyTCP fix to its 6.1 kernel
    on 2026-11-14, while upstream 6.1.193 with the fix shipped only on 2026-11-23. Others
    argue Debian's near-weekly kernel updates leave little testing time, and sysadmins describe
    unattended-upgrades with automatic reboots as the practical answer.
  thread: f-0224
