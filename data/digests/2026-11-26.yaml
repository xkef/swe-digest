- title: >-
    Hetzner vSwitch coupling fault can cut links between dedicated and cloud servers from
    2026-11-25 14:18 UTC
  section: Outages
  category: Outage
  blurb: >-
    Changes to private networks or cloud server migrations may fail to configure gateways,
    dropping traffic between dedicated and cloud servers.
  summary: >-
    Hetzner reports the vSwitch coupling faulty since 2026-11-25 14:18 UTC, with the incident
    still in progress. Only networks and servers that use a vSwitch are affected, and connectivity
    from dedicated servers to cloud servers can drop when a private network is changed or
    a cloud server migrates to another host.
  why: >-
    Setups that bridge Hetzner Cloud networks to dedicated servers should hold private network
    changes until Hetzner resolves the fault.
  background: >-
    A Hetzner vSwitch is a VLAN that joins dedicated servers, and coupling attaches it to
    a Hetzner Cloud private network through gateways. Hybrid clusters use it to reach bare
    metal databases or storage from cloud nodes.
  event: hetzner-vswitch-coupling-fault-2026-11-25
  sources:
  - label: primary
