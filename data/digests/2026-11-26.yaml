- title: >-
    sudo-rs on Ubuntu 26.04 breaks Ansible become prompts, fixed in Ansible Core 2.22.0 with
    backports underway
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Ubuntu 26.04's Rust sudo prints extra text before its password prompt, so Ansible runs
    with -K time out waiting for privilege escalation.
  summary: >-
    Jeff Geerling reports that Ansible playbooks run with --ask-become-pass fail on Ubuntu
    26.04 with a 12-second timeout waiting for the privilege escalation prompt, because sudo-rs
    prints an extra string before the prompt. The fix is in Ansible Core 2.22.0 and is being
    backported to 2.16 through 2.20, and pyinfra fixed the same break in 3.11. Setting ansible_become_exe=sudo.ws
    or switching sudo back with update-alternatives also works.
  why: >-
    Fleets moving to Ubuntu 26.04 need an updated Ansible or the classic sudo binary before
    password-protected become stops working.
  background: >-
    Ubuntu has been replacing core utilities with Rust rewrites, and sudo-rs is its implementation
    of sudo. Automation tools such as Ansible drive sudo through a pseudo-terminal and match
    its output to know when to send the password. Any change in prompt text can stall that
    match even when the command itself behaves the same.
  event: ubuntu-sudo-rs-ansible-become-timeout
  sources:
  - label: primary
    url: https://www.jeffgeerling.com/blog/2026/ansible-fails-become-ubuntu2604/
