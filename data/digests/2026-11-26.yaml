- title: >-
    Radim Marek: ANALYZE calls a 99.8%-NULL PostgreSQL column unique in about four runs of
    ten, flipping join plans
  section: Infrastructure
  category: Engineering post
  blurb: >-
    On a sparse join column, each PostgreSQL ANALYZE run gives a new n_distinct, sometimes
    claiming uniqueness, and the planner switches join plans.
  summary: >-
    On a 10 million row lab table where escalated_to is NULL in 99.8% of rows, 200 runs of
    ANALYZE produced 94 different n_distinct values, 75 of them negative, because the 30,000-row
    sample holds about 60 non-NULL values and compute_scalar_stats declares a column unique
    when none repeat. The team query flipped between a nested loop at 5,404 buffers and a
    merge join at 11,091 buffers depending only on the last ANALYZE. SET STATISTICS 1000 stopped
    the flips at the cost of ANALYZE going from 92 ms to 624 ms, and a fixed n_distinct override
    pins the estimate.
  why: >-
    Sparse nullable join columns can change query plans after any autovacuum ANALYZE, and
    the post gives a pg_stats query to find columns in that state.
  background: >-
    PostgreSQL's planner estimates join and filter row counts from per-column statistics that
    ANALYZE builds from a random sample of rows, 300 times the statistics target. n_distinct
    is stored either as a positive count or, when negative, as a fraction of the row count,
    so a negative value grows with the table. The post shows that a nullable foreign key makes
    the planner skip n_distinct and assume every row matches, a stable but far too high estimate.
  event: boringsql-analyze-mostly-null-n-distinct
  sources:
  - label: primary
    url: https://postgr.es/p/9DN
- title: >-
    Garage 2.6.0 adds a web admin UI, publishes an official Helm chart, and ends Garage 1.x
    support
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The self-hosted S3 store Garage gains a browser admin console on its admin port, a Helm
    repository, and a 3.0 beta that swaps its RPC handshake.
  summary: >-
    Garage 2.6.0 serves an NLnet-funded web administration UI on the admin API port, covering
    cluster monitoring, layout, buckets and keys, and the project now publishes an official
    Helm chart. Garage 1.x is end of life. Garage 3.0.0 beta 1 adds anonymous S3 reads and
    object tagging, replaces the SSB handshake with the Noise protocol, renames most Prometheus
    metrics, and breaks 2.x Fjall metadata files.
  why: >-
    Garage operators on Kubernetes get a supported chart, and 1.x users must move to 2.x,
    while planned S3 object locking will be best effort because Garage has no consensus algorithm.
  background: >-
    Garage is a geo-distributed S3-compatible object store aimed at small self-hosted clusters,
    an alternative to MinIO or SeaweedFS. It replicates data without a consensus protocol,
    which keeps it simple but limits guarantees such as conditional writes acting as a mutex.
  event: garage-2-6-0-release
  sources:
  - label: primary
    url: https://garagehq.deuxfleurs.fr/blog/2026-11-webadmin-release/
- title: >-
    ClickHouse tests PostgreSQL 19's pg_plan_advice: a JOIN_ORDER hint cuts a correlated-filter
    join from 3.8 s to 20 ms
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Session-level advice such as BITMAP_HEAP_SCAN and JOIN_ORDER fixes plans that the planner's
    independence assumptions get wrong.
  summary: >-
    PostgreSQL 19 ships pg_plan_advice, set per session, and pg_stash_advice, applied per
    query identifier, both working by forbidding the plans not chosen. In ClickHouse's tests,
    BITMAP_HEAP_SCAN cut an ORDER BY LIMIT query over clustered rows from 1,462 ms to 9.7
    ms, and JOIN_ORDER(a act) cut a join with correlated filters from 3,837 ms to 20 ms. EXPLAIN
    with PLAN_ADVICE reports whether supplied advice matched, and the post shows stale advice
    can make a query slower once the data changes.
  why: >-
    Postgres users get supported hints for the rare plans the planner gets wrong, but should
    scope them with SET LOCAL and recheck them as data shifts.
  background: >-
    The Postgres project long refused query hints, treating bad plans as planner bugs, which
    left users with the third-party pg_hint_plan extension or blunt enable_ settings. The
    planner keeps statistics per table and assumes filters on different tables are independent,
    so correlated columns across a join can push its row estimates off by orders of magnitude.
  event: clickhouse-pg-plan-advice-pg19
  sources:
  - label: primary
    url: https://clickhouse.com/blog/pg-plan-advice-postgresql-19
- title: >-
    Christophe Pettus: functions in indexes and constraints break under the empty search_path
    of autovacuum, pg_restore and replication
  section: Engineering posts
  category: Engineering post
  blurb: >-
    PL/pgSQL bodies resolve names on the caller's path, so autovacuum, pg_restore and replication
    workers can break functions that work in app.
  summary: >-
    Pettus shows that PL/pgSQL functions and string-bodied SQL functions resolve names against
    the caller's search_path, which is empty or pg_catalog, pg_temp for autovacuum, pg_restore,
    vacuumdb and, from PostgreSQL 17, maintenance commands such as ANALYZE and REINDEX, and
    empty for the logical replication apply worker. In his tests a CHECK constraint function
    that assumed the path made a table restore empty with only one error, and an inlinable
    SQL function in an index expression made pg_upgrade fail after --check passed. He also
    shows that SECURITY DEFINER functions need SET search_path ending in pg_temp, that clusters
    upgraded from 14 keep CREATE on public even in template1, and that a session-level SET
    search_path leaks between clients behind a transaction-mode PgBouncer.
  why: >-
    Any function used by an index, constraint, trigger or materialized view needs schema-qualified
    names, a SET search_path clause or a BEGIN ATOMIC body before the next upgrade or restore.
  background: >-
    search_path is the PostgreSQL setting that lists the schemas searched for unqualified
    names. Views, defaults and index expressions are stored already resolved, but most function
    bodies are stored as text and resolved at call time. Since the 2018 CVE-2018-1058 fixes,
    PostgreSQL tools run with an empty path to stop untrusted schemas from hijacking names.
  event: pettus-postgres-search-path-guc
  sources:
  - label: primary
    url: https://postgr.es/p/9DI
- title: >-
    Foojay: wrk's coordinated-omission correction and a co-resident JVM distorted Java benchmark
    tails by orders of magnitude
  section: Engineering posts
  category: Engineering post
  blurb: >-
    wrk's coordinated-omission fix inflated closed-loop percentiles, and a resident neighbouring
    JVM turned a 2 ms open-loop p99 into seconds.
  summary: >-
    Arkadiusz Przychocki traced a 148 ms worst request in closed-loop wrk runs of his Java
    runtime and found wrk 4.1 inserted synthetic samples that pushed the reported mean to
    5.61 ms where Little's law caps it at 2.25 ms, while the max itself was real and not a
    GC pause, the longest being 23 ms. Measured open loop with wrk2 at 30k rps the worst request
    was 25.6 ms, and the gated p99.9 was 2.61 ms. In a later open-loop pair with two heavyweight
    JVMs resident, a target whose p99 was about 2 ms beside a lighter neighbour read 2.4 to
    8.5 s at 12k rps, and the rate-attainment gate caught only three of four bad runs.
  why: >-
    Closed-loop percentiles and runs with other JVMs resident on the same box should not gate
    latency decisions without open-loop measurement and neighbour visibility.
  background: >-
    Coordinated omission happens when a load generator waits for slow responses before sending
    more, so it under-samples exactly the periods when the server is slow. Closed-loop tools
    like wrk send the next request only after the previous one returns, while open-loop tools
    like wrk2 send at a fixed declared rate and time each request from when it should have
    been sent.
  event: foojay-exeris-benchmark-tail-latency
  sources:
  - label: primary
    url: https://foojay.io/today/the-148-ms-was-waiting-not-work/
- title: >-
    Jan Nidzwetzki explains how PostgreSQL's barrier macros, volatile and atomics stop compiler
    and CPU reordering
  section: Engineering posts
  category: Engineering post
  blurb: >-
    GCC at -O2 swaps two shared-memory stores in a writer function, and store buffers and
    invalidate queues reorder them again on ARM.
  summary: >-
    The post compiles a two-store writer with GCC 14.2 at -O2 and shows the compiler emitting
    the done flag store before the tuples store, then fixes it with pg_compiler_barrier, an
    empty inline asm with a memory clobber. It walks through MESI cache coherency, store buffers
    that let later stores overtake earlier ones on ARM but not x86, and invalidate queues
    that let readers see stale values. It then maps these to pg_memory_barrier, pg_write_barrier
    and pg_read_barrier, and notes PostgreSQL 19 raised its requirement from C99 to C11.
  why: >-
    Code with shared-memory flags that works on x86 can fail on Graviton or Apple Silicon
    unless it uses the right barrier pair.
  background: >-
    PostgreSQL runs one process per connection and coordinates them through shared memory,
    so ordering between processes matters as much as between threads. The C11 memory model
    lets compilers reorder accesses that a single thread cannot observe, and CPUs with weak
    memory models, such as ARM, also reorder stores and loads at runtime. A write barrier
    on the producer must pair with a read barrier on the consumer to guarantee ordering.
  event: postgresql-memory-barriers-explainer
  sources:
  - label: primary
    url: https://postgr.es/p/9DL
- title: >-
    LinkedIn cut P99 image pull time 72% by enabling parallel kubelet pulls and lowering containerd
    download concurrency
  section: Talks
  category: Video
  blurb: >-
    Omer Oz shows unpacking, not download, dominates pulls, and that EROFS snapshots skip
    eager unpacking to finish it in under 0.4 s.
  summary: >-
    On LinkedIn's bare metal fleet a 9 GB image downloaded in 13 seconds but took 85 to pull,
    because containerd unpacks layers sequentially and kubelet pulls one image at a time.
    Three parallel kubelet pulls and fewer concurrent containerd downloads cut Flink pod pull
    P99 from 14 to 4 minutes and stateless P50 from 30 to 8 seconds, for 3.6 times faster
    pod startup at P99. Zstd images, parallel unpack and the EROFS snapshotter, plus a containerd
    fix lifting an 8 Gbit/s download cap, cut pulls further.
  why: >-
    Kubernetes operators with large images can tune maxParallelImagePulls and containerd concurrency
    before reaching for lazy-loading or P2P systems.
  event: linkedin-container-image-pull-latency-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=DZgRiIrii40
- title: >-
    DB9's three founders built a Postgres-compatible multi-tenant engine on TiKV with agents,
    merging 14,000 PRs in a year
  section: Talks
  category: Video
  blurb: >-
    Xin Shi explains per-tenant schema leases for online DDL, idle tenants costing only their
    data, and Postgres 17.7 as test oracle.
  summary: >-
    At the CMU Database Group, Xin Shi says agents now create most new databases on several
    platforms, so DB9 runs many tenants in one new Rust SQL engine over TiKV, keeps no runtime
    for idle tenants, and stores about 100 catalog keys per new database. Schema leases scoped
    to one tenant keep transactional DDL online without a cluster-wide schema version, and
    every PR must match Postgres 17.7 on about 1,400 SQL cases. Claude models plan, Gemini
    writes a competing plan, Codex writes the code and a fresh model reviews it, with humans
    still starting engine deploys region by region.
  why: >-
    It is a concrete account of agent-built database work, including where humans stay in
    the loop and how a reference implementation serves as the correctness check.
  event: db9-agent-built-database-cmu-talk
