- title: >-
    Cloudflare Search for Agents indexes a zone and serves /.well-known/search, including
    the new HTTP QUERY method
  section: AI
  category: AI
  blurb: >-
    One toggle creates an AI Search index for a site, advertises its endpoint in meta tags,
    and answers GET or RFC 10008 QUERY requests.
  summary: >-
    Enabling Search for Agents on a zone creates an AI Search instance, crawls and indexes
    the site, and serves Markdown search results, not generated answers, from /.well-known/search
    on the customer's domain. Every HTML page gets agent:endpoint and agent:instructions meta
    tags, and Markdown for Agents responses carry the same data in front matter. It is available
    on all plans, including Free with limits, billed at AI Search pricing.
  why: >-
    Documentation sites can give coding agents a search endpoint instead of letting them crawl
    pages, and API builders get a production example of the QUERY method.
  background: >-
    HTTP QUERY, published as RFC 10008 in 2026-06, is a safe and idempotent method that carries
    its query in a request body, filling the gap between GET with long query strings and POST,
    which caches and retries cannot treat as safe. Cloudflare says curl and undici have adopted
    it.
  event: cloudflare-search-for-agents
  sources:
  - label: primary
    url: https://blog.cloudflare.com/search-for-agents/
- title: >-
    Hugging Face trains four Qwen3-0.6B agents to share private data, lifting team success
    from 6.6% to 82.3%
  section: AI
  category: AI
  blurb: >-
    A shared 0.6B policy trained with a team reward learns to broadcast private numbers to
    teammates, and uses 37% fewer tokens per attempt.
  summary: >-
    Hugging Face reproduced the s3 information-aggregation task with four agents sharing one
    Qwen3-0.6B policy and messaging tools, trained with GRPO-style group advantages over eight
    team attempts per problem. Over 75 updates, training success rose from 6.6% to 82.3% while
    generated tokens per team fell from about 12,800 to 8,000, and the trained checkpoint
    solved 26 of 32 held-out problems. The untrained team's best-of-8 success was 37.5% at
    about 103,000 tokens per problem, and a TRL example reproduces the run on two H200s in
    about five hours.
  why: >-
    It gives a runnable baseline for asking whether agent communication helps or just spends
    more compute, with token cost measured next to success.
  background: >-
    Multi-agent reinforcement learning treats a team as a decentralized partially observable
    decision process, where agents share a reward but each sees only part of the state. A
    common pattern is centralized training with decentralized execution, where training uses
    the whole team's outcome while each agent acts on its own context. GRPO normalizes rewards
    within a group of attempts at the same problem, so no separate value model is needed.
  event: hf-multi-agent-swarm-rl-training
  sources:
  - label: primary
    url: https://huggingface.co/blog/training-swarms
