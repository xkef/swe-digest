- title: >-
    EDK2 PXE boot flaw CVE-2026-97631 allows pre-boot code execution in UEFI firmware after
    leaked fix
  section: Top stories
  category: Security
  blurb: >-
    A 16-year-old ICMP buffer overflow in TianoCore's PXE driver lets a network attacker run
    code before Secure Boot, and the fix leaked early.
  summary: >-
    CVE-2026-97631, rated 9.5, is a buffer overflow in the EDK II PXE Base Code driver (NetworkPkg/UefiPxeBcDxe)
    that copies oversized ICMP error messages past a 504-byte field during network boot. Ars
    Technica reports the bug was found by researchers at Anthropic and Google with disclosure
    set for January, but an AMI pull request exposed the fix and TianoCore published an advisory
    last week. Exploitation needs network reach during PXE boot and per-model address tuning,
    and Intel and Arm say their supported products are not directly affected.
  why: >-
    Fleets that PXE boot servers need firmware updates from their vendors and should consider
    disabling network boot until those ship.
  followup: Firmware advisories from AMI, Insyde, Phoenix, server OEMs and cloud providers.
  sources:
  - label: primary
    url: https://arstechnica.com/security/2026/10/code-execution-flaw-in-uefi-firmware-threatens-most-servers-on-planet-earth/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50265393
