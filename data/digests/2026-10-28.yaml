- title: >-
    Tailscale v1.104.4 fixes Tailscale SSH privilege escalation and Serve bugs from the Tailworm
    report
  section: Security
  category: Security
  blurb: >-
    Tailscale shipped client 1.104.4 and four bulletins, TS-2026-014 to 017, fixing SSH privilege
    boundary and forwarding flaws found by Tailworm.
  summary: >-
    Tailscale says the SSH flaws let an already authorized session act beyond its configured
    local user, including through SSH forwarding, and require a foothold on a peer the policy
    allows. Version 1.104.4 also fixes three of five reported Serve and Funnel findings, and
    the Conn25 app connector issue affects only unreleased code.
  why: >-
    Anyone running Tailscale SSH should update to 1.104.4 and review SSH policy scope and
    check mode for sensitive hosts.
  thread: f-0128
  sources:
  - label: primary
    url: https://tailscale.com/blog/tailscale-ssh-findings-fixes
  - label: discussion
    url: https://news.ycombinator.com/item?id=50264857
- title: Grafana 13.2.5, 13.1.9 and 13.0.12 fix four CVEs
  section: Security
  category: Security
  blurb: >-
    Grafana patch releases on 2026-10-27 fix CVE-2026-100105, CVE-2026-88858 and CVE-2026-88967
    across three branches, plus one more in 13.2.
  summary: >-
    Grafana 13.2.5 lists fixes for CVE-2026-100105, CVE-2026-103506, CVE-2026-88858 and CVE-2026-88967.
