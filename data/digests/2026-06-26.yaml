- title: EU lines up AWS and Azure for DMA cloud gatekeeper status
  section: Markets and companies
  category: Markets
  blurb: >-
    The EU designated AWS and Azure as cloud gatekeepers under the Digital Markets Act despite
    not meeting quantitative thresholds, citing 70% share.
  summary: >-
    On 2026-06-25 the European Commission issued preliminary findings that Amazon Web Services
    and Microsoft Azure should be designated gatekeepers under the Digital Markets Act, the
    first time the regime would extend to cloud infrastructure. The Commission says the two
    qualify as an important gateway despite not meeting the law's quantitative thresholds;
    together they hold roughly 70% of European cloud revenue. Designation would bring interoperability,
    data-portability, and self-preferencing obligations, with fines up to 10% of worldwide
    turnover for non-compliance.
  why: >-
    Gatekeeper duties on AWS and Azure would reshape cloud lock-in, egress, and interoperability
    terms for European engineering teams.
  followup: >-
    Track the formal designation decision, the specific obligations imposed, and any appeal.
