- title: AMD submits open-source HDMI 2.1 FRL patches for the Linux kernel
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    AMD submitted kernel patches adding HDMI 2.1 Fixed Rate Link support to the open-source
    AMDGPU driver, closing a long-standing licensing gap.
  summary: >-
    AMD submitted the first set of kernel patches adding HDMI 2.1 Fixed Rate Link (FRL) signalling
    to the open-source AMDGPU driver, after years in which the HDMI Forum's licensing requirements
    blocked an open HDMI 2.1 implementation, an effort reportedly helped along by Valve. FRL
    replaces the legacy TMDS mechanism used in HDMI 2.0 and has passed representative compliance
    testing; other HDMI 2.1 features such as Display Stream Compression and Variable Refresh
    Rate remain in testing. If approved, the code targets the Linux 7.2 kernel.
  why: >-
    It closes a long-standing gap that capped open-source AMD HDMI output below the 4K120
    and 8K modes HDMI 2.1 enables, affecting Linux desktop and handheld users on AMD graphics.
  followup: >-
    Track HDMI Forum approval, the merge into the 7.2 window, and DSC and VRR support landing.
  sources:
