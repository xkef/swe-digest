- title: Apple raises MacBook and iPad prices on the memory crunch
  section: Top stories
  category: Markets
  blurb: >-
    Apple raised entry MacBook and iPad prices 17% to 25% citing AI data center demand draining
    DRAM and NAND supply.
  summary: >-
    Apple raised prices on base MacBook and iPad configurations on 2026-06-25, its first move
    to pass higher memory and storage costs to consumers. Reported increases run from about
    17% to 25%: the entry MacBook Neo to $699 from $599, the 512GB MacBook Air to $1,299 from
    $1,099, the 1TB MacBook Pro to $1,999 from $1,699, and iPad base models up $100 to $150.
    Apple cited AI data center demand draining DRAM and NAND supply and said it had never
    seen a component price rise this fast.
  why: >-
    The AI memory crunch is now reaching consumer hardware pricing, a leading signal for rising
    DRAM and NAND costs in server bills of materials.
  followup: >-
    Track DRAM and NAND pass-through from Samsung, SK hynix, and Micron, and whether server-class
    memory pricing follows.
