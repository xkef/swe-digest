- title: OpenAI to stagger GPT-5.6 release at US government request
  section: Top stories
  category: AI
  blurb: >-
    OpenAI will stagger GPT-5.6 for limited enterprise preview after US government agencies
    request customer-by-customer access review.
  summary: >-
    Reporting on 2026-06-25 (single-sourced) says OpenAI will stagger the release of GPT-5.6
    after a request from the Office of the National Cyber Director and the Office of Science
    and Technology Policy. Sam Altman reportedly told staff GPT-5.6 will enter a limited preview
    for a small set of enterprise customers, with the government approving access customer
    by customer during the preview. The request maps onto Executive Order 14409 (signed 2026-06-02),
    which asks developers to give the government up to 30 days of pre-release access to their
    most capable models.
  why: >-
    It is one of the first public cases of a US agency coordinating directly on a frontier
    model release sequence, a more permissive posture than the foreign-access limits placed
    on Anthropic Fable 5 and Mythos 5.
  followup: >-
    Watch for OpenAI confirmation, the preview scope and timeline, and how the EO 14409 pre-release
    review applies to other labs.
  sources:
