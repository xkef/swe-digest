- title: Un-0 generates images with a simulated coupled-oscillator system
  section: ML research
  category: ML research
  blurb: >-
    Unconventional AI published Un-0, generating images via coupled-oscillator system, achieving
    ImageNet 64x64 FID comparable to early generators.
  summary: >-
    Unconventional AI published Un-0, an image generator that runs on a simulated system of
    coupled oscillators rather than standard GPU-executed deep networks. The team trains the
    coupling matrix, oscillator frequencies, and a decoder end-to-end on CIFAR-10 and ImageNet
    64x64, reporting FID 6.74 on ImageNet 64x64, comparable to early conventional generators.
    Weights, training, and ablation code are open. The result is a project writeup, not an
    independently reproduced benchmark.
  why: >-
    It is an early demonstration that a physical-computing substrate can match older generative-model
    quality, an argument for energy-efficiency gains beyond GPU execution.
  followup: >-
    Watch for independent reproduction and any hardware (analog or photonic) realization of
    the oscillator substrate.
