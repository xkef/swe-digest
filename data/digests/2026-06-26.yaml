- title: Deno 2.9 ships desktop app builds and broad npm migration
  section: Top stories
  category: Languages
  blurb: >-
    Deno 2.9 added an experimental deno desktop tool to compile web frameworks to native binaries
    and enabled direct npm lockfile import.
  summary: >-
    Deno 2.9 released on 2026-06-25. Headline additions are `deno desktop`, an experimental
    tool that compiles web-framework projects (Next.js, Astro, Fresh) to a single native binary
    with a native webview or bundled Chromium backend, and improved npm migration where `deno
    install` reads npm, pnpm, yarn, and Bun lockfiles directly. The release reports 2x faster
    cold start (34ms to 17ms), 2.2x to 3.1x lower peak memory under load, Node.js 26 compatibility
    with bare `import "fs"`, and post-quantum and ChaCha20-Poly1305 Web Crypto algorithms.
    `Deno.serve` automatic compression now defaults to off, a behavior change.
  why: >-
    Direct lockfile import lowers the cost of moving Node projects to Deno, and `deno desktop`
    puts Deno into the Electron and Tauri packaging space.
  followup: >-
    Track `deno desktop` stabilizing out of experimental and the permission model for produced
    binaries.
  sources:
  - label: Deno blog
    url: https://deno.com/blog/v2.9
  - label: HN
    url: https://news.ycombinator.com/item?id=48675717
