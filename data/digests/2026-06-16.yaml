  blurb: >-
    CISA added two known-exploited vulnerabilities: the Cisco SD-WAN Manager path-traversal
    flaw and a LiteSpeed cPanel symbolic-link vulnerability.
  summary: >-
    CISA's Known Exploited Vulnerabilities catalog moved to version 2026.06.15 (count 1621)
    with two additions dated 2026-06-15: CVE-2026-20262 (Cisco Catalyst SD-WAN Manager path
    traversal, covered in Top stories) and CVE-2026-54420, a UNIX symbolic-link (symlink)
