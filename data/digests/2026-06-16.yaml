- title: Typst 0.15.0 released
  section: Developer tools
  category: Dev tools
  blurb: >-
    Typst 0.15.0 added variable-font support, bundle export for multiple formats, MathML in
    HTML, and multiple bibliographies per document.
  summary: >-
    The Typst typesetting system released 0.15.0 on 2026-06-15. New features include variable-font
    support with custom axis variations, bundle export producing multiple output files (HTML,
    PDF, PNG, SVG, assets) from one project, MathML in HTML export for accessible equations,
    multiple bibliographies per document, spot colors for offset printing, a project-relative
    file-path type that crosses package boundaries, and a `within` selector. Breaking changes:
    file paths must use forward slashes (backslashes no longer allowed), non-Unicode input
    paths are dropped, several deprecated elements are removed (`path`, `pattern`, `pdf.embed`,
    scoped decode functions), HTML/SVG/PDF output is now minified by default (use `--pretty`),
    a new `typst eval` CLI command supersedes `typst query`, and the minimum supported Rust
    version rises to 1.92.
  why: >-
    The forward-slash path requirement and removed deprecated elements are migration work
    for existing Typst projects and templates, while bundle export and improved HTML/MathML
    output widen Typst's use beyond PDF.
  comments: >-
    HN commenters singled out multiple bibliographies per document and the automatic MathML
    export for HTML as long-requested wins; several cited programmatic PDF generation as the
    main production use.
  sources:
  - label: Typst 0.15.0 changelog
    url: https://typst.app/docs/changelog/0.15.0/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48544396
- title: Homebrew 6.0.2 hardens the install sandbox
  section: Developer tools
  category: Dev tools
  blurb: >-
    Homebrew 6.0.2 tightened the sandbox to deny access to the home directory, limiting what
    malicious formulas can read during package builds.
  summary: >-
    Homebrew published 6.0.2 on 2026-06-15, a patch release continuing the 6.0.0 sandbox and
    tap-trust work: the sandbox now denies access to all of `$HOME` except Homebrew directories,
    Bubblewrap can auto-install on Linux, and several tap-trust and redirected-tap-trust handling
    paths were fixed, alongside fixes for sandboxed-home crashes and `brew irb`/`brew dry-run`
    regressions.
  why: >-
    The tighter `$HOME` deny rules reduce what a malicious formula or cask can read during
    a build, the same install-time trust surface behind recent package-ecosystem attacks.
  sources:
  - label: Homebrew 6.0.2 release
    url: https://github.com/Homebrew/brew/releases/tag/6.0.2
- title: Project Valhalla value classes (JEP 401) reach preview, targeting JDK 28
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Value classes from Project Valhalla reached preview for JDK 28, enabling the JVM to flatten
    and inline objects for better memory and performance.
  summary: >-
    JEP 401, Value Classes and Objects, the central language feature of the long-running Project
    Valhalla, is set to land as a preview in JDK 28. The Register reported on 2026-06-15 that
    Oracle engineer Lois Foltan confirmed the change will merge into the OpenJDK mainline
    early in July 2026; the first-preview pull request adds more than 197,000 lines across
    1,816 files. Value classes create objects with no identity, distinguished only by their
    field values rather than their location in memory, which lets the JVM flatten and inline
    them for performance instead of forcing heap allocation and pointer indirection. The feature
    ships as an opt-in preview, not enabled by default, and JEP 401 migrates some existing
    JDK classes such as `Integer` to value classes, with more to follow over later releases.
    JDK 28 is expected in March 2027.
  why: >-
    Value classes are the largest Java language change in a decade and the foundation for
    flattened generics and value-based numerics, so teams tracking JVM memory layout, allocation
    pressure, and data-oriented APIs should begin reading JEP 401 now even though general
    availability is years away.
  followup: >-
    Confirm the mainline merge in early July 2026 and watch whether JEP 401 stays preview
    through JDK 29.
  comments: >-
    Brian Goetz cautioned against expecting a short preview window, saying hoping for the
    feature to exit preview by JDK 29 (the next LTS, expected September 2027) "seems optimistic,"
    so production-ready value classes remain at least a year out.
  sources:
  - label: JEP 401
    url: https://openjdk.org/jeps/401
  - label: The Register
    url: https://www.theregister.com/devops/2026/06/15/javas-project-valhalla-finally-lands-a-preview-in-jdk-28/5255557
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48544384
- title: How memory-safety CVEs differ between Rust and C/C++
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Rust and C/C++ differ in memory-safety CVE standards: Rust flags unsafe behavior in safe
    code as library bugs, C/C++ as caller error.
  summary: >-
    In a post dated 2026-06-15, Jakub Beranek (Kobzol) argues that raw CVE counts mislead
    when comparing Rust and C/C++ memory safety because the two ecosystems apply different
    reporting standards. Using `curl_getenv()` as the worked example, he notes that in C/C++
    a crash caused by "wrong usage" such as passing `NULL` is treated as caller error and
    usually not reported as a library CVE, whereas in Rust, if safe (non-`unsafe`) code can
    trigger memory unsafety without misuse, it is a library bug and a reportable CVE. The
    claim is that Rust's `unsafe` boundary makes a soundness obligation explicit, so Rust
    libraries may file more memory-safety CVEs without being less safe.
  why: >-
    Teams using CVE counts to compare language safety in procurement or risk reviews can draw
    the wrong conclusion if they do not account for the differing thresholds for what counts
    as a reportable library vulnerability.
  sources:
  - label: Kobzol's blog
    url: https://kobzol.github.io/rust/2026/06/15/how-memory-safety-cves-differ-between-rust-and-c-cpp.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48543392
- title: How TimescaleDB compresses time-series data
  section: Engineering posts
  category: Engineering post
  blurb: >-
    TimescaleDB's Hypercore compression reorganizes rows into columnar batches with typed
    codecs, trading per-row updates for storage and scan gains.
  summary: >-
    A write-up walks through TimescaleDB's Hypercore compression: row data in a hypertable
    chunk is reorganized into columnar batches of up to 1,000 rows, each column compressed
    with a type-appropriate scheme (delta and delta-of-delta for ordered integers and timestamps,
    dictionary encoding for low-cardinality text, Gorilla-style encoding for floats), trading
    per-row update cost for large storage and scan-throughput gains on append-mostly time-series
    workloads. It surfaced on Hacker News (133 points).
  why: >-
    It explains the concrete tradeoffs (columnar batch layout, per-type codecs, slower in-place
    updates) that determine when Postgres-based time-series compression pays off for an observability
    or metrics store.
  sources:
  - label: roszigit.com
    url: https://roszigit.com/en/blog/timescaledb-compression-hypercore
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48544451
- title: Raymond Chen on an x86 emulator team patching bad code during emulation
  section: Engineering posts
  category: Engineering post
  blurb: >-
    An x86-on-ARM emulator special-cased pathological code, fixing it during JIT translation
    rather than translating instructions faithfully.
  summary: >-
    A 2026-06-15 Old New Thing post recounts an x86-on-ARM emulator team encountering code
    pathological enough for the emulator's just-in-time translator that they special-cased
    it and effectively fixed it during emulation rather than translating it faithfully. The
    post is a short engineering anecdote on emulation and JIT-translation edge cases.
  why: >-
    It is a concrete look at how binary-translation emulators handle adversarial or degenerate
    instruction patterns, relevant to anyone running x86 workloads under ARM translation layers.
  sources:
  - label: The Old New Thing
    url: https://devblogs.microsoft.com/oldnewthing/20260615-00/?p=112419
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48550693
- title: 'Ask HN: replacing cloud models with a local model for daily coding'
  section: Hacker News
  category: Pulse
  blurb: >-
    An Ask HN thread found developers have not yet successfully replaced cloud coding models
    with local alternatives for interactive coding work.
  summary: >-
    A 1,053-point Ask HN thread asks whether anyone has replaced Claude or GPT with a locally
    run model for everyday coding. The consensus in the comments is "not yet for interactive
    use."
  comments: >-
    Commenters reported local models still trail cloud offerings: Gemma 4 on an Apple M4 ran
    at much lower tokens-per-second than cloud APIs; one user runs DeepSeek V4 Flash on dual
    RTX Pro 6000 Blackwell GPUs at about 160 tok/s but uses it for auto-write-then-auto-review
    rather than interactive editing; harder tasks (an AVX-512 bit-matrix transpose) that cloud
    models solve easily tripped up local Kimi 2.6 and GLM 5.1. Several pointed to attaching
    OpenRouter to an existing agent to test open-weight models without local hardware, and
    cited gaps in enterprise tooling for selecting and running local models.
  sources:
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48542100
