date: '2026-06-14'
stories:
- title: Amazon CEO's talks with US officials preceded the Anthropic model crackdown
  section: Top stories
  category: AI
  blurb: >-
    Amazon CEO Andy Jassy's discussions with Trump officials preceded a US directive suspending
    Anthropic's Fable 5 and Mythos 5 models globally.
  summary: >-
    The Wall Street Journal reports, citing people familiar with the matter, that the US export-control
    directive forcing Anthropic to suspend Fable 5 and Mythos 5 followed discussions between
    Amazon CEO Andy Jassy and Trump administration officials, in which Jassy raised security
    concerns about the models; the report says Amazon researchers had used a series of prompts
    to get Fable 5 to produce information usable to aid cyberattacks. Anthropic states the
    directive requires it to block all foreign-national access, which forced it to disable
    both models for all customers worldwide including AWS Bedrock users, and that its understanding
    is the concern is a narrow jailbreak consisting of asking the model to read a codebase
    and fix software flaws, a capability it says exists in other models including OpenAI GPT-5.5.
    As of this run access remains suspended with no restoration timeline.
  why: >-
    A competitor's lobbying preceding a national-security recall of a deployed frontier model
    raises the prospect that commercial rivalry, not only capability risk, can pull a model
    offline, and any integration still on Fable 5 or Mythos 5 must fail over to Opus 4.8 or
    another model.
  followup: >-
    Track whether the directive is lifted, narrowed, or extended; watch for an official government
    statement, refund handling, and any legal challenge.
  comments: >-
    HN commenters noted Amazon holds a large equity stake in Anthropic and questioned the
    motivation; several asked for corroboration of the single-sourced WSJ report and debated
    whether the cited code-analysis capability is unique to Fable 5.
  sources:
  - label: Anthropic statement
    url: https://www.anthropic.com/news/fable-mythos-access
  - label: WSJ
    url: https://www.wsj.com/tech/ai/amazon-ceos-talks-with-u-s-officials-triggered-crackdown-on-anthropic-models-dcc90578
  - label: Fortune
    url: https://fortune.com/2026/06/13/anthropic-disables-fable-mythos-export-controls-national-security-threat/
  - label: CNBC
    url: https://www.cnbc.com/2026/06/12/anthropic-disables-access-to-fable-5-and-mythos-5-to-comply-with-government-directive.html
