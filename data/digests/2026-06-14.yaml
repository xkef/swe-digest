    url: https://news.ycombinator.com/item?id=48519092
- title: Linux 7.1 stable expected 2026-06-14
  section: Top stories
  category: Linux/Kernel
  blurb: >-
    Linus Torvalds released Linux 7.1-rc7 as the expected final candidate, with stable launch
    anticipated 2026-06-14 and FRED and NTFS support.
  summary: >-
    Linus Torvalds released Linux 7.1-rc7 on 2026-06-07 and said he expected it to be the
    final release candidate, with the 7.1 stable release on 2026-06-14 unless an eighth candidate
    was needed. Headline 7.1 features include FRED (Flexible Return and Event Delivery) on
    x86, a new in-tree NTFS driver for reading and writing Microsoft filesystems, and performance
    work, with late-cycle fixes concentrated in GPU then networking. The cycle ran heavier
    than usual due to a surge of AI-agent-generated patches. As of this run the newest tag
    in the tree is `v7.1-rc7`; the stable tag had not yet landed.
  why: >-
    Linux 7.1 ships a new NTFS driver and the FRED interrupt-delivery rework, and distributions
    and CI pipelines tracking mainline should prepare for the merge once the stable tag lands.
  followup: >-
    Confirm the 7.1 stable tag and announcement; review the changelog for scheduler, io_uring,
    and eBPF changes.
  sources:
  - label: Phoronix feature overview
    url: https://www.phoronix.com/news/Linux-7.1-Best-Features
  - label: Neowin
    url: https://www.neowin.net/news/linux-71-stable-launch-looms-as-linus-torvalds-releases-the-final-release-candidate/
