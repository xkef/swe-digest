- title: Noise infusion banned from Census Bureau statistical products
  section: Hacker News
  category: Pulse
  blurb: >-
    Differential-privacy researcher Damien Desfontaines argues against a legislative provision
    banning noise-infusion from Census Bureau statistics.
  summary: >-
    A high-discussion front-page post (781 points) by differential-privacy researcher Damien
    Desfontaines argues against a legislative provision that would ban "noise infusion," the
    differential-privacy technique the US Census Bureau uses to protect respondent data in
    published statistics. The post explains how disclosure-avoidance noise works and why removing
    it raises reidentification risk. HN discussion split on the accuracy-versus-privacy tradeoff
    in published government data.
  comments: >-
    Commenters debated whether differential privacy degrades small-area statistics enough
    to justify the concern and whether alternative disclosure-avoidance methods would be mandated
    in its place.
  sources:
  - label: desfontain.es
    url: https://desfontain.es/blog/banning-noise.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48517377
- title: AI tooling startup TensorZero archives its repository after a $7.3M seed
  section: Hacker News
  category: Pulse
  blurb: >-
    LLM-tooling startup TensorZero archived its repository one year after $7.3M seed, prompting
    venture-backed open-source sustainability concern.
  summary: >-
    The open-source LLM-tooling project TensorZero archived its GitHub repository, and its
    site now states the software will no longer be maintained. HN commenters clarified the
    timeline: the $7.3M seed round was announced in August 2025, and the archival happened
    roughly a year later, prompting discussion of burn rate and the durability of venture-funded
    open-source application-layer tooling.
  comments: >-
    Commenters connected the shutdown to broader skepticism about funding application-layer
    ("harness") AI tooling versus infrastructure, and warned about depending on VC-backed
    open-source projects without a sustainability plan.
  sources:
  - label: GitHub repo
    url: https://github.com/tensorzero/tensorzero
  - label: project site
    url: https://www.tensorzero.com/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48516504
