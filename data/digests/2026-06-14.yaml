- title: Oracle PeopleSoft CVE-2026-35273 zero-day actively exploited; CISA KEV
  section: Top stories
  category: Security
  blurb: >-
    CVE-2026-35273, unauthenticated RCE in Oracle PeopleSoft, was exploited as a zero-day
    by ShinyHunters from 2026-05-27 to 2026-06-09.
  summary: >-
    CVE-2026-35273 (CVSS 9.8) is an unauthenticated server-side request forgery leading to
    remote code execution in the Updates Environment Management component of Oracle PeopleSoft
    Enterprise PeopleTools. It was exploited as a zero-day between 2026-05-27 and 2026-06-09,
    two weeks before Oracle's 2026-06-10 out-of-band advisory; Google attributes exploitation
    to ShinyHunters. PeopleTools 8.61 and 8.62 are affected. CISA added it to the Known Exploited
    Vulnerabilities catalog on 2026-06-12 (confirmed in the KEV feed) and ordered federal
    agencies to patch.
  why: >-
    Internet-exposed PeopleSoft handles HR and financial data, and unauthenticated RCE under
    active extortion-group use makes unpatched instances an immediate breach risk.
  followup: >-
    Watch for confirmed data-theft victims, ransomware follow-on, and the federal remediation
    deadline.
  sources:
  - label: Rapid7
    url: https://www.rapid7.com/blog/post/etr-active-exploitation-of-oracle-peoplesoft-zero-day-cve-2026-35273/
  - label: SecurityWeek (ShinyHunters)
    url: https://www.securityweek.com/google-confirms-exploitation-of-oracle-peoplesoft-zero-day-by-shinyhunters/
  - label: CISA KEV catalog
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- title: GLM 5.2 released with 1M context; open weights expected next week
  section: AI
  category: AI
  blurb: >-
    Zhipu announced GLM 5.2 with 1M token context and open-weight release expected the following
    week on its API and Coding Plan.
  summary: >-
    Z.ai (Zhipu) announced GLM 5.2 on 2026-06-13 via posts on X from the company and its chief
    scientist Jie Tang, positioning it as a coding-and-agent-focused model with a context
    window up to 1 million tokens (model ID reported as `glm-5.2[1m]`) and maximum output
    of 131,072 tokens. The company said it is available immediately on the GLM Coding Plan,
    with a standalone API and an open-weight release under a permissive license expected the
    following week. No official blog post or benchmark numbers had been published at announcement
    time.
  why: >-
    Another frontier-class open-weight coding model with a 1M context window and permissive
    license adds to the migration pressure on teams paying premium per-token rates for proprietary
    coding agents.
  followup: >-
    Track the open-weight release, the official model card and license, and independent coding-benchmark
    results.
  comments: >-
    HN commenters noted the release landed the same day as the US directive against Anthropic's
    frontier models and thanked Chinese labs for permissive open-weight licenses, while others
    said the absence of any benchmark blog post makes the capability claims unverifiable for
    now.
  sources:
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48518684
- title: Anthropic reports Claude matching NMR software on spectral analysis
  section: ML research
  category: ML research
  blurb: >-
    Anthropic reports Opus 4.7 reaching average errors comparable to ChemDraw and MestReNova
    on nuclear magnetic resonance spectral analysis.
  summary: >-
    In a research write-up dated 2026-06-05, Anthropic reports evaluating Claude on nuclear
    magnetic resonance (NMR) spectral analysis using 20 compounds drawn from synthetic-chemistry
    preprints published after the models' training cutoff, across four structural families.
    The post states Opus 4.7 reached average errors of about 0.079 ppm for hydrogen and 1.37
    ppm for carbon shift prediction, comparable to or better than the ChemDraw and MestReNova
    chemistry tools, and that on inverse structure elucidation it recovered all 8 simpler
    structures from spectra alone and 4 of 7 more complex structures when given starting-material
    context. The result is the lab's own internal evaluation and has not been independently
    reproduced.
  why: >-
    If a general model performs routine NMR prediction at parity with dedicated cheminformatics
    software, it shifts part of the structure-elucidation workflow from specialized tools
    toward LLM tool-use pipelines, a direct interest for AI-for-science tooling.
  followup: >-
    Watch for independent reproduction, a method paper or dataset release, and evaluation
    on larger or harder compound sets.
  sources:
  - label: Anthropic research
    url: https://www.anthropic.com/research/making-claude-a-chemist
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48523752
- title: Running AI coding agents at home without overspending
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Practitioners report running coding agents on cheap-provider APIs and self-hosted models
    costs roughly $10 over two weeks.
  summary: >-
    A widely discussed practitioner post lays out cost options for running coding agents outside
    expensive metered plans: self-hosting open-weight models on owned hardware, using cheap
    provider APIs, and fixed-price monthly plans. HN commenters reported that routing a cheap
    provider model (for example DeepSeek V4 flash) through a harness like opencode cost roughly
    $10 over two weeks, and argued that self-hosting trades per-token cost for hardware and
    power expense and is mostly worth it for privacy rather than raw savings.
  why: >-
    As metered agent billing pushes per-developer costs up, the practical economics of cheap-API
    and self-hosted harnesses are now a real procurement decision for individual engineers
    and small teams.
  sources:
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48518969
- title: Arch Linux AUR supply-chain incident now considered under control
  section: Security
  category: Security
  blurb: >-
    Arch AUR supply-chain attack modified over 1,500 packages' PKGBUILD files to fetch malware
    with infostealer and eBPF rootkit capability.
  summary: >-
    The Arch User Repository supply-chain attack, in which attackers adopted orphaned packages
    and modified each `PKGBUILD` to fetch malicious npm packages (reported as `atomic-lockfile`
    and `js-digest`) delivering a Linux infostealer plus an optional eBPF rootkit, grew to
    more than 1,500 affected packages by 2026-06-12 from more than 400 the prior day. Arch
    published an official incident notice and, by the end of 2026-06-12, maintainers believed
    all known malicious commits were removed and consider the incident under control; AUR
    account creation, package updates, and adoption were disrupted during cleanup. The official
    Arch binary repositories are unaffected.
  why: >-
    The adopt-orphaned-package model let one actor push credential-stealing build scripts
    into a large share of community packages, so any AUR helper that ran `PKGBUILD` scripts
    without review during the window could have executed the payload.
  followup: >-
    Watch for confirmed credential theft in the wild, AUR adoption-policy changes, and the
    final affected-package count.
  sources:
  - label: Arch Linux news
    url: https://archlinux.org/news/active-aur-malicious-packages-incident/
  - label: Phoronix
    url: https://www.phoronix.com/news/Arch-Linux-AUR-More-Than-1500
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48516379
- title: Honda Civic head unit accepts updates signed with public AOSP test keys
  section: Security
  category: Security
  blurb: >-
    A Honda Civic head unit verifies USB updates against the public AOSP test key, allowing
    arbitrary code installation with physical access.
  summary: >-
    A researcher (Eric McDonald) reports that the Android-based head unit in a 2021 (10th
    generation) Honda Civic verifies USB update packages against the publicly known AOSP test
    signing key left in `res/keys`, so a crafted update signed with that public key is accepted
    and executed. With physical access to the front USB port, an attacker can install arbitrary
    code in an "evil valet" scenario. The original research dates to 2023, with a status update
    on 2026-06-13.
  why: >-
    Shipping production firmware that trusts the public AOSP test key removes the signing
    boundary entirely, a recurring failure mode in embedded and automotive update chains.
  sources:
  - label: Researcher write-up
    url: https://juniperspring.org/posts/honda-evil-valet/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48523080
- title: Pyodide 314.0 lets Python packages publish WebAssembly wheels to PyPI
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Pyodide 314.0 and PEP 783 let maintainers publish WebAssembly wheels to PyPI like native
    wheels, removing per-project custom build steps.
  summary: >-
    Pyodide 314.0, the WebAssembly build of CPython 3.14, targets the `pyemscripten_2026_0`
    platform and, with PEP 783, lets package maintainers build and publish Emscripten wheels
    to PyPI the same way they publish native wheels for Linux, macOS, and Windows. `cibuildwheel`
    v4.0 already builds for the PyEmscripten ABIs, with the 2026 ABI behind a prerelease flag
    and stable support planned for v4.1.0.
  why: >-
    Distributing browser-compatible wheels through PyPI removes the per-project custom build
    step that has blocked packages with C, C++, or Rust extensions from running under Pyodide
    in the browser.
  followup: >-
    Track cibuildwheel v4.1.0 stable PyEmscripten support and adoption by major extension
    packages.
  sources:
  - label: Pyodide 314.0 release
    url: https://blog.pyodide.org/posts/314-release/
  - label: Building Emscripten wheels (PEP 783)
    url: https://pydantic.dev/articles/emscripten-wheels-pydantic
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48462759
- title: Every Frame Perfect
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Nikita Prokopov's post covers rendering smooth UI animation by managing frame pacing between
    display refresh and render timing.
  summary: >-
    Nikita Prokopov's post (637 points) walks through what it takes to render UI animation
    without dropped or uneven frames, covering vsync, frame pacing, the gap between display
    refresh and render timing, and where common toolkits introduce jitter. The piece pairs
    measured timing with concrete reproduction cases.
  why: >-
    Frame pacing is a recurring source of perceived UI sluggishness, and the post gives a
    measurement-first framework for diagnosing it rather than guessing.
  sources:
  - label: tonsky.me
    url: https://tonsky.me/blog/every-frame-perfect/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48516251
