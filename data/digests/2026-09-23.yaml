  section: Apple platforms
  category: Apple
  blurb: >-
    David Bushell reports macOS 27 drops the Apple Intelligence off switch that macOS 15 documented
    as an opt-out.
  summary: >-
    David Bushell reports that the setting disabling Apple Intelligence is absent in macOS
