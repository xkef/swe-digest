date: '2026-09-23'
stories:
- title: Meta Muse zero-day let any local process hijack the agent's account token
  section: Top stories
  category: Security
  blurb: >-
    A macOS zero-day in Meta's Muse assistant let any local process steal the account token
    of an agent holding email and payment authority.
  summary: >-
    Patrick Wardle of the Objective-See Foundation found that any local app or code can change
    an undocumented Muse setting controlling the transcription endpoint, so pointing it at
    an attacker-run server hands over the account token. Muse holds WhatsApp, email, calendar,
    and purchase authority, and the reported delivery path is a ClickFix-style single command
    run by the user. Ars Technica reported that more than 12 hours after publication Meta
    said it had released a hotfix, and that Amazon began blocking Muse from its site and asked
    Meta to remove Amazon from the experience. Ars gives no affected or fixed Muse version
    numbers.
  why: >-
    A single ClickFix-style command could take over an agent holding WhatsApp, email, calendar,
    and purchase authority on macOS.
  followup: >-
    Track whether Meta narrows the account token scope for Muse and whether it explains routing
    transcription through the cloud.
  sources:
  - label: report
    url: https://arstechnica.com/security/2026/09/muse-metas-extraordinarily-privileged-ai-assistant-has-a-serious-0-day/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49802030
- title: JetBrains launches Air, a multi-vendor system for agentic development
  section: Top stories
  category: Agentic coding
  blurb: >-
    JetBrains launched Air, moving agent policy, audit, and cost control out of the IDE across
    multiple vendors.
  summary: >-
    JetBrains announced Air on 2026-09-22 as a system for agentic development that is not
    tied to a single model vendor, with policy, audit, and cost control outside the IDE and
    third-party agents connecting through the Agent Client Protocol registry. Air Governance
    is the renamed JetBrains Central, which shipped about six months earlier. JetBrains states
    that Air includes products available today alongside others that will be introduced as
    the system develops.
  why: >-
    JetBrains moves policy, audit, and cost control outside the IDE and routes third-party
    agents through the Agent Client Protocol registry.
  sources:
  - label: primary
    url: https://blog.jetbrains.com/blog/2026/09/22/introducing-jetbrains-air/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49799287
- title: GPT-6 Astra breaks a German Army Enigma message unsolved since 2005
  section: Top stories
  category: AI
  blurb: >-
    GPT-6 Astra wrote its own Enigma simulator and Bombe, then recovered the key to a message
    unsolved since 2005.
  summary: >-
    CryptoCellar documents GPT-6 Astra recovering the key to a German Army Enigma message
    open since 2005, after Carter Leffer directed the model to the unbroken message set and
    submitted the break for validation. The model wrote its own Enigma simulator and Bombe
    implementation in Python and C++. The archive's maintainer validated the recovered key
    and writes that he is still analysing the GPT-6 Astra logs to establish how the break
    was executed.
  why: >-
    A validated key recovery gives a capability datapoint outside any benchmark, though it
    rests on one first-person page and one directed session.
  followup: >-
    Track the maintainer's analysis of the GPT-6 Astra logs for how the break was executed.
  sources:
  - label: primary
    url: https://www.cryptocellar.org/bgac/the-mvueh-break.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49801324
