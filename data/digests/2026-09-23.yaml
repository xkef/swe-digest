- title: Trail of Bits calls SAML a fractal of bad design and argues for OIDC only
  section: Security
  category: Security
  blurb: >-
    Trail of Bits calls SAML a fractal of bad design and gives service providers a concrete
    path to OIDC only.
  summary: >-
    Trail of Bits published an argument that service providers should drop SAML in favor of
    OIDC. The post traces XML signature wrapping and canonicalization bugs from 2012 through
    2025. It sets out a migration path for service providers.
  why: >-
    A team that owns a service provider integration now has a vendor-published argument to
    cite when it proposes retiring SAML support.
  sources:
  - label: primary
    url: https://blog.trailofbits.com/2026/09/21/saml-a-fractal-of-bad-design/
  - label: discussion
