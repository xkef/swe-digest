- title: Parody post builds a Jev-style decision model in 25 lines of Python
  section: Hacker News
  category: Engineering post
  blurb: >-
    A parody post scores a fixed option set by reading choice-token logits from a local Qwen3-0.6B
    in 25 lines of Python.
  summary: >-
    The code tokenizes each choice label, reads the logits for those token ids at the final
    position, and normalizes across them to get probabilities over a fixed option set. It
    runs against a local Qwen3-0.6B GGUF through llama-cpp-python. The author labels the post
    a parody and links OpenJev implementations for a complete version.
  why: >-
    The runnable core shows how to constrain a local model to a fixed option set by normalizing
    over choice-token logits.
  sources:
  - label: primary
    url: https://www.nobodywho.ai/posts/jev-in-25-lines/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49812769
