- title: CliffCompaction cuts long-horizon coding agent cost by up to 50%
  section: ML research
  category: Paper
  blurb: >-
    CliffCompaction cuts long-horizon coding agent cost by up to 50% by truncating context
    rather than rewriting it.
  summary: >-
    The CliffCompaction preprint reports up to 50% cost reduction on long-horizon coding agent
    runs. The method only truncates or drops context and never rewrites it. The authors ship
    a scaffold-agnostic API proxy usable with Claude Code and Codex.
  why: >-
    A team already paying for long agent runs could test the saving without changing its scaffold,
    if the figure survives an outside harness.
  followup: >-
    Watch for independent reproduction of the 50% figure outside the authors' own harness.
  sources:
  - label: paper
    url: https://arxiv.org/abs/2609.26779
- title: Claude Code loads AGENTS.md only behind a remote feature flag
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Claude Code loads AGENTS.md only when a remote flag is on, so telemetry-off and gateway
    setups silently skip project instructions.
  summary: >-
    The post reports that Claude Code, which added AGENTS.md support in 2.1.277, reads the
    file from the working directory only when a remote feature gate is reachable and enabled,
    measured with canary words and a string search of the 2.1.280 bundle. The post collects
    and extends issue #95690, which names the Statsig gate `tengu_agents_md_mod`, so the two
    sources share one provenance chain rather than corroborating each other. Setting CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
    or DISABLE_TELEMETRY=1 skips the file with no warning, and the post attributes the same
    behavior on third-party gateways, Bedrock, and Vertex to the issue. The issue is open
    and labelled enhancement, and the author labels the post ai-assisted.
  why: >-
    A telemetry-off install can run with no project instructions and no notice that a file
    was skipped, and a CLAUDE.md holding `@AGENTS.md` restores the read.
  followup: >-
    Track whether Anthropic responds on issue #95690 or makes the AGENTS.md read independent
    of the gate.
  sources:
  - label: primary
    url: https://blog.szypowi.cz/p/claude-code-reads-agents.md-only-when-telemetry-is-on/
  - label: issue
    url: https://github.com/anthropics/claude-code/issues/95690
  - label: discussion
    url: https://news.ycombinator.com/item?id=49814947
- title: Next.js ships an out-of-band fix for critical RCE in next/og ImageResponse
  section: Security
  category: Security
  blurb: >-
    Vercel shipped Next.js 16.3.6 out of band for a critical RCE path in next/og ImageResponse
    on the Node.js runtime.
  summary: >-
    Vercel published an out-of-band update on 2026-09-22 releasing Next.js 16.3.6 on Active
    LTS and 15.5.26 on Maintenance LTS. GHSA-vcvr-r3jv-pc5j, assigned CVE-2026-94545, is rated
    critical, because improper escaping in the SVG output generated by Satori, tracked upstream
    as GHSA-wx4j-mvgx-mqwp, can reach remote code execution through vulnerabilities in other
    upstream dependencies, and the fix is a dependency upgrade rather than a change in Next.js
    itself. Affected versions are 16.2.0 up to but excluding 16.3.6, applications using the
    Edge ImageResponse implementation are not affected, and 15.x is not affected by the RCE,
    so 15.5.26 is hardening only.
  why: >-
    The action is narrow and mechanical, since only an app calling ImageResponse from next/og
    on the Node.js runtime in that version range needs the patch.
  sources:
  - label: primary
    url: https://nextjs.org/blog/nextjs-security-update-september-22-2026
  - label: advisory
    url: https://github.com/vercel/next.js/security/advisories/GHSA-vcvr-r3jv-pc5j
  - label: discussion
    url: https://news.ycombinator.com/item?id=49813996
