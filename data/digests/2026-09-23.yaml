- title: Can gzip be a language model?
  section: Hacker News
  category: Engineering post
  blurb: >-
    A beam search over DEFLATE compressed length turns gzip into a working language model
    in one Python file.
  summary: >-
    The post builds a language model that scores candidate continuations by DEFLATE compressed
    length and runs a beam search over them. The implementation is a single file using only
    the Python standard library.
  why: >-
    The compression and prediction equivalence becomes something an engineer can run and step
    through in an afternoon rather than read about.
  sources:
  - label: primary
    url: https://nathan.rs/posts/gzip-lm/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49797323
