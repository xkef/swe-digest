- title: >-
    Cursor's Vicent Marti explains why distributed filesystems and object-level Git stores
    both failed, and what limits GitHub's Spokes replication today
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Marti traces distributed filesystems and object-level Git stores both failing to constraints
    on packfile reads and clone performance.
  summary: >-
    The post walks the storage designs Git hosting has used and ties each discarded one to
    a specific constraint. Reads inside a packfile are random walks over the object graph
    rather than sequential streams, which is what defeats putting repositories on a distributed
    filesystem. The object-level design, Shawn Pearce's JGit DHT work at Google, was discarded
    for a different reason, because the Git protocol requires packfiles to be sent over the
    network regardless of how the server stores the data, which made clone performance bad
    enough to abandon the design. Eventual consistency appears later in the post as a constraint
    on replication rather than on object storage, as the reason GitHub's Spokes keeps all
    replicas synchronously consistent. The post then gives the limits of Spokes and names
    Cursor's replacement, Continuity, which this run could not read because the fetch truncated
    at the start of that section.
  why: >-
    Each design is ruled out by a different property, packfile reads as random walks for the
    distributed filesystem and packfiles on the wire for the object store, so a reader can
    tell which constraint their own storage choice runs into.
  followup: Read the Continuity section when the page can be fetched in full.
  sources:
  - label: Cursor blog post
    url: https://cursor.com/blog/git-at-any-scale
  - label: HN discussion
