- title: >-
    DiffusionGemma fine-tunes a Gemma 4 mixture-of-experts model into a discrete diffusion
    model reporting roughly 1,500 output tokens per second on one H100
  section: ML research
  category: Paper
  status: confirmed
  blurb: >-
    DiffusionGemma fine-tuned a Gemma 4 model into a discrete diffusion decoder retaining
    autoregressive generation at 1,500 tokens per second.
  summary: >-
    The paper was submitted to arXiv on 2026-07-31, three weeks before this digest. It states
    that a diffusion decoder can be obtained by fine-tuning an existing autoregressive model
    rather than training one, using under 10 percent of the starting model's training token
    budget, and that the result keeps thinking mode, multimodal inputs and long contexts.
    It refines blocks of 256 tokens in parallel and reports around 20 tokens per forward pass
    and roughly 1,500 output tokens per second on a single H100. The paper also states the
    model still generates autoregressively with minor degradation. Every figure is from the
    abstract and no independent reproduction was located.
  why: >-
    Retaining autoregressive generation after the fine-tune is what would make a hybrid decoder
    possible on one set of weights.
  sources:
  - label: arXiv abstract
    url: https://arxiv.org/abs/2608.00146
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49374287
- title: >-
    Codex CLI cannot set Bedrock explicit prompt-cache controls, and a reported production
    workload spent 85 percent of its model cost on cache writes
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    The Codex CLI exposes no way to set Bedrock prompt-cache controls, so one production workload
    spent 85 percent of costs writing cache.
  summary: >-
    The issue is an open enhancement request rather than a defect report. It states that the
    Codex CLI exposes no way to place explicit prompt-cache control points when it runs against
    Amazon Bedrock, so the stable prefix of a conversation is written to the cache on each
    turn instead of being read from it, and the reporter puts cache-write tokens at about
    85 percent of one production workload's model cost. That figure is the reporter's AWS
    Cost Explorer estimate rather than an invoice, the issue text states that not every cache
    write is a defect, and the Hacker News title's claim of a bug causing 10x charges appears
    nowhere in the issue.
  why: >-
    An agent that rewrites its whole stable prefix on every turn pays full price for a prompt
    cache it never reads, and no client-side setting can turn it off.
  followup: Track whether explicit cache-control support lands in the Codex CLI for Bedrock.
  sources:
  - label: Codex issue 37674
    url: https://github.com/openai/codex/issues/37674
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49383326
- title: >-
    A fake recruiter's TypeScript coding challenge loads a second stage from jsonbin.io and
    pulls four modules from its command-and-control host
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A fake recruiter take-home loads a second stage from jsonbin.io and pulls a RAT, stealer,
    and clipboard monitor from the C2 host.
  summary: >-
    The delivery is a normal-looking 180-file TypeScript take-home, and a single function
    fetches an obfuscated payload and hands it `require`, so running `npm run dev` is enough.
    The write-up separates three delivery hops, the take-home itself, a loader hosted on jsonbin.io,
    and a command-and-control host, from the four modules pulled off that host: `scdata`,
    an interactive RAT with a full shell, SSH pivoting and PEM key theft, screen capture and
    synthetic input, `ldata`, a stealer covering Chrome, Edge, Brave and the macOS login.keychain
    plus 28 wallet extensions, a file grabber walking `.ssh`, `.aws`, `.gnupg` and `.docker`,
    and a clipboard monitor that polls the clipboard and beacons its contents out while writing
    under the log name `npm-compiler.log`. The author reports that Claude Code, prompted to
    scan the codebase for unusual patterns, detected nothing, and rates AI scanning weak protection
    because it can flag the jsonbin.io call but cannot see the payload that call returns.
    None of it needs elevation, because everything it wants is already user-owned. No product
    vulnerability is involved, so no affected versions apply.
  why: >-
    Running a candidate take-home in the ordinary way hands over SSH keys, cloud credentials,
    and browser sessions without any privilege escalation step to detect.
  sources:
  - label: codedge.de write-up
    url: https://www.codedge.de/posts/how-to-compromise-your-system-with-a-job-interview
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49376332
- title: >-
    Mailpit reintroduced the cross-site WebSocket hijack it patched in January, because the
    origin gate reads the raw URI while the router reads the decoded path
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Mailpit reintroduced a WebSocket hijack in 1.29.0 when the origin check read raw URIs
    while the router dispatched decoded paths.
  summary: >-
    The advisory publishes the affected range as Mailpit 1.29.0 through 1.30.5, patched in
    1.30.6. The origin check is applied against the raw request URI while the router dispatches
    on the decoded path, so a percent-encoded path reaches the WebSocket endpoint without
    the origin check matching it, and a page on any other origin can open the socket in the
    visitor's browser and receive messages as they arrive. The advisory tracks this as CVE-2026-67448
    and records it as a regression of CVE-2026-22689, fixed in commit 6f1f4f3 on 2026-01-10
    and shipped in 1.28.2, then reintroduced in commit a63bcd9 on 2026-01-31 and first released
    in 1.29.0. The attack requires Mailpit running in its default configuration, because the
    advisory states that with `--ui-auth-file` set the percent-encoded path returns 401 rather
    than a 101 upgrade.
  why: >-
    Mailpit holds exactly the mail a developer machine is not supposed to send, including
    password reset tokens, and on an affected version run without `--ui-auth-file` any page
    the developer visits can read it live.
  sources:
  - label: GitHub advisory GHSA-8r62-w5wh-fc5m
    url: https://github.com/advisories/GHSA-8r62-w5wh-fc5m
  - label: Mailpit 1.30.6 release
    url: https://github.com/axllent/mailpit/releases/tag/v1.30.6
