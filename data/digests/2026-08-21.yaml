date: '2026-08-21'
stories:
- title: >-
    GitHub's CTO says the 7 hour 47 minute August 17 outage was a capacity failure, and reports
    Azure now serves 58 percent of platform load
  section: Top stories
  category: Outage
  status: confirmed
  blurb: >-
    GitHub's CTO attributed the August 17 outage to capacity failure and disclosed that Azure
    now serves 58 percent of platform load.
  summary: >-
    The company blog post states that neither August incident came from a code or configuration
    change and that both were capacity failures, and it puts numbers on the migration underneath.
    Azure serves roughly 58 percent of platform load and half of all Git operations, up from
    12 percent of platform load in May, and monthly commits grew from 1.4 billion to 2.9 billion
    since April. GitHub's own root cause analysis on its status page names a narrower immediate
    cause, network saturation on Central US load balancers caused by an Istio sidecar pod
    reaching its concurrency limits and failing to auto scale correctly because of a misconfigured
    policy that watched host service limits but not sidecar limits. That analysis carries
    operational figures the blog post omits: peak error rates near 20 percent for web and
    API and near 50 percent for archive and raw content, four HAProxy nodes exhausting their
    flow limits, a latent retry bug in VS Code amplifying traffic roughly 10x, Copilot Token
    Service traffic rising from a normal 7,000 to 9,000 requests per second to 70,000 to 100,000,
    and scraping against codeload endpoints impeding recovery. A misconfigured autoscaling
    policy sits uneasily against the blog post's statement that no configuration change was
    involved. The named remediations are consistent retry limits, retry budgets and variable
    timeouts across service-to-service calls to stop retry storms, and a review of lower-priority
    CPU and memory alerts for components that fail under sudden spikes.
  why: >-
    The remediations are ones any service owner can apply without GitHub's scale, and the
    disclosed migration numbers change how much of the platform a single cloud now carries.
  followup: >-
    The promised root cause analysis is published, so the open question narrows to whether
    the retry budget and variable timeout work is reported as landed.
  sources:
  - label: GitHub blog post
    url: https://github.blog/news-insights/company-news/the-august-17-outage-and-the-work-ahead/
  - label: GitHub status incident analysis
    url: https://www.githubstatus.com/incidents/zkxwbgr0cnmx
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49378957
- title: >-
    Bun 1.4 ships the Rust rewrite, adds 1,517 Node.js test-suite passes, and cuts HTTP server
    memory by 13 to 48 percent
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Bun 1.4 shipped the Rust rewrite with mimalloc replacing libpas, native streams, and HTTP
    server memory cuts of 13 to 48 percent.
  summary: >-
    The Zig to Rust port tracked since 2026-07-09 is now in a stable release rather than a
    canary, which closes the open question of whether it would ship. The reported changes
    are upgrade-visible: JavaScriptCore moves off libpas to mimalloc, ReadableStream, WritableStream
    and TransformStream become native and pass the Web Platform Tests, Linux startup halves
    to 5.1 ms, HTTP server memory falls by 13 to 48 percent, and Bun reports p99 CPU for Claude
    Code dropping from 24 percent to 10 percent. Every figure is Bun's own and no independent
    reproduction was located. The release is not performance work alone, because it also adds
    API surface, `Bun.WebView`, `Bun.Image`, `Bun.markdown`, `Bun.cron` and `Bun.Terminal`,
    parallel modes for `bun run` and `bun test`, `bun audit fix`, Windows ARM64 support and
    an opt-in global virtual store, and reports over 2,900 issues fixed.
  why: >-
    A stable tag moves the rewritten runtime, a different allocator, and native stream implementations
    onto every machine that upgrades.
  followup: Track an independent reproduction of the memory, startup, and p99 CPU figures.
  sources:
  - label: Bun 1.4 release post
    url: https://bun.com/blog/bun-v1.4
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49374797
- title: >-
    Linux 7.2 released with cache-aware scheduling and sched_ext sub-schedulers, and the DRM
    fair scheduler held back to opt-in after a late regression
  section: Top stories
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Linux 7.2 released with cache-aware scheduling and sched_ext, while the DRM fair scheduler
    stayed experimental after a late regression.
  summary: >-
    Linux 7.2 is the mainline release distributions will pick up. The scheduling work is the
    substance: cache-aware scheduling, MGLRU improvements, sub-schedulers for sched_ext, and
    automatic creation of multi-size transparent hugepages. The DRM scheduler fair policy
    is the exception, because a regression reported during 7.2-rc7 kept the old first-in first-out
    policy as the default and left fair marked experimental. The cited source is a contributor
    account rather than the release announcement.
  why: >-
    The GPU-sharing improvement is present but off unless a user opts in, so a reader expecting
    fair DRM scheduling on 7.2 gets the old policy by default.
  followup: >-
    Track whether the DRM scheduler fair policy becomes the default in a later release and
    whether the 7.2-rc7 regression is resolved.
  sources:
  - label: Igalia release summary
    url: https://www.igalia.com/2026/08/19/Linux-72-Released.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49376265
- title: >-
    DeepSeek releases V4-Flash-Vision-Exp, an experimental vision model, with an upper bound
    of 384 tokens per image
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    DeepSeek released V4-Flash-Vision-Exp with a hard ceiling of 384 tokens per image regardless
    of resolution, making cost predictable.
  summary: >-
    The change log dates the release to 2026-08-21, the model carries an `exp` suffix, and
    images are accepted only in user messages and only by this model, through the OpenAI-compatible
    endpoint, the Anthropic-compatible `/messages` endpoint, and the Responses API. Every
    image is resized to roughly the pixel count of an 800 by 800 image before inference, which
    puts a hard ceiling of 384 tokens per image, so a 2000 by 2000 and a 5000 by 5000 image
    cost the same, against published limits of 600 images per request, a 48 MiB request body,
    32 MiB per image inline or by URL versus 64 MiB through the Files API, and a maximum of
    8192 px per side that drops to 4096 px once a request carries 15 or more images. Every
    benchmark figure is DeepSeek's own, including Terminal Bench 2.1 at 83.9 and ZeroBench
    Pass@5 at 35.0 published with a stated method for the code-agent text tasks, and DeepSeek's
    statement that the model's multimodal agent capability comes close to Opus-4.8 is a vendor
    comparison with no independent reproduction located.
  why: >-
    A fixed 384-token ceiling per image makes image cost predictable and independent of resolution,
    so sending a larger image buys no additional detail at inference.
  sources:
  - label: DeepSeek vision guide
    url: https://api-docs.deepseek.com/guides/vision/
  - label: DeepSeek API change log
    url: https://api-docs.deepseek.com/updates
