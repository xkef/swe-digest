- title: >-
    php-fpm IPv6 allow list matched only 96 of 128 bits for eleven years (CVE-2026-91768)
  section: Security
  category: Security
  blurb: >-
    A memcmp that compared 12 of 16 bytes let php-fpm admit any IPv6 client in the same /96
    as an allowed address, including all of ::/96 for ::1.
  summary: >-
    The fix author explains that fcgi_is_allowed compared 12 bytes of IPv6 addresses since
    PHP 5.5.20, so listen.allowed_clients behaved as a /96 prefix match. An entry of ::ffff:127.0.0.1
    admitted every IPv4 client on a dual-stack listener. Fixed versions are 8.2.34, 8.3.35,
    8.4.26 and 8.5.11, and PHP 8.1 and older get no patch.
  why: >-
    Pools that rely on listen.allowed_clients over IPv6 need a patched PHP, and any range
    access must move to a firewall or proxy.
  sources:
  - label: primary
    url: https://daubois.dev/blog/cve-2026-91768-php-fpm-ipv6-allowed-clients-bypass/
  - label: discussion
    url: https://www.reddit.com/r/netsec/comments/1x3xa8g/cve202691768_fastcgi_allowed_clients_compared/
- title: >-
    GitHub degraded Actions, Issues and Pull Requests with a long notification backlog
  section: Outages
  category: Outage
  blurb: >-
    GitHub degraded Actions, Issues and Pull Requests for over two hours on 2026-10-12, with
    notifications backlogged longer.
  summary: >-
    GitHub began investigating degraded performance at 12:21 UTC on 2026-10-12, with stated
    impact on loading the Actions tab, interacting with the Checks API, queueing new Actions
    runs, creating and updating issues, and requesting pull request reviews, including through
    the REST and GraphQL APIs. Pull Requests returned to normal at 13:02 UTC, an initial mitigation
    at 13:38 UTC was reported as not fully successful, and Issues and Actions were mitigated
    at 14:35 and 14:36 UTC. Notifications were the long tail, resuming at 15:19 UTC but still
    working through a backlog, with the 19:28 UTC update giving one more hour of delay, and
    no root cause has been published.
  why: >-
    Teams that gate merges on Actions or hand off review through notifications should expect
    gaps inside that window rather than assume missing runs and alerts were never triggered.
  followup: >-
    Whether GitHub publishes a root cause and when the notification backlog finally cleared.
  sources:
  - label: primary
    url: https://www.githubstatus.com/incidents/93njd414rpbx
  - label: discussion
    url: https://news.ycombinator.com/item?id=50055375
- title: >-
    Anthropic finds small open models near the capability to self-replicate across IoT devices
  section: AI
  category: AI
  blurb: >-
    Anthropic red-teamers show small open models setting up inference on unfamiliar devices,
    with GLM-5.2 completing replication in a test fleet.
  summary: >-
    Anthropic's Frontier Red Team ran Gemma4-26B-A4B across 15 Android TV boxes at 0.39 tokens
    per second, and a 9B model got inference running on 8 of 9 hardware types. In a simplified
    8-node redroid fleet with an unauthenticated ADB port, only GLM-5.2 completed end-to-end
    replication, spreading to all nodes in 4 of 5 trials. A trend fit on small open models
    puts one at that capability level by the end of 2026.
  why: >-
    Unpatched IoT and edge devices become plausible hosts for AI worms, which raises the cost
    of leaving ADB and default credentials exposed.
  comments: >-
    HN commenters questioned whether the simplified exploit step makes the result an upper
    bound, a caveat the post itself states.
  sources:
