- title: >-
    HN debates whether human review, not model capability, is now the binding constraint
  section: Hacker News
  category: Pulse
  status: discussion
  blurb: >-
    A 940-comment HN thread on a Karpathy post argues human code review, not model capability,
    now limits shipping.
  summary: >-
    The thread responds to a post on Andrej Karpathy's own account arguing that the gap in
    shared understanding of LLM capability is widening. It drew 647 points and about 940 comments,
    the largest comment count on Hacker News for this date. It centers on review throughput
    and names no specific model, product, or API surface, which is why it is carried as pulse
    rather than as an AI item.
  why: >-
    If review is the binding constraint, the next throughput gain for a team comes from changing
    how changes get reviewed rather than from upgrading a model.
  comments: >-
    Commenters report that code review at their own employers has become a formality, and
    argue from that experience that review throughput rather than model capability now sets
    the limit.
  sources:
  - label: primary
    url: https://twitter.com/karpathy/status/2109361546505966046
  - label: discussion
    url: https://news.ycombinator.com/item?id=50047422
- title: >-
    Passkey criticism draws technical dissent over whether password managers restore user
    control
  section: Hacker News
  category: Security
  status: discussion
  blurb: >-
    HN splits on passkeys, with commenters arguing KeePassXC and Bitwarden keep user control
    over the credentials.
  summary: >-
    The thread splits over whether passkeys remove user control or whether holding them in
    a third-party password manager restores it.
  why: >-
    Choosing passkeys as a second factor now requires checking per-site support for third-party
    managers first, because that support is what decides whether the credential stays portable.
  comments: >-
    Commenters argue that passkeys stored in KeePassXC or Bitwarden keep the credential under
    user control, while conceding that site support for third-party managers is uneven.
  sources:
  - label: discussion
    url: https://news.ycombinator.com/item?id=50048312
