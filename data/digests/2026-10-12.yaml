- title: Zod 4.6.6 published to npm with a malicious preinstall script
  section: Top stories
  category: Security
  blurb: >-
    A malicious `preinstall` script shipped in zod 4.6.6 and @zod/mini 4.6.6, running on plain
    npm install without import.
  summary: >-
    A commit attributed to the maintainer account added a file named `meta.test.mjs` to both
    the `zod` and `@zod/mini` packages at version 4.6.6 and wired it to a `preinstall` hook,
    so it runs on plain `npm install` without the package being imported. The script reads
    an Ethereum contract through three public RPC endpoints, decodes a list of domains from
    the return value, fetches a `/loader` endpoint on each, writes a base64 payload to a temporary
    directory, and imports a second base64 stage as a `data:` URL, so the operator can repoint
    command and control through a chain write rather than through the package. The same commit
    changed the release workflow from maintainer-triggered dispatch to publishing on any version
    bump pushed to main, and the 4.6.6 publish carries an npm provenance attestation naming
    the GitHub Actions trusted publisher with approver colinhacks, which is the observable
    trace of that workflow change rather than a safety signal. The registry dates the 4.6.6
    publish to 2026-10-11, and the version still resolves with full dist metadata and no deprecation
    marker, so it remains installable even though npm now lists 4.6.7 as the `latest` dist-tag.
  why: >-
    zod is among the most depended on packages in the JavaScript ecosystem, so any install
    or CI run that resolved 4.6.6 should be treated as having executed untrusted code, with
    no import of the package required.
  followup: >-
    Whether the commit is confirmed as an account compromise rather than maintainer action,
    which the diff alone cannot distinguish.
  sources:
  - label: primary
    url: https://github.com/colinhacks/zod/commit/d821685ea6732436fcdf786a81d076958471e467
  - label: registry
    url: https://registry.npmjs.org/zod
  - label: discussion
    url: https://news.ycombinator.com/item?id=50052814
- title: >-
    Cyberattack on Danfoss refrigeration software heats fridges in hundreds of French supermarkets
  section: Top stories
  category: Security
  blurb: >-
    Attackers took over Danfoss refrigeration management software and ordered fridges in hundreds
    of French supermarkets to heat.
  summary: >-
    The BBC reports that attackers gained control of software from the Danish engineering
    firm Danfoss that retailers use to manage refrigeration units remotely, and ordered units
    to heat up and stay hot overnight rather than run the normal short defrost cycle. Intermarche
    reported its fridges held 50C for six hours, and figures from individual chains point
    to roughly 400 of about 15,000 French stores, including more than 100 at Cooperative U,
    180 across Intermarche and Netto with another 100 urgently disconnected from the internet,
    80 of Carrefour's 6,000, and 5 percent of Monoprix's 400 plus, with two Alsace stores
    alone reporting 270,000 euros of losses. Danfoss said the affected units were older models
    whose security software could not be updated against a risk the firm had already identified,
    and the Paris prosecutor opened a cyber-crime investigation. No affected product names,
    firmware builds, or software versions have been published, so the scope is stated only
    as older models.
  why: >-
    Remote management software for physical plant was abused at fleet scale, and the vendor's
    own account points at an installed base that cannot be patched, which is an industry pattern
    rather than one vendor's incident.
  followup: >-
    Whether Danfoss or French authorities publish the initial access vector, and the final
    count of affected stores.
  thread: f-0041
  sources:
