- title: QGIS merges a policy prohibiting AI contributions
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    QGIS merged an enhancement proposal prohibiting AI contributions, citing maintainer review
    capacity rather than code quality.
  summary: >-
    The enhancement proposal was merged on 2026-10-07 after passing discussion on 2026-10-05
    and moving to a vote, replacing an earlier human-in-the-loop policy with a strict not-allowed
    stance. Maintainers gave review capacity as the reason rather than code quality in the
    abstract, writing that AI-assisted submission volume exceeds what human review can absorb,
    and the proposal author said the project has already lost at least one high-value contributor.
    A reviewer noted the previous policy failed in practice, with roughly 50 pull requests
    tagged AI Assisted and about 40 of those closed unmerged, and the author framed the ban
    as a closed door to be opened selectively later rather than a permanent position.
  why: >-
    Projects writing their own contribution policy now have a merged precedent from a large
    established codebase that bans AI contributions on maintainer capacity grounds.
  followup: >-
    Whether QGIS narrows the wording, which contributors in the thread said does not separate
    agent-written code from LLM-backed autocomplete, review assistance, or translation.
  sources:
  - label: primary
    url: https://github.com/qgis/QGIS-Enhancement-Proposals/pull/387
  - label: discussion
    url: https://news.ycombinator.com/item?id=50054751
- title: Codex CLI starts a persistent self-updating background daemon by default
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Codex CLI 0.157.0 starts a 374 MB self-updating background daemon that survives closing
    every Codex window.
  summary: >-
    The issue was opened on 2026-09-25 against CLI 0.157.0, it is open, and it is reproduced
    on Linux, WSL2 and Windows, with `codex features disable daemon_auto_start` given as the
    reporter's workaround. Whether the behaviour is still the default on the current release
    line is unverified here, because the thread references later releases up to 0.160.1 without
    restating the default. Since CLI 0.157.0, opening an interactive `codex` session starts
    `codex app-server --managed-daemon` in its own session with no TTY, reparented to PID
    1, and it survives closing every Codex window until an explicit `daemon stop` or a reboot.
    The CLI copies about 374 MB of platform package, including bundled `bwrap`, `zsh` and
    `rg`, into `~/.codex/packages/app-server-daemon/releases/` and runs the daemon from that
    copy, then a detached `pid-update-loop` process checks for updates five minutes after
    start and hourly after that, downloading releases and restarting the backend. The daemon
    also pins the environment of whichever session started it, so a per-invocation `HTTPS_PROXY`
    setting leaks into later sessions, and `daemon stop` leaves the updater running.
  why: >-
    The serving backend's version decouples from the binary the package manager installed,
    so a machine's effective Codex version is set by a background updater rather than by the
    fleet's package policy.
  followup: >-
    Whether the default changes and whether `daemon stop` also stops the update loop.
  sources:
  - label: primary
    url: https://github.com/openai/codex/issues/48195
  - label: discussion
    url: https://news.ycombinator.com/item?id=50060694
- title: Python 3.10 reaches end of life as Python 3.15 becomes the newest release
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Python 3.10 reached end of life on 2026-10-12 after 3.15.0 shipped with lazy imports,
    a sampling profiler and frame pointers on by default.
  summary: >-
    Pablo Galindo tagged the Python 3.10 end of life release on 2026-10-12. Python 3.15.0,
    released 2026-10-09, adds explicit lazy imports (PEP 810), the Tachyon sampling profiler
    under profiling.sampling, UTF-8 as default encoding, frame pointers by default, and a
    stable ABI for free-threaded builds. The release notes warn that tkinter apps may hang
    on macOS 27.0.
  why: >-
    Projects supporting every maintained Python can drop 3.10 and adopt 3.11 features, and
    services still on 3.10 no longer get security fixes.
  sources:
