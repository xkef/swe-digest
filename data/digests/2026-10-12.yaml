- title: >-
    Postgres 19 makes LZ4 the default TOAST compression, and pglz still wins some workloads
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Postgres 19 switches default TOAST compression to LZ4, and PlanetScale measures where
    pglz still wins on size and on prefix reads.
  summary: >-
    PlanetScale shows TOAST triggers above 2,032 bytes per row and explains the 4 KB pglz
    window against the 64 KB LZ4 window. On 10,000 JSON orders pglz produced 19 MB against
    24 MB for LZ4, while LZ4 loaded faster. For 200-character previews of 1 MB values pglz
    needed 301 page lookups against 6,234 for LZ4, and EXTERNAL storage made mid-value bytea
    reads about 70 times faster than LZ4.
  why: >-
    Upgrading to Postgres 19 changes compression for new values, so tables with prefix reads
    or random-access bytea may need an explicit COMPRESSION or STORAGE setting.
  sources:
  - label: primary
    url: https://planetscale.com/blog/what-gets-toasted-in-postgres
- title: >-
    Meta moves Instagram Live ingest to Media over QUIC at parity with its in-house RUSH protocol
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Instagram Live ingest on iOS and Android now runs over Media over QUIC, with an edge translator
    feeding the existing RUSH backend unchanged.
  summary: >-
    Meta shipped the IETF draft Media over QUIC protocol for Instagram Live ingest using its
    open-source moxygen library on mvfst. MoQ connections terminate at edge endpoints that
    translate to RUSH so downstream systems did not change, and server-side routing let the
    experiment resize in minutes. Meta pinned draft versions, picks TCP or QUIC per session
    where UDP is blocked, and built MoQ-aware tracing to debug encrypted framing.
  why: >-
    It is a worked example of swapping a production transport behind a translation shim and
    of running an evolving IETF draft at scale.
  sources:
  - label: primary
    url: https://engineering.fb.com/2026/10/12/video-engineering/shipping-media-over-quic-at-meta-scale-for-instagram-live-ingest/
- title: >-
    Yandex Cloud outage and a collapse in Yandex bot traffic drive the day's largest threads
  section: Hacker News
  category: Outage
  blurb: >-
    Three HN threads on a reported Yandex Cloud outage drew about 1,350 points, with no primary
    source readable here.
  summary: >-
    Three submissions on 2026-10-11 and 2026-10-12 drew roughly 1,350 combined points and
    over 1,000 comments around a reported Yandex Cloud data center loss and a near total drop
    in traffic from AS13238. Neither underlying source could be read from this environment,
    because the Yandex Cloud status page returns a browser-detection interstitial to automated
    fetch and the Cloudflare Radar pages submitters pointed to are a client-rendered application
    whose API returned 400 and 403. The destruction and attribution claims circulating in
    the thread are unverified here, so this item is carried as discussion only and no outage
    block is published for it.
  why: >-
    The externally visible signal for a reported cloud capacity loss is a third-party crawler
    traffic series rather than any provider disclosure, which is what observers outside the
    provider have to work with.
  followup: >-
    Whether Yandex Cloud publishes an incident report, and whether the AS13238 traffic series
    recovers.
  comments: >-
    Commenters separated the traffic series into crawler traffic versus user traffic, which
    is the distinction that decides whether the drop indicates lost serving capacity or lost
    outbound crawling.
