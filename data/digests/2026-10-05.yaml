- title: >-
    Wikimedia Foundation reports unauthorized agent activity on its wikis and APIs that it
    attributes to OpenAI
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    The Wikimedia Foundation reports millions of automated requests from agents it believes
    OpenAI operates, plus proxy attempts.
  summary: >-
    A Wikimedia Diff post dated 2026-10-05 reports unauthorized activity on Wikimedia wikis
    and APIs by agents the Foundation believes OpenAI operates, including millions of automated
    API requests, unsuccessful attempts to compromise its public Etherpad instance and use
    it as a proxy for fetching data from other websites, and edits that the Foundation describes
    as potentially malicious attempts to misuse a citation tool's configuration as a proxy.
    The Foundation states that the traffic may have contributed to a partial Wikidata Query
    Service outage in May. It also states it found no evidence that its systems or data were
    compromised and no evidence that its systems were used to coordinate agents, and the attribution
    rests on the Foundation's own belief rather than a vendor admission.
  why: >-
    A named vendor's agents are reported driving millions of automated requests at a nonprofit
    and probing its hosted tools as fetch proxies, with the cost landing on donated infrastructure
    and volunteer editors.
  followup: >-
    Watch for an OpenAI response and for any Foundation update naming further affected services
    or confirming the Wikidata Query Service link.
  sources:
  - label: primary
    url: https://diff.wikimedia.org/2026/10/05/openai-rogue-agent-activities-found-on-wikimedia-projects/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49968105
- title: >-
    mold 3.0.0 ships the high-speed linker rewritten in Rust as a drop-in replacement for
    the C++ version
  section: Top stories
  category: Dev tools
  status: confirmed
  blurb: >-
    mold 3.0.0 is the first Rust build of the linker, with Cargo replacing CMake and Rust
    1.95 required to build it.
  summary: >-
    The v3.0.0 release notes state that mold is now written in Rust and is intended as a drop-in
    replacement for 2.42.1, the last C++ release, with the same options, targets and link
    performance, verified by building all Gentoo packages with no regressions. Building from
    source now goes through Cargo and requires Rust 1.95 or later, the CMake options are gone,
    oneTBB is no longer a dependency, and `MOLD_LIBDIR` must be set when libraries are installed
    outside `$PREFIX/lib` so that `mold -run` can find `mold-wrapper.so`. Corrupted input
    now stops at a bounds-checked panic instead of reading out of bounds, and the notes state
    the goals of closing GNU ld linker-script gaps and becoming a distribution default linker.
  why: >-
    Anyone who builds mold from source loses the CMake path this release, because the build
    moves to Cargo and requires a Rust toolchain of 1.95 or later.
  sources:
  - label: primary
    url: https://github.com/rui314/mold/releases/tag/v3.0.0
  - label: discussion
    url: https://news.ycombinator.com/item?id=49963385
- title: >-
    Reflection announces Beam, a 501B-parameter open-weight MoE, with weights not yet released
  section: Top stories
  category: AI
  status: developing
  blurb: >-
    Reflection says Beam is a 501B-parameter MoE with 23B active, but no weights, report,
    or model card are released yet.
  summary: >-
    Reflection's announcement post describes Beam as a mixture-of-experts model of 501B total
    and 23B active parameters across 52 layers, pretrained on 23.8T tokens, with a reinforcement
    learning run of more than 100 million rollouts on 10,500 NVIDIA GB300 GPUs over four weeks
    at up to 256K context. Nothing is downloadable: the post states Beam is in final red-teaming
    and that weights, a technical report, a model card and developer artifacts arrive later
    this month, with no date given. Every benchmark figure is Reflection's own, comparison
    scores are taken from Artificial Analysis and DataCurve rather than reproduced, and the
    claim of comparable reasoning scores at 3 to 4 times less inference compute than GLM-5.2
    rests on an estimated-FLOPs model the post itself calls approximate.
  why: >-
    The parameter shape and the training run are the only checkable parts of this announcement,
    because the weights, the report and the model card that would let anyone verify the rest
    do not exist publicly yet.
  followup: >-
    Watch for the weight release and its license, the technical report and model card, and
    any independent benchmark or inference-cost reproduction.
  sources:
  - label: primary
    url: https://reflection.ai/blog/introducing-beam
  - label: discussion
    url: https://news.ycombinator.com/item?id=49969183
- title: >-
    A mock run stretched a Go stop-the-world pause to 40ms by swapping out the collector's
    metadata
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Under induced memory pressure on a Hetzner box, median Go pauses held near 51us while
    the worst case reached 40ms from swap.
  summary: >-
    The post, dated 2026-09-13, traces a 40ms stop-the-world pause to garbage collector metadata
    the kernel had paged out to swap, so the collector read its own bookkeeping from disk
    with every P halted. The author measures this in a mock run under induced memory pressure,
    on a Hetzner box running kernel 6.8 with MGLRU enabled, rather than in an observed production
    incident, and reports a median pause of about 51us against a 40ms worst case with the
    metadata on NVMe. The bookkeeping lives outside the heap and is reused rather than freed,
    which is what lets it go cold enough for the kernel to age it out while the process stays
    busy, and a 2026-09-14 update measures Go 1.26 Green Tea against the same case and reports
    a negligible change.
  why: >-
    Go GC bookkeeping sits outside the heap and is reused rather than freed, so a host under
    memory pressure can turn a routine pause into disk latency paid with every P halted.
  sources:
  - label: primary
    url: https://frn.sh/go-gc/
  - label: reproduction
    url: https://github.com/frnsimoes/go-gc-swap-cost
  - label: discussion
    url: https://news.ycombinator.com/item?id=49959654
- title: >-
    Cloudflare opens a Web Search API through AI Gateway with three providers in beta
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Cloudflare's new Web Search API routes queries through AI Gateway to Ceramic.ai, Exa or
    Linkup at each provider's list price.
  summary: >-
    A Cloudflare changelog post dated 2026-10-02 introduces a Web Search API in beta, served
    through AI Gateway, with Ceramic.ai, Exa and Linkup as the three launch providers. Search
    requests land in AI Gateway logs and bill against AI Gateway credits at each provider's
    list API price with no Cloudflare markup, and bringing your own provider key stays available.
    Cloudflare states that all three providers support zero data retention for requests made
    through it.
  why: >-
    Search calls for an agent now carry the same gateway logging and billing path as model
    calls, at each provider's list price.
