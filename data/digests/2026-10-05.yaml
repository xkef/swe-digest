- title: >-
    JetBrains reports one-bit embeddings keep code-search ranking but destroy absolute relevance
    thresholds
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Quantizing code-search embeddings to one bit per dimension kept JetBrains ranking order
    but broke similarity scores as thresholds.
  summary: >-
    The JetBrains field notes on building a retrieval pipeline for semantic code search report
    that quantizing embeddings to one bit per dimension preserves the ranking order of results
    while making absolute similarity scores unusable as a threshold. The post is dated September
    2026 and is part one of a series that promotes the company's own Air Context product.
  why: >-
    Ranking survives binary quantization but thresholding does not, so any feature that has
    to decide when to stay silent needs higher-precision vectors and the storage bill that
    comes with them.
  sources:
  - label: primary
    url: https://blog.jetbrains.com/ai/2026/09/building-a-rag-pipeline-for-semantic-code-search-a-developer-diary-and-field-notes/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49956148
- title: Xray-core certificate pinning skipped hostname verification on two dial paths
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Pinning a CA hash in Xray-core skipped hostname checks, so any leaf from that CA could
    MITM Hysteria2 and gRPC dials.
  summary: >-
    GHSA-5wf9-h793-w73c, published 2026-07-10, records that setting `pinnedPeerCertSha256`
    in Xray-core turns off the standard certificate verification rather than adding to it,
    so hostname checking was skipped whenever `ServerName` ended up empty. The advisory's
    title and vulnerable branch scope the machine-in-the-middle condition to a pinned well-known,
    non-self-signed CA certificate: when the pinned hash matches a CA rather than the presented
    leaf, any leaf issued under that CA satisfies the check. Pinning a leaf certificate's
    own hash is not in that scope, because the presented leaf is then matched directly. The
    advisory states that Xray-core usually derives `ServerName` from the server address, and
    names the two paths where it does not and so leaves neither `dNSName` nor `iPAddress`
    checked: the Hysteria2 dialer, and gRPC dial when the address is an IP address rather
    than a domain. It lists affected versions from v26.1.13 and patched versions from v26.7.11,
    rates the severity Low, and records no known CVE, and the net4people thread holds that
    the first code change addressing the flaw shipped without a security note, which was not
    verified against the commit and release history here.
  why: >-
    Pinning a shared CA's hash through `pinnedPeerCertSha256` is weaker than ordinary verification
    on those two dial paths, because every leaf that CA issues then passes.
  sources:
  - label: primary
    url: https://github.com/XTLS/Xray-core/security/advisories/GHSA-5wf9-h793-w73c
  - label: discussion
    url: https://github.com/net4people/bbs/issues/672
  - label: further discussion
    url: https://news.ycombinator.com/item?id=49956003
- title: >-
    GitHub Actions and Pages degraded for about two hours and forty minutes on runner assignment
    failures
  section: Outages
  category: Outage
  status: confirmed
  blurb: >-
    GitHub Actions failed to assign hosted runners for about two hours and forty minutes on
    2026-10-05, with Pages degraded too.
  summary: >-
    GitHub opened the incident at 19:11 UTC on 2026-10-05 and reported Actions operating normally
    at 21:54 UTC. The reported impact was delays assigning GitHub-hosted runners across multiple
    runner configurations, then job failures, with Pages degraded from 21:22 UTC and customers
    unable to reach repository list, licensing and billing pages. GitHub states mitigations
    were applied by 21:32 UTC and that queued jobs cleared after that, and it published no
    root cause.
  why: >-
    Jobs failed rather than only queueing, so pipelines that ran in that window need their
    results treated as unreliable instead of retried on the assumption they were merely delayed.
  followup: Watch for a GitHub root-cause writeup for the runner assignment failures.
  sources:
  - label: primary
    url: https://www.githubstatus.com/incidents/3q1yb5m7ltvb
  - label: discussion
    url: https://news.ycombinator.com/item?id=49969961
- title: >-
    Tool for macOS 27 reports Apple Intelligence has no single off switch and leaves its models
    on disk
  section: Apple platforms
  category: Apple
  status: discussion
  blurb: >-
    A macOS 27 removal tool's repository says disabling Apple Intelligence also drops the
    Foundation Models framework and Xcode completion.
  summary: >-
    The RemoveMacAI repository documents that macOS 27 exposes no single setting that turns
    Apple Intelligence off, and that the downloaded models stay on disk after the features
    are disabled, which is the gap the tool exists to close. The repository also states that
    turning the features off disables the Foundation Models framework, the Shortcuts Use Model
    action, and Xcode predictive code completion. What is established here is that a third-party
    removal tool makes those claims, not that macOS 27 behaves that way, because no Apple
    documentation was checked against them, which is why this is published as discussion.
  why: >-
    Disabling Apple Intelligence also removes the Foundation Models framework, the Shortcuts
    Use Model action, and Xcode predictive code completion, so it is a build-environment decision
    and not only a disk-space one.
  sources:
  - label: primary
    url: https://github.com/omlahore/RemoveMacAI
  - label: discussion
    url: https://news.ycombinator.com/item?id=49957116
- title: >-
    Linux 7.3-rc6 lands two weeks from release, with Torvalds calling the commit count normal
    for the new AI normal
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Linux 7.3-rc6 leaves the release about two weeks out, and Torvalds calls the commit count
    normal for the new AI normal.
  summary: >-
    Phoronix reports the 7.3-rc6 release with stable 7.3 roughly two weeks out, and quotes
    Torvalds describing the commit count as normal for what he calls the new AI normal of
    small error-path fixes. The quoted announcement does not mention delayed networking work,
    and the claim that more networking fixes landed across the board with some delayed by
    AI and LLM noise is Phoronix's own body text rather than Torvalds. The article's opening
    sentence says 7.3-rc7 while its headline, the quoted announcement, and its body details
    are all 7.3-rc6, so the release number here follows the headline and the quote.
  why: >-
    Stable 7.3 is roughly two weeks out, and the maintainer-visible cost of LLM-generated
    patches and reports now shows up in the release announcement itself rather than only in
    mailing-list complaints.
  followup: Watch for the Linux 7.3 stable release in late October 2026.
  sources:
  - label: primary
    url: https://www.phoronix.com/news/Linux-7.3-rc6-Released
  - label: discussion
