- title: >-
    Postgres committer finds only 4 of 12 Postgres 19 reverts traceable to AI-found bugs
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Postgres committer Tomas Vondra traces only 4 of 12 Postgres 19 reverts to bugs an AI
    tool actually found.
  summary: >-
    Tomas Vondra, in a post dated 2026-10-01, tests the claim that Postgres 19 patches are
    being reverted because AI tooling is finding bugs in them, and reports that only 4 of
    the 12 reverts he examined trace to AI-found bugs. He attributes the stabilization slowdown
    to senior contributor time instead, pointing at a jump from roughly 5 CVEs last year to
    44 this year that the same small group of reviewers has to absorb.
  why: >-
    The constraint Vondra identifies is senior reviewer time rather than AI surfacing bugs
    too complex to fix, and those two diagnoses call for different responses.
  sources:
  - label: primary
    url: https://vondra.me/posts/are-we-reverting-patches-because-of-bugs-found-by-ai/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49960374
- title: >-
    Self-hosted HTTP tunnel built from OpenSSH remote forwarding and nginx secure_link
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Vincent Bernat builds a self-hosted HTTP tunnel from OpenSSH remote forwarding and nginx,
    with a 14.8-bit port secret.
  summary: >-
    Vincent Bernat sets out an HTTP tunnel assembled from OpenSSH remote port forwarding and
    the nginx `secure_link` module, as a replacement for a hosted tunnelling service. The
    post quantifies the scheme's weakness rather than leaving it implicit, putting the entropy
    of the port-based secret at about 14.8 bits.
  why: >-
    It replaces an ngrok-style service with two daemons most servers already run, at the cost
    of a port secret the author measures at about 14.8 bits.
  sources:
  - label: primary
    url: https://vincent.bernat.ch/en/blog/2026-http-over-ssh
  - label: discussion
    url: https://news.ycombinator.com/item?id=49958569
- title: >-
    HN thread recalculates the Google data center water figure an improper redaction exposed
  section: Hacker News
  category: Infrastructure
  status: discussion
  blurb: >-
    Commenters convert the exposed Lincoln water figure into terms they call unremarkable
    and treat the electricity number as the sizable one.
  summary: >-
    A local news report dated 2026-09-30 covers water and electricity figures for Google's
    Lincoln data center that an improper redaction left readable, and the Hacker News thread
    works the numbers rather than the disclosure. Commenters convert the water figure into
    terms they consider unremarkable for a facility of that size, and treat the electricity
    figure as the sizable one.
  why: >-
    Electricity, not water, is the figure the thread treats as sizable, which inverts the
    framing most data center resource stories arrive with.
  sources:
  - label: report
