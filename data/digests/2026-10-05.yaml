- title: >-
    Denmark confirms unauthorized parties reached 8.8 million CPR records by abusing a company's
    lawful section 38 access
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Denmark says unauthorized outsiders abused a company's lawful section 38 CPR access, reaching
    8.8 million registered persons.
  summary: >-
    The CPR administration published a news item dated 2026-10-05 stating that unauthorized
    outsiders obtained the data by misusing a Danish company's lawful CPR access, and it links
    a press release of the same date from the Danish ministry for research, education and
    digitalisation that names the legal basis as section 38 of the CPR law, which lets a private
    company with a legitimate interest retrieve data only on persons it has already identified
    one by one, by CPR number, by birth date and name, or by name and address. The 8.8 million
    figure counts registered persons including living, emigrated and deceased, against a register
    the ministry puts at about 11 million, the activity ran through September, the CPR administration
    became aware of it on the evening of Friday 2026-10-02, and both primaries state that
    the access does not cover names and addresses of persons registered with name and address
    protection. Both also state that the company's access has been stopped, that the CPR administration
    has filed with Datatilsynet, and that the police are investigating, while the ministry
    release alone adds that the minister informed the Folketing's business and digitalisation
    committee and ordered a full security review of CPR, and that the investigation is in
    an initial phase with no attribution currently possible.
  why: >-
    Section 38 exposes a per-person lookup interface, so reaching about 8.8 million records
    means outsiders drove that interface at register scale through September before the administration
    noticed on 2026-10-02.
  followup: >-
    Watch for who the police attribute the access to, for the company's name, and for the
    fields reached beyond names, addresses, and CPR numbers, which neither primary states.
  sources:
  - label: primary
    url: https://www.cpr.dk/cpr-nyt/nyhedsarkiv/2026/okt/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger
  - label: ministry
    url: https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/
  - label: report
    url: https://cphpost.dk/2026-10-05/life-in-denmark/cpr-data-breach-exposes-personal-details-of-8-8-million-people-in-denmark/
