- title: >-
    AWS will run its European Sovereign Cloud without the AWS global backbone for several
    hours on 2026-10-24
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    AWS will disconnect its European Sovereign Cloud from the global backbone on 2026-10-24,
    warning of brief route churn.
  summary: >-
    The AWS security blog post, dated 2026-09-28, states that on 2026-10-24 the AWS European
    Sovereign Cloud will operate for several hours without the AWS global backbone, to demonstrate
    that the region runs independently. AWS states customers may see brief connectivity disruption
    at the start and at the end of the exercise as other networks reconverge their routes.
    The event is future-dated, so this is a published plan rather than something that has
    happened.
  why: >-
    Workloads in the region need that Saturday on the calendar, because the announced disruption
    window falls at the start and the end of the exercise rather than throughout it.
  followup: >-
    Check on 2026-10-24 whether the exercise runs as announced and what the observed disruption
    was.
  sources:
  - label: primary
    url: https://aws.amazon.com/blogs/security/aws-european-sovereign-cloud-demonstrating-an-independent-operation/
  - label: discussion
