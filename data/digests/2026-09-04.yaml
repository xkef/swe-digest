date: '2026-09-04'
lede: >-
  Two independent evaluators measured GPT-6 Astra, one finding a 35.9-point harness gap at
  matched effort and the other a 2.5 times price rise.
stories:
- title: >-
    ARC Prize measures GPT-6 Astra at 62.7 percent on ARC-AGI-3 under its neutral harness
    and 99.9 percent under the provider adapter
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    ARC Prize measured GPT-6 Astra at 62.7 percent on ARC-AGI-3 in its neutral harness and
    99.9 percent via the provider adapter.
  summary: >-
    ARC Prize reports a standard harness maximum of 62.7 percent at $26,098 and a Provider
    Adapter high setting of 99.9 percent at $18,817, so the provider-adapted run scored higher
    and cost less. ARC Prize states it will report both conditions on the leaderboard going
    forward and that it is not claiming AGI. Separate PRO-LONG runs gave the model a code
    sandbox that human test participants did not have.
  why: >-
    At matched maximum effort the same model on the same benchmark moves 35.9 points, 98.6
    percent through the provider adapter against 62.7 percent in the neutral harness, so a
    single headline score does not describe what the model will do inside a given harness.
  followup: >-
    Check whether the leaderboard publishes both harness conditions for later models.
  sources:
  - label: primary
    url: https://arcprize.org/blog/astra
  - label: discussion
    url: https://news.ycombinator.com/item?id=49555691
- title: >-
    GitHub changes the rate-limited unauthenticated Git response from 403 to 401, with intermittent
    anonymous clone failures reported
  section: Top stories
  category: Dev tools
  status: confirmed
  blurb: >-
    GitHub now returns 401 instead of 403 to rate-limited unauthenticated Git requests, and
    clones fail intermittently.
  summary: >-
    A GitHub Community Admin states in discussion 206581 that rate-limited unauthenticated
    Git requests over HTTPS now return HTTP 401 where they previously returned 403, because
    403 has no provision to retry with authentication and would block a request that Git could
    have authenticated. The reporter and the discussion title describe the clone failures
    as intermittent rather than constant.
  why: >-
    A CI job cloning a public repository anonymously can fail intermittently at the negotiation
    step, and the 401 is what lets Git retry with credentials where the earlier 403 failed
    outright.
  followup: Track whether GitHub identifies a cause for the intermittent failures.
  comments: >-
    Commenters report that setting `git config http.version HTTP/1.1` resolves the failure
    with no credential change, and that git 2.53.0 does not reproduce it.
  sources:
  - label: primary
    url: https://github.com/orgs/community/discussions/206581
  - label: discussion
    url: https://news.ycombinator.com/item?id=49547193
