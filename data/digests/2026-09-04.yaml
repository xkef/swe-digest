- title: >-
    A pilot study reports coding agents route between grep and LSP by task, and that output
    shape moved success more than retrieval precision
  section: Agentic coding
  category: Agentic coding
  status: developing
  blurb: >-
    A pilot study reports coding agents route between grep and LSP by task, and that output
    shape moved success more than precision.
  summary: >-
    The study, dated 2026-08-12, runs two to three rollouts per cell across three Claude models
    and is labelled by its author as a preliminary pilot. Attaching source lines to the same
    semantic results cut follow-up file reads from 15.2 to 3.2 per episode and lifted pass@1
    from 0.67 to 0.83. The author discloses a product interest in AgentConnect.
  why: >-
    What a retrieval tool returns is a design decision separate from what it retrieves, and
    the measured gain came from the output shape rather than from better matches.
  followup: Watch for a run with enough rollouts to separate the effect from noise.
  sources:
  - label: primary
    url: https://www.agentconnect.md/blog/grep-beat-lsp-harness/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49560260
- title: >-
    Google's Antigravity terms make third-party clients grounds for account suspension
  section: Agentic coding
  category: Dev tools
  status: confirmed
  blurb: >-
    Google's Antigravity terms name third-party clients a breach and grounds for suspending
    Antigravity and Gemini CLI accounts.
  summary: >-
    The Google Antigravity Additional Terms of Service state that using third-party software,
    tools or services to access the Service breaches the agreement, give OpenClaw with Antigravity
    OAuth as the named example, and state that such use may be grounds for suspension or termination
    of Antigravity and Gemini CLI accounts. The same terms state that user data, interaction
    data, related metadata and feedback are recorded and used to evaluate, develop and improve
    Google and Alphabet research, products, services and machine learning technologies, that
    employees and contractors may access and review them, that a settings preference changes
    this, and that deletion is requested by email.
  why: >-
    A developer wrapping Antigravity credentials in their own tooling risks the linked Gemini
    CLI account as well, not only Antigravity.
  sources:
  - label: primary
    url: https://antigravity.google/terms
  - label: discussion
    url: https://news.ycombinator.com/item?id=49548452
- title: >-
    Daniel Lemire publishes a case where Python set and dict operations run in quadratic time
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Daniel Lemire published a three-line Python case where set and dictionary operations run
    in quadratic rather than linear time.
  summary: >-
    The post gives three lines that reproduce quadratic time in Python set and dictionary
    operations. A separate measurement in the same post records a plain dictionary lookup
    slowing from 21.8 to 201.9 nanoseconds per key under cache pressure alone, with no collisions
    involved.
  why: >-
    Container operations a Python service treats as constant time can degrade by an order
    of magnitude from data layout, which no algorithmic review of the code would show.
  sources:
  - label: primary
    url: https://lemire.me/blog/2026/09/03/python-sets-and-dictionaries-can-have-quadratic-time-performance/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49550115
- title: Rust 1.98.1 fixes a vtable miscompilation that emitted undefined behaviour
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Rust 1.98.0 could emit a trait object vtable holding a null pointer where a function pointer
    belongs, and 1.98.1 fixes it.
  summary: >-
    The point release landed on 2026-09-03. In Rust 1.98.0, rustc could in some circumstances
    generate a trait object vtable holding a null pointer where a function pointer belongs,
    which is undefined behaviour in the emitted code. The release team says this may show
    up as a segfault from loading the null pointer, and that as with any undefined behaviour
    it can justify arbitrary effects.
  why: >-
    Anything built with 1.98.0 should be rebuilt after `rustup update stable`, because the
    defect is in the emitted binary rather than in the source.
  sources:
  - label: primary
    url: https://blog.rust-lang.org/2026/09/03/Rust-1.98.1/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49560189
- title: >-
    The author of a 1993 Amiga game reports rebuilding its 68000 assembly byte-identically
    and porting it to Godot with a coding agent
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    The author of a 1993 Amiga game rebuilt its 68000 assembly byte-identically, then ported
    it to Godot with a coding agent.
  summary: >-
    The post describes reassembling the original 68000 source until the output matched the
    shipped binary byte for byte, then using that build as the reference for a Godot port
    driven by a coding agent. It records two places where the byte-identical check caught
    real errors.
  why: >-
    The byte-identical rebuild is what made every later claim about the port checkable, and
    the post records where that check caught errors rather than only the successes.
