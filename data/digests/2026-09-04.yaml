  status: confirmed
  blurb: >-
    Hugging Face released funes, a local-first memory layer that recalls original agent turns
    from existing session traces.
  summary: >-
    funes indexes session traces a coding agent has already written and runs locally. Recall
    returns the original turn rather than a summary of it. The post's own benchmark reports
    the approach failing on one of two tasks.
  why: >-
