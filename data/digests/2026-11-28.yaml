- title: >-
    InfoHawk finds a WebRTC card skimmer on five stores' mobile checkouts, planted via a pixel,
    consent banner and CDN
  section: Security
  category: Security
  blurb: >-
    A skimmer on Samsonite, Revolve and three other stores pulled code and sent card data
    over WebRTC via Cloudflare's TURN relay.
  summary: >-
    InfoHawk found a card skimmer on Lascana, Samsonite, American Tourister, Revolve and FWRD,
    delivered through an altered Quorum marketing pixel, edited Seers consent-banner settings
    and a modified file on Revolve's CDN, all removed on 2026-11-24 or 2026-11-25. The loader
    ran only on small or touch screens, made two signaling requests to a northbridgeads host,
    then fetched the skimmer and sent card data over a WebRTC data channel relayed through
    turn.cloudflare.com. InfoHawk captured live test card details leaving Lascana's checkout.
  why: >-
    A connect-src rule on payment pages blocks the two signaling requests, but the WebRTC
    data channel itself sits outside connect-src, and desktop-only checkout scans miss this
    skimmer.
  background: >-
    Content Security Policy's connect-src directive limits which hosts scripts can reach with
    fetch, XHR and WebSocket. WebRTC data channels negotiate peer connections through ICE
    and can route through TURN relays, a path that CSP has not historically covered. Skimmers
    that ride third-party tags inherit the page's full script privileges, which is why payment
    fields are usually isolated in a processor's iframe.
  comments: >-
    The Hacker News thread reached 405 points and 209 comments, mostly arguing over ad blocking
    and over making sites liable for third-party scripts they load, with one commenter noting
    that bank-app transaction approval, as in the Netherlands, makes stolen card numbers less
    useful.
  event: webrtc-checkout-skimmer-2026-11
  sources:
