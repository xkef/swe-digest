- title: >-
    Malspark finds five malicious GGUF models on Hugging Face, downloaded 2,428 times, hiding
    a RAT and hijacking agents
  section: Security
  category: Security
  blurb: >-
    A scan of 3.27 million Hugging Face repos found five GGUF models hiding a Windows trojan
    after the weights or hijacking agents via templates.
  summary: >-
    Malspark scanned all 3,273,389 public Hugging Face model repositories on 2026-11-26 and
    found five malicious GGUF models with 2,428 downloads by 2026-11-27, all still online.
    The Mir2k account appended a Windows remote access trojan called ollie after the last
    tensor of two uncensored models, including an Inkling-2-Mini build, then rewrote their
    chat templates on 2026-11-26 so the model opens every reply with a PowerShell line that
    extracts and runs it. The timdedid account's three Qwen3 models insert a hidden directive
    telling agents with a powershell tool to download and run a script when a prompt contains
    'What is'.
  why: >-
    Running community GGUF files with embedded chat templates, especially behind an agent
    with shell access, now needs a template review or a pinned template file and a check for
    bytes past the last tensor.
  background: >-
    GGUF is the single-file model format used by llama.cpp, Ollama and LM Studio. It holds
    a header, a metadata table, a tensor table and the weights, and loaders read only the
    byte ranges the header declares, so appended data is ignored silently. The metadata includes
    a Jinja chat template that the runtime applies to every conversation, which lets a file
    author inject text the user never sees.
  event: mir2k-gguf-malware-hugging-face
  sources:
  - label: primary
    url: https://malspark.com/blog/malicious-gguf-models-hugging-face/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50676752
- title: >-
    Inkling 2 Mini reaches 101 tok/s on one GB10 in vLLM with INT8 drafting, adaptive verify
    width and tuned MoE GEMMs
  section: AI
  category: AI
  blurb: >-
    One GB10 box runs Inkling 2 Mini at 101 tok/s in vLLM after INT8 draft copies, adaptive
    verify width and retuned prefill MoE kernels.
  summary: >-
    Anand D N tuned vLLM serving of Inkling 2 Mini on an MSI GB10 box, using 36% of memory
    beside an idle Qwen3.8-27B, from 90.3 to 101 tok/s for one request and 195.7 tok/s across
    four. Changes included rounding a Triton compile constant to cut first-token stalls 67
    to 90%, INT8 copies of the DFlash2 draft weights, probabilistic drafting that lifted sampled
    requests 14 to 20%, and marking low-confidence verify rows as MoE padding so they skip
    expert reads without changing CUDA graph shapes. Retuned expert GEMM tiles cut a 32K-token
    prefill's time to first token from 12.2 to 9.7 seconds with bit-identical output.
  why: >-
    It shows where self-hosted MoE inference time goes on unified-memory hardware and which
    vLLM speculative decoding settings pay off for sampled rather than greedy requests.
  background: >-
    Speculative decoding uses a small draft model to propose several tokens that the large
    model verifies in one forward pass, keeping the accepted prefix. In a mixture-of-experts
    model each token reads only a few expert blocks, so expert matrix multiplies dominate
    step time. CUDA graphs replay recorded kernel launches with fixed shapes, which constrains
    how far a server can vary the work per step.
  event: runtimenotes-inkling-2-mini-gb10-vllm-tuning
  sources:
  - label: primary
    url: https://runtimenotes.com/blog/getting-101-tok-s-from-inkling-2-mini-in-vllm-on-one-gb10/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50670443
- title: >-
    JetBrains launches a Kotlin Security Newsletter after 10 security fixes across Kotlin
    libraries in 2026
  section: Languages and runtimes
  category: Languages
  blurb: >-
    JetBrains starts a monthly digest of security fixes across Kotlin, Ktor, Exposed, kotlinx
    and Compose after 10 fixes this year.
  summary: >-
    JetBrains published the first Kotlin Security Newsletter on 2026-11-27, to collect security
    fixes in Kotlin, the kotlinx libraries, Compose Multiplatform, Ktor and Exposed with affected
    and fixed versions. The team says it shipped 10 security fixes this year against one in
    each of the previous two, mostly from researcher reports. It asks reporters to confirm
    AI-assisted findings manually and notes Kotlin stdlib JVM release lines get 18 months
    of security fixes since 2.4.0.
  why: >-
    Kotlin and Spring Boot teams get one feed for fixes in Ktor, Exposed, kotlinx.serialization
    and the build tooling instead of tracking each project.
  event: kotlin-security-newsletter-launch
  sources:
  - label: primary
    url: https://blog.jetbrains.com/kotlin/2026/11/introducing-the-kotlin-security-newsletter/
- title: >-
    Linux removes the vme_user staging driver after LLM-generated security reports flood the
    lists
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Greg Kroah-Hartman pulls the orphaned vme_user staging driver, about 9,000 lines, because
    LLMs kept reporting security bugs in unused code.
  summary: >-
    Greg Kroah-Hartman's staging pull ahead of Linux 7.4-rc5 removes the vme_user driver for
    the 1980s VME bus, nearly 9,000 lines including docs, Kconfig and the MAINTAINERS entry.
    He wrote that LLMs were reporting security bugs in a driver no one uses, so removal saves
    everyone's time. It follows earlier removals of old ISA, PCMCIA, ham radio and ISDN code
    for the same reason.
  why: >-
    AI-generated bug reports are now a reason maintainers delete unmaintained code, a pattern
    other large projects with legacy corners can expect.
  event: linux-vme-user-staging-removal
  sources:
  - label: primary
    url: https://www.phoronix.com/news/Linux-Drops-VME-Bus-User
- title: >-
    Christophe Pettus: send_abort_for_crash without send_abort_for_kill leaves truncated PostgreSQL
    core files
  section: Engineering posts
  category: Engineering post
  blurb: >-
    PostgreSQL 16's two developer GUCs swap SIGQUIT and SIGKILL for SIGABRT, so every child
    dumps core, and one alone yields truncated cores.
  summary: >-
    Pettus tested both parameters on PostgreSQL 18.6. With send_abort_for_crash on, one segfault
    produced eleven core files of 1.8 GB at 128 MB shared_buffers, and at 1 GB shared_buffers
    the postmaster's SIGKILL after five seconds cut ten of eleven cores short. send_abort_for_kill
    on its own captures the stuck process the default destroys, but a stopped or gdb-attached
    backend then keeps the cluster in recovery indefinitely, since SIGKILL is never sent.
  why: >-
    Anyone chasing an unreproducible Postgres hang should enable both settings together, check
    ulimit -c and core_pattern first, and use gcore for a single stuck backend on a live system.
  background: >-
    When any PostgreSQL child process crashes, the postmaster tells every other child to quit,
    reinitializes shared memory, and replays WAL, which normally leaves only the crashed process's
    core file. Linux's default coredump_filter includes anonymous shared mappings, so each
    core contains all of shared_buffers unless huge pages are used. Tom Lane added both parameters
    in November 2022 while chasing an intermittent buildfarm hang.
  event: pettus-postgres-send-abort-gucs
  sources:
  - label: primary
    url: https://postgr.es/p/9EA
- title: >-
    CppCon 2026: Conan's co-founder gives multi-repo C++ projects promoted package repositories
    and superbuild workspaces
  section: Talks
  category: Video
  blurb: >-
    Conan's Diego shows package promotion between repositories and a computed build order
    for multi-repo C++ CI, plus CMake superbuild workspaces.
  summary: >-
    The talk stages new package versions in a separate packages repository and promotes them,
    with rebuilt consumer binaries, to the developer repository only after a merge, and computes
    what to rebuild with conan graph build order from the product graphs rather than encoding
    the dependency chain in CI jobs. Conan workspaces pull several packages into editable
    mode by their recorded Git commit and use CMake FetchContent with OVERRIDE_FIND_PACKAGE
    to build them as one incremental superbuild.
  why: >-
    Teams running many C++ repositories can get monorepo-style CI and local development without
    moving code, and the promotion pattern applies to any binary package registry.
  event: cppcon-2026-conan-component-monorepo-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=pRqxQjO5wVU
- title: >-
    ZoomInfo's Brian Kennedy: an LLM judge was right 65% of the time, and a decision model
    with seven yes-no questions caught more
  section: Talks
  category: Video
  blurb: >-
    An audit of 500 production steps found ZoomInfo's LLM judge right 65% of the time, so
    the team now asks seven yes-or-no questions instead.
  summary: >-
    ZoomInfo regraded 500 production agent steps and found its LLM judge right 65% of the
    time, accepting 118 steps it should have sent back, most often when an agent claimed an
    action such as sending an email that no tool call performed. The team replaced the open
    question with one accept, redo or stop choice plus seven yes-no questions answered from
    tool results by the Jev decision model, accepting at 30% or higher, rejecting at 5% or
    lower, and sending the middle band to the LLM judge. In shadow mode over 37,000 decisions,
    Jev caught 623 of 728 clear tool failures against the LLM judge's 294, at 10 times the
    speed and 40 times lower cost.
  why: >-
    A judge that reads the agent's own summary alongside tool results can trust the summary,
    so grading from the tool receipts with narrow questions, run first in shadow mode, is
    a cheap check on any LLM-as-judge setup.
  event: zoominfo-llm-judge-decision-model-talk
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=DQwcuXgAIA0
- title: >-
    Bernstein's list of soundness bugs in proof checkers draws Hacker News debate over trusting
    AI-written Lean proofs
  section: Hacker News
  category: Pulse
  blurb: >-
    Bernstein lists reported soundness bugs in seven proof checkers, from 3 in HOL Light to
    111 in Rocq, as Hacker News weighs AI proofs.
  summary: >-
    D. J. Bernstein's page counts reported soundness bugs in HOL Light (3), Mizar (7), Metamath
    (9), Isabelle (20), Lean (23), HOL4 (24) and Rocq (111), many dated 2026, and argues for
    small verified checkers such as Candle. The Hacker News thread drew 174 points and 75
    comments.
  why: >-
    Engineers relying on machine-checked proofs, including AI-generated ones, should check
    them with several independent kernels rather than trust one checker.
  comments: >-
    Commenters note that Metamath's main databases require five independent verifiers in five
    languages, that Lean now has independent kernels such as nanoda and the verified con-leche,
    and that a buggy Collatz proof exploiting a Lean bug was posted as a deliberate joke.
    Others worry that models reward hack into soundness bugs where no human reads the proof.
  event: djb-false-computer-checked-proofs
  sources:
  - label: primary
    url: https://cr.yp.to/proofs/falseccp.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50667989
- title: >-
    Michael Nielsen takes down his neural networks book in protest at frontier labs, drawing
    519 points on Hacker News
  section: Hacker News
  category: Pulse
  blurb: >-
    Michael Nielsen removes his 2015 neural networks book, citing frontier lab recklessness,
    and the thread splits on whether it changes anything.
  summary: >-
    Nielsen replaced the book written between 2011 and 2015 with a November 2026 statement
    saying he does not want to help train people for frontier AI work, arguing the core risk
    is destructive technology latent in nature rather than misalignment of single systems.
    The Hacker News thread reached 519 points and 320 comments.
  why: >-
    A widely used free introduction to neural networks is gone from its canonical site, and
    the debate shows how sharply practitioners now split on AI risk.
  comments: >-
    Most commenters call the removal symbolic, noting archive copies, a TeX source on GitHub
    and a clone site appeared within hours. Others defend it as a statement and debate whether
    neural network knowledge is attack or defense dominant, with nuclear and fire analogies.
    Some point out the book predates the transformer.
  event: nielsen-neural-networks-book-takedown
  sources:
  - label: primary
    url: https://neuralnetworksanddeeplearning.com/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50670757
- title: >-
    Knuth stops accepting book error reports after LLM-assisted readers flood him with duplicates
  section: Hacker News
  category: Pulse
  blurb: >-
    Knuth stops reading new book error reports sent after 2026-11-25, saying LLM-assisted
    readers send mostly duplicates faster than he can read.
  summary: >-
    Donald Knuth says he will not look at error reports submitted after 2026-11-25 until he
    posts updated known-error lists, because LLMs let readers send reports faster than he
    can verify them and random sampling shows most recent reports repeat earlier ones. The
    Hacker News thread reached 236 points and 122 comments.
  why: >-
    It is another maintainer pausing intake under AI-generated report volume, after this week's
    removal of the vme_user staging driver from Linux.
  comments: >-
    Commenters point out that Knuth is pausing intake, not closing it, and that duplicates
    follow when everyone finds errors with the same tools. One commenter calls the volume
    a DDoS on maintainers and describes a friend whose commercial open source project gets
    daily low-quality reports with inflated CVSS scores. Others propose LLM deduplication
    against the known-error list, while some answer that this adds another cost for maintainers.
  event: knuth-error-report-moratorium
  sources:
  - label: primary
    url: https://www-cs-faculty.stanford.edu/~knuth/moratorium.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50674452
