  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    A Void Linux maintainer orphaned 113 packages, including Alacritty and Kubernetes, over
    an AI disclosure policy.
  summary: >-
    Phoronix reports that a Void Linux maintainer orphaned 113 packages following a dispute
    over the distribution's AI disclosure policy, and names Alacritty, Kubernetes, Docker
