- title: >-
    buildprof traces build process trees and finds two-thirds of Bun's Zig build in one linker
    invocation
  section: Engineering posts
  category: Engineering post
  blurb: >-
    buildprof traced Bun's Zig build and found one ld.lld run under Full LTO taking over sixteen
    of its minutes.
  summary: >-
    Lalit Maganti released buildprof, an open-source Linux build tracer that records every
    process a build launches with ptrace and file reads and writes with a seccomp filter,
    then renders the result in a soft fork of the Perfetto UI, so it works across Cargo, Ninja,
    Make, Zig and wrapper scripts without per-build-system integration. He used it on Bun's
    reported drop from 30m06s to 5m37s on Linux CI after the move from Zig to Rust, and the
    trace showed one `ld.lld` invocation running alone for over sixteen minutes at the end
    of the Zig build under Full LTO, roughly two-thirds of the total. The downloaded WebKit
    archives were also built with Full LTO, so rebuilding WebKit and ICU with ThinLTO was
    required and took the Zig build from 24m24s to 15m11s, with the remaining gap structural,
    because Bun's Rust code splits across more than 90 crates while the Zig build compiled
    as a single module.
  why: >-
    A process-level tracer attributes build time across build system boundaries, which is
    where a single serialized linker step like this one stays invisible to per-tool timing.
  sources:
  - label: post
    url: https://lalitm.com/post/buildprof/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49672842
- title: Reverse engineering the Intel 8087 microcode for the FSCALE instruction
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Reverse engineering the Intel 8087 FSCALE instruction finds over 140 micro-instructions
    and three subroutine levels.
  summary: >-
    The post traces the 8087 microcode that implements FSCALE, which scales a floating-point
    value by a power of two. The nominally trivial exponent addition runs to over 140 micro-instructions
    and three levels of subroutine calls once empty, denormal, infinity and NaN operands are
    handled.
  why: >-
    Operand classification, not the arithmetic, dominates the microcode path, which is what
    an instruction's nominal description hides.
  sources:
  - label: post
    url: https://www.righto.com/2026/09/8087-microcode-reverse-engineering-fscale.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49673580
- title: Altman says an OpenAI IPO in 2026 would be ill-advised given safety conditions
  section: Markets and companies
  category: Markets
  blurb: >-
    Sam Altman said an OpenAI public listing in 2026 would be ill-advised, after the company
    filed confidentially.
  summary: >-
    Altman ruled out an OpenAI public listing this year, citing safety conditions, after the
    company had filed confidentially. TechCrunch reports the interview took place amidst fallout
    from the OpenAI and Hugging Face hack and broader AI safety discussion, and attributes
    that framing to the interviewer's question rather than to Altman's remark.
  why: >-
    Teams building on OpenAI APIs get no audited financials or risk factors this year, so
    vendor-stability assessment for a core dependency rests on public statements alone.
  sources:
  - label: TechCrunch
    url: https://techcrunch.com/2026/09/12/openais-sam-altman-says-it-would-be-ill-advised-to-go-public-in-2026/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49676849
- title: Hacker News reads the Anthropic pacing proposal as competitive positioning
  section: Hacker News
  category: AI
  blurb: >-
    The Amodei pacing essay drew 953 comments, and the dominant reply questions motive rather
    than the pacing mechanism.
  summary: >-
    The thread on the pacing essay this digest carried on 2026-09-12 is the largest of the
    day at 953 comments, and the dominant reaction is skepticism about motive rather than
    engagement with the proposed mechanism.
  why: >-
    The volume is reaction to motive rather than to the embedded-evaluator commitment, so
    it measures how the proposal lands and not whether the mechanism works.
  comments: >-
    Commenters state the essay does not commit Anthropic to slowing its own model training,
    so they read the proposal as a constraint on competitors and on open-weight and foreign
    models while Anthropic leads. Several note that it pairs the safety argument with export
    controls, distillation crackdowns and widening the United States lead over China, and
    read that combination as regulatory positioning. One commenter who pays for Claude Code
    personally and at work says the framing makes them want Anthropic to lose. A separate
    thread argues that a company committed to pacing should publish its model weights, and
    its top reply calls that argument incoherent, because it assumes every lab would agree
    to destroy its own valuation at once and that no new lab would start from the released
    weights.
  sources:
  - label: HN thread
    url: https://news.ycombinator.com/item?id=49672510
  - label: essay
    url: https://darioamodei.com/post/we-must-pace-the-frontier
  - label: open-weights thread
    url: https://news.ycombinator.com/item?id=49676085
