  summary: >-
    A preprint submitted 2026-07-01 (Zhang and co-authors) reports that reinforcement-learning
    fine-tuning gains are concentrated in a small subset of transformer layers, often a single
    middle layer, and that training only that layer can recover or exceed full-parameter RL
