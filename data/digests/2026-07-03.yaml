- title: Practitioner argues for a short-leash workflow when coding with AI agents
  section: Agentic coding
  category: Agentic coding
  status: discussion
  blurb: >-
    Slepak describes a short-leash coding-agent workflow for security-critical software: review
    and approve each diff, commit after each step.
  summary: >-
    Greg Slepak (okTurtles) describes a short-leash method for using coding agents on security-critical
    software: break work into tracked steps, require a permission prompt that shows each diff
    before it applies, review and approve or deny every change, commit after each subtask,
    and record which models assisted in a mandatory pull-request AI-disclosure section. The
    post is a practitioner opinion drawn from maintaining the Group Income codebase, with
    no measured results or reproducible benchmark.
  why: >-
