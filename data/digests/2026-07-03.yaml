- title: Bernstein calls on standards bodies to reject non-hybrid ML-KEM in TLS
  section: Security
  category: Security
  status: discussion
  blurb: >-
    Bernstein argues that TLS should require hybrid ECC-ML-KEM key exchange for defense in
    depth, cautioning against solo post-quantum algorithms.
  summary: >-
    Daniel J. Bernstein published an argument and call to action against IETF endorsement
    of solo ML-KEM in TLS, framing it as a weakening of the deployed ECC plus ML-KEM hybrid.
    His case rests on the history of broken post-quantum candidates (SIKE was broken after
    deployment to millions of connections) and on hybrid key exchange as defense in depth
    if the lattice layer fails. He characterizes the push toward non-hybrid post-quantum key
    exchange as driven by NSA and GCHQ.
  why: >-
    The hybrid-versus-non-hybrid choice sets the default post-quantum key-exchange posture
    for TLS libraries and the browsers and servers that depend on them.
  followup: >-
    Track the IETF TLS working group position on non-hybrid ML-KEM and any library defaults
    that follow.
  sources:
  - label: Understanding lattice risks
    url: https://blog.cr.yp.to/20260630-risk.html
  - label: action page
    url: https://nsa.2026.action.cr.yp.to
  - label: HN discussion
