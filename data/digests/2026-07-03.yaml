- title: LMDB 1.0 released with a breaking on-disk format change
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    LMDB 1.0 shipped with breaking on-disk format; existing data requires export with 0.9
    and reimport with 1.0, adding checksums and encryption.
  summary: >-
    LMDB (Lightning Memory-Mapped Database), the embedded copy-on-write key-value store used
    by OpenLDAP, Monero, and many language bindings, tagged 1.0.0 on 2026-06-30, its first
    1.0 after more than a decade on the 0.9.x line. The 1.0 on-disk format is incompatible
    with 0.9 and there is no in-place upgrade, so existing data must be exported with the
    0.9 `mdb_dump` and reimported with the 1.0 `mdb_load`. New features listed in the upgrade
    notes are incremental backup, page-level checksums and encryption, databases on raw block
    devices, two-phase commit, and page sizes up to 64KB.
  why: >-
    Operators running LMDB-backed systems must plan an explicit data migration to adopt 1.0,
    and the added checksums, encryption, and incremental backup change the durability and
    operational story for embedded deployments.
  followup: >-
    Track 1.0.x point releases, downstream adoption in OpenLDAP and the language bindings,
    and whether the reported large-database write-stall behavior persists in 1.0.
  comments: >-
    HN commenters report production caveats: write latency degrading into multi-hour stalls
    once a database grows to several hundred GB, and iOS not paging dirty mmap pages back
    to disk causing app OOM under churn; some moved to libmdbx or RocksDB. Several flagged
    the 0.9-to-1.0 dump-and-restore requirement as the main migration cost.
  sources:
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48766598
- title: Co-locating workflow state with data in Postgres for exactly-once execution
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Storing workflow state in Postgres with application data lets checkpoints and updates
    commit together, replacing transactional-outbox pattern.
  summary: >-
    A DBOS post argues that keeping durable-workflow checkpoints in the same Postgres database
    as application data lets the step checkpoint and the data update commit in one transaction.
    That removes the failure window that forces application-level idempotency bookkeeping,
    and it collapses the transactional-outbox pattern: either the update commits and the workflow
    is enqueued or neither happens.
  why: >-
    It reframes a common distributed-systems problem (exactly-once execution across a workflow
    engine and a database) as a single-database transaction for teams already standardized
    on Postgres.
  sources:
  - label: DBOS blog
    url: https://www.dbos.dev/blog/co-locating-workflow-state-with-your-data
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48765639
- title: >-
    Ubicloud runs PostgreSQL with strict memory overcommit to avoid OOM-killer cascades
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Ubicloud sets vm.overcommit_memory=2 for PostgreSQL so one over-allocating query fails
    locally rather than triggering a cascade of backend kills.
  summary: >-
    A Ubicloud post dated 2026-04-27 (front page on 2026-07-03) explains why they set `vm.overcommit_memory=2`
    for PostgreSQL. When the Linux OOM killer terminates any backend, the postmaster assumes
    shared memory may be corrupted and kills all backends, dropping every connection and forcing
    crash recovery. Strict overcommit makes the kernel return ENOMEM to a single allocation
    instead, so one backend fails its transaction and the postmaster stays up. They size the
    limit at 80 percent of physical memory plus 2 GB, which they say protects over 99 percent
    of their fleet, and note a one-character kernel accounting bug in 6.5 that forced them
    to disable the setting until the 6.8 fix.
  why: >-
    It is a concrete operational recipe for turning a full PostgreSQL outage into a single
    failed query, relevant to anyone running Postgres on Linux without cgroup memory limits.
  sources:
  - label: Ubicloud blog
    url: https://www.ubicloud.com/blog/postgresql-and-the-oom-killer-why-we-use-strict-memory-overcommit
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48774509
