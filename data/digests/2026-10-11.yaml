- title: >-
    Ukrainian drone strikes knock out two of Yandex's five data centers, including two YandexGPT
    training supercomputers
  section: Top stories
  category: Outage
  status: developing
  blurb: >-
    Ukrainian drone strikes knocked out two of Yandex's five data centers, including two of
    three YandexGPT training supercomputers.
  summary: >-
    Ars Technica, citing Reuters, reports Ukrainian drone strikes hit Yandex data centers
    on 2026-10-08 and 2026-10-09, taking two of the company's five sites out of service, and
    states the Sasovo site held two of the three supercomputers used to train YandexGPT. Russian
    users lost access to a video platform, a digital bank and the state railway site, so the
    blast radius covered services that were not Yandex products. Yandex's own incident page
    at status.yandex.cloud is JavaScript-gated and returned a browser-upgrade notice with
    no incident text, so a Hacker News thread's claim that a third data center was hit on
    2026-10-11 is not verified here.
  why: >-
    Data center geography moves from a latency question into the threat model, because the
    same Ars Technica report places these strikes alongside a Russian drone campaign that
    has disrupted Ukraine's data centers and the mobile and internet service of thousands
    of Ukrainians since late September, and alongside Iranian drones that knocked out multiple
    Amazon data centers in Bahrain and the United Arab Emirates after the February 2026 US
    and Israeli attacks on Iran, which corroborates outside the provider's own event log the
    drone-strike cause AWS gave for me-south-1 and me-central-1.
  followup: >-
    Whether a third site was hit on 2026-10-11, whether Yandex publishes a restoration timeline,
    and what the loss of two of three training supercomputers does to YandexGPT.
  sources:
  - label: Ars Technica
    url: https://arstechnica.com/information-technology/2026/10/ukraines-drones-knock-out-ai-data-center-belonging-to-russias-google/
