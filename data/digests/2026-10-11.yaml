- title: >-
    Windows Update certificates expire in May and June 2027, cutting unsupported Windows versions
    off from updates
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Microsoft says Windows Update certificates expire in May and June 2027, cutting devices
    below a minimum patch level off updates.
  summary: >-
    BleepingComputer reports Microsoft stating that certificates Windows Update depends on
    expire in May and June 2027, and that devices below a minimum patch level will not receive
    the replacement certificates and will stop receiving updates. A supported but stale machine
    fails the same way as an unsupported one. Devices served by WSUS are outside the scope.
  why: >-
    The required action is a minimum-patch-level audit against two dates rather than a version
    upgrade, and rarely patched Windows build agents and appliance-style hosts are the population
    that stops receiving updates with no error to signal it.
