  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Paid usability sessions on a project README surfaced a wrong demo link and no statement
    of what the software actually does.
  summary: >-
    The author paid people to follow his project's README and reports the sessions found a
    wrong demo link, inconsistent quoting rules, and no statement of what the software does.
    He updated the README after each session and re-tested with the next person, so every
    fix was checked by a reader who had not seen the previous version.
  why: >-
    The defects found are the class an author cannot see, because they follow from knowing
    the system, and the method that produced them is cheap.
