- title: >-
    SQLite 3.54.0 drops Windows XP support, deprecates sqlite3_analyzer, and removes the go
    and slash command terminators
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    SQLite 3.54.0 drops Windows XP, deprecates sqlite3_analyzer, and removes the bare go and
    slash statement terminators.
  summary: >-
    Three changes break working setups. Scripts that end a statement with a bare go or slash
    now fail unless the CLI is rebuilt with SQLITE_SHELL_LEGACY_COMMAND_TERMINATOR, the separate
    sqlite3_analyzer utility is deprecated in favour of a diskused() extension and a .diskused
    dot-command, and Windows builds now require Vista or later. The release log measures about
    4 percent fewer CPU cycles on speedtest1, and about 7.5 percent fewer than 3.51.0 a year
    ago.
  why: >-
    The breaking changes sit in the CLI and the Windows build target, so an upgrade needs
    a script audit rather than a version bump.
