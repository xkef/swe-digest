- title: >-
    Ransomware takes down IDCF Cloud East Japan Region 1, affecting 495 companies and local
    governments
  section: Outages
  category: Outage
  status: confirmed
  blurb: >-
    Ransomware took IDCF Cloud's East Japan Region 1 offline, hitting 495 customers including
    local governments.
  summary: >-
    IDC Frontier reports ransomware disrupted IDCF Cloud East Japan Region 1, affecting 495
    companies and local government bodies. Management console access was disabled across every
    other region while the provider verified them. The attacker's console message claims 239
    hypervisors, 16,000 VM disks and 554,153 wiped snapshots, which are claims rather than
