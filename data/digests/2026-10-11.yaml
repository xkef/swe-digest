- title: >-
    Cisco patches five critical NX-OS flaws giving root on Nexus switches, and a CVSS 10.0
    signature-verification flaw in Cisco License
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Cisco patched five critical NX-OS root flaws on Nexus switches plus a CVSS 10.0 signature-verification
    flaw in Cisco License.
  summary: >-
    Cisco's advisory covers five critical NX-OS flaws that give root on Nexus switches, each
    reachable only when a specific feature is enabled, with NX-API, NGOAM and MPLS OAM named.
    The five affect Nexus 3000 and Nexus 9000 Series switches in standalone NX-OS mode only,
    Cisco states Nexus 7000 switches and Nexus 9000 switches in ACI mode are not affected
    by any of them, and fixed NX-OS releases are identified per device through Cisco's Software
    Checker rather than published as a single build. A separate set of flaws in Cisco License
    is vulnerable regardless of configuration and has no workarounds, CVE-2026-76482 in that
    set carries CVSS 10.0, and Cisco recommends upgrading Cisco License to version 10-202609.
    Older releases branded Smart Software Manager will not be patched and require migration
    to a supported release, and Live Protect shields are offered for switches that cannot
    be rebooted yet.
  why: >-
    The platform filter comes before any feature audit, because an operator on a Nexus 7000
    or an ACI-mode 9000 is not affected at all and the NX-API, NGOAM and MPLS OAM audit applies
    only to standalone NX-OS 3000 and 9000 switches, while the unconditional CVSS 10.0 Cisco
    License flaw sits ahead of the switch work in a patch queue with 10-202609 as the target
    version.
  sources:
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/cisco-warns-of-critical-flaws-allowing-nexus-switch-takeover/
- title: >-
    One prompt to an exposed Bedrock AgentCore agent yielded credentials for every agent in
    the account and region
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Zenity Labs reports one SSRF prompt to an exposed Bedrock AgentCore agent returned credentials
    for every agent in the region.
  summary: >-
    The Register reports Zenity Labs reached the instance metadata service from an internet-exposed
    AgentCore agent with a single server-side request forgery prompt, because the Firecracker
    MicroVM did not isolate that service, and the default AgentCore role was scoped to every
    AgentCore resource in the region rather than to one agent. The credentials reached session
    transcripts, Secrets Manager, and agent memory writes that persistently hijack goals across
    future sessions. AWS moved AgentCore to IMDSv2 only by 2026-02-14 and closed the report
    as informative on 2026-04-12, Zenity Labs found the overpermissioned role still in place
    on 2026-06-22 and remediated only by 2026-09-29, and Amazon states the research misrepresents
    documented behaviour and would require developer error.
  why: >-
    A default agent role scoped to a whole region turns one exposed agent into account-wide
    credential access, and the memory writes outlive the session that created them.
  followup: >-
    Whether AWS narrows the default AgentCore execution role in documentation as well as in
    the service, and whether Zenity Labs publishes its own write-up, which was not read for
    this item.
  sources:
  - label: The Register
    url: https://www.theregister.com/security/2026/10/09/aws-agentcore-security-undone-by-prompt-requesting-credentials/5302436
  - label: discussion
    url: https://news.ycombinator.com/item?id=50042950
- title: >-
    Booz Allen reports frontier models completed all eight stages of an autonomous attack
    chain against a lab industrial network
  section: Security
  category: Security
  status: developing
  blurb: >-
    Booz Allen reports two unnamed frontier models ran all eight stages of an attack chain
    into its own lab industrial network.
  summary: >-
    The Register reports Booz Allen describing frontier models completing all eight stages
    of an attack chain against an industrial control network, with just over 16 minutes from
    perimeter compromise to action inside it. The described environment included a SCADA gateway
    holding live pre-authenticated sessions to 14 OT devices, so one compromise reached every
    controller behind it. Booz Allen declines to name the two models, the lab is its own,
    and the report itself was not read for this item, so the capability figures are not independently
    reproducible.
  why: >-
    The narrow claim is the part that carries, that obscure OT protocols and proprietary hardware
    no longer function as a barrier, because an agent can be asked to learn them.
  followup: >-
    Whether Booz Allen names the models or publishes a reproducible method, and whether any
    independent lab repeats the chain.
  sources:
  - label: The Register
    url: https://www.theregister.com/security/2026/10/11/ai-systems-are-fully-capable-of-carrying-out-nightmare-attacks-against-infrastructure-and-nobodys-ready/5302450
- title: >-
    Citrix patches CVE-2026-107406, a critical NetScaler memory overflow reachable in SAML
    configurations
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Citrix patched CVE-2026-107406, a critical NetScaler memory overflow reachable only when
    the appliance is a SAML IdP or SP.
  summary: >-
    Citrix published a fix for CVE-2026-107406, a critical memory overflow affecting NetScaler
    ADC and NetScaler Gateway, and only on appliances configured as a SAML identity provider
    or service provider. The fixed builds are 14.1-73.46 and later, 13.1-64.29 and later releases
    of 13.1, NetScaler ADC 14.1-FIPS 14.1-73.46 FIPS and later, and 13.1.37.283 and later
    for 13.1-FIPS and 13.1-NDcPP. Citrix reports no known exploitation, and the configuration
    dependency makes exposure narrower than the roughly 21,000 internet-facing NetScaler fingerprints
    suggest.
  why: >-
    The configuration audit comes before the patch here, and the same product line had two
    actively exploited RCE zero-days in September and an emergency denial-of-service fix earlier
    this month.
  sources:
  - label: BleepingComputer
    url: https://www.bleepingcomputer.com/news/security/citrix-warns-admins-to-patch-new-netscaler-rce-flaw-immediately/
- title: >-
    ClickFix campaign routes Google ads through Bing redirects to a fake Claude installer
    that swaps the clipboard command
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A ClickFix campaign buys Google ads that redirect through Bing to a fake Claude installer
    which swaps the clipboard command.
  summary: >-
    The campaign runs Google ads whose displayed destination is bing.com, redirecting to a
    page that imitates Anthropic's Claude install instructions. The page displays the real
    install command while the copy button places a different one on the clipboard.
  why: >-
    A developer who reads the page, copies, and pastes into a terminal sees the legitimate
    URL at every step and still executes an attacker script.
