- title: >-
    Valen's borrow checker records the path each reference points to, relaxing shared-xor-mutable
    to no-use-after-free
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Valen's borrow checker tracks the path each reference points to, replacing shared-xor-mutable
    with a no-use-after-free rule.
  summary: >-
    The post describes group borrowing in Valen, where the borrow checker records which path
    a reference points to rather than only whether a borrow is shared or mutable. That admits
    patterns borrow checkers normally reject, including multiple read-write references to
    one object and a ScopeGuard-style rollback struct, because the property checked is use-after-free
    rather than aliasing. Some syntax used in the post is planned for November rather than
    shipped.
  why: >-
    It is a worked alternative to shared-xor-mutable that keeps memory safety as the enforced
    property, and the author's account of adoption by other languages is his own and not verified
    here.
  sources:
  - label: primary
    url: https://verdagon.dev/blog/valen-group-borrowing
  - label: discussion
    url: https://news.ycombinator.com/item?id=50042362
- title: >-
    LineageOS 24.0 releases on Android 17 with browser-based WebUSB flashing and an experimental
    bare-metal target
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    LineageOS 24.0 ships on Android 17 with browser-based WebUSB flashing and an experimental
    generic bare-metal target.
  summary: >-
    The changelog states security patches from 2025-08 through 2026-10 are merged across 18.1
    to 24.0, and that new WebUSB tools at flash.lineageos.org drive ADB, Fastboot, Amlogic
    Burn and Samsung Odin from the browser, reducing the need to find, install and run separate
    flashing utilities. For devices on 4.4 and 4.9 kernels the project will now accept only
    LineageOS 22.2 submissions, giving as the reason that the legacy platform commits are
    hacky and difficult to keep pulling forward, and it states separately that 23.2 and 24.0
    ship only kernels with 1:1 eBPF backports that build without GCC. Some 4.4 and 4.9 devices
    have already been ported to 23.2 and 24.0, so the policy limits new official submissions
    rather than those devices' versions, and an experimental generic target has booted on
    x86_64 PCs, Apple Silicon Macs, an NVIDIA DGX Spark and Snapdragon X laptops.
  why: >-
    New official submissions for 4.4 and 4.9 kernel devices stop at LineageOS 22.2, and browser
    flashing is an additional option whose availability varies by device, browser, operating
    system and USB connection rather than a replacement for the per-device Wiki instructions,
    which remain the supported path.
  sources:
  - label: primary
    url: https://lineageos.org/Changelog-32/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50040276
- title: >-
    NVIDIA releases Boro, an Apache-2.0 Rust CLI for local AI-assisted Linux kernel development
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    NVIDIA released Boro, an Apache-2.0 Rust CLI that drives models to validate kernel backports,
    builds and boot tests.
  summary: >-
    Boro is a Rust command-line tool released under Apache-2.0 for AI-assisted Linux kernel
    development. It targets validating backports to older kernels and building, booting and
    testing patches, with detection of out-of-tree module breakage planned. Any OpenAI-compatible
    endpoint is the primary interface through BORO_URL, BORO_KEY and BORO_MODEL, with local
    Ollama documented as one instance of that and Claude, OpenCode and Codex back-ends offered
    as an alternative to supplying an API key.
  why: >-
    The README's stated workflow is explicitly mixed, cheap local models on the broad and
    specialist passes with a stronger remote model on the validation stages, and the work
    it automates is the unglamorous validation path rather than patch authoring.
  sources:
