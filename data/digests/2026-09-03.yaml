- title: >-
    Polars 2.0 release candidate makes the streaming engine the default and drops the row-order
    guarantee for joins and group_by
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    The Polars 2.0 release candidate makes the streaming engine default and drops row-order
    guarantees for joins and group_by.
  summary: >-
    The announcement states the streaming engine becomes the default in 2.0, and that joins,
    `group_by` and unpivot no longer guarantee row order. Restoring the previous behaviour
    takes an explicit `maintain_order` argument on the operation or a process-wide engine
    affinity setting. The build announced is a release candidate rather than final 2.0.
  why: >-
    A pipeline that reads row order out of a join, `group_by` or unpivot changes behaviour
    on upgrade without raising an error.
  followup: >-
    Track the final 2.0 release and whether the default engine choice changes before it.
  sources:
  - label: primary
    url: https://pola.rs/posts/announcing-polars-2/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49546753
- title: >-
    Wasmi 2.0 reports a 2.2x execution speedup and publishes the interpreter design behind
    it
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Wasmi 2.0 reports a 2.2x geometric-mean speedup over 1.0 and publishes the interpreter
    changes behind it.
  summary: >-
    The release note reports 2.2x over Wasmi 1.0 in geometric mean across the wasmi-benchmarks
    suite on an Apple M2 Pro, run on three hardware setups including AMD EPYC 7763 and Intel
    Xeon Platinum 8370C, against Wasm3, WAMR fast-interpreter, Wasmtime Pulley and Makepad
    Stitch, from a benchmark project the author states is reproducible. The post details the
    changes: four instruction dispatch modes, three accumulator registers held in hardware
    registers, and a single contiguous instance allocation that removes the dependent-load
    chain behind global access. It also records the costs, that the accumulator design requires
    copy instructions the previous design did not, and a rejected experiment that regressed
    performance on calls.
  why: >-
    Wasmi is the plugin and smart-contract runtime under Typst, Zellij, Soroban and Ripple,
    and the release publishes its method, its comparison set and its regressions rather than
    a single number.
  followup: Track whether the benchmark suite is run independently on non-Apple hardware.
  sources:
  - label: primary
    url: https://wasmi-labs.github.io/blog/posts/wasmi-v2.0/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49521031
- title: >-
    A .name registrant reports ICANN approved destroying the entire third level of the gTLD,
    with reuse of the second level as the stated hijack risk
  section: Infrastructure
  category: Infrastructure
  status: developing
  blurb: >-
    A .name registrant reports ICANN approved retiring the gTLD's entire third level, leaving
    22,000 registrants and a hijack path.
  summary: >-
    Neil Fraser writes on his own .name domain that Verisign proposed the change on 2026-04-15,
    that ICANN approved it on 2026-07-28, that the third-level service ends in February, and
    that 22,000 registrants are affected. His stated risk is what follows the shutdown: if
    the vacated second-level names become registrable, whoever takes fraser.name can recreate
    the third-level address and reach accounts and devices still keyed to it. No ICANN record
    for the approval was resolved in this run across three attempts, so the block rests on
    the author's account.
  why: >-
    Third-level .name addresses are used as mail and account identifiers, and reassignment
    of the second level would hand those identifiers to a new party.
  followup: >-
    Track whether the ICANN amendment record for the .name registry agreement is published,
    and whether second-level registration opens for vacated names.
  sources:
  - label: primary
    url: https://neil.fraser.name/news/2026/09/03/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49550772
- title: >-
    A developer emulating fused multiply-add finds the same subnormal rounding bug in Rust's
    standard library and in musl libc
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    A developer emulating fused multiply-add found the same subnormal rounding bug in Rust's
    std and in musl libc.
  summary: >-
    The post is dated 2026-08-20 and reports two of the defects it describes already fixed,
    with the Rust standard library patch awaiting review and the musl fix not merged. Sergey
    Davidoff reports that Rust's `f32::mul_add` software fallback and `std::simd` mishandle
    rounding for subnormal values, that musl's `fmaf` carries the same check ignoring subnormals,
    and that musl credits the code to FreeBSD with copyright years 2005 to 2011, so he states
    it may have been copied further without knowing where. The path runs only on hardware
    without FMA, which he ties to about 15 percent of machines in the Firefox hardware survey
    lacking AVX2, plus 32-bit ARM and embedded targets, and he states the error is one least
    significant bit, that he does not know whether it matters, and that deterministic simulations
    across different machines would diverge.
  why: >-
    The post publishes the input bit patterns a=0x97000800, b=0x1cfff001, c=0x00010002 and
    states that `fmaf` must return 0x00010001 rather than the buggy 0x00010002, so a reader
    can run the case against their own toolchain.
  followup: >-
    Track whether the Rust patch lands and whether musl merges a fix, and whether the FreeBSD-derived
    code appears in other libcs.
  sources:
  - label: primary
    url: https://shnatsel.github.io/implementing-fma-finding-bugs-in-std/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49539006
