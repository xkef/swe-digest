- title: >-
    Meta ships Muse Spark 1.3 to Muse Code and the Meta Model API, holding max reasoning back
    for safety testing
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Meta shipped Muse Spark 1.3 to Muse Code and its Model API, holding the max reasoning
    mode back for safety testing.
  summary: >-
    Meta states the model is available today in Muse Code and the Meta Model API, and that
    the max reasoning mode is coming shortly after it finishes additional safety testing.
    Every coding figure in the post is Meta's own internal comparison against Muse Spark 1.2,
    roughly 20 percent fewer tool calls and roughly 25 percent fewer tokens, with no external
    evaluation cited. Meta states an open weights release for Muse Spark is on the roadmap
    and gives no date.
  why: >-
    The generally available model is not the full model, because the mode Meta rates as needing
    more safety testing is the one held back, and the efficiency figures a team would plan
    against are unaudited vendor numbers.
  followup: >-
    Track when the max reasoning mode is released, whether any external evaluation reproduces
    the tool call and token reductions, and whether the open weights release gets a date.
  sources:
  - label: primary
    url: https://research.meta.ai/blog/introducing-muse-spark-1-3
  - label: discussion
    url: https://news.ycombinator.com/item?id=49541256
  - label: second thread
    url: https://news.ycombinator.com/item?id=49541149
- title: >-
    GitHub measures that shortening agent tool output raised total task cost in its own harness
  section: Top stories
  category: Agentic coding
  status: confirmed
  blurb: >-
    GitHub reports that truncating agent tool output with RTK raised total token use and task
    time in its own harness.
  summary: >-
    GitHub evaluated RTK, a utility that truncates shell output before the agent reads it,
    and reports that when the omitted text mattered the model sometimes reopened the original
    output or reran the command to recover what it needed, so the task on average used more
    tokens and took longer. GitHub scopes the result to the integration and workloads it tested
    rather than to output compression in general. It states the four changes it did ship were
    picked offline on agentic coding benchmarks and then validated in controlled online A/B
    experiments.
  why: >-
    Shortening each tool response is a common way to cut agent spend, and GitHub publishes
    a measurement in which that move raised the cost of the whole task rather than lowering
    it.
  followup: >-
    Track whether GitHub publishes the harness or the workload set behind the RTK result.
  sources:
  - label: primary
    url: https://github.blog/ai-and-ml/github-copilot/how-we-make-ai-coding-more-cost-efficient-without-sacrificing-task-quality/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49545164
- title: >-
    Cursor moves cloud-agent tool execution onto customer machines while the agent loop and
    transcripts stay in its cloud
  section: Top stories
  category: Agentic coding
  status: confirmed
  blurb: >-
    Cursor's Self-Hosted Machines runs agent tools on customer hardware while inference, planning
    and transcripts stay in its cloud.
  summary: >-
    Cursor states that Self-Hosted Machines moves only the execution environment, that inference
    and planning stay in its cloud, that tool outputs flow back to Cursor and may contain
    code, and that agent transcripts may be processed and stored by Cursor. Workers open an
    outbound HTTPS connection, and Cursor states it never initiates a connection into the
    customer network. Cursor states cloud agents now create more than 60 percent of the pull
    requests it merges internally, which is its own unaudited figure.
  why: >-
    The self-hosted label covers where tools run and not where code and transcripts end up,
    which is the distinction a team adopting this on compliance grounds has to read the post
    to find.
  followup: >-
    Track whether Cursor documents retention for agent transcripts and tool outputs under
    this deployment model.
  sources:
  - label: primary
    url: https://cursor.com/blog/self-hosted-machines
  - label: discussion
    url: https://news.ycombinator.com/item?id=49546217
