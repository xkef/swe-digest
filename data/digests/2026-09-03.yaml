date: '2026-09-03'
stories:
- title: >-
    Nvidia agrees to acquire Hugging Face for $12.93 billion and states its own compute will
    not be required
  section: Top stories
  category: Markets
  status: confirmed
  blurb: >-
    Nvidia agreed to acquire Hugging Face for $12.93 billion and states its own compute will
    not be required to use the platform.
  summary: >-
    Nvidia states the price is $12,930,300,000 and that using Hugging Face will not require
    Nvidia compute, in a post published under Jensen Huang's name. Every commitment against
    lock-in in that post is the acquirer's own sentence rather than a term a party outside
    Nvidia can enforce. The CNBC interview, and not the Nvidia post, references the July 2026
    breach of Hugging Face, with Clement Delangue attributing it to engineering mistakes and
    Huang arguing open models give defenders an asymmetric advantage.
  why: >-
    The default distribution point for open weights changes owner to the dominant accelerator
    vendor, and the only commitments against lock-in are sentences in the acquirer's own announcement.
  followup: >-
    Track whether the commitment that Nvidia compute is not required appears in any binding
    term, and whether hosting, access or licensing terms on Hugging Face change under the
    new owner.
  sources:
  - label: primary
    url: https://blogs.nvidia.com/blog/nvidia-to-acquire-hugging-face/
  - label: CNBC
    url: https://www.cnbc.com/2026/09/03/nvidia-agrees-to-buy-hugging-face-for-almost-13-billion-ai-expansion.html
