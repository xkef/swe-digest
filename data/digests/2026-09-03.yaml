- title: >-
    Anthropic ships a browser-side checker for C2PA content credentials on files Claude produced
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Anthropic shipped a browser-side page that reads C2PA content credentials on files Claude
    produced, text excluded.
  summary: >-
    The page states what the tool cannot do: it identifies only the content credential, which
    says Claude was involved in producing the file, and it cannot tell whether Claude was
    involved in creating the content. Anthropic states the check runs in the browser, that
    the file never leaves the device, and that the format is the C2PA industry standard readable
    by any C2PA-aware tool. Detecting the separate text watermark runs through a Detection
    API that Anthropic states is in private preview to eligible organizations as required
    under EU law, so the public tool covers files and not text.
  why: >-
    The public check answers provenance of a file rather than authorship of its content, and
    the text case is gated behind an application rather than shipped.
  followup: Track whether the Detection API for text opens beyond private preview.
  sources:
  - label: primary
    url: https://claude.com/check-content
  - label: discussion
    url: https://news.ycombinator.com/item?id=49535201
- title: >-
    Multiverse Computing releases Quasar 438B and cites Artificial Analysis for a score of
    43 on its intelligence index
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Multiverse Computing released Quasar 438B and cites Artificial Analysis scoring it 43
    on its intelligence index.
  summary: >-
    Every figure in the post is attributed to Artificial Analysis, a named third-party evaluator
    running a published composite of nine evaluations, rather than to an internal benchmark.
    The leading claim is scoped to European models: 43 against Mistral Medium 3.5 at 30, NVIDIA
    Nemotron 3 Ultra at 38 and Inkling at 42, in a field the vendor states is led by Claude
    Opus 5 at 63. The company also reports 75.0 on AA-LCR, 69.3 on Terminal-Bench v2.1, and
    15.3 seconds to return 500 tokens including reasoning time, and states this is its first
    large model, running in English and Spanish through the CompactifAI API.
  why: >-
    The vendor's own headline claim is bounded to a regional field and rests on a third-party
    evaluator's published composite rather than on numbers it produced itself.
  followup: Track whether Quasar 438B appears in evaluations outside Artificial Analysis.
  sources:
