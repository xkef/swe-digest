date: '2026-06-28'
stories:
- title: Anonymous GitHub account dumps exploit PoCs framed as undisclosed 0-days
  section: Top stories
  category: Security
  blurb: >-
    An anonymous account published exploits framed as 0-days, but researchers assessed them
    as rederived PoCs for documented CVEs, still functional.
  summary: >-
    An anonymous GitHub account ("exploitarium") published a single archive of working exploit
    proof-of-concepts with a note that none were reported at posting time, inviting readers
    to report them and claim any assigned CVE. A FemtoSec threat-intelligence writeup assessed
    the archive as rederived public exploits for already documented vulnerabilities, not genuine
    unpatched 0-days, naming CVE-2026-55200 (libssh2 heap overflow, CVSS 9.2), CVE-2026-20896
    (Gitea auth bypass, CVSS 9.8), and CVE-2025-62408 (c-ares DoS), and noting the PoCs remain
    highly functional against unpatched systems.
  why: >-
    Mass-publishing functional PoCs without coordination shifts patch pressure onto maintainers
    and defenders and feeds the AI-accelerated vulnerability-disclosure debate.
  followup: >-
    Watch for GitHub takedown of the archive, CVE assignments, and any in-the-wild use of
    the bundled PoCs.
  comments: >-
    HN commenters questioned whether the items are true 0-days, several arguing many trace
    to already-fixed CVEs and that "0-day" has lost meaning; one walked through the c-ares
    use-after-free; another noted the volume and documentation looked machine-assisted.
  sources:
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48698617
  - label: threat analysis
    url: https://femtosec.io/threat-intelligence/exploitarium-repo-fake-zero-day-real-risks
- title: Asian AI labs ship Mythos-style cyber models as Anthropic export ban persists
  section: Top stories
  category: AI
  blurb: >-
    Sakana AI released Fugu and 360 unveiled Tulongfeng, security-focused models filling the
    US export-ban gap for Anthropic Mythos and Fable.
  summary: >-
    TechCrunch reported 2026-06-27 that at least two non-US labs launched security-focused
    models into the gap left by the US foreign-access ban on Anthropic Mythos 5 and Fable
    5: Tokyo-based Sakana AI released Fugu, an agent-oriented model it claims stands alongside
    Fable 5 and Mythos Preview and can orchestrate other models through their APIs, and Chinese
    security firm 360 unveiled Tulongfeng for vulnerability discovery. The capability claims
    are the vendors' own and are not independently verified.
  why: >-
    Export controls on a single US cyber-capable model are prompting local substitutes, weakening
    the controls' practical effect and spreading vulnerability-discovery capability across
    jurisdictions.
  followup: >-
    Watch for independent benchmarks of Fugu and Tulongfeng, weight or API availability, and
    whether the Mythos 5 US clearance (2026-06-26) blunts demand for alternatives.
  sources:
  - label: TechCrunch
    url: https://techcrunch.com/2026/06/27/asian-ai-startups-launch-mythos-like-models-as-anthropics-export-ban-drags-on/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48697958
- title: Codeberg offline after power loss at primary location
  section: Top stories
  category: Outage
  blurb: >-
    The nonprofit Forgejo platform went offline after a power outage at its primary location,
    blocking pushes, pulls, and issue access for users.
  summary: >-
    Codeberg, the nonprofit Forgejo-based code-hosting platform, went fully offline early
    2026-06-28 (reported from ~00:18 CEST) after a power outage at its primary location took
    down most of its servers. The provider attributed the outage to the power event on its
    status page; no restoration time was given at run time.
  why: >-
    Codeberg hosts many open-source projects and CI mirrors, so a full outage blocks pushes,
    pulls, and issue access for dependent workflows.
  followup: >-
    Watch for restoration, any data-integrity statement, and a post-incident note on power
    redundancy.
  sources:
  - label: Codeberg status
    url: https://status.codeberg.org/status/codeberg
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48701342
- title: RiVER trains LLMs with reinforcement learning and no ground-truth answers
  section: ML research
  category: Paper
  blurb: >-
    RiVER applies RL to score-based tasks without ground truth, using deterministic execution
    feedback as a continuous-valued reward signal.
  summary: >-
    A preprint introduces RiVER (Ranking-induced VERifiable framework), which applies reinforcement
    learning to score-based tasks without ground-truth solutions by using deterministic execution
    feedback as continuous-valued reward. The authors identify and address two failure modes
    of group-relative RL on continuous rewards: scale dominance, where uncalibrated score
    magnitudes across instances distort updates, and a calibration issue in reward normalization.
  why: >-
    Removing the ground-truth requirement extends RLVR-style post-training to optimization
    and coding tasks where only an executable scorer exists, not a labeled answer.
  followup: >-
    Watch for code release and independent reproduction beyond the paper's own evaluation.
  sources:
  - label: arXiv 2606.27369
    url: https://arxiv.org/abs/2606.27369
- title: Codex still lacks a built-in way to exclude sensitive files from agent reads
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    A long-open enhancement request seeks to prevent sensitive files like .env from being
    read by Codex agents, keeping secrets out of model context.
  summary: >-
    A long-open OpenAI Codex enhancement request, "A way to exclude sensitive files" (opened
    2025-08-28, labeled enhancement and sandbox, 84 comments, still open), resurfaced on Hacker
    News on 2026-06-28. The request asks for a mechanism to keep files such as `.env` and
    credential stores out of the set the coding agent can read, so secrets do not enter the
    agent context or get sent to the model. No resolution had shipped at run time.
  why: >-
    Coding agents read repository files by default, and the absence of a first-class exclude
    mechanism leaves secret-hygiene to ad hoc sandboxing, a recurring practitioner concern
    as agent adoption grows.
  followup: >-
    Watch for a built-in ignore or exclude feature in Codex and whether other agents standardize
    a sensitive-file boundary.
  sources:
  - label: GitHub issue openai/codex#2847
    url: https://github.com/openai/codex/issues/2847
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48706714
