- title: ClickHouse rewrites WAL-G PostgreSQL backups in Rust as WAL-RUS
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    ClickHouse released WAL-RUS, a Rust port of WAL-G, reducing memory usage by 70% through
    streaming I/O on no-overcommit hosts for Postgres.
  summary: >-
    ClickHouse published WAL-RUS on 2026-06-25, a Rust port of the Go-based WAL-G PostgreSQL
    backup and write-ahead-log archival tool, built to bound memory use on no-overcommit hosts
    through streaming I/O without full-segment buffering. ClickHouse's own benchmark reports
    WAL-RUS held virtual memory under 1 GB where WAL-G reached about 2.8 GB, a reduction above
    70 percent, while both kept minimal WAL backlog under four concurrent workers. It reuses
    the existing `WALG_` configuration variables, reads and writes WAL-G-compatible archives,
    and supports file, S3, and GCS backends with zstd, brotli, lz4, lzma, and gzip compression.
  why: >-
    Memory-bounded WAL archival matters for dense Postgres fleets where WAL-G's per-segment
    buffering can exhaust constrained hosts, and archive compatibility lets operators adopt
    it incrementally.
  followup: >-
    Watch for a tagged release, an explicit license declaration (the repository currently
    carries an unrecognized license file), and independent benchmarks outside ClickHouse Cloud.
  sources:
  - label: ClickHouse blog
    url: https://clickhouse.com/blog/walrus-postgres-backups-in-rust
  - label: repository
    url: https://github.com/ClickHouse/wal-rus
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48702848
