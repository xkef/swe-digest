- title: Teardown of Reddit's anti-spam internals
  section: Engineering posts
  category: Engineering post
  blurb: >-
    An independent researcher documented Reddit's spam pipeline combining Perspective API,
    Lua rules, Flink streaming, OCR, and live URL inspection.
  summary: >-
    Independent researcher Lyra (rebane2001) published a 2026-06-27 reconstruction of Reddit's
    spam-detection stack, assembled partly from an accidental internal exposure encountered
    while moderating subreddits in 2021. It describes layered systems: an integration of Google's
    Perspective API scoring an experimental spam attribute, a likelihood scorer the author
    calls Spammit, a Lua rules engine with a keyword-filter subsystem, and newer streaming
    pipelines built on Flink Stateful Functions with OCR, alongside TLS and browser fingerprinting
    and live URL inspection that follows redirects to correlate embedded analytics identifiers.
  why: >-
    It documents how a large platform combines heuristic scoring, rules engines, and streaming-ML
    pipelines for abuse detection, a concrete reference for teams building spam and anti-abuse
    systems.
  sources:
  - label: lyra.horse post
    url: https://lyra.horse/blog/2026/06/reddit-spam-internals/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48699010
- title: Clustering two AMD Strix Halo machines over RDMA for local LLM inference
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A guide clusters two AMD Strix Halo machines over 100G RDMA for tensor-parallel inference,
    noting PCIe 4.0 and memory-bandwidth constraints.
  summary: >-
    A practitioner setup guide documents clustering two AMD Strix Halo machines (Framework
    Desktop boards, 128 GB unified memory each) over RDMA using ConnectX-5 100G NICs to run
    larger open-weight models such as DeepSeek V4 Flash and GLM 5.2 via tensor parallelism.
    The guide notes the PCIe 4.0 x4 slot (about 64 Gbps) bottlenecks the 100G NIC and that
    Strix Halo memory bandwidth (around 300 GB/s) trails Apple Silicon (600+ GB/s), with Thunderbolt
    offered as a lower-latency alternative interconnect.
  why: >-
    It is a concrete reference for building multi-node local inference on consumer AMD hardware,
    where memory bandwidth and interconnect choice, not raw compute, govern usable model size
    and speed.
  comments: >-
    HN commenters reported Strix Halo board prices have risen sharply since launch, narrowing
    the cost gap to Apple hardware, and debated whether the local-inference build is cost-effective
    against cloud subscriptions given the bandwidth limits.
  sources:
  - label: setup guide
    url: https://github.com/kyuz0/amd-strix-halo-vllm-toolboxes/blob/main/rdma_cluster/setup_guide.md
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48703258
- title: Google caps Meta's Gemini capacity amid compute shortage
  section: Markets and companies
  category: Markets
  blurb: >-
    Google limited Meta's Gemini access after demand exceeded available capacity around March,
    disrupting and delaying some Meta AI projects.
  summary: >-
    The Financial Times reported 2026-06-28 that Google limited Meta's use of its Gemini models
    after Meta sought more capacity than Google could supply, telling Meta around March it
    could not meet the full purchase. The shortfall disrupted and delayed some Meta AI projects,
    and Meta told staff to use AI tokens more efficiently. Other Google cloud customers faced
    capacity limits too, but Meta was hit hardest because its demand was especially high.
    Reuters and CNBC carried the FT report; Google and Meta did not confirm specifics.
  why: >-
    A frontier-model provider rationing capacity to a major customer shows AI compute scarcity
    now constrains roadmaps even for the largest buyers, raising the cost of single-provider
    model dependence.
  followup: >-
    Watch for confirmation from Google or Meta, Meta's mitigation (in-house models or alternative
    providers), and whether quota limits widen to other Gemini API customers.
  sources:
  - label: CNBC
    url: https://www.cnbc.com/2026/06/28/google-limits-metas-use-of-its-gemini-ai-models-ft-reports.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48707103
- title: Austria lobbies EU to host Anthropic after US foreign-access curbs
  section: Markets and companies
  category: Markets
  blurb: >-
    Austria proposed the EU host Anthropic within the bloc, responding to US export-control
    rules limiting foreign access to Fable and Mythos.
  summary: >-
    Bloomberg reported 2026-06-28 that Austrian State Secretary for Digitalization Alexander
    Proell wrote to European Commission Executive Vice President Henna Virkkunen proposing
    the EU explore "the strategic establishment and participation of Anthropic within the
    European Union," offering legal certainty, market access, and capital. The move responds
    to the 2026-06-12 US export-control directive that blocked all foreign-national access
    to Anthropic Fable 5 and Mythos 5.
  why: >-
    A member-state push to host a US AI lab inside the EU signals that the export curbs are
    reshaping platform-location and sovereignty calculus, with downstream effects on where
    frontier models can be accessed and governed.
  followup: >-
    Watch for a European Commission response, any Anthropic statement on EU establishment,
    and whether other member states join the proposal.
  sources:
