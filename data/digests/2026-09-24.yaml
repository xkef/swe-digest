- title: arXiv receives 17.2 million dollars to launch as an independent nonprofit
  section: Top stories
  category: Infrastructure
  blurb: >-
    arXiv received 17.2 million dollars in multiyear commitments to run as an independent
    nonprofit for three to five years.
  summary: >-
    arXiv announced 17.2 million dollars in multiyear commitments supporting it as an independent
    nonprofit. The post states three to five years of runway and names management of AI-generated
    content as a spend target.
  why: >-
    The preprint server most engineers read gets three to five years of funded runway, and
    the announcement names management of AI-generated content as a specific spend target.
  sources:
  - label: primary
    url: https://blog.arxiv.org/2026/09/23/arxiv-receives-multiyear-investment/
  - label: discussion
