- title: PostgreSQL 19 loses features to a scary patch contest and is likely to slip
  section: Infrastructure
  category: Infrastructure
  status: developing
  blurb: >-
    PostgreSQL 19 lost SQL property graph queries in a scary patch contest, and the release
    is likely to slip past September.
  summary: >-
    SQL property graph queries were backed out of both PostgreSQL 19 and master. REPACK took
    28 post-freeze fixes, including a data loss fix and two ACL fixes. A fourth beta was added
    to the cycle. Article dated 2026-09-10.
