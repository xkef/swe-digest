- title: A researcher publishes the full LuaRocks.org exploit chain
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    A researcher published the full LuaRocks.org exploit chain, from a LuaJIT bytecode instruction
    to what the author reports as root access.
  summary: >-
    The writeup traces the chain end to end, starting from a LuaJIT bytecode instruction the
    sandbox did not account for. The author states the outcome as root access on the server,
    and the demonstration described in the body runs against a local Docker copy of luarocks-site
    rather than the live registry, so the root-access outcome is the author's claim rather
    than an observed compromise of LuaRocks.org. The sandbox itself was carefully built, and
    the defeat came from the registry accepting precompiled bytecode rather than source only.
    The writeup assigns no CVE identifier and names no affected luarocks-site version, so
    the affected range is not yet known.
  why: >-
    The writeup shows a well built Lua sandbox defeated entirely by accepting precompiled
    bytecode, which is the same mistake any registry that evaluates user-supplied manifests
    in-process can make.
  followup: >-
    The LuaRocks incident led the 2026-09-27 digest and now has a complete public exploit
    chain, so track remediation on the registry and whether other package registries that
    accept bytecode respond.
  sources:
  - label: writeup
    url: https://vhyrro.neorg.org/posts/critical-luarocks-exploit-cve/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49870377
- title: Cloudflare reports a cross-tenant data exposure in Containers and Sandboxes
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Cloudflare fixed a cross-tenant exposure in Containers and Sandboxes where reused storage
    blocks were handed over without zeroing.
  summary: >-
    A shared storage pool was configured to skip zeroing reused 64 KiB blocks, so when a container's
    thin volume was deleted its physical blocks went back to a pool serving multiple customer
    accounts, and writing only 4 KiB into an unused region of a new container's disk allocated
    a reused block and left the remaining 60 KiB readable. Researchers found residual material
    on 18 of 24 container placements and across 20 of 22 underlying nodes tested, including
    directory structures, database pages, and structurally complete SQLite databases, but
    their scripts returned aggregate counts rather than disk contents, so no real customer
    data was exposed in the evaluation, and Cloudflare states it found no evidence in logs,
    telemetry, or historical data that customer data was exposed by this method. Oren Yomtov
    reported it through HackerOne on 2026-09-04, and Cloudflare removed the setting, retired
    existing container disks and cleared cached snapshots that could hold old mappings, finishing
    on 2026-09-19, and states customers need take no action.
  why: >-
    The isolation boundary that multi-tenant serverless platforms are sold on failed here
    on a storage configuration setting rather than a code defect, so anyone running multi-tenant
    thin-provisioned storage should check whether block reuse is zeroed.
  followup: >-
    Cloudflare's blog index lists a Containers disclosure post dated 2026-09-24 that no slug
    resolved to automated fetch, so watch for that vendor post becoming reachable, and for
    further multi-tenant findings from Accomplish, credited with this report and with the
    SharedRoot Claude Cowork sandbox escape.
  sources:
  - label: report
    url: https://www.bleepingcomputer.com/news/security/cloudflare-fixes-containers-cross-tenant-flaw-exposing-customer-data/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49870848
- title: Nvidia Open Agent Safety Platform moves agent enforcement below the harness
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Nvidia's Open Agent Safety Platform puts agent policy enforcement in a runtime and a DPU
    watchdog outside the agent harness.
  summary: >-
    Nvidia's stated premise is that across recent incidents the agent circumvented security
    controls at the application layer, so the boundary has to sit outside the model and the
    agent harness. OpenShell is open-source secure-runtime software, now broadly available,
    that traces all agent actions and enforces policy, runs on Nvidia Vera CPUs with stated
    extensibility to Arm and Intel, while Sentry is a reference system design running as an
    out-of-band watchdog on BlueField-4 DPUs, built on DOCA for request and response inspection,
    attested telemetry, agent identity verification and zero-trust access policy for data,
    tools, APIs and services. Nvidia names Anthropic, Salesforce, SAP, Canonical, SUSE and
    Red Hat among those integrating it and says Sentry quarantines an agent that leaves its
    software boundary within milliseconds, but the adoption counts and performance claims
    are Nvidia's own and the release carries forward-looking-statement language.
  why: >-
    If enforcement moves into a runtime and a DPU trust domain the agent cannot see, containment
    stops depending on the application-layer controls that the recent incidents went around.
  followup: >-
    Track whether Nvidia publishes any OpenShell overhead figure at all, since the release
    states only minimal overhead, plus independent measurement of the stated Sentry quarantine
    latency and whether the named vendor integrations ship.
  sources:
  - label: primary
    url: https://nvidianews.nvidia.com/news/open-agent-safety-platform
  - label: developer blog
    url: https://developer.nvidia.com/blog/nvidia-open-agent-safety-platform-a-reference-for-continuous-in-silicon-agent-monitoring/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49875500
  - label: discussion
    url: https://news.ycombinator.com/item?id=49879883
- title: ShinyHunters bypasses PeopleSoft WAF rules with a percent-encoded path
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    ShinyHunters bypassed PeopleSoft WAF rules with a percent-encoded path, invalidating the
    mitigation Mandiant advised in June.
  summary: >-
    The group requests /%50SEMHUB/ instead of /PSEMHUB/, so a WAF rule matching the literal
    endpoint string does not fire while the application server decodes the path and serves
    the request, which invalidates the endpoint-blocking mitigation Mandiant recommended in
    June for CVE-2026-35273. Mandiant advises operators to search WebLogic access logs for
    both forms and states the actual fix is the Oracle security update rather than any WAF
    rule, while Google warns the group may switch to other percent-encoded or mixed-case variants.
    Affected PeopleSoft versions are not stated in the available reporting, and Mandiant's
    own report URL did not resolve, so the detail here comes from BleepingComputer quoting
    it, which is why this sits last in Top stories on a single source.
  why: >-
    Any defence that pattern matches a request path before the application server decodes
    it can be stepped around by encoding one character, so operators who blocked an endpoint
    at the WAF instead of patching CVE-2026-35273 are exposed again.
  sources:
  - label: report
    url: https://www.bleepingcomputer.com/news/security/shinyhunters-uses-waf-bypass-trick-in-oracle-peoplesoft-attacks/
- title: Nvidia releases Nemotron 3 Diarization as open weights
