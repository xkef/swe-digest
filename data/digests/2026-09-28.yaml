- title: Jens Axboe posts an io_uring RFC that swaps thread identities on block
  section: Linux and kernel
  category: Linux/Kernel
  status: developing
  blurb: >-
    Jens Axboe posted an io_uring RFC that swaps thread identities when an operation is about
    to block, reporting large fsync gains.
  summary: >-
    The RFC pays for a worker thread only when an operation actually blocks, rather than up
    front, by exchanging thread identities at that point. A tmpfs fsync benchmark reported
    a gain of nearly 700 percent, while other gains are more modest and tests that always
    block show regressions, worst at higher queue depth because serialising submissions removes
    the parallelism that immediate worker handoff provided. The approach hooks the scheduler
    and depends on proving nothing else in the kernel holds a reference to the task_struct
    being exchanged, and it was posted 2026-09-17.
  why: >-
    If the task_struct ownership question can be settled, io_uring stops paying worker-thread
    cost for operations that never block.
  followup: >-
    Watch for maintainer response on the scheduler hook and on task_struct reference safety,
    and whether this progresses past RFC.
  sources:
  - label: LWN
    url: https://lwn.net/SubscriberLink/1094303/bf025f98cb71f941/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49871981
