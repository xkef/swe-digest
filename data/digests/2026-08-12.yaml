- title: >-
    Expat 2.8.3 fixes CVE-2026-72522, an out-of-bounds read in UTF-16 decoding reachable over
    the network
  section: Security
  category: Security
  blurb: >-
    Expat 2.8.3 fixes CVE-2026-72522, an out-of-bounds read in UTF-16 decoding causing denial
    of service over the network.
  summary: >-
    Expat 2.8.3 fixes CVE-2026-72522, which the maintainer describes as technically an out-of-bounds
    read in UTF-16 decoding whose practical symptom is easy and reliable denial of service
    through an infinite loop. The maintainer states the flaw needs no local access and that
    the NVD vector nonetheless records the attack vector as Local. The release also fixes
    a regression in 2.8.2 that wrongly rejected XML content of 2 GiB or more as out of memory
    on 32-bit platforms and on 64-bit Windows. The Mozilla Security Team reported the vulnerability.
  why: >-
    Expat is bundled and pinned across a large part of the C and Python stack, so the fix
    has to travel through many vendored copies, and a severity triage that reads the NVD vector
    alone will score it too low.
  followup: Whether the NVD vector is corrected, and downstream rebuilds of vendored copies.
  sources:
  - label: primary
    url: https://blog.hartwork.org/posts/expat-2-8-3-released/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49257903
- title: >-
    GitHub Issues and Pull Requests returned 500 errors for 25 minutes after an index hint
    outlived the index a migration removed
  section: Outages
  category: Outage
  blurb: >-
    GitHub returned 500 errors for 25 minutes when a query hint outlived a database index
    that a migration had removed.
  summary: >-
    GitHub's status page records an incident opened at 16:16 UTC and resolved at 16:41 UTC
    on 2026-08-12, in which requests returned HTTP 500 errors. GitHub attributes the failure
    to a query hint that named a database index a later migration had removed. The closing
    footer names Issues and Pull Requests as affected, while the 16:38 update also names Search,
    so both are recorded here. The status page was read directly at about 16:49 UTC, after
    the cached fetch at 16:40 UTC had captured only the open incident. A detailed root cause
    analysis is still outstanding.
  why: >-
    GitHub published a concrete cause rather than a generic database note, and the shape of
    it is reproducible in any schema-migration pipeline that does not check query hints against
    the post-migration schema.
  followup: GitHub's detailed root cause analysis.
  sources:
  - label: primary
    url: https://www.githubstatus.com/incidents/76t89hbfb09h
  - label: discussion
    url: https://news.ycombinator.com/item?id=49274894
