- title: >-
    xAI launches Grok Bot in beta, gated behind SuperGrok Heavy and Cursor paid tiers
  section: AI
  category: AI
  blurb: >-
    xAI launched Grok Bot in beta behind SuperGrok Heavy and Cursor Ultra subscriptions, with
    always-on agents that share cloud infrastructure.
  summary: >-
    xAI announced Grok Bot in beta as always-on agents that share a computer of their own
    in the cloud, sign into and work across apps, tools, and websites including platforms
    with no clean API or MCP, run in parallel with one bot managing others, message each other
    and coordinate in group chats, and learn a workflow by watching a user perform it once.
    Access is gated behind the SuperGrok Heavy subscription and the Cursor Ultra and Cursor
    Teams Premium tiers, on desktop and iOS, with a macOS download and an enterprise waitlist.
    The capability claims are the announcement's own and were not tested for this digest,
    and the page is branded SpaceXAI with a footer reading X.AI LLC.
  why: >-
    The launch bundles an xAI agent product into Cursor subscriptions, which is a distribution
    change for teams already paying for Cursor.
  sources:
  - label: primary
    url: https://x.ai/news/introducing-grok-bot
  - label: discussion
    url: https://news.ycombinator.com/item?id=49261514
- title: >-
    Qwen publishes 2.4T-parameter weights under a licence requiring a separate agreement above
    50 million dollars of model-as-a-service revenue
  section: AI
  category: AI
  blurb: >-
    Qwen published 2.4T-parameter weights under a licence requiring separate agreement once
    deployment passes 50 million dollars in revenue.
  summary: >-
    Qwen published the Qwen3.8-2.4T-A95B weights on Hugging Face. The `LICENSE` file was read
    directly for this digest, because the model card's licence tag reads only "other", and
    it requires a separate agreement from Qwen once a deployment passes stated thresholds,
    including 50 million dollars of model-as-a-service revenue and a monthly active user count.
    The repository was created 2026-08-08 and last modified 2026-08-12, so no release date
    is claimed here. The model card's own evaluation figures are marked unverified on the
    page and are not published as results.
  why: >-
    The licence rather than the parameter count decides who can serve this model, and the
    thresholds are written in revenue and monthly active users rather than in field of use,
    so a team hosting inference for third parties has a revenue line to check while purely
    internal use is not restricted by the same terms.
