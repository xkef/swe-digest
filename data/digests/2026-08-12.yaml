date: '2026-08-12'
stories:
- title: >-
    OpenSSH 10.5 ships three security fixes and the project will release more often for now,
    after AI-found bugs were independently rediscovered
  section: Top stories
  category: Security
  blurb: >-
    OpenSSH 10.5 ships three security fixes and the project will increase release frequency
    after AI-found bugs were independently rediscovered.
  summary: >-
    The OpenSSH 10.5 release notes record three security fixes. The stated reason for the
    cadence change is independent rediscovery: the project says it has seen a number of cases
    where a security bug identified by AI tools was subsequently found independently by a
    different researcher, which it reads as evidence that adversaries who do not report bugs
    can reach the same bugs, and on that basis the team will for now make more frequent releases.
    The same notes state that many AI reports are determined not to have security impact when
    considered against a realistic threat model.
  why: >-
    OpenSSH sits on nearly every server and developer machine, and the project is changing
    how often it ships rather than only commenting on report volume.
  followup: Whether the stated cadence holds, and what the next releases carry.
  sources:
  - label: primary
    url: https://www.openssh.com/releasenotes.html#10.5
  - label: discussion
    url: https://news.ycombinator.com/item?id=49261895
- title: >-
    Checkly reports an attacker used a Metabase Cloud zero-day to read its analytics warehouse
    for 26 minutes
  section: Top stories
  category: Security
  blurb: >-
    An attacker exploited a Metabase Cloud zero-day to read Checkly's analytics warehouse
    for 26 minutes on 2026-08-03.
  summary: >-
    Checkly states an attacker exploited a zero-day in Metabase Cloud on 2026-08-03 and read
    its analytics warehouse for about 26 minutes. Checkly states Metabase discovered the intrusion
    the same day, blocked the endpoints used, patched the vulnerability, and published a security
    update, that customers, law enforcement, and a third-party forensics firm were notified
    on 2026-08-06, and that Checkly closed its investigation on 2026-08-10. The post names
    the data at risk and lists what customers should rotate. Metabase published advisory GHSA-r495-55cx-fjh7
    on 2026-08-11 at Critical severity with no CVE assigned, patched in x.58.28, x.59.25,
    x.60.21, x.61.15, x.62.13, and x.63.10, and it lists OSS and EE jar and docker artifacts
    for each, so self-hosted installations are in scope and have a named upgrade target. That
    advisory describes hardening the project identified proactively across query validation,
    permission checks on nested references, rate limiting, sandboxing and impersonation, and
    network exposure, and it attributes no item to the Checkly intrusion, so the link between
    the advisory and the exploited zero-day is not established here.
  why: >-
    Self-hosted operators now have a Critical advisory with a fixed version for every supported
    major line, and Checkly customers who placed authorization headers, cookies, or query
    string parameters directly in a check configuration, or who use OTEL API keys, have a
    named rotation list and the 2026-08-03 window to search their logs against.
  followup: >-
    Whether Metabase states which issue was the one exploited against Metabase Cloud.
  sources:
  - label: primary
    url: https://www.checklyhq.com/blog/metabase-security-incident/
  - label: advisory
    url: https://github.com/metabase/metabase/security/advisories/GHSA-r495-55cx-fjh7
  - label: discussion
    url: https://news.ycombinator.com/item?id=49253669
- title: >-
    A public exploit lands for CVE-2026-53361, an AF_UNIX garbage collection race the author
    uses to escape containers
  section: Top stories
  category: Security
  blurb: >-
    A public exploit landed for CVE-2026-53361, an AF_UNIX garbage collection race that researchers
    use to escape containers.
  summary: >-
    NVD published CVE-2026-53361 on 2026-07-04 at CVSS 7.1 from the kernel.org CNA. NVD describes
    a race condition in `AF_UNIX` garbage collection, where `unix_gc()` could run with `gc_in_progress`
    false when work is scheduled while it is already running and `unix_peek_fpl()` relies
    on that flag, and records the fix as setting `gc_in_progress` to true in `unix_gc()`.
    The CNA vector `CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H` records local access and
    low privileges as required and no confidentiality impact, with fixes in 6.6.144, 6.12.95,
    6.18.38, and 7.1, and Debian DSA-6381-1 records 6.12.95-1 for trixie. A public repository
    now carries exploit code, and the container escape, the use-after-free framing, and the
    claim that Ubuntu 24.04 HWE 6.17 and RHEL 10 remain unpatched are the exploit author's
    alone and were not verified for this digest.
  why: >-
    Anyone running untrusted or multi-tenant containers on an unpatched 6.12, 6.17, or 6.18
    kernel now faces public exploit code rather than a patch note, and the fixed stable versions
    are the check to run.
  followup: >-
    Whether distributions confirm or refute the unpatched claims for Ubuntu 24.04 HWE and
    RHEL 10.
  sources:
  - label: primary
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-53361
  - label: exploit
    url: https://github.com/sgkdev/bad_garbage
  - label: advisory
    url: https://www.debian.org/security/2026/dsa-6381
  - label: discussion
    url: https://news.ycombinator.com/item?id=49267550
- title: >-
    Mojo reaches 1.0 with a primarily-additive change policy, while the compiler stays closed
  section: Top stories
  category: Languages
  blurb: >-
    Mojo reached 1.0 under Qualcomm ownership with a primarily-additive change policy, while
    the compiler remains closed-source.
  summary: >-
    Modular released Mojo 1.0 as part of Modular 26.5 and states that changes during the 1.x
    timeframe should primarily be additive, while adding that breaking changes may still be
    made and will be managed the way mature languages such as C++ evolve. The compiler remains
    closed source, and Modular restates a commitment to open source the Mojo compiler and
    toolchain in 2026 and to progressively open source more of the language. The release comes
    under Qualcomm ownership of Modular.
  why: >-
    Mojo has been unstable enough that long-term projects were hard to maintain, and 1.0 is
    the point where Modular asks teams to build on it, with the compiler still unreleased.
  followup: >-
    Whether the 2026 date for opening the compiler is met, and how breaking changes are handled
    across the 1.x releases.
  sources:
  - label: primary
    url: https://www.modular.com/blog/modular-26-5-mojo-1-0-is-here
  - label: discussion
    url: https://news.ycombinator.com/item?id=49261128
- title: >-
    CloudSEK publishes a victim list for the March 2026 LiteLLM supply chain compromise, naming
    2,500 organizations and 434,000 CI/CD pipelines
  section: Top stories
  category: Security
  blurb: >-
    CloudSEK published a list of the March 2026 LiteLLM supply-chain exposure, naming 2,500
    organizations and 434,000 CI/CD pipelines.
  summary: >-
    CloudSEK describes the March 2026 LiteLLM supply chain compromise as running through an
    unpinned scanner invoked in a CI job and a Python `.pth` file that executes at interpreter
    startup, inside a publication window it puts at 40 minutes. CloudSEK states the figures
    of 2,500 organizations and 434,000 CI/CD pipelines come from a reconstructed exposure
    dataset and are not proof that any listed organization was compromised. The post also
    carries an exposure checker that collects contact details, so the numbers are recorded
    here as CloudSEK's own. The compromised package versions and their publication timestamps
    are not established here, because the CloudSEK post as read for this digest names no affected
    version range, so a reader cannot determine exposure from a pinned version alone and has
    to check whether the CI job resolved an unpinned dependency inside the 40-minute window.
  why: >-
    Execution at interpreter startup through a `.pth` file means `--ignore-scripts` did not
    help, and credentials reachable in that window stay valid unless rotated.
  followup: >-
    Independent confirmation of the exposure dataset, and any statement from the LiteLLM maintainers.
  sources:
  - label: primary
    url: https://www.cloudsek.com/blog/ai-supply-chain-breach-2500-companies-434000-cicd-pipelines
  - label: discussion
    url: https://news.ycombinator.com/item?id=49255598
- title: >-
    NVIDIA releases NeMo Switchyard, an open source model-routing library, with partner cost
    figures
  section: AI
  category: AI
  blurb: >-
    NVIDIA released NeMo Switchyard, an open-source library that routes agent steps to cost-optimized
    models from a mixed provider set.
  summary: >-
    NVIDIA released NeMo Switchyard as an open source library that routes each step of an
    agent workflow to a model chosen from a developer's own mix of open, proprietary, and
    NVIDIA models, selected on quality, latency, and cost. NVIDIA reports that LangChain routed
    7 percent of calls to a larger model at 74 percent lower cost. The cost and quality figures
    in the announcement are reported by NVIDIA and its partners, and none were independently
    reproduced for this digest.
  why: >-
    Per-step model selection across a mixed model set is being packaged as a library rather
    than as per-team glue.
  followup: Whether an independent party reproduces the cost figures.
  sources:
  - label: primary
    url: https://blogs.nvidia.com/blog/nemotron-lightning-switchyard-rtx-dgx/
  - label: discussion
