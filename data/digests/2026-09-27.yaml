- title: >-
    Cloudflare reports continuing Asia-Pacific network degradation from multiple subsea cable
    outages between Tokyo and Singapore
  section: Outages
  category: Outage
  blurb: >-
    Cloudflare's only open incident records Asia-Pacific congestion from multiple subsea cable
    outages since 2026-09-21.
  summary: >-
    Cloudflare's status page records the incident as opened 2026-09-23 and still in the identified
    state at the last update on 2026-09-25, the only unresolved incident on the page. Cloudflare
    attributes the congestion to multiple subsea cable outages since 2026-09-21 at 02:20 UTC,
    says it has rerouted traffic and is working with third-party vendors to restore capacity,
    and describes intermittent connectivity degradation for a small subset of customers caused
    by significant loss of regional capacity.
  why: >-
    The cause is physical and the repair is vendor-dependent, so an affected customer cannot
    treat it as a rollback to wait out.
  followup: >-
    Track resolution of the incident, and any Cloudflare statement naming the affected cables
    or the capacity restored.
