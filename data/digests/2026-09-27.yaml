- title: >-
    Casita publishes a content-addressed store for source and build artifacts as the first
    standalone layer of a Nix rewrite in Rust
  section: Developer tools
  category: Dev tools
  blurb: >-
    Casita ships a BLAKE3-addressed store for source and build artifacts, the first standalone
    layer of a Nix rewrite in Rust.
  summary: >-
    Domen Kozar's 2026-09-27 post presents the storage layer on its own terms: BLAKE3-addressed
    immutable blobs with an optional Bao outboard so a reader can verify one range without
    reading the whole blob, object records forming a graph above them, and named roots that
    drive synchronisation and garbage collection. Importers cover filesystem, tar, NAR and
    native Git, keeping each format's own identity, so a Git commit holds its SHA while Casita
    addresses its body bytes. The stated motivation is agentic development filling disks with
    target directories, and the retention answer is an evictable root plus automatic collection
    that triggers at 80 percent full and releases least-recently-used evictable roots until
    use falls below 75 percent.
  why: >-
    The Cargo ArtifactStorage backend is experimental, the post states its import and restore
    performance has not yet matched the filesystem backend, and v0.1.0 is untagged, so this
    is a design to read rather than a dependency to adopt.
  sources:
  - label: primary
    url: https://casita.rs/blog/introducing-casita-a-content-addressed-store-for-source-code-and-build-artifacts/
  - label: discussion
    url: https://www.reddit.com/r/rust/comments/1wr8ons/introducing_casita_a_contentaddressed_store_for/
- title: >-
    Reladraw is a diagram language with relative placement, sitting between Mermaid's auto-layout
    and draw.io's manual coordinates
  section: Developer tools
  category: Dev tools
  blurb: >-
    Reladraw states diagram placement relatively, sitting between Mermaid's auto-layout and
    draw.io's manual coordinates.
  summary: >-
    The stated problem is that Mermaid, Graphviz and D2 decide positions for you while draw.io
    and Excalidraw make you pick coordinates, which the README notes is expensive for agents
    recalculating positions in verbose XML. Reladraw expresses placement relatively, with
    statements such as below, right of and level with, so a layout is stated without absolute
    numbers. Version 0.8.0 is Apache-2.0, with parser, layout engine and SVG renderer in TypeScript
    and zero runtime dependencies, and the README says the syntax is not stable yet.
  why: >-
    It ships an agent skill installable across Claude Code, Codex, Cursor and Copilot, which
    is the reason a diagram syntax is worth noting now rather than the syntax itself.
  sources:
  - label: primary
    url: https://github.com/reladraw/reladraw
  - label: discussion
    url: https://news.ycombinator.com/item?id=49858513
- title: >-
    A browser-local checker flags unsafe PostgreSQL migrations using the real Postgres parser
    compiled to WebAssembly
  section: Developer tools
  category: Dev tools
  blurb: >-
    A browser-local checker flags unsafe PostgreSQL migrations using the real Postgres parser
    compiled to WebAssembly.
  summary: >-
    The tool compiles libpg_query to WebAssembly and runs it in a browser worker, so migration
    SQL is parsed rather than pattern-matched and never leaves the page, with no API route,
    no logs and no account. Verdicts are conditioned on row count and on whether the migration
    tool wraps DDL in a transaction, which is what separates a safe statement from a table-locking
    one in practice. The sample buffer shows the distinction it is built around, `CREATE INDEX
    CONCURRENTLY` and a foreign key added `NOT VALID` then validated in a second statement.
  why: >-
    The page states SQL never leaves the browser, with no API route, no logs and no account,
    so a migration from a private repository can be checked against the real parser rather
    than a regex. No command-line or CI form is offered, and the `npx` line on the page is
    demo text inside a mock terminal pane rather than a published package.
  sources:
  - label: primary
    url: https://safenotsafe.dev/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49854161
- title: >-
    Go Concurrency Distilled publishes a free reference covering goroutines through scheduling
    and diagnostics with runnable examples
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Anton Zhiyanov published a free Go concurrency reference running from goroutines to scheduling
    and runtime diagnostics.
  summary: >-
    Anton Zhiyanov's mini-book runs from goroutines, channels and select through pipelines,
    context, wait groups, data races, mutexes, semaphores, atomics, testing, scheduling and
    diagnostics, with each example editable and runnable in the page and a PDF alternative.
    It is written as a refresher rather than a first introduction, and it covers current API
    surface including `WaitGroup.Go`, `context.WithCancelCause` with `context.Cause`, and
    `context.AfterFunc`. It states the three error-handling shapes for concurrent pipelines
    side by side, and it includes the timer-reuse measurement that shows allocating one timer
    and resetting it in a loop rather than creating one per iteration.
  why: >-
    It is free to read and tracks API added since most existing Go concurrency references,
    and the author states the book is AI-free.
  sources:
  - label: primary
    url: https://antonz.org/go-concurrency-distilled/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49856988
- title: >-
    Modal and CMU publish Quail, a query-aware inference engine reporting 1.84x over vLLM
    on their AI-SQL benchmark
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Modal and CMU's Quail uses the SQL plan to schedule KV cache eviction, and drops decode,
    sampling and CUDA graphs.
  summary: >-
    Holding the whole query plan up front turns KV cache eviction and join ordering into decisions
    the engine can make rather than guess, because it knows when an entry is dead and what
    demand follows. The AI.IF workload needs only the single token the final prefill pass
    emits, so the engine implements no decode phase, no sampling, no CUDA graph capture and
    no speculative decoding. The two headline figures are not interchangeable: over 1 billion
    tokens per minute per H100 and more than 10x over the vLLM baseline come from one multi-join
    query the authors state is where planning matters most, while 1.84x is the geometric mean
    over their released benchmark, which includes two queries they designed to expose remaining
    weaknesses.
  why: >-
    Code ships as quail-engine 0.1.0 with the forward passes forked from vLLM and the benchmark
    released, so the smaller figure is the one a team can check.
  sources:
  - label: primary
    url: https://modal.com/blog/quail-billion-tpm
  - label: discussion
    url: https://news.ycombinator.com/item?id=49861274
- title: >-
    Ken Shirriff reverse-engineers the Intel 8087 tangent instruction and finds CORDIC combined
    with a Pade approximant
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Ken Shirriff finds the Intel 8087 tangent instruction pairs 16 CORDIC terms with a Pade
    approximant for 64-bit accuracy.
  summary: >-
    The post explains why FPTAN uses two algorithms rather than one. Sixteen CORDIC terms
    give about sixteen bits, so the 8087 covers the tiny residual angle with the rational
    approximation 3x/(3-x^2), whose error is proportional to x^4 and therefore under 2^-64
    for a residual below 2^-16, reaching 64-bit accuracy without 64 CORDIC terms. The account
    is grounded in the decapped die and the microcode listing, which shows the pseudo-division
    phase recording decision bits into a 16-bit shift register and the pseudo-multiplication
    phase shifting them out in reverse so the smallest rotation is applied first to limit
    rounding error.
  why: >-
    The division in that ratio costs nothing because FPTAN returns a separate numerator and
    denominator rather than the tangent, and the chip computed a tangent in 90 microseconds
    against 13,000 on the 8086.
  sources:
  - label: primary
    url: https://www.righto.com/2026/09/8087-tangent-cordic.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49858676
- title: >-
    A TLA+ primer states what model checking leaves uncovered, and reports 3,000 machine-checked
    Verus proofs from 16,459 specification pairs
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A TLA+ primer names where model checking stops, including leader election growing to over
    a million states at nine nodes.
  summary: >-
    The post is explicit about the three places TLA+ stops short, which is the part most introductions
    omit. TLC enumerates a finite instance only, and the leader-election example grows from
    38 states at three nodes to over a million at nine, the specification is a separate model
    that can drift from the implementation, and linear temporal logic cannot state branching
    or strategic properties. The pipeline result of 3,000 machine-checked Verus proofs from
    16,459 specification pairs is the company's own claim, with follow-up posts promised and
    no dataset or evaluation set released yet, and the post is also a hiring and product pitch.
  why: >-
    The primer and its stated limits are the durable part, because a team deciding whether
    to specify needs the coverage boundary before the tutorial.
  sources:
  - label: primary
    url: https://reasonable.io/blog/tla-tutorial/
  - label: discussion
