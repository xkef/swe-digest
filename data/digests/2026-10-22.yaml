    url: https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-brings-openai-models-to-customers/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50180079
- title: >-
    Trail of Bits releases agent plugins after finding 21 regressions in its merged AI patches
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Trail of Bits released patching-bugs and regression-hunt agent plugins after finding 21
    regressions in 130 of its merged AI-assisted patches.
  summary: >-
    Reviewing over 130 Patch the Planet PRs merged upstream, Trail of Bits confirmed 21 regressions
    (16 functional, one performance, four build or test), none of which broke a security protection.
    Its regression-hunt plugin requires a live proof of concept per claim and produced 25%
    fewer false positives than a baseline Codex prompt, with a 95% interval of 14% to 38%.
    The patching-bugs plugin uses a three-arm proof (original fails, patch passes, revert
    fails) and reads project THREAT_MODEL.md and PATCHING_GUIDELINES.md files.
  why: >-
    Maintainers receiving agent-written patches get a concrete regression rate and a repeatable
    review workflow with schema-checked evidence.
  sources:
  - label: primary
    url: https://blog.trailofbits.com/2026/10/21/your-ai-agent-fixed-the-bug-but-what-else-did-it-change/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50183253
- title: >-
    Google publishes its Rust style guide for google3, Android, ChromeOS, Fuchsia and Chrome
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Google published its Rust style guide for google3, Android, ChromeOS, Fuchsia and Chrome,
    covering API design, imports, unsafe code and traits.
  summary: >-
    The guide adds rules on top of the public Rust style guide to make large-scale automated
    changes easier, such as no glob imports, one module per use statement, and module-qualified
    function calls. It advises avoiding Rc and Arc, preferring enums over bool parameters,
    and expect over unwrap. Some rules are Chromium-specific, including small crates, flat
    file layout, and no async or std thread spawning.
  why: >-
    Teams setting Rust conventions for large monorepos get a tested baseline with rationale
    for each rule.
  sources:
  - label: primary
    url: https://google.github.io/styleguide/rustguide.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50186010
- title: Torvalds removes __get_user() and __put_user() from generic Linux 7.4 code
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Torvalds merged removal of __get_user() and __put_user() for Linux 7.4, citing missing
    address range checks, and used Claude for the conversion.
  summary: >-
    The merge removes the unchecked user access helpers from generic kernel code and completes
    removal for x86 and x86_64, with remnants in some other architectures. Torvalds called
    them slower and insecure because they skip user address range checks, and pointed to the
    scoped user access region helpers as the replacement. He said he used Claude as a kind
    of Coccinelle script for the transformation.
  why: >-
    Out-of-tree drivers and modules still calling __get_user() or __put_user() will fail to
    build on 7.4 and need conversion.
  sources:
  - label: primary
    url: https://www.phoronix.com/news/Linus-Kills-Get-Put-User-Linux
- title: >-
    Postgres recovery_prefetch amplifies standby read IOPS and can stall synchronous replication
    for 30+ minutes
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    A reproduction shows recovery_prefetch turning sequential primary I/O into random standby
    reads that stall synchronous commits for 30+ minutes.
  summary: >-
    Jeremy Schneider shows that recovery_prefetch converts large sequential I/O on the primary
    into 8k random reads on standbys, amplifying IOPS up to 16x, and issues prefetches for
    pages already restored from full-page images. With synchronous replication, a write burst
    plus a walreceiver disconnect leaves the standby replaying from WAL until caught up, and
    writes on the primary hang for over 30 minutes in his pgbench reproduction. Setting recovery_prefetch
    off removed the long stall in the same test.
  why: >-
    Teams running synchronous replication on IOPS-limited cloud disks should test recovery_prefetch
    off and consider quorum commit with two standbys.
  sources:
  - label: primary
    url: https://ardentperf.com/2026/10/20/postgres-recovery_prefetch-considered-harmful-and-causing-outages/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50188614
- title: >-
    GitHub moves Git write quorums to per-reference scope to finish its Azure migration
  section: Engineering posts
  category: Engineering post
  blurb: >-
    GitHub copied 99.99999% of repositories to Azure and is moving its Spokes write quorum
    from whole repositories to individual Git references.
  summary: >-
    Most repositories now have two of five replicas in Azure, which serves about half of Git
    traffic. The busiest remaining repositories cannot absorb a 25ms cross-region round trip
    because each write holds a repository-wide lock and waits on the slowest healthy replica.
    GitHub is narrowing the quorum to individual references, which also enables stateless
    read replicas backed by object storage.
  why: >-
    It is a detailed case study in reducing coordination scope to survive cross-region latency
    in a replicated store.
  sources:
  - label: primary
    url: https://github.blog/engineering/architecture-optimization/the-bridge-to-agent-scale-git-infrastructure/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50183344
- title: >-
    Fly.io replaces modified JuiceFS with an object-storage block device for Sprites after
    checkpoint failures
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Fly.io replaced its modified JuiceFS storage for Sprites with ext4 on an NBD block device
    backed by object storage after checkpoint failures.
  summary: >-
    Sprites stored a 100 GB ext4 image in a modified JuiceFS with SQLite metadata and a separate
    checkpoint database, and writeback mode could leave metadata pointing at chunks never
    uploaded. A harness running 400 Sprites through about 5,000 write, checkpoint, sleep,
    wake and restore cycles left some permanently unable to checkpoint. The new Sprites Block
    Device serves an ext4 volume over NBD with metadata stored in the bucket, versioned block
    snapshots for checkpoints, and checksum verification on every block read.
  why: >-
    It is a concrete case for keeping durable state in a single source of truth instead of
    reconciling separate chunk, metadata and checkpoint stores.
  sources:
  - label: primary
    url: https://fly.io/blog/sprites-block-device/
