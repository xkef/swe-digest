date: '2026-10-22'
updated: 2026-10-22T10:23Z
lede: >-
  A PHP RCE release that leaked early and drew exploit traffic before the patch led a day
  of runtime security fixes and a Railway secrets breach.
stories:
- title: >-
    PHP fixes two unauthenticated RCE flaws as exploit traffic arrives before the patch
  section: Top stories
  category: Security
  blurb: >-
    PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 fix two unauthenticated RCE bugs, and sensors logged
    exploit traffic hours before the release.
  summary: >-
    On 2026-10-21 PHP released fixes for CVE-2026-109618 (RCE via out-of-memory corruption)
    and CVE-2026-109619 (RCE via stale global state), both CVSS 9.2, affecting PHP-FPM, mod_php,
    php-cgi, FrankenPHP and LiteSpeed. The PHP Foundation says the release was moved forward
    a day after the CVE IDs leaked on 2026-10-20 and that Chainguard published patched images
    more than six hours before the coordinated release. ELLIO recorded the first PHP2Shell
    request at 08:36 UTC, before the fix, and by 23:00 UTC had seen 743 requests from 33 addresses,
    some carrying Mirai-style loaders.
  why: >-
    Every web-facing PHP install on 8.2 or later needs the update now, and 8.1 and older get
    no official fix, only source backports from the security team.
  followup: >-
    Confirmed compromises, a CISA KEV listing, and a reported possible third PHP CVE.
  comments: >-
    ELLIO notes that early coverage tied the session upload progress stopgap to the wrong
    CVE. That setting covers only CVE-2026-109619, and memory_limit=-1 is the interim step
    for CVE-2026-109618.
  sources:
  - label: primary
    url: https://www.php.net/archive/2026.php#2026-10-21-5
  - label: primary
    url: https://thephp.foundation/blog/2026/10/21/todays-php-security-release-and-how-were-strengthening-php-security/
  - label: discussion
    url: https://ellio.tech/en/blog/php2shell-what-we-observed-and-what-to-do/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50180873
- title: Railway says an attacker may have read decrypted customer environment variables
  section: Top stories
  category: Security
  blurb: >-
    Railway says an attacker may have read decrypted customer environment variables, paused
    all builds, and told users to rotate every secret.
  summary: >-
    On 2026-10-21 Railway detected unauthorized access to systems that store customer environment
    variables and says some decrypted values may have been obtained. It attributes the attack
    to a series aimed at platform companies to compromise AI inference providers, paused all
    deployments, rotated bucket credentials, and on 2026-10-22 invalidated all Railway API
    tokens. As of 06:12 UTC on 2026-10-22, builds were restored for Enterprise workspaces
    only, with Pro, Hobby, Free and Trial to follow.
  why: >-
    Railway users should rotate every secret stored there, including LLM API keys, database
    and registry credentials, and check provider usage for abuse.
  followup: >-
    Builds restored for all tiers, notification of affected accounts, and a root cause.
  sources:
  - label: primary
    url: https://blog.railway.com/p/security-disclosure-wednesday-october-21st
  - label: primary
    url: https://status.railway.com/incident/QH8L8B3E
  - label: discussion
    url: https://news.ycombinator.com/item?id=50188228
  - label: discussion
    url: https://www.reddit.com/r/ClaudeAI/comments/1xc1l52/if_you_use_railway_for_claude_hosted_apps_disable/
- title: Node.js security releases fix Brotli decoder RCE and TLS hostname bypasses
  section: Security
  category: Security
  blurb: >-
    Node.js 26.12.1, 24.22.1 and 22.23.4 fix a Brotli decoder RCE, three TLS hostname bypasses,
    and repeated randomUUID values in snapshots.
  summary: >-
    The 2026-10-21 Node.js security release fixes CVE-2026-111497, a Brotli decoder out-of-bounds
    write that permits remote code execution, plus high-severity TLS hostname bypasses (CVE-2026-105483,
    CVE-2026-106069) and a dns.resolve NUL truncation bug. It also fixes randomUUID and randomInt
    entropy caches that were saved into startup snapshots and SEAs, and updates ca-certs for
    the eMudhra intermediate CA compromise. LWN notes that musl also announced an out-of-bounds
    write the same day.
  why: >-
    Services that decompress Brotli input or ship SEAs and snapshots should move to the patched
    release lines now.
  sources:
  - label: primary
    url: https://nodejs.org/en/blog/vulnerability/october-2026-security-releases
  - label: discussion
    url: https://lwn.net/Articles/1102044/
- title: >-
    Oracle issues out-of-band Java SE Security Alert for CVSS 9.1 JSSE flaw CVE-2026-91403
  section: Security
  category: Security
  blurb: >-
    Oracle issued an out-of-band Security Alert for a CVSS 9.1 JSSE flaw in Java SE 8 through
    27 and GraalVM, exploitable without authentication.
  summary: >-
    Oracle published Security Alert CVE-2026-91403 on 2026-10-21 for the JSSE component, with
    high confidentiality and integrity impact and network exploitation without credentials.
    Affected versions include Java SE 8u511, 11.0.33, 17.0.21, 21.0.13, 25.0.5 and 27.0.1,
    GraalVM for JDK 17 and 21, and GraalVM Enterprise 21.3.20. The Hacker News submission
    ties the alert to eMudhra certificate revocation, which the advisory text does not state.
  why: >-
    JVM services that terminate or originate TLS need the patched JDK outside the regular
    quarterly CPU cycle.
  sources:
  - label: primary
    url: https://www.oracle.com/security-alerts/alert-cve-2026-91403.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=50188443
- title: >-
    QPACK amplification lets one connection exhaust memory on seven of ten HTTP/3 stacks
  section: Security
  category: Security
  blurb: >-
    FoxIO showed one HTTP/3 connection can exhaust server memory via QPACK header expansion.
    Bun, hyperium h3 and aioquic remain unpatched.
  summary: >-
    FoxIO found that HTTP/3 implementations missing or misapplying decoded-header limits let
    a small HEADERS frame expand into hundreds of thousands of header objects, with up to
    roughly 4000x amplification in Bun. quic-go 0.57.0, Cloudflare quiche 0.29.3, lsquic 4.9.0
    and Wireshark are fixed. Bun 1.4.3, the hyperium h3 crate and aioquic with mitmproxy were
    unpatched as of 2026-10-20, while Google quiche, IIS, Envoy and ngtcp2 are not affected.
  why: >-
    Operators exposing HTTP/3 through Caddy, Traefik, Bun or mitmproxy should confirm library
    versions or disable HTTP/3 until patched.
  sources:
  - label: primary
    url: https://foxio.io/blog/header-accordions-qpack-amplification-attacks-against-http-3-servers
  - label: discussion
    url: https://news.ycombinator.com/item?id=50188612
- title: >-
    ZDI posts unpatched Linux kernel vulnerability reports, including two CVSS 9.0 SMB RCEs,
    to public LKML
  section: Security
  category: Security
  blurb: >-
    Trend Micro ZDI posted six unpatched kernel bug reports to LKML, including two CVSS 9.0
    ksmbd and SMB Direct remote code execution flaws.
  summary: >-
    Trend Micro's Zero Day Initiative sent several Linux kernel vulnerability reports to the
    public kernel mailing list instead of the private security list, and Greg Kroah-Hartman
    replied to each asking about the public submission. The reports include ZDI-CAN-33549,
    an SMB Direct integer underflow RCE rated CVSS 9.0 with a patch queued for Linux 7.5,
    ZDI-CAN-33774, a ksmbd race condition RCE rated CVSS 9.0, and local privilege escalations
    in skb_zerocopy, the vmwgfx driver, and a search-domain TCP query path. None were patched
    in mainline at publication.
  why: >-
    Hosts that run in-kernel ksmbd or SMB Direct are exposed to disclosed but unfixed remote
    code execution bugs and should consider disabling ksmbd until fixes land.
  followup: >-
    Mainline and stable kernel fixes for the ksmbd and SMB Direct reports, and CVE assignment.
  sources:
  - label: primary
    url: https://www.phoronix.com/news/LKML-New-Trend-Vulnerabilities
- title: >-
    musl discloses CVE-2026-107891, integer overflows in regcomp that can cause heap out-of-bounds
    writes
  section: Security
  category: Security
  blurb: >-
    Integer overflows in musl regcomp since 0.5.0 can corrupt the heap when an app compiles
    regular expressions from untrusted input.
  summary: >-
    Rich Felker disclosed multiple integer overflows in musl's regcomp that can produce undersized
    allocations and out-of-bounds heap writes, triggered by the size and complexity of the
    pattern rather than the matched data. All versions from 0.5.0 through 1.2.6 are affected.
    A patch is attached to the advisory and the fix will ship in musl 1.2.7.
  why: >-
    Alpine and other musl-based images that compile user-supplied regular expressions through
    libc regcomp need the patched package or must stop accepting untrusted patterns.
  followup: musl 1.2.7 release and Alpine package updates.
  sources:
  - label: primary
    url: https://www.openwall.com/lists/musl/2026/10/21/1
  - label: discussion
    url: https://www.reddit.com/r/linux/comments/1xc8kia/cve2026107891_musl_libc_multiple_integer_overflow/
- title: Anthropic launches Claude Duet research preview, a proactive agent on Opus 5.5
  section: AI
  category: AI
  blurb: >-
    Anthropic opened a waitlist for Claude Duet, a proactive Opus 5.5 agent that works on
    a cloud computer and asks before sensitive actions.
  summary: >-
    Claude Duet takes tasks by message, runs on its own cloud computer with the user's Claude
    memory, skills and connectors, and sends morning briefs. It asks for approval before sending
    messages or paying, and its background checks count against plan usage limits. It is a
    research preview for US Pro and Max subscribers on iOS, Android and the web, and excludes
    Team and Enterprise plans.
  why: >-
    Always-on background agents now draw on the same usage limits as interactive and coding
    work, which affects capacity planning on shared plans.
  sources:
  - label: primary
    url: https://claude.com/product/claude-duet
  - label: discussion
    url: https://news.ycombinator.com/item?id=50186037
- title: OpenAI models enter private preview on Google Cloud with Codex CLI support
  section: AI
  category: AI
  blurb: >-
    GPT-6 Astra, GPT-6.1 Sol and GPT-6 Luna enter private preview in Google Cloud model garden,
    and Codex CLI can route inference through it.
  summary: >-
    Google Cloud added OpenAI's GPT-6 Astra, GPT-6.1 Sol and GPT-6 Luna to its model garden
    in private preview for select enterprise customers on 2026-10-21. Usage bills through
    Google Cloud Marketplace and draws down existing commitments, and local Codex CLI and
    Desktop can use the Gemini platform for inference. Zero data retention and Confidential
    Compute are listed as coming soon.
  why: >-
    GCP shops can run Codex workflows and OpenAI models under existing IAM, VPC Service Controls
    and billing instead of a separate vendor contract.
  sources:
