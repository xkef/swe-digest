- title: Matthew Green on whether sandboxing can contain rogue agents
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Matthew Green argues agent sandboxing only moves the problem to the monitor, which must
    itself be a model to be useful.
  summary: >-
    Green argues that a useful agent needs information access, so a sandbox only redirects
    traffic through a monitored gate. Because the monitor has to be another model, he reads
    warden-guarded sandboxing as a restatement of the alignment problem rather than a fix
    for it. Google's Gemini 4 Argon post, covered in the 2026-09-30 digest, is a counterpoint
    from a lab, stating that it isolates and seals sandboxes before high-risk evaluations
    and monitors chain-of-thought for misalignment.
  why: >-
    It sets a ceiling on what containment buys, which bears on every deployment that treats
    a sandbox as the primary control.
  sources:
  - label: primary
    url: https://blog.cryptographyengineering.com/2026/09/30/is-sandboxing-sufficient-to-contain-rogue-agents/
  - label: lab counterpoint
    url: https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49917378
