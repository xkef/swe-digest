- title: >-
    Cloudflare commits to post-quantum Merkle Tree TLS certificates, first issuance targeted
    for Q1 2027
  section: Security
  category: Security
  blurb: >-
    Cloudflare targets Q1 2027 for its first Merkle Tree TLS certificates, holding handshake
    data near 40 KB, about today's size.
  summary: >-
    Ars Technica reports that Cloudflare plans to issue quantum-safe TLS certificates built
    on the Merkle Tree Certificate design, with first issuance targeted for the first quarter
    of 2027. Naive post-quantum X.509 would add roughly 40 times the TLS handshake data. The
    Merkle Tree design, credited to Google and announced in February, replaces the chain of
    quantum-vulnerable signatures with compact Merkle proofs, where a CA signs a single tree
    head representing millions of certificates and the browser usually handles a lightweight
    landmark proof, dropping handshake data to about 40 KB, which Ars Technica states is about
    the same as is processed now. A separate stated benefit is that transparency logging becomes
    part of issuance, quoted from Cloudflare engineer Mari Galicer as transparency becoming
    a requirement for operation rather than an add-on. Cloudflare's own post was not resolved
    after two slug attempts, so the detail here is Ars Technica quoting Cloudflare engineers.
  why: >-
    Handshake size, not the algorithm, is the practical blocker for post-quantum certificates,
    and a dated issuance target gives operators something to plan against.
  followup: >-
    Whether Cloudflare publishes the design post directly, and whether browsers and other
    CAs commit to the same format.
  sources:
  - label: primary
    url: https://arstechnica.com/security/2026/09/cloudflare-plans-to-issue-quantum-safe-tls-certificates/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49908627
