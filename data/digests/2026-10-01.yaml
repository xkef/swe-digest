- title: >-
    Broadcom will lend Anthropic up to $42B for infrastructure, per the IPO prospectus
  section: Markets and companies
  category: Markets
  blurb: >-
    Reuters reports Broadcom will lend Anthropic up to $42B and lease it chips, with Anthropic
    its largest compute customer by 2027.
  summary: >-
    The report attributes to Anthropic's IPO prospectus a Broadcom arrangement covering chip
    supply, equipment leasing, and a loan of up to $42B. The structure is vendor financing
    rather than a purchase, and Anthropic is estimated to become Broadcom's largest compute
    customer by 2027. Broadcom designs Google's TPUs, whose capacity for Anthropic is stated
    to come online in 2027. Neither the report nor the Reuters story it quotes ties this arrangement
    to the $518B compute obligation in the prospectus story above, so treating it as part
    of that figure is inference rather than a stated finding. These figures reach this digest
    through Yahoo Finance quoting Reuters quoting the prospectus, because reuters.com refuses
    automated fetch.
  why: >-
    Vendor financing puts the supplier behind both the chip supply and the credit, so the
    obligation and the lender sit with the same counterparty.
  followup: >-
    Whether the prospectus becomes readable directly and confirms the loan ceiling and the
    2027 capacity date.
  sources:
