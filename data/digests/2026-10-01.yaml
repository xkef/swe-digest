stories:
- title: >-
    Apple patched an exploited CoreGraphics bug, researchers published the PDF font path (CVE-2026-86950)
  section: Top stories
  category: Security
  blurb: >-
    Calif published the full PDF font trigger for CVE-2026-86950, an out-of-bounds write Apple
    patched after in-the-wild use.
  summary: >-
    Calif describes a malicious PDF with a crafted font reaching an out-of-bounds write through
    undefined double-to-int32 conversion in the anti-aliased rasterizer, patched by a clamp
    added to `aa_double_to_fixed` in iOS 26.7.1, with an `aa_moveto` versus `aa_lineto` instruction
    differential, an undersized coverage buffer in `aa_cache_render`, and a reproduction harness.
    The stated delivery path is a possible zero-click WhatsApp message, and the post records
    WhatsApp 26.37.73 and 26.38.74 adding strict PDF validation in Meta's Kaleidoscope parser,
    with new defect tags that raise the attachment risk score and prevent automatic parsing.
    Apple advisory language quoted by Calif describes an extremely sophisticated attack against
    specific targeted individuals reported by Meta Product Security, and that advisory was
    not read directly.
  why: A working trigger is now public for any device still running iOS before 26.7.1.
  followup: >-
    Whether Apple publishes the CoreGraphics detail directly, and whether other PDF-rendering
    clients add equivalent font validation.
  sources:
  - label: primary
    url: https://calif.io/research/the-great-glyph-grift
  - label: discussion
    url: https://news.ycombinator.com/item?id=49915669
- title: Reddit ends RSS on 2026-11-13 and shuts its public API in March 2027
  section: Top stories
  category: Dev tools
  blurb: >-
    Reddit ends RSS feeds on 2026-11-13 and closes public API access in March 2027, citing
    AI bot scraping.
  summary: >-
    TechCrunch reports that Reddit will stop serving RSS feeds on 2026-11-13 and end public
    API access in March 2027, with AI bots given as the reason, and that third-party apps
    and bots not registered by 2027-01-12 lose API access before that. Ars Technica reports
    a separate change that blocks old.reddit.com for accounts that have not used it in six
    months. Reddit's own announcement returned HTTP 403 to automated fetch, so the dates here
    are TechCrunch quoting it.
  why: >-
    Every tool that reads Reddit over RSS or the public API now has a dated deadline, and
    unregistered third-party clients and bots lose access first.
  followup: >-
    Whether the registration path admits non-commercial clients, and whether any replacement
    feed is offered before 2026-11-13.
