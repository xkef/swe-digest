- title: >-
    Micron says memory supply stays tighter through fiscal 2027 and 2028, with over 75% of
    2027 output already committed
  section: Markets and companies
  category: Markets
  blurb: >-
    Micron's CEO says memory supply stays tighter through fiscal 2027 and 2028, with over
    75% of 2027 output already committed.
  summary: >-
    TechPowerUp reproduces Micron CEO Sanjay Mehrotra's remarks from the fiscal Q4 2026 earnings
    call on 2026-09-30, stating that supply and demand conditions will be much tighter in
    fiscal 2027 and 2028 than they were in 2026, with over 75% of 2027 output already committed
    and no line of sight to a balance between supply and demand. DRAM pricing rose in the
    high teens percent and NAND about 30% last quarter. The call transcript was not read directly,
    so the quotes and figures come from TechPowerUp.
  why: >-
    The stated absence of any line of sight to balance sets a floor under server, laptop,
    and instance pricing for two more years.
  followup: >-
    Whether the committed-output share and the price trend hold at the next quarterly call.
