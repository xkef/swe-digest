    Mark Shannon proposes a combined generational and incremental GC after the Python 3.14
    revert
  section: Languages and runtimes
  category: Event
  blurb: >-
    Mark Shannon proposes interleaving Python's generational and incremental collectors, whose
    peak pauses differ by 100x.
  summary: >-
    The Language Summit writeup records Shannon's proposal to interleave the generational
    and incremental collectors rather than choose between them, following the revert in Python
    3.14. Reported peak GC pause times differ by two orders of magnitude between the two designs,
    tens of milliseconds against around three seconds.
