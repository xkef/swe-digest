    An AlphaPixel survey compares atlases, SDF, MSDF, and Slug for GPU text, whose patent
    entered the public domain in 2026.
  summary: >-
    Chris Hanson of AlphaPixel sets out where baked atlases, SDF, MSDF, and tessellation each
