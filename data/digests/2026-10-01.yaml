- title: >-
    Gitea 28.0.0 drops the 1.x prefix and adds audit logging, bot accounts, and deploy tokens
  section: Developer tools
  category: Dev tools
  blurb: >-
    Gitea 28.0.0 drops the 1.x prefix and adds audit logging, bot accounts, and deploy tokens,
    with five breaking changes.
  summary: >-
    Five entries appear under Major Breaking Changes: Git network operations route through
    an internal proxy with new egress rules, completed Actions runs expire after 400 days,
    Git 2.25 is the new minimum, self-registration defaults off with `[server] DOMAIN` ignored
    in favour of `ROOT_URL`, and Actions workflows are evaluated more strictly. The workflow
    change evaluates job-level `if:` before matrix expansion and restricts it to the `github`,
    `gitea`, `needs`, `vars`, and `inputs` contexts. Matrix fail-fast is now enforced, and
    public repositories can no longer call reusable workflows from private ones.
  why: >-
    Instances behind restrictive egress policies and any repository relying on loose workflow
    conditions need changes before the upgrade, not after.
  sources:
  - label: primary
    url: https://blog.gitea.com/release-of-28.0.0/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49913975
- title: OpenZL ships a native LZ engine with decompression over 2x faster than Zstandard
  section: Developer tools
  category: Dev tools
  blurb: >-
    OpenZL's own LZ engine decompresses over 2x faster than Zstandard, with benchmark tables
    run on v0.3.0.
  summary: >-
    The native LZ engine ships starting in v0.2.0, and the published benchmark tables were
    run with v0.3.0, reporting decompression over 2x faster than Zstandard across the compression
    level range and up to 50% faster than LZ4. Freedom from the Zstandard wire format lets
    offsets be bucketed by a V-optimal histogram and bitpacked with no entropy codec, decoding
    2x to 3.5x faster. PivCo Huffman, a new Huffman layout by Marcin Zukowski, replaces the
    codec that accounted for over half of LZ decompression CPU and is enabled by default in
    v0.3.0. The stated tradeoff is that OpenZL compresses slightly worse than Zstandard at
    higher levels, because it does not yet support repeat offsets.
  why: >-
    The gains come from two independent sources, an unconstrained wire format and a new Huffman
    layout, so only the first is limited to pipelines that control both ends.
  sources:
  - label: primary
    url: https://openzl.org/blog/2026-09-29-lz-in-openzl/
  - label: discussion
    url: https://www.reddit.com/r/programming/comments/1wuf5lf/openzl_v02_decompression_2x_faster_than_zstandard/
- title: >-
    Scott Chacon argues Git 3.0's SHA-256 default will break tooling for little security gain
  section: Developer tools
  category: Dev tools
  blurb: >-
    Scott Chacon argues Git 3.0's SHA-256 default breaks tooling, because SHA-1 and SHA-256
    repositories cannot be mixed.
  summary: >-
    The breakage mechanics hold whether or not a reader accepts the argument. SHA-1 and SHA-256
    repositories cannot be mixed, submodules must match the parent's format, converting an
    existing repository invalidates every existing signature and SHA-1 link, and any tool
    assuming a 40-character hash needs updating. Chacon reports that most Git reimplementation
    libraries have zero or partial support, and cites an Emily Shaffer talk stating Google
    may override the new default internally to stay on SHA-1.
  why: >-
    Anyone maintaining a Git client, host, or CI integration inherits a format migration whose
    library support Chacon reports as absent or partial.
  followup: >-
    Whether Git 3.0 ships SHA-256 as the default and whether the major reimplementations close
    the gap first.
  sources:
  - label: primary
    url: https://blog.gitbutler.com/git-3-sha-256
  - label: discussion
    url: https://news.ycombinator.com/item?id=49924179
- title: Rust 1.99.0 stabilizes C-ABI variadic functions written in Rust
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Rust 1.99.0 stabilizes defining C-ABI variadic functions in Rust, removing a reason to
    keep a C shim in FFI.
  summary: >-
    The release announcement states that Rust 1.99.0 stabilizes variadic functions using the
    C ABI, so a Rust function can take a variable argument list rather than only call one.
    The same release stabilizes the raw-pointer layout queries `mem::size_of_val_raw`, `mem::align_of_val_raw`,
    and `Layout::for_value_raw`, along with `Vec::into_parts` and `Vec::from_parts`, `Box::into_non_null`
    and `Box::from_non_null`, `std::fs::set_times`, and `IntoIterator` for boxed arrays. The
    `Box::leak` guidance now recommends against unleaking by round-tripping the pointer, because
    that interacts badly with current and future optimizations and with upcoming custom allocators.
  why: >-
    Rust could already call C variadics, and defining them removes a reason to keep a C shim
    at FFI boundaries that expose printf-style entry points.
  sources:
  - label: primary
    url: https://blog.rust-lang.org/2026/10/01/Rust-1.99.0/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49920917
- title: >-
    Rust compiler wall time fell 4.57% over two months, with 555 of 629 benchmarks improving
  section: Languages and runtimes
  category: Languages
  blurb: >-
    Nicholas Nethercote reports Rust compiler wall time down 4.57% in two months, with 555
    of 629 benchmarks improving.
  summary: >-
    The post attributes the drop to named changes, including an LLVM 23 upgrade worth 1.2%
    on its own and a CFG traversal change worth about 30% of a check build for cranelift-codegen.
    The same period absorbed the regressions from enabling the new borrow checker and trait
    solver on nightly.
  why: >-
    Two large nightly-only subsystems landed without a net compile-time cost, which is what
    makes them shippable later.
  sources:
  - label: primary
    url: https://nnethercote.github.io/2026/09/30/how-to-speed-up-the-rust-compiler-in-september-2026.html
  - label: discussion
