- title: >-
    Microsoft patched a critical SQL Copilot privilege escalation reached through database
    metadata (CVE-2026-65669)
  section: Security
  category: Security
  blurb: >-
    Microsoft patched CVE-2026-65669, where SQL Copilot read-only mode was a regex blocklist
    rather than a database permission.
  summary: >-
    The write-up describes read-only enforcement for the SQL Copilot agent implemented as
    a regex blocklist inside a checker class rather than as a database permission, defeated
    by assigning `sp_executesql` to a variable and calling `EXEC` on that variable. The escalation
    needs no prompt from the victim. A user holding ALTER on a single object can attach an
    `AGENTS.md` or `CONSTITUTION.md` extended property that Copilot later loads into its context
    and executes over a sysadmin connection. No affected or patched version range is published
    in the write-up, so there is no version number for an operator to check.
  why: >-
    The control was an instruction to the model and a pattern match rather than a permission,
    so metadata a lower-privileged user can write becomes an execution path.
  followup: >-
    Whether other products that read agent config files out of a permissioned store carry
    the same gap between file trust and store permissions.
  sources:
  - label: primary
    url: https://embracethered.com/blog/posts/2026/from-select-to-sysadmin-sql-copilot-bluehat-asia/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49925970
- title: OpenSSL advisory covers nine issues, one High severity DTLS heap disclosure
  section: Security
  category: Security
  blurb: >-
    OpenSSL's 2026-09-29 advisory covers nine issues, led by a High severity DTLS flaw that
    leaks heap memory to the peer.
  summary: >-
    CVE-2026-84782 lets a DTLS retransmission fired during a suspended write read past the
    message buffer and send heap memory to the peer as plaintext handshake data, or crash
    when the read reaches an unmapped region. Affected versions run from 4.0 back through
    1.0.2, with public fixes in 4.0.3, 3.6.5, 3.5.9, and 3.4.8. The 3.0.23, 1.1.1zj, and 1.0.2zs
    fixes are available to premium support customers only.
  why: >-
    Operators on 3.0, 1.1.1, or 1.0.2 are listed as vulnerable with no public fix available
    to them.
  sources:
  - label: primary
    url: https://openssl-library.org/news/secadv/20260929.txt
  - label: discussion
    url: https://news.ycombinator.com/item?id=49906844
- title: >-
    TanStack Start patches a critical reflected XSS in server functions (CVE-2026-102989)
  section: Security
  category: Security
  blurb: >-
    TanStack Start carries a critical reflected XSS in server functions, cleared by upgrading,
    rebuilding, and redeploying.
  summary: >-
    TanStack's post describes a reflected cross-site scripting flaw in server functions, rated
    critical and tracked as CVE-2026-102989, affecting versions from 1.143.12 up to but excluding
