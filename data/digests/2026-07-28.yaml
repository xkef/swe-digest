- title: >-
    Lean 4 kernel accepted ill-typed nested inductives, allowing an axiom-free proof of False
  section: Top stories
  category: Languages
  blurb: >-
    Lean 4 accepted a malformed inductive declaration through the ordinary checked path and
    proved False without axioms or unsafe tactics.
  summary: >-
    Issue 14576 was opened 2026-07-28 at 03:28 UTC by kiranandcode against nightly 4.34.0-nightly-2026-07-27.
    The repro adds declarations through the ordinary checked `addDecl` path and then proves
    `False`, without `sorry`, `unsafeCast`, `debug.skipKernelTC`, `addDeclWithoutChecking`,
    FFI, or a modified olean file, and it still passes under `lean --trust=0`. Lean prints
    that both the intermediate theorem and the final term depend on no axioms, so `print axioms`
    does not flag the result. Leonardo de Moura opened the fix as PR 14577 at 05:08 UTC and
    it merged at 13:39 UTC the same day, closing the issue. The PR gives the cause: when eliminating
    a nested occurrence, the parametric arguments were dropped from the generated auxiliary
    types and so escaped type checking, and they are now checked once the inductive types
    being declared are available. Joachim Breitner added a regression case to the leanprover/lean-kernel-arena
    repository at 09:47 UTC. Exploitation requires an adversarial metaprogram rather than
    ordinary Lean source. The reporter found it while reviewing a claimed sub-300-line proof
    of the Collatz Conjecture by xrchz. The fix is in the Lean tree and is not in a tagged
    release as of publication.
  why: >-
    A soundness hole in a proof assistant's trusted kernel is the exact failure the kernel
    exists to rule out, and a team on a tagged toolchain should not assume it carries the
    fix yet.
  followup: Watch for the first tagged Lean release carrying PR 14577.
  sources:
  - label: lean4 issue 14576
    url: https://github.com/leanprover/lean4/issues/14576
  - label: lean4 PR 14577
    url: https://github.com/leanprover/lean4/pull/14577
  - label: HN 49082495
    url: https://news.ycombinator.com/item?id=49082495
- title: >-
    LOCKS gives each KV page its own spectral summary and reports half the decode latency
    at 1M tokens
  section: ML research
  category: Paper
  blurb: >-
    LOCKS attaches spectral summaries to KV cache pages and reports decode latency at 1M tokens
    cut to roughly half by reading a resident index.
  summary: >-
    The paper proposes attaching a spectral summary to each page of the KV cache and selecting
    pages from that resident index, which it puts at about a tenth of the cache size, so selection
    reads no candidate keys or values. It reports decode latency at a 1M-token context cut
    to about half. It is packaged as a drop-in plugin for unmodified vLLM, with batched decode
    running in full CUDA graphs. Every figure here is the paper's own. This is a first-version
    preprint with no independent reproduction and no discussion thread.
  why: >-
    Long-context serving cost is dominated by reading the whole KV cache at every decode step,
    and a selection path that ships against an unmodified serving stack is testable by a team
    rather than only by the authors.
  followup: Watch for an independent run of the plugin against a stock vLLM deployment.
  sources:
  - label: arXiv 2607.24555
    url: https://arxiv.org/abs/2607.24555
- title: Practitioner run of SlopCodeBench scores Opus 5 at 4 of 17 strict passes
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    A single run of SlopCodeBench found Opus 5 passing 4 of 17 checkpoints, producing roughly
    29,000 source lines with 51 percent tests.
  summary: >-
    A write-up in the HumanLayer advanced-context-engineering repository reports running SlopCodeBench
    against three models in one session of about six hours, covering 3 of the benchmark's
    36 problems across 17 checkpoints. The reported result is Opus 5 at 4 of 17 strict passes,
    against 1 of 17 each for Opus 4.8 and Sonnet 5. Opus 5 produced 29,065 source lines against
    roughly 9,000 for each of the other two, with 51 percent of that output tests. None of
    the three models finished any of the three problems clean. The evidence base is one practitioner
    and one run, and the author hedges the result himself. The benchmark is arXiv 2603.24755,
    submitted 2026-03-25 and revised 2026-05-07, which defines 36 problems across 196 checkpoints.
    Its own abstract reports that across 15 coding agents no agent fully solves any problem
    end to end and the best agent passes 14.8 percent of checkpoints, so the practitioner
    run is not comparable to a paper leaderboard position.
  why: >-
    SlopCodeBench withholds later requirements instead of stating the whole problem up front,
    so it measures whether a coding agent keeps a codebase changeable across checkpoints rather
    than whether it solves one stated task, which is the property a team is betting on when
    it runs agents unattended.
  followup: Watch for a run that covers GPT-5.6, GLM 5.1, and Kimi K3.
  comments: >-
    HN commenter killingtime74 asks why GPT-5.6, GLM 5.1, and Kimi K3 were left out and offers
    to run them. Other replies report dissatisfaction with Opus 5 on their own work, which
    is opinion rather than measurement.
  sources:
  - label: HumanLayer write-up
    url: https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/benchmarking-opus-5-on-slop-code-bench.md
  - label: arXiv 2603.24755
    url: https://arxiv.org/abs/2603.24755
  - label: HN 49076391
    url: https://news.ycombinator.com/item?id=49076391
- title: Researcher takes over every account and vehicle fleet on the My Eicher platform
  section: Security
  category: Security
  blurb: >-
    One authorization defect in the My Eicher fleet-management platform enabled account takeover
    and control of registered vehicles platform-wide.
  summary: >-
    A write-up published 2026-07-27 by Eaton Works describes a single critical flaw in My
    Eicher, the fleet-management platform of the Volvo and Eicher commercial-vehicle joint
    venture. The researcher reports reaching account takeover across the platform's whole
    user base and the vehicles registered behind those accounts. My Eicher is a hosted platform
    with no user-visible build version, so affected-version information does not apply, and
    no vendor fix confirmation is published. The disclosure timeline and the vendor's remediation
    are not restated here.
  why: >-
    One authorization defect in a multi-tenant telematics API escalating to fleet-wide control
    is the failure mode teams building vehicle and fleet platforms design against.
  followup: Watch for a vendor statement, a fix confirmation, and any CVE assignment.
  sources:
  - label: Eaton Works
    url: https://eaton-works.com/2026/07/27/my-eicher-hack/
  - label: HN 49070756
    url: https://news.ycombinator.com/item?id=49070756
- title: A walk through Go's new Green Tea collector as it moves across the heap
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The post measures Go's new Green Tea collector and shows where cache-friendliness improves,
    though sparse pages still cannot be reclaimed.
  summary: >-
    A post dated 2026-07-19 observes the old and the new Go garbage collector at work and
    measures where the new one differs. Green Tea shipped in Go 1.25 and is the default in
    Go 1.26. The post uses perf to locate where the cache-friendliness shows up, visualizes
    size-class span allocation against C#, and names the case that does not improve: a non-moving
    collector cannot reclaim sparse pages. The author is Phil Eaton, bylined on the publisher's
    own domain. The post reached the Hacker News front page on 2026-07-25 at 237 points with
    30 comments. It is carried nine days after publication as measured analysis of a collector
    that every Go 1.26 service runs by default, not as news of a release.
  why: >-
    Every Go service on 1.26 runs Green Tea whether or not the team read the release note,
    so a measured account of what changes and what does not is what a team checks before it
    attributes a latency shift to the collector.
  sources:
  - label: The Consensus
    url: https://theconsensus.dev/p/2026/07/19/observing-gos-garbage-collector-old-and-new.html
  - label: Go blog on Green Tea
    url: https://go.dev/blog/greenteagc
  - label: HN 49045474
    url: https://news.ycombinator.com/item?id=49045474
- title: Inside Zig's incremental compilation
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A Zig core team member describes how the compiler detects which functions changed and
    recompiles only those in 50 to 70 milliseconds per rebuild.
  summary: >-
    A Zig core team member describes how the compiler detects which individual functions and
    declarations changed, recompiles only those, and patches the resulting bytes into the
    output binary. The stated measurements are a roughly 5 second initial build of the Fizzy
    pixel editor followed by 50 to 70 millisecond rebuilds, shown in a silent screen recording.
    Source files are parsed and lowered to ZIR by AstGen, which is a pure function of file
    contents, so that stage is parallel and cacheable on disk and has been on by default for
    years. Semantic analysis is split into four kinds of analysis unit: the layout of a struct
    or union, the type of a container-level declaration, the value of a container-level const,
    and the body of a runtime function. Units record dependencies on other units and on hashes
    of specific source regions, so an edit marks the dependent units outdated. The author
    states that language design decisions were changed to make this tractable, including some
    that were contested. The demo requires Zig master, because 0.16.0 has incremental compilation
    but lacks linker features added since, so users on tagged releases wait for 0.17.0. The
    work is tracked as ziglang/zig issue 1535, open since 2018.
  why: >-
    Rebuild latency sets the edit-compile-run loop for every Zig user, and the post names
    which language rules exist to keep dependency tracking sound rather than presenting the
    result as a build-system tweak.
  followup: Watch for 0.17.0 to carry the linker support the demo needs.
  sources:
  - label: mlugg.co.uk
    url: https://mlugg.co.uk/posts/incremental-compilation-internals/
  - label: ziglang/zig issue 1535
    url: https://github.com/ziglang/zig/issues/1535
  - label: HN 49085666
    url: https://news.ycombinator.com/item?id=49085666
