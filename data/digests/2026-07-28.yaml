date: '2026-07-28'
stories:
- title: MCP ships the 2026-07-28 specification with a stateless protocol core
  section: Top stories
  category: Agentic coding
  blurb: >-
    The specification removes the initialize handshake and session, allowing MCP servers to
    route requests to any instance behind a load balancer.
  summary: >-
    The maintainers published the final 2026-07-28 specification at 09:00 UTC. David Soria
    Parra, named in the post, calls it MCP's most important release since remote MCP first
    launched over a year ago. TypeScript, Python, Go, and C# SDKs shipped the same day, with
    the Rust SDK in beta. The release is breaking. The initialize and initialized handshake
    is removed under SEP-2575, and the `Mcp-Session-Id` header and the protocol-level session
    are removed under SEP-2567, so protocol version, client identity, and client capabilities
    now travel in `_meta` on every request and any request can land on any instance behind
    a round-robin load balancer. A client that still wants server capabilities up front uses
    a new optional `server/discover` RPC. Streamable HTTP requires `Mcp-Method` and `Mcp-Name`
    headers under SEP-2243 so gateways route without parsing bodies. Server-initiated elicitation,
    sampling, and `roots/list` are replaced by Multi Round-Trip Requests under SEP-2322, which
    return `resultType` of `input_required` for the client to retry with `inputResponses`.
    List and resource-read results carry `ttlMs` and `cacheScope` under SEP-2549. Tasks moves
    out of the experimental core into an extension under SEP-2663, with poll-based `tasks/get`
    and a new `tasks/update`. Roots, Sampling, Logging, and the legacy HTTP plus SSE transport
    are deprecated under a policy guaranteeing at least twelve months before removal. Dynamic
    Client Registration is deprecated in favour of Client ID Metadata Documents, and clients
    must validate the RFC 9207 `iss` parameter under SEP-2468. The adoption figure in the
    post, close to half a billion Tier 1 SDK downloads a month with the TypeScript and Python
    SDKs each past one billion total, is the maintainers' own and is not independently checked.
    The post carries 15 attributed quote blocks, 13 of them from outside the two MCP maintainers,
    naming AWS, Cloudflare, Microsoft, Google Cloud, Figma, Netlify, Supabase, and Honeycomb
    among others, which are statements of intent rather than shipped support.
  why: >-
    Every team operating a remote MCP server now has dated migration work against a stated
    twelve-month deprecation clock, and the removed session means a server no longer needs
    sticky routing.
  followup: >-
    Watch for the removal dates attached to Roots, Sampling, Logging, and the HTTP plus SSE
    transport, and for the Rust SDK leaving beta.
  comments: >-
    The Hacker News submission points at the release candidate post rather than the release
    post. That candidate post carries a published date of 2026-05-21 and a modified date of
    2026-07-24, so the discussion thread does not date today's event.
  sources:
  - label: Model Context Protocol blog
    url: https://blog.modelcontextprotocol.io/posts/2026-07-28/
  - label: release candidate post
    url: https://blog.modelcontextprotocol.io/posts/2026-07-28-release-candidate/
  - label: HN 49088058
    url: https://news.ycombinator.com/item?id=49088058
- title: Claude shared chats and Artifacts turn up in Google and Bing search results
  section: Top stories
  category: Security
  blurb: >-
    Claude share pages are excluded via robots.txt but carry no noindex, allowing search engines
    to index URLs found through other discovery paths.
  summary: >-
    Wired states that private Claude chats were exposed in Google and Bing search results.
    TechCrunch put it in hedged terms on 2026-07-27, saying shared chats and Artifacts may
    have ended up on Google, and reports that the issue appears to have originated from Claude's
    share-chat feature, which creates links that let anyone holding the URL view a conversation
    or project. The number of exposed pages and any Anthropic response are not established
    here. The mechanism reported is that the share pages are excluded through `robots.txt`
    and carry no `noindex` directive, which blocks crawling but does not stop a search engine
    indexing a URL it discovered elsewhere. Claude share pages are a hosted surface with no
    user-visible version, so affected-version information does not apply, and the scope of
    affected share links is not yet known.
  why: >-
    Engineers paste code, configuration, and internal detail into assistant chats and then
    treat share links as unlisted, so share URLs reachable through a search index are a data-exposure
    path inside an ordinary development workflow.
  followup: >-
    Watch for an Anthropic statement, for a stated scope of affected share links, and for
    whether the indexed pages are removed.
  sources:
  - label: Wired
    url: https://www.wired.com/story/private-claude-chats-exposed-in-google-and-bing-search-results/
  - label: TechCrunch
    url: https://techcrunch.com/2026/07/27/psa-your-claude-shared-chats-and-artifacts-may-have-ended-up-on-google/
  - label: HN 49075115
    url: https://news.ycombinator.com/item?id=49075115
- title: Moonshot publishes the Kimi K3 technical report
  section: Top stories
  category: Paper
  blurb: >-
    Kimi K3, a 2.8T-parameter model with 104B active parameters, trails both Claude Fable
    5 and GPT-5.6 Sol on overall benchmark performance.
  summary: >-
    Moonshot published the Kimi K3 technical report on arXiv as 2607.24653, with the same
    document carried in the MoonshotAI/Kimi-K3 repository. This is the follow-up the 2026-07-27
    entry asked for. The report's benchmark table is Moonshot's own and is not independently
    reproduced: it places K3 ahead on SWE-Marathon at 42.0 and MCPMark-Verified at 94.5. The
    report's abstract concedes that K3 trails both Claude Fable 5 and GPT-5.6 Sol overall,
    with DeepSWE, FrontierSWE, and HLE-Full among the benchmarks where it is behind. The weights
    carry a custom Kimi K3 licence rather than the modified MIT licence used for K2, and ship
    as 96 safetensors shards at about 1.56 TB. The architecture the report documents was published
    with the weights on 2026-07-27: 2.8T total parameters with 104B active, 93 layers split
    into 69 Kimi Delta Attention layers and 24 Gated MLA layers, 896 experts with 16 selected
    per token plus 2 shared, a 401M-parameter MoonViT-V2 vision encoder, a 1,048,576-token
    context, and MXFP4 weights with MXFP8 activations under quantization-aware training.
  why: >-
    The report is the citable architecture document for a 2.8T-parameter open-weights model,
    and the licence change away from K2's modified MIT terms is what a team checks before
    committing to a deployment.
  followup: >-
    Watch for independent benchmark reproduction, and for how the custom Kimi K3 licence constrains
    commercial deployment.
  thread: f-0093
  sources:
