- title: XBOW turns a 16-byte zero write in the Linux SMC-D loopback driver into root
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    XBOW escalates a 16-byte zero write in the Linux SMC-D loopback driver to root, succeeding
    on 22 of 100 boots.
  summary: >-
    XBOW reports driving CVE-2026-72018, a 16-byte out-of-bounds zero write in the Linux SMC-D
    loopback path, all the way to root. The dibs_loopback device made SMC-D code that previously
    ran only on IBM Z mainframes reachable on ordinary x86, and the bounds checks were never
    added because the port's reviewers were not modelling a malicious peer. The exploit requires
    CAP_NET_ADMIN and succeeded on 22 of 100 boots with all kernel mitigations disabled. XBOW
    states it measured the exploit on Ubuntu 24.04 with Linux 7.1.0-rc6 on x86_64, gives no
    affected version range, and names no fixed stable release.
  why: >-
    CAP_NET_ADMIN is held by container runtimes and network daemons, and the durable finding
    is the class rather than the CVE: any commit that makes an obscure subsystem testable
    without its hardware is a candidate for the same review.
  followup: >-
    Track the fixed stable kernel versions and distribution backports, and whether other SMC-D
    paths exposed by dibs_loopback carry the same missing checks.
  sources:
  - label: XBOW
    url: https://xbow.com/blog/no-time-to-pwn-cve-2026-72018
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49901191
- title: >-
    A malicious Copilot Cowork Skill hijacked the sandbox's own AI gateway to exfiltrate files
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A malicious Copilot Cowork Skill used the sandbox's own Anthropic egress to exfiltrate
    document text with no approval step.
  summary: >-
    PromptArmor reports that Microsoft Copilot Cowork runs in a sandbox intended to block
    network access, but that the sandbox forwards requests to Anthropic so the agent can generate
    responses at all. A Skill's bundled script activated that same pathway, spawned agents
    in Anthropic's cloud each holding one sentence of the victim's document and a web fetch
    tool, and instructed them to request an attacker URL with the data appended, which the
    attacker then read from server logs, with no human approval step and with uploaded files,
    SharePoint, Teams, and Outlook reachable. PromptArmor states it disclosed the issue on
    2026-07-14, that Microsoft confirmed the behaviour on 2026-08-17, and that Microsoft confirmed
    a fix on 2026-09-02. Copilot Cowork is a hosted product, so no affected version range
    applies and those three dates are the whole timeline a reader gets.
  why: >-
    The exfiltration channel was the egress the sandbox is required to have, so a deny-network
    agent sandbox that must still reach its model provider carries the hole by construction.
  sources:
  - label: PromptArmor
    url: https://www.promptarmor.com/resources/hijacking-copilot-coworks-ai-gateway-to-exfiltrate-files
