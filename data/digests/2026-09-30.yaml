- title: >-
    Basecamp publishes a Rust port of Campfire proved pixel-identical to the Rails app at
    completion and 20 to 95 times faster
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Basecamp's Rust port of Campfire was proved pixel-identical to the Rails original across
    225 screen states when it was finished.
  summary: >-
    The Rails application is pinned as a git submodule and used as the oracle, and no expected
    output was written by hand. A Playwright harness compares 225 screen states across three
    engines and four viewports on server HTML, live DOM, accessibility tree, every subresource,
    Action Cable frames, and screenshots at zero pixel tolerance, and the harness was first
    required to show Rails matching itself. Full parity held when the port was finished, and
    the README states the port has since diverged on purpose: the latest lean gate passed
    873 of 874 cells with the web app manifest allowlisted, and CSRF tags, session cookie
    writes, and override digests are now excluded from comparison. Each speedup is attributed
    and measured separately, and the largest single gain is not Rust: indexing messages by
    room and creation time took the messages page from 87 to 17,972 requests per second in
    a 236,000-message room.
  why: >-
    The oracle plus differential harness is the transferable part, because it makes a rewrite's
    equivalence claim checkable rather than asserted.
  sources:
  - label: repository
    url: https://github.com/basecamp/once-campfire-rust
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49889976
- title: >-
    Netlify replaces V8 isolates with Firecracker MicroVMs and reports median Edge Function
    invocation at 5 to 6 ms
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Netlify moved Edge Functions from V8 isolates to Firecracker MicroVMs and reports median
    invocation at 5 to 6 ms.
  summary: >-
    Netlify reports a warm invocation at 5 to 6 ms at the median, down from 25 to 40 ms, p99
    invocations 47.4 percent faster, 99.998 percent availability, and cold invocations on
    about 1.2 percent of requests at about 9 ms. Each function runs in its own Firecracker
    MicroVM started from a snapshot in about 2 ms at p99, with the bundle mounted as an uncompressed
    EROFS image and memory-mapped so only the used parts are read, and compute nodes are chosen
    by rendezvous hashing with the stickiness relaxed above a threshold to avoid hot spots.
    The lifecycle work is attributed to Unikraft, nothing changes for existing code, and pricing
    is unchanged.
  why: >-
    Netlify states the 50 ms CPU per request, 512 MB memory, and 20 MB compressed code limits
    are artifacts of the isolate model and now open to revision, and that V8 isolates do not
    give deploy-level isolation despite the name, which is the reusable claim for anyone choosing
    between the two models.
  followup: >-
    Track whether the stated limits are actually raised and whether the npm package caveats
    are removed.
  sources:
  - label: post
    url: https://www.netlify.com/blog/edge-functions-firecracker-microvms/
  - label: HN discussion
