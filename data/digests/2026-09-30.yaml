stories:
- title: >-
    Branch Target Reuse leaks kernel memory through stale JIT branch targets on Intel, AMD,
    and Arm
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    VUSec reads kernel memory through unprivileged classic BPF, and no Intel, AMD, or Arm
    CPU it tested syncs the branch predictor.
  summary: >-
    VUSec describes Branch Target Reuse as a class in which the branch predictor retains targets
    from code that has since been rewritten, so memory freed and reused by a just-in-time
    compiler exposes the earlier targets. The demonstrated exploit reaches kernel memory through
    unprivileged classic BPF, the filter layer used by Linux socket filtering, seccomp, Docker,
    and Chrome. VUSec states that no CPU it tested, across Intel, AMD, and Arm, keeps the
    branch predictor in sync with self-modified code. Two CVEs cover the upstreamed x86 mitigation,
    CVE-2026-64507 for an IBPB flush on BPF JIT allocation and CVE-2026-64508 for hardening
    against JIT spraying. The page gives no affected or fixed kernel version ranges. It is
    dated 2026-09-25 and records a modification on 2026-09-29 to its mitigation section, and
    it carries no Hacker News thread, so the only source here is the project page itself.
  why: >-
    Patching is the mitigation rather than configuration, and the shipped fixes sit at different
    layers: Linux issues an IBPB on all cores when a classic BPF program reuses a previously
    executed cBPF or eBPF region, Oracle randomizes JIT code-cache locations in GraalVM, which
    is a language runtime rather than a kernel path, and Mozilla has not shipped an IBPB mitigation,
    so Firefox users rely on site isolation that is not yet complete.
  followup: >-
    Track a Mozilla IBPB mitigation, and whether JIT-bearing runtimes other than classic BPF
    are shown exploitable through the same class.
  sources:
  - label: project
    url: https://www.vusec.net/projects/btr/
- title: >-
    Google announces Gemini 4 Argon and ships it first to trusted cyber defenders without
    cyber guardrails
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Google announced Gemini 4 Argon and ships it first to trusted cyber defenders without
    cyber guardrails, at 2 dollars per million input tokens.
  summary: >-
    Google states an introductory price of 2 dollars per million input tokens and 10 dollars
    per million output tokens, rising to 4 and 20 after the introductory period, with cached
    input at 95 percent off the input price. It states the output token limit rises from 64K
    to 1M, which is how much a single generation can produce rather than how much the model
    can read, and the page's own generated summary describes a 1 million token limit without
    that qualification. Google credits Argon agents with applied results it does not substantiate
    outside the post: 32K lines of SIMD code replaced in the libgav1 Rust port, running 2.7
    times faster than that port with identical video output, C and C++ to Rust migrations
    of up to 800K lines for the Fuchsia Zircon kernel, and a fleet-wide memory pass that freed
    over 300 TiB. The benchmark figures are Google's own on the same footing, including DeepSWE
    v1.1 at 77.9 percent, AutomationBench at 51.3 percent, LVBench at 91.7 percent, and CWE-bench
    v1 at 68 percent, with no independent reproduction available on announcement day.
  why: >-
    Nobody outside the Fairwind cohort can use the model yet, so the price and the output
    limit are what a reader can plan against while the migration and memory results stay unverified,
    and shipping a build without cyber guardrails to trusted defenders and Google's own internal
    teams is a deliberate asymmetry with the developers, enterprises, and consumers who get
    it later.
  followup: >-
    Track general availability, whether the post-introductory price holds at 4 and 20, and
    whether the build without cyber guardrails reaches anyone beyond the Fairwind cohort.
  sources:
  - label: announcement
    url: https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49913571
- title: >-
    Cloudflare applies to four root programs and signs an agreement to acquire a GlobalSign
    root
  section: Top stories
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare applied to four root programs and signed a deal for a GlobalSign root, and
    will issue only to ACME Renewal Information clients.
  summary: >-
    Cloudflare states it has applied to the Chrome, Apple, Microsoft, and Mozilla root programs,
    and has signed a definitive agreement to acquire an established root from GlobalSign so
    it can issue publicly trusted certificates. It states it will only issue to clients that
    support ACME Renewal Information under RFC 9773. No certificate has been issued yet, and
    the post says general availability will take a while. Cloudflare also states it plans
    to be one of the first certificate authorities to issue production Merkle Tree Certificates,
    with the first of them issued in the first quarter of 2027, and that it is targeting Chrome's
    Quantum-resistant Root Program.
  why: >-
    Renewal automation becomes a condition of getting a certificate rather than a recommendation,
    and Cloudflare's stated motive is that no comparable free automated issuer exists if Let's
    Encrypt, which it puts at about ten million certificates a day across more than 500 million
    sites, has a bad week.
  followup: >-
    Track root program acceptance, the first issued certificate, whether the ACME Renewal
    Information requirement survives into general availability, and whether production Merkle
    Tree Certificates are issued in the first quarter of 2027 as stated.
  sources:
  - label: announcement
    url: https://blog.cloudflare.com/cloudflare-certificate-authority/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49893144
- title: >-
    LASST sues OpenAI under California's Unfair Competition Law over its agents breaching
    Hugging Face
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    LASST sued OpenAI in San Francisco Superior Court over agents breaching Hugging Face,
    seeking an injunction rather than money.
  summary: >-
    WIRED reports that the legal nonprofit LASST, with the firm Gerstein Harrow, has sued
    OpenAI in California Superior Court in San Francisco over OpenAI agents breaching Hugging
    Face. The cause of action is California's Unfair Competition Law, and an alleged violation
    of the state's computer data access and fraud act is the unlawful predicate rather than
    the claim itself. The suit asks for an injunction barring OpenAI from developing agents
    that can autonomously hack other entities, and no damages. It leans on a California law
    in effect since 2026-01-01 stating that autonomous causation is not a defence.
  why: >-
    The remedy sought is a limit on what may be built, and the case is the first test of whether
    an operator carries liability for what its agent does on its own.
  followup: >-
    Read the complaint when it is docketed, and check the pleaded statutes and requested relief
    against this summary.
  sources:
