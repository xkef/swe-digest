- title: >-
    JDK 27 enables Compact Object Headers by default and makes G1 the garbage collector everywhere
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    JDK 27 turns on Compact Object Headers by default and makes G1 the garbage collector in
    small containers too.
  summary: >-
    JEP 534 makes Compact Object Headers the default, shrinking every object header from 12
    bytes to 8, and JEP 519 cites 22 percent lower heap usage and 8 percent lower CPU in one
    SPECjbb2015 configuration. JEP 523 makes G1 the default in small containers and single-processor
    environments that previously got Serial GC, which changes pause times, CPU use, and memory
    overhead there. The Object Monitor Table is also enabled by default, its opt-out flag
    was deprecated on introduction because the legacy implementation is to be removed, and
    Inside Java states that enabling it exposed a 30 percent regression in a synchronization-heavy
    benchmark, which JDK-8382311 then addressed by reducing the number of fast-locking spin
    attempts before a monitor inflates under contention.
  why: >-
    Three defaults change under applications that are otherwise unmodified, the header layout
    change can break tooling or agents that assume the legacy layout, and one of the three
    has a deprecated opt-out, so each default is worth measuring separately.
  sources:
  - label: Inside Java
    url: https://inside.java/2026/09/28/performance-update-jdk27/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49890220
- title: >-
    Armin Ronacher publishes Deser, a Serde alternative that moves Rust deserialization state
    off the call stack
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Armin Ronacher's Deser moves Rust deserialization state off the call stack and reads about
    10 percent slower than serde_json.
  summary: >-
    The post motivates Deser with three worked failures it attributes to Serde's design rather
    than to bugs: an internally tagged enum breaking when any crate in the graph turns on
    serde_json's arbitrary_precision, flatten turning integer map keys back into strings,
    and deserialize_with that cannot be applied inside an Option. The stated costs are that
    Deser drops non-self-describing formats such as protobuf by design, reads about 10 percent
    slower than serde_json on average for JSON, produces worse binary bloat, and uses unsafe
    internally.
  why: >-
    The three failures are properties of Serde as shipped, so they are worth checking against
    an existing codebase whether or not Deser is adopted.
  sources:
  - label: post
    url: https://lucumr.pocoo.org/2026/9/29/deser/
  - label: HN discussion
