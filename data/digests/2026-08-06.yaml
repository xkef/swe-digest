- title: >-
    Zed opens early access for DeltaDB, a version control system that records edits between
    commits and links them to the agent conversation
  section: Developer tools
  category: Dev tools
  blurb: >-
    Zed opened early access for DeltaDB, recording individual edits and associating them with
    agent conversations, making mid-run branching cheap.
  summary: >-
    Zed opened early access for DeltaDB. It records individual edits between commits and associates
    them with the agent conversation that produced them, with a virtualized worktree described
    as the mechanism. Access is early access only, with no general availability date stated.
  why: >-
    Virtualizing the worktree is what would make branching mid-agent-run cheap, which is the
    operation git has no answer for when the unit of work is an agent session rather than
    a commit.
  sources:
  - label: primary
    url: https://zed.dev/deltadb
  - label: discussion
    url: https://news.ycombinator.com/item?id=49187256
- title: >-
    Deno publishes celld, running Workers and Durable Objects on your own machines with an
    S3 bucket as the only coordinator
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Deno published celld, running Workers and Durable Objects on self-managed machines with
    only an S3-compatible bucket as coordination.
  summary: >-
    Deno published celld, which runs Workers and Durable Objects on self-managed machines.
    An S3-compatible bucket is the only coordination dependency.
  why: >-
    Object-storage compare-and-swap decides cell ownership, so a fleet runs with no control
    plane, no membership protocol and no consensus service to operate.
  sources:
  - label: primary
    url: https://github.com/denoland/celld
  - label: discussion
    url: https://news.ycombinator.com/item?id=49185430
- title: >-
    DynamoDB adds a native vector index, removing the copy into a separate vector store
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    AWS added native vector index to DynamoDB in the same table, where inline filters accept
    exact-match values only, not ranges.
  summary: >-
    AWS added a native vector index to DynamoDB, so vectors are queried in the table that
    holds the records. Inline filters accept exact-match values only.
  why: >-
    Inline filters accept exact-match values only, with no BETWEEN or BEGINS_WITH, so a range-filtered
    similarity query still needs a second store.
  sources:
  - label: primary
    url: https://aws.amazon.com/blogs/aws/amazon-dynamodb-now-supports-real-time-vector-search-at-any-scale/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49185384
- title: >-
    Cursor open-sources Mixture-of-Kittens, a fused MoE training megakernel, and reports 2.37x
    MXFP8 forward throughput over the fastest public baseline
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Cursor open-sourced Mixture-of-Kittens, a MoE megakernel reporting 2.37x MXFP8 throughput,
    where pull-based dispatch outperforms push.
  summary: >-
    Cursor open-sourced Mixture-of-Kittens, a production mixture-of-experts training megakernel
    that fuses all MoE communication and computation into a single deterministic kernel and
    powers Composer training across tens of thousands of GPUs. The post reports 2.37x higher
    MXFP8 forward throughput than the fastest public baseline and 1.41x end-to-end tokens
    per second. A signalling microbenchmark in the post shows dispatch latency falling from
    103 to 18 microseconds when receivers pull tokens instead of senders pushing them.
  why: >-
    The result inverts the usual assumption that push saturates NVLink better, and the reason
    is signalling rather than bandwidth, because pull-based dispatch removes cross-GPU completion
    signals entirely.
  sources:
  - label: primary
    url: https://cursor.com/blog/mixture-of-kittens
  - label: discussion
    url: https://news.ycombinator.com/item?id=49183783
- title: >-
    A practitioner argues webhooks are the wrong primitive for replication and drafts a cursor-addressed
    change feed instead
  section: Engineering posts
  category: Engineering post
  blurb: >-
    A practitioner argues webhooks fail at replication and drafts cursor-addressed feeds,
    where reconciliation cron admits no delete detection.
  summary: >-
    The post argues that webhooks are used to replicate provider state into a local copy,
    a job they are not built for. It sketches a cursor-addressed change feed that a consumer
    reads at its own pace and resumes from a stored position.
  why: >-
    The reconciliation cron is the tell, because a nightly diff against the provider's list
    APIs is an admission that the local copy has no way to detect a dropped delete.
  sources:
  - label: primary
    url: https://weli.dev/blog/the-valley-of-webhooks/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49184216
- title: >-
    GitGuardian traces a spam campaign that drove GitHub's public commit rate to 40 million
    a day
  section: Engineering posts
  category: Engineering post
  blurb: >-
    GitGuardian traces spam raising GitHub's public commit rate from 8 million to 40 million
    a day, with 728 of the last 1,000 events spam.
  summary: >-
    GitGuardian traces a spam campaign that took the public commit rate from 8 million a day
    in June to close to 40 million on 2026-07-31. It reports 728 of the last 1,000 GitHub
    Archive events belong to the campaign, and that the pushes serve an ad redirect chain.
    GitHub's commit, repository and active-user counts are inflated by the same activity.
  why: >-
    The public events API is the measurement surface a lot of tooling reads, and with the
    feed pinned at its 300-event cap anything sampling it now samples advertising rather than
    development.
  sources:
  - label: primary
    url: https://blog.gitguardian.com/40-million-fake-push-when-spam-commits-took-over-the-public-github/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49184553
- title: >-
    Chips and Cheese reads NVIDIA's Vera whitepaper as a 3.0% system result presented per
    core
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Chips and Cheese shows Vera's per-core normalization hides a 3.0% system throughput difference
    from EPYC when read as socket totals.
  summary: >-
    The review states that the whitepaper's 1.7x to 1.8x chart and its configuration pages
    describe the same silicon. Full estimated SPECrate 2026 Integer Base totals are 925 for
    two Vera sockets against 898 for two EPYC 9755 sockets, a 3.0% system throughput difference,
    and the gap between the two presentations is per-core normalization across 176 Vera cores
    versus 256 EPYC cores. It also documents four SPEC integer components relabelled as agentic
    benchmarks, an SMT diagram that draws per-cycle thread selection as time-slicing, an optional
    AMD NUMA configuration presented as the x86 baseline, and a roughly 10,000-cycle penalty
    for an Olympus core to return to single-thread mode.
  why: >-
    Capacity planning from the chart reads a per-core ratio as a machine-level one, and the
    socket totals in the same document put the two systems within 3.0%.
  sources:
  - label: primary
    url: https://chipsandcheese.com/p/nvidias-vera-whitepaper-has-a-thread
  - label: discussion
    url: https://news.ycombinator.com/item?id=49189234
- title: >-
    Jeff Dean, Sanjay Ghemawat, Quoc Le and Oriol Vinyals name their new company Discovery
    Loop
  section: Markets and companies
  category: Markets
  blurb: >-
    Jeff Dean, Sanjay Ghemawat, Quoc Le and Oriol Vinyals founded Discovery Loop to automate
    machine learning research and engineering.
  summary: >-
    A company page went live naming Discovery Loop with Jeff Dean, Sanjay Ghemawat, Quoc Le
    and Oriol Vinyals as founders. The page states the agenda in two sections, "The Approach"
    and "Mission": building systems that automate entire experimental loops using frontier
    AI models and large-scale compute, an initial focus on automating machine learning research
    and engineering, the company acting as its own first customer to optimize its own stack,
    and National Academy of Engineering Grand Challenges as the eventual target. The page
    states no funding and no corporate structure.
  why: >-
    The stated first application is the company's own stack, so the near-term output is internal
    machine learning research and engineering automation rather than a product.
  sources:
  - label: primary
    url: https://www.discoveryloop.com/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49184960
