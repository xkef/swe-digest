- title: >-
    pnpm 12.4 installs npm, Cargo and Python dependencies from one workspace and one lockfile
    pass
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    pnpm 12.4 resolves npm, Cargo and Python dependencies from one workspace file, sharing
    one store and one fetch path.
  summary: >-
    Setting `cargo.enabled` and `python.enabled` in `pnpm-workspace.yaml` lets one `pnpm install`
    resolve all three ecosystems, each keeping its own semantics: crates go to `Cargo.toml`
    and `Cargo.lock` and are vendored through `.cargo/config.toml`, Python goes to `pyproject.toml`
    and a standard `pylock.toml` with a managed per-project `.venv` on PATH. What is shared
    sits below the ecosystem boundary, meaning one HTTP and authentication budget, one verified-artifact
    ingestion path and one content-addressable store, with frozen and offline installs working
    for all three. The release also adds `pnpm pipeline`, which runs a workspace task graph
    the way CI would and continues past the first failure, and ships binaries for Android
    arm64 and x64, FreeBSD x64, and Linux ppc64le, s390x and RISC-V.
  why: >-
    A polyglot repository can drop separate install, cache and authentication paths for three
    package managers, at the cost of settings the maintainers state may still change.
  followup: >-
    Whether the Cargo and Python workspace settings stabilize or change shape in a later release.
  sources:
  - label: release notes
    url: https://pnpm.io/blog/releases/12.4
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49670596
- title: >-
    Seven async runtimes produce four different outputs for the same fire-and-forget program
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Brown researchers run one fire-and-forget program on seven async runtimes and get four
    different outputs from it.
  summary: >-
    Brown University's Cognitive Engineering Lab identifies nine observable design dimensions
    in async/await, grouped as start of life, end of life and cancellation, and compares seven
    runtimes: Asyncio, C#, JavaScript, Tokio, Smol, Trio and Swift. Running three variations
    of one small program across seven runtimes produced four different outputs, and no two
    runtimes agreed on all three variations.
  why: >-
    Async semantics carried from one language to another are not portable at the level of
    what a program prints.
  sources:
  - label: primary
    url: https://cel.cs.brown.edu/blog/design-space-async-await/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49626718
- title: >-
    Three years on, the Apple Neural Engine turns out to have no instruction set, only DMA
    writes into configuration registers
  section: Apple platforms
  category: Apple
  status: confirmed
  blurb: >-
    Reverse engineering finds the Apple Neural Engine has no instruction set, only DMA burst
    writes into fixed hardware registers.
  summary: >-
    Eileen Yoon returns to an abandoned reverse-engineered M1 ANE driver to map the block,
    and reports that a task descriptor is not an instruction stream: each descriptor is a
    sequence of burst-write packets copying 32-bit words from IOMMU virtual memory into fixed
    hardware register blocks, with no load-weights opcode and no dynamic load or store from
    a virtual address. The compute side is 16 cores of 128 FP16 or 256 INT8 MAC lanes, 2048
    lanes total, with a 32-bit Q16.16 accumulator that saturates at 2^15, and tanh implemented
    as a 33-entry piecewise-linear lookup table. The post, dated 2026-08-10, frames the design
    as assumptions about predictable CNN reuse that Apple committed to silicon in 2017 and
    that transformer decode broke, and reads the M5 folding ANE cores into the GPU as the
    end of the standalone NPU.
  why: >-
    A fixed-function accelerator with no instruction set cannot be retargeted in software,
    which bounds what any third-party ANE backend can ever compile to.
  sources:
  - label: primary
    url: https://eiln.github.io/posts/ane.html
  - label: driver source
    url: https://github.com/eiln/ane
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49670032
- title: >-
    PlanetScale sustains 118.5 million queries per second on 512 Neki shards over 1.22 PiB
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    PlanetScale reports 118.5 million queries per second on 512 Neki shards over 1.22 PiB
    of single-shard point reads.
  summary: >-
    PlanetScale reports sustaining 118.5 million queries per second across 512 Neki shards
    over 1.22 PiB. Per-shard throughput held within 0.8 percent from 5 to 50 shards. The post
    states the workload was single-shard point selects by primary key, with no writes, no
    replicas and no failover during the measured window.
  why: >-
    The scaling figure is narrow by the vendor's own statement, so it bounds sharded read
    fan-out and says nothing about write or failover behavior.
  sources:
  - label: primary
    url: https://planetscale.com/blog/118-million-queries-per-second-on-neki
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49660555
- title: >-
    Conviva replaced mmap with io_uring and O_DIRECT in its Rust query engine and the first
    cut ran 60 percent slower
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Conviva replaced mmap with io_uring and O_DIRECT in its Rust query engine, and query time
    rose from 13.6s to 21.8s.
  summary: >-
    Conviva reads 3 to 5 GB Arrow IPC files from local NVMe and found mmap thrashing under
    concurrency: p95 rose from about 30s to over 150s, adding pods made it worse because the
    host page cache is shared, and a controlled test had one pod beat four pods by 41 percent
    at maximum load. Off-CPU analysis put the cost in futex waits at 30.9 percent and preemption
    at 29.3 percent against 6.9 percent in actual disk I/O, with mmap delivering 3.44 GB/s
    against a 21.7 GB/s fio ceiling, and moving to io_uring with O_DIRECT cut major faults
    from 128,957 to 3,647, a 35x reduction, while minor faults rose 8x to 8.6 million and
    total query time went from 13.6s to 21.8s. The post, dated 2026-09-01, attributes the
    regression to the design around the I/O rather than the I/O primitive, naming a single
    materialization thread doing submission, completion, Arrow decode and cache management.
  why: >-
    A measured negative result against the usual direction of travel, showing that swapping
    the I/O primitive without restructuring the consumer moves the bottleneck rather than
    removing it.
  sources:
  - label: primary
    url: https://www.conviva.ai/resource/we-replaced-mmap-with-io_uring-in-our-rust-query-engine-it-got-slower/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49653882
- title: >-
    Dioxus maintainer reports tens of thousands of agent-written Rust lines that never cleared
    the merge bar
  section: New videos
  category: Video
  status: discussion
  blurb: >-
    A Dioxus maintainer says tens of thousands of agent-written Rust lines never merged, while
    build plugins went years to weeks.
  summary: >-
    Jonathan Kelley says the Dioxus team maxed out coding-agent subscriptions and produced
    tens of thousands of lines of Rust covering long-wanted features, that almost none of
    it was merged, and that it still sits in draft, a failure mode he names the slop cannon.
    He is equally specific about where agents paid off: deeply integrated Kotlin and Swift
    build plugins went from years of hand-written work to weeks, and release checklists, backports
    and documentation accuracy became tractable for a team of three. He states tests did not,
    because agents write tests for any API but rarely the right ones, though they do well
    at fuzzing harnesses, and he treats Rust's learning curve as an advantage now that agents
    absorb the borrow checker. Channel: AI Engineer (2026-09-11)
  why: >-
    A named maintainer putting volume, merge rate and the specific categories that worked
    against each other is harder to dismiss than either side of the agent-productivity argument
    in the abstract.
  sources:
  - label: watch
    url: https://www.youtube.com/watch?v=H7vFrcNWXzs
  - label: project
    url: https://github.com/dioxuslabs/dioxus
- title: >-
    Salesforce closes its acquisition of Fin, the former Intercom, three months after the
    agreement
  section: Markets and companies
  category: Markets
  status: confirmed
  blurb: >-
    Salesforce closed its roughly $3.6 billion acquisition of Fin, the former Intercom, on
    2026-09-10, ahead of the stated schedule.
  summary: >-
    This digest carried the definitive agreement on 2026-06-15 at about $3.6 billion, then
    expected to close in Salesforce fiscal Q4 2027, and it closed on 2026-09-10 instead. Salesforce
    states Fin brings more than 30,000 customer companies and its own customer-experience
    model suite, and that Fin will continue to serve its customers from inside Salesforce
    AI Labs alongside Agentforce rather than being folded into it. The resolution rate of
    76 percent is Salesforce's own figure with no method stated.
  why: >-
    Teams integrating against Intercom or Fin APIs now depend on a Salesforce roadmap.
  followup: >-
    Whether Fin and Intercom APIs stay independent of Agentforce or are consolidated.
  sources:
  - label: press release
    url: https://www.salesforce.com/news/press-releases/2026/09/10/salesforce-completes-acquisition-of-fin/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49666354
