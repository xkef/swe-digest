- title: >-
    Mbed TLS maintainers will stop TLS and X.509 security fixes in April 2027 unless new maintainers
    join
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The current team keeps TF-PSA-Crypto but leaves the TLS and X.509 libraries, which lose
    security fixes and releases without new maintainers.
  summary: >-
    An announcement dated 2026-10-08 on the Mbed TLS list says the existing maintainers will
    end their work on the TLS and X.509 libraries from April 2027. Unless new maintainers
    have ramped up by then, security incident response, fixes and releases will stop, and
    the project is asking organizations for engineering resources or funding.
  why: >-
    Embedded and firmware products that ship Mbed TLS need a maintenance plan or a migration
    path before April 2027.
  followup: Named new maintainers or funding for Mbed TLS before April 2027.
  sources:
  - label: primary
    url: https://lists.trustedfirmware.org/archives/list/mbed-tls@lists.trustedfirmware.org/thread/YPIGCB7WN6GCHOGEGKOJXUYAP7OK527W/
