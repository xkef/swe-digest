- title: Go accepts a generic Set type for golang.org/x/exp/collection/set
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The experimental package wraps map[E]struct{}, ranges like a map, and may become the canonical
    set type for Go public APIs.
  summary: >-
    Proposal 69230 now carries the Proposal-Accepted label after the Collections working group
    revised the API. The package defines Set[E comparable] backed transparently by map[E]struct{},
    with Of, Collect, Intersection and related helpers. It lives in golang.org/x/exp as a
    prototype rather than the standard library.
  why: >-
    Go code that hand-rolls map-based sets can try a shared type that may become the convention
    in public APIs.
  sources:
  - label: primary
    url: https://github.com/golang/go/issues/69230
  - label: discussion
    url: https://www.reddit.com/r/golang/comments/1xoe261/proposal_accepted_generic_sets/
- title: >-
    zlib 1.4 ships more than a dozen security fixes for buffer overflows and out-of-bounds
    reads
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The compression library release fixes buffer overflows, reads before input start and outside
    the window, and several minizip flaws.
  summary: >-
    zlib 1.4 includes fixes for buffer overflows, overrunning buffer writes, reading before
    the start of input, copying uninitialized memory to output, reading outside the window,
    and several minizip issues. It also updates the CMake build and adds Android large file
    support.
  why: >-
    zlib is linked or vendored into most toolchains and runtimes, so vendored copies and distribution
    packages need tracking for the update.
  followup: Distribution zlib package updates and CVE IDs for the fixed flaws.
  sources:
  - label: secondary
    url: https://www.phoronix.com/news/Zlib-1.4-Released
- title: >-
    Synaptics cease-and-desist takes down Vino, a reverse-engineered Rust driver for DisplayLink
    hardware
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    After a patent-based legal notice to its developer, the open-source Rust kernel driver
    for modern DisplayLink USB graphics left GitHub.
  summary: >-
    Phoronix reports that Synaptics sent the Vino developer a cease-and-desist on patent grounds,
    with the correspondence attached to an LKML thread. The clean-room Rust driver repository
    is no longer public.
  why: >-
    Linux users of modern DisplayLink docks remain on the proprietary driver with no upstream
    path in sight.
  sources:
  - label: primary
    url: https://www.phoronix.com/news/Synaptics-Blocks-Vino-Driver
