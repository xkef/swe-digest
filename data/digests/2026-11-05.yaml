- title: >-
    Google donates Agent Substrate, gVisor and OpenRL to CNCF and makes Agent Substrate 1.0
    GA on GKE
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The agent sandbox stack moves to neutral governance, and Google says CNCF ownership opens
    a path to upstream gVisor kernel patches.
  summary: >-
    Google donated Agent Substrate, gVisor and OpenRL to the CNCF Sandbox. Agent Substrate
    1.0 snapshots idle agent sessions and restores them onto warm Kubernetes workers in under
    500 ms, and is now GA on GKE. Ant Group, Modal and Tines committed to join gVisor maintainers,
    and OpenRL offers a Tinker-compatible RL post-training loop on Kubernetes.
  why: >-
    Teams running untrusted agent code on Kubernetes get a vendor-neutral sandbox and session
    runtime that works across clouds with gVisor or microVM isolation.
  followup: KubeCon North America sessions on 2026-11-09 to 2026-11-12.
  sources:
  - label: primary
    url: https://cloud.google.com/blog/products/containers-kubernetes/open-infrastructure-for-autonomous-agents-comes-to-cncf/
- title: >-
    Prometheus 3.16.0 adds experimental PromQL query cost limits and fixes several TSDB sample-loss
    bugs
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The release adds opt-in query cost estimation and execution limits, makes smoothed and
    anchored selectors stable, and fixes TSDB data loss.
  summary: >-
    Prometheus 3.16.0 adds query cost estimation and configurable execution limits behind
    --enable-feature=query-cost and an experimental integral() function, and makes smoothed
    and anchored selectors stable. It fixes TSDB races that could lose out-of-order samples
    or samples during selected-series compaction, and fixes HTTP/2 silently falling back to
    HTTP/1.1 under Go 1.27 with TLS. --web.external-url now defaults to https when TLS is
    enabled.
  why: >-
    Operators get a guard against expensive queries and fixes for silent sample loss, but
    should check the external URL default and removed remote write metadata metrics.
  sources:
  - label: primary
    url: https://github.com/prometheus/prometheus/releases/tag/v3.16.0
- title: >-
    Datadog's FETCh turns TLA+ specifications into runtime monitors and found a year-old Husky
    placement bug
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Datadog checks production logs against TLA+ models of its Husky event store and found
    conflicting placements that could crash backfills.
  summary: >-
    Datadog built FETCh, which compiles TLA+ specifications into Rust runtime monitors that
    consume telemetry such as logs. It uses TLA+ refinement to pair an observable specification
    with a bounded model-checkable one. Running it on Husky's routing system showed that a
    placement logic change had let conflicting placements persist for about a year, which
    would have crashed backfill during placement data loss recovery.
  why: >-
    It gives a method for catching drift between a formal model and the system it describes,
    which point-in-time spec reviews miss.
  sources:
  - label: primary
    url: https://www.datadoghq.com/blog/engineering/continuous-formal-spec-validation/
