- title: >-
    Shopify's Reflex architecture lets agents drive native iOS and Android apps headlessly
    through ViewModel contracts
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Agents read each screen's state as JSON and call its actions from a CLI, so one behavior
    suite of 1,700+ tests runs on iOS and Android.
  summary: >-
    Shopify splits each native app into a UI-free Core module and a Mobile module, and every
    ViewModel exposes its state and actions through an introspection node that a CLI drives
    without a simulator. The same Bun-based test file runs against Swift and Kotlin builds,
    a PR cannot merge unless it passes on both, and the 1,700+ behavior tests finish in about
    four minutes on CI with network access blocked.
  why: >-
    It shows a concrete way to give coding agents a fast feedback loop on mobile code by testing
    ViewModel state instead of rendered UI.
  sources:
  - label: primary
    url: https://shopify.engineering/reflex
- title: >-
    Mbed TLS maintainers will stop TLS and X.509 security fixes in April 2027 unless new maintainers
    join
  section: Languages and runtimes
  category: Languages
  blurb: >-
    The current team keeps TF-PSA-Crypto but leaves the TLS and X.509 libraries, which lose
    security fixes and releases without new maintainers.
  summary: >-
    An announcement dated 2026-10-08 on the Mbed TLS list says the existing maintainers will
    end their work on the TLS and X.509 libraries from April 2027. Unless new maintainers
    have ramped up by then, security incident response, fixes and releases will stop, and
    the project is asking organizations for engineering resources or funding.
  why: >-
    Embedded and firmware products that ship Mbed TLS need a maintenance plan or a migration
    path before April 2027.
  followup: Named new maintainers or funding for Mbed TLS before April 2027.
  sources:
  - label: primary
    url: https://lists.trustedfirmware.org/archives/list/mbed-tls@lists.trustedfirmware.org/thread/YPIGCB7WN6GCHOGEGKOJXUYAP7OK527W/
