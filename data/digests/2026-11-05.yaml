- title: >-
    Synaptics cease-and-desist takes down Vino, a reverse-engineered Rust driver for DisplayLink
    hardware
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    After a patent-based legal notice to its developer, the open-source Rust kernel driver
    for modern DisplayLink USB graphics left GitHub.
  summary: >-
    Phoronix reports that Synaptics sent the Vino developer a cease-and-desist on patent grounds,
    with the correspondence attached to an LKML thread. The clean-room Rust driver repository
    is no longer public.
  why: >-
    Linux users of modern DisplayLink docks remain on the proprietary driver with no upstream
    path in sight.
  sources:
  - label: primary
    url: https://www.phoronix.com/news/Synaptics-Blocks-Vino-Driver
  - label: discussion
    url: https://news.ycombinator.com/item?id=50363968
