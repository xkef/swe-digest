  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48537165
- title: Anthropic ships Claude for Foundation Models Swift package
  section: Apple platforms
  category: Apple
  status: developing
  blurb: >-
    Anthropic published a Swift package letting apps switch between Apple's on-device model
    and Claude through one unified framework API.
  summary: >-
    Anthropic published ClaudeForFoundationModels, an Apache-2.0 Swift package that conforms
    Claude to the `LanguageModel` protocol in Apple's Foundation Models framework, targeting
    the server-side language model API introduced in the OS 27 betas. Apps drive Claude through
    the same `LanguageModelSession` API as Apple's on-device model (`respond(to:)`, streaming,
    guided generation via `@Generable`, and client- and server-side tool use), choosing per
    session whether to call the on-device model or Claude. Requests go directly from the app
    to the Claude API at standard pricing, with Apple not in the request path. It requires
    iOS, macOS, visionOS, or watchOS 27 (beta) and Xcode 27 (beta); the package is at 0.1.0
    and the framework's server-side API may change before general availability.
  why: >-
    The server-side provider lets a Swift app escalate from the on-device model to a frontier
    model behind one framework API, enabling hybrid on-device and cloud inference without
    a separate Messages API client.
  followup: >-
    Watch the OS 27 server-side `LanguageModel` API stabilize toward GA and the package's
    first tagged release past 0.1.0.
  sources:
  - label: Anthropic docs
    url: https://platform.claude.com/docs/en/cli-sdks-libraries/libraries/apple-foundation-models
  - label: GitHub repository
    url: https://github.com/anthropics/ClaudeForFoundationModels
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48536776
- title: Iroh 1.0 freezes its peer-to-peer networking wire protocol
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    The n0 team released Iroh 1.0, a networking library addressing devices by public key rather
    than IP with a frozen v1 wire protocol.
  summary: >-
    The n0 team released Iroh 1.0 on 2026-06-15. Iroh is a Rust networking library that addresses
    devices by cryptographic public key rather than IP, using QUIC with multipath and NAT
    traversal to open direct peer-to-peer connections and falling back to public relays when
    no direct path exists. The 1.0 release freezes the wire protocol: a v1 endpoint interoperates
    with any other v1 endpoint across minor versions and across the language bindings (the
    Rust crate plus Python, Node.js, Swift, and Kotlin). The project reports that about 95
    percent of transferred data typically passes directly between devices. The prior 0.35
    line receives no further releases, and public-relay support for it ends 2026-12-31.
  why: >-
    A frozen wire protocol with a cross-version and cross-language interoperability guarantee
    makes Iroh safer to depend on in production for direct device-to-device transport (file
    sync, streaming, AI training data movement) without routing every byte through cloud servers.
  followup: >-
    Watch the 0.35 public-relay deprecation on 2026-12-31 and guest-language binding maturity.
  sources:
  - label: Iroh 1.0 announcement
    url: https://www.iroh.computer/blog/v1
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48542480
