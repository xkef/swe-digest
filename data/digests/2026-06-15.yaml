- title: Anthropic reports LLMs cut N-day exploit development from weeks to hours
  section: AI
  category: AI
  status: developing
  blurb: >-
    Anthropic's red-team report states frontier models can develop N-day exploits for Windows
    kernel vulnerabilities in hours instead of weeks.
  summary: >-
    In a red-team report dated 2026-06-08 that resurfaced on Hacker News this cycle, Anthropic
    states that frontier models can reduce the time to develop a working exploit for an already-disclosed
    (N-day) vulnerability from weeks to hours, shrinking the patch-gap window defenders rely
    on. The evaluation used 21 Windows kernel vulnerabilities disclosed in January and February
    2026, after the tested models' training cutoffs. The figures are the lab's own measurement
    and have not been independently reproduced.
  why: >-
    If models reliably accelerate N-day exploitation, the operational implication is faster
    patching deadlines, since the gap between public disclosure and a usable exploit narrows.
    The report also frames the code-analysis capability at the center of the Fable 5 directive
    dispute.
  followup: >-
    Watch for independent reproduction, method or dataset release, and any change to vendor
    remediation-deadline guidance.
  sources:
  - label: Anthropic red-team report
    url: https://red.anthropic.com/2026/n-days/
- title: NVIDIA publishes SkillSpector, a security scanner for AI agent skills
  section: Agentic coding
  category: Agentic coding
  status: discussion
  blurb: >-
    NVIDIA published SkillSpector, an Apache-2.0 Python tool that scans AI agent skills for
    64 types of vulnerabilities and security issues.
  summary: >-
    NVIDIA published SkillSpector, an Apache-2.0 Python tool that statically scans AI agent
    skills (the skill bundles used by Claude Code, Codex CLI, Gemini CLI, and similar agents)
    for vulnerabilities and malicious patterns before installation. It ships 64 detection
    patterns across 16 categories including prompt injection, data exfiltration, privilege
    escalation, supply chain, tool poisoning, and MCP least-privilege checks, runs a static
    pass plus an optional LLM semantic pass, queries OSV.dev for live CVE data, and emits
    a 0-to-100 risk score with terminal, JSON, Markdown, and SARIF output. The repository
    trended this cycle (about 5,600 stars) and cites internal research that 26.1 percent of
    skills contain vulnerabilities and 5.2 percent show likely malicious intent; those figures
    are the project's own and are not independently verified. No tagged release exists yet.
  why: >-
    Agent skills execute with implicit trust and minimal vetting, the same install-and-run
    trust model behind the Arch AUR supply-chain wave, so a dedicated scanner that produces
    SARIF for CI gives teams a way to vet third-party skills before they run.
  followup: >-
    Watch for a tagged release, the underlying skill-vulnerability research, and false-positive
    rates from practitioner use.
  sources:
  - label: GitHub repository
    url: https://github.com/NVIDIA/SkillSpector
