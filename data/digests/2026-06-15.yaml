- title: EU Commission examines US directive that suspended Fable 5 and Mythos 5
  section: Top stories
  category: AI
  status: developing
  blurb: >-
    The EU Commission is assessing a US export-control directive that forced Anthropic to
    disable Fable 5 and Mythos 5 for all customers worldwide.
  summary: >-
    The US export-control directive issued 2026-06-12 that forced Anthropic to block all foreign-national
    access to Fable 5 and Mythos 5, which the company implemented by disabling both models
    for all customers worldwide, remains in effect. On 2026-06-14 a European Commission spokesperson
    said the Commission is assessing the practical consequences of the directive and that
    measures should not discriminate against partners, while acknowledging that powerful models
    offer cybersecurity advantages alongside cybersecurity risk. Anthropic has said it disagrees
    with the recall and is seeking to restore access.
  why: >-
    Government-level reaction outside the US raises the prospect of jurisdictional friction
    over who can access a deployed frontier model, and teams that relied on Fable 5 or Mythos
    5 still have no restoration timeline and must keep failing over to Opus 4.8 or another
    model.
  followup: >-
    Track whether the directive is lifted, narrowed, or extended, any formal EU response,
    refund or credit handling, and any legal challenge.
