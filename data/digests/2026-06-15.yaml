- title: PlanetScale argues the only scalable delete in Postgres is DROP TABLE
  section: Infrastructure
  category: Infrastructure
  status: discussion
  blurb: >-
    PlanetScale argues large Postgres DELETEs add work through dead tuples and vacuum pressure;
    partition-based DROP TABLE or TRUNCATE is preferable.
  summary: >-
    A PlanetScale engineering post argues that large `DELETE` statements add work to a Postgres
    database rather than reclaiming it: deleted rows become dead tuples that still consume
    space until vacuum runs, indexes are not immediately shrunk, and a big delete generates
    WAL and vacuum pressure proportional to the rows removed. The recommendation is to structure
    schemas so removal maps to `DROP TABLE` or `TRUNCATE`, for example by partitioning time-series
    or tenant data so retention becomes dropping whole partitions instead of row-by-row deletes.
    It surfaced on Hacker News (152 points).
  why: >-
    Teams running retention or cleanup jobs as bulk `DELETE` on large Postgres tables hit
    MVCC bloat and vacuum load, and partition-drop designs avoid that cost.
  comments: >-
    HN commenters discussed partition-drop retention patterns and noted the same dead-tuple
    and vacuum cost applies to large updates, not only deletes.
  sources:
  - label: PlanetScale blog
    url: https://planetscale.com/blog/the-only-scalable-delete
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48492822
- title: Jane Street on formal methods and the future of programming
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Yaron Minsky of Jane Street argues that formal methods are becoming economically viable
    as type systems and verification tooling mature.
  summary: >-
    In a post dated 2026-06-07, Yaron Minsky writes that Jane Street, after 25 years of treating
    formal methods as not worth the cost outside special cases like hardware synthesis, is
    changing its position. The post frames type systems as a lightweight formal method the
    firm already relies on heavily, uses the formally verified seL4 microkernel as a reference
    point for the historical cost of full verification, and argues that the economics are
    shifting. It surfaced as the top post on both Hacker News (228 points) and r/programming.
  why: >-
    A large OCaml-centric trading firm reconsidering formal methods is a signal that verification
    tooling is moving closer to the cost threshold for mainstream production engineering.
  sources:
  - label: Jane Street blog
    url: https://blog.janestreet.com/formal-methods-at-jane-street-index/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48526633
- title: Salesforce to acquire Fin (formerly Intercom) for $3.6 billion
  section: Markets and companies
  category: Markets
  status: confirmed
  blurb: >-
    Salesforce agreed to acquire Fin, the former Intercom, for $3.6 billion; the deal is expected
    to close in Q4 fiscal 2027.
  summary: >-
    Salesforce announced on 2026-06-15 a definitive agreement to acquire Fin, the AI customer-service
    company formerly known as Intercom, for approximately $3.6 billion subject to customary
    adjustments. Fin's AI agent resolves support queries across live chat, email, WhatsApp,
    SMS, phone, and Slack using its proprietary support-tuned model branded Apex. Salesforce
