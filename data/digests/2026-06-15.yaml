    url: https://www.phoronix.com/news/Linux-7.1-Released
  - label: OMG Ubuntu feature list
    url: https://www.omgubuntu.co.uk/2026/06/linux-7-1-kernel-features
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48528729
