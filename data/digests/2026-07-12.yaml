- title: An AI agent in 100 lines of Common Lisp
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    A Common Lisp writeup implements a working LLM agent in about 100 lines using only HTTP
    and JSON libraries, with eval as the sole tool.
  summary: >-
    A write-up implements a working LLM agent in about 100 lines of Common Lisp (SBCL) using
    only two libraries, dexador for HTTP and shasht for JSON. The agent loop is a recursive
    function: send the message history to the model, run any tool calls, then recurse with
    the enriched history. The only tool exposed is `eval`, so the model writes and runs Lisp
    directly and uses that to define further capabilities such as web search at runtime instead
    of drawing from a fixed tool catalog. Conversation memory persists by serializing the
    message list to JSON. Resurfaced on the front page (162 points).
  why: >-
    It reduces the agent loop to its core and shows how a homoiconic language lets one code-execution
    tool stand in for a design-time tool registry.
  sources:
  - label: thebeach.dev
    url: https://thebeach.dev/posts/lisp-agent/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48823981
- title: Zimbra patches a Classic Web Client stored XSS in 10.1.19
  section: Security
  category: Security
  blurb: >-
    Zimbra released ZCS 10.1.19 fixing a stored XSS in Classic Web Client that enables session-cookie
    theft and mailbox access.
  summary: >-
    Zimbra released ZCS 10.1.19 (Daffodil) on 2026-07-07 fixing a stored cross-site scripting
    flaw in the Classic Web Client. A crafted email can carry JavaScript that runs in a recipient's
    authenticated webmail session when the message is opened or previewed, enabling session-cookie
    theft, actions on the victim's behalf, and mailbox data access. Zimbra published no CVE
    id or CVSS score and urges any Classic Web Client user to upgrade as soon as possible.
    No active exploitation is reported.
  why: >-
    Zimbra webmail is a recurring target with prior exploited flaws, and a stored-XSS-to-session-takeover
    in the default classic client is a direct mailbox-compromise path for self-hosted deployments.
  followup: >-
    Watch for a CVE assignment, any active-exploitation or CISA KEV addition, and internet-exposure
    scans of unpatched Classic Web Client hosts.
  sources:
  - label: Zimbra 10.1.19 release
    url: https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.19
  - label: Security Affairs
    url: https://securityaffairs.com/195130/hacking/update-now-critical-zimbra-classic-web-client-flaw-could-expose-mailboxes.html
- title: Ghostel.el embeds libghostty as an Emacs terminal
  section: Developer tools
  category: Dev tools
  blurb: >-
    Ghostel embeds Ghostty's libghostty-vt terminal engine in Emacs, providing modern protocol
    support without reimplementing VT.
  summary: >-
    Ghostel is an Emacs terminal emulator built on libghostty-vt, the VT engine behind the
    Ghostty terminal. A native dynamic module written in Zig handles terminal state, rendering,
    and local PTY I/O, while Elisp manages keymaps, buffers, and commands. It requires Emacs
    28.1 or later with dynamic-module support, ships on MELPA, and downloads prebuilt binaries
    for macOS, Linux, FreeBSD, and Windows on first use (Zig 0.15.2 needed only to build from
    source). It supports the Kitty graphics protocol, OSC 8 hyperlinks, synchronized output,
    the Kitty keyboard protocol, TRAMP remote terminals, and shell-integration injection for
    bash, zsh, and fish.
  why: >-
    It reuses Ghostty's terminal engine outside the Ghostty app, giving Emacs a VT implementation
    with modern protocol support without reimplementing terminal emulation in Elisp.
  sources:
  - label: Ghostel
    url: https://dakra.github.io/ghostel/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48879504
