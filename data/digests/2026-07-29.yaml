- title: Cloudflare adds ML-DSA authentication for connections to customer origins
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Cloudflare added post-quantum ML-DSA signature support to Authenticated Origin Pulls and
    the Custom Origin Trust Store for origin authentication.
  summary: >-
    Cloudflare states that Authenticated Origin Pulls and the Custom Origin Trust Store now
    accept ML-DSA-44, ML-DSA-65, and ML-DSA-87, which makes fully post-quantum mutual TLS
    to an origin configurable now rather than after the WebPKI catches up. Keys must be uploaded
    in the FIPS 204 seed-only encoding, which requires OpenSSL 3.5.0 or later. The global
    Authenticated Origin Pulls configuration level is not covered yet. Adding post-quantum
    support without removing trust in the classical mechanisms leaves the downgrade path open.
  why: >-
    Origin authentication is the part of a post-quantum migration a customer controls end
    to end, so it can be moved without waiting on public certificate authorities.
  sources:
  - label: Cloudflare blog
    url: https://blog.cloudflare.com/post-quantum-authentication-to-origins/
- title: Edward Yang frames PyTorch as a reference language paired with a verifier
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Edward Yang argues PyTorch should be kept as an executable specification paired with a
    verifier rather than a production runtime.
  summary: >-
    A PyTorch compiler devlog dated 2026-07-25, bylined Edward Yang, argues that PyTorch should
    be treated as a reference language paired with a verifier rather than as the thing that
    runs in production. The recipe stated: keep autograd-friendly PyTorch as the executable
    specification, generate an explicit forward-backward implementation from it, and prove
    the two equivalent instead of pattern-matching a hidden backward graph.
  why: >-
    It states a concrete structure for frontier training code, where the readable model definition
    and the fast kernel are separate artifacts checked against each other rather than one
    artifact the compiler has to guess about.
  sources:
  - label: PyTorch compiler devlog
    url: https://docs.pytorch.org/devlogs/compiler/2026-07-25-pytorch-a-reference-language/
  - label: HN 49079454
