- title: Qualcomm completes its acquisition of Modular and makes Chris Lattner an EVP
  section: Markets and companies
  category: Markets
  blurb: >-
    Qualcomm completed its acquisition of Modular and commits to continuing Mojo, MAX, and
    Modular Cloud as products with expanded investment.
  summary: >-
    Modular published that Qualcomm has completed its acquisition of the company. The announcement
    commits to continuing Mojo, MAX, and Modular Cloud as products and brands with expanded
    investment, and to the open heterogeneous ecosystem. It names Chris Lattner as Executive
    Vice President of Advanced AI Software and Platforms.
  why: >-
    Mojo, MAX, and Modular Cloud now sit inside a silicon vendor, which is the governance
    question for anyone who adopted a language and kernel stack sold on running well across
    CPUs, GPUs, NPUs, and custom silicon.
  followup: >-
    Watch whether Mojo and MAX releases keep support for non-Qualcomm accelerators at the
    current pace.
  sources:
  - label: Modular blog
    url: https://www.modular.com/blog/qualcomm-completes-acquisition-of-modular
- title: Google DeepMind disbands the AlphaFold team and moves staff to Gemini work
  section: Markets and companies
  category: Markets
  blurb: >-
    Google DeepMind disbanded the AlphaFold team, reassigning staff to Gemini work while some
    key members left for Anthropic and Isomorphic Labs.
  summary: >-
    Engadget reports that Google DeepMind has disbanded the AlphaFold team and moved staff
    to Gemini work. The account states that most key members and original paper authors were
    reassigned, that some have already departed for Anthropic and some for Isomorphic Labs,
    and quotes Google DeepMind VP of research Pushmeet Kohli saying the strategy has evolved.
    The report originates with the Financial Times, which is paywalled and unfetchable from
    this run environment, so what is carried here is Engadget's account rather than the originating
    report.
  why: >-
    The AlphaFold Protein Structure Database is a free dependency for a large amount of published
    work, and the team that produced it no longer exists as a team, which leaves its maintenance
    path unstated.
  followup: >-
    Watch for a Google DeepMind statement on who maintains the AlphaFold Protein Structure
    Database.
  sources:
  - label: Engadget
    url: https://www.engadget.com/2225849/google-shuts-down-alphafold/
