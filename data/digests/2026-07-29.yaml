- title: Collabora runs Counter-Strike 2 on Windows with Mesa's RADV Vulkan driver
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Collabora ported Mesa's RADV Vulkan driver to Windows and ran Counter-Strike 2 against
    it, relying on reverse-engineered AMD kernel structures.
  summary: >-
    Collabora describes porting Mesa's RADV Vulkan driver to Win32 and reports running Counter-Strike
    2 on Windows against it. The port still talks to AMD's proprietary Windows kernel driver,
    through private structures recovered by reverse engineering. Those structures ship as
    a matched pair with the vendor user-mode driver and carry no backward-compatibility guarantee.
    Phoronix reports that Valve is sponsoring the Collabora engineers doing the work, and
    that the alternative to a documented AMD kernel interface is a shim library absorbing
    undocumented changes between Radeon Software releases.
  why: >-
    An open Vulkan driver on Windows would give AMD users one debuggable codebase across platforms,
    and the reverse-engineered kernel interface is the part that decides whether that holds
    across driver updates.
  followup: >-
    Watch for whether AMD documents or stabilises the kernel interface the port depends on.
  sources:
