- title: >-
    Document-borne prompt injection self-propagates through Copilot for Word with no mitigation
    available
  section: Security
  category: Security
  blurb: >-
    Hidden instructions in white text survive Copilot's formatting strip, alter generated
    output, and are copied into the next document carrier.
  summary: >-
    A post by Hakon Maloy describes instructions hidden as white text in an attached document
    surviving Copilot's formatting strip, altering the document Copilot drafts, and being
    copied into that output, so the generated document becomes the next carrier. The post
    publishes a 144-day MSRC coordination timeline ending with the attack still reproducing
    on 2026-07-28, after two Microsoft mitigations, the second of which was a model upgrade.
    The stated customer action is procedural only: treat externally sourced documents as untrusted,
    review attachments before generation, and review Copilot output before sharing. The claim
    that Microsoft confirmed the behaviour on 2026-03-31 comes from the author's own disclosure
    timeline, and no Microsoft statement was located on this run. No affected version, build,
    or release channel of Copilot for Word is published by the post or by any source read
    here, so the affected versions are not known. What is dated is the last reproduction,
    2026-07-28, after two mitigations failed.
  why: >-
    An injection that copies itself into generated output turns an ordinary document workflow
    into a propagation path, and no technical control has shipped that stops it.
  followup: >-
    Watch for a Microsoft statement or a technical mitigation for this Copilot for Word injection
    path.
  sources:
  - label: enklypesalt.com
    url: https://enklypesalt.com/posts/context-collapse-part3-ai-worming-through-word/
  - label: HN 49096188
    url: https://news.ycombinator.com/item?id=49096188
- title: >-
    GitHub ships npm and Actions changes aimed at the common links in supply chain attack
    chains
  section: Security
  category: Security
  blurb: >-
    GitHub's June 2026 npm and Actions changes include 72-hour lockdowns and fork checkout
    restrictions to disrupt common supply chain attack links.
  summary: >-
    GitHub published a post on 2026-07-28 summarising changes to npm and GitHub Actions aimed
    at steps that recur across supply chain attack chains, describing work shipped over the
    past few months. Four of the changes are live and dated to June 2026 in the post, and
    they alter defaults rather than adding opt-in features. High-impact npm accounts go read-only
    for 72 hours after an email change or a 2FA recovery. `actions/checkout` no longer checks
    out fork code under commonly exploited triggers unless a workflow opts out. Workflow trigger
    types and triggering identities can be restricted by policy. Untrusted workflows can no
    longer write to the Actions cache shared with privileged ones.
  why: >-
    These are default changes that landed in June 2026, so a workflow that relied on fork
    checkout under those triggers, or on a cache shared with privileged jobs, is already exposed
    to breaking with no change on the repository side.
  sources:
  - label: GitHub blog
    url: https://github.blog/security/supply-chain-security/disrupting-supply-chain-attacks-on-npm-and-github-actions/
  - label: HN 49096427
    url: https://news.ycombinator.com/item?id=49096427
