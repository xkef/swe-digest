- title: uv 0.12.0 packages new projects by default and rejects legacy archive formats
  section: Developer tools
  category: Dev tools
  blurb: >-
    uv 0.12.0 changes uv init to create packaged projects and rejects legacy archive formats,
    some with no backward-compatibility flag.
  summary: >-
    uv 0.12.0 changes what `uv init` creates: a new project declares a `uv_build` build system
    and places its source under `src/`. The release notes state that existing projects are
    unaffected and that `uv init --no-package` restores the previous layout. The release also
    rejects several legacy archive and digest formats, and several of those breaking changes
    have no opt-out. uv now rejects legacy `.tar.bz2` and `.tar.xz` source distributions,
    including when they are referenced by an existing lockfile, rejects MD5-only digests under
    `--require-hashes`, and rejects wheels whose entry points or data files could overwrite
    the virtual environment interpreter. Legacy `.zip` source distributions remain supported
    for backwards compatibility.
  why: >-
    A lockfile that resolved yesterday can fail to install on 0.12.0 with no flag to restore
    the old behaviour, so the upgrade is a pinned-dependency audit rather than a version bump.
  sources:
  - label: uv 0.12.0 release
    url: https://github.com/astral-sh/uv/releases/tag/0.12.0
  - label: HN 49088887
    url: https://news.ycombinator.com/item?id=49088887
