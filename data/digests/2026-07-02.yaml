- title: Probelab makes IPFS content publishing about 10x faster
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Probelab optimized IPFS publishing by returning after 15 of 20 provider announcements,
    cutting perceived latency an order of magnitude.
  summary: >-
    Probelab described an "optimistic provide" change that returns control to the caller after
    most, not all, of the provider-record PUT RPCs succeed, then finishes the rest asynchronously.
    Their measurements found that about 15 of the usual 20 announcements suffice for reliable
    discovery, so the publish call no longer waits on slow or unresponsive peers, cutting
    perceived publish latency by roughly an order of magnitude. A background Reprovide Sweep
    still completes full distribution.
  why: >-
    Publish latency is a longstanding IPFS pain point, and trading a small redundancy margin
    for a large latency win is a concrete tuning lesson for DHT-backed systems.
  comments: >-
    HN commenters noted the change improves perceived latency rather than total network propagation,
    that Kademlia DHT redundancy keeps early return safe at 15 of 20, and raised familiar
    IPFS production-adoption concerns.
  sources:
  - label: Probelab blog
    url: https://probelab.io/blog/optimistic-provide/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48748518
