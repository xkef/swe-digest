- title: FFmpeg native AAC encoder rework surfaces for review
  section: Developer tools
  category: Dev tools
  blurb: >-
    A rewritten FFmpeg native AAC encoder surfaces for review, scoring above Apple Core Audio
    in constant-bitrate encoding-quality tests.
  summary: >-
    A rewritten native AAC encoder for FFmpeg drew discussion on 2026-07-02 (327 points),
    presented as headed for a future release. It is not in a released FFmpeg version: the
    latest stable release is 8.1, and the reworked encoder is targeted at a future release,
    which the Hacker News thread frames as FFmpeg 9.1. It currently supports constant bitrate
    only and is optimized for 48kHz audio. A HydrogenAudio analysis reports it scoring above
    Apple Core Audio in tested CBR encoding-quality metrics, and the encoder works around
    a stereo Perceptual Noise Substitution bug present in AAC decoders.
  why: >-
    FFmpeg's native AAC encoder is a fully open, license-clean option, and a quality-competitive
    rewrite reduces the reason to depend on external encoders.
  followup: >-
    Watch for the encoder landing in a tagged FFmpeg release, variable-bitrate support, and
    blind listening-test results.
  comments: >-
    HN commenters welcomed it as a possible fdk-aac replacement, the encoder author explained
    the 48kHz optimization and PNS handling, and several noted the scoring tools are imperfect
    proxies for listening tests and that Opus still outperforms AAC at comparable bitrates.
  sources:
  - label: HydrogenAudio analysis
    url: https://hydrogenaudio.org/index.php/topic,129691.0.html
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48747116
- title: Asahi Linux 7.1 extends Apple Silicon support to M3 audio and H.264 decode
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    Asahi Linux 7.1 adds M3 audio output and hardware H.264 decoding to 10-bit 4K via a new
    V4L2 driver with custom AVD firmware.
  summary: >-
    The Asahi Linux 7.1 progress report, published 2026-06-30, documents work bringing Linux
    to Apple Silicon. M3 machines gain high-quality audio output (speaker and headphone) plus
    CPU frequency switching, big.LITTLE task scheduling, and SMC hardware sensors via devicetree
    additions. The m1n1 bootloader reached v1.6.0, the first version requiring Rust for its
    stage 2 build, and moved GPU initialization into m1n1 along with SPMI controller and PCIe
    init improvements. A new V4L2 driver from contributor sofus decodes 10-bit AVC (H.264)
    video up to 4K through custom AVD firmware and the V4L2 Request API, with VP9, HEVC, and
    AV1 still pending. Installs from 7.0.12 onward set an APFS metadata flag to fix an issue
    where macOS 27 dropped Asahi from the boot picker.
  why: >-
    M3 audio and hardware video decode close two long-standing gaps for Linux on recent Apple
    laptops, and the Rust requirement in m1n1 marks Rust moving into the low-level bootloader
    path.
  followup: >-
    Watch for further M3 GPU/display driver progress, VP9/HEVC/AV1 decode support, and upstreaming
    of the new drivers.
  sources:
  - label: Asahi Linux progress report
    url: https://asahilinux.org/2026/06/progress-report-7-1/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48744518
- title: Prometheus 3.13.0 LTS ships security fixes
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Prometheus 3.13.0 LTS fixes UI cross-site scripting and stops forwarding credentials on
    cross-host redirects in scraping and remote write.
  summary: >-
    Prometheus 3.13.0, a Long Term Support release, shipped on 2026-07-01. It bumps `sanitize-html`
    to fix a UI cross-site scripting issue (CVE-2026-44990) and, via prometheus/common v0.69.0,
    stops forwarding credentials (Authorization header, basic auth, bearer token, OAuth2,
    configured headers) when an HTTP client follows a redirect to a different host, affecting
    scraping, remote read and write, alerting, and service discovery (CVE-2025-4673, CVE-2023-45289).
    The API now uses SHA-256 instead of SHA-1 for rule-group pagination tokens, and third-party
    npm license texts are embedded in the binary at `/assets/third-party-licenses.txt`.
  why: >-
    LTS is the version most production deployments pin to, and the redirect credential-forwarding
    change can alter behavior for setups that relied on cross-host credential reuse.
  followup: >-
    Watch for scrape or remote-write breakage reports tied to the redirect credential change.
  sources:
  - label: GitHub release
    url: https://github.com/prometheus/prometheus/releases/tag/v3.13.0
