- title: SharePoint deserialization RCE CVE-2026-45659 added to CISA KEV
  section: Top stories
  category: Security
  blurb: >-
    CISA added CVE-2026-45659, a deserialization RCE in on-premises SharePoint, to the KEV
    catalog with a federal deadline of 2026-07-04.
  summary: >-
    CISA added CVE-2026-45659 to the Known Exploited Vulnerabilities catalog on 2026-07-01
    (catalog version 2026.07.01, count 1631), confirming active exploitation. The flaw is
    a CWE-502 deserialization of untrusted data in on-premises SharePoint Server Subscription
    Edition, SharePoint Server 2019, and SharePoint Enterprise Server 2016, CVSS 8.8, network-reachable
    with low attack complexity and no user interaction. An attacker with Site Member permissions
    can execute code on the server. Microsoft patched it in the May 2026 Patch Tuesday (KB5002863,
    KB5002870, KB5002868).
  why: >-
    SharePoint is widely deployed enterprise infrastructure, and the federal remediation deadline
    is 2026-07-04, so unpatched on-premises servers need immediate attention.
  followup: >-
    Watch for confirmed RCE chains, ransomware follow-on (KEV lists ransomware use as unknown),
    and internet-exposure scans.
  sources:
  - label: MSRC advisory
    url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45659
  - label: CISA KEV
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  - label: NVD
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-45659
  - label: Help Net Security
    url: https://www.helpnetsecurity.com/2026/05/26/sharepoint-vulnerability-cve-2026-45659/
- title: Anthropic redeploys Fable 5 with a new jailbreak classifier
  section: Top stories
  category: AI
  blurb: >-
    Anthropic redeployed Fable 5 after export controls lifted, adding a classifier blocking
    the reported jailbreak in over 99 percent of cases.
  summary: >-
    Anthropic began restoring Claude Fable 5 globally on 2026-07-01 after the US lifted the
    export controls imposed 2026-06-12. The redeployment ships a new safety classifier that
    Anthropic says blocks the reported jailbreak technique in over 99 percent of cases; the
    jailbreak, reported by Amazon researchers, had prompted the model to identify and in one
    case show how to exploit a software vulnerability. Anthropic says it is drafting a cross-industry
    jailbreak-severity framework with Amazon, Microsoft, Google, and other partners. Mythos
    5, the same underlying model with fewer restrictions, is being restored to approved US
    organizations.
  why: >-
    The episode sets a template for classifier-gated redeployment and government pre-release
    review of frontier models, and the industry jailbreak-severity framework may standardize
    how labs triage misuse reports.
  followup: >-
    Watch for the published jailbreak-severity framework, independent testing of the new classifier,
    and whether Mythos 5 access widens.
  comments: >-
    HN commenters flagged the usage terms: through 2026-07-07 a plan can spend up to 50 percent
    of its weekly limit on Fable 5, then continue on usage credits, and Fable 5 draws down
    usage faster than Opus 4.8.
  thread: f-0100
  sources:
  - label: Anthropic
    url: https://www.anthropic.com/news/redeploying-fable-5
  - label: CNBC
    url: https://www.cnbc.com/2026/06/30/anthropic-says-trump-admin-has-lifted-export-controls-on-claude-fable-5-and-mythos-5.html
