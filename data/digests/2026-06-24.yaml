- title: Ultralytics YOLO26 targets NMS-free end-to-end detection
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    Ultralytics YOLO26 introduces native NMS-free end-to-end inference across five vision
    tasks with reported COCO performance of 40.9 to 57.5 mAP.
  summary: >-
    Glenn Jocher and colleagues at Ultralytics posted YOLO26 (arXiv 2606.03748, dated 2026-06-02),
    a unified real-time vision family across five scales for detection, segmentation, pose,
    oriented detection, and classification. Reported changes include a dual-head design for
    native NMS-free end-to-end inference, removal of Distribution Focal Loss, a progressive-loss
    training schedule, a Muon-SGD hybrid optimizer (MuSGD), and the STAL label-assignment
    strategy for small objects. The authors report 40.9 to 57.5 mAP on COCO at 1.7 to 11.8
    ms T4 TensorRT latency across scales, and 40.6 AP on LVIS minival for the open-vocabulary
    YOLOE-26 variant.
  why: >-
    YOLO is a widely used production detection framework, and native NMS-free inference removes
    a common deployment and latency complication.
  followup: >-
    Independent reproduction of the COCO/LVIS numbers and the released weights and license
    terms.
  sources:
  - label: arXiv 2606.03748
    url: https://arxiv.org/abs/2606.03748
  - label: discussion
    url: https://news.ycombinator.com/item?id=48639434
- title: Qwen-AgentWorld releases language world models for agent training
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    Qwen-AgentWorld releases 35B and 397B models trained as agentic environment simulators
    from over 10 million trajectories across seven domains.
  summary: >-
    Researchers from the Alibaba Qwen team posted Qwen-AgentWorld (arXiv 2606.24597, dated
    2026-06-23), two large language world models (35B and 397B parameters) that simulate agentic
    environments through long chain-of-thought reasoning. They are trained in a three-stage
    pipeline (continued pre-training on state-transition dynamics, supervised fine-tuning
    for next-state prediction, reinforcement learning with hybrid rubric-and-rule rewards)
    over more than 10 million environment-interaction trajectories across seven domains. The
    models serve both as decoupled environment simulators for scalable reinforcement-learning
    training and as unified agent foundation models, and the authors report gains over frontier
    models on their AgentWorldBench and across seven agentic benchmarks.
  why: >-
    Using a world model as a synthetic environment simulator targets the data and infrastructure
    bottleneck in training agentic models without live environment access.
  followup: >-
    Independent reproduction of the AgentWorldBench results and the released weights and license
    terms.
  sources:
  - label: arXiv 2606.24597
    url: https://arxiv.org/abs/2606.24597
  - label: discussion
    url: https://news.ycombinator.com/item?id=48654351
