- title: Ubiquiti UniFi OS triple-CVE chain gives unauthenticated root, added to CISA KEV
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Researchers chained three Ubiquiti UniFi flaws to unauthenticated root, with CISA confirming
    active exploitation of CVE-2026-34910 on 2026-06-23.
  summary: >-
    CVE-2026-34908 (improper access control), CVE-2026-34909 (path traversal), and CVE-2026-34910
    (command injection) each carry CVSS 10.0 and affect UniFi OS Server. Researchers chained
    the three into unauthenticated remote code execution as root. Ubiquiti patched all three
    on 2026-05-21 in Bulletin 064. CISA added them to the Known Exploited Vulnerabilities
    catalog on 2026-06-23 (catalog version 2026.06.23, count 1627), citing confirmed active
    exploitation of CVE-2026-34910.
  why: >-
    UniFi OS runs widely deployed gateways and network controllers, so an unauthenticated
    root chain on internet-reachable instances is directly exploitable.
  followup: >-
    Track exploitation scope, internet-exposure counts, and patch adoption for UniFi OS Server.
  sources:
