- title: Anthropic launches Claude Tag, an always-on Claude in Slack
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Anthropic introduced Claude Tag on 2026-06-23, enabling teams to add Claude as a shared
    Slack teammate for delegated task execution.
  summary: >-
    Anthropic introduced Claude Tag on 2026-06-23, a way to add Claude to a Slack channel
    as a shared teammate. Members tag @Claude to delegate a task, which Claude breaks into
    stages and works through before posting the result back. An ambient mode lets Claude monitor
    assigned channels and intervene with summaries, reminders, or context pulled from elsewhere.
    One Claude instance per channel is shared across everyone in it. It is available in beta
    for Claude Enterprise and Team customers, with planned expansion to other surfaces.
  why: >-
    It pushes autonomous, agent-style task execution into a shared team chat surface, with
    channel-wide visibility and ambient monitoring rather than one-to-one prompting.
  followup: >-
    Track general availability, data-access and permission scoping in shared channels, and
    rollout beyond Slack.
