- title: Justin Poehnelt says Google fired him over the Google Workspace CLI
  section: Reddit and social pulse
  category: Pulse
  status: discussion
  blurb: >-
    Justin Poehnelt alleged Google fired him for his Google Workspace CLI after it went viral,
    citing branding and internal AI-agent concerns.
  summary: >-
    Justin Poehnelt, a former Google Workspace developer-relations engineer, wrote on his
    verified X account that Google fired him over the Google Workspace CLI he built, which
    went viral and reached the top of Hacker News. He attributes the firing partly to legal
