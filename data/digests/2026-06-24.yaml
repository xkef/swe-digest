- title: F3 proposes a Wasm-extensible successor to Parquet
  section: Developer tools
  category: Dev tools
  status: discussion
  blurb: >-
    F3, a SIGMOD 2026 columnar format, embeds WebAssembly decoders to enable readers to decode
    data without native decoder support.
  summary: >-
    F3 ("Future File Format") is a columnar data file format from a SIGMOD 2026 paper by Xinyu
    Zeng, Wes McKinney, Jignesh Patel, Andrew Pavlo, and others. Files are self-describing
    and embed WebAssembly decoder binaries so a reader can decode data even without a matching
    native decoder, with FlatBuffer-defined structure and user-defined Wasm encodings for
    extensibility. It is MIT-licensed and described as a research prototype, not production-ready.
  why: >-
    Embedding decoders in the file targets the format-versioning and forward-compatibility
    problems that force rewrites across Parquet and ORC deployments.
  followup: >-
    Track whether the prototype gains active development, benchmarks against Parquet/Lance/Nimble,
    and any engine adoption.
  comments: >-
    HN commenters asked for a concrete "why" over Parquet and ORC beyond the abstract claims,
    noted limited tool support, and flagged the repository had no commits in roughly eight
    months.
  sources:
  - label: future-file-format/f3
    url: https://github.com/future-file-format/f3
  - label: discussion
    url: https://news.ycombinator.com/item?id=48647799
- title: Node.js v24.18.0 adds post-quantum and SHA-3 WebCrypto, updates root certs
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Node.js v24.18.0 released on 2026-06-23 adds TurboSHAKE and KangarooTwelve hash functions
    plus post-quantum algorithms with BoringSSL builds.
  summary: >-
    Node.js published v24.18.0 on 2026-06-23 on the v24 LTS line. Notable changes include
    updated root certificates (NSS 3.123.1), a larger default Buffer.poolSize (64 KiB), new
    TurboSHAKE and KangarooTwelve Web Cryptography algorithms, and ML-DSA and ML-KEM post-quantum
    algorithms wired up when building against BoringSSL, plus an HTTP method to send arbitrary
    1xx informational responses.
  why: >-
    The crypto additions bring post-quantum and SHA-3-family primitives into the supported
    LTS line, and the root-certificate refresh affects TLS trust for deployed services.
  followup: >-
    Track whether the post-quantum WebCrypto algorithms reach default (non-BoringSSL) builds.
  sources:
  - label: Node.js v24.18.0 release
    url: https://github.com/nodejs/node/releases/tag/v24.18.0
- title: OpenTelemetry Collector v0.155.0 removes stabilized feature gates
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    OpenTelemetry Collector v0.155.0 removes stabilized feature gates and renames memory-limiter
    processor metrics on 2026-06-23.
  summary: >-
    The OpenTelemetry Collector core released v0.155.0 on 2026-06-23. Breaking changes remove
    several stabilized feature gates (confighttp.framedSnappy, configoptional.AddEnabledField,
    confmap.newExpandedValueSanitizer, exporter.PersistRequestContext, otelcol.printInitialConfig,
    telemetry.UseLocalHostAsDefaultMetricsAddress, pdata.enableRefCounting) and rename memory_limiter
    processor metrics to carry a memory_limiter prefix. The schemagen CLI moved into the core
    repository, and mdatagen gains versioned-metrics support for migrating to new semantic
    conventions.
  why: >-
    Removing stabilized gates and renaming processor metrics can break collector configs and
    dashboards that still reference the old names.
  followup: >-
    Track config and dashboard migration reports from the renamed memory_limiter metrics.
  sources:
