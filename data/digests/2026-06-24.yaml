- title: Filippo Valsorda argues vulnerability reports are not special anymore
  section: Top stories
  category: Engineering post
  status: discussion
  blurb: >-
    Filippo Valsorda argues that LLMs have removed the scarcity justifying confidential vulnerability
    disclosure, shifting the bottleneck to triage.
  summary: >-
    In a 2026-06-23 post, Go cryptography maintainer Filippo Valsorda argues that the special
    handling of vulnerability reports (fast response, attribution, confidential disclosure)
    was justified by a scarcity that LLMs have removed: "LLMs are as good as almost any security
    researcher, and anyone can run them." He says the bottleneck is now triage, "not finding
    potential issues but assessing which ones are real," and that maintainers should prioritize
    rapid remediation, prevention, and running LLM analysis in CI.
  why: >-
    It reframes maintainer security workload around AI-generated reports, the same pressure
    behind curl pausing report handling and the FFmpeg AI-found zero-days.
  followup: >-
    Track whether projects formalize deprioritized handling of unverified LLM-generated vulnerability
    reports.
  sources:
  - label: words.filippo.io
    url: https://words.filippo.io/vuln-reports/
  - label: discussion
    url: https://news.ycombinator.com/item?id=48653216
- title: FUTO Swipe ships an on-device neural swipe-typing model
  section: AI
  category: AI
  status: discussion
  blurb: >-
    FUTO released a 2.49M-parameter on-device swipe-typing model trained on one million English
    QWERTY swipes with Gboard-comparable accuracy.
  summary: >-
    FUTO published a neural swipe-typing model used in its Android keyboard and as a standalone
    library. The system combines a layout- and language-agnostic encoder (635,140 parameters),
    a layout/language-specific decoder (304,155 parameters), and a small ContextLM (about
    1.5M parameters, mostly embeddings) totaling about 2.49M parameters, with beam search
    (width 300) reporting an approximately 4 percent top-4 failure rate and below 1 percent
    excluding out-of-vocabulary cases. It was trained on one million voluntarily contributed
    English QWERTY swipes (August 2024 to March 2025, sourced primarily from Wikipedia), released
    as an MIT-licensed dataset on Hugging Face. Inference code is GPL; the models use FUTO's
    own model license.
  why: >-
    It is a small, fully on-device gesture-typing model with a released dataset and a reusable
    inference library, an alternative to cloud or proprietary keyboard prediction.
  followup: >-
    Track multilingual support, the standalone library's adoption, and independent accuracy
    comparisons.
  comments: >-
    HN commenters report accuracy comparable to Gboard and a clear improvement over earlier
    FUTO versions, with debate over whether the non-commercial model and keyboard licenses
    meet the OSI open-source definition.
  sources:
  - label: swipe.futo.tech
    url: https://swipe.futo.tech
  - label: discussion
    url: https://news.ycombinator.com/item?id=48648619
