- title: LastPass customer data exposed through Klue supply-chain breach
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Klue supply-chain breach exposed LastPass customer names, addresses, and support cases
    on 2026-06-23 after OAuth token compromise.
  summary: >-
    LastPass confirmed on 2026-06-23 that attackers accessed customer data in its Salesforce
    environment after OAuth tokens were stolen in a breach of Klue, a third-party market-intelligence
    platform it integrates with. Exposed data includes names, phone numbers, email and physical
    addresses, and customer-support case contents; LastPass says its products, infrastructure,
    and customer vaults were not affected. The Klue compromise, claimed by the Icarus extortion
    group via compromised legacy integration credentials, also hit Recorded Future, Tanium,
    Jamf, Sprout Social, Gong, and Insurity.
  why: >-
    A single SaaS integration breach cascaded OAuth-token access into many vendors' Salesforce
    CRMs, the recurring third-party-integration supply-chain failure mode.
  followup: >-
    Track the full list of affected Klue customers and phishing follow-on using the stolen
    support-case data.
  sources:
  - label: TechCrunch
    url: https://techcrunch.com/2026/06/23/password-manager-maker-lastpass-says-hackers-stole-customer-support-case-data-during-klue-breach/
  - label: Cybersecurity Dive
    url: https://www.cybersecuritydive.com/news/klue-investigating-supply-chain-attack-salesforce-integrations/823532/
  - label: report
