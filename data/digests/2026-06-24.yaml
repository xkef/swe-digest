- title: Swift Package Index joins Apple
  section: Top stories
  category: Apple
  status: confirmed
  blurb: >-
    Apple acquired the Swift Package Index on 2026-06-23, consolidating package-registry direction
    as the platform vendor.
  summary: >-
    On 2026-06-23 Ted Kremenek, Dave Verwer, and Sven A. Schmidt announced that the Swift
