  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Krea published Krea 2 on 2026-06-24, a 12-billion-parameter open-weights image model with
    distilled and training-ready checkpoints.
  summary: >-
    On 2026-06-24 Krea published open weights for Krea 2, a 12-billion-parameter diffusion-transformer
    image model, in two checkpoints: Krea 2 Raw, a pre-distillation mid-training checkpoint
