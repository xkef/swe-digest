- title: >-
    Fortinet warns of an actively exploited FortiMail flaw with fixes pending on several branches
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Fortinet confirms CVE-2026-104286 in FortiMail is under active exploitation, and fixes
    for several branches are still pending.
  summary: >-
    Fortinet states CVE-2026-104286 in FortiMail is being exploited in the wild, and The Register
    reports the advisory rates it CVSS 9.8 and describes it as path traversal combined with
    improper handling of null characters. The affected versions listed are FortiMail 8.0.0
    through 8.0.1, 7.6.0 through 7.6.6, 7.4.0 through 7.4.8, and 7.2.0 through 7.2.9, with
    fixes still listed as upcoming for several of those branches. The report cites the addition
    to the CISA known-exploited catalog with a federal remediation deadline of 2026-10-04.
  why: >-
    A CVSS 9.8 flaw is being exploited now across four FortiMail release branches, and operators
    on branches whose fixes are listed as upcoming can only apply workarounds that do not
    remove persistence already planted.
  followup: >-
    Track the fixed releases for the remaining branches, and the Fortinet PSIRT advisory itself,
    which was not reachable at publish time.
  sources:
  - label: primary
    url: https://www.theregister.com/security/2026/10/02/fortinet-sounds-the-alarm-over-actively-exploited-fortimail-zero-day/5300803
- title: >-
    Aleph Alpha releases Kolibri, a 78B/3B-active German-English MoE under Apache 2.0
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Aleph Alpha released Kolibri, a 78.1B-parameter MoE with 3.46B active per token, under
    Apache 2.0 with full weights.
  summary: >-
    The model shipped 2026-10-03 with full weights on Hugging Face under Apache 2.0, which
    makes it commercially usable rather than research-only. The architecture is 78.1B total
    parameters with 3.46B active per token, 50 layers that are all MoE with 384 experts and
    6 active plus one shared, a 128,000-token vocabulary, sliding 512-token attention with
    full attention every fifth layer, context up to 1M, and four reasoning effort levels.
    Training ran on 768 B200 GPUs in Germany and Finland with 21 days of pre-training at 20T
    tokens, German at about 21.3% of the pre-training mix, translated text held to 6%, and
    38 unplanned interruptions handled by automatic restart from a checkpoint at most 250
    steps back.
  why: >-
    An Apache 2.0 release at this scale with a disclosed training recipe is usable in commercial
    products, though every benchmark figure is the vendor's own and unreproduced.
  sources:
  - label: primary
    url: https://aleph-alpha.com/en/blog/kolibri-has-landed-a-sovereign-open-weight-model/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49943034
- title: Zig 0.17.0 reworks the build system and redefines @bitCast
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Zig 0.17.0 reworks the build system and redefines @bitCast, which the release notes say
    can break code without a compile error.
  summary: >-
    The release notes record 5 months of work and 925 commits from 206 contributors, introduce
    the Build Server Protocol, and describe an ELF linker improved to the point where the
    notes expect incremental compilation to work for everyone on x86_64-linux. `@cImport`
    is removed, C translation moves to the external ZSF translate-c package, and `std.Build.Step.TranslateC`
    is deprecated. The redefined `@bitCast` is fully endian-agnostic and largely matches the
    old behavior on little-endian targets, casts involving `extern struct` and `extern union`
    are now rejected outright with `@ptrCast` given as the replacement for type punning, and
    the notes state the change can break existing code without triggering a compile error.
  why: >-
    Upgrading requires auditing every `@bitCast` touching array or vector types, because the
    release notes state the change can break existing code without triggering a compile error.
  sources:
  - label: primary
    url: https://ziglang.org/download/0.17.0/release-notes.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49938521
- title: Linux boots on M4 Macs with all cores after WFI workarounds reach mainline
  section: Top stories
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Linux now boots on M4 Macs with all cores after workarounds for WFI state loss landed
    in the mainline kernel.
  summary: >-
    The write-up reports Linux booting on M4 Macs with all cores enabled once workarounds
    for architectural state loss on WFI landed in mainline. The author describes the hardware
    as losing architectural state on WFI contrary to the ARM64 specification, and the workaround
    shipping behind a kernel boot parameter rather than as an erratum.
  why: >-
    The blocking defect was silicon that loses architectural state on WFI against the ARM64
    specification, and the fix shipped as a kernel boot parameter rather than an erratum,
    so the same path covers M4 Pro, M4 Max, and M5.
  sources:
  - label: primary
    url: https://yuka.dev/blog-2026-10-02-linux-m4.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49933869
