- title: Microsoft says attackers probed a Zimbra flaw before public disclosure
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Microsoft says attackers probed Zimbra CVE-2026-73570 more than two weeks before the bug
    was publicly disclosed.
  summary: >-
    Microsoft reports observing exploitation attempts against Zimbra CVE-2026-73570 more than
    two weeks ahead of public disclosure. The coverage states that Zimbra Collaboration Suite
    releases earlier than 10.1.20 are affected and should be updated to 10.1.20 or later,
    that only servers running the optional SNMP package with notifications enabled are affected,
    and that attackers used existing SSH trust between mail servers to move laterally.
  why: >-
    Only servers running the optional SNMP package with notifications enabled are affected,
    so removing that package is a mitigation for anyone who cannot reach Zimbra 10.1.20, and
    existing SSH trust between mail servers was used to move sideways.
  sources:
