  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Rust 1.100.0 will demote both i686 Windows targets to std-only, ending toolchain installs
    on 32-bit Windows hosts.
  summary: >-
    The Rust project announced that both i686 Windows targets drop to std-only status in Rust
    1.100.0. Prebuilt standard libraries continue to ship for those targets, but the toolchain
