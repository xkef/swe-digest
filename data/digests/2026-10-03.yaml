- title: AutoCompact trains a coding agent to decide when to compact its own context
  section: ML research
  category: Paper
  status: confirmed
  blurb: >-
    AutoCompact folds context compaction into the policy, reporting a 9.2-point pass-rate
    gain on SWE-bench Verified.
  summary: >-
    Context management in long-horizon coding agents is usually a harness heuristic outside
    the model, and AutoCompact folds the decision into the policy: when to compact, what working
    state to keep, and how to resume. Training data comes from running the base agent, having
    a judge review its compaction decisions, summaries, and post-compaction actions, then
    replacing flawed outputs with corrected ones before execution, with supervised fine-tuning
    followed by joint RL on coding and compaction under task-success rewards. The paper was
    posted 2026-10-01 and reports absolute pass-rate gains of 9.2% on SWE-bench Verified and
    5.0% on SWE-PolyBench Verified, with no independent reproduction.
  why: >-
    The reported gains hold across inference budgets, which suggests context compaction is
    better trained into the model than configured in the harness.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2610.02163
- title: >-
    Exploitation begins against a Rejetto HFS signing-key flaw found with Anthropic's Mythos
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Attackers are exploiting a Rejetto HFS flaw rated CVSS 9.3 that recovers the session signing
    key and forges an admin cookie.
  summary: >-
    GHSA-xxrm-3f86-v97j records that Rejetto HFS 3.0.0 through 3.2.0 derives its session-cookie
    signing key from the non-cryptographic `Math.random()` generator and discloses outputs
    of that generator to unauthenticated clients during login, so an attacker can collect
    a small number of login responses, reconstruct the generator state, recover the key, and
    forge a valid administrator session cookie, which the advisory states leads to full administrative
    access and remote code execution through the `server_code` configuration feature. The
    advisory scores it CVSS v4 9.3 under CWE-338, carries the 3.0.0 through 3.2.0 range in
    its description text while its structured affected and patched fields read Unknown, references
    the v3.2.1 release tag as the fix, and was published 2026-07-13, well behind the current
    3.3.4 of 2026-09-30. The Register quotes VulnCheck's Patrick Garrity describing exploitation
    beginning on the night of 2026-10-01 from a single China-hosted address against hosts
    in the United States and Japan, followed on 2026-10-02 by four attempts from two United
    States addresses in one subnet that appear to be a proxy. Garrity's tracker attributes
    286 CVE records to Mythos and Project Glasswing, and he states this is the second of those
    known to be exploited. The Horizon3 attack research index carries a disclosure entry dated
    2026-09-30 stating its researchers used Anthropic's Mythos to find the chain of cryptographic
    weaknesses, recover the signing key, forge an admin session, and reach remote code execution,
    and the firm's own write-up was not reachable from this environment.
  why: >-
    HFS 3.0.0 through 3.2.0 are affected and 3.2.1 fixes it, so instances on the current 3.3.x
    line are already clear and the exposure is limited to unmaintained deployments, where
    the outcome is remote code execution rather than data exposure alone.
  followup: >-
    Watch for the Horizon3 write-up, and for the timeline discrepancy between The Register's
    2026-09-30 discovery framing and the advisory's 2026-07-13 publication date.
  sources:
  - label: primary
    url: https://github.com/advisories/GHSA-xxrm-3f86-v97j
  - label: fix release
    url: https://github.com/rejetto/hfs/releases/tag/v3.2.1
  - label: research index
    url: https://horizon3.ai/category/attack-research/
  - label: exploitation report
    url: https://www.theregister.com/security/2026/10/03/anthropics-super-bug-hunting-model-mythos-is-hardcore-good-at-math-as-latest-vuln-under-attack-shows/5300933
  - label: discussion
    url: https://news.ycombinator.com/item?id=49946226
- title: Vercel says its sandbox bounty program confirmed a KVM guest-to-host escape
  section: Security
  category: Security
  status: developing
  blurb: >-
    Guillermo Rauch says Vercel confirmed a KVM zero-day through its Sandbox bounty, with
    no CVE, patch, or write-up yet.
  summary: >-
    Guillermo Rauch, listed on the page as Vercel's chief executive, states that Vercel confirmed
    a KVM zero-day through its Vercel Sandbox bounty program and that a full write-up is coming,
    and KVM is his identification. Paulos Yibelo, posting as the reporting researcher, describes
    a full virtual machine escape giving guest-to-host root in industry-standard hypervisors,
    names no product, and promises only more detail. No CVE identifier, affected version range,
    patch, or mitigation has been published, and neither account is independently corroborated.
  why: >-
    A guest-to-host-root escape in KVM would cross the tenant boundary that Linux virtualization
    hosts rely on, including the VM sandboxes coding agents now run in.
  followup: >-
    Watch for the promised write-up, a CVE assignment, and an affected KVM version range,
    tracked as f-0036.
