- title: >-
    FTL ships v0.1.0, an operating system that implements the Linux ABI in a userspace library
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    FTL released v0.1.0, an OS that moves process, VFS, and TCP/IP into a per-container userspace
    library.
  summary: >-
    FTL v0.1.0 implements the Linux ABI in a userspace library, placing process management,
    the VFS, and the TCP/IP stack in a shared library per container and leaving the kernel
    a hypervisor-like interface over hardware user mode. The project site is served by a Rust
    HTTP server running as a Linux binary on FTL, which is direct evidence for the compatibility
    claim. The isolation and performance claims are the project's own with no published benchmarks,
    v0.1.0 has no filesystem, and the roadmap dates Node.js and Go support to December 2026.
  why: >-
    Moving process, VFS, and network code into a userspace library makes those OS features
    patchable and debuggable as application code instead of kernel or eBPF work.
  followup: >-
    Watch for a filesystem implementation, published isolation and performance benchmarks,
    and the Node.js and Go milestones.
  sources:
  - label: primary
    url: https://ftl-os.org/
  - label: releases
    url: https://github.com/nuta/ftl/releases
  - label: discussion
    url: https://news.ycombinator.com/item?id=49944912
