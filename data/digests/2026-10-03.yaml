- title: >-
    HN thread tallies AI-generated kernel vulnerability reports from a Kernel Recipes talk
  section: Hacker News
  category: Event
  status: discussion
  blurb: >-
    An HN thread transcribes a maintainer slide breaking down 79 machine-generated kernel
    vulnerability reports.
  summary: >-
    Hacker News item 49929391 is a submission of a recorded Kernel Recipes talk titled Security
    in the LLM Age, attributed to Greg Kroah-Hartman, and it reached 270 points. The recording
    could not be checked, because youtube.com/watch returns no readable page text to automated
    fetch from this environment, so the figures below are a commenter paraphrase rather than
    a verified account of the talk.
  why: >-
    A maintainer-side triage breakdown is the only public counterweight to vendor counts of
    AI-discovered kernel vulnerabilities, and the thread is where that breakdown is being
    read.
  followup: >-
    Verify the 79-report breakdown against the talk recording or its slides once either is
    readable.
  comments: >-
    Commenters transcribe a slide breaking down 79 reports produced by a tool they name as
    Mythos, with no vendor behind it established from the thread. The buckets they record
    include 24 with no detail beyond a crash, 14 that were not bugs, 3 with fabricated data,
    15 already fixed in the latest release, and 20 that needed fixes, 7 of those contingent
    on a malicious filesystem image and 2 on injected network packets. The figure commenters
    attribute to Kroah-Hartman is roughly ten real bugfixes, amounting to about one hour of
    kernel development work.
  sources:
  - label: talk recording
    url: https://www.youtube.com/watch?v=NnV_cWeoo5Q
  - label: discussion
    url: https://news.ycombinator.com/item?id=49929391
