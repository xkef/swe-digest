- title: >-
    SeaweedFS 4.54 adds S3 Vectors buckets with Lance-backed engines and tightens S3 signature
    and filer token checks
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The release adds vector buckets with Grafana views and Helm support, resumable lifecycle
    passes, and fixes to S3 signed-body and policy checks.
  summary: >-
    SeaweedFS 4.54, released 2026-11-16, integrates S3 Vectors buckets with metrics, audit
    events and request limits, adds Helm management of vector engines, and adds Grafana and
    admin views for vector servers backed by Lance. S3 lifecycle passes now checkpoint daily
    and fail over between S3 fronts. Security fixes verify signed request bodies against the
    signed payload hash, evaluate each policy condition against its own values, stop treating
    scoped filer tokens as admin credentials, and add an optional dialed-host check for gRPC
    certificates.
  why: >-
    Operators on SeaweedFS should upgrade for the S3 authorization and token fixes, and can
    now serve vector search from the same cluster.
  sources:
  - label: primary
    url: https://github.com/seaweedfs/seaweedfs/releases/tag/4.54
- title: >-
    Grafana Cloud Logs makes full-text search generally available with a Logline-based secondary
    index for Loki
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Loki in Grafana Cloud can now find a request ID across weeks of logs without a full scan,
    at about 10% extra compute and storage.
  summary: >-
    Grafana Labs made full-text search generally available in Grafana Cloud Logs on 2026-11-17,
    adding a secondary index from its April 2026 Logline acquisition that tells Loki which
    data can contain a literal string. It speeds up |= line filters, literal and case-insensitive
    regex, structured metadata label filters and post-parser literal filters, at no extra
    charge. Grafana says the index adds about 10% to compute and storage, and DATEV reports
    going from scanning nearly 1 TB in three minutes to about 100 GB in under three seconds.
  why: >-
    Needle lookups by trace, transaction or user ID no longer require high-cardinality labels
    or a separate search cluster, though this ships in Grafana Cloud rather than open-source
    Loki.
  background: >-
    Loki indexes only stream labels and stores compressed log chunks in object storage, so
    a filter on log content has to read every chunk in the selected streams and time range.
    Teams worked around this by putting IDs into labels, which explodes stream cardinality,
    or by running Elasticsearch alongside Loki.
  sources:
  - label: primary
    url: https://grafana.com/blog/find-the-log-line-that-matters-faster-with-full-text-search-in-grafana-cloud-logs/
- title: >-
    PostgresAI measures CREATE TEMP TABLE per transaction at 3783 TPS against 86997 for a
    CTE on Postgres 18
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Each temp table writes 31 catalog rows and sends 132 invalidation messages, and with 5000
    idle sessions DDL reached only 127 of 500 target TPS.
  summary: >-
    Nikolay Samokhvalov's benchmark on Postgres 18.6 with 16 vCPU shows a temp table per transaction
    at 3783 TPS, a session-kept temp table with ON COMMIT DELETE ROWS at 17866, and a CTE
    at 86997. Creating and dropping a two-column temp table inserts and deletes 31 catalog
    rows, unlinks three files, and sends 132 messages through the 4096-slot shared invalidation
    queue. With 5000 idle sessions, writers spent 91% of active time on LWLock:SInvalWrite
    and backends hit 457 full cache resets per second.
  why: >-
    Temp tables in hot paths cost catalog bloat always and throughput collapse under many
    idle connections, so move them out and pool connections.
  background: >-
    Every Postgres backend caches catalog rows and relation descriptors, and DDL tells other
    backends to drop stale entries through one shared invalidation queue per instance. A slot
    is reused only after every backend has read it, so idle backends hold the tail and get
    signalled to catch up or are reset. Temp tables are DDL, so they pay this cost even though
    their data is session-local.
  sources:
  - label: primary
    url: https://postgr.es/p/9Ch
- title: >-
    Kyverno 1.19.2 stops converting the admitted object once per policy, cutting CEL engine
    time at 64 policies from 20 ms to 0.36 ms
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Profiling showed 86.8% of Kyverno's CEL engine allocations went to re-parsing the same
    object for each matched policy, not to evaluating CEL.
  summary: >-
    Kyverno's ValidatingPolicy engine converted the AdmissionRequest to unstructured form
    inside the loop over matched policies, so a Pod matching 16 Pod Security Standards policies
    was parsed 16 times. Kyverno 1.19.2 builds the request once per admission and keeps each
    engine's existing request.object contract, cutting a 50 KB Pod benchmark from 4.91 ms
    to 0.16 ms at 16 policies and 20.01 ms to 0.36 ms at 64. It also fixes a 12% to 23% legacy
    ClusterPolicy regression introduced in 1.17.0 with copy-on-write context checkpoints.
  why: >-
    Clusters running many Kyverno CEL policies get lower admission latency and allocation
    by upgrading to 1.19.2, and the post gives a reproducible harness for comparing against
    native ValidatingAdmissionPolicy.
  background: >-
    Kubernetes admission webhooks let a policy engine accept, reject or mutate each API request
    before it is stored. CEL, the Common Expression Language, is also used by the API server's
    built-in ValidatingAdmissionPolicy, which Kyverno benchmarks against here: native is faster
    at one policy, and Kyverno 1.19.0 was faster at 16 policies while using about 3.2 cores
    against the API server's 8.2.
  sources:
  - label: primary
    url: https://www.cncf.io/blog/2026/11/18/optimizing-kubernetes-admission-control-where-kyvernos-cel-admission-cost-actually-goes/
- title: >-
    Meta says AI agents handle over 60% of propagating ranking techniques across its ads models,
    saving an estimated $45M
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Meta says agents now handle over 60% of porting proven ranking techniques across its ads
    model fleet, with $45M estimated compute savings.
  summary: >-
    Meta describes agents that discover which proven techniques fit which ads ranking models,
    adapt them beyond its shared model templates, and run multi-day training experiments,
    using a shared knowledge base of past runs. Since agents began driving execution in March
    2026, Meta reports 3x engineering productivity, a median 4x cut in training compute on
    select combinations, and over $45M in estimated compute savings by year end. Engineers
    review agent assessments, and the highest-revenue models still get manual adaptation.
  why: >-
    It is a first-party account of where Meta lets agents make judgment calls in ML engineering
    and where it keeps humans in charge.
  sources:
