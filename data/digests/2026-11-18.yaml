- title: >-
    Microsoft agent-framework 1.26.1 and 1.26.2 on PyPI shipped a credential stealer that
    runs on every Python start
  section: Top stories
  category: Security
  blurb: >-
    Two poisoned releases of Microsoft's Python agent framework drop a .pth hook that steals
    Azure and GitHub tokens whenever Python starts.
  summary: >-
    Versions 1.26.1 and 1.26.2 of agent-framework were published 33 minutes apart on 2026-11-17
    and are now quarantined on PyPI. They add a .pth file that collects environment variables,
    credential files, Azure DevOps OIDC tokens, Azure managed identity tokens and instance
    metadata, and 1.26.2 adds GitHub Actions OIDC tokens, all posted to a webhook.site endpoint.
    Researchers advise pinning 1.26.0, checking for installs between about 20:35 and 21:20
    UTC on 2026-11-17, and rotating credentials from a clean system.
  why: >-
    Any Python process in an affected environment, including pip itself, leaked cloud tokens,
    and the stealer requested fresh tokens that rotating stored secrets does not cover.
  background: >-
    Python's site module reads every .pth file in site-packages at interpreter start and executes
    lines that begin with import, so a package can run code without ever being imported. PyPI
    Trusted Publishing ties uploads to a CI identity through OIDC, and the PyPI page shows
    even the clean 1.26.0 was uploaded without it or provenance attestations. This is the
    second Microsoft Python package compromised this year, after durabletask in May 2026.
  followup: >-
    A Microsoft statement on how publishing access was obtained, and restoration of the agent-framework
    and onnxruntime repositories.
  comments: >-
    On Hacker News, a thread about Microsoft's ONNX Runtime vanishing from GitHub (301 points,
    66 comments) noted that the microsoft/agent-framework repository is also offline, and
    both now return 404. Commenters suspect a compromised org admin or shared contributor
    account, with no Microsoft statement yet. They also found the onnxruntime-genai and onnxruntime-extensions
    repositories gone, while packages remain on PyPI and Maven Central.
  sources:
  - label: primary
    url: https://pypi.org/project/agent-framework/
  - label: discussion
    url: https://thehackernews.com/2026/11/attackers-compromise-microsofts-agent.html
  - label: discussion
