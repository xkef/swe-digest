- title: >-
    nginx fixes two HTTP/2 flaws, CVE-2026-123007 and CVE-2026-123633, that allow unauthenticated
    remote code execution
  section: Top stories
  category: Security
  blurb: >-
    Five research teams found two HTTP/2 memory-safety flaws in nginx that allow unauthenticated
    code execution, fixed in 1.30.7 and 1.31.9.
  summary: >-
    F5, Rapid7 and Wiz disclosed on 2026-11-18 a send_window integer underflow (CVE-2026-123007,
    back to 1.9.5) and a connection use-after-free (CVE-2026-123633, back to 1.19.7), both
    CVSS 9.2 and both requiring HTTP/2. Fixed releases are nginx 1.30.7 stable and 1.31.9
    mainline, and Wiz advises setting http2 off until patched. Rapid7's proof of concept needs
    about 128 GB of HTTP/2 traffic and a specific AVX-512 glibc memcpy, while Xint says it
    chained the nginx bug with an unpatched SCTP kernel flaw to reach host root from a container.
  why: >-
    Any internet-facing nginx with HTTP/2 needs 1.30.7 or 1.31.9 now, and hosts that do not
    use SCTP should block that kernel module until a fix ships.
  background: >-
    HTTP/2 flow control lets a client grant a server credit to send DATA bytes, tracked per
    stream and per connection and capped at 2^31-1. nginx keeps the connection credit in an
    unsigned 64-bit counter, so restoring credit for cancelled frames past the cap makes a
    later subtraction wrap to a huge value. That value then becomes a negative length in the
    TLS send path and an out-of-bounds memcpy. Wiz says it found both bugs with its AI code
    scanning harness, the same pattern as Java4Shell a day earlier.
  followup: >-
    Distribution nginx packages, a kernel fix for Xint's SCTP privilege escalation, and exploitation
    reports.
  comments: >-
    The Hacker News thread on the Wiz post reached 402 points and 135 comments within three
    hours.
  sources:
  - label: primary
    url: https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities
  - label: primary
    url: https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed
  - label: primary
