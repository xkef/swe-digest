- title: >-
    Snyk demo: unpinned MCP servers and skills with hidden hex comments or bundled scripts
    make Claude Code run attacker code
  section: Videos
  category: Video
  blurb: >-
    Snyk's Brian Vermeer shows how unpinned MCP servers, hex-encoded skill comments and bundled
    scripts make Claude Code run attacker code.
  summary: >-
    In an IntelliJ IDEA Tech Talk, Vermeer swaps a previously approved local MCP server for
    one that launches a process, edits a tool description to pull fake data from an email
    tool, and hides hex-encoded instructions in an HTML comment inside a SKILL.md. Another
    skill downloads and runs a GraalVM native binary the model cannot inspect, and a third
    ships a Python script that posts git config to a remote host. Snyk's open source agent-scan
    flags each case.
  why: >-
    Pin MCP server versions and scan skills, including their scripts and binaries, because
    approval of a tool carries over to whatever later builds of it contain.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=EijreHWhQ8E
