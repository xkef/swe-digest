- title: >-
    Transformers PR streams MoE experts from SSD and runs a 180B Qwen model on a 32 GB Mac
    within 6% of Strata
  section: AI
  category: AI
  blurb: >-
    A Transformers pull request streams only router-selected MoE experts from SSD, running
    a 180B Qwen model on a 32 GB Mac at about 14 tokens/s.
  summary: >-
    Hugging Face's Tarek Ziadé added an experts_offload option to from_pretrained in transformers
    PR 50717, with a bounded slot-pool cache that grouped_mm runs on directly and early router
    passes that prefetch experts. Qwen3.8-Flash-Next with 3-bit experts reached 13.9 tok/s
    decode and 228 tok/s prefill on an M5 against Strata's 14.8 and 220. On a 24 GB A10G with
    Qwen3.6-35B-A3B, Strata did 82 to 88 tok/s, llama.cpp 63 to 64, vLLM with expert offload
    20.1, and Accelerate offload 0.16.
  why: >-
    Running MoE models larger than device memory no longer requires a separate engine, and
    the benchmark shows which offload flags matter in llama.cpp and vLLM.
  background: >-
    In a mixture-of-experts model a router picks a few experts per token, and experts hold
    most of the weights. Offloading the experts that are not in use to RAM or disk lets the
    dense layers and hot experts fit in GPU memory. The cost moves to I/O and to how quickly
    the host can queue work for the GPU.
  sources:
  - label: primary
    url: https://huggingface.co/blog/moe-expert-streaming
- title: >-
    Claude Code 2.1.327 runs shell start-up files before the first Bash command is approved
    and adds mcp add-json from stdin
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    To speed up the first command, Claude Code now sources shell start-up files before approval,
    and mcp add-json now reads server JSON from stdin.
  summary: >-
    Claude Code 2.1.327 may run shell start-up files before a session's first Bash command
    is approved, even if it is refused, unless CLAUDE_CODE_DISABLE_SHELL_HEAD_START=1 is set.
    The command claude mcp add-json with a dash reads server JSON from stdin so tokens stay
    off the command line, and /status now lists broken agents, skills, hooks that never match
    and an unavailable sandbox. The release also tells Claude not to commit files likely to
    contain secrets, and says an upcoming release removes auto mode's billed classifier fallback.
  why: >-
    Anything in your shell rc files now executes earlier than the approval prompt, which matters
    for sandboxed or audited agent setups.
  sources:
  - label: primary
    url: https://github.com/anthropics/claude-code/releases/tag/v2.1.327
- title: >-
    Simon Willison and Prime Radiant release external sandbox servers that run coding agent
    commands in v86, Apple container or QEMU
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    The agent stays outside while its code runs in a separate sandbox behind a localhost API,
    with a host allow-list proxy and credential swapping.
  summary: >-
    The external sandbox pattern keeps the agent on the host and sends code execution to a
    dedicated sandbox. Three servers share one localhost API: one runs Alpine Linux in WebAssembly
    through v86, one runs Alpine in an Apple container instance, and one uses Microsoft's
    Quicksand library with bundled QEMU. Pi, Claude Code or Codex can be pointed at the API,
    and an optional HTTP proxy enforces a host allow-list and substitutes credentials so the
    agent never sees the secret.
  why: >-
    It gives a way to try local models as coding agents without letting a mistake or prompt
    injection touch the host machine.
  sources:
  - label: primary
    url: https://simonwillison.net/2026/Nov/17/external-sandboxes-for-coding-agents/
- title: >-
    APM 0.36.0 adds host-qualified dependency policies, retires filename hook routing and
    requires Python 3.11
  section: Agentic coding
  category: Agentic coding
  blurb: >-
    Microsoft's Agent Package Manager can now allow or deny dependencies by host, trace files
    to packages, and declare marketplaces per user.
  summary: >-
    APM 0.36.0 adds host-qualified dependency allow and deny patterns in policy, a read-only
    apm view --file command for reverse provenance, marketplaces declared in the user manifest
    and reconciled by apm install -g, and an export-patch command. It is a breaking release
    that retires filename-based hook routing with a migration and requires Python 3.11 or
    newer. It also pins Git settings so package hashes match across platforms and hardens
    trust boundaries for credentials and MCP consent.
  why: >-
    Teams that lock agent skills and MCP servers with APM get org-level source controls, but
    must check hook layouts and Python versions before upgrading.
  sources:
  - label: primary
    url: https://github.com/microsoft/apm/releases/tag/v0.36.0
- title: >-
    Paper: RL on five expert-built task sets lifts Nemotron 3.5 Super by 4.5 to 13.8 points
    using LoRA adapters and no SFT
  section: ML research
  category: Paper
  blurb: >-
    Each task set trained a separate rank-32 LoRA with CISPO and no supervised stage, and
    transcripts show which base model failures went away.
  summary: >-
    The authors post-train Nemotron 3.5 Super (120B total, 12B active) with RL on software
    engineering, constraints, long-horizon tool use, chart and document tasks, one rank-32
    LoRA per dataset with CISPO on Tinker. Terminal-Bench 2.1 rises from 63.9% to 70.3%, SWE-bench
    Pro V2 from 86.9% to 92.1%, and AutomationBench from 14.8% to 27.5%. Side-by-side reads
    show the coding adapter writes its own tests and the tool-use adapter finds data and rules
    before acting.
  why: >-
    It is a measured recipe for adapter-only RL on an open-weight MoE model, with behavior-level
    analysis of what each task set teaches.
  background: >-
    LoRA trains small low-rank matrices added to frozen weights, so each RL run yields a cheap
    swappable adapter rather than a full model copy. CISPO is a policy-gradient objective
    that clips importance-sampling weights instead of token updates, an alternative to PPO-style
    clipping. Skipping supervised fine-tuning tests whether RL alone on verifiable tasks moves
    a capable base model.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2611.22161v1
