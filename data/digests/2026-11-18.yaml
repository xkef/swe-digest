- title: >-
    RustSec issues six lettre advisories, including SMTP command injection through missing
    dot-stuffing
  section: Security
  category: Security
  blurb: >-
    The Rust email crate lettre gets six advisories at once, covering SMTP smuggling, STARTTLS
    reply injection, misrouted mail and DoS panics.
  summary: >-
    RUSTSEC-2026-0561 says a message with bare LF or CR line endings can be ended early with
    a lone dot on servers that accept bare LF, so following text runs as SMTP commands on
    the authenticated connection, affecting send_raw and unencoded bodies, patched in lettre
    0.11.24. Companion advisories issued 2026-11-18 cover STARTTLS response injection by a
    man in the middle, quoted local parts sent to a different address, unbounded SMTP reply
    buffering, and panics on CR or LF in display names and on whitespace-only EHLO lines.
  why: >-
    Rust services that send mail with lettre should upgrade and check whether they pass untrusted
    content to send_raw.
  background: >-
    SMTP ends a message body with a line holding a single dot, so clients must dot-stuff any
    body line that starts with a dot. SMTP smuggling exploits clients and servers that disagree
    on what counts as a line ending.
  sources:
  - label: primary
    url: https://rustsec.org/advisories/RUSTSEC-2026-0561.html
  - label: discussion
    url: https://rustsec.org/advisories/RUSTSEC-2026-0560.html
  - label: discussion
    url: https://rustsec.org/advisories/RUSTSEC-2026-0563.html
- title: >-
    Rapid7 finds third-party artifacts on 55% of internet-exposed Ollama servers, including
    file-read payloads
  section: Security
  category: Security
  blurb: >-
    Rapid7 scanned exposed self-hosted AI servers and found strangers' callback, marker and
    file-read models on 55% of open Ollama hosts.
  summary: >-
    Rapid7 counted 7,627 hosts with an unauthenticated AI or notebook API, almost all Ollama,
    after filtering out likely honeypots. On 54.8% of 7,675 exposed Ollama servers the model
    list held artifacts from someone else, such as pulls from raw IP addresses or tunnels,
    tags embedding the host's own IP, and on 55 hosts encoded paths like /etc/shadow and the
    Ollama private key. 79% listed cloud-routed models, which a signed-in daemon forwards
    to the owner's paid ollama.com account.
  why: >-
    An Ollama port open to the internet gives anyone pull, copy and push access plus a server-side
    request primitive, so bind it to localhost or put authentication in front.
  background: >-
    Ollama serves a local HTTP API on port 11434 with no authentication by default. Its pull
    endpoint fetches models from any registry, which turns the server into an outbound callback
    that confirms reachability. Hybrid mode with ollama signin links a local key to an account
    and routes :cloud models through it.
  sources:
  - label: primary
    url: https://www.rapid7.com/blog/post/tr-self-hosted-ai-renting-compute-exposed-servers
- title: >-
    Codeberg goes offline for hours after its registrar NameSilo suspends the codeberg.org
    domain
  section: Outages
  category: Outage
  blurb: >-
    The Codeberg forge was unreachable on 2026-11-18 after its .org domain disappeared from
    its registrar account, set to clientHold status.
  summary: >-
    Codeberg said on 2026-11-18 that codeberg.org was down because the domain had vanished
    from its NameSilo account and was in clientHold status, with no expiry, transfer or email
    notice. NameSilo later confirmed the domain was suspended and sent the case to its abuse
    team. By 12:30 CET Codeberg reported the domain was slowly recovering pending DNS propagation,
    with no official answer yet from NameSilo's abuse department.
  why: >-
    Projects and CI pipelines that clone from or depend on Codeberg failed, and a registrar
    suspension is a single point of failure for any forge or service domain.
  background: >-
    clientHold is an EPP status code that the registrar sets to remove a domain from the TLD
    zone, so it stops resolving even though the registration still exists. Codeberg is a nonprofit
    Forgejo-based code host run from Germany and a common home for projects that leave GitHub.
  followup: NameSilo abuse team's decision and stated reason for the suspension.
  comments: >-
    The Hacker News thread reached 264 points and 254 comments. Practitioners argue for separating
    registrar and hosting providers, keeping a fallback domain at a second registrar, and
    registering directly with registries such as DENIC, and one commenter reports a similar
    unannounced registrar suspension that support offered to reverse for 90 euros per domain.
  sources:
