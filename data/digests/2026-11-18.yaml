- title: >-
    Harvard working paper finds coding agents raised code output 30% while time to merge rose
    49%
  section: Hacker News
  category: Pulse
  blurb: >-
    Data from 718 firms shows more lines, commits and pull requests after agent adoption,
    but no measurable rise in resolved issues as review slowed.
  summary: >-
    Fiona Chen and James Stratton use Jellyfish data on 725,938 workers at 718 firms from
    2021 to March 2026 in a staggered difference-in-differences design. Agents added about
    30% more lines, 20% more commits and 23% more pull requests, but resolved Jira issues
    did not measurably rise, time from PR to merge grew 3.45 days on a 7.03-day baseline,
    and change requests nearly doubled. AI review tools wrote only 23.3% of review comments,
    and the paper is not peer reviewed. The Hacker News thread drew 168 points and 224 comments.
  why: >-
    It is large-sample evidence that review capacity, not generation, limits agent throughput,
    which argues for measuring review stage time and draft quality.
  sources:
  - label: primary
    url: https://complexdiscovery.com/harvard-researchers-find-ai-coding-agents-shifted-the-bottleneck-to-code-review/
  - label: discussion
    url: https://news.ycombinator.com/item?id=50538303
