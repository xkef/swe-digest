- title: >-
    Stony Brook honeypots show AWS keys leaked in public Docker Hub images get used within
    8 seconds
  section: Security
  category: Security
  blurb: >-
    Researchers planted keys in 300 container images on eight registries, and scanners pulled
    the layers and used all AWS keys within 15 minutes.
  summary: >-
    Billy Tsouvalas and Nick Nikiforakis published 300 honeypot images with AWS, OpenAI and
    Anthropic keys over four months and presented the results at ACM CCS. The fastest AWS
    key use came 7.86 seconds after publication, the median was 51 seconds, and the keys drew
    over 140,000 API calls from 5,000 IPs. Scanners read image layers statically without running
    containers, and Docker made no changes after a May report.
  why: >-
    A secret baked into any public image layer is compromised the moment you push, so registry
    pushes need the same secret scanning as commits.
  sources:
  - label: primary
    url: https://containerbots.github.io/
  - label: discussion
    url: https://www.bleepingcomputer.com/news/security/cloud-keys-leaked-in-docker-hub-images-are-stolen-within-seconds/
- title: >-
    Puppet report deserialization RCE CVE-2026-115731 is exploited and added to CISA KEV
  section: Security
  category: Security
  blurb: >-
    Any host with a CA-signed Puppet agent certificate can run code on the Puppet server,
    and autosign setups let attackers get one unauthenticated.
  summary: >-
    Neodyme found that Puppet's report endpoint deserializes attacker-defined Pcore types
    whose RubyMethod annotations reach class_eval, giving code execution as the puppet user,
    and a second flaw, CVE-2026-115732, lets a certificate for evil.target.lab.local authenticate
    as target.lab.local. Perforce fixed both on 2026-11-03 in Puppet Enterprise 2026.0.1,
    2025.12.1 and 2023.8.13 and Puppet Core 9.1.3 and 8.22.2, with OpenVox fixes in Agent
    9.3.0 and 8.32.0 and Server 9.2.0 and 8.18.0. CISA added CVE-2026-115731 to KEV on 2026-11-17
    with a federal deadline of 2026-12-01.
  why: >-
    A compromised Puppet server leaks its CA signing key and can push code to every managed
    host, so patch and disable or tighten autosign now.
  background: >-
    Puppet agents pull configuration catalogs from a central server over mutual TLS on port
    8140, and the server runs its own certificate authority. Autosign lets new hosts enroll
    automatically when their name matches a pattern, which provisioning tools such as Satellite
    and Ansible often rely on. Neodyme says the bugs date back to Puppet 6.24.0 from July
    2021 and were found with steered AI assistance.
  followup: CISA federal patch deadline on 2026-12-01.
  comments: >-
    SecurityWeek reports exploitation was flagged on 2026-11-04 and that a proof of concept
    targeting OpenVox appeared shortly after the patch.
  sources:
