  section: Talks
  category: Video
  blurb: >-
    Cognition runs every service locally in hourly-rebuilt VMs so Devin can test changes end
    to end, and gives agents metrics to optimize.
  summary: >-
    Walden Yan says Cognition's merged PRs grew 40x in a year while engineering headcount
    grew 2.7x, with PRs self-driving from bug report to merge by default and humans handling
    escalations. The company moved every service to Docker Compose with mocked third-party
    services in a VM rebuilt hourly, so agents never touch live systems, and Devin maintains
    its own testing skills and posts daily CI and lint improvement ideas. He describes giving
    agents goals instead of tasks, such as raising inference throughput on new Vera Rubin
    GPUs or keeping an Android app at parity with iOS over 44 days at 40 to 50 merged PRs
    a day.
  why: >-
    It is a first-party account of the infrastructure a software factory needs, with local
    reproducible environments as the precondition for unattended agent PRs.
  comments: >-
