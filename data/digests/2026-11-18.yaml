- title: >-
    CodeRabbit CEO Harjot Gill: review-exempt shipping as a revocable license, release-level
    human review and in-house CI
  section: Videos
  category: Video
  blurb: >-
    CodeRabbit's CEO says engineers lose review-exempt shipping rights after regressions,
    and humans now review releases rather than pull requests.
  summary: >-
    Gill says he merged over 5,000 PRs in a month and spends about $250,000 a month on tokens.
    Engineers on a review-exempt list ship without human code review, and CodeRabbit ties
    production regressions back to the PR that caused them, so repeated long exposures move
    an engineer back to mandatory review. Humans review each release, shipped every 30 to
    45 minutes, using a risk summary. The team uses TLA+, simulations and Lean proofs as agent
    verification loops, and moved CI in house after a vendor quoted about $13M a year.
  why: >-
    It gives a concrete model for scoped auto-merge, with trust earned and revoked per engineer
    from measured regression exposure.
