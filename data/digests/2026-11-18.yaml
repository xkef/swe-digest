- title: >-
    mise 2026.11.10 adds an offline lockfile check for CI and an enable_backends allowlist
  section: Developer tools
  category: Dev tools
  blurb: >-
    mise lock --check verifies offline in CI that mise.lock covers every tool, platform and
    checksum, and enable_backends limits install sources.
  summary: >-
    mise lock --check fails, without writing or using the network, on anything mise install
    --locked would reject, such as an unlocked version or missing checksum, and shows each
    entry's provenance. The enable_backends setting allows only listed backends, and new options
    add per-tool musl or glibc builds, private uv indexes for pypi tools, and a !@gitignore
    entry for task sources. mise lock --dry-run now resolves tools and makes network requests
    to report real changes.
  why: >-
    Teams can gate CI on lockfile drift and stop mise from installing tools through backends
    they have not approved.
  sources:
