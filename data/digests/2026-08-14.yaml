- title: >-
    Christopher Domas releases a technique that flips one DRAM controller bit to reach PSP
    memory, SMRAM, C6 and microcode on AMD Family 16h
  section: Top stories
  category: Security
  blurb: >-
    Christopher Domas released a technique flipping one DRAM controller bit to reach PSP,
    SMRAM, C6 and microcode on AMD Family 16h.
  summary: >-
    The technique rewrites the final address translation stage in the memory controller on
    AMD Family 16h, the last generation whose datasheets document those DRAM controller translation
    registers. It reaches PSP memory, SMRAM, C6 and microcode. It presumes the attacker can
    already write MMIO, so it breaks the boundaries above ring 0 rather than granting ring
    0.
  why: >-
    Every platform memory protection sits above the memory controller and guards physical
    addresses rather than DRAM coordinates, so rewriting the final translation stage reaches
    protected carveouts without tripping any of them.
  sources:
  - label: primary
    url: https://github.com/xoreaxeaxeax/skitter-creek-bath-salts
  - label: discussion
    url: https://news.ycombinator.com/item?id=49286341
