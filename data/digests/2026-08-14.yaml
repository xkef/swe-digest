- title: >-
    Cerebras and OpenAI open a limited Ultrafast preview of GPT-5.6 Sol at up to 750 output
    tokens per second, with no pricing published
  section: AI
  category: AI
  blurb: >-
    Cerebras and OpenAI previewed Ultrafast GPT-5.6 Sol at up to 750 output tokens per second
    for selected customers with no published price.
  summary: >-
    Cerebras and OpenAI previewed an Ultrafast tier for GPT-5.6 Sol at up to 750 output tokens
    per second, as a limited preview for selected customers with no published price. The Humanity's
    Last Exam and GDP-Val figures are Cerebras' own benchmarking, with run dates in July,
