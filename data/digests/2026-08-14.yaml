  section: Top stories
  category: AI
  blurb: >-
    Google released Gemini 3.7 Flash three weeks after 3.6 at an introductory price that doubles
    on 2027-01-01.
  summary: >-
    Google released Gemini 3.7 Flash, three weeks after 3.6. The introductory rate is $0.75
