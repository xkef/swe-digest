date: '2026-08-14'
stories:
- title: >-
    watchTowr publishes a pre-auth RCE chain against NetScaler ADC and Gateway built on a
    SAML canonicalization heap overflow
  section: Top stories
  category: Security
  blurb: >-
    watchTowr published a pre-authentication RCE chain for NetScaler via a SAML heap overflow
    with attacker-controlled memcpy source and destination.
  summary: >-
    watchTowr published an analysis of a heap overflow in the SAML handling of NetScaler ADC
    and Gateway, where canonicalization of an attacker-supplied assertion drives a memcpy
    whose source and destination are both attacker-controlled. The write-up chains that primitive
    to pre-authentication remote code execution. It reports Citrix listing NetScaler ADC and
    NetScaler Gateway 14.1 before 14.1-72.61 and NetScaler ADC and NetScaler Gateway 13.1
    before 13.1-63.18 as affected. watchTowr states it believes but cannot confirm the flaw
    it analyzed is CVE-2026-8452, because Citrix does not correlate CVE identifiers with credited
    researchers.
  why: >-
    NetScaler Gateway is the remote-access front door for large enterprises, and the write-up
    hands an unauthenticated attacker a memcpy with attacker-controlled source and destination
    on unpatched appliances configured to use SAML as either a service provider or an identity
    provider.
  sources:
  - label: primary
    url: https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/
- title: >-
    Follow-up: Ars Technica names LiteLLM 1.82.7 and 1.82.8 as the compromised builds and
    describes memory scraping
  section: Top stories
  category: Security
  blurb: >-
    Ars Technica identified compromised LiteLLM 1.82.7 and 1.82.8 with memory scraping capturing
    credentials, keys, and environment variables.
  summary: >-
    This archive covered the March 2026 LiteLLM supply chain compromise on 2026-08-12 from
    CloudSEK's victim list, carrying the same figures of about 434,000 CI/CD pipelines and
    a 40-minute publication window, and recording that no affected version range was established.
    Ars Technica, dated 2026-08-12 and updated 2026-08-13, adds three things that entry lacked:
    it names the compromised builds as LiteLLM 1.82.7 and 1.82.8, it puts the harvested material
    at a 195TB file held by Hudson Rock, and it describes the packages as reading the memory
    of infected machines and exfiltrating the contents through an attacker-controlled channel,
    covering cloud keys, repository tokens, SSH keys, Kubernetes secrets, package publishing
    credentials, environment variables and AI provider keys. An update at the foot of the
    piece has researcher Kevin Beaumont reporting that one affected organization told him
    it had rotated every credential, and that when he tested that organization's leaked credentials
    almost every one still worked. The status stays developing rather than moving to confirmed,
    because the affected-version claim traces to CloudSEK and Hudson Rock rather than to a
    maintainer advisory, this step found no GitHub Security Advisory from BerriAI/litellm
    for those builds, and both research posts returned 404 at the URLs tried.
  why: >-
    Memory scraping is broader than environment-variable collection, so exposure on a machine
    that installed 1.82.7 or 1.82.8 is not bounded by what sat in the environment block. Beaumont's
    re-test covers one organization and is a reason to verify a rotation reported as complete,
    not a measurement of the leaked set as a whole.
  followup: >-
    Track a maintainer or vendor advisory naming the compromised builds, and a reachable primary
    from CloudSEK or Hudson Rock.
  sources:
  - label: report
    url: https://arstechnica.com/security/2026/08/terabytes-of-credentials-leaked-in-massive-supply-chain-attack/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49291782
- title: >-
    Z.ai documents GLM-5.3 as a post-training-only upgrade over GLM-5.2 and reports 84.5 percent
    on CyberGym, with the API not yet available
  section: Top stories
  category: AI
  blurb: >-
    Z.ai documented GLM-5.3 as a post-training-only upgrade scoring 84.5 percent on CyberGym,
    with the API not yet available for use.
  summary: >-
    Z.ai's developer documentation describes GLM-5.3 as a post-training-only upgrade over
    GLM-5.2, with no change to pretraining. The page reports 84.5 percent on CyberGym. Every
    figure on the page is vendor-reported with no independent reproduction, and the same page
    states the API is not yet available.
  why: >-
    An open-weights model reporting the top CyberGym score moves vulnerability-discovery capability
    out of the closed frontier labs, and the API to use it has not shipped.
  sources:
  - label: primary
    url: https://docs.z.ai/guides/llm/glm-5.3
  - label: discussion
    url: https://news.ycombinator.com/item?id=49294997
