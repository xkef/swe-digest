- title: Bend 2 write-up questions a proof-carrying language with an AI-written compiler
  section: Agentic coding
  category: Agentic coding
  status: discussion
  blurb: >-
    A write-up recreates Bend 2's 500-line proof demo as a short SPARK package that GNATprove
    discharges with 12 checks proved.
  summary: >-
    The post argues that building a language and its compiler by prompting left Bend's author
    unaware of formal verification as an existing field with existing tools. It recreates
    Bend's demo, 58 lines of LAWS.bend plus 442 lines of PROOF.bend, as a short SPARK package,
    and reports GNATprove discharging it with all checks proved, 12 checks.
  why: >-
    The comparison sets a model-generated proof-carrying language against an established verification
    toolchain that discharges the same obligations in fewer lines.
  comments: >-
    HN commenters pointed at the project's own README, which states the compiler, not the
    kernel, is 99 percent AI-written and has not been fully audited yet.
