- title: Go 1.27 adds a goroutine leak profiler built on the garbage collector
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Go 1.27 adds a goroutineleak profile that works in production and reports the exact line
    where a leaked goroutine blocks.
  summary: >-
    The new goroutineleak profile type in runtime/pprof is exposed at /debug/pprof/goroutineleak
    for anyone already running net/http/pprof, covering ground goleak and synctest do not
    because those run only in tests, and which ordinary goroutine profiles cannot cover because
    they do not separate a leak from goroutines legitimately blocked in bulk under load. It
    defines liveness inductively, a goroutine is live if unblocked or if a primitive blocking
    it is referenced by another live goroutine, then reuses the mark-and-sweep collector by
    seeding mark roots with only the unblocked goroutines. Coverage is limited to channel
    operations, blocking select and sync Mutex, RWMutex, WaitGroup and Cond, so file and network
    IO blocking is never reported, a primitive kept reachable from a global hides its waiters,
    and the worst case is quadratic in goroutine count per cycle on a daisy chain, which is
    why the post recommends periodic collection every few hours rather than continuous use.
    The post is dated 2026-09-02 and the Hacker News thread was created 2026-09-16 with 48
    points, so this item predates the page's window. The work comes from Aarhus University,
    Washington University in St. Louis and Uber.
  why: >-
    Goroutine leaks become diagnosable in a running production service rather than only under
    test, within the stated limits on which blocking primitives the analysis covers.
  sources:
  - label: Go blog
    url: https://go.dev/blog/goroutine-leak-profiles
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49726773
- title: >-
    Linux 7.4 is set to drop the C Binder driver in favour of the Rust implementation
  section: Linux and kernel
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    A patch queued for Linux 7.4 removes about 11,000 lines of the C Binder driver, leaving
    the Rust one in its place.
  summary: >-
    Phoronix reports that Google engineer Carlos Llamas posted a patch removing roughly 11,000
    lines of the legacy C Binder IPC driver, writing that after 15 years the C driver became
    painful to maintain and hard to extend without tripping over vulnerabilities. The Rust
    Binder driver, largely Alice Ryhl's work, was upstreamed in Linux 6.18, has reached feature
    parity, matches or beats the C driver on performance and has been running on Android devices
    in production. Greg Kroah-Hartman has queued the removal into char-misc-next for the Linux
    7.4 merge window, and this account rests on Phoronix rather than on a linked patch posting.
  why: >-
    A Rust driver replacing rather than paralleling a widely deployed C subsystem sets a precedent
    other Rust-for-Linux work will be measured against, which is inference and not a claim
    the Phoronix report makes.
  followup: Track whether the removal lands in the Linux 7.4 merge window as queued.
  sources:
  - label: Phoronix report
    url: https://www.phoronix.com/news/Google-Binder-C-Goodbye
  - label: HN submission
    url: https://news.ycombinator.com/item?id=49765042
- title: Cloudflare reclaims 100TB of RAM by reworking consistent-hashing point counts
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Cloudflare cut more than 100TB of RAM in Pingora Backend Router by rederiving how many
    ketama ring points it needs.
  summary: >-
    The saving lands in Pingora Backend Router, through the pingora-ketama consistent-hashing
    library. The post derives the coefficient of variation for ketama ring segments as a function
    of points per server, and shows the 160-points-per-server default inherited from NGINX
    is what drives the memory cost. Cloudflare reports more than 100TB reclaimed here, on
    top of a separate 100TB the DNS team shed the previous month.
  why: >-
    The derivation is reusable by anyone running consistent hashing at a scale where ring
    size dominates memory.
  sources:
  - label: Cloudflare blog post
    url: https://blog.cloudflare.com/saving-100-tb-of-ram-with-math/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=49758580
