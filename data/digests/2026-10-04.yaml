- title: >-
    Rust for CPython roadmap puts an optional Rust zlib backend in Python 3.16 and a required
    Rust build no earlier than 3.18
  section: Languages and runtimes
  category: Event
  status: discussion
  blurb: >-
    A Python Language Summit roadmap targets an optional Rust zlib backend in 3.16 and a required
    Rust build in 2029 or later.
  summary: >-
    The Python Insider writeup by Seth Larson, dated 2026-09-30, records David Hewitt presenting
    for a team led by core developers Kirill Podoprigora and Emma Smith, authors of a Rust
    for CPython PEP draft, with a timeline of a PEP defining success criteria in late 2026,
    an optional Rust zlib backend and a private Rust API in Python 3.16 in October 2027 with
    the C code kept as a fallback, io, json, xml, memoryview and the parser in 3.17 in October
    2028, and a required Rust build with a public Rust API in October 2029 or later. zlib
    was chosen because zlib-rs is already used by Firefox, uv, and Cargo, and because zlib
    is widely used by Python packaging, so almost every pip install in 3.16 would be sped
    up if the proposal is accepted. Nothing is accepted: Pablo Galindo Salgado called reaching
    for Cargo dependencies a potential showstopper given that CPython vendors a selective
    dependency set, Hewitt answered that sources would be vendored so building CPython would
    not require Cargo, and Hewitt also said it would be disingenuous to claim Rust stays optional
    forever.
  why: >-
    CPython now has a dated path toward requiring a Rust toolchain to build, which every distributor
    and platform packager has to plan against.
  followup: >-
    Watch for the Rust for CPython PEP and whether the optional zlib backend lands in Python
    3.16.
  sources:
  - label: primary
    url: https://blog.python.org/2026/09/language-summit-2026-rust-for-cpython/
  - label: discussion
    url: https://www.reddit.com/r/rust/comments/1wx5we5/rust_for_cpython_python_language_summit_2026/
- title: >-
    Out-of-tree rustc and cargo patches start dependent crates on early metadata and cut clean
    check times
  section: Languages and runtimes
  category: Languages
  status: developing
  blurb: >-
    An out-of-tree rustc and cargo patch series starts dependents on early metadata and measures
    cargo check up to 54 percent faster.
  summary: >-
    A rustc patch series behind `-Zearly-metadata` splits analysis into item interfaces and
    function bodies, writes an `.early-rmeta` file between the two, and swaps in full metadata
    before code generation, while a cargo series behind `-Zheadstart` starts dependents on
    the early-metadata notification and returns a paused compilation's job slot. The author
    measures clean builds of 13 real projects including rust-analyzer, zed, bevy, lemmy, and
    polars at up to 54 percent faster for `cargo check` and up to 42 percent for `cargo build`
    on 16 cores with none slower, falling to 24 percent for rust-analyzer's check on 4 cores
    because the gain comes from cores the build would otherwise leave idle, against stated
    costs of discarded downstream work, errors reported slightly later, and higher peak memory.
    Treat it as unlanded: the patches are described as a commit series meant to become upstream
    pull requests, the repository has 23 stars, and every figure is the author's own, though
    the repository ships scripts that compare diagnostics, JSON output, and exit status with
    the feature off and on and sweep the 53 rustc-perf compile benchmarks.
  why: >-
    Rust clean-build time is a standing complaint, and this is a concrete scheduling mechanism
    rather than a tuning tip.
  followup: >-
    Watch whether the early-metadata and headstart series open as upstream rustc and cargo
    pull requests.
  sources:
  - label: primary
    url: https://github.com/PowderworksCode/headstart
  - label: discussion
    url: https://news.ycombinator.com/item?id=49951218
- title: Valve's Timur Kristóf recounts moving GCN 1.0 and 1.1 Radeon cards to AMDGPU
  section: Linux and kernel
  category: Event
  status: confirmed
  blurb: >-
    An XDC 2026 talk recounts moving GCN 1.0 and 1.1 Radeon cards to AMDGPU, giving decade-old
    hardware the RADV Vulkan path.
  summary: >-
    Phoronix reports an XDC 2026 talk by Valve's Timur Kristóf on moving GCN 1.0 and 1.1 Radeon
    cards onto the AMDGPU kernel driver. That move puts the cards on the RADV Vulkan driver,
    and Phoronix puts the result at a performance boost of roughly 30 percent for those old
    GPUs, which shipped in Linux 6.19 last year.
  why: >-
    Decade-old Radeon hardware gains the RADV Vulkan path and roughly 30 percent more performance,
    which changes what those cards can still be used for.
  sources:
