stories:
- title: C2PA signatures can be crafted to cover zero bytes of the file they sign
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    A malicious C2PA signer can declare the whole file an excluded range, so a valid signature
    and trusted timestamp cover nothing.
  summary: >-
    C2PA lets a signer mark byte ranges as excluded from the hash, and David Buchanan's post
    dated 2026-10-02 shows that a malicious signer can declare the entire file excluded, so
    a valid claim signature and a valid RFC 3161 trusted timestamp both attest to an empty
    string. He timestamped a photo of a lottery ticket before the draw, edited the winning
    numbers in afterwards, and every C2PA verification tool he tested accepted the result.
    The flaw is in the C2PA specification's exclusion feature rather than in a single implementation,
    so no patched version exists and the feature cannot simply be removed, because formats
    such as PNG need it for CRC32 fixups, and the mitigation Buchanan proposes is a per-format
    allowlist of exclusion ranges that verifiers enforce.
  why: >-
    C2PA is the content-provenance standard camera vendors and AI tooling are adopting, and
    a signature covering zero bytes removes the one guarantee the standard exists to provide.
  followup: >-
    Watch for a C2PA specification change that requires verifiers to enforce per-format exclusion-range
    allowlists.
  sources:
  - label: primary
    url: https://www.da.vidbuchanan.co.uk/blog/hacking-time.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49946707
- title: >-
    Critical Gitea Actions runner flaw gives workflow authors root on the runner host
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    On a shared Docker-backed Gitea Actions runner, a workflow author can reach root on the
    host even with privileged mode off.
  summary: >-
    GHSA-x4q3-gcj3-m6cf, CVE-2026-73802 at CVSS 9.9, records that a shared Docker-backed Gitea
    Actions runner appends a workflow's `container.options` to the Docker HostConfig, so the
    workflow author escalates to root on the host the runner sits on, and turning privileged
    mode off does not prevent it. Versions below the pseudo-version 1.0.9-0.20260731160927-34bfa1915022
    are affected, which is the patched version the advisory records, and the same change reaches
    users as the Gitea runner v3.0.0 release carried in runner pull request 1058. The advisory
    was disclosed 2026-08-15 and entered the GitHub Advisory Database on 2026-10-02, so it
    is a seven-week-old disclosure newly indexed rather than a fresh one.
  why: >-
    A shared Docker-backed Gitea Actions runner can still be rooted by anyone able to push
    a workflow to it, so self-hosted CI operators have to upgrade the runner instead of relying
    on privileged mode being off.
  sources:
  - label: primary
    url: https://github.com/advisories/GHSA-x4q3-gcj3-m6cf
  - label: fix release
    url: https://gitea.com/gitea/runner/releases/tag/v3.0.0
  - label: pull request
    url: https://gitea.com/gitea/runner/pulls/1058
- title: Go 1.27 extends its experimental SIMD API from amd64 to arm64 and wasm
  section: Top stories
  category: Languages
  status: confirmed
  blurb: >-
    Go 1.27's experimental simd package extends from amd64 AVX-512 to arm64 NEON and the 128-bit
    wasm vector set.
  summary: >-
    The Go blog post covers the `simd` and `archsimd` packages behind `GOEXPERIMENT=simd`,
    which now reach AVX through AVX-512 on amd64, NEON on arm64, and the 128-bit wasm vector
    set, with one method name shared across widths and architectures and masks as opaque types
    the compiler fuses into single instructions where the hardware allows. The post is explicit
    that CPU feature checks are required to avoid SIGILL and also act as optimization hints,
    and that loop bounds have to be written so the prove pass can drop bounds checks. The
    API stays experimental, and SVE, SVE2, riscv64, ppc64, s390x, and loong64 are listed as
    future work.
  why: >-
    Writing SIMD in Go has required hand-written assembly, and a portable experimental API
    changes what a Go hot loop can reach without dropping out of the language.
  followup: >-
    Watch whether the simd and archsimd packages leave GOEXPERIMENT and which of SVE, riscv64,
    and the remaining architectures land first.
  sources:
  - label: primary
    url: https://go.dev/blog/archsimd
  - label: discussion
    url: https://www.reddit.com/r/golang/comments/1wwpfbh/archspecific_simd_in_go_the_go_programming/
- title: >-
    OpenAI safety report lead David Robinson resigns and calls the company's culture broken
  section: Top stories
  category: Markets
  status: confirmed
  blurb: >-
    David Robinson, who led OpenAI's product safety reports, resigned and wrote that the company's
    culture is broken.
  summary: >-
    The Guardian reports that David Robinson, who led the writing of the safety reports that
    accompanied OpenAI product releases, resigned and set out his reasons in a first-person
    essay in the Atlantic headlined "I quit OpenAI because its culture is broken", writing
    that as the company sprints from one launch to the next it is failing to achieve the level
    of care he believes is needed. An OpenAI spokesperson told the Guardian that the company
    is making sure its models do not become more capable than it can safely manage and secure,
    and that it pauses training or holds back models when it needs to slow down, and the Guardian
    reports both that OpenAI announced it was scrapping the release of a next-generation model
    after researchers raised safety concerns in internal testing and that OpenAI has paused
    training of its most advanced models. The scrapped model is not named in that report,
    and the essay itself returns HTTP 403 to this environment, so every claim here rests on
    the Guardian.
  why: >-
    A team building on OpenAI models has no announced successor model to migrate to and should
    plan on the current lineup standing rather than on a near-term upgrade.
  followup: >-
    Watch whether OpenAI resumes its most advanced training runs or announces a successor
    model.
  sources:
  - label: primary
    url: https://www.theguardian.com/technology/2026/oct/03/openai-safety-leader-quits-warning-ai-companys-culture-is-broken
  - label: essay
