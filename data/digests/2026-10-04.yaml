- title: Nolan Lawson argues the case against "use the platform" before defending it
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Nolan Lawson argues the platform-skeptic case, then names browser lag and better npm docs
    as the reasons behind it.
  summary: >-
    The post takes the platform-skeptic side seriously and names the causes: browsers spent
    years behind the library ecosystem, npm packages documented themselves better than the
    platform did, and building a modal yourself teaches more than reaching for the `dialog`
    element. Lawson generalises past the web with a ClickHouse example where he and a coworker
    each built compression and key-value indirection that the columnar store already did better.
    He splits the AI effect in two, with models either picking the right platform API because
    they know it or flooding codebases with duplicated non-idiomatic code, and states he has
    seen both.
  why: >-
    It gives a concrete account of why teams rebuild what a platform already provides, which
    is the decision an AI-assisted codebase now makes at higher volume.
  sources:
  - label: primary
    url: https://nolanlawson.com/2026/10/03/why-dont-more-developers-use-the-platform/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49950554
