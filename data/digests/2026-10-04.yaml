- title: >-
    Google is donating gVisor to the CNCF and moving it off unilateral Google governance
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Google is donating gVisor to the CNCF, with CNCF Sandbox status, non-Google merge rights,
    and org-based voting to follow.
  summary: >-
    The post dated 2026-10-02 by Etienne Perot and Jing Chen states that Google donates the
    project including its name and trademarks, with the application submitted 2026-09-07,
    reviewed 2026-09-22, and accepted 2026-09-28. Over weeks the project moves to CNCF Sandbox
    status, build and testing move to GitHub Actions and Buildkite, Google's internal test
    infrastructure stops blocking pull requests, and non-Google maintainers get merge rights.
    Over months it targets Incubation status, the repository leaves the google GitHub organization,
    and governance moves to org-based voting so Google no longer holds unilateral control,
    with Ant Group, Modal, and Tines committing maintainers and OpenAI, Tencent, and NVIDIA
    named as continuing contributors.
  why: >-
    The post states that kernel maintainers turned down Google's upstream patches improving
    gVisor performance because gVisor is a wholly-owned Google project, so the donation is
    aimed at unblocking the changes that make a self-installed gVisor fast.
  followup: >-
    Watch for gVisor reaching CNCF Sandbox status and for the repository moving out of the
    google GitHub organization.
  sources:
  - label: primary
    url: https://gvisor.dev/blog/2026/10/02/gvisor-cncf/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49954243
- title: >-
    Halide releases wpd, a BSD-licensed Rust WebP decoder it measures faster than libwebp
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Halide's wpd is a BSD-2-Clause Rust WebP decoder its own harness measures 1.19x to 3.19x
    faster than libwebp.
  summary: >-
    The post, dated 2026-10-02, names CVE-2023-4863 as the motivation, a libwebp flaw that
    affected Chrome, Firefox, Signal, and Microsoft Teams and that CISA added to its Known
    Exploited Vulnerabilities catalog. wpd is written in Rust with hand-written assembly SIMD
    routines and can be compiled without them, which the authors state leaves the remaining
    code memory-safe with the only unsafe code in the zerocopy crate, against a libwebp written
    entirely in unsafe C. The speed figures are the vendor's own, from the repository's harness
    against image-webp 0.2.4 and libwebp at commit a1d89ff over a subset of Halide's own test
    data: 1.19x faster single-threaded lossy, 2.74x single-threaded lossless, 2.68x multi-threaded
    lossy, and 3.19x multi-threaded lossless, with the multi-threaded gains helped by parallel
    animation frame decoding, and the post discloses that Halide also sells closed-source
    encoders.
  why: >-
    libwebp sits in browsers, operating systems, and chat clients, and a BSD-2-Clause Rust
    decoder targeting feature parity without a speed penalty is a credible replacement path
    for the component behind CVE-2023-4863.
  sources:
  - label: primary
    url: https://halide.cx/blog/wpd/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49941641
- title: >-
    Hard default budget caps, with Google Cloud shipped and the AWS spend limit in limited
    release
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Simon Willison argues metered clouds need hard default budget caps, with Google Cloud
    shipped and the AWS limit in limited release.
  summary: >-
    The post, dated 2026-10-03, argues that a metered cloud service should ship a hard spending
    cap rather than an alert that fires after the money is spent. It names Google Cloud Spend
    Caps, launched in July, as the shipped example. The AWS spend limit it links sits behind
    a billing experience that the AWS settings page describes as releasing to a limited number
    of customers, and Willison writes that he hopes it reaches general availability for existing
    accounts soon.
  why: >-
    Agent-written deployments make runaway metered spend a routine failure mode, and a team
    can turn a hard cap on today only on Google Cloud, while an existing AWS account still
    has alerts rather than a cap.
  sources:
  - label: primary
    url: https://simonwillison.net/2026/Oct/3/default-hard-budget-caps/
  - label: discussion
