- title: >-
    Strata runs a 125B Qwen MoE on a 12GB consumer GPU by keeping the hottest experts in VRAM
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    Strata serves a 125B Qwen mixture-of-experts on a 12GB GPU, measured at 94 tokens per
    second on an RTX 5070 at Q2_0.
  summary: >-
    The MIT-licensed project serves Qwen3.8-Flash-Next behind OpenAI-compatible and Anthropic-compatible
    endpoints on localhost, splitting a model of 24,576 experts with 10 active per token so
    that the GPU holds the most-used experts, RAM holds all of them, the CPU works the rest,
    and the SSD holds a lookup table, with speculative decoding the authors put at 1.6 to
    1.8x, against requirements of 12GB or more of VRAM, 32GB or more of RAM, and about 80GB
    of disk. Every published figure is author-measured at 2-bit or 3-bit quantization: an
    RTX 5070 with 12GB and 64GB of RAM writes 94 tokens per second at Q2_0, an RX 9070 XT
    writes 60, and the Coder variant has half the experts removed and reaches 91 percent of
    the full model's SWE-bench Verified score by its own authors' measurement. The Hacker
    News headline's claim of an RTX 4090 at 100 tokens per second does not appear in the repository,
    whose fastest measured row is the RTX 5070 at 94 and which gives 100 to 140 only as a
    projection for an RTX 3090.
  why: >-
    A 125-billion-parameter mixture-of-experts model becomes reachable on a gaming PC, which
    changes what local inference can host, provided the quantization caveat travels with the
    numbers.
  sources:
  - label: primary
    url: https://github.com/Niko1221/Strata
  - label: discussion
    url: https://news.ycombinator.com/item?id=49953495
- title: >-
    Independent Kolibri walkthrough measures a larger German tokenizer advantage than the
    vendor claims
  section: AI
  category: AI
  status: discussion
  blurb: >-
    An independent Kolibri walkthrough measures 15 percent fewer German tokens than the GPT-5
    tokenizer, above Aleph Alpha's 11.2 percent.
  summary: >-
    The post distils Aleph Alpha's 189-page technical report, the model card, and the launch
    post into six design choices: 50 layers of 384 experts plus one shared expert with 6 routed
    per token, giving 78.1B total and 3.46B active parameters, a 128,000-token UniBPE vocabulary,
    sliding-window attention on 40 of 50 layers with only those layers carrying rotary position
    embeddings, which is what lets context stretch past the 262,144 tokens it was trained
    on to a validated 1,048,576, German-language reasoning training, a per-request `reasoning_effort`
    selector, and Merlin-Arthur abstention training. The author ran his own tokenizer comparison
    over the German Basic Law and measured 15 percent fewer tokens than the GPT-5 tokenizer,
    a larger reduction than the 11.2 percent Aleph Alpha claims rather than a reproduction
    of it, and he also lists the weak rows: last of twelve on a closed-book test, 39.8 on
    multi-turn Berkeley Function Calling against 54.0 for Qwen3.5 35B-A3B, and 27.7 on Terminal-Bench
    2.1. Benchmark comparisons otherwise come from Aleph Alpha's own evaluation, and the author
    discloses a friendship with a member of the team.
  why: >-
    The tokenizer measurement is the one number in the post a reader can reproduce independently,
    and it lands above the vendor's figure on a corpus the author chose himself.
  sources:
  - label: primary
    url: https://tej.as/blog/aleph-alpha-kolibri
  - label: discussion
    url: https://news.ycombinator.com/item?id=49943034
- title: >-
    Practitioner argues coding agents need committed documentation rather than vector-store
    memory
  section: Agentic coding
  category: Agentic coding
  status: discussion
  blurb: >-
    A practitioner argues coding agents need documentation committed to the repository rather
    than an opaque vector-store memory.
  summary: >-
    The post argues that what agent memory systems reach for is documentation, and that docs
    committed to the repository give a team something readable and reviewable where an embedding
    store does not. Kevin Liao closes by promoting his own free and open-source memory plugin,
    Operator Memory, so the post argues for a system its author maintains.
  why: >-
    It frames agent memory as a documentation problem that lives in the repository, which
    a team can read and review, unlike an opaque embedding store.
  sources:
  - label: primary
    url: https://liao.gg/blog/agents-dont-need-memory
  - label: discussion
    url: https://news.ycombinator.com/item?id=49945933
- title: >-
    Quadratic SVG parsing in probe-image-size blocks the Node event loop on crafted input
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A crafted SVG makes probe-image-size parse quadratically and stall a Node event loop at
    full CPU, fixed in 7.4.0.
  summary: >-
    GHSA-gjj5-9665-rwrc, CVE-2026-104861 at CVSS 7.5, records quadratic complexity in the
    SVG handling of probe-image-size, so a small crafted response holds the Node event loop
    at full CPU. Versions through 7.3.0 are affected, and release 7.4.0 fixes both the synchronous
    path and the stream path. The advisory was disclosed 2026-08-15 and entered the GitHub
    Advisory Database on 2026-10-02.
  why: >-
    Any upload validator, image proxy, or link unfurler that calls probe on a remote URL can
    be stalled at full CPU by a small crafted response, and 7.4.0 fixes both the sync and
    the stream path.
  sources:
  - label: primary
    url: https://github.com/advisories/GHSA-gjj5-9665-rwrc
  - label: fix release
    url: https://github.com/nodeca/probe-image-size/releases/tag/7.4.0
- title: SiYuan agent tools reach internal addresses through a DNS rebinding SSRF bypass
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    SiYuan's agent tools can be pointed at internal addresses, because its SSRF guard and
    its dialer resolve the hostname twice.
  summary: >-
    GHSA-x8gv-g2g3-65fj, CVSS 8.2, records that SiYuan's SSRF protection resolves a supplied
    hostname to check it against blocked ranges, and the HTTP dialer then resolves the same
    hostname again when it makes the request. An attacker who controls the DNS answer can
    return an internal address on the second lookup, so the agent tools fetch from the internal
    network past the guard. Versions through 3.8.0 are affected and 3.8.1 carries the fix,
    and the advisory was disclosed 2026-08-13 and entered the GitHub Advisory Database on
    2026-10-02.
  why: >-
    The guard resolves the hostname once and the dialer resolves it again, a split any agent
    tool that fetches a model-supplied URL can reproduce.
  sources:
  - label: primary
    url: https://github.com/advisories/GHSA-x8gv-g2g3-65fj
