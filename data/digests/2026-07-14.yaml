- title: The experimental git history command lands atomic fixup, reword, and split
  section: Developer tools
  category: Dev tools
  status: discussion
  blurb: >-
    Git's experimental history command adds atomic fixup, reword, and split subcommands refusing
    operations risking conflicts across branches.
  summary: >-
    A 2026-07-13 write-up by Lalit Maganti describes the experimental `git history` command,
    which the post attributes to Git 2.54 and 2.55, with three subcommands: `fixup` edits
    an older commit and rebases all descendant branches, `reword` changes a past commit message
    and rebuilds dependents, and `split` breaks one commit into two through a hunk-by-hunk
    prompt. All three are atomic and refuse any operation that would risk a conflict, avoiding
    half-rebased repository states.
  why: >-
    Native atomic history editing across stacked branches reduces reliance on manual interactive
    rebase for a common and error-prone workflow.
  sources:
  - label: write-up
    url: https://lalitm.com/post/git-history/
  - label: HN 48901010
    url: https://news.ycombinator.com/item?id=48901010
