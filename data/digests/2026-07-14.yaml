- title: Shipping Mac and iOS apps from the command line without opening Xcode
  section: Apple platforms
  category: Apple
  status: discussion
  blurb: >-
    Scott Willsey documents a headless pipeline building, signing, notarizing, and deploying
    Mac and iOS apps entirely without launching Xcode.
  summary: >-
    A 2026-07-11 post by Scott Willsey describes building, signing, notarizing, and installing
    Mac and iOS apps entirely through command-line tools that ship inside Xcode.app without
    launching the IDE. The workflow uses XcodeGen to generate the project from a `project.yml`,
    `xcodebuild` to archive and Developer ID sign, `xcrun notarytool` and `xcrun stapler`
    to notarize and staple, and `devicectl` to deploy to a device, all driven by one `release.sh`
    script with signing keys kept in the login keychain. The author frames the fully headless,
    scriptable pipeline as suited to AI coding agents.
  why: >-
    A headless Apple build-and-release pipeline lets coding agents ship signed apps without
    GUI steps, though it overlaps with existing tools like fastlane.
  comments: >-
    A former Xcode-team engineer and other HN commenters report the same headless workflow,
    several noting that recent Claude Code versions now drive it autonomously. One warns that
    LLM-generated bespoke scripts duplicate what fastlane already solves for mobile release
    automation.
  sources:
  - label: write-up
    url: https://scottwillsey.com/building-and-shipping-mac-and-ios-apps-without-ever-opening-xcode/
  - label: HN 48896665
    url: https://news.ycombinator.com/item?id=48896665
- title: >-
    A predicted-unlikely branch quadruples an encoding loop by breaking a data dependency
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    A dependency-breaking branch hint reduced a serial encoding loop from 320 to 80 microseconds
    by enabling instruction-level parallelism.
  summary: >-
    A 2026-07-12 post by purplesyringa shows a serial encoding loop dropping from 320 to 80
    microseconds after wrapping a table lookup in a branch the CPU predicts as unlikely, with
    a volatile cast to stop the compiler removing it. The original loop was latency-bound
    because each iteration depended on the previous value. The added branch lets the processor
    speculate ahead, converting the loop from latency-bound to throughput-bound.
  why: >-
    It is a concrete demonstration of trading a rarely-taken misprediction for instruction-level
    parallelism in dependency-chained loops.
  sources:
  - label: write-up
    url: https://purplesyringa.moe/blog/quadrupling-code-performance-with-a-useless-if/
  - label: HN 48889148
    url: https://news.ycombinator.com/item?id=48889148
- title: Go-style channels and worker pools built on pthreads in C
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Anton Zhiyanov implemented Go's concurrency primitives in C for Solod, a strict Go subset,
    with worker pools matching Go within 1.1x.
  summary: >-
    A 2026-07-10 post by Anton Zhiyanov implements Go's concurrency primitives in C for Solod,
    a strict Go subset that compiles to plain C with no runtime or garbage collector. Channels
    use a mutex-guarded ring buffer when buffered and a rendezvous copy when unbuffered, and
    a fixed worker pool consumes a bounded queue. The pool benchmark lands within 1.1x of
    Go on realistic 40 microsecond tasks, while unbuffered channels run about 23x slower because
    of kernel wakeup costs.
  why: >-
    It maps the cost of Go's concurrency model onto raw pthreads and shows where the runtime
    scheduler earns its keep.
  sources:
  - label: write-up
    url: https://antonz.org/concurrency-in-c/
  - label: HN 48894637
    url: https://news.ycombinator.com/item?id=48894637
