- title: Grok Build CLI whole-repo upload disabled server-side without comment
  section: Top stories
  category: Security
  status: developing
  blurb: >-
    Grok Build CLI shipped whole-repository and secret uploads on by default; xAI's server-side
    disable leaves client behavior and data unaddressed.
  summary: >-
    The researcher who wire-captured xAI's Grok Build CLI v0.2.93 uploading entire repositories
    and `.env` secrets to the Google Cloud Storage bucket `grok-code-session-traces` retested
    within 24 hours and reported the storage channel now sends nothing, with the server returning
    `trace_upload_enabled: false` and `disable_codebase_upload: true`. The change is a server-side
    flip, not a client update, and xAI published no statement as of 2026-07-14. A separate
    account claimed the CLI uploaded an entire home directory rather than only the working
    repository, widening the reported scope. That claim is a single unverified account.
  why: >-
    A widely distributed coding CLI shipped whole-repository and secret upload on by default,
    and a silent server-side disable leaves the client behavior and the retention of already-uploaded
    data unaddressed.
  followup: >-
    Watch for an xAI statement, a client patch, deletion of uploaded traces, and independent
    reproduction of the retest.
  comments: >-
    HN commenters note the fix is server-controlled, so older clients stay dependent on xAI
    keeping the flag off, and repeat that any user-run tool can read local files, recommending
    sandboxed execution for coding CLIs.
  sources:
  - label: wire-level analysis (gist)
    url: https://gist.github.com/cereblab/dc9a40bc26120f4540e4e09b75ffb547
  - label: HN 48877371
    url: https://news.ycombinator.com/item?id=48877371
  - label: HN 48892468
    url: https://news.ycombinator.com/item?id=48892468
- title: Codex encrypts sub-agent prompts and removes the local audit trail
  section: Top stories
  category: Agentic coding
  status: developing
  blurb: >-
    OpenAI's Codex CLI now encrypts subagent message text, removing human-readable task history
    from local audit and debug surfaces entirely.
  summary: >-
    OpenAI's Codex CLI now encrypts the model-facing message payloads exchanged between agents
    in its MultiAgentV2 mode. A merged change (PR #26210, 2026-06-05) marks the `spawn_agent`,
    `send_message`, and `followup_task` message text as encrypted, storing only `encrypted_content`
    and leaving the local `content` field empty. A regression report (issue #28058, opened
    2026-06-13) states this removes the human-readable subagent task and message text from
    local rollout history and parent-side audit and debug surfaces, so a user can no longer
    see what task a subagent was given. The change reached stable users in Codex 0.144.4,
    published 2026-07-14.
  why: >-
    Codex users lose visibility into their own subagent orchestration, and the change extends
    the coding-agent anti-distillation and telemetry pattern seen with Claude Code request-marking
    and the Grok Build CLI.
  comments: >-
    HN commenters read the change as an effort to frustrate proxying user requests to train
    competitor models, with one reporting that resale accounts stopped working, and several
    object that an open-source CLI now hides its own subagent prompts from the person running
    it.
  sources:
  - label: Codex issue 28058
    url: https://github.com/openai/codex/issues/28058
  - label: Codex PR 26210
    url: https://github.com/openai/codex/pull/26210
  - label: HN 48905028
    url: https://news.ycombinator.com/item?id=48905028
- title: >-
    Apple SpeechAnalyzer beats small Whisper models on device in a LibriSpeech benchmark
  section: Top stories
  category: Apple
  status: discussion
  blurb: >-
    Apple's SpeechAnalyzer API on M2 Pro reached 2.12% word error on clean speech, outpacing
    Whisper Small and running 3x faster per second of audio.
  summary: >-
    A benchmark published 2026-07-13 ran Apple's SpeechAnalyzer API on an M2 Pro under macOS
    26.5.1 against Whisper and the legacy SFSpeechRecognizer over 5,559 LibriSpeech utterances.
    SpeechAnalyzer reported 2.12% word error rate on clean speech and 4.56% on noisy speech,
    ahead of Whisper Small (3.74% and 7.95%) and the legacy API (9.02% and 16.25%), while
    running about 3x faster than Whisper Small per second of audio. The author notes larger
    Whisper models such as Large V3 Turbo still lead on accuracy, so the on-device engine
    is a speed-for-accuracy tradeoff.
  why: >-
    On-device transcription on current macOS now matches or beats small Whisper models with
    no model download and no server round trip, changing the build-versus-bundle choice for
    local speech features.
  sources:
  - label: benchmark
    url: https://get-inscribe.com/blog/apple-speech-api-benchmark.html
  - label: HN 48894752
    url: https://news.ycombinator.com/item?id=48894752
  - label: heise
    url: https://www.heise.de/en/news/Speech-to-text-Apple-s-new-APIs-outperform-Whisper-on-speed-10475273.html
- title: antirez argues developers should steer design, not review every line of AI code
  section: Top stories
  category: Engineering post
  status: discussion
  blurb: >-
    Sanfilippo proposes engineers own architecture and structures while models handle implementation,
    replacing line-by-line review with design.
  summary: >-
    Salvatore Sanfilippo (antirez) published "Control the Ideas, Not the Code," arguing that
    reading thousands of lines of model-generated code daily is inefficient and that engineers
    should own architecture, data structures, and QA instead. He proposes replacing line-by-line
    review with a maintained DESIGN.md that states data structures and implementation strategy,
    and says he leans on strong models for error detection in Redis work rather than manual
    review. He cites implementing inference for DeepSeek v4 and GLM 5.2 in his DwarfStar project
    as evidence that subtle implementation errors are common.
  why: >-
    A prominent systems author sets out a concrete workflow for keeping human control at the
    design level as coding agents write more of the code.
  sources:
  - label: antirez
    url: https://antirez.com/news/169
  - label: HN 48891184
    url: https://news.ycombinator.com/item?id=48891184
- title: >-
    Cloudflare Precursor adds continuous behavioral bot detection between checkpoints
  section: Top stories
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare Precursor injects JavaScript to score human versus bot behavior continuously
    across sessions, free during beta rolling out now.
  summary: >-
    Cloudflare announced Precursor on 2026-07-13, a session-scoped validation layer that injects
    JavaScript to collect mouse, keyboard, and pointer signals continuously and score human-versus-bot
    behavior between discrete checkpoints such as login, signup, and checkout. It is part
    of Bot Management and Turnstile, enabled from the dashboard, free during a beta rolling
    out now, with general availability planned later in 2026. Cloudflare states it captures
    timing and rhythm rather than keystroke content and persists signatures across page refreshes.
  why: >-
    It extends bot detection from single challenge points to whole sessions, raising the cost
    of automated abuse while adding always-on client-side behavioral instrumentation.
  sources:
  - label: Cloudflare blog
    url: https://blog.cloudflare.com/introducing-precursor/
  - label: HN 48893446
    url: https://news.ycombinator.com/item?id=48893446
