- title: AWS Cost Explorer shows inflated billing estimates in a global incident
  section: Top stories
  category: Outage
  blurb: >-
    AWS Cost Explorer displayed inaccurate billing estimates, with accounts seeing millions
    in charges on zero usage from a unit-pricing defect.
  summary: >-
    AWS opened an incident on the AWS Billing Console on 2026-07-17 after Cost Explorer began
    showing inaccurate estimated billing data. AWS reported the investigation started at 01:33
    PDT on 2026-07-17, after reports that began the prior evening. Customers, including accounts
    with little or no active usage, saw estimated charges reaching hundreds of millions to
    trillions of dollars. AWS stated the root cause is a unit-pricing defect in the estimated
    billing computation subsystem, that the displayed estimates do not reflect actual usage
    or charges, and that recomputing correct estimates across all accounts would take several
    hours after mitigation.
  why: >-
    Budget alerts, anomaly detection, and FinOps guardrails keyed on the bad estimates fired
    on those figures, so a display-layer defect propagated into every downstream alerting
    path even though invoices and payment records were not affected.
  followup: >-
    Watch for a published root-cause writeup and confirmation that no invoices or payment
    records were affected.
  comments: >-
    HN commenters reported budget alerts for figures such as $286M and $420M on accounts that
    normally cost a few dollars a month, and linked an r/aws thread with the same pattern.
  thread: f-0091
  sources:
  - label: AWS Support status update
    url: https://x.com/AWSSupport/status/2078037531036172430
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48945241
- title: Kimi K3 publishes specs, pricing, and benchmarks with weights due 2026-07-27
  section: Top stories
  category: AI
  blurb: >-
    Moonshot published Kimi K3 as a 2.8T Mixture-of-Experts model with 1M-token context and
    $0.30/$3.00/$15.00 per 1M tokens, weights due July 27.
  summary: >-
    Moonshot AI published a Kimi K3 announcement on 2026-07-16, adding the model detail that
    was absent when K3 went live in the product the same day. K3 is a 2.8T-parameter Mixture-of-Experts
    model (Stable LatentMoE with 16 of 896 experts active per token) built on Kimi Delta Attention,
    with a 1M-token context window and native multimodal input. The API model id is `kimi-k3`,
    priced at $0.30 per 1M cache-hit input tokens, $3.00 per 1M cache-miss input, and $15.00
    per 1M output. Full weights are promised by 2026-07-27, with a technical report to follow.
  why: >-
    A 2.8T open-weight model with a scheduled weight release sets a new size point for self-hostable
    frontier models, though the benchmarks are vendor-reported and unverified until the report
    and weights land.
  followup: >-
    Watch for the 2026-07-27 weight release and license, the technical report, and independent
    benchmark reproduction.
  comments: >-
    HN commenters note the $3.00/$15.00 per 1M pricing (cache $0.30) is high for a Chinese
    open-weight model, and that Moonshot's own figures rank K3's overall intelligence behind
    Claude Fable 5 and GPT-5.6 Sol.
  thread: f-0093
