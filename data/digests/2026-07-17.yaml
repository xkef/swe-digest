- title: The LLM critics are right, and the author keeps using LLMs
  section: Hacker News
  category: Pulse
  blurb: >-
    An essay accepts LLM criticisms about environmental cost, copyright, and geopolitics,
    then argues the author still uses LLMs heavily anyway.
  summary: >-
    A 2026-07-15 essay (Hacker News front page 2026-07-17, 206 points) accepts that LLM criticisms
    about environmental cost, copyright, open-source trust, and geopolitics are valid, then
    argues the author still uses LLMs heavily because they amplify existing thinking, reporting
    $9,838 of token spend in June 2026. The thread debates whether small reviewable diffs
    with tests are the real trust boundary rather than whether code was AI-assisted.
  why: >-
    It captures the current practitioner split between accepting AI-tooling criticism and
    adopting it anyway, and the review-cost argument that follows.
  comments: >-
    HN commenters argue the trust problem is diff size and reproducibility, not authorship:
    a small change with clear tests is reviewable while a large opaque diff is not, regardless
    of who wrote it.
  sources:
  - label: theocharis.dev
    url: https://www.theocharis.dev/blog/llm-critics-are-right-i-use-llms-anyway/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48933310
