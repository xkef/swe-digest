- title: NotebookLM becomes Gemini Notebook
  section: AI
  category: AI
  blurb: >-
    Google renamed NotebookLM to Gemini Notebook with Gemini integration, code execution for
    Pro users, and Search integration.
  summary: >-
    Google renamed NotebookLM to Gemini Notebook on 2026-07-16. It stays a standalone research
    product but gains deeper Gemini integration: notebooks are creatable inside the Gemini
