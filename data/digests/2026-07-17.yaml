- title: Turso builds a Postgres frontend on its Rust SQLite engine
  section: Top stories
  category: Infrastructure
  blurb: >-
    Turso plans to add Postgres compatibility to its Rust engine, reusing the same bytecode
    core across SQLite and Postgres frontends.
  summary: >-
    Turso described (2026-07-16) a plan to add Postgres compatibility to its Rust database
    engine, framed as "the LLVM of databases": one core with many database frontends. Postgres
    queries are parsed into a shared abstract syntax tree and compiled to Turso's VDBE bytecode,
    the same engine that runs its SQLite-compatible frontend with MVCC. The company calls
    the current code a foundation merged into the main repository, not a finished product,
    and lists goals including self-updating materialized views and file-based operation.
  why: >-
    Reusing one bytecode core across SQLite and Postgres dialects is an unusual bet on a shared
    database VM, and it extends the SQLite and libSQL lineage into Postgres territory.
  followup: >-
    Watch for a runnable Postgres frontend, wire-protocol compatibility, and benchmarks against
    Postgres.
  sources:
  - label: Turso blog
    url: https://turso.tech/blog/a-new-modern-version-of-postgres-in-rust
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48935487
- title: German consortium releases Soofi S, an open 30B hybrid Mamba-Transformer model
  section: Top stories
  category: AI
  blurb: >-
    A German consortium released Soofi S 30B, a hybrid Mamba and Transformer Mixture-of-Experts
    model trained on Deutsche Telekom's Munich cloud.
  summary: >-
    A German consortium coordinated by the KI Bundesverband released Soofi S 30B-A3B on 2026-07-13,
    and it reached the Hacker News front page on 2026-07-17. It is a hybrid Mamba-2 and Transformer
    Mixture-of-Experts model with 31.6B total and about 3.2B active parameters per token (23
    Mamba-2/MoE layers plus 6 attention layers, 128 routing experts plus 1 shared, 6 active
    per token). It was trained end to end on Deutsche Telekom's Industrial AI Cloud in Munich
    over roughly 27 trillion tokens with German up-weighted, using about 253,000 GPU-hours
    on Nvidia B200 hardware. The pretraining report claims the highest scores among fully
    open models on English and German benchmarks, ahead of OLMo 3 32B and Apertus 70B.
  why: >-
    It is a European sovereign-AI open model with a released training recipe, though the weights
    are a gated preview checkpoint and the final license is not yet set.
  followup: >-
    Watch for the final license, a non-preview weight release, and independent benchmark reproduction.
  sources:
  - label: Soofi S base model (Hugging Face)
    url: https://huggingface.co/Soofi-Project/Soofi-S-Base
  - label: pretraining report
    url: https://huggingface.co/spaces/Soofi-Project/Pretraining-Tech-Report
