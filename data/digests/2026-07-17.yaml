- title: Detecting LLM-generated text with classical machine learning
  section: Engineering posts
  category: Engineering post
  blurb: >-
    LLM output is detectable via scikit-learn SVM from statistical patterns, though round-trip
    translation and other evasions degrade detection.
  summary: >-
    A practitioner write-up (dated 2026-03-01, resurfaced on the Hacker News front page 2026-07-17)
    reports that mainstream LLM output carries strong statistical patterns that a traditional
    scikit-learn SVM can separate from human-written text, and suspects this is how many AI
    plagiarism checkers work internally. The author documents data generation, training, a
    JavaScript web-demo implementation, and an attack-and-defense section showing that round-trip
    translation and prompt-based rewriting degrade detection.
  why: >-
    It gives a concrete, low-cost method for AI-text detection and shows how fragile such
    detectors are against simple evasions, relevant to anyone building or relying on plagiarism
    and provenance checks.
  sources:
  - label: blog.lyc8503.net
    url: https://blog.lyc8503.net/en/post/llm-classifier/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48936880
- title: Apple sends litigation-hold letters to about 40 former employees now at OpenAI
  section: Markets and companies
  category: Markets
  blurb: >-
    Apple sent legal-preservation letters to about 40 former employees now at OpenAI, signaling
    the case extends beyond the two named defendants.
  summary: >-
    The Financial Times reported on 2026-07-17 that Apple sent formal legal-preservation letters
    to about 40 former Apple employees now at OpenAI, instructing them to preserve documents
    and evidence relevant to Apple's trade-secret dispute. The letters extend the lawsuit
    Apple filed on 2026-07-10 in the Northern District of California against OpenAI, io Products,
    and former Apple staff Tang Tan (now OpenAI's hardware chief) and Chang Liu, and indicate
    Apple believes the alleged misappropriation may involve employees beyond those named in
    the complaint.
  why: >-
    Litigation-hold letters to dozens of hardware and engineering staff signal Apple is widening
    the trade-secret case against OpenAI's device effort rather than confining it to the two
    named defendants.
  followup: >-
    Watch for OpenAI's response, any additional named defendants, and whether the escalation
    affects the io Products hardware roadmap.
