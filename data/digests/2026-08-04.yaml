- title: >-
    keyv@6.0.0 shipped a valid npm provenance attestation, and the payload's dead-man's switch
    fires on credential revocation
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    keyv@6.0.0 passed npm provenance attestation despite malicious source because the build
    workflow was already compromised.
  summary: >-
    Socket states that keyv@6.0.0 carried a passing npm provenance attestation, because the
    legitimate release workflow built already-trojanized source, so provenance attested build
    integrity and not source integrity. Socket also describes a host-level watcher, persisted
    as a macOS LaunchAgent or a Linux systemd user service, that polls the GitHub API with
    the stolen token every 60 seconds. It evaluates a remote-supplied handler string the moment
    that token returns an HTTP 4xx.
  why: >-
    Rotating the stolen credentials first is what arms the watcher, so removal of the implant
    has to precede rotation, and a passing attestation answers build integrity rather than
    source integrity.
  sources:
  - label: analysis
    url: https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-active-supply-chain
  - label: discussion
    url: https://news.ycombinator.com/item?id=49166874
- title: >-
    DPRK npm packages hide their C2 address in the recipient of an empty Ethereum transfer
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    DPRK-linked npm packages encode command-and-control addresses in the recipient field of
    zero-value Ethereum transfers.
  summary: >-
    Two trojanized Tailwind CSS plugin clones, bianira-ui@1.27.0 and fluid-type-ui@2.0.8,
    decode a command-and-control IP address from the destination address bytes of a zero-value,
    zero-data Ethereum transfer. The transfer carries no calldata and no funds, so the address
    field is the entire payload.
  why: >-
    Detections built around EtherHiding's fixed burn address and calldata inspection do not
    fire on this variant.
  followup: >-
    Track the opensourcemalware.com NullReceiver series for further packages using the same
    encoding.
  sources:
  - label: analysis
    url: https://opensourcemalware.com/blog/nullreceiver-dprk-c2-technique
  - label: discussion
    url: https://news.ycombinator.com/item?id=49154571
- title: >-
    DDoS against Norway's ID-porten resolved after degrading national login into a second
    day
  section: Outages
  category: Outage
  status: confirmed
  blurb: >-
    A DDoS attack on Norway's ID-porten identity provider degraded login to ten public services
    into a second day before resolution.
  summary: >-
    Digdir's status page records a denial-of-service attack against ID-porten that began about
    01:00 on 2026-08-03 and degraded login into a second day. The page lists the affected
    services as ID-porten and MinID, eFormidling, ELMA, Selvbetjening, Altinn, Kontakt- og
    reservasjonsregisteret, eInnsyn, Maskinporten and Ansattporten. ID-porten is operated
    by Digdir's operating partner Vivicta. The status page reports all services back in normal
    operation from about 01:30 on 2026-08-04, a partial regression posted 09:45 CEST affecting
    connections from data centres in Germany, Switzerland, the Netherlands and Belgium, and
    normal operation declared again at 13:03 CEST.
  why: >-
    One identity provider degraded login to Norwegian public services across roughly ten named
    dependent services, which is the concentration risk of national single sign-on in practice.
  followup: Track Digdir's post-incident report for attack volume and mitigation.
  sources:
  - label: status page
    url: https://status.digdir.no/incidents/d7hvqmf2yr3l
  - label: discussion
    url: https://news.ycombinator.com/item?id=49160631
- title: Twenty years of Pandoc
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    Twenty years of Pandoc: from 3000 lines of Haskell to 51 input and 76 output formats through
    a central AST design.
  summary: >-
    John MacFarlane traces Pandoc from roughly 3000 lines of Haskell to 51 input and 76 output
    formats, crediting the central AST with readers and writers on either side. The post also
    explains why the author of the CommonMark spec still ships a pre-CommonMark Markdown parser.
  why: >-
    The design rationale is a concrete case for an intermediate representation over pairwise
    converters, which is the same choice any format-conversion tool faces.
  sources:
  - label: primary
    url: https://pandoc.org/twenty-years-of-pandoc.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49156750
- title: C-Kermit 11 is the first full Kermit release in 15 years
  section: Developer tools
  category: Dev tools
  status: confirmed
  blurb: >-
    C-Kermit 11, the first full release in 15 years, modernizes a VMS-era codebase with IPv6,
    memory-safety fixes and new test coverage.
  summary: >-
    Debian maintainer John Goerzen describes modernizing a codebase that predates ANSI C and
    still targets VMS and OS/2. The work adds IPv6 with runtime fallback, fixes memory-safety
    and malicious-remote issues in the manner of earlier scp patches, and adds unit and Python
    end-to-end tests running close to 2000 cases. CI now builds and tests on Linux x86_64
    and arm64, macOS, FreeBSD, NetBSD and OpenBSD, plus a static musl binary. The last full
    release was 9.0.302 in 2011, and distributions had been shipping anything from that version
    to a beta 18 months old. Development moves to a new Open Kermit project.
  why: >-
    Kermit is still used to push firmware to embedded devices, and the packaged versions in
    circulation carried the unfixed malicious-remote handling.
  sources:
  - label: primary
    url: https://changelog.complete.org/archives/44456-celebrating-45-years-of-kermit-with-the-first-new-c-kermit-release-in-15-years-and-working-with-a-decades-old-c-codebase
  - label: discussion
    url: https://news.ycombinator.com/item?id=49158474
