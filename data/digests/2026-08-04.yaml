  section: Apple platforms
  category: Apple
  status: developing
  blurb: >-
    macOS Mail contacts iCloud when sending from non-iCloud accounts despite iCloud being
    disabled in settings, cause unconfirmed.
  summary: >-
    Jeff Johnson reproduces cloudd and nsurlsessiond reaching gateway.icloud.com on every
