  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Linus Torvalds attributes part of Linux 7.2-rc6's networking backlog to conference timing,
    according to the original announcement.
  summary: >-
    The 2026-08-03 digest carried the 7.2-rc6 release through a Phoronix report, because the
    announcement itself did not resolve from that run. The announcement, dated 2026-08-02,
