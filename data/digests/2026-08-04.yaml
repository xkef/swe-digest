- title: Apple caps bug bounty submissions as AI-generated reports flood the inbox
  section: Top stories
  category: Security
  status: developing
  blurb: >-
    Apple capped bug bounty submissions per researcher due to AI-generated report floods,
    causing a real macOS flaw to go unreported.
  summary: >-
    the-decoder, in a piece dated 2026-08-02 summarizing a Financial Times story, reports
    that Apple has capped bug bounty submissions per researcher with a 30-day cooldown because
    of AI-generated report volume, and that researchers can request a higher quota. The same
    summary states that a macOS privilege flaw held by the Italian startup Bynario went unfiled
    under the cap, that Bynario CEO Alfredo Pesoli put its black-market value in a 100,000
    to 200,000 dollar range, and that Apple has since reached out to Bynario. No affected
    or fixed macOS version is named for that flaw, so the affected versions are not known
    from this sourcing. The Financial Times original was not reachable from this run, so every
    detail here rests on the secondary summary rather than the primary report.
  why: >-
    The slop problem that polluted the CVE pipeline is now rate-limiting a major vendor's
    intake, with the delayed filing of a reported real vulnerability as the cost.
  followup: >-
    Confirm the submission cap against Apple's own security research pages or the Financial
    Times original.
  sources:
  - label: report
    url: https://the-decoder.com/a-real-macos-flaw-worth-200k-went-unreported-because-apples-bug-bounty-inbox-was-full-of-ai-slop/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49152790
- title: >-
    Cloudflare previews @cloudflare/computer, an agent runtime spanning isolates and containers
  section: Top stories
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare previewed @cloudflare/computer, an agent runtime spanning isolates and containers
    backed by a durable SQLite-backed filesystem.
  summary: >-
    Cloudflare published an early preview of @cloudflare/computer, a runtime that presents
    one interface over an isolate runtime and a container runtime. Both are backed by a durable
    virtual filesystem backed by SQLite. Cloudflare describes the release as an experiment
    and ships it as an open-source library on GitHub.
  why: >-
    Putting a durable filesystem behind both execution modes means agent sandboxing stops
    being one container per agent, which Cloudflare argues does not scale.
  sources:
  - label: announcement
    url: https://blog.cloudflare.com/cloudflare-computer/
  - label: source
    url: https://github.com/cloudflare/computer
  - label: discussion
    url: https://news.ycombinator.com/item?id=49155598
- title: Cloudflare quantizes KV cache and weights to serve Kimi and GLM
  section: AI
  category: AI
  status: confirmed
  blurb: >-
    FP8 KV cache quantization lets Cloudflare admit 64 concurrent requests where BF16 exhausts
    at 32, with minimal per-token quality loss.
  summary: >-
    Cloudflare published per-concurrency measurements rather than a single headline number.
    An FP8 KV cache loses a few percent per token but admits 64 concurrent requests where
    BF16 exhausts memory at 32. INT4 weights shrink a GLM 5.2 checkpoint from 705 GB to 421
    GB with accuracy within 0.8 points.
  why: >-
    The numbers state the quantization tradeoff as a concurrency ceiling rather than a quality
    score, which is the form the decision actually takes when sizing inference capacity.
  sources:
  - label: primary
    url: https://blog.cloudflare.com/smaller-faster-safer-models/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49158581
- title: >-
    The npm worm plants autostart hooks in .claude/settings.json and .vscode/tasks.json
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    The npm worm injects SessionStart hooks in .claude/settings.json and folderOpen tasks
    in .vscode/tasks.json, activating without npm install.
  summary: >-
    Wiz records IDE persistence being written to the keyv repository from 09:00 UTC, before
    any package was published. Socket describes a SessionStart hook in .claude/settings.json
    and a folderOpen task in .vscode/tasks.json, both running the same loader when a developer
    or a coding agent opens the cloned repository, with no npm install required.
  why: >-
    This is a second infection path that no npm-side control covers, so ignoring install scripts,
    pinning by integrity hash and release-age delays all sit on the wrong side of it.
  sources:
