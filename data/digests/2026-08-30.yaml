- title: >-
    kernel.org reports 20 percent of its serving capacity rendering git commits for AI scrapers
  section: Top stories
  category: Infrastructure
  status: confirmed
  blurb: >-
    kernel.org reports 20 percent of its serving capacity rendering git commits for AI scrapers,
    with 2 percent of traffic legitimate.
  summary: >-
    Konstantin Ryabitsev reports git.kernel.org taking about 6 million daily requests for
    commit pages, with 66 percent turned away by the Anubis challenge and 33 percent now solving
    it. He puts legitimate traffic at about 2 percent on generous assumptions, and 14 to 16
    of 90 cores across 5 nodes permanently rendering commits for scrapers. The cause he gives
    is scrapers walking rendered HTML across roughly 922 forks of a 1.48 million commit repository
    instead of cloning it once.
  why: >-
    Proof-of-work gating has already been beaten, with Anubis difficulty raised from 4 to
    5 and the bots now solving 5, so kernel.org is removing features and gating anonymous
    access instead.
  followup: >-
    Track which git.kernel.org features are removed and whether anonymous access is gated.
  sources:
  - label: primary
    url: https://people.kernel.org/monsieuricon/creepy-crawlies
  - label: discussion
    url: https://news.ycombinator.com/item?id=49491791
- title: Tencent open-sources Hy4 preview at 770B parameters with 49B active
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Tencent open-sourced Hy4 preview, a 770B-parameter model with 49B active and a context
    window over 1M tokens.
  summary: >-
    Tencent released and open-sourced Hy4 preview, describing a 770B-parameter model with
    49B active parameters and a context window over 1M tokens. The announcement prices it
    at 0.834 US dollars per million input tokens, 2.501 US dollars per million output tokens,
    and 0.042 US dollars per million tokens on cache hits. It also reports a score of 2.99
    out of 4.00 against GLM-5.3 and Kimi K3. That number comes from an evaluation Tencent
    ran internally with its own experts, which is a disclosed method and not a reproducible
    one, so this block rests on the architecture, the context length and the pricing instead.
  why: >-
    An open-weight model at this size and context length adds a self-hostable option at the
    top of the open model tier.
  sources:
  - label: primary
    url: https://www.tencent.com/tencent-releases-and-open-sources-tencent-hy4-preview/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49492632
- title: >-
    vLLM v0.28.0 raises the default batched token budget and moves bitsandbytes out of tree
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    vLLM v0.28.0 ships 584 commits, raises the default batched token budget to 16384, and
    drops in-tree bitsandbytes.
  summary: >-
    The vLLM v0.28.0 release notes list 584 commits. The release raises the default batched
    token budget to 16384 and moves bitsandbytes support out of the tree. Four features are
    removed or relocated in this release.
  why: >-
