- title: >-
    Fable 5.1 in Claude Science computed a nine-loop N=4 super-Yang-Mills amplitude that Lance
    Dixon validated
  section: Top stories
  category: AI
  status: confirmed
  blurb: >-
    Anthropic reports Fable 5.1 in Claude Science computed a nine-loop amplitude a human group
    had already mostly reached.
  summary: >-
    The post is a guest post on anthropic.com written by Matt von Hippel, a science writer,
    with an addendum by Lance Dixon, and it states that the Fable 5.1 model, running inside
    the paid Claude Science harness, carried out a nine-loop amplitude calculation in N=4
    super-Yang-Mills theory, and that Dixon at SLAC validated the result. The post puts the
    cost at roughly one or two thousand dollars for an end user, of which the bootstrap step
    took about $100, corresponding to 96 CPUs running for a week. It reports that Song He's
    group at the Chinese Academy of Sciences had already obtained the majority of the result
    with GPT-6 assistance, links that concurrent result, and concludes that the model did
    something humans turned out to be able to do as well.
  why: >-
    The post states that Dixon validated the result independently, and it also states that
    Anthropic invited and compensated the author, that its staff gave feedback on drafts,
    and that Dixon received Claude usage credits for the validation, so the vendor funded
    both the result and its check.
  followup: Track the peer-reviewed writeup of the amplitude result.
  sources:
  - label: primary
    url: https://www.anthropic.com/research/yes-claude-can-do-nine-loops
  - label: discussion
    url: https://news.ycombinator.com/item?id=49848033
- title: >-
    A reverse engineer reports Meta's Muse agent runtime ships OpenAI, Anthropic and Kimi
    model clients
  section: AI
  category: AI
  status: rumor
  blurb: >-
    A reverse engineer, who sells a competing coding tool, reports Meta's Muse runtime ships
    OpenAI, Anthropic and Kimi model clients.
  summary: >-
    The author reports that the Muse agent runtime carries clients for OpenAI, Anthropic and
    Kimi models, and writes that the files and logs do not show why a given model was selected,
    so server-side control is his inference about what those clients let Meta do rather than
    an observed switch. The identification rests on the author's inference from tool-call
    ID formats and an encrypted payload prefix, and Meta has not confirmed it. The author
    states explicitly that this is not a distillation claim.
  why: >-
    If a personal-agent runtime can change model provider server side without telling the
    user, provider choice stops being something a buyer can verify from the client.
  followup: >-
    Track any Meta statement on provider routing in Muse, and whether the client ever reports
    which provider served a request.
  sources:
  - label: primary
    url: https://mouse.dev/blog/muse-special/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49848095
- title: >-
    A guest post on Terence Tao's blog argues AI-produced mathematics will need more human
    mathematicians
  section: AI
  category: AI
  status: discussion
  blurb: >-
    A guest post on Terence Tao's blog argues verifying AI-produced mathematics will need
    more human mathematicians, not fewer.
  summary: >-
    The post is dated 2026-09-24 and written by Amit Sahai, published as a guest post on Terence
    Tao's blog rather than by Tao. Sahai states the AI systems he has worked with already
    produce new ideas rather than only fast calculation, that researchers will increasingly
    be unable to keep up, and proposes standing research groups funded to spend a term or
    a year understanding an AI-produced body of ideas, which he calls a deployable intellectual
    reserve. His worked example is a machine-proposed fusion plant design where no human community
    understands the containment argument, and his note is that a theorem holds only inside
    a model, so the guarantee is worth no more than the understanding of the model behind
    it.
  why: >-
    The post raises an operational question rather than an academic one, who verifies a result
    nobody derived, and it discloses that GPT 6 Astra was instrumental in drafting it and
    that the file was converted using AI.
  sources:
  - label: primary
    url: https://terrytao.wordpress.com/2026/09/24/were-gonna-need-a-lot-more-mathematicians/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49852717
- title: >-
    A founder's postmortem argues plan mode is the wrong abstraction now that agents interleave
    planning and building
  section: Agentic coding
  category: Agentic coding
  status: discussion
  blurb: >-
    A founder's postmortem argues plan mode is the wrong abstraction because agents now interleave
    planning and building.
  summary: >-
    The post, dated 2026-09-24, reports that a generated specification added length without
    adding clarity, and that forcing a user to finish thinking before building blocked the
    loop the product depended on. The author concludes that a separate plan mode is the wrong
    abstraction once an agent can interleave planning and building.
  why: >-
    Anyone adding a plan step to an agent workflow gets a dated first-hand account of that
    step failing in a shipped product rather than an argument from principle.
  sources:
  - label: primary
    url: https://www.aymannadeem.com/artificial/intelligence,/developer/tools/2026/09/24/plan-mode-is-dead.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49840054
- title: >-
    Anthropic opens a submission portal for Claude plugins with an automated safety scan on
    every upload
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    Anthropic opened a Claude plugin directory submission portal for paid plans, safety-scanning
    each upload before developer-timed release.
  summary: >-
    The 2026-09-25 announcement opens a directory submission portal to developers on paid
    plans, where a submission is either a single remote MCP server or a bundle of MCP servers
    and Agent Skills hosted in a GitHub repository, and in Claude Code a bundle can also carry
    LSPs, commands, hooks and agents. Each submission is validated and safety-scanned on upload,
    with the scan results and recommended changes shown in the review status, and the developer
    controls when an approved plugin publishes. The post states Claude supports the MCP 2.0
    spec with a stateless core and names two extensions, MCP Apps for interactive UI inside
    chat and Enterprise Managed Auth for OAuth.
  why: >-
    The post publishes no pricing, no review time, and no description of what the safety scan
    checks, so a developer cannot estimate either the cost of listing or the strength of the
    gate.
  followup: >-
    Track publication of the safety scan criteria and the review turnaround, and the rollout
    of the single discovery experience across Claude and Claude Code.
  sources:
  - label: primary
    url: https://claude.com/blog/build-plugins-for-claude
  - label: discussion
    url: https://news.ycombinator.com/item?id=49849384
- title: >-
    A double fetch in Avast's kernel driver reached SYSTEM on Windows 11 through IORing buffer
    corruption
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A published chain exploits a double fetch in Avast's kernel driver to reach SYSTEM on
    Windows 11 via IORing buffers.
  summary: >-
    The writeup, dated 2026-09-18, is the second part of a series on the Avast antivirus sandbox
    and covers CVE-2025-13032, a double fetch in the product's kernel driver. The exploit
    corrupts `IORing` registered buffers to reach SYSTEM on Windows 11, and the full chain
    is published. The post states that the current Windows kernel user-mode accessors prevent
    the technique it describes, and it names no affected driver version range.
  why: >-
    The vulnerable code is a security product's own kernel driver, which sits on the trusted
    path of every endpoint that installs it.
  sources:
  - label: primary
    url: https://www.safateam.com/intelligence-hub/research/technical-articles/cve-2025-13032-entering-and-breaking-the-avast-antivirus-sandbox-part-2
  - label: discussion
    url: https://news.ycombinator.com/item?id=49841115
- title: >-
    An unsigned JWT in a Microsoft internal analytics service put an estimated 17.3 trillion
    rows in reach
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    A researcher reports a Microsoft analytics service never checked JWT signatures, leaving
    an estimated 17.3 trillion rows reachable.
  summary: >-
    The service checked tenant, audience, application id and user claims on the bearer token
    but never checked the signature, so a token with an `alg: none` header and an empty signature
    section passed every other control, and setting the `upn` claim to the literal string
    `admin` resolved to local user id 1 holding the Admin role and allowed raw SQL. The writeup
    counts 30 live routing targets resolving through 24 configurations to 17 connected ClickHouse
    analytics databases across 9,863 table names, with a metadata row estimate of 17,333,335,124,315
    verified through two paths. Microsoft locked the endpoint on 2026-09-09, four days after
    the 2026-09-05 report, awarded $5,000 on 2026-09-17, supplied a statement, and had editorial
    control over the post, cutting sections and figures before publication.
  why: >-
    Validating every claim while skipping the signature leaves each claim attacker-controlled,
    and the author states his own AI hunting tool spent ten days on enumeration and JWT probing
    without ever trying `admin`, because the field name says UPN.
  followup: >-
    Track whether Microsoft publishes its own account of the exposure, and whether the cut
    sections and figures are released.
  sources:
  - label: primary
    url: https://blog.faav.net/how-i-couldve-accessed-17-trillion-microsoft-records
  - label: discussion
    url: https://www.reddit.com/r/cybersecurity/comments/1wqehee/how_i_couldve_accessed_17_trillion_microsoft/
