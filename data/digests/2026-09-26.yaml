- title: >-
    Topcoat 0.9 adds server-push live views to the full-stack Rust framework from the Tokio
    authors
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Topcoat v0.9, from the Tokio authors, extends server-rendered live view updates past page
    load onto a server-pushed WebSocket.
  summary: >-
    The 2026-09-24 post from Carl Lerche and Julien Scholz publishes Topcoat v0.9 and describes
    the rendering model in code, where browser-side signals can be read while rendering on
    the server and only the shards that track a changed signal re-run, morphing the returned
    HTML to preserve focus and input state. The `live!` and `emit!` macros emit repeated UI
    updates, and 0.9 extends that past the initial page load to a WebSocket the server pushes
    over. Toasty, the framework's ORM, gains an `update!` macro that issues a single statement,
    `#[document]` fields encoded as PostgreSQL JSONB with filtering pushed into the query,
    and polymorphic relations expressed as an enum with a shared key column.
  why: >-
    The post argues that framework conventions reduce token use and error rates for coding
    agents, which is an author-stated position rather than a benchmark, so a team weighing
    the framework has to measure that claim itself.
  sources:
  - label: primary
    url: https://tokio.rs/blog/2026-09-24-topcoat-server-applications
  - label: discussion
    url: https://news.ycombinator.com/item?id=49842332
- title: A patch adding AGENTS.md to the Linux kernel tree draws objections in review
  section: Linux and kernel
  category: Linux/Kernel
  status: developing
  blurb: >-
    A one-line patch symlinking AGENTS.md to the kernel README drew a NAK and counter-proposals
    from reviewers on the list.
  summary: >-
    Sasha Levin posted the patch on 2026-09-24, one line adding a top-level `AGENTS.md` symlink
    to `README`, which already points at `Documentation/process/coding-assistants.rst`. The
    commit message gives the test that motivated it. Asked to rename the Makefile release
    string, one agent without the file added a `Signed-off-by` for the human submitter on
    its own and used its own attribution trailer instead of `Assisted-by`, and a second added
    no attribution, while with the symlink in place both used `Assisted-by` and neither forged
    a sign-off.
  why: >-
    Only the human submitter can certify the Developer Certificate of Origin, so an agent
    fabricating a `Signed-off-by` is the concrete failure the patch is meant to prevent.
  followup: >-
    Track whether the symlink is merged, replaced by a gitignore entry and template, or dropped.
  comments: >-
    The thread is unresolved as of 2026-09-26, and three replies read in full object to the
    patch. Theodore Tso objects on token cost. Bradley Morgan replies `NAK` and proposes agent
    memories and a `MEMORY.md` file instead. Antheas Kapenekakis, replying on 2026-09-26,
    objects that tracking the file in mainline dirties trees that carry a local one, and proposes
    a gitignore entry plus a template.
  sources:
  - label: primary
    url: https://lore.kernel.org/lkml/20260924134945.3095661-1-sashal@kernel.org/
  - label: report
    url: https://www.phoronix.com/news/Linux-Considers-AGENTS-MD
  - label: discussion
    url: https://news.ycombinator.com/item?id=49854439
- title: >-
    Thomas Ptacek leaves Fly.io and argues the operating system's isolation model no longer
    fits single-user software
  section: Engineering posts
  category: Engineering post
  status: discussion
  blurb: >-
    Thomas Ptacek left Fly.io and argues process isolation earns less when one author writes
    most software on a device.
  summary: >-
    The post, dated 2026-09-25, opens by stating that the author is parting company with Fly.io
    and that he is talking his book. Its argument is that process isolation exists to partition
    software imported from strangers, so it earns less on a device where most applications
    share one author. That he is launching a phone built on that premise comes about two thirds
    in, after the argument.
  why: >-
    The design claim arrives with a disclosed commercial interest, so the argument and the
    product resting on it have to be read together.
  sources:
  - label: primary
    url: https://sockpuppet.org/blog/2026/09/25/what-even-is-an-os-now/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49850305
- title: >-
    Conversations drops its paid Google Play listing after a 14 day wait on an app update
    review
  section: Engineering posts
  category: Engineering post
  status: confirmed
  blurb: >-
    Conversations' author made the XMPP client free and moved to F-Droid, citing a 14 day
    wait on a Google Play update review.
  summary: >-
    Daniel Gultsch, the author of the Conversations XMPP client for Android, states in a 2026-09-24
    post on his own site that the app is now free and that F-Droid is the primary distribution
    channel, with reproducible builds signed by his own key. He states review times have worsened
    over the past year, that he had been waiting 14 days for an update review at the time
    of writing, and that Google Play makes no distinction between a feature update and a security
    update, so a security fix waits in the same queue, and he attributes part of the backlog
    to a volume of AI-generated apps. Play revenue had paid his rent since 2014, Google takes
    15 percent, which he puts at more than 1000 Euro a year, and he left only once grant funding
    through 2029 removed the dependency.
  why: >-
    This is one maintainer's account of his own project rather than a measured claim about
    Play review times in general, and it puts a number on how long a security fix can sit
    in the same queue as a feature update.
  sources:
  - label: primary
    url: https://gultsch.de/posts/breaking-up-with-google-play/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49855315
