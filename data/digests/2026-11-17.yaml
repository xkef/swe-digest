- title: >-
    CMU talk: how Turso's MVCC mode adds concurrent writers to an SQLite-compatible database
  section: Talks
  category: Video
  blurb: >-
    A Turso engineer explains how its MVCC mode adds concurrent writers to the SQLite file
    format with a logical log and in-memory version store.
  summary: >-
    Mikaël Francoeur says PRAGMA journal_mode MVCC flips two header bytes so stock SQLite
    refuses the file, then transactions write only to a logical redo log and an in-memory
    map of row IDs to version vectors, under snapshot isolation where write conflicts force
    a retry. A checkpoint, triggered by default when the logical log passes 4 MB, folds committed
    rows into B-tree pages through the WAL under a global exclusive lock, briefly returning
    busy errors. Limits include full row versions instead of deltas and no spilling, so a
    transaction cannot exceed MV store memory.
  why: >-
    Teams embedding SQLite who are blocked by its single writer can see what concurrent writes
    in Turso cost in isolation level, checkpoint stalls and memory.
  background: >-
    SQLite's WAL mode lets many readers run alongside one writer. Writers append full pages
    to the write-ahead log, and a checkpoint later copies them into the main file. MVCC keeps
    several versions of each row so concurrent transactions do not block each other. Turso
    began as a Rust rewrite of SQLite and keeps its file format and SQL dialect.
  sources:
  - label: primary
    url: https://www.youtube.com/watch?v=-RFqqK1QJZc
