- title: >-
    FrontierHarness Eval v1.1 finds the cheapest coding agent harness per solved task changes
    with the model
  section: Hacker News
  category: Pulse
  blurb: >-
    Across 27,280 agent runs on five open models, the cheapest harness per solved task changed
    with the model, and step count drove cost.
  summary: >-
    Runta and Baseten ran 22 harness configurations with five open models on 62 terminal tasks,
    four attempts each, using 83 billion tokens. Codex CLI had the lowest cost per pass with
    GLM-5.3 but ranked 16th by cost per task with Kimi-K3, and with the model fixed the most
    expensive harness cost 1.8 to 5.0 times the cheapest per task. Steps per pass correlated
    with cost at +0.51, prompt size, tool count and cache hit rate did not, and 64.5% of spend
    went to trials that failed. The thread drew 216 points and 86 comments on Hacker News.
  why: >-
    When you switch models, re-test harnesses on your own tasks, and cut agent steps rather
    than prompt tokens to lower cost.
  background: >-
    A harness is the loop around a model that supplies the system prompt, tools, context management
    and stopping rules, as in Codex CLI, OpenCode or Pi. Each agent step resends the whole
    context, so prompt caching makes repeated input cheap but the number of steps still multiplies
    cost. Benchmarks often fix the harness and vary the model, which hides interactions between
    the two.
  sources:
  - label: primary
    url: https://runta.com/blog/introducing-frontierharness-eval-v1-1/
