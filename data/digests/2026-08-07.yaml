- title: >-
    Programmatic tool calling matches or beats JSON tool calling in 11 of 14 models on BFCL
    v4
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    Programmatic tool calling outperforms JSON tool calling in 11 of 14 models on BFCL v4
    and holds stable under context rot.
  summary: >-
    An unreviewed preprint evaluates exposing tools as typed Python stubs invoked through
    code, with execution and results handled in one agent turn. It reports a 10.6 percent
    gain over the JSON baseline for the GPT-5.6 family and parity or better in 11 of 14 models
    on BFCL v4. Under context rot the programmatic form held stable while the JSON baseline
    degraded 2.3 percent.
  why: >-
    The result is a concrete interface choice for anyone building an agent harness, pending
    independent replication.
  sources:
  - label: preprint
    url: https://arxiv.org/abs/2608.06370
- title: >-
    MCP 2026-07-28 specification removes protocol sessions and makes the protocol stateless
  section: Agentic coding
  category: Agentic coding
  status: confirmed
  blurb: >-
    The MCP specification removes session headers making the protocol stateless, a breaking
    change allowing request-scoped server infrastructure.
  summary: >-
    The initialize handshake and the `Mcp-Session-Id` header leave the core request path.
    Elicitation becomes Multi Round-Trip Requests as a breaking change, and new `Mcp-Method`
    and `Mcp-Name` headers let gateways route without parsing JSON. Roots, Sampling, Logging,
    Dynamic Client Registration and the legacy HTTP+SSE transport are deprecated under a new
    12-month minimum removal window.
  why: >-
    Servers can run on request-scoped infrastructure instead of holding per-client state,
    at the cost of a breaking change to elicitation.
  sources:
  - label: primary
    url: https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - label: coverage
    url: https://blog.cloudflare.com/mcp-v2/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49196233
