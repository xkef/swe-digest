- title: >-
    Claude Code executes .mcp.json commands at session start, and Anthropic calls it working
    as designed
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Opening Claude Code on an untrusted PR branch executes commands from .mcp.json before
    the user types anything, by workspace trust design.
  summary: >-
    Immersive Labs reports that checking out an untrusted pull request branch inside an already-trusted
    repository and then opening Claude Code runs any command declared in the branch's project-scoped
    `.mcp.json`. Execution happens before the user types anything and without an active account.
    Anthropic's bug bounty response states the workspace trust model places the boundary at
    the folder trust decision, so the behaviour is treated as designed rather than as a defect.
    No affected Claude Code versions are named and no fix is planned.
  why: >-
    The practical control is reviewing `.mcp.json` and `.claude/` as executable code before
    switching to a contributor branch.
  followup: Track whether Anthropic moves the trust boundary below the folder level.
  sources:
  - label: primary
    url: https://www.immersivelabs.com/resources/blog/claude-code-rce-vulnerability-how-a-malicious-pull-request-executes-code
  - label: discussion
    url: https://www.reddit.com/r/netsec/comments/1vhh5xw/claude_code_rce_how_a_malicious_pr_triggers_code/
- title: >-
    SCTPhantom use-after-free in Linux SCTP yields root and container-to-host escape (CVE-2026-64564)
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    A use-after-free in Linux SCTP rated CVSS 8.5 yields root and container escape without
    special capabilities on multiple Linux distributions.
  summary: >-
    Tencent Zhuque Lab published a use-after-free in the Linux SCTP implementation, rated
    CVSS v4.0 8.5, from a bug present since Linux 2.6.25. The lab reports local root on Debian
    13, Ubuntu 24.04, Rocky Linux 9 and OpenCloudOS, plus container escape in six of eight
    attempts without CAP_NET_ADMIN or CAP_SYS_ADMIN. First fixed versions are 6.6.148, 6.12.101,
    6.18.42, 7.1.6 and mainline 7.2-rc5.
  why: >-
    An unprivileged local process on an unpatched multi-tenant host reaches root and, in most
    reported attempts, the host from inside a container.
  sources:
  - label: primary
    url: https://matrix.tencent.com/en/2026/08/06/sctphantom-CVE-2026-64564
  - label: discussion
    url: https://news.ycombinator.com/item?id=49201059
- title: >-
    Zapscape KVM guest-to-host escape published with a working proof of concept (CVE-2026-64561)
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    A shadow MMU use-after-free in KVM/x86 with published exploit lets an L1 guest run code
    as root on the host under certain EPT conditions.
  summary: >-
    The embargo has ended on a shadow MMU use-after-free in KVM/x86 and the exploit is published
    on oss-security. A guest with L1 kernel privilege can run code as root on the host. Affected
    commits span 2020-07-08 to 2026-07-21. The author states that on Intel the bug can be
    triggered only when both EPT page walk length 4 and 5 are exposed to L1, and calls that
    condition necessary for assessing the affected scope. The published proof of concept also
    targets AMD and is demonstrated under QEMU TCG rather than as a weaponised exploit against
    a cloud hypervisor.
  why: >-
    The same bug works as a local privilege escalation on distributions that ship /dev/kvm
    at mode 0666, so exposure is not limited to virtualization hosts.
  sources:
  - label: primary
    url: https://github.com/V4bel/Zapscape
  - label: discussion
    url: https://news.ycombinator.com/item?id=49198843
