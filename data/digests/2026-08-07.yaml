date: '2026-08-07'
stories:
- title: >-
    Metabase patches an actively exploited unauthenticated SQL injection rated CVSS 10.0
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Metabase patched a CVSS 10.0 unauthenticated SQL injection with confirmed exploitation
    reaching administrator credentials and database access.
  summary: >-
    Metabase published two critical advisories on 2026-08-06. GHSA-vwf4-m7j8-wcjf is an unauthenticated
    SQL injection rated CVSS 10.0 with exploitation confirmed in the wild, and GHSA-r8h2-qpfx-mx59
    is rated 9.6 and reachable through any publicly shared dashboard carrying a field-filter
    parameter. Both reach administrator access and the stored credentials for every database
    the instance connects to, and patched releases span six major lines from x.58.24 to x.63.5.
    The advisory names `/api/session/reset_password` as the vulnerable endpoint and states
    that blocking it is a temporary workaround for anyone who cannot upgrade immediately.
  why: >-
    An unauthenticated request reaches administrator access and the stored credentials for
    every connected database, and exploitation is confirmed in the wild. The advisory conditions
    the post-upgrade steps on `/api/session/reset_password` being publicly accessible, in
    which case it directs operators to revoke sessions, review API keys and admin accounts,
    and rotate the credentials for every connected database.
  followup: >-
    Framework Computer customers posting on Framework's own community forum quote a notification
    email attributing a breach to a Metabase zero-day. Framework published nothing of its
    own, so the advisories and that breach are carried here as separate facts. Confirm the
    link when a primary account appears.
  sources:
  - label: advisory
    url: https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf
  - label: second advisory
    url: https://github.com/metabase/metabase/security/advisories/GHSA-r8h2-qpfx-mx59
  - label: forum discussion
    url: https://community.frame.work/t/framework-data-breach-discussion/83939
  - label: discussion
    url: https://news.ycombinator.com/item?id=49206130
- title: >-
    GitHub Actions and Pages outage runs about 10 hours 40 minutes and drops workflow-triggering
    events
  section: Top stories
  category: Outage
  status: confirmed
  blurb: >-
    GitHub Actions and Pages suffered a 10-hour 40-minute outage that dropped unprocessed
    workflow-triggering events and left ARC pods stuck.
  summary: >-
    GitHub reported an incident affecting Actions and Pages that ran about 10 hours 40 minutes.
    GitHub states that push and pull request events not processed during the incident cannot
    be replayed automatically. Actions Runner Controller pods left stuck by the incident do
    not recover on their own.
  why: >-
    Teams must push a new commit or re-run workflows themselves, and stuck ARC pods need manual
    kubectl deletion or an ARC redeploy until the next runner release ships automatic recovery.
  comments: >-
    An Ask HN thread ran while the incident was open. Commenters there compared self-hosted
    runner registration failures and queue behaviour against the status page wording.
  sources:
