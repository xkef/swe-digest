- title: >-
    Cloudflare ships Kitesurf, an agent-first browser running in V8 isolates on Workers
  section: Infrastructure
  category: Infrastructure
  status: confirmed
  blurb: >-
    Cloudflare built Kitesurf, an agent-first WebAssembly browser on Workers, claiming lower
    CPU and memory than Chromium for agent automation.
  summary: >-
    Cloudflare built the engine in Rust compiled to WebAssembly rather than shipping Chromium.
    All origin fetches route through a single SandboxOutbound worker and every page load is
    treated as untrusted. Cloudflare claims lower CPU and memory than Chromium for screenshots
    and HTML extraction.
  why: >-
    The design targets the per-agent cost that makes headless-Chromium browser automation
    expensive at scale.
