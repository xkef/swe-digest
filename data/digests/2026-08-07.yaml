- title: TONTOU attack re-poisons branch predictors after Spectre v2 mitigations run
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    MIT presented TONTOU, re-poisoning branch predictors after Spectre v2 mitigations, leaking
    kernel memory with 91 percent accuracy on Zen 2.
  summary: >-
    MIT CSAIL researchers presented at Black Hat USA a technique that injects timer interrupts
    into the gap between branch predictor neutralization and use, defeating eIBRS on Intel
    and Safe RET on AMD. On an AMD Zen 2 Linux host they read arbitrary kernel memory at 5.47
    bytes per second with 91.97 percent accuracy and recovered /etc/shadow in five of ten
    runs. AMD's bulletin, quoted by Phoronix, places the flaw in the Linux implementation
    of Safe RET rather than in the hardware, and reports demonstration on Zen 1 and Zen 2
    with Zen 3 and Zen 4 suspected but not demonstrated. A mitigation for the Safe RET half
    is merged into kernel Git and is not yet in a released stable kernel, and no fixed microcode
    version is named in the available coverage.
  why: >-
    Deployed Spectre v2 mitigations do not stop this variant, and the reported leak rate is
    low but sufficient to recover password hashes.
  followup: Record the stable kernel versions that ship the Safe RET mitigation.
  sources:
  - label: coverage
    url: https://www.bleepingcomputer.com/news/security/new-tontou-cpu-attack-bypasses-spectre-v2-fixes-leaks-linux-password-hashes/
  - label: AMD assessment coverage
    url: https://www.phoronix.com/news/Linux-Safe-RET-Interrupt-Vuln
  - label: discussion
    url: https://news.ycombinator.com/item?id=49203860
- title: >-
    19 of 77 counterfeit Open VSX extensions harvested developer, Git and CI metadata
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    Manifold found 77 counterfeit Open VSX extensions impersonating marketplace packages,
    with 19 harvesting developer and CI metadata to one domain.
  summary: >-
    Manifold Security found extensions on Open VSX impersonating real VS Code Marketplace
    packages, published between 2026-07-26 and 2026-08-01 and all reporting to mangorbit[.]com.
    19 of them collected Git remote hosts, configured email domains, branch and HEAD commit,
    and identifiers from GitHub, GitLab, Azure DevOps, Buildkite, CircleCI, Codespaces and
    Gitpod. The other 58 mainly sent hostname, with some variants adding workspace folder
    name and editor version. Open VSX removed them by 2026-08-03. The coverage names no individual
    extension, and states that Manifold's own report carries the extension IDs to check systems
    and workspace configuration files against, and that all 77 packages contact mangorbit[.]com.
  why: >-
    Registry removal does not uninstall an extension, so a reader needs the extension IDs
    from Manifold's report to find affected machines, and blocking mangorbit[.]com at the
    network edge cuts the single exfiltration domain shared by all 77 packages in the meantime.
  sources:
  - label: coverage
    url: https://www.bleepingcomputer.com/news/security/77-open-vsx-extensions-found-harvesting-developer-info/
- title: >-
    Zig's Io.Threaded cancels blocking syscalls using signals and a shared-memory handshake
  section: Languages and runtimes
  category: Languages
  status: confirmed
  blurb: >-
    Zig's Io.Threaded cancels syscalls using signals and handshakes on POSIX without io_uring
    or the thread teardown issues of pthread_cancel.
  summary: >-
    The implementation gets cancellation from ordinary blocking syscalls on POSIX by setting
    a flag and signalling the target until it acknowledges EINTR, and on Windows by calling
    NtCancelSynchronousIoFile. Zig separates may-run-concurrently from must-run-concurrently
    at the interface, so thread pooling stays possible.
  why: >-
    The approach delivers reliable cancellation without io_uring and without the thread teardown
    that makes pthread_cancel awkward.
  sources:
  - label: primary
    url: https://matklad.github.io/2026/08/06/neat-io-threaded.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49198063
- title: Three reported leaks expose the real IP address behind Apple Private Relay
  section: Apple platforms
  category: Apple
  status: developing
  blurb: >-
    DNS prefetching, WebAuthn requests and WebTransport open connections outside Apple Private
    Relay in Safari, affecting all iOS browsers.
  summary: >-
    Privacy Guides reports that DNS prefetching, WebAuthn Related Origin Requests and WebTransport
    each open connections outside the browser proxy in Safari. The same coverage states that
    because iOS requires WebKit, the bypasses affect every proxying iOS browser including
    Tor-based ones, that the research was published without reporting to Apple first, and
    that device-wide VPNs are unaffected. This entry rests on that single secondary account.
    It names no researcher or research group, and the underlying report was not read for this
    entry, so the claim cannot be traced past one intermediary.
  why: >-
    Private Relay alone does not hide a client address from a site that triggers any of the
    three paths.
  sources:
  - label: coverage
    url: https://www.privacyguides.org/news/2026/08/05/apples-private-relay-leaks-your-real-ip-address-in-safari/
