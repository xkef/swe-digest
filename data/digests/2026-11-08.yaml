- title: >-
    GitHub previews a pull request Overview page that puts merge readiness and next actions
    at the top
  section: Developer tools
  category: Dev tools
  blurb: >-
    GitHub's opt-in Overview page moves merge status, checks and approvals to the top of a
    pull request and adds filters for unresolved threads.
  summary: >-
    GitHub released an opt-in public preview of a new pull request Overview page on 2026-11-05,
    with rollout continuing through the weekend. It replaces the bottom merge box with a compact
    readiness summary of checks, comments and approvals at the top, and adds filters for unresolved
    conversations or your own comments, newest-first sorting, and an activity summary. Users
    can switch back to the classic overview from the same menu.
  why: >-
    Reviewers of long or agent-generated pull requests can see what blocks a merge without
    scrolling the timeline, and the preview signals where GitHub is taking the review surface
    next.
  background: >-
    The merge box is the panel at the bottom of a GitHub pull request that shows required
    checks, review approvals, and merge conflicts, and on long threads it sits below dozens
    of timeline events. GitHub made stacked pull requests generally available on 2026-10-06,
    per its changelog, and this preview is described as the first step in a broader rethink
    of the pull request page.
  comments: >-
    The Hacker News thread reached 119 points and 81 comments. Practitioners said review of
    agent-written PRs is now the bottleneck and asked for hunk-level review checkpoints and
    semantic diffs. Several reported an unfixed bug where Merge when ready fails to enqueue
    PRs into the merge queue, and one team said moving to an external merge queue cut P90
    queue entry time from up to 40 minutes to 16 seconds.
  sources:
