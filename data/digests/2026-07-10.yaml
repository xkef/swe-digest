  section: Hacker News
  category: Pulse
  blurb: >-
    A project streams large model weights from SSD to run GLM 5.2 on memory-constrained machines,
    trading throughput for lower memory usage.
  summary: >-
    A Show HN project (colibri) runs the large GLM 5.2 model on a memory-constrained machine
    by streaming weights from an SSD or NVMe drive rather than holding them in RAM. The thread
    reached 494 points.
  why: >-
    It shows continued practitioner interest in running frontier-scale open models on commodity
    hardware by trading throughput for lower memory.
  comments: >-
