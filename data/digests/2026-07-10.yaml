- title: Initial patches boot the Apple M4 on Linux
  section: Linux and kernel
  category: Linux/Kernel
  blurb: >-
    The first Linux device trees for Apple M4 reach bootable state but require further work
    on peripherals and stable SMP boot.
  summary: >-
    Developer Yureka Lilian posted the first device trees and bindings to boot Apple Silicon
    M4 systems on Linux, reported by Phoronix on 2026-07-09. The M4 bring-up is closer to
    the M3 than the M2-to-M3 step. Most changes are in the m1n1 bootloader, which no longer
    sets CPU configuration bits because iBoot now sets and locks them. The patches only reach
    a bootable state without working peripherals or a usable desktop, and SMP boot depends
    on idle=nop patches and remains unstable.
  why: >-
    It is the first upstream step toward mainline Linux support for the newest Apple Silicon
    generation and continues the Asahi Linux enablement effort.
  followup: >-
    Watch for peripheral drivers (display, GPU, audio), stable SMP boot, and upstream merge
    of the M4 device trees.
  sources:
  - label: Phoronix
    url: https://www.phoronix.com/news/Apple-M4-DT-Linux
  - label: Asahi M4 feature support
    url: https://asahilinux.org/docs/platform/feature-support/m4/
  - label: r/linux discussion
    url: https://www.reddit.com/r/linux/comments/1urrq2k/initial_patches_posted_for_booting_the_apple_m4/
- title: IERS confirms no leap second at the end of 2026
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    The International Earth Rotation Service confirmed no leap second will be added at the
    end of 2026, keeping the UTC offset unchanged.
  summary: >-
    The International Earth Rotation and Reference Systems Service issued Bulletin C 72 on
    2026-07-06, announcing that no leap second will be introduced at the end of December 2026.
    No positive or negative leap second is scheduled. The difference between UTC and TAI stays
    at UTC minus TAI equal to -37 seconds, unchanged since 2017-01-01.
  why: >-
    Systems that special-case leap seconds (NTP daemons, leap-smearing configurations, databases,
    and kernels) need no adjustment for the 2026 year-end boundary, and the offset between
    civil and atomic time has now held at 37 seconds since the last leap second in 2016.
  sources:
  - label: IERS Bulletin C 72
    url: https://datacenter.iers.org/data/latestVersion/bulletinC.txt
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48846281
- title: Prometheus 3.13.1 fixes a TSDB range-query correctness bug
  section: Infrastructure
  category: Infrastructure
  blurb: >-
    Prometheus 3.13.1 fixes a TSDB bug where the head-chunk cache returned incorrect or missing
    results on range queries in the LTS line.
  summary: >-
    Prometheus released 3.13.1 on 2026-07-10, a bugfix release for the 3.13 LTS line. It fixes
    a TSDB defect where the head-chunk cache could return samples from the wrong chunk, or
    spurious not-found errors, on range queries after a head-chunk truncation.
  why: >-
    The bug produced incorrect or missing range-query results in a widely deployed monitoring
    system. Operators running the 3.13 LTS line should upgrade to keep query results correct.
  sources:
  - label: Prometheus 3.13.1 release
    url: https://github.com/prometheus/prometheus/releases/tag/v3.13.1
- title: Good tools are invisible
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Ginger Bill argues that well-designed tools disappear from focus and prioritize sensible
    defaults over maximal configurability.
  summary: >-
    Ginger Bill (creator of the Odin language) argues that the best tools recede into the
    background and let the user focus on the work rather than on the tool. The post contends
    that toolmakers should favor sensible defaults and low-friction usability over maximal
    configurability, and that a steep learning curve is a cost to be justified, not a virtue.
    It uses text editors, GUI versus terminal applications, and Linux desktop configuration
    culture as examples, drawing on 15 years of the author's own editor use.
  why: >-
    It frames a recurring developer-tooling debate (defaults and discoverability versus configurability)
    from a language and tool author, relevant to how editors, terminals, and CLIs are designed.
  comments: >-
    HN commenters push back on the framing. Several ask what a genuinely "invisible" tool
    would be beyond a text editor, and others dispute the vim-versus-Sublime comparison, arguing
    that visibility is a function of familiarity rather than an inherent property of the tool.
  sources:
  - label: gingerbill.org
    url: https://www.gingerbill.org/article/2026/07/10/good-tools-are-invisible/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48858121
- title: Write code like a human will maintain it
  section: Engineering posts
  category: Engineering post
  blurb: >-
    Code quality matters more, not less, when LLMs write it, because poor code trains models
    to repeat shortcuts in future requests.
  summary: >-
    The post argues that code-quality discipline matters more, not less, when a large language
    model writes the code. Its claim is that LLMs reproduce the patterns already present in
    a codebase, so merging duplicated or poorly structured AI-generated code trains the assistant
    to repeat those shortcuts on later requests, compounding the problem. The author recommends
    holding AI-written code to the same review standard as human-written code rather than
    assuming a future tool will clean it up.
  why: >-
    It connects the AI-assisted-rewrite theme running through the week (Bun and pgrust) to
    day-to-day review discipline, arguing code quality feeds back into future agent output.
  comments: >-
    HN commenters note the author could extend an agentic code-review prompt to catch the
    duplication described. Others argue that thorough review of AI output erodes the speed
    advantage, while some report shipping more features by accepting that tradeoff.
  sources:
  - label: unstack.io
    url: https://unstack.io/write-code-like-a-human-will-maintain-it
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48859701
- title: >-
