stories:
- title: Chat Control 1.0 scanning derogation survives EU Parliament vote
  section: Top stories
  category: Security
  blurb: >-
    European Parliament voted to extend voluntary message scanning on non-encrypted services
    until 2028 after narrowly failing to reject it.
  summary: >-
    On 2026-07-09 the European Parliament voted on the extension of the interim derogation
    (Regulation 2021/1232, called "Chat Control 1.0") that permits providers to voluntarily
    scan communications for child sexual abuse material. The vote ran under the ordinary legislative
    procedure second reading, where an absolute majority of at least 361 MEPs is required
    to reject or amend the text. Reporting states 314 MEPs voted to reject, 47 short of that
    threshold, so the derogation proceeds and runs until 2028-04-03. The derogation covers
    voluntary scanning on services that are not end-to-end encrypted (reported to include
    Gmail, Facebook Messenger, Instagram DMs, Skype, Snapchat, iCloud Mail, and Xbox) and
    does not mandate breaking end-to-end encryption.
  why: >-
    The legal basis for server-side CSAM scanning across major EU email and messaging platforms
    continues for nearly two more years, and the procedural route sets a precedent for the
    contested mandatory-scanning proposal.
  followup: >-
    Watch the Council and Parliament negotiations on the mandatory CSA Regulation ("Chat Control
    2.0") and any provider changes to scanning or encryption defaults under the extended derogation.
  comments: >-
    HN commenters focus on the procedure, noting the reversed burden of proof under the urgency
    route meant a measure most voting MEPs opposed still passed. Several draw the line between
    this voluntary derogation and the separate proposed CSA Regulation ("Chat Control 2.0"),
    which would mandate client-side scanning and is still under negotiation.
  sources:
  - label: Euronews
    url: https://www.euronews.com/my-europe/2026/07/07/eu-to-extend-temporary-message-scanning-regime-to-detect-child-sexual-abuse-online
  - label: Patrick Breyer (advocacy)
    url: https://www.patrick-breyer.de/en/eu-parliament-greenlights-chat-control-1-0-breyer-our-children-lose-out/
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48843923
- title: Meta ships Muse Spark 1.1 and opens the Meta Model API in public preview
  section: Top stories
  category: AI
  blurb: >-
    Meta released Muse Spark 1.1, a multimodal agentic model with 1 million token context
    and API pricing that undercuts Grok 4.5.
  summary: >-
    Meta Superintelligence Labs released Muse Spark 1.1 on 2026-07-09, a multimodal model
    aimed at agentic work: multi-agent orchestration with a 1 million token context and parallel
    subagent delegation, computer use, coding tasks (bug diagnosis, feature work, large migrations),
    and image, video, and audio input. Meta launched a public preview of the Meta Model API
    for developer access, with the model also available in "Thinking" mode in the Meta AI
    app and at meta.ai. Listed API pricing is 1.25 USD per 1M input tokens, 4.25 USD per 1M
    output tokens, and 0.15 USD per 1M cached input tokens. The announcement gives comparative
    claims but publishes no benchmark numbers.
  why: >-
    A major lab adds another agentic model and a priced public API to the model market, one
    week after reporting that Meta's own agentic development had stalled.
  followup: >-
    Watch for published benchmarks, open-weight or license terms, and independent evaluation
    of the subagent and computer-use behavior.
  comments: >-
    HN commenters note the pricing undercuts Grok 4.5, especially the cached-input rate, and
    frame the launch as Meta re-entering the frontier agentic race while conceding it is not
    at the top.
  sources:
  - label: Meta AI blog
    url: https://ai.meta.com/blog/introducing-muse-spark-meta-model-api/
  - label: Meta Model API pricing
    url: https://dev.meta.ai/docs/getting-started/pricing-rate-limits
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48846184
- title: Tencent releases Hy3, a 295B open Mixture-of-Experts model
  section: Top stories
  category: AI
  blurb: >-
    Tencent released Hy3, an Apache 2.0 open-weight mixture-of-experts model with 295B parameters
    and 21B active per token.
  summary: >-
    Tencent Hunyuan released Hy3 on 2026-07-06 under Apache 2.0, a Mixture-of-Experts model
    with 295B total parameters and about 21B active per token and a 256K context window, positioned
    for agentic and long-context coding work. Tencent states the release follows a late-April
    preview and feedback from more than 50 internal product teams, and reports it rivals open
    models with 2 to 5 times the parameter count. Weights are on Hugging Face and ModelScope,
    and the model is free on OpenRouter until 2026-07-21.
  why: >-
    Another Apache-2.0 open-weight model with a low active-parameter cost adds pressure on
    both closed frontier pricing and larger open models.
  followup: >-
    Watch for independent benchmarks against GLM 5.2 and DeepSeek-V4, and local-inference
    reports at the 21B active size.
  comments: >-
    HN commenters report the model performs well for its size, placing it near Sonnet 5 on
    some tasks and calling it a plausible local-inference option given the small active-parameter
    count. Some rank it below GLM 5.2 and GPT-5.5.
  sources:
  - label: Tencent announcement
    url: https://www.tencent.com/en-us/articles/2202386.html
  - label: Hugging Face weights
    url: https://huggingface.co/tencent/Hy3
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48847552
- title: pgrust reimplements PostgreSQL in Rust and passes the regression suite
  section: Top stories
  category: Languages
  blurb: >-
    A Rust reimplementation of PostgreSQL passes the full regression suite and boots from
    existing data directories but is not production-ready.
  summary: >-
    pgrust (by GitHub user malisper) is a from-scratch reimplementation of PostgreSQL in Rust
    targeting compatibility with Postgres 18.3. The README states it passes 100% of the Postgres
    regression suite (more than 46,000 regression queries), is disk-compatible with existing
    Postgres 18.3 data directories, and can boot from an existing installation. The README
    also states it is not production-ready and not performance-optimized, that PL/Python,
    PL/Perl, and PL/Tcl are not generally compatible yet, and that the project used AI-assisted
    programming for deeper server changes. License is AGPL-3.0.
  why: >-
    It extends the memory-safe-rewrite pattern (after the Bun Zig-to-Rust port) into database
    internals and tests how much a passing regression suite proves about a system whose value
    is durability.
  followup: >-
    Watch for performance numbers, extension compatibility progress, and whether the project
    reaches a production-usable milestone.
  comments: >-
    HN commenters draw a line between a rewrite and an AI-assisted rewrite, and argue that
    a database earns reliability from production exposure rather than passing the test suite.
    Several question the AGPL-3.0 choice for a Postgres-compatible server.
  sources:
  - label: pgrust repository
    url: https://github.com/malisper/pgrust
  - label: HN discussion
    url: https://news.ycombinator.com/item?id=48841676
