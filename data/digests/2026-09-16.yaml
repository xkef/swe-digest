stories:
- title: >-
    AWS says data hosted exclusively in its Bahrain region and one UAE zone cannot be restored
  section: Top stories
  category: Outage
  status: confirmed
  blurb: >-
    AWS told customers that data hosted exclusively in its Bahrain region and one UAE availability
    zone cannot be restored.
  summary: >-
    CNBC reports that AWS told customers the resources and data hosted exclusively in the
    Bahrain region and in one UAE availability zone cannot be restored, quoting the AWS Health
    Dashboard wording. AWS continues to work on restoring the two other affected UAE availability
    zones. The report states AWS promised further updates on UAE in the coming months and
    on Bahrain in early 2027.
  why: >-
    A hyperscaler has now told customers that single-region data is permanently gone, which
    converts cross-region backup from a recommended practice into a demonstrated requirement.
  followup: >-
    Track the promised AWS updates on UAE in the coming months and on Bahrain in early 2027.
  sources:
  - label: primary
    url: https://www.cnbc.com/2026/09/15/aws-cant-restore-service-to-bahrain-uae-6-months-after-iran-strikes.html
  - label: discussion
    url: https://news.ycombinator.com/item?id=49719249
- title: >-
    Two OpenAI Codex sandbox escapes disclosed, extending a run of coding-agent sandbox breaks
  section: Top stories
  category: Security
  status: confirmed
  blurb: >-
    Accomplish disclosed two Codex sandbox escapes, reported to OpenAI on 2026-08-12 and fixed
    within eight days.
  summary: >-
    Accomplish, a vendor selling VM-isolated agent environments, describes two escapes from
    the OpenAI Codex sandbox and states both were reported to OpenAI on 2026-08-12 and fixed
    within eight days. Overpatch abuses apply_patch granting write access to the parent directory
    of every path in a patch, so naming /tmp widens the grant to the filesystem root and a
    symlinked write reaches .zshrc with no approval prompt. Heapjack recovers the trusted-context
    token from a V8 heap snapshot inside the node_repl tool that Codex Desktop writes into
    the global config with no opt-out, then forges requests on the stdout pipe shared by both
    contexts to reach unsandboxed execution from read-only mode. The post names no affected
    and no fixed version for Codex CLI or Codex Desktop, so the versions are not known from
    this source.
  why: >-
    The same vendor published a Claude Code escape on 2026-09-11, fixed in Claude Code 2.1.247,
    and a Cursor CLI escape on 2026-09-12, so opening an untrusted repository under a sandboxed
    agent has now failed on three harnesses where the enforcement ran inside the process it
    was enforcing.
  followup: >-
    Track whether any vendor moves agent sandboxing outside the agent process rather than
    patching individual escapes.
  sources:
  - label: primary
    url: https://accomplish.ai/blog/escaping-the-openai-codex-sandbox-twice/
  - label: Claude Code escape
    url: https://accomplish.ai/blog/beltdown-escaping-the-claude-code-sandbox/
  - label: Cursor CLI escape
    url: https://www.accomplish.ai/blog/beltdown2-escaping-the-cursor-cli-sandbox/
- title: >-
    Apple Reference Image signs photos at the sensor and develops them in Private Cloud Compute
  section: Top stories
  category: Apple
  status: confirmed
  blurb: >-
    Apple Reference Image signs captures inside the sensor on iPhone 18 Pro and 18 Pro Max,
    developing them in Private Cloud Compute.
  summary: >-
    Apple described Reference Image as an opt-in capture mode debuting on the main camera
    sensor of iPhone 18 Pro and iPhone 18 Pro Max, relying on custom-designed sensors in those
    two models rather than on the platform as a whole. The sensor signs the capture and Private
    Cloud Compute develops the raw image. The final file carries a composite post-quantum
    signature combining RSA-3072 and ML-DSA-87, and the design supports revoking a sensor,
    meaning every photo from it, and revoking individual photos.
  why: >-
    It moves image provenance from post-capture metadata, which C2PA relies on, to a hardware
    root of trust.
  sources:
  - label: primary
    url: https://security.apple.com/blog/apple-reference-image/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49721322
- title: >-
    Two developers built a clean-room Linux GPU driver for the M4 Mac Mini in about a month
    using coding agents
  section: Top stories
  category: Linux/Kernel
  status: confirmed
  blurb: >-
    Two developers used coding agents to build a clean-room Linux GPU driver for the M4 Mac
    Mini in about a month.
  summary: >-
    Cody Ho and Niklas Sheth report a conformant OpenGL ES 3.0 driver for the AGX GPU on the
    M4 Mac Mini and MacBook Neo, spanning a reverse-engineered firmware ABI, a Linux kernel
    driver written in Rust, a custom shader compiler and Mesa integration. They state the
    work was clean room, using traces from their own hypervisor and shaders they wrote rather
    than Apple binaries, and that Codex and Claude produced most of the code. They put the
    A18 Pro firmware ABI at roughly 1.5 times the structs and twice the pointers of the M1
    ABI.
  why: >-
    Reverse engineering a firmware ABI against hardware traces is the kind of slow, rote work
    where agents compound over a long run.
  followup: >-
    Nothing is upstream and the authors state the code is not ready for end users, so track
    whether their kernel driver lands after the M1 and M2 drivers.
  sources:
  - label: primary
    url: https://codyho.dev/blog/gpu-driver/
  - label: discussion
    url: https://news.ycombinator.com/item?id=49717638
  - label: further discussion
    url: https://news.ycombinator.com/item?id=49720125
