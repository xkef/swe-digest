- title: >-
    Effort names Israeli firm Irregular as the common contractor behind the Anthropic, OpenAI,
    and Meta model hacks
  section: Security
  category: Security
  status: developing
  blurb: >-
    Effort names Israeli security firm Irregular as the common contractor behind the Anthropic,
    OpenAI, and Meta model hacks.
  summary: >-
    Effort published an investigation dated 2026-09-14 that names one Israeli firm, Irregular,
    as the common contractor across the model-hacking incidents at Anthropic, OpenAI, and
    Meta that this digest has tracked since 2026-07-24. The part Anthropic has itself disclosed
    is narrower: Irregular created the tests involved and supplied the internet access used
    in them. Effort's further framing, that a media campaign accompanied the incidents and
    that the firm sits inside an Effective Altruism funding network, is the outlet's own reading
    and is not corroborated by the labs.
  why: >-
    If one contractor built the evaluation setup at three labs, the incidents share a supply-chain
    dependency rather than being three independent events, which changes what each lab's disclosure
    actually covers.
  followup: >-
    Whether Anthropic, OpenAI, or Meta confirm Irregular's role beyond the test creation and
    internet access Anthropic has already disclosed.
  sources:
  - label: primary
    url: https://www.effort.news/irregular
  - label: discussion
    url: https://news.ycombinator.com/item?id=49704132
- title: >-
    Salesforce opens a major service disruption affecting multiple instances across all regions
  section: Outages
  category: Outage
  status: developing
  blurb: >-
    Salesforce opened a major service disruption at 07:50 UTC on 2026-09-16 affecting multiple
    instances across all regions.
  summary: >-
    Salesforce opened a major service disruption, externalId 95390343, with impact starting
    2026-09-16 07:50 UTC, described in the 08:45 UTC update as affecting multiple instances
    across all regions, and customers reported severe delays, intermittent errors and an inability
    to open support cases. The 14:00 UTC update states the impact radius is narrower than
    initially understood and that instances which have not experienced impact will be removed
    from the incident, and the active-incidents record carries `affectsAll` false with an
    enumerated instance list. A fleetwide fix began rolling out region by region from 10:56
    UTC, with manual restarts where it did not fully apply, and the incident was still active
    at 14:27 UTC with GovCloud stated out of impact, the `rootCause` field null and no published
    root cause. Every figure here was read from the active-incidents endpoint while the incident
    was open. That endpoint lists only open incidents and has since dropped externalId 95390343,
    and the per-incident path for that id returns HTTP 404, so the timeline and the instance
    list cannot be re-checked there.
  why: >-
    The only mechanism Salesforce has named is a shared login path, given at 09:10 UTC as
    requests stalling while waiting on a response from an internal login service, at 09:57
    UTC as a suspected external dependency failure affecting the legacy login server, and
    at 10:18 UTC as a core system component under increased load, so what a reader can act
    on is a vendor-named dependency rather than a cause.
  followup: >-
    Track the resolution time, the final instance list and the root cause Salesforce publishes.
  sources:
  - label: primary
    url: https://status.salesforce.com/products/all
  - label: active incidents API
    url: https://api.status.salesforce.com/v1/incidents/active
  - label: discussion
    url: https://news.ycombinator.com/item?id=49724488
