- title: Audit finds SWE-bench can no longer separate its top coding agents
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    An audit of 254 SWE-bench submissions finds paired tests separate none of the 29 adjacent
    pairs in the Verified top thirty.
  summary: >-
    The paper, whose arXiv comments field states it is the camera-ready version accepted at
    ADMA 2026, the International Conference on Advanced Data Mining and Applications, in its
    Special Session on Responsible Data Intelligence, audits 254 SWE-bench submissions across
    four splits without rerunning any model. On Verified the leading two entries each resolve
    396 of 500 instances, the top ten share 285 successes and 51 failures, and only 164 instances
    distinguish their outcomes at all. Exact paired McNemar tests separate none of the 29
    adjacent pairs in the Verified top thirty at alpha 0.05, while the larger Test split separates
    14 of 23, and observed within-model scaffold ranges reach 29.8 percentage points against
    an 8.8-point spread across the entire top thirty.
  why: >-
    Picking a coding agent on a one-point leaderboard gap is not supported by the published
    verdicts, because the harness moves the score more than the model does.
  followup: >-
    Track whether anyone outside the author group adopts the released partition and five-step
    audit protocol when reporting a SWE-bench result.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2609.17394v1
- title: OPEN-1B claims a bitwise reproducible distributed training run
  section: ML research
  category: Paper
  status: developing
  blurb: >-
    Researchers release OPEN-1B and claim any single step of its distributed training run
    replays bitwise on one machine.
  summary: >-
    The authors fix an order on the three sources of training nondeterminism, namely GPU kernel
    reductions, batch ordering across a data-parallel cluster, and inter-node and intra-node
    collective communication, so any single step of a large distributed run can be replayed
    on one commodity machine and checked bitwise against the published trajectory. Because
    replaying a whole run on one machine is infeasible, they propose collective verification
    in which independent auditors each certify individual steps. They release Open-1B with
    its full pretraining dataset, every intermediate checkpoint, the training code and the
    audit harness.
  why: >-
    Published weights and recipes do not prove a checkpoint came from the declared recipe,
    which is the gap that leaves room for undisclosed data or a backdoor, and bitwise step
    replay is a check a third party can run on one machine.
  followup: >-
    The preprint is not peer reviewed and the reproducibility claim has not been independently
    exercised, so track a third-party replay of a published step.
  sources:
  - label: primary
    url: https://arxiv.org/abs/2609.17380v1
- title: nginx patches an HTTP/3 buffer overflow in 1.31.6 mainline and 1.30.5 stable
  section: Security
  category: Security
  status: confirmed
  blurb: >-
    nginx 1.31.6 mainline and 1.30.5 stable fix CVE-2026-90439, a buffer overflow in ngx_http_v3_module,
    rated medium.
  summary: >-
    The nginx security advisories page lists CVE-2026-90439, a buffer overflow in ngx_http_v3_module
    that the project rates medium. Versions 1.29.2 through 1.31.5 are listed as vulnerable,
    and 1.31.6 mainline and 1.30.5 stable as not vulnerable. The advisory is silent on exploitation
    and carries no proof of concept.
  why: >-
    Exposure is limited to builds that include and serve HTTP/3, which is not the default,
    so the practical check is whether a deployment compiled and enabled that module.
