- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0045
  kind: fact
  last_seen: '2026-08-09'
  note: >-
    `www.reddit.com` / `old.reddit.com` - RSS feeds (`/hot/.rss`, `/top/.rss?t=day`) are heavily rate-limited
    from datacenter IP ranges. GitHub Actions runners get HTTP 429 after the first few subreddits even
    at 7s spacing, and sustained host-level blocks occurred on 2026-06-18 and across 2026-06-24..2026-06-30.
    `make reddit` spaces requests 7s apart, rotates the starting subreddit each six-hour window, keeps
    partial results marked degraded, and the snapshots workflow accumulates them in snapshots/reddit by
    post id. Prefer the committed snapshot when live coverage is degraded and state the coverage in Sources
    checked. Each additional spaced fetch across the UTC day keeps adding coverage: on 2026-07-25 three
    successive fetches lifted the day from 14 to 20 of 28 subreddits, so run a second and third fetch
    even when the first was 429ed. Full live coverage usually needs a residential network. A 2026-07-21
    report (cole-k.com, HN 49005747) states logged-out old.reddit.com browsing now requires login; the
    RSS feeds still returned data on 2026-07-25, so watch for further degradation. Compacted from a per-day
    log to keep the store under its byte bound.
  subject: ''
