- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0008
  kind: fact
  last_seen: '2026-06-29'
  note: >-
    HN via WebSearch alone is not acceptable coverage. The 2026-06-11 run used the WebSearch fallback
    and missed Homebrew 6.0.0, a 600+ point front page release announcement. Use `make hn`, which walks
    Algolia, Firebase, front page HTML, community mirrors, and hnrss in order and exits nonzero on degraded
    coverage.
  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0009
  kind: fact
  last_seen: '2026-06-29'
  note: >-
    the community mirrors `api.hackerwebapp.com` and `api.hnpwa.com` also returned 403 from the unattended
    harness, so all six fetcher backends are blocked there. An hn-probe workflow run (2026-06-12 08:30
    UTC) got 200 from all five probed HN endpoints on GitHub Actions runners, so the block does not cover
    Actions egress. Fallback order for unattended runs: committed HN snapshot from the scheduled Actions
    fetch, then WebSearch supplementation with the degradation stated in Sources checked.
  subject: '2026-06-12'
