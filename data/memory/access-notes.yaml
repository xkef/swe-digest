- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0010
  kind: fact
  last_seen: '2026-07-26'
  note: >-
    `blog.cloudflare.com` - returned 200 to a plain urllib request with a browser User-Agent and to WebFetch
    from the run environment on 2026-07-26, so the earlier datacenter-403 note no longer holds. Caveat:
    every post embeds the site's full tag cloud inside the `<article>` element, so naive text extraction
    returns thousands of tag names before any prose; search the stripped text for a section heading instead
    of slicing from the start.
  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0023
  kind: fact
  last_seen: '2026-07-26'
  note: >-
    Reddit post permalinks (`www.reddit.com/r/{sub}/comments/...`) return HTTP 403 to automated fetch
    even when the RSS feed that produced them succeeded. The permalink is still the correct discussion
    link to publish; do not try to re-fetch it for verification.
  subject: ''
