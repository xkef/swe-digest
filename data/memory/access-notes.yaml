- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0018
  kind: fact
  last_seen: '2026-07-25'
  note: >-
    `radicle.network` and `app.radicle.xyz` - the Radicle Explorer is a single-page app, so a repository
    URL returns only the shell HTML and no repository content to any automated fetch. The seed node's
    HTTP API at `https://{node}/api/v1/repos/{rid}` is the readable route, but it answers only for repositories
    that node actually hosts (404 otherwise). A Radicle repository claim cannot be verified from the Explorer
    URL alone; resolve the node named in the Explorer path and query that node's API instead. Confirmed
    2026-07-25: `https://rosa.radicle.network/api/v1/repos/{rid}` returned 200 with name, description,
    delegates and their aliases, and the seeding-node count, after `seed.radicle.xyz` had 404'd for the
    same rid. Delegate aliases are self-declared, so they do not by themselves establish who publishes
    a repository.
  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0019
  kind: fact
  last_seen: '2026-07-26'
  note: >-
    `lore.kernel.org` - kernel mailing-list archives sit behind an Anubis proof-of-work gate; any automated
    fetch gets the challenge page and no message text. A kernel-list thread therefore cannot be cited
    directly from this environment; take the quoted content from a secondary write-up (Phoronix, LWN)
    and say so. Verified 2026-07-26.
  subject: ''
