  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0044
  kind: fact
  last_seen: '2026-08-02'
  note: >-
    HN endpoints from the run environment: `hn.algolia.com` (returns full structured data with objectID,
    points, num_comments, created_at), `hacker-news.firebaseio.com`, and `news.ycombinator.com` front
    page and item pages all return 200 locally. Use them directly when local. `hnrss.org` returns 403
    from datacenter IP ranges. Merged from four bullets to keep the store under its entry bound.
  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0045
  kind: fact
  last_seen: '2026-08-09'
  note: >-
    `www.reddit.com` / `old.reddit.com` - RSS feeds (`/hot/.rss`, `/top/.rss?t=day`) are heavily rate-limited
    from datacenter IP ranges. GitHub Actions runners get HTTP 429 after the first few subreddits even
    at 7s spacing, and sustained host-level blocks occurred on 2026-06-18 and across 2026-06-24..2026-06-30.
    `make reddit` spaces requests 7s apart, rotates the starting subreddit each six-hour window, keeps
    partial results marked degraded, and the snapshots workflow accumulates them in snapshots/reddit by
    post id. Prefer the committed snapshot when live coverage is degraded and state the coverage in Sources
    checked. Each additional spaced fetch across the UTC day keeps adding coverage: on 2026-07-25 three
    successive fetches lifted the day from 14 to 20 of 28 subreddits, so run a second and third fetch
    even when the first was 429ed. Full live coverage usually needs a residential network. A 2026-07-21
    report (cole-k.com, HN 49005747) states logged-out old.reddit.com browsing now requires login; the
    RSS feeds still returned data on 2026-07-25, so watch for further degradation. Compacted from a per-day
    log to keep the store under its byte bound.
  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0047
  kind: fact
  last_seen: '2026-08-23'
  note: >-
    Hosts returning 403 or needing a fallback from the datacenter IP range, all last confirmed 2026-06-29.
    `www.cloudflare.com` path pages such as /agents-week/updates/ 403; `blog.cloudflare.com` is a separate
    host and returned 200 on 2026-07-26. `techcrunch.com` needs cross-referencing against a primary source
    when remote. `www.securityweek.com` is discovery only when remote, confirm from vendor advisories.
    `blog.rust-lang.org` is 403/404 early after a release, so prefer the rust-lang/rust GitHub release
    object, then releases.rs and WebSearch. `blog.checkpoint.com` 403, use support.checkpoint.com sk advisory
    pages as primary. Merged from five bullets to keep the store under its entry bound.
  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0049
  kind: fact
  last_seen: '2026-08-23'
  note: >-
    HN coverage from the unattended harness, confirmed 2026-06-29. All six fetcher backends 403 there,
    including the community mirrors `api.hackerwebapp.com` and `api.hnpwa.com`. An hn-probe run on 2026-06-12
    got 200 from all five probed endpoints on GitHub Actions runners, so the block does not cover Actions
    egress. Use `make hn`, which walks Algolia, Firebase, front page HTML, community mirrors, and hnrss
    in order and exits nonzero on degraded coverage. Fallback order for unattended runs: the committed
    HN snapshot from the scheduled Actions fetch, then WebSearch supplementation with the degradation
    stated in Sources checked. WebSearch alone is not acceptable coverage: the 2026-06-11 run used it
    and missed Homebrew 6.0.0, a 600+ point front page release announcement. Merged from two bullets to
    keep the store under its entry bound.
  subject: ''
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0030
  kind: fact
  last_seen: '2026-09-13'
  note: >-
    Outlets that block automated fetch from the run environment, each with its route. `www.reuters.com`
    returns 401 and WebFetch is refused, so link the canonical Reuters URL alongside an outlet that cites
    it (Engadget, Fortune, AP) and state which was actually read (confirmed 2026-07-26). `www.bloomberg.com`
    403; Fortune carries the wire story in full and is the readable route (2026-07-26). `www.wired.com`,
    `apnews.com`, and `arstechnica.com` refuse WebFetch, so use WebSearch summaries plus a corroborating
    outlet and confirm the canonical URL (2026-07-22 to 2026-07-25). `www.cnbc.com` 403 on article bodies;
    corroborate with another outlet or the primary filing (2026-07-11). `www.theregister.com` 403/404
    on article bodies, but WebSearch summaries carry named officials and figures; link the canonical `/software/YYYY/MM/DD/`
    URL (2026-06-29). `thehackernews.com` 403; WebSearch snippets only, confirm CVEs from vendor advisories
    (2026-06-11). Merged from seven bullets plus the access half of a source-reliability bullet to keep
    the store under its entry bound.
  subject: News and security outlets that refuse automated fetch
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0011
  kind: fact
  last_seen: '2026-09-27'
  note: >-
    These refuse the harness WebFetch tool but return 200 to a plain urllib request with a browser User-Agent
    from the same run environment, so prefer the direct fetch over WebSearch snippets. `www.theguardian.com`
    (2026-07-25). `www.bleepingcomputer.com`, which returns the full article body this way; still confirm
    CVE ids and patched versions from the vendor advisory (2026-07-25). `openjdk.org/jeps/` JEP pages
    (2026-07-25). `www.phoronix.com`, both the `rss.php` feed and article pages, with two caveats: a Linux/X11
    User-Agent worked where a macOS one returned an empty body, and the article text sits inside no single
    container element, so strip tags across the whole page and search for the headline string (2026-07-26).
    `azure.status.microsoft/en-us/status/history/` uses the same route and is recorded in source-reliability
    with its Post Incident Review detail. Merged from four bullets to keep the store under its entry bound.
  subject: Hosts that refuse WebFetch but answer a plain urllib request
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0012
  kind: fact
  last_seen: '2026-09-27'
  note: >-
    Each returns a response but no readable content, so cite them only through a secondary source or a
    different route. `lore.kernel.org` sits behind an Anubis proof-of-work gate and returns the challenge
    page, so a kernel-list thread cannot be cited directly from this environment; take the quoted content
    from Phoronix or LWN and say so (2026-07-26). `issuetracker.google.com/issues/{id}` returns 200 to
    plain urllib with a browser User-Agent but the body is JS-rendered, so treat it as a link that resolves
    and take the thread content from a secondary write-up (2026-07-25). `www.youtube.com/watch` returns
    only the page footer and legal navigation to WebFetch, never title, channel, date, view count, or
    description, so use the `make yt` snapshot for watchlist channels and otherwise the HN or Reddit submission
    plus the project or event page (2026-07-25). `radicle.network` and `app.radicle.xyz` are a single-page
    app returning only shell HTML; the readable route is the seed node named in the Explorer path, at
    `https://{node}/api/v1/repos/{rid}`, which answers only for repositories that node actually hosts,
    and delegate aliases there are self-declared so they do not establish who publishes a repository (2026-07-25).
    Merged from four bullets to keep the store under its entry bound.
  subject: Pages that resolve but yield no usable text to automated fetch
- group: Datacenter-IP 403 blocks and fallbacks
  id: an-0013
  kind: fact
  last_seen: '2026-09-27'
  note: >-
    Use WebSearch snippets and confirm from a primary advisory. Confirmed 2026-06-29: `www.zerodayinitiative.com`
    (confirm from MSRC), `blog.talosintelligence.com`, `www.cloudflarestatus.com`, `status.cloud.google.com`
    (WebSearch with a site:cloud.google.com filter), `msrc.microsoft.com` (support.microsoft.com KB pages
    are accessible instead), `developer.chrome.com`, `sec.cloudapps.cisco.com`, `www.cisa.gov/news-events/alerts/`
    (fall back to the KEV JSON at cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json,
    which may be CDN-fronted; issue #8), `forums.developer.nvidia.com` (use developer.nvidia.com/blog
    and nvidianews.nvidia.com instead; issue #9). Confirmed 2026-07-25: `careersatdoordash.com/blog/`
    and `ndctoronto.com/agenda/`, where a DoorDash engineering post and an NDC Toronto session page could
    not be verified and were not published. For the two Statuspage-backed hosts prefer the `/api/v2/incidents.json`
    endpoint recorded in source-reliability, verified working for Cloudflare on 2026-07-25. Merged from
    ten bullets to keep the store under its entry bound.
  subject: Hosts returning 403 to automated fetch, with fallbacks
