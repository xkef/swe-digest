- group: Notes / Reliable primary sources
  id: sr-0019
  kind: fact
  last_seen: '2026-09-27'
  note: >-
    Each fetched 200 on the date given. `sourceware.org/pipermail/libc-announce/` for glibc releases and
    security advisories: the per-message page carries the full NEWS text with features, compatibility
    breaks, and the fixed CVE list, and the `date.html` index finds the newest message number (2026-07-26).
    `lists.freebsd.org/archives/freebsd-announce/` for FreeBSD announcements, with commit hashes and required
    user actions; `freebsd.org/news/` carries only a short status page (2026-07-25). `ir.amd.com/news-events/press-releases/detail/`
    for AMD announcements, with specifications, named partners, and dated commitments; slugs are not guessable,
    so list them from `ir.amd.com/news-events/press-releases` first, `amd.com/en/newsroom/press-releases/`
    slugs 404, and per-product pages under `amd.com/en/products/accelerators/` carry a specification table
    and launch date (2026-07-25). `nixos.org/blog/announcements/` for NixOS releases: X.05 and X.11 numbering
    means May and November of that year, so a release can resurface on HN weeks later; check the published
    date against the announcement (2026-07-01). `gcc.gnu.org/gcc-14/` and `gcc.gnu.org/releases.html`
    for GCC release dates and bug-fix-versus-feature classification; guessed pipermail URLs 404, so use
    the releases pages (2026-06-27). `www.linuxfoundation.org/press/` for Linux Foundation press releases;
    resolve the full slug via search first, since short slugs 404 (2026-06-27). Merged from six bullets
    to keep the store under its entry bound.
  subject: Release and announcement archives confirmed primary
- group: Notes / Reliable primary sources
  id: sr-0020
  kind: fact
  last_seen: '2026-09-27'
  note: >-
    Each verified on the date given. Statuspage and its clones expose `/{host}/api/v2/incidents.json`
    with full per-update bodies and timestamps, and that endpoint is the reliable read, while the rendered
    `/history` page returns navigation only and yields no incidents; verified across GitHub, npm, OpenAI,
    Anthropic, Cloudflare, Vercel, Netlify, Datadog, Sentry, Discord, PyPI, and Twilio, with Okta returning
    401, Stripe and Docker Hub 404, and Fastly unparseable data, so those four need their own routes (2026-07-25).
    `health.aws.amazon.com/public/currentevents` is the AWS Health Dashboard event JSON, UTF-16 encoded
    so decode accordingly, carrying full per-event update logs including the published root cause (2026-07-25).
    `azure.status.microsoft/en-us/status/history/` returns 200 to a plain urllib request with a browser
    User-Agent and carries the full text of each Preliminary and Final Post Incident Review, with tracking
    id, impact window, affected services, root cause, and a timestamped response timeline, unlike `msrc.microsoft.com`
    which 403s (2026-07-25). `letsencrypt.status.io` is primary for ACME API incident timelines, with
    incident timestamps and root-cause notes (2026-06-19). `status.openai.com/history` is recorded in
    access-notes. Merged from four bullets to keep the store under its entry bound.
  subject: Status-page and incident routes confirmed primary
- group: Notes / Secondary/aggregation sources
  id: sr-0021
  kind: fact
  last_seen: '2026-10-04'
  note: >-
    `api.hackerwebapp.com` (node-hnapi) and `api.hnpwa.com` are community JSON mirrors of Hacker News.
    Discovery only: link canonical news.ycombinator.com URLs, never a mirror URL. hackerwebapp carries
    fresh points and comment counts. hnpwa is CDN-cached with lagging points, so treat it as last resort
    and do not publish a points figure taken from it. Rewritten to drop the access half, which duplicated
    the HN fetch-route notes in access-notes, per this store's rule that it holds durable source judgment
    and not environment state.
  subject: HN community JSON mirrors (hackerwebapp, hnpwa)
