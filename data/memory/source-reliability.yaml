  subject: ''
- group: Notes / Reliable primary sources
  id: sr-0052
  kind: fact
  last_seen: '2026-07-26'
  note: >-
    GitHub Security Advisories via `gh api graphql` (`securityAdvisories` / `securityAdvisory(ghsaId:)`)
    - returns the full advisory description, severity, identifiers, affected package ranges, and first
    patched version without any web fetch, and is the fastest way to sweep a day of ecosystem advisories.
    Used 2026-07-26 for the etcd Watch bypass, the Oh My Posh template injection, and the sm-crypto RNG
    defect. Note that many advisories carry no CVE id and a zero CVSS score, so do not treat a missing
    CVE as a missing advisory.
  subject: ''
