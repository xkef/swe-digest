- group: ''
  id: sr-0001
  kind: guidance
  last_seen: ''
  note: >-
    Durable judgments about source quality over time: which sources are primary and trustworthy, which
    are promotional, and which need confirmation. Volatile environment state (datacenter-IP 403 blocks
    and per-host fallbacks) lives in [access-notes.md](access-notes.md), not here. Every entry carries
    a `Last seen` date recording when the judgment was last confirmed in practice.
  subject: ''
- group: Rules
  id: sr-0002
  kind: guidance
  last_seen: ''
  note: >-
    Primary release notes and incident reports are preferred, but still checked for omissions. Vendor
    blogs can be technically strong or promotional, so judge each post by its detail. Hacker News is useful
    for discovery, corrections, dissent, and links to primary material. Reddit is useful for adoption
    pain, repeated failures, and hype detection. YouTube is useful when a maintainer, implementer, or
    expert adds technical context not present in writing. Market reporting needs confirmation from official
    filings, company newsrooms, or multiple reputable outlets.
  subject: ''
- group: Notes
  id: sr-0003
  kind: guidance
  last_seen: ''
  note: Environment-specific 403 blocks and fallbacks have moved to [access-notes.md](access-notes.md).
  subject: ''
