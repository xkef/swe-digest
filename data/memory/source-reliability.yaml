- group: Notes / Secondary/aggregation sources
  id: sr-0063
  kind: fact
  last_seen: '2026-09-13'
  note: >-
    `helpnetsecurity.com` and `securityaffairs.com` carry technically accurate CVE detail and analysis.
    `labs.watchtowr.com` and `horizon3.ai/attack-research/` are reliable for exploit-chain and PoC analysis.
    `cybersecuritynews.com` and `thehackernews.com` are discovery only. All six are secondary: confirm
    CVE ids, affected versions, and first patched versions from the vendor advisory before publishing.
    Merged from six bullets, and the first four were refiled out of the Reliable primary sources group
    where they were misclassified as primary. Access state (the `thehackernews.com` 403) lives in access-notes,
    not here.
  subject: Secondary security reporting and exploit research
- group: Notes / Reliable primary sources
  id: sr-0059
  kind: fact
  last_seen: '2026-09-20'
  note: >-
    Primary advisory routes, each confirmed fetchable on 2026-06-11 and not re-verified since. `oracle.com/security-alerts`
    confirms CVEs directly. `support.checkpoint.com/results/sk/` SK advisory pages are primary, prefer
    them over the blog. `ic3.gov/PSA/` FBI IC3 PSAs are primary for threat advisories. `www.veeam.com/kb`
    is primary for patch version details. `support.sap.com/en/my-support/knowledge-base/security-notes-news/`
    carries SAP Security Patch Day pages. `www.jenkins.io/security/advisory/` is primary for CVE details
    and patched versions. `shadowserver.org` is reliable for internet-wide scan telemetry and for corroborating
    active-exploitation claims. `hub.ivanti.com/s/article/` is primary but may require authentication
    from datacenter IP ranges, so use helpnetsecurity.com and watchTowr as verified secondary sources.
    Merged from eight bullets to keep the store under its entry bound.
  subject: Vendor and agency security advisory routes
- group: Notes / Reliable primary sources
  id: sr-0060
  kind: fact
  last_seen: '2026-09-20'
  note: >-
    Primary routes for version tracking and incident timelines, each confirmed fetchable on 2026-06-11
    and not re-verified since. `go.dev/doc/devel/release` for Go release history. `kubernetes.io/releases/`
    and `kubernetes.dev/resources/release/` for Kubernetes versions. `developer.apple.com/news/releases/`
