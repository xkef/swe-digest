- group: Notes / Reliable primary sources
  id: sr-0047
  kind: fact
  last_seen: '2026-07-25'
  note: >-
    `www.microsoft.com/en-us/corporate-responsibility/topics/open-weight/` - host of the "Open Weights
    and American AI Leadership" letter and its canonical signatory list; fetched 200 with the full list
