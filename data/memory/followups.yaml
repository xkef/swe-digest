- id: f-0014
  subject: SharedRoot escapes the Claude Cowork local VM sandbox
  watch_for: >-
    A Cowork change that removes the read-write host mount or blocks unprivileged user namespaces
    in the guest; whether local execution stays available; the same chain against other VM-based
    agent sandboxes; any CVE or advisory for the Cowork side.
  opened: '2026-07-25'
  last_seen: '2026-07-25'
  closed: '2026-08-30'
  notes:
  - >-
    2026-07-25: Accomplish AI published 2026-07-23 a six-step escape from the Linux VM that
    Claude Cowork uses to sandbox agents on macOS. Chain: agent opens an unprivileged user
    namespace for in-namespace capabilities, uses `CAP_NET_ADMIN` to configure a traffic-control
    action referencing `act_pedit`, exploits CVE-2026-46331 (pedit-COW, published June 2026)
    to poison the page cache of a root-owned helper binary, gains guest root when the `coworkd`
    daemon re-executes it, reaches `/mnt/.virtiofs-root` (the host filesystem mounted read-write
    into the VM), and reads and writes host files outside the connected folder, including
    SSH keys and cloud credentials. Anthropic closed the report as informative because the
    CVE was already public; the researchers state Cowork now defaults to cloud execution where
    the local path does not appear to apply. Proposed mitigations are design-level (disable
    unprivileged userns, harden seccomp, block autoloading unused modules, narrow the host
    share). Covered 2026-07-25 Top stories (Agentic coding, confirmed). Reuses CVE-2026-46331
    from the 2026-07-23 RefluXFS/pedit-COW entry. See [[entities]] Claude Code.
- id: f-0015
  subject: Debian opens competing General Resolutions on LLM contributions
  watch_for: >-
    Further amendments or added ballot options; the close of the discussion period and the
    vote result; whether other distributions or forges follow the adopted position; how a
    disclosure requirement would be enforced in practice.
  opened: '2026-07-25'
  last_seen: '2026-07-25'
  closed: '2026-09-09'
  notes:
  - >-
    2026-07-25: The discussion period on Debian General Resolution 2026/002 opened 2026-07-24
    with two proposals. Choice 1 (proposer Matthias Geiger, seven seconds including Ian Jackson
    and David Bremner) forbids any contribution written with LLM or generative-AI assistance
    across Debian source packages, official project software, web resources, documentation
    and translations, and official communication, excluding upstream projects, AI-related
    software, and upstream patches; rationale is unclear copyright status under Debian Policy
    and the DFSG, generated packaging mixing conventions across the age of the archive, review
    burden on a shrinking volunteer pool, and scraper load that forced JS-based checks on
    Debian infrastructure. Choice 2 permits AI-assisted contributions under stated conditions:
    tooling terms compatible with Debian distribution, verified rights over third-party material
    in the output, full contributor accountability for technical merit and license compliance,
    visible disclosure such as a `Generated-By:` or `Assisted-By:` git trailer, and prior
    discussion of bulk or autonomous changes. Covered 2026-07-25 Top stories (Dev tools, developing).
    Continues the AI-authorship governance theme (Codeberg, Godot, curl, FFmpeg). See [[entities]]
    Debian.
