- id: f-0001
  subject: etcd patches a Watch API authorization bypass
  watch_for: >-
    CVE assignments for both advisories; distribution and managed-Kubernetes backports of
    3.5.33/3.6.14/3.7.1; any reported exploitation; whether the RBAC model gains range-aware
    Watch checks rather than only the point fix.
  opened: '2026-07-26'
  last_seen: '2026-07-26'
  closed: '2026-09-10'
  notes:
  - >-
    2026-07-26: etcd published two high-severity advisories 2026-07-24 for releases tagged
    2026-07-23. Watch API authorization bypass: a user with READ on one exact key can call
    Watch with an open-ended range (`clientv3.WithFromKey()`) and receive events for every
    key at or after that key. Range/Get/DeleteRange unaffected; only clusters with authentication
    enabled are affected. Second advisory: `tlsListener.acceptLoop` spawns unbounded handshake
    goroutines with no deadline. Fixed 3.5.33, 3.6.14, 3.7.1. No CVE ids in either advisory.
    Workarounds are auditing READ grants and restricting network access to the client gRPC
    port. Reporters listed as Luis Toro, Anthropic, and Adam Korczynski. Covered 2026-07-26
    Top stories (lead, Security, confirmed). See [[entities]] etcd.
- id: f-0002
  subject: Hanwha camera firmware shipped a GitHub organization admin token
  watch_for: >-
    A Hanwha statement on the exposure window and on whether the token was served to browsers
    loading the camera admin UI; whether the shared firmware decryption key is rotated; whether
    any repository in the organization was modified while the token was live.
  opened: '2026-07-26'
  last_seen: '2026-07-26'
  closed: '2026-09-10'
  notes:
  - >-
    2026-07-26: Write-up surfaced HN 2026-07-24 (629 pts). Researcher extracted Hanwha Vision
    camera firmware (inner archive AES-encrypted with a key XOR-obfuscated against a static
    table in a `fwupgrader` binary, reconstructed at runtime and shelled out to the `openssl`
    CLI, key shared across the model line) and found a GitHub token duplicated across about
    30 files, with admin privileges on hundreds of repositories in the vendor organization.
    Cause stated as the camera UI's Vite build assigning the whole `process.env` into compiled
    files, so the CI job environment (including `GITHUB_NPM_TOKEN`) landed in shipped firmware.
    Author downloaded about 500 firmware images, extracted about 62%, found the same token
    in three. Hanwha revoked the token within 12 hours of the report. DoD-assigned IP addresses
    in the dumped environment are labeled speculation by the author. Missed by the 2026-07-25
    digest and promoted to `watchlist_gap` in that day's backtest. Covered 2026-07-26 Top
    stories (Security, confirmed).
