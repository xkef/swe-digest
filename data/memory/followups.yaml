  closed: '2026-09-10'
  notes:
  - >-
    2026-07-26: Post dated 2026-07-01, last modified 2026-07-15, resurfaced HN 2026-07-26.
    Replaces the single "block AI bots" preset with per-behavior controls for Search, Agent,
    and Training, down to the Free tier, inside a wider taxonomy (Transact, Data Collection,
    Security Testing, SEO, Ads Verification, Social, Feed Fetching, Monitoring). From 2026-09-15
