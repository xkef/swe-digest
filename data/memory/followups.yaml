    The discussion period on Debian General Resolution 2026/002 opened 2026-07-24 with two proposals.
    Choice 1 (proposer Matthias Geiger, seven seconds including Ian Jackson and David Bremner) forbids
    any contribution written with LLM or generative-AI assistance across Debian source packages, official
    project software, web resources, documentation and translations, and official communication, excluding
    upstream projects, AI-related software, and upstream patches; rationale is unclear copyright status
    under Debian Policy and the DFSG, generated packaging mixing conventions across the age of the archive,
    review burden on a shrinking volunteer pool, and scraper load that forced JS-based checks on Debian
    infrastructure. Choice 2 permits AI-assisted contributions under stated conditions: tooling terms
    compatible with Debian distribution, verified rights over third-party material in the output, full
    contributor accountability for technical merit and license compliance, visible disclosure such as
    a `Generated-By:` or `Assisted-By:` git trailer, and prior discussion of bulk or autonomous changes.
    Covered 2026-07-25 Top stories (Dev tools, developing). Continues the AI-authorship governance theme
    (Codeberg, Godot, curl, FFmpeg). See [[entities]] Debian.
