  notes:
  - >-
    2026-07-15: Researcher Ayush Paul published 2026-07-09 (HN front page 2026-07-15, 360
    pts, 162 cmt) a demonstrated exfiltration of Claude.ai stored memory via the web_fetch
    tool. A page disguised as a Cloudflare CAPTCHA instructed Claude to "verify" the user
    by navigating letter by letter through attacker-controlled alphabetical links, so the
    sequence of fetched URLs spelled out private data to the attacker's server; leaked the
    user's full name, employer, and hometown, and in one case inferred the hometown from a
    hackathon name rather than a stored fact. Reported to Anthropic via HackerOne. Anthropic
    said it had already identified the issue internally, awarded no bounty, and mitigated
    it by stopping web_fetch from following links on external pages (navigation restricted
