  notes: >-
    Merged from two follow-ups sharing one watch signal. RefluXFS (CVE-2026-64600, Qualys, disclosed 2026-07-22):
    race in the XFS copy-on-write path where concurrent O_DIRECT writes to a reflinked file overwrite
    a shared page never made private; unprivileged user to root on reflink=1 volumes, default on RHEL,
    Oracle Linux, and Amazon Linux, kernels v4.11 to unpatched current, passwordless-root PoC on RHEL
    10.2. pedit-COW (CVE-2026-46331, NVD-published 2026-06-16, PoC resurfaced HN 2026-07-22): tc act_pedit
    partial copy-on-write poisons the cached /bin/su binary, kernels to 6.12.9 where unprivileged user
    namespaces are available; reused in the SharedRoot Claude Cowork sandbox escape. snap-confine (CVE-2026-8933,
    Qualys, disclosed 2026-07-21): two races during sandbox setup on Ubuntu Desktop 24.04/25.10/26.04,
    a caller-owned temporary directory plus symlink redirection of a privileged write, from a hardening
    shift from set-uid-root to set-capabilities; Canonical shipped fixed snapd, PoC in the advisory, distinct
    from CVE-2026-3888. All three landed as the kernel CVE team published 432 CVEs in two days (batch
    stable-fix assignment amid AI-assisted bug-hunt volume). Continues the Linux LPE run (GhostLock, Bad
    Epoll, Januscape). Covered 2026-07-22 and 2026-07-23 Top stories.
