    port; 1.3.14 was the last Zig release. Covered 2026-07-09 Top stories. Part of the Fable
    5 capability-demo wave. Vendor claims, unverified. 2026-07-09: Zig creator Andrew Kelley
    published a rebuttal (andrewkelley.me/post/my-thoughts-bun-rust-rewrite.html, HN 48843352)
    arguing the gains were not from the language switch (Zig supported LTO throughout but
    Bun kept it disabled over LLVM bugs that also affect Rust; Zig ships comptime/inline audit
    tooling Bun did not use), that eliminating memory-safety bugs is mainly engineering effort
    not language choice, and disputing the post's fuzzing claim as a fabrication; also flags
    low-quality AI contributions to Zig. One maintainer's assertions, unverified. Covered
    2026-07-09 Reddit and social pulse.
