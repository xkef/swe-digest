- category: Security
  id: f-0036
  last_seen: '2026-08-30'
  notes: >-
    Merged from two follow-ups sharing one watch signal. Pillar Security disclosed 2026-07-20 a sandbox
    escape against agent CLIs (Cursor, Codex, Gemini CLI, Antigravity): deny-default profiles block file
    writes outside the workspace but still allow process execution and reading the Docker Desktop socket,
    so an agent or an injected instruction can curl an Alpine rootfs into the workspace, `docker import`
    it to bypass registry restrictions, run a privileged container, mount the host filesystem over VirtioFS,
    and write to files such as `.zshrc` to reach SSH keys and credentials. Cursor fixed it (GHSA-v4xv-rqh3-w9mc,
    restricted Docker-socket and Launch Services access); Codex marked it informational and configuration-dependent,
    Gemini CLI declined citing documentation. Accomplish AI published 2026-07-23 SharedRoot, a six-step
    escape from the Linux VM that Claude Cowork uses to sandbox agents on macOS: the agent opens an unprivileged
    user namespace for in-namespace capabilities, uses `CAP_NET_ADMIN` to configure a traffic-control
    action referencing `act_pedit`, exploits CVE-2026-46331 (pedit-COW) to poison the page cache of a
    root-owned helper binary, gains guest root when the `coworkd` daemon re-executes it, then reaches
    `/mnt/.virtiofs-root`, the host filesystem mounted read-write into the VM, to read and write host
    files including SSH keys and cloud credentials. Anthropic closed that report as informative because
    the CVE was already public; the researchers state Cowork now defaults to cloud execution, where the
    local path does not appear to apply. Proposed mitigations are design-level: disable unprivileged user
    namespaces, harden seccomp, block autoloading unused modules, narrow the host share. CVE-2026-46331
    is also tracked in the Linux local-root follow-up. Covered 2026-07-23 and 2026-07-25 Top stories (Agentic
    coding, confirmed).
  opened: '2026-08-30'
