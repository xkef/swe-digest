- id: f-0108
  subject: Cursor runs a repository git.exe on Windows without confirmation (unpatched)
  watch_for: >-
    A Cursor patch restricting Git-binary resolution to trusted paths; a CVE assignment; exploitation
    reports; whether the agent auto-clone mass-exploitation path gets demonstrated.
  opened: '2026-07-15'
  last_seen: '2026-07-15'
  closed: '2026-08-30'
  notes:
  - >-
    2026-07-15: Mindgard full-disclosure write-up 2026-07-14 of an unpatched arbitrary code
    execution flaw in Cursor on Windows: on project open Cursor resolves a Git binary across
    several paths including the workspace root, so a malicious `git.exe` in a repo root runs
    with user privileges with no prompt and repeats during editing. Root cause is Windows
    resolving the current directory before system paths. Reported to Cursor 2025-12-15, via
    HackerOne 2026-01-15, delivery confirmed 2026-01-20; still present through 3.2.16 (verified
    2026-04-30), no substantive vendor response, no CVE. HN split: some call it the known
    Windows CWD search-order quirk affecting any IDE calling an unqualified binary, others
    flag agent auto-clone mass-exploitation. Mitigations are OS allow-listing (AppLocker/App
    Control) or disposable VMs. Covered 2026-07-15 Top stories (lead).
