- category: Security
  id: f-0024
  last_seen: '2026-07-23'
  notes: >-
    Pillar Security published 2026-07-20 a sandbox-escape technique against agent CLIs (Cursor, Codex,
    Gemini CLI, Antigravity). Deny-default sandbox profiles block file writes outside the workspace but
    still allow process execution and reading the Docker Desktop socket, so an agent (or injected instruction)
    can curl an Alpine rootfs into the workspace, docker import it to bypass registry restrictions, run
    a --privileged container, mount the host filesystem over VirtioFS, and write to files like .zshrc,
    reaching SSH keys and credentials. Cursor fixed it (GHSA-v4xv-rqh3-w9mc, restricted Docker-socket
    and Launch Services access); Codex marked it informational/configuration-dependent, Gemini CLI declined
    citing documentation. Covered 2026-07-23 Top stories (Agentic coding, confirmed). See [[entities]]
    Cursor and GitHub Copilot.
  opened: '2026-07-23'
  sources:
  - >-
