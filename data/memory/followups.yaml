  notes: >-
    Preliminary PIR (tracking ID ZJV6-SGG) for the 2026-07-23 Azure West US outage. Routine device maintenance
    required isolating specific network paths. Microsoft's process converts a maintenance request into
    system-readable form and verifies at least one of two redundant paths stays healthy, but a bug in
    the conversion step marked additional devices as part of the event and removed a set of IP routes
    from more devices than intended, between a West US datacenter and the WAN. Impact 14:44 to 19:41 UTC,
    limited to traffic entering or leaving the region, intra-region traffic unaffected. Presented first
    as large-scale WAN route churn; correlated to the maintenance change at 17:45 UTC, rollback complete
    and network healthy 18:26 UTC, all services recovered 19:41 UTC. 25+ services named (AKS, Cosmos DB,
    ExpressRoute, Microsoft Graph, Sentinel, and others). Microsoft 365 side tracked as MO1437424, SharePoint
    78% of Downdetector reports. The safety check validated redundancy for the devices in the request
    but not which devices the request named. Outage covered 2026-07-24 Top stories, root cause covered
    2026-07-25 Watchlist follow-ups (confirmed).
  opened: '2026-07-25'
  sources:
