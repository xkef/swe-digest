- category: Security
  id: f-0014
  last_seen: '2026-07-25'
  notes: >-
    Accomplish AI published 2026-07-23 a six-step escape from the Linux VM that Claude Cowork uses to
    sandbox agents on macOS. Chain: agent opens an unprivileged user namespace for in-namespace capabilities,
    uses `CAP_NET_ADMIN` to configure a traffic-control action referencing `act_pedit`, exploits CVE-2026-46331
    (pedit-COW, published June 2026) to poison the page cache of a root-owned helper binary, gains guest
    root when the `coworkd` daemon re-executes it, reaches `/mnt/.virtiofs-root` (the host filesystem
    mounted read-write into the VM), and reads and writes host files outside the connected folder, including
    SSH keys and cloud credentials. Anthropic closed the report as informative because the CVE was already
    public; the researchers state Cowork now defaults to cloud execution where the local path does not
    appear to apply. Proposed mitigations are design-level (disable unprivileged userns, harden seccomp,
    block autoloading unused modules, narrow the host share). Covered 2026-07-25 Top stories (Agentic
    coding, confirmed). Reuses CVE-2026-46331 from the 2026-07-23 RefluXFS/pedit-COW entry. See [[entities]]
    Claude Code.
  opened: '2026-07-25'
  sources:
  - >-
    [Accomplish AI writeup](https://www.accomplish.ai/blog/sharedroot-escaping-claude-cowork-sandbox/)
