- id: f-0008
  subject: Azure publishes a preliminary PIR for the West US route-removal outage
  watch_for: >-
    The final PIR, due within 14 days of 2026-07-23; what changes Microsoft commits to for
    the safety checks and the automated maintenance request conversion; whether the same conversion
    bug is implicated in any later incident.
  opened: '2026-07-25'
  last_seen: '2026-07-25'
  closed: '2026-09-09'
  notes:
  - >-
    2026-07-25: Preliminary PIR (tracking ID ZJV6-SGG) for the 2026-07-23 Azure West US outage.
    Routine device maintenance required isolating specific network paths. Microsoft's process
    converts a maintenance request into system-readable form and verifies at least one of
    two redundant paths stays healthy, but a bug in the conversion step marked additional
    devices as part of the event and removed a set of IP routes from more devices than intended,
    between a West US datacenter and the WAN. Impact 14:44 to 19:41 UTC, limited to traffic
    entering or leaving the region, intra-region traffic unaffected. Presented first as large-scale
    WAN route churn; correlated to the maintenance change at 17:45 UTC, rollback complete
    and network healthy 18:26 UTC, all services recovered 19:41 UTC. 25+ services named (AKS,
    Cosmos DB, ExpressRoute, Microsoft Graph, Sentinel, and others). Microsoft 365 side tracked
    as MO1437424, SharePoint 78% of Downdetector reports. The safety check validated redundancy
    for the devices in the request but not which devices the request named. Outage covered
    2026-07-24 Top stories, root cause covered 2026-07-25 Watchlist follow-ups (confirmed).
- id: f-0009
  subject: Click to Pray IDOR exposed about 719,000 accounts for six months
  watch_for: >-
    A statement from the Pope's Worldwide Prayer Network or the developer La Machi; confirmation
    of how long the endpoint was open and whether the data was harvested; any regulator action
    under GDPR.
  opened: '2026-07-25'
  last_seen: '2026-07-25'
  closed: '2026-08-30'
  notes:
  - >-
    2026-07-25: Researcher BobDaHacker disclosed 2026-07-24 an insecure direct object reference
    in the Click to Pray API: an unauthenticated `GET /user/users/{id}` returned a full user
    record for any numeric id, so incrementing ids enumerated about 719,517 accounts and returned
    email, first and last name, country, date of birth, account role, and deletion state in
    plaintext. Researcher reports mailing nine addresses at the operator and developer on
    2026-01-03 with no reply over six months, and states the endpoint was narrowed to the
    requesting user's own email only after Dark Reading published. Confirmed independently
    by Dark Reading and The Register. Covered 2026-07-25 Security (confirmed).
