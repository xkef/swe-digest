  notes: >-
    Phoronix reported 2026-07-24 that Eric Biggers of Google proposes removing the Qualcomm Crypto Engine
    driver from the kernel tree outright rather than leaving it behind the `BROKEN` Kconfig gate it was
    recently marked with. Numbers quoted from the kernel mailing list thread: `sha256-lib` on ARMv8 Crypto
    Extensions at 0.10s wall clock and 0.10s CPU against `sha256-qce` at 10.76s wall clock and 5.14s CPU,
    of which 0.77s hardirq and 2.31s softirq, so over 100 times slower and over 50 times more CPU. The
    linux-crypto lore archive was unreachable from the run environment (Anubis proof-of-work gate), so
    the thread is cited as quoted by Phoronix. Covered 2026-07-26 Linux and kernel (developing). See [[access-notes]].
