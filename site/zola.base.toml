# site:build writes zola.toml from this file and the site block of
# config.yaml at the repository root.
compile_sass = false
build_search_index = false
# Zola renders Markdown bodies as templates. The generated pages come from
# untrusted text, so none of them is ever templated.
skip_content_templating = ["digests/**", "stories/**", "threads/**"]
generate_feeds = true
feed_filenames = ["feed.xml"]
# No feed_limit: the template filters to digest day pages and caps at 30
# itself; a pre-template limit would truncate to the newest story pages.
minify_html = true

[markdown]
smart_punctuation = false
insert_anchor_links = "none"
