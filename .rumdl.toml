# rumdl owns Markdown; dprint owns everything else (TOML, JSON, YAML, CSS,
# HTML, JS).
#
# Two formatters, on purpose. dprint has a Markdown plugin and it was tried:
# it normalizes inline syntax, which rewrites prose rather than formatting it.
# On this repo's own memory files it turned `~3x next-best` into `~~3x`
# (creating strikethrough) and the X handle `@__alpoge__` into `@**alpoge**`
# inside a link title. Memory and digests are prose dense with markdown-
# significant characters, drawn from untrusted sources, so a normalizing
# formatter corrupts published facts. rumdl lints instead of normalizing,
# which is the property this content needs.
#
# `data/` is excluded whole: it is the tree the bot writes, the code that writes
# it owns the form, and the content gate checks that form byte for byte. A
# formatter touching anything under it is a gate failure, not a tidy-up. The
# generated Zola trees under `site/` are excluded for the same reason.
[global]
respect_gitignore = true
exclude = [
  "data",
  "site/content",
  "site/data",
  "dist",
  "public",
  ".cache",
  ".run",
  ".claude-notes",
]
# MD013 (80 columns) is on: every markdown file rumdl sees is prose a human
# reads in a diff. It lints only — rumdl cannot rewrap — so a long line is
# fixed by hand, and the trees where that would be wrong (generated views,
# published digests) are excluded above rather than exempted by rule.
#
# MD057: the README uses GitHub-relative links (../../issues/new?...) that
# resolve on GitHub but not on the local filesystem.
disable = ["MD057"]
