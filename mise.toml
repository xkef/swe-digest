# The repository runner. `mise tasks` lists everything it does, and each task
# is one file in .config/mise/tasks/.
#
# Every version is exact, because a different Pagefind minor can change the
# index format the site templates expect. CI installs only the tools a job
# needs, through install_args in the workflows.
[tools]
python = "3.14.8"
uv = "0.12.23"
zola = "0.23.6"
"github:Pagefind/pagefind" = "1.5.2"
dprint = "0.60.1"
rumdl = "0.2.78"
vale = "3.24.0"

# Every task runs inside agent/.venv. Locally `mise run deps:setup` fills it from
# uv.lock. In CI `mise run deps:base` or `deps:agent` fills it from the
# hash-pinned requirements.
[env]
_.python.venv = { path = "{{config_root}}/agent/.venv", create = true }
PYTHONPATH = "{{config_root}}/agent/src"
