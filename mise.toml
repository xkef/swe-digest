# The repository runner. `mise tasks` lists everything it does, and each task
# is one file in .config/mise/tasks/.
#
# Every version is exact, because a different Pagefind minor can change the
# index format the site templates expect. CI installs only the tools a job
# needs, through install_args in the workflows.
[tools]
python = "3.15.2"
uv = "0.13.6"
node = "26.13.0"
zola = "0.23.6"
"github:Pagefind/pagefind" = "1.5.2"
dprint = "0.64.3"
rumdl = "v0.3.2"
vale = "3.25.1"

# Every task runs Python through `uv run --no-sync`, which uses agent/.venv
# without putting it on PATH, where a sandboxed agent could plant a binary for
# the host shell. --no-sync keeps what the deps tasks installed. Locally
# `mise run deps:setup` fills agent/.venv from uv.lock. In CI `mise run
# deps:base` or `deps:agent` fills it from the hash-pinned requirements.
[env]
UV_PROJECT = "{{config_root}}/agent"
PYTHONPATH = "{{config_root}}/agent/src"
